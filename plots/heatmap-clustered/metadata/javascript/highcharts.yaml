review:
  strengths:
  - Implements true hierarchical clustering (Ward's method, Euclidean distance) from
    scratch entirely in-browser, correctly reordering both axes to reveal the hidden
    condition/module structure in the deliberately scrambled input data.
  - Hand-draws the heatmap cells and dendrograms via the Highcharts renderer API to
    work around the missing heatmap/dendrogram modules in the core-only bundle, instead
    of returning NOT_FEASIBLE or shelling out to another library — exactly the constraint
    highcharts.md calls for.
  - Correctly uses the imprint_div diverging colormap for the zero-centered z-score
    data, with a properly labeled, theme-adaptive colorbar.
  - Row and column group-annotation color bars (condition / gene module) are deliberately
    chosen away from the diverging heatmap's red/blue endpoints so they're never mistaken
    for data, while brand green still anchors the first group.
  - Preserves genuine (not simulated) hover tooltips via an invisible scatter overlay
    aligned to each cell, recovering real interactivity for the custom-drawn grid.
  - Both renders are clean, theme-correct, and free of any clipping or overlap; careful
    margin math keeps every dendrogram, group bar, and label fully on-canvas.
  weaknesses:
  - Column group-bar (gene module) jumps to palette positions 6-8 instead of continuing
    canonical order from where the row group-bar left off (1,2,4) — a defensible choice
    to avoid clashing with the diverging heatmap's red/blue, but a deviation from
    the style guide's default strict positional order worth a comment.
  - Heavy reliance on helper functions (buildDendrogram, drawAll, valueFill, etc.)
    trades away KISS simplicity, though it's justified by the genuine algorithmic
    complexity of implementing clustering and custom SVG rendering from scratch.
  - Row/column tick labels at 13px sit slightly below the library's own ~14px guidance
    for tick/legend text — still legible at full resolution but marginal at the smallest
    mobile crop.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "Gene Expression Clustering · heatmap-clustered · javascript · highcharts · anyplot.ai" and subtitle render in dark ink, fully readable and comfortably sized (~43% of plot width, well under the 90% overflow threshold). Row labels (Oxid-1..5, Ctrl-1..6, Heat-1..5), rotated gene column labels (IL6, TNF, ... ATF3), row dendrogram (left), column dendrogram (top), row/column group-annotation bars with inline text (Oxid/Ctrl/Heat, M1/M2/M3), and the "Expression (z)" colorbar with 3.1/0.0/-3.1 tick labels are all crisp dark-ink-on-cream text.
      Data: Heatmap cells use the imprint_div diverging colormap (matte red -> near-white -> blue) centered at 0; group-bar strips use brand green (#009E73) for the Control condition and 5 other Imprint hues chosen to stay clear of the heatmap's own red/blue range.
      Legibility verdict: PASS — no overlapping or clipped text found in title, axis labels, dendrogram, group bars, or colorbar; verified via pixel crops of the top, bottom, left, and right canvas edges.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same layout as the light render; title and subtitle switch to light ink (#F0EFE8 / lighter gray) and remain fully readable against the dark background. Row/column labels, dendrogram lines (light gray strokes), group-bar inline text, and colorbar tick labels all flip to light-on-dark with no dark-on-dark failures observed anywhere, including inside the group-bar strips (text color is computed per-swatch luminance).
      Data: Heatmap cell colors are pixel-identical to the light render's data colors (only the near-zero cells shift toward the dark theme-adaptive diverging midpoint, which is expected per the style guide); group-bar hues are unchanged from the light render, preserving category identity across themes.
      Legibility verdict: PASS — confirmed no dark-on-dark or light-on-light failures via the same edge crops used for the light render; brand green remains clearly visible in the row group-bar.
