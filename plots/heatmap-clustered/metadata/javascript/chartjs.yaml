review:
  strengths:
  - 'Both attempt-1 weaknesses are resolved: rows are now genuinely z-score standardized
    before clustering/plotting (matches the colorbar label), and the top-left group
    legend is now a polished elevated panel with aligned swatch/label columns.'
  - Fully hand-rolled hierarchical clustering (average-linkage/UPGMA, Euclidean) and
    dendrogram line-segment generation, producing genuine clustermap-style row/column
    reordering — technically sophisticated given Chart.js has no native heatmap/dendrogram
    type and community matrix plugins are off-limits.
  - Clean plugin architecture (afterDatasetsDraw) layers heatmap cells, gene/sample
    annotation strips, rotated column labels, a diverging colorbar, and the custom
    legend, all correctly positioned with no overlaps or edge clipping.
  - 'Correct Imprint theming: identical categorical/endpoint colors between light/dark
    renders, brand-green first series, theme-correct backgrounds, fully legible chrome
    in both themes.'
  - Deviation from the spec's suggested Ward's-method default is explicitly documented
    in a code comment with a clear rationale.
  weaknesses:
  - At the ~400px thumbnail scale, row/column labels, dendrograms, and legend chips
    remain hard to read given the inherent density of a 12x10 clustered heatmap with
    dual dendrograms — a structural tradeoff of the plot type at small sizes rather
    than a fixable styling issue.
  - Core rendering still relies entirely on a custom canvas plugin rather than native
    Chart.js dataset types (unavoidable given library constraints, but keeps LM-01
    capped).
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white, consistent with #FAF8F1, not pure white and not dark.
      Chrome: bold dark title "heatmap-clustered · javascript · chartjs · anyplot.ai" centered at top; refined top-left legend panel (elevated background, rounded corners, aligned swatch/label columns) for "Gene cluster" (A/B/C) and "Sample group" (Control/Treatment); rotated column labels and horizontal row labels in soft dark ink; colorbar labeled "z-score" with +2.5/0/-2.5 ticks. All confirmed readable; verified no clipping at bottom or right edge via pixel crops.
      Data: 12x10 grid using red<->blue diverging scale (imprint_div), first categorical series #009E73 (brand green) used for gene-cluster annotation; row/column order reflects hierarchical clustering.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black, consistent with #1A1A17, not pure black and not light.
      Chrome: title, legend text, row/column labels, and colorbar labels all render in light ink, clearly visible; legend panel's elevated background is a lighter charcoal than the page for visible separation; dendrogram lines in light gray, legible against dark surface. No dark-on-dark text found anywhere.
      Data: categorical annotation swatches (gene-cluster, sample-group) are identical hex values to the light render. Diverging heatmap cells share the same red/blue endpoint hues as the light render; only near-zero cells shift toward the theme-adaptive midpoint (near-black vs near-white on light), which is the documented correct behavior for imprint_div, not a bug.
      Legibility verdict: PASS
