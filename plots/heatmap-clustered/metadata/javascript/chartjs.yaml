review:
  strengths:
  - Fully hand-rolled hierarchical clustering (average-linkage/UPGMA, Euclidean) and
    dendrogram line-segment generation, producing genuine clustermap-style row/column
    reordering — a technically sophisticated solution given Chart.js has no native
    heatmap/dendrogram type and community matrix plugins are off-limits.
  - Clean plugin architecture (afterDatasetsDraw) layers heatmap cells, gene/sample
    annotation strips, rotated column labels, a diverging colorbar, and a custom group
    legend, all correctly positioned in data-unit coordinate space with no overlaps.
  - 'Correct Imprint theming: identical data colors between light/dark renders via
    imprint_div, first categorical series is brand green (#009E73), theme-correct
    backgrounds (#FAF8F1/#1A1A17), and fully legible chrome in both themes.'
  - Deterministic, seeded (fixed-seed LCG) data generation with a plausible gene-expression
    control-vs-treatment scenario that produces genuinely separable, visually coherent
    clusters.
  - Canvas dimension gate passed; no edge clipping of title, labels, colorbar, or
    legend in either render.
  weaknesses:
  - The colorbar/values are labeled 'z-score' but the underlying matrix is never actually
    standardized (no per-row mean-subtraction / division by std) — it's the raw synthetic
    pattern plus noise. Either compute real per-row z-scores before clustering/plotting,
    or relabel the axis (e.g. 'value') so the label matches what's actually computed.
  - Spec notes 'Ward's method with Euclidean distance is a common default' for clustering;
    the implementation uses average-linkage (UPGMA) instead. Not incorrect, but consider
    aligning with the suggested default or documenting the deviation in a comment.
  - At the ~400px thumbnail scale, row/column labels, dendrograms, and legend chips
    become hard to read given the inherent density of a 12x10 clustered heatmap with
    dual dendrograms — consider nudging font sizes up slightly or simplifying the
    legend for small-scale contexts.
  - The top-left group legend (Gene cluster / Sample group stacked) is functional
    but visually basic (plain colored squares) — a bit more refinement (aligned columns,
    subtle background panel) would match the polish of the rest of the chart.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1-consistent), no pure-white areas.
      Chrome: Bold dark title "heatmap-clustered · javascript · chartjs · anyplot.ai" centered at top, clearly readable. Top-left legend ("Gene cluster": A/B/C in green/purple/blue; "Sample group": Control/Treatment in brown/cyan) in dark text on light background, fully legible. Column dendrogram sits above a brown/cyan sample-group annotation strip; row dendrogram sits left of a green/purple/blue gene-group annotation strip. Rotated (-45°) column labels ("Control 2", "Treatment 5", etc.) and horizontal row labels ("Gene B3", "Gene A1", etc.) render in a soft dark ink, clearly legible against the light background. Colorbar on the right labeled "z-score" with "+2.1 / 0 / -2.1" ticks, all readable.
      Data: 12x10 grid of cells colored on a red-to-blue diverging scale, red = negative z-score, blue = positive, white/near-white near zero. Rows and columns are visibly reordered so that same-colored blocks (gene groups A/B/C, Control/Treatment) cluster together, revealing clear checkerboard-like structure. First categorical series (Gene cluster A) uses the brand green #009E73.
      Legibility verdict: PASS — no light-on-light text found anywhere in the render.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17-consistent), no pure-black flatness.
      Chrome: Title, legend text, row/column labels, and colorbar labels all render in light/white ink, clearly visible against the dark background. Dendrogram lines render in a light gray, clearly visible against the dark background. No dark-on-dark text was observed anywhere (title, tick labels, legend, colorbar ticks, annotation labels all pass).
      Data: Cell colors are identical to the light render — same red/blue diverging mapping, same z-score-to-color assignment, same reordering. Gene-group and sample-group annotation strip colors (green/purple/blue, brown/cyan) are unchanged from the light render — confirming only chrome flipped between themes, as required.
      Legibility verdict: PASS — all chrome elements readable, no dark-on-dark failures.
