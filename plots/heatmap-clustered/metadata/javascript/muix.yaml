review:
  strengths:
  - 'Full clustermap: Ward clustering of genes and samples drives both dendrograms
    and the matrix order, and every dendrogram leaf sits on the centre of its row
    or column of cells'
  - Diverging imprint_div ramp taken from t.div with a symmetric ±3.7 domain and a
    theme-adaptive midpoint, plus a labelled colorbar
  - Pathway and Condition annotation strips line up cell by cell with the matrix and
    are explained by a two-section legend; Pathway hues skip the div poles so they
    never read as data values
  - 'Idiomatic MUI X composition: ChartsContainer with band axes, ChartsXAxis/ChartsYAxis
    for labels, and a custom SVG layer positioned through useXScale/useYScale/useDrawingArea'
  - Realistic gene-expression scenario with nested sub-modules that give the dendrograms
    several distinguishable merge levels
  weaknesses:
  - 'Suggestion: round colorbar ticks (-3, -2, -1, 0, 1, 2, 3) would read faster than
    the derived ±3.7 / ±1.9 values.'
  - 'Suggestion: a thin muted outline on the cells would keep the matrix edges visible
    in the dark render, where near-zero cells match the #1A1A17 midpoint.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, no pure white.
      Chrome: bold dark title "heatmap-clustered · javascript · muix · anyplot.ai" centred at the top, softer subtitle "Ward hierarchical clustering of Log2 fold change (16 Genes × 12 Samples)"; gene labels on the left of the matrix, sample labels rotated -45° below it, legend column (Condition, Pathway) and a vertical colorbar titled "Log2 fold change" with ticks -3.7 … 3.7 on the right. All text dark ink and readable.
      Data: 16×12 matrix of square cells with thin page-colored gaps, red (#AE3030) for negative through cream to blue (#4467A3) for positive. Column dendrogram (dark ink lines) above a Condition strip (Control #009E73, Treated lavender #C475FD) splits Control vs Treated first; row dendrogram on the far left beside a Pathway strip (Fibrosis cyan, Proliferation rose, Inflammatory ochre) splits genes into three pathway blocks. Fibrosis genes turn red and Inflammatory genes blue under treatment; Proliferation is blue in Control-04/05/06. Leaves align with their rows and columns.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17, no pure black.
      Chrome: title, subtitle, gene and sample labels, legend titles and entries, colorbar ticks and title all in light ink; no dark-on-dark text. Dendrogram lines switch to light ink and stay clearly visible.
      Data: annotation strip and legend colors identical to the light render; the diverging ramp keeps the same red and blue poles with a #1A1A17 midpoint, so near-zero cells sit close to the background as the style guide's theme-adaptive midpoint implies, while the treated blocks stand out strongly.
      Legibility verdict: PASS
