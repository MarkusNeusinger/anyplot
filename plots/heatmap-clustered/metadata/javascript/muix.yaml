review:
  strengths:
  - Fully custom overlay (dendrograms, condition strip, heatmap cells) built from
    low-level MUI X hooks (useXScale, useYScale, useZColorScale, useDrawingArea) since
    the community edition has no native heatmap/dendrogram component — a genuinely
    idiomatic use of the community-only surface.
  - 'Deterministic LCG-seeded synthetic gene-expression data with a biologically coherent
    structure: inflammatory / fibrosis / proliferation gene groups crossed with Control/Treated
    samples, matching the stated log2 fold-change comments per cluster.'
  - Correct diverging Imprint colormap (t.div) with a symmetric [-COLOR_DOMAIN, COLOR_DOMAIN]
    domain around zero and a labeled 'Log2 fold change' colorbar legend.
  - Condition annotation strip (Control vs. Treated) uses canonical Imprint palette
    positions 1-2, with a matching swatch legend.
  - Both row and column dendrograms correctly reorder the matrix via hierarchical
    clustering and their branch heights are faithfully rendered.
  - Theme-adaptive chrome (dendrogram strokes, tick labels, legend text) correctly
    threaded via t.ink / t.inkSoft — both light and dark renders are fully legible.
  weaknesses:
  - 'Row-side group annotation is missing: geneClusterOf() already computes the inflammatory/fibrosis/proliferation
    grouping but it is never rendered as a color strip — add a left-hand row annotation
    bar analogous to the existing column Control/Treated strip to fully realize the
    spec''s ''row/column color bars for group annotations'' suggestion.'
  - Clustering uses complete linkage (per the code comment) while the spec names Ward's
    method with Euclidean distance as the common default — consider switching buildTree's
    merge criterion to Ward's minimum-variance linkage (or at least average linkage)
    to align with the spec's stated convention.
  - Y-axis gene tick labels are legible at 13px with the current 16 rows, but there
    is little headroom left — worth re-checking spacing if the matrix ever grows toward
    the spec's stated 100-row upper bound.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1-consistent), not pure white.
      Chrome: Title "heatmap-clustered · javascript · muix · anyplot.ai" in bold dark ink, clearly readable. Column dendrogram (black strokes) sits above a green/lavender Control/Treated annotation strip; row dendrogram (black strokes) sits left of the gene-name tick labels. X-axis sample labels (Control-04 … Treated-06) are rotated -45° and fully legible; y-axis gene labels (COL1A1 … CXCL10) are horizontal and legible. Colorbar on the right is labeled "Log2 fold change" with "3"/"-3" endpoints, plus a Control/Treated swatch legend top-right.
      Data: Heatmap cells are red for fibrosis genes under Treated and for inflammatory genes under Control (negative log2FC), blue for inflammatory/proliferation genes under Treated (positive log2FC) — internally consistent with the diverging imprint_div colormap (red=low, blue=high). First categorical use (Control swatch) is Imprint position 1 (#009E73 green), Treated is position 2 (lavender).
      Legibility verdict: PASS — no light-on-light text observed anywhere.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17-consistent), not pure black.
      Chrome: Same title, axis labels, tick labels, and legend now rendered in light ink (white/near-white) against the dark surface — all clearly legible. Dendrogram strokes flipped from black to white/light, remaining clearly visible against the dark background. Grid/dendrogram lines are not competing with data.
      Data: Colors are pixel-identical to the light render for every cell (same reds/blues in the same positions) — confirms only chrome flipped, not data colors. Green/lavender Control/Treated strip unchanged.
      Legibility verdict: PASS — no dark-on-dark failures; all text and dendrogram lines remain visible against the near-black background.
