review:
  strengths:
  - Ward linkage drives a true reorder of both axes, and the 2x3 block structure (treated
    vs control, three pathways) emerges cleanly
  - Dendrogram leaves, annotation strips and cells share the MUI band scales via useXScale/useYScale/useDrawingArea,
    so everything lines up cell by cell
  - imprint_div built from the t.div tokens with the theme-adaptive midpoint, and
    a matching gradient colorbar with outward ticks
  - Sectioned Condition/Pathway legend with bold titles and a method subtitle give
    a clear typographic hierarchy
  - 'Fully theme-adaptive chrome: dendrogram lines, labels and legend read cleanly
    on both #FAF8F1 and #1A1A17'
  weaknesses:
  - 'DQ-01 (both): within-cluster merges sit in the lowest ~8% of both dendrograms
    (row tree: all pathway-internal joins within ~10 px of the leaves; column tree:
    the six-sample joins at nearly one height), so their merge heights can hardly
    be told apart → give the data sub-structure inside clusters (e.g. two sub-groups
    per pathway or per condition with distinct offsets) so internal merges spread
    over a visible range. Likely cause: GENE_SPECS gives every gene in a pathway identical
    bases, with only ±0.25 gene and ±0.35 cell noise.'
  - 'Suggestion: tooltips on the cells (gene, sample, value) would add value in the
    interactive HTML.'
  - 'Suggestion: placing the pathway strip directly against the matrix (between gene
    labels and cells) would make the row annotation read faster.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, square 2400x2400.
      Chrome: bold title "heatmap-clustered · javascript · muix · anyplot.ai" with a soft-ink subtitle "Ward hierarchical clustering of Log2 fold change (16 Genes × 12 Samples)"; gene labels on the left, sample labels rotated -45° below; Condition/Pathway legend top right; vertical colorbar (-3.0 to 3.0, "Log2 fold change") right. All dark text, readable.
      Data: 16x12 heatmap in imprint_div (red #AE3030 negative, near-page midpoint, blue #4467A3 positive), cells separated by thin page-color gaps. Column dendrogram on top (black lines) splits Treated vs Control; row dendrogram on the left splits Fibrosis / Proliferation / Inflammatory. Condition strip (Control #009E73 green, Treated purple) above, Pathway strip (ochre, cyan, plum) left of the gene labels. Treated fibrosis genes red, treated inflammatory genes deep blue, proliferation light blue throughout.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, subtitle, gene/sample labels, legend and colorbar ticks all in light ink; dendrogram lines light. No dark-on-dark text.
      Data: identical endpoint colors and strip colors to the light render; only the diverging midpoint follows the page color (#1A1A17) per the style guide, so near-zero control cells read as dark tiles. Block structure equally clear.
      Legibility verdict: PASS
