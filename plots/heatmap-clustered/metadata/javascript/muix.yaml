review:
  strengths:
  - Implements Ward's minimum-variance hierarchical clustering entirely from scratch
    (recursive tree build, leaf ordering, dendrogram segment generation) since MUI
    X community has no native heatmap/dendrogram component -- correctly fulfills the
    spec's 'clustermap style' requirement.
  - 'Thoughtful palette assignment: the gene-cluster annotation strip deliberately
    uses Imprint positions 3/5/6 (ochre/cyan/rose), explicitly avoiding the red/blue
    endpoints already used by the diverging heatmap scale and the green/lavender condition
    strip -- a well-reasoned decision documented in a code comment.'
  - 'Clean composition: dendrograms (both axes), condition strip, gene-cluster strip,
    heatmap cells, and legends are all aligned via useDrawingArea/useXScale/useYScale
    hooks in a single custom SVG overlay, with generous whitespace and no visible
    overlaps in either theme.'
  - Deterministic, biologically plausible synthetic data (seeded LCG) shows three
    distinct gene-cluster response patterns (strong up, strong down, mild rise) across
    two conditions -- solid feature coverage for a clustered heatmap.
  - 'Theme adaptation is correct: chrome tokens (t.ink, t.inkSoft) flip between renders
    while the diverging data colors and categorical strip colors stay identical.'
  weaknesses:
  - 'Header block is duplicated: lines 1-4 contain a stale header (''Quality: 88/100
    ... Created: 2026-09-05'') followed on line 5 by the ''//# anyplot-orientation:
    square'' directive, then a SECOND full standard header (lines 6-10, ''Quality:
    pending''). This violates the header contract requiring the orientation directive
    on its own line at the very top of the file. Fix: delete the stale first header
    block entirely so the file starts with the directive line followed by exactly
    one clean header block.'
  - 'Possible colorbar direction mismatch: fibrosis genes (COL1A1, COL3A1, FN1, ACTA2,
    VIM) have a strongly NEGATIVE base log2 fold-change under treatment (CLUSTER_BASE[1][1]
    = -2.2) yet render as dark RED in the Treated columns, while inflammatory genes
    (IL6, TNF, IFNG, IL1B, CXCL10, STAT1) have a strongly POSITIVE base value under
    treatment (CLUSTER_BASE[0][1] = +2.4) yet render as dark BLUE -- consistent with
    cell fill using t.div = [red, mid, blue] as low->high. However the ContinuousColorLegend
    colorbar shows ''3'' next to the RED end and ''-3'' next to the BLUE end, the
    opposite direction from how cells actually encode value. A reader using the colorbar
    to interpret the heatmap would draw the wrong conclusion about which genes are
    up- vs down-regulated. Verify the legend''s gradient/tick direction against the
    actual useZColorScale output and correct whichever side is inverted.'
  - Dark-theme low-magnitude cells (log2FC near 0, e.g. most Control samples in the
    Proliferation rows) use a midpoint color equal to the page background (#1A1A17),
    so those cells nearly disappear into the surrounding canvas in the dark render
    -- the heatmap grid structure reads noticeably weaker there than in the light
    render.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 -- not pure white.
      Chrome: Bold dark title "heatmap-clustered · javascript · muix · anyplot.ai" centered at top, clearly legible. Column dendrogram (black lines) above a two-color condition strip (green=Control, lavender=Treated). Row dendrogram (black lines) to the left of a three-color gene-cluster strip (ochre=Inflammatory, cyan=Fibrosis, rose=Proliferation). Gene name tick labels on the left, sample name tick labels (rotated -45deg) at the bottom, all in dark gray -- all readable. A vertical diverging colorbar on the far right labeled "Log2 fold change" with "3" near the top (red end) and "-3" near the bottom (blue end). A small swatch legend (Control/Treated, Inflammatory/Fibrosis/Proliferation) sits top-right.
      Data: 16 gene rows x 12 sample columns of diverging red-to-blue cells. Fibrosis genes are strongly red under Treated columns; inflammatory genes are strongly blue under Treated columns; Proliferation genes show mild blue tones under Treated. Control columns are mostly pale/near-white. Columns/rows are reordered so the two condition blocks and three gene-cluster blocks are visually contiguous.
      Legibility verdict: PASS.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 -- not pure black.
      Chrome: Title, tick labels, and legend text all render in light gray/off-white and are clearly legible against the dark background -- no dark-on-dark failures observed. Dendrogram lines flip to white/light gray. Condition and gene-cluster strips keep the identical hues from the light render (green, lavender, ochre, cyan, rose).
      Data: Data colors (categorical strip hues and the red/blue diverging heatmap cells) are identical to the light render, confirming positions 1-8 stay theme-invariant. One legibility caveat: several near-zero-value cells in the Proliferation/Control block use a color very close to the dark page background, making those specific cell boundaries harder to distinguish from the surrounding canvas than in the light render (the diverging colormap's theme-adaptive midpoint is, by design, the same hex as the page background).
      Legibility verdict: PASS (with the near-zero-cell visibility caveat noted above; no text is dark-on-dark).
