review:
  strengths:
  - 'Correct clustered-heatmap type: hierarchical dendrograms rendered on both rows
    and columns, with rows/columns visibly reordered to match the clustering result
    (dosage groups cleanly separate into three column clusters, genes group into co-expression
    modules).'
  - Correct Imprint diverging colormap (t.div, interpolateRgbBasis) matching the style
    guide's matte-red / neutral / blue direction, and the data colors are visually
    identical between the light and dark renders — only chrome (background, text,
    dendrogram stroke) flips.
  - 'Clean, well-proportioned layout: generous margins sized explicitly for the dendrogram
    + label + colorbar regions, no text/element overlap and no edge clipping in either
    render.'
  - Deterministic reproducibility via a small seeded LCG + Box-Muller normal sampler,
    needed because the browser has no native seeded RNG.
  - Realistic, neutral data scenario (gene-expression z-scores across control/low-dose/high-dose
    replicate groups) with distinct per-module effect sizes that give the clustering
    something real to recover.
  weaknesses:
  - Spec suggests 'row/column color bars for group annotations' (e.g. a strip showing
    dosage-group membership next to the column dendrogram) — this optional enhancement
    was skipped, so group membership can only be read from the column labels rather
    than at a glance.
  - Clustering and dendrogram layout are reimplemented from scratch (custom average-linkage
    + manual u/v positioning) rather than using d3-hierarchy's d3.cluster()/d3.hierarchy(),
    which the pinned d3 bundle already provides for exactly this layout problem —
    more idiomatic and less code.
  - Uses average-linkage clustering rather than the spec's suggested Ward's-method
    default; not wrong, but a missed opportunity to match the spec's stated common
    convention.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Bold dark title "heatmap-clustered · javascript · d3 · anyplot.ai" centered at top, fully visible with no clipping. Row gene labels (right-aligned, dark-gray "inkSoft") and rotated column dosage-replicate labels (-40°, dark-gray) are both crisp against the light background. Dendrogram lines are a subtle mid-gray, thin and legible. Colorbar on the right has a labeled numeric axis (-3 to 3) and a rotated "Expression (z-score)" title, all dark-gray on off-white.
      Data: 18x12 heatmap cells colored on a red (negative) → neutral → blue (positive) diverging scale. Columns are clearly reordered into 3 clean clusters matching Control / High-Dose / Low-Dose, and rows are grouped into visually distinct co-expression blocks. First column cluster (Control) reads solid red/pink, the Low-Dose cluster inverts to blue for the same gene rows, consistent with the underlying effect-size data.
      Legibility verdict: PASS — all text is clearly readable, no light-on-light issues, no overlap.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Title renders in white/light text, fully legible. Row and column labels render in a light gray ("inkSoft" dark-mode token), clearly visible against the near-black background — no dark-on-dark failures observed. Dendrogram lines are a light gray, still subtle but distinguishable from the background. Colorbar axis ticks and the "Expression (z-score)" label are light-colored and legible.
      Data: Colors are identical to the light render cell-for-cell (same red/blue diverging scale, same cluster groupings and magnitudes) — confirming only chrome flipped between themes, not the data-encoding colors.
      Legibility verdict: PASS — all text readable, no dark-on-dark issues, brand diverging colors read well on the dark surface.
