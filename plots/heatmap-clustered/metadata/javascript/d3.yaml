review:
  strengths:
  - Implements full hierarchical clustering (average-linkage/UPGMA, Euclidean distance)
    from scratch in vanilla D3 — a real engineering feat given JS has no scipy.cluster
    equivalent — and correctly reorders both rows and columns by the clustering result.
  - Both row and column dendrograms are rendered with correct elbow-style links derived
    from actual merge heights, not decorative placeholders.
  - 'Correct colormap choice: imprint_div for zero-centered z-score data, with the
    theme-adaptive midpoint baked into window.ANYPLOT_TOKENS.div — data colors are
    the same underlying scale in both themes.'
  - Colorbar includes a proper d3.axisRight with tick values and a rotated 'Expression
    (z-score)' label with units.
  - Deterministic LCG-seeded PRNG substitutes for the lack of a native seeded RNG
    in the browser, keeping the implementation reproducible.
  - Theme-adaptive chrome (t.ink / t.inkSoft / t.grid) is threaded consistently through
    title, dendrogram strokes, row/column labels, and colorbar axis — both renders
    are legible.
  - Title format exactly matches the mandated 'heatmap-clustered · javascript · d3
    · anyplot.ai' convention.
  weaknesses:
  - Spec suggests (optional) row/column color bars for group annotations to mark cluster/dosage-group
    membership at a glance — not implemented; would strengthen both visual storytelling
    and feature coverage.
  - Design is functionally correct but visually generic — a standard red/blue clustermap
    look. Pushing further on Design Excellence would mean e.g. a subtle highlight
    or annotation calling out the strongest co-expression block, or extra whitespace
    between dendrograms and heatmap.
  - Code relies on several helper functions (lcg, euclideanDistance, averageLinkageCluster,
    assignPositions, collectSegments) rather than a flat top-to-bottom script — justified
    here since D3 has no built-in agglomerative clustering, but still a KISS deviation
    worth noting.
  - Dendrogram stroke-width (1.5px) is a little thin relative to the large 2400px
    canvas and the size of the heatmap cells; bumping to ~2px would give it more visual
    weight.
  - Manual u/v coordinate assignment for dendrogram layout duplicates functionality
    that d3-hierarchy's cluster/tree layout partially offers — using it (even just
    for the leaf-position math) would be a more idiomatic library showcase.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Bold dark title "heatmap-clustered · javascript · d3 · anyplot.ai" centered at top, clearly readable against the light surface. Row labels (Gene-01..Gene-18) in dark gray, right-aligned to the left of the heatmap. Column labels (Control-1..Low-Dose-4) rotated ~-40°, dark gray, below the heatmap. Dendrogram lines (row: left of heatmap, column: above heatmap) rendered as thin dark-gray elbow links. Colorbar on the right with tick labels -3..3 and a rotated "Expression (z-score)" axis label.
      Data: 18x12 grid of cells colored on a red (negative) - near-neutral - blue (positive) diverging scale, matching the Imprint imprint_div colormap. Rows and columns are visibly reordered into contiguous colored blocks (e.g. top rows solid red under Control columns, transitioning to blue under Low-Dose columns), showing genuine cluster structure.
      Legibility verdict: PASS — all text (title, row/column labels, colorbar ticks and label) is clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title text now rendered in light/white, clearly legible. Row and column labels rendered in light gray, fully readable. Dendrogram lines rendered in light gray, clearly visible against the dark background. Colorbar ticks and axis label are light-colored and legible.
      Data: Same 18x12 grid and same underlying diverging scale (red/blue hues at the same data values) as the light render — only the chrome (background, text, dendrogram strokes, colorbar frame) flipped to the dark-theme tokens. The theme-adaptive midpoint of imprint_div (near-black vs. near-white) is the only reason the blended mid-range cells look moderately different in tone between the two renders, which is expected/spec-compliant behavior, not a chrome/data-color violation.
      Legibility verdict: PASS — no dark-on-dark text found; all title, tick, row/column label, and colorbar text is clearly visible against the near-black surface.
