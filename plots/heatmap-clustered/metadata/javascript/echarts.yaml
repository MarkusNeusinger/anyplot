review:
  strengths:
  - Implements a genuine Ward's-method hierarchical clustering algorithm from scratch
    (no scipy available in-browser) and reorders both rows and columns by the resulting
    leaf order — this is the actual differentiator of this spec, not a cosmetic reordering.
  - 'Correct statistical prep: each metric column is z-scored across customers before
    clustering, so the matrix is properly centered on zero and the diverging colormap''s
    midpoint carries real meaning.'
  - 'Custom ECharts `series: ''custom''` render items draw accurate dendrogram brackets
    on both the column (top) and row (left) edges, geometrically consistent with the
    heatmap''s cell order — a distinctive, non-trivial use of ECharts'' extensibility
    since ECharts has no native dendrogram type.'
  - Correct Imprint diverging colormap (`t.div`) for the zero-centered data, with
    theme-adaptive chrome (ink/inkSoft tokens) applied consistently to title, axis
    labels, dendrogram strokes, and colorbar text in both renders.
  - Deterministic, seeded data generation (fixed-seed LCG + Box-Muller) built from
    4 realistic, distinguishable customer segments, giving the clustering genuine
    structure to recover — this shows up clearly as four visually separable blocks
    in the reordered heatmap.
  - Title fontsize is computed with the mandated scaling formula, and layout (grid
    arrays for heatmap + both dendrogram panels) is well-balanced with no overlap
    or clipping in either theme.
  weaknesses:
  - 'Row/column color bars for group annotations (spec: ''Consider adding row/column
    color bars for group annotations'') are not implemented — a nice-to-have that
    would make the 4 latent segments even more explicit alongside the dendrogram.'
  - The colorbar only labels the two extremes (+2.2σ / -2.2σ) with no zero/midpoint
    tick — a center label would help readers anchor the diverging scale faster.
  - Considerable custom algorithmic code (LCG RNG, Box-Muller, Ward linkage, two render-item
    functions) departs from the KISS ideal of 'Imports → Data → Plot → Save' — justified
    here by the lack of a browser-side clustering library, but it's real code-review
    surface area versus a typical implementation.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "heatmap-clustered · javascript · echarts · anyplot.ai" and subtitle in dark ink, clearly legible; column dendrogram at top and row dendrogram at left drawn in a soft dark gray, easily distinguishable from the cream background; x-axis metric labels (rotated 45°) and y-axis "Customer N" labels (right side) both in dark ink, fully readable with no overlap; colorbar labels "+2.2σ" / "-2.2σ" legible.
      Data: 24×10 heatmap cells colored on a red↔white↔blue diverging scale (Imprint imprint_div), matching the zero-centered z-scored data. Four visually distinct row blocks are apparent after reordering, corresponding to the four latent customer segments.
      Legibility verdict: PASS — no light-on-light or unreadable text anywhere in this render.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Title, subtitle, dendrogram strokes, axis tick labels, and colorbar text all rendered in light ink/inkSoft tones, clearly visible against the dark background — no dark-on-dark failures observed anywhere (title, axis labels, tick labels, and colorbar text all confirmed legible).
      Data: The heatmap cell colors are visually identical to the light render (same red↔white↔blue diverging scale) — only the chrome (background, text, dendrogram stroke color) flipped for the theme, as required.
      Legibility verdict: PASS — all text and dendrogram lines remain fully readable against the dark surface.
