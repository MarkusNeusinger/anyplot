review:
  strengths:
  - Implements a genuine ASTM-style four-point rainflow counting algorithm over a
    synthetic variable-amplitude load signal instead of faking a plausible-looking
    matrix distribution — the binned counts are real algorithm output.
  - 'Clever core-bundle workaround: since no heatmap/colorAxis module is loaded, the
    matrix is drawn cell-by-cell with chart.renderer primitives, then an invisible
    matched-axis scatter series is overlaid so the chart still exposes a real native
    Highcharts tooltip on hover.'
  - 'Explicit ''Peak: 118 cycles'' callout with a collision-aware label placement
    (searches for a clear neighborhood before placing the label) sharpens the visual
    story and draws the eye to the fatigue-critical cluster.'
  - 'Full theme adaptation: Imprint palette (imprint_seq) is identical between light
    and dark renders, chrome (title, ticks, grid, peak-outline stroke) correctly flips
    via ANYPLOT_TOKENS, and zero-count bins render transparent per the spec''s requirement.'
  - Well-constructed log-scale sequential colorbar with sensible tick placement (powers
    of ten plus the exact max) rather than a fixed linear scale, appropriate given
    the strongly skewed cycle-count distribution.
  weaknesses:
  - Colorbar tick labels for counts 100 and 118 sit close together near the top of
    the bar (max is close to a power of ten) — slightly cramped; consider dropping
    the 100 tick when it lands within ~1 segment of the max tick.
  - 'CQ-01 KISS structure: relies on more helper functions than a typical scored plot
    (turningPoints, rainflowCycles, binIndex, countFill, drawAll, clearDrawn) — justified
    by the genuine rainflow algorithm and hand-drawn heatmap workaround, but still
    heavier than the baseline heuristic rewards.'
  - DE-02 visual refinement is solid but not maximal — e.g. the peak-highlight outline
    and callout line use a flat single weight throughout; a touch more hierarchy (e.g.
    thinner callout line vs. thicker cell outline) would read even more polished.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (~#FAF8F1), not pure white, not dark.
      Chrome: Title "Suspension-Strut Rainflow Matrix · heatmap-rainflow · javascript · highcharts · anyplot.ai" in bold dark ink, comfortably filling the width without clipping. Subtitle in muted gray-brown gives cycle count and bin count context. Y-axis "Cycle amplitude, half-range (kN)" rotated and legible on the left; X-axis "Cycle mean load (kN)" legible below rotated tick labels. Tick labels (amplitude on the left, mean rotated -40° on the bottom) are dark/soft-ink and clearly readable against the light background.
      Data: 20x20 binned matrix, cells colored on a green (#009E73) to blue (~#4467A3) sequential log scale — first/low-count color is brand green as required. A dense fully-populated bottom row (near-zero amplitude, high counts, deep blue) sits below a sparser vertical band of larger-amplitude cycles (green, low count) around mean ≈10-15 kN. Zero-count bins are transparent (background shows through), giving them visual distinction from populated bins. The peak cell (118 cycles) is outlined in dark ink with a callout line and "Peak: 118 cycles" label placed in clear whitespace, no overlap with any data or other text. Colorbar on the right uses the same green→blue scale with log-spaced tick labels (118, 100, 10, 1.0) plus a separate "0 cycles" swatch.
      Legibility verdict: PASS — all text (title, subtitle, axis titles, tick labels, peak annotation, colorbar labels) is clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black (~#1A1A17), not pure black, not light.
      Chrome: Title and subtitle correctly flip to white/light-gray ink. Axis titles and tick labels flip to light ink, remaining fully legible against the dark background. Grid gaps between cells (achieved via 1px inset rects rather than an explicit stroke) render as subtle dark separators consistent with the theme.
      Data: The data fill colors (green-to-blue sequential scale) are pixel-identical to the light render — only chrome (background, text, peak-outline/callout stroke, which switches from dark ink to light ink) has flipped, confirming correct theme-adaptive chrome vs. fixed data-color behavior. The peak cell outline and callout line switch to a light stroke so they remain visible against the near-black background; the "Peak: 118 cycles" label is rendered in light text, fully legible.
      Legibility verdict: PASS — no dark-on-dark failures observed; all title/axis/tick/annotation/colorbar text is clearly visible against the near-black background, and the brand green data color remains distinguishable on both surfaces.
