review:
  strengths:
  - Genuine rainflow-counting algorithm (turning-point extraction + 4-point ASTM-style
    cycle counting) — the matrix is real computed output, not a hand-drawn distribution
  - Clever invisible matched-scatter overlay restores real Highcharts hover tooltips
    over the hand-drawn grid, preserving genuine interactivity instead of faking it
  - Correct imprint_seq log-scale colorbar with an explicit "0 cycles" swatch that
    makes zero-count bins visually distinct, per spec
  - 'Both renders are fully theme-correct: identical data colors, legible chrome in
    light and dark, no dark-on-dark/light-on-light failures'
  - Descriptive axis labels with units and correctly formatted title
  weaknesses:
  - 'CQ-01: several small helper functions (hexToRgb, lerp, countRgb, countFill) could
    be inlined or consolidated to bring the code closer to a KISS structure'
  - 'LM-01: the heatmap surface bypasses Highcharts'' series API entirely, drawn via
    chart.renderer primitives instead of a Highcharts series — understandable given
    the missing heatmap module, but not idiomatic high-level usage'
  - 'DE-03: add a small explicit callout (annotation or highlighted marker) on the
    dominant high-count cluster to sharpen the story for the viewer, rather than relying
    solely on implicit color/spatial pattern'
  - 'DE-02: tighten the visual gap between the colorbar and the "0 cycles" legend
    swatch so the two read as one connected legend group'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: title "Suspension-Strut Rainflow Matrix · heatmap-rainflow · javascript · highcharts · anyplot.ai" in bold dark ink; subtitle in softer ink; y-axis "Cycle amplitude, half-range (kN)" ticks 0.0-23.3; x-axis "Cycle mean load (kN)" rotated -40deg ticks -9.5-31.7; colorbar "Cycle count (log scale)" with ticks 118/100/10/1.0 and a "0 cycles" swatch. All readable.
      Data: 20x20 hand-drawn heatmap grid, imprint_seq gradient (brand green #009E73 at low counts -> blue #4467A3 at high counts), zero-count cells transparent with faint grid outline (visually distinct). Dense saturated-blue band along near-zero-amplitude row; scattered green cells at higher amplitude forming a narrow vertical cluster.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: same title/subtitle/axis titles/tick labels/colorbar labels, all flipped to light-colored text (ink/inkSoft tokens), fully legible against the dark background. No dark-on-dark failures observed.
      Data: identical cell colors to the light render (green->blue imprint_seq gradient unchanged), zero-count cells now show the dark background through their transparent fill, bordered by the same faint grid stroke, still visually distinct.
      Legibility verdict: PASS
