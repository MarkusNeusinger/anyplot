review:
  strengths:
  - 'Correct spec mapping: amplitude on Y, mean on X, colorbar labeled "Cycle count",
    zero-count bins rendered in the page background color so they read as visually
    distinct from populated bins in both themes'
  - Uses a sqrt color-position transform (d3.scaleSqrt over count domain) so low-count
    bins are not all crushed to the same flat green — the legend axis uses the identical
    sqrt scale so tick positions line up exactly with the displayed color, a technically
    careful D3-specific synchronization
  - 'Data has a realistic "teardrop" rainflow envelope: dense small-amplitude cycles
    clustering near zero mean stress, tapering to sparse large-amplitude cycles —
    matches how real variable-amplitude fatigue load spectra look'
  - Imprint sequential palette (t.seq, brand-green → blue) used correctly for this
    single-polarity continuous variable; identical data colors between light/dark
    renders, only chrome (background, text, grid) flips
  - 'Clean idiomatic D3: scaleLinear/scaleSqrt, axisBottom/axisLeft with theme-token
    styling, single data-join with .join("rect"), custom linearGradient for the colorbar
    — no manual DOM hacks'
  - All font sizes explicitly set (26px title, 16px axis labels, 14-15px ticks/legend
    text), title format exactly matches the mandated `{spec-id} · {language} · {library}
    · anyplot.ai` pattern
  weaknesses:
  - 'Design Excellence still reads as a well-configured default rather than a genuinely
    elevated design: consider annotating or subtly emphasizing the dominant/peak cycle-count
    cell cluster (ties directly to the spec''s "identifying dominant cycle combinations"
    application) to give the chart a clearer focal point beyond raw color intensity'
  - The uniform 0.5px stroke on every one of the 400 cells plus the full four-sided
    outer frame reads slightly busy at this resolution — consider lightening/removing
    the per-cell stroke (or dropping its opacity further) and keeping only the outer
    frame, for a cleaner, more refined heatmap grid
  - Tick label size (14px) is on the smaller side for a 2400x2400 canvas with only
    ~6 ticks per axis — a modest bump (e.g. 15-16px) would improve legibility when
    the image is scaled down to mobile widths without causing overlap
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "heatmap-rainflow · javascript · d3 · anyplot.ai" in bold dark ink, centered top. X-axis label "Mean Stress (MPa)" and Y-axis label "Stress Amplitude (MPa)" both dark and clearly legible. Tick labels (-150..150, 0..300) in a softer dark gray, all readable. A thin outer frame encloses the 20x20 cell grid; each cell has a subtle light-gray stroke. Colorbar on the right labeled "Cycle count" with tick values 0-200+, ticks and label legible.
      Data: Cells range from pale green (low count) through teal to blue (high count), forming a teardrop-shaped envelope — dense blue cluster near mean≈0 / low amplitude, tapering to sparse green cells at high amplitude / large |mean|. Zero-count bins show the same off-white background, correctly distinct from any populated cell. First (only) data series correctly uses the Imprint sequential ramp (green→blue), not a categorical color.
      Legibility verdict: PASS — no text is unreadable against the light background.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Title, axis labels rendered in light/off-white ink, clearly visible against the dark surface. Tick labels in a softer light-gray, all legible — no dark-on-dark failures observed. Cell strokes and outer frame use a light, low-opacity tone appropriate for the dark surface. Colorbar and "Cycle count" label are legible in light text.
      Data: Same green→blue sequential ramp as the light render — colors are pixel-identical to the light version, confirming only chrome (background/text/grid) flipped, not data colors. Zero-count bins render in the same near-black background, correctly distinct from populated cells (dark background vs. green/blue fill).
      Legibility verdict: PASS — no dark-on-dark or unreadable text detected in either theme.
