review:
  strengths:
  - Dominant-cluster callout (circle + leader line + label) gives the matrix an explicit
    focal point, directly supporting the spec's 'identifying dominant cycle combinations'
    fatigue-analysis use case
  - Sequential Imprint color mapping uses the same sqrt transform for both cell fill
    and colorbar legend, so legend ticks land exactly on the pixel color they represent
  - 'Clean, idiomatic D3: proper scaleLinear/scaleSqrt usage, single svg mount, deterministic
    LCG + Box-Muller synthetic data generation matching the mount-node contract'
  - Both light and dark renders are theme-correct with identical data colors and only
    chrome (background, text, grid, frame) flipping between themes
  weaknesses:
  - Count-to-color mapping uses a sqrt transform; the spec suggests log or linear
    specifically — sqrt is a reasonable perceptual compromise but slightly deviates
    from the letter of the spec
  - A few isolated single-bin spikes near the top of the teardrop envelope (e.g. around
    amplitude 210-225 MPa) break the otherwise smooth taper — increasing cycleCount
    or lightly smoothing the matrix would read cleaner
  - Library Mastery is solid but generic (scaleLinear/scaleSqrt/axisBottom/axisLeft);
    no distinctive D3 module (e.g. d3-contour, d3-interpolate color spaces beyond
    the required Imprint stops) is showcased beyond what's required
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "heatmap-rainflow · javascript · d3 · anyplot.ai" is bold dark text, clearly legible. X-axis label "Mean Stress (MPa)" and Y-axis label "Stress Amplitude (MPa)" are dark and readable. Tick labels (-150 to 150 on x, 0 to 300 on y) are soft dark gray, legible against the light background. The "Dominant cluster · 242 cycles" annotation is dark bold text, fully readable, with a thin leader line and open circle marking the peak bin.
      Data: A teardrop-shaped 20x20 binned matrix centered near mean=0, tapering from wide/dense at low amplitude to narrow/sparse at high amplitude. Colors run from Imprint green (#009E73-ish, low counts near the edges) through teal to a darker blue (highest counts near the base/center) — a continuous sequential ramp, no viridis/turbo/rainbow. Zero-count bins outside the teardrop are left as page background (blend into the light surface), matching the spec's "zero-count bins should be visually distinct" guidance. A vertical colorbar on the right labeled "Cycle count" shows the same green-to-blue ramp with numeric ticks (0-200+).
      Legibility verdict: PASS — all text is clearly readable against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Title, axis labels, and tick labels have all flipped to light/soft-white text, clearly legible against the dark background. The "Dominant cluster · 242 cycles" annotation and its leader line/circle are rendered in light ink, fully readable. Zero-count bins blend into the near-black background, same visual language as the light render.
      Data: The teardrop matrix shape, bin boundaries, and color values are pixel-for-pixel identical to the light render — same green-to-blue Imprint sequential ramp, same "Dominant cluster · 242 cycles" peak bin and count. Only chrome (background, text, grid/frame strokes) has flipped; data colors did not change.
      Legibility verdict: PASS — no dark-on-dark failures observed; all text and the colorbar remain fully legible against the near-black surface.
