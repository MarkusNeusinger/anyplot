review:
  strengths:
  - Implements the actual ASTM E1049 four-point rainflow counting algorithm on synthetic
    turbine-blade turning points, rather than faking a matrix — a genuinely correct
    engineering computation.
  - 'Faithful to spec Notes: amplitude on Y-axis, mean on X-axis, logarithmic sequential
    colorbar, and zero-count bins left unpainted so they blend into the theme background
    exactly as requested.'
  - Clever native Chart.js solution to the library's missing heatmap/matrix type —
    a scatter chart supplies scaled category axes while a custom afterDraw plugin
    paints cells and colorbar, with no external plugin dependency (respects the library's
    no-workaround rule).
  - Theme tokens threaded correctly through every chrome element; Imprint sequential
    data colors (green to blue) are pixel-identical between light and dark renders;
    canvas is exactly 2400x2400 per the square orientation directive with no edge
    clipping on title, axis labels, or colorbar.
  - Deterministic seeded LCG produces a plausible turbine blade root bending-moment
    load history with periodic components and gust events.
  weaknesses:
  - Y-axis amplitude values increase downward (3 at top, 96 at bottom) — the more
    conventional cartesian reading direction (low-to-high increasing upward) would
    let viewers scan upward for high-severity cycles more intuitively; consider reversing
    the category order or setting the y scale to reverse:false with ascending labels.
  - 'Design Excellence is functional but plain: a flat grid of colored squares plus
    a gradient colorbar, with no additional visual refinement (e.g. subtle max-cell
    emphasis, refined cell separation) beyond removing spines and grid.'
  - Colorbar tick labels (73/17/3/0) and the rotated axis title are fairly small at
    the 400px mobile thumbnail size — still legible but close to the comfortable minimum;
    a slightly larger font would add safety margin.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "Turbine Blade Load Spectrum · heatmap-rainflow · javascript · chartjs · anyplot.ai" in bold dark ink at top, clearly visible. X-axis title "Cycle Mean (MPa)" and Y-axis title "Cycle Amplitude (MPa)" in dark ink, both readable. Tick labels (mean: -88..80, amplitude: 3..96) in softer gray-ink, legible. Colorbar on the right with a green-to-blue vertical gradient, labeled "Cycle Count (log scale)" (rotated) plus tick values 0/3/17/73, all readable. No grid lines; cell borders are drawn in the page background color so cells appear separated by thin cream gaps.
      Data: Heatmap cells form a triangular/pyramid pattern — wide band of blue-to-teal cells across nearly the full mean range at low amplitude (top rows), tapering to a narrow cluster of green cells near mean≈0 at the highest amplitude (bottom rows). Zero-count bins are unpainted and blend into the cream background, matching the spec's "visually distinct empty bins" requirement. Data colors read as the Imprint sequential ramp (brand green → blue).
      Legibility verdict: PASS — all text is clearly readable against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Same title, axis titles, and tick labels now rendered in light ink/off-white and readable against the dark background. Colorbar gradient and its tick labels/title are rendered in light text, clearly legible. Cell borders are drawn in the dark page-background color, so cells appear separated by thin near-black gaps (correct — the same technique as light, just flipped).
      Data: Identical cell layout and identical Imprint sequential colors (green → blue) as the light render — only the chrome (background, text, cell-separator lines) flipped, exactly per the theme-adaptive contract. Zero-count bins blend into the near-black background.
      Legibility verdict: PASS — no dark-on-dark failures; all title, axis, tick, and colorbar text is clearly visible against the near-black surface.
