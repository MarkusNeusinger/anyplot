review:
  strengths:
  - Elegant custom Chart.js plugin implements a true heatmap matrix (scatter chart
    + afterDraw hook) since Chart.js has no native heatmap type -- a legitimate workaround
    built entirely within the library's own plugin system, not a shell-out to another
    library.
  - Correct rainflow counting algorithm (ASTM E1049 four-point stack method) applied
    to a physically plausible turbine blade load history, producing an authentic triangular-shaped
    rainflow matrix.
  - Sequential Imprint colormap (imprint_seq, log-scaled) correctly applied to continuous
    single-polarity count data; data colors are pixel-identical between light and
    dark renders.
  - Peak-cell highlight adds a clear visual focal point without cluttering the chart.
  - Custom-drawn colorbar with clean gradient, tick labels, and rotated axis title
    is a nice piece of polish.
  - Rounded, evenly-spaced heatmap cells with theme-adaptive strokes; zero-count bins
    blend into the page background per the spec's 'visually distinct' requirement.
  weaknesses:
  - The upper portion of the matrix (high-amplitude bins) is sparsely populated, leaving
    a visually empty region above the main cluster in both renders -- inherent to
    the data but worth considering whether a denser/log-binned dataset would balance
    canvas usage better.
  - Code comment labels the peak (most-populated) cell as 'the dominant fatigue-damage
    contributor' -- domain overreach, since Miner's-rule cumulative damage is dominated
    by amplitude^m, not raw cycle count, so a low-amplitude/high-count cell is rarely
    the true top damage contributor. Rephrase the comment or drive the highlight from
    an estimated-damage metric (e.g. amplitude^m x count) instead of raw count.
  - Axis units are labeled 'MPa' (stress) while the data/comments describe a raw 'bending-moment'
    signal -- minor unit/domain mismatch. Either convert to true bending-moment units
    (e.g. kN*m) or adjust the comment to describe stress directly.
  - Several small math helper functions (hexToRgb, lerp, sequentialRgb, rgbToCss)
    add structural complexity beyond the KISS ideal, though reasonably justified by
    the custom-heatmap-plugin requirement.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 -- not pure white.
      Chrome: Title "Turbine Blade Load Spectrum · heatmap-rainflow · javascript · chartjs · anyplot.ai" in bold dark ink at top-left, comfortably within canvas bounds. X-axis title "Cycle Mean (MPa)" and Y-axis title "Cycle Amplitude (MPa)" in dark ink. Tick labels (mean: -88..80, amplitude: 3..96) in a softer dark gray, evenly spaced, no overlap. Colorbar on the right labeled "Cycle Count (log scale)" (rotated) with tick values 0, 3, 17, 73.
      Data: 20x20 grid of rounded cells forming a triangular/wedge-shaped rainflow matrix -- dense, blue-leaning cells across the bottom two rows (low amplitude, high count), thinning to sparse green cells at higher amplitude, plus an isolated small cluster near amplitude ~85-99 / mean ~0-10 (gust-driven cycles). Zero-count bins are unpainted and blend into the page background, matching the spec's requirement. The single most-populated cell (bottom row, mean ≈ -32) is outlined with a dark stroke as a focal highlight. Colors run from brand green (#009E73, low count) to blue (#4467A3, high count) -- the Imprint imprint_seq sequential colormap.
      Legibility verdict: PASS -- all title, axis, and tick text is clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 -- not pure black.
      Chrome: Same title, axis titles, and tick labels now rendered in light ink/soft-light gray, clearly legible against the dark background. Colorbar and its tick/axis labels are also light-colored and readable. The peak-cell highlight stroke switches to a light/white outline (theme-adaptive), still clearly visible.
      Data: Identical cell layout and color values to the light render -- same green-to-blue imprint_seq gradient, same triangular density pattern, same gust cluster near high amplitude. Confirms data colors are unchanged between themes; only chrome flipped.
      Legibility verdict: PASS -- no dark-on-dark text; all title/axis/tick/colorbar text is clearly visible against the near-black surface.
