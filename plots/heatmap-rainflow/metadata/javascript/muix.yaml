review:
  strengths:
  - Implements genuine ASTM E1049 three-point rainflow counting from a synthetic wind-turbine
    load signal (turning-point extraction + stack collapse), not a canned matrix —
    the data is a faithful worked example of the spec's domain
  - Correctly works around the community-tier @mui/x-charts limitation (no native
    Heatmap) by driving a ScatterChart with a custom `slots.scatter` rect renderer
    sized from the underlying linear scales — produces a true tiled grid instead of
    circular bubbles
  - Log1p color scale with domain anchored on the true rendered minimum (not log1p(0))
    correctly handles the heavily right-skewed cycle-count distribution described
    in the spec
  - Dominant/peak bin is outlined, directly answering the spec's 'identifying dominant
    cycle combinations' use case with a clear visual focal point
  - Zero-count bins are simply never drawn (transparent), exactly matching the spec's
    'visually distinct zero-count bins' requirement
  - imprint_seq (green → blue) used correctly for the continuous count scale, identical
    data colors across both themes, both renders fully theme-correct with no clipping
    at any canvas edge
  - Axis labels are descriptive with physical units (kN·m) on both axes, and font
    sizes are explicitly set throughout (title/axis/tick/legend)
  weaknesses:
  - The ContinuousColorLegend shows only the numeric extremes ('61' / '1') with no
    caption identifying what they measure (cycle count) — a viewer isolated from the
    surrounding page context has to infer the unit from the title/axis alone
  - Title fontSize (26px) renders at only ~37% of canvas width, notably below the
    ~70-85% this exact mandated title string typically fills at the style-guide default
    size elsewhere in the catalog — not a legibility problem, but slightly under-weighted
    relative to the chart below it
  - 'LM-02: the peak-highlighting technique and slot-based cell renderer are good
    uses of muix''s customization surface, but a distinctive feature specific to this
    domain (e.g. a small readout of the peak bin''s exact count, or log-scale tick
    labels on the legend) is not yet exploited'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Bold dark title "heatmap-rainflow · javascript · muix · anyplot.ai" centered at top, clearly readable. X-axis label "Cycle mean, blade-root flapwise moment (kN·m)" and rotated Y-axis label "Cycle amplitude, half-range (kN·m)" both dark ink, fully readable, comfortably clear of the canvas edges (checked via pixel crop). Tick labels on both axes (dark grey) legible and evenly spaced, no overlap.
      Data: An irregular grid of rectangular cells forming a rainflow amplitude-vs-mean matrix. Cells range from bright green (low cycle counts, near 1) through teal to dark blue (high cycle counts, up to 61) — a continuous sequential ramp, not a categorical palette. The single highest-count cell (near mean≈600 kN·m, amplitude≈0-25 kN·m) is outlined in black to mark it as the dominant cycle combination. A vertical color legend on the right shows the green→blue ramp labeled "1" to "61". Zero-count bins are simply absent (background shows through), matching the spec's requirement for visually distinct empty bins.
      Legibility verdict: PASS — all text (title, axis labels, ticks, legend numbers) is clearly dark-on-light and readable; no overlaps or clipped elements found in edge crops (top/bottom/left/right all checked).

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title, now rendered in light/white text, fully readable against the dark background. Axis labels and tick labels also light-colored and legible; no dark-on-dark text found anywhere (title, axes, ticks, legend numbers "61"/"1" all confirmed light-colored via pixel crop of the legend region).
      Data: Identical green→blue cell colors and identical matrix layout to the light render — only the chrome (background, text, peak-cell outline color, which switches to white) adapts to the theme. Peak bin still clearly outlined for the same focal-point emphasis.
      Legibility verdict: PASS — confirmed no dark-on-dark failures; all chrome elements flip appropriately while data colors stay identical between themes.
