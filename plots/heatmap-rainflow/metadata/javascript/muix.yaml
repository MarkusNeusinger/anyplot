review:
  strengths:
  - 'Composes the matrix from community MUI X primitives: ChartsDataProvider with
    linear x/y axes and a continuous zAxis colorMap, cells drawn through useXScale/useYScale/useZColorScale,
    and a ContinuousColorLegend whose min/max labels are mapped back from log space
    to counts'
  - Every bin is a filled cell at its mean ± half a bin width and amplitude ± half
    a bin width; empty bins stay unfilled with a faint grid outline, so a 1-cycle
    bin (brand green) is never mistaken for an empty one in either theme
  - Log colour scale on the Imprint sequential ramp (t.seq) with a colour-bar title
    that names the count and the scale; frequent low-amplitude bins read blue, rare
    bins green
  - Real three-point rainflow counting (ASTM E1049, residual half-cycles weighted
    0.5) on a deterministic LCG-seeded wind-turbine blade-root moment signal, binned
    20 × 20 — the counts fall out of the computation
  - Subtitle states total cycles, bin grid and the empty-bin convention, and the peak
    bin (61 cycles) is outlined in ink, giving the reader an entry point without covering
    data
  - Theme tokens threaded through all chrome (ink, inkSoft, grid, pageBg); data colours
    identical in both renders
  weaknesses:
  - 'Suggestion: the colour bar labels only its endpoints (1 and 61); one or two intermediate
    log ticks (e.g. 5, 20) would let a reader map the mid-ramp teal cells to counts.'
  - 'Suggestion: the 170 px legend column leaves a wide empty band on the right; a
    slightly narrower column would give the matrix more width.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole canvas.
      Chrome: bold dark title "heatmap-rainflow · javascript · muix · anyplot.ai" centred at the top (~31 % of the width) with a grey subtitle "1,075 counted cycles in 20 × 20 bins · empty bins left unfilled · outlined: peak bin, 61 cycles". Y axis "Cycle amplitude, half-range (kN·m)" with ticks 50–500; x axis "Cycle mean, blade-root flapwise moment (kN·m)" with ticks 200–1,050. Colour bar on the right titled "Cycle count (log scale)", labelled 1 (bottom) and 61 (top). All text dark and readable.
      Data: a 20 × 20 grid of cells separated by 2 px gaps; empty bins are unfilled with faint grid-colour outlines. Counted bins run from brand green #009E73 (1 cycle) through teal to blue (61 cycles). Dense blue rows at the lowest amplitudes across means 200–1,050, a second band at amplitudes ~150–250 for means 350–900, and a few isolated green cells at amplitudes 375–500 near mean 600–700. The peak bin (lowest amplitude, mean 600) carries a 3 px dark outline.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, subtitle, axis titles, tick labels and colour-bar text all flip to light ink and read clearly; empty-bin outlines are subtle dark-grey and still visible; no dark-on-dark text.
      Data: cell colours identical to the light render (green → teal → blue); the peak-bin outline flips to light ink. Brand green low-count cells remain clearly visible and distinct from the unfilled empty bins.
      Legibility verdict: PASS
