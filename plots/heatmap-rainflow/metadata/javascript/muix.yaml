review:
  strengths:
  - 'Genuinely inventive heatmap workaround: community @mui/x-charts has no native
    Heatmap component, so the implementation drives a ScatterChart with a custom `slots.scatter`
    rect renderer sized from the underlying linear scales, reproducing a true tiled
    matrix grid instead of circular bubbles'
  - Zero-count bins are simply never added to matrixPoints, so they render as fully
    transparent (page background shows through) instead of a misleading colored-zero
    cell -- matches the spec's 'zero-count bins should be visually distinct' requirement
    precisely
  - 'Correct polarity choice for the continuous colormap: cycle count is single-polarity
    data, so imprint_seq (t.seq[0] -> t.seq[1]) is the right pick over imprint_div'
  - Log1p transform on cycle count is a deliberate, spec-aligned data-storytelling
    choice -- rainflow matrices are heavily right-skewed, and the log scale makes
    the dominant high-density band visually readable instead of a single hot pixel
    on a sea of near-zero cells
  - Real, plausible, neutral engineering scenario (wind-turbine blade-root flapwise
    bending moment) with a physically motivated data-generation process (slow operating
    trend + multi-frequency turbulence) rather than abstract random noise
  - 'Both renders are fully theme-correct: warm off-white / near-black backgrounds,
    all text legible, data colors identical between light and dark, axis labels carry
    physical units (kN·m)'
  - Deterministic seeded LCG (seed 42) with no Math.random() or network calls, satisfying
    the browser-harness reproducibility constraint
  - Title exactly matches the mandated `heatmap-rainflow · javascript · muix · anyplot.ai`
    format with no truncation or clipping
  weaknesses:
  - 'Design Excellence is capped by generic-ish chrome: no annotation or callout marks
    the single dominant high-count cell/band even though the spec''s Applications
    section calls out ''identifying dominant cycle combinations'' as a key use case
    -- a light annotation or highlighted outline on the peak bin would push DE-03
    storytelling further without violating the no-fake-tooltip rule'
  - ContinuousColorLegend minLabel is hard-coded to "0", but 0-count bins are never
    rendered (they are omitted, not colored) -- the darkest rendered cell actually
    corresponds to count=1 (log1p(1)≈0.69), not count=0, so the legend's bottom anchor
    is a slight approximation of the true data range; consider labeling the true minimum
    non-zero count or noting the scale is log1p-based
  - Title is rendered notably smaller than the canvas would comfortably support (~30%
    of plot width at fontSize 22) -- legible and not a defect, but there is room to
    grow it slightly for better top-of-canvas visual weight/balance
  - 'DE-01/DE-02 aesthetic polish is solid but not publication-tier: the fixed 2px
    inter-cell gap and green-to-blue sequential ramp are functional and correct but
    fairly close to a well-configured default heatmap look; a touch more typographic
    hierarchy or a refined legend treatment would lift it further'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 -- not pure white.
      Chrome: Title "heatmap-rainflow · javascript · muix · anyplot.ai" centered at top in dark ink, clearly readable. X-axis title "Cycle mean, blade-root flapwise moment (kN·m)" and rotated Y-axis title "Cycle amplitude, half-range (kN·m)" both in dark ink, fully readable with units. Numeric tick labels on both axes (e.g. "200"..."1,050" on X, "0"..."500" on Y) render in a softer dark gray, all legible, no overlap with each other or with the axis titles. Continuous color legend on the right shows "61" at top and "0" at bottom in dark ink.
      Data: A 20x20 binned matrix of rectangular cells forming a heatmap, amplitude (Y) vs. mean (X). Cell colors run a sequential green-to-blue ramp (t.seq[0] -> t.seq[1], i.e. imprint_seq) with darker/more-saturated cells concentrated in a horizontal band around low amplitude (0-80) spanning nearly the full mean range, and lighter/sparser green cells scattered at higher amplitudes (150-510) with visible gaps (fully transparent, page-background-colored) where no cycles were counted. Thin ~2px gaps between cells show the page background through, giving a tiled-grid look.
      Legibility verdict: PASS -- no text is light-on-light or otherwise hard to read.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 -- not pure black.
      Chrome: Same title, axis titles, and tick labels as the light render, all now rendered in light/white text against the dark background. Title, axis labels, tick labels, and legend "61"/"0" labels are all clearly legible with no dark-on-dark failures anywhere.
      Data: Identical cell layout and identical sequential green-to-blue colors as the light render -- confirmed the data-color ramp does not shift between themes, only the chrome (background, text) flips. The transparent zero-count gaps now show the dark page background instead of cream, still visually distinct from colored cells.
      Legibility verdict: PASS -- confirmed no dark-on-dark text; all chrome elements are theme-adaptive light-on-dark as required.
