review:
  strengths:
  - Correct imprint_seq log-scale color mapping with a clean colorbar (numeric + text
    labels) and an accurate log10 back-conversion formatter used consistently in both
    the tooltip and the visualMap legend
  - Zero/near-zero-count bins are correctly omitted so the page background shows through,
    matching the spec's 'zero-count bins should be visually distinct (transparent)'
    requirement
  - Theme-adaptive chrome is fully correct in both renders — title, axis labels, tick
    labels, axis lines and colorbar text all use theme tokens with no dark-on-dark
    or light-on-light failures
  - Correct axis mapping (amplitude on y, mean on x per spec) with bin-center tick
    labels and physically meaningful units (kN·m) tied to a realistic, neutral engineering
    scenario (wind-turbine blade-root fatigue)
  - 2400×2400 square canvas is the right orientation choice for a symmetric bin-grid
    heatmap
  - 'Clean mount-node contract: animation disabled, no explicit init dimensions, no
    devicePixelRatio override'
  weaknesses:
  - The data doesn't form the 'classic diamond' rainflow shape the code's own comments
    describe. Because the radial falloff `r = sqrt(((amp-5)/24)**2 + (mean/30)**2)`
    weighs the amplitude term too gently relative to the domain range, the count stays
    above the display threshold (>2) across almost the ENTIRE mean range for nearly
    every amplitude row up to ~amp=175 — only the top 1-2 rows (amp≈185-195) show
    real sparsity. Visually this reads as a near-uniform filled rectangle with a jagged
    skyline only at the very top, instead of a matrix that tapers and narrows in mean-spread
    as amplitude grows. Strengthen the amplitude term's decay (e.g. divide by a smaller
    constant, or make the mean-spread itself a function of amplitude so it narrows
    at high amplitude) so the concentration/tapering pattern that defines a real rainflow
    matrix is visible.
  - Because most cells cluster in the low amplitude rows regardless of mean, the color
    variation reads mostly as a top-to-bottom (amplitude-only) gradient with only
    weak left-right (mean) variation — the spec's 'clearly distinguish high-frequency
    from low-frequency cycle bins' via a 2D pattern is only weakly realized; the fix
    above (real diamond tapering) will also resolve this.
  - 'The y-axis''s default axisLine spans the full category-axis height, so in both
    themes it visibly pokes up as a thin vertical stroke above the topmost colored
    cells (since the top 1-2 rows are transparent) — looks like a stray line floating
    in empty space above the chart. Either hide it (`yAxis.axisLine.show: false`,
    common for echarts heatmaps that already have cell borders) or fix the data so
    the top row is populated flush with the axis line''s extent.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1-ish), not pure white and not dark.
      Chrome: Title "heatmap-rainflow · javascript · echarts · anyplot.ai" centered at top in dark ink, clearly legible. X-axis title "Mean bending moment (kN·m)" and Y-axis title "Cycle amplitude, half-range (kN·m)" both dark ink, readable. Rotated (45°) x tick labels (-95..85) and horizontal y tick labels (5..185) in a softer grey ink, all legible. Colorbar on the right shows "High" / "3798" at top and "0" / "Low" at bottom in grey text — readable. A thin dark vertical line (the y-axis axisLine) is visible poking up above the topmost colored cells into empty space, since the top 1-2 rows of the grid are mostly transparent.
      Data: The heatmap grid is a 20x20 array of colored cells using the imprint_seq gradient (brand green -> blue). Nearly the entire grid (from the bottom row up through roughly the 17th-18th row) is solidly filled with color, with only the very top 1-2 rows showing a jagged, partially-transparent skyline where individual cells are omitted (page background shows through). The color varies mostly from blue (bottom, low-amplitude rows = highest counts) to green (top rows = lowest counts), with only weak left-right (mean-axis) variation — the intended radial "hot spot" concentrated near (low amplitude, zero mean) is not clearly visible because count stays above the display threshold across almost the full mean range at low-to-mid amplitudes.
      Legibility verdict: PASS (all text readable, no light-on-light issues; the near-full-block data shape is a data-quality/design concern, not a legibility failure).

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17-ish), not pure black and not light.
      Chrome: Title, axis titles, and tick labels all render in light ink, clearly legible against the dark surface. Colorbar "High"/"3798" and "0"/"Low" text is light-grey, readable. The same stray vertical y-axis line above the top rows is visible here too.
      Data: Data colors are identical to the light render (imprint_seq green-to-blue gradient, same cell layout, same jagged top-row skyline) — only the chrome (background, text, axis lines) flipped for the theme, as required. No dark-on-dark failures — every tick label, title, and colorbar label is clearly distinguishable from the near-black background.
      Legibility verdict: PASS (no dark-on-dark issues; same data-shape concern noted above, not a legibility failure).
