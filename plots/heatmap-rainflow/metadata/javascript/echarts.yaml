review:
  strengths:
  - The tapering "diamond" envelope shape is now correctly realized via envelope-constrained
    mean spread (meanLimit = ENV_LIMIT - amp, parabolic falloff) — this fully resolves
    attempt 1's near-uniform-fill weakness and gives the chart a clear 2D focal point/hierarchy
    exactly as the code's own comments describe.
  - 'The stray y-axis axisLine poking above the topmost cells (attempt 1 weakness)
    is fixed via axisLine: { show: false }.'
  - Correct imprint_seq log-scale color mapping with an accurate log10 round-trip
    formatter used consistently in both the tooltip and the visualMap legend.
  - Zero/near-zero-count bins are correctly omitted so the page background shows through,
    matching the spec's 'zero-count bins should be visually distinct (transparent)'
    requirement.
  - Theme-adaptive chrome is fully correct in both renders — title, axis labels, tick
    labels, axis lines, and colorbar text all use theme tokens with no dark-on-dark
    or light-on-light failures.
  - Correct axis mapping (amplitude on y, mean on x per spec) with bin-center tick
    labels, physical units (kN·m), and a realistic, neutral engineering scenario (wind-turbine
    blade-root fatigue).
  weaknesses:
  - ~25% of the y-axis range (amp 150-195 kN·m) is permanently empty because the hard
    envelope cutoff (meanLimit = ENV_LIMIT - amp reaches 0 at amp=150) zeroes every
    cell above that row — consider trimming N_AMP/ampCenters so the axis domain matches
    where data can actually exist, or softening the envelope with a probabilistic
    tail of rare outlier cycles, both tightening the layout and matching real-world
    rainflow matrices which usually show sparse outliers rather than a hard void.
  - Design Excellence stays close to a well-executed standard heatmap — no additional
    embellishment (e.g., a subtle highlight/annotation on the peak-count cell, or
    a callout naming the diamond envelope pattern) to push DE-01/DE-03 further.
  - Axis-title fontsize (18) is noticeably larger than tick-label fontsize (13); a
    smaller gap would read as more balanced.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1-ish), not pure white and not dark.
      Chrome: Title "heatmap-rainflow · javascript · echarts · anyplot.ai" centered at top in dark ink, clearly legible. X-axis title "Mean bending moment (kN·m)" and Y-axis title "Cycle amplitude, half-range (kN·m)" both dark ink, readable. Rotated (45°) x tick labels (-95..85, every 20 units) and horizontal y tick labels (5..185) in softer grey ink, all legible. Colorbar on the right shows "High"/"4645" at top and "0"/"Low" at bottom in grey text — readable. No stray axis lines poking into empty space (fixed from attempt 1).
      Data: The heatmap forms a clean tapering diamond/pyramid shape using the imprint_seq gradient (brand green -> blue): wide at the bottom (low amplitude, full mean spread), narrowing to a single-cell apex near amp≈135-145, mean≈0-5. Color varies clearly in both dimensions — blue (high count) concentrated near center-bottom, green (low count) toward the diamond's edges — giving a genuine 2D pattern instead of attempt 1's near-uniform block.
      Legibility verdict: PASS (all text readable, no light-on-light issues).

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17-ish), not pure black and not light.
      Chrome: Title, axis titles, and tick labels all render in light ink, clearly legible against the dark surface. Colorbar "High"/"4645" and "0"/"Low" text is light-grey, readable. No stray axis line.
      Data: Data colors are identical to the light render (imprint_seq green-to-blue gradient, same diamond-shaped cell layout, same colorbar min/max) — only the chrome (background, text, axis lines) flipped for the theme, as required. No dark-on-dark failures — every tick label, title, and colorbar label is clearly distinguishable from the near-black background.
      Legibility verdict: PASS (no dark-on-dark issues).
