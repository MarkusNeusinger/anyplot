review:
  strengths:
  - Continuous count mapped onto the Imprint sequential fields ramp with the stops
    of each theme (pale mint → brand green → deep blue → dark violet in light, dark
    olive → brand green → pale blue in dark), so frequent and rare bins separate clearly
    in both renders
  - Log-scaled color (log10(count+1)) with a matching log-ticked color bar (0, 1,
    10, 100, 1,000) spreads the four-decade count range across the ramp
  - Zero-count bins drawn in the page color with a thin outline, clearly distinct
    from the lowest counted bins in both themes
  - Extends pygal's Graph base and draws through self.svg.node, so the same chart
    ships as a PNG and as pygal's native interactive SVG/HTML
  - One peak cell framed in an amber halo with its value on a page-colored pill gives
    the matrix a single focal point without crowding
  - Tidy df built in a replaceable Data block with column-role constants, pivoted
    below it; all chrome from theme tokens
  weaknesses:
  - 'CQ-01 (code): line 87 `class RainflowHeatmap(Graph)` holds the whole drawing
    in `_plot`, with `log_norm` and `svg_text` nested inside it → draw the cells,
    labels and color bar at the top level, cell by cell (for example on a pygal chart''s
    SVG after render, or as plain SVG nodes), with only short top-level helpers. Likely
    cause: a custom Graph subclass as the plotting entry point.'
  - 'SC-03 (both): the x tick labels misstate the bin centers they name: centers −42.5,
    2.5, 47.5, …, 227.5, 242.5 print as -42, 2, 48, 92, 138, 182, 228, 242 (rounded
    half to even, off by 0.5 in mixed directions), and the every-3rd-plus-last rule
    puts 228 and 242 side by side while 185…25 skip unevenly to 15 and 5 on y → label
    exact centers (or bin edges) at an even step. Likely cause: f"{v:.0f}" on .5 centers
    and the `j % 3 == 0 or j == nc - 1` / `i % 2 == 0 or i == nr - 1` filters.'
  - 'SC-04 (both): the color bar''s ''0'' tick sits on the ramp''s first stop (pale
    mint in light, dark olive in dark), but zero-count bins are drawn in the page
    color, so the key labels a color no empty bin has and the empty-bin color has
    no key → start the ramp at the lowest counted value and key empty bins separately
    (a page-colored swatch labelled 0 / empty). Likely cause: tick list `[0] + [10**p
    …]` mapped to t=0.'
  - 'VQ-01 (both): row, column and color-bar tick labels at 30 px, below the style
    guide''s pygal tick reference of 44, read small beside the 46 px axis titles →
    44 px (+14 px). Likely cause: `rf = min(30, …)`, `cf = min(30, …)` and the hard-coded
    30 in the color-bar svg_text call.'
  - 'Suggestion: the ~150 px gap between the title and the subtitle could go to the
    matrix.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 page; the matrix sits on a slightly elevated #FFFDF6 panel with a faint outline.
      Chrome: title "heatmap-rainflow · python · pygal · anyplot.ai" in dark monospace ink at the top; muted subtitle "Wind Turbine Blade Root — Variable Amplitude Fatigue Spectrum" above the grid; bold "Stress Amplitude (MPa)" (rotated, left) and "Mean Stress (MPa)" (bottom); y ticks 195…15, 5 and x ticks -42, 2, 48, 92, 138, 182, 228, 242 in INK_SOFT; color bar titled "Cycle Count" with log ticks 0, 1, 10, 100, 1,000. All readable, ticks on the small side.
      Data: 20×20 rounded cells on the Imprint fields ramp (light stops): pale mint for rare bins through brand green #009E73 and deep blue to dark violet at the peak; triangular occupied region narrowing toward high amplitude; zero bins page-colored with grey outlines. The peak cell (5 MPa, ~62.5 MPa mean) carries an amber halo and a "9,817" pill.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17 page with a #242420 elevated panel.
      Chrome: title, axis titles and color-bar title in light ink #F0EFE8; ticks and subtitle in light grey — all readable, no dark-on-dark text.
      Data: same matrix on the Imprint fields ramp's dark stops (dark olive → brand green → pale blue), so high counts read light and rare bins dark green; zero bins are page-colored with grey outlines and stay distinct from the darkest counted bins. Amber halo and "9,817" pill (dark pill, light text) on the same peak cell. The ramp flips per theme as required; no categorical colors involved.
      Legibility verdict: PASS
