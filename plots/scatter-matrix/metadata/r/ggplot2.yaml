review:
  strengths:
  - 'The row-axis-range defect flagged in attempt 2 (shared per-row y-scale extending
    far past each variable''s real data range, squashing the diagonal KDE ribbons
    and off-diagonal scatter into a fraction of panel height) is now resolved: every
    row''s axis tightly tracks the variable''s actual data range and the diagonal
    density curves fill nearly the full panel height as intended by the 0.9-of-range
    rescale formula.'
  - Hand-built symmetric SPLOM via facet_grid(row_var ~ col_var, scales = "free",
    switch = "both") with a labeller correctly avoids the unavailable GGally dependency
    while placing variable names only on the left/bottom edges, exactly matching the
    spec's 'edge-only labels, symmetric matrix' requirement.
  - Diagonal KDE ribbons + off-diagonal scatter, colored by Iris species, clearly
    reveal real clustering structure (setosa fully separated from versicolor/virginica
    in petal measurements), giving the plot a genuine data story.
  - Theme-adaptive chrome is correctly threaded through both renders (backgrounds,
    strip fills, text, grid all flip correctly); Imprint palette used in canonical
    order (green/lavender/blue), CVD-safe, and identical hex values in both themes.
  - Clean, function-free code with set.seed(42), correct ragg::agg_png save pattern,
    and correct 2400x2400 square canvas (passes the post-render dimension gate).
  weaknesses:
  - With a 4x4 grid of panels on a 2400x2400 canvas, tick-label text (6.5pt) is legible
    at full resolution but will be very small when the image is scaled down to a ~400px
    mobile thumbnail - an inherent tension of the scatter-matrix format that could
    be mitigated with slightly larger tick fonts or fewer gridlines.
  - Scatter markers (size = 1.3, alpha = 0.6) are appropriately sized to avoid overplotting
    in the small panels, but in the densest overlap regions (e.g. versicolor/virginica
    in Sepal Width vs Sepal Length) individual points are hard to distinguish - could
    benefit from a touch more alpha contrast or slightly larger points now that panel
    space is no longer wasted.
  - Visual refinement relies mostly on theme_minimal() with token overrides rather
    than deeper customization (e.g. panel border, alternating panel shading, or per-axis
    minor gridlines) - solid but not maximally polished.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1
      Chrome: Bold dark title "scatter-matrix · r · ggplot2 · anyplot.ai" centered at top, fully visible with no clipping; strip labels (variable names: Sepal Length (cm), Sepal Width (cm), Petal Length (cm), Petal Width (cm)) placed on the left and bottom edges only, on a slightly elevated off-white strip background; dark tick numbers on all 16 panels; "Species" legend at bottom with green/lavender/blue swatches and setosa/versicolor/virginica labels - all clearly readable against the light background
      Data: setosa = green (#009E73, first series per Imprint canonical order), versicolor = lavender (#C475FD), virginica = blue (#4467A3). Off-diagonal cells show alpha-blended scatter (size 1.3, alpha 0.6) for each variable pair; diagonal cells show per-species KDE ribbons (alpha 0.35) that now fill nearly the full panel height, clearly reading as three overlapping distributions. Each row's y-axis tightly tracks that variable's real data range (e.g. Sepal Length row spans roughly 4.3-8, not the 0-8 spread flagged in the previous attempt), so panel space is used efficiently and the density peaks are no longer squashed against the bottom.
      Legibility verdict: PASS - all text readable at full resolution in both themes; small tick text at 400px mobile scale is a soft weakness (see review weaknesses) but not a legibility failure at native size.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17
      Chrome: Title, strip labels, and tick numbers all rendered in light ink colors (#F0EFE8 / #B8B7B0), clearly legible against the dark background - no dark-on-dark failures anywhere; grid lines are thin and faint light lines, subtle but visible; legend swatches and text also legible
      Data: Colors are identical hex values to the light render (green/lavender/blue) - only the chrome (background, strip fills, text, grid) flips between themes, as required. The perceived brightness of the alpha-blended fills differs slightly from light mode purely because alpha-compositing interacts with a darker backdrop, which is expected behavior for translucent marks and not a palette violation.
      Legibility verdict: PASS - same row-axis-range fix applies here (the defect was data/scale-driven, not theme-specific), and all chrome text is fully readable against the dark surface.
