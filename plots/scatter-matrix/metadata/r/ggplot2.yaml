review:
  strengths:
  - Correctly avoids an external pairs-plotting package (GGally unavailable) by hand-building
    a symmetric SPLOM with facet_grid(switch = "both") and a labeller, giving axis
    labels only on the left/bottom edges with no duplicate tick labels
  - Diagonal KDE + off-diagonal scatter, color-coded by Iris species, shows real clustering
    structure (setosa fully separated from versicolor/virginica across most pairs)
  - Theme-adaptive chrome correctly threaded through both renders; Imprint palette
    in canonical order, CVD-safe, data colors identical between light and dark
  - Attempt-1 feedback about 5pt tick labels was correctly addressed (now 6.5pt, legible
    in both themes)
  - Clean, function-free code with correct save pattern (plot-{theme}.png via ragg::agg_png)
    and correct canvas size (2400x2400 square)
  weaknesses:
  - 'Row-shared y-axis extends well beyond each variable''s actual data range across
    every row of the grid, wasting a large fraction of panel height. Worst in the
    Sepal Length diagonal panel: axis spans 0-8 but real data (and the rescaled KDE
    ribbon) only occupies the top ~45% of the panel, with the KDE curves themselves
    compressed into roughly the bottom 15% of the visible axis.'
  - Because facet_grid(scales = "free") shares one y-scale per row across all 4 panels
    in that row, whatever pulls the scale toward 0 for the diagonal panel also compresses
    the off-diagonal scatter panels in the same row.
  - This is very likely the same issue attempt 1 flagged (diagonal density curves
    squashed against the shared row scale) - the attempt-1 repair switched geom_density()
    to a manually rescaled geom_ribbon(), but the rendered result still shows the
    same squashed appearance, so the fix did not resolve the underlying scale-training
    problem.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1
      Chrome: Title, strip labels (variable names on left/bottom edges), tick numbers, and legend all clearly readable against light background
      Data: setosa=green, versicolor=lavender, virginica=blue - matches Imprint palette canonical order, first series is #009E73
      Layout defect: every row's y-axis extends well past that variable's real data range - e.g. Sepal Length row spans 0-8 axis while actual data is 4.3-7.9, squashing scatter points and especially the top-left diagonal KDE curve (only ~15% of panel height used) into a fraction of each panel
      Legibility verdict: PASS (text legible; the defect is proportional/layout, not legibility)

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17
      Chrome: Title, strip labels, tick numbers all light-colored and clearly readable against dark background - no dark-on-dark failures; gridlines thin and light
      Data: Colors identical to light render (green/lavender/blue) - only chrome flipped, as required
      Layout defect: same row-axis-range/panel-space-waste issue present (data/scale issue, not theme-specific)
      Legibility verdict: PASS (text legible; the defect is proportional/layout, not legibility)
