review:
  strengths:
  - Faithful, idiomatic construction of a true scatter-plot matrix using facet_grid(switch
    = "both") with a labeller, achieving a symmetric pairwise layout with axis labels
    only on the left/bottom edges and no duplicate tick labels per row/column — non-trivial
    in ggplot2 without an external pairs-plotting package.
  - 'Diagonal KDE + off-diagonal scatter, color-coded by Iris species, reveals a genuine
    data story: setosa is fully separated from versicolor/virginica across most pairs.'
  - Theme-adaptive chrome is correctly threaded through in both renders; the Imprint
    palette (green/lavender/blue) follows canonical order, is CVD-safe, and data colors
    are identical between light and dark themes.
  - Clean, function-free code with correct save pattern (plot-{theme}.png via ragg::agg_png)
    and correct canvas size (2400x2400 square).
  weaknesses:
  - Axis tick labels are set at only 5pt (axis.text size = 5); readable at full 2400px
    resolution but likely to become illegible when the image is scaled down for mobile/thumbnail
    display (~400px width) — consider bumping to 6-7pt given the ample panel whitespace.
  - Diagonal density curves share each row's data-value y-scale (e.g. 0-8 for Sepal
    Length) rather than a scale suited to density magnitude, so the KDE shapes are
    visually compressed toward the bottom of their panels instead of using the panel's
    full height.
  - Design execution is solid but not exceptional beyond what the facet-grid technique
    requires — a bit more visual refinement (e.g. slightly fainter gridlines, tighter
    panel spacing) would elevate it further.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Bold dark title "scatter-matrix · r · ggplot2 · anyplot.ai" centered at top, clearly readable. Row/column edge labels ("Sepal Length (cm)", "Sepal Width (cm)", "Petal Length (cm)", "Petal Width (cm)") appear as strip text on the left and bottom edges only, dark ink on a slightly elevated background chip. Numeric tick labels appear in a soft dark gray, shown once per row (leftmost column) and once per column (bottom row) rather than being duplicated on every panel. Thin dark gridlines cross each panel, visible but not overwhelming. A "Species" legend sits below the matrix with three square swatches (green/lavender/blue) and readable dark text.
      Data: 4x4 grid of panels. Off-diagonal cells show scatter points colored by species (green = setosa, lavender/purple = versicolor, blue = virginica) at small size with partial transparency to manage overplotting. Diagonal cells show overlapping filled density curves per species. The species color-coding clearly reveals setosa as a separate cluster from versicolor/virginica in most petal-related panels. First series (setosa) uses the mandated brand green #009E73.
      Legibility verdict: PASS — all title, strip labels, tick numbers, and legend text are readable against the light background; only the numeric tick labels (~5pt) are quite small, a minor concern at reduced/mobile scale rather than an outright failure.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Same title, now rendered in light/cream text, clearly legible against the dark background. Strip labels for row/column variable names are light-colored on a slightly lighter dark chip, fully readable — no dark-on-dark failure. Gridlines are thin and light, visible without dominating. Tick numbers are a soft light gray, readable. Legend background is a lighter dark chip with light text and the same colored swatches.
      Data: Same layout and point/density encoding as the light render. Colors for setosa (green), versicolor (lavender/purple), and virginica (blue) are visually identical to the light render — only the chrome (background, text, grid, legend frame) has flipped.
      Legibility verdict: PASS — no dark-on-dark or light-on-light issues detected; all chrome elements are clearly visible against the dark surface, brand green remains vivid on the dark background.
