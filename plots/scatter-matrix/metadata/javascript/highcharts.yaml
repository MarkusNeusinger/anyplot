review:
  strengths:
  - Handles Highcharts' lack of a native SPLOM series by building an elegant custom
    grid of independent xAxis/yAxis pairs positioned via percentage-based left/top/width/height
    — a genuinely distinctive engineering solution for this library.
  - 'Correct Imprint palette usage: brand green (#009E73) first, then lavender and
    blue for the other two cultivars, identical across light and dark renders.'
  - Diagonal cells use a neutral gray for the combined-distribution histograms (avoiding
    confusion with the per-category scatter colors), and tick/axis labels are cleanly
    restricted to only the outer edges (bottom row, left column) to keep the 16-cell
    grid uncluttered.
  - Both theme renders are fully legible — subtle Imprint-toned gridlines, no dark-on-dark
    or light-on-light failures, chrome correctly flips while data colors stay fixed.
  - Code is well-commented with clear reasoning about non-obvious Highcharts quirks
    (plotLines vs. lineWidth for axis-edge lines, explicit tickPositions to avoid
    tickAmount rounding drift, offset:0 to stop sibling-axis label stacking).
  - Deterministic seeded PRNG (mulberry32) and a realistic, neutral rose-cultivar
    dataset with clearly separable clusters across variable pairs.
  weaknesses:
  - Scatter markers (marker.radius 2.6 CSS px) are on the small side given each cell
    has generous area (~22% of the 2400px canvas per side) — bumping to ~3.5-4 would
    give the data more presence without materially increasing overlap.
  - At the 400px mobile thumbnail, tick and axis labels become very hard to read —
    largely inherent to a 4x4 SPLOM, but nudging outer tick label size from 12px to
    ~13px would help at that scale.
  - The legend sits fairly isolated in the top-right whitespace with a noticeable
    gap before the grid begins; moving it a little closer to the top row would tighten
    the composition.
  - Data storytelling relies entirely on the intrinsic separation from the generated
    clusters; no visual emphasis (e.g., lightly highlighting one especially strong
    pairwise correlation) elevates a single 'headline' insight.
  - Title occupies only ~35% of canvas width, comfortably below the usual 50-70% guideline
    — a modestly larger title fontsize (e.g. 24-26px) would balance better against
    the generous whitespace above the grid.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white, not dark.
      Chrome: Title "scatter-matrix · javascript · highcharts · anyplot.ai" in bold dark ink top-left, subtitle "Rose cultivar bloom measurements · n=135, colored by cultivar" in softer gray-brown beneath it, legend (Hybrid Tea / Floribunda / Climbing) top-right with colored dot swatches. All fully readable against the light background. A 4x4 grid of small scatter/histogram panels fills most of the canvas; only the bottom row carries x-axis tick labels/titles and only the left column carries y-axis tick labels/titles, keeping the interior uncluttered. Subtle warm gridlines are visible in every cell.
      Data: Diagonal cells show neutral gray histograms of each variable's combined distribution. Off-diagonal cells show scatter plots colored by cultivar — Hybrid Tea in brand green (#009E73), Floribunda in lavender/purple, Climbing in blue — with three clearly separated clusters in most panels. The matrix is symmetric: cell (row=1,col=0) and cell (row=0,col=1) show the same variable pair with axes swapped.
      Legibility verdict: PASS.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black, not light.
      Chrome: Same title/subtitle/legend layout, now rendered in light ink/off-white text, fully readable against the dark background. Gridlines are a soft light warm tone at low opacity, consistent with the light render's structure. No dark-on-dark or light-on-light failures anywhere — tick labels, axis titles, and legend text are all clearly legible.
      Data: Colors are identical to the light render — Hybrid Tea green, Floribunda lavender, Climbing blue — confirming only chrome (background/text/grid) flipped between themes, not the categorical data palette. Diagonal histograms remain neutral gray, still clearly visible against the dark background.
      Legibility verdict: PASS.
