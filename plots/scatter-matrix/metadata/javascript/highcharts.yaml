review:
  strengths:
  - 'Headline-pair highlighting: a custom statistic (worst-case standardized centroid
    distance across all cultivar pairs) selects the most cleanly separated variable
    pair, which is then spotlighted with a translucent plotBand tint and slightly
    larger/outlined markers on both symmetric cells — turns an inherently generic
    SPLOM into a chart with a clear focal point and a real story.'
  - 'Solid multi-axis engineering around genuine Highcharts limitations: per-axis
    offset:0 to prevent label-stacking drift across 16 axis pairs, explicit tickPositions
    instead of tickAmount to avoid silent ''nice number'' rounding that would desync
    plotLines from the true edge, and plotLines instead of lineWidth for edge lines
    that render correctly per-cell. All documented inline with the specific failure
    mode each workaround avoids.'
  - 'Correct, symmetric matrix: diagonal histograms, off-diagonal scatter for every
    pair, tick/axis labels only on the outer edges, upper and lower triangles show
    the same relationships transposed as required by the spec.'
  - 'Theme-correct Imprint palette throughout: first cultivar (Hybrid Tea) is #009E73,
    data colors identical between light/dark renders, only chrome (grid, ticks, plotBand
    tint) adapts per theme.'
  - Deterministic, seeded data generation (mulberry32 PRNG) with a realistic, neutral
    rose-cultivar dataset across plausible measurement ranges.
  weaknesses:
  - Code carries more helper functions than a typical KISS implementation (mulberry32,
    randNormal, histogram, stdDev, pairSeparation, tickFormatter) — largely justified
    by the n×n programmatic grid and the headline-pair statistic, but CQ-01 loses
    a point for the added surface area.
  - At the ~400px mobile thumbnail scale, the 16-cell grid's tick labels (e.g. '46.1',
    '116.0') become quite small and harder to read — an inherent tradeoff of a dense
    scatter-matrix layout rather than a font-sizing mistake, but worth flagging.
  - Highcharts has no native SPLOM series, so the multi-axis-grid workaround is solid
    but necessarily a 'second-best' idiom compared to what a library with a built-in
    pairplot type would offer — LM-01 held to 4/5 rather than 5/5 for this reason.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Bold black title "scatter-matrix · javascript · highcharts · anyplot.ai" top-left, fully visible with no clipping. Gray subtitle "Rose cultivar bloom measurements · n=135, colored by cultivar" beneath it, readable. 4x4 grid: diagonal cells are gray histograms (Bloom Diameter, Petal Count, Stem Length, Fragrance Score distributions); off-diagonal cells are scatter plots colored by cultivar. Axis tick labels and axis titles appear only on the bottom row and left column, all in dark ink, clearly legible against the light background. Subtle gray gridlines visible but not dominant. Legend (Hybrid Tea / Floribunda / Climbing) top-right with colored dot swatches, readable. The Bloom Diameter × Stem Length cell pair (both symmetric occurrences) has a faint pale-green tint highlighting it as the "headline" (best-separated) pair, with correspondingly larger/outlined markers.
      Data: First series (Hybrid Tea) is Imprint brand green #009E73, second (Floribunda) is a magenta/purple, third (Climbing) is a muted blue — all three clusters are visually distinct in every off-diagonal cell, showing clear pairwise correlation and cultivar separation.
      Legibility verdict: PASS — all text (title, subtitle, axis labels, tick labels, legend) is clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Title is now white/off-white, subtitle light gray, axis labels and tick labels light gray — all clearly legible against the dark background. Gridlines are subtle light gray, visible but unobtrusive. The headline-pair cells show the same pale-green tint (now reading as a darker forest-green tint against the near-black background) with the same emphasized markers.
      Data: Colors are identical to the light render — same green/magenta/blue for the three cultivars — confirming only chrome (background, text, grid, tint opacity rendering) flips between themes, not data colors.
      Legibility verdict: PASS — no dark-on-dark failures; all title/axis/tick/legend text is light-colored and reads clearly against the near-black surface.
