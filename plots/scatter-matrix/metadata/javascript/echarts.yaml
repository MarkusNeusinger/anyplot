review:
  strengths:
  - Well-engineered N x N multi-grid composition (ECharts has no native SPLOM chart
    type) with shared per-column/per-row axis ranges so the matrix reads as a coherent,
    symmetric grid
  - Custom edge-safe tick formatter fixes the prior label-collision bug where a regular
    split-line tick (e.g. '2.5') collided with a forced min/max edge label (e.g. '2.7')
  - Axis labels now carry units ('Sepal Length (cm)', etc.) shown only on the bottom
    row and left column, keeping the grid uncluttered
  - 'Theme-adaptive chrome is correct in both renders: data colors (green/purple/blue)
    are pixel-identical between light and dark, only background/text/grid flip'
  - Realistic, scientifically plausible iris-like dataset (3 species x 40 points x
    4 variables) that clearly demonstrates correlation (petal length vs. width), clustering
    (species separation), and per-variable distributions on the diagonal
  weaknesses:
  - Diagonal histogram bars touch the very top edge of their cell (yAxis max is set
    to the exact maxCount with no padding) — add ~5-10% headroom to the histogram
    y-axis max so the tallest bar doesn't look clipped against the cell border
  - Aesthetic sophistication leans on default ECharts styling beyond the required
    palette/theme tokens — consider subtler split-line grid or refined legend/title
    vertical rhythm to push Design Excellence beyond 'well-configured default'
  - No explicit visual emphasis on the strongest relationship (e.g. petal length vs.
    petal width, which shows near-perfect species separation) — optional polish for
    a future revision, not a spec requirement
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Title "scatter-matrix · javascript · echarts · anyplot.ai" centered at top in dark ink; legend (Setosa/Versicolor/Virginica swatches) centered below it; axis titles with units ("Sepal Length (cm)", "Sepal Width (cm)", "Petal Length (cm)", "Petal Width (cm)") shown only on the bottom row and left column; tick labels in soft dark gray; thin light-gray gridlines per cell.
      Data: 4x4 grid of panels. Diagonal cells show green (#009E73) histograms of each variable's distribution across all 120 points. Off-diagonal cells show scatter points colored by species — Setosa green, Versicolor light purple, Virginica slate blue — with small markers and partial transparency to handle overplotting. Species clusters are clearly separable in most panels (especially petal length/width).
      Legibility verdict: PASS — all titles, axis labels, tick labels, and legend text are clearly readable against the light background; no light-on-light text.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Same title, legend, and axis-label layout as the light render, now rendered in light ink/soft-gray text against the dark background; gridlines are a dim gray, still visible but subtle.
      Data: Colors are pixel-identical to the light render — green histogram, and green/purple/blue scatter points in the same positions and hues. Only the chrome (background, text, grid) flipped to the dark theme; no data recoloring.
      Legibility verdict: PASS — title, axis labels, tick labels, and legend text are all clearly legible light-on-dark; no dark-on-dark failures observed anywhere in the grid.
