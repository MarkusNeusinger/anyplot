review:
  strengths:
  - Correct, idiomatic ECharts multi-grid construction of a full N×N scatter-plot
    matrix — shared, padded axis ranges keep columns/rows aligned across all 16 cells
  - Diagonal histograms plus off-diagonal scatter cells with species color-encoding
    fulfil the spec's core requirement; Setosa is clearly separated from Versicolor/Virginica
    in every petal-related cell
  - 'Matrix symmetry correctly implemented: row/col-driven axis assignment mirrors
    the same variable pair with swapped axes across the diagonal, matching the spec''s
    ''symmetric matrix'' requirement'
  - Correct Imprint palette assignment (Setosa=#009E73, Versicolor=palette[1], Virginica=palette[2])
    with identical data colors and fully theme-correct chrome across both light and
    dark renders
  - Deterministic seeded LCG data generation, clean KISS code structure, no fake interactivity
  weaknesses:
  - 'Bottom-right diagonal cell (Petal Width vs Petal Width) has colliding x-axis
    tick labels: the auto split-line label ''2.5'' runs directly into the forced max
    label ''2.7'' with no gap, rendering as ''2.52.7''. Suppress or space the split-line
    label nearest the max when showMaxLabel is forced on, e.g. drop the last regular
    tick or reduce splitNumber for that axis.'
  - Axis names ('Sepal Length', 'Petal Width', etc.) omit units — add '(cm)' to match
    the iris/flower-measurement convention and earn full VQ-06 credit.
  - Noticeable empty band between the legend (top ~7.5%) and the start of the grid
    (top ~17%) makes the top margin heavier than the bottom/side margins — tighten
    the legend-to-grid gap (e.g. reduce outerTop or move the legend closer to row
    1) to balance whitespace.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (~#FAF8F1), consistent across the full canvas including subplot cells.
      Chrome: Title "scatter-matrix · javascript · echarts · anyplot.ai" centered at top in dark ink, fully readable. Legend ("Setosa", "Versicolor", "Virginica") centered below the title with colored swatches, readable. Axis names appear only on the bottom row (x) and left column (y): Sepal Length, Sepal Width, Petal Length, Petal Width — all dark, legible. Tick labels are small (11px) but readable, except the bottom-right diagonal cell where "2.5" and "2.7" collide into "2.52.7" with no separating space. Grid lines are light gray and subtle, visible without dominating.
      Data: 4x4 grid — diagonal cells show green (#009E73) histograms of each variable's distribution; off-diagonal cells show scatter points colored by species (Setosa=green, Versicolor=light purple, Virginica=blue-gray), semi-transparent (alpha 0.6) to handle overplotting. Setosa is clearly separated from the other two species in all petal-related panels; Versicolor/Virginica overlap more, as expected for iris-like data. Matrix is symmetric — upper and lower triangles show the same variable pairs with axes swapped.
      Legibility verdict: PASS (one localized tick-label collision noted above, everything else fully readable)

    Dark render (plot-dark.png):
      Background: Warm near-black (~#1A1A17), consistent across the canvas.
      Chrome: Title, legend, axis names, and tick labels all render in light ink/inkSoft tones with full contrast against the dark background — no dark-on-dark failures observed anywhere. Grid lines remain subtle light gray, visible without dominating. Same tick-label collision ("2.52.7") reproduces identically in the bottom-right diagonal cell.
      Data: Data colors are identical to the light render — Setosa green, Versicolor purple, Virginica blue-gray — confirming only chrome flipped between themes, not data colors.
      Legibility verdict: PASS (same localized tick-label collision as light render; all other text clearly legible on the dark surface)
