review:
  strengths:
  - Diagonal histograms are now stacked and colored per-species (shared bin thresholds
    computed once from the pooled data, then applied per-species) using the same Imprint
    palette as the off-diagonal scatters -- the whole matrix now tells one consistent
    categorical story, directly fixing the attempt-1 weakness.
  - Inner cell borders are lightened to stroke-opacity 0.35 and a single crisp 1.5px
    outer frame now wraps the whole 4x4 grid, so the figure reads as one cohesive
    matrix instead of 16 separately-boxed tiles -- directly fixes the attempt-1 DE-02
    weakness with no regressions elsewhere.
  - 'Technical foundation carried over intact: shared per-column/per-row scales keep
    every panel aligned, the matrix is genuinely symmetric, theme tokens are threaded
    through every text/stroke element with zero dark-on-dark or light-on-light issues,
    and data generation remains a clean seeded LCG with no unused imports.'
  weaknesses:
  - Off-diagonal scatter panels still show some crowding where Versicolor and Virginica
    clusters interleave (e.g. sepal width vs. sepal length) -- marker radius/opacity
    were nudged down slightly (2.6px/0.6 -> 2.3px/0.55) but a further reduction or
    jitter could help the densest regions.
  - Tick labels (12px) remain small relative to the large 2400x2400 canvas -- still
    readable in both themes but on the conservative side for a catalog image viewed
    at various scales.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1, not pure white.
      Chrome: Bold centered title "scatter-matrix · javascript · d3 · anyplot.ai" in dark ink; three-item legend (Setosa/Versicolor/Virginica) below it; variable-name axis labels along the bottom (horizontal) and left (rotated -90) edges in dark ink; numeric tick labels (12px) only on the outer row/column. All confirmed readable via full-image and edge-crop inspection -- no clipping at top, bottom, or left edges.
      Data: First series (Setosa) is #009E73 green, Versicolor is lavender/purple, Virginica is slate blue -- canonical Imprint categorical order. Diagonal cells now show stacked per-species histograms in the same three colors (new in this attempt, previously pooled gray). Off-diagonal cells show per-species scatter points (r=2.3px, 0.55 opacity) revealing clear Setosa separation and Versicolor/Virginica overlap on sepal measurements.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17, not pure black.
      Chrome: Same title/legend/axis-label layout, now in light ink; tick labels and axis domain lines flip to theme-appropriate light/grid tones. Edge crops (bottom variable labels, rotated left-column labels) confirm every character fully visible, no dark-on-dark failures, no chopped text at any canvas edge.
      Data: Species colors are pixel-identical to the light render (green/purple/blue), confirming only chrome flipped. Stacked diagonal histograms and off-diagonal scatters read with the same clarity as in light mode.
      Legibility verdict: PASS
