review:
  strengths:
  - Correctly builds a fully custom, from-scratch scatter-plot matrix in raw D3 —
    shared per-column/row scales keep every panel properly aligned, and the matrix
    is genuinely symmetric (mirrored panels show the same pairs).
  - 'Theme adaptation is flawless: identical data colors between light/dark, all chrome
    (ticks, labels, title, legend, grid) correctly threaded through ANYPLOT_TOKENS,
    no dark-on-dark or light-on-light issues found on close inspection.'
  - Clean, deterministic, appropriately minimal code (seeded LCG, no unused imports,
    no fake interactivity).
  weaknesses:
  - Diagonal histograms are pooled across all species (flat gray), dropping the categorical
    grouping that the off-diagonal scatters clearly convey — consider overlaying/stacking
    per-species bars (or per-species density curves) on the diagonal to carry the
    same story through the whole matrix.
  - Every one of the 16 cells has a full stroked border rectangle, which adds visual
    weight across the whole canvas; consider a lighter treatment (e.g. very low-opacity
    or removing shared internal borders, only stroking the outer boundary) for a more
    refined look.
  - Markers rely purely on cell-border strokes as the only inner structure in the
    densest overlap regions (e.g. sepal width vs. sepal length, where Versicolor/Virginica
    clusters interleave) — a slightly smaller marker size or lower opacity there would
    help further.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1, not pure white.
      Chrome: Title "scatter-matrix · javascript · d3 · anyplot.ai" centered at top in dark ink; three-item legend (Setosa/Versicolor/Virginica) below it; variable-name axis labels along the bottom edge and rotated along the left edge; numeric tick labels shown only on the outer row/column of the 4x4 grid. All confirmed readable in close-up crops — no light-on-light issues.
      Data: Diagonal cells show pooled gray histograms (10 bins) of each variable's distribution. Off-diagonal cells show scatter points colored by species: Setosa = #009E73 (green, first series as required), Versicolor = light purple, Virginica = slate blue. Points are small (r≈2.6px) with 0.6 opacity to manage overplotting of the 150 pooled points per cell.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17, not pure black.
      Chrome: Same title/legend/axis-label/tick-label layout, now in light ink on the dark surface. Verified in close-up crops: rotated y-axis label, x-axis tick numbers, and axis titles are all clearly legible light-on-dark, no dark-on-dark failures found anywhere.
      Data: Species colors (green/purple/blue) are pixel-identical to the light render — confirmed by direct comparison of legend swatches and scatter clusters. Only chrome flipped between themes, as required.
      Legibility verdict: PASS
