review:
  strengths:
  - 'Correct Imprint palette in canonical order — Setosa is #009E73 (position 1),
    Versicolor lavender (position 2), Virginica blue (position 3) — identical across
    both themes.'
  - 'Both renders fully theme-correct: warm off-white #FAF8F1 light background with
    dark text, warm near-black #1A1A17 dark background with light text, no dark-on-dark
    or light-on-light failures anywhere across the 16 sub-charts.'
  - 'Full spec feature coverage: diagonal cells show stacked-by-species histograms
    (univariate distributions), off-diagonal cells show pairwise scatter colored by
    species, variable names appear along the left (rotated) and bottom edges only,
    and the matrix is symmetric (transposed pairs mirror correctly).'
  - 'Distinctive Chart.js technique: a registered `focusAccent` plugin (beforeDraw
    hook) draws an outline around the petal_length/petal_width cell pair — the dataset''s
    strongest pairwise correlation — creating a genuine focal point via the plugin
    system rather than a CSS overlay.'
  - Deterministic seeded LCG data generator produces realistic iris-like clustering
    with plausible within- and between-species correlation structure.
  - 'Correct mount-node/API contract: one canvas per cell, `animation:false`, `maintainAspectRatio:false`,
    no filesystem calls, alpha-blended markers to manage overplotting.'
  weaknesses:
  - 'CQ-01: Several helper functions (makeLcg, randNormal, getDomain, histogramBySpecies)
    deviate from a flat top-to-bottom KISS script — justified by the matrix''s data-generation
    and per-cell layout needs, but still a structural deduction versus pure inline
    code.'
  - In-cell tick labels (14px) across the 16 sub-charts become quite small at the
    ~400px mobile thumbnail scale — the title, legend, and edge axis labels stay legible,
    but exact tick values inside individual cells are hard to read at that size. Largely
    inherent to a dense 4x4 grid chart type, but still a minor legibility concession
    worth trimming further if feasible (e.g. maxTicksLimit already reduces count;
    consider slightly larger tick font for edge cells only).
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white, not dark.
      Chrome: Title "scatter-matrix · javascript · chartjs · anyplot.ai" in dark ink, clearly visible and centered. Legend row (Setosa/Versicolor/Virginica swatches + labels) fully readable. Rotated row labels ("Sepal Length (cm)", "Sepal Width (cm)", "Petal Length (cm)", "Petal Width (cm)") along the left edge and matching column labels along the bottom edge are all legible. Tick labels only appear on the leftmost column and bottom row (correct SPLOM convention), in soft gray, readable against the light background. Subtle horizontal/vertical gridlines visible but not dominant.
      Data: First series (Setosa) is brand green #009E73, Versicolor is lavender, Virginica is blue — matches Imprint canonical order. Diagonal cells show stacked histograms by species; off-diagonal cells show pairwise scatter with alpha-blended markers. The petal_length/petal_width cell pair (both mirrored positions) carries a green accent border highlighting the strongest correlation.
      Legibility verdict: PASS — all text readable, no overlap, no clipping at canvas edges.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black, not light.
      Chrome: Title, legend, row/column labels, and tick labels all rendered in light ink/soft-gray tones, clearly visible against the dark surface — no dark-on-dark failures anywhere. Gridlines remain subtly visible. The same green accent border around the focal petal_length/petal_width pair is present and reads well on the dark surface.
      Data: Colors are identical to the light render (green/lavender/blue) — only chrome (background, text, grid) flipped, as required. Brand green #009E73 remains clearly legible on the dark background.
      Legibility verdict: PASS — all text readable, no dark-on-dark issues, no clipping.
