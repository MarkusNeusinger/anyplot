review:
  strengths:
  - 'Correct 4x4 SPLOM structure: stacked-by-species histograms on the diagonal, symmetric
    pairwise scatter off-diagonal, matching the specification exactly'
  - Shared per-variable domains keep the same variable's X range (as a column) and
    Y range (as a row) consistent, so the matrix reads coherently across cells
  - Correct Imprint palette order (green/lavender/blue) with alpha-blended markers
    (hex `A6` suffix) to reduce overplotting in dense scatter cells
  - Variable names appear only once along the left edge and bottom edge (not repeated
    per cell), matching the spec's edge-labeling requirement
  - Realistic, neutral iris-like flower dataset showing both between-species clustering
    and a genuine within-species petal-length -> petal-width correlation
  - Theme-adaptive chrome correctly threaded through legend, labels, ticks, and cell
    borders via ANYPLOT_TOKENS; data colors identical between light and dark renders
  weaknesses:
  - 'Library Mastery is generic: the grid-of-16-Chart.js-instances approach is essentially
    the only way to build a SPLOM in Chart.js and isn''t distinctive to the library
    — consider a Chart.js-specific touch (e.g. per-cell custom tooltip formatting,
    a shared crosshair plugin, or chartArea styling) to raise LM-02'
  - 'Design Excellence: every cell (including interior off-diagonal ones) has a full
    rounded border/box, giving a slightly utilitarian ''boxed-in'' look rather than
    a refined SPLOM feel — consider removing borders on interior cells or lightening
    them further, and adding a touch more breathing room around the diagonal histograms'
  - Tick labels (histogram counts, scatter axis numbers) become hard to read once
    the PNG is scaled down to mobile-thumbnail width (~400px) — consider bumping tick
    font size slightly or reducing maxTicksLimit further so labels stay legible at
    small sizes
  - 'Data storytelling is default: species color-coding is the only emphasis technique
    — consider a subtle visual cue (e.g. slightly larger/more opaque markers for the
    diagonal-adjacent petal length/width relationship, the strongest correlation in
    the dataset) to sharpen the focal insight'
  - 'CQ-01 KISS: helper functions (makeLcg, randNormal, getDomain, histogramBySpecies)
    are reasonable for a 4x4 grid but move away from a flat imports->data->plot script
    structure'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1-consistent) page background with each of the 16 grid cells drawn on a very slightly lighter elevated panel with a thin subtle border and rounded corners.
      Chrome: Title "scatter-matrix · javascript · chartjs · anyplot.ai" is bold dark ink, clearly legible and centered at top. A centered legend row (Setosa/Versicolor/Virginica swatches + labels) sits below the title in dark ink. Row variable labels (rotated, vertical) appear only on the far-left edge; column variable labels appear only along the bottom edge. Tick labels are soft dark gray, readable at full resolution, though small on tightly-packed diagonal histogram cells.
      Data: Diagonal cells show stacked histograms of each variable split by species; off-diagonal cells show scatter plots colored by species. First series (Setosa) renders in Imprint brand green #009E73, Versicolor in lavender #C475FD, Virginica in blue #4467A3 — all semi-transparent to handle overlap.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17-consistent) page background with cell panels on a slightly lighter elevated dark surface, same thin border/rounded-corner treatment as light mode.
      Chrome: Title and legend text render in light off-white ink, clearly legible against the dark background. Row/column variable labels and tick labels are light gray, all readable — no dark-on-dark or light-on-light failures observed anywhere in the grid.
      Data: Same three species colors (#009E73 green, #C475FD lavender, #4467A3 blue) as the light render — confirmed identical; only the chrome (background, borders, text) flips between themes.
      Legibility verdict: PASS
