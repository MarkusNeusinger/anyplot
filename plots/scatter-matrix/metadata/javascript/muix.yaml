review:
  strengths:
  - Custom SPLOM grid composed cleanly from ScatterChart + BarChart, with correct
    per-edge axis handling — only the outermost row/column show axis lines, ticks,
    and labels, avoiding clutter in interior cells
  - Deterministic Box-Muller LCG generates realistic Iris-like data with genuine within-species
    petal length/width correlation, not just cluster separation
  - Petal-length/petal-width cells are subtly highlighted with a tinted border, giving
    the matrix a clear focal point without hiding the other 14 panels — good data
    storytelling
  - 'Full palette/theme compliance: canonical Imprint order for the three species,
    correct light/dark backgrounds, and the theme-adaptive MUTED semantic anchor is
    used appropriately for the univariate diagonal histograms'
  - Symmetric matrix with consistent shared per-variable domains across rows and columns,
    matching the spec's explicit symmetry requirement
  weaknesses:
  - Edge tick labels (12px) are noticeably smaller than the 22px title — a small bump
    (13-14px) would improve legibility at thumbnail/mobile scale without crowding
    the small matrix cells
  - 'LM-02 is only moderately distinctive: the composition is clever but leans on
    generic ScatterChart/BarChart defaults per cell — a small per-species touch (e.g.
    distinct marker shapes) would showcase more of MUI X''s community surface'
  - No inline comment explains why Box-Muller normal sampling was chosen over simpler
    uniform noise for the synthetic data — a one-line rationale would help future
    readers
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (~#FAF8F1), not pure white — matches spec.
      Chrome: Title "scatter-matrix · javascript · muix · anyplot.ai" in bold dark ink, top-right legend (Setosa/Versicolor/Virginica) in secondary-ink text, axis titles ("Sepal Length (cm)", "Sepal Width (cm)", "Petal Length (cm)", "Petal Width (cm)") along the bottom/left edges, tick labels in soft gray. All clearly legible against the light background.
      Data: 4x4 matrix. Diagonal cells show gray (muted-anchor) histograms of each variable's univariate distribution. Off-diagonal cells show scatter plots colored by species — Setosa green (#009E73), Versicolor lavender/purple, Virginica blue — matching canonical Imprint order. The petal-length × petal-width pair (both directions) is subtly highlighted with a thin green-tinted cell border, drawing the eye to the clearest species separation. Matrix is symmetric (same variable pair appears transposed in both triangles).
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black (~#1A1A17), not pure black — matches spec.
      Chrome: Title and legend text switch to light ink/soft-light gray, axis titles and tick labels flip to light tones, grid/cell borders flip to the dark-theme rule color. All text remains clearly legible against the dark background — no dark-on-dark failures observed.
      Data: Colors are visually identical to the light render (same green/lavender/blue hues for Setosa/Versicolor/Virginica, same muted-gray histogram bars) — only chrome flipped, as required.
      Legibility verdict: PASS
