review:
  strengths:
  - Each variable has one padded domain, reused by its whole row, its whole column
    and the bins of its diagonal histogram, so ranges line up across the grid and
    the upper triangle mirrors the lower exactly
  - 'The left column and bottom row are widened by a fixed axis band (Y_BAND/X_BAND),
    so every cell keeps the same drawing area; inner cells hide their axes with position:
    "none"'
  - The diagonal BarChart pairs a band axis for the bins with a second, hidden linear
    x axis on the variable's domain, so the histogram shares its column's scale
  - 'A neutral muted histogram on the diagonal keeps the distributions quieter than
    the species-colored scatter cells; the Imprint order holds (Setosa #009E73 first)
    and the colors are identical in both themes'
  - Tick labels capped at about 4 per edge axis (tickNumber) do not run into the neighbouring
    cells; the theme tokens carry all the chrome in both renders
  - Seeded LCG plus Box-Muller produces Iris-shaped data (n = 150, three species,
    petal width tracking petal length), with native MUI X hover tooltips in the HTML
    output
  weaknesses:
  - 'VQ-03 (both): in the two outlined focal cells (Petal length × Petal width), markers
    grow to markerSize 4 and the 50 Setosa points merge into one opaque green blob
    where single points can no longer be told apart; the spec asks for small, translucent
    points → the same markerSize 3 as every other cell, or a lower fillOpacity in
    those cells (about 0.5). Likely cause: markerSize: focal ? 4 : 3.'
  - 'Suggestion: the edge axis lines sit about 3 px inside the cell frames, so the
    left and bottom edges read as a double line; aligning the frame inset with the
    axis line would make the edges cleaner.'
  - 'Suggestion: the species legend is hand-built HTML spans; a native ChartsLegend
    inside a ChartsDataProvider would show more of MUI X.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the page and every cell.
      Chrome: bold title "scatter-matrix · javascript · muix · anyplot.ai" at the top center (about 38 % of the width), a gray subtitle "n = 150 · outlined: strongest correlation, r = 0.98 (Petal length (cm) × Petal width (cm))", and an HTML legend with Setosa, Versicolor and Virginica dots. A 4×4 grid of framed cells with thin grid-colored borders. Rotated y labels (Sepal length, Sepal width, Petal length, Petal width (cm)) on the left, x labels on the bottom; tick labels are dark gray, sparse (about 4 per axis), and none collide. All text is readable.
      Data: off-diagonal scatters in Setosa #009E73, Versicolor purple and Virginica blue (Imprint order), small translucent points; the diagonal shows gray translucent 12-bin histograms (bimodal for the petal variables). The two Petal length × Petal width cells have a thicker inkSoft outline and slightly larger markers; their Setosa cluster is a dense opaque blob. The grid is symmetric.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, subtitle, legend, axis labels and tick labels all in light ink, readable; no dark-on-dark. Cell borders are subtle dark gray, and the focal outline is light gray.
      Data: the species colors are identical to the light render; the histograms switch to the dark muted gray (#A8A79F at 50 % opacity) and stay visible. Brand green is clearly visible.
      Legibility verdict: PASS
