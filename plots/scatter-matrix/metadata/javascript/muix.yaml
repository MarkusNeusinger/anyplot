review:
  strengths:
  - 'A true 4x4 SPLOM built from 16 MUI X charts on a CSS grid: every cell has the
    same drawing area, and the left column and bottom row are widened by their axis
    bands, so each column shares its x range and each row its y range and the upper
    triangle mirrors the lower exactly'
  - 'Diagonal histograms use the BarChart with a hidden band axis for the bins plus
    a hidden-or-edge linear axis on the variable''s padded domain: the bars line up
    with the scatter columns above them, and the edge cells still carry the variable''s
    ticks'
  - Small markers (markerSize 3) at 0.55 fill opacity show each cloud's shape; the
    three species keep the same Imprint colors (#009E73 first) in every cell, with
    one shared legend in the header
  - The focal pair, the strongest linear correlation, is computed from the data and
    outlined in both triangles with the inkSoft frame; the subtitle names it (r =
    0.98, petal length x petal width). That gives the grid a reading entry point without
    adding a data layer
  - Variable names with units sit only on the left and bottom edges; about 4 ticks
    per edge axis keep neighboring cells' labels apart; theme tokens are used for
    all chrome, so both renders read cleanly
  - Iris-shaped deterministic data (fixed-seed LCG, 50 per species, petal width tied
    to petal length within species) shows clusters, strong and weak correlations and
    bimodal distributions
  weaknesses:
  - 'Suggestion: the 1 px cell frame sits 3 px outside the axis line on the left column
    and bottom row, which reads as a double edge; aligning the frame with the axis
    line, or dropping the axis line where the frame already draws the edge, would
    tidy those cells.'
  - 'Suggestion: the diagonal histograms could take a fill tied to the overall data
    (for example, stacked per-species bars in the palette colors) so the distributions
    connect visually to the colored scatter cells.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole 2400x2400 canvas; cells framed with a subtle 1 px grid-colored border.
      Chrome: bold title "scatter-matrix · javascript · muix · anyplot.ai" centered at top, a gray subtitle "n = 150 · outlined: strongest correlation, r = 0.98 (Petal length (cm) × Petal width (cm))", and a header legend (Setosa, Versicolor, Virginica). Y-axis titles (Sepal length/width, Petal length/width, all in cm) are rotated on the left edge; x-axis titles are along the bottom; about 4 dark-gray tick labels per edge axis. Everything is readable, with no overlap and no clipping.
      Data: 4x4 grid. Off-diagonal cells are scatters of small translucent dots in #009E73 green (Setosa, first series), purple (Versicolor) and blue (Virginica). Diagonal cells are muted gray histograms with 12 bins, Setosa separating clearly in the petal histograms. The petal length × petal width cells (row 3/col 4 and row 4/col 3) carry a 2 px dark outline as the focal pair.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17; cell frames are subtle dark-gray lines.
      Chrome: title, axis titles and legend text are light (ink); tick labels and the subtitle are light gray (inkSoft). There is no dark-on-dark text and everything is readable. The focal outline flips to a light inkSoft frame.
      Data: the green, purple and blue species colors are identical to the light render. The histograms use the lighter muted anchor (#A8A79F at 0.5 opacity), which shows as mid-gray. The marks are clearly distinguishable from the background, and brand green reads well.
      Legibility verdict: PASS
