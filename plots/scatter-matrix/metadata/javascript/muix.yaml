review:
  strengths:
  - 'Correct Imprint palette in canonical order — Setosa is #009E73 (brand green,
    always first), Versicolor #C475FD, Virginica #4467A3 — identical across both themes'
  - Shared per-variable domains keep every row and column aligned across the whole
    4x4 matrix, a correctness detail many SPLOM implementations miss
  - Diagonal univariate histograms correctly use the theme-adaptive 'muted' semantic
    anchor instead of a categorical color, distinguishing the aggregate distribution
    from the per-species scatter data
  - Deterministic LCG/Box-Muller synthetic iris-like data with genuine within-species
    correlation between petal length and width (not just cluster separation)
  - Edge-only axis labeling (left column, bottom row) keeps the dense 4x4 grid uncluttered
    while satisfying the spec's 'variable names along the edges' requirement
  - 'Theme-correct chrome in both renders — no dark-on-dark or light-on-light failures,
    backgrounds match #FAF8F1/#1A1A17'
  weaknesses:
  - Axis tick labels (11px CSS / ~22 source-px) are legible at full desktop resolution
    but are on the small side for a chart this data-dense — likely to fall below readable
    size once the PNG is scaled down to a ~400px mobile width. Consider bumping EDGE_TICK
    to 12-13 if it doesn't cause overlap with the histogram/scatter tick counts.
  - The 16 cells touch each other with only a 1px border and no inter-cell gap, giving
    the matrix a slightly spreadsheet/grid-like look rather than the generous whitespace
    the style guide favors — consider a few px of gap between cells or a lighter border
    color to soften the boxed appearance.
  - Species-color clustering is the only storytelling device; the matrix relies entirely
    on the reader scanning 16 panels to notice which variable pairs separate species
    best (e.g., petal length vs. petal width) — a subtle visual cue (e.g., slightly
    larger/more opaque markers on the most-informative cells) could reinforce the
    strongest pairwise story without adding clutter.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "scatter-matrix · javascript · muix · anyplot.ai" top-left in bold dark ink; legend (Setosa/Versicolor/Virginica swatches + labels) top-right in dark/soft-dark ink; axis labels ("Sepal Length (cm)", "Sepal Width (cm)", "Petal Length (cm)", "Petal Width (cm)") along the left column and bottom row in dark ink; tick labels in a softer dark gray. All text is clearly readable against the light background.
      Data: 4x4 grid — diagonal cells show gray/muted histograms of each variable's overall distribution; off-diagonal cells show scatter plots colored by species (Setosa green #009E73, Versicolor lavender #C475FD, Virginica blue #4467A3), each with ~50 points per species and semi-transparent markers. Setosa clearly separates from the other two species on petal measurements; Versicolor and Virginica overlap more, especially on sepal width.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title/legend/axis-label layout, now rendered in light ink (near-white) and soft light-gray for tick labels and legend text. No dark-on-dark instances found — all chrome elements are clearly visible against the dark background.
      Data: Data colors are identical to the light render — Setosa green, Versicolor lavender, Virginica blue at the same positions and same species pattern. Diagonal histograms use a lighter muted gray appropriate for the dark surface.
      Legibility verdict: PASS
