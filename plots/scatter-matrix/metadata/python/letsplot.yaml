review:
  strengths:
  - Shared limits per variable (scale_x/y_continuous(limits=...)) keep each column's
    x range and each row's y range identical across the grid
  - Theme tokens threaded through every cell, title and legend; data colors identical
    in light and dark
  - Full variable names with units along the left and bottom edges, sparse ticks that
    never collide between cells
  - Compact data generation from a per-species (mean, std) profile dict
  weaknesses:
  - 'VQ-07 (both): a pure-white #FFFFFF frame about 24 px wide surrounds the canvas,
    glaring around the #1A1A17 dark render → the page color PAGE_BG to the canvas
    edge. Likely cause: ggbunch''s own plot background is not themed; add theme(plot_background=element_rect(fill=PAGE_BG,
    color=PAGE_BG)) to the ggbunch object.'
  - 'VQ-05 (both): the hand-built legend''s species labels (geom_text size=7, about
    40 px cap height) are larger than the 11 pt axis titles, and the gap from ''Versicolor''
    to the Virginica key is about 35 px against about 110 px after ''Setosa'' → labels
    at about the axis-title size with even spacing. Likely cause: geom_text size=7
    with a fixed nudge_x on evenly spaced positions regardless of label length.'
  - 'SC-02 (both): C2 — panel left edges shift between rows of the same column (column
    1: about 135 px in the histogram row vs about 118 px in the scatter rows; column
    3 likewise), so a point cannot be traced straight down a column → align panel
    edges, e.g. a fixed y-tick label width or gggrid with align=True. Likely cause:
    independent ggbunch cells whose y tick labels (''20'' vs ''4'') have different
    widths.'
  - 'CQ-01 (code): def cell_theme() is a function that returns a constant theme →
    a plain variable cell_theme = theme(...). Likely cause: helper kept from an earlier
    draft.'
  - 'Suggestion: a slight emphasis on the strongest relationship (petal length vs
    petal width) would give the grid a focal point.'
