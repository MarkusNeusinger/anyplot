review:
  strengths:
  - Shared limits per variable (scale_x/y_continuous(limits=...)) keep each column's
    x range and each row's y range identical across the grid
  - gggrid(align=True) lines up panel edges across cells whose tick labels differ
    in width, so points trace straight down a column
  - Theme tokens threaded through every cell, the title, the legend and the composite
    background; page color reaches the canvas edge and data colors are identical in
    light and dark
  - Full variable names with units along the left and bottom edges, sparse ticks that
    never collide between cells
  - Compact data generation from a per-species (mean, std) profile dict
  weaknesses:
  - 'SC-03 (both): the diagonal histograms keep their count axis (0–20, 0–10) on the
    left edge, so in the first column the ticks under the ''Sepal Length (cm)'' row
    title read as sepal lengths of 0–20 cm → no count ticks on the diagonal cells
    (or a y scale that does not compete with the row title). Likely cause: the diagonal
    cells get the same cell_theme axis_text as the scatter cells.'
  - 'Suggestion: stacked or narrower dodged histograms on the diagonal would avoid
    the blended colors where the three species overlap at alpha 0.7.'
  - 'Suggestion: the band between the bottom axis titles and the legend is wide; a
    smaller margin_bottom would give the cells a little more room.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 edge to edge, no white frame.
      Chrome: bold dark title 'scatter-matrix · python · letsplot · anyplot.ai' centred at the top; variable names with units ('Sepal Length (cm)' … 'Petal Width (cm)') in dark INK on the left and bottom edges; soft-gray sparse tick labels; subtle gray grid; dark panel frames. Panel edges aligned across rows and columns.
      Data: 4x4 grid; off-diagonal scatters in #009E73 (Setosa), #C475FD (Versicolor), #4467A3 (Virginica) at alpha 0.7; diagonal overlaid histograms per species with count axes. One legend below the grid: three colored dots with species names at about tick-label size, evenly spaced.
