review:
  strengths:
  - facet_grid('var_y ~ var_x', scales='free') gives each column one x range and each
    row one y range
  - Native geom_density per species on the diagonal layered via data=
  - 'Imprint palette with #009E73 first and theme-correct chrome in both renders'
  weaknesses:
  - 'VQ-05 (both): the canvas is 4200x4200 instead of 2400x2400, rows are separated
    by gaps about as tall as the cells and the legend floats isolated at the far right
    → 2400x2400 with the legend next to the grid (-1800 px each side). Likely cause:
    figure_size=(14, 14) and save(dpi=300, width=14, height=14).'
  - 'VQ-02, SC-02 (both): the Sepal Width column''s x tick labels run together into
    ''2.02.53.03.54.04.5'' → 2-3 ticks per cell. Likely cause: default breaks at axis_text
    size 16 in narrow cells.'
  - 'VQ-03, SC-02 (both): 150 points per cell drawn at size 3.5, alpha 0.7 merge into
    opaque blobs, and the diagonal densities are slivers at the bottom of their cells
    → points about size 1 at alpha 0.5-0.6 and densities scaled to the cell. Likely
    cause: geom_point(size=3.5, alpha=0.7) and geom_density on the row''s shared y
    scale.'
  - 'SC-03, SC-02 (both): the diagonal densities share the row''s variable axis, stretching
    rows 1-2 down to 0 so the scatter clouds occupy only the upper half of their cells
    and density is read on a cm axis → draw the diagonal curves rescaled into the
    variable''s own range. Likely cause: geom_density on facet_grid with the row''s
    y scale.'
  - 'SC-02 (both): variable names appear on the top and right strips instead of along
    the left and bottom edges as the Notes ask → strips at left and bottom. Likely
    cause: facet_grid without switch=''both''.'
  - 'SC-04 (both): the title ''scatter-matrix · plotnine · anyplot.ai'' lacks the
    language segment → ''scatter-matrix · python · plotnine · anyplot.ai''. Likely
    cause: labs(title=...) string.'
  - 'CQ-04 (code): lines 63-77 build the long frame row by row in a triple Python
    loop over every observation, and the palette comment says ''Okabe-Ito'' above
    Imprint values → one comprehension of pd.DataFrame blocks passed to pd.concat,
    and a correct comment. Likely cause: scalar iloc loop.'
