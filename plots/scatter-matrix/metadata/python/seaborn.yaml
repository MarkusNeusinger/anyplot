review:
  strengths:
  - Single sns.pairplot call with vars=, hue= and diag_kind='kde' builds the full
    symmetric 4x4 matrix with shared row/column axes
  - sns.move_legend places one legend for the whole grid below the matrix, clear of
    every cell
  - MaxNLocator(3) keeps tick labels sparse so neighboring cells never collide
  - Small translucent points (s=14, alpha 0.7, thin page-colored edge) show each cloud's
    shape; common_norm=False keeps every segment's KDE readable
  - Exact 2400x2400 canvas and correct theme-adaptive chrome; Imprint colors identical
    in both renders
  weaknesses:
  - 'VQ-01 (both): tick labels at 5.5 pt and axis titles at 7 pt sit below the style
    guide''s 8 pt / 10 pt and read small beside the 8 pt legend text → ticks about
    7 pt (+1.5 pt) and axis titles about 9 pt (+2 pt), which the sparse 3-tick locator
    leaves room for. Likely cause: ax.tick_params(labelsize=5.5) and set_xlabel/set_ylabel(fontsize=7)
    in the per-axes loop.'
  - 'Suggestion: tighten the legend''s column spacing (columnspacing) so the box does
    not span nearly half the canvas width.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, square 2400x2400 canvas
      Chrome: title 'scatter-matrix · python · seaborn · anyplot.ai' in dark ink at the top; variable names (Annual Return (%), Volatility (%), P/E Ratio, Dividend Yield (%)) along the left and bottom edges in dark ink; sparse tick labels (2-3 per axis) in soft ink; subtle grid; legend 'Segment' with Growth/Value/Dividend in a framed box centered below the grid. All readable; ticks are small (5.5 pt).
      Data: 4x4 matrix, KDE fills on the diagonal, scatters off-diagonal; Growth #009E73 first, Value #C475FD, Dividend #4467A3; small translucent points
      Legibility verdict: PASS

