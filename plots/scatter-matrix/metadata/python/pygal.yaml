review:
  strengths:
  - 'A true 4×4 SPLOM built inside one pygal XY chart: every column shares its x range
    and every row its y range, so the upper triangle mirrors the lower and a point
    can be traced across the grid'
  - Diagonal histograms (np.histogram, Sturges bins) drawn as filled step outlines
    on each cell's floor, aligned to the same x scale as the scatter cells above and
    below them
  - Sparse nice-number ticks (3–5 per cell) with guides only at tick positions per
    cell; no tick labels of neighbouring cells collide
  - 'Clear typographic hierarchy: bold variable names on the left and bottom edges,
    regular soft-ink tick labels, framed cells with a 0.1-cell gap'
  - 'Theme tokens threaded through Style and inline CSS: identical #009E73 data in
    both renders, chrome flips cleanly, nothing unreadable on #1A1A17'
  - 'Idiomatic pygal tricks: None-interrupted series (allow_interruptions) for frames
    and histogram outlines, print_labels point labels for all text, per-series inline
    CSS for anchors and opacity; HTML output keeps pygal''s native hover'
  weaknesses:
  - 'DQ-03 (both): the Iris-like data reaches petal lengths of about 8.1 cm and petal
    widths of about 3.4 cm, beyond what iris flowers show (about 6.9 cm and 2.5 cm)
    → keep petal length under about 7 cm and petal width under about 2.6 cm (about
    −1.2 cm and −0.8 cm at the top). Likely cause: the log-normal petal formulas 3.8
    * np.exp(size * 0.4 …) and 1.2 * np.exp(size * 0.5 …) with an unbounded size factor.'
  - 'DE-02 (both): in the Sepal width column the tick guide at 4 sits about 2 px inside
    the cell''s right frame, so every cell of that column shows a doubled right edge
    → skip a guide that falls within about 1 % of the cell edge. Likely cause: the
    tick loop draws guides for ticks up to hi without excluding the frame position.'
  - 'Suggestion: coloring the points by a species grouping (the Notes allow categorical
    color) would show clusters, the most telling structure of an iris SPLOM.'
  - 'Suggestion: the left variable-name column takes about 20 % of the width; wrapping
    the unit onto a second line would give the grid more room.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across canvas and plot area, 2400×2400 square.
      Chrome: monospace title "scatter-matrix · python · pygal · anyplot.ai" in dark ink at top (~73 % width); bold dark variable names "Sepal length (cm)", "Sepal width (cm)", "Petal length (cm)", "Petal width (cm)" on the left of each row and below each column; soft-ink tick labels (3–5 per cell) on the left and bottom edges; thin translucent cell frames and per-cell guides. All text readable, no collisions.
      Data: 4×4 grid; diagonal cells hold filled #009E73 histograms; off-diagonal cells hold ~100 small translucent #009E73 points each, showing strong positive sepal-length/petal correlations and negative sepal-width correlations, mirrored across the diagonal. Columns share x ranges, rows share y ranges.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title and bold variable names in light ink #F0EFE8, tick labels in light soft ink, frames and guides as faint light rules — no dark-on-dark text anywhere.
      Data: identical #009E73 histograms and points in the same positions as the light render; only chrome flipped.
      Legibility verdict: PASS
