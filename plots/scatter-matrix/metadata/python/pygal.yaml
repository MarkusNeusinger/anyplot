review:
  strengths:
  - 'Builds the full 4×4 SPLOM inside one pygal.XY chart: every variable is scaled
    into a unit cell, so each column shares its x range and each row its y range,
    and the upper triangle mirrors the lower exactly as the spec asks'
  - 'Uses pygal''s own mechanics for the grid: allow_interruptions with (None, None)
    separators draws all cell frames, guides and histogram outlines as single series,
    and print_labels point labels carry the tick and variable-name text'
  - Diagonal histograms come from np.histogram with Sturges bins on the cell's own
    x scale, filled as a step outline sitting on the cell floor
  - Variable names in bold on the left and bottom edges, with three to five tick values
    per cell, so neighboring cells' ticks stay apart
  - 'Theme tokens threaded through Style (background, ink, soft ink, rule) — both
    renders read cleanly; points use #009E73 at 0.65 opacity so the 0.1 cm measurement
    lattice shows as darker overlapping dots'
  - Iris-like data driven by one shared size factor gives positive and negative correlations
    and skewed log-normal petal distributions in plausible centimetre ranges
  weaknesses:
  - 'VQ-02 (both): the bottom row''s name "Petal width (cm)" ends about 10 px before
    its "1.5" tick label, so they read as one run "(cm)1.5" → leave at least 30 px
    between the row names and the y tick labels (about +20 px). Likely cause: row_names
    placed at x = -0.25 while the y ticks right-align at x = -0.04 with name_room
    sized for the 40 px font only in xrange, not in the label position.'
  - 'Suggestion: the HTML tooltips show the scaled unit-cell coordinates instead of
    the measurements; per-point labels or a formatter carrying the original values
    would make the hover useful.'
  - 'Suggestion: a little less empty space below the bottom variable names would balance
    the canvas.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole 2400×2400 canvas.
      Chrome: title "scatter-matrix · python · pygal · anyplot.ai" in dark ink at the top (~74 % width); bold dark variable names on the left (rows) and bottom (columns); soft-gray tick labels (3–5 per cell); thin gray cell frames and interior guides aligned to ticks. All text readable; the "Petal width (cm)" row name nearly touches its "1.5" tick.
      Data: 4×4 grid; 12 off-diagonal scatters of 100 #009E73 points at partial opacity (darker where rounded values coincide), diagonal cells with filled green histograms. Positive sepal-length/petal correlations, negative sepal-width correlations; upper triangle mirrors lower.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, bold variable names in light ink; tick labels in light soft gray; cell frames and guides in subtle light rule. No dark-on-dark text.
      Data: identical #009E73 points and histograms (blended darker on the dark surface by the same opacity); same layout and values as the light render.
      Legibility verdict: PASS
