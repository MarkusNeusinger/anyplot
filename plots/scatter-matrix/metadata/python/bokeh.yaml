    the CDP viewport override, and per-figure toolbars not disabled (toolbar_location=None
    on each figure).'
  - 'SC-02 (both): C3 missed, the variable names along the bottom edge are not visible
    because the bottom row''s x-axis titles fall off the canvas → Sepal Length / Sepal
    Width / Petal Length / Petal Width under the bottom row. Likely cause: the oversized
    grid pushes the bottom axes past the PNG.'
  - 'SC-03 (both): the bottom row shows Petal Width only down to about 0.3, so the
    lowest Setosa points and the 0 baseline of the last histogram are off the canvas,
    and the top-left histogram''s count axis (0-12) sits under the ''Sepal Length''
    row label → all data inside the axes, and the diagonal''s count axis not presented
    as the row variable. Likely cause: canvas overflow; the diagonal figure carries
    y_axis_label for its count axis.'
  - 'SC-04 (both): title reads ''scatter-matrix · bokeh · anyplot.ai'' without the
    language segment → ''scatter-matrix · python · bokeh · anyplot.ai''. Likely cause:
    the Title text string.'
  - 'VQ-01 (both): tick labels 16pt, axis titles 20pt, title 28pt and legend 16pt
    are about half the bokeh reference (34/42/50/34pt) and read small on the canvas
    → toward the reference sizes. Likely cause: the font-size assignments at lines
    94, 135-138, 158.'
  - 'VQ-03 (both): the overlaid species histograms at alpha 0.7 blend into colors
    that are in no legend (teal, slate) in the Sepal Width and Sepal Length diagonals,
    hiding which species a bar height belongs to → lower alpha (about 0.45) so each
    species'' bars stay readable. Likely cause: quad alpha=0.7.'
  - 'VQ-06 (both): axis titles ''Sepal Length'' etc. carry no unit → ''Sepal Length
    (cm)''. Likely cause: var_names list.'
  - 'Suggestion: a focal emphasis such as the clean Setosa separation could guide
    the eye.'
