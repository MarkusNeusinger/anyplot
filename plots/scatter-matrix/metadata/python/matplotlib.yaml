review:
  strengths:
  - Shared column x-limits and row y-limits computed from the data (limits dict) so
    every point can be traced across the grid and the upper triangle mirrors the lower
  - Diagonal histograms share one bin edge set per variable across species (np.histogram_bin_edges),
    so the overlaid species distributions are directly comparable
  - Small (s=9), translucent (alpha=0.6) edgeless points let each cell show the shape
    of its cloud and the three species clusters
  - MaxNLocator(nbins=3, prune='both') keeps tick labels sparse so neighbouring cells
    never collide
  - Diagonal cells on the elevated surface separate distributions from scatters; one
    horizontal legend serves the whole grid
  - All chrome threaded through theme tokens; both renders theme-correct with identical
    Imprint data colors
  weaknesses:
  - 'VQ-01 (both): tick labels at 6 pt, below the style guide''s 8 pt reference, read
    small beside the 8 pt axis titles → 7–8 pt (+1 to +2 pt), which the 3-tick pruning
    leaves room for. Likely cause: ax.tick_params(labelsize=6).'
  - 'Suggestion: the empty band between the legend and the top row (about 7 % of the
    canvas height) could go to the grid by raising top= in subplots_adjust or lowering
    the legend anchor.'
  - 'Suggestion: the handles comprehension enumerates groups but never uses k; `for
    group in groups` is enough.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 page, diagonal cells on the slightly lighter elevated surface #FFFDF6.
      Chrome: title "scatter-matrix · python · matplotlib · anyplot.ai" centred at top (~65 % width), dark ink; framed horizontal legend "Species" (Setosa, Versicolor, Virginica) below it; variable names with units along the left and bottom edges in dark ink; small soft-ink tick labels (3 or fewer per axis), subtle grid, top/right spines removed. All readable.
      Data: 4×4 square grid (2400×2400). Off-diagonal: small translucent points, Setosa #009E73, Versicolor #C475FD, Virginica #4467A3; Setosa forms a separate cluster in every petal cell. Diagonal: overlaid per-species histograms with shared bins. Columns share x range, rows share y range.
      Legibility verdict: PASS

