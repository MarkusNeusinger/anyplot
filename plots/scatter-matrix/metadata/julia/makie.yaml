review:
  strengths:
  - Correlation-scan loop finds the strongest |r| pair and highlights it with a thicker
    green spine and an r = ... annotation, a clear fix for attempt 1's "no focal point"
    weakness
  - linkxaxes!/linkyaxes! explicitly guarantee identical per-column/per-row axis ranges,
    a distinctive Makie idiom rather than relying on each Axis picking its own limits
  - Tick label size increased from 9pt to 10pt in direct response to attempt 1's mobile-legibility
    note
  - 'Correct SPLOM structure retained: diagonal KDE, off-diagonal scatter, edge-only
    labels, first categorical series exactly #009E73'
  - Theme-adaptive chrome threaded correctly through all 16 Axis instances, the focal
    highlight, the annotation, and the Legend, with no dark-on-dark/light-on-light
    failures
  - Exact 2400x2400 canonical canvas, no clipping
  weaknesses:
  - At small mobile-thumbnail scale, 10pt tick labels across a 4x4 grid are still
    the tightest legibility element; further headroom is limited without reworking
    panel spacing, so this is a soft, diminishing-returns item rather than a hard
    failure
  - Axis labels lack units (e.g. "Sepal Length" vs. "Sepal Length (cm)"); the spec
    doesn't require units and the labels are otherwise descriptive, so this is a minor
    polish opportunity only
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 across all 16 panels of the 4x4 SPLOM.
      Chrome: Bold dark-ink title "scatter-matrix · julia · makie · anyplot.ai" centered at top; axis labels ("Sepal Length", "Sepal Width", "Petal Length", "Petal Width") shown only on bottom row / left column per SPLOM convention; legend "Species" on an elevated off-white panel at right. All readable.
      Data: Off-diagonal panels show alpha=0.6 scatter points colored by species (setosa #009E73, versicolor #C475FD, virginica #4467A3); diagonal panels show filled per-species KDE curves in the same colors. The Petal Length x Petal Width pair (strongest correlation, r≈0.96) is highlighted with a thicker green spine and an "r = ..." text annotation, giving the matrix a clear focal point. First categorical series confirmed as #009E73 (setosa).
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 across all 16 panels.
      Chrome: Title, axis labels, and legend text render in light ink and remain clearly visible; tick labels use the softer light-gray ink token (10pt) and are distinguishable. No dark-on-dark failures observed.
      Data: Colors identical to the light render (setosa green, versicolor lavender, virginica blue) — only chrome flipped, as required. Same focal-pair spine highlight and r annotation present and legible against the dark background.
      Legibility verdict: PASS
