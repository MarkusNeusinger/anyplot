review:
  strengths:
  - 'Correct SPLOM structure: diagonal panels show per-species KDE density curves,
    off-diagonal panels show pairwise scatter, with y-axis labels restricted to the
    left column and x-axis labels/ticks restricted to the bottom row, matching standard
    scatter-matrix conventions'
  - 'First categorical series is exactly brand green #009E73 (setosa), with versicolor/virginica
    following the canonical Imprint palette order (#C475FD, #4467A3), identical between
    light and dark renders'
  - Theme-adaptive chrome is threaded correctly through every one of the 16 Axis instances
    plus the Legend and title Label, with no dark-on-dark or light-on-light failures
    in either render
  - Real, neutral iris dataset (150 points, 3 species, 4 continuous variables) with
    all data points shown per panel and appropriate alpha=0.6 + markersize=7 to manage
    overplotting
  - 'Clean, idiomatic Makie code: a single nested loop builds the Axis grid, uses
    density! for diagonal KDEs, a manually constructed Legend with MarkerElement,
    correct px_per_unit=2 save producing the exact 2400x2400 canonical canvas'
  - Title format is exactly 'scatter-matrix · julia · makie · anyplot.ai' and legend
    labels match the species names
  weaknesses:
  - At the ~400px mobile thumbnail scale, the 9pt tick labels across the 4x4 grid
    become essentially illegible (title, axis labels, and legend remain readable)
    — consider bumping xticklabelsize/yticklabelsize slightly (e.g. 9 -> 10-11) if
    there is headroom before panels start crowding each other
  - 'Design excellence is solid but generic for a Makie SPLOM: no additional visual
    hierarchy beyond color and density shape (e.g. no highlighting of the strongest
    correlated pair, no correlation coefficients, no diagonal panel emphasis) to guide
    the viewer toward a specific insight'
  - 'Library mastery is competent but not distinctive: the grid is built with a plain
    nested Axis loop rather than leveraging any Makie-specific SPLOM idioms (e.g.
    linkxaxes!/linkyaxes! to guarantee bit-identical per-column/row ranges, or hidedecorations!
    helpers) beyond the manual per-axis visibility flags already used'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 across all 16 panels and the outer figure background.
      Chrome: Title "scatter-matrix · julia · makie · anyplot.ai" is bold, dark ink, clearly legible at top. Axis labels ("Sepal Length", "Sepal Width", "Petal Length", "Petal Width") appear only along the bottom row and left column, dark ink, readable. Tick labels are small (9pt) but readable at full resolution in soft ink-gray. Grid lines are faint and subtle. Legend ("Species": setosa/versicolor/virginica) sits to the right on a slightly elevated off-white panel with a borderless frame, fully legible.
      Data: Off-diagonal panels show scatter points colored by species (setosa = #009E73 green, versicolor = #C475FD lavender, virginica = #4467A3 blue) at alpha 0.6. Diagonal panels show filled KDE density curves per species in the same three colors with a stroked outline.
      Legibility verdict: PASS (full-resolution tick labels are small but legible; see weaknesses for mobile-thumbnail note).

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 across all panels and the figure background.
      Chrome: Title, axis labels, and legend text render in light ink (#F0EFE8), clearly visible against the dark background — no dark-on-dark failures observed. Tick labels use the softer light-gray ink token and remain distinguishable from the background. Grid lines are faint but visible.
      Data: Data colors (setosa green, versicolor lavender, virginica blue) are pixel-identical to the light render — only the chrome (background, ink tokens, legend panel) flipped, as required.
      Legibility verdict: PASS (no dark-on-dark or light-on-light issues; all chrome elements read correctly against the dark surface).
