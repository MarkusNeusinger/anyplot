review:
  strengths:
  - band! between the drawdown and zeros(n) gives the semi-transparent red loss fill
    with a clearly visible zero baseline in both themes
  - Hollow stroke-only circle marks the max-drawdown trough, and the stats text (Max
    DD -52.6%, duration 135 days, recovery pending) matches the curve and stays clear
    of it
  - 'Theme-adaptive chrome complete: all text, ticks and spines use INK/INK_SOFT tokens;
    fill alpha raised on dark for equal presence'
  - Running maximum computed idiomatically with accumulate(max, nav)
  weaknesses:
  - 'SC-04 (both): the green triangles on the zero line have no key or direct label,
    so a reader cannot tell they mark recoveries → a key entry or a short direct label
    naming them. Likely cause: scatter! for recovery_days without a label and no axislegend.'
  - 'VQ-03 (both): the dotted leader line from the trough circle to the stats text
    is 0.8 wide and nearly vanishes on the red fill → about 1.5 (+0.7). Likely cause:
    lines! linewidth=0.8, linestyle=:dot.'
  - 'DQ-03 (code): the data comments say ''~-24% drawdown'' and ''deeper ~-38% max
    DD'', but the rendered drawdowns are about -30% and -52.6% → comments that match
    the data. Likely cause: comments written before the seed''s trajectory was checked.'
  - 'LM-01 (code): no column constants and no DataFrame df; the data is loose vectors,
    unlike the library prompt''s Data block → column constants, a df ending the #
    Data block, plot code reading df[!, COL]. Likely cause: data block written as
    bare arrays.'
  - 'CQ-05 (code): Figure(resolution = (1600, 900)) uses the deprecated keyword the
    library prompt forbids → size = (1600, 900). Likely cause: an older Makie example.'
  - 'Suggestion: real dates on the x axis (a business-day range) instead of a day
    index would match the spec''s datetime column.'
  - 'Suggestion: a background box behind the stats text could set it off from the
    fill further.'
