review:
  strengths:
  - Recovery points now indicated via green (#009E73) diamond markers placed exactly
    where drawdown returns to zero, directly fixing the prior review's SC-02 gap.
  - 'Duration and recovery-time stats added to the subtitle ("Duration: 322d · Recovery:
    189d"), completing the spec''s required key-statistics trio alongside the existing
    max-DD marker.'
  - 'Correct drawdown math retained: running-max tracked per point, formula matches
    the spec exactly.'
  - 'Semantic color choice retained and extended: matte red for loss data (with reinforcing
    opacity gradient) and green for recovery — both intentional semantic-exception
    uses of the Imprint palette.'
  - Clean theme-adaptive chrome in both renders; zero line is a clear reference baseline;
    no edge clipping.
  - Deterministic, reproducible data generation (fixed-seed LCG + Box-Muller Gaussian),
    fully in-memory per the browser-harness constraint.
  weaknesses:
  - Recovery-point diamonds have no legend or label — unlike the max-drawdown marker's
    data label, a viewer has no way to know what the green diamonds represent without
    reading the code.
  - In regions with closely-spaced recovery events (around Nov 2024), diamond markers
    cluster and partially overlap, making individual recovery events hard to distinguish.
  - Title still occupies only ~37-40% of plot width at 25px — improved from the prior
    attempt's ~33% at 22px but still well under the ~50-70% comfortable range for
    a custom-length title.
  - The spec's optional suggestion to 'consider a secondary y-axis or annotation to
    show the underlying price/value series' remains unimplemented — a minor nice-to-have,
    though explicitly optional in the spec.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "drawdown-basic · javascript · highcharts · anyplot.ai" in bold dark ink, subtitle "Max drawdown -21.3% on 2024-01-17 · Duration: 322d · Recovery: 189d" in soft gray beneath it — all three required stats now present. "Trading Date" x-axis title and month/year tick labels (Jan 2023 .. Jan 2025) along the bottom, "Drawdown from Peak" y-axis title (rotated) with percentage ticks from 0% to -24% down the left side. All chrome text is clearly legible against the light background.
      Data: A single drawdown series rendered as a matte-red (#AE3030) line with a red-to-transparent vertical gradient fill down to the zero baseline. A black-outlined scatter marker with a "Max DD: -21.3%" label sits at the deepest trough (~Jan 2024), cleanly separated from the line. New this attempt: small teal-green (#009E73) diamond markers sit along the zero line at every recovery-to-new-high point, addressing the prior review's missing recovery-point feature. A thin horizontal reference line marks the 0% baseline.
      Legibility verdict: PASS — no light-on-light issues found; margins are generous and nothing is clipped at any canvas edge.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title/subtitle/axis titles/tick labels, now rendered in light ink/soft-gray tones, fully legible against the dark background. Gridlines and the zero-baseline line are visible but subtle.
      Data: The drawdown line/fill and recovery diamonds use the identical #AE3030 and #009E73 hex values as the light render — confirmed unchanged data color. The max-drawdown marker flips to a light (near-white) fill with the same "Max DD: -21.3%" label in light ink, still cleanly separated from the line.
      Legibility verdict: PASS — no dark-on-dark failures; all text and markers read clearly against the near-black surface.
