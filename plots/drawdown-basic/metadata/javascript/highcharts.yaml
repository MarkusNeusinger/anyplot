review:
  strengths:
  - 'Correct drawdown math: running-max tracked per point, drawdown computed as (value
    - runningMax) / runningMax * 100, matching the spec''s formula exactly.'
  - 'Semantic color choice: the area/line uses Imprint palette position 5 (#AE3030,
    matte red) instead of the default first-series green — matches the style guide''s
    semantic exception for loss/drawdown data, with a gradient fill (0.5 -> 0.08 opacity)
    that reinforces depth.'
  - 'Distinct max-drawdown marker (scatter point + ''Max DD: -21.3%'' dataLabel) is
    cleanly placed with no overlap against the line or area fill in either theme (verified
    via close crop).'
  - Zero line rendered as a clear reference baseline via plotLines, and both renders
    are fully theme-correct chrome with identical data colors.
  - No edge clipping anywhere (title, axis labels, tick labels all fully visible with
    healthy margins); canvas utilization is good.
  - Deterministic, reproducible data generation via a fixed-seed LCG + Box-Muller
    gaussian, entirely in-memory as required for the browser harness.
  weaknesses:
  - Spec explicitly asks to 'indicate recovery points where drawdown returns to zero
    (new highs)' — the implementation shows no marker/annotation for any recovery
    point, even though the data has several (e.g. ~Sep 2023, ~Jun 2024, ~Sep 2024).
  - 'Spec explicitly asks to ''display key statistics: maximum drawdown percentage,
    max drawdown duration, and recovery time'' — only max drawdown % is shown (subtitle
    + point label); duration and recovery time are entirely missing from the chart.'
  - Title occupies only ~33% of plot width at the current 22px size — well under the
    ~50-70% comfortable range for a shorter custom-length title; consider a slightly
    larger title fontsize for better visual weight without risking overflow.
  - Design storytelling stops at the single max-drawdown callout; with duration/recovery
    stats added, a second annotation (e.g. marking the recovery date) would strengthen
    the narrative arc further.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "drawdown-basic · javascript · highcharts · anyplot.ai" in bold dark ink, subtitle "Max drawdown -21.3% on 2024-01-17" in soft gray beneath it, "Trading Date" x-axis title and month/year tick labels (Jan 2023 .. Jan 2025) along the bottom, "Drawdown from Peak" y-axis title (rotated) with percentage ticks from 0% to -24% down the left side. All chrome text is clearly legible against the light background.
      Data: A single drawdown series rendered as a matte-red (#AE3030) line with a red-to-transparent vertical gradient fill down to the zero baseline. A black-outlined scatter marker with a "Max DD: -21.3%" label sits at the deepest trough (~Jan 2024), cleanly separated from the line with no text/marker overlap. A thin horizontal reference line marks the 0% baseline at the top of the plot area.
      Legibility verdict: PASS — no light-on-light issues found; margins are generous and nothing is clipped at any canvas edge.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title/subtitle/axis titles/tick labels, now rendered in light ink/soft-gray tones, fully legible against the dark background. Gridlines and the zero-baseline line are visible but subtle.
      Data: The drawdown line and fill use the identical #AE3030 red and the same gradient stops as the light render — confirmed unchanged data color. The max-drawdown marker flips to a light (near-white) fill with the same "Max DD: -21.3%" label in light ink, still cleanly separated from the line with no overlap.
      Legibility verdict: PASS — no dark-on-dark failures; all text and the marker read clearly against the near-black surface.
