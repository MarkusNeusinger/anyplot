review:
  strengths:
  - Comprehensive feature coverage — semi-transparent filled drawdown area, a max-drawdown
    pin annotation, a recovery marker, a stats subtitle (max drawdown %, decline days,
    recovery days), a dual-axis NAV overlay, and a clear 0% reference line implement
    every item from the specification's Notes section.
  - Correct Imprint palette usage — Portfolio NAV uses the brand green (palette[0])
    and Drawdown uses the matte-red semantic-loss anchor (palette[4]), consistent
    and identical between light and dark renders.
  - Clean, deterministic, idiomatic ECharts code — a small fixed-seed LCG + Box-Muller
    generator produces a plausible 3-year NAV series, the mount-node contract and
    animation:false rule are followed correctly, and theme tokens are threaded through
    nearly every chrome element.
  weaknesses:
  - 'Dark-theme markPoint label uses t.pageBg (#1A1A17, near-black) as the ''27.2%''
    text color drawn on the fixed matte-red pin (#AE3030) — since the pin fill does
    not change between themes, this produces low-contrast near-black-on-dark-red text
    in the dark render, much weaker than the crisp white-on-red text in the light
    render. Fix: use a fixed high-contrast color (e.g. white) for the pin label instead
    of the theme-adaptive page-background token.'
  - The Drawdown series' high daily-noise oscillation produces dozens of near-identical
    small V-shaped dips touching the 0% line across the full 3-year span, creating
    a dense, almost-solid red mass that makes the single annotated maximum-drawdown
    period harder to visually isolate from routine noise — slightly lower daily volatility
    or light smoothing would let the highlighted period stand out more.
  - The secondary NAV axis is fixed to start at $0 while the NAV line only ranges
    roughly $85–$210, leaving about the bottom 40% of the plot area visually empty
    — raising the axis floor (or enabling scale:true) would use the canvas more effectively
    for this line series.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Title "Tech Growth Fund · drawdown-basic · javascript · echarts · anyplot.ai" and subtitle "Max Drawdown: -27.2% · Decline: 122d · Recovery: 109d" are dark ink on the light surface, fully legible. Legend ("Portfolio NAV" green dot, "Drawdown" red dot) is dark text, legible. Left axis "Drawdown (%)" ticks (0% to -30%) and right axis "NAV ($)" ticks ($0 to $210) are soft-ink gray, legible. X-axis month/year ticks legible.
      Data: Portfolio NAV is a thin brand-green (#009E73) line rising from ~$100 to ~$210 with a mid-series dip. Drawdown is a matte-red (#AE3030) line with a semi-transparent red fill from the line down to the 0% baseline, oscillating between 0% and about -27%. A red pin marker labeled "27.2%" (white text, good contrast) sits at the deepest drawdown (~mid-2022). A black "Recovery" dot with black label marks the first return to a new high after that trough.
      Legibility verdict: PASS — all title/axis/legend/tick text is clearly readable; the max-drawdown pin label ("27.2%") reads crisply as white-on-red.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Title and subtitle are light (#F0EFE8-family) text on the dark surface, fully legible. Legend text is light and legible. Both axes' tick labels are light-gray, legible. X-axis ticks legible.
      Data: Portfolio NAV green line and Drawdown red line/fill use the identical hex values as the light render (#009E73 / #AE3030) — confirmed colors did not shift, only chrome flipped. The "Recovery" dot is correctly inverted to a light/white dot with light label text (theme-adaptive, legible). However, the max-drawdown pin's "27.2%" label is rendered in near-black text (the pin's label color is bound to the page-background token, which is near-black in this theme) sitting on the matte-red pin fill — this is a real dark-on-(dark-)red contrast problem, noticeably weaker than the light render's white-on-red label, though still just barely decipherable.
      Legibility verdict: FAIL (partial) — title, axis labels, ticks, legend, and the Recovery marker are all fine, but the Max Drawdown pin's "27.2%" annotation has degraded contrast in this theme (near-black text on red pin) because its color is wired to the theme's near-black page-background token instead of a fixed high-contrast color.
