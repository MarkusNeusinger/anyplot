review:
  strengths:
  - Drawdown computed from the running maximum and drawn as a semi-transparent matte-red
    (#AE3030) area that stays at or below zero, touching zero only at new highs, with
    0% at the top of the axis
  - Composes a custom SVG overlay from MUI X hooks (useXScale, useYScale, useDrawingArea)
    to shade the peak-to-recovery span of the maximum drawdown and label the trough,
    with the trough label side chosen from its x position
  - Key statistics (max drawdown -45.5%, 353-day decline Mar 8 2024 to Feb 24 2025,
    121-day recovery to Jun 25 2025) are computed from the data and sit in a subtitle
    clear of the curve
  - Dual y-axes via yAxisId keep the underlying NAV series (allowed by the Notes)
    on its own right-hand scale; recovery markers follow a stated rule shown in the
    legend
  - Theme tokens threaded through every text, axis, grid, reference-line and marker
    stroke, so both renders read cleanly; skipAnimation set and sizing follows window.ANYPLOT_SIZE
  weaknesses:
  - 'VQ-02 (both): between Jan and Mar 2025 the green NAV line runs on top of the
    red drawdown curve and covers most of its lowest stretch next to the trough marker,
    so the drawdown line cannot be followed there → keep the two lines apart, e.g.
    a right-axis domain that places the NAV band above the deepest drawdown (about
    min 0, max 140). Likely cause: the right yAxis ''value'' has no min/max, so its
    auto domain 55–140 maps the NAV low onto the drawdown low.'
  - 'Suggestion: the long legend entry ''Recovery from a drawdown of 4.5% or more''
    could be shortened to ''Recovery (≥ 4.5% drawdown)'' to tighten the header row.'
  - 'Suggestion: the ''Max drawdown period'' band label could carry the full peak-to-recovery
    span length (about 474 days) so the duration reads directly in the chart.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white, matches #FAF8F1.
      Chrome: bold title "drawdown-basic · javascript · muix · anyplot.ai" top left, grey subtitle with the statistics ("Max drawdown -45.5% · decline 353 days (Mar 8, 2024 → Feb 24, 2025) · recovery 121 days (to Jun 25, 2025)"), a horizontal legend at top right (Drawdown (%), NAV per share (USD), Maximum drawdown, Recovery from a drawdown of 4.5% or more). Left axis "Drawdown from running peak (%)" 0% to -45% in 5% steps, right axis "NAV per share (USD)" 55–140, x axis "Date" Feb 2024–Dec 2025. Subtle horizontal grid, dark 0% reference line. All text dark ink and readable.
      Data: matte-red drawdown line with a semi-transparent red fill down from the zero line; deep V to -45.5% in Feb 2025 marked by a red dot and the bold label "-45.5% on Feb 24, 2025"; a light grey band shades Mar 2024–Jun 2025 with the label "Max drawdown period"; black dots on the zero line at the Jun 2025 and Nov 2025 recoveries; a small open drawdown at the right edge. Brand green #009E73 NAV line on the right axis; between Jan and Mar 2025 it lies on top of the red drawdown curve near the trough.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black, matches #1A1A17.
      Chrome: title, subtitle, legend, axis titles and tick labels all in light ink and readable; grid subtle; the zero reference line flips to light ink; the max-drawdown band is a slightly lighter grey and still visible. No dark-on-dark text.
      Data: identical data colours to the light render (matte red drawdown with darker-looking translucent fill on the dark page, brand green NAV line, red trough dot); recovery dots flip to light ink with a page-coloured outline. Same overlap of the green NAV line on the red curve near the trough.
      Legibility verdict: PASS
