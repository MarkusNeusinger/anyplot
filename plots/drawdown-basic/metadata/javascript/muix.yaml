review:
  strengths:
  - The maximum drawdown period is drawn with a custom child component that reads
    useXScale, useYScale and useDrawingArea, so the shaded band and the trough label
    sit exactly on the chart's own scales in both panels
  - The drawdown is computed from the running maximum in the code, stays at or below
    0% everywhere and touches zero only at new highs, with 0% at the top of the axis
    and a small pad above it
  - The key statistics (max drawdown -45.5%, decline 353 days with dates, recovery
    121 days to Jun 25, 2025) sit in a subtitle line that matches the curve and stays
    clear of it
  - The value panel and the drawdown panel share the y-axis width and margins, so
    the dates line up and the NAV crash reads directly above the drawdown trough
  - 'All chrome is threaded from ANYPLOT_TOKENS: ink, inkSoft and grid flip cleanly
    between themes, the loss red and brand green are identical in both renders'
  - 'Native MUI X features: skipAnimation, area series with sx fill opacity, marker-only
    series with null gaps for the trough and recoveries, ChartsReferenceLine for the
    zero baseline, and the HTML tooltips the harness keeps'
  weaknesses:
  - 'Suggestion: the mandated title fills about a third of the width; a slightly larger
    title would anchor the header above the statistics line.'
  - 'Suggestion: the gray max-drawdown band could be a touch lighter in the dark render
    so the dark red fill stands out more against it.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, the max-drawdown band a faint warm gray.
