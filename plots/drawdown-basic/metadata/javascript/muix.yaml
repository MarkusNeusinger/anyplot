review:
  strengths:
  - 'Comprehensive spec coverage: implements every optional Notes bullet — peak-to-trough
    shading, amber max-drawdown reference line with label, green recovery shading
    with label, dual-axis NAV overlay, and a stats line with max drawdown %, underwater
    duration, and recovery time.'
  - 'Correct semantic color usage: the drawdown series uses Imprint red (palette[4]
    = #AE3030) for the loss/decline semantics instead of the ordinal first slot, and
    amber/green shaded windows reinforce the decline-to-recovery narrative — a well-justified
    application of the style guide''s semantic-exception rule (loss to red, recovery
    to green, warning to amber).'
  - 'Distinctive MUI X usage: a custom DrawdownWindow overlay built with useXScale/useDrawingArea
    hooks layers shaded rectangles directly into the chart''s SVG coordinate space
    — a technique unique to MUI X''s hook-based extension model, not easily replicated
    in other libraries.'
  - Theme-adaptive chrome is fully correct in both renders — text, grid, the secondary
    NAV line, and shaded-region backgrounds all flip appropriately while the two data
    colors (red drawdown, green recovery highlight, amber warning) stay identical
    across themes.
  - Explicit font sizing throughout (title 22px, stats 15px, axis label 16px, tick/legend
    14px, annotation 13px) with no reliance on library defaults, and a secondary series
    (Portfolio NAV) rendered in a muted ink tone with dashing so it stays legible
    without competing with the primary drawdown series.
  weaknesses:
  - Secondary y-axis label 'NAV' has no unit/context (e.g., 'NAV (Index, base 100)')
    — minor VQ-06 nit.
  - DrawdownWindow is a small helper component that departs from strict KISS (imports
    -> data -> plot) — acceptable as the idiomatic way to layer custom overlays via
    MUI X hooks, but it does add structural complexity versus a single flat script.
  - Title occupies only ~28% of plot width, well under the style guide's 50-70% target
    band for the mandated title format — a consequence of the short spec-id rather
    than a defect (no overflow or clipping), but there was room to size it slightly
    larger.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1-like), not pure white.
      Chrome: Bold dark title "drawdown-basic · javascript · muix · anyplot.ai" top-left; a secondary gray stats line ("Max drawdown -45.5% · Underwater 353d (Mar 8, 2024 -> Feb 24, 2025) · Recovered in 121d") beneath it; rotated "Drawdown (%)" y-axis label on the far left; "NAV" label on the secondary right axis; dark tick labels on both axes and the x-axis date ticks (Jan 24 ... Dec 25). All chrome text renders in dark ink, clearly legible against the light background. A subtle horizontal grid is visible without competing with the data.
      Data: Primary series is a red (#AE3030-family) filled drawdown area with a bold red outline, dropping to about -45% around Feb/Mar 2025 then recovering to ~0%; a secondary dashed dark-gray line traces the underlying Portfolio NAV against the right axis. An amber-tinted rectangle spans the peak-to-trough decline window with an amber dashed vertical reference line and "Max drawdown -45.5%" label; a green-tinted rectangle spans the trough-to-recovery window with a green dashed line and "Recovered" label. Legend top-right shows "Drawdown" (red swatch) and "Portfolio NAV" (dark swatch).
      Legibility verdict: PASS — all title, stats, axis, tick, legend, and annotation text is clearly readable against the light surface; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17-like), not pure black.
      Chrome: Same layout as the light render — title, stats line, axis labels, tick labels, and legend all render in light ink/off-white tones. The amber and green shaded windows are still visible as subtly tinted overlays against the dark background. Grid lines are faint and theme-correct.
      Data: The red drawdown fill and outline are visually identical to the light render (same #AE3030-family red), confirming data-color consistency across themes. The secondary NAV series correctly flips from dark gray (light theme) to a light gray/white dashed line (dark theme) so it stays visible against the dark background — this is the theme-adaptive "ink-soft" token, not a hardcoded color. Amber and green reference lines/labels are unchanged in hue and remain legible.
      Legibility verdict: PASS — no dark-on-dark failures found; every text element (title, stats, ticks, axis labels, legend, annotations) is light-colored and clearly readable against the dark surface.
