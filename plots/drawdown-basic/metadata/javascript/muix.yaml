review:
  strengths:
  - Drawdown is computed from the running maximum and plotted on its own axis with
    0% at the top and losses deeper down; the curve touches zero only at new highs
  - Semi-transparent matte red (#AE3030, the Imprint loss anchor) fill to a clearly
    visible ink-colored zero line drawn with ChartsReferenceLine, readable in both
    themes
  - Maximum drawdown is highlighted by a shaded peak-to-recovery band, a trough marker
    and a bold '-45.5% on Feb 24, 2025' label, all computed from the data
  - Key statistics in the header (max drawdown -45.5%, decline 353 days, recovery
    121 days) fall out of the computation and match the curve without touching it
  - Recovery points are marker-only null-padded series with a page-colored halo, and
    the legend states the exact marking threshold the code applies
  - 'Idiomatic MUI X v9 composition: dual y-axes with sized bands, custom SVG child
    using useXScale/useYScale/useDrawingArea, per-series data-series CSS selectors,
    skipAnimation, native tooltips in the HTML'
  weaknesses:
  - 'VQ-02 (both): between Oct 2024 and Jan 2025 the green NAV line runs directly
    on top of the red drawdown curve (both near -17% / 88 USD), so the two lines cannot
    be traced apart over about three months → keep the value line in its own vertical
    band, e.g. set the right axis so the NAV range sits clear of the drawdown curve.
    Likely cause: value yAxis min: 0 with max = peak × 1.05 maps the dip to the same
    height as the drawdown plateau.'
  - 'Suggestion: state the full max-drawdown duration (peak to recovery, 474 days)
    next to the decline and recovery figures in the header.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, no white panel.
      Chrome: bold dark title "drawdown-basic · javascript · muix · anyplot.ai" at top left with a softer stats line beneath (Max drawdown -45.5% · decline 353 days (Mar 8, 2024 → Feb 24, 2025) · recovery 121 days (to Jun 25, 2025)); top-right horizontal legend (Drawdown (%), NAV per share (USD), Maximum drawdown, Recovery from a drawdown of 4.5% or more); left axis "Drawdown from running peak (%)" 0% to -45%, right axis "NAV per share (USD)" 0–140, x axis "Date" Feb 2024–Dec 2025 monthly ticks; subtle horizontal grid. All text dark and readable.
      Data: matte red #AE3030 drawdown line with ~35% red fill down from a black zero line; shallow dips early 2024, deep drawdown to -45.5% in Feb 2025, recovery to zero late Jun 2025, small -5% dip in Nov 2025 and an open drawdown at the end. Light gray band over the max drawdown period labelled "Max drawdown period"; red trough dot with bold "-45.5% on Feb 24, 2025" label; black recovery dots on the zero line at Jun 2025 and Nov 2025. Brand green #009E73 NAV line on the right axis, which coincides with the red curve Oct 2024–Jan 2025.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, stats line, legend, axis titles and tick labels in light ink, all readable; no dark-on-dark text; zero line in light ink; grid subtle; max drawdown band slightly lighter gray.
      Data: same #AE3030 red line/fill and #009E73 NAV line as light; recovery dots flip to light ink with a dark halo (chrome-colored markers, as intended); trough label in light ink.
      Legibility verdict: PASS
