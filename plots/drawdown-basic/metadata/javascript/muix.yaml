      Data: brand green #009E73 NAV line in the top panel; drawdown in matte red #AE3030 with a semi-transparent red fill down from a black 0% baseline; red trough marker labelled "-45.5% on Feb 24, 2025" in bold; black recovery dots at Jun 2025 and Dec 2025; "Max drawdown period" band spanning both panels from Mar 2024 to Jun 2025.
