review:
  strengths:
  - All three spec-required statistics (max drawdown %, duration, recovery time) are
    now shown in a compact subtitle callout, closing the SC-02 gap from the previous
    review.
  - The single recovery marker is explicitly labeled 'Recovery from max drawdown',
    removing the earlier ambiguity about which of the many zero-crossings it refers
    to.
  - The drawdown fill now uses a subtle linear gradient (low opacity near zero, deeper
    opacity toward the trough) instead of a flat semi-transparent red, and the x-axis
    tick marks were removed — both directly address the prior Visual Refinement feedback.
  - 'Thoughtful semantic color use: drawdown fill/line uses the Imprint semantic-red
    anchor (palette[4], #AE3030) for loss, while the recovery marker uses brand green
    (palette[0], #009E73) — a well-justified semantic exception per the style guide.'
  - 'Both renders are fully theme-correct: warm off-white/near-black backgrounds,
    theme-adaptive ink/inkSoft chrome, and pixel-identical data colors (red fill/line,
    green marker) between light and dark.'
  - 'Clean, idiomatic D3: scaleTime/scaleLinear, d3.area()/d3.line() generators, an
    SVG linearGradient built via defs, proper axis token mapping, deterministic fixed-seed
    LCG + Box-Muller data generation, no fake interactivity.'
  weaknesses:
  - Only the single recovery point tied to the max-drawdown trough is marked, even
    though the series crosses back to 0% many other times (visible as repeated zero-baseline
    touches). The label change made this clear, but lightly marking one or two of
    the other major recoveries would further strengthen the storytelling.
  - Spec's optional suggestion to 'consider a secondary y-axis or annotation to show
    the underlying price/value series' is still skipped; a thin secondary NAV line
    or small inset sparkline would add useful context and is a good target for further
    Data Storytelling polish.
  - 'Design Excellence is strong but not yet publication-grade: beyond the new gradient
    fill, there is no further refinement such as a lighter secondary drawdown-depth
    reference band or more distinctive D3-only technique (e.g. Voronoi/brush-based
    emphasis) to push Library Mastery higher.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Title "drawdown-basic · javascript · d3 · anyplot.ai" in bold dark ink, centered; below it a subtitle "Max drawdown: -13.6% · Duration: 69 trading days · Recovery: 123 days" in softer dark gray, both clearly legible. "Date" and "Drawdown from Peak (%)" axis labels in dark ink; tick labels (dates on x, percentages on y) in softer dark gray, all legible with no tick marks cluttering the axis. Subtle light-gray horizontal gridlines at each y tick; a solid dark zero-baseline is prominent at the top of the plotted range.
      Data: Drawdown line and gradient fill are matte red (#AE3030, Imprint palette position 5, the semantic loss anchor) — the fill is faint near the zero line and deepens toward the trough. One recovery point near mid-2025 is marked with a hollow brand-green (#009E73) circle labeled "Recovery from max drawdown"; the deepest trough (~-13.6% in Feb 2025) is marked with a filled red dot and a bold dark "Max drawdown: -13.6%" label positioned just below the point (auto-flipped since the trough sits low in the plot area).
      Legibility verdict: PASS — all text is dark-on-light and fully readable, no overlaps observed.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Title and subtitle stats line rendered in light off-white / soft-light ink; "Date"/"Drawdown from Peak (%)" axis labels in light ink; tick labels in a softer light gray; gridlines are faint light-gray horizontal lines; the zero-baseline is now a light/white horizontal rule, still clearly visible against the dark background.
      Data: The drawdown gradient fill/line remain the identical matte red (#AE3030) as the light render; the recovery marker and label remain the identical brand green (#009E73); the "Max drawdown: -13.6%" annotation text switches to light ink and is clearly readable — no dark-on-dark text anywhere.
      Legibility verdict: PASS — all chrome text is light-on-dark and fully readable; data colors are confirmed identical to the light render.
