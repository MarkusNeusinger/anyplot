review:
  strengths:
  - 'Thoughtful semantic color use: drawdown fill/line uses the Imprint semantic-red
    anchor (palette[4], #AE3030) for loss, while the recovery marker uses brand green
    (palette[0], #009E73) — a well-justified semantic exception per the style guide,
    and it makes the chart read intuitively at a glance.'
  - Max-drawdown trough is directly annotated with a marker and percentage label,
    and the label position flips above/below the point depending on proximity to the
    top of the plot area, avoiding collision with the zero line.
  - 'Both renders are fully theme-correct: warm off-white/near-black backgrounds,
    all chrome text uses theme-adaptive ink/inkSoft tokens, and data colors (red fill/line,
    green recovery marker) are pixel-identical between light and dark.'
  - 'Clean, idiomatic D3: scaleTime/scaleLinear, d3.area()/d3.line() generators, proper
    axis token mapping, deterministic fixed-seed LCG + Box-Muller data generation,
    no fake interactivity.'
  - Realistic, neutral finance data (a 3-year synthetic NAV series) producing a plausible
    drawdown pattern (multiple pullbacks, one -13.6% max drawdown) appropriate for
    the plot type.
  weaknesses:
  - 'Spec explicitly requires ''Display key statistics: maximum drawdown percentage,
    max drawdown duration, and recovery time'' — only the max drawdown percentage
    is shown. Add two small annotation lines (or a compact stat callout near the title/top-right)
    for ''Max DD duration: N days'' and ''Recovery time: N days'', computed from troughIdx/peakIdx/recoveryIdx
    which are already tracked in the data.'
  - Only the single recovery point tied to the max-drawdown trough is marked, even
    though many other drawdown cycles fully recover to 0% across the series (visible
    as repeated line touches on the zero baseline). Either keep this single most-important
    marker but relabel it as 'Recovery from max drawdown' for clarity, or lightly
    mark a couple of the other major recovery points too.
  - 'Design Excellence is solid but not yet publication-grade: the fill is a single
    flat semi-transparent red with no further refinement (e.g. a subtle gradient toward
    the zero line, or thinner/lighter secondary drawdown-depth gridlines) and the
    x-axis still shows small tick marks — removing them (per the style guide''s decoration-removal
    checklist) and refining grid opacity slightly would push visual polish further.'
  - Spec's optional suggestion to 'consider a secondary y-axis or annotation to show
    the underlying price/value series' was skipped; a thin secondary NAV line or small
    inset sparkline would add useful context and is a good target for the next iteration
    to raise Data Storytelling further.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Title "drawdown-basic · javascript · d3 · anyplot.ai" in bold dark ink, centered, clearly visible; "Date" and "Drawdown from Peak (%)" axis labels in dark ink; tick labels (dates on x, percentages on y) in a slightly softer dark gray, all clearly legible; subtle light-gray horizontal gridlines at each y tick; a solid dark zero-baseline is prominent at the top of the plotted range.
      Data: Drawdown line and semi-transparent fill are matte red (#AE3030, Imprint palette position 5, the semantic loss anchor); one recovery point near mid-2025 is marked with a hollow brand-green (#009E73) circle and a green "Recovery" label; the deepest trough (~-13.6% in Feb 2025) is marked with a filled red dot and a bold dark "Max drawdown: -13.6%" label positioned just above the point.
      Legibility verdict: PASS — all text is dark-on-light and fully readable, no overlaps observed.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Title, "Date"/"Drawdown from Peak (%)" axis labels rendered in light off-white ink; tick labels in a softer light gray; gridlines are faint light-gray horizontal lines; the zero-baseline is now a light/white horizontal rule, still clearly visible against the dark background.
      Data: The drawdown fill/line remain the identical matte red (#AE3030) as the light render; the recovery marker and label remain the identical brand green (#009E73); the "Max drawdown: -13.6%" annotation text switches to light ink and is clearly readable — no dark-on-dark text anywhere.
      Legibility verdict: PASS — all chrome text is light-on-dark and fully readable; data colors are confirmed identical to the light render.
