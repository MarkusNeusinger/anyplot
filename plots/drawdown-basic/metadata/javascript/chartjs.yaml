review:
  strengths:
  - 'Well-justified semantic color mapping: matte red (#AE3030) for the drawdown/loss
    series, brand green (#009E73) for the recovery marker, and amber for the max-drawdown
    warning point — a textbook application of the Imprint style guide''s semantic-exception
    rule for finance data'
  - 'Pixel-verified palette and theme compliance: light background measured exactly
    #FAF8F1, dark background exactly #1A1A17, brand green exactly #009E73, matte red
    exactly #AE3030 in both renders'
  - 'Strong data storytelling: the subtitle states max drawdown %, days-to-trough,
    and recovery time in plain language, and the trough/recovery points use distinct
    non-color-redundant marker shapes (rectRot diamond vs. circle)'
  - 'Genuinely useful secondary-axis overlay: the right y-axis shows the underlying
    portfolio value line for context without competing visually with the primary drawdown
    series (thinner line, muted ink-soft color, layered behind the drawdown fill via
    `order`)'
  - No edge clipping in either render (verified by pixel inspection of all four canvas
    borders)
  - 'Clean, deterministic, KISS code: fixed-seed LCG (browser has no native seeded
    RNG, matches chartjs.md''s own recommendation), no fake interactivity, `animation:
    false` set correctly'
  weaknesses:
  - 'Mobile legibility fails the mandated ~400px check: title/subtitle/legend/axis
    text is sized from a 1600 CSS-px mount (title font: { size: 22 }), so after the
    responsive-image 8x downscale to plot-light_400.png / plot-dark_400.png the title''s
    glyph cap-height measures only ~5px (verified by direct pixel inspection) — effectively
    illegible at the size the gallery actually renders on mobile. Scale up all font
    sizes (title, subtitle, legend, tick, axis-title) by roughly 1.5-2x from the current
    22/15/14/13/15 CSS px so the mobile thumbnail stays readable, then re-check the
    _400.png crop.'
  - Title occupies only ~33% of canvas width (measured via pixel bounding box), well
    under the ~50-70% comfortable proportion — increasing the title font size to fix
    the mobile-legibility issue will also naturally improve this proportion.
  - Only a single 'Recovery' event is highlighted even though the drawdown line visibly
    returns to the zero baseline many times across the 2-year window — consider clarifying
    that the marker specifically denotes recovery from the max-drawdown trough (not
    every baseline touch), since a first-time viewer could reasonably expect all zero-crossings
    to be marked.
  - 'Design Excellence and Library Mastery are solid but not exceptional: typography
    relies on the browser default sans-serif with no distinctive font choice, and
    Chart.js-specific capabilities beyond the two static highlight points (e.g. plugin-based
    annotations, gradient fills) are under-leveraged.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, pixel-verified as exactly #FAF8F1 — matches spec.
      Chrome: Title "drawdown-basic · javascript · chartjs · anyplot.ai" and subtitle "Max drawdown -11.5% · 23 trading days to trough · recovered in 62 trading days" in dark ink at the top, followed by a 4-item point-style legend (Portfolio Value, Drawdown, Max Drawdown, Recovery). Left y-axis "Drawdown (%)" from 0% to -12%, right y-axis "Portfolio Value" from ~90 to 180, x-axis "Date" with monthly tick labels. Subtle horizontal gridlines on the left axis only.
      Data: A jagged dark-red (#AE3030) line filled down to the 0% baseline with a semi-transparent red wash shows repeated drawdown episodes across ~2 years; a thin gray (ink-soft) line tracks the underlying portfolio value climbing from ~95 to ~165 on the right axis. A yellow/amber diamond marks the single deepest trough (-11.5%, ~Feb 2025); a green (#009E73) circle marks the recovery point back to 0%.
      Legibility verdict: PASS at full canvas size — all text is clearly dark-on-light and readable. FAIL at the mandated ~400px mobile check — direct pixel measurement of plot-light_400.png shows the title's glyph cap-height is only ~5px, effectively illegible at that size.

    Dark render (plot-dark.png):
      Background: Warm near-black, pixel-verified as exactly #1A1A17 — matches spec.
      Chrome: Same title/subtitle/legend/axis-label layout, now in light ink (#F0EFE8-family) — clearly readable against the dark background, no dark-on-dark failures observed. Gridlines remain subtle.
      Data: Data colors are pixel-identical to the light render — same #AE3030 red line/fill, same #009E73 green recovery marker, same amber diamond, same gray portfolio line. Only the chrome (background, text) flipped, as required.
      Legibility verdict: PASS at full canvas size — no dark-on-dark issues. FAIL at the mandated ~400px mobile check for the same reason as the light render (title cap-height ~5px, verified by direct pixel measurement of plot-dark_400.png).
