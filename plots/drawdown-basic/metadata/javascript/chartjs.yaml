      Background: Warm near-black, pixel-verified as exactly #1A1A17 (RGB 26,26,23).
      Chrome: Identical layout, now in light ink (t.ink/t.inkSoft) - clearly readable, no dark-on-dark issues anywhere (title, subtitle, legend, tick labels, axis titles all light-colored against the near-black surface).
