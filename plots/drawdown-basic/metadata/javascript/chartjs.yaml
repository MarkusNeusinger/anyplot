      Measured plot-light_400.png / plot-dark_400.png directly: the title glyph band is ~9-10px cap height with clearly separated, individually legible letterforms - a marked improvement over attempt 1's ~5px illegible smear. This was the sole attempt-1 rejection reason (VQ-01) and repair applied exactly the prescribed fix (title 22->38, subtitle 15->22, legend 14->21, tick labels 13->20, axis titles 15->22 CSS px), verified via git diff of the only changed commit.
