review:
  strengths:
  - Drawdown computed from cummax and drawn as a red line over a 30 % fill to a clearly
    visible zero baseline, in both themes
  - 'Key statistics all present and consistent with the curve: Max DD -45.4% in the
    legend, duration 86d and recovery 92d in an arrow annotation that stays clear
    of the data'
  - 'Semantic color use: matte red for loss, brand green for new highs, Imprint purple
    for the max-DD marker; up and down triangles keep them distinct without color'
  - Theme tokens threaded through every chrome element; text readable in both renders
  - Hand-tuned subplots_adjust margins fill the canvas evenly
  weaknesses:
  - 'SC-01 (both): a KDE marginal panel (''Dist.'') of the drawdown distribution,
    with a dashed purple max-DD reference line and a dashed zero line, sits beside
    the chart; the -basic spec asks for one drawdown series, the zero baseline, the
    highlight, the recovery markers and the statistics only (C5) → remove the marginal
    panel and draw the chart on a single axes. Likely cause: GridSpec(1, 2) with ax_kde
    and sns.kdeplot(y=...).'
  - 'VQ-01 (both): the KDE strip''s tick labels at 6 pt and its ''Density'' axis label
    at 7 pt are below the style guide''s 8 pt reference and read small beside the
    8 pt main ticks → 8 pt (+2 pt / +1 pt), or gone with the panel. Likely cause:
    ax_kde.tick_params(labelsize=6) and set_xlabel(fontsize=7).'
  - 'VQ-03 (both): about 40 New High triangles at s=45 merge into solid green bands
    along the zero line in 2021-01..04 and 2021-11..2022-08, so individual recovery
    points cannot be told apart → mark only recoveries that end a drawdown of meaningful
    depth (for example deeper than 5 %) or reduce the marker size to about s=20 with
    alpha. Likely cause: recovery_dates marks every return to zero after a one-day
    dip.'
  - 'Suggestion: the underlying index level, which the Notes allow, could be shown
    on a faint secondary axis to put the drawdowns in context.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the canvas and both panels.
      Chrome: title 'drawdown-basic · python · seaborn · anyplot.ai' in dark ink, centered over the main panel; 'Trading Date' / 'Drawdown (%)' axis titles and 2020-01..2023-01 / 0..-50 ticks in dark grey, all readable; subtle grid; legend in the lower right on an elevated off-white box (Drawdown, Max DD: -45.4%, New High). A right strip 'Dist.' holds a red filled KDE of drawdown values with small 6 pt density ticks and dashed grey (0) and purple (max DD) lines.
      Data: matte red #AE3030 drawdown line with a translucent red fill to a dark-grey zero line; four deep drawdowns (about -42, -45.4, -30, -21 %) with many shallow dips in 2021 and 2022; a purple down triangle at the -45.4 % trough with an arrow annotation 'Recovery: 92d / Duration: 86d'; about 40 green #009E73 up triangles on the zero line, merging into bands in 2021-01..04 and 2021-11..2022-08. The last drawdown is still open at the right edge.
      Legibility verdict: PASS

