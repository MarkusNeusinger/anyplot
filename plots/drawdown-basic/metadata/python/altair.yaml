review:
  strengths:
  - 'Semantic Imprint roles: matte red #AE3030 for loss, brand green #009E73 for new
    highs, lavender #C475FD for the max-DD focal point — identical in both themes'
  - Statistics subtitle (Max Drawdown 41.7 %, Duration 56d, Recovery 105d) computed
    from the series and consistent with the curve
  - 'Full theme-token threading: no dark-on-dark text, elevated legend surface in
    both themes'
  - Tooltip on recovery markers adds value in the HTML view
  weaknesses:
  - 'VQ-02 (both): the ''New High'' legend box sits on the zero line and covers the
    Apr 2023 recovery triangle → place the legend clear of the data, e.g. orient=''top-right''
    with the y domain ending at 0 so it sits outside, or orient=''bottom-right''.
    Likely cause: legend orient=''top-right'' inside a plot whose top band holds the
    recovery markers.'
  - 'VQ-05 (both): the chart occupies only about 80 % of the canvas width with a wide
    empty page-color frame around it (≈270 px left, ≈130 px top and bottom at full
    size) → fill the canvas. Likely cause: view sized 620x320 and the PNG padded up
    to 3200x1800; use width=800, height=450 with autosize type=''fit'', contains=''padding'',
    padding=10.'
  - 'SC-03 (both): the y-axis runs up to +5 % above the zero baseline, so zero is
    not at the top of the axis (C1) → domain max 0 (−5). Likely cause: scale domain
    upper bound hard-coded to 5.'
  - 'DQ-02 (both): the asset is unnamed and swings through five drawdowns of 19–42
    % in 16 months, which reads as an engineered pattern rather than a stock or portfolio
    → name the asset (e.g. a single growth stock or a crypto series) in the subtitle
    or axis title, or temper the drawdown depths to about 10–25 %. Likely cause: the
    hard-coded return regimes in the Data block.'
  - 'Suggestion: a thin leader from the ''Max DD'' label to its marker would tie them
    more tightly.'
  - 'Suggestion: an interval selection on x (alt.selection_interval with bind=''scales'')
    would add zoom/pan in the HTML view.'
