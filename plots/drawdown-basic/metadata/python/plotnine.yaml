review:
  strengths:
  - 'Drawdown computed with pandas cummax and drawn as a geom_ribbon between the curve
    and zero, with Imprint red #AE3030 as the semantic loss color and a theme-dependent
    alpha (0.30 light / 0.55 dark) that keeps the fill equally present on both surfaces'
  - 'Maximum drawdown and the recovery point are both marked with page-colored-halo
    markers and direct labels (''Max Drawdown: -45.2%'', ''New high''), so no legend
    is needed'
  - 'All three statistics the Notes ask for sit in a muted labs(caption=) and match
    the curve: -45.2%, 315 days, recovery not yet reached'
  - Per-layer data= subsets, scale_x_datetime(date_breaks, date_labels) and an asymmetric
    scale expand that gives the recovery label its own headroom
  weaknesses:
  - 'Suggestion: ''Max Drawdown: -45.2%'' appears both beside the marker and in the
    caption; the caption alone could carry duration and recovery time, or the marker
    label could drop the repeated figure.'
  - 'Suggestion: the caption statistics at 7 pt in INK_MUTED are the quietest text
    on the canvas; at the 8 pt tick size they would read as equal to the axis text.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across plot and panel.
      Chrome: title 'drawdown-basic · python · plotnine · anyplot.ai' in dark ink, about 50 % of the width; axis titles 'Date' and 'Drawdown (%)', ticks 0 to -45 every 5 and Jan 2022 to Apr 2023 every 3 months rotated 45°; L-shaped axis line; subtle major and minor grid; muted caption bottom right with the three statistics. All readable.
      Data: Imprint red #AE3030 drawdown line over a translucent red ribbon to a dashed dark-grey zero line; a first ~31 % dip recovers to a green #009E73 diamond labelled 'New high' (June 2022), then a deep drawdown to a red circle at -45.2 % (late Sep 2022) labelled 'Max Drawdown: -45.2%' below-left, still open at about -23 % at the end. Headroom above zero carries the 'New high' label.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
