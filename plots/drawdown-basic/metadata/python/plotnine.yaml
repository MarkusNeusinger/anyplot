review:
  strengths:
  - Drawdown computed from the running maximum with zero at the top of the axis and
    a semi-transparent Imprint-red ribbon, readable in both themes
  - 'Statistics stay truthful to the data: recovery time is reported as ''not yet
    reached'' for the still-open maximum drawdown'
  - Max-drawdown label placed clear of the curve; page-colored halos lift both markers
    off the line
  - 'Idiomatic plotnine grammar: geom_ribbon ymin/ymax, per-layer data= subsets, scale_x_datetime
    with date_breaks/date_labels'
  weaknesses:
  - 'SC-04 (both): the green recovery diamond at 0 % in June 2022 has no key or direct
    label, so a reader cannot tell what it marks → a short direct label such as ''New
    high'' next to it, or name it in the caption. Likely cause: geom_point for recovery_df
    without any accompanying text.'
  - 'Suggestion: the caption statistics at 7 pt in INK_MUTED are the quietest text
    on the canvas; at the 8 pt tick size they would read as equal to the axis text.'
  - 'Suggestion: the secondary price series the Notes allow would show what the drawdown
    is measured against.'
