  strengths:
  - Drawdown computed from df with cummax() as (price − running max) / running max
    × 100; the curve stays at or below zero, touches zero only at new highs, and zero
    sits at the top of the axis
  - 'Idiomatic plotly area: fill=''tozeroy'' with a semi-transparent Imprint matte
    red (#AE3030) fill under a solid red line, and a 2 px zeroline in INK_SOFT that
    stays clearly visible in both themes'
  - 'Semantic colors from the Imprint palette: matte red for loss, brand green #009E73
    triangles for new highs, kept apart by shape (line, diamond, triangle) as well
    as by hue'
  - The statistics panel reports max drawdown, max duration and the recovery time
    computed from df, all matching the curve, on ELEVATED_BG with theme tokens so
    it reads on both surfaces
  - The generated series shows a full drawdown-to-new-high cycle, a shallow second
    episode and a final open drawdown, so every recovery marker and statistic has
    something to say
  - 'Library-native interactivity: hovertemplates with %{x|%Y-%m-%d} date formatting
    on every trace, plus an HTML export next to the PNG'
  weaknesses:
  - 'Suggestion: label the duration and recovery time as trading days, because the
    dates are business days (freq="B") and the counts are rows.'
