review:
  strengths:
  - Drawdown computed from df with cummax() as (price − running max) / running max
    × 100; the curve stays at or below zero, and zero sits at the top of the axis
  - 'Idiomatic plotly area: fill=''tozeroy'' with a semi-transparent Imprint matte
    red (#AE3030) fill under a solid red line, and a 2 px zeroline in INK_SOFT that
    stays clearly visible in both themes'
  - 'Semantic colors from the Imprint palette: matte red for loss, brand green #009E73
    triangles for new highs, kept apart by shape (line, diamond, triangle) as well
    as by hue'
  - The max-drawdown diamond's label and the statistics panel use theme tokens (INK,
    INK_SOFT on ELEVATED_BG), so all annotation text reads well on both surfaces
  - 'Library-native interactivity: hovertemplates with %{x|%Y-%m-%d} date formatting
    on every trace, plus an HTML export next to the PNG'
  - 'Adaptable code: column constants with role comments and one tidy df; everything
    below the Data block is derived from df (groupby run-length trick for the duration)'
  weaknesses:
  - 'SC-02 (both): the statistics panel lists the maximum drawdown, the maximum duration
    and the number of recovery points, but not the recovery time that the Notes and
    the fourth ''A good version shows'' bullet ask for → add a recovery-time line
    computed from df (here ''Recovery: not yet reached'', because the deepest drawdown
    is still open). Likely cause: stats_text has no recovery-time entry.'
  - 'VQ-02 (both): the three recovery triangles in early January 2022 merge into one
    green blob on the zero line, so a reader can neither count nor place the individual
    new highs → triangles that stand apart: new highs spaced out in the generated
    data, or smaller markers (size 16 → about 10, −6). Likely cause: the seeded series
    reaches its only three new highs within its first two weeks; marker size=16.'
  - 'DQ-01 (both): after the first two weeks the series holds one drawdown that never
    recovers, so the recovery markers say almost nothing and no drawdown-to-new-high
    cycle is visible → a return series with at least one full drawdown that recovers
    to a new high before the final open one. Likely cause: returns[100:150] -= 0.008
    and returns[300:350] -= 0.012 against a 0.0003 daily drift.'
  - 'Suggestion: label the duration as trading days, because the dates are business
    days (freq="B").'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white #FAF8F1, not pure white. Canvas 3200x1800 landscape.
      Chrome: Title "drawdown-basic · python · plotly · anyplot.ai" centred in dark INK, with a clear gap above the horizontal legend box (Drawdown red line and fill swatch, green "Recovery (New High)" triangle) on an ELEVATED_BG fill with an INK_SOFT frame. Y axis "Drawdown (%)" with ticks 0% to −60%, x axis "Date" with quarterly ticks from Jan 2022 to Oct 2023, all in INK/INK_SOFT and readable. Grid subtle. The bold 2 px zero line in INK_SOFT is clearly visible.
      Data: A matte red (#AE3030) drawdown line with a semi-transparent red fill up to zero; the curve falls from 0% in January 2022 to about −46% (Aug 2022), recovers to about −33%, then drops to the max drawdown of −63.4% (May 2023, red diamond labelled "Max DD: -63.4%" in dark ink below it) and stays around −55 to −62% to the end. Three green #009E73 triangles at 0% in early January 2022 merge into one blob. The statistics box at bottom left ("Drawdown Statistics / Max Drawdown: -63.44% / Max Duration: 490 days / Recovery Points: 3") sits clear of the curve.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black #1A1A17, not pure black.
      Chrome: Title in light INK, tick labels and legend text in light INK_SOFT, legend and stats box on the dark ELEVATED_BG with light frames; the zero line is a light grey line. No dark-on-dark text anywhere.
      Data: Same matte red line and green triangles as in the light render (categorical colors identical); the 30 % red fill reads as a dark maroon area that is still clearly distinct from the page. The "Max DD: -63.4%" label is in light INK and fully readable.
      Legibility verdict: PASS
