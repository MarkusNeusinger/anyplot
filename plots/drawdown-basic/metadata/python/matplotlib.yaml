review:
  strengths:
  - 'Correct drawdown math: np.maximum.accumulate running max, curve never above zero,
    statistics (-24.3%, 305 days, 122 days) computed and consistent with the curve'
  - 'Semantic Imprint colors: red #AE3030 loss fill and green #009E73 new-high triangles,
    identical in both themes'
  - Underlying value series on a twinx axis is deliberately muted (INK_MUTED, alpha
    0.5, tinted secondary spine) so the drawdown stays the primary layer
  - 'Full theme-token chrome: legend frame, stats box, spines, ticks and annotation
    all flip cleanly; no dark-on-dark text'
  weaknesses:
  - 'VQ-02 (both): the upper-right legend box sits over the portfolio-value line''s
    2023-08/09 peak (the grey line runs behind ''New High'' and ''Portfolio Value'')
    and half-covers the 2023-08 recovery triangle → a legend position with no data
    under it (e.g. above the plot area or below the x-axis). Likely cause: ax1.legend(loc="upper
    right") inside the axes with only HEADROOM=5 of space above zero.'
  - 'VQ-02, SC-02 (both): the lower-left stats box overlays the portfolio-value line
    (it crosses ''-24.3%'' and ''305 days'') and its top edge meets the 2022-05 drawdown
    trough, so C4''s ''stays clear of the curve'' is missed → place the statistics
    where no data runs (outside the axes or in a free region). Likely cause: ax1.text(0.02,
    0.04, …, transform=ax1.transAxes).'
  - 'VQ-03 (both): the ''New High (Recovery)'' legend glyph draws a white line segment
    through the triangle that the plotted markers do not have (glaring on the dark
    background) → marker only, no line. Likely cause: Line2D([0], [0], marker="^",
    color="w", …) without linestyle="none".'
  - 'SC-03 (both): the drawdown axis runs to +5% with a ''5%'' tick, a value a drawdown
    can never take, so zero is not at the top of its axis as C1 asks → upper limit
    at 0 (or a sliver above without a positive tick). Likely cause: ax1.set_ylim(min(drawdown)
    * 1.15, HEADROOM).'
  - 'Suggestion: the two recovery triangles at 2023-03/04 nearly coincide; a stricter
    MIN_DROP would mark only distinct recoveries.'
