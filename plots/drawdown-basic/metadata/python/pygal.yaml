  weaknesses:
  - 'VQ-01 (both): y tick labels show two sizes, the major ticks (0, -20) at 44 px
    beside the others at 56 px → one size for all tick labels (-12 px on the minor
    ticks or +12 px on the major). Likely cause: Style label_font_size=56 vs major_label_font_size=44.'
  - 'VQ-03 (both): legend swatches are tiny squares of about 13 px beside 44 px legend
    text and barely carry the series colors → swatches near the text height (about
    +25 px). Likely cause: pygal''s default legend_box_size (12) left unset.'
  - 'VQ-03 (both): the recovery series'' connecting stroke paints the zero baseline
    green from the first recovery dot (2022-01) to the last (2023-02), so the baseline
    changes color mid-chart → draw the recovery markers as dots only. Likely cause:
    the None-padded recovery series is joined by pygal (allow_interruptions off) with
    its stroke on; set stroke=False on that chart.add.'
  - 'SC-03 (both): the y-axis runs to about +5 with a +4 tick and grid line above
    the zero baseline, so zero is not at the top of the axis (C1) → top the axis at
    0 (-5). Likely cause: range=(..., -np.nanmin(drawdown) * 0.19).'
  - 'Suggestion: tick labels every 60 rows give irregular month steps (2022-05 then
    2022-06); labels at month starts would read more evenly.'
  - 'Suggestion: the optional underlying portfolio value series the Notes allow could
    add context on a secondary axis.'
