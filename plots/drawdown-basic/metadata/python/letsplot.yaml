review:
  strengths:
  - All three key statistics (max drawdown -42.9%, 100-day peak-to-trough duration,
    'not yet recovered') are computed from the series and shown in a caption clear
    of the curve
  - 'Theme tokens wired through every chrome element: both renders fully readable,
    no dark-on-dark text'
  - 'Semantic Imprint exception applied correctly: loss in red #AE3030 with alpha
    0.30 fill, recoveries in #009E73, identical across themes'
  - Max drawdown and recovery points distinguished by shape as well as color (filled
    vs open circle)
  - Clean linear code with column constants, cummax() running maximum and a seed
  weaknesses:
  - 'VQ-03 (both): the size-5 open recovery circles (stroke 2) at y=0 merge into continuous
    green bands around January of year one and February-April of year two, so individual
    recovery points cannot be told apart → smaller markers (size about 3, −2) so neighbouring
    recoveries stay distinct. Likely cause: geom_point size=5, stroke=2.0 for the
    recovery markers.'
  - 'SC-03 (both): the x-axis ticks read Feb, May, Aug, Nov twice with no year, so
    a reader cannot tell which year a drawdown falls in → month-year tick labels (e.g.
    ''Feb 2022''). Likely cause: scale_x_datetime() without a format such as format=''%b
    %Y''.'
  - 'Suggestion: a letsplot layer_tooltips() on the markers would expose the exact
    date and drawdown in the HTML view.'
