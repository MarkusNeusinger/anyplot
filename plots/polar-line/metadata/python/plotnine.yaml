      Data: two closed loops of 24 points each, Week 1 #009E73 and Week 2 #C475FD, with markers on the line; Week 1 peaks near 12h (~78), Week 2 shifted to ~15-17h; loops cross near 13h. Grid rings and spokes are faint grey, lighter than the lines.
