review:
  strengths:
  - 'Clock-face polar frame: 0h at the top, hours running clockwise, labelled every
    3 h, with concentric rings at round radius steps and radial spokes, lighter than
    the data lines in both themes'
  - coord_fixed keeps the rings circular, so every point sits at its true angle and
    radius and each week is a closed loop in theta order
  - 'Theme tokens threaded through every layer: grid, labels, legend frame and caption
    flip cleanly between #FAF8F1 and #1A1A17 while the Imprint data colours stay identical'
  - 'Legend and series colours follow the data order via scale_color_manual(limits=groups),
    so Week 1 gets #009E73'
  weaknesses:
  - 'DQ-02 (both): the radius is titled ''Activity (events per hour)'' without saying
    what is counted, so the scenario reads as generic → name the measured quantity
    (e.g. ''Website visits per hour'' or ''Support tickets per hour''). Likely cause:
    the VALUE constant.'
  - 'Suggestion: give the legend more inner padding; the title ''Week'' and the ''Week
    2'' label sit almost on the frame (legend_box_margin / legend_margin).'
  - 'Suggestion: the hand-written nice-step block (r_max/4, magnitude, 1-2-5 steps)
    could use mizani''s breaks_extended(), which plotnine already depends on.'
  - 'Suggestion: the redundant guides(color=''legend'') call can go.'
  image_description: |-
