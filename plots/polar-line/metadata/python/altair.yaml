review:
  strengths:
  - 'Both themes thread the INK / INK_SOFT / ELEVATED_BG tokens through month labels,
    ring labels, grid and legend; the Imprint colors #009E73 and #C475FD are identical
    in both renders'
  - Radius is the real temperature on one shared scale for both cities, with ring
    values 10 / 20 / 30 derived from the data and the unit appended to the outer ring
    label
  - 'Typographic hierarchy chosen for the chart: bold INK month labels at the rim,
    smaller INK_SOFT ring labels placed on the mid-spoke between Jan and Feb so they
    never sit on a grid line'
  - January at the top running clockwise reads like a calendar dial; each series is
    closed into a loop for the cyclic year
  - Native Vega-Lite tooltips with City, Month and Temperature give exact values in
    the HTML view
  - Output lands exactly on the 2400 × 2400 square canvas through the library prompt's
    pad-only block
  weaknesses:
  - 'VQ-05 (both): the legend box sits left-aligned under the chart (its left edge
    at about x=230 px, right edge at about x=880 px of 1932) while the polar plot
    and title are centred, leaving the bottom-right quadrant empty → centre the legend
    under the plot. Likely cause: alt.Legend(orient="bottom") anchors at the start
    of the view; set legend.anchor / configure_legend(orient="none", legendX=…) or
    titleAnchor/anchor="middle".'
  - 'DQ-02 (both): the two series are labelled "Northern City" and "Southern City",
    which reads as generic placeholder names → real city names that fit the curves
    (for example Berlin and Sydney). Likely cause: the RADII column names.'
  - 'CQ-01 (code): a helper function `def to_xy(theta_deg, radius)` is defined for
    the polar projection → inline the two numpy expressions (x = r * np.sin(np.radians(t)),
    y = r * np.cos(np.radians(t))) where they are used, no functions. Likely cause:
    the projection factored into a helper.'
  - 'Suggestion: a light radius title ("Temperature (°C)") near the ring labels would
    let the unit read without hunting for the outer ring.'
