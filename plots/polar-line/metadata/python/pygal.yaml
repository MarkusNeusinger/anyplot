review:
  strengths:
  - 'Imprint colors #009E73 and #C475FD on theme-correct backgrounds with readable
    chrome in both renders'
  - Plausible, neutral wind-speed scenario with two crossing-free loops of different
    size
  - Radar chart used directly as a polar line plot with the pygal Style object
  weaknesses:
  - 'VQ-05 (both): canvas is 4800x2700, not one of the canonical sizes, and the polar
    area is stretched into a wide ellipse → 2400x2400 square (−2400 × −300). Likely
    cause: width=4800, height=2700.'
  - 'VQ-01 (both): title at 28 px and hour, radial and legend labels at 16-18 px read
    tiny on the 4800 px canvas → about 60 px title and 40-44 px labels at 2400 px
    (roughly +30 px). Likely cause: title_font_size=28, label_font_size=18, major_label_font_size=16,
    legend_font_size=16.'
  - 'SC-03 (both): the non-square plot area stretches the radial scale horizontally,
    so equal values (the 10 ring) sit at different distances from the centre by angle
    → a square canvas so the rings are circles. Likely cause: width=4800, height=2700.'
  - 'SC-04 (both): title ''polar-line · pygal · anyplot.ai'' lacks the language segment
    → ''polar-line · python · pygal · anyplot.ai''. Likely cause: the title string.'
  - 'SC-02 (dark): the concentric grid circles nearly vanish on #1A1A17 (C3: grid
    visible in both themes) → circles in the muted ink tone like the radial spokes.
    Likely cause: pygal''s default y-guide stroke not set from INK_MUTED.'
  - 'VQ-06 (both): the radial axis never names its quantity (wind speed, m/s) → name
    it in the chart, e.g. in a title prefix or legend title. Likely cause: no label
    for the radius quantity.'
  - 'CQ-01 (code): no # Data / # Plot block ending in a tidy df, no column constants
    for the theta and radius roles, and IMPRINT lists 7 of 8 positions → follow the
    six-zone layout with role constants and the full eight-colour palette. Likely
    cause: hard-coded lists added straight to the chart.'
  - 'CQ-04 (code): comments contradict the code (''Okabe-Ito palette'' above the Imprint
    colours, ''Custom style for 4800x2700'') and stroke_style={''width'': 3} duplicates
    stroke_width=3 → fix the comments and drop the duplicate. Likely cause: leftovers
    from an older palette and canvas.'
  - 'Suggestion: a descriptive title prefix would tell the reader what the loops measure.'
