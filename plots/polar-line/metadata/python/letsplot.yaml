review:
  strengths:
  - coord_polar(start=0, direction=1) puts January at 12 o'clock and runs the months
    clockwise, so the circle reads like a calendar dial
  - Each series is closed into a loop by appending its first point a full turn later
    (theta + 360), so the cyclic December→January segment is drawn without a gap or
    a seam
  - Lines interpolate linearly in theta and radius between the monthly points, so
    every point sits on its line and nothing is smoothed past the data
  - 'Grid of concentric circles and month radials is drawn from a translucent ink
    token, clearly lighter than the data lines and visible on both #FAF8F1 and #1A1A17'
  - Radial axis title 'Mean temperature (°C)' is centered on the center-to-top half
    where the radial scale actually runs (hjust=0.75), and the round panel's outline
    is removed so it does not cut through the month labels
  - 'Imprint palette in canonical order (#009E73, #C475FD), identical in both renders;
    all chrome follows the theme tokens'
  - Long-format melt plus one aes(color=Series) mapping drives both geom_line and
    geom_point and the legend, with HTML export giving native lets-plot hover tooltips
  weaknesses:
  - 'DQ-02 (both): the two series are labelled ''City A'' and ''City B'', generic
    placeholders for a real-world temperature scenario → name two real cities whose
    monthly means match the values (for example two Northern-Hemisphere cities). Likely
    cause: RADII = ["City A", "City B"].'
  - 'DQ-01 (both): City B is City A plus a near-constant 2–3 °C every month, so the
    two loops are nested copies of one shape and the plot shows no difference in seasonal
    amplitude or timing between series → choose two series whose cycles differ in
    shape (for example a continental and a maritime climate). Likely cause: the RADII[1]
    value list.'
  - 'Suggestion: a slightly larger radial tick size (10 → 11 pt) would make the 0–30
    scale easier to read in the 400 px thumbnail.'
  - 'Suggestion: lets-plot tooltips could be customised with layer_tooltips() to show
    month, city and temperature in the HTML view.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white, consistent with #FAF8F1 across the whole 2400x2400 canvas (no white box around the panel).
      Chrome: bold title "polar-line · python · letsplot · anyplot.ai" top-left in near-black ink, about 60 % of the width; month labels Jan (top) clockwise through Dec in dark ink at 12 pt around the circle; radial tick labels 0–30 in soft grey on the left, aligned with the circle tops; rotated axis title "Mean temperature (°C)" on the left; legend "City A / City B" centered below. Concentric circles every 5 °C and twelve month radials in a light translucent grey. All text readable.
      Data: City A in brand green #009E73 and City B in purple #C475FD, thick lines with medium point markers at each month, each closed into a loop; heart-shaped loops with the cold months near the center at the top and the summer peak at Jul at the bottom. First series is #009E73.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black, consistent with #1A1A17 across the canvas.
      Chrome: title and month labels in light off-white ink, radial ticks and legend text in light grey, axis title in light ink; grid circles and radials in a subtle light translucent grey, visible but quieter than the data. No dark-on-dark text anywhere.
      Data: identical colors to the light render (#009E73 green, #C475FD purple), same geometry and markers; brand green reads clearly on the dark surface.
      Legibility verdict: PASS
