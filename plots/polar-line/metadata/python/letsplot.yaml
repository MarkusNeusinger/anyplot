review:
  strengths:
  - Real 1981–2010 monthly temperature normals for maritime Lisbon and continental
    Madrid give two loops of clearly different shape that cross in early summer and
    autumn, so the polar form earns its place
  - Each loop is closed by appending the first month a full turn later (theta + 360)
    instead of hard-coding a point, so the line joins its points in theta order and
    wraps back to January without a gap
  - Month names replace raw degrees on the angular axis via scale_x_continuous breaks/labels
    derived from the data, and coord_polar(start=0, direction=1) puts January at 12
    o'clock running clockwise like a calendar
  - 'Theme tokens threaded through every chrome element: INK for title and month labels,
    INK_SOFT for radial ticks and legend, a translucent grid lighter than the data
    lines in both themes; Imprint #009E73 then #C475FD'
  - The round panel's outline is removed so it does not cut the month labels' descenders,
    and the radial-axis title is centred on the centre-to-top half the scale actually
    spans
  - gggrid one-cell wrapper paints the whole 2400×2400 canvas in the page colour despite
    coord_polar narrowing the plot box; HTML export keeps lets-plot's native hover
    tooltips
  weaknesses:
  - 'Suggestion: the radial tick label "0" sits on the same baseline as the "Oct"
    month label at the left edge; a little more horizontal separation would keep them
    from reading as one label at thumbnail size.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 over the whole 2400×2400 canvas, no white box around the round panel.
      Chrome: bold dark title "polar-line · python · letsplot · anyplot.ai" top-left (~60 % of the width); twelve month labels Jan (top) clockwise to Dec in dark ink around the circle; radial tick labels 0–25 in soft grey on the left with the rotated title "Mean temperature (°C)"; concentric rings every 5 °C and 12 radial spokes in a light translucent grey; legend at the bottom (Lisbon, Madrid) with line+point glyphs. All text readable.
      Data: Lisbon in #009E73 (first series) as a nearly round closed loop between ~11.6 and 23.6 °C; Madrid in #C475FD as a lopsided loop, inside Lisbon in winter (~6 °C at Jan) and outside it in summer (~25.6 °C at Jul), crossing near Jun and Sep. Markers sit on the lines at every month.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17 over the full canvas.
      Chrome: title and month labels in light ink, radial ticks and legend text in light soft grey, grid rings and spokes in a translucent light grey that stays lighter than the data lines but visible. No dark-on-dark text anywhere.
      Data: identical #009E73 Lisbon and #C475FD Madrid loops, same positions and markers as the light render; only chrome flipped.
      Legibility verdict: PASS
