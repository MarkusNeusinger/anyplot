review:
  strengths:
  - Hour of day mapped as a clock face (midnight at top, clockwise) with ticks every
    3 hours, which keeps the angular axis readable
  - Loop closed properly by appending the first hour at 24:00, so the cyclic series
    join without a gap
  - Theme tokens threaded through every chrome element; both renders pass legibility
    with identical data colors
  - hovertemplate with customdata gives clock hour and sessions in the interactive
    HTML
  - Clean df-based structure with column constants and a single loop over series
  weaknesses:
  - 'VQ-02 (both): the radial tick labels run up the 0:00 spoke where both series
    pass; the Weekend 0:00 point at about 21k covers the ''20'' tick label and the
    Weekday line runs beside ''10'' → place the radial axis on a low-traffic spoke
    (for example angle about 45-60 deg, the 2:00-3:00 night trough where both series
    stay under ~8k) so no line crosses its labels. Likely cause: radialaxis angle=90.'
  - 'VQ-05 (both): the polar disc spans only about 63 % of the canvas width, with
    empty bands of roughly 250 px between title and disc and between disc and caption
    → enlarge the disc to about 75-80 % of the width (domain about [0.03, 0.97], +0.07
    each side). Likely cause: polar domain x=[0.1, 0.9], y=[0.1, 0.9].'
  - 'CQ-01 (code): the Data block defines a helper function bump() (lines 39-42) →
    compute the wrapped gap inline, e.g. one vectorised expression per peak, with
    no function definition. Likely cause: the Gaussian bump factored into a def.'
  - 'Suggestion: a subtle emphasis on the weekend evening peak versus weekday working
    hours could guide the eye.'
