review:
  strengths:
  - 'Clock-like polar frame built from native glyphs: 0h at the top, hours running
    clockwise, concentric rings from a data-driven 1-2-5 step and 12 radial spokes,
    all at INK alpha 0.15 so the grid stays lighter than the data in both themes'
  - Each day is one closed loop in theta order with straight segments (no smoothing)
    and 24 markers sitting exactly on the line, rimmed in the page color so they read
    cleanly against the line and grid
  - 'Radius values placed on the half-spoke angle between 0h and 2h, so they never
    sit on a grid line, plus an explicit ''Radius: Wind speed (m/s)'' caption naming
    what the rings measure'
  - Shared legend_label merges each series' line and scatter into one combined legend
    glyph, and a per-series HoverTool bound to the marker renderer exposes hour and
    wind speed in the HTML
  - 'Theme tokens threaded through title, labels, legend and background; data colors
    #009E73 / #C475FD identical in both renders'
  weaknesses:
  - 'DQ-02 (both): the series are labelled ''Day 1'' and ''Day 2'', which reads as
    generic placeholders for a wind-speed record → name the days with real dates (for
    example ''12 Mar'' / ''13 Mar'') or a site and date. Likely cause: the DAYS column-name
    constants.'
  - 'Suggestion: a short annotation of the midday wind peak (the sea-breeze maximum
    near 12h) would give the chart a focal point.'
  - 'Suggestion: moving the legend closer to the plot area (for example into the empty
    top-left corner beside 22h) would shorten the eye path from the loops to their
    names.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole 2400x2400 canvas, no white seams.
      Chrome: bold dark title "polar-line · python · bokeh · anyplot.ai" centered at top (~50% width); hour labels 0h-22h every 2h around the outer ring in INK_SOFT; radius labels 2-12 along the 1h half-spoke; caption "Radius: Wind speed (m/s)" at the bottom; framed legend top right (Day 1, Day 2). Six concentric rings and 12 radial spokes, subtle but visible. All text readable.
      Data: Day 1 in #009E73 (first series) and Day 2 in #C475FD, each a closed loop of 24 straight segments with page-rimmed markers; both loops bulge toward 12h (peak ~10 m/s for Day 1, ~8 for Day 2) and shrink near 18h-20h; loops cross near 22h-23h.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17, no pure black.
      Chrome: title in light INK, hour and radius labels in light INK_SOFT, caption in light ink, legend on elevated #242420 with light labels; rings and spokes dim grey but visible. No dark-on-dark text.
      Data: identical colors and shapes to the light render (#009E73 and #C475FD), markers rimmed in the dark page color; brand green clearly visible.
      Legibility verdict: PASS
