review:
  strengths:
  - 'Polar frame built cleanly on a square 2400x2400 canvas with axes hidden: concentric
    rings and 12 radial spokes at INK alpha 0.15, clearly lighter than the data lines
    in both themes, as the spec''s characteristic section asks'
  - Clock orientation (0h at the top, clockwise) fits the time-of-day scenario, and
    each series is closed into a loop in theta order with markers sitting exactly
    on the line
  - Radial ring steps are derived from the data with a 1-2-5 rule rather than typed
    numbers, and the radius values are labelled along an off-spoke bearing so they
    never sit on a grid line
  - Markers carry a page-colored outline that keeps them distinct where the two loops
    cross, identical in both themes
  - Per-series HoverTool bound to the marker renderers gives series, hour and wind
    speed in the HTML output
  weaknesses:
  - 'VQ-01 (both): the radius values (2-12) are drawn at 28pt, smaller than the 34pt
    angle labels and the style guide''s 34pt tick size, and blur to about 6 px in
    the 400 px thumbnail -> 34pt (+6 pt). Likely cause: text_font_size="28pt" on the
    radius-label p.text call.'
  - 'Suggestion: the outermost 12 m/s ring sits well beyond the peak value of about
    10 m/s; a tighter outer ring would give the loops more of the canvas.'
  - 'Suggestion: a legend title such as ''Day'' would name what the two entries share.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white, matches #FAF8F1 edge to edge (no white seam).
      Chrome: bold dark title "polar-line · python · bokeh · anyplot.ai" centered at the top (~50% of the width); hour labels 0h-22h every 2h in dark-grey INK_SOFT just outside the outer ring; radius values 2-12 along the bearing between 0h and 2h; "Radius: Wind speed (m/s)" caption at the bottom; legend top-right on an elevated off-white box with a soft border. All text readable.
      Data: two closed loops of 24 hourly points — "12 Mar 2025" in #009E73 green (first series) and "13 Mar 2025" in #C475FD purple, lines ~5 px with 16 px markers outlined in page color; both loops bulge toward 10-12h (peak ~10 m/s) and shrink near 18-20h; loops cross near 22-23h. Grid rings and spokes are subtle grey, lighter than the data.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black, matches #1A1A17.
      Chrome: title in light F0EFE8 ink, hour labels and radius values in light grey B8B7B0, caption in light ink, legend on #242420 with a soft border and light text. No dark-on-dark text anywhere.
      Data: identical green #009E73 and purple #C475FD loops and markers to the light render; marker outlines now near-black. Grid rings/spokes subtle grey and still visible.
      Legibility verdict: PASS
