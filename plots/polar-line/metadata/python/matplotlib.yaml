    rings. Likely cause: ax.set_rlabel_position(45).'
  - 'Suggestion: a clock-style angular axis (ax.set_theta_zero_location(''N''), ax.set_theta_direction(-1))
    would put 0:00 at the top and run the hours clockwise, as readers expect from
    a time-of-day dial.'
