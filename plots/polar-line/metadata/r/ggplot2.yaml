review:
  strengths:
  - 'Correct polar-line construction: geom_path/geom_point in coord_polar(theta =
    "x"), with the bearing-0 point duplicated at 360 so each station''s loop closes
    cleanly instead of leaving a gap.'
  - 'Realistic, neutral dataset: three monitoring stations with distinct prevailing
    wind bearings and speeds, plus Gaussian noise, producing three visibly different
    rose shapes that tell a clear directional story.'
  - 'Imprint palette applied in canonical order (#009E73, #C475FD, #4467A3) and identical
    across both themes; both plot backgrounds are correctly theme-adaptive (#FAF8F1
    / #1A1A17), and all chrome text is legible in both renders.'
  - 'Clean, idiomatic single-file ggplot2 script: explicit font sizes throughout,
    seeded RNG, ragg PNG device, no functions/classes.'
  weaknesses:
  - 'Every compass tick label (N, NE, E, SE, S, SW, W, NW) sits exactly on top of
    a radial spoke line and/or the outermost grid circle, so a thin dark line cuts
    through each letter in both themes (visible on close inspection, e.g. "NE", "W",
    "N", "SE"). Root cause: panel.grid.major uses a fully opaque INK color instead
    of the style guide''s translucent rule color (rgba(26,26,23,0.15) light / rgba(240,239,232,0.15)
    dark) — switching to a low-alpha grid would make the line-through-label crossings
    nearly invisible and also better match the ''subtle grid, 15-25% opacity'' guideline.
    Docked in VQ-02 (No Overlap) and VQ-05.'
  - Grid lines are more prominent/high-contrast than the style guide's 'subtle, 15-25%
    opacity' target for both the concentric circles and the radial spokes — same opaque-INK
    root cause as above. Docked in DE-02 (Visual Refinement).
  - Design is functionally correct but reads as a well-configured default rather than
    a polished, distinctive wind-rose (e.g. no radial-axis emphasis, no per-station
    peak callouts, uniform line weight for all three series) — raise DE-01/DE-03 with
    a bit more visual hierarchy (e.g. slightly bolder or annotated leading station).
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "polar-line · r · ggplot2 · anyplot.ai" top-left in dark ink, fully visible, not clipped. Radial tick labels (0/10/20/30) and axis title "Wind speed (km/h)" in dark/soft-dark ink, clearly readable. Compass direction labels (N, NE, E, SE, S, SW, W, NW) ring the outer circle in soft-dark gray — legible, but each one has a thin dark grid line (radial spoke and/or outer circle) crossing directly through its letters, a systematic overlap across all 8 labels. Legend at bottom ("Station: Station A / B / C") with matching color swatches, fully visible, not isolated.
      Data: Three closed loops in Imprint green (#009E73, Station A, largest radius, peak toward N), lavender (#C475FD, Station B, smallest radius, peak toward SE/E), and blue (#4467A3, Station C, mid radius, peak toward SW). Lines and 1.8pt points are clearly distinguishable from each other and from the background.
      Legibility verdict: PASS (all text readable; the grid-line-through-label crossings are a cosmetic overlap issue, not a legibility failure — letters remain fully readable).

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title, axis title, and radial tick labels now rendered in light ink (#F0EFE8) / soft-light gray (#B8B7B0), clearly legible against the dark background — no dark-on-dark failures observed. Grid lines flipped to light/white, again crossing directly through each compass label's letters (N, NE, E, SE, S, SW, W, NW) — same systematic issue as the light render, now with light lines instead of dark ones. Legend renders correctly in light text.
      Data: Green, lavender, and blue lines/points are pixel-identical in hue to the light render — only the chrome (background, text, grid) flipped as required.
      Legibility verdict: PASS (no dark-on-dark or light-on-light failures; same grid-crossing-label cosmetic issue as light render).
