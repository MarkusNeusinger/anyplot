review:
  strengths:
  - 'Clever closeLoop() technique solves the classic ECharts polar gotcha: a category
    angleAxis can''t close the ring, so the axis runs on a continuous 0-12 value scale
    with a month-name formatter and each series repeats its January value at position
    12 to draw a fully closed loop.'
  - Data choice (Northern vs. Southern hemisphere monthly temperatures, opposite seasonal
    phase) gives the polar form genuine storytelling value — the inner cold ring and
    outer warm ring make the phase inversion obvious at a glance.
  - Theme tokens are threaded through every chrome element (title, legend, both axes,
    split lines) — both renders are fully legible with no dark-on-dark or light-on-light
    failures.
  - 'Correct Imprint palette usage: brand green first series, lavender second, identical
    data colors across light and dark.'
  - Polar center/radius offset (50%/54%, 62%) is a thoughtful layout choice that leaves
    clean room for the bottom legend without crowding the ring.
  weaknesses:
  - Only 12 unique points per series (24-26 total with the closing repeat), near the
    low end of the spec's 20-500 recommended range — consider higher-resolution data
    (e.g. weekly instead of monthly) for a fuller-feeling ring.
  - The outermost radial tick label ('30°C') sits directly on the outer grid circle
    at the Jan axis, slightly crowding the boundary — add a touch of radiusAxis max
    headroom or nudge the label so it clears the outer split line cleanly.
  - No explicit descriptive radial-axis title beyond the °C-suffixed tick labels —
    acceptable given polar space constraints, but a small axis name would reinforce
    what the radius encodes.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 target.
      Chrome: Title "polar-line · javascript · echarts · anyplot.ai" centered at top in dark ink, clearly readable. Angle-axis month labels (Jan-Dec) and radius-axis temperature labels (-5°C to 30°C) render in soft dark gray, all legible. Concentric circular grid lines and radial spokes are subtle gray, visible but not competing with data. Legend ("Northern hemisphere", "Southern hemisphere") sits centered at the bottom in dark text with matching colored line+marker swatches.
      Data: Two closed rings — brand green "Northern hemisphere" (small inner ring, near 0°C in winter months rising to ~26°C in Jul/Aug) and lavender "Southern hemisphere" (larger outer ring, ~23°C in Jan/Feb dropping to ~12°C in Jul), each with circular markers at every month and a repeated January point at month 12 to close the loop seamlessly. First series is #009E73 as required.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 target.
      Chrome: Same title, now in light ink, clearly readable against the dark background. Month and temperature tick labels render in light gray, fully legible — no dark-on-dark failures anywhere. Grid circles/spokes are subtle light gray at low opacity, visible without dominating. Legend text is light-colored and reads cleanly against the dark background.
      Data: Same green/lavender rings in identical positions and colors as the light render — only the chrome (background, text, grid) flipped, confirming theme-adaptive tokens were applied correctly and data colors stayed constant.
      Legibility verdict: PASS
