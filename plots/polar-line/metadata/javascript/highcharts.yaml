review:
  strengths:
  - Highcharts core has no polar module (highcharts-more not loaded); instead of returning
    NOT_FEASIBLE, the implementation converts (hour, kWh) to Cartesian (x, y) and
    hand-draws the concentric-circle radius rings and radial hour spokes with the
    renderer API — a genuine polar coordinate system, not a picture of one.
  - Weekday's double-peak (morning commute + evening cooking) versus weekend's single
    broad midday-to-evening bump is immediately legible from shape alone — the story
    reads at a glance.
  - 'Full Imprint palette compliance: Weekday is #009E73 (brand green, position 1),
    Weekend is #C475FD (position 2, canonical order); data colors are pixel-identical
    between light and dark renders, only chrome flips.'
  - 'Both renders pass the theme-readability check: warm off-white / warm near-black
    backgrounds, all title/subtitle/legend/tick text uses theme-adaptive ink tokens
    with no dark-on-dark or light-on-light failures.'
  - Title format is correct ("Hourly Energy Demand · polar-line · javascript · highcharts
    · anyplot.ai") and comfortably sized for the square canvas; subtitle and legend
    give clear real-world context (U.S. household electricity demand).
  - Tooltip formatter surfaces exact hour + kWh per point — a nice interactive touch
    that adds value in the HTML detail view without harming the static PNG.
  weaknesses:
  - Radial axis tick labels (0.3, 0.6, 0.9, 1.2) show bare numbers with no unit —
    append "kWh" (e.g. "0.3 kWh") or add a small radial axis title so the scale is
    self-explanatory without relying on the tooltip/subtitle.
  - The "0.3" radial tick label is placed along the hour-1 spoke, which is exactly
    where both the Weekday and Weekend lines sit at that time of night (values ~0.28-0.36
    kWh) — the label crowds/overlaps the lines there. Move the tick labels to a sparser
    spoke (e.g. hour 2 or hour 23, where all series sit further from that radius)
    or nudge them further outward along the same spoke.
  - Only 24 points per series (sparse, well under the <50-point threshold) — the style
    guide calls for larger, more prominent markers at this density; current marker.radius=4
    (CSS px) reads a little small relative to the 2.5px line weight. Bumping to ~5-6
    would make individual hourly readings pop more.
  - 'Data storytelling is good via shape alone but could go further: a light callout
    or emphasis at the weekday morning/evening peaks (e.g. hour 8 and hour 19) would
    sharpen the focal point beyond just the line shape.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white, not dark.
      Chrome: Title "Hourly Energy Demand · polar-line · javascript · highcharts · anyplot.ai" in bold dark ink at top-center, comfortably within plot width (no clipping/overflow). Subtitle in softer grey directly below. Hour labels (00:00, 03:00, 06:00, 09:00, 12:00, 15:00, 18:00, 21:00) ring the outer edge of the polar plot in soft grey, evenly spaced every 3 hours. Radial tick labels (0.3, 0.6, 0.9, 1.2) sit along the ~01:00 spoke in soft grey. Concentric circular grid rings and radial spokes are thin and subtle, clearly visible but not competing with data. Legend ("Weekday", "Weekend") centered at the bottom in soft grey text with color swatches. All text is clearly readable against the light background — no light-on-light issues.
      Data: Weekday line is brand green (#009E73) with circular markers, tracing a double-peak shape (morning ramp around 06:00-08:00, higher evening peak around 18:00-20:00). Weekend line is lavender (#C475FD, Imprint position 2), tracing a smoother single broad bump spanning midday into evening, with a lower overnight trough than weekday. Lines are clearly distinguishable from each other and from the background.
      Legibility verdict: PASS (one minor overlap: the "0.3" radial tick label sits close to both data lines near the 00:00–01:00 sector — a legibility nuisance, not a failure, since text stays independently readable).

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black, not light.
      Chrome: Same layout as light — title now rendered in light/white ink, subtitle and axis/tick/legend labels in light grey. Grid rings and spokes remain subtle. No dark-on-dark failures observed; every chrome element (title, subtitle, hour labels, radial tick labels, legend) is clearly legible against the dark background.
      Data: Weekday (#009E73) and Weekend (#C475FD) lines are pixel-identical in hue and shape to the light render — only the chrome (background, text, grid) flipped as required. Both lines remain clearly distinguishable against the dark surface.
      Legibility verdict: PASS (same minor "0.3" label proximity-to-line issue as light render, not a legibility failure).
