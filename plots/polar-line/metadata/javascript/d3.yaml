review:
  strengths:
  - 'Correct Imprint palette usage: first series is brand green #009E73, chrome (background,
    text, grid, legend) is fully theme-correct and readable in both light and dark
    renders'
  - Clean, deterministic, KISS D3 code using idiomatic patterns (scaleLinear, lineRadial
    + curveLinearClosed, data joins) with no fake interactivity
  - 'Realistic, factually sound data: wind speed by compass direction across seasons,
    correctly reflecting the real-world prevailing-westerlies pattern (stronger, more
    W-skewed in winter)'
  - Thoughtful radial tick-label placement on a spoke offset from the direction grid,
    avoiding overlap with the plotted lines and markers
  - Title, legend, and grid are clean and correctly sized; nothing clipped or overflowing
    the canvas in either theme
  weaknesses:
  - Design Excellence is competent but not distinctive yet — consider a low-alpha
    radial fill under the Winter line (d3.areaRadial) to emphasize the seasonal magnitude
    gap, which would also strengthen the data-storytelling focal point
  - Legend swatches show only a stroke line; add a small circle marker matching the
    on-chart marker style so the legend mirrors the line+marker encoding used in the
    plot
  - Library Mastery usage is fairly generic (scaleLinear + lineRadial) — leverage
    a more distinctive D3 shape-generator feature, e.g. d3.curveCardinalClosed for
    a smoother radial curve or d3.areaRadial for a filled layer, to showcase capabilities
    harder to replicate in higher-level charting libraries
  - Radial tick labels are set at 13px, slightly smaller than the 15px used for direction
    labels and legend text — bump to ~14-15px for better size balance
  - Second series color (t.palette[2], blue) skips t.palette[1] (lavender) in the
    canonical order — acceptable as a winter/cold semantic exception, but consider
    a brief code comment noting the intentional semantic choice so it reads as deliberate
    rather than arbitrary
