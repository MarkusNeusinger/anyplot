review:
  strengths:
  - 'Correct polar-line construction: d3.lineRadial + d3.curveCardinalClosed closes
    the loop so cyclical compass data reads as a continuous cycle, with concentric-circle
    and radial-spoke grids exactly as the spec requests'
  - Radial fill (d3.areaRadial) between the Summer and Winter curves spotlights the
    seasonal gap at a glance — genuine data storytelling, not decoration
  - 'Palette compliance with documented reasoning: Summer uses brand green (#009E73,
    position 1) and Winter deliberately uses palette[2] (blue) as a warm/cold semantic
    pairing rather than the ordinal palette[1] — consistent with the style guide''s
    semantic-exception rule, and the code comment explains the choice'
  - 'Realistic, physically plausible data: coastal wind-rose speeds (6-36 km/h) that
    peak in the W/WSW quadrant in both seasons and are systematically higher in winter
    — a textbook prevailing-westerlies pattern'
  - 'Clean, idiomatic D3: explicit font sizing (15px/30px), theme tokens threaded
    through every text/stroke element, markers with page-background strokes for definition,
    and a compact custom legend anchored near the plot'
  - Both renders are theme-correct — identical data colors, warm off-white / near-black
    backgrounds, all chrome text legible in both themes with no clipping at any canvas
    edge
  weaknesses:
  - The '10 km/h' radial tick label (placed at tickAngle = angle(0.5), between N and
    NNE) sits directly on top of / touching the Summer series marker and line at that
    angle in both themes — pick a tickAngle whose local radius on both series curves
    stays clearly outside the largest tick circle it must label, or nudge the label
    radially outward with a small background halo/pill.
  - Direction labels and radial tick labels share the same 15px size — the radial
    tick labels ('10 km/h' etc.) are secondary/reference information, so giving them
    a slightly smaller size than the primary direction labels would sharpen the typographic
    hierarchy.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Title "polar-line · javascript · d3 · anyplot.ai" in bold dark ink, fully visible, not clipped. 16 compass-direction labels (N, NNE, NE, ...) ring the outside of the plot in soft dark gray. Radial tick labels ("10 km/h" through "40 km/h") sit along a spoke between N and NNE in the same soft gray. Concentric circular grid + 16 radial spokes in light gray. Legend ("Summer" green, "Winter" blue) centered below the plot. All text is dark-on-light and clearly readable, EXCEPT the "10 km/h" label, which visually collides with a Summer series marker/line directly beneath it.
      Data: Two closed radial loops — Summer in brand green (#009E73) with circular markers, Winter in blue (palette position 3, deliberate warm/cold semantic pairing per code comment) with circular markers, each 3px stroke width. A light gray fill occupies the ring between the two curves, spotlighting the seasonal gap (widest around W/WSW, narrowest around E). Both curves are cyclical closed loops (curveCardinalClosed), consistent with the spec's "line connects points in theta order" requirement.
      Legibility verdict: PASS (one minor overlap noted above, not a legibility failure — the text remains readable, just touching a marker).

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Same title, direction labels, and radial tick labels, now rendered in light gray/off-white, fully legible against the dark background. Grid lines are subtle and still visible. Legend text is light-colored and readable.
      Data: Data colors are identical to the light render — Summer green (#009E73) and Winter blue are unchanged, confirming the palette holds constant across themes; only the chrome (background, grid, text, area-fill tint) adapts. The same "10 km/h" label/marker overlap is present here too, at the same location.
      Legibility verdict: PASS (same minor overlap as light render; no dark-on-dark or light-on-light failures).
