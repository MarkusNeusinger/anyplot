review:
  strengths:
  - Smart, well-reasoned adaptation of the radar chart type to satisfy the polar-line
    spec given Chart.js's lack of a native primitive, explained via code comment rather
    than reaching for another library
  - Deterministic fixed-seed LCG for reproducible data generation in a browser environment
    with no seeded RNG
  - Angle-label decluttering (index % 3 === 0) is a thoughtful proportional-sizing
    choice for 36 categories, avoiding overlap without losing information
  - Palette and theme chrome are fully compliant and identical in data hue across
    light/dark renders
  weaknesses:
  - Radial (magnitude) axis ticks show bare numbers with no unit label - add a radial
    scale title (e.g. "Wind Speed (mph)") or otherwise surface the unit on the axis
    itself, not just in the legend
  - Design Excellence is at well-configured-default level - add a bespoke touch (subtle
    low-alpha fill, marker-shape distinction, or refined grid treatment) to lift DE-01/DE-02
  - No visual emphasis calls out the diurnal direction shift between morning and afternoon
    series - a brief annotation or highlighted peak would strengthen the storytelling
  - The afternoon series' ~6x swing between its calm and dominant directions is a
    bit aggressive for a believable average-wind-speed-by-direction dataset - consider
    narrowing the amplitude for tighter factual plausibility
  image_description: |-
