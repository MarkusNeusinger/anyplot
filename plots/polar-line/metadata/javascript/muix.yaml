review:
  strengths:
  - Faithfully reconstructs a native-feeling polar/radial line chart even though the
    community @mui/x-charts package has no polar chart component, using real trigonometry
    mapped through useDrawingArea rather than faked chrome
  - The hand-drawn polylines are backed by a genuine matching scatter series (same
    coordinate transform), so ChartsLegend and ChartsTooltip read real series data
    instead of decorative labels
  - Two clearly differentiated, realistic antenna radiation patterns (near-circular
    omnidirectional dipole vs. narrow-beam Yagi with a visible back lobe) give the
    chart genuine data storytelling
  - Theme-adaptive chrome is correct in both renders and the Imprint palette is applied
    correctly (brand green first, lavender second, identical across light/dark)
  - Concentric gain rings and 45° radial spokes satisfy the spec's grid requirement,
    with subtle opacity/weight differences (cardinal vs. intercardinal) for a refined
    hierarchy
  weaknesses:
  - The radial (gain) axis only shows bare numeric ticks (0.2–1.0) with no descriptive
    label anywhere on the chart (e.g. 'Normalized gain') — a first-time viewer has
    no textual cue for what the ring values represent beyond inferring it from the
    title/legend.
  - Scatter markers (markerSize=6) are on the small side for only 24 sparse points
    per series (per the density heuristic, <50 points should get larger, more prominent
    markers), especially where the Yagi back-lobe points cluster tightly near the
    center and start to merge visually.
  - The plain rounded-rect background behind each gain tick label (fill=PAGE_BG) is
    a slightly utilitarian way to keep labels legible over the crossing pattern lines
    — a subtler treatment (e.g. a text halo/stroke in the page background color) would
    look more polished.
  - The chart leans on a manual composition workaround (ChartContainer + useDrawingArea
    + a shadow scatter series) rather than any higher-level, chart-type-specific MUI
    X feature — solid engineering, but library mastery credit is capped since it's
    a generic SVG-layer technique rather than something distinctive to MUI X's own
    chart vocabulary.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Bold centered title "polar-line · javascript · muix · anyplot.ai" in dark ink; eight radial spokes labeled 0°/45°/90°/.../315° (cardinal directions bold/larger, intercardinal lighter/smaller); five concentric gain rings labeled 0.2–1.0 along the top spoke with a small background pill behind each number for legibility; bottom legend with "Omnidirectional dipole" (green swatch) and "Directional Yagi" (lavender swatch). All chrome text is dark and clearly readable against the light background.
      Data: First series (Omnidirectional dipole) is brand green #009E73 forming a near-circular closed loop with a small ripple; second series (Directional Yagi) is lavender/purple forming a narrow spike toward 0° (boresight) with a small back-lobe bump near 180° and low values elsewhere. Circular markers trace each 15° sample point on both curves.
      Legibility verdict: PASS — no overlapping or clipped text observed; gain tick labels near the top spoke stay legible over the crossing lines thanks to their background pill.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same layout as the light render — title, degree labels, gain-ring labels, and legend all render in light ink/text tokens (INK / INK_SOFT) against the dark background. Grid rings and spokes use the theme's grid token at reduced opacity, staying subtle but visible.
      Data: Data colors are pixel-identical to the light render — brand green for the omnidirectional pattern, the same lavender for the Yagi pattern — confirming only chrome (not data color) flips between themes.
      Legibility verdict: PASS — no dark-on-dark text found; all title/spoke/tick/legend text is clearly light-colored and readable against the dark surface.
