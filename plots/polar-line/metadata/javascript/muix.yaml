review:
  strengths:
  - 'Real polar trigonometry (not faked): the hand-drawn SVG rings/spokes/polygons
    and the underlying MUI ScatterPlot series are mapped through the same linear xAxis/yAxis
    domain, so the real MUI scatter dots, ChartsLegend, and ChartsTooltip all read
    genuine series data instead of decorative chrome'
  - Theme-adaptive gain-tick labels use a page-background stroke halo instead of a
    flat pill background, keeping '0.2'/'0.4'/etc. legible where the pattern lines
    cross them, in both light and dark
  - Degree labels use angle-aware text-anchor/dominant-baseline logic so labels at
    0/45/90/... never collide with the spokes or each other
  - Realistic, neutral RF antenna radiation-pattern use case (omnidirectional dipole
    vs. directional Yagi) with a sensible 0-1 normalized-gain scale and a small physical
    ripple/back-lobe rather than an idealized circle
  - 'Correct Imprint categorical order (green #009E73 then lavender #C475FD), identical
    across both themes; both backgrounds correctly warm off-white / warm near-black'
  - skipAnimation set, deterministic in-memory data generation, and only used imports
  weaknesses:
  - 'The file has a duplicated, contradictory header block (lines 1-10): two ''//
    anyplot.ai'' headers stacked back to back, one claiming ''Quality: 88/100'' with
    ''Library: muix 7.29.1 | JavaScript 22.23.2'' and no license line, the other claiming
    ''Quality: pending'' with ''Library: MUI X Charts | React | Node 22'' plus the
    License line. The ''//# anyplot-orientation: square'' directive ends up sandwiched
    between the two blocks instead of sitting alone as the very first line per the
    header-style contract. Collapse this to a single, correct header block with the
    orientation directive as line 1.'
  - The Yagi series' back-lobe sample points (near the center, around the 90°/270°
    crossing) cluster very tightly and slightly overlap each other visually — a minor
    consequence of the real gain function being near-zero across many consecutive
    angles, not a layout bug, but it makes individual points hard to distinguish there.
  - Design excellence and library mastery are solid but could go further — e.g. no
    highlight/annotation calling out the boresight peak (0°) or the front-to-back
    ratio, which would strengthen the data-storytelling angle for this antenna-engineering
    context.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1), consistent with the Imprint light theme, not pure white.
      Chrome: Title "polar-line · javascript · muix · anyplot.ai" centered at top in bold dark ink, clearly legible. Concentric gain rings (0.2-1.0) labeled with white-haloed dark-ink text along the top spoke. Eight radial spokes at 45° increments with degree labels (0°-315°), cardinal directions (0/90/180/270) bolder/larger than intercardinal. A rotated "Normalized gain" axis label runs alongside the ring ticks. Bottom legend shows "Omnidirectional dipole" (green swatch) and "Directional Yagi" (lavender swatch). All text is clearly readable against the light background — no light-on-light issues.
      Data: Omnidirectional dipole drawn as a near-circular green (#009E73) polygon with a small ripple, gain roughly 0.75-0.85 all around. Directional Yagi drawn as a lavender (#C475FD) polygon with a sharp, narrow main lobe reaching 1.0 at 0° (boresight) and dropping to a very small back lobe (~0.05-0.1) across the 90°-270° range. Markers are prominent (size 8) and clearly distinguishable from the lines and background.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17), consistent with the Imprint dark theme, not pure black.
      Chrome: Same title, ring, spoke, degree-label, axis-label, and legend layout as the light render, now rendered in light ink/text against the dark background. Grid rings and spokes are subtle gray, clearly visible without dominating. No dark-on-dark failures observed — all text (title, degree labels, gain-tick labels, legend) reads clearly against the dark surface.
      Data: Both the green omnidirectional and lavender directional-Yagi polygons use the identical colors and shapes as the light render — only the chrome (background, text, grid) flipped, confirming palette identity is preserved across themes.
      Legibility verdict: PASS
