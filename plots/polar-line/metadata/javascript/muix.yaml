review:
  strengths:
  - 'Composes a true polar frame inside MUI X''s ChartsContainer: a custom SVG layer
    reads useXScale/useYScale so rings, spokes and the closed polygons share the exact
    scales of the native ScatterPlot markers'
  - 'Both series are closed straight-segment loops in azimuth order with every marker
    on its data value: no smoothing overshoot, correct compass orientation (0° at
    top, clockwise)'
  - 'Antenna radiation patterns (omnidirectional dipole vs directional Yagi with main
    and back lobe) are a realistic, neutral scenario that exercises the plot type:
    a near-circular loop beside a lobed shape near the center'
  - 'Clear angular label hierarchy: cardinal angles bold in ink at 17 px, 45° diagonals
    in inkSoft at 14 px; heavier outer ring frames the plot'
  - Imprint palette by position (t.palette[idx]) with brand green first, theme tokens
    on all chrome, both renders fully readable; scatter markers keep MUI X hover tooltips
    in the HTML output
  weaknesses:
  - 'VQ-02 (both): the page-colored pill behind the radius tick labels is drawn after
    the data polygons and cuts the lines, a gap in the Yagi line just right of the
    1.0 peak and in the dipole line beside the 0.8 label → no data line interrupted
    by a tick-label background. Likely cause: the `rings.map` tick-label `<rect fill={t.pageBg}>`
    block rendered after the `<polygon>` elements in PolarLayer; draw the tick labels
    before the polygons or drop the opaque pill.'
  - 'VQ-03 (both): between about 75° and 285° the 15 Yagi markers at gain 0.06–0.10
    (7 px marker size) sit almost on top of each other near the center and merge into
    a solid purple cluster where the line no longer reads as a line → markers small
    enough near the center that the line between them is visible (about 4 px, −3 px),
    or no markers on that series. Likely cause: MARKER_SIZE = 7 applied to every series.'
  - 'VQ-06 (both): the angular variable is never named, the AZIMUTH constant ''Azimuth
    (°)'' is not drawn anywhere, so only the radial axis has a title → label the angular
    axis with AZIMUTH (e.g. beside the 0° label or under the plot). Likely cause:
    PolarLayer only renders a title for GAIN.'
  - 'Suggestion: MUI X''s native ChartsLegend (inside ChartsDataProvider/ChartsWrapper)
    could replace the hand-built HTML legend so legend highlighting works in the interactive
    HTML.'
  - 'Suggestion: the rotated ''Normalized gain'' title on its own pill cuts the 0.6
    and 0.8 rings; placing it outside the plot would leave the grid uninterrupted.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, no white panel.
      Chrome: title "polar-line · javascript · muix · anyplot.ai" bold dark ink at top center (~35% of width); five concentric rings (0.2–1.0, outer ring heavier) and eight spokes every 45° in soft grey; cardinal labels 0°/90°/180°/270° bold dark ink, diagonal labels 45°/135°/225°/315° in soft grey; radial tick labels 0.2–1.0 on pills along the 0° spoke; rotated "Normalized gain" axis title inside the plot; HTML legend at bottom with green and purple dots. All text readable.
      Data: Omnidirectional dipole in #009E73 as a closed near-circular loop (gain ~0.7–0.86), Directional Yagi in lavender #C475FD as a narrow main lobe peaking at 1.0 at 0° with a small back lobe at 180° (~0.24); 24 markers per series. Tick-label pills cut small gaps in the lines near the 1.0 and 0.8 labels; Yagi markers near the center merge into a cluster.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, cardinal labels and legend text in light ink; diagonal and radial tick labels in light soft grey; rings and spokes dark grey, subtle but visible. No dark-on-dark text.
      Data: identical #009E73 and #C475FD series, same shapes and markers as the light render; only chrome flips.
      Legibility verdict: PASS
