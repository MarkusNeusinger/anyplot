review:
  strengths:
  - 'Polar coordinates built on MUI X''s composition API: a ChartsContainer with hidden
    linear axes, a custom SVG layer reading the shared scales through useXScale/useYScale,
    and the native ScatterPlot drawing the markers on top'
  - Each series is one closed straight-segment loop through its points in azimuth
    order, so no line swings past its data values
  - Grid of concentric rings and radial spokes in the theme grid token, lighter than
    the data lines in both themes, with angles and ring values labeled
  - 'Realistic antenna-pattern scenario: an omnidirectional dipole beside a directional
    Yagi with main lobe, side nulls and back lobe; values computed from the pattern
    formulas'
  - Ring step derived from the data maximum with a nice-number rule rather than typed
    limits; skipAnimation set; first series brand green, second Imprint lavender,
    identical across themes
  weaknesses:
  - 'CQ-04 (code): lines 59–63 build the series list with a manual loop and includes()
    check → const seriesNames = [...new Set(data.map((r) => String(r[SERIES_NAME])))];,
    the idiom the muix library prompt names. Likely cause: hand-written de-duplication
    loop.'
  - 'Suggestion: render the legend with MUI X''s <ChartsLegend /> (inside ChartsDataProvider
    / ChartsWrapper) instead of the hand-built HTML legend, so it reads its swatches
    from the series.'
  - 'Suggestion: the polar disc fills about 71 % of the canvas width; a smaller DOMAIN_PAD_FACTOR
    or header gap would give the data more room.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, square 2400x2400 canvas
