      Data: two closed straight-segment loops with small dots — Omnidirectional dipole in #009E73 (first series, near-round trefoil 0.72–0.86) and Directional Yagi in #C475FD (main lobe 1.0 at 0°, back lobe ~0.24 at 180°); HTML legend with round swatches at the bottom
