review:
  strengths:
  - 'Idiomatic PolarAxis configuration: theta_0 = pi/2 puts January at the top, direction
    = 1 sets a sensible angular sweep, and rtickformat appends "mm" units with rtickangle
    offset so radial labels don''t clash with the January spoke'
  - Correct Imprint palette in canonical order (green/lavender/blue for the three
    series), with a subtle band! fill under the highest-variance series adding a focal
    point
  - 'Theme-adaptive chrome works correctly: background, ink, grid, and spine colors
    flip cleanly between light and dark renders while all three data series colors
    stay pixel-identical'
  - 'Realistic, neutral dataset: monthly rainfall across three climate zones with
    a genuine sinusoidal seasonal cycle, phase-shifted per zone, and clamped to stay
    non-negative'
  - Clean single-script KISS structure, seeded RNG (Random.seed!(42)), only used imports,
    correct save call with px_per_unit = 2 landing exactly on the 2400x2400 canonical
    square canvas
  weaknesses:
  - 'Legend layout doesn''t match the code''s own intent and pushes the plot off-center:
    the code comment says the horizontal Legend at fig[2,1] with rowsize!(fig.layout,
    2, Fixed(70)) keeps the circle horizontally centered in the square canvas, but
    in BOTH renders the legend actually appears as a vertical column to the right
    of the circle (roughly level with the Oct spoke), not as a slim row below it.
    Measured on plot-light.png: the polar circle''s true center sits at x=927px while
    the 2400px-wide canvas center is x=1200px — an ~11% leftward shift — leaving a
    large empty gap in the bottom-right quadrant. Fix: the Legend is not landing in
    the intended GridLayout row/column (PolarAxis likely occupies more of the layout
    than assumed, or the Legend needs explicit tellwidth=false / a corrected row index)
    — reposition it so it renders as a horizontal strip below the centered circle,
    matching the code''s own stated design intent.'
  - 'The ''peak wet season'' text!() annotation near the Tropical series'' July peak
    does not render at all in either theme — confirmed by cropping multiple zoom levels
    around the Jul spoke in both plot-light.png and plot-dark.png; no such text is
    visible anywhere on either canvas. This silently drops the implementation''s intended
    data-storytelling focal point. Fix: check whether text! on a PolarAxis needs the
    position/offset expressed differently (e.g. offset units, alignment, or z-order
    relative to the axis clip region) so the label actually appears near (peak_theta,
    peak_r); if it truly cannot be made to render, remove the dead call rather than
    leaving broken code.'
  - 'The band! fill under the Tropical series (alpha = 0.12) is essentially imperceptible
    against the #FAF8F1/#1A1A17 backgrounds in both renders — verified by close crop
    near the plot center, no discernible tint. If it''s meant to visually reinforce
    the peak/focal point, raise the alpha or otherwise verify it''s actually contributing
    to the design.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1-consistent) canvas, uniform, no dark patches.
      Chrome: Title "polar-line · julia · makie · anyplot.ai" is dark ink, clearly readable, positioned above the circle. Month labels (Jan-Dec) ring the outside of the circle in dark-gray, all fully visible with comfortable margin (checked "Apr" close-up: no clipping). Radial "mm" tick labels (0/50/100/150/200/250 mm) run along an offset spoke near the top, legible and non-overlapping with the January gridline. Grid lines (concentric circles + radial spokes) are subtle light gray, visible but not dominant. The legend ("Tropical"/"Temperate"/"Arid" with color swatches) is fully legible but is positioned as a VERTICAL column to the right of the circle at roughly the Oct-spoke height, not as a horizontal row below the plot as the code intends — this pushes the circle itself off-center (measured circle center x=927px vs. canvas center x=1200px on the 2400px-wide canvas).
      Data: Three closed line loops — Tropical (green #009E73, outermost/most variable, with a very faint, barely-visible fill underneath), Temperate (lavender #C475FD, mid-range), Arid (blue #4467A3, small loop near center). All three are clearly distinguishable from each other and from the background. Markers are present at each of the 12 monthly vertices. No "peak wet season" annotation text is visible anywhere near the Tropical peak (checked around the Jul spoke at multiple zoom levels) despite it being present in the code.
      Legibility verdict: PASS (all present text is readable; the missing annotation is a rendering bug, not a legibility failure, and is called out separately as a weakness)

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17-consistent) canvas, uniform.
      Chrome: Title and axis text render in light ink/off-white, clearly readable against the dark background — no dark-on-dark issues found. Month labels and "mm" radial tick labels are all legible light-gray/white. Grid lines are subtle light-gray, visible without dominating. Spine (outer circle boundary) is a soft light-gray. Same off-center legend/circle issue as the light render — legend again sits as a vertical column to the right rather than a horizontal row below.
      Data: Same three series, pixel-identical colors to the light render (green/lavender/blue), clearly visible against the dark surface. Same missing "peak wet season" annotation — confirmed absent via crop around the Jul peak.
      Legibility verdict: PASS (no dark-on-dark or light-on-light failures; text-vs-background contrast is good in both themes)
