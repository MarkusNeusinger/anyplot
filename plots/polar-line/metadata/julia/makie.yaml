review:
  strengths:
  - Legend now renders as a horizontal row centered below the circle (colsize!/rowsize!
    with Fixed(1200)/Fixed(70)), fixing the previous off-center layout bug — the circle
    is verifiably centered on the canvas now.
  - 'The ''peak wet season'' annotation renders correctly, anchored at the true argmax
    of the Tropical series (verified: June, 235.8mm, edges out July''s 233.1mm) —
    a working, correctly-placed data-storytelling focal point.'
  - The band! fill under Tropical (alpha raised to 0.20) is now clearly visible in
    both themes and doesn't obscure the Temperate/Arid lines drawn on top of it.
  - 'Correct Imprint palette in canonical order (green/lavender/blue), theme-adaptive
    chrome, pixel-identical data colors between light and dark renders, exact #FAF8F1/#1A1A17
    backgrounds.'
  - 'Idiomatic PolarAxis configuration: theta_0 = pi/2 for January-at-top, unit-formatted
    rtickformat, rtickangle offset to dodge the January spoke, clean KISS single-script
    structure, seeded RNG, exact 2400x2400 canvas.'
  weaknesses:
  - 'The outermost "250 mm" radial tick label sits directly on the polar axis''s outer
    spine, and the spine line runs through the middle of the text like a strikethrough
    — visible identically in both light and dark renders (confirmed via crop at native
    resolution; the 50/100/150/200 mm labels are unaffected since they land on plain
    grid rings, not the spine). Fix: either drop the outermost rtick (data tops out
    at ~236mm, so a rticks = 0:50:200 range would keep every label off the spine)
    or nudge the radial label offset/padding so it clears the spine specifically at
    r=250.'
  - The Arid series (~10-40mm) is compressed into a small loop near the center relative
    to Tropical (~235mm peak) — legible at full resolution but visually minor next
    to the other two series; acceptable given the realistic data spread, but worth
    a look if a future revision wants more even visual weight across series.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, sampled RGB(250,248,241) = #FAF8F1 exactly, uniform.
      Chrome: Title "polar-line · julia · makie · anyplot.ai" in dark ink, clearly readable, centered above a polar chart whose circle is now genuinely centered on the canvas (verified symmetric left/right extents — the previous ~11% off-center bug is fixed). Month labels (Jan-Dec) ring the circle in soft dark gray, all fully visible with comfortable margin. Radial "mm" tick labels (0/50/100/150/200/250 mm) run along an offset spoke near the top; the 50/100/150/200 mm labels sit cleanly in gaps between grid rings, but the outermost "250 mm" label is bisected by the outer axis spine (the spine line runs through the middle of the text like a strikethrough) — confirmed via crop at native resolution. Grid lines (concentric circles + radial spokes) are subtle, visible but not dominant. The legend ("Tropical"/"Temperate"/"Arid") is a horizontal row centered below the plot, matching the code's stated intent.
      Data: Three closed line loops — Tropical (green #009E73, outermost, ~235mm peak, with a now-clearly-visible pale green fill from center to the line), Temperate (lavender #C475FD, mid-range, drawn cleanly on top of the fill), Arid (blue #4467A3, small loop near center, individually distinguishable points at native resolution, no overlap with the "0 mm" label). A bold "peak wet season" annotation renders correctly just above the Tropical line's June vertex — confirmed via direct computation that June (235.8mm) is the true argmax of the random draw, narrowly beating July (233.1mm), so the annotation is correctly placed.
      Legibility verdict: PASS (all text readable; the "250 mm" tick label is legible despite the spine crossing through it — a visual overlap defect, not an illegibility failure, called out separately as a weakness)

    Dark render (plot-dark.png):
      Background: Warm near-black, sampled RGB(26,26,23) = #1A1A17 exactly, uniform.
      Chrome: Same layout as light render. Title and all chrome render in light ink/off-white, clearly readable — no dark-on-dark failures found. Same "250 mm"/outer-spine collision reproduces identically in this theme. Legend renders correctly as a horizontal row below the centered circle.
      Data: Same three series, pixel-identical colors to the light render (green/lavender/blue). The Tropical band fill reads as a dark teal-green tint filling the circle's interior, a deliberate and effective focal-point device that doesn't obscure the Temperate/Arid lines drawn on top of it. The "peak wet season" annotation renders correctly at the same June vertex as the light render.
      Legibility verdict: PASS (no dark-on-dark or light-on-light failures; same "250 mm" spine-overlap caveat applies identically to this theme)
