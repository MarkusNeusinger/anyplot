review:
  strengths:
  - Correct Imprint palette in canonical order with brand green always first, identical
    across both themes
  - Fully theme-adaptive chrome (background, ink, grid, legend box) with no dark-on-dark
    or light-on-light failures in either render
  - 'Idiomatic PolarAxis usage: theta_0/direction to orient January at top, a custom
    rtickformat closure to append ''mm'' units, and an rtickangle offset that deliberately
    avoids radial-label/spoke clash'
  - Realistic, well-differentiated three-zone rainfall dataset that clearly demonstrates
    the plot type's cyclical nature
  - Clean, reproducible, single-file KISS structure
  weaknesses:
  - 'Design Excellence is the main gap: the chart is technically correct but visually
    reads as a competent default rather than a polished, story-driven piece. Consider
    a deliberate focal point - e.g. a subtle fill/alpha under the Tropical loop (the
    highest-variance series) or a brief peak-season annotation - to give the chart
    a clear point of view'
  - No per-point markers on the 12 monthly measurements - only the interpolated line
    is shown. Adding small markers (e.g. scatter! at each theta/value pair) would
    better communicate 'monthly data points connected by lines' per the spec description
    and would help visibility when the PNG is scaled down for mobile
  - The fig[1,2] legend column shifts the polar circle noticeably left of canvas center,
    leaving unused whitespace to the right of the legend. Consider a narrower legend
    column (colsize!) or repositioning the legend (e.g. below the plot) so the circle
    sits centered in the square canvas
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 - not pure white.
      Chrome: Title "polar-line · julia · makie · anyplot.ai" centered above the plot in dark ink; twelve theta ticks labeled Jan-Dec around the ring; radial grid rings labeled "0 mm" through "250 mm" on a spoke offset ~15° from the January axis; legend (Tropical/Temperate/Arid) top-right on a card-colored background with no visible frame. All chrome text is clearly readable dark-on-light.
      Data: Three closed line loops - Tropical (brand green #009E73, largest/most variable, peaking June-September), Temperate (lavender #C475FD, peaking December-January), Arid (blue #4467A3, small near-center loop, low amplitude). First series confirmed #009E73.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 - not pure black.
      Chrome: Same layout as light render with all chrome flipped to light-on-dark - title, month labels, radial "mm" labels, and legend text all render in light gray/white tones against the dark surface; gridlines and spine are soft light gray at low opacity; legend swatch background flips to the dark elevated tone. No dark-on-dark failures found - every label remains clearly legible.
      Data: Colors identical to light render - brand green Tropical, lavender Temperate, blue Arid - confirming the categorical palette holds constant across themes.
      Legibility verdict: PASS
