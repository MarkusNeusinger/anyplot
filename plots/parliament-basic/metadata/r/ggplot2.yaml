review:
  strengths:
  - Seats laid out in ten concentric arcs whose seat counts scale with radius, so
    spacing stays even and the half circle is solid
  - Party blocks are contiguous wedges following the data order from left to right,
    sorted by angle across all arcs
  - Legend lists every party with its seat count through scale_fill_manual labels,
    and guide_legend(override.aes) enlarges the swatches
  - Theme tokens are applied throughout; page-coloured seat strokes keep seats crisp
    in both renders
  - Neutral invented party names and an Imprint palette in canonical order
  weaknesses:
  - 'VQ-05 (both): the hemicycle and legend fill only about 62% of the canvas height,
    with roughly 20% empty canvas above the title and 18% below the bottom arc → tighten
    the vertical whitespace so the chart fills about 80% of the height. Likely cause:
    coord_fixed on a 1:2 hemicycle in a 16:9 panel next to a wide right-hand legend,
    which shrinks the panel width and thus its height.'
  - 'Suggestion: a labelled majority threshold (311 seats) is the one optional layer
    the Notes allow.'
