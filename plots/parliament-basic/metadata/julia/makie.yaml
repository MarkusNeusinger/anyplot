review:
  strengths:
  - 'Correct Imprint palette usage: brand green (#009E73) is the first series, remaining
    parties follow canonical order, and Independents correctly use the theme-adaptive
    muted anchor for the ''other'' role instead of a 7th categorical slot'
  - Fully theme-adaptive chrome (title, legend text, backgrounds) with identical data
    colors between light and dark renders
  - 'Idiomatic Makie composition: Figure/Axis grid layout, colsize! for the plot/legend
    column split, DataAspect() to preserve the circular geometry, hidedecorations!/hidespines!
    for a clean radial chart'
  - Party ordering follows the canonical left-to-right political-spectrum convention
    suggested by the spec notes
  - Row seat-counts are proportional to each arc's radius, keeping visual seat density
    roughly constant across all 9 concentric rows — thoughtful geometry work
  - Canvas is an exact 3200x1800 match, no clipped text, legend sits directly beside
    the plot with party name + seat count labels
  - Clean KISS script structure, exact mandated title format, deterministic output
  weaknesses:
  - No visual emphasis on the majority threshold (spec explicitly lists this as an
    optional feature) — a dashed neutral-colored marker at 50%+1 seats or a short
    annotation on whether any bloc holds a majority would substantially improve data
    storytelling (currently the viewer has to count colors themselves)
  - 7 distinct series (6 parties + muted Independents) sit at the CVD discrimination
    floor per the style guide's color-restraint table (n=7 requires redundant encoding)
    — add a thin ink-colored stroke (strokecolor/strokewidth) around each dot for
    definition, especially for the lower-contrast hues (lavender, ochre, cyan)
  - The implementation meets the mandatory style-guide baseline (Imprint palette,
    hidden spines, theme-adaptive chrome) but doesn't go meaningfully beyond it —
    no distinguishing polish or focal point (e.g. a total-seats readout, or emphasis
    on the largest bloc/governing coalition)
  - Random.seed!(42) is set but never exercised — party/seat data is fully hardcoded,
    so the seed call is vestigial; harmless but worth removing or using meaningfully
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white, matches #FAF8F1, not pure white.
      Chrome: bold dark title "parliament-basic · julia · makie · anyplot.ai" top-left of the plot column, clearly legible against the light background; legend at right lists all 7 parties with seat counts in soft dark gray text, fully readable.
      Data: 9 concentric semicircular arcs of dots running from left (Green Alliance, #009E73 brand green) through Progressive Union (lavender), Centrist Coalition (blue), Reform Party (ochre), Conservative Bloc (red), Liberty Party (cyan), to Independents (muted gray) at the far right — left-to-right political-spectrum ordering. Dot spacing is visually consistent across rows (denser inner rows, more seats per outer rows, same apparent gap). First series is confirmed brand green.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black, matches #1A1A17, not pure black.
      Chrome: title renders in light off-white text, clearly legible against the dark background; legend text switches to light gray, fully readable — no dark-on-dark issues found anywhere.
      Data: identical dot colors and layout to the light render (green, lavender, blue, ochre, red, cyan, muted gray) — only the background/text chrome flipped, confirming theme-adaptive tokens were threaded through correctly.
      Legibility verdict: PASS
