review:
  strengths:
  - Deliberately reframes the spec's political parliament scenario as a neutral academic
    Faculty Senate composition, avoiding the DQ-02 controversial-topic pitfall while
    preserving the semicircular seat-chart form and left-to-right block ordering.
  - 'Palette and theme compliance are exemplary: canonical Imprint order with brand
    green first, identical data colors between light and dark renders, and chrome
    (title, legend, background) correctly sourced from window.ANYPLOT_TOKENS.'
  - Careful equal-density row-weighting algorithm keeps seat spacing visually consistent
    from inner to outer arcs, with subtle page-background-colored borders that cleanly
    separate adjacent seat dots.
  - Title fontsize is dynamically scaled via the mandated length formula, so the long
    'Descriptive Title · spec-id · javascript · echarts · anyplot.ai' string never
    overflows.
  - Legend clearly lists each division name with its seat count, satisfying the spec's
    legend requirement, and the 1:1 aspect ratio is preserved via explicit scale computation
    so seats stay circular.
  weaknesses:
  - 'Library Mastery is generic: the chart relies on manual polar-to-Cartesian math
    plotted as a plain scatter series, with no ECharts-distinctive feature (e.g. graphic
    elements, custom label/tooltip formatter, effectScatter) — the same approach would
    port to any scatter-capable library with minor changes.'
  - 'Design Excellence stops at ''good'' rather than ''excellent'': there is no visual-hierarchy
    device beyond color and legend counts (e.g. the spec''s optional majority-threshold
    arc/line, or a callout on the largest division) to give the viewer an immediate
    takeaway.'
  - Legend text (15px) lists six items with parenthetical counts; verify it stays
    comfortably legible once the PNG is scaled to a ~400px mobile width.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "Faculty Senate Composition · parliament-basic · javascript · echarts · anyplot.ai" in dark ink, centered top, clearly readable; legend row at bottom in six swatch+label+count pairs, also dark/soft-ink text, clearly readable against the light surface.
      Data: Six concentric-arc seat blocks running left to right — Sciences (green #009E73), Engineering (lavender), Business (blue), Social Sciences (ochre), Humanities (matte red), Health Sciences (cyan) — matching the canonical Imprint categorical order with brand green first. Each seat is an individual dot with a thin light-colored border for separation.
      Legibility verdict: PASS — all text (title, legend labels, seat counts) is clearly legible against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title and legend content now rendered in light ink/soft-ink text, fully readable against the dark surface; no dark-on-dark failures observed.
      Data: The six division colors are pixel-identical to the light render (green, lavender, blue, ochre, matte red, cyan) — only the chrome (background, text, seat border color) flipped to the dark-theme tokens, as required.
      Legibility verdict: PASS — all text is legible in the dark theme; brand green and the rest of the palette remain visible and distinguishable on the dark surface.
