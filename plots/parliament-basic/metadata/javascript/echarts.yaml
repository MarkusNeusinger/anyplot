review:
  strengths:
  - 'Directly addresses the attempt-1 weaknesses: adds a dashed radial markLine with
    a ''Majority · N'' label for the majority-threshold seat — an explicit visual-hierarchy
    device the spec calls out as an optional feature and DE-03 was previously docked
    for lacking.'
  - Adds a distinctive custom tooltip formatter that computes and displays each division's
    seat percentage, and a legend formatter that appends seat counts — genuine ECharts-specific
    API usage beyond a plain scatter series (markLine, formatter callbacks), improving
    on attempt 1's 'generic scatter plot' critique.
  - 'Palette and theme compliance remain exemplary: canonical Imprint order with brand
    green first, data colors pixel-identical between light and dark renders, and all
    chrome (title, legend, majority line, tooltip) correctly sourced from window.ANYPLOT_TOKENS.'
  - Equal-density row-weighting algorithm keeps seat spacing visually consistent from
    inner to outer arcs; subtle page-background-colored borders cleanly separate adjacent
    seat dots.
  - Deliberately reframes the spec's political-party scenario as a neutral Faculty
    Senate composition by academic division — matches the spec's own 'committee or
    board composition by faction' application, avoiding the DQ-02 controversial-topic
    pitfall while preserving the semicircular seat-chart form.
  - Title fontsize is dynamically scaled via the mandated length formula, so the long
    'Faculty Senate Composition · parliament-basic · javascript · echarts · anyplot.ai'
    string never overflows or clips; verified no edge clipping on any side in either
    render.
  weaknesses:
  - 'Library Mastery is improved but still short of ''excellent'': the core layout
    is manual polar-to-Cartesian math on a plain scatter series; consider an ECharts-native
    feature such as effectScatter for the majority-tipping seat, or a graphic element,
    to push distinctiveness further.'
  - Title occupies only ~40% of the plot width at the current scaled fontsize — well
    under the 50-70% guideline. Not a violation (no overflow/clipping), but there
    is headroom to grow the title fontsize slightly for a more balanced composition.
  - Six-item legend at 15px is legible at desktop and full-thumbnail scale but is
    quite dense at the 400px mobile width — comfortable, not generous, margin for
    six swatch+label+count entries; consider verifying at even smaller viewport widths.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "Faculty Senate Composition · parliament-basic · javascript · echarts · anyplot.ai" in dark ink, centered top, clearly readable and not clipped at any edge. A gray "Majority · 91" label sits directly beneath the title with a dashed radial line running from the chamber's center to the outer arc, cleanly separated from the seat dots below it (no overlap). Legend row at bottom lists six swatch+label+count pairs in soft-ink text, clearly readable against the light surface.
      Data: Six concentric-arc seat blocks running left to right — Sciences (green #009E73), Engineering (lavender), Business (blue), Social Sciences (ochre), Humanities (matte red), Health Sciences (cyan) — matching the canonical Imprint categorical order with brand green first. Each seat is an individual dot with a thin light-colored border for separation. Checked both side edges and the top: no title, legend, or seat-dot pixels are clipped by the canvas border.
      Legibility verdict: PASS — all text (title, majority label, legend labels, seat counts) is clearly legible against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Same title, majority label/dashed line, and legend content now rendered in light ink/soft-ink text, fully readable against the dark surface; no dark-on-dark failures observed anywhere (title, ticks-equivalent legend text, majority label all flip correctly).
      Data: The six division colors are pixel-identical to the light render (green, lavender, blue, ochre, matte red, cyan) — only the chrome (background, text, seat border color, majority-line color) flipped to the dark-theme tokens, as required. Brand green #009E73 remains clearly visible against the dark surface.
      Legibility verdict: PASS — all text is legible in the dark theme; the full palette remains visible and distinguishable, and the majority-threshold line/label reads clearly against the dark background.
