review:
  strengths:
  - 'Exact seat layout: 200 seats in 6 concentric arcs, row capacities proportional
    to radius, every party a contiguous left-to-right wedge whose mark count equals
    its seat count (24+38+52+46+28+12)'
  - Majority threshold (101) drawn as a stepped dashed boundary that follows the real
    gap between seat 101 and 102 in every row, labeled 'Majority · 101' above the
    outer arc and clear of all seat marks
  - 'Idiomatic MUI X composition: ScatterChart with position:''none'' axes plus a
    child overlay that uses useXScale/useYScale to draw the threshold in data coordinates'
  - Theme-adaptive chrome from ANYPLOT_TOKENS (ink/inkSoft/pageBg) with marker outlines
    in the page color; data colors are the Imprint palette in canonical order and
    identical in both renders
  - Legend lists every party with its seat count; per-series valueFormatter gives
    seat-count tooltips in the HTML view
  weaknesses:
  - 'Suggestion: the bottom caption ''200 (Seats)'' reads like a column header; ''200
    seats'' would read more naturally.'
  - 'Suggestion: the legend sits flush left and leaves the right half of its band
    empty; centering it over the hemicycle would balance the header.'
  image_description: |-
