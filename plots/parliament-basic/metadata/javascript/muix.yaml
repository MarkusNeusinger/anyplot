review:
  strengths:
  - Correct Imprint palette order (green, lavender, blue, ochre, matte red, cyan)
    with identical data colors between light and dark renders, and theme-correct chrome
    (background, text, dashed guideline) in both
  - New MajorityHighlight wedge directly addresses the prior review's storytelling
    feedback, subtly shading the contiguous party blocks that combine to reach the
    101-seat majority
  - Title font size increased to 30px per prior feedback and now reads as well-proportioned,
    fully legible, with no overflow or clipping
  - Mathematically sound concentric-arc seat-placement algorithm that keeps proportional
    row spacing and contiguous left-to-right party wedges
  - Clean, deterministic code that correctly follows the MUI X harness contract (default
    export, skipAnimation, sized from window.ANYPLOT_SIZE) and uses useXScale/useYScale
    idiomatically to build a custom mark type not natively offered by MUI X community
  - Legend clearly pairs party name with seat count using circular swatches consistent
    with the seat marker style
  weaknesses:
  - The majority-highlight wedge is very subtle (6% fill opacity) — could be nudged
    slightly more visible without becoming chartjunk so the coalition-math payoff
    registers immediately
  - Design is clean and functional but stops just short of top-tier publication polish
    — no secondary annotation or subtitle reinforces the majority narrative beyond
    the dashed line and shaded wedge
  - No native MUI X high-level chart type is used (series={[]}); all marks are hand-built
    via custom SVG layers — reasonable since MUI X community has no built-in hemicycle/parliament
    chart, but it still caps idiomatic canned-API credit
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Title "parliament-basic · javascript · muix · anyplot.ai" top-left in dark ink at 30px, clearly readable. Below it, a horizontal legend row with 6 colored circular swatches paired with party name + seat count (Green Alliance (24), Progress Party (38), Unity Coalition (52), Civic Alliance (46), Heritage Party (28), Reform Movement (12)) in legible dark-gray text. "Majority · 101" label sits above a vertical dashed guideline running through the arc. "200 seats" caption below the arc.
      Data: 200 dots arranged in 6 concentric semicircular rows, colored in contiguous left-to-right party blocks matching Imprint order (green #009E73, lavender, blue, ochre, matte red, cyan). A faint grey wedge (~6% opacity) shades the region from the leftmost seat to the majority line, highlighting which contiguous party blocks reach the 101-seat majority. First series (Green Alliance) is #009E73.
      Legibility verdict: PASS — all text clearly readable against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Identical layout to the light render; title, legend text, "Majority · 101" label, and "200 seats" caption all render in light/off-white text, clearly legible against the dark surface. The dashed majority guideline is light gray and clearly visible. No dark-on-dark failures observed.
      Data: Seat dot colors are pixel-identical to the light render (same green/lavender/blue/ochre/red/cyan hues) — only the chrome (background, text) flipped, as required. The majority-highlight wedge is present and equally subtle.
      Legibility verdict: PASS — all text clearly readable against the dark background.
