review:
  strengths:
  - Seats are assigned by angle, then radius, so every party forms one contiguous
    wedge that runs left to right across all six arcs, with seat counts exactly matching
    the data (200 seats)
  - The majority threshold is a stepped dashed boundary that runs through the gaps
    between seats in each row and is labeled 'Majority · 101'; the threshold is computed
    as floor(total/2)+1
  - 'Uses the MUI X composition API: ChartsContainer with hidden linear axes plus
    useXScale/useYScale to map the custom layout into the chart''s coordinate system'
  - 'Theme tokens are used throughout (pageBg seat outlines, ink title, inkSoft legend),
    so both renders are readable; Imprint palette in canonical order starting with
    #009E73'
  - Fictional, neutral party names (Harbor Guild, Lantern League, Orchard Compact)
    with no real-politics references
  weaknesses:
  - 'VQ-01 (both): legend entries and the ''Majority · 101'' label render at 14 px
    CSS on the 1600 px canvas and become illegible in the 400 px thumbnail, while
    the seat field dominates → 16 px (+2 px). Likely cause: legend span fontSize ''14px''
    and majority <text> fontSize={14}.'
  - 'LM-01 (code): seats are raw <circle> elements in a ChartsContainer with series={[]},
    and the legend is a hand-built HTML flex row, which bypasses MUI X''s series,
    coloring, legend and tooltip machinery → one ScatterChart series per party (data
    = that party''s seat x/y, color from t.palette, label ''Name (seats)'') with the
    native legend and hidden axes. Likely cause: the ParliamentOverlay component and
    the custom legend div.'
  - 'Suggestion: write the center total as ''200 seats'' instead of ''200 (Seats)'',
    which reads like a column identifier.'
  - 'Suggestion: a native scatter series would also give per-seat hover tooltips (party,
    seat count) in the HTML output.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, no axes or grid.
      Chrome: bold dark title 'parliament-basic · javascript · muix · anyplot.ai' top left; one-row legend below it with colored dots and 'Harbor Guild (24)', 'Meadow Union (38)', 'Lantern League (52)', 'Bridge Assembly (46)', 'Granite Circle (28)', 'Orchard Compact (12)' in dark-grey text; 'Majority · 101' above the arc apex; '200 (Seats)' centered under the half circle. All readable.
      Data: 200 equal dots in six concentric semicircular arcs; contiguous wedges left to right: green #009E73, purple, blue, amber, red, cyan (Imprint order). A stepped dashed grey line runs from the inner arc to the apex through the gaps between seat 101 and 102.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title in light ink, legend and majority label in light grey, total label in light ink; no dark-on-dark text.
      Data: identical seat layout and identical data colors to the light render; seat outlines switch to the dark page color; majority line light grey and visible. Brand green clearly visible.
      Legibility verdict: PASS
