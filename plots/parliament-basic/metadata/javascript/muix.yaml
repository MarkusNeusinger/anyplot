review:
  strengths:
  - 'Correct Imprint palette: first series is #009E73 (Green Alliance), remaining
    parties follow canonical positions 2-6 (lavender, blue, ochre, matte red, cyan),
    identical between light and dark renders'
  - 'Theme-correct chrome in both renders: warm off-white #FAF8F1 light background,
    warm near-black #1A1A17 dark background, all text readable in both themes with
    no dark-on-dark or light-on-light failures'
  - Majority threshold correctly computed (101 of 200 seats) and clearly annotated
    with a dashed guideline plus 'Majority · 101' label, directly satisfying the spec's
    optional majority-line feature
  - 'Sophisticated custom concentric-arc seat-placement algorithm: row capacities
    are proportional to radius so seat spacing stays roughly constant, and seats are
    handed to parties in contiguous left-to-right angular order so each party forms
    one unbroken wedge'
  - Legend clearly pairs party name with seat count and a color swatch, matching the
    underlying data exactly
  - 'Clean, deterministic, KISS-appropriate code that correctly follows the harness
    contract: default-exported component, skipAnimation set, sized from window.ANYPLOT_SIZE,
    no manual mounting'
  - Legitimate and creative use of MUI X's ChartContainer plus the useXScale/useYScale
    hooks to build a fully custom mark type — the right call since the MUI X community
    package has no native hemicycle/parliament chart
  weaknesses:
  - Title occupies only ~30% of canvas width at the current font size, well under
    the ~50-70% guideline for a short (non-descriptive-prefixed) title — since this
    title is well under the 67-char threshold that triggers shrinking, increase the
    title font size (e.g. from 24px to ~28-32px CSS) to strengthen typographic hierarchy
  - 'Design Excellence is solid but stops short of publication-ready: consider an
    additional storytelling touch, such as visually distinguishing which contiguous
    parties would need to combine to reach the 101-seat majority, to push Data Storytelling
    further'
  - Layout has noticeable unused vertical whitespace in the title/legend band relative
    to the seat arc; tightening that padding or growing the chart region slightly
    would sharpen canvas utilization
  - No native MUI X high-level chart type is used — series is passed as an empty array
    and all marks are drawn via custom SVG layers through the scale hooks. This is
    a reasonable and arguably correct choice given the community package has no hemicycle
    chart type, but it means idiomatic-usage credit is capped; if a future MUI X release
    adds point/swarm series support, prefer wiring seats through the series API
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matching #FAF8F1 — not pure white, not dark.
      Chrome: Title "parliament-basic · javascript · muix · anyplot.ai" in dark ink text, top-left, clearly readable. Below it a horizontal legend row with 6 colored circular swatches, each paired with a party name and seat count in parentheses (Green Alliance (24), Progress Party (38), Unity Coalition (52), Civic Alliance (46), Heritage Party (28), Reform Movement (12)) — all legible in dark-gray text. Centered above the arc, a "Majority · 101" label sits over a vertical dashed guideline running down through the seat rows. Below the arc, a "200 seats" total label in dark text.
      Data: ~200 dots arranged in 6 concentric semicircular rows, colored in contiguous left-to-right party blocks: green (Green Alliance), lavender (Progress Party), blue (Unity Coalition — straddling the majority line), ochre (Civic Alliance), matte red (Heritage Party), cyan (Reform Movement). First series is confirmed #009E73 (brand green).
      Legibility verdict: PASS — all text is clearly readable against the light background, no light-on-light issues observed.

    Dark render (plot-dark.png):
      Background: Warm near-black, matching #1A1A17 — not pure black, not light.
      Chrome: Same layout as the light render, with title, legend text, "Majority · 101" label and "200 seats" total all rendered in light/off-white text, clearly legible against the dark background. The dashed majority guideline is light gray/white and clearly visible.
      Data: Dot colors are identical to the light render (same green/lavender/blue/ochre/red/cyan hues) — only the chrome (background, text) flipped between themes, as required. First series remains #009E73.
      Legibility verdict: PASS — no dark-on-dark failures observed; all title, legend, and annotation text is clearly visible against the dark surface.
