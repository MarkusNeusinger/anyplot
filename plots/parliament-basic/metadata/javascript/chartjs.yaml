review:
  strengths:
  - Custom polar-to-cartesian hemicycle layout with largest-remainder apportionment
    reads evenly dense across all 6 arcs, fixing attempt 1's uneven innermost-arc
    spacing
  - Majority-threshold dashed line + plurality-party emphasis (larger/thicker dots,
    "— largest" legend tag) gives the chart a real focal point and narrative, directly
    addressing the spec's optional feature
  - Custom Chart.js plugin (afterDatasetsDraw) drawing the majority line is a genuinely
    distinctive, idiomatic use of the library's extension API
  - 'Imprint categorical palette in exact canonical order, first series #009E73, identical
    data colors across both themes'
  - Clean, deterministic, single-block code with correct animation:false and mount-node
    handling
  weaknesses:
  - 'The "Majority: 101" label text renders directly on top of two seat dots at the
    top of the chamber in BOTH renders (confirmed via pixel-level crop) - the y2+6
    offset clamps to chartArea.top, which sits at almost the same height as the topmost
    seat row'
  - Fictional party names remain in the politics/elections content domain flagged
    as sensitive by the style guide; handled as neutrally as the spec allows, but
    this still caps DQ-02 below full marks (unavoidable for this spec type, not something
    repair can fix)
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white, matches #FAF8F1, not pure white
      Chrome: Title "parliament-basic · javascript · chartjs · anyplot.ai" bold dark ink, centered top, fully legible. Legend row at bottom lists all 6 parties with seat counts, muted dark-gray text, circular swatches, "— largest" tag on plurality party. Majority-threshold dashed line with "Majority: 101" label in dark ink.
      Data: 6 parties across ~200 seat dots in 6 concentric arcs, colors green/lavender/blue/ochre/red/cyan in Imprint canonical order, first series #009E73. Plurality party (Social Democrats) uses larger dots + thicker border.
      Legibility verdict: PASS overall, with one defect - the "Majority: 101" label text is drawn directly on top of 2 seat dots at the top of the chamber (verified via pixel crop), partially obscuring them. Text itself remains readable.

    Dark render (plot-dark.png):
      Background: warm near-black, matches #1A1A17, not pure black
      Chrome: Title and legend switch to light/white tones, fully legible, no dark-on-dark issues. Same majority-line label present, in light ink.
      Data: identical data colors to light render (only chrome flipped), confirming palette consistency.
      Legibility verdict: PASS overall, with the same label/dot overlap defect present at the same location (verified via pixel crop).
