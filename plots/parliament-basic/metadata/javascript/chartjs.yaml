review:
  strengths:
  - Correctly builds a true semicircular hemicycle layout via computed polar-to-cartesian
    seat positions (6 concentric arcs, capacity scaled by radius) rather than faking
    it with a built-in chart type — a creative, appropriate use of Chart.js's scatter
    type
  - Party seat blocks are globally angle-sorted into contiguous left-to-right wedges,
    giving a clean political-spectrum-style ordering as suggested by the spec
  - 'Imprint categorical palette used in exact canonical order (positions 1-6), first
    series is #009E73, identical data colors across both themes'
  - Legend correctly lists party names with seat counts per spec, using usePointStyle
    circular swatches that mirror the seat dots
  - Point markers have a subtle pageBg-colored border for definition against neighboring
    dots, and axes are appropriately hidden (no spurious x/y scale for a spatial seat
    layout)
  - Clean, deterministic, single-block code with no functions/classes, correct animation:false
    and mount-node handling per the Chart.js contract
  weaknesses:
  - 'No visual focal point or storytelling device: the largest party (Social Democrats,
    52 seats) and the 50%+1 majority threshold (101 seats) are not highlighted in
    any way even though the data naturally supports a ''no majority / largest bloc''
    narrative — consider a subtle majority threshold marker or emphasis on the plurality
    party per DE-03'
  - Innermost arc (radius 0.38, fewest seats) has visibly larger gaps between dots
    than the outer arcs, giving a slightly uneven density across rows — tune the seatsPerRow/capacity
    formula so per-row angular spacing reads as more visually uniform
  - Design is solid but generic-idiomatic Chart.js scatter usage; no library-distinctive
    feature is leveraged beyond basic point styling (e.g., a custom plugin drawing
    the majority line, or richer legend/tooltip customization) — LM-02 currently generic
  - Fictional party names ('Green Alliance', 'Social Democrats', 'Conservative Bloc',
    etc.) sit in the politics/elections content domain that the style guide flags
    as sensitive; the implementation handles it as neutrally as the spec allows (fully
    fictional, no real country or ideology), but this is worth flagging since it caps
    DQ-02 below full marks
  - Data shows a plausible but fairly 'flat' distribution (18-52 seats) without a
    more extreme edge case (e.g., a very small minority party near the 3-party lower
    bound, or a party crossing the majority threshold) that would demonstrate fuller
    feature coverage of the chart type
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Title "parliament-basic · javascript · chartjs · anyplot.ai" in bold dark ink, centered top, clearly legible. Legend row at the bottom lists all 6 parties with seat counts in muted dark-gray text with circular color swatches, fully readable. No axes/grid shown (appropriate — this is a spatial hemicycle layout, not a cartesian plot).
      Data: A semicircular arrangement of ~200 individual seat dots across 6 concentric arcs, colored left-to-right: green (Green Alliance), lavender (Social Democrats), blue (Liberal Union), ochre (Centrist Coalition), red (Conservative Bloc), cyan (Independents) — exact Imprint canonical palette order, first series is #009E73. Each dot has a thin light-colored border for separation from neighbors.
      Legibility verdict: PASS — all text is clearly readable against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Title renders in light/white ink, legend text in light muted gray — both clearly legible against the dark background. No dark-on-dark failures observed.
      Data: Identical seat layout and identical six data colors as the light render (green, lavender, blue, ochre, red, cyan) — only the chrome (background, text) flipped, confirming palette consistency across themes.
      Legibility verdict: PASS — all text and data markers are clearly distinguishable from the dark background.
