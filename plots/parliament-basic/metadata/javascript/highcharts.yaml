review:
  strengths:
  - 'Excellent Imprint palette compliance: canonical order (#009E73, #C475FD, #4467A3,
    #BD8233, #AE3030, #2ABCCD) held exactly across all 6 parties, identical data colors
    between light and dark renders.'
  - Correctly computed hemicycle geometry — concentric arc row capacities allocated
    via the largest-remainder method, seats sorted by angle left-to-right, and the
    seat count sums exactly to totalSeats (200).
  - Highcharts' automatic per-series marker symbol rotation (circle/diamond/square/triangle/triangle-down)
    gives redundant shape encoding on top of color, improving colorblind accessibility
    for free.
  - Legend correctly shows party name plus seat count per the spec's Notes requirement,
    e.g. 'Party A (58)'.
  - Theme-adaptive chrome is fully correct in both renders — no dark-on-dark or light-on-light
    failures, transparent chart background lets the page surface show through.
  - Deterministic, reproducible in-memory data; clean procedural (KISS) code with
    no fake interactivity, animation disabled correctly.
  weaknesses:
  - 'DQ-02: Party labels are purely abstract (''Party A'' … ''Party F''), matching
    the lowest realism tier (''Category A''-style labels). Since the spec inherently
    covers political-party data, keep it non-partisan/fictional but give the factions
    descriptive names (e.g. ''Coastal Alliance'', ''Progress Union'', ''Heritage Party'')
    instead of literal letters — raises DQ-02 without introducing any real-world political
    reference.'
  - 'DE-03: No visual emphasis on the majority threshold. The spec explicitly lists
    ''highlight majority threshold line (e.g., 50%+1 seats)'' as an optional enhancement
    — since no party holds a majority here (largest is 58/200), a subtle threshold
    marker (e.g., a faint radial guide or annotation at seat 101) would sharpen the
    story from ''good'' to ''excellent'' data storytelling.'
  - 'LM-02: The implementation is solid idiomatic Highcharts scatter usage but doesn''t
    lean on anything uniquely Highcharts beyond the default symbol rotation — consider
    a more distinctive touch (e.g., legend click-to-toggle party visibility, or dataLabels
    showing seat numbers on hover) to better showcase library-specific strengths in
    the interactive HTML view.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "parliament-basic · javascript · highcharts · anyplot.ai" in bold dark ink, clearly legible at top-center. Legend below the hemicycle lists all 6 parties with name + seat count ("Party A (58)" … "Party F (10)") in dark-grey secondary text with colored/shaped swatches matching the data markers. No axis lines or ticks are shown (intentional — this chart type encodes data via seat position, not axes).
      Data: Seats rendered as ~200 individual markers arranged in concentric semicircular arcs from left to right. First (largest) party uses brand green (#009E73) circles, then lavender diamonds, blue squares, ochre triangles, matte-red inverted triangles, and cyan circles for the smallest party — matching the Imprint canonical palette order exactly. Seat density is even, no overlap or overplotting.
      Legibility verdict: PASS — all text (title, legend) is fully readable against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title, now in light/white text, fully legible against the dark background. Legend text switches to a light secondary tone, fully readable; legend swatches keep the exact same colors as the light render.
      Data: Identical seat layout and identical marker colors (green/lavender/blue/ochre/red/cyan) to the light render — confirms the categorical data colors are theme-invariant, only chrome (background + text) flipped.
      Legibility verdict: PASS — no dark-on-dark failures observed; all title and legend text is clearly visible against the near-black surface.
