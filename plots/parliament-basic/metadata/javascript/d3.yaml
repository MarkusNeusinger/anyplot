review:
  strengths:
  - 'Genuinely bespoke geometric layout: seats-per-row computed from row circumference
    with largest-remainder rounding so row totals sum exactly to the seat total, and
    seat radius is bounded by the tightest row''s arc length so dots never collide
    — this is real D3 flexibility, not a canned pie/arc helper.'
  - 'Majority threshold line is a strong storytelling touch: computed from the exact
    seat index (majority-1/majority boundary) and rendered with an italic label, letting
    the viewer instantly judge whether any single party or bloc crosses 201 seats.'
  - First party ("Green Alliance") lands on Imprint position 1 (#009E73) which doubles
    as a semantically fitting brand-green for a green/environmental party, and the
    remaining 5 parties consume Imprint positions 2-6 in canonical order matching
    the left-to-right political spectrum the spec asks for.
  - Custom multi-row, auto-wrapping, centered legend (built from measured getBBox
    widths) that correctly handles 6 items without overlap or overflow.
  - 'Both renders are fully theme-correct: identical data colors, warm off-white/near-black
    backgrounds, and all chrome (majority line, tick-less labels, legend text) correctly
    threaded through inkSoft/ink/pageBg tokens.'
  weaknesses:
  - Color assignment uses direct array indexing (t.palette[0], t.palette[1], ...)
    instead of a d3.scaleOrdinal categorical scale as shown in the library's own skeleton
    (prompts/library/d3.md) — functionally identical here since party order is fixed,
    but not the most idiomatic D3 pattern.
  - Data topic (party/election seat composition) sits in a gray area against the general
    content-policy guidance that flags politics/elections as sensitive — acceptable
    here only because the spec (parliament-basic) inherently requires this data shape
    and the parties used are generic archetypal fictional names with no real-country
    or partisan-stance framing; DQ-02 scored as 'plausible but generic' rather than
    ideal, and DE-03 storytelling stops at the majority line rather than a stronger
    emphasis (e.g. highlighting whether any 2-3 party coalition crosses the threshold).
  - Independent bloc (36 seats) is placed at the far right of the spectrum purely
    to close out the cumulative angular assignment — positioning an unaligned/independent
    bloc at the ideological extreme is a minor data-realism quirk worth a look in
    a repair pass, though not a hard defect.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "parliament-basic · javascript · d3 · anyplot.ai" in bold dark ink at top-center, clearly readable. Italic "Majority · 201 seats" label with a vertical dashed threshold line in soft ink, readable against the light background. Legend below the chart: six items (swatch + party name + seat count) in a single centered row, dark ink text, fully legible.
      Data: Six concentric semicircular arcs of dots, each dot representing one seat, grouped into contiguous angular wedges by party. Leftmost wedge is Green Alliance in brand green (#009E73, Imprint position 1), followed by Social Democratic Party (lavender), Liberal Party (blue), Conservative Party (ochre), Reform Party (matte red), and Independent (cyan) at the far right — matching Imprint canonical positions 1-6. Seat dots have a thin light stroke separating them from neighbors. Dashed majority line sits between the Liberal and Conservative wedges.
      Legibility verdict: PASS — all text (title, majority label, legend) is clearly readable, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title and majority-line label, now rendered in light ink/soft-ink tones against the dark background, fully legible. Legend text is light-colored and readable against the dark background.
      Data: Identical six-color wedge arrangement and identical hex values to the light render (green, lavender, blue, ochre, red, cyan) — only the background, title, majority-label, and legend text colors flipped to their dark-theme tokens. No dark-on-dark text found anywhere (title, majority label, and legend are all light-colored on the dark surface).
      Legibility verdict: PASS — all text is clearly readable in dark mode, data colors confirmed identical to the light render.
