review:
  strengths:
  - 'Legend seat counts are set through scale_color_manual(labels=...) with limits
    taken from the data order, so the first party gets #009E73 and blocks follow the
    data'
  - Largest-remainder split of seats across arcs keeps the exact total, and every
    party's block size equals its seat count
  - Fully fictional, neutral scenario (a river-basin authority council) with noun-plus-group
    party names
  - Theme tokens threaded through title, legend text and legend box; both renders
    read cleanly
  - guide_legend(override_aes) enlarges legend glyphs so they match the seat marks
  weaknesses:
  - 'CQ-01 (code): the adaptability smoke run fails the more_rows perturbation with
    IndexError at line 91, because `IMPRINT_PALETTE[i]` runs past the eight positions
    when the table has more than eight parties → look colors up cyclically (IMPRINT_PALETTE[i
    % len(IMPRINT_PALETTE)]) so the file renders on any party count. Likely cause:
    the `colors` dict comprehension indexes the palette directly.'
  - 'VQ-05 (both): the legend entry ''Quarry Collective (11)'' ends about 8 px from
    the legend frame''s right edge while the left inner padding is about 70 px, so
    the box looks lopsided and the text crowds the border → balanced inner padding
    on both sides (about +60 px on the right). Likely cause: four legend columns sized
    to the keys, not the label widths; give the legend box a margin (legend_box_margin
    / legend_margin) or use fewer columns (nrow=3).'
  - 'Suggestion: the outer arcs are spaced tighter along the arc than between arcs,
    so the green block reads as radial spokes; more rows (ROWS=10) would make the
    arcs read more clearly.'
  image_description: |-
    Light render (plot-light.png):
