review:
  strengths:
  - Seats are swept left to right by angle and handed out party by party, so every
    party is one contiguous block across all eight arcs
  - Rows hold seats in proportion to their radius, giving evenly spaced seats of one
    size throughout the chamber
  - Majority threshold computed from the data (201 of 400) and drawn only in the inner
    and outer gaps, so it never covers a seat
  - The data's own Color column drives scale_color_manual, with an Imprint fallback
    for missing hex values
  - One-panel gggrid paints the whole canvas in the page color while coord_fixed keeps
    the chamber round
  - Legend lists every party with its seat count in data order via scale_color_manual
    breaks
  weaknesses:
  - 'Suggestion: the legend key column draws a page-colored strip behind the swatches
    inside the elevated legend box; a legend_key fill matching ELEVATED_BG would make
    the box read as one surface.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 edge to edge, no strips.
      Chrome: title "parliament-basic · python · letsplot · anyplot.ai" centered above the chamber in dark ink; "Majority: 201 of 400" in INK_SOFT above the top arc with a short dark tick below it and another inside the inner arc; legend at right on an elevated #FFFDF6 box titled "Party (seats)" with six entries and counts. No axes or grid. All text readable.
      Data: 400 equal dots in 8 concentric semicircular arcs; contiguous blocks left to right: Riverbank Alliance #009E73 (85), Weavers' Union #C475FD (72), Harbor League #4467A3 (58), Quarry Collective #BD8233 (35), Orchard Guild #AE3030 (95), Lantern Assembly #2ABCCD (55). First series is #009E73.
