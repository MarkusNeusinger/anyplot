review:
  strengths:
  - Seats are swept left to right by angle and handed out party by party, so every
    party is one contiguous wedge across all eight arcs
  - Rows hold seats in proportion to their radius, giving evenly spaced seats of one
    size throughout the chamber
  - Majority threshold computed from the data (201 of 400), placed between seat 201
    and 202 and drawn only in the inner and outer gaps so it never covers a seat
  - theme_void + coord_fixed give a clean axis-free half circle; Imprint palette in
    canonical order, identical in both themes
  - Legend lists every party with its seat count in data order via scale_color_manual
    breaks
  weaknesses:
  - 'VQ-05 (both): coord_fixed letterboxes the 3200x1800 canvas, leaving about 69
    px transparent strips at the left and right edges instead of the page color, and
    the legend box ends flush against the right strip with no padding → page color
    edge to edge and at least ~40 px between legend and canvas edge. Likely cause:
    plot_margin=[24, 0, 0, 0] with coord_fixed; give the plot a right margin and widen
    the x range or drop coord_fixed''s letterboxing.'
  - 'DQ-02 (both): the groups are corporate departments (Finance Committee, Marketing
    Team, Legal Advisory …) holding 400 seats, which reads as generic rather than
    as a fictional chamber → invented party names from a neutral noun plus a group
    word (e.g. ''Riverbank Alliance'', ''Weavers'' Union''). Likely cause: the party
    list in the data block.'
  - 'CQ-04 (code): the Color column (COLOR) is defined in the data but never read
    — colors come from IMPRINT_PALETTE, so editing the column changes nothing; the
    two one-row threshold frames repeat the same geom_segment → map the column with
    scale_color_manual(values=list(df[COLOR])) or drop it, and use one two-row segment
    frame. Likely cause: lines 52–64 and 85–100.'
  - 'Suggestion: the legend key column draws a page-colored strip behind the swatches
    inside the elevated legend box; a legend_key fill matching ELEVATED_BG would make
    the box read as one surface.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the plot; about 69 px transparent strips at the far left and right edges (coord_fixed letterboxing).
      Chrome: title "parliament-basic · python · letsplot · anyplot.ai" centered above the chamber in dark ink; label "Majority: 201 of 400" in INK_SOFT above the top arc; legend at right on an elevated #FFFDF6 box titled "Division (seats)" listing six entries with counts. All text readable. No axes or grid.
      Data: 400 equal dots in 8 concentric semicircular arcs; contiguous wedges left to right: Finance Committee #009E73 (85), Technology Board #C475FD (72), Operations Division #4467A3 (58), Research Council #BD8233 (35), Marketing Team #AE3030 (95), Legal Advisory #2ABCCD (55). Two short dark ticks at the vertical center inside and outside the arcs mark the majority cut.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17, same transparent side strips.
      Chrome: title in light ink, majority label in light grey, legend box #242420 with light text — all readable, no dark-on-dark.
      Data: seat colors identical to the light render; threshold ticks flip to light ink and stay visible.
      Legibility verdict: PASS
