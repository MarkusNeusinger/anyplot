review:
  strengths:
  - 'One equal-sized dot per seat (300 in total) on nine concentric arcs that form
    a true half circle: the view height is derived from the data extent, so x and
    y share one scale and the arcs stay circular'
  - 'Each party is one contiguous wedge in data order, left to right, colored in Imprint
    canonical order starting with #009E73; colors identical across both renders'
  - Legend lists every party with its seat count in a framed elevated-surface box,
    14 px labels at scale 4 read cleanly in both themes
  - Invented party names built from a neutral noun plus a group word (Harbor Union,
    Lantern Guild, Quarry Circle), exactly as the spec asks
  - Altair-native tooltip on every seat in the HTML output and a declarative domain/range
    color scale with sort=None keeping data order
  - PNG padded (never cropped) to the exact 3200x1800 target, both renders on the
    same canvas
  weaknesses:
  - 'Suggestion: the bottom legend sits about 200 px left of the chamber''s center
    axis; centering it under the half circle would align the two blocks.'
  - 'Suggestion: look the party colors up from the defined IMPRINT_PALETTE list (IMPRINT_PALETTE[i])
    instead of repeating the hex codes in the data block, as the altair prompt shows.'
