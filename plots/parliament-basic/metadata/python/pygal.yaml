review:
  strengths:
  - One equal-size dot per seat (549 dots for 549 seats) in 15 concentric arcs forming
    a round half circle; the x/y ranges are derived from the plot-area aspect (x_half
    = height span × 2.2 / 2) so the semicircle is not squashed
  - Row radii and dot radius derived from the seat pitch, so the gap between arcs
    matches the gap between neighbouring seats; largest-remainder allocation of seats
    to arcs gives a dense, even layout
  - Each party is one contiguous block in data order, filling the arcs left to right
    by angle; stepped block boundaries as the spec permits
  - Legend at the bottom in three columns lists every party with its seat count, swatches
    match the dot colors in both themes
  - 'Imprint palette in canonical order starting with #009E73; chrome threaded through
    Style tokens so the title and legend read correctly on #FAF8F1 and #1A1A17'
  - 'Clearly fictional chamber: neutral noun + group-word party names, no ideological
    labels, no real country or election'
  - Native pygal XY chart with per-series dots_size and guides/labels switched off;
    the HTML keeps pygal's per-seat hover tooltips and legend toggling
  weaknesses:
  - 'Suggestion: a few pixels of gap between each legend swatch and its label text
    would let the legend breathe; the swatches currently sit flush against the party
    names.'
  - 'Suggestion: centering the bottom legend under the half circle (or a 4-column
    layout) would balance the lone seventh entry on the last row.'
