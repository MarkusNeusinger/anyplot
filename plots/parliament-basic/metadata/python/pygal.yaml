review:
  strengths:
  - 'Exact Imprint palette in canonical order with #009E73 first: sampled pixels give
    #009E73, #C475FD, #4467A3, #BD8233, #AE3030, #2ABCCD and #954477 identical in
    both renders, on exactly #FAF8F1 (light) and #1A1A17 (dark) with #1A1A17 / #F0EFE8
    chrome - only the chrome flips.'
  - 'One mark per seat with the counts the legend states: counting connected dot blobs
    per colour in the light render gives 158, 122, 95, 70, 54, 38 and 12 marks, and
    each party sits as one contiguous wedge running from the inner arc to the outer.'
  - 'pygal.XY repurposed for a non-cartesian layout: stroke=False with dots_size,
    show_x_labels / show_y_labels / show_x_guides / show_y_guides all off and an explicit
    xrange / range frame the dome with no axes and no grid, as the plot type needs.'
  - Each party is its own pygal series, so the native interactive HTML output gives
    every seat a hover tooltip naming its party and the legend doubles as pygal's
    interactive series toggle.
  - Largest-remainder apportionment gives every arc a seat capacity proportional to
    its radius, so the dot spacing stays even from the innermost arc to the outermost
    instead of crowding the short arcs.
  weaknesses:
  - 'SC-02, VQ-05 (both): the arcs form an ellipse about 13 % wider than tall (the
    outer arc spans about 2780 x 1210 px) instead of the half circle the spec''s characteristic
    bullet names → equal px-per-data-unit on both axes (about -13 % on the x span).
    Likely cause: xrange=(-99, 99) against range=(-7.2, 99) on the 3200x1800 frame,
    which scales x and y by different factors.'
  - 'SC-02 (both): the party blocks run right to left - Harborview Assembly (158,
    #009E73) holds the right end of the arcs and Ashford Collective (12, #954477)
    the left - where the spec''s characteristic bullet asks for the blocks to follow
    one another from left to right → place the first party at the left end. Likely
    cause: slots.sort(key=lambda slot: slot[0]) with angle 0 at +x, so the first seat
    lands on the right.'
  - 'CQ-01 (code): the parliament_layout() helper (lines 50-87) splits the Imports
    → Data → Plot → Save flow the criterion asks for → inline its ~25-line body. Likely
    cause: the function definition at line 50.'
  - 'Suggestion: the majority threshold the Notes offer as optional (275 of 549 seats)
    would give the chamber a reference point.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, sampled at exactly #FAF8F1 across 5.62M of the 5.76M pixels - not pure white, not dark.
      Chrome: Title "parliament-basic · python · pygal · anyplot.ai" centred at the top in near-black #1A1A17, spanning about 57 % of the canvas width. No axes, no tick labels and no grid lines at all - correct for this plot type, where a seat's position is layout rather than data. A seven-entry legend sits below the dome in three columns, each entry a small colour swatch plus "Party Name (seats)" in #1A1A17. All text is clearly readable against the light background; the bottom legend row ("Ashford Collective (12)") is fully inside the canvas with its descenders intact - no clipping.
      Data: 549 equally sized dots arranged in ten concentric semicircular arcs forming a dome. Each party is one contiguous wedge spanning inner to outer arc. First series Harborview Assembly is #009E73 (brand green) on the right flank, then #C475FD, #4467A3, #BD8233, #AE3030, #2ABCCD and #954477 running leftwards. Dots are well separated everywhere; none merge. The dome is about 13 % wider than tall, so it reads as a flattened half circle rather than a true one.
      Legibility verdict: PASS - title and all seven legend entries are readable, dots are clearly distinguishable from the off-white page, nothing is light-on-light.

    Dark render (plot-dark.png):
      Background: Warm near-black, sampled at exactly #1A1A17 - not pure black, not light.
      Chrome: Same title and same three-column legend, now in light #F0EFE8. No dark-on-dark anywhere: every glyph of the title and of all seven legend labels renders in the light ink token against the near-black page. Legend swatches keep their party colours and remain visible. No clipping at any edge.
      Data: Data colours are identical to the light render - pixel sampling returns the same #009E73, #C475FD, #4467A3, #BD8233, #AE3030, #2ABCCD and #954477 hexes in both themes; only the background and the text colour flip. Brand green #009E73 reads clearly on the dark surface. The dimmer palette members (#4467A3 blue, #954477 plum) are still distinguishable from the page and from their neighbours.
      Legibility verdict: PASS - all text readable light-on-dark, all seat marks visible, no dark-on-dark failures.
