review:
  strengths:
  - imprint_div field ramp with zmid=0 and a symmetric zmin/zmax, so zero sits exactly
    at the visible midpoint of the color bar in both themes
  - 'Cell values use Plotly''s automatic text contrast: light text on the dark cells
    of the light render (+26.5, +29.8, -21.0) and light text on every cell of the
    dark render'
  - Consistent signed one-decimal value format through texttemplate '%{text:+.1f}',
    matching the % ticks of the color bar
  - Custom hovertemplate (category · month, signed growth) adds detail in the HTML
    output
  - Palatino serif and a muted subtitle give a clear typographic hierarchy
  weaknesses:
  - 'SC-02 (both): the category rows run Electronics, Clothing, Food & Beverage, Books,
    Sports, Home & Garden, Beauty, Toys. That order is neither alphabetical nor by
    magnitude nor by similarity, so the summer block (Sports, Home & Garden, Toys)
    is split by Beauty → order the rows logically, for example alphabetically or by
    the row''s peak month. Likely cause: the pivot_table(sort=False) keeps the hand-typed
    categories list order.'
  - 'Suggestion: the band between the subtitle and the top row of cells could be trimmed
    a little so the grid grows taller.'
  image_description: |-
