review:
  strengths:
  - Plain sns.heatmap value grid with page-colored separators, tiling every cell cleanly
    in both themes
  - imprint_div fields ramp with the theme's page midpoint, centered on the score
    midpoint 50 with a fixed 0-100 domain and a labeled, tick-readable colorbar
  - In-cell numbers switch between the two ink tokens by cell luminance, so the 5
    in the deep-red cell stays legible on the light page and every number reads on
    the dark page
  - Rows ordered by mean level so the high Finance row leads and the low Support/Marketing
    rows close the grid; months kept in calendar order
  - Tidy long table pivoted with pivot_table and column constants, so the axis and
    colorbar titles come from the data
  weaknesses:
  - 'Suggestion: seaborn''s own annot already switches text color by cell luminance;
    passing the ink tokens there is not possible, so keep the loop but compute the
    luminance with seaborn.utils.relative_luminance instead of the hand-written coefficients.'
  - 'Suggestion: the IMPRINT_PALETTE constant is never used in this heatmap and could
    be dropped.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white #FAF8F1 across the whole square 2400x2400 canvas.
      Chrome: Title 'heatmap-basic · python · seaborn · anyplot.ai' centered at the top in dark ink; y-axis title 'Department' and x-axis title 'Month' in dark ink; department tick labels (Finance, Sales, Engineering, Operations, HR, Support, Marketing) and month ticks Jan-Dec in INK_SOFT; colorbar on the right with ticks 0/25/50/75/100 and the label 'Performance score'. All readable, nothing clipped.
      Data: 7x12 grid of cells colored by the imprint_div fields ramp (matte red #AE3030 -> page -> blue #4467A3), separated by thin page-colored lines. Finance row is solid blue, Sales blue in H1 and pale red late in the year, Engineering turns deep blue in Aug and Nov, Operations has deep-red cells at Mar (5) and Aug (10), Support and Marketing lean red. Each cell carries its rounded value in dark ink; the deep-red 5 switches to light ink. Not a categorical plot, so no #009E73 series applies.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black #1A1A17.
      Chrome: Title, axis titles and colorbar label in light ink; tick labels in light INK_SOFT; no dark-on-dark text anywhere.
      Data: Same grid and values; the ramp takes the dark page as its midpoint, so values near 50 recede into the page and the red and blue poles stand out. Cell separators are page-colored. All cell numbers render in light ink and read clearly on dark, red and blue cells. Colorbar shows the dark-midpoint ramp.
      Legibility verdict: PASS
