review:
  strengths:
  - 'Uses the imprint_seq fields ramp with the theme''s own stops in each render;
    chrome flips cleanly between #FAF8F1 and #1A1A17'
  - Per-value dicts with color and formatter keys on HorizontalStackedBar build a
    correct 8×12 grid in pygal, which has no native heatmap
  - In-cell text color chosen by WCAG contrast against the cell color (both themes)
  - Rows ordered by mean traffic, so Finance/Tech blocks and the Travel summer gradient
    emerge
  - 'Clean adaptable structure: column constants, a Data block ending in a tidy df,
    and a pivot_table below it'
  weaknesses:
  - 'VQ-01 (dark): near-black in-cell numbers on mid-green cells (Travel May 109,
    Food Nov 101, Culture Nov 100, Health Feb–Apr 106/105/100) read with weak contrast
    on the #1A1A17 render → light text there (switch threshold must use the rendered
    cell color). Likely cause: text_color_on() judges the opaque ramp color while
    pygal draws the cell at fill-opacity 0.7 over the dark page; set Style(opacity=1)
    (and opacity_hover) so the drawn color equals the judged one.'
  - 'VQ-01 (both): colorbar tick labels at 34 px and month headers at 32 px sit below
    the 44 px tick-label reference beside 44 px category labels → 44 px (+10 / +12
    px). Likely cause: the hard-coded font-size:34px / font-size:32px in the injected
    <text> elements.'
  - 'VQ-05 (both): month tick labels (32 px bold, top) are much smaller than the category
    tick labels (44 px), and the ''Month'' axis title sits at the bottom, a whole
    grid away from its ticks at the top → one tick size for both axes and the axis
    title next to its tick labels (above the month headers, or headers moved below
    the grid). Likely cause: month headers injected at grid_top − 18 while the MONTH
    title is placed at grid_bottom + 52.'
  - 'SC-02 (both): rows are separated by ~30 px page-colored gaps while columns touch,
    so the grid does not tile (C1: only a thin separator allowed) → gaps of a few
    px at most. Likely cause: pygal''s per-bar margin in HorizontalStackedBar (spacing=0
    only affects series spacing); shrink the bar margin or draw the cells as injected
    rects.'
  - 'SC-03 (both): cells render at 0.7 opacity so their colors are washed toward the
    page and do not match the opaque colorbar (light Finance Dec 170 renders mauve,
    the bar''s top is #351E45; dark it renders grey-lavender vs #CDD9FF), and the
    colorbar ticks are the raw 54/112/170 → cells at full opacity, colorbar ticks
    at round values (60, 80, … 160). Likely cause: pygal Style default opacity=''.7'';
    ticks from [vmax, mid, vmin].'
  - 'CQ-05 (code): plot-{THEME}.html embeds chart.render() — the raw pygal SVG without
    the injected colorbar, month headers, axis titles and adapted cell text → embed
    the post-processed svg string. Likely cause: chart.render(is_unicode=True) called
    again at line 267.'
  - 'Suggestion: the subtitle sits only a few px above the month headers; a little
    more breathing room would separate the two lines.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1.
      Chrome: title 'heatmap-basic · python · pygal · anyplot.ai' in dark ink at top (~60 % width); INK_SOFT subtitle just above bold 32 px month headers Jan–Dec; 44 px row labels Finance…Culture; rotated bold 'Content Category' and bottom 'Month' axis titles; colorbar right titled 'Visits (k)' with ticks 170/112/54. All readable.
      Data: 8×12 grid on the imprint_seq light field stops (mint → green → blue → purple), but cells drawn at 0.7 opacity so they look washed beside the opaque colorbar; white numbers on dark cells, dark numbers on light cells; ~30 px page gaps between rows, columns touching.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, subtitle, month headers, row labels, axis titles and colorbar labels in light ink — all readable, no dark-on-dark chrome.
      Data: imprint_seq dark field stops (olive → #009E73 → pale blue), the continuous ramp correctly switches per theme; light numbers on most dark cells, but several mid-green cells (Travel May 109, Food Nov 101, Culture Nov 100, Health Feb–Apr) carry near-black numbers with weak contrast.
      Legibility verdict: PASS (chrome); in-cell numbers on mid-green cells weak
