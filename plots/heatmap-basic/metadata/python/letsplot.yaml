review:
  strengths:
  - Correct imprint_seq fields stops for each theme, sampled into scale_fill_gradientn,
    so high values stand out from the page in both renders
  - In-cell ink picked per cell by WCAG contrast against its fill, so every number
    stays readable in both themes
  - geom_tile with thin page-colored separators tiles the 6x12 grid cleanly, rows
    and columns in natural order
  - Explicit font sizes and theme tokens thread through every chrome element in both
    themes
  - layer_tooltips() adds multi-line hover detail in the HTML output
  - Realistic, neutral building-energy scenario with zone baselines and a seasonal
    pattern
  weaknesses:
  - 'Suggestion: dropping the panel''s outer border would let the tiled field stand
    on the page without a frame.'
