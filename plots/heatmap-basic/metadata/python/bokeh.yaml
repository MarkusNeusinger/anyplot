review:
  strengths:
  - Cell numbers pick their ink from the luminance of the fill they sit on, so every
    value stays legible in both themes
  - imprint_div fields ramp built from its (position, hex) stops with the theme's
    page color as midpoint, and a color range symmetric at ±max|value| that keeps
    zero at the color bar's center
  - 'Idiomatic Bokeh: linear_cmap transform, renderer.construct_color_bar(), LabelSet
    reading text and color columns from the ColumnDataSource'
  - HoverTool with formatted city/month/anomaly tooltips for the interactive HTML
  - Thin page-colored separators tile the grid cleanly in both themes
  - Column constants and a tidy df make the plot block data-agnostic
  weaknesses:
  - 'Suggestion: format the cell numbers with a typographic minus (U+2212) to match
    the color bar''s tick labels.'
  - 'Suggestion: Tokyo (35.7°N) sits below Mumbai (19°N) in an otherwise north-to-south
    row order; placing it after Madrid would make the latitude ordering exact.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, not pure white.
      Chrome: left-aligned bold title 'heatmap-basic · python · bokeh · anyplot.ai' in dark ink; italic axis titles 'Month (2024)' and 'City' in dark ink; month and city tick labels in INK_SOFT; color bar on the right titled 'Anomaly (°C)' (rotated) with ticks -2.5 to 2.5 every 0.5. All readable.
      Data: 7 cities x 12 months grid of opaque cells on the imprint_div fields ramp (#AE3030 red -> cream page midpoint -> #4467A3 blue), separated by thin page-colored lines. Signed one-decimal values in every cell: dark ink on pale cells, light ink on the deepest cells (Berlin Feb/Dec -2.7, Berlin Mar -2.0, Oslo Dec -2.1, Madrid Aug +2.3). No highlight boxes or other layers.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17, not pure black.
