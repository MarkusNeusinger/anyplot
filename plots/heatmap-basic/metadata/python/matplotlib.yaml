review:
  strengths:
  - Diverging Imprint fields ramp centered on zero with TwoSlopeNorm and a page-colored
    midpoint, so near-zero cells recede in both themes
  - In-cell numbers choose INK or the page color per cell by WCAG contrast with the
    actual fill, legible in both themes
  - Logical grouped ordering (revenue, technical, admin departments) makes the correlation
    blocks emerge
  - Minor-tick grid draws thin page-colored cell separators, an idiomatic matplotlib
    technique
  - Reads a tidy long table through column constants and pivot_table(sort=False),
    so the data block is easy to swap
  weaknesses:
