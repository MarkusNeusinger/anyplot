review:
  strengths:
  - Correct diverging Imprint field ramp centered on zero with TwoSlopeNorm and a
    page-colored midpoint, so near-zero cells recede in both themes
  - 'Theme-adaptive in-cell numbers: INK on light cells, white on deep cells, all
    legible in the dark render'
  - Logical grouped ordering (revenue, technical, admin departments) makes the three
    correlation blocks emerge
  - Minor-tick grid draws thin page-colored cell separators — an idiomatic matplotlib
    technique
  - 'Basic value grid only: no reference lines, highlights or callouts'
  - Reads a tidy long table through column constants and pivot_table(sort=False),
    so the data block is easy to swap
  weaknesses:
  - 'VQ-01 (light): white cell numbers on the mid-blue cells (0.48, 0.52, 0.55, 0.61)
    read at low contrast, about 2:1 on the light-blue fill → INK text on those cells,
    switching to white only on the deep cells (threshold about |r| > 0.6 in the light
    theme). Likely cause: LABEL_CONTRAST = 0.45 applied to both themes.'
  - 'Suggestion: drop the unused IMPRINT_PALETTE constant, since the plot only uses
    the diverging ramp.'
  - 'Suggestion: use one minus glyph throughout — the color bar shows ''−0.25'' while
    the cells show ''-0.15''.'
