review:
  strengths:
  - Correctly recovers a real heatmap from the core Highcharts bundle (no heatmap/colorAxis
    module loaded) by drawing cells with the SVG renderer and layering an invisible
    matched-axis scatter series underneath for genuine native tooltips — a distinctive,
    well-documented workaround rather than a fake interactivity simulation
  - Sequential imprint_seq (green-to-blue) correctly chosen over a diverging scale,
    matching the spec's own guidance that diverging is only for positive/negative
    data — page views are single-polarity
  - Data colors are pixel-identical between light and dark renders; only chrome (background,
    title, labels, grid gaps) flips per theme, with no dark-on-dark or light-on-light
    failures
  - Realistic, neutral B2B dashboard usage pattern (weekday morning/afternoon login
    peaks, damped weekend activity) built from a deterministic seeded LCG plus two
    Gaussian curves — clearly plausible and reproducible
  - Hand-drawn vertical colorbar with min/max labels and axis title is clean and well-integrated
    into the freed right margin; hour labels thinned to every 3rd tick to avoid crowding
    24 narrow columns
  - 'Clean canvas: no edge clipping, comfortable margins, geometry computed once as
    a shared source of truth (CHART_MARGIN) so labels, grid, and hover layer stay
    aligned'
  weaknesses:
  - No per-cell value annotations — with a 7x24=168-cell matrix this is a reasonable
    tradeoff (text would overlap/be unreadable), and the invisible tooltip layer exposes
    exact values on hover, but the spec's 'add value annotations when readable' note
    isn't literally satisfied in the static PNG
  - Colorbar shows only min/max tick labels with no intermediate gradation markers,
    slightly limiting precise value reading from the static render alone
  - Because the heatmap module isn't available, the implementation bypasses Highcharts'
    high-level series API entirely in favor of low-level renderer.rect() calls plus
    a decoy scatter series — necessary and well-executed given the constraint, but
    not 'idiomatic' in the sense of using the library's built-in chart type
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (~#FAF8F1), not pure white, not dark. Matches the design-system light surface.
      Chrome: Title "Dashboard Page Views · heatmap-basic · javascript · highcharts · anyplot.ai" in bold dark ink, clearly visible; subtitle in softer gray beneath it, also legible. Day labels (Mon-Sun) at left in dark gray, right-aligned against the grid. Hour labels (12am, 3am, ... 9pm) along the bottom, every 3rd hour, dark gray and readable. Grid "lines" are thin off-white gaps between cells (background showing through), subtle and non-dominant. Colorbar at right titled "Page views" with max (3,230) at top and min (45) at bottom, both legible.
      Data: 7x24 grid of cells colored on a green-to-blue sequential scale (imprint_seq: #009E73 to #4467A3). Low-value cells (nights, weekends) are solid brand green; high-value cells (weekday 9am-4pm) shift toward blue, forming a clear visual cluster during business hours on weekdays. Weekend rows (Sat/Sun) stay mostly green with only mild blue tinting.
      Legibility verdict: PASS — all text is clearly readable against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black (~#1A1A17), not pure black, not light. Matches the design-system dark surface.
      Chrome: Title now rendered in white/light ink, subtitle in light gray — both clearly legible against the dark background. Day and hour labels are light gray and read cleanly. Grid gaps are now dark (background color), consistent with the light render's technique — no visible seams or contrast issues. Colorbar labels and title are light-colored and legible.
      Data: Same green-to-blue gradient and same cell-by-cell values as the light render — colors are pixel-identical, confirming only chrome flipped between themes. The weekday 9am-4pm cluster of blue cells is equally visible against the dark background.
      Legibility verdict: PASS — all text is clearly readable against the dark background; no dark-on-dark failures observed (labels and title are properly light-colored, not left as dark ink).
