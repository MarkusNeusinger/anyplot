review:
  strengths:
  - Hand-rolled SVG-renderer grid cleverly compensates for the missing native heatmap
    module while still recovering genuine Highcharts hover tooltips via an invisible
    matched-axis scatter overlay
  - 'Sequential Imprint gradient (#009E73 to #4467A3) correctly chosen for single-polarity
    page-view data, and the data colors are pixel-identical between the light and
    dark renders'
  - Deterministic bimodal daily-usage curve (morning + afternoon peaks, weekend damping)
    produces a realistic, readable spatial pattern rather than uniform noise
  - Balanced canvas layout (~60% chart fill) with the colorbar integrated cleanly
    into the freed right margin instead of floating separately
  - All font sizes explicitly set, including a title formula that scales down for
    the long mandated string so it does not overflow
  weaknesses:
  - No explicit axis titles ('Hour of Day' / 'Day of Week') — only tick labels ('12am',
    'Mon') are shown, leaving the reader to infer what each axis represents; add small
    axis-title text draws for full VQ-06 credit
  - Low-value cells (nights and weekends) render as very similar shades of green,
    making fine-grained differences hard to distinguish — consider a slightly steeper/non-linear
    gradient mapping or thin per-cell borders for better differentiation
  - 'CQ-01 KISS: the SVG-renderer workaround requires several helper functions (gaussian,
    hourlyBase, hexToRgb, lerp, viewsRgb, viewsFill, drawAll) — largely justified
    by the missing heatmap module, but still a deviation from the flat import/data/plot
    ideal'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "Dashboard Page Views · heatmap-basic · javascript · highcharts · anyplot.ai" in bold dark ink, subtitle in soft gray beneath it. Day-of-week labels (Mon-Sun) right-aligned on the left; hour labels (12am, 3am, ... 9pm) along the bottom every 3rd column. "Page views" colorbar label with 45/3,230 endpoints on the right. All text renders in dark ink against the light background.
      Data: 7x24 grid of cells colored from green (#009E73, low values) to blue (#4467A3, high values). Weekday rows (Mon-Fri) show a clear mid-morning-to-afternoon blue band (9am-6pm), weekend rows (Sat-Sun) stay mostly green/teal. Colors match the vertical colorbar swatch on the right.
      Legibility verdict: PASS — title, subtitle, axis tick labels, and colorbar text are all clearly readable against the light surface; no light-on-light text found.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title and subtitle now in light/white text, day and hour tick labels in light gray, colorbar label and endpoint values in light gray. All chrome elements flip to light-on-dark correctly, no dark-on-dark text found.
      Data: Same 7x24 grid with the identical green-to-blue gradient and identical weekday/weekend pattern as the light render — data colors are unchanged between themes, only the chrome (background, text) flipped.
      Legibility verdict: PASS — title, subtitle, tick labels, and colorbar text are all clearly readable against the dark surface; no dark-on-dark failures observed.
