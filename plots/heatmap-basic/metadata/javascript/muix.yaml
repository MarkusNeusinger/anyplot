review:
  strengths:
  - Composes the heatmap from the community ChartsContainer with band x/y axes, a
    zAxis colorMap and the useXScale / useYScale / useZColorScale / useDrawingArea
    hooks, so cell geometry and colors come from MUI's own scales rather than hand-computed
    positions
  - In-cell value labels switch between dark and light ink by the cell's luminance,
    staying legible on every cell in both themes
  - 'Theme-correct chrome in both renders: warm off-white and near-black pages, ink/inkSoft
    tokens on title, subtitle, tick labels and color-bar text'
  - Plausible, neutral business-metrics correlation matrix (8 × 8, symmetric, unit
    diagonal) with both positive and negative coefficients
  weaknesses:
  - 'SC-03, SC-02, VQ-07 (both): the cell colors contradict the color bar: positive
    correlations (0.72, 0.81) render pale pink and the -1…+1 range runs red → neutral
    only, so no cell is ever blue while the bar shows blue at +1.0; the diverging
    ramp is not centered on zero → cells must follow the three-stop imprint_div ramp
    (#AE3030 at -1, page-colored midpoint at 0, #4467A3 at +1), exactly as the bar
    draws it. Likely cause: zAxis colorMap type ''continuous'' takes a two-color [min,
    max] array; the third stop t.div[2] is silently dropped (the `as unknown as [string,
    string]` cast hides the type error) — pass a function `color: (t) => …` interpolating
    the three stops, or compute the fill per cell from the three stops.'
  - 'VQ-03, SC-02 (both): the eight diagonal 1.00 cells are filled with the page color
    and vanish into the background, leaving holes in the grid instead of a filled
    rectangle per cell → the +1.0 cells in the saturated blue pole. Likely cause:
    the same two-stop colorMap that maps the maximum to t.div[1], the page-colored
    midpoint.'
  - 'Suggestion: the community ContinuousColorLegend could replace the hand-drawn
    SVG gradient bar so the legend is driven by the same zAxis as the cells.'
  - 'Suggestion: ordering rows and columns by similarity (e.g. grouping Churn with
    its negatively correlated partners) would let blocks emerge more clearly.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, square 2400x2400 canvas.
      Chrome: bold title "heatmap-basic · javascript · muix · anyplot.ai" centered at top, subtitle "Correlation coefficient matrix (8 × 8)"; row labels (Revenue … Churn) left, column labels below; vertical color bar right with ticks -1.0 … 1.0 and rotated title "Correlation coefficient". All text dark and readable.
      Data: 8x8 grid of rounded cells with bold two-decimal values. Cells run from pale pink (0.81) to deep matte red (-0.78); no cell is blue although the bar is blue at +1.0, and the diagonal 1.00 cells are page-colored and invisible (only the number shows). Cell text flips light on the darkest reds.
      Legibility verdict: PASS (text), but the color mapping contradicts the color bar.

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, subtitle, tick labels and color-bar labels in light ink; no dark-on-dark text.
      Data: same mapping with the dark midpoint: positive cells are near-black maroon, negatives brighter red; diagonal cells again identical to the page. Pole colors (#AE3030 red, #4467A3 blue on the bar) identical to light; only the theme-adaptive midpoint flips. All cell values rendered in light ink and readable.
      Legibility verdict: PASS (text), same color-mapping defect as light.
