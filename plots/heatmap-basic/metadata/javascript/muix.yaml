review:
  strengths:
  - 'Builds the heatmap from the community composition API: ChartsContainer with band
    x/y axes, a zAxis continuous colorMap, and a custom cell layer that reads useXScale,
    useYScale, useZColorScale and useDrawingArea, so cells, tick labels and the color
    scale share one coordinate system without any Pro import'
  - Diverging Imprint ramp (t.div) centered on zero with a fixed ±1 domain, so the
    page-colored midpoint sits at 0.0 on the color bar in both themes
  - In-cell values switch between dark and light ink by the luminance of each cell's
    fill, staying legible on pale and saturated cells in both renders
  - Color bar spans exactly the grid height with ticks at -1.0 to 1.0 and a rotated
    'Correlation coefficient' label; axis lines and ticks are disabled so the labels
    sit cleanly at their cells
  - Title, subtitle and cell numbers form a clear typographic hierarchy (22 px semibold
    title, 15 px subtitle, 16 px semibold values)
  weaknesses:
  - 'SC-02 (both): rows and columns follow an arbitrary list order (Revenue, Marketing,
    CSAT, Headcount, R&D, Mkt Share, OpEx, Churn) that is neither alphabetical, by
    magnitude, nor by similarity, so the strongly correlated pairs (Revenue–Mkt Share
    0.81, Headcount–OpEx 0.71) sit apart and no block emerges, missing the Notes bullet
    and the ''rows and columns in a logical order so blocks and gradients emerge''
    property → order the metrics by similarity (e.g. by mean correlation or a fixed
    cluster order) so related metrics sit adjacent. Likely cause: the METRIC_NAMES
    list order.'
  - 'Suggestion: MUI X community ships a ContinuousColorLegend that could replace
    the hand-drawn gradient bar.'
  - 'Suggestion: the 0.08 category gap with rounded corners reads as separate tiles;
    a slightly thinner gap would tile the matrix more tightly.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white, consistent with #FAF8F1.
      Chrome: title "heatmap-basic · javascript · muix · anyplot.ai" in dark semibold at the top, subtitle "Correlation coefficient matrix (8 × 8)" in soft ink below; row labels (Revenue … Churn) right-aligned left of the grid, column labels below the grid, color bar tick labels 1.0/0.5/0.0/-0.5/-1.0 and rotated "Correlation coefficient" label on the right. All text readable, nothing clipped.
      Data: 8×8 symmetric correlation matrix of rounded tiles; positive values in Imprint blue (diagonal 1.00 deepest), negatives in Imprint red (Churn row/column, strongest -0.78 CSAT–Churn), near-zero cells pale toward the page color. In-cell two-decimal values switch to light text on the dark diagonal and -0.78 cell, dark text elsewhere. Color bar diverges red→page→blue, midpoint at 0.0.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black, consistent with #1A1A17.
      Chrome: title in light ink, subtitle, row/column labels and color bar ticks in light soft ink; no dark-on-dark text.
      Data: same blue/red endpoint colors as the light render; the diverging midpoint now follows the dark page color, so near-zero cells are dark and all in-cell values switch to light text, all readable. Color bar mirrors the cells.
      Legibility verdict: PASS
