review:
  strengths:
  - Hook-based custom composition (useXScale/useYScale/useZColorScale) correctly assembles
    a heatmap from MUI X community primitives since the package has no native Heatmap
    chart - a genuinely idiomatic solution to an unsupported chart type
  - 'Diverging Imprint colormap (imprint_div: red ↔ neutral ↔ blue) correctly implemented
    via a custom interpolator, matching the correlation matrix''s positive/negative
    polarity, with a theme-adaptive midpoint'
  - 'Attempt-1 feedback fully addressed: skipAnimation now set on ChartContainer,
    and the colorbar legend now carries a descriptive ''Correlation coefficient''
    caption'
  - 'Cell text color is luminance-aware and intentionally decoupled from the page
    theme (fixed #1A1A17 / #F0EFE8 literals with an explanatory comment) since contrast
    must track the cell''s own fill, not window.ANYPLOT_THEME - a thoughtful fix to
    the attempt-1 hardcoded-literal weakness'
  - Clean, spine-free, grid-free layout with generous whitespace, rounded cell corners,
    and no overlap between any text and data elements
  - Realistic, plausible business-metrics correlation data with factually sensible
    relationships (e.g. CSAT strongly negatively correlated with Churn) and a properly
    symmetric, self-consistent correlation matrix (diagonal = 1.00)
  - Theme-adaptive chrome verified correct in both renders - data colors identical
    between light and dark, no dark-on-dark or light-on-light failures
  weaknesses:
  - The title still occupies only ~45% of the plot width on the square canvas - could
    be sized up slightly (e.g. fontSize 30-32) for better visual weight relative to
    the 50-70% guideline
  - The full symmetric matrix (both upper and lower triangles) is still displayed;
    masking the redundant half or otherwise emphasizing outlier cells would sharpen
    the visual hierarchy/storytelling (carried over from attempt 1, still unaddressed
    but low priority)
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1), not pure white, not dark.
      Chrome: Bold dark-ink title "heatmap-basic · javascript · muix · anyplot.ai" centered at top; row/column category labels (Revenue, Marketing, CSAT, Headcount, R&D, Mkt Share, OpEx, Churn) in medium-gray ink on both axes, fully legible; colorbar to the right runs from "1" (top) to "-1" (bottom) with a rotated "Correlation coefficient" caption.
      Data: 8x8 correlation matrix rendered as rounded-corner cells filled with the diverging Imprint colormap (matte red for negative values, near-cream neutral near 0, blue for positive values); diagonal cells (self-correlation = 1.00) are the most saturated blue. Every cell carries a numeric value annotation (2 decimals) whose text color auto-switches between dark ink and light cream based on the cell's own fill luminance - all 64 labels are readable.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17), not pure black, not light.
      Chrome: Title and axis category labels flip to light cream/gray and remain fully legible - no dark-on-dark text anywhere; colorbar and "Correlation coefficient" caption also flip to light gray and stay legible against the dark background.
      Data: Confirmed identical diverging red/blue data colors to the light render (only chrome flipped); the diverging midpoint color itself shifts toward the dark-background neutral as intended by the style guide's theme-adaptive-midpoint rule for imprint_div. Cell value labels remain readable via the same luminance-based contrast switch, with no dark-on-dark cell-text failures.
      Legibility verdict: PASS
