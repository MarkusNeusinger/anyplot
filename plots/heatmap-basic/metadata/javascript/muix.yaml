review:
  strengths:
  - Hook-based custom composition (useXScale/useYScale/useZColorScale) correctly assembles
    a heatmap from MUI X primitives since the community package has no native Heatmap
    chart — a genuinely idiomatic solution for this library's constraints
  - 'Diverging Imprint colormap (imprint_div: red ↔ neutral ↔ blue) is correctly implemented
    via a custom interpolator and matches the correlation matrix''s positive/negative
    polarity'
  - Every cell has a value annotation with automatic contrast-aware text color (luminance-based
    switch between ink and light text) so labels stay readable on both light and dark
    cell fills
  - Clean, spine-free, grid-free layout with generous whitespace and rounded cell
    corners gives the chart a refined, publication-leaning look
  - Realistic, plausible business-metrics correlation data (Revenue, Marketing, CSAT,
    Headcount, R&D, Mkt Share, OpEx, Churn) with factually sensible relationships
    (e.g. CSAT strongly negatively correlated with Churn, Marketing strongly positively
    correlated with Revenue)
  - Theme-adaptive chrome is correct in both renders — data colors are identical between
    light and dark, only chrome flips
  weaknesses:
  - '`ChartContainer` is missing the library-mandated `skipAnimation` prop (prompts/library/muix.md:
    "Always set both belts — set skipAnimation on every chart component") — add it
    for full compliance even though the custom-rendered cells currently aren''t animated'
  - The colorbar legend has no descriptive label or unit (e.g. "Correlation coefficient")
    — only the endpoint values "1"/"-1" are shown, leaving what the color encodes
    implicit
  - The title occupies a relatively small share of the plot width (~40%) on the square
    canvas — could be sized up slightly for better visual weight
  - The full symmetric matrix (both upper and lower triangles) is displayed; masking
    the redundant half or otherwise emphasizing outlier cells would sharpen the visual
    hierarchy and storytelling
  - '`textColorFor` hardcodes the literal `"#FAF8F1"` instead of reading a token from
    `window.ANYPLOT_TOKENS` — works visually but isn''t sourced from the design-token
    contract'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Title "heatmap-basic · javascript · muix · anyplot.ai" is bold dark ink, centered at top, fully legible. Y-axis category labels (Revenue, Marketing, CSAT, Headcount, R&D, Mkt Share, OpEx, Churn) sit to the left in soft dark grey; matching X-axis category labels sit below the matrix. All chrome text is clearly readable against the light background. No spines or tick marks; no grid lines.
      Data: 8x8 correlation matrix rendered as an 8x8 grid of rounded-corner cells, each filled by the diverging Imprint colormap (matte red for negative values, near-neutral cream for values close to 0, blue for positive values) and annotated with the numeric coefficient (e.g. "1.00" on the diagonal, "-0.78" for CSAT/Churn). Text color inside each cell automatically switches between dark ink and light cream depending on the fill's luminance, and all cell labels are legible. A continuous vertical colorbar sits to the right of the matrix, labeled "1" at the top and "-1" at the bottom, with the same diverging gradient.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Title, axis category labels, and colorbar tick text are all rendered in light cream/grey, clearly legible against the dark background. No dark-on-dark text was found anywhere — all chrome flipped correctly to light ink.
      Data: Same 8x8 correlation matrix with identical cell colors to the light render (matte red ↔ blue diverging scale, positions unchanged) — confirms data colors are theme-independent. Cell value labels remain readable via the same luminance-based text-color switch (e.g. white text on the dark-blue diagonal cells, dark text on the pale cells). Colorbar gradient and "1"/"-1" labels are unchanged and fully legible.
      Legibility verdict: PASS
