review:
  strengths:
  - Hierarchical-clustering order (hclust) makes the positive size block and the negative
    MPG band emerge
  - imprint_div via scale_fill_gradient2 with the theme's fields midpoint and limits
    c(-1, 1), zero centered on the labeled color bar
  - Real mtcars correlations with readable variable names
  weaknesses:
  - 'SC-01 (both): thick INK boxes outline every |r| > 0.7 off-diagonal cell, a highlight
    layer the basic variant excludes → remove the second geom_tile layer. Likely cause:
    geom_tile(data = cor_long[cor_long$is_strong, ], fill = NA, color = INK).'
  - 'VQ-01 (light): the diagonal 1.00 labels are grey #4A4A44 on saturated blue #4467A3
    and read with low contrast → page-colored or light ink on dark tiles. Likely cause:
    the diagonal geom_text with color = INK_SOFT.'
  - 'SC-02 (both): in-cell numbers use one ink regardless of tile darkness, missing
    the spec''s color switching (dark text on the -0.87 and 0.90 tiles in light) →
    pick label ink from the tile''s lightness. Likely cause: fixed color = INK in
    geom_text.'
  - 'Suggestion: cell numbers at size 3.0 could go slightly larger since the 8x8 cells
    have room.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, correct; legend on a lighter elevated box.
      Chrome: bold title 'heatmap-basic · r · ggplot2 · anyplot.ai' in dark ink, insight subtitle and tick labels in INK_SOFT, x labels rotated 35°, color bar titled r. All readable.
      Data: lower-triangle 8x8 mtcars correlation matrix ordered by hierarchical clustering, imprint_div red-page-blue. Off-diagonal numbers in dark INK, diagonal 1.00 in grey INK_SOFT that sits with low contrast on the saturated blue tiles. Thick black boxes outline every |r| > 0.7 off-diagonal cell.
