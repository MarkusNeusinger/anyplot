  strengths:
  - Sequential Imprint field ramp chosen correctly for single-signed adoption data,
    with the theme's own stops in each render
  - In-cell numbers switch between near-black and near-white ink by the cell's WCAG
    luminance, legible on every cell in both themes
  - Rows ordered by plan tier and columns by adoption, so a clear diagonal adoption
    frontier emerges
  - Thin page-colored separators tile the grid cleanly in both themes
  - 'Data block follows the adaptable-code zones: column constants, DataFrame, plot
    code reading df only'
  weaknesses:
  - 'Suggestion: colorbar ticks could include the ends of the 0–100 % scale (colorrange
    = (0, 100)) so the scale reads as a full percentage range.'
  - 'Suggestion: a slightly larger title would balance the 18 pt axis titles.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, landscape 3200x1800.
      Chrome: bold title 'heatmap-basic · julia · makie · anyplot.ai' at top center, axis titles 'Product feature' (x) and 'Subscription plan' (y), tick labels Dashboards…Audit log and Trial…Enterprise in dark INK_SOFT, colorbar on the right with ticks 25/50/75 and rotated label 'Adoption (% of accounts)'. All readable.
