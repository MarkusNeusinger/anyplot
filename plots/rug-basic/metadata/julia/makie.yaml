      Data: Histogram bars filled in Imprint brand green (#009E73) with thin cream-colored strokes separating bins, clearly showing a bimodal distribution (a taller cluster ~14-22 min, a smaller cluster ~28-36 min). Below it, a rug strip of short vertical green tick marks (alpha-blended) at the exact x-position of every observation, aligned to the same x-axis via linkxaxes!.
      Legibility verdict: PASS — no light-on-light issues; all text clearly readable against the light background.

    Dark render (plot-dark.png):
