      Data: Same Imprint brand green (#009E73) bars and rug ticks as the light render — colors are identical between themes, confirming only chrome flipped. No dark-on-dark failures observed; all text has clear contrast against the near-black background.
      Legibility verdict: PASS — no dark-on-dark issues; brand green remains vivid and easily distinguishable from the background in both themes.
