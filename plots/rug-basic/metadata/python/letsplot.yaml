review:
  strengths:
  - Combines geom_density with a correctly-implemented geom_segment rug (idiomatic
    substitute since lets-plot 4.11.0 has no native geom_rug), documented clearly
    in a code comment
  - 'Data tells a strong story: three distinct response-time clusters plus four isolated
    outliers, exactly matching the spec''s ''reveal clustering patterns, gaps, and
    outliers'' application'
  - 'Both renders use exact Imprint background hexes (#FAF8F1 light / #1A1A17 dark)
    with full theme-adaptive chrome (title, axis, ticks, grid all correctly recolored);
    brand green #009E73 stays identical between themes'
  - Reproducible with explicit np.random.seed(42); clean imports; correct dual PNG
    (scale=4) + HTML output via ggsave
  weaknesses:
  - Title omits the required {language} token — should read 'rug-basic · python ·
    letsplot · anyplot.ai' (currently 'rug-basic · letsplot · anyplot.ai')
  - All four panel spines are visible (full rectangular frame around the plot area)
    instead of the style guide's default L-shaped (bottom+left only) frame — drop
    the top/right/panel border for a cleaner look
  - The densest cluster (~45 points in the 60-100ms range) blends into a near-solid
    green block under the current alpha=0.7 — consider a slightly lower alpha or thinner
    segment stroke so extreme-density regions stay legible as individual ticks
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, sampled pixel (250,248,241) = #FAF8F1, matches spec exactly.
      Chrome: Title "rug-basic · letsplot · anyplot.ai" in dark ink (#1A1A17), clearly readable. X-axis label "Response Time (ms)" and Y-axis label "Density" in dark ink, readable. Tick labels in softer grey-brown, readable. Subtle horizontal (y-axis-only) gridlines visible but not competing with data. A thin rectangular frame (all four spines) surrounds the panel.
      Data: Single-series brand green (#009E73) density curve with a light translucent fill (alpha≈0.25) and a band of vertical rug tick marks at the bottom (alpha≈0.7) showing every observation. Three visible density humps (~80ms, ~180ms, ~300ms) plus four isolated tick marks out past 400ms for the outliers, with a visible gap in the rug between ~360ms and ~420ms.
      Legibility verdict: PASS — all text is clearly readable against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, sampled pixel (26,26,23) = #1A1A17, matches spec exactly (not pure black).
      Chrome: Title and axis labels rendered in light ink (#F0EFE8), tick labels in a softer light grey (#B8B7B0) — both clearly legible against the dark background. Gridlines subtle and visible. Same four-sided thin frame as the light render.
      Data: Data colors are pixel-identical to the light render — same brand green #009E73 for both the density curve/fill and the rug ticks, same cluster/gap/outlier shape.
      Legibility verdict: PASS — no dark-on-dark failures; all text and data elements are clearly distinguishable from the near-black surface.
