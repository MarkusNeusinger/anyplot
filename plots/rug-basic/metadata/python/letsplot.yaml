      Data: Brand green (#009E73) KDE curve with a light translucent green fill showing a trimodal shape (peaks near ~80ms, ~180ms, and a smaller bump near ~300ms), plus green rug tick marks along the x-axis baseline showing individual observations -- dense clustering in 60-220ms, sparser marks 270-350ms, and four isolated outlier ticks from 420-610ms.
