      Data: Single Imprint-brand-green (#009E73) KDE line with light semi-transparent fill shows a clear bimodal shape (peak ~85ms, smaller peak ~180ms). Below the y=0 baseline, green rug tick marks at ~50% alpha mark every individual observation, correctly clustering under the two KDE peaks and thinning in the gap between them; ticks are thinner (line_width 2.5) than the previous attempt, improving per-observation distinguishability, though the densest part of the cache-hits cluster still reads as a near-solid band.
