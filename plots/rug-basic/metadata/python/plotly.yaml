review:
  strengths:
  - Correct rug + KDE combination showing exactly what the spec describes; the trimodal
    data reveals clusters and gaps that a rug plot's individual tick marks uniquely
    expose
  - 'Both renders are correctly theme-adaptive: #FAF8F1/#1A1A17 backgrounds, INK/INK_SOFT
    text tokens, and an identical Imprint #009E73 data color across light and dark'
  - Thoughtful data storytelling via the two 'gap' annotations pinpointing exactly
    where the KDE dips, guiding the viewer straight to the rug plot's core value proposition
  - Alpha-blended overlapping rug ticks (opacity=0.5) and KDE fill (fillcolor alpha
    0.15) correctly handle density and overlap for ~150 overlapping observations
  - 'Clean, KISS-structured code: single seed, no functions/classes, only necessary
    imports (numpy, plotly.graph_objects, scipy.stats)'
  weaknesses:
  - Palette usage is essentially monochrome (single brand green throughout) -- while
    fully compliant, it doesn't demonstrate broader 'custom palette' sophistication,
    which caps DE-01 below top marks
  - Y-axis exposes a raw '-0.002' tick label from the artificial negative baseline
    used to place rug ticks -- this value has no real statistical meaning and slightly
    leaks implementation detail; consider hiding negative tick labels or adding a
    subtle separator/shading between the density curve and the rug strip
  - Solid, idiomatic go.Figure usage with a nice line-ns marker rug trick, but otherwise
    fairly standard trace layering -- no additional plotly-unique interactivity leveraged
    beyond the hover templates
