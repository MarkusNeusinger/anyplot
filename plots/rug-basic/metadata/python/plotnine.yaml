review:
  strengths:
  - Correct, idiomatic use of geom_rug combined with geom_density — exactly the complement
    the spec recommends
  - Amber-tinted "outliers" region and annotation creates a clear narrative focal
    point without fake interactivity
  - Full theme-adaptive chrome (PAGE_BG/INK/INK_SOFT branch correctly on ANYPLOT_THEME);
    data color identical across light/dark
  - Realistic, reproducible synthetic data (three clusters + explicit outlier array,
    seeded) that visibly demonstrates clustering, gaps, and outliers
  weaknesses:
  - Rug ticks in the ~130-200ms cluster overlap into a near-solid blob at alpha=0.6;
    a touch lower alpha (~0.4-0.5) would preserve slightly more per-tick distinction
    while still showing density
  - The "outliers" annotation text (size=7) is a bit small relative to the tick-label
    sizing — could bump toward size=8 for better hierarchy consistency
  - Y-axis (density) is fully hidden with no label; a minimalist and defensible choice
    here, but worth confirming this reads well for readers unfamiliar with KDE overlays
