  - Design excellence is close to the standard boilerplate; consider adding one deliberate
    visual-hierarchy touch (e.g., a lighter callout or color distinction on the outlier
    ticks) to give the plot a stronger focal point
  - sns.rugplot/sns.kdeplot are used with mostly default statistical parameters —
    no exploration of library-distinctive options beyond height/alpha tuning
