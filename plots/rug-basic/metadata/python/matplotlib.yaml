review:
  strengths:
  - Idiomatic use of matplotlib's EventCollection primitive — the purpose-built API
    for 1D event/rug distributions
  - Alpha transparency (alpha=0.7) properly used on overlapping tick marks, exactly
    as the spec's 'Notes' section requests
  - 'Thoughtful annotation design: arrows anchor callout text directly to each cluster''s
    rug marks and both outlier groups, adding genuine data storytelling without any
    fake interactivity'
  - 'Correct Imprint palette (brand green #009E73) and fully theme-adaptive chrome
    — data color is identical between renders, background/text/annotation colors correctly
    flip light/dark'
  - Clean KISS code structure, reproducible via np.random.seed(42), correct mandated
    title format, correct per-theme save handling
  - Realistic trimodal response-time dataset with distinct cluster widths and extreme
    outliers exercises all rug-plot features called out in the spec (clustering, gaps,
    precise distribution, outliers)
  weaknesses:
  - 'VQ-05: A large unused vertical band sits between the rug tick marks (which occupy
    y=0.35-0.65 of the 0-1 y-range) and the x-axis line at y=0 — roughly a third of
    the canvas height reads as dead space with no chart content. Tighten ax.set_ylim()
    (e.g. (0.25, 1.0)) or otherwise rebalance the vertical layout so the gap between
    the marks and the axis doesn''t read as wasted whitespace.'
  - 'VQ-03: In the densest cluster (n=50 tight cluster around 25ms) the overlapping
    ticks at alpha=0.7 blend into a solid green blob in places, making individual
    observations harder to distinguish. Consider a slightly lower alpha (~0.5-0.6)
    or a marginally thinner linewidth in dense regions to keep more individual ticks
    visible while still conveying density.'
  - 'LM-01: EventCollection is used directly rather than the higher-level ax.eventplot()
    convenience wrapper that matplotlib provides as the standard entry point for rug/event
    plots — correct and idiomatic, but one level below the library''s most typical
    top-level API for this exact plot type.'
