      Background: Warm off-white, pixel-sampled at (250,248,241) which is exactly #FAF8F1 as required — not pure white.
      Chrome: Title "rug-basic · r · ggplot2 · anyplot.ai" top-left in dark ink, clearly readable. X-axis title "Reaction Time (ms)" and y-axis title "Density" both in dark ink, clearly legible. Tick labels (0.000-0.004 on y, 400/600/800 on x) in softer grey, legible. Horizontal gridlines are present but render at full ink strength (26,26,23) rather than a faint tint — higher contrast than intended, though still thin (0.2 linewidth) and non-dashed.
      Data: Brand-green (#009E73, confirmed via pixel sample) filled density curve (alpha ~0.25) with a bold green outline, bimodal with a prominent peak near 380ms and a smaller peak near 610ms. Below the x-axis, a rug of short green tick marks (alpha 0.4) shows individual reaction-time observations, visibly denser under the two density peaks and sparser in the trough and tails — this is the only series, single-series, matching the brand-green-first rule.
      Legibility verdict: PASS — all title/axis/tick text is clearly readable against the light background; no light-on-light issues.

