review:
  strengths:
  - Correctly pairs geom_rug with geom_density exactly as the spec's Notes recommend
    ("works best as a complement to histograms, density plots, or scatter plots"),
    rather than shipping a bare rug with no context
  - Rug ticks use alpha = 0.4 so overlapping observations visibly darken into denser
    bands, directly satisfying the spec's "use semi-transparency when observations
    overlap" requirement
  - Bimodal reaction-time dataset (fast/practiced vs. slow/hesitant groups) is realistic,
    neutral, and specifically chosen so the rug reveals clustering that the smooth
    density curve alone would blur
  - 'Canvas is exactly 3200x1800px, backgrounds are pixel-exact #FAF8F1 / #1A1A17,
    and the first (only) series is pixel-exact Imprint brand green #009E73 in both
    themes'
  - 'Clean, reproducible code: set.seed(42), only used imports (ggplot2/tibble/ragg),
    correct ggsave + ragg::agg_png output pattern matching plot-{THEME}.png'
  weaknesses:
  - 'Major gridlines use panel.grid.major.y = element_line(color = INK, linewidth
    = 0.2) — INK is the full-strength primary text color (#1A1A17 light / #F0EFE8
    dark), not a faint variant. Pixel-sampled gridlines render at exactly (26,26,23)
    on light and (240,239,232) on dark — the same brightness as the title text — instead
    of the style guide''s 15-25% opacity. Fix: since ggplot2''s element_line() doesn''t
    expose alpha directly, use an 8-digit hex with an alpha channel (e.g. "#1A1A1726"
    light / "#F0EFE826" dark, ~15% alpha) as the library guide instructs ("use a faint
    INK color"), not the raw INK token.'
  - In the two densest reaction-time clusters (~350-420ms and ~600-650ms), overlapping
    rug ticks merge into a near-solid green band, losing the ability to distinguish
    individual observations there — slightly undercuts the rug plot's core value proposition
    of showing exact point locations. Consider a slightly lower alpha (e.g. 0.3) or
    thinner linewidth to preserve more separation in the densest region while keeping
    the clustering signal.
  - Design customization beyond the theme-token boilerplate is modest — same brand-green
    monochrome fill/line/rug with no additional refinement (e.g. no distinguishing
    tick color/weight from the density line, no annotation calling out the bimodal
    structure) — competent but not distinctive relative to the library's fuller styling
    toolkit.
