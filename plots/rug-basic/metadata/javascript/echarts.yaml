    group
  weaknesses:
  - Design Excellence reads as a well-configured default rather than a distinctive
    visual treatment - consider stronger typographic hierarchy or a deliberate emphasis
    technique (e.g. highlighting the outlier tail in Cold Start, annotating the gap
    in Regional Cache)
  - No ECharts-specific feature is leveraged beyond basic scatter+symbol usage - consider
    markLine/markArea (e.g. a median marker per group) or richer tooltip formatting
  - Mandated title occupies only ~30% of the plot width - within tolerance but on
    the small side; a modest fontsize increase could give it more visual presence
  - The tightly-clustered Edge Cache Hit group renders as a near-solid block due to
    heavy tick overlap - accurately reflects density but a slightly narrower tick
    width could preserve more individual-tick texture
