    is largely lost in the densest region.
  - Mandated title still occupies only ~28% of plot width even at fontSize 24 - within
    tolerance but on the small side; a modest further increase would give it more
    visual presence.
  - DE-01/DE-02 still read as a tastefully configured default rather than a fully
    distinctive aesthetic treatment - further typographic hierarchy or spine/grid
    refinement could push this into publication-ready territory.
