review:
  strengths:
  - 'Correct rug-plot technique: thin (pointWidth 3), semi-transparent (alpha 0.55)
    vertical ticks correctly reveal overlap density where observations cluster.'
  - Data faithfully engineered to show two clusters, a clear gap (~3.5-4.5h), and
    six outliers -- directly hits the spec's clustering/gap/outlier notes.
  - 'Clean theme-adaptive chrome: explicit font sizes throughout, correct Imprint
    green (#009E73) with alpha, correct #FAF8F1/#1A1A17 backgrounds, y-axis appropriately
    hidden since it carries no data meaning for a rug plot.'
  - Deterministic fixed-seed LCG data generation, no fake interactivity, clean minimal
    KISS code.
  weaknesses:
  - 'Severe vertical canvas underutilization: yAxis is min:0, max:4 while every rug
    mark has height 1, so the ticks only occupy roughly the bottom quarter of the
    plotting area, leaving a large (~60%+ of canvas height) blank dead zone between
    the subtitle and the rug strip. Tighten yAxis max to ~1.1-1.3 (or otherwise increase
    the fraction of the plot area the ticks occupy) so the rug fills most of the available
    vertical space.'
  - 'No data storytelling: the ticks form a flat, undifferentiated strip with no annotation
    or visual emphasis calling out the two clusters, the gap between them (~3.5-4.5h),
    or the outlier group beyond ~9.5h that the code comments say the data was designed
    to reveal.'
  - Tick marks read as a bit thin/modest for the available space -- once the vertical
    dead zone (see weakness 1) is fixed, increase tick height proportionally so the
    rug reads as a strong visual band rather than a faint line near the axis.
  - 'Generic technique with no library-distinctive feature: a bare column-chart-as-rug
    could be built the same way in almost any charting library. The spec notes a rug
    plot ''works best as a complement to histograms, density plots'' -- consider pairing
    with a subtle areaspline KDE/density trace above the rug for a stronger, more
    distinctive, better canvas-filling result.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 -- not pure white.
      Chrome: Title "rug-basic · javascript · highcharts · anyplot.ai" in bold dark ink at top; subtitle "Daily screen time reported by 356 survey respondents" in soft gray beneath it. Below a large blank gap, an x-axis line with tick numbers (0, 2, 4, 6, 8, 10, 12) in soft gray and axis title "Daily Screen Time (hours)" below that. All chrome text is dark-on-light and clearly legible.
      Data: A horizontal band of thin vertical green (#009E73, ~55% opacity) tick marks sitting just above the x-axis: a dense cluster roughly 1.5-3h, a second dense cluster roughly 5-8h, a visible gap between them (~3.5-4.5h), and six sparse individual ticks beyond ~9.5h representing outliers. Denser regions read as solid blocks of green from overlapping semi-transparent ticks.
      Legibility verdict: PASS -- no light-on-light issues, but a large unused blank area separates the title block from the rug strip (see VQ-05 weakness).

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 -- not pure black.
      Chrome: Title and subtitle now render in off-white/light-gray text, clearly readable against the dark surface -- no dark-on-dark failure. Axis line, tick numbers, and axis title also flip to light gray and remain legible.
      Data: The rug ticks remain the identical Imprint green (#009E73 at ~55% opacity) as the light render -- confirmed only the chrome (background/text/axis colors) flipped, the data color did not change. Same cluster/gap/outlier pattern is visible.
      Legibility verdict: PASS -- no dark-on-dark or light-on-light failures in either render; both themes are readable. The same large blank vertical dead zone above the rug strip persists in this render too.
