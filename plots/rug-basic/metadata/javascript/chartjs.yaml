review:
  strengths:
  - Combines rug marks with a translucent histogram context layer exactly per the
    spec's suggestion ("works best as a complement to histograms"), via a Chart.js
    mixed bar+scatter dataset.
  - 'pointStyle: "line" with rotation: 90 renders uniform, compact tick marks — a
    genuinely Chart.js-specific technique for a rug plot.'
  - Semi-transparency correctly applied to both rug ticks (borderColor + B3 alpha)
    and histogram bars (backgroundColor + 40 alpha) per the spec's overlap-transparency
    requirement.
  - Deterministic, realistic bimodal reaction-time data (fast cluster, slower lapse
    cluster, five outliers) covers clustering, gaps, and outliers, all explicitly
    called out in the spec.
  - Explicit font sizing throughout, a responsive title-fit formula for the long mandated
    title, theme-correct Imprint palette and chrome in both renders, and no clipping
    at any canvas edge.
  weaknesses:
  - Y-axis title "Trial Count" only describes the histogram layer; the rug region
    below zero has no count meaning and is unlabeled, which can confuse readers unfamiliar
    with the rug-below-histogram convention.
  - No annotation or callout marks the two response-time clusters (fast vs. lapse)
    even though the bimodal shape is the data's main insight — a light callout would
    push Data Storytelling further.
  - The two RNG helper functions (lcg, gaussian) are the correct idiomatic JS substitute
    for a seeded np.random call, but they add a touch more structure than a pure flat
    KISS script.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matching #FAF8F1 — not pure white.
      Chrome: Title "Reaction Times in a Cognitive Task · rug-basic · javascript · chartjs · anyplot.ai" is bold dark text at top-center, comfortably within the canvas with margin on both sides. Legend top-right shows a green line swatch "Individual trials (rug)" and a gray swatch "Trial count (25 ms bins)". X-axis title "Reaction Time (ms)" and Y-axis title "Trial Count" are dark ink; tick labels (200-1,000 on x, 0-50 on y) are a slightly softer dark gray. Horizontal gridlines are thin and light gray, no vertical gridlines. All text is clearly legible against the light background.
      Data: Gray/beige translucent histogram bars (25 ms bins) show a bimodal shape — a tall fast-response peak around 280-380 ms and a smaller, broader slow "lapse" peak around 500-650 ms, plus five isolated outlier bars near 850-950 ms. Below the zero line, a dense band of short green (#009E73) tick marks (semi-transparent) shows every individual trial's exact reaction time, visibly denser under the histogram peaks and matching the gaps/outliers in the bars above.
      Legibility verdict: PASS — no light-on-light or unreadable text found; no clipping at any edge (confirmed via right/left/top pixel crops).

    Dark render (plot-dark.png):
      Background: Warm near-black, matching #1A1A17 — not pure black.
      Chrome: Same title, legend, and axis titles now render in light/white text against the dark background; tick labels are a lighter soft gray. Gridlines are faint light gray, still visible but subtle. Legend swatches keep the same green/gray colors as the light render.
      Data: Histogram bars are translucent dark gray (still distinguishable from the near-black background), and the rug ticks remain the identical #009E73 green as the light render — only the chrome (background, text, grid) flipped, exactly as required.
      Legibility verdict: PASS — no dark-on-dark failures; all title/axis/tick text is clearly readable, and the brand green rug reads well on the dark surface.
