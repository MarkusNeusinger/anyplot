review:
  strengths:
  - 'Correct plot type: two-lane rug plot with one thin, alpha-blended tick per individual
    observation, matching the spec''s core requirement'
  - Deterministic seeded LCG data generation with a realistic reaction-time domain
    (~250-750ms) and a plausible morning-vs-evening fatigue shift plus tail outliers
  - 'Correct Imprint palette: first series brand green (#009E73), second series lavender
    (#C475FD), identical across light/dark; all chrome (background, ink, grid, axis)
    is theme-correct in both renders'
  - Overlapping ticks use strokeOpacity 0.42 so density clusters darken naturally,
    an appropriate alpha choice for ~140 points per lane
  - Direct in-chart lane labels avoid a redundant floating legend for a 2-series comparison
  - Custom composition via ChartContainer + useXScale/useDrawingArea is a legitimate,
    idiomatic MUI X pattern for a chart type the community package has no built-in
    series for
  weaknesses:
  - '''Evening session'' label is rendered directly in lavender (#C475FD) on the light-theme
    cream background (#FAF8F1) - this hue falls below the WCAG 3:1 contrast floor
    per the style guide''s palette-contrast table; add a thin ink stroke or increase
    weight/size on that specific label text (data ticks can stay as-is) so it holds
    up as legible text, not just a decorative mark'
  - Design Excellence is competent but still reads as a standard two-lane chart -
    consider a subtle per-lane background band or tightened tick-to-label spacing
    to lift the polish further
  - The tail outliers (636ms morning; 688/706/727ms evening) that the code comment
    calls out as 'attention lapses' are not visually distinguished from the rest of
    the distribution - no annotation, size bump, or color emphasis flags them, so
    the intended story only emerges on close reading rather than at a glance
  - Implementation bypasses every built-in MUI X chart type (LineChart/ScatterChart/BarChart)
    in favor of a fully custom SVG composition - legitimate given no native rug series
    exists, but it means Library Mastery only shows the low-level composition hooks
    rather than any built-in chart-type feature
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 - not pure white.
      Chrome: Title "Reaction Times by Session · rug-basic · javascript · muix · anyplot.ai" in bold dark ink at top-left, comfortably fits without clipping. X-axis "Reaction Time (ms)" with numeric ticks 250-750 in dark/grey ink, clearly legible. Subtle vertical grid lines at low opacity. A thin horizontal baseline rule sits beneath the "Morning session" tick cluster.
      Data: Two horizontal rug lanes. "Morning session" label and ticks in brand green (#009E73); "Evening session" label and ticks in lavender (#C475FD) - matches Imprint palette positions 1 and 2. Ticks are thin, semi-transparent vertical lines that darken where observations overlap (dense cluster ~400-500ms), with a few isolated outlier ticks further right (up to ~730ms).
      Legibility verdict: PASS overall, with one caveat - the lavender "Evening session" label text sits on the light cream background at a contrast level below the WCAG 3:1 floor per the style guide's own palette-contrast table (lavender is one of the five hues flagged as sub-3:1 on cream). It is still readable in the render due to bold weight/size, but this is a borderline case worth a stroke or weight bump.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 - not pure black.
      Chrome: Title in bold light/off-white ink, fully legible. X-axis tick labels and axis line in light grey, clearly visible against the dark background. Grid lines subtle. No dark-on-dark text anywhere.
      Data: Same green (#009E73) and lavender (#C475FD) tick colors as the light render, confirming data colors are identical across themes - only chrome flipped as required.
      Legibility verdict: PASS - unlike the light render, saturated hues like lavender read with good contrast against the near-black background (consistent with the style guide's note that most palette hues clear WCAG on dark bg), so no dark-on-dark or light-on-light failures observed.
