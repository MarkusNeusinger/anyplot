review:
  strengths:
  - 'Attempt-1 contrast fix applied correctly: the light-theme lavender "Evening session"
    label now carries a thin ink-colored stroke (paintOrder="stroke"), resolving the
    WCAG 3:1 shortfall on the cream background while leaving the data ticks untouched'
  - Outlier "attention lapse" trials are now visually distinguished — taller tick
    height (92% vs 72% of lane band), higher stroke opacity (0.85 vs 0.42), and thicker
    stroke (2.5px vs 2px) make the tail read at a glance in both renders
  - New per-lane tinted background bands (5% opacity fill in each series' own hue)
    add a subtle design layer that replaces the earlier "mid-chart baseline rule"
    clutter noted in the attempt-1 review
  - 'Correct Imprint palette: first series brand green (#009E73), second series lavender
    (#C475FD), identical across light/dark; all chrome (title, axis, ticks, grid)
    is theme-correct in both renders'
  - Deterministic seeded LCG data generation with a realistic, neutral reaction-time
    domain and a plausible morning-vs-evening fatigue shift plus tail outliers
  - Direct in-chart lane labels avoid a redundant floating legend for a 2-series comparison,
    keeping the layout clean
  weaknesses:
  - Data distribution per lane is still single-mode (unimodal + outliers) rather than
    showing a secondary cluster or multimodal shape — a more varied distribution would
    round out DQ-01 feature coverage
  - Implementation still bypasses every built-in MUI X chart type (LineChart/ScatterChart/BarChart)
    in favor of a fully custom SVG composition via ChartContainer + useXScale/useDrawingArea
    — legitimate since no native rug series exists, but Library Mastery is capped
    by the low-level composition rather than a distinctive built-in feature
  - The ink-stroke halo around the "Evening session" label is a touch heavier than
    needed in the dark render (light-on-light-ish stroke vs. lavender fill) — still
    fully legible, just not as crisp as the unstroked "Morning session" label
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 (not pure white).
      Chrome: Bold dark-ink title "Reaction Times by Session · rug-basic · javascript · muix · anyplot.ai" fully visible, no clipping. X-axis "Reaction Time (ms)" with numeric ticks 250-750 in legible dark/grey ink. Subtle vertical gridlines at ~15% opacity. Two lane labels: "Morning session" in solid brand green, "Evening session" in lavender now with a thin dark ink stroke outline (paintOrder="stroke") — this is the attempt-1 fix for the WCAG contrast shortfall, and it reads clearly against the cream background.
      Data: Two horizontal rug lanes on a shared x-axis, each with its own faint tinted background band (5% opacity in the lane's series color). "Morning session" ticks are brand green (#009E73); "Evening session" ticks are lavender (#C475FD) — matches Imprint palette positions 1 and 2. Dense clusters of thin, semi-transparent ticks darken naturally where reaction times overlap (~400-500ms for both sessions). One clearly taller, more opaque green tick near 636ms (morning outlier) and three taller, more opaque purple ticks near 688/707/727ms (evening outliers) now stand out distinctly from the rest of the distribution — this is the attempt-1 fix for unemphasized "attention lapse" trials.
      Legibility verdict: PASS — all text (title, axis label, tick labels, both lane labels) is clearly readable against the light background; no light-on-light failures.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 (not pure black).
      Chrome: Title and axis chrome render in light/off-white ink, fully legible, no dark-on-dark failures. Gridlines remain subtle. "Morning session" label in green with no stroke reads crisply; "Evening session" label in lavender with the ink stroke (now light-ink colored in dark theme) reads with a slightly heavier/bolder outline than its light-theme counterpart, but remains fully legible — not dark-on-dark, just a touch less crisp than the unstroked label.
      Data: Tick colors are identical to the light render (#009E73 / #C475FD), confirming only chrome flipped as required. The same outlier ticks (green ~636ms, purple ~688/707/727ms) are taller and more opaque than the surrounding distribution, clearly visible against the dark surface.
      Legibility verdict: PASS — all text is readable against the dark background; no dark-on-dark failures observed.
