review:
  strengths:
  - One tick per observation at its exact value, drawn perpendicular to the x axis
    from the useXScale scale, with no jitter or displacement
  - Ticks of one consistent height (18 % of the plot height) in brand green at 50
    % opacity, so clusters build up darker and isolated ticks stay visible in both
    themes
  - 'Composes the rug from MUI X v9 primitives: ChartsContainer, ChartsXAxis, and
    the useXScale and useDrawingArea hooks, with the axis band sized explicitly (height:
    72) so no tick label is truncated'
  - 'Realistic reaction-time data: a bimodal morning and evening mix plus four slow
    attention-lapse trials, showing the clusters, gaps and edge outliers a rug plot
    exists to reveal'
  - Deterministic LCG data and skipAnimation; axis limits come from the data
  weaknesses:
  - 'Suggestion: the rug could complement a density curve or a histogram, which the
    Notes allow, so that the empty upper plot area carries information.'
  - 'Suggestion: slightly stronger tick opacity, around 0.6, would lift the isolated
    tail ticks on the dark page.'
