review:
  strengths:
  - Three equally sized circles on an equilateral-triangle layout with pairwise and
    triple overlaps large enough to hold three items each, on a gridless, axis-free
    page in both themes
  - Semi-transparent Imprint fills (green, lavender, blue at 0.2 opacity) keep all
    seven zones distinguishable in light and dark
  - Grid-candidate label placement keeps every item fully inside its assigned zone
    and clear of its neighbours, with no data displacement since position within a
    zone is a layout choice
  - Item ink is chosen per zone from the blended fill luminance, so every label reads
    in both renders
  - Category names sit outside each circle on the side pointing away from the diagram
    centre, bold uppercase with letter spacing, so they cannot be taken for items
  - Uses the community ChartsContainer composition API with useXScale/useYScale hooks
    to draw a custom SVG layer, since @mui/x-charts has no Venn chart
  weaknesses:
  - 'Suggestion: the serif editorial voice of the subtitle could carry into a witty
    descriptive title prefix, as the spec''s Notes allow.'
  - 'Suggestion: the diagram occupies the central ~55 % of the landscape width; a
    square canvas would give the circles more presence.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white, matching #FAF8F1; no axes, ticks or grid.
      Chrome: bold title "venn-labeled-items · javascript · muix · anyplot.ai" top-left in dark ink, italic serif subtitle "A taxonomy of 15 beverages across 3 traits and 7 zones" in soft ink; category names PRETENTIOUS (above top circle), DELICIOUS (lower-left), AFFORDABLE (lower-right) in bold uppercase dark ink, all outside their circles. All readable.
      Data: three equal circles — Pretentious #009E73 (first), Delicious #C475FD, Affordable #4467A3 — with ~0.2 fill opacity and solid outlines. 15 item labels in dark text, each inside its zone: Kombucha/Matcha Latte (P), Flat White/Oat Milk Latte/Cold Brew (P∩D), Energy Drink/Sparkling Water (P∩A), Chai (triple), Cappuccino/Espresso (D), Orange Juice/Diner Coffee/Green Tea (D∩A), Tap Water/Herbal Tea (A). No overlaps.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black, matching #1A1A17.
      Chrome: title, subtitle and category names flip to light ink; all clearly readable, no dark-on-dark.
      Data: same three palette hues and outlines as light; fills read as darker tinted zones over the dark page, all seven zones distinguishable. Item labels switch to light text and stay readable in every zone. Brand green outline clearly visible.
      Legibility verdict: PASS
