review:
  strengths:
  - Correct 14-period Wilder's smoothing RSI computed from a simulated daily-close
    price series, not a fabricated random walk directly in [0,100]
  - Overbought (70-100) and oversold (0-30) zones shaded with subtle alpha fills,
    using the semantic amber warning color for overbought and muted ink for oversold,
    plus dashed 30/70 threshold lines and an optional dotted 50 centerline exactly
    as the spec requests
  - Y-axis correctly fixed to 0-100 via scale_y_continuous(limits), lookback period
    surfaced directly in the axis label 'RSI (14-period)'
  - 'Theme-adaptive chrome is correctly threaded through (PAGE_BG/INK/INK_SOFT/INK_MUTED
    from ANYPLOT_THEME), first series is Imprint brand green #009E73, canvas is the
    correct 3200x1800 landscape target, title matches the mandated ''indicator-rsi
    · r · ggplot2 · anyplot.ai'' format exactly'
  weaknesses:
  - panel.grid.major.y uses breaks c(0,30,50,70,100), which are the exact same y-positions
    as the dashed 30/70 reference lines and the dotted 50 centerline -- the plain
    gridline sits directly under each reference line and adds redundant line weight
    instead of contrast; use different major-grid breaks (or suppress the grid at
    those three positions) so the intentional dashed/dotted reference lines stand
    out as the only lines at 30/50/70
  - No distinctive ggplot2-specific feature beyond standard annotate()/geom_hline()/geom_line()
    layering -- e.g. geom_ribbon() for the zone shading would be a more idiomatic
    single-layer alternative to the two annotate('rect') calls
  - No callout/annotation on the extreme RSI values (the ~72 peak in May, the ~28
    trough in July) that would sharpen the data storytelling beyond the static zone
    labels
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white, consistent with #FAF8F1.
      Chrome: title "indicator-rsi · r · ggplot2 · anyplot.ai" in dark ink top-left, well within canvas bounds, not overflowing (~35% width). "Date" and "RSI (14-period)" axis titles and tick labels (0/30/50/70/100, monthly date ticks Mar-Jul 2024) render in dark/soft-dark ink, all clearly legible against the light background.
      Data: single green (#009E73) RSI line oscillating mostly between ~28 and ~74 across ~120 trading days. Overbought zone (70-100) shaded pale amber with "Overbought" label in muted gray; oversold zone (0-30) shaded pale gray with "Oversold" label. Dashed lines at 30/70, faint dotted centerline at 50.
      Legibility verdict: PASS.

    Dark render (plot-dark.png):
      Background: warm near-black, consistent with #1A1A17.
      Chrome: title and axis titles/tick labels render in light ink/off-white, clearly legible against the dark background. No dark-on-dark text found anywhere -- tick labels, axis titles, and the "Overbought"/"Oversold" annotations all show adequate contrast against their respective (dark olive / dark gray) zone backgrounds.
      Data: RSI line is the identical #009E73 green as the light render, same shape and same 30/50/70 reference lines (dashed/dotted, now light gray).
      Legibility verdict: PASS.
