review:
  strengths:
  - Wilder's RSI computed with pandas ewm(alpha=1/PERIOD, adjust=False, min_periods=PERIOD)
    rather than a hand loop
  - 'Overbought and oversold bands each share the Imprint hue of their dashed threshold
    line, with the RSI line in #009E73 standing out in both themes'
  - expand=(0,0) on both scales keeps the y-axis exactly 0-100 and lets the bands
    meet the axes
  - Lookback noted in the y-axis title 'RSI (14-day)' via the column name, which plotnine
    uses as the axis title
  - Theme tokens applied to every chrome element; both renders read cleanly
  weaknesses:
  - 'DQ-02 (both): the named real pair ETH/USD is shown with synthetic RSI on real
    calendar dates (Sep 2024-Feb 2025), so the chart presents an invented history
    for a real asset (e.g. near-oversold in Nov 2024) → keep the crypto domain but
    stop it reading as real history, e.g. a simulated label in the title prefix or
    an undated window. Likely cause: pd.date_range(''2024-09-02'', ...) together with
    the ''ETH/USD'' title prefix.'
  - 'Suggestion: the two geom_rect layers with their two one-row frames could be one
    frame with a zone column and scale_fill_manual.'
  - 'Suggestion: a drift regime deep enough to push the RSI clearly below 30 once
    would put the oversold band to use.'
