review:
  strengths:
  - Real datetime x axis via scale_x_datetime(format='%b %Y') with month ticks that
    sit at the actual month starts
  - 'Imprint semantic pairing: overbought zone and 70 line in #AE3030, oversold zone
    and 30 line in #4467A3, RSI line in #009E73 standing out from both'
  - Lookback period carried by the y-axis title 'RSI (14-period)', so the chart notes
    it without an extra layer
  - Correct Wilder RSI computation with the line starting only once the 14-period
    lookback is filled
  - Theme tokens threaded through every chrome element; both renders read cleanly
  weaknesses:
  - 'DE-02 (both): vertical month gridlines drawn at full INK_SOFT on a line chart
    compete with the zone shading → y-grid only, or the 15 % grid token. Likely cause:
    panel_grid_major=element_line(color=INK_SOFT, size=0.2) without panel_grid_major_x=element_blank().'
  - 'Suggestion: extend the zone rectangles to the panel edges (or stop the threshold
    lines at the data range) so shading and dashed lines end together.'
  - 'Suggestion: a price panel above the RSI panel (the Notes allow it) would show
    what the oscillator reacts to.'
