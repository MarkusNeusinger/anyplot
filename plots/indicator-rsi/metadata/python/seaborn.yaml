      Data: one continuous #009E73 RSI line (2.5 pt) from late January to early July 2024, peaking ~83 in February and ~78 in June, bottoming ~14 in late April; dashed red line at 70 over a light red-tinted zone 70–100, dashed blue line at 30 over a light blue-grey zone 0–30, dotted muted centerline at 50; right-margin labels "Overbought (>70)" red, "Neutral (50)" grey, "Oversold (<30)" blue.
