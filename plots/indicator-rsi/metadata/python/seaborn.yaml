review:
  strengths:
  - The RSI is computed with Wilder smoothing from a simulated close series through
    pandas `ewm(alpha=1/14, adjust=False, min_periods=14)`, so the line starts once
    the lookback is filled and sits at its computed values
  - Y ticks reduced to the meaningful levels 0, 30, 50, 70 and 100, so every gridline
    doubles as a threshold reference
  - Zone labels (Overbought >70, Neutral 50, Oversold <30) sit in the right margin
    in the colors of their reference lines, a direct-labelled key that never touches
    the data
  - Lookback period is noted in the y-axis title 'RSI (14-period)', fulfilling the
    spec's Notes
  - Brand-green RSI line at 2.5 pt stands clearly above the dashed red/blue thresholds,
    the dotted muted centerline and the zone tints at alpha 0.10 in both themes
  - 'Idiomatic seaborn: sns.set_theme with theme-token rc, sns.lineplot(data=df, x=DATE,
    y=RSI) on the tidy frame, sns.despine for spine handling'
  weaknesses:
  - 'VQ-01 (dark): the 8 pt zone labels ''Overbought (>70)'' in #AE3030 and ''Oversold
    (<30)'' in #4467A3 reach only about 2.7:1 and 3.1:1 contrast on the #1A1A17 background
    and read dim, especially in the 400 px thumbnail → at least about 4.5:1, e.g.
    a lighter tint of the zone color in dark or the line color only on a marker with
    the text in INK_SOFT. Likely cause: the ax.text color set straight from OVERBOUGHT_COLOR
    / OVERSOLD_COLOR in both themes.'
  - 'Suggestion: the x date ticks are short (''2024-02'') and need no 30° rotation;
    horizontal ticks would read faster.'
  - 'Suggestion: a price panel above the RSI panel sharing the date axis, as the Notes
    allow, would show what the RSI is measuring.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, landscape 3200x1800.
