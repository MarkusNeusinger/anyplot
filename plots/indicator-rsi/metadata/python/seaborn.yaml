review:
  strengths:
  - Zone labels set inline at the right edge in the matching zone colors (Overbought
    red, Oversold blue, Neutral muted) replace a legend and read directly against
    the bands
  - Y ticks placed exactly at 0/30/50/70/100 so the axis itself names the three reference
    levels; tick marks removed and x-range clamped to the data
  - 'Theme tokens threaded through sns.set_theme rc: chrome flips cleanly between
    #FAF8F1 and #1A1A17 while the brand-green RSI line and the red/blue zones stay
    identical'
  - Lookback period noted in the y-axis title 'RSI (14-period)' as the Notes ask;
    y-axis fixed at 0-100 with dashed 30/70 lines and a dotted 50 centerline subordinate
    to the RSI line
  weaknesses:
  - 'DQ-01 (both): the RSI never enters the overbought zone (max about 69), so only
    the oversold half of the indicator is shown → at least one run above 70 like the
    oversold excursion. Likely cause: the +18 bull-run offset at rsi_values[15:25]
    lands on values far below 52 and the line peaks just under 70.'
  - 'DQ-03 (both): the line sits on a perfectly flat floor at exactly 15 for about
    nine consecutive periods in March, which no computed RSI produces → values that
    keep moving inside the zone. Likely cause: np.clip(rsi_values, 15, 85) cutting
    off the -15 bear offset; the RSI is a clipped random walk instead of being computed
    from a 14-period price series as the spec''s Data example describes.'
  - 'SC-01, VQ-03 (both): blue dot markers drawn on every period below 30 form an
    unrequested highlight layer and crowd into a chain of overlapping circles on the
    flat March run → remove both zone scatterplot layers; the shaded zones already
    highlight the extremes. Likely cause: the two sns.scatterplot calls on df[df[RSI]
    >= OVERBOUGHT] / <= OVERSOLD.'
  - 'VQ-02 (both): the ''Neutral (50)'' label sits at 53 and the RSI line''s late-June
    peaks at about 52 touch its baseline at the right edge → clear the line by a few
    units, e.g. place the label below the centerline or at about 56 (+3). Likely cause:
    ax.text(0.995, CENTERLINE + 3, ...).'
  - 'DQ-02 (both): the scenario is generic — no asset or market is named anywhere,
    so the chart reads as an abstract series → name a plausible instrument (e.g. a
    fictional large-cap stock or an index ETF) in the title prefix or y-label. Likely
    cause: no context label in the data block.'
  - 'Suggestion: a price panel above the RSI panel sharing the date axis, as the Notes
    allow, would show what the oscillator reacts to.'
