review:
  strengths:
  - Wilder-smoothed RSI computed from a simulated price path (SMA seed over the first
    14 deltas, then ewm(alpha=1/14, adjust=False)) and aligned to dates[LOOKBACK:],
    so the line begins only once the lookback is filled
  - Y-axis fixed 0–100 with Range1d and a ticker set to exactly the semantic levels
    0/30/50/70/100, so the horizontal grid coincides with the reference levels instead
    of competing with them
  - 'Threshold Spans and BoxAnnotation zones share one color per side (matte red #AE3030
    overbought, blue #4467A3 oversold) at fill_alpha 0.10, light enough that the 5
    px #009E73 RSI line leads in both themes'
  - Lookback period is noted twice, in the legend entry 'RSI (14-period lookback)'
    and the y-axis title
  - Legend built from explicit LegendItems and placed in its own band above the plot
    via add_layout(legend, 'above'), clear of the data; theme tokens threaded through
    every chrome element, so the dark render has no dark-on-dark text
  weaknesses:
  - 'Suggestion: a HoverTool showing date and RSI value on the line would add inspection
    value to the HTML output without changing the PNG.'
  - 'Suggestion: the legend''s scatter glyphs draw smaller than the 20 px markers
    they explain; a larger glyph would make the match more obvious.'
