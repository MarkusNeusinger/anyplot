review:
  strengths:
  - The RSI line (#009E73, line_width=5) leads clearly over the dashed 30/70 Spans,
    the dotted 50 centerline and the 0.10-alpha BoxAnnotation zones in both themes
  - The y-axis is fixed with Range1d(0, 100) and its ticks sit only at 0/30/50/70/100,
    so the threshold levels can be read straight off the axis
  - The 14-period lookback appears both in the legend entry and in the y-axis title,
    as the Notes ask
  - Readings beyond each threshold carry red/blue markers with a page-colored outline,
    which draws the eye to the overbought and oversold episodes
  - Bokeh-native BoxAnnotation, Span, Legend/LegendItem placed above the plot via
    add_layout(legend, 'above'); ColumnDataSource throughout
  - 'Theme tokens thread through every chrome element: dark render has no dark-on-dark
    text'
  weaknesses:
  - 'CQ-04 (code): Wilder smoothing is written out as a Python for-loop over avg_gain/avg_loss
    (lines 59-66) where pandas computes it → pd.Series(gains).ewm(alpha=1/LOOKBACK,
    adjust=False).mean() (and the same for losses), about 8 lines shorter. Likely
    cause: hand-rolled recursive average.'
  - 'Suggestion: a HoverTool showing the date and RSI value would add value in the
    interactive HTML view.'
  - 'Suggestion: an optional price panel above the RSI panel, sharing the x_range,
    would show the context the Notes describe as typical.'
