  strengths:
  - RSI computed with Wilder smoothing through pandas ewm(alpha=1/14, min_periods=14);
    the line starts only once the lookback is filled, using None gaps instead of placeholder
    values
  - Both zones shaded with opaque 16% tints of their threshold colors, light enough
    that the green RSI line stays clearly visible inside them in both themes
  - 'Clear drawing order: zone fills, dashed 30/70 lines, a thinner dotted 50 centerline,
    and the RSI line on top in brand green'
  - Lookback period noted in the y-axis title and legend ('RSI (14-period)'); y-axis
    fixed at 0-100 via range=(0, 100)
  - Sparse date ticks every 20 trading days via x_labels_major and show_minor_x_labels=False
    keep the x-axis readable
  - 'Theme tokens threaded through pygal''s Style: text readable and data colors identical
    in both renders; native HTML tooltips per point'
  weaknesses:
  - 'VQ-03 (both): the ''Neutral band (30-70)'' legend entry has its swatch drawn
    in the page color (#FAF8F1 / #1A1A17), so it shows as a label with no glyph →
    drop the entry from the legend or give it a visible glyph. Likely cause: the page-colored
    neutral-band fill series (PAGE_BG in series_colors, line 66) is added with a legend
    title instead of title=None.'
  - 'VQ-01 (both): the y tick labels mix two sizes, with 0, 50 and 100 at 44 px and
    10-40, 60-90 at 56 px, so the axis reads unevenly → one size for every y tick
    (+12 px for the major ticks). Likely cause: major_label_font_size=44 vs label_font_size=56
    in Style (lines 82-83).'
  - 'CQ-01 (code): lines 51-54 define a blend() helper function → compute the two
    zone tints inline (two hex constants or one expression each). Likely cause: the
    opaque-tint mix was wrapped in a def.'
  - 'Suggestion: the zone fills end at the last data point while the plot area and
    the right-hand y guides run on past it; aligning the plot''s right edge with the
    last date would tidy the frame.'
  - 'Suggestion: a price panel above the RSI panel, which the Notes allow, would show
    what the momentum swings respond to.'
