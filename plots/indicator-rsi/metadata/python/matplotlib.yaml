review:
  strengths:
  - 'Theme tokens threaded through every chrome element: title, labels, ticks, spines,
    grid, legend frame and threshold labels flip cleanly between #FAF8F1 and #1A1A17'
  - RSI computed from synthetic prices with true Wilder smoothing (SMA seed, then
    recursive average), so the line starts only once the 14-period lookback is filled
  - 'Zones shaded lightly (alpha 0.12) in the red loss anchor and Imprint blue, with
    the #009E73 line clearly on top in both themes'
  - Threshold labels placed with annotate(textcoords='offset points'), so they stay
    a fixed distance from their lines at any data range
  - Lookback noted in the legend entry 'RSI (14-period)'; canvas exactly 3200x1800
    from figsize x dpi
  weaknesses:
  - 'DQ-01 (both): the RSI never enters the overbought zone (maximum about 65, below
    the 70 line), so the chart shows oversold dips but no overbought condition → data
    whose price run pushes the RSI above 70 at least once (about +6 points at the
    peak). Likely cause: the trend/volatility parameters and seed of the synthetic
    price series.'
  - 'Suggestion: an optional price panel above the RSI panel with a shared date axis
    (sharex) would show the context the Notes describe as typical.'
