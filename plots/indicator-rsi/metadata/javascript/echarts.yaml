review:
  strengths:
  - Correct 14-period Wilder-style RSI smoothing, matching the spec's standard lookback
    and calling it out in the subtitle and series name
  - Fixed 0-100 Y-axis with dashed 30/70 threshold lines plus an optional dotted 50
    neutral centerline, exceeding the spec's minimum requirements
  - Overbought/oversold zones shaded with markArea using semantically appropriate
    colors (red-tinted danger zone above 70, green-tinted zone below 30) at low alpha,
    legible on both surfaces
  - Deterministic LCG-seeded price walk drives the RSI through a full round trip across
    neutral, overbought, and oversold territory, giving strong feature coverage
  - 'Idiomatic, distinctive ECharts usage: the markArea + markLine combination for
    threshold bands and labeled reference lines is a declarative pattern that is comparatively
    hard to replicate cleanly in other libraries'
  - 'Theme-adaptive chrome is correctly threaded through title, subtitle, axes, and
    markLine labels; first (and only) series is Imprint brand green #009E73 identical
    across both renders'
  weaknesses:
  - 'VQ-01: markLine labels (''Overbought''/''Neutral''/''Oversold'') render at fontSize
    13, smaller than the 14px used for axis labels and the y-axis name elsewhere in
    the chart -- bump to 14px for consistency and slightly better mobile legibility.'
  - 'CQ-01: four helper functions (hexToRgba, lcg, nextTradingDay, computeRsi) are
    justified by the RSI math and trading-calendar walk, but hexToRgba could be dropped
    by precomputing the two rgba() strings once instead of calling a conversion helper,
    trimming one function toward a tighter KISS shape.'
  - 'DE-01/DE-02: the oversold zone fill and the RSI line itself both use the same
    brand green hue (t.palette[0]) -- consider tinting the oversold zone from a different
    but still semantically appropriate source (e.g. a muted/neutral tone) so the zone
    fill reads more distinctly from the data line at a glance, sharpening the visual
    hierarchy further.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 -- not pure white.
      Chrome: Title "indicator-rsi · javascript · echarts · anyplot.ai" and subtitle "14-period RSI on daily closing prices · overbought > 70 · oversold < 30" render in dark ink, both fully legible. Y-axis "RSI" label and 0-100 tick labels (interval 10) are dark gray and clearly readable. X-axis month ticks (Feb-Jul) are readable. Dashed "Overbought" line at 70, dotted "Neutral" line at 50, and dashed "Oversold" line at 30 all carry legible right-aligned text labels with no clipping at the canvas edge (verified via crop).
      Data: Single RSI line in Imprint brand green (#009E73), 3px width, no markers -- clean against the light background. The overbought band (70-100) is tinted a very light rose/red, and the oversold band (0-30) is tinted a very light green (matching the line's hue at low alpha but still distinguishable since the line is fully saturated).
      Legibility verdict: PASS -- no light-on-light text, no overlap between the line and threshold labels.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 -- not pure black.
      Chrome: Title and subtitle render in light ink (near-white/soft light gray), fully legible. Y-axis and X-axis tick labels are light gray, clearly readable against the dark background. The three threshold-line labels ("Overbought", "Neutral", "Oversold") are light-colored and legible, with no dark-on-dark failures anywhere in the chart.
      Data: The RSI line is the identical brand green (#009E73) as in the light render -- confirmed unchanged. The overbought band is now a dark maroon tint and the oversold band a dark green tint, both appropriate for the dark surface and still readable.
      Legibility verdict: PASS -- no dark-on-dark text, all chrome elements adapted correctly; only the chrome (background/text/band tint) flipped, the data color stayed constant as required.
