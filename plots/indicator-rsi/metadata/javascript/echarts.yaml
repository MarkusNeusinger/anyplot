review:
  strengths:
  - Correct 14-period Wilder-style RSI smoothing, matching the spec's standard lookback
    and calling it out in the subtitle and series name
  - Fixed 0-100 Y-axis with dashed 30/70 threshold lines plus an optional dotted 50
    neutral centerline, exceeding the spec's minimum requirements
  - Overbought zone tinted with a semantic red (palette[4]) and oversold zone now
    tinted with a neutral inkSoft gray, fixing the prior-attempt issue where the oversold
    fill shared the RSI line's own green hue
  - markLine threshold labels ('Overbought'/'Neutral'/'Oversold') now render at the
    same 14px used elsewhere in the chrome, fixing the prior-attempt font-size inconsistency
  - Deterministic LCG-seeded price walk drives the RSI through a full round trip across
    neutral, overbought, and oversold territory
  - 'Idiomatic, distinctive ECharts usage: markArea + markLine for threshold bands
    is comparatively hard to replicate cleanly in other libraries'
  - 'Theme-adaptive chrome correctly threaded through title, subtitle, axes, and markLine
    labels; first (and only) series is Imprint brand green #009E73 identical across
    both renders'
  weaknesses:
  - Four small helper functions (hexToRgba, lcg, nextTradingDay, computeRsi) remain;
    justified by the RSI/trading-calendar math but hexToRgba could be dropped by precomputing
    the two rgba() strings once
  - Y-axis name 'RSI' has no unit annotation (e.g. '(0-100)') — minor, since RSI is
    a dimensionless index, but would nudge VQ-06 to unambiguous
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "indicator-rsi · javascript · echarts · anyplot.ai" and subtitle "14-period RSI on daily closing prices · overbought > 70 · oversold < 30" render in dark ink and are fully legible. Y-axis shows "RSI" with 0-100 ticks at interval 10; X-axis shows month ticks (Feb-Jul). Dashed "Overbought" (70), dotted "Neutral" (50), and dashed "Oversold" (30) reference-line labels sit clear of the plot area on the right margin, all at consistent 14px sizing, no clipping at the canvas edge.
      Data: A single brand-green (#009E73) RSI line (3px, no markers/symbols) traces from ~73 down through a full oscillation cycling between ~20 (oversold, mid-March) and ~81 (overbought, early Feb and early May) and back up to ~68 by July. The 70-100 band is tinted a light rose/red (palette[4] at low alpha) and the 0-30 band is tinted a light neutral gray (inkSoft at low alpha) — the two zones are now visually distinct from each other and from the green data line.
      Legibility verdict: PASS — all text readable against the light background.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Title, subtitle, and all axis/tick/threshold-line labels render in light ink and remain fully legible — no dark-on-dark failures anywhere. Threshold-line labels are still 14px, matching the light render.
      Data: The RSI line is the identical brand green (#009E73) as the light render, confirming data-color consistency across themes. The overbought band is now a dark maroon tint and the oversold band a dark neutral-gray tint, both appropriate for the surface and clearly distinguishable from the green line and from each other.
      Legibility verdict: PASS — no dark-on-dark issues found; only chrome (background, text, zone tint) flips between renders, data color stays constant as required.
