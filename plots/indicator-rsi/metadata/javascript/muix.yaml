review:
  strengths:
  - Correct Wilder's RSI(14) implementation with a fixed 0-100 y-axis scale, exactly
    as the spec requires
  - All three reference lines present (70 overbought, 30 oversold, and the optional
    50 centerline), each with a distinct line style (solid amber, solid muted, dashed
    neutral) so they read as separate signals at a glance
  - Overbought/oversold zones are shaded using the Imprint semantic anchors correctly
    (amber = warning/caution for overbought, muted = neutral/other for oversold) rather
    than arbitrary custom hexes
  - Idiomatic MUI X composition API usage (ChartContainer + LinePlot + ChartsGrid
    + ChartsReferenceLine + ChartsTooltip) instead of just the high-level <LineChart>
    wrapper, enabling the custom reference lines and grid styling
  - Deterministic, seeded synthetic data (fixed-seed LCG) that oscillates through
    a full bull/bear cycle so the RSI naturally visits both the oversold and overbought
    extremes
  - 'Both renders are fully theme-correct: identical brand-green data line, warm off-white/near-black
    backgrounds, and all chrome (title, ticks, grid, legend) readable in both themes'
  - Clean composition and correct output contract for a muix/React implementation
    — skipAnimation set, sizes driven by window.ANYPLOT_SIZE, no manual mounting
  weaknesses:
  - Reference-line labels (Overbought/Oversold/Neutral) are set at 12px, the smallest
    text in the chart — bump to ~13-14px to match the tick-label size and stay legible
    when the PNG is scaled down to mobile width
  - 'Design excellence is solid but conventional: the shading + threshold-line pattern
    is the expected way to render RSI per the spec, so it satisfies the requirement
    rather than adding a distinctive extra layer of storytelling (e.g. no annotation
    calling out a specific overbought/oversold crossing)'
  - Legend zone swatches (opacity 0.5 fill, no border) read slightly muddy on the
    dark render — a thin 1px border in the swatch's own hue would keep them crisp
    against the near-black background
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "indicator-rsi · javascript · muix · anyplot.ai" in bold dark ink, clearly readable. X-axis "Trading Date" and Y-axis "RSI" labels in dark ink, tick labels (dates, 0/20/40/60/80/100) in a slightly softer dark gray. Horizontal grid lines are thin and subtle. Reference-line labels ("Overbought (70)" in amber, "Oversold (30)" in muted gray, "Neutral (50)" in soft gray) sit fully inside the plot area near the right edge, not clipped.
      Data: Single RSI line in brand green (#009E73), 120 trading days, oscillating from a deep oversold trough (~13) to a deep overbought peak (~93) and back — clearly visible against both the plain background and the two shaded bands (pale amber tint above 70, pale gray tint below 30).
      Legibility verdict: PASS — all text is dark-on-light and clearly readable, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Title and axis labels render in light ink (near-white), tick labels in a softer light gray. Grid lines remain thin and subtle against the dark surface. The same three reference-line labels are legible (amber, light gray, soft gray) with no dark-on-dark failures.
      Data: The RSI line is the same brand green (#009E73) as the light render — data colors are identical across themes; only the chrome (background, shading tint, text) flipped as expected. The amber-tinted overbought band reads as a dark olive tone and the oversold band as a dark charcoal tone, both still visually distinct from the plain background and from each other.
      Legibility verdict: PASS — no dark-on-dark text; every label, tick, and reference-line annotation is clearly visible on the near-black surface.
