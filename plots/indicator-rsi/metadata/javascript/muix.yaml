review:
  strengths:
  - 'Every element the Notes ask for is present: y-axis fixed to 0–100, dashed reference
    lines at 30 and 70 with right-aligned ''Overbought (70)'' / ''Oversold (30)''
    labels, a subordinate thinner, lighter centerline at 50, and both extreme zones
    tinted lightly enough that the green RSI line stays clearly readable inside them
    in both themes.'
  - The RSI is computed properly with Wilder's smoothing (lines 57–77) from a deterministic
    LCG price walk, with the 14-day warm-up computed off-screen so all 120 visible
    periods carry valid values; the date, close and RSI arrays are index-aligned.
  - The lookback is noted in the chart as the spec asks, both in the series label
    'RSI (14-period)' and in a monospaced subtitle that also reports the date span,
    the close move ($69.6 → $85.5) and the counts of overbought (63) and oversold
    (33) periods, all computed from the data.
  - 'Idiomatic MUI X v9 composition: ChartsContainer with LinePlot, ChartsGrid, three
    ChartsReferenceLine components (label, labelAlign, lineStyle) and the axis components,
    plus a custom SVG zone layer that reads the chart''s own scale through useDrawingArea
    and useYScale, so the shading follows the axis exactly.'
  - 'Theme tokens are passed through every element (title ink, subtitle and ticks
    in inkSoft, grid in t.grid, zones in inkSoft at 0.12 opacity); the light and dark
    renders differ only in chrome, and the RSI line is #009E73 in both.'
  - Interactive HTML output keeps MUI X's native axis tooltip on the line series,
    so readers can inspect each day's RSI value.
  weaknesses:
  - 'Suggestion: the band-scale x axis draws a tick mark for every one of the 120
    trading days while labelling only every tenth, which leaves a dense comb along
    the baseline; a tickInterval matching the labelled days would clean it up.'
  - 'Suggestion: the zone swatches in the hand-built legend use the same 0.12 opacity
    as the zones and almost disappear on the #1A1A17 background; a thin inkSoft outline
    on the swatch would keep them legible without changing the zones.'
  - 'Suggestion: the 70/30 reference lines are drawn at 1.75 px in near-ink; a slightly
    lighter stroke would make the RSI line stand out from them even more.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 page, plot area transparent over it; the 70–100 and 0–30 zones are a light warm-grey tint.
      Chrome: bold title "indicator-rsi · javascript · muix · anyplot.ai" top left (~28 % of width), monospaced inkSoft subtitle "Wilder's 14-period RSI over 120 periods (Jan 23 to Jul 9, close $69.6 → $85.5) · 63 overbought (≥70) & 33 oversold (≤30) periods"; y-axis title "Relative Strength Index (RSI)" rotated on the left, ticks 0–100 by 20 in mono; x-axis title "Trading date", tick labels every ten trading days (Jan 23 … Jun 26) with a small tick mark under each day; subtle horizontal grid lines; dashed dark lines at 70 and 30 labelled "Overbought (70)" / "Oversold (30)" in bold mono at the right end, a thinner, lighter dashed "Neutral (50)" line. HTML legend at the bottom: green line "RSI (14-period)", grey swatches "Overbought zone (> 70)" and "Oversold zone (< 30)". All text dark and readable; nothing clipped.
      Data: a single continuous #009E73 RSI line, ~85–93 in Jan–Feb, dropping through 50 in mid-March to a 13–29 oversold trough in April, then rising back above 70 by late May and peaking near 93 in late June; the line is clearly visible inside both shaded zones.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17; the zones are a slightly lighter dark-grey tint.
      Chrome: title, subtitle, axis titles, tick labels, reference-line labels and legend text all flip to light ink/inkSoft and read clearly; grid lines subtle but visible; the dashed 70/30 lines are light grey, the neutral line fainter. No dark-on-dark text anywhere. The legend's zone swatches are faint but visible.
      Data: the RSI line is the same #009E73 with identical shape; only chrome changed.
      Legibility verdict: PASS
