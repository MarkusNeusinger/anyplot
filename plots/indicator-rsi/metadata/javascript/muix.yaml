review:
  strengths:
  - Correct Wilder RSI computed from a generated close series, with the plotted window
    starting only once the 14-period lookback is filled
  - Native ChartsReferenceLine thresholds at 30/50/70 with right-aligned in-plot labels,
    the neutral line visibly subordinate to the threshold lines
  - Zone shading drawn by a custom layer that reads the chart's own y scale via useYScale/useDrawingArea,
    light enough that the green RSI line stays clear inside both zones in both themes
  - Lookback noted twice (legend 'RSI (14-period)' and the subtitle), and the subtitle
    quantifies the overbought and oversold periods
  - 'All chrome threaded through ANYPLOT_TOKENS: legible in both themes, RSI in Imprint
    #009E73 identical across renders'
  weaknesses:
  - 'VQ-03 (both): the overbought/oversold legend swatches are filled at about 28
    % opacity with a dashed outline, while the zones they explain are filled at 12
    % with no outline, so the swatch reads darker than any zone in the plot → fill
    the swatches at the zones'' opacity (12 %) with no dashed border. Likely cause:
    swatch background `${OVERBOUGHT_COLOR}48` and `border: 1.5px dashed` in the HTML
    legend.'
  - 'Suggestion: the band x axis draws a tick mark for each of the 120 days, a dense
    comb along the bottom; thinning the ticks with tickInterval to the labelled dates
    would calm the axis.'
  - 'Suggestion: a slightly larger title (about 26 px) would give the header more
    presence over the long monospaced subtitle.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 page; the 70–100 and 0–30 zones are a light warm-gray tint.
      Chrome: bold dark title "indicator-rsi · javascript · muix · anyplot.ai" top left, monospaced gray subtitle "Wilder's 14-period RSI over 120 periods (Jan 23 to Jul 9, close $69.6 → $85.5) · 63 overbought (≥70) & 33 oversold (≤30) periods". Y axis "Relative Strength Index (RSI)" 0–100 with ticks every 20, x axis "Trading date" with labels Jan 23 … Jun 26 every 10 trading days and a tick per day. Dashed dark-gray lines at 70 and 30 labelled "Overbought (70)" / "Oversold (30)", lighter dashed line at 50 labelled "Neutral (50)", all labels right-aligned above their lines. Subtle horizontal grid. HTML legend at the bottom: green line "RSI (14-period)", gray dashed swatches "Overbought zone (> 70)" and "Oversold zone (< 30)". All text readable.
      Data: single green (#009E73) RSI line, starting ~88, held above 70 through early March, falling through 50 to an oversold trough ~14 in late April, recovering above 70 by late May to ~93 and ending ~81.
