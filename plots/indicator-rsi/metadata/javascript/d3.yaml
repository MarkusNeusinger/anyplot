review:
  strengths:
  - Correct 14-period Wilder RSI calculation from a synthetic 120-day price series,
    fully deterministic via a fixed-seed LCG (no library RNG needed in the browser).
  - Overbought (70-100) and oversold (0-30) zones are shaded with distinct Imprint
    palette tints in addition to labeled dashed threshold lines at 30/70 and a dotted
    centerline at 50 -- covers every 'Notes' requirement from the spec (fixed 0-100
    y-axis, thresholds, optional centerline, lookback period noted in the subtitle).
  - 'First (and only) data series correctly renders in brand green #009E73, identical
    between light and dark renders; background, axis text, and tick chrome are correctly
    theme-adapted.'
  - 'Clean, idiomatic d3 usage: scaleTime/scaleLinear, a line generator with curveMonotoneX,
    tick-line removal, and the correct mount-node contract with no animation.'
  weaknesses:
  - 'The ''Centerline (50)'' label uses `t.grid` (the low-opacity rgba token meant
    for subtle gridlines, ~15% alpha) as its text fill. Measured contrast against
    the plot background is ~1.3:1 in both light and dark renders -- far below readable
    levels, effectively invisible at a glance. Fix: use `t.inkSoft` or `t.inkMuted`
    (a proper secondary-text token) for the centerline label''s fill instead of reusing
    the grid stroke color.'
  - 'Near the right edge of the chart, the RSI line''s terminal upswing crosses directly
    through the ''Oversold (30)'' label text (through the letters in ''Sold'') in
    both light and dark renders, because the label is fixed at x=iw-4 without checking
    whether the series'' final segment passes near y=30 there. Fix: either place threshold
    labels near the left edge (x~4) where the series has more headroom, or check the
    data''s proximity to each threshold near the label''s x position and nudge the
    label vertically (or horizontally) to avoid the collision.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 (sampled ~250,248,241).
      Chrome: Title "indicator-rsi · javascript · d3 · anyplot.ai" in bold dark ink, clearly visible. Subtitle "14-period RSI on a synthetic 120-day daily close series" in soft gray, readable. X-axis "Trading Date" and Y-axis "RSI" labels dark ink, readable; tick labels (0/30/50/70/100, Jul 01/Aug 01/Sep 01) soft gray, readable. "Overbought (70)" (red) and "Oversold (30)" (blue) threshold labels are high-contrast and readable. EXCEPTION: the "Centerline (50)" label is rendered in the same low-opacity rgba token used for gridlines -- measured contrast ratio against the background is ~1.3:1, so it is essentially invisible against the cream surface.
      Data: Single RSI line in brand green #009E73, 3px stroke, clearly distinguishable from the shaded overbought (light red-pink tint) and oversold (light blue-gray tint) zone backgrounds. Near the right edge, the line's terminal upswing crosses directly through the "Oversold (30)" label text.
      Legibility verdict: FAIL -- Centerline (50) label unreadable due to near-zero contrast; RSI line overlaps the Oversold (30) label near the right edge.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 (visually confirmed, no pure black).
      Chrome: Title, subtitle, axis labels, and tick labels all correctly flipped to light ink tones and remain fully readable -- no dark-on-dark failures on the primary chrome. "Overbought (70)" and "Oversold (30)" threshold labels remain high-contrast (red/blue against dark bg). Same "Centerline (50)" issue persists: still rendered with the grid rgba token, still effectively invisible against the near-black surface.
      Data: RSI line color is identical #009E73 green, confirming data-color parity between themes. The same overlap with "Oversold (30)" recurs since it's the same geometry independent of theme.
      Legibility verdict: FAIL -- same two issues as the light render (Centerline label contrast, Oversold label/line overlap); otherwise all primary chrome is theme-correct.
