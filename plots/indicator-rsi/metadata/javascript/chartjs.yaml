review:
  strengths:
  - Correct Wilder's smoothed 14-period RSI calculation, not a simplistic approximation
  - Custom Chart.js plugin (beforeDraw + scale.getPixelForValue) shades the overbought/oversold
    zones — genuine library-specific mastery, not a workaround
  - 'All spec requirements present: fixed 0-100 y-axis, 70/30 threshold lines, optional
    50 centerline, zone shading, lookback period noted in both title and legend'
  - Theme-adaptive chrome correctly threaded through title/axis/legend/grid tokens;
    data colors identical between light and dark renders
  - Synthetic price series produces multiple full excursions into both overbought
    (>90) and oversold (<20) territory, giving strong feature coverage of RSI behavior
  - Deterministic, reproducible data generation via a fixed-seed LCG (documented necessity
    since the browser has no seeded RNG)
  weaknesses:
  - The RSI line and the 'Oversold (30)' threshold line both use the exact same hex
    (#009E73), relying only on dash pattern/width to differentiate them — consider
    a different token (e.g. inkSoft/muted) for the oversold line so it doesn't visually
    merge with the primary series when RSI dips near 30
  - Overbought color '#AE3030' and its rgba(174,48,48,...) zone fill are hardcoded
    as raw literals in two places instead of derived once from t.palette[4] — correct
    value, but duplicated as magic constants
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "Daily RSI (14) · indicator-rsi · javascript · chartjs · anyplot.ai" in dark ink, fully visible and not clipped. Legend (RSI (14), Overbought (70), Oversold (30)) in dark-gray text below the title. X-axis "Trading Date" and Y-axis "RSI" titles and tick labels rendered in dark/gray ink — all clearly legible against the light background. Horizontal gridlines are subtle and don't compete with the data.
      Data: RSI line renders in brand green (#009E73), 3px, no point markers, smooth. Overbought zone (70-100) tinted with a light matte-red wash, oversold zone (0-30) tinted with a light green wash. Dashed red line at 70, dashed green line at 30 (same green as the data line, differentiated by dash pattern), dotted gray centerline at 50. The RSI line makes several full swings from below 20 up past 90, clearly crossing both threshold zones multiple times.
      Legibility verdict: PASS — no light-on-light text, no overlap between title/legend/axes.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Same title and legend content now rendered in light/off-white text, clearly readable against the dark background. Axis titles and tick labels are light-gray, no dark-on-dark failures observed anywhere (title, ticks, legend, axis titles all pass).
      Data: RSI line, overbought dashed line, oversold dashed line, and centerline are the identical hex values to the light render — only the zone-tint backgrounds and chrome (background/text/grid) adapt to the dark surface (zones become darker maroon/dark-green washes appropriate for the dark surface).
      Legibility verdict: PASS — all text is light-on-dark, brand green remains vivid and legible on the dark surface.
