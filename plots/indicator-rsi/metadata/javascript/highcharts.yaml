review:
  strengths:
  - Correct brand-green RSI line with threshold lines/zones and lookback period exactly
    per spec
  - Synthetic data genuinely breaches both overbought and oversold thresholds multiple
    times, exercising the full feature set
  - Clean, theme-adaptive chrome — fully legible in both light and dark renders with
    identical data color
  - Idiomatic use of Highcharts plotBands/plotLines for the classic RSI panel look
  weaknesses:
  - Design excellence is solid but stops at zone shading — no additional emphasis
    (e.g. series.zones to recolor the RSI line itself while in overbought/oversold
    territory, or callouts on the specific crossover points) to push visual storytelling
    further
  - Y-axis title "RSI" could optionally be more descriptive (e.g. "RSI (0–100)") though
    this is a very minor nit
  - Library mastery is generic beyond plotBands/plotLines — consider series.zones
    or dataLabels at key crossover points to differentiate the implementation further
