review:
  strengths:
  - Correct Wilder's smoothing RSI calculation, with three deliberately engineered
    price regimes (rally, selloff, choppy recovery) so the RSI visibly crosses both
    the 70 and 30 thresholds instead of hugging the middle band
  - 'Thoughtful semantic color use: overbought/oversold bands and threshold lines
    use palette red/blue with clear text labels rather than color alone, while the
    RSI line stays brand green (#009E73) as required for the first series'
  - 'Clean theme-adaptive chrome: identical data colors between light and dark renders,
    correct #FAF8F1 / #1A1A17 backgrounds, spines and grid handled consistently'
  - Idiomatic Makie usage — hspan! for reference zones, hlines! with distinct dash/dot
    styles for 70/30 vs. the 50 centerline, and text! for in-plot zone labels
  - Canvas lands exactly on the 3200x1800 landscape target with no clipping
  weaknesses:
  - Y-axis only labels 0/50/100 — the 30 and 70 threshold values (the most important
    numbers on an RSI chart) have no tick labels, so the viewer must infer them from
    the dashed reference lines alone; add minor ticks/labels at 30 and 70
  - Design is solid but conventional for the technique — a single line over two shaded
    bands. Consider a subtle fill under the RSI line itself (alpha-blended down to
    the axis or to the 50 centerline) to add visual hierarchy beyond the flat background
    zones
  - '''Overbought''/''Oversold'' zone annotations are fixed at the left edge (x[1])
    regardless of where the RSI line actually sits early on — in the light/dark renders
    they happen to clear the line, but the positioning is not data-aware and could
    collide with the line for other random seeds/regimes'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white, not dark.
      Chrome: Bold dark title "indicator-rsi · julia · makie · anyplot.ai" centered at top; dark-ink "Trading Date" x-axis label and rotated "RSI (14-period)" y-axis label; soft-grey rotated date tick labels (Mar 22 ... Sep 6); y-axis ticks only at 0/50/100. Top/right spines removed, left/bottom spines soft grey. All chrome text is clearly legible against the light background.
      Data: RSI line in brand green (#009E73), 3px wide, continuous across ~126 trading periods, visibly swinging from the overbought zone (>70) down through a selloff into the oversold zone (<30) and back up into a choppy recovery near 50. A light rose-tinted band shades 70-100 ("Overbought" label, grey text, top-left) and a light grey band shades 0-30 ("Oversold" label, grey text, bottom-left). Dashed grey lines mark 70 and 30; a dotted line marks the 50 centerline.
      Legibility verdict: PASS — all text (title, axis labels, tick labels, zone annotations) is clearly readable against the warm off-white background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black, not light.
      Chrome: Same layout as light — white/light-ink title, x/y axis labels in light ink, light-grey rotated date tick labels, y-axis ticks at 0/50/100 only, spines flipped to light grey. No dark-on-dark failures: all text has strong contrast against the near-black surface.
      Data: RSI line is the identical brand green (#009E73) as the light render — confirmed unchanged. Overbought band shades to a dark maroon tint, oversold band to a dark blue-grey tint (chrome-only flip, same hue family as light version's tints). Dashed/dotted threshold lines rendered in light grey/white, clearly visible against the dark background. "Overbought"/"Oversold" annotations in light grey, readable.
      Legibility verdict: PASS — title, axis labels, tick labels, and zone annotations are all legible; no black-on-black or otherwise unreadable text found.
