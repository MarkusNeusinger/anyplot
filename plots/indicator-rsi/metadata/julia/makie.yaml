review:
  strengths:
  - 'Semantic color use for the reference zones is exemplary: the overbought band
    uses matte red (reversal risk) and the oversold band uses blue (opportunity),
    each explicitly labeled ''Overbought''/''Oversold'' so the semantic-exception
    mapping required by the style guide is unambiguous.'
  - 'Data-aware annotation placement: the label positions are computed from the point
    of greatest vertical clearance within the opening window (argmin/argmax over early_window)
    rather than a fixed coordinate, so the labels never collide with the RSI line
    regardless of the random seed''s path.'
  - 'Full spec feature coverage in one pass: dashed 30/70 threshold lines, dotted
    50 centerline, alpha-blended band! fill from the centerline to the RSI line (reinforcing
    distance-from-neutral at a glance), and a three-regime synthetic price series
    (rally / selloff / choppy recovery) that visibly drives RSI through both extremes.'
  - 'Theme-adaptive chrome is fully correct in both renders: warm off-white / near-black
    backgrounds, all text legible in both themes, brand green (#009E73) identical
    across light and dark, no dark-on-dark or light-on-light failures.'
  - Idiomatic, high-level CairoMakie usage (Axis, hspan!, hlines!, band!, lines!,
    text!) in a single file that branches cleanly on ANYPLOT_THEME.
  weaknesses:
  - Y-axis tick labels for the 30/70 thresholds read a bit less prominent than 0/50/100
    since they sit right at the shaded-zone boundary; a touch more contrast (or nudging
    them fully into INK rather than INK_SOFT) would reinforce the reference lines.
  - The mandated title is short for this spec-id ('indicator-rsi · julia · makie ·
    anyplot.ai' ≈ 43 chars) and currently occupies well under 50% of the plot width
    at titlesize=20 — a modest bump (22-24) would balance it better against the wide
    3200 px canvas without risking overflow.
  - band!/hspan! are nice touches but conceptually mirror fill_between/axhspan available
    in most plotting libraries; leaning on a more Makie-distinctive composition (e.g.
    Colorbar/Legend layering) would push Library Mastery further.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Title "indicator-rsi · julia · makie · anyplot.ai" is bold dark text, clearly visible; "Trading Date" (x) and "RSI (14-period)" (y) axis labels dark and readable; rotated date tick labels (Mar 22 ... Sep 6) and y tick labels (0, 30, 50, 70, 100) render in a soft gray that is legible against the cream background and against the pale zone tints. Only left/bottom spines are kept (top/right removed).
      Data: RSI line is brand green (#009E73), linewidth 3, clearly visible across the full 0-100 range. Overbought zone (70-100) is tinted pale matte-red, oversold zone (0-30) is tinted pale blue, each labeled "Overbought"/"Oversold" in soft gray text placed away from the line. A dashed line marks 70/30, a dotted line marks the 50 centerline, and a subtle green band fills between the centerline and the RSI line.
      Legibility verdict: PASS — no light-on-light issues, no overlap between text and data.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Title and axis labels render in light cream/off-white, clearly visible; tick labels and zone-annotation text render in a lighter soft gray, fully legible against both the dark background and the darker-tinted zones. Spines and grid flipped to light-on-dark equivalents (dashed/dotted lines white-ish, y-grid at ~15% opacity).
      Data: RSI line is the identical brand green (#009E73) as the light render — confirmed unchanged. Overbought zone now reads as a dark maroon tint, oversold zone as a dark navy tint, both distinguishable from the near-black page background without clashing.
      Legibility verdict: PASS — no dark-on-dark failures; all text and both zone tints remain distinguishable from the #1A1A17 surface.
