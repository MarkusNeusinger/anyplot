review:
  strengths:
  - 'Spec-faithful raincloud layout in both renders: translucent half-violin cloud
    rising above each baseline, box with whiskers and a heavy median stroke centred
    on it, and a narrow translucent rain band below — the metaphor is unambiguous.'
  - 'Categories sorted by median, fastest at the bottom and the slow Baseline at the
    top, while PALETTE_BY_CAT keeps each category''s Imprint color stable (Baseline
    = #009E73).'
  - 'Theme tokens threaded through every element: PAGE_BG, INK, INK_SOFT and ELEVATED_BG
    (box fill) flip cleanly; no contrast failure in either render.'
  - Realistic A/B page-load data with four distinct shapes — right-skewed control,
    bimodal cache hit/miss, tight, heavy right tail — so the clouds show what a box
    plot would hide.
  weaknesses:
  - 'CQ-04 (code): lines 105–112 write out a Gaussian KDE with Silverman bandwidth
    on a 256-point grid (8 lines) → `violin!(ax, fill(baseline + cloud_gap, n), vals;
    orientation = :horizontal, side = :right, scale = :width, width = 2 * cloud_height,
    npoints = 256)` (Makie), whose KernelDensity default bandwidth is the same Silverman
    rule. Likely cause: the cloud built from band! over a hand-computed density.'
  - 'Suggestion: each cloud ends in a small vertical step at both grid edges because
    the density is still above zero there; a slightly wider padding would let the
    tails taper to the baseline.'
  - 'Suggestion: Makie''s `rainclouds!` recipe would show the library''s own raincloud
    support.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the full 3200x1800 canvas — not pure white.
      Chrome: bold dark title "raincloud-basic · julia · makie · anyplot.ai" centred at top; x-axis label "Page Load Time (ms)" and ticks 200–1000 in dark/soft ink; y tick labels Baseline, Variant C, Variant B, Variant A (top to bottom) in dark ink; subtle vertical x grid only; bottom spine only. All text clearly readable.
      Data: four rainclouds — Baseline #009E73 green (top), Variant C ochre #BD8233, Variant B blue #4467A3, Variant A lavender #C475FD (bimodal, bottom). Each cloud is a translucent filled half violin with a solid outline rising above the baseline; a near-white box with whiskers/caps and a dark median line sits on the baseline; translucent jittered rain points form a narrow band below. First series is #009E73.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17 — not pure black.
