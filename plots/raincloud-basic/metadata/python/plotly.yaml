review:
  strengths:
  - 'Correct horizontal raincloud: go.Violin(side=''positive'', orientation=''h'')
    cloud above each baseline, go.Box with median and quartiles on the baseline, jittered
    rain below; the cloud-and-rain metaphor reads at once'
  - Imprint palette in canonical order with Control in brand green; chrome flips cleanly
    between themes while data colors stay identical
  - Example data shows unimodal, wide and bimodal shapes, so Treatment B's two modes
    are visible in the cloud while its box hides them
  - HTML export adds a range slider and per-row hover templates for interactive inspection
  - spanmode='hard' ends each cloud at its data extremes, so no cloud runs past the
    axis range
  weaknesses:
  - 'Suggestion: a slightly thicker median line inside each box would make the median
    easier to pick out against the tinted outline.'
