      Data: four rows (Control #009E73, Treatment A #C475FD, Treatment B #4467A3, Treatment C #BD8233), each with a translucent half-violin rising above the baseline, a box with category-colored outline over an off-white fill on the baseline, and a narrow band of translucent jittered points below. Treatment B's cloud is clearly bimodal. The Control, Treatment B and Treatment C clouds are cut at the right plot edge (~672 ms) and Treatment C's at the left edge (~115 ms). No legend.
