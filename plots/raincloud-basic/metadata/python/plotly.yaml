review:
  strengths:
  - 'Correct horizontal raincloud: half-violin rising above each baseline via go.Violin(side=''positive'',
    orientation=''h''), box with median and quartiles on the baseline, jittered rain
    below — the cloud-and-rain metaphor reads at once'
  - Imprint palette in canonical order with Control in brand green; chrome flips cleanly
    between themes while data colors stay identical
  - Example data shows unimodal, wide and bimodal shapes, so Treatment B's two modes
    are visible in the cloud while its box hides them
  - HTML export adds a range slider and per-row hover templates for interactive inspection
  weaknesses:
  - 'SC-03 (both): the cloud KDE tails of Control, Treatment B and Treatment C run
    past the right plot edge at about 672 ms and Treatment C''s past the left edge
    at about 115 ms, so the clouds are cut off mid-tail → the whole cloud inside the
    axis range (x range wide enough for the violin span, or the violin span limited
    to the data). Likely cause: x range from the data min/max ±5 % while go.Violin''s
    default spanmode=''soft'' extends the KDE beyond the data.'
  - 'Suggestion: a slightly thicker median line inside each box would make the median
    easier to pick out against the tinted outline.'
  image_description: |-
