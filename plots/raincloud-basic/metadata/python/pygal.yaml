      Data: three rows, Control #009E73 (bottom), Treatment A #C475FD, Treatment B #4467A3 (top). Each row: translucent half-violin above the baseline, hollow cream box with coloured outline and thick median on the baseline, thin whisker line, opaque 22 px rain dots below. A thin second median tick protrudes above each box next to the thick median.
