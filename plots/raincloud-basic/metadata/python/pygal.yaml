review:
  strengths:
  - 'Correct raincloud geometry in both renders: each half-violin rises from its baseline
    with a flat edge, the box with quartile edges and a single thick median sits on
    the baseline, and the rain falls below, clear of the neighbouring rows'
  - All injected layers use pygal's own data-to-pixel mapping, read back from the
    rain circles it rendered, so whisker, cloud baseline and box line up exactly
  - Rain at fill-opacity 0.6 and radius 15 through pygal's css option, so dense regions
    read as density rather than solid bands
  - 'Imprint palette identical across themes: Control #009E73, Treatment A #C475FD,
    Treatment B #4467A3; chrome flips cleanly and the box interior adapts (#2E2E29
    on dark)'
  - 'Every rain point is a pygal value dict with a label, giving native hover tooltips
    (''Control: 450 ms'') in the HTML output'
  weaknesses:
  - 'Suggestion: draw the clouds as filled pygal XY series instead of injected polygons,
    so they get native tooltips without the circle read-back.'
