review:
  strengths:
  - 'Correct raincloud geometry in both renders: each half-violin rises from its baseline
    with a flat edge, the box sits on the baseline with median and quartiles, and
    the rain falls below, clear of the neighbouring rows'
  - 'Imprint palette identical across themes: Control #009E73, Treatment A #C475FD,
    Treatment B #4467A3; chrome flips cleanly'
  - Cloud outline stroked only along the curved top, so no closure line runs along
    the baseline; the box interior adapts to the theme (#2E2E29 on dark)
  - 'Every rain point is a pygal value dict with a label, giving native hover tooltips
    (''Control: 450 ms'') in the HTML output'
  - Realistic, neutral reaction-time data with different centres and spreads and points
    beyond the whiskers
  weaknesses:
  - 'SC-02, VQ-03 (both): the rain points are fully opaque 22 px dots (no fill-opacity),
    so the 90 points per group merge into solid bands where values are dense → alpha
    0.5-0.7 as the Notes require (about -0.4) and a radius near 14-16 px (about -7
    px). Likely cause: chart.add(..., dots_size=22) with no opacity in the Style (opacity
    / opacity_hover) or on the dots.'
  - 'SC-03 (both): the injected clouds, boxes and median rules use their own to_svg
    mapping, which ignores pygal''s range padding, so they sit about 10 px (~2 ms)
    right of and about 12 px below pygal''s own coordinates; this shows as a second
    thin median tick from the pygal series beside and above each thick median → one
    mapping for all layers (read pygal''s scale, or draw the layers as pygal series).
    Likely cause: x_scale/x_offset/y_offset built from the plot rect alone (lines
    201-213).'
  - 'VQ-05 (both): an empty band of about 350 px sits between the rotated y-axis title
    and the category labels, so the plot starts at about a quarter of the width →
    trim the left margin by about 250 px. Likely cause: margin_left=340 added on top
    of pygal''s own label space.'
  - 'CQ-01 (code): line 211 defines a helper function to_svg → compute the mapped
    coordinates inline with vectorised numpy expressions. Likely cause: helper used
    for cloud and box mapping.'
  - 'CQ-04 (code): lines 123-134 write out a Silverman bandwidth and a Gaussian sum
    loop → `scipy.stats.gaussian_kde(values, bw_method=bandwidth / values.std(ddof=1))(x_kde)`
    (scipy); lines 117 and 165 fill a medians dict that is never read → remove; lines
    172-180 add a pygal median series that duplicates the injected median line → remove
    one. Likely cause: leftovers from an earlier layering approach.'
  - 'Suggestion: draw the clouds as filled pygal XY series instead of injected polygons,
    so they share pygal''s mapping and get native tooltips.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across page and plot area.
