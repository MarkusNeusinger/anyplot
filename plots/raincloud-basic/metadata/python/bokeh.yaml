review:
  strengths:
  - 'Textbook horizontal raincloud: half-violin cloud rising from each baseline, box
    with series-colored median centered on it, translucent rain below — the metaphor
    reads instantly in both themes'
  - Theme tokens (INK, INK_SOFT, BOX_FILL, GRID_ALPHA) thread through every chrome
    element; no dark-on-dark or light-on-light text
  - 'Imprint palette in canonical order with Control as #009E73; data colors identical
    across light and dark'
  - x range derived from the data with padding, so every cloud tail and outlier sits
    inside the plot
  - Bimodal Treatment B gives the cloud something a box plot alone would hide
  - HoverTool restricted to the rain renderers exposes value plus per-group mean,
    median, std and n in the HTML artifact
  - 'Adaptable layout: GROUP/VALUE constants, tidy df, categories taken from the data'
  weaknesses:
  - 'CQ-04 (code): the Gaussian KDE is written out as a per-point loop with Silverman
    bandwidth (lines 104-112) → scipy.stats.gaussian_kde(values, bw_method=''silverman'')(x_kde).
    Likely cause: hand-rolled density instead of the available SciPy call.'
  - 'Suggestion: start the rain jitter below the box''s lower edge (e.g. -0.40 to
    -0.13) so no rain point is drawn inside the box.'
  - 'Suggestion: bokeh''s Whisker annotation or quad/hbar glyphs could express the
    box plot more idiomatically than raw line/patch calls.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, not pure white.
      Chrome: bold dark title "raincloud-basic · python · bokeh · anyplot.ai" top-left; italic dark axis titles "Reaction time (ms)" (x) and "Treatment group" (y); INK_SOFT tick labels 200-600 and the four category names; subtle vertical-only grid. All readable.
      Data: four rows bottom to top — Control (#009E73), Treatment A (#C475FD), Treatment B (#4467A3, visibly two-humped), Treatment C (#BD8233). Each: translucent half-violin above the baseline with flat edge on it, cream box with ink border and whisker caps plus a thick series-colored median line centered on the baseline, and translucent rain points in a band below. All cloud tails and outliers (≈157 ms in C, ≈633 ms in B) lie inside the plot.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17, not pure black.
