review:
  strengths:
  - 'Clean raincloud anatomy in both themes: half-violin clouds above each baseline,
    an elevated-fill IQR box with a red median tick on it, translucent rain in a narrow
    band below'
  - Cloud computed natively with transform_density + transform_calculate; category
    labels placed on the numeric baselines with labelExpr
  - Mandated autosize fit fills the 3200x1800 canvas with balanced margins
  - Data with a unimodal, a skewed and a bimodal group shows exactly why a raincloud
    beats a box plot (Treatment B's box hides two modes the cloud reveals)
  - Tooltips on cloud and rain plus pan/zoom in the interactive HTML
  weaknesses:
  - 'SC-03 (both): every cloud ends in a vertical cut at the x-domain edges (Control
    still about a third of its peak height at 580 ms, Treatment A and B visibly sliced
    at 270 and 580 ms), so the reader cannot see where the density tails off → let
    each cloud taper to near zero inside the axis. Likely cause: transform_density(extent=x_domain)
    with the x scale domain set to the same range; widen the domain beyond the extent
    or narrow the bandwidth.'
  - 'Suggestion: a slightly narrower KDE bandwidth (transform_density bandwidth=)
    would make Treatment B''s two modes stand apart more sharply.'
  - 'Suggestion: an alt.selection_point bound to the condition could fade the other
    groups in the HTML view.'
