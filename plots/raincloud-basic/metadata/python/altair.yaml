review:
  strengths:
  - 'Clean raincloud anatomy in both themes: half-violin clouds above each baseline,
    an elevated-fill IQR box with a median tick, translucent rain in a narrow band
    below'
  - Every cloud now tapers to near zero inside the axis, so the tails of all three
    distributions are visible
  - Cloud computed natively with transform_density + transform_calculate; category
    labels placed on the numeric baselines with labelExpr
  - Data with a unimodal, a skewed and a bimodal group shows why a raincloud beats
    a box plot (Treatment B's box hides two modes the cloud reveals)
  - Tooltips on cloud and rain plus pan/zoom in the interactive HTML
  weaknesses:
  - 'Suggestion: the 3-SD axis padding leaves the 160-240 ms and 600-640 ms stretches
    carrying only the flat cloud foot; about 2.5 SD would still let every cloud taper
    inside the axis with more width for the data.'
  - 'Suggestion: the constant +0.04 lift on the cloud draws a thin colored ribbon
    across the full axis width; starting the area at the baseline itself would let
    the clouds fade out completely.'
