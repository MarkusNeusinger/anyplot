review:
  strengths:
  - geom_violin(show_half=1) gives lets-plot's native half violin, nudged above the
    baseline with position_nudge, so cloud, box and rain each sit in their own band
  - 'Treatment B''s bimodal data shows the raincloud''s point: the wide box hides
    two clusters that cloud and rain reveal'
  - Theme tokens threaded through every chrome element; both renders fully legible
    with identical Imprint data colors
  - x limits derived from the data range with a padding for the untrimmed KDE tails,
    so every cloud tapers out inside the axis
  weaknesses:
  - 'Suggestion: a tooltip spec on the rain layer would make individual reaction times
    readable in the HTML view.'
