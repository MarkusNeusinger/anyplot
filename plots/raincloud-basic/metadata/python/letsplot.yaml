  weaknesses:
  - 'SC-03 (both): Treatment B''s cloud is cut off with a vertical edge at the x-limit
    200, where its density is still clearly above zero → lower limit about 30 ms further
    out so the whole tail shows (≈ −30 ms). Likely cause: x_low = floor(min/50)*50
    − 50 with geom_violin(trim=False), whose KDE tail extends further than one 50
    ms step.'
  - 'Suggestion: a subtle tooltip spec on the rain layer would make individual reaction
    times readable in the HTML view.'
