review:
  strengths:
  - 'Correct raincloud semantics: half-violin cloud rises above the category baseline,
    the quartile box + whiskers sit centered on the baseline, and jittered rain falls
    below it — matches the spec''s cloud/box/rain relationship exactly in both renders.'
  - 'Statistically sound construction: per-category KDE with a Silverman bandwidth,
    Tukey 1.5×IQR whisker fencing, and deterministic LCG-seeded Box-Muller normal
    sampling (seed=42).'
  - Correct Imprint palette usage (brand green first, canonical lavender/blue/ochre
    order) and consistent theme-adaptive chrome across both renders — no dark-on-dark
    or light-on-light failures.
  - Rain-point markers are now a legible 4px radius with 0.6 alpha, appropriately
    sized for the ~110-130 points per category without excessive overplotting.
  - The standout category (Texting, highest median reaction time) now gets a bold
    ink-colored y-axis label, giving the chart a clear focal point without touching
    the Imprint data colors.
  - Idiomatic Chart.js workaround for a plot type the library has no native support
    for — floating horizontal bar for the IQR box plus a custom afterDatasetsDraw
    plugin for the cloud/rain/whiskers.
  weaknesses:
  - The 'Texting' category's KDE tail runs close to the right axis boundary (x=780)
    without fully tapering to zero before the chart edge, unlike the other three categories
    — widen evalMax's margin or clamp/taper the tail so it visibly returns to baseline
    before the axis limit.
  - 'Design Excellence is still mostly default: no custom typography, minimal color
    treatment beyond the required palette, and DE-01/DE-02 remain in the mid-range
    — further polish (e.g. subtle background banding per row, refined spine/frame
    treatment) would push this toward top-tier.'
  - Helper functions (lcg, randNormal, quantile, stdDev, kde) deviate from the strict
    KISS 'no functions' ideal — acceptable here since the raincloud's KDE/quantile
    math has no built-in equivalent in Chart.js, but keep an eye on further growth
    in the plugin's complexity.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Bold dark title "raincloud-basic · javascript · chartjs · anyplot.ai" at top; dark x-axis title "Reaction Time (ms)" and y-axis title "Distraction Condition"; dark x tick labels (220-780) and y category labels (No Distraction, Phone Call, Texting, Passenger Talk) — all clearly legible. "Texting" label is bold/ink-colored to flag it as the standout (highest-median) category.
      Data: Four rows, each showing a half-violin "cloud" rising above the category baseline, a colored IQR box with whiskers and a light median line centered on the baseline, and jittered "rain" points (4px, alpha 0.6) falling below the baseline. First category (No Distraction) uses brand green #009E73; the rest follow canonical Imprint order — lavender (Phone Call), blue (Texting), ochre (Passenger Talk).
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Title, axis titles, and tick labels have all flipped to light/white text and remain clearly legible — no dark-on-dark failures observed anywhere. "Texting" label remains bold/highlighted.
      Data: Cloud/box/rain colors are identical to the light render (brand green, lavender, blue, ochre) — only chrome (background, ink, grid) flipped, confirming data-color consistency across themes. The median line inside each box remains visible as a dark line against the lighter box fill, mirroring the light render's white-on-color convention.
      Legibility verdict: PASS
