review:
  strengths:
  - 'Correct raincloud semantics: half-violin cloud rises above the category baseline,
    the quartile box + whiskers sit centered on the baseline, and jittered rain falls
    below it — matches the spec''s cloud/box/rain relationship exactly in both renders.'
  - 'Statistically sound construction: per-category KDE with a Silverman bandwidth,
    Tukey 1.5*IQR whisker fencing, and deterministic LCG-seeded Box-Muller normal
    sampling (seed=42).'
  - Correct Imprint palette usage — brand green first, canonical hue order (green/lavender/blue/ochre)
    — and consistent theme-adaptive chrome (ink, grid, page background) across both
    light and dark renders.
  - 'Clean, legible layout: explicit font sizes on every text element, generous whitespace,
    y-axis grid disabled to reduce clutter, no clipping or cross-row overlap.'
  - 'Idiomatic Chart.js workaround for a plot type the library has no native support
    for: a floating horizontal bar dataset for the IQR box plus an `afterDatasetsDraw`
    custom plugin for the cloud/rain/whiskers — exactly the ''no external library
    shortcuts'' approach the library rules call for.'
  weaknesses:
  - Rain-point marker radius (3.2px) is on the small side; slightly larger markers
    would improve legibility when the preview is scaled down (e.g. the ~400px mobile
    thumbnail).
  - No visual emphasis or annotation calls out the standout finding (Texting's markedly
    wider, right-shifted distribution) — a subtle highlight would strengthen the data
    storytelling.
  - Row spacing between the Texting and Passenger Talk bands is comparatively tight
    (small gap between Texting's rain and Passenger Talk's cloud) — not currently
    overlapping, but leaves little margin for a future repair pass that increases
    marker size or font size.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "raincloud-basic · javascript · chartjs · anyplot.ai" is bold, dark, and clearly visible at top. X-axis title "Reaction Time (ms)" and y-axis title "Distraction Condition" are dark and legible. X tick labels (220-780) and y category labels (No Distraction, Phone Call, Texting, Passenger Talk) are all clearly readable in dark ink against the light background. Subtle vertical gridlines only on the x-axis.
      Data: Four rows, each showing a half-violin "cloud" rising above the category baseline, a colored IQR box with whiskers and a light median line centered on the baseline, and jittered "rain" points falling below the baseline. First category (No Distraction) uses brand green #009E73; subsequent categories use lavender, blue, and ochre in canonical Imprint order. All rain points and cloud shapes render at visibly consistent alpha, clearly distinguishable from the background and from each other.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Title, axis titles, and tick labels have all flipped to light/white text and remain clearly legible against the dark background. No dark-on-dark text observed anywhere (title, axis titles, tick labels, category labels all pass).
      Data: Same four rows in the same layout; cloud, box, and rain colors are visually identical to the light render (brand green, lavender, blue, ochre) — only the chrome (background, ink, grid) has flipped. The median line inside each box remains visible as a dark line against the lighter box fill.
      Legibility verdict: PASS
