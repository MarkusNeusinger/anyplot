review:
  strengths:
  - 'Correctly implements the tricky orientation rule: the cloud (half-violin) rises
    above each category baseline, the box sits centered on it, and rain falls below
    — exactly matching the spec''s up/down metaphor, a detail many implementations
    get backwards'
  - Clever custom SVG rendering (chart.renderer paths/rects driven by axis.toPixels)
    reimplements a box plot from scratch since Highcharts' native boxplot type lives
    in the forbidden highcharts-more module — genuine library-specific technique,
    not a generic workaround
  - 'Imprint palette applied correctly and identically across both themes; first category
    (Placebo) uses brand green #009E73, remaining groups follow canonical order'
  - Theme-adaptive chrome is fully correct in both light and dark renders — warm off-white/near-black
    backgrounds, all text readable, no dark-on-dark or light-on-light failures
  - 'Clean, dependency-free, deterministic code: seeded LCG RNG plus a from-scratch
    Gaussian KDE for the cloud density, no external packages'
  weaknesses:
  - In the densest reaction-time band (~375-450ms) the jittered rain points overlap
    heavily even at opacity 0.6, blurring into a solid blob rather than staying distinguishable
    as individual observations — reduce marker radius slightly or narrow the jitter
    band to relieve crowding at n=140 per group
  - All four groups are unimodal Gaussians differing only in mean/spread; none shows
    a skewed or multimodal shape or clear outliers beyond the whisker fences, so the
    raincloud's core advantage over a plain boxplot (revealing distribution shape)
    isn't fully demonstrated — vary one group's shape or inject a few genuine outliers
  - Design is polished but stays close to a standard raincloud template — could push
    further with a stronger visual emphasis on the dose-response comparison (e.g.
    highlighting the clearest shift) to sharpen the data story
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Title "raincloud-basic · javascript · highcharts · anyplot.ai" in bold dark ink, clearly readable. X-axis title "Reaction Time (ms)" and tick labels (150-575 range) in soft dark gray, all legible. Y-axis category labels (Placebo, Low Dose, Medium Dose, High Dose) readable at left, each with a short tick dash.
      Data: Four horizontal rows (bottom to top: Placebo, Low Dose, Medium Dose, High Dose). Each row shows a half-violin "cloud" rising above the category baseline, a rectangular box (median line + Q1/Q3 edges, whisker caps) centered on the baseline, and jittered "rain" scatter points below the baseline. First series (Placebo) renders in brand green #009E73; other groups use lavender, blue, and ochre from the Imprint palette, matching canonical order.
      Legibility verdict: PASS — no light-on-light text, all chrome and data clearly visible.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Title, axis title, and tick labels all render in light/off-white tones, clearly legible against the dark surface. Y-axis category labels equally readable. Whisker/median lines use a light soft-gray stroke, visible against the dark background.
      Data: Same layout as the light render — cloud above baseline, box on baseline, rain below. Colors are identical to the light render (green, lavender, blue, ochre) — only the chrome (background, text, grid, box fill) flipped.
      Legibility verdict: PASS — no dark-on-dark failures; every text element is clearly visible against #1A1A17.
