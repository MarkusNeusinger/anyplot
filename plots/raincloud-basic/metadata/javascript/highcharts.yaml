review:
  strengths:
  - Correctly implements the cloud-above / box-on-baseline / rain-below visual metaphor
    exactly as specified, with clean visible gaps between the three layers
  - 'Creative workaround for Highcharts'' missing boxplot/violin modules: draws a
    bespoke half-violin (KDE via an area series) and a fully custom box plot via chart.renderer
    tied to axis.toPixels(), rather than faking or skipping the feature'
  - 'Rich, realistic data: a bimodal High Dose distribution (non-responder mixture)
    and reaction-time outliers in the Placebo group accurately represent real experimental
    phenomena'
  - 'Palette and theme chrome are fully compliant: first series is brand green, canonical
    Imprint ordering across categories, identical data colors between light/dark,
    correct backgrounds, and legible theme-adaptive text throughout'
  - Title, axis titles, and category labels are explicit, appropriately sized, and
    free of overlap or clipping in both renders
  weaknesses:
  - Rain-point markers (radius 2.5) are on the small side for ~140 points per category;
    slightly larger (e.g. ~3.5) would improve visibility, especially at mobile scale,
    without introducing overplotting
  - Several helper functions (quantile, gaussianKde, drawBoxPlots) push the code past
    a strict KISS/no-functions structure -- understandable given the statistical requirements
    of a raincloud plot, but the code could be flattened somewhat
  - The manual box-plot drawing via chart.renderer + toPixels(), while a solid workaround
    for the missing boxplot module, is a fairly generic SVG-drawing pattern that's
    replicable in other libraries -- it doesn't showcase something uniquely tied to
    Highcharts beyond the renderer API itself
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1), not pure white, not dark.
      Chrome: Title "raincloud-basic · javascript · highcharts · anyplot.ai" in bold dark ink at top, clearly readable. X-axis title "Reaction Time (ms)" and tick labels (100-650) in soft dark gray, all legible. Y-axis shows four category labels (High Dose, Medium Dose, Low Dose, Placebo, top to bottom) in soft dark gray, fully readable with no overlap. No grid lines visible; axis lines and tick marks are subtle soft-ink strokes.
      Data: Four rows, each with a half-violin "cloud" rising above the category baseline, a box (with median line and whiskers) centered on the baseline, and jittered "rain" scatter points below the baseline. Colors follow Imprint canonical order: Placebo (bottom) = brand green #009E73, Low Dose = lavender, Medium Dose = blue, High Dose (top) = ochre. High Dose shows a visibly bimodal cloud (secondary bump) and Placebo shows scattered outlier points beyond the whiskers -- both intentional, realistic features.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17), not pure black, not light.
      Chrome: Title, axis title, and tick labels render in light ink (near-white/light-gray) against the dark background -- fully readable, no dark-on-dark issues. Category labels on the y-axis are equally legible in light gray. Whisker/cap lines use the theme-adaptive ink-soft token, appearing light gray against the dark background so they remain visible.
      Data: Confirmed identical to the light render -- brand green for Placebo, lavender for Low Dose, blue for Medium Dose, ochre for High Dose. Only the chrome (background, text, axis/tick colors) flipped; the box outlines, median lines, cloud fills, and rain point colors are unchanged.
      Legibility verdict: PASS
