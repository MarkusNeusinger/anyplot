review:
  strengths:
  - 'Correct horizontal raincloud geometry: half-violin cloud rises above each category
    baseline, boxplot sits centered on the baseline, and jittered rain falls below
    it — matches the spec''s cloud/box/rain layout precisely'
  - Half-violin is genuinely clipped to the upper half via a custom `renderItem` polygon
    (not a full violin hidden with a mask), built from a hand-rolled Gaussian KDE
  - Whisker caps, a contrasting page-background-colored median line, and careful z-ordering
    (cloud z=2, box z=3, rain z=4) add real polish beyond a basic boxplot
  - 'Full Imprint palette compliance: first series is #009E73, remaining 4 categories
    follow canonical order 2-5, and chrome (background, text, grid) is theme-correct
    in both renders'
  - Deterministic seeded LCG data with a deliberate bimodal 'Medium Dose' mixture
    that demonstrates exactly why raincloud plots exist (a boxplot alone would hide
    that shape)
  - 'Reaction-time dose-response curve is physiologically plausible (inverted-U: moderate
    caffeine speeds reactions, very high dose slows them again via overstimulation)'
  - 'No wasted legend: category identity is already carried by the y-axis labels and
    color, so omitting a redundant legend is the right call'
  - Uses ECharts' `custom` series + `renderItem`/`api.coord`, a technique that is
    genuinely hard to replicate as cleanly in other JS charting libraries
  weaknesses:
  - Title occupies only ~30% of plot width at fontSize 22 — legible and correctly
    formatted, but on the low end of the ~50-70% guideline for a non-mandated-prefix
    title; could grow slightly for stronger hierarchy
  - Rain points in the densest rows (Medium Dose, Placebo) show some marker clumping
    in the middle of the jitter band — a touch more jitter width or slightly lower
    opacity would separate them further
  - The bimodal shape in Medium Dose (the key argument for using a raincloud plot
    over a boxplot) is left for the viewer to notice unaided — no callout/annotation
    highlights it
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matching #FAF8F1 — not pure white.
      Chrome: Title "raincloud-basic · javascript · echarts · anyplot.ai" centered in dark ink text; x-axis title "Reaction Time (ms)" and tick labels (300-700) in soft dark gray; y-axis category labels (Placebo, Low Dose, Medium Dose, High Dose, Very High Dose) in soft dark gray. All fully readable against the light background. Subtle vertical grid lines only.
      Data: Five rows, each with a half-violin cloud rising above its baseline, a boxplot with white median line centered on the baseline, and jittered rain points below. Colors follow the Imprint palette in canonical order: Placebo = #009E73 (brand green), Low Dose = lavender, Medium Dose = blue, High Dose = ochre, Very High Dose = matte red. Medium Dose's cloud is visibly two-humped (bimodal), and High Dose shows a similar double-peak shape.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, matching #1A1A17 — not pure black.
      Chrome: Same title, axis title, tick labels, and category labels now rendered in light/off-white tones, fully legible against the dark background. No dark-on-dark text anywhere. Grid lines still subtle and visible.
      Data: Colors are pixel-identical to the light render (same green/lavender/blue/ochre/red sequence) — only the chrome (background, text, grid) flipped. Cloud/box/rain layout and bimodal Medium Dose shape are unchanged.
      Legibility verdict: PASS
