review:
  strengths:
  - 'Correct raincloud composite: half-violin clipped to the upper half, box centered
    on the baseline, rain strictly below — exactly matching the required horizontal
    cloud-above/box-on/rain-below layout.'
  - New subtle vertical gridlines (15%-opacity ink, aligned with x-axis ticks) directly
    address the attempt-1 feedback and noticeably improve cross-category value comparison
    without adding clutter.
  - Deterministic seeded LCG data with a genuinely bimodal 50 mg-dose group (fast
    responders vs. non-responders) that demonstrates exactly what a raincloud plot
    is for.
  - Correct Imprint palette order (green, lavender, blue, ochre) and correct theme-adaptive
    chrome, verified consistent across both renders.
  - No edge clipping anywhere; canvas dimension gate passed.
  - Uses MUI X's documented composition API (useXScale/useYScale/useDrawingArea) —
    the library-sanctioned approach for a chart type the community package has no
    built-in support for.
  weaknesses:
  - Still doesn't showcase distinctive MUI X features beyond the scale/composition
    hooks (e.g. no tooltip or legend customization in the interactive HTML output)
    — acceptable but leaves Library Mastery capped.
  - Y-axis has no descriptive axis title (categories are self-explanatory, so this
    is minor).
  - Statistical helper code (quantile/boxStats/kde/gaussianSample) adds real complexity
    to an otherwise KISS-structured file, though justified by the lack of a browser
    stats library.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Bold dark title "raincloud-basic · javascript · muix · anyplot.ai" centered at top. X-axis labeled "Reaction Time (ms)" with dark tick labels every 20 ms from 280-660. New subtle vertical gridlines (light grey, ~15% opacity) now run the full plot height aligned with the x-axis ticks. Four horizontal category rows (Placebo, 10 mg Dose, 25 mg Dose, 50 mg Dose) with dark category labels on the left.
      Data: Each row shows a half-violin "cloud" rising above the baseline, a white-filled box (median line + whisker caps) centered on the baseline, and jittered semi-transparent rain points below. Colors follow the canonical Imprint order: green, lavender, blue, ochre — first series is #009E73 green. The 50 mg row visibly shows a bimodal cloud shape (two humps) versus the roughly unimodal others.
      Legibility verdict: PASS — all text (title, axis label, tick labels, category labels) is clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Title, axis label, and tick labels render in light/off-white ink, fully legible. The same vertical gridlines are present at matching low opacity in light ink. Box fills switch to the dark elevated tone with light strokes; whisker lines, box outlines, and median lines render in light ink instead of dark ink.
      Data: Data colors (green, lavender, blue, ochre) are visually identical to the light render — only chrome flipped, as required. Cloud fill/stroke opacity and rain-point alpha match the light render.
      Legibility verdict: PASS — no dark-on-dark failures observed; all chrome elements are clearly visible against the near-black background.
