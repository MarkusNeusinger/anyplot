review:
  strengths:
  - 'Correct raincloud composite: half-violin clipped to only the upper half, box
    plot centered on the category baseline, jittered rain strictly below the baseline
    — exactly matching the required cloud-above / box-on-line / rain-below layout
    for horizontal orientation.'
  - 'Deterministic seeded LCG data generation with a genuinely bimodal 50 mg-dose
    group (fast responders vs. non-responders) that demonstrates precisely what a
    raincloud plot is for: revealing multimodality a plain box plot would hide.'
  - Correct Imprint palette order (green/lavender/blue/ochre) and correct theme-adaptive
    chrome (t.ink, t.elevatedBg, t.pageBg) — verified consistent data colors and fully
    readable chrome text in both light and dark renders.
  - No edge clipping anywhere; canvas dimension gate passed; left margin sized to
    fit the longest category label without crowding.
  - Uses MUI X's documented composition API (useXScale/useYScale/useDrawingArea plus
    raw SVG) — the correct, library-sanctioned approach for a chart type the community
    package has no built-in support for.
  weaknesses:
  - No gridlines make it slightly harder to compare exact reaction-time values across
    the four category rows — a subtle vertical gridline (10-15% opacity, per style
    guide) would aid cross-row alignment without adding clutter.
  - The y-axis has no descriptive axis title (only the x-axis has 'Reaction Time (ms)');
    category names are self-explanatory so this is minor, but a small 'Group' label
    would complete the symmetry.
  - As an interactive-library entry, the implementation doesn't lean on any MUI X
    interactive affordances (tooltip customization, interactive legend) beyond scale
    hooks — acceptable since these don't show in the static PNG, but a missed opportunity
    for the HTML detail view.
  - The statistical helper code (quantile/boxStats/kde/gaussianSample) is real complexity
    in the file, justified by the lack of a stats library in the browser runtime,
    but worth watching if the file grows further.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "raincloud-basic · javascript · muix · anyplot.ai" in bold dark ink centered at top, clearly readable. X-axis labeled "Reaction Time (ms)" with dark tick labels every 20 ms from 280 to 660. Y-axis category labels (Placebo, 10 mg Dose, 25 mg Dose, 50 mg Dose) in dark ink to the left of each row, fully legible, no clipping.
      Data: Four horizontal rows, each with a half-violin "cloud" rising above a thin baseline, a white-filled box (with dark outline, median line, and whisker caps) centered on the baseline, and jittered semi-transparent "rain" points scattered below the baseline. First series (Placebo) is brand green #009E73, followed by lavender, blue, and ochre — matching the canonical Imprint categorical order. The 50 mg row visibly shows a bimodal/skewed cloud shape versus the roughly unimodal shapes of the other three rows.
      Legibility verdict: PASS — all title, axis, and tick text is clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Title, axis label, and tick labels all render in light/off-white ink, clearly visible against the dark background. Category labels on the left remain fully legible. Box fills switch to the dark elevated tone with white/light strokes and whisker lines, box outlines and whisker caps rendered in light ink instead of dark ink.
      Data: Same four categories in the same order; data colors (green, lavender, blue, ochre) are visually identical to the light render — only the chrome (background, box fill, ink strokes) flipped for the dark theme, as required.
      Legibility verdict: PASS — no dark-on-dark failures; all chrome elements (title, axis labels, tick labels, box strokes) use light ink on the dark surface and remain fully readable.
