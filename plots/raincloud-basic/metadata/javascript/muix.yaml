review:
  strengths:
  - Composes the raincloud from ChartsContainer with ChartsXAxis/ChartsYAxis/ChartsGrid
    and a custom SVG layer driven by MUI's useXScale/useYScale hooks, so cloud, box
    and rain share the library's own band and linear scales
  - 'Correct horizontal raincloud layout: each half-violin rises above its category
    baseline with a flat edge on it, the Tukey box (quartiles, thick median tick,
    whisker caps) sits centered on the baseline, and the translucent rain (alpha 0.6)
    falls below it in a band that stays clear of the next category''s cloud'
  - 'Dose arms are colored in ordered steps of the imprint_seq ramp (#009E73 placebo
    to #4467A3 at 50 mg), so the dose order reads from the color, identical in both
    themes'
  - 'Data tells a clear dose-response story: reaction times fall with dose and the
    50 mg arm splits into responders and non-responders, which the cloud reveals as
    a bimodal shape the box alone would hide'
  - 'Theme chrome is threaded through tokens (ink, inkSoft, grid, elevatedBg box fill),
    so every label is readable on both #FAF8F1 and #1A1A17'
  - Deterministic fixed-seed LCG data, axis limits derived from the data, animation
    skipped
  weaknesses:
  - 'Suggestion: the rain band spans about 0.68 of the half band below the baseline;
    a slightly tighter band (e.g. RAIN_FAR around 0.75) would sit closer to the narrow
    end of the jitter the Notes describe.'
  - 'Suggestion: the 50 mg rain in the dark render (#4467A3 at alpha 0.6) is the dimmest
    mark on the page; a slightly higher fill opacity would give it the same presence
    as the green arms.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, no white panel.
      Chrome: bold dark title "raincloud-basic · javascript · muix · anyplot.ai" centered at top; y axis title "Treatment arm" (rotated) with category labels Placebo, 10 mg dose, 25 mg dose, 50 mg dose; x axis "Reaction time (ms)" with ticks 220–700 every 20 ms; subtle vertical grid only, x axis line in soft ink. All text dark and readable.
      Data: four horizontal rainclouds. Each half-violin rises above its baseline (Placebo #009E73 green, stepping through teal to #4467A3 blue at 50 mg), with a cream-filled box with dark outline, thick median line and capped whiskers on the baseline, and translucent jittered dots of the same color below. The 50 mg cloud is clearly bimodal (~345 and ~475 ms). Rain stays clear of the next cloud.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, axis titles, category labels and tick labels in light ink, all readable; grid subtle grey; boxes switch to the dark elevated fill with light outlines and median lines. No dark-on-dark text.
      Data: cloud, rain colors identical to the light render (green → teal → blue sequential steps); the blue 50 mg rain is the dimmest mark but still clearly visible.
      Legibility verdict: PASS
