review:
  strengths:
  - 'Correct raincloud anatomy: half-violin KDE cloud clipped to the upper half rises
    above each category baseline, the box plot sits centered on the baseline, and
    jittered rain points fall below it, exactly matching the spec''s ''cloud rises
    / rain falls'' visual metaphor.'
  - Placebo group is deliberately drawn from two sub-populations, producing a visibly
    bimodal cloud that a plain box plot would hide — a genuine demonstration of the
    raincloud plot's core value proposition.
  - Hand-rolled KDE (Epanechnikov kernel + Silverman's rule-of-thumb bandwidth) and
    box-plot statistics (quartiles, IQR-capped whiskers, median) are computed correctly
    from the data with no hardcoding.
  - Theme-adaptive chrome is threaded correctly through every element (axes, gridlines,
    title, box outline/fill, whisker strokes) via window.ANYPLOT_TOKENS; data colors
    are identical between light and dark renders.
  - Categorical colors follow Imprint canonical order (green, lavender, blue, ochre)
    with the mandated brand green first, and the outlined box-plot style (colored
    stroke, page-background fill) keeps the median/IQR readable without hiding the
    cloud beneath it.
  - Title format and reproducible fixed-seed LCG RNG are fully compliant with spec
    conventions.
  weaknesses:
  - Rain point fill-opacity is 0.45, slightly below the spec's stated 0.5-0.7 transparency
    range — bump to ~0.5 for full compliance (cosmetic, doesn't hurt legibility).
  - For the densest group (Placebo, 120 points), rain points cluster tightly enough
    that individual points blur together in the center of the distribution; a touch
    more vertical jitter spread or a slightly smaller radius would keep the strip
    readable at the highest local density.
  - The KDE-and-box composite recipe (kernelEpanechnikov + kernelDensityEstimator)
    is the standard d3-graph-gallery violin-plot pattern rather than a novel technique
    — solid and idiomatic, but not a distinctive showcase of d3-only capability.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Bold dark title "Reaction Time · raincloud-basic · javascript · d3 · anyplot.ai" centered at top, clearly readable. Y-axis category labels (Placebo, Low Dose, Medium Dose, High Dose) in dark ink, clearly readable. X-axis "Reaction Time (ms)" label and numeric ticks (250-650) in soft dark gray, clearly readable. Subtle vertical gridlines at each major tick, visible but not competing with data.
      Data: Four horizontal bands, each showing a half-violin "cloud" rising above the category baseline, a box plot (colored outline, cream-white fill, black median line) centered on the baseline, and jittered "rain" points falling below it. First series (Placebo) is Imprint brand green #009E73; Low Dose is lavender/purple, Medium Dose is blue, High Dose is ochre — matching Imprint canonical order. Placebo's cloud is visibly bimodal (two humps), showing the mixed sub-population; the other three groups shift progressively left (faster reaction times) with increasing dose, giving a clear dose-response visual read.
      Legibility verdict: PASS — all title, axis, and tick text is dark-on-light and fully legible; no overlaps.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title now rendered in light/off-white text, clearly readable against the dark background. Y-axis category labels and x-axis label/ticks are light-colored and clearly readable. Gridlines are subtle light lines, visible but unobtrusive.
      Data: Same four bands in the same positions. Cloud, box, and rain colors are visually identical to the light render (brand green, lavender, blue, ochre) — only the chrome (background, text, grid, box interior fill, whisker/median stroke colors) flips to the dark-theme tokens. Box interiors are near-black (matching the page background) with colored strokes and a white median line, box/whisker chrome reads correctly against the dark surface.
      Legibility verdict: PASS — no dark-on-dark or light-on-light failures found; all chrome elements flip correctly and data colors remain constant across themes.
