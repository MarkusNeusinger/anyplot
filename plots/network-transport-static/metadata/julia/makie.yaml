review:
  strengths:
  - 'Correct theme-adaptive chrome and Imprint palette usage across both renders (Express
    = #009E73 first series, Regional = lavender, Local = blue; backgrounds #FAF8F1
    light / #1A1A17 dark; identical data colors between themes)'
  - 'Thoughtful bidirectional-edge handling: offset parallel lines are anchored to
    the canonical alphabetical-pair vector so both directions of a route render as
    distinct, correctly-arrowed lines instead of collapsing onto one line'
  - Hollow-ring node markers let crossing edges stay visible through the station glyph,
    and Central is deliberately enlarged to read as the interchange hub — size, not
    text, carries the emphasis
  - 'All required spec features are present: directed arrowheads, route-id + departure/arrival
    edge labels, curved/offset multi-edges for parallel services, and color-coding
    by route type with a clean legend'
  - Deterministic, single-file, idiomatic Makie code (Axis/scatter!/lines!/arrows!/text!/Legend,
    DataAspect for correct geometry), no fake interactivity
  weaknesses:
  - 'Severe text overlap at interchange nodes: the station label collides directly
    with an edge''s route/time label at ''Northgate'' (merges into ''Northgatee''-looking
    text with the RE 1 label), ''Highlands'' (collides with the RE 5 label), ''Central''
    (collides with the RE 2 label), and ''Lakeside'' (merges with ''LO 4 | 07:50 →
    08:04''); the ''Riverside'' label additionally has a route line drawn straight
    through it. The label-placement heuristic biases toward whichever endpoint has
    fewer converging routes, but still lands too close to that endpoint''s own station-label
    anchor whenever the station has any other route passing through — add a minimum-distance
    check against nearby station-label bounding boxes, not just against the node position.'
  - 'Edge-label vs. edge-label collisions where reversed-direction route pairs land
    in nearly the same screen position: ''EX 3 | 08:14 → 08:26'' overlaps ''RE 2 |
    08:25 → 08:40'' near the Westfield–Central segment, ''EX 5 | 08:26 → 08:38'' overlaps
    ''RE 1 | 08:05 → 08:20'' near Central–Northgate, and ''EX 6 | 08:46 → 08:58''
    overlaps ''RE 3 | 08:10 → 08:25'' near Central–Harbor. Increase the perpendicular
    label offset near the hub or stagger the ''lt'' placement fraction per edge so
    two edges sharing an endpoint don''t converge on the same label slot.'
  - The near-diagonal local route 'LO 1 | 08:40 → 08:55' crosses directly through
    the express edge's label 'EX 5 | 08:26 → 08:38' near Harbor–Hillcrest, merging
    the arrowhead and both text strings into an unreadable cluster.
  - Given how much visual noise piles up at the five-plus-route hub around Central,
    consider abbreviating edge labels there (route ID only, with times on hover-equivalent
    detail or a smaller secondary line) or widening the layout's negative space around
    Central so converging labels have room to fan out without touching.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1, not pure white.
      Chrome: Title "Regional Rail Network · network-transport-static · julia · makie · anyplot.ai" is centered at the top in dark ink, clearly readable. Legend ("Express" green, "Regional" lavender, "Local" blue) sits at the right edge with dark title/label text, fully readable. Twelve hollow-ring station nodes are labeled around a cross-shaped hub-and-spoke layout centered on the enlarged "Central" node.
      Data: Directed edges are colored by route kind (green express trunk, lavender regional crossing line, blue diagonal local spurs) with visible arrowheads showing travel direction; the first categorical series (Express) is the brand green #009E73 as required. Route/time labels (e.g. "EX 1 | 08:00 → 08:14") are present on every edge.
      Legibility verdict: FAIL — multiple edge-time labels overlap directly with station labels ("Northgate", "Highlands", "Central", "Lakeside" all show merged/garbled text where a route label lands on top of the station name) and with each other (reversed-direction route pairs near Central stack their labels on top of one another, e.g. EX 3/RE 2, EX 5/RE 1, EX 6/RE 3); the "Riverside" label also has a route line drawn straight through it. Station/route names are otherwise legible in isolation, but the collision zones make several labels unreadable.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17, not pure black.
      Chrome: Same layout as light — title and legend both render in light ink (#F0EFE8 primary / #B8B7B0 secondary) and are clearly readable against the dark background; no dark-on-dark text found.
      Data: Data colors are identical to the light render (green/lavender/blue route lines, same hollow node styling with light-ink strokes) — only the chrome flipped as required.
      Legibility verdict: FAIL for the same reason as light — the overlap is a layout/geometry issue baked into both renders identically (same collisions at Northgate, Highlands, Central, Riverside, Lakeside, and the same edge-label-vs-edge-label pileups near the hub), not a theme-specific contrast failure.
