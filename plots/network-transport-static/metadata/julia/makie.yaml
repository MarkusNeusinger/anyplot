review:
  strengths:
  - 'Excellent Spec Compliance: realistic regional-rail data with express/regional/local
    route kinds, correctly formatted edge labels ("EX 1 | 08:00 → 08:14") matching
    the spec''s mandated pattern, and offset parallel lines that correctly distinguish
    bidirectional route pairs at each station.'
  - 'Genuinely distinctive Library Mastery: uses Makie.project/Makie.boundingbox to
    measure real on-screen glyph geometry, then runs an oriented-bounding-box collision
    search to place every edge and station label overlap-free — a technique that would
    be hard to replicate as cleanly in another library.'
  - Correct Imprint palette usage in canonical order (brand green first for Express,
    lavender for Regional, blue for Local), fully theme-adaptive chrome, and identical
    data colors between the light and dark renders.
  - 'Thoughtful visual hierarchy: the Central interchange node is enlarged relative
    to the others, and hollow node rings keep crossing edges visible through the station
    markers.'
  weaknesses:
  - Legend sits isolated far to the right of the network diagram with a large band
    of empty canvas between the rightmost station (Eastport) and the legend column
    — this reads as a floating, disconnected element rather than part of the composition.
    Move the legend closer to the diagram (e.g. as a compact inset in an empty region
    of the network, or directly adjacent to the rightmost stations) and tighten the
    column split so the whitespace is balanced left-to-right rather than concentrated
    on the right edge.
  - 'Code structure violates the CQ-01 KISS guideline for this catalog: the collision-avoidance
    logic introduces a full geometry module (an OBB struct plus a dozen helper functions
    for overlap/intersection testing) instead of the simple Imports → Data → Plot
    → Save script shape expected here. The output quality justifies some complexity,
    but consider whether a simpler heuristic offset scheme for label placement could
    reach an acceptable result with far less code.'
  - Arrowheads (arrowsize=15 on a 3200 px canvas) are quite subtle at full size and
    easy to miss at a glance — increase arrowhead size slightly so route direction
    reads clearly, especially once the PNG is scaled down for mobile widths.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "Regional Rail Network · network-transport-static · julia · makie · anyplot.ai" in dark ink at top-center; 12 station labels in dark ink; rotated edge labels (route id + times) in a softer ink-gray; legend ("Route type": Express/Regional/Local) in dark title + softer ink-gray entries, no frame. All chrome text is clearly legible against the light background.
      Data: Hollow-ring station markers (larger ring at Central); directed edges in three colors — brand green (#009E73, Express), lavender (Regional), blue (Local) — with small arrowheads showing travel direction; bidirectional route pairs are drawn as offset parallel lines. First categorical series is confirmed brand green.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title, station labels, and edge labels now rendered in light ink (title/station labels near-white, edge labels/legend entries in a lighter soft gray) — fully readable against the dark background, no dark-on-dark text found.
      Data: Same three edge colors (green/lavender/blue) as the light render, confirming data colors are identical between themes — only chrome (background, text) flipped.
      Legibility verdict: PASS
