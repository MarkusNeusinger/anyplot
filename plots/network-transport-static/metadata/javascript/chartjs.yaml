review:
  strengths:
  - 'Genuinely creative solution to a hard constraint: Chart.js has no native network/graph
    chart type, and this implementation builds one correctly through the library''s
    own plugin extension points (beforeDatasetsDraw/afterDatasetsDraw) instead of
    reaching for another library.'
  - Lane-offset geometry cleanly separates bidirectional route pairs (e.g. the two
    IC1, S2, RE5, RE7, S9 edges) so labels never collide - verified visually in both
    renders.
  - Station labels are anchored outward from the network centroid, avoiding the classic
    hub-diagram failure of labels sitting on top of converging lines.
  - 'Correct, theme-adaptive Imprint palette usage: brand green first, canonical order
    thereafter, data colors identical across light/dark, chrome flips correctly.'
  weaknesses:
  - Edge/route tooltips don't carry full route details as the spec requests ("Tooltips
    ... should show full route details on hover") - only the station tooltip works
    (shows service count); wire the edges into a hit-testable dataset (e.g. an invisible
    point at each curve midpoint) so hovering an edge shows route id + departure/arrival.
  - Degree-based node sizing (16 + degree*2.2) is too subtle to visually distinguish
    hub stations from leaf stations - increase the multiplier or radius floor so Central
    Station (degree 8) reads clearly larger than a degree-2 station.
  - Data scale (8 stations, 15 routes) sits at the spec's stated minimum; a slightly
    larger network (10-12 stations, 20-25 routes) would better showcase the curve/offset
    system.
  - A few edge labels (IC1, S2, S11) render near-vertical, requiring the reader to
    tilt their head - consider clamping label rotation to a maximum angle (e.g. +/-45
    degrees) for readability.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1), not pure white.
      Chrome: Title "network-transport-static · javascript · chartjs · anyplot.ai" in dark ink, comfortably centered. Bold dark station labels anchored outward from the network centroid. Bottom legend (Regional Express / InterCity / Local / S-Bahn) with line swatches. All chrome clearly readable.
      Data: 8 black-filled station nodes (sized by route degree) connected by 15 curved, arrowed, color-coded edges - green (#009E73) Regional Express, purple (#C475FD) InterCity, blue-slate (#4467A3) Local/S-Bahn. Every edge carries a rotated "{routeId}  {dep}->{arr}" label on a translucent cream backing box. First series is confirmed #009E73 (brand green).
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17), not pure black.
      Chrome: Same title and station labels flipped to light ink; label backing boxes flipped to dark page color; legend readable in light text.
      Data: Station nodes flip to cream fill; the three route colors (#009E73, #C475FD, #4467A3) are pixel-identical to the light render, confirming only chrome flipped as required. No dark-on-dark issues found - all text has strong contrast against the near-black background.
      Legibility verdict: PASS
