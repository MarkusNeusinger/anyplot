review:
  strengths:
  - 'All four weaknesses from the attempt-1 review are visibly addressed: edges are
    now hit-testable (routeHitDataset with pointHitRadius) so hovering a route shows
    its full departure/arrival/type detail, not just station service count.'
  - Node radius is now clearly degree-scaled (18 + degree*4) so hub stations (Central
    Station, Eastport, Southgate, Harborview) read as visually dominant over leaf
    stations (Millbrook, Bayside, Riverside) - the previous 'too subtle' sizing issue
    is fixed.
  - Network scaled up from 8/15 to 11 stations and 24 routes, comfortably inside the
    spec's 8-20/15-60 range and showing off the lane-offset and curve system on more
    bidirectional pairs.
  - Edge label rotation is now clamped to +/-45 degrees (maxLabelAngle), eliminating
    the near-vertical head-tilt labels flagged previously (IC1, S2, S11).
  - 'Genuinely idiomatic Chart.js solution to a hard constraint: no native network
    chart type exists, so the network is built via the library''s own beforeDatasetsDraw/afterDatasetsDraw
    plugin hooks on a scatter dataset rather than reaching for another library or
    a community plugin.'
  - Outward station-label placement samples 8 candidate directions and picks the one
    least aligned with any incident edge, so labels stay clear of converging route
    lines even at busy hubs.
  - 'Correct, theme-adaptive Imprint palette: first series is #009E73, canonical order
    thereafter, data colors identical between light/dark, chrome (backgrounds, ink,
    label backers) flips correctly.'
  weaknesses:
  - 'Regression introduced by the node-size fix: at Central Station, Southgate, Eastport,
    and Harborview (the four largest, highest-degree hubs), an edge label''s translucent
    backing box now visibly overlaps and cuts into the enlarged node circle - a light/dark
    rectangular notch bites into the black (light theme) or off-white (dark theme)
    node fill. Root cause: the label midpoint in transportLabels is computed purely
    from the curve''s pixel midpoint and per-lane perpendicular offset, with no adjustment
    for nodeRadius(source)/nodeRadius(target) - now that hub radii are much larger
    (18 + degree*4), midpoints for short or near-vertical edges land inside or right
    at the enlarged node''s boundary. Fix: push the label position further along the
    curve (or increase the minimum node-to-label clearance) proportional to the larger
    of the two endpoint node radii, e.g. skip/relocate labels whose midpoint distance
    to either station center is less than nodeRadius + half the label box diagonal.'
  - Route id + time labels are quite small (13px) relative to the 3200x1800 canvas
    given 24 overlapping curves converging on a handful of hubs - legible but dense;
    a couple more px or slightly more spacing between stacked lane labels would improve
    scanability at the busiest hubs (Central Station has 5+ distinct edge labels within
    a small radius).
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1), not pure white, not dark.
      Chrome: Title "network-transport-static · javascript · chartjs · anyplot.ai" in dark ink, centered, ~68% of plot width. Bold dark station labels (Central Station, North Junction, Eastport, Westfield, Southgate, Lakeview, Millbrook, Harborview, Riverside, Hilltop, Bayside) anchored outward from the network centroid on translucent cream backing boxes. Bottom legend with three line swatches: "Regional Express" (green), "InterCity" (purple), "Local / S-Bahn" (blue). All chrome text is clearly readable against the light background.
      Data: 11 black-filled station node circles, sized by route degree (Central Station and Eastport visibly larger than leaf stations like Millbrook/Bayside/Riverside), connected by 24 curved, arrowed, color-coded directed edges - green #009E73 Regional Express, purple InterCity, blue-slate Local/S-Bahn. Every edge carries a rotated "{routeId}  {dep}→{arr}" label on a cream backing box, clamped to a readable tilt. Defect: at the four largest hub nodes (Central Station, Southgate, Eastport, Harborview) a nearby edge-label's cream backing box visibly overlaps and cuts a light rectangular notch into the black node circle (confirmed via pixel crop). First data series is confirmed #009E73 (brand green).
      Legibility verdict: PASS (all text readable; the node/label-box overlap is a visual-overlap defect, not a legibility failure - no text is unreadable).

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17), not pure black, not light.
      Chrome: Same title and station labels flipped to light ink; label backing boxes flip to the dark page color; legend readable in light text against the dark background.
      Data: Station nodes flip to off-white/cream fill; the three route colors (#009E73 green, purple, blue-slate) are pixel-identical to the light render, confirming only chrome flipped as required. No dark-on-dark or light-on-light text failures found - all text has strong contrast against the near-black background. The same node/label-box overlap defect reproduces here (a dark rectangular notch cuts into the off-white node fill at the same four hub stations), confirming it is a geometry bug, not a theme-token bug.
      Legibility verdict: PASS (all text readable; same overlap defect as the light render, not a legibility failure).
