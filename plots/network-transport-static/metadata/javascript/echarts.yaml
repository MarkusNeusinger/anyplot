review:
  strengths:
  - 'Correct Imprint palette: Regional (primary/most-frequent tier) uses brand green
    #009E73, Local and Express follow canonical positions 2 and 3 — legend swatches
    match line colors exactly, and colors are identical between light and dark renders.'
  - Idiomatic use of ECharts' graph series in 'none' layout with directed edgeSymbol
    arrows and per-pair curveness offsets so bidirectional/parallel routes between
    the same station pair don't overlap.
  - 'Realistic, neutral regional-rail scenario: hub-and-spoke topology around Central
    Station, plausible hourly-morning timetable, 10 stations / 22 routes within the
    spec''s recommended size range.'
  - 'Clean theme-adaptive chrome in both renders: warm off-white / near-black backgrounds,
    ink-colored node borders and text, elevated-background label pills that stay legible
    over crossing edges.'
  - 'Deterministic in-memory data, no external deps, follows the mount-node contract
    correctly (animation: false, no explicit init size, no devicePixelRatio).'
  weaknesses:
  - Edge labels only show the route id (e.g. 'RE10') and never the departure/arrival
    times — the spec explicitly asks for 'route identifier and times (e.g., "RE 42
    | 08:15 -> 09:30")'. Times only appear in the tooltip, which is interactive-only;
    the static PNG never communicates them. Extend the edgeLabel formatter to include
    `${r.dep} -> ${r.arr}` (can stay compact, e.g. 'RE10 06:20>06:38') so the static
    render satisfies the spec.
  - Edge label fontSize is 11 CSS px versus 15-16 for legend/node labels — noticeably
    smaller than the rest of the chrome and will be close to unreadable once the PNG
    is scaled to the ~400px mobile thumbnail. Bump to ~13-14px to bring it closer
    to the other text sizes.
  - 'The graph series declares `categories: ROUTE_TIERS.map(name => ({name}))` and
    a `legend` that references those category names, but neither `nodes` nor `links`
    are given a `category` index — so in the interactive HTML, clicking a legend entry
    to toggle a tier does nothing (the categories aren''t actually wired to any data).
    Either assign `category` per link/node or drop the categories array and rely on
    the manual `color` array alone.'
  - The hub area around Central Station is visually dense — most of the 22 routes
    converge into one point, and although curveness helps, a couple of same-direction
    curves run close together near the node. Consider slightly increasing curveness
    variance or spreading label placement to reduce crowding right at the hub.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "network-transport-static · javascript · echarts · anyplot.ai" centered at top in dark ink, fully visible and comfortably sized. A three-item legend (Regional/Local/Express) sits just below the title with color swatches matching the edge colors. Ten station nodes are drawn as white circles with a bold dark ink border; each has a label in dark text on a light elevated-background pill to its right (e.g. "Central Station", "North Junction", "Lakeside"). Directed edges are curved lines with arrowheads at the target node, colored by tier (green=Regional, lavender=Local, blue=Express), each carrying a small grey route-id label (e.g. "RE10", "S1", "EX5") on a light background pill.
      Data: First/most-frequent tier (Regional) renders in brand green #009E73; Local renders in lavender; Express in blue — matching Imprint palette positions 1-3 in canonical order. Multiple routes between the same station pair (e.g. Central Station <-> North Junction) are offset via curveness so the two directions don't overlap.
      Legibility verdict: PASS — title, legend, and node labels are all clearly readable against the light background. Edge route-id labels (route id only, e.g. "RE10") are readable at full resolution but are notably smaller (11px) than the rest of the chrome text, which is a legibility concern at mobile scale (see weaknesses).

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title, legend, and node-label layout as light, now in light ink (#F0EFE8-range) text on dark elevated-background pills. No dark-on-dark or light-on-light failures observed — all title, legend, node-label, and edge-label text is clearly visible against the near-black background and against the elevated pill backgrounds.
      Data: Regional/Local/Express edge colors are pixel-identical to the light render (brand green, lavender, blue) — only the chrome (background, text, pill fills) flips theme, exactly as required.
      Legibility verdict: PASS — all chrome text reads clearly in dark mode; same minor small-edge-label-size concern as light render, but no theme-specific legibility failure.
