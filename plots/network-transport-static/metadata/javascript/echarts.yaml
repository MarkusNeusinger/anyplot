review:
  strengths:
  - Edge labels now render the full route id plus departure/arrival times (e.g. "RE10
    | 06:20 → 06:38"), satisfying the spec's explicit static-label requirement
  - '`category` is now assigned per link and a custom `legendselectchanged` handler
    drives visibility/opacity, so the tier legend actually filters edges in the interactive
    HTML (fixes the dead legend from attempt 1)'
  - 'Correct Imprint palette: Regional (primary/most-frequent tier) uses brand green
    #009E73, Local and Express follow canonical positions 2 and 3, identical between
    light and dark renders'
  - 'Idiomatic ECharts graph series (layout: ''none'') with directed edgeSymbol arrows
    and per-pair curveness offsets so bidirectional/parallel routes stay visually
    separated'
  - 'Realistic, neutral regional-rail scenario: hub-and-spoke topology, plausible
    hourly-morning timetable, 10 stations / 22 routes within spec range'
  - Clean theme-adaptive chrome in both renders (elevated-background label pills,
    correct backgrounds, no dark-on-dark or light-on-light failures)
  - 'Deterministic in-memory data, correct mount-node contract (animation: false,
    no explicit init size/dpr)'
  weaknesses:
  - Edge route/time labels (13px) are still noticeably smaller than node labels (16px)
    and legend text (15px) — readable at full 3200×1800 size but the first to disappear
    at the ~400px mobile thumbnail
  - The hub area around Central Station stays visually dense with six-plus converging
    curved edges; existing curveness variance helps but doesn't fully declutter the
    busiest node
  - 'Design execution is solid but not yet publication-grade: tier coloring and curve
    offsets create structure, but there''s no additional emphasis (e.g. highlighting
    the busiest route or station) to give the diagram a clearer focal point'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 - not pure white, not dark.
      Chrome: Title "network-transport-static · javascript · echarts · anyplot.ai" centered at top in dark ink, fully readable. Three-item legend (Regional/Local/Express) sits just below the title with color swatches matching the edge colors. Ten station nodes render as bordered circles (dark-ink border, page-background fill) with dark-ink labels on light elevated-background pills, positioned to the right of each node. All title/legend/node-label text is clearly readable against the light background.
      Data: Directed, curved edges connect stations with arrowheads, colored by tier (green #009E73 = Regional, lavender = Local, blue = Express) — first series is confirmed brand green. Each edge carries a label with route id and departure/arrival times (e.g. "RE10 | 06:20 → 06:38"), readable though smaller (13px) than the surrounding chrome. Curveness offsets keep bidirectional/parallel routes between the same station pair visually separated.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 - not pure black, not light.
      Chrome: Same title/legend/node layout as light render, now in light-ink text on dark elevated-background pills. No dark-on-dark or light-on-light failures — all chrome text is clearly visible against the dark background.
      Data: Green/lavender/blue edge colors and route/time edge labels are pixel-identical to the light render — only chrome (background, text, pill fills) flips between themes, as required.
      Legibility verdict: PASS

    Both renders pass the theme-readability check with no clipped elements at either canvas edge (AR-09 not triggered). The remaining legibility concern shared by both renders is the relatively small edge-label font size (13px) versus the rest of the chrome (15–16px), which affects mobile-thumbnail legibility of the fine-print route/time labels rather than the core diagram structure.
