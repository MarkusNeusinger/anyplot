review:
  strengths:
  - 'Both attempt-1 blocking issues are resolved: native <title> hover tooltips now
    cover stations and routes, and node/edge/label construction uses D3''s idiomatic
    selection.data(...).join(...) + d3.scaleLinear instead of imperative loops and
    manual math'
  - Canvas padding was tightened, eliminating the uneven corner whitespace flagged
    previously (Airport/top-right, Oldtown/bottom-left)
  - Correct Imprint palette in canonical order (green/lavender/blue for regional/express/local),
    with data colors identical between light and dark renders
  - Sophisticated collision-avoidance system keeps 21 dense edge-time labels legible
    without overlapping node labels or each other, in both themes
  - Curved/offset edges correctly distinguish parallel routes on the same station
    pair (e.g. Central Station <-> Eastgate carries both IC10 and RE6)
  - Clean hub-and-spoke visual hierarchy makes Central Station's role as the network
    hub immediately obvious
  weaknesses:
  - Edge-time labels (14px CSS, 21 of them) remain dense and small; still likely hard
    to read at a ~400px mobile thumbnail despite the slight size bump from 13px
  - Chrome/data-label typography still relies on the Inter/system-sans fallback stack
    rather than a more distinctive typographic choice
