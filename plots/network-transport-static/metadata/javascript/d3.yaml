review:
  strengths:
  - Correct Imprint palette applied in canonical order (green/lavender/blue for regional/express/local),
    with data colors identical between light and dark renders
  - Sophisticated collision-avoidance system (declutterPairs + declutterObstacles)
    keeps 21 dense edge-time labels legible without overlapping node labels or each
    other
  - Curved/offset edges correctly distinguish parallel routes on the same station
    pair (e.g. Central Station ↔ Eastgate carries both IC10 and RE6)
  - Clean hub-and-spoke visual hierarchy makes Central Station's role as the network
    hub immediately obvious
  - Directional arrowheads, color-matched per route type, correctly indicate travel
    direction with paths trimmed to the node's edge
  - Theme-adaptive chrome correctly implemented — node fills, page background, and
    all text flip appropriately between light/dark while data colors stay fixed
  weaknesses:
  - No hover tooltips despite the spec explicitly requesting them ('Tooltips (where
    supported) should show full route details on hover') — add <title> elements to
    the route paths and station circles with route ID, departure/arrival times, and
    station names
  - Nodes and edges are built with imperative for-loops and repeated .append() calls
    per element instead of D3's idiomatic selection.data(...).join(...) pattern, and
    positions are computed with manual linear mapping instead of d3.scaleLinear —
    refactor to data-bound joins driven from the stations/routes arrays
  - Edge-time labels (13px CSS, 21 of them) are dense and small; when the PNG is scaled
    to a ~400px mobile thumbnail they will be difficult to read — consider a slightly
    larger font or trimming label content
  - Whitespace is uneven across the canvas corners (notably top-right beyond Airport
    and bottom-left below Oldtown) — tighten the data-to-canvas scale/padding so the
    network better fills the frame
  - Chrome and data-label typography relies on the generic system sans-serif stack
    rather than a more deliberate font choice, which caps the aesthetic polish
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1), matches the light-theme page surface, not pure white.
      Chrome: Bold dark title "network-transport-static · javascript · d3 · anyplot.ai" centered at top, clearly legible. 12 station nodes drawn as cream-filled circles with dark ink outlines; bold dark station-name labels sit below each node on a semi-transparent light pill. Edge-time labels ("RE1 | 08:00 → 08:20" etc.) use smaller dark-gray text on light pill backgrounds. Legend (Regional/Express/Local) centered at the bottom with colored line swatches and dark text.
      Data: Directed curved edges color-coded by route type — green (#009E73, regional), lavender (#C475FD, express), blue (#4467A3, local) — with matching-colored arrowheads showing travel direction. Central Station acts as the visual hub with the highest edge density.
      Legibility verdict: PASS — all title, node-label, edge-label, and legend text is clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17), matches the dark-theme page surface, not pure black.
      Chrome: Same layout as the light render with all chrome inverted — light/white bold title, near-black node fills with light ink outlines, light station-name and edge-time label text on dark semi-transparent pills, light legend text.
      Data: Route colors are identical to the light render (green/lavender/blue), confirming only chrome flipped and categorical data colors stayed fixed.
      Legibility verdict: PASS — all text (title, node labels, edge labels, legend) is clearly readable against the dark background; no dark-on-dark failures observed.
