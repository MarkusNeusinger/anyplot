review:
  strengths:
  - Fully custom hand-built network diagram using Highcharts' SVG renderer API (chart.renderer.path/circle/text)
    — a smart workaround given the networkgraph module is unavailable, achieving trimmed-to-radius
    arrows and curve offsetting that no built-in Highcharts series type could do
  - Route types (Regional/Local/Express) are color-coded with the canonical Imprint
    palette order and a matching legend
  - 'Deliberate visual hierarchy: Central Station is rendered as a larger ''hub''
    node inside a genuine grid+branch layout, not everything radiating from a single
    point'
  - Multiple daily services between the same station pair are cleanly separated into
    curved/offset edges, with the perpendicular direction derived from a canonical
    sorted pair so reverse-direction routes don't collapse onto the same curve
  - Deterministic, realistic regional-rail data — sequential departure/arrival times,
    plausible trip durations, bidirectional service pairs
  - Theme-adaptive chrome is correct and data colors are identical between light/dark
    renders; no clipping at the canvas edges
  weaknesses:
  - Edge-label background boxes are missing for ~21 of the 24 route labels. The code
    draws a bordered elevatedBg rect behind every label via renderer.rect(bbox.x -
    5, bbox.y - 3, ...) right after label.getBBox(), but pixel inspection of the rendered
    PNG shows only 3 labels (R101, L301, E401) actually get a visible box — the rest
    sit directly on the plain page background. This looks like a getBBox()-timing
    bug (stale/zero-size bbox on most calls in the forEach loop) rather than intentional
    styling. Fix so every label gets a consistent backing box (or drop the per-label
    rect entirely if it can't be made reliable) — the current inconsistency reads
    as broken, not stylistic.
  - 'On short edges between adjacent stations (NOJ<->SMH, LKS<->APT), the arrowhead
    triangle is drawn directly on top of the edge-label text: ''R201'' and ''R208''
    have their leading characters covered by the incoming arrowhead, and ''07:55''/''08:33''
    have trailing digits partly obscured (confirmed in both light and dark renders).
    The label offset (LABEL_PERP_STEP/LABEL_ALONG_STEP) doesn''t scale down or push
    labels away from the arrow-trim point when the station pair is close together.
    Increase the along-edge offset (or clamp the label away from the trimmed arrival
    point) specifically when edge length is short.'
  - No hover/tooltip interactivity on nodes or edges in the HTML detail view — since
    stations and routes are drawn via the low-level SVG renderer rather than real
    series/point objects, none of Highcharts' built-in tooltip machinery is wired
    up, even though the spec calls for 'tooltips (where supported) should show full
    route details on hover.' Consider overlaying invisible scatter/line series with
    a custom tooltip formatter so the interactive build delivers the value expected
    from an interactive library.
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white, matches #FAF8F1 (sampled page pixels = RGB(250,248,241), exact match).
      Chrome: Title "Regional Rail Network · network-transport-static · javascript · highcharts · anyplot.ai" in bold dark ink at top, comfortably sized (~40% width), not clipped. Subtitle in lighter gray ink below it. 12 station nodes drawn as white-filled circles with dark 2.5px stroke, station code inside (bold) and full station name outside each node. Legend at bottom center (Regional/Local/Express swatches) sits close to the plot, fully visible, not isolated. All chrome text is dark-on-light and clearly readable.
      Data: 24 directed routes drawn as curved/offset SVG paths with triangular arrowheads at the target node, colored by route type — Regional = Imprint position 1 (#009E73, brand green), Local = position 2 (#C475FD, lavender), Express = position 3 (#4467A3, blue). Edge labels ("route id | dep→arr") sit near each edge's midpoint. Central Station is rendered as a visibly larger hub node vs. the standard node radius, giving the layout a clear focal point.
      Legibility verdict: PASS overall, with two confirmed defects — (1) only 3 of 24 edge labels have the intended background box (pixel-sampled: R203's label area is exactly page-background color with no elevatedBg fill, while R101/L301/E401 do show the fill+border), and (2) on short edges (NOJ<->SMH, LKS<->APT) the arrowhead triangle visibly overlaps/covers part of the adjacent label text (e.g. "R201", "R208", "...07:55", "...08:33"). Neither makes the plot unreadable overall, but both are real, reproducible defects, not just tight margins.

    Dark render (plot-dark.png):
      Background: warm near-black, matches #1A1A17 (sampled page pixels = RGB(26,26,23), exact match).
      Chrome: Same layout as light render. Title/subtitle sampled at RGB(240,239,232) ≈ #F0EFE8 (the dark-theme ink token) — correctly light-on-dark, no dark-on-dark failures found anywhere checked (title, station labels, edge labels, legend).
      Data: Confirmed identical hex data colors to the light render (green/lavender/blue routes, unchanged) — only chrome (background, node fill, text) flips as required.
      Legibility verdict: PASS overall, same two defects reproduced identically (missing label boxes on most edges; arrowhead-over-text overlap on the same short edges: R208/R207 confirmed via direct crop comparison).
