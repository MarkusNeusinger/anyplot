review:
  strengths:
  - 'Elegant workaround for the missing networkgraph module: Highcharts.chart handles
    chrome/legend while the core SVG renderer draws genuine curved, arrowed, directed
    edges and sized nodes.'
  - Direction-aware node-label placement (per-station dir) keeps all 12 station names
    clear of that station's own incident edges.
  - Adaptive title font-size formula prevents the long descriptive+mandated title
    from overflowing while staying legible.
  - Correct Imprint palette usage (green first series) and fully consistent theme-adaptive
    chrome across both renders.
  - Realistic, internally consistent AM commute schedule (24 services) matching the
    spec's suggested station/route counts.
  weaknesses:
  - 'Edge-label backing boxes are inconsistently visible: some routes (e.g. R101,
    E401, L301) show a clear bordered box, while parallel siblings on the same station
    pair (e.g. R102) render as plain text with no visible border, likely because the
    box border color matches the underlying line color when the box sits directly
    on the curve.'
  - The Central Station hub (10 incident edges) is the busiest part of the diagram;
    increase hub-specific label offset distance or hub radius so labels there are
    as easy to trace back to their edge as in the sparser parts of the network.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1-like), not pure white, not dark.
      Chrome: Title, subtitle, station names/codes, edge labels, and legend all render in dark ink, clearly readable against the light background. Node fills are a slightly elevated light tone with dark strokes.
      Data: First legend series (Regional) uses #009E73 green; Local is violet, Express is blue. Curved directed edges with arrowheads, offset per parallel station pair.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17-like), not pure black, not light.
      Chrome: Title, subtitle, station names/codes, edge labels, and legend all render in light ink, clearly readable against the dark background. No dark-on-dark text found anywhere, including in the dense Central Station hub area.
      Data: Route colors (green/violet/blue) and geometry are identical to the light render; only chrome flipped as expected.
      Legibility verdict: PASS
