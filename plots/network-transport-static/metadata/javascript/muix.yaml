review:
  strengths:
  - Sophisticated custom-drawn network layout built on MUI X's ChartContainer + useXScale/useYScale
    hooks -- a genuinely distinctive use of the library's low-level composition API
    for a chart type (transit network) the community package has no native component
    for.
  - 'Careful geometric engineering: the perpendicular offset direction is keyed off
    the canonical (sorted) station pair rather than each route''s own source->target
    direction, so opposite-direction services on the same corridor consistently land
    on opposite sides instead of collapsing onto one side when reversed.'
  - Station labels use a widest-angular-gap algorithm against each node's incident
    edges so labels are placed where they never collide with a route line, with anchor
    (start/middle/end) chosen from the gap direction so long names like 'Harborside'
    don't swing back over the node.
  - 'Correct, theme-adaptive Imprint palette usage: Regional/Local/Express map to
    palette[0..2] in canonical order (first series is brand green #009E73), and chrome
    (hub fill/text, station fill/stroke, page background) correctly inverts between
    light and dark renders with no dark-on-dark or light-on-light failures.'
  - Route-type color-coding, directional arrowheads, curved/offset edges for parallel
    bidirectional routes, and a wide bowed arc for the Central-Harborside skip-stop
    express all directly implement the spec's stated notes.
  - Label background boxes (elevatedBg fill, opacity 0.94) keep route-id/time text
    legible where it crosses lines or other chrome.
  weaknesses:
  - At this station/route density (9 stations, 18 routes), the many small edge labels
    (fontSize 12) and station labels (fontSize 15) will lose legibility once the PNG
    is scaled to a ~400px mobile thumbnail -- the hub shape and legend stay readable,
    but individual route-id/time text will not. Bump edge-label fontSize slightly
    (e.g. 12->14) or increase label contrast/weight to help the mobile case.
  - No hover/tooltip affordance exists on the custom RouteEdges/Stations marks despite
    the spec note 'Tooltips (where supported) should show full route details on hover'
    -- muix is an interactive library and the emitted HTML currently offers no more
    route detail than the static PNG. Add a lightweight per-edge/per-node tooltip
    (even a native SVG <title> element) to honor that note.
  - The Central-hub cluster (where CTR connects to NJC/EPT/WFD/SGT plus the Harborside
    express arcs) is the busiest region of the diagram -- R20/R21/EX1/L22 labels sit
    close together. It reads fine today thanks to the offset algorithm, but a repair
    pass could push the curve-label placement fraction or perpendicular offset further
    out specifically for hub-incident edges to add breathing room.
  - 'Design excellence is solid but stops short of publication-ready: the reason Central
    is drawn larger than other stations (interchange hub) isn''t explained anywhere
    in the chart (no size legend / annotation), and the express route''s visual distinction
    (dashed line only) is the only extra hierarchy layer beyond route-type color.'
  - Station count (9) and route count (18) sit near the low end of the spec's stated
    8-20 station / 15-60 route range -- a bit more topological variety (e.g. a cross-branch
    connection that doesn't pass through Central) would better showcase the degree-based
    node sizing this implementation already supports.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 -- not pure white.
      Chrome: Bold centered title "network-transport-static · javascript · muix · anyplot.ai" in dark ink at top; a top-left legend (Regional/Local/Express swatches with matching line colors) in dark ink; a smaller italic-weight caption at the bottom ("Arrows show travel direction · labels show route ID and scheduled departure -> arrival") in a softer dark gray. All chrome text is clearly legible against the light background.
      Data: A hub-and-spoke transit network. The "Central" interchange is a large black-filled circle with white "Central" text inside it; eight other stations (North Jct., Uptown, Eastport, Harborside, Westfield, Westbrook, Southgate, Southpark) are drawn as smaller white/cream circles with a dark outline, a short 2-3 letter code inside, and a full station name label placed outside the node. Directed edges are curved lines with arrowheads: green (Regional), purple/lavender (Local), and dashed blue (Express, Central<->Harborside bowing over Eastport). Each edge carries a small label ("R10 07:05->07:12" etc.) on a light background box so it stays readable where it crosses other lines. First (and most common) series color is the brand green #009E73, matching the Imprint palette's canonical order.
      Legibility verdict: PASS (title, legend, caption, station labels, and hub label are all fully readable; edge-label text is small but legible at full resolution -- likely to lose legibility at ~400px mobile thumbnail, noted as a weakness).

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 -- not pure black.
      Chrome: Same title/legend/caption layout, now rendered in light ink (#F0EFE8-ish) against the dark background -- fully readable, no dark-on-dark text anywhere.
      Data: Identical network topology and identical data colors to the light render -- green/purple/blue route lines and green brand color are unchanged (only chrome flipped). The "Central" hub inverts correctly: it is now a light-filled circle with dark text (versus black-filled/white-text in light mode), and the other station nodes are dark-filled circles with light outline/light code text -- correct theme-adaptive inversion, not just a straight color copy.
      Legibility verdict: PASS (all text -- title, legend, station labels, hub label, edge labels -- is light-on-dark and clearly readable; no dark-on-dark failures observed; data colors confirmed identical to the light render).
