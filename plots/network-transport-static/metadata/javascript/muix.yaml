review:
  strengths:
  - Hand-rolled directed-edge rendering (quadratic-bezier curves with canonical-pair
    perpendicular offsets) correctly separates opposite-direction routes onto opposite
    sides of the corridor, and bows the Central→Harborside express well clear of the
    Eastport node it skips.
  - Central interchange is rendered as a visually larger hub with its full station
    name set inside, while satellite stations use widest-angular-gap label placement
    so labels never sit on top of an incident route line — a genuine algorithmic solution,
    not a fixed offset.
  - Route type color-coding (Regional / Local / Express) uses the Imprint palette
    in canonical order with the brand green first, and Express routes get a redundant
    dashed stroke on top of color, satisfying CVD-safe redundant encoding.
  - 'Both renders are theme-correct: warm off-white / near-black backgrounds, theme-adaptive
    ink for all chrome, identical data colors across light and dark.'
  - Idiomatic, distinctive use of MUI X's useXScale/useYScale hooks to drive a fully
    custom SVG overlay on the ChartContainer's coordinate system — the library-sanctioned
    pattern for chart types (network diagrams) the built-in series types can't express.
  weaknesses:
  - 'Two edge labels are partially hidden behind the Central hub node: ''R31 07:25→07:34''
    (Central→Westfield) and ''R21 07:20→07:34'' (Central→Eastport) — the Stations
    component renders after RouteEdges, so the large 46px-radius Central circle paints
    over part of the label''s rounded-rect box and text, losing the arrival time on
    R31 and the leading ''R'' on R21. Increase the offset for trunk-segment reverse-direction
    labels near the hub (or nudge the lt/offset parameters specifically for edges
    touching CTR) so no label geometry falls inside the hub''s radius.'
  - 'DQ-01: all 8 branch routes follow the same symmetric hub-and-spoke, out-and-back
    pattern (one Regional or Local pair per branch plus one Express skip-stop) — a
    bit repetitive; an orbital/interchange route bypassing the hub, or a branch with
    uneven service (e.g. only one direction operating, or a third overlapping route
    on the same corridor) would show more of what curved/offset edges are for.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1), matches the required light-theme surface — not pure white.
      Chrome: Title "network-transport-static · javascript · muix · anyplot.ai" in bold dark ink, clearly visible top-center. A three-item legend (Regional/Local/Express, colored line swatches) sits top-left, fully readable. A tertiary caption at the bottom ("Arrows show travel direction · labels show route ID and scheduled departure → arrival · larger circle marks the Central interchange") is legible in muted ink. Station labels (e.g. "North Jct.", "Uptown", "Harborside") are dark ink on the cream background, all readable.
      Data: Nine station nodes (white/cream fill, dark stroke) connected by curved directed edges in three colors — green (Regional), lavender/purple (Local), blue dashed (Express) — with arrowheads matching edge color. The Central hub is a large filled dark circle with its name in light text inside. Each edge carries a small pill-shaped label with route ID and departure→arrival time on a light elevated-background box. First categorical series (Regional) is the brand green #009E73, matching the Imprint rule.
      Defect: Two edge labels ("R31 07:25→07:34" and "R21 07:20→07:34", both trunk routes returning to Central) are partially occluded by the large Central node circle, which is drawn on top of the edge layer — part of the label text is hidden underneath the node. All other 16 edge labels are fully legible.
      Legibility verdict: PASS overall (title/legend/captions/station labels all clear), with a localized FAIL on 2 of 18 edge labels due to node/label z-order overlap (see weaknesses).

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17), matches the required dark-theme surface — not pure black.
      Chrome: Title, legend, caption, and all station labels render in light ink (near-white/soft-white), clearly visible against the dark background — no dark-on-dark failures observed anywhere.
      Data: Same three route-type colors (green/lavender/blue-dashed) identical to the light render — confirmed unchanged data-color values, only the chrome (background, ink, node fill/stroke, label box) flipped to dark-theme tokens. The Central hub circle is now a light/cream fill with dark text inside (correctly inverted from the light render's dark-fill/light-text).
      Defect: Same two labels (R31, R21) are partially hidden behind the Central node in this render too — the geometry bug is theme-independent, as expected since it's a layout issue not a color issue.
      Legibility verdict: PASS overall (all chrome and 16/18 edge labels fully readable), with the same localized 2-label overlap defect as the light render.
