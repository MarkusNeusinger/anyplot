review:
  strengths:
  - Stations sit at their data coordinates through ChartsContainer's hidden linear
    axes and the useXScale/useYScale hooks, with no layout pass
  - Every route has its own curved edge, an arrowhead that stops at the destination's
    border, and an 'ID dep→arr' label on an elevated backing box, readable in both
    themes
  - 'Clear hierarchy: Central is drawn as an inverted ink hub with its full name inside,
    and Express is encoded redundantly by color, a dashed stroke and a wider bow'
  - Station names go into the largest angular gap between incident edges, so no name
    collides with an edge
  - 'Imprint palette in canonical order (Regional #009E73, Local #C475FD, Express
    #4467A3), identical across themes; all chrome follows the theme tokens'
  - Native SVG <title> tooltips on edges, labels and nodes give the full route details
    in the HTML view
  weaknesses:
  - 'VQ-02 (both): the bowed Express arcs EX1 and EX2 run behind the R20, R21, L22
    and L23 label boxes in the Central–Eastport–Harborside corridor, so those labels
    sit on a second edge and it is less plain which edge each belongs to → keep every
    route label clear of edges other than its own (for example a smaller Express bow
    or a different labelT for the Express labels; station positions unchanged). Likely
    cause: ROUTE_TYPE_STYLES.Express bowShare 0.28 combined with the fixed perpendicular
    label offset (boxW * 0.5 + 10, 22 px).'
  - 'DQ-03 (code): the run times contradict the km offsets. Express EX1 covers Central→Harborside
    (5.6 km) in 28 min, about 12 km/h, while Regional R10 covers 2.4 km in 7 min,
    about 21 km/h, so the Express is the slowest service and saves only 1 min over
    R20 + L22 (29 min) → Express run times of about 12–15 min (−13 to −16 min). Likely
    cause: the EX1/EX2 Arrival values in the data block.'
  - 'CQ-04 (code): lines 81–89 build routeTypes and typeColorMap with hand-written
    loops → [...new Set(data.map((d) => d[ROUTE_TYPE]))] and Object.fromEntries(routeTypes.map((rt,
    i) => [rt, t.palette[i]])), as the library prompt''s data-block section prescribes.
    Likely cause: an imperative style instead of the prescribed idiom.'
  - 'Suggestion: MUI X''s ChartsTooltip could replace the SVG <title> hovers for styled
    route details in the HTML view.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, square 2400x2400 canvas.
      Chrome: bold dark title "network-transport-static · javascript · muix · anyplot.ai" centered at the top (about 57 % of the width); below it a legend row "Service type: — Regional, — Local, - - Express" in soft ink; a soft-ink caption at the bottom explains the arrows, labels and hub. All text is dark and readable.
      Data: 9 stations in a cross layout (Central hub as a large filled-ink disc with its white name; the others are outlined circles with bold codes UPT, NJC, WBK, WFD, EPT, HBS, SGT, SPK and their names beside them). 18 directed curved edges in outbound and return pairs: Regional in #009E73 (Central to NJC, EPT, WFD, SGT), Local in #C475FD on the outer links, and Express in dashed #4467A3 as wide arcs from Central to HBS above and below the Eastport corridor. Every edge has an arrowhead at the destination border and a label such as "R10 07:05→07:12" on a light backing box. The Express arcs pass behind the R20/R21/L22/L23 labels.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, legend labels, station names and codes switch to light ink; the caption and the legend title are soft light grey; the route-label boxes use the #242420 elevated fill with light text. No dark-on-dark text.
      Data: edge colors are identical to the light render (green, lavender, dashed blue); the node outlines flip to light ink, and the Central hub becomes a light disc with dark text. Brand green stays clearly visible.
      Legibility verdict: PASS
