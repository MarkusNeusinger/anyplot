review:
  strengths:
  - 'Every station sits at its given x/y: hidden linear xAxis/yAxis in ChartsContainer
    plus useXScale/useYScale map the schematic km offsets to pixels, with no layout
    algorithm involved'
  - Each direction of a station pair gets its own quadratic curve with its own arrowhead,
    colour and label. The labels are offset outward along each curve's normal, so
    it is clear which edge a label belongs to
  - 'Route type is encoded twice, by Imprint colour (Regional #009E73, Local #C475FD,
    Express #4467A3) and by dash pattern for Express. A legend names all three, so
    the encoding survives CVD and greyscale'
  - Station names go into the largest angular gap between a station's edges, so no
    name sits on an edge. The Central interchange stands out as an inverted, larger
    node with its name inside
  - Theme tokens drive all chrome (ink, inkSoft, elevatedBg label plates, pageBg).
    Data colours are identical in both renders, and the dark render has no dark-on-dark
    text
  - SVG <title> tooltips on edges, labels and nodes give full route details (origin
    → destination, times, service type) in the HTML view, as the spec's tooltip note
    asks
  weaknesses:
  - 'VQ-02 (both): the dashed Express curves EX1/EX2 are painted over the label plates
    of R20, R21, L22 and L23 and cut through the text ''07:00'', ''07:20'', ''07:33''
    and ''07:55'' → no edge stroke may cross any route label. Likely cause: each route''s
    path and label are drawn in one <g> per route in data order, so the routes drawn
    later (Express) paint over the labels of earlier ones. Render all edge paths first,
    then all label rects and texts in a second pass.'
  - 'VQ-02 (both): the bold 14 px code ''WBK'' is wider than its 19.8 px-radius node,
    and its letters touch the circle''s 2 px outline → the code fits inside the node
    with ≥3 px clearance. Likely cause: radius = BASE_STATION_RADIUS + degree × DEGREE_RADIUS_STEP
    ignores the code''s text width. Size the radius from the code length, or use a
    smaller code font.'
  - 'VQ-05 (both): the network fills only about 62 % of the chart band''s height,
    with empty bands of about 230 px above ''Uptown'' and about 200 px below ''Southpark''
    → the outermost labels within about 60 px of the band edges. Likely cause: DOMAIN_SPAN_MULT
    = 1.3 padding applied to a square domain built from the larger span.'
  - 'Suggestion: the label plates (elevatedBg at 0.94 opacity) are hard to see on
    the light page. A thin ink-soft outline or a slightly stronger plate would make
    the label groups easier to scan.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole 2400×2400 canvas.
      Chrome: bold centred title "network-transport-static · javascript · muix · anyplot.ai" in dark ink. Below it, an HTML legend row "Service type: — Regional, — Local, - - Express", and at the bottom a grey caption explaining arrows, label format and the Central interchange. All of it is readable dark text.
      Data: 9 stations at schematic coordinates in a cross-shaped network. Central is a large near-black filled hub with "Central" in cream. The other 8 stations are small outlined circles with bold three-letter codes and their names beside them in the largest free gap. There are 18 directed curved edges, two per station pair (one per direction), each with an arrowhead at the destination node border: Regional in brand green #009E73, Local in lavender #C475FD, Express in dashed blue #4467A3 bowing widely around EPT. Each edge carries a label such as "R10 07:05→07:12" on a faint plate. The dashed Express curves cross the R20/R21/L22/L23 label texts, and "WBK" touches its node outline.
      Legibility verdict: PASS (all text is readable; there are a few edge-over-label collisions)

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, legend text, station names and edge labels all flip to light ink. The caption and the "Service type:" prefix use the soft grey ink. No dark-on-dark text anywhere. Label plates are visible as slightly lighter dark rectangles.
      Data: edge colours (green, lavender, dashed blue) are identical to the light render. Station circles are dark-filled with light outlines and light codes. The hub inverts to a cream fill with a dark "Central" label. The same Express-over-label collisions and the tight "WBK" fit appear here.
      Legibility verdict: PASS
