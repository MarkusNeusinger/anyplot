review:
  strengths:
  - Opposite-direction routes between the same station pair are drawn as separate
    geom_curve arcs, each with its own arrowhead and label
  - Edges are shortened by the node radius so every closed arrowhead is visible at
    the destination station's border
  - All 12 station names shown above their nodes in elevated label boxes, readable
    in both themes
  - Route type mapped to color through scale_color_manual in Imprint order with a
    named legend; chrome tokens flip correctly between themes
  - Exact 3200×1800 canvas via ragg::agg_png with nothing clipped
  weaknesses:
  - 'VQ-02, SC-02 (both): about eight of the 30 edge labels are partly hidden — LO01
    under LO06, RE04 under RE10, EX02 under RE13, RE09 under EX03 (only ''11:45''
    left), RE15 under the Suburb 1 station label, RE16 under the Suburb 2 label, EX04
    on the East Plaza node and under another label → every route label fully readable
    and clear of station nodes and labels (−8 collisions). Likely cause: labels placed
    at a fixed curve bulge (CURV 0.18) with 1.7 mm text and a short canvas span, so
    labels of edges sharing a corridor land on top of each other; a larger plot span
    and curvature per edge pair reduce it.'
  - 'VQ-01 (both): edge labels at geom_label size 1.7 mm (≈ 4.8 pt) read small beside
    the 7.4 pt station labels → at least 2.5 mm (+0.8 mm), the library prompt''s annotation
    floor. Likely cause: geom_label(size = 1.7) for routes.'
  - 'VQ-05 (both): the network fills only about 45 % of the canvas width, with empty
    bands left and right of it → spread the stations over more of the landscape canvas
    (for example x coordinates over a wider range or the square canvas). Likely cause:
    coord_fixed(ratio = 1) on a 9 × 10 coordinate box on a 16:9 canvas.'
  - 'DQ-02 (both): station names ''Suburb 1'', ''Suburb 2'', ''Suburb 3'', ''Junction''
    read as placeholders → named places (e.g. ''Lindenau'', ''Riverside''). Likely
    cause: the stations label vector.'
  - 'CQ-03 (code): library(tidyr) is loaded but never used → remove it. Likely cause:
    leftover import.'
  - 'Suggestion: list all eight Imprint hues in IMPRINT and pick by route type, as
    the style guide asks, instead of a three-hue vector.'
  - 'Suggestion: thicker edges (linewidth ~0.6) would let the route colors read more
    clearly at the hubs.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, correct.
      Chrome: title 'network-transport-static · r · ggplot2 · anyplot.ai' dark, centered above; 12 station names in boxed dark labels above hollow nodes; 'Route Type' legend box on the right with Express/Local/Regional; no axes or grid. All readable, edge labels small (~4.8 pt).
      Data: 30 curved directed edges — Regional #009E73 green, Express #C475FD purple, Local #4467A3 blue — with small closed arrowheads at node borders; each edge carries a boxed label such as 'RE01 | 08:15 → 08:45'. Opposite routes between a pair bow apart. Several edge labels collide (LO01/LO06, RE04/RE10, EX02/RE13, EX03/RE09) and RE15/RE16 sit under the Suburb 1/2 labels.
      Legibility verdict: PASS (text readable, but some edge labels partly hidden by overlap)

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17, correct.
      Chrome: title, station labels and edge labels in light text on dark elevated boxes; legend text light grey on a dark box; no dark-on-dark text.
      Data: edge colors identical to the light render (green/purple/blue); node outlines flip to light grey; same overlaps as light.
      Legibility verdict: PASS
