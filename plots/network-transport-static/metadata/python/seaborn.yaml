review:
  strengths:
  - Every station sits at its provided x/y; route labels are slid only along their
    own edge, so each label is plainly attributable and none collide with each other
    or with station names
  - Route-label boxes are outlined in their route color, tying each label to its edge
    and the legend
  - Canonical 3200x1800 canvas with theme tokens threaded through sns.set_theme rc;
    both renders are theme-correct
  - Imprint palette in canonical order with brand green for the first route type;
    legend names all three types
  weaknesses:
  - 'VQ-02, SC-02 (both): the station-name boxes, drawn above each node at zorder
    11, cover the last stretch and the arrowhead of six incoming edges (B→D under
    ''West Junction'', D→H under ''Industrial Zone'', C→G under ''Airport'', G→J under
    ''Harbor'', E→I and F→I under ''University''), so C3''s arrowhead at the destination
    border is not visible for 6 of 15 routes → keep every arrowhead clear of the name
    boxes, e.g. place each name on the node side with no incoming edge or shrink the
    edge by the name box''s height. Likely cause: fixed label offset sy + label_gap
    with va=''bottom'' for every station, combined with shrinkB=13.'
  - 'VQ-01 (both): route labels at 6.5 pt and station names at 7.5 pt sit below the
    style guide''s 8 pt text reference and read small beside the 12 pt title → 8 pt
    (+1.5 pt / +0.5 pt). Likely cause: ax.text fontsize=6.5 and fontsize=7.5.'
  - 'CQ-01 (code): a helper function overlap() is defined for the label search → inline
    the overlap arithmetic or compute it vectorised with numpy. Likely cause: def
    overlap(a, b) at line 129.'
  - 'CQ-04 (code): row[df.columns.get_loc(X)] is repeated about twelve times across
    lines 123-224 → iterate df.to_dict(''records'') / stations.to_dict(''records'')
    and read row[X]. Likely cause: itertuples with positional lookup.'
  - 'Suggestion: emphasise the hub (Central Station) with a larger node to give the
    diagram a focal point.'
