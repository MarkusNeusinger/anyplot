      Data: 10 green (#009E73) station nodes with white outline at schematic coordinates (central hub with cross arms, four corners, Stadium south-east of Central); 16 directed edges with closed arrowheads colored by type — Express #009E73, Regional #C475FD, Local #4467A3; two parallel offset Central → East edges (RE2, RE5); every edge labeled "ID | dep → arr" in its color. S1/S2 labels cross the RB4 line; RE1/RB7/RB3 arrowheads end in the North/University/Airport labels; legend keys show a stray 'a' glyph.
      Legibility verdict: PASS

