review:
  strengths:
  - Every station sits exactly at its provided schematic x/y coordinate; edges are
    trimmed with a vectorized clearance (NODE_CLEARANCE / length) so the closed arrowheads
    stop short of the destination node
  - The two Central → East routes (RE2, RE5) fan out as parallel offset edges via
    a groupby rank/size spread, each with its own arrowhead, and each label sits on
    the outer side of its own edge
  - Edge labels follow the 'RE 42 | 08:15 → 09:30' format and are colored like their
    edge, with the Route Type legend naming Express / Regional / Local in canonical
    Imprint order
  - layer_tooltips() builders give edges (route, from → to, departure, arrival, type)
    and stations their own hover cards in the HTML export
  - Canonical 3200×1800 canvas with theme tokens threaded through page, title, station
    labels and legend; both renders theme-correct
  weaknesses:
  - 'VQ-02 (both): the S1 and S2 edge labels (''10:12'', ''10:30'') run across the
    purple RB4 edge line, and the West, Central and East station labels sit on their
    own outgoing vertical edges → labels clear of every edge line by at least a few
    px. Likely cause: station labels placed with nudge_y=-0.055 straight into the
    path of the vertical edges, and LABEL_OFFSET=0.055 too small for the S1/S2 labels
    next to the RB4 edge; a smaller label offset into empty space or nudge_x for station
    labels fixes it without moving any node.'
  - 'SC-02 (both): the RE1, RB7 and RB3 arrowheads end inside the North, University
    and Airport name labels instead of at the border of the destination node (C3)
    → arrowhead clear of the label at the node''s border. Likely cause: station labels
    nudged below the node (nudge_y=-0.055) on stations that receive an edge from below.'
  - 'VQ-03 (both): the Route Type legend draws a letter ''a'' over every line sample,
    a glyph from the edge-label text layer that matches no mark → line samples only.
    Likely cause: geom_text(... color=ROUTE_TYPE) without show_legend=False.'
  - 'VQ-01 (both): legend text at 8 pt and legend title at 9 pt, below the library
    prompt''s 10 pt legend reference, read small beside the 14 pt bold station names
    → 10 pt (+2 pt) and 11 pt (+2 pt). Likely cause: legend_text=element_text(size=8),
    legend_title=element_text(size=9).'
  - 'DQ-02 (both): five of ten stations are named by compass direction only (Central,
    North, East, South, West), which reads as a generic placeholder network → town
    or district names (e.g. ''Hauptbahnhof'', ''Nordstadt''). Likely cause: the station_table
    labels.'
  - 'Suggestion: line width or weight could separate Express from Local routes as
    a second cue beside color.'
  image_description: |-
