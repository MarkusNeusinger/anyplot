review:
  strengths:
  - Every one of the 24 routes carries its 'ID | dep→arr' label rotated along its
    own edge over a page-colored halo, kept upright for any heading
  - Arrowheads land at each destination node's border via trimmed edges and an angle
    channel with scale=None
  - Parallel routes of a station pair are offset perpendicular to each other with
    direction-aware sign, each with its own arrowhead and label
  - Equal-aspect explicit scales computed from the station box keep the schematic
    geometry true
  - Station names are placed on the side of each node that its routes leave free
  - Native Altair tooltips with route, departure, arrival and type in the HTML output
  weaknesses:
  - 'VQ-02 (both): the RB2 (Tech Campus → East Junction) route label crosses both
    RE2 labels where the edges intersect, hiding part of ''RE2 | 08:00→08:45'' → no
    label-on-label collision. Likely cause: every label sits at its edge midpoint
    (mid_x/mid_y) regardless of crossings; shift that label''s position along its
    own edge (e.g. a per-edge fraction other than 0.5) rather than moving any station.'
  - 'VQ-01 (both): the 24 route labels at fontSize 7.5 (≈30 source px) sit below the
    10 px reference for annotation text and read small beside the 9.5–11 px station
    text → about 9 px (+1.5). Likely cause: mark_text(fontSize=7.5) in label_halo/label_text.'
  - 'CQ-01 (code): the helper function `xy()` at lines 169–170 breaks the no-functions
    structure rule → inline the two encodings or bind x/y channel objects to constants.
    Likely cause: the def xy(x, y) helper.'
  - 'Suggestion: the RE2 (Central Station ↔ Airport) pair could take a distinct emphasis
    as the longest express link.'
