review:
  strengths:
  - FancyArrowPatch with patchA/patchB set to the station Circle patches ends every
    arrow exactly at the destination node's border, so each arrowhead is visible (C3)
  - 'Two-way station pairs separate cleanly: one arc3 curvature with reversed endpoints
    puts the two directions on opposite sides, each with its own arrowhead and label
    (C5)'
  - Each route label is positioned on its own curve via the arc3 Bezier and framed
    in its route-type color, so it is plain which edge it belongs to (C4)
  - Canonical 2400×2400 square canvas with equal aspect; Imprint palette in canonical
    order and theme tokens threaded through every chrome element in both renders
  - Data block is a tidy one-row-per-route DataFrame with stations derived from it,
    ready to swap for a real timetable
  weaknesses:
  - 'VQ-01 (both): tick labels at 7 pt, legend text at 7 pt and axis titles at 9 pt
    sit 1 pt below the style guide''s 8 / 8 / 10 pt references → 8 / 8 / 10 pt (+1
    pt each). Likely cause: tick_params labelsize=7, legend fontsize=7, set_xlabel/set_ylabel
    fontsize=9.'
  - 'VQ-02 (both): the ''Central'' station label and the ''RE2 06:10→06:28'' edge
    label nearly touch (about 5 px gap) right of the hub → a clear gap of at least
    15 px (+10 px). Likely cause: station label at fontsize 8 directly below the hub
    plus the RE2 label at t=0.38 on rad=0.28; a smaller label t or a lower station-label
    offset at the hub.'
  - 'DQ-02 (both): stations named Central, North, East, South and West read as generic
    compass placeholders → plausible place names for a regional network (e.g. a Hauptbahnhof
    plus town names). Likely cause: the stations dict keys.'
  - 'Suggestion: slightly larger arrowheads would make the travel direction read faster
    on the long S-Bahn spurs.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the full 2400×2400 square canvas.
      Chrome: title 'network-transport-static · python · matplotlib · anyplot.ai' in dark ink at the top (~80 % of the width), axis titles 'Relative position (west → east)' / '(south → north)', 0.0–1.0 ticks in soft ink, faint grid, top/right spines removed; legend below the axes with Regional Express (RE), Airport Service (AIR), S-Bahn (S). All readable.
      Data: nine hollow station circles with dark outlines and bold dark names below them, laid out as a 3×3 schematic grid around the Central hub. Green #009E73 RE arcs curve apart for each two-way pair Central–North/East/South/West, purple AIR arcs between Central and Airport, blue S-Bahn straight edges around the outer ring. Every edge ends at the node border with a small arrowhead; every edge carries a 'RE1 06:00→06:18'-style label in a box framed in its route color, placed on its own curve. 'Central' and the 'RE2 06:10→06:28' label nearly touch.
      Legibility verdict: PASS

