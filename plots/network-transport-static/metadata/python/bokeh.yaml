review:
  strengths:
  - Every station sits at its provided coordinates, and arrows are shortened so the
    VeeHead arrowhead lands at the destination node
  - Route labels rotate along their edges and stay upright, with a backing box that
    keeps them legible in both themes
  - Route colors derived from route type in Imprint order, identical across both renders
  weaknesses:
  - 'VQ-05 (both): the saved PNG is 4800x2561 instead of a canonical canvas → 3200x1800
    (−1600 × −761). Likely cause: figure(width=4800, height=2700) and a Selenium window
    of the same size without the Emulation.setDeviceMetricsOverride viewport pin,
    so the headless title bar crops the height.'
  - 'VQ-01 (both): the title at 28pt, and the station and route labels at 18pt, on
    a 4800-px canvas read small and fill only about a fifth of the width (title) →
    on a 3200x1800 canvas the bokeh references, title 50pt and label text near 34pt.
    Likely cause: p.title.text_font_size="28pt" and the 18pt Label/LabelSet sizes.'
  - 'VQ-02, SC-02 (both): Central Station, East Junction and Downtown share y=1350,
    so the EX 1 Central Station→Downtown edge runs through the East Junction node
    and over both RE 30 edges, and its label runs into RE 30 | 06:30→07:00 as one
    string → an edge and label each route plainly owns (C4). Likely cause: the collinear
    station coordinates in the data.'
  - 'SC-02 (code): no hover tooltips with full route details although the Notes ask
    for them where supported and bokeh supports them → a HoverTool over the route
    edges. Likely cause: tools="" and edges as Arrow annotations, which carry no hover.'
  - 'CQ-04, LM-01 (code): a sys.path workaround needing five noqa comments (lines
    13–21) and a legend hand-built from scatter + Label pairs at typed coordinates
    (lines 217–231) → drop the workaround and use legend_label on one glyph per route
    type. Likely cause: the script was named bokeh.py and the native legend was not
    used.'
  - 'Suggestion: emphasize the hub station with a larger node to give the diagram
    a focal point.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, canvas 4800x2561
      Chrome: small 28pt title centered at the top, dark bold station names below each node, a hand-built legend (three colored dots with labels) in the top-right corner; all text dark and readable but small for the canvas
      Data: 12 station nodes as off-white circles with dark outlines; 19 directed arrows colored by type, RE #009E73, S-Bahn #C475FD, EX #4467A3, each with a rotated 'route | dep→arr' label; Central Station, East Junction and Downtown lie on one line, so the EX 1 edge runs through East Junction and its label runs into the RE 30 label
      Legibility verdict: PASS (text readable, but small)

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17 with a faint frame line around the plot area
      Chrome: title, station names and legend labels in light ink, all readable; no dark-on-dark text
      Data: same colors and geometry as the light render; label backings in the elevated dark tone
      Legibility verdict: PASS
