review:
  strengths:
  - Every station sits at its given coordinates and edges stop short of the nodes
    so arrowheads stay visible
  - Theme tokens flip the chrome correctly; data colors identical in both themes
  weaknesses:
  - 'VQ-05 (both): the canvas is 4800x2700 → 3200x1800 (−1600 × −900). Likely cause:
    plot.save with dpi=300 at figure_size=(16, 9) instead of 8x4.5 in at dpi 400.'
  - 'VQ-02 (both): the labels of opposite-direction services (RE1, RE2, RE3, RE4,
    AE1 pairs) print on top of each other and cannot be read → each label readable
    on its own. Likely cause: the offset counts cumcount per ordered source/target
    pair, so the return service gets offset 0 like the outbound one.'
  - 'VQ-07 (both): the first route type is blue #4467A3 and the Regional routes use
    #AE3030, the red loss anchor → Imprint positions 1-4 in data order starting with
    #009E73. Likely cause: the hand-written route_colors dict.'
  - 'SC-02 (both): opposite-direction services of a station pair share one line and
    read as a single double-headed arrow (C5) → a separate offset or curved edge per
    service, each with its own arrowhead and label. Likely cause: route_pairs grouped
    by ordered (source, target) rather than the unordered pair.'
  - 'DQ-02 (both): the stations are named Central, North, South, East, West, Northeast…
    → real-sounding place names for a fictional network. Likely cause: the stations
    label list.'
  - 'CQ-01 (code): the file has no column-0 # Data marker → one block between column-0
    # Data and # Plot markers that ends by binding df, with no plotting, styling or
    theme token inside and no plotting call above it. Likely cause: the data generation
    is not marked as one block.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, canvas 4800x2700, no axes.
      Chrome: bold dark title at the top; 12 bold dark station names (Central hub, North, South, East, West, Northeast, Northwest, Southeast, Southwest, Airport, University, Industrial); 'Route Type' legend with a thin frame touching the right canvas edge. Text readable except where edge labels overprint each other.
      Data: 24 directed edges with large closed arrowheads, colored RE blue #4467A3, RB red #AE3030, AE purple #C475FD, S green #009E73, with colored 'ID | hh:mm→hh:mm' labels. Opposite-direction services share one line, so pairs read as double-headed arrows; their labels are stacked on top of each other (RE1, RE2, RE3, RE4, AE1) and cannot be read.
      Legibility verdict: FAIL (overprinted edge labels)

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, station names and legend title in light ink, legend entries in soft grey; no dark-on-dark text.
      Data: edge colors identical to the light render; the same stacked labels.
      Legibility verdict: FAIL (overprinted edge labels)
