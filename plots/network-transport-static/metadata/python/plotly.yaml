      Data: 11 hollow circular nodes with dark outlines at schematic coordinates; 19 straight directed edges with arrowheads at the destination border — Express #009E73 (first series), Regional #C475FD, Local #4467A3. Each edge carries a rotated label (bold route id, then departure→arrival) boxed in the route color. RE 12 and EX 01 label boxes near Downtown touch at their corners.
