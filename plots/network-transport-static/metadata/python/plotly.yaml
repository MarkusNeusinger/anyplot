review:
  strengths:
  - Every station sits at its provided coordinates and carries a bordered name label
    placed on the side with the fewest edges, so no name sits on an edge
  - Route labels run along their own edges with the route id in bold over the times,
    boxed in the route color, so each label is plainly tied to its edge and clear
    of the nodes
  - Arrowheads stop just outside the destination node border and stay visible in both
    themes
  - Theme tokens threaded through text, label boxes, node fills and the legend; data
    colors identical in both renders
  - 'Native plotly interactivity: hovertext with full route details on every edge,
    station names on hover, and legendgroup toggling all routes of a type in the HTML'
  weaknesses:
  - 'VQ-01 (both): route labels at 7.5 px and station labels at 9 px sit below the
    style guide''s 10 px reference, and the route times read small beside the 18 px
    title → route labels about 9 px (+1.5 px), station labels 10 px (+1 px). Likely
    cause: font=dict(size=7.5) on the route annotations and size=9 on the station
    annotations.'
  - 'VQ-02 (both): the RE 12 (East Harbor → Downtown) label box and the EX 01 (Downtown
    → Airport) label box touch at their corners right of Downtown → leave at least
    3 px between them. Likely cause: LABEL_PX=12 places both labels on the same side
    of two converging edges near the hub.'
  - 'CQ-01 (code): a label_shift() helper function wraps the station-label side choice
    → inline the loop at the station-label annotation. Likely cause: the side search
    was written as a function.'
  - 'CQ-04 (code): every entry of sides carries a constant 0.0 third element that
    the min key adds (+ c[2]) to no effect → drop the third element and the addition.
    Likely cause: a removed per-side penalty left behind.'
  - 'Suggestion: emphasise the Downtown hub, for example with a slightly larger node,
    to give the map a focal point.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white #FAF8F1 across the full 3200x1800 canvas.
