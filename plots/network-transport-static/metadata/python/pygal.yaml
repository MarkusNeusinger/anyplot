review:
  strengths:
  - Every station at its provided x/y coordinates, every route a directed edge with
    an arrowhead stopping at the destination node's border
  - Each edge label 'RE 5 | 07:30 → 07:55' sits on an elevated chip outlined in its
    route color at the edge midpoint, so it is plain which edge it belongs to
  - 'Theme tokens threaded through every element: both renders are fully readable
    with identical Imprint data colors'
  - Native SVG <title> tooltips on every edge and station in the HTML output
  weaknesses:
  - 'VQ-01 (both): edge labels at 24 px, station names and legend entries at 28 px,
    far below pygal''s 44 px legend/tick reference, read small beside the 58 px title
    → about 36 px for edge labels and 40–44 px for station names and legend entries
    (+12 to +16 px), with the name and label boxes widened to match. Likely cause:
    font-size "24" on the route labels and "28" on the station names and legend text.'
  - 'VQ-02 (both): North Park''s name box covers most of the RE 1 arrowhead arriving
    from Central Station, and the F→G, G→H and E→I edges run underneath their source''s
    name box → keep arrowheads and edges clear of the name chips, e.g. by placing
    each name chip on the side of the node away from its edges or shortening edges
    at the chip. Likely cause: name boxes drawn at a fixed y + NODE_R + 8 below every
    node, on top of the edge group.'
  - 'VQ-05 (both): ''Tech Campus'' overflows its name box on both sides, and a ~300
    px empty band lies between the subtitle and the topmost nodes while the bottom
    is tight → box width from the actual text length and MARGIN_TOP reduced by about
    120 px. Likely cause: box_w = 15.5 * len(name) + 30 underestimates wide glyphs;
    MARGIN_TOP = 170 plus node y = 0.18.'
  - 'CQ-01 (code): line 35 tags `TARGET` with the role `routes` that `SOURCE` already
    has; 7 more at lines 36–42, and a helper function to_svg (lines 71–72) → one string
    constant per required column role with a trailing # role: <role> comment naming
    a spec role, and the coordinate transform inlined as plain expressions. Likely
    cause: two constants for one role; a helper def.'
  - 'LM-01, LM-02 (code): no pygal call anywhere — the diagram is hand-built SVG through
    ElementTree and cairosvg, so the file never uses the library it is filed under
    → build the chart with a pygal chart class (e.g. pygal.XY with stroke for edges,
    nodes as a dot series, Style for theme tokens) and draw only what pygal cannot
    (arrowheads, edge labels) into its SVG. Likely cause: the network type treated
    as outside pygal''s scope.'
  - 'Suggestion: bolding the hub station University''s name chip would give the network
    a focal point.'
  image_description: |-
