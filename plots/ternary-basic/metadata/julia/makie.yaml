    verified: all three vertices (Iron, Chromium, Nickel) map exactly onto the equilateral
    triangle corners'
  - 'Palette and theme compliance are pixel-exact — sampled colors confirm data points
    at #009E73 and backgrounds at #FAF8F1 (light) / #1A1A17 (dark) in both renders'
  - 'No edge clipping: title and all three vertex labels ("Iron (Fe)", "Chromium (Cr)",
    "Nickel (Ni)") sit with comfortable margin inside the canvas, verified via corner
    crops'
  - Realistic, neutral domain (stainless-steel alloy composition) directly matching
    the spec's suggested "chemical/material composition" application, with iron/chromium/nickel
    always summing to 100%
  - 'Spec-requested features all present: 20% interval grid lines parallel to each
    edge, clearly labeled vertices, and edge tick labels (20/40/60/80) to aid reading
    proportions'
