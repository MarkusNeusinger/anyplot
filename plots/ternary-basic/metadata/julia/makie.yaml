      Data: Same 90 markers in the identical #009E73 brand green — confirmed unchanged from the light render (only chrome flipped, as required). Cluster position and spread are pixel-identical to the light render.
      Legibility verdict: PASS — all text (title, vertex labels, tick labels) reads clearly on the dark surface; brand green remains highly visible against both surfaces.
