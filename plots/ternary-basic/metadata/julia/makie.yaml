  - 'Verify the alpha=0.85 fill on the main scatter series actually renders as intended:
    in the densest cluster region, most green pixels sample as exact #009E73 rather
    than a blend with background, which is consistent with heavy marker overlap saturating
    the alpha but is worth double-checking against a lower-density subset.'
  - Before pushing the next fix, render locally and inspect the actual PNG pixels
