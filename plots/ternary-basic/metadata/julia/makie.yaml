    Random.seed!(42) for reproducibility, and correct plot-$(THEME).png output for
    both themes
  weaknesses:
  - 'DE-03 Data Storytelling: all 90 points share identical size, color, and opacity
    with no focal point or emphasis — consider a subtle alpha (~0.85) or size cue
    to highlight cluster density, or annotate a reference composition (e.g. typical
    304 stainless) to give the reader an anchor'
  - 'VQ-03: the alloy-composition cluster is fairly dense in its core; markersize=12
    with strokewidth=1 is a reasonable baseline but some points still overlap in the
    densest region — try alpha≈0.85 on the scatter fill (keep the PAGE_BG stroke)
    to make overlapping points distinguishable'
  - 'LM-02: the implementation is solid but generic manual Makie primitive usage (scatter!/lines!/text!)
    — nothing here is distinctly Makie-only. Consider leveraging a Makie-specific
    touch (e.g. GeometryBasics.Point2f for the geometry, or Label/Colorbar-driven
    density encoding) to demonstrate library-specific strength'
  - Title occupies only ~35% of canvas width at titlesize=20 — there is room to grow
    it slightly for stronger visual hierarchy against the vertex labels without risking
    overflow
