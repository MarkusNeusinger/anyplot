review:
  strengths:
  - Fully custom ternary-coordinate implementation (triangle outline, 10% interval
    grid lines, edge tick marks at 20% intervals, bold vertex labels) built correctly
    from scratch despite seaborn/matplotlib having no native ternary support
  - 'Theme-adaptive chrome is correct and consistent: identical #009E73 data color
    and axis geometry between light and dark renders, all text legible in both themes'
  - Correct canvas size (2400x2400 square via figsize=(6,6) dpi=400), correct mandated
    title format, clean KISS code structure, reproducible via np.random.seed(42)
  - Data correctly enforces the sum-to-100% ternary constraint via a Dirichlet distribution,
    producing a naturally spread point cloud across the simplex
  weaknesses:
  - 'Library Mastery is very low: the entire chart (triangle, grid, ticks, and the
    data points themselves) is drawn with raw matplotlib (ax.plot/ax.scatter/ax.text);
    seaborn is only used for sns.set_theme() styling. Replace the point layer with
    sns.scatterplot(data=scatter_df, x=''x'', y=''y'', ax=ax, color=BRAND, s=100,
    alpha=0.7, edgecolor=PAGE_BG, linewidth=0.75, legend=False) so the implementation
    actually exercises seaborn''s plotting API, not just its theming.'
  - Marker size s=50 is below the style-guide density table's recommended s=100-200
    for 30-100 points (n=50 here) — increase marker size for better element visibility
    (VQ-03).
  - 'Domain/factual-accuracy issue (DQ-03): real Portland cement is not mixed from
    Limestone/Clay/Gypsum in comparable 20-70% proportions — gypsum is added at only
    ~3-5% as a set retarder during grinding, not blended into the raw meal alongside
    limestone and clay at high percentages. Either switch the three components to
    a domain that genuinely spans 0-100% for all three axes (e.g. soil texture: sand/silt/clay,
    or alloy/market-share composition), or rework the generative process and labels
    to reflect real cement raw-meal proportions (limestone dominant ~75-85%, clay
    ~10-15%, correction material single digits) if the cement framing is kept.'
  - Data Storytelling (DE-03) is at the default level — the point cloud has no visual
    hierarchy, highlighted region, or annotation calling out a target/typical composition
    zone, so the viewer has to find their own insight.
  - Title spans close to ~90% of canvas width — within the mandated long-title allowance
    but at the edge of it; slight extra top-margin between title and the triangle
    top vertex also leaves the layout a bit top-heavy (VQ-05).
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "Cement Composition · ternary-basic · python · seaborn · anyplot.ai" in dark ink at the top, fully visible and not clipped. A bold-outlined equilateral triangle with subtle (alpha 0.15) internal grid lines at 10% intervals, edge tick marks with "20%/40%/60%/80%" labels at 20% intervals on all three sides, and bold vertex labels "Limestone (100%)" (bottom-left), "Clay (100%)" (bottom-right), "Gypsum (100%)" (top). All chrome text renders in dark ink against the light background — clearly readable.
      Data: ~50 green (#009E73) circular markers scattered across the interior of the triangle, each with a subtle light-colored edge stroke (matches page background) for separation; markers cluster mostly in the central/lower half of the simplex with a few points reaching toward mid-high Gypsum values, none touching a pure-100% vertex.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title, triangle outline, grid, tick labels, and vertex labels as the light render, all now rendered in light ink (off-white) against the dark background. No dark-on-dark or unreadable text was found — title, tick percentages, and vertex labels are all clearly legible.
      Data: Same ~50 markers in the identical positions and identical #009E73 green as the light render — confirms data colors are unchanged between themes; only the chrome (background + text) flips.
      Legibility verdict: PASS
