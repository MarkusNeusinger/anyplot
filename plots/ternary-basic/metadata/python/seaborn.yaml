review:
  strengths:
  - 'Correct manual ternary construction: triangle outline, 10% simplex grid lines,
    20%-interval edge tick marks, and all three vertex labels (Sand/Silt/Clay) are
    present and geometrically accurate.'
  - sns.kdeplot density backdrop is properly clipped to the simplex via a Polygon
    clip path — a genuine statistical/distinctive seaborn feature that gives the point
    cloud visual hierarchy instead of a flat scatter.
  - Centroid ('Mean composition') diamond marker plus leader-line annotation gives
    the chart a clear focal point and a guided narrative beyond a plain point cloud.
  - 'Imprint palette compliance: brand green (#009E73) is identical between light/dark
    renders, imprint_seq colormap used for the density fill, and theme-adaptive chrome
    tokens (PAGE_BG/INK/INK_SOFT) are threaded through every element in both themes.'
  - Clean, reproducible, KISS-structured code — seed=42, no functions/classes, all
    imports used, correct plot-{THEME}.png output naming.
  - Correctly uses a square 2400x2400 canvas, appropriate for this symmetric plot
    type, and the mandated title format with a sensible descriptive prefix.
  weaknesses:
  - 'Title occupies ~99% of the canvas width in both renders (measured bbox: x=12..2384
    of 2400px, only ~12-16px margin on each side) at fontsize=12 with the ''Soil Texture
    Classification ·'' prefix — not clipped, but dangerously close to the edge. Reduce
    title fontsize to ~10-10.5pt on this square canvas, or shorten/drop the descriptive
    prefix, to bring the title back into a safer proportion with real breathing room.'
  - The 'Mean composition' annotation leader line is routed straight through one of
    the nearby data markers (the point cluster near x~0.68, y~0.32 in data coordinates),
    partially obscuring it. Bend the leader line's path (adjust textcoords/connectionstyle
    or the elbow point) to route around that cluster instead of through it.
  - Dirichlet(alpha=[1,1,1]) generates points uniformly across the entire simplex,
    including near-pure single-component samples close to each vertex. Real soil rarely
    reaches those extremes for a 'soil texture classification' framing — a mildly
    peaked Dirichlet (e.g. alpha slightly > 1, or means clustered around common USDA
    texture classes) would read as more realistic domain data while still giving full
    simplex coverage.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (~#FAF8F1), consistent across the full 2400x2400 canvas — no pure-white areas.
      Chrome: Title "Soil Texture Classification · ternary-basic · python · seaborn · anyplot.ai" reads clearly in dark ink at the top, though it spans ~99% of the canvas width (measured bbox 12-2384px of 2400px) — very tight margins, right at the edge of overflow but not clipped. Bold vertex labels "Sand (100%)" (bottom-left), "Silt (100%)" (bottom-right), and "Clay (100%)" (top apex) are all clearly legible in dark ink. Edge tick labels (20%/40%/60%/80%) along all three sides are legible gray text, well clear of the canvas border. Thin 10%-interval grid lines inside the triangle are subtle (INK @ alpha 0.15) but visible against the light KDE-shaded backdrop.
      Data: A green (#009E73) KDE density fill (via imprint_seq colormap, green-to-blue-gray) sits behind ~50 green scatter points with light-bg-colored edge strokes, correctly clipped to the triangle. A black diamond marks the mean composition, connected by a thin leader line to a "Mean composition" label — the line unfortunately crosses over one nearby data point. All text is readable against the light background; no light-on-light issues observed.
      Legibility verdict: PASS (title proportion is a VQ-05 concern, not a legibility failure — all text remains crisp and readable)

    Dark render (plot-dark.png):
      Background: Warm near-black (~#1A1A17), consistent across the canvas — no pure-black areas.
      Chrome: Same title, now in light ink (#F0EFE8), same ~99%-width proportion issue as the light render. Vertex labels and edge tick labels are rendered in light/light-gray ink, clearly visible against the dark background. Grid lines remain subtle. The mean-composition diamond marker is now light-colored with a dark edge, correctly inverted for contrast against the dark backdrop.
      Data: Data point colors are identical to the light render — same #009E73 green markers, same imprint_seq density gradient (only the chrome/background flipped as required). No dark-on-dark failures: title, vertex labels, tick labels, and the "Mean composition" annotation are all clearly legible light-on-dark.
      Legibility verdict: PASS (same title-width caveat as the light render; no dark-on-dark text failures)
