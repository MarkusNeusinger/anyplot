review:
  strengths:
  - Genuinely creative pygal workaround for a chart type the library has no native
    support for — derives the exact data-to-pixel affine transform from pygal's own
    rendered boundary-triangle path, then overlays vertex/tick labels precisely instead
    of hand-calibrating offsets.
  - 'Full ternary-plot feature set from the spec: labeled vertices, dashed grid at
    20% intervals, tick marks along all three edges, single-series legend — nothing
    from the spec''s Notes section is missing.'
  - 'Both renders are theme-correct: identical Imprint green (#009E73) data points,
    warm off-white / near-black backgrounds, and all chrome (title, ticks, vertex
    labels, grid) flips correctly between light and dark with no dark-on-dark or light-on-light
    failures.'
  - Data spans the full triangle (near-vertex to central compositions) and is grounded
    in real bronze/brass alloy families for most points (traditional bronze 88/12/0,
    cartridge brass 70/0/30), with every composition summing exactly to 100%.
  - 'Clean, deterministic, single-pass script: no randomness needed, all imports used,
    straightforward top-to-bottom flow.'
  weaknesses:
  - 'VQ-01: The percentage tick labels along the triangle edges use font-size=32 (native
    px) — well below the style guide''s tick-label baseline (44) and below the Style
    object''s own major_label_font_size=44 (which goes unused since show_x_labels/show_y_labels
    are False). At ~400px mobile scale this shrinks to roughly 5px and is likely hard
    to read — raise pct_labels_svg font-size to ~40-44 to match the rest of the chrome.'
  - 'VQ-06: Vertex axis labels (COPPER / TIN / ZINC) carry no explicit unit — since
    the whole plot is percentage composition, append ''(%)'' (or similar) to at least
    one vertex label or a subtitle so the unit is explicit rather than only implied
    by the 20/40/60/80 tick numbers.'
  - 'DE-03: All 16 data points render as identical uniform green dots with no visual
    hierarchy — the code comment explains a deliberate mix of traditional-bronze vs.
    synthetic-extreme compositions, but that distinction is invisible in the rendered
    image. A subtle secondary encoding (e.g. slightly different alpha or size for
    the ''extreme/synthetic'' cluster) would let the story in the code become a story
    in the image.'
  - 'DQ-03: A few points (e.g. 10% Cu / 45% Sn / 45% Zn, and 15% Cu / 20% Sn / 65%
    Zn) sit far outside any real bronze/brass alloy family and read as synthetic filler
    rather than plausible metallurgical compositions — swapping 2-3 of these for more
    realistic (if still varied) alloy families would keep every point domain-plausible.'
  - 'CQ-01: One small helper function (`to_px`) breaks the strict ''Imports → Data
    → Plot → Save, no functions'' KISS guideline — understandable given the repeated
    coordinate-transform math, but a deduction under the letter of the rule.'
  - 'Cosmetic: the mandated title auto-wraps to two lines on the 2400×2400 canvas
    even after the length-based fontsize scale-down (63px for 70 chars) — not a clipping
    or overlap issue since margin_top=290 reserves ample room, but a single-line result
    (smaller font, or a deliberate break at a ''·'') would look cleaner.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white, not dark.
      Chrome: Two-line title "Bronze Alloy Composition · ternary-basic · python · pygal · anyplot.ai" in dark ink, clearly readable and comfortably clear of the plot below (margin_top=290 gives it room). Bold vertex labels COPPER (top), TIN (bottom-right), ZINC (bottom-left) in dark ink, fully legible. Muted-grey percentage tick labels (20/40/60/80) run along all three edges — readable at full size but small (font-size=32). Dashed grey grid lines at 20% intervals are subtle but visible against the cream background. Legend "Alloy Samples" with a green swatch sits bottom-left, close to the plot.
      Data: 16 solid green (#009E73) dots spread across the triangle — dense cluster near the COPPER vertex (traditional bronze), a diagonal band toward mid-triangle, and a few points toward the TIN and ZINC edges. Two dots near the center touch slightly but both remain individually visible.
      Legibility verdict: PASS — all text is dark-on-cream and clearly readable; no light-on-light failures. Percentage tick labels are legible at full resolution but would be tight at mobile scale.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black, not light.
      Chrome: Same two-line title, vertex labels, and percentage tick labels, all re-rendered in light ink (#F0EFE8 for primary text, muted lighter grey for tick numbers) — no dark-on-dark failures anywhere. Grid dashes and boundary triangle switch to a light stroke, still subtle against the near-black surface. Legend text and swatch also flip to light-readable colors.
      Data: The same 16 dots in the identical #009E73 green as the light render, at the same triangle positions — confirms data colors are unchanged between themes, only chrome flipped.
      Legibility verdict: PASS — all title, vertex, tick, and legend text is clearly light-colored against the near-black background; brand green remains vivid and legible on the dark surface.
