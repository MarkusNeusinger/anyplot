review:
  strengths:
  - 'All four Attempt 1 weaknesses were addressed precisely: vertex labels now carry
    the ''(%)'' unit, percentage tick labels grew from font-size 32 to 42 (near the
    major_label_font_size=44 baseline) and are clearly legible in both themes, a size-based
    visual hierarchy (dots_size=27 vs 14) now separates ''Named Alloys'' from ''Survey
    Points'' so the two-category story reaches the image itself, and the two most
    extreme synthetic points were swapped for less extreme ones.'
  - Genuinely creative pygal workaround for a chart type the library has no native
    support for — derives the exact data-to-pixel affine transform from pygal's own
    rendered boundary-triangle path, then overlays vertex/tick labels precisely instead
    of hand-calibrating offsets.
  - 'Both renders are theme-correct: identical Imprint green (#009E73) data points
    at identical positions, correct #FAF8F1/#1A1A17 backgrounds, all chrome (title,
    vertex labels, tick labels, grid, boundary) flips correctly with no dark-on-dark/light-on-light
    failures.'
  - 'Full ternary-plot feature set: labeled vertices with explicit ''(%)'' units,
    dashed grid at 20% intervals, tick marks along all three edges, two-group legend
    that matches the data split.'
  - Legend now honestly distinguishes 'Named Alloys' (real bronze/brass families,
    all summing to 100%) from 'Survey Points' (explicitly-labeled exploratory fill
    points) rather than implying all 16 points are real named alloys.
  - Clean, deterministic, single-pass script with only one small helper function.
  weaknesses:
  - Percentage tick labels (font-size=42) are still slightly below the Style object's
    own major_label_font_size=44 baseline — negligible in practice but not an exact
    match.
  - The mandated title still auto-wraps to two lines on the square canvas — cosmetic
    only, not a clipping/overlap issue.
  - One small helper function (to_px) still breaks the strict 'no functions' KISS
    guideline.
  - Some 'Survey Points' compositions (e.g. 33/34/33, 30/35/35) remain arbitrary space-filling
    points rather than tied to any real material — acceptable since they are honestly
    labeled as exploratory, not claimed as named alloys.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matching #FAF8F1 — not pure white.
      Chrome: Two-line title "Bronze Alloy Composition · ternary-basic · python · pygal · anyplot.ai" in dark ink, clearly readable. Bold vertex labels "COPPER (%)" (top), "TIN (%)" (bottom right), "ZINC (%)" (bottom left) in dark ink — unit now present, fully legible. Muted grey-brown percentage tick labels (20/40/60/80) along all three edges at font-size 42, clearly legible even zoomed in. Dashed grey grid lines at 20% intervals, subtle but visible. Solid dark boundary triangle.
      Data: Two size-differentiated groups of solid #009E73 green dots — larger dots (dots_size=27) for "Named Alloys" clustered near the copper vertex and upper-right edge (real bronze/brass families), smaller dots (dots_size=14) for "Survey Points" filling the mid-to-lower interior. Legend at bottom-left shows both series labels with green swatches. No overlapping points found on close inspection.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, matching #1A1A17 — not pure black.
      Chrome: Same title, vertex labels, and tick labels re-rendered in light ink/muted tan, all clearly legible against the dark surface — no dark-on-dark failures found anywhere, including in zoomed crops of the tick labels. Grid and boundary triangle switch to a light stroke, still subtle.
      Data: The same two size-differentiated groups of #009E73 green dots at identical triangle positions as the light render — confirms only chrome flipped between themes, not data color or point positions.
      Legibility verdict: PASS
