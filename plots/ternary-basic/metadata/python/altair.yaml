review:
  strengths:
  - Correctly implements a full ternary plot in Altair despite the library having
    no native ternary mark — barycentric grid lines, edge tick marks, and vertex labels
    are all hand-built via layered mark_line/mark_rule/mark_text — a non-trivial,
    well-executed workaround.
  - Theme-adaptive chrome is threaded through every layer (triangle outline, grid,
    ticks, tick labels, vertex labels, title) — both renders pass the light/dark legibility
    check with no dark-on-dark or light-on-light failures.
  - 'Data colors are identical across themes (brand green #009E73), and page backgrounds
    match #FAF8F1 / #1A1A17 exactly — full Imprint palette compliance.'
  - Realistic, neutral dataset (sand/silt/clay soil composition) that plausibly sums
    to 100% and covers a broad spread of the composition space.
  - Canvas padding is handled correctly (pad-only-to-target, never crop) per the altair
    library rules, eliminating edge-clipping risk.
  weaknesses:
  - 'Design storytelling is flat: all 50 points share the same color/size with no
    visual emphasis or focal point — consider color-coding by a soil-texture class
    or annotating a distinctive cluster to give the chart a point of view.'
  - With only 50 points (borderline sparse per the data-density heuristic), mark_point(size=80)
    markers are on the smaller side — increasing to ~120-150 would give the point
    cloud more presence on the 2400x2400 canvas.
  - The ternary-to-Cartesian conversion is fully precomputed in pandas/numpy; doing
    the barycentric math via Altair's own transform_calculate would be a more idiomatic,
    declarative approach and reduce manual Python-side geometry.
  - A few points (e.g. near the sand-rich, low-clay corner) directly overlap at full
    opacity, slightly obscuring the true point count in that region — a touch more
    jitter or reduced opacity in dense clusters would help.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Bold dark title "ternary-basic · altair · anyplot.ai" centered at top. Bold vertex labels "Clay (100%)" above the apex, "Sand (100%)" bottom-left, "Silt (100%)" bottom-right. Dark charcoal triangle outline. Subtle (~15% opacity) diagonal grid lines at 20/40/60/80% intervals with small tick marks and grey percentage tick labels along all three edges. All chrome text is clearly legible against the light background.
      Data: 50 filled circular points in brand green (#009E73), 85% opacity, scattered inside the triangle representing sand/silt/clay soil compositions. First (only) series correctly uses Imprint position 1.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Same layout — title, vertex labels, triangle outline, grid, and tick marks all re-rendered in light cream / light-grey ink tokens. No dark-on-dark failures: every text element (title, vertex labels, tick labels) reads clearly against the dark surface.
      Data: Points are the identical brand green (#009E73) as the light render — chrome flipped, data color held constant, confirming palette consistency across themes.
      Legibility verdict: PASS
