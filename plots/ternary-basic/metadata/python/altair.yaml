      Data: 50 filled circular points (size 130, opacity 0.8) colored by dominant soil component - brand green (#009E73) for Sand-dominant, lavender (#C475FD) for Silt-dominant, blue (#4467A3) for Clay-dominant. First series is #009E73, confirmed. Groups visibly cluster toward their respective vertices.
