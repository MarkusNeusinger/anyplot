review:
  strengths:
  - Builds a true equilateral-triangle ternary projection from scratch (Bokeh has
    no native ternary axis) via a manual ternary-to-Cartesian transform plus Label-based
    tick and vertex annotations, with matched x/y range spans on a square canvas to
    keep the triangle geometrically equilateral.
  - Purity-driven marker size (12-28px) and alpha (0.55-0.9) based on distance from
    the balanced 1/3-1/3-1/3 centroid gives near-pure samples visual prominence, adding
    a genuine (if subtle) data-storytelling layer instead of a flat uniform scatter.
  - Theme-adaptive chrome correctly threaded through PAGE_BG/INK/INK_SOFT tokens;
    brand-green (#009E73) data color is identical between light and dark renders,
    and all spec-required elements (20% grid lines, vertex labels, edge tick marks)
    are present in both.
  - 'Solid canvas discipline: toolbar disabled, min_border reserved on all sides,
    square 2400x2400 canvas appropriate for a plot with no preferred horizontal axis,
    no clipping in either render.'
  weaknesses:
  - No HoverTool wired up despite Bokeh's core strength being interactivity — the
    toolbar is (correctly) disabled for the static PNG, but the HTML artifact would
    benefit from tooltips showing exact Sand/Silt/Clay percentages on hover.
  - 'Data storytelling stays subtle: the purity-based size/alpha emphasis is a good
    start, but there''s no callout/annotation on the most extreme sample or soft classification-zone
    shading to actively guide the viewer through the composition space.'
  - Design excellence is solid but not distinctive — triangle border, grid, and labels
    are clean and correct but fairly close to a minimal/default treatment; a custom
    palette accent on the highest-purity point or a legend explaining size/alpha encoding
    would raise polish further.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Title "Soil Composition · ternary-basic · python · bokeh · anyplot.ai" in dark ink, bold and centered at top, fully visible. Triangle outline and 20%-interval grid lines in soft dark gray, subtle but legible. Vertex labels "Clay" (top), "Sand" (bottom-left), "Silt" (bottom-right) bold and dark, clearly readable. Edge tick labels (0/20/40/60/80/100) along all three sides in a softer gray, readable at their size, positioned outside the triangle with no collisions.
      Data: ~50 brand-green (#009E73) circular markers scattered inside the triangle, varying in size and opacity based on compositional purity — near-pure samples render larger/more opaque, balanced (loam-like) samples smaller/lighter. No markers are cut off or overlap illegibly.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Same title now in light ink (near-white), fully visible against the dark background. Triangle outline and grid lines rendered in a light soft-gray tone, still subtle but visible on the dark surface. Vertex labels "Clay"/"Sand"/"Silt" in light ink, bold, clearly readable. Edge tick labels in a softer light-gray, legible with good contrast against the dark background — no dark-on-dark failures observed anywhere (title, vertex labels, and tick labels all flip correctly to light tones).
      Data: Same brand-green (#009E73) markers, identical positions, sizes, and opacity pattern as the light render — confirms the data color and encoding did not shift between themes, only the chrome (background/text/grid) flipped as required.
      Legibility verdict: PASS
