review:
  strengths:
  - Builds a true equilateral-triangle ternary projection from scratch (Bokeh has
    no native ternary axis) via a manual ternary-to-Cartesian transform plus Label-based
    tick/vertex annotations, with matched x/y range spans on a square canvas to keep
    the triangle geometrically equilateral.
  - 'Repair directly addressed both attempt-1 weaknesses: a HoverTool with formatted
    Sand/Silt/Clay percentage tooltips is now wired into the figure for the HTML artifact,
    and the single highest-purity sample is explicitly ringed and labeled (''81% Silt'')
    as a concrete focal callout.'
  - Purity-driven marker size (12-28px) and alpha (0.55-0.9), based on distance from
    the balanced 1/3-1/3-1/3 centroid, gives near-pure samples visual prominence instead
    of a flat uniform scatter.
  - Theme-adaptive chrome correctly threaded through PAGE_BG/INK/INK_SOFT tokens;
    brand-green (#009E73) data color is identical between light and dark renders,
    and all spec-required elements (20% grid lines, vertex labels, edge tick marks)
    are present and legible in both.
  - 'Solid canvas discipline: toolbar disabled, min_border reserved on all sides,
    square 2400x2400 canvas appropriate for a plot with no preferred horizontal axis,
    no clipping in either render.'
  weaknesses:
  - 'Visual refinement (DE-02) is still close to a clean-default treatment: triangle
    border, grid, and labels are correct but a slightly more distinctive touch (e.g.
    a soft accent on the grid intersections, or a subtly varied line weight on the
    outer triangle vs. inner grid) would push polish further.'
  - Data storytelling is now good (explicit focal callout) but still single-layered
    — no soil-texture classification zone shading (e.g. loam/clay-loam/sand bands)
    to help viewers map raw coordinates to real-world soil categories, which would
    deepen the insight beyond the one highlighted point.
  - A couple of markers in the low-Clay / high-Sand region sit close enough to visually
    touch — not a legibility problem at this density, but worth a small alpha/size
    tweak if this spec is revisited with more points.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1), not pure white.
      Chrome: Title "Soil Composition · ternary-basic · python · bokeh · anyplot.ai" in bold dark ink, fully visible, centered, spanning ~78% of canvas width. Triangle outline and 20%-interval grid lines render in soft dark gray (INK_SOFT), subtle but legible. Vertex labels "Clay" (top), "Sand" (bottom-left), "Silt" (bottom-right) are bold dark ink, clearly readable. Edge tick labels (0/20/40/60/80/100) sit outside the triangle on all three sides in the same soft gray, evenly spaced with no collisions.
      Data: ~50 brand-green (#009E73) circular markers scatter inside the triangle, sized/shaded by compositional purity (near-pure samples larger and more opaque, balanced/loam-like samples smaller and lighter). The single highest-purity sample is ringed in dark ink and labeled "81% Silt" as an explicit focal callout, positioned near the Silt vertex, fully inside the canvas with no clipping.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17), not pure black.
      Chrome: Same title now in light ink (INK), fully visible against the dark surface, same width proportion as the light render. Triangle outline and grid lines flip to a light soft-gray tone (INK_SOFT dark variant), still subtle but visible. Vertex and tick labels flip to light tones with good contrast — no dark-on-dark failures anywhere.
      Data: Markers are identical in position, size, and opacity pattern to the light render, and remain brand-green (#009E73) — confirming only chrome (background/text/grid) flipped between themes. The focal-callout ring and "81% Silt" label flip to light ink and remain fully legible.
      Legibility verdict: PASS
