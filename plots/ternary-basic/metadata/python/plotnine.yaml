review:
  strengths:
  - Legend is now anchored inset within the panel whitespace beside the triangle instead
    of stranded in an isolated right-side column — directly fixes the prior VQ-05/DE-02
    weakness and reads as one cohesive composition in both themes
  - Reduced marker alpha (0.7, down from 0.85) noticeably improves distinguishability
    of overlapping samples in the Dirichlet-heavy vertex clusters without sacrificing
    overall marker visibility
  - Continuous "distance to ideal loam" color encoding turns a plain scatter into
    a clear data story with an obvious focal point (the black/cream Ideal-loam diamond)
  - 'Correct imprint_seq gradient (#009E73 -> #4467A3) for the single-polarity continuous
    distance metric, matching the style-guide sequential-colormap spec exactly'
  - Faithful, real-world USDA-style soil-texture domain (sand/silt/clay) with physically
    sensible Dirichlet-sampled values summing to 100%
  - Clean theme-adaptive chrome — both renders pass the readability checklist with
    no dark-on-dark or light-on-light failures, and data colors are pixel-identical
    between themes
  - Exact canvas target hit (3200x1800, verified border-to-border with no clipped
    pixels) and clean, KISS-structured, reproducible code (np.random.seed(42))
  weaknesses:
  - Even at alpha=0.7, the tightest vertex clusters (e.g. the top Clay-heavy cluster
    and the bottom-left Sand-heavy cluster) still visually merge into blob-like shapes
    — a small additional jitter or a slightly smaller marker size in only the densest
    clusters would make individual sample counts easier to read at a glance
  - The manual ternary-triangle construction (geom_polygon + geom_segment + geom_text
    for the frame/grid/ticks) is a solid workaround for plotnine's missing native
    ternary support, but it doesn't showcase anything unique to plotnine/ggplot's
    grammar beyond generic layer composition — future attempts could lean further
    into plotnine-specific idioms (e.g. stat transforms, ggplot-style faceting of
    the three texture clusters) to raise Library Mastery
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white, not dark.
      Chrome: Title "ternary-basic · plotnine · anyplot.ai" is dark, centered, and clearly readable. Vertex labels "Clay (%)" (top), "Sand (%)" (bottom-left), "Silt (%)" (bottom-right) are bold dark text with units. Edge tick labels (0/20/40/60/80/100) are small gray text along all three sides, all legible. The "Distance to ideal loam" legend box sits inset at the top-right of the panel with a dark title, dark tick labels, and a visible border — no isolation from the plot. No text overlaps other text or data.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black, not light.
      Chrome: Title, vertex labels, and tick labels all flip to light cream/gray tones against the dark background — fully readable, no dark-on-dark failures anywhere. Legend box flips to a dark elevated fill with light text, border still visible. The target diamond and its "Ideal loam" label flip from black to a cream/off-white theme-adaptive ink token.
      Data: Triangle frame remains brand green (#009E73), identical in hue and position to the light render; the green-to-blue (#009E73 -> #4467A3) point gradient is pixel-identical between renders — only chrome (background, text, legend fill) flipped, as required.
      Legibility verdict: PASS
