review:
  strengths:
  - Continuous "distance to ideal loam" color encoding turns a static scatter into
    a clear data story with an obvious focal point
  - Faithful, real-world soil-science domain (USDA texture triangle) with physically
    sensible values
  - Clean theme-adaptive chrome — both light and dark renders pass the readability
    checklist with no dark-on-dark or light-on-light failures
  - Correct imprint_seq gradient use for the single-polarity continuous metric
  - Exact canvas target hit (3200x1800) and clean, KISS-structured code
  weaknesses:
  - Legend feels visually isolated from the triangle with an oversized empty margin
    to its right — pull the legend closer to the plot or reduce the right-side canvas
    margin to improve balance (VQ-05)
  - Data points overlap noticeably at the three vertices due to the Dirichlet concentration
    — consider a touch more transparency (e.g. alpha ~0.7) or slightly larger jitter
    to keep individual samples distinguishable in the densest clusters (VQ-03)
  - The manual ternary-triangle construction, while a solid workaround for plotnine's
    missing native support, doesn't showcase a technique unique to plotnine specifically
    — future attempts could lean further into plotnine/ggplot-specific idioms to raise
    Library Mastery
