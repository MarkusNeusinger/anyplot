  - 'Hand-built ternary geometry (matplotlib has no native ternary support) is executed
    cleanly: equilateral triangle outline, 20% dashed internal grid, and dual tick
    labels on all three edges per the spec''s ''grid lines at regular intervals''
    and ''tick marks along each edge'' requirements'
  - 'Data quality is strong: Dirichlet([1,1,1]) sampling gives realistic sand/silt/clay
    soil compositions that sum exactly to 100%, with good coverage of corners, edges,
    and the center of the simplex'
  - Marker edge color set to PAGE_BG creates a halo effect that keeps overlapping
    points visually distinct in both themes
  - Clean KISS structure with explicit np.random.seed(42), no wasted imports, and
    correct plot-{THEME}.png output
  weaknesses:
  - 'Design Excellence is capped by genericness: beyond the single brand-green scatter
    there is no visual hierarchy or focal point (e.g., highlighting a named soil-texture
    region such as ''loam'', or encoding a 4th dimension via size/alpha) to give the
    chart a stronger story'
  - 'Library Mastery is low: the implementation only uses generic primitives (ax.plot/ax.text/ax.scatter)
    that are trivially replicable in any plotting library — nothing leverages a matplotlib-distinctive
    feature (e.g., a Polygon/PathPatch fill for the triangle interior, a soil-classification
    background zoning via patches, or colormap-based density encoding)'
  - Grid uses dashed lines (linestyle='--') where the default style guide recommends
    solid subtle gridlines — likely a defensible ternary-specific convention to separate
    the internal grid from the solid outer triangle border, but worth reconsidering
    if it reads as busy at full resolution
