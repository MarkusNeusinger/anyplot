review:
  strengths:
  - 'Correct chart type: go.Scatterternary with fully-configured aaxis/baxis/caxis
    (titles, linear ticks every 20%, tick fonts, line width/color, subtle gridlines)
    matching the spec''s requirement for regular grid intervals and labeled vertices.'
  - Marker shape (circle/diamond/square/triangle-up) redundantly encodes the same
    grouping as color, so the four industries stay distinguishable for colorblind
    viewers without relying on hue alone.
  - The 50% majority-threshold dashed line plus caption is a genuine domain-specific
    annotation (not decoration) that adds real analytical value to the plot.
  - 'Data design is thoughtful: four industries sit at different structural points
    on the simplex (concentrated near the Leader vertex, three-way race near centroid,
    duopoly along an edge) rather than clustering in one corner, and per-point noise
    is renormalized so every point sums to exactly 100%.'
  - Theme-adaptive chrome is threaded correctly through title, axis titles, tick labels,
    gridlines, axis lines, and legend box/border/text; the Imprint data colors are
    pixel-identical between the light and dark renders.
  - 'Canvas gate passed (3200x1800 landscape) and outputs follow the plotly contract
    exactly: write_image(width=800, height=450, scale=4) plus write_html for the interactive
    detail view.'
  weaknesses:
  - 'Top-vertex tick labels crowd together: the aaxis ''100'' tick and the baxis ''0''
    tick sit immediately on either side of the apex arrow and read as a merged ''100.0''
    at a glance, in both light and dark renders. Consider suppressing one duplicate
    vertex label or nudging tick label offsets so the two numbers don''t visually
    collide.'
  - 'Two palette comments are semantically wrong even though the hex values and canonical
    ordering are correct: ''#C475FD'' is labeled "vermillion" (it''s Imprint''s lavender/purple
    hue, not Okabe-Ito vermillion) and ''#BD8233'' is labeled "reddish purple" (it''s
    actually Imprint''s ochre/yellow-earth hue). Align the comments with the real
    Imprint names (bluish green, lavender, blue, ochre) so they don''t mislead future
    maintainers.'
  - The Cloud Infrastructure cluster (green circles) has several points overlapping
    tightly in the upper region; alpha=0.82 with a light edge stroke keeps it readable,
    but slightly more jitter or a marker-size step-down in that dense pocket would
    improve separability at small preview sizes.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1), matches the required light surface — not pure white.
      Chrome: Title "Market Share by Industry · ternary-basic · python · plotly · anyplot.ai" is centered, bold, dark ink, fully readable and proportionate (~65% width). Vertex/axis titles "Market Leader (%)", "Challenger (%)", "Niche Player (%)" are dark ink and clearly legible. Tick labels (0/20/40/60/80/100 on all three edges) are soft gray and legible, EXCEPT the top vertex where the aaxis "100" and baxis "0" labels sit right next to the apex marker and visually merge into what reads as "100.0" at a glance — a crowding/overlap issue, not an unreadability issue (each label is individually legible on close inspection). Gridlines are thin and subtle, visible without competing with data. Legend box (title "Industry", 4 entries) has a soft cream fill and thin border, fully readable.
      Data: First series (Cloud Infrastructure, circles) uses brand green #009E73; Streaming Video (diamonds) uses lavender #C475FD; Ride-Hailing (squares) uses blue #4467A3; Food Delivery (triangles) uses ochre #BD8233 — canonical Imprint order, all clearly distinguishable by hue and by marker shape. The dashed 50%-majority threshold line and its caption are visible and legible in the upper-left whitespace.
      Legibility verdict: PASS (top-vertex tick crowding noted as a weakness, not a legibility failure — both numbers remain individually readable).

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17), matches the required dark surface — not pure black.
      Chrome: Title, vertex/axis titles are light ink (#F0EFE8) and clearly readable against the dark background — no dark-on-dark issue anywhere. Tick labels are the lighter soft gray (#B8B7B0) and legible, with the same top-vertex "100"/"0" crowding present as in the light render (same layout issue, theme-independent). Gridlines are thin, light, and subtle. Legend box uses the elevated dark fill (#242420) with a visible border; all legend text is light and legible.
      Data: Colors are confirmed pixel-identical to the light render (#009E73 green, #C475FD lavender, #4467A3 blue, #BD8233 ochre) — only the chrome (background, text, grid, legend frame) flipped between themes, exactly as required.
      Legibility verdict: PASS (same top-vertex crowding note as light; no dark-on-dark failures).
