review:
  strengths:
  - Correct manual ternary-to-Cartesian coordinate transformation (lets-plot has no
    native ternary geom), validated against the standard formula
  - Clean 3-cluster soil-composition dataset (Sandy/Silty/Clayey) that visually demonstrates
    exactly what a ternary plot is for
  - Vertex labels, edge tick labels (20/40/60/80), and 20%-interval grid lines all
    present per spec, correctly offset to avoid collision with the triangle and each
    other
  - Correct Imprint palette in canonical order (green/lavender/blue), identical across
    both themes; correct theme-adaptive chrome (background, title, axis text, legend
    box) in both light and dark renders with no clipping and no dark-on-dark/light-on-light
    failures
  - 'Distinctive lets-plot feature: layer_tooltips() surfaces per-point hover detail
    (soil type + exact sand/silt/clay %) in the exported HTML'
  - Deterministic (np.random.seed(42)), flat KISS script, correct output naming/API
    (ggsave with scale=4, PNG + HTML for both themes)
  weaknesses:
  - Legend title 'Soil Type' is regular weight while the plot title is bold — minor
    typographic-hierarchy inconsistency; consider bolding legend_title for consistency
  - Data-point markers (size=3.5) are adequate but on the smaller side for a 60-point
    dataset split into 3 clusters of 20 — slightly larger markers (e.g. 4-4.5) would
    improve visibility, especially at mobile scale
  - Styling is solid but conventional; no additional emphasis (e.g. cluster centroid
    markers or annotated region labels) to push the storytelling further beyond color-coded
    scatter
  image_description: |-
