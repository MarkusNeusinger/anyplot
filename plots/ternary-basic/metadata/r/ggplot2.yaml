review:
  strengths:
  - Correct barycentric-to-Cartesian math (x = clay + 0.5*sand, y = sand*sqrt(3)/2)
    places all 90 points accurately inside the equilateral triangle, verified against
    the vertex assignment
  - Full custom ternary scaffold (grid lines, triangle outline, edge ticks, per-edge
    percentage labels) built entirely from ggplot2 primitives (geom_segment, geom_path,
    geom_text) since ggplot2 has no native ternary geom — correctly addresses the
    prior review's VQ-06 weakness by adding '20%'/'40%'/... labels per edge, each
    verified against the correct barycentric component
  - New 'Balanced loam' focal point (the sample closest to an even 1/3-1/3-1/3 split,
    highlighted with an ochre outlined marker and inline label) gives the plot a clear
    visual hierarchy and narrative, directly resolving the prior review's DE-03 weakness
  - Theme-adaptive chrome correctly threaded through PAGE_BG/INK/INK_SOFT for both
    renders; data color (#009E73) and the ochre highlight (#BD8233) are pixel-identical
    between light and dark, only chrome flips
  - 'Clean KISS structure: no functions/classes, seed set, only used imports, correct
    ragg::agg_png save at plot-{THEME}.png, both PNGs exactly 2400x2400'
  - Realistic, neutral, spec-aligned application (USDA-style soil sand/silt/clay composition)
    generated via a Dirichlet(1,1,1)-style construction (independent exponential draws
    normalized to sum to 1), giving good coverage of corners, edges, and center
  - Title fontsize auto-scales via the length-based ratio formula and stays fully
    within canvas bounds in both renders — no clipping anywhere in either theme
  weaknesses:
  - Edge percentage labels are set at size=2.3 (geom_text, mm units) — noticeably
    smaller than the vertex labels (size=4) and on the small side for a 2400px canvas;
    a slightly larger size (~2.8-3.0) would improve legibility without crowding the
    ticks
  - Only a single point ('Balanced loam') is used for visual hierarchy/storytelling
    — a modest improvement over the flat prior version, but still a light touch; a
    texture-class region shading or a second contrasting callout would deepen the
    narrative further
  - Aesthetic customization is still centered on the scaffold itself (grid/ticks/labels)
    rather than additional refinement of the data layer (e.g. no marker-shape or size
    variation to hint at density) — solid but not yet at a fully bespoke, editorial
    level of polish
