review:
  strengths:
  - Correct barycentric-to-Cartesian math (x = clay + 0.5*sand, y = sand*sqrt(3)/2)
    places points accurately inside the equilateral triangle
  - Full custom ternary scaffold built from ggplot2 primitives (geom_segment grid,
    geom_path outline, geom_segment edge ticks) since ggplot2 has no native ternary
    geom — idiomatic use of the grammar-of-graphics layering model
  - Theme-adaptive chrome correctly threaded through PAGE_BG/INK/INK_SOFT for both
    renders; data color (#009E73) identical between light and dark
  - 'Clean KISS structure: no functions/classes, seed set, only used imports (ggplot2,
    dplyr, tibble, ragg), correct ragg::agg_png save at plot-{THEME}.png'
  - Title fontsize auto-scales via the length-based ratio formula and stays fully
    within canvas bounds in both renders
  - Realistic, neutral, spec-suggested application (soil sand/silt/clay composition)
    with good coverage of the full triangle including corners, edges, and center
  weaknesses:
  - No percentage/units labeling anywhere on the grid or edges — only unlabeled tick
    marks exist, so a viewer cannot read exact proportions (e.g. '20%', '40%') off
    the triangle; add small numeric labels near the edge ticks to satisfy the spec's
    'tick marks to aid reading proportions' note more fully
  - Edge tick marks (tick_len = 0.02, alpha = 0.6) are very subtle at the 2400x2400
    render size and easy to miss — increase tick_len and/or contrast slightly so they
    read clearly
  - 'No visual hierarchy or storytelling: all 90 points share identical color/size/alpha
    with no emphasis (e.g. highlighting a texture-class region or a subset of points)
    to guide the viewer to an insight'
  - Title spans close to ~85-90% of the canvas width — within the tolerance for the
    long mandated title but on the generous end; a touch more headroom would look
    cleaner
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1) — matches the Imprint light surface, not pure white.
      Chrome: Title "Soil Texture Composition · ternary-basic · r · ggplot2 · anyplot.ai" in dark ink, clearly readable, centered above the triangle. Vertex labels "Sand" (top), "Silt" (bottom-left), "Clay" (bottom-right) are bold dark-ink text, clearly readable and well clear of the data. Triangle outline and internal grid lines render in a soft dark grey, subtle but visible; small edge tick marks are present but faint.
      Data: 90 semi-transparent green (#009E73) points scattered across the full triangle interior, spanning corners, edges, and center, with visible overlap in denser clusters.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17) — matches the Imprint dark surface, not pure black.
      Chrome: Title and vertex labels render in light off-white ink (#F0EFE8), clearly readable against the dark background — no dark-on-dark issues observed. Triangle outline and grid lines render in a light grey (INK_SOFT equivalent), visible against the dark surface. Edge ticks are present but faint, same as in the light render.
      Data: Same 90 points in identical #009E73 green as the light render — confirmed unchanged data color, only chrome flipped between themes.
      Legibility verdict: PASS
