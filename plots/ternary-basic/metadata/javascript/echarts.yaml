review:
  strengths:
  - Composition centers now match a real bronze alloy (88% Cu / 2% Zn / 10% Sn, statuary-bronze
    family) — the prior 45/35/20 realism issue from attempt 1 is fully resolved
  - 'New labeled reference marker (diamond glyph + dashed leader line, ''Reference:
    Bell Bronze (78/22)'') gives the plot a real point of comparison and a focal point
    beyond the raw sample cloud, directly addressing the prior data-storytelling weakness'
  - Distance-from-mean alpha cue (points near the batch mean are more transparent,
    outliers more opaque) is a genuine, correctly-implemented density mitigation,
    paired with a subtle page-background stroke on every marker so overlapping circles
    stay individually countable
  - Correct, accurate ternary geometry (barycentric-to-Cartesian conversion) with
    properly labeled vertices, 20% grid lines, and edge tick marks — a professional
    ternary diagram despite ECharts having no native ternary coordinate system
  - Real interactive tooltip via a genuine `custom` series (not faked) — shows exact
    Copper/Zinc/Tin percentages on hover
  - 'Both light and dark renders are fully theme-correct: identical brand-green data
    color, correct #FAF8F1/#1A1A17 backgrounds, legible theme-adaptive chrome throughout,
    and the reference marker/label also flips color correctly'
  - Clean, deterministic, seeded data generation (hand-rolled LCG + Box-Muller gaussian)
    — fully reproducible
  weaknesses:
  - The realistic, narrow-tolerance bronze composition packs ~70 points into a small
    corner of the triangle, so the dense cluster core still has meaningful marker-to-marker
    overlap despite the alpha/stroke mitigation — a slightly smaller marker radius
    (e.g. 5-5.5px instead of 6.5px) would ease this further without hurting sparse-outlier
    visibility
  - Data Feature Coverage is still a single alloy family plus one reference point
    — a second small comparison cluster (e.g. a leaded gunmetal or a wider historical
    scatter) would use more of the ternary space and reinforce the storytelling
  - Aesthetic Sophistication reads as a well-executed, above-default build (hand-built
    ternary chrome, density cue, reference annotation) but stops short of top-tier
    publication polish — e.g. no secondary encoding (size/hue) distinguishing outliers
    from the reference beyond position
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "Bronze Alloy Composition · ternary-basic · javascript · echarts · anyplot.ai" is dark, centered, comfortably sized (~55% width), and fully legible. Equilateral triangle with a dark ink-soft 2.5px border, bold vertex labels ("Tin (C)" top, "Copper (A)" bottom-left, "Zinc (B)" bottom-right), subtle 20%-interval internal grid lines, and numeric tick marks (20/40/60/80) along all three edges. All chrome text is dark-on-light and readable.
      Data: ~70 brand-green (#009E73) circular markers with a thin light-stroke edge form a tight cluster in the lower-left (Copper-dominant) region of the triangle, consistent with realistic bronze compositions (~88% Cu / 2% Zn / 10% Sn). A hollow diamond reference marker sits just outside the cluster on the Copper-Tin edge, connected by a dashed leader line to the label "Reference: Bell Bronze (78/22)" — a real point of comparison. Points closer to the cluster mean are rendered more transparent, points further out (outliers) more opaque, which combined with the marker stroke keeps individual points distinguishable despite the density.
      Legibility verdict: PASS — all title, vertex labels, tick labels, and the reference annotation are clearly readable against the light background; no light-on-light text.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title, triangle border, grid lines, vertex labels, and tick labels, all flipped to light-toned strokes/text (ink/inkSoft tokens) and fully legible against the dark background. No dark-on-dark issues on any chrome element.
      Data: Identical brand-green (#009E73) markers in the same cluster position, shape, and opacity gradient as the light render — confirming only chrome flipped, not data color. The reference diamond and its dashed leader/label also flip correctly to light ink and remain legible.
      Legibility verdict: PASS — all text and data markers are clearly readable against the dark background; no dark-on-dark failures found.
