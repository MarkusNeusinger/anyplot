review:
  strengths:
  - Correct, accurate ternary geometry (barycentric-to-Cartesian conversion) with
    properly labeled vertices, 20% grid lines, and edge tick marks — mirrors a professional
    ternary diagram despite ECharts having no native ternary coordinate system
  - Real interactive tooltip via a genuine `custom` series (not faked) — shows exact
    Copper/Zinc/Tin percentages on hover, adding real value in the HTML detail view
  - 'Both light and dark renders are fully theme-correct: identical brand-green data
    color, correct #FAF8F1/#1A1A17 backgrounds, and legible theme-adaptive chrome
    text/grid throughout'
  - Title fontsize correctly auto-scales for the longer descriptive-prefixed title,
    avoiding overflow or clipping
  - Clean, deterministic, seeded data generation with a small hand-rolled LCG + Box-Muller
    gaussian — fully reproducible
  weaknesses:
  - The 'Bronze Alloy' composition averages ~45% Copper / 35% Zinc / 20% Tin, which
    does not match real-world bronze alloys (copper-dominant, typically 85%+ Cu with
    tin as the secondary component). Shift the Gaussian centers toward realistic bronze
    proportions (e.g. ~88% Cu, ~10% Sn, ~2% Zn) or rename the scenario to a copper-zinc-tin
    alloy family whose real composition matches the current centers (e.g. a leaded
    red brass / gunmetal still needs to stay copper-dominant, so most likely fix is
    adjusting the centers, not just the label)
  - Data Storytelling is minimal — a single undifferentiated green blob with no visual
    hierarchy, annotation, or grouping. Consider adding a labeled reference/target-composition
    marker, or a lightly encoded secondary dimension (e.g. alpha or size keyed to
    a sample-quality/batch attribute) to give the chart a clearer focal point
  - Marker overlap in the dense cluster core makes individual points hard to distinguish
    — consider reducing the marker radius slightly or lowering opacity further (e.g.
    ~0.65) to improve individual-point legibility where points overlap most
  - Aesthetic Sophistication reads as a well-executed default — functionally excellent
    but visually plain (single hue, no supporting visual elements). Consider a subtle
    density cue (e.g. slight alpha gradient toward the cluster center) to add polish
    beyond the flat scatter
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "Bronze Alloy Composition · ternary-basic · javascript · echarts · anyplot.ai" is dark, centered, fully legible, and auto-scaled to avoid overflow. The equilateral triangle is drawn with a dark ink-soft border; three bold vertex labels ("Tin (C)" top, "Copper (A)" bottom-left, "Zinc (B)" bottom-right) are clearly readable outside the triangle. Subtle 20%-interval grid lines cross the triangle interior, with small tick marks and numeric labels (20/40/60/80) along all three edges in a muted ink-soft tone. All text is readable against the light background.
      Data: ~70 circular markers in brand green (#009E73) with a light stroke, clustered in the lower-central region of the triangle (roughly Copper 35-55%, Zinc 25-45%, Tin 10-30%), with one visible outlier extending toward higher Tin. First (only) series correctly uses #009E73.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title, now in light/off-white text, fully legible against the dark background. Triangle border and grid lines flip to light-toned strokes; vertex labels and tick labels are light-colored and clearly readable. No dark-on-dark text observed anywhere — title, vertex labels, and tick numbers all read cleanly.
      Data: Same ~70 markers in identical brand green (#009E73), same cluster shape and position as the light render — confirms data colors are unchanged between themes; only chrome (background, borders, grid, text) flipped.
      Legibility verdict: PASS
