review:
  strengths:
  - Correct barycentric-coordinate ternary geometry with a proper three-family 20%
    grid, tick marks, and tick labels along all three edges, all aligned
  - Marker radius scales with each sample's dominant-component purity, giving the
    plot a genuine visual-hierarchy focal point rather than uniform dots
  - Wide compositional data spread (raw floor lowered to 0.02) gives good feature
    coverage from near-vertex, high-purity samples to balanced mid-triangle mixtures,
    in a realistic, neutral soil-science (clay/sand/silt) scenario summing to exactly
    100%
  - Vertex tick-label doubling from the prior review was correctly deduped, and vertex
    labels now correctly carry "(%)" units
  - Clean idiomatic D3 data-join pattern for grid lines, ticks, labels, and points;
    deterministic seeded LCG; correct Imprint palette/theme-adaptive chrome in both
    renders
  weaknesses:
  - 'AR-09 EDGE CLIPPING (unresolved from prior review): the "Sand (%)" vertex label
    is still clipped at the left canvas border in BOTH plot-light.png and plot-dark.png
    -- the leading curve of the "S" is chopped off flat at x=0, missing pixels for
    good. This is the exact same defect flagged in the previous review; the last fix
    commit addressed the Attempt-1 feedback (tick dedup, "(%)" units, data-range widening,
    purity-based sizing) but did not touch the vertex-label positioning that causes
    the clipping.'
  - 'Root cause: the label is positioned with outward(left, 78) and text-anchor="middle".
    "Sand (%)" is the widest of the three vertex labels (wide a/n/d glyphs vs. the
    narrower glyphs in "Clay (%)"/"Silt (%)"), so its horizontally-centered left edge
    lands at a negative x coordinate before the 2x screenshot scale, pushing part
    of the "S" off the 1200px CSS mount. Fix: switch the left vertex label to text-anchor="start"
    (and the right vertex label to text-anchor="end"), or increase margin.left/margin.right
    enough to clear the widest label at its outward-push distance.'
  - Considerable unused whitespace remains on the left/right of the square canvas
    outside the vertex labels; worth using more of the available area once the clipping
    fix (which likely needs larger margins anyway) is in place.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1.
      Chrome: Bold dark title fully visible at top. Triangle border + 20% grid subtle and correct. Tick labels (10-100) readable on all three edges, no doubled vertex ticks. "Clay (%)" and "Silt (%)" vertex labels fully clear of canvas edges. "Sand (%)" vertex label (bottom-left) is CLIPPED: leading curve of the "S" cut off flat at x=0, confirmed via 3x pixel-zoomed crop of the (0-300, 2100-2300) region -- missing pixels, not a tight margin.
      Data: 28 green (#009E73) circles, radius scaled by compositional purity, clearly visible against background.
      Legibility verdict: FAIL (Sand (%) label clipped at left canvas edge -- AR-09)

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17.
      Chrome: Title, grid, triangle border, and tick labels correctly flip to light ink tokens, fully legible, no dark-on-dark failures.
      Data: Identical colors/positions/sizes to light render (#009E73), only marker stroke flips to match page background.
      Same "Sand (%)" clipping defect reproduces identically in the equivalent pixel crop -- confirms this is a layout-math bug, not a per-theme rendering issue.
      Legibility verdict: FAIL (Sand (%) label clipped at left canvas edge -- AR-09)
