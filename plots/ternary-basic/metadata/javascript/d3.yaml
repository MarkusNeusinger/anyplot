review:
  strengths:
  - Correct barycentric-to-pixel transform with three grid-line families and edge
    tick marks at 20% intervals, matching the spec's 'regular interval gridlines'
    and 'tick marks along each edge' requirements
  - Marker radius encodes compositional purity (dominant component share), giving
    the scatter a meaningful visual hierarchy without added chartjunk
  - Thoughtful start/end text-anchor logic on the left/right vertex labels prevents
    them from clipping at the canvas edges
  - 'Fully theme-adaptive chrome — brand green #009E73 is identical and clearly legible
    on both the light (#FAF8F1) and dark (#1A1A17) surfaces'
  - Deterministic LCG-seeded data generation and idiomatic D3 `.data().join()` usage
    throughout (grid lines, tick labels, vertex labels, sample points)
  weaknesses:
  - Single accent color and uniform marker shape keep the design at 'strong' rather
    than showcase-level — a secondary cue (e.g. subtle alpha/size gradient tied to
    purity, or a couple of direct sample-group labels) would push the data storytelling
    further
  - No sample lands above ~65% clay, so coverage leans toward sand/silt-dominant mixtures
    — a sample or two closer to the clay apex would balance feature coverage across
    all three vertices
