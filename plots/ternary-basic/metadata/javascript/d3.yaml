      Data: 28 circular markers in brand green (#009E73), radius scaled by compositional purity, with a subtle pale stroke for edge definition against overlapping points. Points span a broad range of clay/sand/silt mixtures, concentrated toward sand- and silt-dominant compositions with a few near-vertex and mid-triangle samples.
