review:
  strengths:
  - Correct barycentric-coordinate math (toXY) drives grid lines, tick marks, and
    data points from a single consistent transform — the three grid-line families
    and tick axes all line up perfectly with the triangle edges
  - Idiomatic D3 data-join pattern (selection.data().join()) used for grid lines,
    tick labels, vertex labels, and sample points instead of manual DOM loops
  - Deterministic LCG-seeded data generation, self-contained with no fetch/network
    calls, matching the D3 reproducibility rule
  - Marker sizing (r=9, fill-opacity 0.85, theme-adaptive stroke) is well matched
    to the sparse 28-point dataset
  - 'Correct Imprint palette usage: first series is #009E73, identical between light
    and dark renders, with theme-correct #FAF8F1/#1A1A17 backgrounds and adaptive
    ink tokens for all chrome'
  weaknesses:
  - 'At all three triangle vertices, two tick labels are rendered at the exact same
    pixel position and overlap: the clay-axis ''0''/silt-axis ''0'' tick coincides
    with the sand-axis ''100'' tick (and the equivalent pairs at the other two vertices),
    because toXY() maps both tick''s (a,b,c) to the same vertex coordinate. Zooming
    into the PNG shows a visibly doubled/bolder ''0'' fused into the second ''0''
    of ''100'' with chromatic-fringe ghosting. Fix: after building the `tickLabels`
    array, dedupe entries whose pixel position (or (level, vertex) combination) coincides
    — e.g. skip the sand-axis lv=1 label and the silt-axis lv=0 label (and their clay-axis
    counterparts) since the shared vertex is already unambiguous from the two edges
    meeting there, or nudge one of the two coincident labels tangentially so they
    don''t stack exactly.'
  - Vertex labels 'Clay', 'Sand', 'Silt' have no unit shown (no '%'), while the axes
    clearly represent percentages (0-100 ticks); add '(%)' to each vertex label for
    full VQ-06 credit, matching how the matplotlib sibling implementation labels 'Sand
    (%)', 'Silt (%)', 'Clay (%)'.
  - The synthetic data generator (wClay/wSand/wSilt = 0.15 + rand()*0.85, normalized
    to sum 100) mathematically cannot produce any component below ~7% or above ~77%,
    so the scatter never shows near-vertex (high-purity) or near-edge (single-component-dominant)
    compositions — a real limitation of ternary data that a good example should demonstrate.
    Widen the raw ranges (e.g. down to a lower floor near 0) so a few samples land
    close to the vertices/edges.
  - No visual hierarchy or storytelling element (e.g. a highlighted classification
    region, an emphasized cluster, or a callout) — the plot is a plain uniform-color
    scatter; consider highlighting a sub-region or a couple of representative points
    to give the viewer a focal point.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 - not pure white.
      Chrome: Bold dark title "ternary-basic · javascript · d3 · anyplot.ai" centered at top, clearly readable. Equilateral triangle outlined in a dark ink-soft stroke. Bold vertex labels "Clay" (top), "Sand" (bottom-left), "Silt" (bottom-right) in dark ink, clearly legible. Tick labels (0/20/40/60/80/100) along all three edges in a lighter ink-soft gray, readable — EXCEPT at the three vertices, where two tick labels from different axes are drawn at the identical pixel position, producing a visibly doubled/bolder "100" with faint color-fringe ghosting on close inspection (still reads as "100", not fully illegible, but is a real overlap defect). Grid lines at 20% intervals in three directions, subtle light gray, visible but not competing with data.
      Data: 28 green (#009E73) circles with a light cream stroke for definition against the light background, fill-opacity 0.85, clustered mostly in the mid-lower portion of the triangle (no points close to the vertices).
      Legibility verdict: PASS (all text readable; the vertex tick-label overlap is a genuine but minor defect, not a legibility failure)

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 - not pure black.
      Chrome: Title, vertex labels ("Clay"/"Sand"/"Silt"), and tick labels all rendered in light ink tokens, clearly visible against the dark background — no dark-on-dark failures anywhere. The same vertex tick-label doubling artifact from the light render reproduces identically here (expected, since it's a geometry bug in the tick computation, not a theme issue).
      Data: Same #009E73 green circles, fill-opacity 0.85, now with a dark stroke (matching the dark page background) instead of the light-render's cream stroke — data hue is identical to the light render, only the marker's edge stroke color flips with the theme (intentional, theme-adaptive edge treatment).
      Legibility verdict: PASS (no dark-on-dark text; all chrome correctly flipped)
