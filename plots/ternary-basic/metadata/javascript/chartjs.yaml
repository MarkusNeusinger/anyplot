review:
  strengths:
  - Chart.js has no native ternary chart type, so the implementation builds one from
    a scatter dataset plus a custom `ternaryFramePlugin` (beforeDatasetsDraw/afterDraw)
    that draws the triangle frame, 20% grid, edge tick labels, and vertex labels directly
    on canvas — a genuinely idiomatic use of the Chart.js plugin system to extend
    beyond core capabilities.
  - 'All spec requirements are met: grid lines at 20% intervals, all three vertices
    clearly labeled (Sand/Silt/Clay), and tick marks along each edge (20/40/60/80)
    to aid reading proportions.'
  - Deterministic seeded LCG + Box-Muller data generation forms four distinguishable
    soil-site clusters (soil texture domain), each triplet correctly normalized to
    sum to 100%.
  - 'Theme-adaptive chrome is correct in both renders: warm off-white / near-black
    backgrounds, ink/inkSoft text tokens flip appropriately, and the brand green data
    color (#009E73) is identical between light and dark.'
  - 'Correct square canvas orientation (2400x2400) via the `//# anyplot-orientation:
    square` directive, matching the spec''s equilateral-triangle framing; title follows
    the mandated `spec-id · language · library · anyplot.ai` format.'
  weaknesses:
  - Markers use full opacity with no alpha blending, so points in the denser clusters
    (e.g. the bottom-left and central cloud) touch/overlap slightly — a light alpha
    (e.g. 0.85) or a hair-thinner border would keep individual samples distinguishable
    without changing the palette.
  - The four notional field sites that drive the data generation are never visually
    distinguished (all points share one color) — coloring or shape-coding by site,
    or at least noting the grouping in a legend/annotation, would strengthen the data
    storytelling beyond a single undifferentiated cloud.
  - The custom projection/plugin code (ternaryToXY, drawLine, gaussian, the two-phase
    plugin) is necessarily more elaborate than a typical KISS scatter setup — justified
    by chartjs lacking a native ternary type, but it's worth confirming no redundant
    helper could be inlined or removed.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1), consistent with the Imprint light-theme surface — not pure white.
      Chrome: Title "ternary-basic · javascript · chartjs · anyplot.ai" in dark ink, centered top. Equilateral triangle drawn with a bold dark (ink) stroke; internal 20% grid lines in a lighter soft-grey grid tone. Vertex labels "Clay" (top), "Sand" (bottom-left), "Silt" (bottom-right) in bold dark ink. Tick labels (20/40/60/80) along all three edges in a softer grey (inkSoft), correctly right/center/left-aligned per edge. All text is clearly legible against the light background.
      Data: ~84 green (#009E73) circular markers with a thin light (pageBg-colored) border, forming four loosely clustered groups inside the triangle consistent with four soil-sampling sites; positions plausibly sum to 100% sand+silt+clay.
      Legibility verdict: PASS — no light-on-light or unreadable text found.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17), consistent with the Imprint dark-theme surface — not pure black.
      Chrome: Same title, now rendered in light ink. Triangle frame and vertex labels rendered in white/light ink; grid lines in a darker soft grid tone that stays visible without dominating. Edge tick labels (20/40/60/80) rendered in a lighter soft grey, clearly legible.
      Data: Same ~84 green (#009E73) markers at identical positions and with identical color to the light render — only chrome (background, ink, grid) flipped, confirming palette consistency across themes.
      Legibility verdict: PASS — no dark-on-dark failures; all title, vertex, and tick text is clearly visible against the near-black background.
