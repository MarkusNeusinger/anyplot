review:
  strengths:
  - 'Correct barycentric mapping: Sand at the apex, Silt bottom-left, Clay bottom-right,
    with x = clay + sand/2 and y = √3/2 · sand normalised by each row''s total; every
    point sits at its true ternary position and the triangle is kept equilateral by
    equal px-per-unit on both axes (k = min(drawW/…, drawH/…)).'
  - Grid at 20 % steps for all three components, each set parallel to the side opposite
    its vertex, dashed in the grid token and clearly lighter than the solid INK_SOFT
    triangle frame and the points.
  - Edge ticks are oriented along each component's own iso-lines (horizontal for Sand,
    slanted for Silt and Clay), so each edge's scale reads unambiguously in its direction
    of increase.
  - Composes the chart from MUI X primitives (ChartsDataProvider + ChartsSurface +
    ScatterPlot) and draws the ternary frame as a custom layer through useXScale/useYScale,
    the library's intended extension point.
  - Native ChartsTooltip with a valueFormatter that reports all three component shares
    per sample in the HTML output.
  - 'Theme tokens threaded through every element: both renders are fully legible,
    data color #009E73 identical across themes.'
  weaknesses:
  - 'Suggestion: each vertex carries two tick labels (for example "100" for Sand and
    "0" for Clay at the apex); omitting the 0 labels at the corners would leave one
    number per vertex.'
  - 'Suggestion: the band between the subtitle and the "Sand (%)" label is about 200
    px tall; shifting the triangle up a little would balance it against the bottom
    margin.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white, #FAF8F1, square 2400x2400 canvas.
      Chrome: bold dark title "Topsoil Texture · ternary-basic · javascript · muix · anyplot.ai" (~53% width) with a soft subtitle "65 compositions · grid and ticks every 20 %"; equilateral triangle outlined in dark ink-soft; bold vertex names "Sand (%)" (top), "Silt (%)" (bottom-left), "Clay (%)" (bottom-right); tick marks and 0–100 labels every 20 on all three edges, oriented along each component's iso-lines. All text readable.
      Data: 65 points in #009E73 (slightly translucent), cloud concentrated toward the Sand apex and centre, a few points toward the Clay and Silt corners; light dashed grid lines at 20 % steps for all three components, lighter than the points.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black, #1A1A17.
