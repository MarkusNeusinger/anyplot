review:
  strengths:
  - Builds a fully custom ternary chart on ChartContainer + ScatterPlot + useXScale/useYScale,
    since @mui/x-charts community has no native ternary chart — a strong example of
    idiomatic composition rather than reaching for a forbidden library
  - 'Complete feature set from the spec: 20%-interval grid, 20%-step tick marks on
    all three edges, labeled vertices, per-point tooltip with all three component
    values'
  - Deterministic, realistic bronze-alloy (Cu-Sn-Zn) dataset that sums to exactly
    100% and clusters plausibly toward the Copper apex
  - Theme tokens (t.ink, t.inkSoft, t.grid) correctly threaded through every custom
    SVG element — both renders are fully legible with identical data color
  weaknesses:
  - The triangle is undersized within the square canvas — tighten the Y_MIN/Y_MAX
    (and correspondingly X_MIN/X_MAX) margins so the triangle fills more of the available
    vertical space instead of leaving ~20-25% dead whitespace below the base
  - The central scatter cluster (~60-70% Copper) has several touching/overlapping
    markers — a touch of alpha transparency (e.g. opacity ~0.85) would make overlapping
    compositions easier to distinguish
  - Near the Copper apex, the "100" (left edge) and "0" (right edge) tick labels sit
    close together — nudge their dx offsets outward slightly for more breathing room
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Bold dark title centered at top (~55% canvas width). Solid dark triangle border, dashed light-gray grid lines at 20/40/60/80%, gray tick labels (0,20,40,60,80,100) on all three edges, bold vertex labels "Copper (%)" / "Tin (%)" / "Zinc (%)". All fully readable against the light background.
      Data: ~65 solid green (#009E73) circular markers, clustering toward the Copper apex with realistic spread toward Tin/Zinc-heavy regions.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same layout with title, tick labels, vertex labels, triangle border and grid lines all flipped to light ink/strokes. Fully legible against the dark background; no dark-on-dark failures observed.
      Data: Green (#009E73) markers pixel-identical in color and position to the light render — confirms only chrome flips between themes.
      Legibility verdict: PASS
