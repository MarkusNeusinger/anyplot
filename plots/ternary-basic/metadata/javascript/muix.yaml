review:
  strengths:
  - Genuinely custom-engineered ternary plot built on MUI X's composable ChartContainer
    plus useXScale/useYScale hooks — a technically sophisticated solution to a chart
    type MUI X does not natively support.
  - Correct equilateral-triangle projection math, grid lines at 20% intervals on all
    three axes, and edge tick marks (0-100 by 20) on all three edges with clearly
    labeled vertices.
  - 'Theme-adaptive chrome via window.ANYPLOT_TOKENS is threaded through every custom
    SVG layer (grid, ticks, vertex labels, title) — both renders are fully legible
    with the #009E73 data color preserved identically.'
  - Deterministic seeded LCG plus gamma-shape sampling produces a compositionally
    plausible point cloud that naturally clusters toward the Copper apex without needing
    an explicit annotation.
  - Responsive title font-sizing formula keeps the long mandated title string from
    overflowing or clipping in either theme.
  weaknesses:
  - 'Data realism: the ''Bronze Alloy'' framing implies a copper-dominant alloy (real
    bronze/gunmetal is typically ~85-98% Cu), but the sampled cloud spreads broadly
    across the simplex with many points at Cu 10-30% — not representative of actual
    bronze compositions. Either relabel as a generic Cu-Sn-Zn ternary system, or bias
    the gamma-shape parameters (e.g. raise the Cu shape parameter further, shrink
    Sn/Zn shapes) so most samples sit in the realistic 80-98% Cu band with only minor
    Sn/Zn variation.'
  - Beyond the natural clustering toward the Copper apex, there is no explicit visual
    emphasis (e.g. a reference marker for a canonical bronze composition, or color/size
    encoding of a secondary attribute) to guide the viewer to an insight — DE-03 storytelling
    is present but implicit only.
  - Markers in the densest mid-triangle region touch/overlap slightly (natural at
    N=65 with this spread) — a slightly smaller radius or lower alpha would keep clusters
    fully separable at a glance.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "Bronze Alloy Composition · ternary-basic · javascript · muix · anyplot.ai" in bold dark ink at top, fully visible with generous margin above and below. Equilateral triangle outlined in dark ink. Bold vertex labels "Copper (%)" (top), "Tin (%)" (bottom-left), "Zinc (%)" (bottom-right). Dashed light-gray grid lines at 20/40/60/80 parallel to each edge. Gray tick numerals (0,20,40,60,80,100) along all three edges, clearly legible and not clipped at the canvas border.
      Data: Green (#009E73-family, alpha ~0.85) circular markers, ~65 points, clustering toward the Copper apex while spreading across the simplex — no other categorical colors present (single series).
      Legibility verdict: PASS — all text reads cleanly against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title, now in light/cream text, fully legible. Triangle outline in light gray. Vertex labels in bold white/cream. Grid dashed lines and tick numerals in muted gray, both clearly visible against the dark background — no dark-on-dark failures observed anywhere (title, vertex labels, tick numbers all confirmed legible).
      Data: Markers are the identical green as the light render — only the chrome (background, ink, grid) flipped, confirming Imprint palette compliance.
      Legibility verdict: PASS — all text reads cleanly against the dark background, no dark-on-dark issues.
