review:
  strengths:
  - 'Highcharts has no native ternary chart type, yet the implementation builds an
    accurate one from scratch: a scatter series carries the data while a `chart.events.render`
    hook draws the triangle frame, 20% gridlines, vertex labels, and edge tick marks
    using a correct barycentric-to-Cartesian transform (`toPx`).'
  - 'Imprint palette is correctly applied and identical across themes: Sandy soils
    = #009E73 (brand green), Loamy soils and Clayey soils follow the canonical order
    (violet, steel-blue); background, text, and grid colors are theme-correct in both
    the light (#FAF8F1-like) and dark (#1A1A17-like) renders.'
  - 'Data is realistic and spec-aligned: sand/silt/clay soil-texture proportions (a
    textbook USDA soil-triangle use case explicitly named in the spec''s Applications
    section), normalized so each sample sums to 100%, with three clearly separated,
    distinguishable clusters.'
  - Title format is correct (`ternary-basic · javascript · highcharts · anyplot.ai`),
    legend labels match the series (Sandy/Loamy/Clayey soils), and the tooltip formatter
    reports all three component percentages.
  - 'Reproducible and clean: deterministic LCG (seed 42) for jittered cluster data,
    `animation: false` set on both `chart` and `plotOptions.series`, no stray imports,
    no fake interactivity.'
  weaknesses:
  - 'Layout balance (VQ-05): there is a noticeably large blank band between the title
    and the triangle''s apex (roughly a fifth of the canvas height) before any chart
    content appears — tighten `marginTop` and/or the yAxis top padding (currently
    max=1.05 vs. apex+label at ~0.94) so the plot sits more centered and the whitespace
    above/below is better balanced.'
  - 'Element visibility (VQ-03): within each cluster several same-color points touch
    or overlap at the cluster core (most visible in the Loamy cluster around 45-55%
    silt) — reduce `marker.radius` slightly from 7 or add a touch more spacing/alpha
    so individual points stay distinguishable even in dense sub-regions.'
  - 'Design polish (DE-01/DE-02): the custom triangle is already well above a generic
    default, but could be pushed further toward publication-ready — e.g. faint shaded
    soil-classification zones (sandy loam, silty clay, etc.) behind the 20% gridlines,
    or a subtle marker stroke/shadow for depth.'
  - 'Code structure (CQ-01): the implementation relies on several standalone helper
    functions (`makeLcg`, `soilCluster`, `toPoint`) plus the render-event closure
    — where practical, flatten toward a simpler imports → data → plot shape (e.g.
    inline the barycentric transform instead of a separate `toPoint` helper).'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "ternary-basic · javascript · highcharts · anyplot.ai" in dark ink at top, well readable and not overflowing/clipped. The custom-drawn triangle frame (dark ink stroke) has bold vertex labels "Sand" (top), "Silt" (bottom-left), "Clay" (bottom-right) in dark, semi-bold text, plus smaller gray edge tick labels (20/40/60/80) along each side with short tick marks. Internal gridlines at 20% steps are subtle mid-gray, visible but not dominant. Legend ("Sandy soils", "Loamy soils", "Clayey soils") sits centered below the triangle in muted gray text with color swatches.
      Data: Three clearly separated clusters of circular markers — green (#009E73, Sandy soils, near the Sand vertex), violet (Loamy soils, centered mid-triangle), and steel-blue (Clayey soils, near the Clay vertex). All points sit inside the triangle and are distinct from the background.
      Legibility verdict: PASS — all title, vertex labels, tick labels, and legend text are clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Title now rendered in light/near-white text, clearly legible. Triangle frame stroke, vertex labels ("Sand"/"Silt"/"Clay"), edge tick labels, and gridlines all flip to light-toned/theme-adaptive colors and remain clearly visible against the dark surface. Legend text is light gray, readable.
      Data: Same three clusters in the identical colors as the light render — green (#009E73), violet, and steel-blue — confirming data colors do not change between themes, only chrome.
      Legibility verdict: PASS — no dark-on-dark failures observed; all text elements (title, vertex/tick labels, legend) are clearly visible against the dark background.
