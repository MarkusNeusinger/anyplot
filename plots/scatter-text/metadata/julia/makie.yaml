review:
  strengths:
  - 'First categorical series renders as exact Imprint brand green #009E73, with all
    four sector colors matching canonical palette order 1-4 (green/lavender/blue/ochre)
    identically across both renders'
  - Theme-adaptive chrome (background, spines, grid, tick colors, legend text) is
    fully correct and readable in both light (#FAF8F1) and dark (#1A1A17) renders,
    with no dark-on-dark or light-on-light failures
  - Per-sector Gaussian clusters (distinct growth/margin mean+std per sector) produce
    a realistic, well-separated competitive-landscape scatter with plausible business-domain
    values
  - text! used correctly and exclusively as the marker substitute per the spec's core
    requirement, combined with a clean manually-built sector Legend and the correct
    mandated title format
  - 'KISS code structure: single seed, only used imports, no functions/classes, correct
    save API (plot-$(THEME).png, px_per_unit=2)'
  weaknesses:
  - 'Design storytelling is good but not yet publication-level: no focal point or
    emphasis calls out the standout outlier (CloudSpire, far right at ~35% growth)
    — a subtle annotation, size/weight variation, or callout would push Data Storytelling
    and Aesthetic Sophistication further'
  - 'Healthcare (lavender #C475FD) and Energy (ochre #BD8233) labels are rendered
    as unstroked text on the cream background; the style guide flags these hues as
    sub-3:1 WCAG contrast on light bg, and here the text color IS the entire visual
    element (no marker ink to fall back on) — consider a subtle ink-color text stroke/outline
    for these two series per the ''Optional outline pattern'' guidance, especially
    since it affects both themes'' worst-case legibility at mobile scale'
  - text! usage and the manual Legend/PolyElement construction are correct but fairly
    generic Makie patterns — consider leveraging a more distinctive Makie capability
    (e.g. per-label rotation/offset, a custom recipe, or GridLayout composition) to
    raise Library Mastery beyond baseline plot-function usage
  - The spec explicitly notes 'consider alpha transparency when labels overlap' and
    'for dense regions consider rotating text', but the chosen data/layout avoids
    any near-overlap scenario entirely, so the implementation never demonstrates handling
    the genre's core density-management techniques
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Title "scatter-text · julia · makie · anyplot.ai" in bold dark ink, clearly visible top-center; x-axis "Revenue Growth (%)" and y-axis "Profit Margin (%)" labels in dark ink, fully readable; tick labels (0/10/20/30 on y, 0/10/20/30/40 on x) in soft dark gray, readable; grid lines faint (~15% alpha), visible but not competing with data; legend ("Sector": Technology/Healthcare/Finance/Energy) frameless, positioned right of the plot, all labels legible in soft dark gray.
      Data: 28 company-name text labels colored by sector — Technology labels in brand green (#009E73), Healthcare in lavender, Finance in blue, Energy in ochre — matching canonical Imprint palette order 1-4. Labels form visually distinct spatial clusters per sector (tech = high growth, healthcare = high margin, finance = mid/low growth-margin, energy = low margin).
      Legibility verdict: PASS — all text (title, axis labels, ticks, legend, and all 28 data labels) is clearly readable against the light background; no light-on-light failures. Lavender/ochre labels have technically lower WCAG contrast against cream but remain visually legible at this bold weight/size.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Title, axis labels, and tick labels flip to light ink/soft-light-gray tokens, all clearly visible; grid lines faint light-on-dark, visible but subtle; legend text and title flip to light tokens, fully readable; no dark-on-dark failures anywhere.
      Data: Same 28 labels in identical hues to the light render (brand green Technology, lavender Healthcare, blue Finance, ochre Energy) — confirmed pixel-identical data colors, only chrome flipped.
      Legibility verdict: PASS — all chrome and data text reads clearly against the dark background; no black-on-black or unreadable elements detected in either theme.
