review:
  strengths:
  - Text labels replace markers via geom_text, each centered on its exact (x, y) with
    no displacement
  - 'Theme tokens thread through every chrome element; data color #009E73 identical
    in both renders'
  - Label size (≈9 pt) fits 20 items and stays readable in both themes; close pairs
    remain distinguishable
  weaknesses:
  - 'DE-02 (both): all four panel borders drawn and the major grid in solid INK_SOFT
    at 0.12 mm reads as a high-contrast lattice → drop top/right borders (or all)
    and fade the grid to ~15 % ink. Likely cause: panel.border = element_rect(color
    = INK_SOFT) and panel.grid.major color = INK_SOFT.'
  - 'VQ-06 (both): x-axis titled ''Price (normalized)'' on a 0–100 scale hides the
    dollar values the data carries → plot price in USD with a ''$'' axis title. Likely
    cause: the min-max rescaling into products$x.'
  - 'DQ-02 (both): the products (SwiftPay, CloudNine, VisionAI, EcoTools, ProStudio…)
    mix payment, cloud, AI and tool products on one price/quality landscape, so the
    scenario reads generic → names from one product category. Likely cause: the name
    vector.'
  - 'CQ-03 (code): library(dplyr) is loaded but no dplyr function is used → remove
    it. Likely cause: leftover import.'
  - 'Suggestion: derive the axis limits from the data instead of typed c(-5, 105)
    / c(55, 105), as the library prompt recommends.'
  - 'Suggestion: the empty band above 100 on the y axis could be trimmed so the labels
    use more of the panel.'
