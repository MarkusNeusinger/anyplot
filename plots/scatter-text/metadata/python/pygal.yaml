  strengths:
  - 'Theme-adaptive chrome: backgrounds and text tokens correct in both renders'
  - 'Brand green #009E73 identical across themes'
  weaknesses:
  - 'SC-01 (both): the ten points are joined by a line in data order, a line chart
    instead of a scatter of text labels → no connecting stroke. Likely cause: pygal.XY
    default stroke=True.'
  - 'SC-02 (both): no product name is drawn anywhere, so no item is shown as its text
    label (C1, C2) → print every label at its (x, y). Likely cause: print_labels not
    set.'
  - 'VQ-01 (both): tick labels ~16 px and axis titles ~18 px on the 4800 px canvas
    read tiny beside the plot → ticks ~44 px, axis titles ~56 px on a 3200 px canvas.
    Likely cause: font sizes sized for an 800 px chart.'
  - 'VQ-05 (both): canvas is 4800x2700, not a canonical size → 3200x1800 (−1600 ×
    −900). Likely cause: width=4800, height=2700.'
  - 'VQ-03 (both): the only data element is a thin 2 px line; the text marks the plot
    type depends on are invisible → bold labels at ~48 px. Likely cause: show_dots=False
    without print_labels.'
  - 'SC-04 (both): title reads ''Python'' instead of the mandated lowercase ''python''
    → ''scatter-text · python · pygal · anyplot.ai''. Likely cause: title string.'
  - 'DQ-01 (both): the render shows none of the plot type''s aspects — no label, no
    label density → text labels at all ten coordinates. Likely cause: labels never
    printed.'
  - 'LM-01 (code): pygal.XY used with its default stroke and without print_labels,
    the library''s own way to print per-point labels → stroke=False, print_labels=True.
    Likely cause: chart options.'
  - 'Suggestion: a tighter y range around the data would remove the empty lower third.'
