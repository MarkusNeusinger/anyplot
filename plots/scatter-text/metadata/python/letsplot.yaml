review:
  strengths:
  - Every language is drawn as a bold geom_text label anchored centered on its exact
    (x, y) value, so the word itself is the mark; no label is moved off its coordinates
  - 'Label size (geom_text size=6) suits 30 items: every label reads clearly in both
    themes with no collisions, and alpha=0.9 keeps any close pairs separable'
  - 'Theme tokens thread through title, axis titles, tick labels, legend box and text,
    so both renders are fully legible on #FAF8F1 and #1A1A17; data colors are identical
    across themes'
  - layer_tooltips() with a title line and Category/Paradigm/Abstraction lines gives
    the HTML export useful per-label hover detail
  - Programming languages placed by paradigm and abstraction level is a neutral, recognisable
    data story with descriptive directional axis titles
  weaknesses:
  - 'VQ-07, SC-04 (both): the eighth and ninth groups, Scientific (Fortran) and Legacy
    (COBOL), are both drawn in the INK_SOFT text color (#4A4A44 / #B8B7B0), a non-palette
    hex, so their two legend entries look identical and cannot be told apart → give
    Scientific Imprint position 8 #99B314 and Legacy the muted anchor (#6B6A63 light
    / #A8A79F dark), or merge the two single-member groups. Likely cause: the `IMPRINT_PALETTE[i]
    if i < 7 else INK_SOFT` overflow rule in group_colors.'
  - 'DE-02 (both): the grid uses full-strength INK at size 0.05, which rasterises
    unevenly — some lines (x = 0.1–0.3, y = 0.2–0.4) render as dark, near-solid rules
    while others are faint — and the panel is framed on all four sides, against the
    style guide''s subtle 15 % grid and L-shaped/no spine rule → a uniform grid at
    the 15 % ink token (rgba of INK at 0.15) and no top/right frame. Likely cause:
    `panel_grid_major=element_line(color=INK, size=0.05)` plus theme_minimal''s panel
    border/axis_line on all sides.'
  - 'Suggestion: a slightly lighter label alpha in the centre cluster would let the
    Kotlin/Swift/C# group recede behind the outlying Functional cluster.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, 3200x1800 landscape.
      Chrome: bold dark title "scatter-text · python · letsplot · anyplot.ai" top-left (~52 % width); axis titles "Object-Oriented ← Paradigm → Functional" and "Abstraction Level (Low → High)" in INK; tick labels 0–1 / 0.1–0.9 in INK_SOFT; legend "Primary Use" in a #FFFDF6 box on the right with 9 entries using "a" glyphs. Grid lines uneven: some render dark, others faint; panel framed on four sides.
      Data: 30 bold programming-language names at their coordinates, colored by Primary Use — General #009E73 (Python, Java, C#, Groovy, Scala), Web #C475FD, Systems #4467A3, Mobile #BD8233, Functional #AE3030 (cluster on the right), Scripting #2ABCCD, Data Science #954477; Scientific (Fortran) and Legacy (COBOL) both in the same dark grey. No label collisions.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, axis titles in light INK #F0EFE8, ticks and legend text in #B8B7B0, legend box #242420; no dark-on-dark text. Grid again uneven (some lines bright).
      Data: same label colors as the light render (Imprint hues unchanged); Fortran/COBOL flip to light grey with the chrome token. Brand green clearly visible.
      Legibility verdict: PASS
