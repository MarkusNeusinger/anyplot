review:
  strengths:
  - 'Text is the mark: every label centered on its exact (x, y) with text_align=''center''
    and text_baseline=''middle'''
  - Correct 3200x1800 canvas with toolbar_location=None and balanced min_border reservations;
    nothing clipped
  - Theme tokens threaded through title, axes, ticks and grid; brand green identical
    in both renders
  - HoverTool exposes language and group in the interactive HTML
  - Data in a tidy DataFrame with column constants feeding ColumnDataSource
  weaknesses:
  - 'VQ-01 (both): the language labels are drawn at 27-31pt, below the 34pt tick-label
    reference, and read smaller than the tick numbers although they are the plot''s
    main content → at least 34pt for the subtle groups and about 38pt for the prominent
    one (+3 to +7pt). Likely cause: the pt values in the styles dict (31/29/27/30/27/27).'
  - 'DQ-03 (both): the simulated embedding places languages in the wrong neighbourhoods:
    Ruby sits with R, Julia and MATLAB in the scientific cluster, Erlang among Java/PHP/Python
    in the modern cluster, SQL and Groovy among Fortran and COBOL in the legacy cluster
    → move Ruby to the scripting group, Erlang to the functional group beside Elixir,
    SQL to the data/scientific group and Groovy to the JVM/modern group. Likely cause:
    the index lists modern, scientific and legacy (indices 4, 18, 25, 28).'
  - 'CQ-04 (code): lines 159-178 draw an invisible scatter for hover plus a groupby
    loop of LabelSets, about 20 lines → one `p.text(x=X_DIM, y=Y_DIM, text=LANGUAGE,
    source=source, text_font_size=<column of ''NNpt'' strings>, text_alpha=TEXT_ALPHA,
    text_color=BRAND, text_align="center", text_baseline="middle")` glyph with the
    HoverTool attached to it (bokeh.plotting). Likely cause: LabelSet annotations
    used as data marks.'
  - 'Suggestion: the per-group size and opacity hierarchy is invisible to the reader;
    encoding the group in Imprint colors with a legend (as the Notes allow) would
    explain it.'
  - 'Suggestion: the separate jitter pass with the hand-tuned indices 18 and 23 duplicates
    the per-group normal draws and could be dropped.'
