review:
  strengths:
  - Labels sit exactly on their data values with no nudge or repel, colored by group
    from the Imprint palette
  - Theme tokens threaded through every chrome element; both renders readable with
    identical data colors
  - No unreadable label overlap across the 25 labels
  weaknesses:
  - 'VQ-05 (both): canvas is 4800x2700 → 3200x1800 (-1600 x -900 px). Likely cause:
    figure_size=(16, 9) with dpi=300 instead of (8, 4.5) at dpi 400.'
  - 'SC-04 (both): the title reads ''Python'' with a capital P → lowercase ''python''
    as the mandated language segment. Likely cause: the labs(title=...) string.'
  - 'DQ-02 (both): coordinates are hand-placed on abstract ''Dimension 1 (Paradigm
    Similarity)'' / ''Dimension 2 (Abstraction Level)'' axes rather than taken from
    a real measurement → use real measured values for each label. Likely cause: the
    literal languages list with invented positions.'
  - 'DQ-03 (both): SQL is placed lowest on ''Abstraction Level'' (about -1.5), below
    C (about -0.5), although SQL is a high-level declarative language → its abstraction
    value above the systems languages. Likely cause: the SQL row at line 56.'
  - 'VQ-01 (both): the language labels, the plot''s main content, render at about
    0.7x the tick-label size (geom_text size 11 against 16 pt ticks) → match the tick-label
    size (+4 to +5). Likely cause: geom_text(size=11).'
  - 'VQ-03 (both): the legend keys are a tiny colored ''a'' that is hard to match
    to the label colors → larger key glyphs. Likely cause: default geom_text legend
    key; guides(color=guide_legend(override_aes={''size'': ...})).'
  - 'CQ-01 (code): the Data block reads IMPRINT and ends by binding category_colors,
    there are no column constants for x, y and label, and aes() types ''x'', ''y'',
    ''label'', ''category'' → one Data block ending in df, column constants with role
    comments, colors derived below the block. Likely cause: lines 21-83 predate the
    adaptable-code layout.'
  - 'CQ-04 (code): the comments at lines 21 and 64 call the Imprint list the ''Okabe-Ito
    palette'' → name it Imprint. Likely cause: a stale comment.'
  - 'DE-02 (both): a full four-sided panel_border frames the panel where the style
    guide defaults to an L-shaped frame → drop panel_border and keep axis_line. Likely
    cause: panel_border=element_rect(color=INK_SOFT, ...).'
  - 'Suggestion: keep the legend in the data''s group order with limits taken from
    df instead of alphabetical.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, but the canvas is 4800x2700.
