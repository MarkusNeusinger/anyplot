  - Tidy DataFrame read through column constants; axis titles and legend title come
    from the constants
  - Proxy Patch handles give a titled 'Paradigm' legend whose swatches match the label
    colors in both themes (C4)
  - Exact 3200x1800 canvas with balanced margins; theme tokens threaded through title,
    ticks, spines, grid and legend
  weaknesses:
  - 'SC-02 (both): Groovy (4.5, 3.2) and Kotlin (4.8, 3.2) overlap so that ''Groovy''
    reads as ''Groo'' under ''Kotlin'' and the two words cannot both be made out,
    against the spec''s dense-region bullet (C3) → translucency for the labels (alpha
    about 0.6 instead of 0.9, -0.3) or a smaller size for the dense cluster, keeping
    every label on its coordinates. Likely cause: uniform fontsize=9 and alpha=0.9
    in the ax.text call.'
  - 'DQ-03 (both): C# is placed in ''JVM-based'' although it runs on .NET, and Crystal
    in ''Functional'' although it is a Ruby-like object-oriented compiled language
    → assign both to groups that match them (e.g. rename the group ''Managed runtime
    (JVM/.NET)'' and move Crystal out of Functional). Likely cause: the Paradigm values
    in the rows list.'
  - 'Suggestion: the legend frame could use the ELEVATED_BG token from the library
    prompt''s chrome mapping instead of PAGE_BG.'
  - 'Suggestion: the blue Systems labels read dimmer than the other groups on the
    dark background; a slightly heavier weight would even them out.'
