review:
  strengths:
  - Text mode with centered anchoring makes each language name the mark at its exact
    (x, y), as the spec asks
  - Eight paradigms in canonical Imprint order with a titled legend; data colors identical
    across both themes
  - Plot reads only df and column constants, so the axis ranges follow the data (max
    * 1.07 / 1.1)
  - Native hovertext gives exact coordinates per language in the HTML view
  weaknesses:
  - 'DQ-02 (both): the paradigm groups misclassify well-known languages: Python, R
    and Julia are labelled ''Functional'' (with Prolog, a logic language), Ruby/Perl/PHP/Lua
    are ''OOP'' while Erlang/Elixir are ''Scripting'', and MATLAB is ''Systems'' →
    assign each language a paradigm a reader would recognise (e.g. Python/Ruby/Perl/PHP/Lua
    as Scripting, Erlang/Elixir as Functional, MATLAB as Scientific, Prolog as Logic).
    Likely cause: the PARADIGM list in the Data block.'
  - 'Suggestion: slightly smaller or translucent text in the 8-10 abstraction band
    would help OCaml and Haskell read apart.'
