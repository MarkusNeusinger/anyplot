review:
  strengths:
  - 'Attempt-1 feedback was addressed precisely: title fontsize raised (22→32px),
    grid/border fully hidden instead of the previous four-sided box, and cluster centers/spreads
    widened to fill more of the canvas.'
  - Halo-stroke technique (page-background-colored stroke behind each label) keeps
    labels legible where they're dense, and adapts correctly per theme.
  - Idiomatic Chart.js plugin architecture (afterDatasetsDraw) replaces point markers
    with text; pointRadius:0 + pointHitRadius:14 keeps hover targets usable without
    drawing visible markers.
  - Correct Imprint palette usage — three clusters use canonical positions 1-3, identical
    across themes; all chrome correctly threads theme tokens.
  - Deterministic reproducibility via a fixed-seed LCG, appropriate given the browser
    has no seeded Math.random().
  weaknesses:
  - Title still fills only ~41% of plot width at 32px — under the ~50-70% "comfortable"
    target. Could size up further (e.g. ~36-40px) for stronger visual hierarchy without
    risking overflow.
  - The far bottom-right corner of the canvas remains visibly empty even after the
    cluster re-centering — a touch more rightward/downward spread on the "Functional
    & Data" cluster (or a small counter-clockwise center shift) would balance the
    frame further.
  - The upper-right "Scripting & Web" sub-cluster (Ruby/Elixir/Swift/Lua/Python/Dart)
    is still the densest region on the canvas; legible at full size but worth another
    small widening for mobile-scale legibility.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "scatter-text · javascript · chartjs · anyplot.ai" in bold dark ink, top-centered, now at 32px (up from attempt-1's 22px). Legend below the title with three swatches (green/lavender/blue) labeled "Systems & Low-Level", "Scripting & Web", "Functional & Data". Axis titles "Semantic Dimension 1 (t-SNE)" (x) and "Semantic Dimension 2 (t-SNE)" (y) in dark ink. Tick labels, grid, and axis border are all hidden by design — fully borderless plot area (the four-sided box from attempt 1 is gone).
      Data: 30 programming-language names rendered as colored text instead of point markers, grouped into three domain clusters (systems/low-level in green, scripting/web in purple, functional/data in blue). Each label has a thin off-white halo/stroke keeping it legible near other labels. First series color is #009E73 brand green as required.
      Legibility verdict: PASS — all text (title, legend, axis titles, and all 30 data labels) is clearly readable against the light background; no light-on-light issues. The upper-right cluster (Ruby/Elixir/Swift/Lua/Python/Dart) is the densest region but remains legible at full resolution.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title now in off-white ink, legend swatches identical colors with off-white text labels. Axis titles in off-white. Same fully borderless layout as the light render.
      Data: Same 30 labels in the same three colors (green/lavender/blue) and same positions as the light render — data colors are identical between themes, confirming only chrome flipped. The halo stroke now renders as a dark-background-colored outline, staying subtle rather than clashing.
      Legibility verdict: PASS — no dark-on-dark failures; title, legend, axis titles, and all data labels are clearly visible against the near-black background. Brand green and the other two Imprint hues both read well on the dark surface.
