review:
  strengths:
  - Halo-stroke technique (page-background-colored stroke behind each text label)
    keeps labels legible where they crowd or cross gridlines, and works correctly
    in both light and dark themes.
  - 'Correct Imprint palette usage — three clusters use canonical positions 1-3 (#009E73
    green, #C475FD lavender, #4467A3 blue), identical across themes; all chrome (title,
    axis labels, grid, legend) correctly threads theme tokens.'
  - Idiomatic Chart.js plugin architecture (afterDatasetsDraw hook) used to replace
    point markers with text — pointRadius:0 with pointHitRadius:14 keeps hover targets
    usable without drawing visible markers.
  - Deterministic reproducibility via a small fixed-seed LCG, appropriate since the
    browser has no seeded Math.random().
  - Tooltip callback surfaces the label text on hover in the interactive HTML detail
    view, a nice touch beyond the static PNG that doesn't fake anything in the render.
  weaknesses:
  - The upper-right cluster (Ruby, Elixir, Swift, Lua, Python, Dart) is noticeably
    denser than the rest of the plot — legible at full size but a legibility risk
    once scaled to ~400px mobile width; slightly wider jitter spread or a touch more
    separation there would help.
  - Title occupies only ~28-30% of plot width at the default 22px font — under the
    style guide's ~50-70% target; could size up slightly for stronger visual hierarchy.
  - Chart.js's default grid draws a full four-sided border box around the plot area
    rather than an L-shaped or borderless frame, working against the style guide's
    spine-removal preference — consider hiding the outermost grid lines or the axis
    border.
  - Large empty regions, especially the bottom-right quadrant, leave the canvas visually
    unbalanced — tightening cluster centers or increasing spread slightly would fill
    the frame more evenly.
  - The spec's optional suggestion of alpha transparency for overlapping labels isn't
    used anywhere; not required here since no labels actually overlap, but worth keeping
    in mind if cluster density increases.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "scatter-text · javascript · chartjs · anyplot.ai" in bold dark ink, top-centered. Legend below title with three swatches (green/lavender/blue) and labels "Systems & Low-Level", "Scripting & Web", "Functional & Data" in matching colors. Axis titles "Semantic Dimension 1 (t-SNE)" (x) and "Semantic Dimension 2 (t-SNE)" (y) in dark ink. Tick labels are hidden by design (numeric t-SNE coordinates are not meaningful). A subtle grid (both axes) is visible at low contrast, forming a light rectangular frame around the plot area.
      Data: 30 programming-language names rendered as colored text instead of point markers, grouped into three domain clusters (systems/low-level in green, scripting/web in purple, functional/data in blue). Each label has a thin off-white halo/stroke that keeps it legible where it nears gridlines. First series color is #009E73 brand green as required.
      Legibility verdict: PASS — all text (title, legend, axis titles, and all 30 data labels) is clearly readable against the light background; no light-on-light issues. The only soft spot is the tightly packed upper-right cluster (Ruby/Elixir/Swift/Lua/Python/Dart), still legible at full resolution but denser than the rest.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title now in off-white ink, legend swatches identical colors to light render with white text labels. Axis titles in off-white. Grid lines subtle, low-contrast against the dark surface, same rectangular-frame look as light.
      Data: Same 30 labels in the same three colors (green/lavender/blue) and same positions as the light render — data colors are identical between themes, confirming only chrome flipped. Same off-white-vs-dark chrome swap applied correctly; the stroke halo now shows as a dark-background-colored outline (matches t.pageBg for dark) so it remains subtle rather than clashing.
      Legibility verdict: PASS — no dark-on-dark failures; title, legend, axis titles, and all data labels are clearly visible against the near-black background. Brand green and the other two Imprint hues both read well on the dark surface.
