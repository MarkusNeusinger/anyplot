review:
  strengths:
  - 'Text-as-marker is exactly the spec''s core ask: a custom scatter slot (slots={{
    scatter: TextScatter }}) replaces the default marker with an SVG <text> element
    per point, positioned via xScale/yScale.'
  - Text halo (paintOrder="stroke" with stroke={t.pageBg}, strokeWidth=4) keeps every
    label legible against gridlines and neighboring labels in both themes.
  - 'First categorical series is brand green #009E73 and the remaining three clusters
    follow the canonical Imprint order (lavender, blue, ochre) — identical hues in
    light and dark, only chrome flips.'
  - Deterministic LCG (fixed seed 20260902) plus a staggered per-cluster offset grid
    produces reproducible, collision-free label placement across 32 points.
  - 'Correct harness contract: default-exported component, skipAnimation set, sizes
    from window.ANYPLOT_SIZE, no manual mount/HTML.'
  - Mandated title format followed exactly, with font size scaled proportionally to
    the descriptive-title length so it never overflows.
  - Canvas dimension gate passed (3200x1800 landscape); no clipped text at any edge
    in either render.
  weaknesses:
  - 'Design excellence is functional but not pushed further: default MUI X axis lines/frame
    are still visible and the grid/whitespace treatment doesn''t go beyond stock chrome
    — a bit more refinement (e.g. trimming axis lines, tightening grid alpha) would
    lift DE-01/DE-02.'
  - Axis labels ('Embedding dimension 1' / 'Embedding dimension 2') are generic placeholders
    typical of PCA/t-SNE/UMAP output but don't tie to any specific named dimension
    or add interpretive value — acceptable for the spec but a missed opportunity for
    a stronger data story.
  - Spec notes suggest alpha transparency or rotation for dense/overlapping regions;
    the current fixed LAYOUT offsets avoid overlap only because the cluster count
    and word count are fixed at 8x4 — the code has no overlap-avoidance safeguard
    if reused with denser data.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1-consistent), not pure white.
      Chrome: Title "Word Embedding Projection · scatter-text · javascript · muix · anyplot.ai" in bold dark ink, top-left, fully visible and not clipped. Axis labels "Embedding dimension 1" / "Embedding dimension 2" in dark ink, both axes tick labels (0-100 by 20s) clearly readable. Legend top-right with 4 colored swatches (Animals, Food & drink, Technology, Sports) all fully visible, not clipped at the right edge. Subtle light gray gridlines, visible but not dominant.
      Data: 32 text labels (words) act as the data marks, colored by cluster: green (#009E73, Animals — brand-first-series rule respected), lavender/purple (Food & drink), blue (Technology), ochre/amber (Sports) — matches canonical Imprint palette order. Each label has a thin light-colored stroke halo that keeps it crisp against the gridlines. No overlapping text, no clipped/cropped labels at canvas edges.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17-consistent), not pure black.
      Chrome: Title in bold white/light ink, fully visible, not clipped. Axis labels and tick labels rendered in light ink, clearly readable against the dark background — no dark-on-dark failures observed. Legend swatches and text fully visible top-right. Gridlines subtle light-gray-on-dark, visible but unobtrusive.
      Data: Same 32 text labels in the identical four colors as the light render (green/lavender/blue/ochre) — confirmed pixel-for-pixel consistent hues, only the page chrome (background, gridlines, title/axis ink) flipped to the dark palette. Stroke halo now uses the dark pageBg color, keeping labels crisp against dark gridlines too. No overlap, no clipping.
      Legibility verdict: PASS
