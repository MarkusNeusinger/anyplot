review:
  strengths:
  - Every word is drawn as the mark itself, centered with textAnchor=middle and dominantBaseline=central
    on its exact (x, y), so the text pins the position
  - A custom SVG layer composed into ChartsSurface through the useXScale/useYScale
    hooks, alongside ChartsGrid, ChartsXAxis/YAxis and an HTML ChartsLegend in ChartsWrapper,
    is idiomatic MUI X v9 composition for a mark type MUI X has no built-in for
  - A page-colored halo (paintOrder=stroke, stroke=pageBg) keeps every label crisp
    over the grid lines in both themes
  - Four topic clusters in Imprint order (green, lavender, blue, ochre) with a legend
    for the cluster color, identical in both renders; only the chrome flips
  - Bold labels at 19 to 25 px stay legible in both themes, and no label collides
    with another, with the legend, or with the axes
  weaknesses:
  - 'SC-01 (both): font size encodes each word''s distance to its cluster centroid.
    That is a derived fourth variable the spec neither requires nor offers; the Notes
    tie font size only to the number of labels → use one font size for all labels,
    sized for the 32 labels. Likely cause: the `size: Math.round(FONT_MIN + (FONT_MAX
    - FONT_MIN) * (1 - dists[i] / maxDist))` mapping and the subtitle clause describing
    it.'
  - 'Suggestion: add ChartsTooltip so the HTML view can show each word''s exact coordinates
    on hover.'
  - 'Suggestion: a slightly denser data layout inside each cluster would exercise
    the spec''s translucency or smaller-text handling for overlapping labels.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the full canvas, with no white chart panel.
      Chrome: centered bold title "scatter-text · javascript · muix · anyplot.ai" with a soft-ink subtitle under it; horizontal legend at top right (Animals, Food & drink, Technology, Sports); axis titles "Embedding dimension 1" and "Embedding dimension 2"; ticks 0–100 on x and 0–80 on y; subtle gray grid in both directions, no axis lines. All text is dark ink and readable.
      Data: 32 bold words in four clusters. Animals are #009E73 green at top left, Food & drink #C475FD lavender at top right, Technology #4467A3 blue at bottom left, Sports #BD8233 ochre at bottom right. The words near each cluster's center are drawn larger (sparrow, chutney, endpoint, dugout). No labels overlap.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, subtitle, legend text, axis titles and tick labels all flip to light ink and are clearly readable, with no dark-on-dark text. Grid lines are subtle dark gray but visible.
      Data: the same four colors as the light render, identical in hue and position. Green and lavender stand out well; the blue Technology words have the lowest contrast but are still readable at bold 19 px or more.
      Legibility verdict: PASS
