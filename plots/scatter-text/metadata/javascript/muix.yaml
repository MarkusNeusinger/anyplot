review:
  strengths:
  - 'Every word is the mark itself: a bold <text> centered on its exact (x, y) via
    textAnchor middle and dominantBaseline central, drawn through useXScale/useYScale
    in a custom SVG layer inside the MUI X composition API (ChartsDataProvider + ChartsSurface)'
  - Category color is explained by the native ChartsLegend, driven from scatter series
    in the data provider, with all four Imprint colors legible as text on both backgrounds
  - A page-colored halo (paintOrder stroke, stroke = pageBg) keeps words readable
    where they cross grid lines, in both themes
  - 'Chrome is threaded through theme tokens: ink title, inkSoft subtitle and ticks,
    axis lines and tick marks removed, subtle grid; readable in light and dark'
  - Deterministic LCG seed and a clean column/data/plot split; skipAnimation set and
    the component is default-exported per the harness contract
  weaknesses:
  - 'Suggestion: the 32 words sit on a fixed eight-slot offset template per cluster,
    so all four clusters share the same shape; varying the per-cluster spread would
    read more like a real t-SNE projection.'
  - 'Suggestion: the legend glyphs are circles while the marks are words; a short
    colored sample word or text-style swatch would tie the legend closer to the marks.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole 3200x1800 canvas.
      Chrome: dark bold title "scatter-text · javascript · muix · anyplot.ai" centered at top with a soft-ink subtitle "32 labels in 4 clusters · each word is centered on its (x, y)"; horizontal legend top-right (Animals, Food & drink, Technology, Sports); axis titles "Embedding dimension 1" / "Embedding dimension 2"; ticks 0–100 and 0–80; subtle vertical and horizontal grid, no axis lines or tick marks. All text readable.
      Data: 32 bold words in four clusters — Animals in #009E73 green (top-left), Food & drink in purple (top-right), Technology in blue (bottom-left), Sports in ochre (bottom-right). No labels overlap; a page-colored halo separates words from grid lines. Empty middle band between clusters.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, subtitle, legend text, axis titles and tick labels all render in light ink and are clearly readable; grid lines subtle but visible. No dark-on-dark text.
      Data: identical word positions and identical palette colors to the light render (green, purple, blue, ochre); only chrome flipped. The blue Technology words have the lowest contrast but are bold 22 px and still clearly legible; brand green reads well.
      Legibility verdict: PASS
