review:
  strengths:
  - Custom TextScatter renderer via the ScatterChart `slots.scatter` API cleanly replaces
    default point markers with text labels, directly fulfilling the spec's core requirement
    using an idiomatic, distinctive MUI X extensibility pattern.
  - Centrality-based font-size encoding (words nearer a cluster's centroid render
    larger) gives each of the four clusters a visual anchor and creates genuine data
    storytelling without adding clutter.
  - Text halo (paintOrder=stroke, stroke=t.pageBg) keeps every label legible over
    the gridlines in both themes, a thoughtful legibility technique beyond the library
    defaults.
  - Correct theme-adaptive chrome, Imprint palette in canonical order (brand green
    first for Animals, lavender/blue/ochre for the other clusters), and a clean spines-off,
    subtle-grid presentation.
  - Deterministic seeded LCG for the jitter keeps the layout fully reproducible.
  weaknesses:
  - Low-centrality labels render as small as ~14px against high-centrality labels
    at ~20px; at the 400px mobile thumbnail scale the smallest labels risk being harder
    to read — consider raising the minimum font-size floor slightly.
  - The spec suggests alpha transparency for overlapping labels; not demonstrated
    here (not currently needed since the staggered layout avoids overlap, but would
    help a denser variant).
  - The legend groups points by semantic category (Animals, Food & drink, Technology,
    Sports) rather than treating this as a single scattered-labels series — a nice
    readability enhancement, but a minor departure from the spec's implied single-series
    framing.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (~#FAF8F1), correct for the light theme.
      Chrome: Title "Word Embedding Projection · scatter-text · javascript · muix · anyplot.ai" is dark, bold, and fully readable in the top-left. X-axis label "Embedding dimension 1" and Y-axis label "Embedding dimension 2" are dark and legible. Tick labels (0/20/40/60/80/100 on both axes) are dark and readable. Subtle gridlines at each tick. Legend (top-right, 4 color swatches: Animals/Food & drink/Technology/Sports) is fully readable.
      Data: 32 word labels arranged in 4 quadrant clusters, each cluster in one Imprint color — Animals in brand green #009E73, Food & drink in lavender/purple, Technology in blue, Sports in ochre/brown. Font size varies per word based on proximity to its cluster centroid (larger = more central), giving each cluster a visual anchor. All labels have a subtle background-colored halo so they stay legible over the gridlines. No overlaps between any labels.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black (~#1A1A17), correct for the dark theme.
      Chrome: Title is white/light and fully readable. Axis labels and tick labels are light-colored and clearly legible against the dark background — no dark-on-dark issues found. Gridlines are subtly visible.
      Data: Same 32 word labels in the same 4 quadrant clusters, using the identical Imprint colors as the light render (brand green, lavender, blue, ochre) — confirmed unchanged; only the chrome (background, title, axis/tick text) flipped for the dark theme. Halo strokes correctly use the dark page background color so labels remain crisp against gridlines.
      Legibility verdict: PASS
