review:
  strengths:
  - The Nairobi/Perth and Berlin/London label collisions flagged in attempt 1 are
    resolved via targeted pixel offsets in LABEL_OFFSETS, and both label pairs now
    read as clearly separate lines in both renders.
  - Lima and Cairo are lifted off the y=0 gridline with a -22px offset, clearing the
    axis line in both themes.
  - 'Clever text-as-marker rendering: symbolSize:0 with per-label textBorderColor
    matched to the page background keeps every city name legible over gridlines and
    neighboring labels in both light and dark themes.'
  - Accurate, realistic city climate dataset (e.g. Singapore 27.0C/2340mm, Riyadh
    26.0C/100mm, Moscow 5.8C/700mm) closely matches real-world figures.
  - Clean, idiomatic ECharts option built via REGIONS.map()/cities.map() to generate
    one series per continent - concise and KISS-compliant.
  - Correct Imprint palette in canonical order with identical data colors between
    light and dark renders; theme-adaptive chrome (title, axis, tick, grid) is correctly
    mapped in both themes.
  weaknesses:
  - Design Excellence is solid but not yet at publication level (DE-01 5/8) - the
    plot reads as a well-executed default rather than a distinctively art-directed
    chart; consider a subtler background rule (e.g. a light diagonal reference band
    per climate zone) to push aesthetic sophistication further.
  - Data storytelling relies on continent color-coding alone (DE-03 4/6) - an explicit
    visual callout (e.g. a shaded 'tropical' quadrant or a annotated outlier note
    for Singapore/Mumbai's extreme rainfall) would sharpen the insight further, though
    this is optional polish, not a defect.
  - Library Mastery is good but generic-adjacent (LM-02 4/5) - the symbolSize:0 +
    textBorderColor label-only technique is ECharts-idiomatic but not unique to ECharts;
    a distinctive ECharts-only feature (e.g. visualMap, graphic elements, or markArea
    zones) would push this further.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 - not pure white.
      Chrome: Title "scatter-text - javascript - echarts - anyplot.ai" in dark ink is clearly readable at top; a centered continent legend (Africa, Asia, Europe, Americas, Oceania) sits below it; axis titles "Average Temperature (C)" and "Average Annual Rainfall (mm)" plus gray tick labels are legible against the light background; grid lines are subtle warm-gray.
      Data: 26 city names render as colored text with no separate markers (symbolSize:0), each colored by its continent's Imprint palette color (Africa = brand green #009E73) with a background-matched text outline for legibility over gridlines and near other labels. Nairobi/Perth and Berlin/London - the two pairs flagged as overlapping in attempt 1 - now sit on clearly separate lines with visible vertical/horizontal gaps. Lima and Cairo are lifted above the y=0 gridline rather than sitting on it.
      Legibility verdict: PASS - all text readable against the light background, no light-on-light issues, no remaining label collisions.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 - not pure black.
      Chrome: Title, legend, and axis text all render in light ink and are clearly readable against the dark surface - no dark-on-dark failures; grid lines are subtle light-gray at low opacity.
      Data: Data colors are identical to the light render (Africa confirmed #009E73, same hues for Asia/Europe/Americas/Oceania); only the chrome (background, text, grid) flips. The same text-outline technique now uses the dark background color, keeping labels crisp against the near-black surface. The same Nairobi/Perth, Berlin/London, and Lima/Cairo fixes hold identically in this render.
      Legibility verdict: PASS - all text readable against the dark background, no dark-on-dark failures, brand green remains visible and identical to the light render.
