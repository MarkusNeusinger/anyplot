review:
  strengths:
  - 'Clever text-as-marker rendering: symbolSize:0 with a label textBorderColor matched
    to the page background keeps every city name legible over gridlines and neighboring
    labels in both themes, without needing separate markers.'
  - Accurate, realistic city climate dataset — temperature/rainfall pairs (e.g. Singapore
    27.0°C/2340mm, Tokyo 15.4°C/1520mm, Riyadh 26.0°C/100mm) match real-world climate
    figures closely.
  - Clean, idiomatic ECharts option built via REGIONS.map() to generate one series
    per continent — concise, KISS-compliant, no unnecessary abstraction.
  - Correct Imprint palette application in canonical order with identical data colors
    between light and dark renders; legend and series colors match.
  - Sensible fixed axis bounds (0–32°C, 0–2500mm) comfortably contain every data point
    with no clipping or overflow.
  weaknesses:
  - 'Label overlap: ''Nairobi'' (19.0°C, 800mm) and ''Perth'' (18.6°C, 730mm) sit
    close enough that their labels visually collide in both renders — nudge one label
    vertically (e.g. label offset or position:''top''/''bottom'') or reduce font size
    in this cluster.'
  - 'Label overlap: ''Berlin'' and ''London'' labels nearly touch — same fix as above,
    a small manual offset for crowded clusters would resolve it.'
  - A few low-rainfall labels ('Lima', 'Cairo') sit directly on the y=0 gridline/axis,
    visually merging with the axis line in both renders — offset them upward slightly
    so they clear the axis.
  - Design Excellence is solid but not yet at publication level — consider adding
    one more layer of visual hierarchy (e.g. subtly emphasizing an outlier climate)
    to push the storytelling beyond a plain labeled scatter.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "scatter-text · javascript · echarts · anyplot.ai" is dark ink, clearly readable. Legend (Africa/Asia/Europe/Americas/Oceania) with colored swatches sits centered below the title, readable. Axis titles "Average Temperature (°C)" and "Average Annual Rainfall (mm)" are dark and legible; tick labels are soft gray and legible. Gridlines are subtle warm-gray, visible but not dominant.
      Data: 26 city names rendered as colored text (no markers, symbolSize:0), each colored by its continent's Imprint palette color, with a background-matched text outline for legibility over gridlines. First series (Africa) is #009E73 brand green, confirmed. Two label clusters overlap slightly: "Nairobi"/"Perth" and "Berlin"/"London". "Lima" and "Cairo" sit right on the y=0 gridline.
      Legibility verdict: PASS (all text readable; overlap noted above is a design/spacing issue, not a legibility failure)

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Title and legend text render in light ink, clearly readable against the dark background. Axis titles and tick labels are light-colored and legible; no dark-on-dark failures observed. Gridlines are subtle and visible.
      Data: Same 26 city labels in identical Imprint colors to the light render (confirmed — first series still #009E73), with the same text-outline technique now using the dark background color, keeping every label crisp against the black surface. Same overlap issues persist (Nairobi/Perth, Berlin/London) since they are geometric, not theme-dependent.
      Legibility verdict: PASS (no dark-on-dark text; same minor overlap issue as light render)
