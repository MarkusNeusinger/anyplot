review:
  strengths:
  - 'Faithful to the spec''s core requirement: markers are fully replaced by dataLabels
    text rendered at each point''s exact coordinates (marker.enabled: false + dataLabels),
    never a simulated overlay.'
  - 'Clever legend workaround for a marker-free scatter series: since Highcharts draws
    no swatch when markers are disabled, the legend''s labelFormatter renders each
    family name in its own series color via useHTML, keeping the color key legible
    without a fake swatch.'
  - Correct canonical Imprint palette assignment across all 5 language-family clusters
    (green, lavender, blue, ochre, matte red in canonical order), identical data colors
    between light and dark renders.
  - 'Clean, deterministic, dependency-free code: hardcoded synthetic t-SNE-style embedding
    data, no functions/classes, idiomatic disable-marker + dataLabels pattern for
    the ''text instead of point'' technique.'
  - Both renders are properly theme-adapted (background, ink, grid tokens) with generous
    margins; all 25 labels are visible with no overlap and no edge clipping.
  weaknesses:
  - 'Matte red (#AE3030, ''Scripting & ops'' cluster: Bash/Perl/Lua/PowerShell/Groovy)
    sits close to the WCAG 3:1 contrast floor against the near-black dark background
    (#1A1A17), matching the style guide''s own documented caveat that matte-red is
    marginally below the threshold on dark. The dataLabels.style.textOutline is set
    to t.pageBg (matches the background, so it adds no contrast) rather than an ink-colored
    stroke — consider a thin ink-colored outline on dark theme for that cluster to
    push it further above the floor.'
  - 'Data storytelling is fairly flat: the 5 language-family clusters are separated
    and color-coded but there is no additional emphasis (e.g. highlighting the largest/most
    central cluster, or a callout) to give the chart a single stronger focal point
    beyond the base family grouping.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "scatter-text · javascript · highcharts · anyplot.ai" in dark bold text, axis titles "t-SNE dimension 1" / "t-SNE dimension 2" in soft dark ink, subtle light gray gridlines on both axes, a legend titled "Language family" below the plot with 5 color-coded text entries (no swatches, since the marker-free series draw none). All chrome is clearly legible against the light background.
      Data: 25 programming-language names rendered as bold colored text directly at their (x, y) coordinates instead of markers, grouped into 5 clusters: "Data & scientific" (Python, R, Julia, MATLAB, SAS) in brand green #009E73, "Web & frontend" (JavaScript, TypeScript, PHP, Ruby, Dart) in lavender, "Systems programming" (C, C++, Rust, Go, Zig) in blue, "JVM & enterprise" (Java, Kotlin, Scala, C#, VB.NET) in ochre, "Scripting & ops" (Bash, Perl, Lua, PowerShell, Groovy) in matte red. First series is confirmed #009E73. No overlapping text, no clipped labels at any canvas edge.
      Legibility verdict: PASS — all text (title, axis titles, legend, all 25 data labels) is clearly readable against the off-white background.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title and axis titles now rendered in light ink (#F0EFE8-family), gridlines flipped to a light-on-dark subtle tone, legend text and title flipped to light chrome. Layout, spacing, and content are pixel-identical to the light render other than chrome color.
      Data: The same 25 labels in the same positions with identical data colors to the light render (green, lavender, blue, ochre, matte red) — confirmed no data-color drift between themes.
      Legibility verdict: PASS overall — all chrome text and the green/lavender/blue/ochre clusters are clearly legible; the matte-red "Scripting & ops" cluster (Bash, Perl, Lua, PowerShell, Groovy) is visually readable (bold weight, adequate size) but has comparatively lower contrast against the near-black surface than the other 4 clusters — a borderline, not a dark-on-dark failure (text is not the same color as the background), and it matches a caveat already documented in the style guide about matte-red on dark surfaces.
