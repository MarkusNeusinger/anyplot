review:
  strengths:
  - 'Faithful to the spec''s core requirement: markers are fully replaced by dataLabels
    text rendered at each point''s exact coordinates (marker.enabled: false + dataLabels),
    never a simulated overlay.'
  - 'Attempt-1 feedback is fully addressed: the matte-red ''Scripting & ops'' cluster
    now gets a theme-adaptive ink-colored textOutline on dark (instead of a page-background
    outline that added no contrast), visibly lifting Bash/Perl/Lua/PowerShell/Groovy
    off the near-black surface.'
  - New low-opacity focus-halo behind the 'Data & scientific' cluster gives the chart
    a genuine single focal point instead of five visually equal groups, directly resolving
    the prior data-storytelling weakness — and it is drawn first so z-order keeps
    it beneath every text label in both themes.
  - Correct canonical Imprint palette assignment across all 5 language-family clusters
    (green, lavender, blue, ochre, matte red in canonical order), identical data colors
    between light and dark renders.
  - 'Clever legend workaround for a marker-free scatter series: since Highcharts draws
    no swatch when markers are disabled, the legend''s labelFormatter renders each
    family name in its own series color via useHTML, keeping the color key legible
    without a fake swatch.'
  - 'Clean, deterministic, dependency-free code: hardcoded synthetic t-SNE-style embedding
    data, no functions/classes, idiomatic disable-marker + dataLabels pattern for
    the ''text instead of point'' technique. All 25 labels are visible with no overlap
    and no edge clipping in either render.'
  weaknesses:
  - 'Data storytelling is still fairly modest: only the single ''Data & scientific''
    cluster gets the focus-halo treatment, so while there is now one clear focal point,
    the other 4 clusters remain undifferentiated flat color groups with no secondary
    hierarchy (e.g. size or weight variation).'
  - Visual refinement stays close to the style-guide baseline outside of the new halo
    — subtle grid and generous spacing are present, but no further custom typography,
    annotation, or chrome touch was added beyond what attempt 1 already had.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "scatter-text · javascript · highcharts · anyplot.ai" in dark bold text, axis titles "t-SNE dimension 1" / "t-SNE dimension 2" in soft dark ink, subtle light gray gridlines on both axes, a legend titled "Language family" below the plot with 5 color-coded text entries (no swatches, since the marker-free series draw none). A new soft green focus-halo (low-opacity brand-green circle) sits behind the "Data & scientific" cluster (Python, R, Julia, MATLAB, SAS), giving that group a clear focal point. All chrome is clearly legible against the light background.
      Data: 25 programming-language names rendered as bold colored text directly at their (x, y) coordinates instead of markers, grouped into 5 clusters: "Data & scientific" in brand green #009E73 (inside the halo), "Web & frontend" (JavaScript, TypeScript, PHP, Ruby, Dart) in lavender, "Systems programming" (C, C++, Rust, Go, Zig) in blue, "JVM & enterprise" (Java, Kotlin, Scala, C#, VB.NET) in ochre, "Scripting & ops" (Bash, Perl, Lua, PowerShell, Groovy) in matte red. First series is confirmed #009E73. No overlapping text, no clipped labels at any canvas edge.
      Legibility verdict: PASS — all text (title, axis titles, legend, all 25 data labels) is clearly readable against the off-white background.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title and axis titles now rendered in light ink, gridlines flipped to a light-on-dark subtle tone, legend text and title flipped to light chrome. The focus-halo is now a low-opacity dark-green disc, still visibly distinct from the near-black background behind "Data & scientific". Layout, spacing, and content are otherwise pixel-identical to the light render other than chrome color.
      Data: The same 25 labels in the same positions with identical data colors to the light render (green, lavender, blue, ochre, matte red) — confirmed no data-color drift between themes. The matte-red "Scripting & ops" labels (Bash, Perl, Lua, PowerShell, Groovy) now carry a visible light ink-colored text outline instead of the previous background-matched outline, clearly lifting them off the near-black surface — this directly fixes the attempt-1 low-contrast weakness. No dark-on-dark failures anywhere.
      Legibility verdict: PASS — all chrome text and all 5 clusters, including the previously borderline matte-red cluster, are clearly legible against the near-black background.
