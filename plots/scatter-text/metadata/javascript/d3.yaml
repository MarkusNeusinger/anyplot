review:
  strengths:
  - Genuinely idiomatic and distinctive use of d3-force (forceSimulation/forceX/forceY/forceCollide)
    to auto-resolve label collisions while pulling each label back toward its true
    data coordinate — a technique unique to D3's ecosystem and hard to replicate in
    other charting libraries.
  - Well-designed prominence hierarchy (font-size 14/17/20px, weight, opacity 0.6/0.8/1.0)
    that creates real visual hierarchy and storytelling, letting well-known languages
    read first while lesser-known ones recede.
  - 'Perfect Imprint palette compliance — first series is #009E73, canonical 4-color
    order (green/lavender/blue/ochre), data hues identical across light/dark themes,
    correct theme-adaptive backgrounds and chrome.'
  - Custom-built, horizontally-centered legend using getBBox measurement for precise
    spacing — a nice refinement beyond a default legend.
  - Clean, KISS, deterministic code (fixed-seed LCG since the browser has no seeded
    RNG), correct canvas size (3200x1800), no fake interactivity, current d3 v7 API
    throughout.
  - Realistic, neutral dataset (40 well-known programming languages clustered into
    4 paradigm/domain groups) that closely matches the spec's word-embedding / dimensionality-reduction
    application.
  weaknesses:
  - 'Mobile legibility: at the ~400px mobile thumbnail, roughly half the labels (the
    21 prominence-1 items at 14px / opacity 0.6) are essentially unreadable — only
    the bold prominence-3 labels (Python, JavaScript, TypeScript, Rust, C++, Haskell,
    Elixir, etc.) stay legible. Raise the minimum font-size floor (e.g. FONT_SIZE[1]
    from 14 to ~16px) and/or the minimum opacity floor (OPACITY[1] from 0.6 to ~0.7)
    so lower-prominence labels survive the 8x downscale to mobile width.'
  - No axis labels or dimension indicators are present at all. The code explicitly
    models this as a dimensionality-reduction embedding (per the in-code comment),
    so adding minimal 'Component 1' / 'Component 2' (or similar) axis titles would
    orient the viewer and satisfy axis-labeling expectations without cluttering the
    minimalist aesthetic.
  - The four category islands leave a fairly empty cross-shaped band through the center
    of the canvas; slightly widening the category-anchor spread (cx/cy) or the jitter
    range would better balance canvas fill and reduce the large dead zone between
    clusters.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white, not dark.
      Chrome: Bold centered title "scatter-text · javascript · d3 · anyplot.ai" in dark ink at the top, clearly readable. A horizontally-centered legend row below the title shows 4 color-dot + label pairs (Systems/Web/Data Science/Functional) in dark secondary-ink text, all legible. No axis lines, ticks, or axis labels are drawn.
      Data: 40 programming-language names rendered as colored text instead of markers, grouped into 4 loosely-separated clusters (Systems=top-left, Web=top-right, Data Science=bottom-left, Functional=bottom-right). First/primary category (Systems) renders in #009E73 brand green; the other three categories use the next Imprint palette hues (lavender, blue, ochre) in canonical order. Font size, weight, and opacity scale with a "prominence" tier so well-known languages (Python, JavaScript, TypeScript, Rust, C++, Go, R, Haskell, Elixir, Scala) are bold and fully opaque while lesser-known ones (Zig, Ada, Nim, Perl, Elm, Dart, SPSS, Stata, Prolog, Racket, etc.) are smaller and more translucent.
      Legibility verdict: PASS at full canvas resolution — all text renders crisp against the light surface with no dark-on-light readability issues. At the ~400px mobile thumbnail, however, roughly half of the labels (the smallest, most translucent tier) become very hard to read; only the bold, high-prominence labels stay legible at that scale.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black, not light.
      Chrome: Same title and legend layout, now rendered in light ink (title) and light secondary-ink (legend labels) against the dark surface — fully readable, no dark-on-dark text anywhere.
      Data: Identical label positions, categories, and data colors as the light render (#009E73 green, lavender, blue, ochre) — confirms only chrome (background, title/legend ink) flips between themes while data hues stay constant.
      Legibility verdict: PASS at full canvas resolution — no dark-on-dark failures observed for any chrome or data element. Same mobile-thumbnail legibility caveat as the light render applies to the smallest-tier labels.
