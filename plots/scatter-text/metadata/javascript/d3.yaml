review:
  strengths:
  - Idiomatic use of d3-force (forceX/forceY/forceCollide) to prevent label collisions
    — a genuinely distinctive D3 technique (LM-02) that a naive port to another library
    could not easily replicate.
  - 'Correct Imprint palette in canonical order for the four paradigm categories (green
    -> lavender -> blue -> ochre), brand green #009E73 first, identical data colors
    and theme-correct chrome across both renders (VQ-07).'
  - Prominence-driven typography (font-size 16/18/20px, weight, opacity) creates a
    clear visual hierarchy so well-known languages read first without needing annotations
    (DE-03).
  - 'Clean, KISS-structured code: deterministic fixed-seed LCG, current d3 v7 API
    (.join(), forceSimulation().stop() + manual ticks), no fake interactivity.'
  weaknesses:
  - A large empty band cuts across the middle of the canvas between the four paradigm
    islands; it matches the 'embedding gaps' concept but leaves roughly a third of
    the canvas visually inert — consider a slightly larger jitter radius or pulling
    cluster centers a bit closer to tighten the composition.
  - Title occupies only ~25% of canvas width at 22px, noticeably lighter than the
    strong typographic hierarchy used for the data labels themselves — a touch more
    size or weight would balance the composition.
  - No visual callout (e.g. a faint island outline or subtle background tint) ties
    each color-coded cluster back to its category name beyond the legend swatch —
    a nice-to-have for data storytelling, not required by the spec.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Bold dark title "scatter-text · javascript · d3 · anyplot.ai" centered at top; a horizontally-centered category legend (Systems/Web/Data Science/Functional) with color swatches directly beneath it; small "Component 1" / "Component 2" axis captions in soft gray. All chrome text is clearly legible against the light background — no light-on-light issues.
      Data: 40 programming-language names function as the markers themselves, colored by paradigm category and arranged in four loosely separated clusters (Systems bottom-left-ish, Web upper-right, Data Science lower-left, Functional lower-right). Well-known languages (Python, JavaScript, Rust, TypeScript, C++, Go) render larger, bolder, and fully opaque; niche languages (Zig, Ada, SPSS, Prolog) render smaller and semi-transparent. First category (Systems) uses brand green #009E73; the other three use the next Imprint palette hues in canonical order.
      Legibility verdict: PASS — all title, legend, axis-caption, and data-label text is readable; no overlapping labels observed.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Title, legend labels, and axis captions all flip to light tones (white/light-gray) and remain fully readable — no dark-on-dark failures found.
      Data: Same 40 language labels at the same coordinates with identical colors to the light render (Systems green, Web lavender, Data Science blue, Functional ochre) — only the chrome (background/text) flips; the data-color layer is unchanged between themes, as required.
      Legibility verdict: PASS — all chrome and data text is clearly readable against the dark surface; brand green #009E73 remains vivid on both backgrounds.
