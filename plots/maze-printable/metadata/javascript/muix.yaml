review:
  strengths:
  - 'Creative, honest solution to a real library limitation: MUI X community has no
    maze/graph primitive, so a single-point ScatterChart plus a custom `slots.scatter`
    component draws the raw SVG walls while `useDrawingArea()` inherits MUI''s own
    margin/aspect math — no manual layout guesswork.'
  - 'Maze generation genuinely guarantees a single solution: a randomized DFS spanning
    tree carves the passages, and a separate BFS independently verifies/reports the
    solution length (116 steps) in the footnote without ever drawing the spoiler path.'
  - Deterministic and reproducible via a seeded mulberry32 PRNG (seed 42) since the
    browser has no native seeded RNG.
  - 'Clear print-oriented visual hierarchy: border stroke is 1.75x the interior wall
    stroke, both scaled from cell size (not flat pixel constants) so the maze stays
    legible at thumbnail sizes.'
  - 'Correct theme handling: the page chrome (background, title, footnote) follows
    ANYPLOT_THEME while the maze card intentionally keeps fixed ink-on-paper colors,
    matching the spec''s explicit ''black walls on white background for maximum contrast
    and ink efficiency'' requirement; both renders are fully readable with no dark-on-dark
    or light-on-light failures.'
  - 'Goal marker uses brand green #009E73 with a white ''G'' for contrast; start marker
    is a plain bold ''S'' — clean, unambiguous, print-friendly.'
  weaknesses:
  - Data storytelling is minimal beyond the wall-weight hierarchy and the footnote's
    step-count difficulty cue — there's no additional visual emphasis (e.g. a subtle
    distance/heat cue) to guide the solver's eye toward structure.
  - Grid size is hardcoded to a single 22x22 instance; the spec's recommended range
    (15-40) is never varied or demonstrated, so only one difficulty level is shown.
  - The maze-generation and pathfinding logic (mulberry32, neighborsOf, solutionLength,
    MazeMark) pulls the file away from a flat KISS script into several helper functions
    — necessary for a real maze algorithm, but worth noting against the KISS baseline.
  - Footnote text (seed/grid/solution metadata) is quite small relative to the 2400x2400
    canvas — still legible at full size, but among the first elements to soften when
    the PNG is scaled down for thumbnails.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white page (#FAF8F1-consistent), matching Imprint light chrome.
      Chrome: Title "maze-printable · javascript · muix · anyplot.ai" centered at top in dark ink, clearly legible. Footnote "22×22 grid · seed 42 · 116-step solution" in soft gray ink below the maze card, clearly legible.
      Data: A square maze card (off-white paper, black ink walls) sits centered below the title. Border is visibly heavier than interior corridor walls, creating a clear frame/corridor weight hierarchy. Start cell top-left marked with bold black "S". Goal cell bottom-right marked with a brand-green (#009E73) filled circle containing a white "G". No other colors used.
      Legibility verdict: PASS — all text (title, footnote, S, G) is clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black page (#1A1A17-consistent), matching Imprint dark chrome.
      Chrome: Same title, now rendered in light ink, clearly legible against the dark page. Footnote text rendered in a light soft-gray tone, clearly legible against the dark page (theme-adaptive via ANYPLOT_TOKENS.inkSoft).
      Data: The maze card itself intentionally keeps fixed ink-on-paper colors (black walls on off-white paper) regardless of theme — a deliberate design choice matching the spec's print-artifact requirement ("black walls on white background for maximum contrast and ink efficiency"). The goal marker is identical brand green (#009E73) with white "G", confirming data colors are unchanged from the light render; only the surrounding page chrome flips.
      Legibility verdict: PASS — no dark-on-dark failures; title and footnote both flip correctly to light-on-dark, and the maze card's fixed print colors remain fully legible since they sit on their own off-white surface rather than directly on the dark page.
