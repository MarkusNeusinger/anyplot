review:
  strengths:
  - Maze generation uses a randomized DFS backtracker that carves a spanning tree
    over the grid, correctly guaranteeing exactly one solution path as the spec requires
  - 'Clean print-artifact composition: fixed black-ink-on-paper maze with a theme-adaptive
    page background and title, matching the spec''s ''black walls on white background
    for maximum contrast and ink efficiency'' requirement while still respecting light/dark
    chrome'
  - Deterministic and reproducible via a seeded mulberry32 PRNG (seed 42), with the
    seed and grid size disclosed in a footnote
  - 'Correct MUI X harness contract: default export, skipAnimation, disableVoronoi,
    square orientation directive matching the 2400x2400 canvas actually produced'
  - S/G start and goal markers are clear, high-contrast, and use the Imprint brand
    green (#009E73) for the goal
  weaknesses:
  - The ScatterChart is used purely as a sized canvas host for a single invisible
    dummy point — none of MUI X's native scatter rendering is actually shown, which
    is a workaround rather than idiomatic use of the library's plotting API. Consider
    whether a more direct chart primitive (or clearer justification in comments) would
    better demonstrate MUI X mastery.
  - At mobile thumbnail scale (~400px wide), the dense 22x22 grid of thin maze corridors
    will be hard to visually parse — consider a slightly heavier wall strokeWidth
    relative to cell size, or a modest reduction in grid density, to keep the puzzle
    legible when scaled down.
  - Visual refinement is solid but generic — a 4px outer border and plain black walls
    read as 'well-configured default' rather than 'publication-ready'; consider subtle
    refinements (e.g. slightly lighter/varied line weights, a softer outer frame)
    to raise polish above the baseline.
  - Data storytelling is minimal beyond the S/G color contrast — since this is a puzzle
    rather than a data narrative, that is largely acceptable, but a subtle visual
    cue reinforcing difficulty/scale (already partially covered by the grid-size footnote)
    would strengthen hierarchy further.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white page background, consistent with #FAF8F1, extending behind the title and around the maze card.
      Chrome: Title "maze-printable · javascript · muix · anyplot.ai" is centered at the top in dark ink, fully readable and not clipped. Footnote "22x22 grid · seed 42" sits bottom-left of the maze card in muted dark ink at reduced opacity — clearly legible.
      Data: The maze itself is a black-ink-on-off-white-paper grid (22 columns x 22 rows) bordered by a bold outer frame, with a bold "S" letter marking the start cell (top-left) and a brand-green (#009E73) filled circle with a white "G" marking the goal cell (bottom-right). All wall segments are dark, crisp, and consistently thick.
      Legibility verdict: PASS — all text (title, S, G, footnote) is clearly readable against both the page and the paper-colored maze surface; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black page background, consistent with #1A1A17, surrounding the maze card.
      Chrome: Title is rendered in light/white text, clearly readable against the dark page. The maze "card" itself intentionally keeps its off-white paper background and black ink walls unchanged from the light render — a deliberate design choice (documented in code comments) treating the maze as a fixed print artifact, matching the pattern used in the sibling maze-circular muix implementation. Only the surrounding page chrome (background, title color) flips with theme.
      Data: Wall colors, the "S" label, the green "G" goal marker, and footnote colors are pixel-identical to the light render, as expected since they live inside the theme-invariant paper card.
      Legibility verdict: PASS — title is fully readable in light text on the dark page; the ink-on-paper maze card remains highly legible on its own fixed contrast, with no dark-on-dark or light-on-light failures anywhere in the render.
