review:
  strengths:
  - Randomized depth-first search with a seeded mulberry32 RNG carves a spanning tree,
    so the 22 × 22 maze has exactly one route from S (top-left) to G (bottom-right)
    and is reproducible from the seed.
  - Walls are drawn as square-capped 4 px CSS (8 px PNG) lines on the cell edges with
    a 1.75× heavier closed outer boundary, so the walls look print-friendly and the
    passages (~41 px CSS) leave room for a pen.
  - 'The maze is a print artifact: black walls on #FAF8F1 paper in both themes, so
    it reads with full contrast on the dark page while the title and caption chrome
    flip via ANYPLOT_TOKENS.'
  - 'S and G are easy to tell apart: S is a bold ink letter and G sits on a brand-green
    #009E73 disc.'
  - 'Uses MUI X composition idiomatically: ChartsContainer with hidden axes plus a
    custom layer that reads useDrawingArea() to size square cells, with skipAnimation
    set.'
  weaknesses:
  - 'Suggestion: the caption''s solution-length computation (BFS, ~20 lines) exists
    only for a difficulty cue the spec does not ask for; dropping it would shorten
    the code without changing the maze.'
  - 'Suggestion: the gap between the title and the paper card is larger than the gap
    between the card and the caption; balancing the vertical whitespace would tighten
    the page.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 page; the maze sits on a same-colored paper card with a subtle grid-token border and rounded corners.
      Chrome: centered title "maze-printable · javascript · muix · anyplot.ai" in dark ink at the top (~43% of width); grey caption "22 × 22 cells · seed 42 · solution route of 116 steps" at the bottom. All readable.
      Data: 22 × 22 maze with near-black (#1A1A17) walls of consistent thickness, heavier closed outer boundary, bold "S" in the top-left cell, "G" on a #009E73 green disc in the bottom-right cell. Generous margin; nothing touches the edge.
      Legibility verdict: PASS

