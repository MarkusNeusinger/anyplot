review:
  strengths:
  - 'Mathematically correct maze: recursive-backtracker DFS spanning tree guarantees
    exactly one solution path with no loops or isolated pockets.'
  - 'Print-friendly minimalist look: axes and grid fully hidden, thick consistent
    wall strokes (borderWidth 9, square caps/joins), generous canvas margins.'
  - 'Idiomatic vector-drawing trick: renders the entire maze as a single line dataset
    with null-point breaks between wall segments, a clean use of Chart.js primitives
    to draw arbitrary shapes.'
  - Clear Start (green triangle, top-left) / Goal (purple star, bottom-right) markers
    in canonical Imprint order, matching the spec's example layout, with the internal
    'Walls' dataset correctly filtered out of the legend.
  - 'Fully theme-adaptive chrome: title, legend, and background correctly flip between
    the FAF8F1/1A1A17 surfaces while the Start/Goal marker colors stay pixel-identical
    across both renders.'
  - Deterministic reproducibility via a tiny fixed-seed LCG, appropriate for a browser
    runtime with no native seeded RNG.
  weaknesses:
  - Walls are colored with the theme-adaptive ink token, so they invert to white-on-black
    in the dark render — pleasant for the website but a slight departure from the
    spec's explicit 'black walls on white background for maximum contrast and ink
    efficiency' intent (the light render, which users would actually print, is unaffected,
    so this is a minor nuance rather than a defect).
  - 'Library Mastery is generic (LM-02): the null-point line-segment technique for
    drawing walls is portable to any point/line-based charting library. A Chart.js-native
    custom plugin (options.plugins with an afterDraw canvas hook) would better showcase
    a feature distinctive to this library.'
  - 'Minor KISS deviation (CQ-01): several small helper functions (makeRng, shuffle,
    cellIndex, addWall) are used — reasonable given the maze-generation algorithm''s
    complexity, but slightly beyond the ''no functions'' ideal; cellIndex in particular
    could be inlined.'
  - Design Excellence is solid but stops short of publication-grade polish (DE-01/DE-02/DE-03
    in the 4-6 range) — e.g. no subtle refinement such as a soft accent on the Start/Goal
    markers or an emphasis cue beyond shape/color to elevate visual hierarchy further.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Bold dark title "maze-printable · javascript · chartjs · anyplot.ai" at the top, clearly legible; a "Start / Goal" legend in dark text sits below the maze. All chrome text reads cleanly against the light surface.
      Data: A dense 20x20 black-line maze fills most of the square canvas — thick, consistent double-line walls forming corridors with a fully enclosed outer boundary. A filled green triangle (#009E73) marks Start in the top-left cell; a lavender star marks Goal in the bottom-right cell. Colors match Imprint palette positions 1-2 in canonical order.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Title now renders in light/off-white text, clearly legible; legend text is light-colored and readable. No dark-on-dark failures — every chrome element correctly flipped from the light render.
      Data: Maze walls have inverted to off-white/cream lines on the dark background (still crisp and consistent) since walls use the theme-adaptive ink token rather than a palette color. The Start (green triangle) and Goal (lavender star) markers are pixel-identical in color and position to the light render — only chrome (walls included) flipped as expected for non-data structural elements.
      Legibility verdict: PASS
