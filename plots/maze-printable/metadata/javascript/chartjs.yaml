review:
  strengths:
  - 'Mathematically correct maze: recursive-backtracker DFS spanning tree guarantees
    exactly one solution path, no loops or isolated pockets'
  - 'Chart.js-idiomatic wall rendering: a custom plugin (beforeDatasetsDraw) draws
    walls directly on the canvas 2D context, mapping data-space coordinates through
    the chart''s own scale.getPixelForValue API instead of a portable point/line-dataset
    trick'
  - 'Print-friendly minimalist look: axes/grid fully hidden, thick consistent wall
    strokes, generous canvas margins'
  - Clear Start (green triangle) / Goal (lavender star) markers in canonical Imprint
    order, matching the spec's top-left/bottom-right example
  - Fully theme-adaptive chrome (walls use t.ink) with pixel-identical marker colors
    across light and dark renders
  - Deterministic, fixed-seed LCG generation appropriate for a browser runtime with
    no native seeded RNG
  - 'KISS-ified since attempt 1: cellIndex helper inlined, only the two functions
    the algorithm truly needs (makeRng, shuffle) remain'
  weaknesses:
  - Walls use the theme-adaptive ink token, so they invert to white-on-black in the
    dark render — correct for the website's theme system, but a slight departure from
    the spec's literal 'black walls on white background for maximum contrast and ink
    efficiency' (the light/printable render itself is unaffected)
  - 'Goal marker (pointStyle: ''star'') renders as a thin multi-line asterisk, visually
    lighter-weight than the solid filled Start triangle — a filled shape (e.g. pointStyle
    ''rect'' or a custom glyph) would give the two markers more symmetric visual weight'
  - Design Excellence held flat since attempt 1 (DE-01/02/03 still 6/5/4) — the requested
    extra layer of visual polish on the Start/Goal markers wasn't added this round
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Bold dark title "maze-printable · javascript · chartjs · anyplot.ai" centered at top, clearly legible. A "Start / Goal" legend in dark text sits centered below the maze. No axes/ticks/grid shown (intentionally hidden — cell coordinates carry no measurement meaning).
      Data: A dense 20x20 black-line maze fills nearly the whole square canvas — thick (9px), consistent wall strokes with a fully enclosed outer boundary and a single-solution internal corridor structure. A filled green triangle (#009E73, Imprint position 1) marks Start in the top-left cell; a lavender star (#C475FD, Imprint position 2) marks Goal in the bottom-right cell, exactly matching the spec's example layout.
      Legibility verdict: PASS — title, legend, and all maze structure are crisp and readable; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Title and legend now render in light/off-white text, clearly legible — no dark-on-dark failures. Maze walls have inverted to off-white/cream lines (they use the theme-adaptive ink token, same as text), still crisp and uniformly thick.
      Data: Start (green triangle) and Goal (lavender star) markers are pixel-identical in color, size, and position to the light render — only the chrome (including the wall color, since it's theme ink rather than a palette color) flipped, as expected.
      Legibility verdict: PASS — all text and maze structure clearly readable in the dark theme; data marker colors confirmed identical across both renders.
