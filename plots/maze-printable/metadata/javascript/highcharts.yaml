review:
  strengths:
  - Recursive-backtracker (DFS) maze generation guarantees a perfect maze with exactly
    one solution path, matching the spec's core requirement precisely.
  - Clean, print-optimized black-walls-on-white-background design in the light render,
    with fully theme-adaptive ink flip (white walls on near-black) in the dark render.
  - Deterministic via a fixed seed (1337) and a documented custom LCG, since no seeded
    RNG exists in-browser.
  - Uses a distinctive advanced Highcharts technique — chart.renderer.path() combined
    with axis.toPixels() — to draw the maze as vector art tied to the chart's coordinate
    system rather than as a plotted series.
  - Start/Goal markers use brand green (#009E73, always-first rule) and matte red
    in a defensible traffic-light 'go/stop' semantic pairing, each with a readable
    letter label (S/G) giving redundant, colorblind-safe encoding beyond color alone.
  - Both renders are fully theme-correct with no clipping at any canvas edge; wall
    stroke width is consistent and clearly visible throughout.
  weaknesses:
  - Design Excellence is only at the 'well-configured default' level — the maze relies
    purely on theme ink/palette tokens with no additional refinement (e.g. a subtle
    frame/border treatment, corner rounding, or soft accent) that would elevate it
    beyond a functional grid.
  - No visual hierarchy beyond the two markers — consider a slightly more deliberate
    typographic contrast between title and subtitle, or a subtle accent behind the
    S/G markers, to strengthen the focal points without giving away the solution path.
  - chart.spacing is very tight ([10,10,10,10] CSS px), leaving almost no breathing
    room between the maze and the canvas edge — a touch more margin would read as
    more deliberately designed while still keeping the puzzle grid dominant.
  - Only one distinctive Highcharts feature (custom renderer path) is leveraged; consider
    using the renderer for a light decorative frame or subtle drop-shadow on the S/G
    markers to raise Library Mastery further.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches the required #FAF8F1 surface — not pure white, not dark.
      Chrome: Title "maze-printable · javascript · highcharts · anyplot.ai" in bold dark ink at the top, subtitle "24×24 grid · seed 1337 · start (S) to goal (G)" in softer gray beneath it. Both are clearly legible against the light background.
      Data: A 24×24 grid maze rendered as black wall segments (consistent stroke width) filling almost the entire square canvas, forming a single-solution labyrinth. A green circle marker labeled "S" (white letter) sits at the top-left cell; a red circle marker labeled "G" (white letter) sits at the bottom-right cell. First series color is the required brand green #009E73.
      Legibility verdict: PASS — all text and structural elements are readable, no overlap, no clipping at any edge.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches the required #1A1A17 surface — not pure black, not light.
      Chrome: Same title and subtitle, now rendered in light ink/soft-gray tones, clearly legible against the dark background. No dark-on-dark failures observed.
      Data: The maze walls flip to a light (near-white) stroke color — correct theme-adaptive chrome behavior, since the walls are chrome/ink rather than a data series. The S and G markers retain identical colors to the light render (#009E73 green and matte red), confirming the Imprint data-color rule (data colors constant across themes, only chrome flips).
      Legibility verdict: PASS — all text and structural elements are readable, no overlap, no clipping at any edge.
