review:
  strengths:
  - Recursive-backtracker maze generation guarantees exactly one solution path, matching
    the spec's core requirement precisely
  - Deterministic LCG-based RNG (fixed seed 20260905) makes the maze fully reproducible
    across renders
  - Clean black-and-white wall rendering with high contrast and consistent, cell-scaled
    wall thickness — well suited for printing
  - 'Start/goal markers use color-coded circles with letter labels (S in brand green
    #009E73, G in matte red #AE3030) — clear, print-legible wayfinding that follows
    the Imprint palette and its semantic-exception convention'
  - 'Correct mount-node contract usage: echarts.init with no explicit size/dpr, animation:
    false, theme tokens threaded through title/caption/walls'
  - Both light and dark renders are theme-correct — background, text, and wall colors
    flip appropriately while the S/G data colors stay identical
  - Title format and canvas size (square, 2400x2400 via anyplot-orientation directive)
    match spec/style-guide requirements exactly
  weaknesses:
  - Wall thickness (~9% of cell size, wallWidth = max(3, cellSize*0.09)) is on the
    thinner side for a print-optimized puzzle — the spec calls out walls should be
    'not too thin'; consider bumping the multiplier (e.g. cellSize*0.12) for stronger
    contrast once printed or scaled down
  - Design Excellence is solid but not exceptional — the maze is functionally polished
    but visually plain beyond the S/G accents; consider small refinements (e.g. a
    slightly heavier outer border, or marker halo) to elevate aesthetic sophistication
    and data-storytelling focal points further
  - 'Library Mastery: the implementation relies entirely on ECharts'' low-level graphic
    custom-shape API (line/circle/text) rather than any higher-level declarative chart
    construct — a reasonable choice since no native maze chart type exists, but it
    doesn''t showcase ECharts-distinctive features beyond basic primitives'
  - At mobile-scaled widths (~400px) the caption '26 x 26 cells - one guaranteed solution
    path' becomes very small and borderline illegible — consider a slightly larger
    caption fontsize
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "maze-printable · javascript · echarts · anyplot.ai" centered at top in dark ink, clearly readable. Caption "26 × 26 cells · one guaranteed solution path" in soft gray beneath it, readable though small. A 26x26 grid maze rendered as black wall segments (recursive-backtracker generated) fills a large centered square area with balanced margins.
      Data: Start cell (top-left) marked with a green (#009E73, brand green / Imprint position 1) filled circle containing a white "S". Goal cell (bottom-right) marked with a matte-red (#AE3030) filled circle containing a white "G". Walls render as solid black line segments on the off-white background, uniform thickness throughout.
      Legibility verdict: PASS — all text (title, caption, S/G markers) is clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Title and caption render in light ink (near-white / soft gray), fully readable against the dark background. Maze wall segments render in a light/off-white stroke, clearly visible against the dark surface.
      Data: Start marker remains the same green (#009E73) filled circle with white "S"; goal marker remains the same matte-red (#AE3030) filled circle with white "G" — confirmed identical to the light render, only the chrome (background, walls, text) flipped polarity.
      Legibility verdict: PASS — no dark-on-dark failures observed; all title/caption/marker text is clearly visible against the near-black background.
