quality_score: 85
review:
  strengths:
  - All 1,300-odd wall tiles are drawn as one SVG path layout shape, so the walls
    render seamlessly without the hairline seams that per-cell rectangles leave
  - Walls and passages are equal-width tiles, giving thick, print-friendly walls and
    passages wide enough for a pencil, with INK walls on the page in both themes for
    strong contrast
  - Depth-first carving over a spanning tree guarantees exactly one route; the entrance
    and exit openings sit exactly under the START and GOAL arrows
  - scaleanchor/constrain keep the cells square on the 2400×2400 canvas with an even
    margin around the maze
  - Maze parameters (WIDTH, HEIGHT, SEED) sit in one data block with a seeded default_rng,
    so the puzzle is reproducible and easy to resize
  weaknesses:
  - 'Suggestion: the start and goal share the brand green; a second Imprint hue for
    GOAL (or a star glyph) would separate them even faster than the labels and positions
    already do.'
  image_description: |-
