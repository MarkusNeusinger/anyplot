      Data: a 25×25-cell maze drawn as near-black #1A1A17 wall blocks of uniform thickness equal to the passage width, inside a closed outer boundary. Bold green #009E73 "S" in the top-left cell, "G" in the bottom-right cell, both clear of the walls.
