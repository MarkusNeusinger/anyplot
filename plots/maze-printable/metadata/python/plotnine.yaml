review:
  strengths:
  - Depth-first backtracker carves a perfect maze on a 51×51 wall/passage grid, so
    exactly one route connects S (top-left) and G (bottom-right)
  - Walls drawn as unit geom_tile blocks under coord_fixed(ratio=1) give square cells
    and walls of one consistent, print-friendly thickness equal to the passage width
  - 'theme_void removes every axis, tick and grid, leaving a clean puzzle sheet with
    an even page margin; ink flips correctly between themes (near-black walls on #FAF8F1,
    light walls on #1A1A17)'
  - 'S and G are bold brand-green #009E73 letters set inside their corner cells, readable
    on both surfaces and clear of the walls'
  - Renders on the canonical 2400×2400 square canvas in both themes
  weaknesses:
  - 'CQ-01 (code): WIDTH, HEIGHT and SEED are written as column constants with ''#
    role:'' comments above the # Data block, and X/Y/WALL/LABEL column constants plus
    a df are built, although the spec''s data shape is Generated → put the named parameters
    (width, height, seed) inside the # Data block with no column constants, per prompts/adaptable-code.md
    ''Data shapes → Generated''. Likely cause: the table-shape template applied to
    a generated puzzle layout.'
  - 'Suggestion: slightly larger S and G glyphs (size 9 → about 11) would make the
    start and goal stand out more from the dense wall texture.'
  image_description: |-
    Light render (plot-light.png, 2400×2400):
      Background: warm off-white #FAF8F1 page with an even empty margin on all four sides of the maze.
