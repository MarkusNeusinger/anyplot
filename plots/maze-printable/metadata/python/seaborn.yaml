review:
  strengths:
  - Two-colour sns.heatmap with square=True renders the 51x51 wall/passage raster
    on exact cell edges, giving a perfectly straight, equal-cell grid
  - Iterative DFS carving from a seeded RNG guarantees a perfect maze with exactly
    one route from S to G
  - Canvas is exactly 2400x2400 with even margins round the maze in both themes
  - Title follows the mandated format and theme tokens (PAGE_BG, INK) carry the chrome
    in both renders
  weaknesses:
  - 'VQ-07 (dark): the maze fills its passages with pure #000000 and its walls with
    pure #FFFFFF instead of the theme surface → passages on the #1A1A17 page token
    and walls in the INK token #F0EFE8. Likely cause: the hard-coded colors = [''#FFFFFF'',
    ''#000000''] list for the dark theme.'
  - 'VQ-04 (both): the white ''G'' on the #C475FD goal disc has about 2.9:1 contrast,
    below 3:1 → dark ink text (#1A1A17) on that disc, or white on a darker Imprint
    color. Likely cause: color=''white'' on the goal ax.text.'
  - 'Suggestion: larger start/goal markers (spanning a passage plus its walls, or
    an arrow into the corner) would make S and G stand out at a glance on a printed
    sheet.'
  image_description: |-
