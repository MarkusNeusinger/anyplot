review:
  strengths:
  - 'Walls and S/G marks are threaded through the INK token, so the maze is near-black
    on #FAF8F1 and light on #1A1A17 with strong contrast in both themes'
  - Vectorized wall extraction with np.nonzero(maze == 1) feeding a single geom_rect
    layer
  - coord_fixed(ratio=1) with data-derived limits keeps cells square and gives an
    even margin around the maze
  - Iterative DFS carving guarantees exactly one route; entrance and exit openings
    line up with the S and G marks
  weaknesses:
  - 'VQ-05 (both): the outermost ~66 px columns at the left and right edges of the
    2400x2400 PNG are fully transparent instead of the page color, so the canvas shows
    stripes on any surface other than the page background → fill the whole canvas
    with PAGE_BG. Likely cause: coord_fixed aspect leaves unfilled width that plot_background
    does not cover; also set panel_background/plot_background and check ggsave output
    edges.'
  - 'CQ-04 (code): walls and markers are concatenated into df (line 88) and immediately
    split back into wall_df and marker_df (lines 91-92), and the XMIN…LABEL column
    constants with an empty LABEL for walls serve only that round trip → pass walls
    and markers to their layers directly and drop the constants, as the generated
    shape allows. Likely cause: forcing the tidy-df pattern onto a generated layout.'
  - 'Suggestion: a heavier outer boundary (which the Notes allow) would frame the
    puzzle for print.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 (edge columns ~66 px each side are transparent)
      Chrome: centered title 'maze-printable · python · letsplot · anyplot.ai' in dark ink, ~53% of width; bold 'S' above the top-left entrance and bold 'G' below the bottom-right exit, all crisp
      Data: 25x25 block maze, walls #1A1A17 one cell thick, outer boundary closed apart from entrance and exit; passages as wide as walls
      Legibility verdict: PASS

