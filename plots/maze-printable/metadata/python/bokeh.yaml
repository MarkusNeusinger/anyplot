review:
  strengths:
  - Depth-first carving from a seeded stack builds a spanning tree, so the 25x25 maze
    has exactly one route from S to G; the outer boundary is open only at the top
    of the start cell and the bottom of the goal cell
  - 'Clear line-weight hierarchy: 16 px outer boundary over 9 px interior walls, both
    drawn in the INK token so walls are near-black on #FAF8F1 in light and near-white
    on #1A1A17 in dark'
  - 'Start and goal are told apart by shape as well as color and letter: a brand-green
    #009E73 circle with S and a second-Imprint #C475FD square with G, both ink-outlined
    and readable in both themes'
  - Vectorized wall drawing with a single p.segment call for all interior walls plus
    one p.multi_line for the boundary; square line caps make the corners join cleanly
  - All chrome removed (axes, grid, outline, toolbar) with a square figure and equal
    x/y ranges, so every cell is square and a margin of empty page surrounds the maze
  weaknesses:
  - 'Suggestion: the bottom margin (min_border_bottom=20, about 85 px below the boundary)
    is narrower than the side margins; a few more pixels below the maze would balance
    the frame for printing.'
  - 'Suggestion: feeding the wall segments through a ColumnDataSource would follow
    the library prompt''s data pattern.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole 2400x2400 canvas, no pure white.
      Chrome: centered bold title "maze-printable · python · bokeh · anyplot.ai" in near-black ink at about 57 % of the width; no axes, ticks, grid or legend (permitted by the spec).
      Data: 25x25 maze, near-black interior walls (~9 px) along the cell edges inside a heavier ~16 px boundary, open at the top of the top-left cell and the bottom of the bottom-right cell. Start: #009E73 circle with dark "S" in the top-left cell; goal: #C475FD square with dark "G" in the bottom-right cell. Even margin of empty page around the maze; nothing touches the canvas edge.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17, no pure black.
      Chrome: title in light ink #F0EFE8, clearly readable; no dark-on-dark text.
      Data: identical maze, walls flip to light ink for strong contrast; marker fills #009E73 and #C475FD are identical to the light render, outlines flip to light ink, the dark "S" and "G" letters remain readable on their fills.
      Legibility verdict: PASS
