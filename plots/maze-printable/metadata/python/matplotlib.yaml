review:
  strengths:
  - Correct square 2400x2400 canvas with even print margins around the maze in both
    themes
  - 'Theme tokens thread through the maze itself: INK walls on PAGE_BG passages, black
    on off-white in light and the inverse in dark'
  - Entrance and exit openings carved in the outer wall next to the start and goal
    cells
  - imshow with a two-entry ListedColormap and interpolation='nearest' renders the
    0/1 grid crisply
  - Compact, seeded DFS generation guarantees a single route
  weaknesses:
  - 'VQ-02 (both): the start and goal discs (s=170, about 72 px across) span about
    1.9 cells and cover the adjacent wall cells and part of the entrance and exit
    openings → keep each disc inside its 38 px cell (about s=50, −120). Likely cause:
    ax.scatter(..., s=170).'
  - 'VQ-01 (both): the S and G letters are set at 7 pt, below the style guide''s 8
    pt smallest text reference → at least 8 pt (+1 pt). Likely cause: ax.text(...,
    fontsize=7).'
  - 'VQ-07 (both): the goal disc uses slot 5, the semantic-red anchor #AE3030, for
    a role that is not bad/loss/error → the next canonical position, #C475FD. Likely
    cause: IMPRINT_PALETTE[4].'
  - 'Suggestion: place the S and G marks just outside the maze at the entrance and
    exit openings so they never compete with walls.'
