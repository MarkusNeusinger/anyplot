review:
  strengths:
  - Iterative DFS on a (2h+1)x(2w+1) block grid guarantees a perfect maze with exactly
    one route from S to G
  - Walls are solid blocks as wide as the passages, print-friendly and seam-free in
    both themes
  - 'Theme tokens drive walls and surface: near-black on #FAF8F1 in light, light walls
    on #1A1A17 in dark'
  - Wall table built with np.nonzero and drawn through x/x2/y/y2 rect encoding sharing
    one reversed scale across layers
  - Scale domains padded by three blocks give an even print margin, with S and G standing
    just outside their openings
  weaknesses:
  - 'Suggestion: a heavier outer boundary than the interior walls, which the Notes
    allow, would frame the puzzle more clearly for print.'
  - 'Suggestion: a small arrow beside S and a star beside G would tell the two ends
    apart by shape as well as by letter.'
