review:
  strengths:
  - 'Correct Imprint palette usage: S marker uses the mandatory brand green #009E73
    (first series), G marker uses lavender (position 2), and both stay pixel-identical
    between the light and dark renders.'
  - Algorithmically correct randomized DFS backtracker builds a spanning tree over
    the cell grid, which mathematically guarantees exactly one solution path from
    start to goal, matching the spec requirement.
  - 'Clean, print-friendly design: theme_void() removes all chrome, wall linewidth
    is consistent, margins are generous, and black-on-off-white walls (light theme)
    maximize ink efficiency as the spec requests.'
  - Thoughtful border-gap design routes the entrance directly above the S marker and
    the exit directly below the G marker, visually funneling the reader into and out
    of the puzzle.
  - 'Theme-adaptive chrome correctly implemented in both renders: background, title,
    and subtitle flip between light/dark tokens while only the data colors (S/G) stay
    constant.'
  - Title follows the mandated `{spec-id} · {language} · {library} · anyplot.ai` format
    exactly, well-proportioned at this shorter spec-id length.
  weaknesses:
  - Library Mastery is generic — scale_color_identity() and coord_fixed() are useful
    but not distinctive to ggplot2; the maze could be replicated fairly directly in
    another library with a LineCollection-equivalent. Consider a ggplot2-specific
    touch (e.g. layered geom_rect page frame, or a facet-based difficulty-legend)
    to better showcase the grammar-of-graphics approach.
  - Design Excellence is clean but stays functional rather than reaching full publication-level
    polish — e.g. a subtle outer page frame/border or slightly refined marker treatment
    (soft shadow, outline) around S/G could elevate the piece further.
  - 'Data storytelling is modest: beyond the colored S/G markers there is no additional
    visual cue (e.g. a subtle corner vignette or difficulty indicator) that emphasizes
    the puzzle''s scale or challenge level.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "maze-printable · r · ggplot2 · anyplot.ai" in dark ink, centered, clearly legible; subtitle "22 × 22 grid · exactly one path from start to goal" in muted gray below it, also legible. Maze walls render as near-black (#1A1A17) line segments on the off-white background — high contrast, print-ready.
      Data: A green circle marked "S" sits at the top-left cell (matches Imprint position 1, #009E73, the mandatory brand-green first series); a lavender circle marked "G" sits at the bottom-right cell (Imprint position 2, #C475FD). Letters inside the circles render in the page-background cream color, giving a light, legible mark against the saturated circle fill. The border has a single-cell gap directly above S and directly below G, forming a clear entrance/exit.
      Legibility verdict: PASS — all text and markers read clearly against the light background, no dark-on-dark or light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Title and subtitle correctly flip to light ink (#F0EFE8 / muted light gray) against the dark background — fully legible. Maze walls render in the same light chrome color, giving equivalent contrast to the light render.
      Data: S (green) and G (lavender) markers are pixel-identical in hue to the light render — confirming palette consistency across themes. The S/G letters render in the (now dark) page-background color, so they appear as dark ink on the saturated green/lavender fill; contrast against the mid-luminance circle colors remains sufficient to read the letters clearly in both cases.
      Legibility verdict: PASS — no dark-on-dark failures; title, subtitle, walls, and markers all remain readable on the dark surface.
