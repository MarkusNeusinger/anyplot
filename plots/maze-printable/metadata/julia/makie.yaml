review:
  strengths:
  - Spanning-tree DFS maze generation correctly guarantees exactly one solution path
    between start and goal, matching the spec's core requirement.
  - 'Start (green #009E73) and Goal (matte red #AE3030) markers use a deliberate,
    documented semantic exception to the canonical Imprint order (traffic-light go/stop
    convention) while still carrying S/G letter labels, so the encoding is not color-alone.'
  - 'Theme adaptation is correct: black walls on warm off-white in light mode invert
    to light walls on warm near-black in dark mode, with the S/G marker colors staying
    pixel-identical across both renders.'
  - Canvas lands exactly on the 2400x2400 square target with generous, balanced margins
    around the maze grid.
  - 'Code is clean and KISS: Random.seed!(42) for reproducibility, no unused imports,
    modern Figure(size=...) API (not the deprecated resolution=...), single-file script
    with no functions/classes.'
  weaknesses:
  - 'Design Excellence is functional but generic: a plain grid of walls with no embellishment
    beyond the S/G markers (e.g. a subtle rounded outer border, a faint accent frame,
    or a small caption panel noting grid size) would elevate the print-product feel.'
  - Data storytelling / visual hierarchy is minimal beyond the mandated S/G markers
    - consider a subtle visual cue that reinforces the start-to-goal narrative (e.g.
    a slightly bolder border cell at S and G, or a faint corner label).
  - Library Mastery is idiomatic but generic - linesegments!() + scatter!() + text!()
    would look the same in almost any plotting library; consider a Makie-distinctive
    touch such as poly!() for a softly rounded maze frame, or Makie.Legend styled
    as a small puzzle-info panel.
  - Wall linewidth=5 may read a bit thin once the 2400x2400 PNG is scaled down to
    a ~400px mobile thumbnail for a 25x25 grid - verify legibility at that scale and
    consider a small bump if it looks faint.
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white, consistent with #FAF8F1 - not pure white.
      Chrome: title "maze-printable · julia · makie · anyplot.ai" is dark, bold, centered, comfortably narrow relative to canvas width; no axis ticks/labels/spines are shown (correctly hidden, as a maze needs no coordinate axes).
      Data: a 25x25 perfect maze rendered as thick black wall segments on the off-white passage background; a green circular "S" marker sits in the top-left start cell and a matte-red circular "G" marker sits in the bottom-right goal cell, both with a light-colored letter cut into the circle for contrast.
      Legibility verdict: PASS - title and S/G markers are all clearly readable against the light background, no text is light-on-light.

    Dark render (plot-dark.png):
      Background: warm near-black, consistent with #1A1A17 - not pure black.
      Chrome: title text is rendered light/off-white and stays clearly legible; still no axis ticks/labels/spines (consistent with the light render).
      Data: the maze walls invert to light-colored lines on the near-black passage background (a correct theme-chrome flip); the S (green) and G (matte red) markers are pixel-identical in hue and position to the light render, confirming data colors did not change between themes.
      Legibility verdict: PASS - title is fully legible, no dark-on-dark failures; wall/passage contrast is strong in both renders.
