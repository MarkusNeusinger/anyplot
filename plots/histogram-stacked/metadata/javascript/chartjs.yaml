review:
  strengths:
  - 'Correct Imprint palette in canonical order (green #009E73, lavender #C475FD,
    blue #4467A3), identical across both themes'
  - Theme-adaptive chrome fully threaded through title, legend, axis labels, ticks,
    and grid — both renders fully legible
  - Idiomatic histogram simulation via stacked bar chart with barPercentage/categoryPercentage
    = 1.0 to remove inter-bin gaps
  - Deterministic, seed-based data generation (LCG + Box-Muller) with no external
    RNG dependency
  - Correct mandated title format and legend labels matching the group names
  - Realistic, neutral scenario (commute distance by department) with a clear, readable
    distribution shift across groups
  weaknesses:
  - Design Excellence reads as a well-configured default rather than publication-ready
    — add a stronger design touch (e.g. a thin ink-colored stroke on bar segments
    for definition, or refined spacing/typography) to push past generic styling
  - No visual hierarchy or emphasis calling out the insight (Engineering commutes
    shortest, Support commutes furthest) — consider a subtle annotation, callout,
    or color/weight emphasis that guides the reader to the pattern instead of leaving
    them to find it
  - 'Bars have no edge stroke (borderWidth: 0); the lavender and blue segments (Imprint
    positions 2–3) fall below the WCAG 3:1 contrast threshold on the cream background
    per the style guide — a thin ink-colored stroke would sharpen the boundaries between
    stacked groups, especially in thinner bins'
  - The categoryPercentage/barPercentage=1.0 gap-removal trick is a fine technique
    but not distinctive to Chart.js specifically — consider leveraging a more Chart.js-specific
    capability to raise library mastery
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 (not pure white).
      Chrome: Title "histogram-stacked · javascript · chartjs · anyplot.ai" is bold dark ink, centered top, fully visible. Legend below the title shows three swatches (green/lavender/blue) with dark labels "Engineering", "Sales", "Support" — all readable. X-axis title "Commute Distance (km)" and Y-axis title "Number of Employees" are dark and legible. Tick labels are a slightly softer dark gray, clearly readable. Y-axis gridlines are subtle, faint horizontal lines; X-axis has no gridlines (intentionally disabled).
      Data: First series (Engineering) renders in brand green #009E73, second series (Sales) in lavender/purple, third series (Support) in blue — matching Imprint palette canonical order. Bars are stacked and touch each other continuously (no inter-bin gaps), forming a smooth stacked-histogram silhouette. Green dominates low commute distances (0–15 km), lavender dominates the middle range (12–24 km) with a visible peak, and blue dominates the longer distances (24–45 km), tapering to near-zero at the tail.
      Legibility verdict: PASS — all text is clearly readable against the light background, no overlap or clipping observed.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 (not pure black).
      Chrome: Same title, now rendered in light/off-white text, fully visible and legible. Legend swatches are identical colors to the light render, with light-colored text labels. Axis titles are light ink, tick labels are a softer light gray — both clearly readable against the dark background. No dark-on-dark or light-on-light failures observed. Y-axis gridlines are subtle light lines at low opacity.
      Data: Colors are pixel-identical to the light render — green #009E73, lavender, and blue in the same canonical order and the same bin-by-bin distribution shape. Only the chrome (background, text, grid) flipped between themes, as required.
      Legibility verdict: PASS — all text is clearly readable against the dark background; no dark-on-dark failures detected.
