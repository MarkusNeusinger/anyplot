review:
  strengths:
  - 'Correct stacked-histogram construction: all three groups share identical bin
    boundaries (computed from the combined value range) so segments stack meaningfully
    within each bin.'
  - 'Palette compliance is exemplary: Downtown uses brand green #009E73 first, Uptown
    and Suburban follow the canonical Imprint order, and both light/dark renders keep
    data colors identical while chrome (background, grid, text) flips correctly with
    no legibility issues.'
  - Groups are ordered by increasing mean wait time (Downtown 4.0 < Uptown 6.5 < Suburban
    9.0), which produces a pleasing diagonal color gradient across the distribution
    and reinforces the story of composition shifting by bin.
  - 'Deterministic, dependency-free code: a small seeded LCG (no Math.random) drives
    reproducible sampling and manual binning, with clean adherence to the ECharts
    mount-node contract (animation: false, no explicit size/devicePixelRatio).'
  - Title format, legend labels, and axis titles (with units, 'Wait Time (minutes)'
    / 'Frequency') all match spec requirements.
  weaknesses:
  - 'Design Excellence is generic: beyond the required theme-token chrome, there is
    no visual refinement distinguishing the stacked segments (e.g. a thin pageBg/white
    border between segments via itemStyle.borderColor) or any polish like subtle rounded
    corners on the topmost bar series — it reads as default ECharts bar styling.'
  - No distinctive ECharts-only feature is demonstrated (e.g. emphasis.focus='series'
    for cross-segment highlighting, a markLine for the overall mean, or a customized
    tooltip formatter) — the implementation only uses the baseline bar+stack API,
    so Library Mastery reads as purely idiomatic rather than showcasing the library.
  - 'Minor inconsistency: x-axis axisLabel fontSize is 13 while y-axis axisLabel fontSize
    is 14, and axis name fontSize is 16 for both — align tick-label sizes for a tidier
    look.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "histogram-stacked · javascript · echarts · anyplot.ai" is dark ink, centered, clearly legible. Legend swatches (Downtown/Uptown/Suburban) and labels are dark and legible. X-axis tick labels (bin ranges like "0.2–1.3") and axis names ("Wait Time (minutes)", "Frequency") are dark/soft-ink and clearly readable. Horizontal gridlines are subtle light gray, visible but unobtrusive.
      Data: First series (Downtown) is brand green #009E73, second (Uptown) is lavender/violet, third (Suburban) is muted blue — matches the canonical Imprint categorical order. Bars are stacked per bin with no gaps between adjacent bins (barCategoryGap: 0%), forming a continuous histogram silhouette. The diagonal color blend (green dominant in low bins, lavender in mid bins, blue in high bins) clearly shows the three groups' means shifting rightward.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Title, legend text, axis tick labels, and axis names all render in light/off-white ink, clearly legible against the dark background. No dark-on-dark text found anywhere (title, legend, ticks, axis names all confirmed readable). Gridlines are subtle and still visible.
      Data: Colors are pixel-identical to the light render — green #009E73, lavender, blue — confirming only chrome (background/text/grid) flipped between themes, not data colors.
      Legibility verdict: PASS
