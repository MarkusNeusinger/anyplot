review:
  strengths:
  - Correct Imprint palette order (Car=#009E73 brand green first, Public transit=lavender,
    Bike=blue) with identical data colors and theme-correct chrome (background, text,
    grid, legend) across both light and dark renders
  - Narrative subtitle ("Bike dominates short commutes, Car takes over as distance
    grows") is computed from the actual binned data (dominantGroupAt) and gives the
    chart a genuine focal insight rather than a generic caption
  - 'Correct stacked-histogram semantics: identical 3 km bins applied to all three
    groups, stack="total" produces true combined bar height, legend labels match the
    series exactly'
  - Deterministic in-memory data generation (seeded LCG + Box-Muller-style normal
    sampling per group) with realistic, distinct means/spreads per transport mode
    (Bike short, Car long, Public transit mid-range)
  - 'Idiomatic, fairly deep MUI X usage: dataset/dataKey pattern, highlightScope for
    hover/fade interaction, explicit axis/legend/grid font sizing and grid opacity
    via sx and slotProps, skipAnimation set for a stable screenshot'
  weaknesses:
  - 'categoryGapRatio: 0.06 leaves a thin vertical seam between adjacent bins; a true
    histogram reads more naturally with bars fully touching (gap ratio near 0)'
  - The smallest bins (e.g. 33-36 total=2, 30-33 total=8) produce very thin colored
    slivers that are hard to tell apart by group, especially once the PNG is scaled
    down to mobile width
  - Design is competent and above bare defaults (custom margins, typography, subtitle)
    but still reads as a standard stacked-bar composition — could push further with
    e.g. a subtle marker/band on the crossover bin (9-12 km, where Car overtakes Bike)
    to sharpen the storytelling even more
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Bold dark title "histogram-stacked · javascript · muix · anyplot.ai" centered at top, with a lighter-weight gray subtitle beneath it ("Bike dominates short commutes, Car takes over as distance grows"). Y-axis label "Number of Commuters" (rotated), X-axis label "Commute Distance (km)", both dark and clearly legible. Tick labels (bin ranges "0-3" through "33-36", and Y gridline values 0-120) are dark, small but readable. Horizontal gridlines are subtle and do not compete with the bars. Legend (Car / Public transit / Bike) sits centered below the plot with colored square swatches, clearly readable.
      Data: 12 stacked bars, one per 3 km bin. Colors bottom-to-top per bar: Car = brand green (#009E73), Public transit = lavender/purple, Bike = blue — matching Imprint canonical palette order with the brand color first. Bike dominates the shortest bins (0-3 through 6-9 km), Public transit dominates the mid-range bins (9-12 through 15-18 km), and Car dominates from 15-18 km onward, tapering off toward 33-36 km.
      Legibility verdict: PASS — all text is dark-on-cream and fully readable; no overlap between labels, legend, or bars.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title/subtitle now in light/off-white and light-gray text respectively, fully legible against the dark background. Axis labels, tick labels, and legend text are all rendered in light tones (no dark-on-dark instances found). Gridlines are faint light horizontal lines, subtle as in the light render.
      Data: Same three colors (green/lavender/blue) in the same stacking order and magnitudes as the light render — confirms the data colors are theme-invariant, only the chrome (background/text/grid) flips.
      Legibility verdict: PASS — no dark-on-dark or light-on-light failures observed; all text, gridlines, and bar boundaries are clearly distinguishable from the near-black background.
