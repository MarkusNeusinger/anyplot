review:
  strengths:
  - 'First categorical series correctly uses brand green #009E73, with the next two
    groups following canonical Imprint order (lavender, blue) — identical across both
    themes'
  - 'Theme-adaptive chrome is fully correct: warm off-white background in light, warm
    near-black in dark, all text and grid lines legible in both renders'
  - Realistic, neutral data scenario (commute distance by transport mode) with three
    distinct, well-separated normal distributions producing an interesting, varied
    stack composition across bins
  - 'Clean, idiomatic MUI X usage via the dataset + series(dataKey) API with stack:
    "total", explicit font sizing on ticks/axis labels/legend, and skipAnimation set'
  - Title format and legend labels match the spec exactly; deterministic fixed-seed
    LCG data generation
  weaknesses:
  - 'Design Excellence is at library-default level: no custom typography hierarchy,
    no visual emphasis, and no data-storytelling technique beyond the raw stack —
    reads as a well-configured default rather than a polished, publication-ready chart'
  - Bars have a standard bar-chart category gap (looks like MUI X's default categoryGapRatio);
    a true histogram convention has bins touching (or near-zero gap) since bins represent
    a continuous variable — consider setting a smaller/zero categoryGapRatio on the
    BarChart for a more authentic histogram look
  - Spec suggests 'consider ordering groups by size within bins' — the stack order
    (Car, Public transit, Bike) is fixed across all bins rather than reflecting each
    bin's largest-to-smallest group, so the visual hierarchy of segment sizes isn't
    emphasized
  - 'Library Mastery is generic: the dataset/series/stack pattern is MUI X''s standard
    declarative stacking, nothing distinctive to MUI X specifically is leveraged (e.g.
    no valueFormatter-driven data labels, no highlightScope cross-series highlighting)
    that would set this apart from a generic stacked-bar implementation in another
    library'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white, not dark.
      Chrome: Title "histogram-stacked · javascript · muix · anyplot.ai" is dark ink, centered, fully legible. X-axis label "Commute Distance (km)" and Y-axis label "Number of Commuters" are dark, readable, similarly sized. Tick labels (bin ranges 0-3 through 33-36, and y-axis numeric ticks 0-120) are dark and clearly legible. Horizontal grid lines are subtle (low opacity), not competing with the data. Legend at bottom-center shows three swatches: Car (green), Public transit (lavender/purple), Bike (blue) — all readable dark text.
      Data: 12 stacked bars over binned commute-distance ranges. Bottom segment is brand green (#009E73, Car), middle segment lavender/purple (Public transit), top segment blue (Bike). Segment order is fixed across all bins. Bar heights vary realistically, showing bike dominating short bins and car dominating long bins, transit peaking in the middle.
      Legibility verdict: PASS — all text clearly readable against the light background.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black, not light.
      Chrome: Title, axis labels, and tick labels all render in light/off-white text, clearly legible against the dark background — no dark-on-dark failures observed. Grid lines are faint light lines, subtle but visible. Legend text is light and fully readable.
      Data: Same three data colors as the light render — brand green (Car), lavender (Public transit), blue (Bike) — confirmed identical hues; only the chrome (background, text, grid) flipped to the dark theme as expected.
      Legibility verdict: PASS — no dark-on-dark or light-on-light issues in any chrome element.
