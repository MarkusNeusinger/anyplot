review:
  strengths:
  - 'Stacking via the series-level `stack: "total"` key with one series per group
    gives true stacked segments from a zero baseline in one fixed order (Car, Public
    transit, Bike) in every bin; bar tops read directly as combined frequency.'
  - 'Shared bin edges are computed once from the pooled data with a 1-2-2.5-5 nice
    step (2.5 km) and applied to every group; `categoryGapRatio: 0` makes the bars
    contiguous, and a page-coloured segment stroke (t.pageBg) separates bins and groups
    cleanly in both themes.'
  - 'Imprint palette in canonical order (#009E73, #C475FD, #4467A3) with data colours
    identical across light and dark; chrome fully theme-adaptive via ANYPLOT_TOKENS
    (ink, inkSoft, grid).'
  - Subtitle carries per-group n and the bin width, giving the reader the sample context
    and binning without crowding the plot area.
  - 'Realistic, neutral scenario (one-way commute distance by transport mode, 640
    employees) whose overlapping distributions make the stacked composition meaningful:
    bike dominates short bins, car the long tail.'
  - 'Library-native interactivity: `highlightScope: { highlight: ''series'', fade:
    ''global'' }` highlights a whole group across bins on hover in the HTML output;
    `skipAnimation` and explicit axis band sizes (height 64 / width 72) follow the
    v9 contract.'
  weaknesses:
  - 'Suggestion: ordering segments by group size within each bin (the Notes'' optional
    hint) is not used; the fixed data order is equally valid, but a size-ordered variant
    could be compared.'
  - 'Suggestion: the x-axis uses range labels on a band scale (''0–2.5'', ''2.5–5'',
    …); edge ticks at bin boundaries would read more like a continuous histogram axis.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, no white panel.
      Chrome: bold dark title "histogram-stacked · javascript · muix · anyplot.ai" centred top (~32% width), soft-ink subtitle "Transport mode: Car n = 260 · Public transit n = 220 · Bike n = 160 · bin width 2.5 km"; y-axis "Frequency (count per bin)" with ticks 0–110 every 10; x-axis "Commute Distance (km)" with 15 bin-range tick labels 0–2.5 … 35–37.5; subtle light horizontal grid; bottom-centred legend Car / Public transit / Bike. All text dark on light and readable.
      Data: 15 contiguous stacked bars separated by thin off-white strokes; Car #009E73 at the bottom, Public transit #C475FD in the middle, Bike #4467A3 on top, same order in every bin. Tallest total 102 at 5–7.5 km, secondary peak 80 at 15–17.5 km, thin tail bins (count 1) at 32.5–37.5.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, subtitle, axis titles and tick labels in light ink, clearly readable; grid subtle dark grey; legend text light. No dark-on-dark text.
      Data: identical colours and values to the light render (green #009E73, lavender #C475FD, blue #4467A3); segment strokes flip to the dark page colour, keeping segments distinct. Brand green reads well.
      Legibility verdict: PASS
