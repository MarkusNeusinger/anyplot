review:
  strengths:
  - Correct Imprint palette order (green, lavender, blue) with the brand green always
    the first series, applied via scale_fill_manual(values = IMPRINT_PALETTE[1:3])
  - Same bin boundaries shared across all three cohorts by construction — a single
    geom_histogram(aes(fill = cohort)) call with one binwidth/boundary, exactly matching
    the spec's 'same bin boundaries applied to all groups' requirement
  - Theme-adaptive chrome correctly threaded through background, ink, ink_soft and
    axis/legend colors; both renders use the exact spec hex values (#FAF8F1/#1A1A17)
    and remain fully readable
  - Bar/segment borders colored to match PAGE_BG create clean separation between stacked
    segments and between adjacent bins, improving readability especially for the lower-contrast
    lavender segment
  - Reproducible (set.seed(42)), clean imports (dplyr and ragg both actually used),
    correct output naming via ragg::agg_png
  - Right-justified top legend is a sensible space-saving layout choice that keeps
    the plot area large
  weaknesses:
  - Major-y gridlines use full INK color at linewidth 0.3 rather than a faint tint
    — per the library guide's own note that ggplot2 has no grid alpha, they read more
    prominent than the style guide's 'very subtle, 15-25% opacity' target; consider
    a lighter gray/tan custom color instead of full INK
  - No visual emphasis or annotation calling out the cohort shift (Freshman skewing
    low, Senior skewing high) — a missed data-storytelling opportunity given the pattern
    is already present in the data
  - Groups are stacked in factor-definition order rather than the spec's optional
    suggestion to order groups by size within bins (minor, spec marks this as 'consider')
  - Legend sits close to the right canvas edge with modest margin; a touch more right-side
    padding would add safety margin across renderers
  - Styling stays close to theme_minimal defaults plus the border trick — solid but
    not an especially distinctive treatment (kept Design Excellence just above baseline
    rather than higher)
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "Exam Scores by Cohort · histogram-stacked · r · ggplot2 · anyplot.ai" in dark ink, top-left. Axis titles "Exam Score" (x) and "Number of Students" (y) in dark ink, clearly legible. Tick labels (40/60/80/100 on x; 0/50/100/150/200 on y) in a softer dark gray, readable. Legend "Cohort" top-right with swatches for Freshman/Sophomore/Senior. Horizontal grid lines only (no vertical grid), thin and dark but not overwhelming. L-shaped axis line (left + bottom) visible.
      Data: Three stacked color segments per bin — green (#009E73, Freshman), lavender (#C475FD, Sophomore), blue (#4467A3, Senior) — separated by thin off-white borders matching the page background. Distribution shows green dominant in lower-score bins (40-65), a mix of all three around the 65-85 peak, and blue (Senior) dominant in higher-score bins (85-100), consistent with the cohorts' generated means.
      Legibility verdict: PASS — all text is clearly readable against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Title, axis titles rendered in light/off-white text; tick labels and legend text in a softer light gray — all clearly legible against the dark background. Grid lines rendered in a light tone, visible but not dominant. Axis line visible in a muted light tone.
      Data: Same three data colors as the light render (green #009E73, lavender #C475FD, blue #4467A3) — confirmed identical, only the chrome (background, text, grid, borders) flipped between themes.
      Legibility verdict: PASS — no dark-on-dark failures; every title, axis label, and tick label is clearly legible against the near-black background.
