    same bin boundaries shared across all three cohorts, theme-adaptive chrome correct
    and identical data colors across both renders, reproducible via set.seed(42)
  weaknesses:
  - Groups are still stacked in factor-definition order rather than the spec's optional
    'consider ordering groups by size within bins' suggestion (minor, soft suggestion)
  - The storytelling annotation text is small (size = 2.8, ~8pt) - a touch larger
    would improve legibility when the image is scaled down for mobile/thumbnail views
  - Overall styling remains close to theme_minimal defaults plus the border/overlay
    tricks; room for a more distinctive custom treatment to push Design Excellence
    further
