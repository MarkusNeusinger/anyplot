review:
  strengths:
  - Correct Imprint palette in canonical order (green Downtown, lavender Uptown, blue
    Airport), identical data colors across both light and dark renders
  - Theme-adaptive chrome correctly threaded through title/labels/ticks, spines, and
    grid tokens in both themes with no dark-on-dark or light-on-light failures
  - Idiomatic Makie stacked histogram via barplot!(stack=...) with a manually constructed
    Legend using PolyElement handles
  - 'Clean KISS structure: explicit font sizes throughout, Random.seed!(42) for reproducibility,
    only used imports'
  - Correct title format and descriptive axis labels with units ("Wait Time (minutes)",
    "Number of Customers")
  weaknesses:
  - 'Design excellence reads as a well-configured default: relies on the shared style-guide
    baseline (palette, spine/grid tokens) without an additional distinctive flourish'
  - No visual hierarchy or storytelling technique draws the eye to an insight (e.g.
    which location dominates the peak wait-time bin) - data is displayed but not interpreted
  - The barplot! stack= keyword is common across most plotting libraries (matplotlib
    bottom=, plotly barmode='stack', ggplot position='stack'), so library-mastery
    usage reads as generic rather than distinctly Makie
  - Per the spec's optional guidance, groups are not reordered by size within each
    bin - the Downtown/Uptown/Airport stacking order is fixed across all bins (minor,
    spec marks this as "consider", not required)
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 - not pure white.
      Chrome: Bold dark title "histogram-stacked · julia · makie · anyplot.ai" centered at top, dark axis labels "Wait Time (minutes)" / "Number of Customers", soft grey tick labels on both axes, subtle horizontal-only gridlines, L-shaped frame (top/right spines removed). Legend "Location" with Downtown/Uptown/Airport swatches sits to the right of the plot, no legend box frame.
      Data: 22 stacked bars spanning ~0-20 minutes. Bottom segment (Downtown) is brand green #009E73, middle segment (Uptown) lavender #C475FD, top segment (Airport) blue #4467A3 - matches Imprint palette canonical positions 1-3. Overall distribution rises to a peak around 6-8 minutes then decays, with the green (Downtown) share shrinking and blue (Airport) share growing at longer wait times, illustrating composition shift.
      Legibility verdict: PASS - all text (title, axis labels, ticks, legend) is clearly readable against the light background.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 - not pure black.
      Chrome: Same layout as light - white/light title and axis labels, light-grey tick labels and legend text, subtle low-opacity gridlines, L-shaped frame. No dark-on-dark elements observed.
      Data: Bar colors are pixel-identical to the light render - green #009E73, lavender #C475FD, blue #4467A3 - confirming only chrome flips between themes, not data colors.
      Legibility verdict: PASS - all text is clearly readable against the dark background; no dark-on-dark or light-on-light failures found.
