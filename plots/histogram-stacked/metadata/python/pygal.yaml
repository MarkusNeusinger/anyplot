review:
  strengths:
  - 'Contiguous stacked bins: segments sit directly on one another from a zero baseline
    and the bins touch, so every bar top reads as the combined frequency in both renders'
  - One shared set of bin edges from np.histogram_bin_edges feeds every group, and
    the y range is derived from the tallest total (x1.1), so the axis is never truncated
  - 'Imprint palette in canonical order (#009E73, #C475FD, #4467A3) with identical
    data colors in both themes; chrome and grid guides flip through the Style tokens'
  - Realistic, neutral scenario (450 plants' heights by light condition) with overlapping
    distributions that show the composition shifting across bins
  - 'Flat adaptable-code layout: column constants, a tidy df, plain lists per group
    via groupby(sort=False) so one segment order holds in every bin'
  - Native pygal interactive HTML output with per-segment tooltips alongside the PNG
  weaknesses:
  - 'Suggestion: the rounded bin labels give uneven-looking ranges (''24–29'' and
    ''49–54'' read as 5 cm, the others 4 cm); one decimal or rounded bin edges would
    make the shared bin width explicit.'
  - 'Suggestion: the axis titles are drawn as large as the chart title; a smaller
    axis-title size would give the title its own level in the hierarchy.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, no pure white.
      Chrome: title "histogram-stacked · python · pygal · anyplot.ai" centered at top in dark ink; rotated y-axis title "Frequency (plants)", x-axis title "Plant Height (cm)" with a clear gap above the bottom legend row; y ticks 0–80, twelve bin labels 12–16 … 58–62; dotted muted guides subtle but visible; three-column legend (Shade-grown, Partial-sun, Full-sun) at the bottom. All text readable.
      Data: twelve contiguous stacked bars from a zero baseline; Shade-grown #009E73 bottom, Partial-sun #C475FD middle, Full-sun #4467A3 top in every bin; tallest total 76 in 37–41 under the 80 gridline; thin tail segments (1 plant) visible.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17, no pure black.
      Chrome: title, axis titles, tick labels and legend text in light ink, all readable; no dark-on-dark text; the dotted guides are drawn in INK_MUTED and visible.
      Data: identical colors and stacking to the light render (#009E73, #C475FD, #4467A3); brand green reads well; all segments distinguishable from each other and the background.
      Legibility verdict: PASS
