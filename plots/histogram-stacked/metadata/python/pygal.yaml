review:
  strengths:
  - 'Contiguous stacked bins: the segments of each bin sit directly on one another
    from a zero baseline, and the bins touch, so every bar top reads as the combined
    frequency in both renders'
  - One shared set of bin edges from np.histogram_bin_edges is applied to every group,
    and the y range is derived from the tallest total (×1.1), so the axis is never
    truncated
  - 'Imprint palette in canonical order (#009E73, #C475FD, #4467A3) with identical
    data colors in both themes; the chrome flips correctly through the Style tokens'
  - Realistic, neutral scenario (plant heights by light condition, 450 plants) with
    three overlapping distributions that show the composition shifting across the
    bins
  - 'Clean adaptable-code layout: column constants, a tidy df, and plain lists built
    per group with groupby(sort=False), so the segment order is one stable order in
    every bin'
  - Native pygal interactive HTML output with per-segment tooltips alongside the PNG
  weaknesses:
  - 'VQ-05 (both): the x-axis title ''Plant Height (cm)'' sits on top of the bottom
    legend row with almost no gap (its descenders nearly touch the legend text), so
    the axis title and the legend crowd each other → a clear gap of about 30–40 px
    between the axis title and the legend. Likely cause: legend_at_bottom with margin=60
    and no extra legend spacing; the axis title at title_font_size=66 fills the space
    between the tick labels and the legend.'
  - 'CQ-01 (code): a class ContiguousStackedBar subclass overrides the private attribute
    _series_margin to make the bins touch, which breaks the no-functions/no-classes
    KISS structure → configure the chart without a class, for example by setting the
    attribute on the chart instance (chart._series_margin = 0) or another flat configuration.
    Likely cause: the subclass written to mirror pygal''s Histogram.'
  - 'Suggestion: the rounded bin labels give uneven ranges (''24–29'' and ''49–54''
    span 5 cm, the others 4 cm); one decimal or rounded bin edges would make the shared
    bin width explicit.'
  - 'Suggestion: the axis titles are drawn as large as the chart title; a smaller
    axis-title size would give the title its own level in the hierarchy.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, no pure white.
      Chrome: title "histogram-stacked · python · pygal · anyplot.ai" centered at top in dark ink; y-axis title "Frequency (plants)" rotated, x-axis title "Plant Height (cm)"; tick labels 0–80 on y and twelve bin labels (12–16 … 58–62) on x, all dark and readable; dotted horizontal guides subtle but visible; legend at the bottom in three columns (Shade-grown, Partial-sun, Full-sun). The x-axis title sits very close above the legend row.
      Data: twelve contiguous stacked bars; Shade-grown #009E73 at the bottom, Partial-sun #C475FD in the middle, Full-sun #4467A3 on top, same order in every bin, zero baseline, tallest total 76 in 37–41 below the 80 gridline. Thin segments in the tails (e.g. 1 Partial-sun in 12–16, 1 Shade-grown in 37–41) are visible.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17, no pure black.
      Chrome: title, axis titles, tick labels and legend text all in light ink and readable; no dark-on-dark text; dotted guides are faint but visible.
      Data: identical colors and stacking to the light render (#009E73, #C475FD, #4467A3); brand green reads well on the dark surface; all three segments are distinguishable from each other and the background.
      Legibility verdict: PASS
