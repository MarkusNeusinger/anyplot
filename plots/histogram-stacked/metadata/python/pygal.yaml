review:
  strengths:
  - Shared bin boundaries for all groups come from a single np.histogram_bin_edges
    call over the pooled data, so every group's segments line up bin for bin.
  - Segments stack in one fixed order (Shade-grown, Partial-sun, Full-sun) in every
    bin, from a zero baseline, with no gaps between segments; the frequency axis reaches
    past the tallest total (76) through range=(0, tallest_total * 1.1).
  - Theme tokens are threaded through pygal's Style, so both renders are theme-correct;
    the Imprint palette is passed whole and brand green comes first.
  - 'Realistic, neutral scenario: plant heights under three light conditions, with
    plausibly shifted normal distributions that make the composition change across
    bins easy to read.'
  - 'Native pygal interactivity in the HTML output: per-segment hover tooltips and
    toggleable legend entries.'
  weaknesses:
  - 'SC-02 (both): adjacent histogram bars are separated by gaps of about 16 px, so
    the bins do not read as contiguous intervals → contiguous bars (gap 0 px, −16
    px). Likely cause: spacing=24 on pygal.StackedBar; set spacing=0.'
  - 'Suggestion: label bins with one decimal (e.g. "24.6–28.8") or choose round bin
    edges, because the integer-rounded labels make equal-width bins look like widths
    of 4 and 5.'
  - 'Suggestion: the dotted y-guides are barely perceptible on the dark render; a
    slightly stronger guide tone would help the reader read the totals.'
  image_description: |-
