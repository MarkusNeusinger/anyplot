  strengths:
  - Contiguous stacked bins (bargap=0) on one shared set of np.histogram_bin_edges,
    with thin PAGE_BG segment outlines that keep neighboring segments separable in
    both themes
  - Legend titled 'Production line' with entries in stack order (Line C on top), so
    the reader maps segments to groups without searching
  - 'Full theme-token threading: every title, tick, grid line and legend frame flips
    correctly between #FAF8F1 and #1A1A17 while the Imprint data colors stay identical'
  - Per-trace hovertemplate shows the group, bin center and frequency in the HTML
    output
  - Canvas contract met exactly (800x450 at scale 4, autosize=False, pinned margins)
    and the mandated title format is complete
  weaknesses:
  - 'Suggestion: px.histogram(df, x=WEIGHT, color=LINE, barmode=''stack'', nbins=N_BINS)
    or go.Histogram with a shared xbins would let plotly compute the bins natively
    instead of pre-binning with np.histogram and go.Bar.'
  - 'Suggestion: the gap between the legend swatches and their labels is wide; a tighter
    legend itemwidth would make the box more compact.'
