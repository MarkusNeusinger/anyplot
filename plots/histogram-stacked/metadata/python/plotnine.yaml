review:
  strengths:
  - Native geom_histogram(bins=20, position="stack") computes shared bin boundaries
    for all three groups and stacks the segments from a zero baseline, so each bar
    top is the combined frequency
  - 'scale_fill_manual with limits taken from df keeps the data''s group order, so
    Sandy Soil, the first group, gets #009E73 and the Imprint palette follows in canonical
    order'
  - 'Theme tokens are threaded through every chrome element: warm off-white and near-black
    surfaces, INK/INK_SOFT text, and a page-colored segment outline that separates
    stacked segments in both themes'
  - Canvas contract met at 3200x1800 with the style-guide font sizes (title 12, axis
    titles 10, ticks and legend 8 pt); column names carry the units, so plotnine titles
    the axes and legend directly
  - Realistic plant-height-by-soil scenario with 370 seeded observations whose overlapping
    normal distributions show how the group composition shifts across bins
  weaknesses:
  - 'VQ-05 (both): the legend is cramped inside its frame: the title "Soil Type" sits
    flush against the frame''s left edge and "Loamy Soil" touches the right edge with
    no padding → give the legend box a few points of inner margin on every side. Likely
    cause: legend_background frame drawn without legend_margin/legend_box_margin padding.'
  - 'DE-02 (both): all four panel spines are drawn as a full box plus a framed legend,
    where a stacked histogram needs neither → keep only the left and bottom axis lines
    (or none) and drop the legend frame. Likely cause: panel_border=element_rect(color=INK_SOFT,
    ...) and legend_background=element_rect(..., color=INK_SOFT).'
  - 'Suggestion: reverse the legend (guide_legend(reverse=True)) so its top-to-bottom
    order matches the stack, with Clay Soil on top and Sandy Soil at the bottom.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white, matches #FAF8F1; 3200x1800 landscape canvas.
      Chrome: title "histogram-stacked · python · plotnine · anyplot.ai" in dark ink, centered, about 52% of the width; x-axis "Plant Height (cm)", y-axis "Frequency"; dark-grey tick labels 10–50 and 0–60; subtle grid; a dark full-box panel border; framed legend "Soil Type" at right, its title flush with the frame's left edge. All readable.
      Data: 20 contiguous stacked bins from about 10 to 55 cm; Sandy Soil #009E73 at the bottom, Loamy Soil #C475FD in the middle, Clay Soil #4467A3 on top, separated by thin page-colored outlines; tallest total about 67, y-axis reaches about 70. First series is #009E73.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black, matches #1A1A17.
      Chrome: title and axis titles in light ink, tick labels in light grey, subtle grid, light panel border, legend on #242420 with light text and a light frame. No dark-on-dark text.
      Data: identical segment colors and heights to the light render (green, lilac, blue), separated by dark page-colored outlines; brand green clearly visible.
      Legibility verdict: PASS
