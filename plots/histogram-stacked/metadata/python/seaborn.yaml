review:
  strengths:
  - 'Stack order derived from value_counts() via hue_order: the largest class sits
    on top, one order kept in every bin, and the legend lists the classes in the same
    top-to-bottom order as the stack'
  - Shared 4-point bins pinned to the 0-100 score domain with binwidth/binrange, so
    every class uses the same boundaries
  - Segment edges drawn in the page color separate the stacked blocks cleanly in both
    themes
  - 'Theme tokens threaded through set_theme rc: all chrome flips correctly while
    the Imprint data colors stay identical'
  - Canvas contract met (8x4.5 in at 400 dpi, no bbox_inches) with style-guide font
    sizes
  weaknesses:
  - 'Suggestion: the 0-28 score range carries no observations; a binrange starting
    near the data minimum would give the populated bins more width.'
  - 'Suggestion: the legend title ''Class'' repeats in every entry (''Class 10A''…);
    entries ''10A'', ''10B'', ''10C'' would read more cleanly.'
  - 'Suggestion: the code comment ''largest group at the bottom'' contradicts the
    render, where the largest class is stacked on top.'
