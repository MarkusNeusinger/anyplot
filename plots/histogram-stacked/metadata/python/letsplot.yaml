review:
  strengths:
  - Native geom_histogram(binwidth=5, position='stack') computes shared bin boundaries
    and stacking for all groups in one call
  - Theme tokens threaded through every chrome element; both renders read cleanly
    with no dark-on-dark text
  - Page-colored segment separators keep stacked segments distinct in both themes
  - Full eight-position Imprint palette with column constants, so the code adapts
    to other group counts
  - Correct 3200x1800 canvas via ggsize(800, 450) and scale=4, plus native interactive
    HTML export with hover tooltips
  weaknesses:
  - 'DQ-02 (both): the three groups are labelled ''Class A'', ''Class B'', ''Class
    C'', which read as generic placeholders → named classes or sections a school would
    use (e.g. ''10a'', ''10b'', ''10c'' or the course names). Likely cause: the CLASS
    label list in the Data block.'
  - 'Suggestion: anchor the bins on round score boundaries (e.g. boundary=0 or center=2.5)
    so the bars line up with the 40/50/60 ticks instead of starting at 39.'
  - 'Suggestion: a y-only grid at the style guide''s 15 % opacity would quiet the
    vertical lines that cross every bar.'
