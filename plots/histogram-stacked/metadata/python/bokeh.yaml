review:
  strengths:
  - Uses bokeh's quad glyph with left/right bin edges from np.histogram_bin_edges,
    so bars are contiguous and every group shares the same bins
  - Segment separators are drawn in the page color, so stacked segments stay distinct
    in both themes
  - Groups stacked largest-first with one order kept in every bin, as the Notes suggest
  - Theme tokens threaded through every chrome element; text readable in both renders
  weaknesses:
  - 'VQ-03 (both): the legend glyphs are about 14 px squares beside 34pt (~45 px)
    labels and read as dots → glyphs about the label height, 40-45 px (+26 to +31
    px). Likely cause: p.legend.glyph_width / glyph_height left at the default 20.'
  - 'DQ-02 (both): the study groups are labelled ''Group A'', ''Group B'', ''Group
    C'', which read generic → named study methods such as ''Flashcards'', ''Practice
    tests'', ''Re-reading''. Likely cause: the group_sizes keys.'
  - 'Suggestion: a HoverTool showing group, bin range and count per segment would
    add value in the HTML view.'
