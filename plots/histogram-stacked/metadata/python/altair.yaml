review:
  strengths:
  - Binning and counting happen in the Vega-Lite encoding (alt.Bin(maxbins=20), count(),
    stack='zero'), so every group shares the same bin boundaries by construction
  - Theme tokens thread through axes, title, legend and the segment separators, so
    both renders are fully readable and the data colors stay identical
  - Imprint palette in canonical order with the full 8-position list and a data-derived
    domain; adaptable column constants with role comments
  - Canonical 3200x1800 canvas via the pad-only step, with font sizes at the scale-based
    reference
  weaknesses:
  - 'Suggestion: the legend lists Traditional Study, Active Recall, Passive Reading
    while the bars stack Active Recall, Passive Reading, Traditional Study from the
    bottom; listing the legend in stack order (top to bottom) would let the reader
    map segments without searching.'
  - 'Suggestion: tooltips with bin range, group and count would make the HTML output
    inspectable segment by segment.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across canvas and plot area
      Chrome: centred bold title "histogram-stacked · python · altair · anyplot.ai" in dark ink; x axis "Test Score (points)" ticks 35–100 in steps of 5; y axis "Number of Students" 0–90; subtle horizontal grid; thin INK_SOFT frame; legend box "Study Method" on the right with light elevated fill. All text readable.
      Data: 13 contiguous 5-point bins stacked from zero: Active Recall (purple #C475FD) bottom, Passive Reading (blue #4467A3) middle, Traditional Study (green #009E73) top; peak total 83 in the 75–80 bin; thin page-colored separators between segments.
