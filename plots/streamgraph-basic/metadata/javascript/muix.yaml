review:
  strengths:
  - 'Correct streamgraph technique: area+stack with stackOrder="insideOut" and stackOffset="wiggle"
    is the textbook Byron/Wattenberg streamgraph algorithm, paired with catmullRom
    curve interpolation for smooth flowing bands.'
  - 'Imprint categorical palette applied in exact canonical order (t.palette[0..5]):
    brand green first (Pop), then lavender, blue, ochre, matte red, cyan — identical
    hues in light and dark renders, only chrome flips.'
  - 'Deliberate, theme-appropriate chrome: y-axis and gridlines hidden (appropriate
    for a streamgraph where shape/proportion is the message, not exact magnitude),
    thin single x-axis baseline, decluttered tick labels via tickLabelInterval to
    avoid crowding.'
  - Title follows the mandated `{Descriptive Title} · {spec-id} · {language} · {library}
    · anyplot.ai` format and both renders keep title/legend text fully legible against
    their respective backgrounds.
  weaknesses:
  - 'AR-09 (auto-reject): the first x-axis tick label "Jan 2024" is clipped at the
    left canvas edge in BOTH plot-light.png and plot-dark.png — pixel inspection confirms
    ink-colored pixels at column x=0, and a 6x zoom crop shows the left hook/curve
    of the "J" glyph is missing, not just close to the border. Root cause: xAxis uses
    scaleType="point" with margin={{left: 24, ...}}, so the first point sits at x=24
    in the plot''s local coordinate space and MUI X centers the point-scale tick label
    under that position — a label this wide ("Jan 2024") needs far more than 24px
    of left margin to avoid its centered text starting before x=0. Fix: increase margin.left
    substantially (e.g. to ~60-80px) so the first tick''s label box fits within the
    canvas, or keep the small margin but suppress/adjust the very first shown label
    so its centered text doesn''t overflow the left edge.'
  - 'Minor, not a required fix: the spec describes a ''baseline centered symmetrically
    around the x-axis'' — stackOffset="wiggle" (the standard streamgraph minimize-wiggle
    algorithm) is the correct and expected choice here, but note that it does not
    produce a perfectly mirror-symmetric envelope like stackOffset="silhouette" would;
    both are valid readings of ''streamgraph'', no deduction taken.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 target (sampled corner pixel = (250,248,241)).
      Chrome: Title "Genre Streaming Hours · streamgraph-basic · javascript · muix · anyplot.ai" centered at top in dark ink, clearly legible. Horizontal legend below title with 6 color swatches (Pop, Hip-Hop, Electronic, Rock, Jazz, Classical), all labels legible. X-axis shows a single baseline with month/year tick labels (Jan 2024, Apr 2024, ... Oct 2025) at every 3rd month; y-axis is intentionally hidden. Grid lines are off.
      Data: Six stacked, smoothly-curved bands using the Imprint palette in canonical order — Pop = #009E73 (brand green, first series, confirmed), Hip-Hop = lavender, Electronic = blue, Rock = ochre, Jazz = matte red, Classical = cyan. Bands are stacked with insideOut ordering and wiggle offset, giving an organic river-like silhouette that trends: Electronic/Hip-Hop growing, Rock/Jazz/Classical shrinking, Pop roughly flat — consistent with the code's programmed trends.
      Legibility verdict: FAIL — pixel-level inspection (6x zoomed crop of the bottom-left corner) shows the first x-axis tick label "Jan 2024" has its leading "J" clipped at the canvas' left edge (ink-colored pixels present at column x=0, left hook of the J missing). This is AR-09 edge clipping. All other text (title, legend, remaining tick labels) is fully readable and not clipped.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 target.
      Chrome: Same title and legend text now rendered in light ink, clearly legible against the dark surface — no dark-on-dark failures observed. Tick labels likewise readable.
      Data: Colors are pixel-identical to the light render (same six Imprint hues) — only the background/text/axis-line chrome flipped, as required. Confirmed via direct comparison of swatch colors between renders.
      Legibility verdict: FAIL — the same "Jan 2024" left-edge clipping reproduces identically in the dark render (confirmed via the same 6x zoomed crop); the left hook of the "J" is missing in this render too. No other legibility issues (no dark-on-dark text) were found.
