review:
  strengths:
  - 'Uses MUI X''s native stacking options — `stack`, `stackOffset: "silhouette"`
    and `stackOrder: "insideOut"` — so the centered baseline and the wiggle-reducing
    layer order come from the library rather than hand-computed offsets'
  - Filled layers sit directly on each other with no gaps, `catmullRom` curves give
    smooth flowing edges while each layer's thickness at a month stays its value
  - Y axis is hidden (thickness is the only value read) and the subtitle carries the
    value unit and time span instead, so nothing is lost without the axis
  - 'Six Imprint colors in canonical order starting with #009E73, identical in both
    renders; chrome flips cleanly between #FAF8F1 and #1A1A17 with all text readable'
  - 'Clean data story: Electronic and Hip-Hop grow, Rock cools off, Jazz and Classical
    decline, Pop stays flat, visible as layer thickness changes over 24 months'
  - 'Square legend glyphs (`labelMarkType: "square"`) match the filled areas; tooltips
    available in the HTML view'
  weaknesses:
  - 'Suggestion: a slightly larger title (about 26 px) would give the header more
    presence; it currently spans about 32 % of the width.'
  - 'Suggestion: the stream fills nearly the whole plot height, so the upper and lower
    outlines read almost flat; a little more vertical padding would let the river-like
    silhouette show more clearly.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole canvas.
      Chrome: bold dark title "streamgraph-basic · javascript · muix · anyplot.ai" centered at top, a soft-ink subtitle "Layer thickness: Streaming hours (thousands) · 24 months, Jan 2024 to Dec 2025", a horizontal legend (Pop, Hip-Hop, Electronic, Rock, Jazz, Classical) with square swatches, quarterly x ticks Jan 2024 … Oct 2025 and the axis title "Month". No y axis, no grid. All text dark and readable.
      Data: six filled layers stacked without gaps around a centered baseline, insideOut order (Hip-Hop top, then Rock, Electronic, Pop #009E73, Classical, Jazz at the bottom), smooth curved edges; Electronic and Hip-Hop visibly thicken, Rock thins over time.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, subtitle, legend labels, tick labels and "Month" all render in light ink and are clearly readable; axis line light. No dark-on-dark text.
      Data: layer colors identical to the light render (Pop #009E73, purple, blue, ochre, red, cyan); neighboring layers stay distinguishable.
      Legibility verdict: PASS
