review:
  strengths:
  - 'Correct Imprint palette order in both renders — first series (Streamly) is #009E73,
    remaining four platforms follow canonical positions 2-5 with identical hues between
    light and dark'
  - 'Theme chrome is fully correct in both renders: #FAF8F1 light / #1A1A17 dark backgrounds,
    readable ink-colored title/subtitle/axis text, no dark-on-dark or light-on-light
    failures'
  - Smooth spline interpolation (areaspline) gives genuinely organic, flowing band
    edges as the spec requests
  - Data shows real hand-off between categories — a steady grower, a fast riser, a
    fading incumbent, a flat/seasonal series, and a slow climber — good feature coverage
    for the plot type's need to show diverse trends
  - Deterministic in-memory data generation via a small fixed-seed LCG, no network/fetch
    calls, title format matches the mandated `{spec-id} · {lang} · {lib} · anyplot.ai`
    pattern exactly
  - Legend labels correctly match the five platform series names
  weaknesses:
  - 'CRITICAL — this is not a streamgraph: the baseline is not centered/symmetric
    around the x-axis, it sits fixed at the bottom of the plot area for every time
    point. Pixel-sampled the saved PNG at x=200/800/1600/2400/3000: the bottom edge
    of the colored stack is at y=1575-1577 (out of 1800px height) at EVERY column,
    while only the top edge rises as totals grow (667 -> 582 -> 450 -> 305 -> 237).
    A real centered streamgraph''s baseline wiggles up and down with the total at
    each time point; here it never moves. Root cause: the hidden ''baseline'' series
    carries a negative value (-total/2) and relies on `stacking: ''normal''` to shift
    the real (positive) platform series upward, but Highcharts splits normal stacking
    into separate positive-stack and negative-stack accumulators — a series with a
    negative value stacks independently below zero and does NOT offset the positive-valued
    series that follow it. The five platform bands are actually stacking from 0 exactly
    as in an ordinary stacked area chart; the baseline series is invisible and has
    zero visual effect. Fix: since only the core Highcharts bundle is available (no
    streamgraph/arearange module), pre-compute the true per-point stacked envelope
    in JS yourself — for each time index m, compute cumTop[i][m] = -total(m)/2 + sum(values[0..i])
    for each series i, then render each series as a NON-stacked `areaspline` whose
    data is that already-shifted cumulative top value, drawn back-to-front in z-order
    (largest cumulative series first, most-stacked series last) so each band visually
    nests over the one below it and the true wiggle/silhouette shape appears. Do not
    rely on Highcharts'' `stacking` option at all for this — it cannot combine a negative
    offset series with positive data series into one continuous stack.'
  - Because the baseline never moves, the chart is visually indistinguishable from
    a plain stacked area chart with an areaspline top edge — it fails the spec's central
    distinguishing requirement ('Unlike traditional stacked area charts, streamgraphs
    use a symmetric baseline centered around the x-axis... creating an organic, river-like
    appearance')
  - 'Layout is bottom-heavy and imbalanced as a direct consequence: large empty whitespace
    at top-left where the stream is small, almost no margin top or bottom on the right
    where the stream is large — a real centered streamgraph would keep the vertical
    center fixed and grow symmetrically, using the canvas more evenly throughout'
  - Y-axis is fully hidden with no value labeling at all (not even in a subtitle callout
    beyond 'millions'), so absolute magnitude is only inferable from context — acceptable
    for a real streamgraph's relative-shape reading, but combined with the missing
    centering it leaves the chart without a clear way to read individual series' actual
    values
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 as required.
      Chrome: Title "streamgraph-basic · javascript · highcharts · anyplot.ai" in bold dark ink, subtitle "Monthly subscriber base by streaming platform (millions)" in softer ink below it, both clearly legible. X-axis tick labels (Jan '22 ... Oct '24) and axis title "Month (2022-2024)" are dark and legible against the light background. Legend at the bottom lists all 5 platforms with color swatches, fully readable.
      Data: Five stacked color bands (green Streamly, lavender Wavecast, blue Orbit, ochre Nimbus, red Pulse) with thin light-colored separator lines between bands. First series is #009E73 as required. However, the stack's bottom edge sits essentially flush against the x-axis for the entire time range (pixel-sampled: bottom of colored region at y=1575-1577 across all columns) while only the top edge climbs as the total grows — this is the signature of an ordinary stacked-area-from-zero chart, not a centered/symmetric streamgraph baseline. The organic "river" impression the spec calls for (equal growth in both directions around a wiggling center) is absent; instead the chart reads as a stacked area chart with spline-smoothed edges.
      Legibility verdict: PASS (all text is readable), but the plot's core encoding fails the spec's baseline-centering requirement (see Weaknesses).

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 as required.
      Chrome: Title and subtitle render in light ink, fully legible against the dark background. Axis tick labels and axis title are in the correct softer light-ink tone, all readable. Legend text is light-colored and legible. No dark-on-dark or light-on-light failures anywhere.
      Data: Confirmed identical to light render — pixel-sampled the same five x columns and got the exact same top/bottom band boundaries (bottom fixed at y=1575-1577, top rising 667->582->450->305->237 with time), so the same missing-baseline-centering issue is present in the dark render, unchanged from light (as expected, since it's the same underlying series data/config, only chrome tokens flip).
      Legibility verdict: PASS (all text readable, no theme-adaptation failures), same underlying baseline-centering defect as the light render.
