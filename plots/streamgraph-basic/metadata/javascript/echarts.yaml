review:
  strengths:
  - 'Perfect Imprint palette compliance: Pop is #009E73 (brand green), and Hip-Hop/Rock/Electronic/Jazz
    follow the exact canonical order (lavender, blue, ochre, matte red) — identical
    across both themes.'
  - 'Idiomatic, distinctive library usage: themeRiver + singleAxis type="time" is
    the purpose-built ECharts pattern for a streamgraph, a feature not easily replicated
    in other libraries.'
  - Deterministic in-memory data generation (per-genre seasonal sine waves + linear
    trend) produces realistic monthly-streaming-hours data with clear width variation
    and a visible Hip-Hop/Rock crossover around early 2025.
  - 'Both renders are fully theme-correct: warm cream / near-black backgrounds, legible
    chrome throughout, no clipping or overlap.'
  - Explicit font sizing (title 22px, legend 16px, axis 14px) with a well-proportioned
    title (~35% of width) and clean, uncluttered legend.
  weaknesses:
  - No explicit x-axis title (e.g. "Month") — only tick labels are shown, which is
    a minor deduction under VQ-06 even though the date-formatted ticks are largely
    self-explanatory.
  - 'Design Excellence is solid but close to a well-configured library default: palette
    and theme tokens are correctly threaded through, but there''s no extra polish
    beyond that (e.g. no subtle opacity/gradient variation between streams, no callout
    on the Hip-Hop/Rock crossover) that would push it toward top-tier publication
    quality.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "streamgraph-basic · javascript · echarts · anyplot.ai" in bold dark ink, centered near top. Legend with 5 swatches (Pop, Hip-Hop, Rock, Electronic, Jazz) directly below the title, dark readable text. X-axis shows a time axis with year labels (2024, 2025 in bold) and month labels (Apr, Jul, Oct) in softer gray-ink, plus subtle dashed vertical gridlines.
      Data: Five smoothly flowing, symmetric organic bands stacked around a centered baseline (classic streamgraph/themeRiver wiggle). Colors top-to-bottom: Pop = #009E73 (brand green), Hip-Hop = lavender/purple, Rock = blue, Electronic = ochre/amber, Jazz = matte red — exactly the Imprint canonical order. Band widths visibly vary over time (e.g. Hip-Hop swells and briefly overtakes Rock in early 2025), showing genuine data variation.
      Legibility verdict: PASS — all text (title, legend, axis ticks) is clearly readable against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title and legend, now rendered in light/off-white text, fully legible. Axis tick labels in soft light gray, gridlines subtle but visible against the dark surface.
      Data: Identical five data colors to the light render (#009E73 green, lavender, blue, ochre, matte red) — only the chrome (background, text, grid) flips, confirming theme-adaptive tokens were used correctly and data colors stayed constant.
      Legibility verdict: PASS — no dark-on-dark failures; every text element (title, legend, ticks) is clearly visible against the near-black background.
