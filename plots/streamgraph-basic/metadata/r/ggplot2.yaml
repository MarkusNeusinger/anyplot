review:
  strengths:
  - Canvas is exactly 3200x1800 (landscape target) — passes the dimension gate cleanly
  - Theme-adaptive chrome correctly implemented in both light and dark renders; data
    colors (Imprint palette) stay identical between themes, only chrome flips
  - Natural cubic spline interpolation (spline(..., method = "natural")) produces
    genuinely smooth, organic flowing curves as required by the spec, not just a basic
    loess/geom_smooth shortcut
  - Symmetric silhouette baseline correctly centered around the x-axis (ymax = cumsum(value)
    - sum(value)/2)
  - 'Smart palette assignment: genres are sorted by total volume and the brand green
    (#009E73) is deliberately assigned to the largest-magnitude genre (Pop), with
    the remaining canonical Imprint order following'
  - Ribbon edges stroked in the page-background color (not a hard black/white border)
    — creates clean, subtle separation between adjacent streams without harsh outlines
  - No text overlap, no clipping at canvas edges, legend/title/axis all legible in
    both themes
  weaknesses:
  - Y-axis carries no label, ticks, or unit anywhere on the chart (axis.text.y blank,
    y = NULL) — a viewer can read relative proportions but has zero indication of
    absolute magnitude or units (e.g. 'streaming hours, thousands'); consider a subtitle
    or a minimal y-axis title even without full tick labels
  - Data storytelling is fairly flat beyond the total-based ordering — the genre_params
    trends (Hip-Hop and Electronic trending up, Rock trending down) are present in
    the data but not visually emphasized with any annotation, callout, or subtitle
    that would give the viewer a clear narrative focal point
  - 'With 5 series relying on color alone, the adjacent Electronic (blue #4467A3)
    and Rock (ochre #BD8233) bands are distinguishable but sit in the ''borderline''
    zone the style guide flags for 5-6 series — direct in-band labels would reinforce
    identification beyond the legend alone'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white, not dark.
      Chrome: Title "streamgraph-basic · r · ggplot2 · anyplot.ai" in dark ink top-left, clearly readable. X-axis title "Month" and tick labels (Apr 2022, Aug 2022, Dec 2022, Apr 2023, Aug 2023, Dec 2023) in soft dark gray, all legible. No y-axis ticks/labels (intentional — silhouette streamgraph baseline is not a meaningful absolute scale). Legend at bottom titled "Genre" with 5 swatches (Pop, Hip-Hop, Electronic, Rock, Jazz), text clearly readable on an elevated cream card background.
      Data: Five flowing, organically-shaped stream bands stacked with a symmetric centered baseline. Colors bottom-to-top: green (#009E73, Pop, largest band), lavender/purple (#C475FD, Hip-Hop), blue (#4467A3, Electronic), ochre (#BD8233, Rock), matte red (#AE3030, Jazz). Bands are separated by thin background-colored strokes giving clean, non-harsh separation. Smooth spline-interpolated curves give the intended river-like appearance.
      Legibility verdict: PASS — all text is clearly readable against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black, not light.
      Chrome: Same title in light/off-white ink, clearly readable against the dark background. X-axis title and tick labels in light gray, all legible. Legend card uses a slightly elevated dark background with light text, fully readable — no dark-on-dark failures anywhere.
      Data: Identical five-color palette and identical stream shapes/positions as the light render — only the chrome (background, text, ribbon-edge stroke color, legend card) has flipped; the Imprint data colors (green/lavender/blue/ochre/red) are pixel-identical between renders, confirming theme-adaptive chrome without touching data colors.
      Legibility verdict: PASS — all text is clearly readable against the dark background, no dark-on-dark failures observed (title, axis labels, tick labels, and legend text all use appropriately light ink tokens).
