review:
  strengths:
  - Cubic B-spline upsampling (scipy.interpolate.make_interp_spline) produces genuinely
    organic, flowing ribbon edges instead of the straight monthly segments geom_ribbon
    would draw by default
  - Baseline is correctly and exactly symmetric (baseline = -totals/2, top = baseline
    + totals) at every time step, giving the true centered-stream look the spec asks
    for
  - 'Full Imprint palette compliance: Pop is #009E73, remaining genres follow canonical
    order 2-5, and all five hues are pixel-identical between plot-light.png and plot-dark.png'
  - Theme-adaptive chrome is threaded correctly end-to-end — title/axis/tick/legend
    colors flip cleanly between light and dark with no dark-on-dark or light-on-light
    failures
  - Minimalist chrome (grid, spines, axis line, axis ticks all removed) with a softly
    elevated legend box — clean, uncluttered, generous whitespace
  - Synthetic data has genuine crossovers and rank changes between genres over the
    24 months (not just parallel offset bands), which is exactly the kind of feature
    coverage a streamgraph should demonstrate
  - KISS code structure with np.random.seed(42), only used imports, and current plotnine
    API (plot.save)
  weaknesses:
  - Y-axis keeps numeric tick labels (-400 to 400, titled 'Streaming Hours') that
    are an artifact of the centered-baseline transform — actual streaming hours are
    never negative, so a reader can misread the chart as showing negative values.
    Professional streamgraphs typically drop the y-axis entirely (or leave it unlabeled)
    since the baseline offset is arbitrary and only relative band thickness carries
    meaning. Consider removing axis_text/axis_title on the y-axis (or replacing the
    label with something like 'Relative Volume') while keeping the panel itself untouched.
  - No grid lines at all (panel_grid=element_blank()) combined with the misleading
    negative axis leaves the reader with no way to estimate absolute magnitude — if
    the numeric axis is kept, a very subtle horizontal reference line at 0 would help
    ground the symmetric baseline.
  - The spline-smoothed geom_ribbon technique is the standard grammar-of-graphics
    approach to a streamgraph and would look nearly identical in ggplot2/R — nothing
    here leverages a plotnine-specific capability (LM-02 generic usage).
  - No visual emphasis or focal point (e.g., highlighting one genre's peak/crossover)
    beyond the inherent shape of the stream — the chart displays the data cleanly
    but doesn't guide the viewer toward one specific insight.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 - not pure white.
      Chrome: Title "streamgraph-basic · python · plotnine · anyplot.ai" in dark ink, centered top, fully visible and not clipped. Axis titles "Month" (x) and "Streaming Hours" (y) in dark ink. Tick labels (Jan '23, Jul '23, Jan '24, Jul '24 on x; -400/-200/0/200/400 on y) in a softer dark gray. Legend titled "Genre" sits in a slightly elevated cream box to the right of the plot, listing Pop/Hip-Hop/Electronic/Rock/Jazz swatches top to bottom. All chrome text reads clearly against the light background.
      Data: Five stacked, spline-smoothed ribbons flow left to right. Bottom-to-top order is Pop (teal green), Hip-Hop (lavender/purple), Electronic (blue), Rock (ochre/amber), Jazz (matte red) - matching the legend order and the Imprint categorical palette, with Pop correctly rendered in the brand green #009E73. Band thicknesses vary and cross over each other across the 24 months, creating a genuine organic river shape roughly centered on the x-axis.
      Legibility verdict: PASS - no light-on-light or unreadable text observed anywhere in the render.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 - not pure black.
      Chrome: Same title, now in light cream/off-white text, fully visible at the top. Axis titles in light off-white, tick labels in a lighter secondary gray, both clearly legible against the dark background. Legend box uses a slightly-elevated dark gray fill (#242420-ish) with light text and swatches, positioned identically to the light render.
      Data: The same five ribbons in the same stacking order and exact same hues as the light render (Pop #009E73 green confirmed identical) - only the chrome (background/text/legend box) flips between themes, the data-color palette does not change.
      Legibility verdict: PASS - no dark-on-dark failures; every title/axis/tick/legend element is clearly readable against the near-black surface.
