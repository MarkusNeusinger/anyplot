review:
  strengths:
  - Genuinely implements a streamgraph in a library with no native support, via the
    invisible-baseline (baseline = -total/2) stacking trick on pygal.StackedLine —
    the correct technique for this constraint
  - Applies the Byron & Wattenberg inside-out layer ordering (widest-swing genre centered,
    calmer genres nested outward) to minimize visual wiggle, showing real domain understanding
    of streamgraph design
  - Featured genre (strongest net growth) gets a bolder stroke width, creating an
    intentional focal point and visual hierarchy rather than flat, undifferentiated
    bands
  - 'Correct Imprint palette usage (first series #009E73) and theme-adaptive chrome
    verified correct in both light and dark renders — no dark-on-dark or light-on-light
    failures'
  - Canvas is exactly 3200x1800, title matches the mandated '{spec-id} · {language}
    · {library} · anyplot.ai' format, and output uses the correct render_to_png +
    render()-to-HTML save pattern
  - Data generation is seeded (np.random.seed(42)) for reproducibility, and cubic
    interpolation is used for the smooth flowing curves the spec calls for
  weaknesses:
  - Y-axis shows numeric ticks from -100 to 100 for 'Streaming Hours', but these are
    an artifact of the centered-baseline stacking trick, not real per-genre values
    (actual genre values are all positive, ~5-100) — a viewer can misread the axis
    as implying negative streaming hours. Standard streamgraph convention is to hide
    y-axis tick labels/gridlines entirely since the centered baseline has no absolute
    meaning; consider show_y_guides=False and dropping numeric y tick labels, or clearly
    labeling the axis as relative.
  - 'Visual refinement is good but not exceptional: the pygal default axis line at
    x=0 and the left edge frame remain fairly prominent, which cuts against the ambient,
    flowing aesthetic a streamgraph is meant to evoke — could be pushed further toward
    a chrome-free look.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1, not pure white.
      Chrome: Title "streamgraph-basic · python · pygal · anyplot.ai" in dark ink, clearly legible and centered, spans ~65% of plot width. "Month" (x-axis) and "Streaming Hours" (y-axis, rotated) titles both dark and legible. Tick labels (-100 to 100 on y; "Jan 23", "Jul 23", "Jan 24", "Jul 24" rotated 45° on x) are dark and readable. Horizontal dashed gridlines are subtle but visible; no vertical gridlines (show_x_guides=False), a deliberate choice. Legend at bottom lists Jazz, Electronic, Hip-Hop, Pop, Rock with colored swatches, all legible.
      Data: Five smoothly interpolated, symmetric stacked bands (streamgraph) centered around a baseline that shifts through the plot: Jazz (teal #009E73), Electronic (lavender #C475FD), Hip-Hop (blue #4467A3), Pop (gold/brown #BD8233), Rock (red #AE3030), stacked inside-out by volatility. First categorical series (Jazz) is #009E73 as required. Bands are clearly distinguishable from each other and from the background.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17, not pure black.
      Chrome: Title, "Month"/"Streaming Hours" axis titles, and all tick labels render in light ink (near-white/light-gray), clearly legible against the dark background — no dark-on-dark failures observed. Gridlines and legend text remain readable, though gridlines are slightly less prominent than in the light render (still adequate, not a legibility failure).
      Data: Same five bands in identical colors and identical inside-out stacking order as the light render — only chrome (background/text/grid) flipped, data colors unchanged as required.
      Legibility verdict: PASS
