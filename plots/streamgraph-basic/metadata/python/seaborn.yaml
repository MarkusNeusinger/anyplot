review:
  strengths:
  - 'Genuine data storytelling: ''Hip-Hop rising ↑'' / ''Rock declining ↓'' annotations
    with arrows plus matching dashed center-trend overlays create a clear focal point
    instead of a flat data dump.'
  - 'Palette compliance is perfect: canonical Imprint order across all 6 genres (green,
    lavender, blue, ochre, red, cyan), first series #009E73, identical data colors
    between light and dark renders, theme-correct chrome (background, text, legend
    box) in both.'
  - Smooth cubic-spline interpolation gives the organic, flowing curve appearance
    the spec explicitly asks for, and the baseline is correctly centered/symmetric.
  - 'Sensible minimalism: y-axis intentionally omitted (values are relative in a streamgraph),
    only the bottom spine kept, subtle white band separators, no competing grid.'
  - Data shows real variety in shape (Hip-Hop growth trend, Rock decline trend, seasonal
    oscillation across all genres) rather than uniform, indistinguishable bands.
  weaknesses:
  - Title is 'streamgraph-basic · seaborn · anyplot.ai' — missing the required '{language}'
    segment. Spec format is '{spec-id} · {language} · {library} · anyplot.ai', so
    it should read 'streamgraph-basic · python · seaborn · anyplot.ai'.
  - The 'Genre' legend box (upper-left, framealpha=0.9) sits directly on top of the
    stream area and hides the first ~2-3 months (Jan-Mar '23) of the top bands (Classical,
    Electronic, Jazz) in both renders — move it outside the data (e.g. right side,
    or below the plot) instead of floating over the earliest data.
  - The bold 'Hip-Hop rising ↑' / 'Rock declining ↓' annotation text sits close enough
    to the gray dashed center-trend lines that the dashes visually cross through the
    second text line in places — nudge the text offsets or shorten the dashed lines
    so they don't intersect the annotation bounding boxes.
  - The actual streamgraph geometry (the 6 fill_between bands, which is the entire
    data encoding) is built with raw matplotlib, not a seaborn plotting call — the
    only genuine sns.* plotting function used is the two decorative dashed center-trend
    sns.lineplot overlays. Since seaborn has no native streamgraph API this is understandable,
    but leaning more on seaborn idioms elsewhere (e.g. sns.lineplot for a real data
    series, not just decoration) would strengthen Library Mastery.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "streamgraph-basic · seaborn · anyplot.ai" in dark ink, centered, clearly readable. X-axis tick labels ("Jan '23" ... "Dec '24") and x-axis label "Month (2023–2024)" in dark/soft-dark ink, fully legible. "Genre" legend box (upper-left) has dark text on a light elevated fill, readable, but the box itself sits on top of the earliest months of the stream data.
      Data: Six flowing, spline-smoothed bands stacked around a centered baseline — Pop (green #009E73), Rock (lavender), Hip-Hop (blue), Electronic (ochre), Classical (red), Jazz (cyan), in canonical Imprint order with thin cream-colored edges separating bands. Two bold annotations ("Hip-Hop rising ↑", "Rock declining ↓") with arrows, plus two dashed gray center-trend lines through the Hip-Hop and Rock bands.
      Legibility verdict: PASS (all text readable; only issue is the legend box physically overlapping the leftmost ~2-3 months of the top bands, not a contrast/readability problem).

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Title in light/off-white ink, clearly readable against the dark background. Tick labels and x-axis label in light gray, legible. Legend box has a dark elevated fill with light text, readable, but again overlaps the earliest months of the top bands.
      Data: Same six bands in the identical Imprint colors as the light render (green/lavender/blue/ochre/red/cyan) — confirms data colors are unchanged between themes, only chrome flipped. Annotation text colors match their genre (blue for Hip-Hop, lavender for Rock) and remain visible against the dark background; the gray dashed center-trend lines are lighter gray here and still visible, passing close to/through the "rising"/annotation text in a couple of spots.
      Legibility verdict: PASS (no dark-on-dark or light-on-light failures found; same legend-overlap caveat as the light render).
