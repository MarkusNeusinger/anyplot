  - PCHIP-interpolated smooth curves with a properly centered symmetric baseline produce
    a genuine organic streamgraph shape, matching the spec's core requirement
  - Theme-adaptive chrome correctly threaded through PAGE_BG/INK/INK_SOFT tokens,
    including the new separator stroke color, verified via pixel crop to render correctly
    in both themes
  - No edge clipping on title, axes, or legend in either render (verified by pixel
    inspection)
  - Realistic, neutral music-streaming dataset with plausible amplitude variation
    and a data-driven peak annotation
  weaknesses:
  - DE-01 still reads as a well-executed default rather than a distinctive aesthetic
