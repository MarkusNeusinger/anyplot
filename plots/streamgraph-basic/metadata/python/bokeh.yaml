review:
  strengths:
  - Imprint palette applied in canonical order (Pop=#009E73, Rock=#C475FD, Hip-Hop=#4467A3,
    Electronic=#BD8233, Jazz=#AE3030, Classical=#2ABCCD), identical across both themes
  - PCHIP-interpolated smooth curves with a properly centered symmetric baseline produce
    a genuine organic streamgraph shape, matching the spec's core requirement
  - Theme-adaptive chrome (background, ink, grid, legend box) is correctly threaded
    through PAGE_BG/INK/INK_SOFT tokens — both renders pass the legibility check with
    no dark-on-dark or light-on-light failures
  - HoverTool + Legend add real interactive value in the HTML output without faking
    anything in the static PNG
  - Realistic, neutral music-streaming dataset (6 genres over 2 years) with plausible
    amplitude variation and a data-driven peak annotation for storytelling
  weaknesses:
  - 'Title is missing the required {language} segment: current title is ''streamgraph-basic
    · bokeh · anyplot.ai'' but the mandated format is ''{spec-id} · {language} · {library}
    · anyplot.ai'' — fix to ''streamgraph-basic · python · bokeh · anyplot.ai'' in
    the figure() title= string.'
  - Bokeh figure keeps a full 4-sided outline (outline_line_color set on all sides)
    rather than following the minimal/L-shaped spine convention — remove or drop the
    outline for a cleaner look.
  - X-axis label 'Time' is generic given the data is monthly — rename to something
    more descriptive (e.g. 'Month') to match the specificity of the Y-axis label.
  - Streamgraph bands use fill_color == line_color with no separating stroke between
    adjacent areas — a subtle ink-colored (or PAGE_BG-colored) 1px edge between bands
    would sharpen boundaries, especially between the visually closer purple/blue/red
    hues.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Bold dark title "streamgraph-basic · bokeh · anyplot.ai" top-left; dark "Time" x-axis label and rotated "Streaming Hours (relative)" y-axis label; soft grey tick labels on both axes; subtle horizontal gridlines at ~10% alpha; a thin full-perimeter outline box around the plot area. Legend box ("Pop, Rock, Hip-Hop, Electronic, Jazz, Classical") sits just right of the plot with a light elevated-cream fill and thin border. All chrome text is clearly readable against the light background.
      Data: Six smoothly interpolated, symmetric-baseline stream bands stacked around y=0, colored (bottom-to-top) green/Pop, lavender/Rock, blue/Hip-Hop, ochre/Electronic, red/Jazz, cyan/Classical — matching Imprint palette positions 1–6 in canonical order, first series #009E73. A small circular marker plus a boxed "Pop — peak streaming month" label calls out the Pop band's peak around mid-2022.
      Legibility verdict: PASS — all text (title, axis labels, tick labels, legend, annotation) is clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same layout as light — white/light-cream title and axis labels, light-grey tick labels, subtle light-tinted gridlines, thin outline box in a soft light-grey. Legend box now uses the dark elevated fill (#242420-ish) with a light border. The annotation callout box also flips to a dark fill with white text and border.
      Data: Identical six band colors to the light render (green/lavender/blue/ochre/red/cyan) — confirms data colors are theme-independent; only chrome flipped.
      Legibility verdict: PASS — all chrome text is light-colored against the near-black background; no dark-on-dark failures observed (title, axis labels, tick labels, legend, and annotation box all readable).
