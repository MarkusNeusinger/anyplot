review:
  strengths:
  - Correct centered-baseline streamgraph geometry with smooth spline interpolation
    on every band, matching the spec's core requirement exactly
  - 'Deliberate data storytelling: genre trends (Pop rising, Rock declining, Electronic''s
    seasonal oscillation, steady Jazz/Classical) are hand-crafted so the shape itself
    communicates the story, reinforced by an ink-toned highlight line tracing Pop''s
    crest as a clear focal point'
  - Correct Imprint palette in canonical order with brand green as the first series
    (Pop), identical across light/dark themes; theme-adaptive chrome (background,
    text, grid, legend) correctly threaded via ANYPLOT_THEME and consistent across
    both renders
  - 'Rich, plotly-idiomatic interactivity: unified hover mode, per-fill custom tooltips
    with computed share percentages, hoveron=''fills'' — genuinely leverages plotly''s
    HTML output beyond the static PNG'
  - 'Clean, KISS-structured code: seeded random data, no fake functionality, correct
    output file naming (plot-{THEME}.png/.html) and current API usage'
  weaknesses:
  - X-axis title 'Month' sits directly above the horizontal legend box, close enough
    to read at a glance as a header for the legend swatches — which are genre names,
    not months. Increase the vertical gap between the x-axis title and the legend
    (e.g. push legend.y further negative) to remove the ambiguity.
  - Y-axis has no title at all. Hiding the tick labels is the right call for a centered-baseline
    streamgraph (the offset values are meaningless), but omitting a y-axis title too
    leaves readers without any cue that band thickness = streaming hours. Add a y-axis
    title such as 'Streaming Hours' even with ticks hidden.
  - 6 categorical series rely on hue alone to distinguish adjacent bands; per the
    style guide's series-count guidance, 5-6 series should add a redundant cue (e.g.
    a thin edge stroke per band, or direct end-of-band labels) to stay safely distinguishable
    under CVD simulation.
  - The bordered, filled legend box (ELEVATED_BG + 1px border) reads as an isolated
    callout slightly disconnected in style from the rest of the chart — consider a
    borderless legend consistent with the 'remove box frames around legends' default
    guidance.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Title "streamgraph-basic · python · plotly · anyplot.ai" and subtitle "Monthly streaming hours by music genre, 2022-2023" render in dark ink at the top, both fully visible with no clipping. X-axis tick labels (Jan 2022 ... Oct 2023) and the "Month" axis title are dark and legible. A thin horizontal rule sits above and below the plot area. Legend is a bordered off-white card below the x-axis title, holding six genre swatches (Pop, Rock, Hip-Hop, Electronic, Jazz, Classical) with dark text.
      Data: Six stacked, spline-smoothed bands form the streamgraph, centered symmetrically around a hidden baseline. Bottom-to-top order is Pop (brand green #009E73), Rock (lavender), Hip-Hop (blue), Electronic (ochre), Jazz (red), Classical (cyan) — canonical Imprint order. A thin black line traces the crest of the Pop band as a focal-point highlight. Pop visibly widens toward the right (genre growing), Rock narrows, Electronic pulses with a wavy seasonal pattern.
      Legibility verdict: PASS — all text is clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Title and subtitle render in light ink/soft-gray, fully visible with no clipping. X-axis tick labels and "Month" axis title are light-colored and legible. Legend card uses the dark elevated background (#242420) with light text and light swatch labels, fully readable.
      Data: The same six bands in identical colors to the light render (Pop still #009E73 at the bottom, same canonical Imprint order for the rest) — confirms data colors are theme-independent. The Pop-crest highlight line is now rendered in light ink (white-ish), correctly flipped for contrast against the dark fill, still clearly visible.
      Legibility verdict: PASS — no dark-on-dark failures; all title, axis, tick, and legend text is clearly readable against the near-black background, and the brand green Pop band remains vivid.
