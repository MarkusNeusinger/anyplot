      Data: Six flowing bands stacked with a wiggle-minimized baseline and spline-smoothed edges, each separated by a thin off-white (background-colored) stroke. Bottom-to-top: Classical (cyan #2ABCCD), Electronic (ochre #BD8233), Hip-Hop (blue #4467A3), Pop (brand green #009E73, largest band, centered), Rock (lavender #C475FD), Jazz (matte red #AE3030, top). First series (Pop) is the brand green as required.
