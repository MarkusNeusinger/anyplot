review:
  strengths:
  - Implements the canonical Byron & Wattenberg inside-out layer ordering (argsort
    by total volume, alternating left/right placement) so the dominant genre (Pop)
    sits in the visual center — a genuine, well-reasoned data-storytelling decision,
    not a default.
  - Uses matplotlib's baseline="wiggle" minimization plus scipy cubic-spline interpolation
    (make_interp_spline, k=3) for authentically smooth, organic river-like curves
    rather than a naive stackplot.
  - 'Theme-adaptive chrome is threaded correctly end-to-end: PAGE_BG/INK/INK_SOFT/ELEVATED_BG
    all branch on ANYPLOT_THEME and are applied consistently to title, x-label, ticks,
    spine, and legend frame in both renders.'
  - 'Imprint palette applied correctly and un-cherry-picked: canonical position 1→N
    by category-definition order, with brand green (#009E73) anchoring Pop (the largest,
    most central category).'
  - Edge highlighting (edgecolor=PAGE_BG, linewidth=1.2) between adjacent bands improves
    separability of same-hue-family neighbors without adding chartjunk.
  - 'Minimal chrome done well: only the bottom spine kept, no gridlines (appropriate
    since there''s no meaningful y-scale in a wiggle-baseline streamgraph), legend
    deliberately placed outside the axes because the stream fills the full plot height
    everywhere.'
  - Code is fully reproducible (np.random.seed(42)), flat script with no functions/classes
    (KISS), clean imports, and saves via the correct plot-{THEME}.png contract.
  weaknesses:
  - The spec's Notes explicitly say "Center the baseline symmetrically around the
    x-axis," but the implementation uses baseline="wiggle" (slope-minimizing) rather
    than baseline="sym" (literally symmetric). Wiggle is a legitimate, widely-used
    streamgraph baseline (same as d3's default offsetWiggle) and the visual result
    reads well, but it's a minor deviation from the literal spec wording worth a one-line
    comment in the code explaining the tradeoff, or switching to baseline="sym" if
    strict symmetry is preferred.
