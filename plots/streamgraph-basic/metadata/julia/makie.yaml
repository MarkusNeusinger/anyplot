review:
  strengths:
  - 'Correct streamgraph construction: symmetric silhouette baseline (baseline = -totals/2)
    centered on zero, with a hand-rolled Catmull-Rom spline giving genuinely organic,
    flowing layer edges rather than sharp monthly knots'
  - 'Imprint palette applied correctly: first series is #009E73 brand green, remaining
    three series follow canonical positions 2-4 (lavender/blue/ochre), and data colors
    are pixel-identical between plot-light.png and plot-dark.png'
  - 'Theme-adaptive chrome works correctly: PAGE_BG, INK, INK_SOFT all flip appropriately
    between #FAF8F1/#1A1A17 light/dark, title and tick labels stay legible in both
    renders'
  - 'Thoughtful design touch: thin background-colored strokes drawn between adjacent
    bands sharpen the boundary where two saturated fills touch directly'
  - 'Clean minimal chrome: top/right/left spines removed, no grid, generous whitespace,
    legend has no frame box'
  - Canvas is exactly 3200x1800 (landscape gate), no elements are clipped at the canvas
    edge
  - Realistic, neutral dataset (monthly streaming hours by music genre, 2024-2025)
    with a clear underlying narrative (Pop dominant, Electronic growing, Rock declining)
  weaknesses:
  - 'Both xlabel="Month" and ylabel="Streaming Hours (millions)" are set in the Axis()
    constructor but do NOT render in the saved PNG in either theme — pixel inspection
    of plot-light.png and plot-dark.png shows only background color in the left margin
    (no rotated y-label text) and below the x tick labels (no "Month" text), confirmed
    identically in both renders. Likely cause: yticksvisible=false + yticklabelsvisible=false
    + leftspinevisible=false collapse the left protrusion to zero and take the ylabel
    row with it, and something equivalent is happening on the x side. Fix: explicitly
    set xlabelvisible=true and ylabelvisible=true on the Axis, re-render, and visually
    confirm both label strings actually appear as pixels in the saved PNG margins
    before resubmitting — do not rely on the kwargs being set as proof they render.'
  - Because the y-axis has no working label and no ticks at all, a viewer cannot verify
    the absolute scale ("Streaming Hours (millions)") from the chart itself — only
    relative proportions are readable. This is compounded by, not independent of,
    the ylabel rendering bug above.
  - Title occupies only ~25% of the plot width at titlesize=30 — well under the 50-70%
    guideline. Since the title text is shorter than the ~67-char reference (no descriptive
    prefix used), some undersizing is expected, but there is room to raise titlesize
    a few points for a bolder focal point given the ample surrounding whitespace.
  - Bottom margin below the x tick labels is tight (~35px of the 1800px canvas height)
    — not clipped, but with xlabel currently invisible there is unused reserved space
    that isn't being used productively; fixing the xlabel rendering should also rebalance
    this margin.
  - Data storytelling is driven entirely by the raw shape of the stream — no direct
    annotation or callout reinforces the Pop-dominance / Electronic-growth narrative
    that the data already contains.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "streamgraph-basic · julia · makie · anyplot.ai" is bold, dark ink, clearly legible, occupies roughly 25% of the plot width. X-axis tick labels (Jan 2024, Jul 2024, Jan 2025, Jul 2025, Dec 2025) are visible in soft ink-gray below a thin bottom spine. Legend at the right lists Pop/Hip-Hop/Rock/Electronic with matching color swatches, no frame box. Pixel inspection of the left margin and the strip below the x tick labels confirms NO x-axis label ("Month") or y-axis label ("Streaming Hours (millions)") text is actually rendered anywhere, despite both being set in the Axis() call — the axis has no visible label text and no y ticks at all.
      Data: Four smoothly-flowing stacked bands with a symmetric (silhouette) baseline centered vertically. Bottom-to-top order: Pop (#009E73, brand green), Hip-Hop (lavender #C475FD), Rock (blue #4467A3), Electronic (ochre #BD8233) — matches canonical Imprint palette order 1-4. Thin background-colored strokes separate adjacent bands. Pop is the largest/most stable band, Electronic visibly grows over the two-year span, Rock visibly shrinks.
      Legibility verdict: PASS for all text that IS rendered (title, tick labels, legend) — but FAIL for axis labels, which are absent entirely rather than illegible (a rendering-completeness bug, not a contrast/theme bug).

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title, now in light ink (#F0EFE8-equivalent), clearly legible against the dark surface. Tick labels in the lighter soft-ink tone are readable, no dark-on-dark issue. Legend swatches and text are legible with soft light-gray labels. Same pixel-level check confirms the x-axis label and y-axis label are equally absent here — this is a consistent code-level rendering bug, not a theme-specific contrast failure.
      Data: Identical band colors and identical layer shapes to the light render — confirms data colors are held constant across themes as required; only chrome (background + text tones) flipped.
      Legibility verdict: PASS for all rendered text (no dark-on-dark or light-on-light failures) — FAIL for axis labels for the same reason as the light render (missing, not illegible).
