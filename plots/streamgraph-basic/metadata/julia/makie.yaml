review:
  strengths:
  - Correct symmetric ('silhouette') streamgraph baseline with a genuinely smooth
    Catmull-Rom spline interpolation between monthly samples, producing organic flowing
    curves as required by the spec
  - Imprint palette applied in correct canonical order (green Pop, lavender Hip-Hop,
    blue Rock, ochre Electronic), identical across light and dark renders
  - 'Theme-adaptive chrome is clean: spines minimized to a single bottom line, no
    grid clutter, correct background hex in both themes, all text readable in both
    renders'
  - 'Realistic, varied data: four genres with genuinely different trend directions
    (Rock declining, Electronic growing strongly, Pop/Hip-Hop at different rates)
    instead of parallel bands'
  - Frameless legend clearly identifies all four categories; code is clean KISS structure,
    reproducible via Random.seed!(42), and imports are all used
  weaknesses:
  - Title renders noticeably smaller than expected for the mandated string — titlesize=20
    doesn't achieve the 'largest element, first thing readers see' typographic hierarchy
    on a 3200px-wide canvas; increase titlesize to roughly 28-32 for stronger brand
    presence and better proportion.
  - 'No axis labels or units anywhere: no x-axis title (e.g. ''Month''), and nothing
    indicates what the band thickness represents (e.g. ''Streaming hours (millions)'').
    Hiding the y-axis is acceptable streamgraph convention given the arbitrary symmetric
    baseline, but a short y-axis label or subtitle would still help viewers understand
    the encoded magnitude.'
  - Library Mastery is generic — the band! + manual cumsum stacking could be replicated
    in matplotlib's fill_between with little change; consider leveraging a more Makie-distinctive
    feature (e.g. richer text via `rich_text`, `Interpolations.jl`-based smoothing,
    or custom Attributes/theme composition) to differentiate the implementation.
  - Design Excellence is solid but conventional — the optional thin-stroke pattern
    from the style guide (edge-highlighting) could add extra polish and layer separation
    between adjacent bands, and one growing genre (Electronic) could be given a touch
    more visual emphasis to sharpen the storytelling.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Bold dark title "streamgraph-basic · julia · makie · anyplot.ai" at top-center, clearly legible but smaller in proportion to the canvas than expected for this title length. X-axis shows five date tick labels (Jan 2024, Jul 2024, Jan 2025, Jul 2025, Dec 2025) in soft dark ink against the light background, fully readable. No y-axis ticks/labels (intentional for a streamgraph with a symmetric, arbitrary baseline). A frameless legend sits to the right of the plot listing Pop, Hip-Hop, Rock, Electronic with color swatches, all legible.
      Data: Four smoothly flowing, spline-interpolated bands stacked around a centered, wavy baseline. Bottom-to-top order: Pop (brand green #009E73), Hip-Hop (lavender), Rock (blue), Electronic (ochre). Electronic's band visibly widens toward the right (2025), Rock's narrows — a genuine, readable trend. No overlap or clipping observed.
      Legibility verdict: PASS (all text readable; title proportion is smaller than ideal but not illegible).

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title, now in light/white text, clearly legible against the dark background. X-axis tick labels are light-colored and fully readable. Legend text is also light-colored and legible against the dark surface, with swatches unchanged.
      Data: Colors are pixel-identical to the light render — brand green, lavender, blue, ochre bands in the same stacking order and same relative shapes/trends. Only the chrome (background, text) flipped; the data-color identity check passes.
      Legibility verdict: PASS (no dark-on-dark text found — all title, tick labels, and legend text are clearly light-colored against the near-black surface).
