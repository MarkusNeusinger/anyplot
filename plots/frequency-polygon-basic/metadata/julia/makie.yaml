      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "frequency-polygon-basic · julia · makie · anyplot.ai" in bold dark ink, clearly visible top-center. X-axis label "Reaction Time (ms)" and Y-axis label "Frequency" (rotated) both in dark ink, readable. Tick labels (200/300/400/500 on x, 0/20/40 on y) in a softer gray, legible. Subtle horizontal gridlines at y=20/40 only, low-contrast. Legend top-right with three swatches (Control, Caffeine, Sleep-deprived), no frame box, labels in soft gray — all readable.
      Data: Three overlapping frequency polygons closed to zero at both ends, each with a semi-transparent fill beneath the line. First series (Control) is Imprint brand green #009E73, second (Caffeine) is lavender #C475FD, third (Sleep-deprived) is blue #4467A3 — matches canonical Imprint order. Caffeine's line is coded as dashed in the script but renders solid in the image (confirmed via zoomed crop of both the line and its legend swatch). Sleep-deprived's line is visibly thicker than the other two.
      Legibility verdict: PASS — all text is clearly readable against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title, axis labels, and tick labels as the light render but flipped to light ink/gray tones (confirmed via zoomed crops of the "0" y-tick and the "Reaction Time (ms)" x-axis label/ticks) — all clearly legible against the dark surface, no dark-on-dark failures observed. Gridlines remain subtle.
      Data: Colors are pixel-identical to the light render (#009E73 / #C475FD / #4467A3) — only the chrome (background, text, grid) flipped. The Caffeine line and legend swatch are solid in this render too, same non-rendering-dash issue as light.
      Legibility verdict: PASS — all text is clearly readable against the dark background; no dark-on-dark text found.
