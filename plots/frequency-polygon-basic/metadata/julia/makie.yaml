review:
  strengths:
  - Shared bin edges computed once across all three groups (`edges`/`midpoints`) so
    the polygons are directly comparable, and each polygon is explicitly closed to
    zero at both ends per the spec notes
  - Layered semi-transparent bands (`band!` at alpha 0.15) under each `lines!` stroke
    create a readable ridgeline-style comparison without one group obscuring another
  - 'Imprint palette used in exact canonical order (#009E73, #C475FD, #4467A3) and
    is identical between the light and dark renders; only chrome (background, ink,
    grid) flips correctly via the THEME env var'
  - All font sizes are explicitly set (titlesize=20, xlabelsize/ylabelsize=14, tick
    label sizes=12) and remain legible at full resolution and scaled down in both
    themes
  - Deliberate visual-hierarchy choice (Sleep-deprived gets linewidth=4 vs 3 for the
    other two) documented directly in a code comment explaining the storytelling intent
  - 'Clean KISS script structure: no functions/classes, straightforward imports ->
    data -> plot -> save flow, with Random.seed!(42) for reproducibility'
  weaknesses:
  - The `linestyles = [:solid, :dash, :solid]` array assigns `:dash` to the Caffeine
    line (index 2), but both the plotted line and its legend swatch render as a solid
    stroke in both themes (verified at 4x zoom crop) — the dashed differentiation
    the code intends never actually appears. Since color already distinguishes the
    three groups this isn't a legibility failure, but the dead styling code should
    either be fixed (confirm CairoMakie renders the `:dash` linestyle correctly for
    `lines!`, e.g. by testing an explicit dash tuple) or removed if truly non-functional.
  - The linewidth-based emphasis on Sleep-deprived (4 vs 3) is a nice storytelling
    idea per the code comment, but the 33% difference is subtle enough that a viewer
    is unlikely to register it as intentional emphasis without reading the legend/comment
    — consider a slightly larger contrast or a complementary cue (e.g., z-order/opacity)
    if the intent is to visually foreground that group.
  - In the busy 250-320ms overlap region all three semi-transparent fills stack into
    a muddy gray-blue tone that reduces at-a-glance separation of the three bands
    (the line strokes themselves stay traceable, so this is a polish note rather than
    a correctness issue).
  image_description: |-
