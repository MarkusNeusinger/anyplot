review:
  strengths:
  - 'Correct frequency-polygon construction: shared bin edges across all three groups,
    midpoints connected with straight segments, and the polygon closed to zero at
    both ends per spec notes'
  - Theme-adaptive chrome is fully threaded through (PAGE_BG, INK, INK_SOFT) and both
    renders are readable with matching data colors
  - Semi-transparent band! fill beneath each lines! call adds depth without obscuring
    the overlapping distributions, and canonical Imprint order is respected (Control=#009E73,
    Caffeine=#C475FD, Sleep-deprived=#4467A3)
  - 'Data tells a real story: Caffeine group is faster and tighter, Sleep-deprived
    is slower and more spread out, Control sits in between — exactly the kind of comparison
    this chart type is built for'
  - Title format, axis labels with units, and frameless legend all match spec/style-guide
    requirements exactly
  weaknesses:
  - using Statistics is imported but never called anywhere in the script (no mean/std/median/etc.
    used) — remove the unused import for CQ-03
  - frequency_polygon_points(...) is a defined function, which breaks the mandated
    KISS Imports -> Data -> Plot -> Save structure (CQ-01 expects no functions/classes)
    — inline the binning loop directly into the Data section instead of wrapping it
    in a function
  - 'Design Excellence is still close to library-default territory: the fills and
    line styling are functional but not yet distinctive — consider varying line style
    (e.g. dashed for one group) or subtly emphasizing the Sleep-deprived tail to build
    more visual hierarchy/storytelling (DE-01/DE-03)'
  - band! + lines! is a solid but fairly generic Makie combination — leaning on a
    more distinctive Makie feature (e.g. stairs! for the raw histogram outline as
    a comparison, or per-series linestyle) would raise Library Mastery
