review:
  strengths:
  - The polygons close on the baseline exactly one bin width beyond the first and
    last midpoint, computed from the shared edges
  - One set of np.histogram edges for all groups, so every vertex sits on the same
    x positions
  - Groups use Imprint color plus a dashed line for the third group, with native fill='tozeroy'
    transparency; hover in the HTML
  - 'Adaptable layout: column constants, a Data block that binds df, and a graph-objects
    loop over df.groupby'
  - Theme tokens reach every chrome element, so both renders are fully legible
  weaknesses:
  - 'DQ-02 (both): the third group is labelled ''Postal service'' but delivers in
    about 30-130 minutes (median about 52 min), which a postal service does not do
    → a courier type that delivers in that time, such as ''Car courier'' or ''Drone
    service''. Likely cause: the COURIER label list in the Data block.'
  - 'Suggestion: the closing points at the plot''s left and right edges show half
    markers; a little x-axis padding would show them whole.'
  - 'Suggestion: Bike courier and Van fleet both use solid lines; a distinct dash
    for each group would make style a full second cue.'
