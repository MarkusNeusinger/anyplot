review:
  strengths:
  - 'All four characteristic properties hold: straight segments at shared bin midpoints,
    every polygon closed on a zero baseline that starts the frequency axis'
  - 'Theme tokens threaded through every chrome element; Imprint order kept from the
    data via scale limits, so Students get #009E73 in both renders'
  - Markers and a translucent fill (alpha 0.18), both allowed by the Notes, keep the
    overlapping Students/Professionals polygons readable
  - Customer-age scenario gives three clearly different shapes (narrow tall, broad,
    shifted right) with descriptive axis titles carrying units
  weaknesses:
  - 'VQ-05 (both): the legend title ''Segment'' and the label ''Professionals'' touch
    the legend frame with no inner padding → leave about 4-6 px between text and frame.
    Likely cause: legend_background frame with default legend_box_margin/legend_margin;
    set legend_margin or drop the frame color.'
  - 'Suggestion: x-axis breaks only at 30, 50 and 70; breaks every 10 years would
    make the bin positions easier to read.'
  - 'Suggestion: compute the polygon with plotnine''s stat_bin (geom_freqpoly with
    shared breaks plus a stat_bin area layer) instead of numpy to showcase the grammar.'
