review:
  strengths:
  - Shared bin edges from np.histogram_bin_edges put every group's vertices at the
    same x positions
  - Each polygon is closed to zero at both ends on a y axis that starts at zero
  - Groups are separated by Imprint color and by marker shape, so lines stay traceable
    where they cross in both themes
  - Three distinct distribution shapes (normal cycling, right-skewed bus, bimodal
    train) make the comparison informative
  - Theme tokens threaded through sns.set_theme rc; both renders theme-correct on
    the exact 3200x1800 canvas
  weaknesses:
  - 'Suggestion: a single sns.lineplot call on a long-form polygon table with hue=
    and palette= would replace the per-group loop.'
