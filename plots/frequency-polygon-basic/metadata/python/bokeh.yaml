review:
  strengths:
  - Shared bin edges from np.histogram and one zero point beyond each end close every
    polygon on the baseline of a zero-based Range1d axis
  - Theme tokens threaded through title, axes, ticks, grid and legend; both renders
    fully readable and data colors identical across themes
  - 'Adaptable layout: column constants, a single Data block and a loop that looks
    up each group''s Imprint position'
  - Bokeh HTML output keeps pan/zoom interactivity for the detail view
  weaknesses:
  - 'VQ-03 (both): each group''s 25% fill is drawn after the previous group''s line,
    so the Morning line between scores 70 and 85 and the Afternoon line below 65 read
    tinted and dimmer under the later fills → draw all patches first, then every line
    and marker on top. Likely cause: patch, line and scatter emitted together inside
    one loop iteration per group.'
  - 'DQ-03 (both): the Afternoon Session has counts in the bins centred near 101 and
    105, test scores above 100 points → keep scores within 0-100 (smaller spread or
    clip). Likely cause: rng.normal(loc=75, scale=12) without bounds.'
  - 'Suggestion: a dashed or dotted style for one group would add a second cue besides
    color where the lines cross.'
