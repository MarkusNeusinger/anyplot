review:
  strengths:
  - Native geom_freqpoly computes shared bins, so every group's vertices sit at the
    same x positions (C3)
  - 'Imprint palette in canonical order with #009E73 first, identical data colors
    in both themes'
  - Realistic three-condition response-time data showing unimodal, shifted and bimodal
    shapes
  - Axis and legend titles come straight from the descriptive column constants, keeping
    labs() to the title
  - Interactive HTML export adds hover inspection of the bin counts
  weaknesses:
  - 'VQ-01, VQ-07 (dark): the legend box renders pure white (#FFFFFF) on the #1A1A17
    page, so the near-white legend title ''Condition'' is unreadable and the entry
    labels read faint → legend background in PAGE_BG with no white fill. Likely cause:
    legend_background not set in theme(), so theme_minimal''s white legend box remains.'
  - 'SC-02 (both): polygons do not all close on zero at both ends (C2): Treatment
    A starts at a count of 1 at ~135 ms and Treatment B ends at 1 at ~525 ms → every
    line starts and ends at frequency 0, one empty bin beyond the data. Likely cause:
    geom_freqpoly(bins=25) without padding of the bin range (e.g. a boundary/breaks
    range one bin wider on each side).'
  - 'Suggestion: the semi-transparent fill the Notes allow beneath each polygon could
    ease reading the overlap.'
