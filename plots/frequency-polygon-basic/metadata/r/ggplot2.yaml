review:
  strengths:
  - 'geom_freqpoly(pad = TRUE) with stat = ''bin'' reused in geom_area and geom_point:
    one shared binning (BIN_WIDTH, BIN_START) aligns every group''s vertices and closes
    each polygon on zero'
  - y-axis expansion of 0 below puts the polygon baseline exactly on the x-axis line,
    as the spec's closed-polygon property asks
  - Legend glyphs combine line, marker and fill swatch, matching the marks in both
    themes
  - 'Theme tokens threaded through all chrome; text fully legible on both #FAF8F1
    and #1A1A17'
  - 'Imprint positions 1-3 in canonical order with Cohort A in #009E73'
  weaknesses:
  - 'DQ-02 (both): the groups are labelled ''Cohort A'', ''Cohort B'', ''Cohort C'',
    which read as generic placeholders → concrete cohort names (e.g. ''Spring 2025'',
    ''Fall 2025'', ''Spring 2026''). Likely cause: the rep(c("Cohort A", ...)) label
    vector.'
  - 'DQ-03 (both): Cohort B''s tail runs to about 107 on a test score axis that a
    reader takes as 0-100 → keep all scores within 0-100 (about -7 points at the top).
    Likely cause: rnorm(200, mean = 78, sd = 10) without bounding to the score range.'
  - 'Suggestion: lighter fill alpha (about 0.12) would keep the three overlapping
    fills from merging into one slate tone in the 70-80 band.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, not pure white; 3200x1800 landscape.
      Chrome: title "frequency-polygon-basic · r · ggplot2 · anyplot.ai" top-left in dark ink; axis titles "Test score" and "Frequency"; ticks 60/80/100 and 0-40 in INK_SOFT; subtle grey major grid; left and bottom axis lines only; legend "Cohort" on the right. All readable.
      Data: three frequency polygons with point markers at every bin midpoint and translucent fills: Cohort A green #009E73 (peak 32 near 71), Cohort B violet #C475FD (peak 32 near 77, long right tail to ~107), Cohort C blue #4467A3 (tallest peak 43 near 74). Every line padded to zero at both ends, baseline flush with the x-axis; vertices of all groups share the same x positions.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17, not pure black.
