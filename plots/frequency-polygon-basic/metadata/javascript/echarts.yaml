    spans roughly 230-750ms, leaving ~25-30% of the plot width as empty margin on
    the left of the visible polygons — set xAxis.min to a value just below the extended
    minimum point (e.g. midpoints[0] - 2*binWidth) to reclaim that space'
  - Peak markPoint pins (symbolSize 34) sit exactly on top of the peak bin's data
    marker, visually replacing rather than augmenting it — offset the pin slightly
    above the line (e.g. via a small y-value bump or symbolOffset) so the underlying
    circle marker at the peak bin stays visible, preserving marker consistency across
    all bins
