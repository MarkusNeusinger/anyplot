review:
  strengths:
  - 'First series correctly uses brand green #009E73 with the remaining series following
    Imprint canonical order (lavender, blue)'
  - Distinct line styles (solid/dashed/dotted) paired with color differentiate the
    three groups without relying on color alone (CVD-safe)
  - Bin edges are shared across all three groups (dataMin/dataMax/binWidth computed
    once from the pooled data) so the polygons compare fairly, per the spec's explicit
    requirement
  - Polygons are correctly extended to zero at both ends via the unshift/push points
    in toPolygon(), closing the shape as the spec requests
  - Semi-transparent area fills (opacity 0.12) let overlapping distributions read
    clearly instead of obscuring each other
  - Deterministic reproducibility via a fixed-seed LCG feeding a Box-Muller normal
    sampler, no external RNG dependency
  - Theme-adaptive chrome is threaded correctly through ANYPLOT_TOKENS in both renders
    — text, axis lines, and grid all read clearly on both the light and dark surfaces
  - Canvas dimension gate passed (3200x1800 landscape, no clipping observed on either
    render)
  weaknesses:
  - 'Design Excellence is competent but generic: beyond the spec-mandated fills/line-styles
    there is no deliberate focal point or emphasis (e.g., a markLine for each group''s
    mean/peak reaction time, or a callout on the largest gap between groups) to guide
    the viewer to an insight — add one to strengthen DE-03 (Data Storytelling)'
  - No distinctive ECharts-specific features are used beyond a standard line+area
    series (LM-02) — consider a tooltip formatter for precise per-bin readouts, markLine/markPoint
    to flag each group's peak, or emphasis/legend-hover focus to leverage capabilities
    unique to ECharts
  - 'Chrome could be more refined (DE-02): axisLine on both axes is rendered at full
    default weight even though grid lines are already subdued — consider lightening
    or thinning the axis lines further, or dropping the x-axis line to match the already-hidden
    x splitLine, for a cleaner minimal look'
