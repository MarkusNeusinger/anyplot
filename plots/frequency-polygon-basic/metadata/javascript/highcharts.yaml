review:
  strengths:
  - Distinctive Highcharts xAxis.plotLines feature marks each group's mean reaction
    time directly on the axis, giving the chart a clear storytelling focal point (the
    dose-response shift).
  - 'Correct frequency-polygon construction: bin edges are shared across all three
    groups and each polygon is closed to zero at both ends via padding bins, exactly
    as the spec requests.'
  - Redundant color + dashStyle (solid/short-dash/short-dot) encoding keeps the three
    overlapping groups distinguishable even without color, satisfying the spec's 'distinct
    line colors and/or styles' note.
  - Theme-adaptive chrome is correctly threaded through in both renders; Imprint palette
    applied in canonical order with the brand green first.
  - Clean, deterministic, appropriately simple code with a seeded LCG generator for
    reproducibility.
  weaknesses:
  - The 'High dose mean' plotLine label overlaps the High-dose series' own peak marker
    (~470ms, frequency ≈94) in both light and dark renders — the marker dot sits inside
    the rotated label text, partially obscuring both. Offset the plotLine label (e.g.
    increase the y offset further, right-align it past the peak, or move mean labels
    to the bottom of the axis) so it clears the series' own peak.
  - The rotated mean-line labels are quite small (11px CSS) relative to the 3200px
    canvas — a slightly larger size would improve mobile legibility without adding
    clutter.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 (not pure white).
      Chrome: Title "frequency-polygon-basic · javascript · highcharts · anyplot.ai" in bold dark ink, clearly visible at top. Axis titles "Reaction Time (ms)" and "Frequency" in medium-grey ink, tick labels in the same soft grey, all legible. Horizontal gridlines are thin and subtle. Legend at the bottom shows "Placebo" (green), "Low dose" (purple), "High dose" (blue) with matching marker swatches.
      Data: Three overlapping frequency polygons with semi-transparent fills. First series (Placebo) is brand green #009E73, solid line; second (Low dose) is lavender/purple, short-dash line; third (High dose) is blue, short-dot line. Three thin vertical dotted "mean" reference lines with small rotated labels mark each group's mean reaction time. All three curves are closed to zero at both ends. Data colors, markers (radius ~4 circles), and shapes are clearly distinguishable from each other and from the background.
      Legibility verdict: PASS — all text is readable against the light background. One minor legibility nit: the "High dose mean" label text passes directly through/behind that series' own peak marker, which is a mild overlap but does not make either element unreadable.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 (not pure black).
      Chrome: Title, axis titles, and tick labels rendered in light off-white/soft-grey ink — all clearly legible against the dark background, no dark-on-dark failures observed. Gridlines are faint but visible. Legend text is light-colored and readable.
      Data: Data colors are identical to the light render (green #009E73, lavender, blue) — only the chrome (background, text, gridlines) flipped as expected. The same three mean-reference dotted lines and rotated labels appear, with the same minor overlap between the "High dose mean" label and its series' own peak marker observed in the light render.
      Legibility verdict: PASS — all text is readable against the dark background; no dark-on-dark or light-on-light failures found.
