review:
  strengths:
  - 'Correct frequency-polygon construction: shared bin edges across all three groups,
    and zero-value padding on both ends closes the polygon shape as the spec requests'
  - 'Full Imprint palette compliance: first series is brand green #009E73, remaining
    two series follow canonical positions 2/3 (lavender, blue), identical data colors
    between light and dark renders, correct theme-adaptive chrome and page backgrounds'
  - 'Idiomatic, contract-clean Highcharts usage: area chart type, no explicit chart.width/height,
    animation disabled on both chart and series, credits disabled, transparent chart
    background'
  - Clear, descriptive axis titles with units ("Reaction Time (ms)", "Frequency")
    and a legend that matches the series names
  - Realistic, neutral dose-response dataset (Placebo/Low dose/High dose reaction
    times) with a sensible scale and plausible narrowing/shift pattern across groups
  weaknesses:
  - No markers at the plotted bin-midpoints (~17 points per series after binning)
    — the spec explicitly suggests markers for small point counts; adding small markers
    would improve element visibility per VQ-03 without cluttering the polygon lines
  - The triple-overlap region (~530-590ms) where all three semi-transparent fills
    stack becomes visually muddy/dark, momentarily obscuring which group's fill dominates
    — consider lowering fillOpacity slightly further or relying more on the line strokes
    than the fills in dense-overlap zones
  - Groups are differentiated by color only, not by line style (spec allows 'color
    and/or style') — a subtle dashed/dotted variant on one series would add a redundant
    encoding, especially useful where fills overlap
  - Design execution is solid but fairly generic for a Highcharts area chart — no
    distinctive library feature beyond fillOpacity (e.g. plotLines for group means,
    or per-series legend markers matching line style) to elevate it above a standard
    implementation
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white surface consistent with the #FAF8F1 target, not pure white.
      Chrome: Title "frequency-polygon-basic · javascript · highcharts · anyplot.ai" is bold dark ink, clearly legible. Axis titles "Reaction Time (ms)" (x) and "Frequency" (y) are dark-grey and readable. Tick labels along both axes are legible dark-grey text. Horizontal grid lines are subtle light-grey, visible but not competing with data. Legend at the bottom ("Placebo", "Low dose", "High dose") uses soft-grey text, easily readable.
      Data: Three overlapping filled area polygons — green (Placebo, peak ~625ms), lavender/purple (Low dose, peak ~550ms), and blue (High dose, peak ~470ms) — each with a bold ~3px stroke and a light (~12%) fill. First series is the brand green #009E73 as required. All three polygons return to zero at both ends, closing the shape per spec. Where fills overlap (especially the ~530-590ms zone where all three overlap) the combined colors read a bit muddy/dark but the line strokes stay distinguishable.
      Legibility verdict: PASS — all text is clearly readable against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black surface consistent with the #1A1A17 target, not pure black.
      Chrome: Title, axis titles, and tick labels all render in light/off-white tones, clearly legible against the dark background — no dark-on-dark failures observed. Grid lines are subtle light-grey at low opacity, still visible. Legend text is light-grey and readable.
      Data: Same three data colors as the light render — green, lavender/purple, blue — confirming the Imprint palette data colors are identical between themes; only the chrome (background, text, grid) flipped as required. The overlap-region muddiness is present in this render too, slightly less pronounced against the dark surface.
