review:
  strengths:
  - 'Correct frequency-polygon construction: shared bin edges (binWidth=25) computed
    once across all groups, midpoints connected in order, and each polygon explicitly
    closed to zero at both ends per the spec''s ''extend lines to zero'' requirement.'
  - 'Triple redundant encoding for the three groups: distinct Imprint palette colors
    (green/lavender/blue) AND distinct line styles (solid/dashed/dotted) — exceeds
    the style guide''s optional recommendation for n=3-4 series.'
  - Deterministic data generation via a seeded LCG (seed=42) feeding a Box-Muller
    normal sampler — no external RNG, fully reproducible.
  - 'Realistic, neutral reaction-time psychology dataset: Control/Caffeine/Sleep-deprived
    groups with plausible, distinct means and spreads (420/480/545 ms) that visibly
    differentiate the three polygon shapes.'
  - Theme tokens correctly threaded through title, legend, tick labels and axis titles;
    both light and dark renders pass the readability checklist with no dark-on-dark
    or light-on-light failures.
  - Semi-transparent fills beneath each line add visual depth while the solid line
    strokes stay on top, preserving clarity as the spec suggests.
  - 'Title exactly matches the mandated format: ''frequency-polygon-basic · javascript
    · chartjs · anyplot.ai''.'
  weaknesses:
  - 'Grid lines are drawn on both the x-axis and y-axis (visible vertical gridlines
    at every 100 ms tick in both renders); the style guide specifies y-axis-only grid
    for line/bar charts — set scales.x.grid.display: false.'
  - X-axis auto-range spans 200-900 while data (and non-zero tails) only occupy roughly
    290-815, leaving a visually empty band on the right third of the plot; consider
    a tighter min/max or suggestedMin/suggestedMax closer to the data extent.
  - 'Point markers (pointRadius: 2.5) are quite small given each polygon only has
    ~20-24 vertices; per the spec''s ''consider adding markers at data points for
    small datasets'' note, bumping to ~4-5px would make individual bin points easier
    to read.'
  - Helper functions (makeLcg, normalSamples, frequencyPolygon) add structure beyond
    the KISS 'no functions' ideal — acceptable given the Box-Muller sampling and binning
    logic genuinely need it, but noted for CQ-01.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1), not pure white — matches the required light-theme surface.
      Chrome: Title "frequency-polygon-basic · javascript · chartjs · anyplot.ai" in bold dark ink at top center, clearly legible. Legend below title with three colored point swatches (green/lavender/blue) and labels "Control", "Caffeine", "Sleep-deprived" in dark ink. X-axis title "Reaction Time (ms)" and Y-axis title "Frequency (count)" in dark ink, both readable. Tick labels in a slightly softer gray-brown, fully legible. Grid lines are subtle light-gray, visible on both axes (see weaknesses — x-axis grid should be removed per style guide).
      Data: Three overlapping frequency polygons — Control (solid green line, peak ~58 near 460ms), Caffeine (dashed lavender line, peak ~54 near 415ms, left-shifted/faster), Sleep-deprived (dotted blue line, broader/flatter shape peaking ~41 near 540ms, right-shifted/slower). Each polygon has a matching semi-transparent fill beneath it and closes to zero at both ends. Small circular markers sit at interior bin vertices; endpoints (zero points) have no marker. First series (Control) uses the mandated brand green #009E73.
      Legibility verdict: PASS — all text is clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17), not pure black — matches the required dark-theme surface.
      Chrome: Title, legend text, axis titles all render in light/off-white ink, clearly legible against the dark background. Tick labels in a softer light-gray, still fully legible — no dark-on-dark failures observed. Grid lines are subtle light lines at low opacity, visible on both axes (same x-axis grid issue as the light render).
      Data: Same three polygons (Control/Caffeine/Sleep-deprived) with identical shapes and colors as the light render — green, lavender, blue data colors are unchanged between themes, confirming only chrome (background/text/grid) flipped as required. Semi-transparent fills read a bit darker/muddier where three fills overlap (e.g. ~440-500ms band), but the solid/dashed/dotted line strokes remain clearly on top and distinguishable.
      Legibility verdict: PASS — all text is clearly readable against the dark background; brand green and the other data colors remain visible and consistent with the light render.
