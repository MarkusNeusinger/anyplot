review:
  strengths:
  - 'Correct frequency-polygon construction: shared bin edges across all three groups
    and each polygon explicitly extended to zero at both ends, exactly matching the
    spec''s notes'
  - Semi-transparent area fills (fillOpacity 0.14) under each line make the three-way
    overlap readable instead of muddy, a genuinely useful storytelling choice for
    this plot type
  - 'Imprint palette applied in canonical order (#009E73 Control, #C475FD Caffeine,
    #4467A3 Sleep-deprived), identical across both themes, with theme-correct chrome
    in both renders'
  - Deterministic LCG-based Box-Muller normal sampling with fixed per-condition seeds
    — fully reproducible without a browser RNG dependency
  - Realistic psychology-research reaction-time scenario (Control/Caffeine/Sleep-deprived)
    with plausible means, spreads, and a believable floor at 150ms
  - Title exactly matches the mandated `frequency-polygon-basic · javascript · muix
    · anyplot.ai` format, and legend labels match the series
  weaknesses:
  - All three groups are near-normal and unimodal with only mean/spread differences
    — the spec calls out skewness and modality as differences a frequency polygon
    should reveal; consider giving one group (e.g. Sleep-deprived) a right-skewed
    or mildly bimodal shape instead of pure Gaussian to demonstrate that range of
    the plot type
  - 'No markers at the bin midpoints (showMark: false) — with only 20 points per line
    this is a small dataset per the spec''s own suggestion (''Consider adding markers
    at data points for small datasets''); small circular marks would make individual
    bins easier to read without adding clutter'
  - 'Design is close to MUI X defaults: standard L-shaped axis frame, default horizontal
    grid weight/opacity not tuned down, and no typographic hierarchy beyond font-size
    bumps — some extra visual refinement (e.g. thinner/lighter grid stroke, more whitespace
    above legend) would lift it past ''well-configured default'''
  - Library usage is solid but generic — leans on area+line+colors, which any of the
    other JS libraries could replicate; consider a MUI X-distinctive touch (e.g. axis
    highlight on hover, a ReferenceLine marking each group's mean) to better showcase
    library-specific capability
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white, not dark.
      Chrome: Bold dark title top-left ("frequency-polygon-basic · javascript · muix · anyplot.ai"), dark "Reaction Time (ms)" x-axis label and "Frequency" y-axis label, dark tick labels along both axes, subtle horizontal gray gridlines, bottom-center legend with three color swatches ("Control", "Caffeine", "Sleep-deprived") in dark text. All chrome elements are clearly legible against the light background.
      Data: Three overlapping filled line series — green (#009E73, Control), lavender (#C475FD, Caffeine), blue (#4467A3, Sleep-deprived) — with semi-transparent area fills beneath each line so the overlap zones remain readable. Lines close to zero at both ends, consistent with a proper frequency polygon.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black, not light.
      Chrome: Title, axis labels, tick labels, and legend text all render in light/off-white color, clearly readable against the dark background. Gridlines are subtle light horizontal lines. No dark-on-dark text observed anywhere.
      Data: Same three series in the same green/lavender/blue hues as the light render — data colors are identical between themes, only the chrome (background, text, grid) flipped as expected.
      Legibility verdict: PASS
