review:
  strengths:
  - 'Correct frequency polygon: straight linear segments (curve: "linear") join one
    vertex per bin midpoint at the group''s count, with no smoothing, in both renders'
  - 'Every polygon closes on zero at both ends through one empty bin added on each
    side (BIN_COUNT + 2 vertices), on a frequency axis pinned to min: 0'
  - One shared set of bin edges from the pooled range (valueMin, binWidth), so the
    vertices of all three conditions sit at the same x positions
  - 'Imprint palette in canonical order (Control #009E73, Caffeine #C475FD, Sleep-deprived
    #4467A3), identical in both themes; chrome comes from the ink, inkSoft and grid
    tokens and reads correctly on #FAF8F1 and #1A1A17'
  - 'Realistic, neutral psychology-lab scenario: caffeine shifts reaction times left,
    and the sleep-deprived lapse component produces a visible second mode near 475
    ms that the polygons show clearly'
  - 'Idiomatic MUI X v9: series config with area, showMark and shape: "circle", per-chart
    CSS classes (.MuiLineChart-area/-line/-mark) for fill opacity and stroke weights,
    explicit axis band sizes, skipAnimation, and a MUI Typography title block composed
    around the chart; native hover tooltips in the HTML output'
  weaknesses:
  - 'Suggestion: the three 14 % fills mix into a grey-blue in the 300–380 ms overlap,
    which weakens the area colours; a slightly lower fill opacity would keep each
    polygon''s hue more distinct while the lines stay the main encoding.'
  - 'Suggestion: the legend at 15 px with short line-and-dot glyphs is small next
    to the 16 px axis titles; about 16 px would balance the chrome.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white, matches #FAF8F1; no white panel painted.
      Chrome: bold dark title "frequency-polygon-basic · javascript · muix · anyplot.ai" top-left (~38 % of width) with a softer grey subtitle "n = 900 across 3 groups · 18 shared bins of 24.0 ms"; y-axis title "Frequency (count per bin)" (rotated), ticks 0–80 step 10; x-axis title "Reaction time (ms)", ticks 150–600 step 50; subtle horizontal grid only; horizontal legend centred at the bottom (Control, Caffeine, Sleep-deprived). All text readable, dark on light.
      Data: three frequency polygons with straight segments and hollow circle markers at the 20 bin midpoints, each closing on the zero baseline at both ends, with a light semi-transparent fill. Control is #009E73 (peak 70 at ~308 ms), Caffeine #C475FD (peak 73 at ~284 ms, shifted left), Sleep-deprived #4467A3 (peak 51 at ~356 ms plus a second mode of 22 at ~476 ms). Lines cross clearly and stay traceable; the fills mix grey-blue where all three overlap.
