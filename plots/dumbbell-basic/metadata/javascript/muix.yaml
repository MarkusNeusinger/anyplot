review:
  strengths:
  - 'Uses the MUI X v9 composition API idiomatically: ChartsContainer with two scatter
    series, ChartsGrid, ChartsXAxis/ChartsYAxis, and a custom SVG layer that reads
    useXScale/useYScale so the connecting lines sit exactly on the data scale'
  - 'Both themes are correct: the background, ink, inkSoft and grid all come from
    ANYPLOT_TOKENS; brand green #009E73 marks the before values and lavender #C475FD
    marks the after values, identically in both renders'
  - Categories are sorted by their start value along a horizontal value axis, and
    the thin, semi-transparent connecting line (2.5 px at 0.55 opacity) keeps the
    dots dominant while staying visible on both surfaces
  - Plain signed difference labels at the right end of each row (+2.5 Operations,
    -0.2 Legal) make the size and direction of each change readable without adding
    another layer
  - The data scenario includes a reversal (Legal), a near-coincident pair and a long
    gap (Operations), so the example shows every aspect of the plot type
  - With the y-axis line and ticks turned off and only a vertical grid along the value
    axis, the chrome stays minimal
  weaknesses:
  - 'VQ-06 (both): the x-axis title reads ''Before program (satisfaction score) vs
    After program (satisfaction score)'', which repeats the measure twice and names
    the series rather than the shared axis quantity → a single title for the value
    axis such as ''Satisfaction score (0–10)''. Likely cause: X_AXIS_LABEL built as
    `${START_VALUE} vs ${END_VALUE}`.'
  - 'CQ-04 (code): lines 134–159 hand-build an HTML legend (two styled spans with
    colored circles) that MUI X''s native `<ChartsLegend />` produces from the series
    labels and colors → render ChartsLegend inside ChartsDataProvider/ChartsWrapper,
    as the library prompt describes, and delete the manual spans. Likely cause: hand-rolled
    legend instead of the composed-chart legend component.'
  - 'Suggestion: ticks every 0.2 (24 vertical gridlines) are denser than this 8-row
    chart needs; a 0.5 step would lighten the grid.'
  - 'Suggestion: add <ChartsTooltip /> to the composition so the HTML view shows hover
    values for each dot.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white, matching #FAF8F1; not pure white.
      Chrome: bold dark title "dumbbell-basic · javascript · muix · anyplot.ai" centred at the top, spanning about 36% of the width. Below it, a centred legend row: a green dot for "Before program (satisfaction score)" and a lavender dot for "After program (satisfaction score)". Department names (Design, HR, Engineering, Operations, Sales, Marketing, Legal, Finance) on the y axis in dark ink. The x axis runs 5.0–9.6 with ticks every 0.2 in inkSoft, under a bold title "Before program (satisfaction score) vs After program (satisfaction score)". Subtle vertical gridlines only. All text is readable.
      Data: 8 rows, sorted by the before value (Finance 5.4 at the bottom, Design 7.4 at the top). Green (#009E73) before dots and lavender (#C475FD) after dots are joined by a thin grey line, with signed difference labels right of each row (+0.5, -0.2, +1.6, +0.5, +2.5, +0.9, +1.3, +0.6). In the Legal row the order reverses (after 5.5 sits left of before 5.7).
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black, matching #1A1A17; not pure black.
      Chrome: title, legend text and category labels in light ink; tick labels and difference labels in a lighter grey (inkSoft); gridlines are dim but visible. No dark-on-dark text anywhere.
      Data: dot colors are identical to the light render (green before, lavender after); the connecting lines read as mid-grey and stay visible against the dark surface. Brand green is clearly visible.
      Legibility verdict: PASS
