review:
  strengths:
  - 'Composes the dumbbell from MUI X building blocks: ChartsDataProvider + ScatterPlot
    for the two dot series and a DumbbellOverlay that reads useXScale/useYScale, so
    connectors span exactly from start to end value with no dot displaced'
  - Rows sorted by the before value, horizontal layout with categories on the y axis,
    as the Notes ask
  - 'Connector is thin (2.5 px, inkSoft at 55 % opacity) so the dots dominate while
    it stays visible on both #FAF8F1 and #1A1A17'
  - Plain signed difference labels (+2.5, -0.2) right of each pair make the Legal
    decline and the Operations jump readable at a glance
  - Realistic HR scenario with a believable spread, including a reversed row (Legal)
    and a large gain (Operations)
  - 'Theme tokens threaded through every chrome element; Imprint green #009E73 and
    the second Imprint position identical in both renders'
  - skipAnimation set and the HTML output keeps MUI X's native scatter tooltips
  weaknesses:
  - 'SC-04 (both): legend entries read ''Before program (satisfaction score)'' and
    ''After program (satisfaction score)'', each repeating the ''(satisfaction score)''
    the x-axis title already states → series labels that carry only what tells them
    apart, e.g. ''Before program'' / ''After program''. Likely cause: START_VALUE
    / END_VALUE column constants used verbatim as series labels.'
  - 'Suggestion: an x-tick step of 0.5 instead of 0.2 would thin the 24 vertical grid
    lines and ticks to a calmer density.'
  - 'Suggestion: a slightly larger tick and difference-label font (about 16 px) would
    hold up better in the 400 px thumbnail.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, 3200x1800.
      Chrome: bold title "dumbbell-basic · javascript · muix · anyplot.ai" centered at top (~35 % width); horizontal legend below it (green dot "Before program (satisfaction score)", lavender dot "After program (satisfaction score)"); y-axis department names Finance…Design in dark ink, no axis line; x-axis 5.0–9.6 in 0.2 steps with bold title "Satisfaction score (0–10)"; subtle vertical grid. All text readable.
      Data: 8 rows sorted by before value (Finance 5.4 bottom → Design 7.4 top); green #009E73 start dots, lavender end dots, thin grey connectors, signed difference labels (+0.5, -0.2, +1.6, +0.5, +2.5, +0.9, +1.3, +0.6) right of each pair. Legal's after dot sits left of its before dot.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
