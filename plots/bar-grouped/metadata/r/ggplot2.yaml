review:
  strengths:
  - Correct Imprint palette in canonical order — Software=#009E73 (brand green, always-first),
    Hardware=#C475FD, Services=#4467A3 — identical across light and dark renders
  - Explicit, well-calibrated font sizes matching the style guide's DPI-based sizing
    table (title 12pt bold, axis titles 10pt, tick/legend text 8pt) — readable at
    full resolution in both themes
  - 'Fully theme-adaptive chrome — background, ink text colors, gridlines, and legend
    all correctly flip between #FAF8F1/light-ink and #1A1A17/dark-ink while data colors
    stay fixed'
  - 'Clean KISS-structured R code: single set.seed(42), tidyverse data generation
    with case_when() for realistic per-product revenue distributions, no functions/classes'
  - Mandated title format is correct and legend labels ('Software', 'Hardware', 'Services')
    match the data exactly
  - Background-colored bar edges (color = PAGE_BG) give crisp separation between adjacent
    bars in a dodge group — a nice polish touch
  weaknesses:
  - 'panel.grid.major.y uses full-strength INK color at linewidth=0.25 with no alpha
    reduction — the horizontal gridlines read as solid rather than the ''opacity 15-25%,
    very subtle'' the style guide calls for; visible clearly in both light and dark
    renders. Fix: blend INK toward PAGE_BG (or use a low-alpha rgba equivalent) so
    the grid recedes behind the bars.'
  - No visual hierarchy or storytelling device — all three product-line series carry
    equal visual weight and there is no annotation, ordering, or emphasis that guides
    the viewer to a specific insight (e.g., Central's Hardware > Software crossover).
    Consider ordering regions by total revenue, or adding a subtle callout on the
    one standout data point.
  - Library Mastery is generic — position_dodge() + scale_fill_manual() is the baseline
    grouped-bar recipe and could be replicated in any grammar-of-graphics library
    with minor syntax changes. Consider a ggplot2-distinctive touch (e.g., geom_text()
    value labels with proper vjust logic, or a facet-based small-multiple alternative)
    to demonstrate library-specific strength.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Bold black title "Revenue by Product Line · bar-grouped · r · ggplot2 · anyplot.ai" at top, clearly legible. "Region" (x-axis) and "Revenue ($M)" (y-axis, rotated) labels in dark ink, both legible with units on the y-axis. Tick labels (region names, 0/2/4/6) in softer dark-gray ink, all legible. Horizontal gridlines at y=2,4,6 are dark and fairly solid — visible but slightly heavier than an ideal "subtle" grid. Legend "Product Line" sits top-left, close to the plot, with three color swatches and labels (Software, Hardware, Services), all legible.
      Data: Three side-by-side bars per region (North, South, East, West, Central). First series (Software) is brand green #009E73, second (Hardware) is lavender #C475FD, third (Services) is blue #4467A3 — matches Imprint canonical order. Bars have a thin off-white edge matching the page background, giving clean separation between adjacent bars within a group.
      Legibility verdict: PASS — all text is clearly readable against the light background, no dark-on-light or light-on-light failures.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Title, axis labels, and tick labels render in light ink (near-white / soft light gray), fully legible against the dark background. Gridlines render as light/white horizontal lines at y=2,4,6 — visible, again slightly heavier/more solid than the "very subtle" guideline suggests, but not competing with the data. Legend text and swatches remain fully legible.
      Data: Same three colors as the light render — #009E73 (Software), #C475FD (Hardware), #4467A3 (Services) — confirmed identical, only the chrome (background/text/grid) flipped. Bar edges use the dark page-background color for the same clean-separation effect.
      Legibility verdict: PASS — no dark-on-dark failures; all title/axis/tick/legend text is clearly visible against the near-black surface.
