review:
  strengths:
  - geom_col and geom_text share position_dodge(width = 0.75), so every value label
    is centered over its own bar with no collisions, even in the near-tied Central
    6.2/6.3 pair
  - Regions ordered by descending total revenue via group_by/summarise/arrange, giving
    a meaningful ranking order (C4)
  - 'Correct Imprint order (#009E73, #C475FD, #4467A3), identical across themes, with
    theme-correct chrome and a subtle ~20% grid tint'
  - Page-colored bar outlines and a zero-anchored y expansion keep the bars crisp
    on the baseline with headroom for labels
  - Clean top-down R script with set.seed(42) and case_when()-based per-product revenue
    distributions
  weaknesses:
  - 'Suggestion: a slightly heavier value-label weight would help the 2.4 mm labels
    read better in the 400 px thumbnail.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white #FAF8F1, not pure white.
      Chrome: Bold dark title 'Revenue by Product Line · bar-grouped · r · ggplot2 · anyplot.ai' at top-left; top-left legend 'Product Line' with Software/Hardware/Services swatches; axis titles 'Region' and 'Revenue ($M)' in dark ink; tick labels 0-6 and region names in soft gray; subtle horizontal gridlines; L-shaped axis lines. All readable.
      Data: Five region clusters ordered Central, West, North, East, South (descending total), three dodged bars each: Software #009E73, Hardware #C475FD, Services #4467A3; one-decimal value labels above every bar, no collisions.
