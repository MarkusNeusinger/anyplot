review:
  strengths:
  - 'Both weaknesses from Attempt 1 are directly and correctly fixed: gridlines now
    use a baked-in ~20% alpha tint (paste0(INK, "33")) instead of solid ink, landing
    squarely in the style guide''s 15-25% subtle target'
  - Regions are now ordered by descending total revenue (region_order computed via
    group_by/summarise/arrange), turning the chart into a ranking rather than an arbitrary
    list
  - New geom_text() value labels use the same position_dodge(width = 0.75) as the
    bars, so labels stay correctly centered over their bar even though this is easy
    to get misaligned
  - Correct Imprint palette in canonical order, identical across light/dark renders;
    fully theme-adaptive chrome
  - Clean KISS-structured R code with set.seed(42) and realistic case_when()-based
    per-product revenue distributions
  weaknesses:
  - No explicit annotation or callout highlights a specific insight (e.g., Central
    being the only region where Hardware revenue exceeds Software) - the ordering
    adds hierarchy but the storytelling is still implicit rather than pointed
  - Grouped-dodge-bar-with-labels is still a fairly standard recipe; a more library-distinctive
    flourish (e.g. geom_text() color/weight varying by series total, or a subtle annotate()
    marking the top region) would push Library Mastery further
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 - not pure white, not dark.
      Chrome: Bold dark title fully legible; "Region" and "Revenue ($M)" axis titles in dark ink; tick labels in softer gray; gridlines now a subtle low-alpha tint (fixed from Attempt 1's solid-ink issue); borderless top-left legend with three swatches. All readable.
      Data: First series (Software) = #009E73 brand green, second (Hardware) = #C475FD lavender, third (Services) = #4467A3 blue - correct Imprint canonical order. Bars dodge-grouped per region, background-colored bar edges for separation, dodge-aligned value labels above each bar. Regions ordered Central > West > North > East > South by descending total revenue.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 - not pure black, not light.
      Chrome: Title, axis labels, and tick labels render in light ink, fully legible. Gridlines are faint light lines at the same subtle weight as the light render. No dark-on-dark failures observed.
      Data: Colors confirmed identical to light render (#009E73 / #C475FD / #4467A3) - only chrome flipped. Value labels remain legible in the softer ink-soft tone.
      Legibility verdict: PASS
