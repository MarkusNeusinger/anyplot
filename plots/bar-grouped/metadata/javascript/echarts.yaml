review:
  strengths:
  - 'Perfect Imprint palette compliance: brand green #009E73 first, lavender and blue
    for the remaining two groups in canonical order, identical across both themes'
  - Theme-adaptive chrome is flawless in both renders — title, legend, axis labels,
    ticks all readable with no dark-on-dark or light-on-light issues
  - 'Clean KISS code structure with deterministic in-memory data, correct mount-node
    contract (echarts.init with no explicit size/devicePixelRatio, animation: false)'
  - 'Thoughtful minimal-chrome touches: y-axis-only grid, hidden axis ticks, hidden
    y-axis line — goes slightly beyond bare defaults'
  - Legible at both full 3200x1800 resolution and scaled to 400px mobile width in
    both themes
  - Title format exactly matches the mandated 'bar-grouped · javascript · echarts
    · anyplot.ai' convention, legend labels correctly match the three product-line
    series
  weaknesses:
  - 'Design Excellence reads as a well-configured default rather than publication-ready:
    no distinctive visual treatment (e.g. subtle bar-edge highlight, rounded corners,
    gradient accent, or refined typography contrast) sets it apart from a generic
    grouped bar chart'
  - No data storytelling — every region follows the identical rank order (Electronics
    > Apparel > Home Goods) with no visual emphasis, value labels, or annotation drawing
    the eye to a specific insight (e.g. East region's Electronics peak at 510)
  - Library Mastery is generic — doesn't use any ECharts-distinctive feature (markLine/markPoint
    for a reference average, tooltip formatter customization, rich-text labels, emphasis/blur
    focus states); the chart could be reproduced in almost any charting library with
    only minor syntax changes
  - Data lacks a rank-order flip across regions — a region where Apparel or Home Goods
    outsells Electronics would better demonstrate the comparative power of a grouped
    bar chart and improve feature coverage
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "bar-grouped · javascript · echarts · anyplot.ai" centered at top in dark ink, clearly legible. Legend ("Electronics", "Apparel", "Home Goods") sits just below the title with color swatches matching the bars. Y-axis label "Revenue ($K)" (rotated) and x-axis label "Region" both present and readable. Tick labels on both axes are dark/legible against the light background. Subtle horizontal grid lines (y-axis only) are visible but not distracting. Bottom x-axis line is a thin soft-ink line; no y-axis line.
      Data: Five region categories (North, South, East, West, Central), each with 3 grouped bars — green (Electronics), lavender/purple (Apparel), blue (Home Goods). Bars are evenly spaced within each group and well-separated between groups. First series is confirmed brand green #009E73.
      Legibility verdict: PASS — all text (title, legend, axis labels, tick labels) is clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Same title, legend, and axis labels now rendered in light ink/off-white text, clearly legible against the dark background. Grid lines are still subtly visible. Axis tick labels are light-colored and readable, no dark-on-dark failures observed anywhere (title, legend, ticks, axis names all flipped correctly).
      Data: Bar colors are identical to the light render — same brand green, lavender, and blue — confirming only chrome (background/text/grid) changed between themes, not the categorical data colors.
      Legibility verdict: PASS — all text elements are clearly readable against the dark background; no dark-on-dark issues found.

    Mobile check (400px-wide thumbnails, both themes): title, legend, and axis labels remain legible at reduced scale in both light and dark variants; no elements become illegible or overlap at the smaller size.
