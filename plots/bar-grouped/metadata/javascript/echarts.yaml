review:
  strengths:
  - First-series green (#009E73) and full Imprint palette order (green, purple, blue)
    correctly applied and identical across both themes
  - markPoint (peak pin on East/Electronics) and markLine (dashed overall-average
    reference) add genuine analytical value beyond a bare grouped bar chart
  - Rounded bar corners and subtle drop shadow give the chart a polished, above-default
    look without hurting readability
  - 'Theme-adaptive chrome is fully correct in both renders: backgrounds match #FAF8F1/#1A1A17,
    all text uses ink/inkSoft tokens, no dark-on-dark or light-on-light failures'
  - 'Data tells an honest story: West region flips the usual Electronics-leads order
    (Apparel ahead), giving DQ-01 real feature coverage instead of uniform bars'
  - Clean KISS structure with deterministic in-memory data, no imports needed, correct
    mount-node/animation:false contract
  weaknesses:
  - 'markPoint label ''$510K'' is set in a fairly large bold font relative to the
    pin symbol (symbolSize: 46) — the ''$'' and ''K'' characters touch/slightly cross
    the pin''s rounded outline in both themes. Increase symbolSize to ~54-58 or drop
    label fontSize to ~11 for clean breathing room inside the pin.'
  - The West region's Electronics/Apparel rank reversal (the dataset's most interesting
    feature, per the code comment) is not visually called out to the viewer — only
    the single East peak is annotated. A second markPoint or a light annotation on
    West's Apparel bar would sharpen the data storytelling.
  - barGap/barCategoryGap are repeated identically on all three series objects — these
    are shared bar-layout options in ECharts and only need to be set once (e.g. on
    the first series); harmless but slightly redundant.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "bar-grouped · javascript · echarts · anyplot.ai" is bold dark text, centered top. Legend below title with three swatches (Electronics/green, Apparel/purple, Home Goods/blue). Y-axis "Revenue ($K)" and X-axis "Region" labels are dark and readable, tick labels use a slightly softer dark gray. Subtle horizontal gridlines on the y-axis only. A dashed reference line labeled "Avg 311K" crosses the chart. All chrome renders in dark ink against the light surface.
      Data: 5 region groups (North, South, East, West, Central) each with 3 side-by-side bars (Electronics, Apparel, Home Goods). First series (Electronics) is #009E73 green, Apparel is a purple/violet, Home Goods is a muted blue — matches Imprint categorical order. East's Electronics bar (the max, $510K) has a green pin marker with a white "$510K" label; the label text touches the pin's rounded outline slightly but stays fully legible.
      Legibility verdict: PASS (all text clearly readable; only a minor tight fit between the pin label and its own icon boundary, not a readability failure).

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title, legend, and axis labels now rendered in light/white text against the dark surface. Gridlines and the dashed average line are dimmed but still visible. No dark-on-dark text anywhere — every label, tick, and title character is clearly legible.
      Data: Bar colors are pixel-identical to the light render (green/purple/blue), confirming the palette only swaps chrome, not data colors. The peak pin and "$510K" label read the same as in light, again with the same minor label/pin-edge tightness.
      Legibility verdict: PASS (fully readable, no theme-adaptation failures).
