review:
  strengths:
  - 'Correct Imprint palette in canonical order (brand green #009E73 for Hardware,
    then lavender #C475FD and blue #4467A3) — identical data colors and theme-correct
    chrome (backgrounds, text, grid) across both light and dark renders'
  - Accurate title format and legend labels; category/group/value mapped correctly
    onto x-axis / series / bar height
  - Explicit font sizing throughout (title, axis labels, ticks, legend) with no overlap,
    no clipping, and full legibility in both themes
  - 'Idiomatic MUI X usage: band scale x-axis, categoryGapRatio for group spacing,
    horizontal-only grid, slotProps legend styling, valueFormatter for tooltip formatting,
    and sx-based slot overrides for axis/grid stroke colors'
  weaknesses:
  - Design Excellence is minimal — the chart is essentially a well-configured MUI
    X default plus correct palette; no distinctive typography, hierarchy, or visual
    polish beyond compliance (DE-01, DE-02 low)
  - No data storytelling or visual hierarchy — all three series rise every quarter
    in the same rank order (Hardware > Software > Services) with no emphasis, callout,
    or highlighted insight (DE-03 default)
  - 'Feature coverage is narrow: the three groups never change relative rank or dip,
    so the example doesn''t demonstrate the comparative-crossover scenarios grouped
    bar charts are meant to highlight (DQ-01)'
  - Whitespace is slightly imbalanced — the gap between the title and the start of
    the chart area is noticeably larger than the bottom margin, giving a top-heavy
    feel (minor VQ-05 deduction)
  image_description: |-
