review:
  strengths:
  - 'Clean grouped layout: three bars per quarter cluster share one zero baseline
    on an untruncated 0–6 axis, with categoryGapRatio 0.35 / barGapRatio 0.12 giving
    clearly wider gaps between clusters than within them'
  - 'Imprint palette in canonical order (#009E73 Hardware, #C475FD Software, #4467A3
    Services), identical across both themes; chrome flips correctly through ANYPLOT_TOKENS'
  - Native MUI X barLabel per series with in-bar ink chosen per fill color, so every
    value label reads in both themes
  - Two-level title block (mandated title plus a data-derived subtitle naming the
    Q1 and Q4 leaders) gives a clear reading entry point
  - 'Idiomatic MUI X v9 configuration: valueFormatter for tooltips, borderRadius,
    disableTicks, per-series [data-series] CSS selectors, skipAnimation, axis bands
    sized explicitly'
  - 'Data block follows the adaptable-code zones: role constants, long records, categories
    and groups from order of appearance, null for missing values'
  weaknesses:
  - 'CQ-04 (code): lines 51–58 write out the WCAG relative-luminance and contrast-ratio
    formula by hand to pick the in-bar label ink → use getContrastRatio (or getLuminance)
    from @mui/material/styles, which computes the same thing in one call per ink.
    Likely cause: hand-rolled sRGB linearization in the labelInks map.'
  - 'Suggestion: placing value labels just inside the bar top instead of at mid-height
    would put each number next to the bar end it describes.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, no white panel.
      Chrome: bold dark title "Quarterly Revenue by Product Line · bar-grouped · javascript · muix · anyplot.ai" (~55% width) with a softer subtitle "3 product lines across 4 quarters · Hardware leads Q1, Software leads Q4"; horizontal legend top-center (Hardware, Software, Services); y-axis "Revenue (million USD)" with ticks 0.0–6.0 in 0.5 steps; x-axis "Fiscal quarter" with Q1–Q4; subtle horizontal grid; all text dark and readable.
      Data: four clusters of three rounded bars from a shared zero baseline; first series Hardware in #009E73, Software lavender #C475FD, Services blue #4467A3; bold value labels at mid-bar (dark ink on green/lavender, light ink on blue), none colliding.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, subtitle, legend text, axis titles and tick labels all render in light ink; grid lines subtle dark grey but visible; no dark-on-dark text.
      Data: bar colors and value-label inks identical to the light render; brand green clearly visible.
      Legibility verdict: PASS
