review:
  strengths:
  - True grouped layout from one BarChart with three series on a band axis; categoryGapRatio
    0.35 vs barGapRatio 0.12 makes the gap between clusters clearly wider than within
    them, groups in the same order in every cluster
  - 'Shared zero baseline (min: 0), untruncated value axis to 6.0, chronological Q1-Q4
    order'
  - Imprint palette in canonical order via colors={t.palette}; chrome threaded through
    ANYPLOT_TOKENS so both themes are correct
  - Native barLabel value labels inside each bar, with a per-series ink chosen by
    WCAG contrast against the fill, readable in both themes and never colliding
  - valueFormatter on each series feeds the interactive tooltip in the HTML output
    with the same one-decimal format
  - Current MUI X v9 API throughout (slotProps.legend.sx, axis tickLabelStyle/labelStyle,
    .MuiBarChart-label with [data-series] selectors, skipAnimation)
  - Plausible, neutral scenario where groups swap rank (Software overtakes Hardware
    in Q3)
  weaknesses:
  - 'VQ-05 (both): the x-axis title "Fiscal quarter" sits about 55 px (CSS) below
    the Q1-Q4 tick labels, more than twice the y title''s distance to its ticks, so
    it reads detached from the axis and leaves an empty band at the bottom → about
    20-28 px below the tick labels (roughly −30 px). Likely cause: xAxis `height:
    64` reserving more band than the tick labels need.'
  - 'Suggestion: the legend could sit closer to the subtitle (or be left-aligned under
    it) to tighten the empty band between header and plot.'
  - 'Suggestion: the header comment still names `muix 7.29.1` while the code targets
    the v9 API.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole canvas.
      Chrome: bold dark title "Quarterly Revenue by Product Line · bar-grouped · javascript · muix · anyplot.ai" (~55 % width) with a soft-ink subtitle "3 product lines across 4 quarters · Hardware leads Q1, Software leads Q4"; centered horizontal legend above the plot; y axis "Revenue (million USD)" 0.0-6.0 in 0.5 steps, x axis "Fiscal quarter" with Q1-Q4; subtle horizontal grid. All text dark and readable.
      Data: four clusters of three rounded bars - Hardware #009E73 (first series), Software #C475FD, Services #4467A3 - from a shared zero baseline; bold value labels at mid-bar (dark ink on green/lavender, light ink on blue).
      Legibility verdict: PASS

