review:
  strengths:
  - Correct grouped column chart with 4 regions x 3 product lines, matching the spec's
    recommended 3-8 categories / 2-5 groups range
  - 'Imprint palette applied correctly: first series is brand green #009E73, and data
    colors are identical between light and dark renders'
  - Theme-adaptive chrome correctly threaded through title/axis/tick/legend/grid tokens
    — no dark-on-dark or light-on-light legibility failures in either render
  - Title exactly matches the required 'bar-grouped · javascript · highcharts · anyplot.ai'
    format
  - Deterministic, hardcoded in-memory data with no imports; simple KISS structure
    with no functions/classes
  - animation:false set on both chart and plotOptions.series per the Highcharts JS
    contract, credits watermark disabled, borderWidth:0 on columns for a clean look
  weaknesses:
  - Only 4 categories spread across the full 3200x1800 landscape canvas leaves large
    empty gaps between bar groups, making the chart read sparse — widen bars (larger
    pointWidth or smaller groupPadding) or add 1-2 more category groups to better
    fill the horizontal space
  - No x-axis title (e.g. 'Region') — the y-axis carries a units-bearing title but
    the x-axis relies solely on category labels, which is a minor axis-label asymmetry
  - 'Minimal design distinction beyond the style-guide skeleton: the groupPadding/pointPadding
    tweaks aside, there is no additional visual hierarchy, emphasis, or storytelling
    device (e.g. highlighting a standout region or product) to elevate it past a competent
    baseline implementation'
  - Value labels are omitted — optional per spec, but with only 12 bars total, dataLabels
    could have added precise comparison values without harming legibility
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Bold centered title "bar-grouped · javascript · highcharts · anyplot.ai" in dark ink; rotated y-axis title "Revenue ($M)"; light horizontal gridlines; dark x-axis category labels (North America, Europe, Asia Pacific, Latin America); legend below the chart with color swatches for Software/Hardware/Services in dark text.
      Data: Three grouped columns per category — green (#009E73, Software), light purple/violet (Hardware), and muted blue (Services). First series is confirmed brand green. Bars are clean with no borders, values range roughly 7-42 ($M).
      Legibility verdict: PASS — all title, axis, tick, and legend text is clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title now in white/light text; y-axis title and tick labels in soft light gray; subtle gridlines still visible but unobtrusive; legend text in light gray, clearly legible.
      Data: Same three bar colors as the light render (green, purple, blue) — confirmed identical data-color mapping, only chrome flipped.
      Legibility verdict: PASS — all text is clearly readable against the dark background; no dark-on-dark failures observed (title, axis labels, tick labels, and legend all use adequately light tones). Brand green remains vivid and distinguishable from the near-black background.
