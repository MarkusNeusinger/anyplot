review:
  strengths:
  - Correct grouped bar chart via the idiomatic Chart.js multi-dataset pattern (one
    dataset per group, shared category labels) — matches SC-01/SC-02 exactly.
  - 'Full Imprint palette compliance: series use canonical positions 1-3 (#009E73,
    #C475FD, #4467A3), identical across light/dark, and chrome correctly flips to
    #FAF8F1 / #1A1A17.'
  - 'Clean, deliberate chrome: x-axis grid removed, y-axis border hidden, only subtle
    horizontal gridlines remain, generous layout padding.'
  - Y-axis tick callback formats values as currency ($XXM), adding real context beyond
    the default numeric axis.
  - Realistic, plausible quarterly revenue data (3 product lines x 4 quarters) with
    sensible scale and non-monotonic variation that reads as real-world.
  - 'Mount-node contract and Chart.js gotchas followed correctly: animation:false
    set, canvas created and appended without hardcoded width/height.'
  weaknesses:
  - 'DE-01/DE-03: Styling is competent but generic — stock grouped-bar layout with
    no focal point or storytelling device. Add a data-forward touch: e.g. a subtle
    value label on the peak Q4 Software bar, a short annotation calling out the strongest
    quarter, or a light reference/average line.'
  - 'LM-02: Feature usage stays close to Chart.js basics (borderRadius, one tick callback,
    point-style legend) without showcasing a more distinctive Chart.js capability
    — e.g. per-dataset hoverBackgroundColor, custom tooltip callback, or datalabel-style
    value text via a plugin-free technique.'
  - 'VQ-01 (minor): Title fontsize (18px) fills only ~40% of the 3200px canvas width
    and reads quite small at the 400px thumbnail scale. Bump to ~20-22px for better
    presence at this large canvas size, consistent with the library skeleton''s default
    of 22px.'
  image_description: |-
