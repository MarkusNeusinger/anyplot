review:
  strengths:
  - Growth annotation ("Software +51% (Q1→Q4)") with a dashed bracket and arrowhead
    marker creates a clear visual-hierarchy focal point, directly addressing the Review-1
    storytelling gap
  - Custom hand-built rounded-top bar path generator plus per-series linearGradient
    defs and a marker-based growth-arrow are genuinely low-level SVG/D3 capabilities
    not easily replicated in a high-level charting library
  - Correct canonical Imprint palette order (green/lavender/blue for Hardware/Software/Services),
    identical across light and dark, with fully theme-correct chrome in both renders
  - Clean idiomatic D3 nested-band-scale pattern (x0 category / x1 group) with selection.data().join(),
    correct mount-node contract usage, deterministic hardcoded data
  - Well-balanced canvas utilization (~77% of the plot area), legend positioned right
    next to the plot, no overlap or clipping in either render
  weaknesses:
  - 'The per-series sheen gradients (bar-sheen-* linearGradients using brighter()/darker()
    stops) on the bars and legend swatches conflict with the style guide''s explicit
    "No chartjunk: ... gradient fills for style" rule under Minimalism — this reads
    as a decorative glossy/3D effect rather than encoding data. Recommend flattening
    bars/legend swatches to a solid Imprint fill (keep the subtle bg-colored stroke
    for bar separation) to align with the minimalism principle.'
  - The topRoundedRectPath helper function is a small deviation from the CQ-01 "no
    functions/classes" KISS-structure ideal — justified here since D3 has no built-in
    rounded-rect path primitive, but worth flattening back to inline rect marks if
    further simplification is desired.
  - Only one annotation focal point (Software's growth) is highlighted — Hardware's
    non-monotonic Q3 dip or a fuller product-line comparison story isn't otherwise
    emphasized, leaving room for DE-03 storytelling to grow further.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Bold dark title "Product Line Revenue by Quarter · bar-grouped · javascript · d3 · anyplot.ai" centered at top, clearly readable. Y-axis label "Revenue ($M)" (rotated) and x-axis label "Fiscal Quarter (2025)" both in dark ink, fully legible. Tick labels ($0M–$10M, Q1–Q4) are crisp and dark. Subtle horizontal gridlines at each $1M, y-axis only. A dashed growth-annotation bracket with an arrowhead and the text "Software +51% (Q1→Q4)" sits in the headroom above the tallest bars, clearly legible and not overlapping any bar, value label, or gridline.
      Data: Three grouped bars per quarter with subtle top-to-bottom sheen gradients — Hardware (brand green #009E73), Software (lavender), Services (blue) — each with a small dark value label above it and rounded top corners. Legend at right with matching gradient-filled rounded swatches and group names (Hardware/Software/Services). All colors match the canonical Imprint categorical order.
      Legibility verdict: PASS — all text (title, axis labels, ticks, value labels, legend, annotation) is clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Title, axis labels, tick labels, legend text, and the growth-annotation text all render in light color, clearly visible against the dark surface. Gridlines are subtle and light-on-dark, unobtrusive.
      Data: Bar colors (green/lavender/blue) and their sheen gradients are visually identical to the light render, confirming only chrome flipped. Value labels above bars are light-colored and readable both on the bars and against the dark background.
      Legibility verdict: PASS — no dark-on-dark failures observed; every text element (including the growth-annotation callout) is clearly legible, and brand green #009E73 remains vivid on the dark surface.
