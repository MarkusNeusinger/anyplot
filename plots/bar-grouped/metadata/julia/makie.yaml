review:
  strengths:
  - Correct Imprint palette applied in canonical order (Hardware=#009E73, Software=#C475FD,
    Services=#4467A3), identical data colors across both themes
  - 'Theme-adaptive chrome is fully correct in both renders: warm off-white/near-black
    backgrounds, INK/INK_SOFT text tokens, subtle 15%-alpha Y-axis-only gridlines,
    top/right spines removed'
  - Idiomatic use of Makie's `barplot!` with `dodge`/`dodge_gap`/`gap` for grouped
    bars, rather than manually offsetting x-positions
  - All font sizes explicitly set (titlesize, xlabelsize, xticklabelsize, etc.), and
    the plot remains legible when scaled down to the 400px mobile preview
  - Clean, unframed legend with a titled swatch list, correctly positioned next to
    the plot via the figure grid layout
  - Categories meaningfully ordered by descending total revenue; realistic, neutral
    business scenario (regional hardware/software/services revenue)
  weaknesses:
  - 'MUST FIX: the per-region total labels ("$85M" etc.) and the "▲ leading region"
    callout built with text!() never render in either theme — verified by pixel-level
    inspection of both plot-light.png and plot-dark.png: zero text glyphs exist above
    any bar in either render, including regions like MEA where the label position
    (~13.5 on the y-axis) sits comfortably inside the visible plot area. This is dead
    code shipped as if functional: the comment claims ''Data storytelling: per-region
    totals, leading region called out'' but delivers nothing visible. Likely cause:
    ylims!(ax, 0, maximum(revenue)+10) is called, but the effective rendered y-axis
    top empirically measures to ~44 (not the coded 52), suggesting Makie recomputed
    autolimits after the ylims! call and/or the text!() calls are not actually attaching
    to the axis/being drawn at all — check that `text!(ax, x, y; text=str, ...)` is
    valid for the installed CairoMakie/Makie version (some versions expect `text!(ax,
    x, y, text = str)` as a single call vs. keyword text= colliding with positional
    text content) and add a smoke check (print the number of plot objects on `ax.scene.plots`)
    before shipping. Either fix the rendering or remove the dead code entirely.'
  - DE-03 (Data Storytelling) currently defaults to 'data displayed, not interpreted'
    since the intended focal point/annotation never reaches the viewer — once the
    text!() bug above is fixed, this chart would gain real visual hierarchy
  - Data pattern is fully monotonic (Hardware > Software > Services in every single
    region) — introducing one region where the ranking differs would improve DQ-01
    feature coverage and make the comparison less predictable/more interesting
  - Legend swatches are plain PolyElement blocks with no stroke/edge — acceptable
    given palette contrast is already decent, but a thin edge highlight would add
    a touch more polish per the style guide's optional outline pattern
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1, not pure white.
      Chrome: Title "bar-grouped · julia · makie · anyplot.ai" in bold dark ink, centered top. X-axis "Region" and Y-axis "Revenue ($M)" labels in dark ink. Tick labels in a softer grey. Subtle horizontal gridlines at 0/10/20/30/40 (Y-axis only, ~15% opacity). Left/bottom spines visible in soft grey, top/right spines removed. Legend "Product Line" at right with three swatches (Hardware/Software/Services), no frame. All text clearly legible against the light background.
      Data: 5 region groups (N. America, Europe, Asia-Pacific, Latin America, MEA) each with 3 dodged bars. First series (Hardware) is #009E73 brand green, second (Software) is #C475FD lavender, third (Services) is #4467A3 blue. Bars decrease from N. America (tallest, ~42) down to MEA (shortest, ~12). No value labels or annotation text are visible anywhere above the bars, despite the source code containing a text!() loop intended to draw per-region revenue totals and a "▲ leading region" callout — pixel-level inspection at multiple bar-top positions (including well within the visible axis range) confirms this text never renders.
      Legibility verdict: PASS (all rendered chrome is legible; the intended annotation layer is simply absent, not illegible).

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17, not pure black.
      Chrome: Same title, same "Region"/"Revenue ($M)" labels now rendered in light ink (#F0EFE8), tick labels in a lighter soft grey. Gridlines same subtle style flipped to light-on-dark. Legend flips to light title/text, still unframed, same position.
      Data: Identical bar heights and identical data colors to the light render (#009E73 / #C475FD / #4467A3) — only the chrome flipped as expected. Same absence of any annotation text above the bars.
      Legibility verdict: PASS (no dark-on-dark or light-on-light failures; all rendered chrome is readable — the annotation layer is simply never drawn in either theme).
