review:
  strengths:
  - Correct grouped-bar structure via geom_col + position_dodge, with meaningful descending-revenue
    ordering across regions
  - Full Imprint palette compliance (green/lavender/blue identical across themes)
    and theme-correct chrome in both light and dark renders
  - All font sizes explicitly set via theme(); custom $M formatter on y-axis ticks
    improves readability
  - Realistic, neutral business dataset (regional revenue by product category) with
    plausible scale and genuine variation (e.g. Europe's Apparel nearly matches Electronics)
    instead of uniform bars
  - 'Clean KISS code: single chained ggplot pipeline, no unused imports, deterministic
    hand-authored data'
  weaknesses:
  - Y-axis title 'Revenue' lacks explicit units in the axis label itself (units only
    appear via the tick formatter '$XM') — rename to 'Revenue ($M)' for full VQ-06
    credit
  - 'Design Excellence is solid but not exceptional: aside from left-to-right revenue
    ordering, there is no additional visual emphasis (e.g. highlighting the top region/category
    or a subtle callout) to sharpen the story'
  - Library Mastery is generic grammar-of-graphics usage — the same code pattern would
    work almost unchanged in R ggplot2 or lets-plot; consider a plotnine-distinctive
    technique (e.g. geom_text value labels, facet_wrap, or after_stat) to differentiate
  - Legend is framed with a visible border box — acceptable per the library reference
    pattern, but a borderless legend would read slightly more refined (minor DE-02
    nit)
