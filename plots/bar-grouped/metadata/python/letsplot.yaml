    calling out the Q4 Electronics peak or the Home & Garden spring/summer swing the
    code comments describe, no ordering/emphasis to guide the eye toward the story
    the data actually tells.'
  - 'Design excellence is solid but not distinctive (DE-01/DE-02): the theme customization
    (removed border, single-axis grid, thin axis lines) is good baseline polish rather
