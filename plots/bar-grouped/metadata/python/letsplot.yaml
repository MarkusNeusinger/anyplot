  - 'Canonical Imprint palette used in exact canonical order (#009E73 Electronics,
    #C475FD Clothing, #4467A3 Home & Garden) — identical data colors between light
    and dark renders, only chrome flips'
  - 'Theme-adaptive chrome correctly threaded through: warm off-white #FAF8F1 / warm
    near-black #1A1A17 backgrounds, all title/axis/tick/legend text readable in both
    themes with no dark-on-dark or light-on-light failures'
  - 'Distinctive lets-plot feature genuinely used: layer_tooltips() builds rich formatted
    native hover tooltips (quarter, product, ''$X K'' revenue) rather than just relying
