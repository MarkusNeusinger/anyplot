review:
  strengths:
  - 'Correct Imprint palette in canonical order (#009E73 Electronics, #C475FD Clothing,
    #4467A3 Home & Garden), and the data colors are pixel-identical between the light
    and dark renders.'
  - Theme-adaptive chrome is threaded correctly through PAGE_BG/INK/INK_SOFT tokens
    — both renders are fully legible with no dark-on-dark or light-on-light failures.
  - 'Uses a genuinely distinctive lets-plot feature: layer_tooltips() with formatted
    native tooltips (product, quarter, ''$X K'' revenue) called out explicitly in
    the code, not just a bare default tooltip.'
  - Direct value labels above every bar (geom_text with position_dodge) satisfy the
    spec's 'value labels are optional but helpful' note and make cross-group comparison
    precise.
  - Data is realistic, neutral, and deterministic — hardcoded quarterly revenue with
    plausible per-product patterns (Electronics steady growth, Clothing Q4 seasonal
    spike, Home & Garden spring/summer peak) with no randomness to seed.
  weaknesses:
  - alpha=0.9 on the bars is an unneeded transparency choice for a grouped bar chart
    with no overlapping marks — bars would read crisper at alpha=1.
  - Value labels (geom_text size=3.2mm, ~9pt) are noticeably smaller than the axis
    tick text (10pt) — bump to ~3.6-4mm so they stay legible when the card is scaled
    down to ~400px in the catalog.
  - Design/storytelling is competent but generic — no strategic emphasis (e.g. highlighting
    the leading product or the Q4 growth) beyond the standard dodge treatment, so
    DE-01/DE-03 stayed close to baseline.
  - geom_bar has no explicit color= set, yet a thin border stroke is visible around
    each bar in both renders — confirm this is an intended anyplot-adjacent touch
    rather than an unstyled lets-plot default.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1), consistent across the full canvas including the legend panel.
      Chrome: Bold dark title "bar-grouped · python · letsplot · anyplot.ai" at top-left, fully visible and not clipped. Y-axis "Revenue ($ thousands)" and x-axis "Quarter" labels are dark, clearly readable. Tick labels ($0K-$240K, Q1-Q4) are dark grey and legible. Subtle horizontal-only gridlines. Legend panel on the right ("Product Category" with Electronics/Clothing/Home & Garden swatches) has a slightly elevated off-white background with a thin border.
      Data: First series (Electronics) is #009E73 teal, second (Clothing) is #C475FD lavender, third (Home & Garden) is #4467A3 slate blue — matches the canonical Imprint order. Grouped bars per quarter, each bar labeled with its exact "$XXXK" value in small dark-grey text above the bar.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17), consistent across the canvas and legend panel.
      Chrome: Title renders in a light cream color, fully visible. Axis titles and tick labels render in light grey/cream tones, clearly readable against the dark background — no dark-on-dark issues found. Gridlines are subtle light-grey horizontal lines, visible but not dominant. Legend panel has a dark-elevated background with light text, readable.
      Data: Same three colors as the light render (#009E73 / #C475FD / #4467A3) — confirmed pixel-identical data colors, only chrome (background, text, grid) flipped. Value labels above bars render in light grey, readable against the dark background.
      Legibility verdict: PASS
