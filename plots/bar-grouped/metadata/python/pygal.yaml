review:
  strengths:
  - Theme-adaptive Style object correctly threads PAGE_BG/INK/INK_SOFT/INK_MUTED tokens
    through both renders; title, axis labels, tick labels, and legend text are all
    legible in both light and dark themes.
  - Explicitly sets value_colors=(INK,)*len(tiers) to override pygal's default per-bar
    black/white print_values color pick, keeping data labels legible on the page background
    regardless of bar fill lightness in either theme -- a genuine library-specific
    gotcha caught and documented in a comment.
  - Imprint palette used in correct canonical order (green/purple/blue) and stays
    pixel-identical between light and dark renders -- only chrome flips.
  - 'Clean, deterministic, KISS code: hardcoded literal data, no unused imports, correct
    plot-{theme}.png/.html output pair for an interactive library.'
  - 'Full spec compliance: mandated title format, matching legend labels, chronological
    quarters, distinct colors per tier, and optional value labels on bars all present.'
  - Realistic, well-scaled SaaS quarterly revenue data across 3 tiers x 4 quarters
    that tells a clear story (Enterprise overtaking Starter and closing on Professional
    by Q4).
  weaknesses:
  - Y-axis shows only a single tick label ($0.0M at the origin) with no intermediate
    value ticks (e.g. $1M/$2M/$3M/$4M) in either render -- readers have no scale reference
    on the axis itself and must rely entirely on the printed per-bar value labels.
    Set an explicit chart.y_labels list spanning the data range (or otherwise ensure
    major y-axis labels aren't being suppressed alongside the minor ones) so the axis
    carries its own scale.
  - Y-axis grid lines (show_y_guides=True) are not clearly visible in either render
    -- they either aren't rendering or are too subtle at this resolution to help gauge
    bar heights against a scale, compounding the missing tick labels above.
  - 'Design Excellence is mostly default grouped-bar layout: color and the printed
    values carry the whole story with no deliberate visual emphasis (e.g. bolding/annotating
    the Enterprise tier''s standout growth) beyond what the raw data provides.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches the #FAF8F1 target -- not pure white.
      Chrome: Title "bar-grouped · python · pygal · anyplot.ai" in dark ink, comfortably sized and centered (~50% of canvas width). Y-axis title "Quarterly Revenue ($M)" (rotated) and x-axis title "Quarter" both in dark ink, clearly readable. X tick labels (Q1-Q4) large and dark, easily legible. Y-axis itself shows only a single "$0.0M" label at the origin -- no intermediate tick labels are visible, and no horizontal gridlines are discernible in the plot area despite show_y_guides=True. Legend at the bottom (Starter/Professional/Enterprise) with colored swatches, dark text, fully legible.
      Data: 4 quarters (Q1-Q4) x 3 grouped bars each (Starter green #009E73, Professional lavender/purple, Enterprise blue). Each bar has a printed value label ($X.XM) in dark ink above it, clearly legible against the light background, no overlap with adjacent bars or the legend.
      Legibility verdict: PASS (all visible text is readable; the only defect is the absent axis scale reference, not a legibility problem for the text that is present).

    Dark render (plot-dark.png):
      Background: Warm near-black, matches the #1A1A17 target -- not pure black.
      Chrome: Same title, axis titles, tick labels, and legend now rendered in light ink (#F0EFE8/#B8B7B0-ish), clearly readable against the dark surface. No dark-on-dark text found anywhere. Same y-axis gap as the light render: only "$0.0M" visible, no intermediate ticks or visible gridlines.
      Data: Bar colors are pixel-identical to the light render (green/purple/blue) -- confirms only chrome flipped, not data colors. Per-bar value labels are now rendered in light ink (forced via value_colors=INK), staying legible on the dark bars/background instead of defaulting to pygal's auto black/white pick.
      Legibility verdict: PASS (no dark-on-dark or light-on-light failures; same axis-scale gap as light render).
