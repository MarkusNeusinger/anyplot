      Chrome: Title "bar-grouped · python · matplotlib · anyplot.ai" in dark ink (#1A1A17), centered, ~55-60% of plot width, no clipping. X-axis label "Quarter" and y-axis label "Sales (Thousands USD)" in dark ink, clearly readable. Tick labels in soft dark gray, legible. Legend box (upper left, "Electronics" / "Clothing" / "Home & Garden") has a light elevated-cream fill with a soft border and dark text — reads clearly and does not overlap any bars. Grid: subtle horizontal lines only, low alpha, not distracting.
      Data: 4 quarters (Q1-Q4) x 3 grouped bars each. First series (Electronics) is #009E73 (Imprint green), second (Clothing) is #C475FD (purple), third (Home & Garden) is #4467A3 (blue) — correct canonical Imprint order. Each bar has a small circular marker on top and a numeric value label; the top performer per quarter has a larger marker and bold label (e.g. 245, 312, 287, 425 for Electronics in Q1-Q4).
      Legibility verdict: PASS — all text is clearly readable against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17), not pure black — matches the spec.
      Chrome: Title, axis labels, and tick labels rendered in light ink (#F0EFE8 / soft light gray) — all clearly legible against the dark background. Legend box uses a dark elevated fill (#242420) with light text and a soft border, fully readable. Grid lines are subtle and visible without dominating.
      Data: Same three colors as the light render (#009E73, #C475FD, #4467A3) — confirmed pixel-identical data palette across themes, only chrome (background/text/grid/legend) flipped. Value labels are white and clearly visible against every bar color.
      Legibility verdict: PASS — no dark-on-dark failures observed; every text element (title, axis labels, ticks, legend, value labels) is legible against the dark background.
