review:
  strengths:
  - 'Correct Imprint palette in canonical order — first series is #009E73, and data
    colors are pixel-identical between light and dark renders.'
  - 'Theme-adaptive chrome is fully correct: warm off-white/near-black backgrounds,
    readable text, subtle grid, and a styled legend box in both themes.'
  - Top-performer emphasis (bold value label + larger scatter marker on the max bar
    per quarter) adds a genuine visual-hierarchy layer beyond a bare grouped bar chart.
  - Correct 3200x1800 landscape canvas, no clipping, no text/element overlap, and
    sensible bar width and inter-group spacing for 4 categories x 3 groups.
  - Realistic, neutral business data (quarterly sales by product line) with plausible
    values and proportions, including a genuine near-tie in Q3.
  - Clean KISS code structure, deterministic hardcoded data, and correct plot-{theme}.png
    output naming.
  weaknesses:
  - Design Excellence is good but not yet publication-level — consider tightening
    whitespace/margins slightly and adding more typographic contrast between title
    and axis chrome to push past 'well-configured default plus polish'.
  - The data story (Electronics leads every quarter, with Clothing nearly catching
    up in Q3) is implied by the bold top-performer labels but never made explicit
    — a small callout/annotation or subtitle would make the insight immediately obvious
    rather than requiring the viewer to compare numbers.
  - The drop-shadow Rectangle patches (alpha=0.10, offset ~4% of bar width in x and
    ~0.8% of max_value in y) are essentially invisible in the rendered PNG — either
    increase the offset/opacity enough to read as an intentional depth effect, or
    remove the shadow code since it adds complexity for no visible payoff.
  - For a more matplotlib-idiomatic depth effect, consider `patheffects.withSimplePatchShadow()`
    instead of manually computed shadow Rectangle patches.
  image_description: |-
