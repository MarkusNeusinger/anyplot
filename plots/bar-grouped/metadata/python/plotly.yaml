review:
  strengths:
  - Correct grouped-bar layout with canonical Imprint palette order (green/lavender/blue)
    applied consistently to Desktop/Mobile/Tablet series
  - Theme-adaptive chrome is fully threaded through title, axis labels, ticks, gridlines,
    legend, and the annotation callout box across both light and dark renders
  - 'Genuine data storytelling: the annotation callout is data-driven and its "2.3×
    desktop" claim checks out mathematically (224/96 ≈ 2.33)'
  - Canvas gate passed (3200×1800), title format matches the mandated "bar-grouped
    · python · plotly · anyplot.ai" exactly
  - hovertemplate + hovermode="x unified" is a nice idiomatic touch for the HTML detail
    view
  - Value labels on every bar aid precise comparison, matching the spec's optional-but-helpful
    note
  weaknesses:
  - 'Annotation arrow crosses directly through the ''4'' digit of the ''224'' value
    label above the Social Media/Mobile bar — visible in both light and dark renders.
    Fix: adjust the annotation''s ax/ay offsets (or its target y) so the arrowhead
    terminates beside/below the value label instead of through it.'
  - 'Vertical grid lines are enabled on the x-axis (xaxis.gridcolor=GRID in the layout)
    — the style guide specifies grid should be Y-axis only for bar/line charts. Fix:
    remove gridcolor (or set showgrid=False) on the xaxis config.'
  - 'Legend uses a boxed frame (bordercolor/borderwidth) — the style guide''s Decoration
    Removal Checklist recommends removing box frames around legends by default. Fix:
    drop bordercolor/borderwidth (or set borderwidth=0) on the legend config; keep
    the annotation''s border since that one functions as a callout, not a legend.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1, not pure white.
      Chrome: Title "bar-grouped · python · plotly · anyplot.ai" centered at top in dark ink, clearly legible. X-axis title "Traffic Source" and Y-axis title "Monthly Sessions (thousands)" both dark ink, readable. Tick labels (category names, y-axis numbers) in softer gray-ink, readable. Horizontal y-axis gridlines are subtle; vertical x-axis gridlines are also present (faint lines at category boundaries), which is a style-guide deviation for a bar chart (should be y-axis only). Legend is horizontal, top-center, boxed with a thin border containing three color swatches (Desktop/Mobile/Tablet). An annotation callout box ("Social skews mobile-first — 2.3× desktop sessions") sits above the Social Media group with an arrow pointing down into the Mobile bar; the arrow line visibly crosses through the "4" of the "224" value label directly below it.
      Data: Bars grouped in triples per category (Organic Search, Direct, Social Media, Paid Search, Referral); Desktop = brand green #009E73, Mobile = lavender #C475FD, Tablet = blue #4467A3 — correct canonical Imprint order. Numeric value labels sit above each bar. All data clearly distinguishable from the cream background.
      Legibility verdict: PASS (all text readable; the one issue is a minor arrow/label collision, not a legibility failure)

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17, not pure black.
      Chrome: Title, axis titles, and tick labels flip to light ink/soft-light-gray and remain fully readable against the dark background — no dark-on-dark failures observed. Legend box, callout box, and gridlines all correctly re-themed with light-toned borders/text. Same vertical-gridline and boxed-legend deviations as the light render, and the same annotation-arrow-through-"224"-label overlap is present here too.
      Data: Bar colors are pixel-identical to the light render (green/lavender/blue) — only chrome (background, text, grid, legend/callout frame colors) changed, confirming palette consistency across themes.
      Legibility verdict: PASS (all text readable in dark theme; same minor overlap issue as light render, not a legibility failure)
