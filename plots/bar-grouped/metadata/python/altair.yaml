review:
  strengths:
  - Correct grouped-bar encoding via xOffset (idiomatic altair pattern for side-by-side
    bars), not a workaround like manual position offsetting
  - Layered composition (bars + mark_text value labels) gives precise per-bar reading
    without cluttering the chart
  - 'Genuine, non-fake interactivity: alt.selection_point bound to the legend for
    click-to-isolate filtering, using the current (non-deprecated) selection API'
  - 'Imprint palette applied correctly in canonical order with #009E73 as the first
    series; identical data colors between light and dark renders, only chrome flips'
  - 'Clean theme-adaptive chrome: subtle low-opacity gridlines, styled legend swatch
    box, no stray borders (configure_view stroke width 0)'
  - Deterministic, realistic dataset (quarterly revenue by product line) with sensible
    magnitudes and clean KISS-structured code
  weaknesses:
  - X-axis tick labels ('Q1'-'Q4') render rotated ~90 degrees despite being short
    2-character labels, wasting vertical space between the axis and the 'Quarter'
    title and forcing the reader to tilt their head; set axis=alt.Axis(..., labelAngle=0)
    on the X encoding to force horizontal labels (Vega-Lite's default rotation heuristic
    misfires here with the xOffset-grouped band scale)
  - Title occupies roughly 45-50% of the plot width at fontSize=16, on the low end
    of the expected ~50-70% range for the mandated title string -- not a deduction
    on its own, but a slightly larger fontSize (e.g. 18) would balance the composition
    better
  - 'Design excellence is solid but not exceptional: no explicit visual emphasis or
    annotation calling out the clear Q4/Software growth story beyond the raw value
    labels -- a highlighted callout or subtle color/weight emphasis on the standout
    bar would elevate the storytelling'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 -- not pure white, not dark.
      Chrome: Bold dark title "bar-grouped · python · altair · anyplot.ai" centered at top, fully legible. Y-axis title "Revenue (thousands USD)" (bold, dark) and X-axis title "Quarter" (bold, dark) both clear. Y-axis tick labels (0-180) horizontal and legible. X-axis tick labels "Q1"-"Q4" are legible but rendered rotated ~90 degrees, an unusual choice for such short labels. Horizontal gridlines are faint and unobtrusive. Legend box "Product Line" bottom-left with a light fill and thin border, swatches + labels (Software/Hardware/Services) all dark-on-light and readable.
      Data: Three bars per quarter group (Q1-Q4). First series (Software) is #009E73 green, second (Hardware) a violet/purple, third (Services) a muted blue -- matches the Imprint canonical order. Black numeric value labels sit just above each bar (120/85/45, 145/78/52, 132/92/68, 168/105/75), all clearly readable against the light background.
      Legibility verdict: PASS -- all text is dark-on-light and readable; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 -- not pure black, not light.
      Chrome: Title, axis titles, and tick labels all render in light/white text, clearly visible against the dark background. Gridlines remain faint but visible. Legend box now has a dark fill with a light border; legend text is light-colored and readable. X-axis "Q1"-"Q4" tick labels still show the same ~90-degree rotation as the light render (consistent behavior, not a theme-specific bug).
      Data: Bar colors are pixel-identical to the light render (#009E73 green, violet, blue) -- only the chrome (background, gridlines, text, legend fill) flips between themes, as required. Value labels above each bar are rendered in light-colored text and are clearly legible against the dark background.
      Legibility verdict: PASS -- no dark-on-dark failures; all title/axis/tick/legend/value-label text is clearly visible.
