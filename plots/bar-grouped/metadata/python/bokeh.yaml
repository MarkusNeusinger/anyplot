review:
  strengths:
  - Correct grouped bar chart using bokeh's nested FactorRange categorical axis (category,
    group) — idiomatic pattern for this plot type
  - Imprint palette applied in canonical order (green/lavender/blue) for the three
    product groups, identical across light and dark renders
  - Theme-adaptive chrome correctly threaded through title, axis labels, ticks, legend,
    and grid for both plot-light.png and plot-dark.png
  - Value labels on every bar plus a tasteful 'peak quarter' focal point (bold label,
    outline highlight, callout text) that adds data storytelling without becoming
    chartjunk
  - Subtle y-axis-only grid (alpha 0.12), no boxed outline, generous margins — matches
    the minimalism/whitespace guidance
  - Legend cleanly constructed with LegendItem/index against the vbar renderer, with
    an elevated background box
  weaknesses:
  - 'Title is missing the required {language} segment: currently ''Quarterly Revenue
    by Product · bar-grouped · bokeh · anyplot.ai'' but the spec format is ''{spec-id}
    · {language} · {library} · anyplot.ai'' — should read ''... · bar-grouped · python
    · bokeh · anyplot.ai'' (SC-04). One-line fix: insert ''python · '' before ''bokeh''.'
  - Leaf-level x-axis tick labels (Electronics/Clothing/Home & Garden) are fully hidden
    (major_label_text_font_size='0pt'), so bar identity relies entirely on color +
    legend — acceptable but reduces the static PNG's standalone readability; consider
    a lighter-weight alternative (smaller/rotated leaf labels) if width allows.
  - Library Mastery is solid but not maxed — the nested FactorRange grouping is the
    main distinctive-feature showcase; the interactive HTML artifact could lean further
    into bokeh-specific interactivity (e.g. HoverTool) to round out LM-02.
