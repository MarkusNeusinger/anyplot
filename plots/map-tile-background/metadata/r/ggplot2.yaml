review:
  strengths:
  - Theme-adaptive ocean and land surface colors keep the map context readable in
    both renders
  - Redundant color and size encoding of visitor counts, with the size scale's legend
    suppressed so one colorbar explains both
  - Selective labelling of the top 6 destinations with a subtitle naming the leader
    gives a clear focal point
  - 'Full theme-token chrome: no dark-on-dark or light-on-light text in either render'
  weaknesses:
  - 'SC-01 (both): the background is a hand-drawn set of 7 coarse continent polygons
    on a flat ocean fill, not tile imagery from a provider, and its outlines misplace
    cities on the coastlines (Sydney, Sao Paulo and Mumbai sit on polygon edges) ->
    a street, terrain or satellite tile background covering the whole panel. Likely
    cause: the `continents` data frame drawn with geom_polygon instead of a tile raster
    (e.g. maptiles/ggspatial annotation layer, if the runtime has it).'
  - 'SC-02 (both): no tile provider attribution anywhere on the map -> the provider''s
    attribution text (e.g. ''(c) OpenStreetMap contributors'') in a map corner. Likely
    cause: no tile layer, so nothing to attribute.'
  - 'VQ-07 (both): the visitor fill ramp is a two-stop #009E73 -> #4467A3 identical
    in both themes, not imprint_seq''s marks stops (light: #009E73 at 0, #4467A3 at
    0.338, #002850 at 1; dark: #007755 at 0, #009E73 at 0.32, #CDD9FF at 1) -> scale_fill_gradientn
    with the theme''s marks stops. Likely cause: scale_fill_gradient(low = ''#009E73'',
    high = ''#4467A3'').'
  - 'DQ-03 (code): the visitor counts mix metrics: New York''s 66.6M is total visitors
    incl. domestic (international ~13M), while London 19.1M and Singapore 19.8M are
    international arrivals, although the code comment calls all of them international
    -> one consistent measure (New York international about 13M, about -54M). Likely
    cause: the `visitors_m` vector.'
  - 'Suggestion: the Tokyo and Singapore labels sit about 9 degrees from their markers;
    a shorter offset would tie them to their points.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 page; panel is a pale blue ocean (#D3E8F5) with beige continent polygons (#E5DFC8, thin tan outline) - a hand-drawn vector basemap, no tile imagery.
      Chrome: bold dark title 'Global City Tourism . map-tile-background . r . ggplot2 . anyplot.ai' (~78% width), muted subtitle, Longitude/Latitude axis titles and ticks in #4A4A44, faint dotted grid, no caption or attribution. Colorbar 'Annual Visitors (millions)' at right on an elevated off-white box. All readable.
      Data: 12 city circles with page-colored outline, sized and filled by visitors on a #009E73 -> #4467A3 ramp; New York the largest, blue; top 6 labelled in bold dark text at 2.6 mm.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17 page; panel a dark navy ocean (#1A2835) with dark olive continents (#2D2D25).
      Chrome: title in light cream, subtitle, axis titles and ticks in light grey #B8B7B0; colorbar on #242420 with light frame and text. No dark-on-dark text.
      Data: same #009E73 -> #4467A3 fill ramp as light; markers outlined in the dark page color; labels in light ink.
      Legibility verdict: PASS
