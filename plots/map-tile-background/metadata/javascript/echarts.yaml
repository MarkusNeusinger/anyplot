review:
  strengths:
  - Honestly discloses the offline-render constraint in the subtitle ("schematic tile
    backdrop (offline render, no live tile provider)") instead of pretending a fake
    tile image is real
  - 'Idiomatic ECharts composition: a custom renderItem series draws the tile-grid
    backdrop while a separate scatter series handles the data points, with labelLayout
    hideOverlap preventing label collisions'
  - Theme-adaptive chrome is correctly wired end-to-end — tile fills, grid strokes,
    title/subtitle/label text, and backgrounds all read cleanly in both light and
    dark with no dark-on-dark or light-on-light failures
  - 'Correct Imprint palette usage (brand green #009E73 for all markers, identical
    between themes) and correct mount-node/API contract (no explicit devicePixelRatio,
    animation: false)'
  - Deterministic, realistic data (12 major US cities with plausible annual visitor
    counts) with a sensible latitude-corrected equirectangular projection as a stand-in
    for Web Mercator
  weaknesses:
  - The tile backdrop is a plain alternating checkerboard with zero geographic information
    (no coastline, state borders, or terrain shape) — it does not deliver the spec's
    core value of 'rich geographic context' for location-based analysis; consider
    baking a minimal simplified US coastline/state-border polyline (hardcoded coordinate
    array) into the custom series so the backdrop actually traces real geography even
    without live tiles
  - Spec's 'support multiple tile providers (OpenStreetMap, Stamen, CartoDB, satellite)'
    and 'include proper attribution for tile providers' are not addressed at all —
    there is only one undifferentiated grid style and no attribution/caption element
  - 'Data storytelling is flat: size encodes visitor count but there is no focal emphasis
    (e.g. highlighting the top city) to guide the viewer to the most important data
    point'
  - Visual polish is functional but generic — the alternating tile shades and thin
    grid produce a plain grid look; a touch more differentiation (e.g. subtle shading
    variation or a border treatment distinguishing 'land' vs 'water' cells) would
    elevate aesthetic sophistication
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white (~#FAF8F1) — correct anyplot light surface, not pure white.
      Chrome: title "map-tile-background · javascript · echarts · anyplot.ai" in bold dark ink, subtitle "Marker size ∝ annual visitors (millions) · schematic tile backdrop (offline render, no live tile provider)" in a lighter gray — both clearly readable against the light background. The tile-grid backdrop alternates between two very close off-white shades with a subtle 1px grid stroke; city name labels render in dark gray directly above each marker with a small gap (no overlap with the marker or with neighboring labels, verified on the dense New York/Boston and San Francisco clusters).
      Data: 12 green (#009E73) circular markers sized proportionally to annual visitor count (Miami/New York/San Francisco/Los Angeles largest, Houston/Phoenix/Denver smallest), each with a thin cream-colored border for definition against the tile backdrop.
      Legibility verdict: PASS — all text is dark-on-light, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: warm near-black (~#1A1A17) — correct anyplot dark surface, not pure black.
      Chrome: title and subtitle switch to light text (white/light-gray) and remain clearly legible; the tile-grid backdrop alternates between two very close dark-charcoal shades with the same subtle grid stroke, now in a light-toned low-opacity line; city labels render in light gray, still with clean spacing above each marker and no dark-on-dark failures.
      Data: markers are the identical #009E73 green at the identical sizes and positions as the light render — only the chrome (backgrounds, grid, text) flipped, confirming data-color consistency across themes.
      Legibility verdict: PASS — all text is light-on-dark, no dark-on-dark issues.
