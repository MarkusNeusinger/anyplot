review:
  strengths:
  - The self-intersecting coastline spike near Maine/New England from the previous
    attempt is fixed — the border polyline near Boston/New York now traces a clean,
    non-crossing path in both renders.
  - 'Land/water tile contrast is now clearly legible: ochre-tinted land cells and
    blue-tinted water cells read as a genuine schematic basemap instead of the previous
    near-invisible checkerboard.'
  - dataZoom (inside, scroll-to-zoom/drag-to-pan) is wired up on both axes, addressing
    the spec's explicit request for zoom/pan interactivity in the HTML detail view.
  - 'Clear focal point: marker size encodes annual visitors and the top-visitor city
    (New York) gets a distinct halo ring plus a bold ★-prefixed label, giving the
    map real data storytelling.'
  - 'Theme-adaptive chrome, Imprint palette (brand green #009E73 first series, identical
    across themes), and honest basemap-attribution disclosure are all correctly and
    consistently threaded through markers, tiles, coastline, and text.'
  - 'Clean, deterministic, appropriately-scoped code: point-in-polygon land classification
    and dual custom renderItem series (tile grid + coastline) are idiomatic ECharts
    without over-engineering.'
  weaknesses:
  - The amber highlight on New York's ring/label repurposes the Imprint 'amber' semantic
    anchor, which the style guide defines specifically for warning/caution roles,
    to mean 'top destination' — a positive-achievement highlight borrowed from a warning
    color reads as a semantic mismatch. Consider using the brand-green halo at higher
    opacity/thickness, or a size-only emphasis, instead of amber for a 'best of' marker.
  - 'The amber ''★ New York'' label has noticeably lower contrast against the light
    #FAF8F1 background than the plain dark-ink city labels (amber is one of the palette
    members that falls below WCAG 3:1 contrast on cream per the style guide) — still
    legible but the weakest-contrast text element in the light render.'
  - '''Support multiple tile providers'' from the spec is still only a single schematic
    style; understandable given the offline render harness cannot fetch real OSM/CartoDB/satellite
    tiles, but the schematic could still vary its visual treatment (e.g. a ''toner''-style
    vs. ''terrain''-style palette swap) to better honor the multi-provider intent,
    as suggested in the prior review round.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (~#FAF8F1), not pure white — matches spec.
      Chrome: Bold dark title "map-tile-background · javascript · echarts · anyplot.ai" centered at top, with a gray descriptive subtitle beneath it explaining the size encoding, the ★ top-destination marker, and the offline schematic backdrop disclosure. A faint blue-gray grid of tile cells forms the map backdrop: ochre-tinted cells represent land, blue-tinted cells represent water, with a thin gray US coastline/border polyline traced on top (confirmed clean near Maine/New England — no self-intersection). Small dark-ink city-name labels sit above each marker with no collisions, even in the dense New York/Boston cluster. Bottom-right attribution footnote ("Basemap attribution: offline schematic render...") is small but legible.
      Data: 12 green (#009E73) circular markers sized proportionally to annual visitor counts, each with a thin cream/pageBg border for definition. New York (the top destination) is distinguished with an amber ring and a bold amber "★ New York" label.
      Legibility verdict: PASS — all text is readable against the light background. The one soft spot is the amber "★ New York" label, which has lower contrast than the plain dark-ink labels (amber-on-cream is a known borderline-contrast combination per the style guide) but remains legible.

    Dark render (plot-dark.png):
      Background: Warm near-black (~#1A1A17), not pure black — matches spec.
      Chrome: Same title/subtitle/attribution layout, now rendered in light ink and fully legible — no dark-on-dark failures anywhere. The tile grid flips to dark brown (land) and dark blue-gray (water) cells with a light-gray coastline outline, still clearly visible against the near-black background. City labels render in light gray/white with clean spacing.
      Data: Marker colors and positions are pixel-identical to the light render (green #009E73, amber highlight for New York) — confirms only chrome adapted between themes, data colors held constant.
      Legibility verdict: PASS — all text and markers read clearly on the dark surface; the amber highlight text actually reads with better relative contrast here than on the light background.

    Cross-theme check: Data marker colors (green markers, amber highlight) are identical between the two renders; only background, grid, coastline, and text color tokens flipped, as required.
