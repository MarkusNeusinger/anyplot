review:
  strengths:
  - Marker size encodes annual visitors and the top destination gets a distinct ★
    label plus amber outline, giving the map a clear visual hierarchy and focal point.
  - Land/water classification is computed geometrically via point-in-polygon against
    a real (if simplified) US coastline polygon, rather than a static checkerboard
    — a more genuine schematic basemap.
  - Honest, well-placed basemap attribution text discloses the offline-render limitation
    instead of pretending a live tile provider was used.
  - Imprint palette and theme tokens are correctly threaded through markers, highlight
    color, coastline, and chrome in both themes — data colors are identical between
    light and dark.
  weaknesses:
  - 'Land/water tile background is nearly invisible: land cells fill with `elevatedBg`,
    which is only marginally distinct from the `pageBg` canvas, and water cells are
    fully transparent. In both renders the schematic basemap reads as a near-blank
    grid rather than a recognizable tile background — increase the land/water fill
    contrast (e.g. push land cells further from the page background, add a faint tint
    for water) so the terrain distinction the spec calls for is actually visible.'
  - 'No zoom/pan interaction is wired up. The spec''s Notes explicitly ask interactive
    libraries to ''enable zoom and pan to explore data at different scales,'' but
    the cartesian2d custom-series setup has no `dataZoom`/`roam` equivalent — add
    `dataZoom` (or move to a `geo`/coordinate system with `roam: true`) so the HTML
    detail view supports zoom/pan.'
  - The hardcoded US border/coastline polyline self-intersects near the New England
    coast (Maine → an offshore point → back inland before reaching the Great Lakes),
    producing a visible triangular spike that crosses right next to the New York and
    Boston markers in both renders — it reads as a rendering glitch rather than a
    coastline. Reorder/smooth that segment of `US_OUTLINE_LONLAT` so the path doesn't
    cross itself.
  - Spec asks for support for multiple tile providers (OpenStreetMap, Stamen, CartoDB,
    satellite); only a single schematic land/water fallback is offered. Given the
    offline render harness this is a reasonable substitute, but consider at least
    varying the schematic style (e.g. a 'satellite-like' vs 'street-like' toggle)
    to better honor the multi-provider intent.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (~#FAF8F1), consistent with the Imprint light theme, not pure white.
      Chrome: Title "map-tile-background · javascript · echarts · anyplot.ai" is bold and centered; the descriptive subtitle explains marker size, the star marker, and the offline schematic backdrop. A faded grid of ~18x10 basemap tiles sits behind a thin gray US coastline/border outline. Bottom-right attribution text ("Basemap attribution: offline schematic render...") is small but legible. All chrome (title, subtitle, city labels, attribution) is dark ink on the light background and reads clearly.
      Data: 12 green (#009E73) circular markers over US cities, sized proportionally to annual visitor counts (larger for NY/LA/SF/Miami, smaller for Phoenix/Houston). New York, the top destination, has an amber (#... amber token) ring and amber-colored bold label with a star prefix. City name labels sit above each marker without overlapping each other.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black (~#1A1A17), consistent with the Imprint dark theme, not pure black.
      Chrome: Same title/subtitle layout, now rendered in light ink (white/near-white) against the dark background — fully readable, no dark-on-dark issues. The tile grid lines and coastline outline are lighter gray, still faint but visible. Attribution text at bottom-right is legible light gray.
      Data: Identical green (#009E73) markers, identical sizes and positions to the light render — confirms data colors are unchanged between themes, only chrome (background, text, grid) adapted. New York keeps the amber ring/label, clearly visible against the dark backdrop.
      Legibility verdict: PASS

    Shared observation (both renders): the land/water tile shading is very low-contrast — land cells (filled with the "elevated" background token) are barely distinguishable from water cells (transparent), so the "tile background" mostly reads as an empty grid with a coastline line on top rather than a rich basemap. The coastline polyline also self-intersects near the New England coast, producing a small triangular spike next to the New York/Boston markers in both renders.
