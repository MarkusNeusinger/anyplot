review:
  strengths:
  - 'Handles the ''no live tile fetch'' constraint honestly: a custom Chart.js plugin
    (beforeDatasetsDraw) draws a land/sea checkerboard using a real point-in-polygon
    test against simplified European coastline/British-Isles polygons, projected through
    the chart''s own linear scales, instead of faking a raster basemap.'
  - A small caption plugin discloses the basemap is a stylized offline grid rather
    than a live tile provider — an honest substitute for the spec's attribution requirement
    given the offline render harness cannot fetch tiles.
  - Theme tokens are threaded correctly through every custom canvas draw call (land/sea
    tint alpha, grid stroke, caption text, landmark labels), so both plot-light.png
    and plot-dark.png are legible and theme-correct.
  - 'Realistic, factually grounded data: real European landmarks with plausible annual
    visitor counts (Eiffel Tower ~6.9M, Colosseum ~7.6M, etc.), bubble radius correctly
    min-max-normalized to encode the value dimension.'
  - Title fontsize is computed from the mandated title's length so the long `{Descriptive
    Title} · {spec-id} · javascript · chartjs · anyplot.ai` string fits without clipping
    or overflow.
  weaknesses:
  - Spec explicitly asks interactive libraries to 'enable zoom and pan to explore
    data at different scales', but none is implemented. The unavailable chartjs-chart-zoom
    plugin isn't required for this — native wheel/drag listeners that adjust scales.x.min/max
    and scales.y.min/max and call chart.update() would deliver real zoom/pan using
    only core Chart.js APIs.
  - Only a single basemap 'style' (one checkerboard land/sea look) is offered; the
    spec asks for support of multiple tile-provider looks (OpenStreetMap/Stamen/CartoDB/satellite).
    Even a simple palette/pattern swap keyed off a constant would better honor this,
    or the caption could more clearly frame the grid as standing in for a specific
    one of those styles.
  - The land/sea checkerboard is visually a bit mechanical/plain next to the data
    — consider a subtler coastline stroke or graduated shading near the simplified
    coastline instead of a hard two-tone checker, to lift the aesthetic polish (DE-01/DE-02)
    without adding real tile imagery.
  - The basemap caption is set to a fixed 12px — on the smaller side once the 3200x1800
    PNG is scaled down for mobile thumbnails; bumping to ~14px would keep it comfortably
    legible at reduced sizes.
  - radiusFor, pointInPolygon, and isLand are free-standing helper functions, which
    drifts from the KISS 'imports → data → plot → save, no functions' ideal — justified
    here by the geographic calculation but still worth noting.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1), matching the required light chrome — not pure white.
      Chrome: Title "European Landmark Visitors · map-tile-background · javascript · chartjs · anyplot.ai" is centered at the top, fully visible, dark ink text, appropriately sized for its length. "Longitude"/"Latitude" axis titles and degree-suffixed tick labels (e.g. "-12°", "58°") are dark and clearly readable against the light background. A small caption "Basemap: stylized tile grid (offline render, no live tile provider)" sits in the bottom-left empty Atlantic corner, legible.
      Data: All 12 landmark bubbles render in the brand green #009E73 with a light border, sized by visitor count (Colosseum and Eiffel Tower visibly larger than Anne Frank House / Neuschwanstein), each with a name label in dark ink to its right. The tile-grid basemap underneath uses a warm grayish tint for "land" tiles and a cool blue tint for "sea" tiles at low alpha, giving geographic context without imitating a real photographic tile layer.
      Legibility verdict: PASS — all title/axis/tick/caption/label text is clearly readable against the light background; no light-on-light issues observed.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17), matching the required dark chrome — not pure black.
      Chrome: Same title, now in light/near-white ink, fully readable. Axis titles and tick labels are light-colored and clearly legible against the dark background. The bottom-left caption text is light-colored and readable, no dark-on-dark issue.
      Data: The 12 bubbles are still #009E73 — identical hue to the light render — with white-ish labels next to each. Only the chrome (grid line color, land/sea tint colors, text) flipped to the dark-appropriate values; the data-encoding green is unchanged, confirming palette consistency across themes.
      Legibility verdict: PASS — no dark-on-dark text found; all chrome elements adapted correctly to the dark theme.
