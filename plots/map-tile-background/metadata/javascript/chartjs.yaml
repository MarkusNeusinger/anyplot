review:
  strengths:
  - 'Honest, well-crafted workaround for Chart.js''s lack of native tile/raster support:
    a custom beforeDatasetsDraw plugin draws a stylized land/sea tile grid with checkerboard
    shading plus a coastline overlay, giving real geographic context instead of faking
    a live tile fetch.'
  - Bubble radius correctly encodes visitor volume, with prominent 10-32px radii appropriate
    for the sparse 12-point dataset.
  - Native wheel-zoom and drag-pan are wired directly onto the linear scales without
    an uninstalled plugin, satisfying the spec's zoom/pan requirement for interactive
    libraries.
  - Theme-adaptive tile shading and coastline stroke read cleanly in both light and
    dark renders with correct contrast.
  - Landmark name labels are drawn via a dedicated afterDatasetsDraw plugin offset
    from each bubble, avoiding collisions with the basemap grid and coastline.
  weaknesses:
  - layout.padding.right is fixed at 120px to reserve legend space, but the legend
    is disabled (single series) — this leaves an oversized empty margin on the right
    edge of both renders; either shrink the right padding to ~40px or use the freed
    width for a bubble-size legend.
  - No bubble-size legend/key is drawn, so a reader cannot tell what a given circle
    size corresponds to in visitor count beyond the tooltip (interactive-only); a
    small size-key would strengthen data storytelling (DE-03).
  - 'Axis min/max (x: -12..32, y: 35..58) are hardcoded rather than computed from
    the actual landmark lat/lon extents — they happen to fit the current 12 landmarks,
    but the spec''s ''auto-fit to data bounds'' requirement would be more robust if
    derived from Math.min/max over the dataset.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1-consistent), not pure white.
      Chrome: Title "European Landmark Visitors · map-tile-background · javascript · chartjs · anyplot.ai" in dark ink at top, fully visible, not clipped. Longitude/Latitude axis titles and degree-suffixed tick labels in dark/soft-gray ink, all legible. Stylized tile grid shows tan/beige "land" tiles and pale blue-gray "sea" tiles in a checkerboard, with a gray coastline stroke tracing Western/Central Europe and the British Isles. A small caption "Basemap: stylized tile grid (offline render, no live tile provider)" sits in the bottom-left empty area, legible.
      Data: 12 green (#009E73) bubbles sized by visitor count (Colosseum and Eiffel Tower largest, Anne Frank House smallest), each with a white outline for contrast against the tiles, labeled with landmark names in dark text offset to the right of each bubble. No text/data overlaps observed.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17-consistent), not pure black.
      Chrome: Title, axis titles, and tick labels all render in light/off-white ink, clearly readable against the dark background — no dark-on-dark failures. Tile grid switches to dark olive "land" and dark navy "sea" tones with a light-gray coastline stroke, still clearly legible. Caption text remains legible in light gray.
      Data: Same 12 green (#009E73) bubbles, identical size/position/color to the light render — only chrome (tile shading, coastline, text) flipped for the theme, as required. White bubble outlines still read cleanly against the dark tiles.
      Legibility verdict: PASS
