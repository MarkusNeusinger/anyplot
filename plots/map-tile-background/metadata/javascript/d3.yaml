review:
  strengths:
  - Custom fit-bounds equirectangular projection auto-fits the marker extent and reports
    a computed zoom level, mirroring how a real tile map's fitBounds() would behave.
  - Deterministic procedural street-grid basemap (fixed-hash pseudo-noise, no Math.random)
    gives a plausible tile-map texture while respecting the offline/no-fetch runtime
    constraint.
  - imprint_seq sequential scale (green -> blue) correctly encodes daily rides, with
    identical marker hues between the light and dark renders.
  - Label collision handling combines a generic radial push with explicit manual offsets
    for the four stations that would otherwise stack in the dense central cluster.
  - Theme-adaptive chrome is threaded consistently through title, subtitle, legend,
    footnotes, and marker strokes using t.ink / t.inkSoft / t.elevatedBg tokens.
  weaknesses:
  - 'No zoom/pan interactivity: the spec explicitly requires ''enable zoom and pan''
    for interactive libraries, but no d3.zoom() behavior is wired to the map group
    anywhere in the script.'
  - The tile-provider legend draws 'Terrain'/'Satellite' as unchecked checkboxes next
    to the active 'Streets' entry, but no click handler exists anywhere in the code
    -- clicking them in the exported HTML does nothing, making the control decorative
    rather than functional.
  - 'Basemap land/park/water fills (#F1ECDD, #E7DFC9, #D9E5C9, #CDE0EC and their dark
    equivalents) are custom hex values outside the Imprint palette and the three semantic
    anchors.'
  - The dense central cluster (Passeig de Gracia / Rambla Catalunya / Placa Catalunya
    / El Born / Gotic) has labels packed tightly together -- legible at full resolution
    but at risk of compressing further when the PNG scales down to ~400px mobile width.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (~#FAF8F1), matches the required light-theme plot background; the map viewport inside the rounded frame uses a separate synthetic basemap palette (cream land blocks, pale green parks, pale blue water) that is distinct from the page background.
      Chrome: Title "Barcelona Bicing Network · map-tile-background · javascript · d3 · anyplot.ai" and subtitle are dark and fully readable; station labels use dark ink text on light halo boxes and are all legible; legend title "Daily Rides", value labels (1450/420), and provider list (Streets/Terrain/Satellite) are dark and readable; footnotes ("Auto-fit to data bounds...", "Basemap: anyplot synthetic street tiles...") are legible in muted gray.
      Data: First/only data channel (daily rides) is color-encoded via the sequential Imprint scale (#009E73 green at low values through blue at high values, matching t.seq); 14 station markers with dark ink strokes for contrast against the basemap tiles.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black (~#1A1A17), matches the required dark-theme plot background; basemap tiles inside the map viewport switch to dark equivalents (dark olive/brown land, dark green parks, dark navy water).
      Chrome: Title, subtitle, station labels, legend text, and footnotes all render in light ink tones (t.ink / t.inkSoft) and are clearly readable against the dark basemap and page background -- no dark-on-dark failures observed.
      Data: Marker colors are identical to the light render (same green-to-blue sequential scale values) -- only the chrome and basemap tones flipped, as required.
      Legibility verdict: PASS
