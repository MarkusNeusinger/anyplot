review:
  strengths:
  - Real OpenStreetMap tiles stitched at zoom 3 and placed with image! on a Web Mercator
    y axis, so the 20 city markers sit exactly at their latitude and longitude over
    a tile background covering the whole map
  - Visitor count drives both marker size and the theme's Imprint marks ramp (per-theme
    stops), with a labelled colorbar 'Annual Visitors (millions)' clear of the attribution
  - Degree tick labels with N/S/E/W suffixes at Mercator positions keep the projected
    axis readable
  - Only the eight most-visited cities are labelled, so the large markers become focal
    points without crowding
  - Attribution '© OpenStreetMap contributors' sits readable in the bottom-right map
    corner in both themes
  weaknesses:
  - 'VQ-02 (both): the ''London'' and ''Paris'' labels touch the outlines of their
    own markers (text offset 8 px from the centre, less than the marker radius of
    about 17 px) → clear the marker edge by at least 3 px. Likely cause: text! offset
    (±8, 5) not scaled by marker_sizes[i] / 2.'
  - 'Suggestion: a slightly stronger land/water contrast in the inverted dark tiles
    would give the dark render more geographic context.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white page (#FAF8F1) around the map; plot area filled with standard OpenStreetMap tiles (blue water, cream land, purple place names) from about 100°W to 175°E and 45°S to 70°N, no missing tiles.
      Chrome: bold dark title 'map-tile-background · julia · makie · anyplot.ai'; 'Longitude'/'Latitude' in dark ink; degree ticks (60°W, 0°E, 60°E, 120°E; 30°S, 0°N, 30°N, 60°N) in INK_SOFT; left and bottom spines only; colorbar 'Annual Visitors (millions)' on the right, ticks 10/20/30. All readable.
      Data: 20 city markers with page-colored outline, sized 10-38 px on the light Imprint marks ramp (#009E73 green for low values through #4467A3 to #002850 navy for Paris and London). Eight dark-ink labels; 'London' now sits west of its marker, clear of Amsterdam, but touches its own marker outline, as 'Paris' does. Attribution '© OpenStreetMap contributors' bottom right.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black page (#1A1A17); tiles inverted into dark greys (water slightly lighter than land), tile labels in grey.
      Chrome: title and axis titles near-white #F0EFE8; tick labels and colorbar ticks #B8B7B0; no dark-on-dark text.
      Data: same positions and sizes; dark stops of the marks ramp (#007755 -> #009E73 -> #CDD9FF), Paris and London pale blue, as a per-theme continuous ramp should. City labels and attribution in light ink, readable.
      Legibility verdict: PASS
