review:
  strengths:
  - Real OpenStreetMap tiles stitched at zoom 3 and placed with image! on a Web Mercator
    y axis, so the 20 city markers sit exactly on their latitude and longitude over
    a tile background covering the whole map
  - Visitor count drives both marker size and the theme's Imprint marks ramp (ANYPLOT_SEQ
    with per-theme stops), with a labelled colorbar 'Annual Visitors (millions)' placed
    clear of the attribution
  - Degree tick labels with N/S/E/W suffixes at Mercator positions keep the projected
    axis readable
  - Only the eight most-visited cities are labelled, so the large markers become the
    focal points without crowding the map
  - Attribution '© OpenStreetMap contributors' sits readable in the bottom-right corner
    of the map in both themes
  weaknesses:
  - 'VQ-02 (both): the ''London'' label runs across the Amsterdam marker at about
    4.9°E, 52.4°N, so text collides with a data mark → keep the label clear of neighbouring
    markers. Likely cause: the fixed text! offset (8, 5) with align (:left, :bottom)
    for every labelled city.'
  - 'CQ-01 (code): nine top-level helper functions (lat_to_merc, merc_to_lat, lon_to_tx,
    lat_to_ty, tx_lon_west, tx_lon_east, ty_merc_north, ty_merc_south, theme_tile)
    break the flat-script KISS rule → inline the Mercator formulas as broadcast expressions.
    Likely cause: the Web Mercator helper block and theme_tile.'
  - 'Suggestion: a slightly stronger land/water contrast in the inverted dark tiles
    would give the dark render more geographic context.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white page (#FAF8F1) around the map; the plot area is filled with standard OpenStreetMap tiles (blue water, cream land, purple place names), covering the whole frame from about 100°W to 175°E and 45°S to 70°N.
      Chrome: title "map-tile-background · julia · makie · anyplot.ai" bold dark ink at the top; "Longitude"/"Latitude" axis titles in dark ink; degree ticks (60°W, 0°E, 60°E, 120°E; 30°S, 0°N, 30°N, 60°N) in INK_SOFT; left and bottom spines only; colorbar "Annual Visitors (millions)" on the right with ticks 10/20/30. All readable.
      Data: 20 city markers with page-colored outline, sized 10–38 px and colored on the light Imprint marks ramp (#009E73 green for low values through #4467A3 to #002850 navy for Paris and London). Eight labels (London, Paris, New York, Istanbul, Dubai, Tokyo, Bangkok, Singapore) in dark ink; "London" runs across the Amsterdam marker. Attribution "© OpenStreetMap contributors" bottom right.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black page (#1A1A17); the OSM tiles are rendered with inverted lightness as dark greys (land a little lighter than water), tile labels still visible in grey.
      Chrome: title, axis titles in near-white #F0EFE8; tick labels and colorbar ticks in #B8B7B0; no dark-on-dark text anywhere.
      Data: same sizes and positions; colors follow the dark stops of the Imprint marks ramp (#007755 → #009E73 → #CDD9FF), so Paris and London glow pale blue and low values recede to dark green, as a continuous ramp should per theme. City labels and attribution in light ink, readable.
      Legibility verdict: PASS
