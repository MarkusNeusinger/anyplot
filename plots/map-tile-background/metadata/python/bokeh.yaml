review:
  strengths:
  - Esri light and dark gray canvas tiles chosen per theme, so the basemap stays quiet
    under the colored markers in both renders
  - View fitted to the data bounds with a 12% margin; every city inside the frame
  - 'Native bokeh map idioms: add_tile with WMTSTileSource, mercator axis types showing
    degrees, field transform on a ColumnDataSource'
  - HoverTool shows city, visitors and coordinates in the HTML; pan and wheel zoom
    enabled as the spec asks
  - Readable Esri attribution on an elevated plate in the bottom-right corner, clear
    of markers and color bar
  weaknesses:
  - 'VQ-07 (both): the markers colored by the imprint_seq marks ramp are drawn at
    fill_alpha 0.85, so the tile shows through and the marks no longer match the color
    bar''s colors → draw them opaque (fill_alpha 1.0, +0.15). Likely cause: p.scatter(fill_alpha=0.85).'
  - 'Suggestion: a size key (two or three reference circles) would let the marker
    size be read as a value alongside the color bar.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 page around the map frame, edges included; Esri World Light Gray tiles inside the frame covering the whole map area (Western and Central Europe, Lisbon to Warsaw, Rome to Stockholm)
      Chrome: title 'map-tile-background · python · bokeh · anyplot.ai' centered in dark ink; axis labels 'Longitude (°)' and 'Latitude (°)' and tick labels in dark ink; color bar 'Visitors (M/year)' on the elevated shade at the right with ticks 5-20; attribution 'Tiles © Esri — Esri, DeLorme, NAVTEQ' on a light plate bottom-right; all readable
      Data: 15 city markers with a white outline, size and color by visitors; the ramp runs brand green #009E73 (low: Warsaw, Copenhagen) through deep blue to dark violet (London, Paris)
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17 page, edges included; Esri World Dark Gray tiles inside the frame
