review:
  strengths:
  - Basemap follows the theme (Esri World Light Gray / Dark Gray canvas), so the gray
    tiles stay quiet under the colored markers in both renders
  - Continuous value uses the imprint_seq marks stops per theme through the style
    guide's ramp_color, sampled into a LinearColorMapper and keyed by a ColorBar naming
    'Visitors (M/year)'
  - Square canvas with Range1d padding fits the map frame tightly to the cities' extent
  - Provider attribution as a readable bokeh Label with an elevated background in
    the bottom-right map corner
  - 'Idiomatic bokeh geo stack: Web Mercator projection, add_tile with WMTSTileSource,
    mercator axis types showing degrees, field transform on a ColumnDataSource'
  - HoverTool shows city, visitors and coordinates in the HTML; pan and wheel-zoom
    enabled as the spec asks
  weaknesses:
  - 'Suggestion: a size key (two or three reference circles) would let the marker
    size be read as a value alongside the color bar.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 around a 2400x2400 square map frame; Esri World Light Gray canvas tiles (gray sea, near-white land) cover the whole frame from about -12.5° to 24.5° longitude and 37° to 62° latitude, no missing tiles.
      Chrome: title 'map-tile-background · python · bokeh · anyplot.ai' centered in dark ink; 'Longitude (°)' / 'Latitude (°)' axis labels and degree tick labels readable; color bar 'Visitors (M/year)' at right with 34pt ticks 5-20 on an elevated background; attribution 'Tiles © Esri — Esri, DeLorme, NAVTEQ' readable at 22pt in the bottom-right map corner on an elevated label box.
      Data: 15 European city circles sized and colored by visitors on the imprint_seq light marks ramp (#009E73 green for Warsaw/Copenhagen → #4467A3 → #002850 navy for London/Paris), 2 px white outlines, all inside the frame.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17 around the map; Esri World Dark Gray canvas tiles.
      Chrome: title, axis labels, tick labels, color-bar title and ticks in light ink, all readable; no dark-on-dark text; attribution in light ink, readable.
      Data: same markers and positions; the continuous ramp correctly uses the dark marks stops (#007755 → #009E73 → #CDD9FF), so London and Paris are pale blue-lavender and the rest green; white outlines visible.
      Legibility verdict: PASS
