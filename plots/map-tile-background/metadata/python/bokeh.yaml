review:
  strengths:
  - Basemap follows the theme (Esri World Light Gray / Dark Gray canvas), so the gray
    tiles stay quiet under the colored markers in both renders
  - Continuous value uses the imprint_seq marks stops per theme through the style
    guide's ramp_color, sampled into a LinearColorMapper and keyed by a ColorBar naming
    'Visitors (M/year)'
  - 'Idiomatic bokeh geo stack: Web Mercator projection, add_tile with WMTSTileSource,
    mercator axis types showing degrees, field transform on a ColumnDataSource'
  - HoverTool shows city, visitors and coordinates in the HTML; pan and wheel-zoom
    enabled as the spec asks
  - White 2 px outlines keep every marker distinct on light and dark tiles
  weaknesses:
  - 'SC-02 (both): the tile attribution in the bottom-right corner renders at about
    8 px and cannot be read (C4 asks for readable attribution text) → attribution
    about 20-24 pt in a corner, e.g. a Label or Title annotation carrying the provider
    credit. Likely cause: bokeh''s default tile attribution styling at a 3200 px canvas.'
  - 'VQ-05 (both): about a quarter of the map frame on the left is open Atlantic with
    no data while the cities span only -9° to 21° longitude → frame fitted to the
    data bounds plus a small margin (C3). Likely cause: the x range widening to the
    frame''s aspect beyond the computed padding.'
  - 'VQ-01 (both): color-bar tick labels at 24 pt and its title at 28 pt read small
    beside the 34 pt axis ticks → 34 pt labels and title (+10 pt / +6 pt). Likely
    cause: ColorBar major_label_text_font_size=''24pt'', title_text_font_size=''28pt''.'
  - 'Suggestion: a vertical map aspect (or square canvas) would trim the empty sea
    and give Scandinavia room.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 around the map frame; Esri World Light Gray canvas tiles (gray sea, near-white land) cover the whole map from -30° to 42° lon, 37° to 61° lat.
      Chrome: title 'map-tile-background · python · bokeh · anyplot.ai' centered in dark ink; 'Longitude (°)' / 'Latitude (°)' axis labels and degree tick labels readable; color bar 'Visitors (M/year)' at right with ticks 5-20, smaller than axis ticks; attribution 'Tiles © Esri — Esri, DeLorme, NAVTEQ' at bottom right at ~8 px, not readable.
      Data: 15 city circles sized and colored by visitors on the imprint_seq light marks ramp (#009E73 green for Warsaw/Copenhagen → #4467A3 → #002850 navy for London/Paris), white outlines. Left quarter of the map is empty Atlantic.
      Legibility verdict: PASS (attribution aside)

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17 around the map; Esri World Dark Gray canvas tiles.
      Chrome: title, axis labels and ticks in light ink, all readable; no dark-on-dark text; color bar ticks light gray; attribution equally tiny.
      Data: same markers; the continuous ramp uses the dark stops (#007755 → #009E73 → #CDD9FF), so London and Paris are pale lavender, the rest green; white outlines visible.
      Legibility verdict: PASS (attribution aside)
