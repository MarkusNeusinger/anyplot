review:
  strengths:
  - 'Theme-adaptive tile styles: OpenStreetMap on light, CARTO dark matter on dark,
    each with its native attribution in the bottom-right corner'
  - View fitted to the data bounds with a zoom computed from the Mercator latitude
    span, every point inside the frame
  - Markers sized and colored by annual hikers with a page-color halo, readable against
    both tile styles
  - Colorbar on an elevated surface names the variable and stays clear of the attribution
  - Native hovertemplate and zoom/pan in the HTML output
  weaknesses:
  - 'VQ-02 (both): the ''Mount Washburn'' label sits on the Jenny Lake marker, and
    the ''Bright Angel'', ''Bear Lake'', ''Delicate Arch'' and ''Angels Landing''
    labels are crossed by their own 26-28 px markers → every label clear of every
    marker. Likely cause: label side chosen only by west-east rank (rank % 2), and
    the fixed text offset does not grow with marker size.'
  - 'VQ-03 (both): the Jenny Lake and Mount Whitney labels are not drawn, so 2 of
    13 points cannot be identified and the ''Half Dome'' label between two markers
    is ambiguous → every point labelled. Likely cause: MapLibre''s symbol collision
    drops labels that collide with neighbouring labels.'
  - 'VQ-01 (both): the point labels render blurred, with soft edges unlike the crisp
    title and colorbar text → crisp label text. Likely cause: the labels are drawn
    by the map''s symbol layer, rasterised at the 800x450 layout size and upscaled
    with the tiles.'
  - 'Suggestion: Scattermap''s native cluster option could show the marker clustering
    the Notes mention for lower zoom levels in the HTML view.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 page around an OpenStreetMap tile map of the western US (ocean, state borders, city names, green park areas) covering the whole map area.
      Chrome: title 'Western US Trailheads by Annual Hikers · map-tile-background · python · plotly · anyplot.ai' centred in dark ink, about 60% of the width; colorbar 'Annual hikers (thousands)' with ticks 200/400/600 on an elevated surface at the top right; callout 'Busiest trailhead · Bright Angel · 650k hikers/yr' with a green border at the bottom left; '© OpenStreetMap contributors' at the bottom right. All readable; point labels are dark but blurred.
      Data: 13 trailhead markers, 12-28 px, colored on the Imprint sequential marks ramp from #009E73 (low) through deep blue to aubergine #351E45 (Bright Angel), with a page-color halo. Labels alternate above/below; Mount Washburn label sits on the Jenny Lake marker, Bright Angel and Bear Lake labels are crossed by their markers, Jenny Lake and Mount Whitney labels are missing.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17 page around CARTO dark matter tiles (near-black land, slate ocean, a few light place names).
      Chrome: title, colorbar title and ticks, and callout text in light ink, all readable; no dark-on-dark text. Attribution '© OpenStreetMap contributors © CARTO' in dark text on its own light-grey box at the bottom right, readable.
      Data: same markers on the dark marks stops of the ramp, olive #6F7E20 (low) through brand green #009E73 to lavender #CDD9FF (Bright Angel), as the continuous ramp's dark stops should; the same label overlaps and the same two missing labels as in light.
      Legibility verdict: PASS
