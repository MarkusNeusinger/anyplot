review:
  strengths:
  - 'Theme-adaptive tile styles: OpenStreetMap on light and CARTO Dark Matter on dark,
    each with its native provider attribution in the bottom-right corner'
  - View fitted to the data bounds with a Mercator-correct zoom computation, so all
    13 trailheads sit inside the frame
  - Page-colored halo under each marker keeps the points separated from busy tiles
    in both themes
  - SEQ_MARKS with the theme's own stops on the markers, with a matching colorbar
    on an elevated card naming the variable and its unit
  - Hover tooltips with formatted hiker counts and zoom/pan in the HTML output
  weaknesses:
  - 'VQ-02 (both): the ''Mount Washburn'' label sits on the Jenny Lake marker, and
    the ''Bright Angel'' and ''Bear Lake'' labels are crossed by their own 26-28 px
    markers, ''Delicate Arch'' and ''Angels Landing'' touch theirs → labels clear
    of every marker. Likely cause: label side chosen only by west-east rank (rank
    % 2), and the fixed text offset does not grow with marker size.'
  - 'VQ-03 (both): the Jenny Lake and Mount Whitney labels are not drawn, so 2 of
    13 points are unlabelled and the ''Half Dome'' label between two markers is ambiguous
    → every point labelled. Likely cause: MapLibre''s symbol collision drops labels
    that collide with neighbouring labels.'
  - 'VQ-01 (both): the point labels render blurred, with soft edges unlike the crisp
    title and colorbar text → crisp label text. Likely cause: the labels are drawn
    by the map''s symbol layer, rasterised with the tiles rather than as vector text.'
  - 'VQ-07 (both): SEQ_MARKS uses (0 #009E73, 0.338 #4467A3, 1 #002850) on light and
    (0 #007755, 0.32 #009E73, 1 #CDD9FF) on dark, not the style guide''s marks stops
    → (0 #009E73, 0.687 #024582, 1 #351E45) on light and (0 #6F7E20, 0.21 #009E73,
    1 #CDD9FF) on dark. Likely cause: outdated SEQ_MARKS constant.'
  - 'Suggestion: Scattermap''s native cluster option could show the marker clustering
    the Notes mention for lower zoom levels in the HTML view.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 paper around an OpenStreetMap tile area of the western US (Pacific coast to Kansas/Oklahoma), tiles complete.
      Chrome: one-line title 'Western US Trailheads by Annual Hikers · map-tile-background · python · plotly · anyplot.ai' in dark ink, about 60% of the width; colorbar card on the right titled 'Annual hikers (thousands)' with ticks 200/400/600; callout card bottom-left '★ Busiest trailhead / Bright Angel · 650k hikers/yr' with a brand-green frame; '© OpenStreetMap contributors' bottom-right. All readable.
      Data: 13 circular markers 12-28 px with a page-colored halo, colored from brand green #009E73 through blue to navy #002850. Point labels in blurred dark text alternating above and below; 11 of 13 drawn (Jenny Lake and Mount Whitney missing); 'Mount Washburn' sits on the Jenny Lake marker, 'Bright Angel' and 'Bear Lake' are crossed by their markers.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17 paper around CARTO Dark Matter tiles.
      Chrome: title, colorbar title and ticks and callout text in light ink, all readable; no dark-on-dark text. Attribution '© OpenStreetMap contributors © CARTO' in dark text on a light grey box, readable.
      Data: same markers and sizes, colored from dark green #007755 through brand green to pale blue #CDD9FF, so the busiest trailheads are the brightest. Light blurred labels, the same 11 of 13 drawn and the same label-marker collisions as the light render.
      Legibility verdict: PASS
