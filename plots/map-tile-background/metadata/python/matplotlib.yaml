review:
  strengths:
  - Theme-matched tile providers (OpenStreetMap on light, Esri Dark Gray on dark),
    each with its own correct attribution in the lower-right corner
  - Equal ground scale through ax.set_aspect(1/cos(lat)) keeps the Web Mercator tiles
    undistorted
  - imprint_seq built with the theme's marks stops, so high-traffic landmarks stand
    out in both themes (navy on light, pale blue on dark)
  - annotate() leader lines with per-label alignment keep the dense central cluster
    readable
  weaknesses:
  - 'VQ-02 (both): the ''Pantheon'' label box overlaps the top of the Roman Forum
    marker by a few px → keep the box clear of every marker. Likely cause: the Pantheon
    offset (16, -22) drops its box onto the neighbouring Roman Forum marker.'
  - 'Suggestion: a zoom of 15 would give crisper street labels in the upscaled tiles.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 page around an OpenStreetMap tile basemap of central Rome, now at equal ground scale with a wider longitude span (12.414-12.532 E)
      Chrome: title 'Rome Tourist Attractions · map-tile-background · python · matplotlib · anyplot.ai', Longitude/Latitude axis titles, degree ticks, 'Daily Visitors' colorbar — all dark text, readable
      Data: 12 outlined markers sized and colored by visitors on imprint_seq marks stops (green #009E73 low -> navy high); labels on light plates with leader lines; Piazza Navona and Castel Sant'Angelo labels lifted above the cluster; 'Pantheon' box touches the top of the Roman Forum marker; attribution '© OpenStreetMap contributors' bottom-right
      Legibility verdict: PASS

