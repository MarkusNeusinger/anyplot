      Data: 12 markers with page-colored outline, sized and colored by visitors on imprint_seq marks stops (#009E73 low -> #024582 -> #351E45 dark violet high); names on light rounded plates with leader lines; the Pantheon label sits above the Trevi marker with its leader crossing it; attribution '© OpenStreetMap contributors' bottom-right
