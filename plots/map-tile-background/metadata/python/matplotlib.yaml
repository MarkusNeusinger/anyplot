review:
  strengths:
  - Theme-matched tile providers (OpenStreetMap on light, Esri Dark Gray on dark),
    each with its own correct attribution in a plate in the lower-right corner
  - Equal ground scale through ax.set_aspect(1/cos(lat)) keeps the Web Mercator tiles
    undistorted and every marker on its coordinates
  - imprint_seq built with the style guide's marks stops for each theme, so high-traffic
    landmarks stand out (dark violet on light, pale blue on dark)
  - annotate() leader lines with per-label alignment keep most of the dense central
    cluster readable
  weaknesses:
  - 'VQ-02 (both): the ''Pantheon'' label sits directly on top of the Trevi Fountain
    marker: its leader line runs across the Trevi marker and its box touches the Trevi
    and Spanish Steps outlines, so the label reads as Trevi''s → place the Pantheon
    box where the leader does not cross another marker and the box is clear of every
    marker outline (for example below-left of the Pantheon marker, in the empty area
    west of Roman Forum). Likely cause: the Pantheon offset (10, 20) points up-right
    through the Trevi marker.'
  - 'Suggestion: a zoom of 15 would give crisper street labels in the upscaled tiles.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 page around an OpenStreetMap tile basemap of central Rome (12.414-12.532 E, 41.872-41.929 N) at equal ground scale
