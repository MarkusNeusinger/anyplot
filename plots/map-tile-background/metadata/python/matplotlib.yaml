review:
  strengths:
  - Theme-matched tile providers (OpenStreetMap on light, Esri Dark Gray on dark)
    keep each render coherent, each with its own correct attribution in the lower-right
    corner
  - imprint_seq built with the theme's marks stops, so high-traffic landmarks stand
    out in both themes (navy on light, pale blue on dark)
  - Leader lines from annotate(arrowprops=...) with per-label alignment keep the dense
    central cluster readable
  - 'Flat, deterministic script: Mercator tile indexing, stitching and imshow extent
    in a few lines'
  weaknesses:
  - 'VQ-02 (both): the ''Piazza Navona'' label box covers the lower half of the Castel
    Sant''Angelo marker → keep the box clear of every marker. Likely cause: the Piazza
    Navona offset (-16, 12) places its box over the neighbouring marker.'
  - 'SC-03 (both): the tile image is drawn with aspect=''auto'', stretching the map
    about 28 % horizontally against Web Mercator at 41.9 N → equal ground scale (data
    aspect about 1/cos(41.9 deg) = 1.34). Likely cause: imshow(aspect=''auto'') without
    ax.set_aspect.'
  - 'Suggestion: a zoom of 15 would give crisper street labels in the upscaled tiles.'
