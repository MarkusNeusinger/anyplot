review:
  strengths:
  - Explicit-value tick labels ({label, value} dicts) put every longitude/latitude
    tick at its true coordinate, so stations read off the grid correctly
  - 'Fully theme-adaptive chrome: PAGE_BG on page and plot area, INK/INK_MUTED text
    and grid; readable in both renders'
  - Semantic temperature colors (blue/green/red from Imprint) with redundant marker
    sizes for CVD safety
  - 'Per-point tooltip labels (station: temperature) in pygal''s interactive HTML'
  - View fitted to the data bounds with rounded 10°/5° tick limits and padding
  weaknesses:
  - 'SC-01, SC-02 (both): no tile background — the stations sit on a blank #FAF8F1
    / #1A1A17 plane with grid lines, so the render is a lat/lon scatter, not a map
    with street, terrain or satellite tiles (C1) → draw tile imagery from a provider
    under the markers, covering the whole plot area. Likely cause: pygal has no tile
    layer and nothing in the code fetches or embeds tile imagery (e.g. stitch OSM/CartoDB
    tiles into an image and place it as the plot background).'
  - 'SC-02 (both): no tile-provider attribution anywhere on the map (C4) → readable
    attribution text such as ''© OpenStreetMap contributors'' in a map corner, clear
    of markers and legend. Likely cause: no attribution text in the chart config.'
  - 'DQ-03 (both): Phoenix is given an annual mean of 28.5 °C and Houston 24.5 °C,
    about +4 °C and +3.5 °C above their climate normals (~24.5 °C and ~21 °C) → use
    normals (Phoenix ≈ 24.5 °C, Houston ≈ 21 °C). Likely cause: the TEMP list in the
    Data block.'
  - 'Suggestion: a legend title ''Annual mean temperature'' with short band labels
    would read more compactly than repeating ''Annual mean'' in every entry.'
