review:
  strengths:
  - Explicit-value tick labels ({label, value} dicts) put every longitude/latitude
    tick at its true coordinate, so the stations read off the grid correctly
  - 'Fully theme-adaptive chrome: PAGE_BG on both page and plot area, INK/INK_MUTED
    text and grid; readable in both renders'
  - Semantic temperature colors (blue/green/red from Imprint) with redundant marker
    sizes for CVD safety
  - 'Per-point tooltip labels (station: temperature) in pygal''s interactive HTML'
  - View fitted to the data bounds with rounded 10°/5° tick limits and padding
  weaknesses:
  - 'SC-01, SC-02 (both): no tile background — the stations sit on a blank #FAF8F1
    / #1A1A17 plane with grid lines, so the render is a lat/lon scatter, not a map
    with tiles (C1) → draw street, terrain or satellite tiles under the markers. Likely
    cause: pygal has no tile layer; nothing in the code fetches or embeds tile imagery.'
  - 'SC-02 (both): no tile-provider attribution anywhere on the map (C4) → readable
    attribution text in a map corner. Likely cause: no attribution text in the chart
    config.'
  - 'SC-04 (both): the legend bands ''Cool (< 12 °C)'' … never name the variable they
    encode (C5) → name ''Annual mean temperature'' in the legend entries or a legend
    title. Likely cause: BAND_NAMES carry only the band ranges.'
  - 'Suggestion: some annual means read warm against climate normals (Phoenix 28.5
    °C, Houston 24.5 °C); double-check the values.'
