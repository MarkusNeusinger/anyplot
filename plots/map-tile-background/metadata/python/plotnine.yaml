review:
  strengths:
  - Theme tokens threaded through title, ticks, legend text and label boxes in both
    themes
  - 'Dual encoding (colour = category in canonical Imprint order with #009E73 first,
    size = visitors) with named legends'
  - Landmark coordinates are real SF positions and coord_fixed keeps a geographic
    aspect
  weaknesses:
  - 'SC-01, SC-02 (both): the background is a 10x8 grid of flat beige/blue rectangles,
    not street, terrain or satellite imagery from a tile provider, and the tiles stop
    short of the panel frame (C1) → draw real tile imagery covering the whole map
    area (e.g. fetched tiles placed with a raster layer); if plotnine cannot do this
    natively, the spec is not feasible here. Likely cause: geom_rect tile simulation.'
  - 'SC-02, VQ-01 (both): the attribution text is about 3 pt and cannot be read at
    full size, and names no tile provider (C4) → readable provider attribution at
    about 8 pt (+5 pt), e.g. ''© OpenStreetMap contributors''. Likely cause: annotate(''text'',
    size=2.5) and its label string.'
  - 'VQ-01 (both): the three landmark label boxes use text at about 5 pt, below the
    8 pt tick labels → about 8 pt (+3 pt). Likely cause: geom_label size=3.5.'
  - 'VQ-03, SC-04 (dark): the size-legend circles are black on the #242420 legend
    panel and nearly vanish, so the visitor-size encoding cannot be read → draw them
    in INK_SOFT. Likely cause: no guides(size=guide_legend(override_aes={''color'':
    INK_SOFT})).'
  - 'SC-03 (both): the name labels are nudged 0.012–0.035° from their markers: ''Union
    Square'' floats 0.025° east over empty tiles and ''Fisherman''s Wharf'' sits beside
    the Golden Gate Bridge marker → anchor each label at its own marker. Likely cause:
    label_positions nudge_x/nudge_y.'
  - 'DQ-01, DQ-02 (both): the water tiles and the coastline polygon contradict each
    other and SF''s geography (Golden Gate Bridge and Alcatraz sit inside the land
    outline, the Bay is a block of rectangles) → geography that matches the real coastline.
    Likely cause: hand-typed coast_coords and the is_water rule.'
  - 'Suggestion: an L-shaped axis line instead of the full panel border would follow
    the library prompt''s chrome mapping.'
