review:
  strengths:
  - Interactive HTML uses geom_livemap with real CARTO Positron / Lets-Plot dark tilesets
    fitted to the data bounds via location=[...], with layer_tooltips showing station
    name and trips
  - 'Static basemap is latitude-corrected: coord_fixed(ratio=1/cos(lat)) keeps the
    map and its tile seams square on screen'
  - 'Theme-adaptive water, land and park tones with #009E73 markers and page-colored
    outlines that separate close stations in both themes'
  - Realistic, neutral bike-share scenario with plausible station coordinates across
    Manhattan, Brooklyn, Queens and Jersey City
  weaknesses:
  - 'SC-02 (both): the PNG shows a simplified land/water polygon basemap with drawn
    seams instead of imagery from a tile provider, so the static render has no street-level
    context (C1) → render real provider tiles in the PNG where the lets-plot export
    allows it. Likely cause: static branch built from geom_polygon + geom_segment
    because geom_livemap does not rasterize via ggsave.'
  - 'Suggestion: place the attribution caption at a corner of the map frame rather
    than below the legend so it reads as belonging to the basemap.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 page; square 2400x2400 canvas.
      Chrome: title 'map-tile-background · python · letsplot · anyplot.ai' in dark ink top-left; bottom legend panel (#FFFDF6) titled 'Average daily trips' with seven reference circles 600-1,800 in two rows; caption 'Simplified basemap outline, not provider tiles | HTML version: © OpenStreetMap contributors, © CARTO' in muted ink at the bottom. All readable.
      Data: simulated basemap of Lower/Midtown Manhattan with the Hudson and East River in pale blue-grey, land in warm grey, Central Park as a pale green strip, square tile seams; 26 #009E73 station markers (alpha 0.85) with page-colored outlines, sized by trips; Penn Station and Grand Central largest.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17 page.
      Chrome: title in light ink, legend panel #242420 with light title and soft-grey value labels, caption in muted light grey. No dark-on-dark text.
      Data: basemap flips to dark water, dark land and dark-green park; markers the same #009E73 with dark page-colored outlines, identical categorical color to the light render.
      Legibility verdict: PASS
