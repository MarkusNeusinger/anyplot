review:
  strengths:
  - Theme-matched CartoDB Positron / Dark Matter tiles via mark_image
  - Imprint palette in canonical order, Monument=#009E73 first
  - White marker outlines keep contrast on both tile styles
  - Tooltips and .interactive() zoom/pan in the HTML
  weaknesses:
  - 'SC-03 (both): the y scales are not reversed, so the data is flipped north-south
    against the tiles: La Rambla sits over France, the Alhambra near Gibraltar, Berlin
    at the Baltic → markers at their latitude and longitude on the tiles. Likely cause:
    alt.Scale(domain=[0, chart_height]) without reverse=True on the point, label and
    tile layers.'
  - 'SC-02 (both): C1 and C2 missed: the tile rows are stacked in reverse order (Mediterranean
    on top, Scandinavia at the bottom) with visible seams, so the markers carry no
    correct geographic context → tile rows in map order. Likely cause: tile y positions
    on a non-reversed y scale.'
  - 'VQ-05, VQ-01, SC-02 (both): C4 missed: the attribution sits at the top edge of
    the map with the upper half of its letters cut off and unreadable → full text
    in a bottom corner. Likely cause: y=chart_height-5 on a non-reversed scale puts
    it at the top.'
  - 'VQ-05 (both): the map fills about 70 % of the canvas width with empty PAGE_BG
    bands around it → fill the canvas. Likely cause: width=560, height=320 without
    autosize type="fit", padded up by PIL.'
  - 'Suggestion: a second tile style (terrain or satellite) in the HTML via a provider
    switch would show the Notes'' multi-provider support.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 page around CartoDB Positron tiles; the tile rows are stacked in reverse order (Spain and the Mediterranean at the top, Scandinavia at the bottom) with visible seams between rows.
      Chrome: title and subtitle centered and readable; Visitors and Category legends bottom-left and bottom-right in ELEVATED_BG panels; the attribution "© CartoDB Positron | © OpenStreetMap contributors" sits at the top edge of the map with the upper half of its letters cut off.
      Data: 20 white-outlined circles in Imprint order (Monument #009E73 first), sized by visitors; the points are flipped north-south and do not sit on their places (La Rambla over France, Berlin at the Baltic); labels "La Rambla" and "Notre-Dame".
      Legibility verdict: PASS except the clipped attribution

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17 page around CartoDB Dark Matter tiles, same reversed row order.
      Chrome: title, subtitle, labels and legend text in light ink, readable; no dark-on-dark text; attribution clipped at the top as in light.
      Data: categorical colors identical to the light render; white outlines visible on the dark tiles.
      Legibility verdict: PASS except the clipped attribution
