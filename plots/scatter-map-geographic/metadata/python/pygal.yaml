review:
  strengths:
  - 'Real basemap in a Robinson projection: coastlines and a graticule projected with
    the same function as the points, so every epicenter sits at its latitude and longitude
    on the map'
  - 'Basemap kept deliberately quieter than the data in both themes (COAST and GRATICULE
    tokens), while depth classes use ordered steps of the imprint_seq ramp from #009E73
    to #4467A3'
  - Size encodes magnitude and color encodes depth, with a depth legend naming its
    variable and its bins
  - 'Native pygal idioms: XY series with allow_interruptions and (x, None) pen lifts
    for the multi-ring coastline, per-point node radius and tooltip labels, x_value_formatter/value_formatter
    for hemisphere tick labels'
  - Interactive HTML output with per-event tooltips (magnitude and depth) for the
    detail view
  - 'Fully theme-adaptive chrome; all text legible on both #FAF8F1 and #1A1A17'
  weaknesses:
  - 'SC-02 (both): the size legend is a single grey square labelled ''Marker size
    = magnitude'' with no reference circles, so a reader cannot map marker size back
    to magnitude values (spec: a size legend when size varies) → show two or three
    reference markers at e.g. M6, M7, M8 drawn with the same node radius formula as
    the data. Likely cause: chart.add(''Marker size = magnitude'', []) as an empty
    placeholder series.'
  - 'CQ-01 (code): three helper functions (robinson, to_path, hemisphere) break the
    flat script structure → inline the projection as vectorized expressions and the
    tick formatting as a dict lookup. Likely cause: the projection and path building
    written as reusable helpers.'
  - 'Suggestion: drop ''Graticule'' and ''Coastlines'' from the legend so it only
    explains the data encodings.'
  - 'Suggestion: pygal draws its zero guide through the 0° meridian beyond the map
    outline at top and bottom; hiding it would give the map a cleaner frame.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, 3200x1800.
      Chrome: title "scatter-map-geographic · python · pygal · anyplot.ai" dark and centered; axis titles "Latitude" and "Longitude (Robinson projection)"; ticks 60°S–60°N and 180°W–180°E in hemisphere notation; bottom legend in three columns (Graticule, Coastlines, three depth classes, Marker size = magnitude). All text readable.
      Data: Robinson world map with grey coastlines and a light graticule; 60 earthquake epicenters clustered around Japan, the Marianas, Philippines, Indonesia, Vanuatu, New Zealand, Chile and Costa Rica; color by depth class #009E73 (<40 km), #4B8294 (40–80 km), #4467A3 (>80 km); marker size by magnitude, alpha 0.72. First series #009E73.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, axis titles, tick and legend labels in light ink, clearly readable; graticule dim but visible, coastlines mid-grey; no dark-on-dark text.
      Data: identical point positions and depth colors to the light render; only basemap tones and chrome flip. Brand green clearly visible.
      Legibility verdict: PASS
