review:
  strengths:
  - Full Natural Earth outline with theme-tokenised land, ocean, lakes, coastlines
    and borders
  - Marker outlines flip with the theme and keep overlapping clusters distinguishable
  - Hovertemplate with lat, lon, AQI and readings; native zoom and pan in the HTML
  weaknesses:
  - 'VQ-05 (both): canvas is 4800x2700, not a valid target -> 3200x1800 (-1600 x -900).
    Likely cause: write_image(width=1600, height=900, scale=3); use scale=2.'
  - 'VQ-07 (both): AQI is colored with Viridis, a forbidden colormap -> imprint_seq
    two-stop scale #009E73 -> #4467A3. Likely cause: colorscale=''Viridis''.'
  - 'SC-02, SC-04 (both): the size legend is the text ''Point Size = # Readings''
    with no reference circles and no value range, so marker size cannot be decoded
    -> 2-3 reference markers at 10, 20 and 30 readings with the same size mapping.
    Likely cause: size legend built as a plain annotation.'
  - 'DQ-03 (both): several ground air-quality sensors sit in open ocean (Atlantic
    west of Africa, Indian Ocean east of Madagascar), and comments mislabel regions
    (''China, India'' for 100-120 deg E, ''Mediterranean'' for 45-50 deg N, 10-25
    deg E) -> land positions and matching labels. Likely cause: uniform lat/lon boxes
    for Africa (-35..20, -20..55).'
  - 'CQ-04 (code): lines 25-110 repeat np.concatenate per region for latitude, longitude,
    AQI and counts in five near-identical blocks -> one region table iterated once
    (about 15 lines). Likely cause: per-variable copy of each region.'
  image_description: |-
