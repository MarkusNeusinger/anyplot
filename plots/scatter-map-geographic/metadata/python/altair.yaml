review:
  strengths:
  - 'Idiomatic Altair geo layering: alt.topo_feature basemap with mark_geoshape and
    a mark_circle layer, both in the naturalEarth1 projection'
  - Theme-tuned basemap fill and stroke keep the land quieter than the points, and
    page-coloured outlines keep stacked cities distinguishable
  - Map fills most of the canvas, legends tucked into the empty corners
  - Native tooltips (city, population, region) in the HTML output
  weaknesses:
  - 'VQ-05 (both): the canvas is 4836x2826, not a canonical size → 3200x1800 landscape
    (−1636 × −1026 px). Likely cause: .properties(width=1600, height=900) with scale_factor=3.0
    and no pad-to-target step.'
  - 'VQ-03, SC-04 (dark): the size-legend circles render near-black on the #1A1A17
    background and almost vanish, so the population key cannot be read → fill them
    with a theme token such as INK_SOFT. Likely cause: alt.Legend for size without
    symbolFillColor.'
  - 'SC-02 (both): the Notes ask interactive libraries to enable zoom and pan, and
    the HTML has no zoom or pan on the map → bind projection scale/translate to params
    or drag/wheel selections so the map can be zoomed and panned. Likely cause: no
    zoom/pan params on the layered geoshape chart.'
  - 'Suggestion: a size legend starting at 10 instead of 0 would match the 4-37 million
    data range.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, canvas 4836x2826
      Chrome: bold title at the top in dark ink; framed 'Population (millions)' size legend at bottom-left and 'Region' legend at bottom-right; all text readable
      Data: Natural Earth basemap filling most of the canvas in light beige; 56 cities as translucent circles with page-coloured outlines, Asia #009E73, Africa purple, Europe blue, North America ochre, South America red, Oceania cyan
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17
      Chrome: title and legend text in light ink, readable; the size-legend circles are near-black and almost vanish against the background
      Data: dark grey basemap; city colours identical to the light render; brand green visible
      Legibility verdict: FAIL for the size-legend glyphs (text itself readable)
