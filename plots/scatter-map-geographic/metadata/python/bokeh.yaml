review:
  strengths:
  - Theme-matched Esri Light Gray / Dark Gray Canvas basemaps keep the map quieter
    than the points in both renders
  - Elevation mapped through imprint_seq with a ColorBar titled 'Elevation (m)'
  - Size key draws reference circles at the markers' real pixel sizes, framed on the
    elevated surface in an empty ocean band
  - x/y_axis_type='mercator' gives degree tick labels on Web Mercator coordinates;
    every city sits at its true position
  - HoverTool tooltips with city, population, elevation and coordinates in the HTML
    output; pan/zoom tools enabled
  weaknesses:
  - 'CQ-01 (code): a marker_size() helper function scales population to marker diameter
    → replace it with np.interp(pop, [pop.min(), pop.max()], [MARKER_MIN, MARKER_MAX])
    used inline for the data column and the three key sizes. Likely cause: the def
    marker_size block (lines 222–225).'
  - 'Suggestion: highlight the high-elevation outliers (Mexico City, Johannesburg)
    so the color channel tells a story beyond its colorbar.'
