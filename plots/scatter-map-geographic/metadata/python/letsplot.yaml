review:
  strengths:
  - 'Canonical Imprint order with Asia #009E73 first, identical across themes; theme-correct
    chrome'
  - layer_tooltips() shows city, population and region in the HTML export
  - Separate size and color legends, each titled with its variable
  - Fully deterministic hard-coded data
  weaknesses:
  - 'VQ-05 (both): the plot fills only x = 92-3108 of the 3200 px canvas; the 92 px
    strips at the left and right edges are fully transparent instead of the page color
    → paint the full canvas in PAGE_BG (+92 px each side). Likely cause: coord_fixed(ratio=1.0)
    narrows the plot box inside ggsize(800, 450) and lets-plot leaves the rest unpainted;
    wrap it in a one-panel gggrid carrying PAGE_BG.'
  - 'SC-02 (both): the basemap is six hand-typed continent polygons of 9-21 vertices
    that follow no real coastline: Europe and Asia overlap, Japan, the British Isles,
    the Philippines and Indonesia are missing, Tokyo, London and Manila sit in open
    sea and Sydney outside the Oceania shape → a basemap of real coastlines or country
    boundaries (C1). Likely cause: the continent_outlines list instead of Natural
    Earth geometry.'
  - 'VQ-03 (dark): the size legend''s circles render dark grey (about #474747) on
    the #242420 legend box, roughly 1.6:1, and do not match the colored marks → a
    light neutral key glyph from INK_SOFT (#B8B7B0) or similar. Likely cause: scale_size
    legend keys left at lets-plot''s default grey; set guides(size=guide_legend(override_aes={''color'':
    INK_SOFT})).'
  - 'Suggestion: a thin page-colored point outline or alpha near 0.7 would keep the
    stacked Pearl River Delta cities easier to tell apart.'
  - 'Suggestion: a Robinson or Natural Earth projection, as the spec Notes name for
    world maps, would read more like a world map than the plain longitude-latitude
    grid.'
  image_description: |-
