review:
  strengths:
  - 'Real-world data: 49 of the world''s largest urban agglomerations, with accurate
    coordinates and plausible metro populations on every inhabited continent'
  - 'Imprint palette in canonical order (Asia #009E73 first) with the region order
    fixed through scale_color_manual(breaks=...), and colors identical in both renders'
  - Theme tokens threaded through every chrome element; the grid uses the GRID token
    at 15 % ink, so the basemap and grid stay quieter than the points in both themes
  - 'Native lets-plot interactivity: layer_tooltips() with a city title and population
    and region lines in the HTML export'
  - Clean, flat script with explicit imports, column-name constants and a list comprehension
    that builds the basemap frame
  weaknesses:
  - 'VQ-05 (both): the plot fills only x = 92–3108 of the 3200 px canvas; the 92 px
    strips at the left and right edges are fully transparent (alpha 0) instead of
    the page color → paint the full 3200×1800 canvas in PAGE_BG (+92 px each side).
    Likely cause: coord_fixed(ratio=1.0) over a 360°×140° extent shrinks the plot
    inside ggsize(800, 450), and lets-plot leaves the rest of the canvas unpainted.'
  - 'SC-02 (both): the basemap is six hand-typed continent polygons of 9–21 vertices
    that follow no real coastline or country boundary: the Europe and Asia outlines
    overlap from Turkey to the Urals, Japan, the British Isles, the Philippines and
    Indonesia are not drawn, so London, Tokyo, Manila and Jakarta sit on an edge or
    in open sea, and Sydney lies outside the Oceania outline → a basemap of real coastlines
    or country boundaries (spec Notes, C1). Likely cause: the continent_outlines list
    instead of real boundary geometry, such as a Natural Earth GeoDataFrame passed
    to geom_polygon(map=...) or lets-plot''s geocode_countries().get_boundaries().'
  - 'Suggestion: a thin page-colored outline on the points, or a slightly lower alpha,
    would keep the stacked Pearl River Delta cities (Guangzhou, Shenzhen, Hong Kong)
    distinguishable.'
  - 'Suggestion: a Robinson or Natural Earth projection, as the spec Notes name for
    world maps, would read more like a world map than the plain longitude–latitude
    grid.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the plot; 92 px strips at the left and right canvas edges are transparent (alpha 0)
      Chrome: title "scatter-map-geographic · python · letsplot · anyplot.ai" top left in dark ink; axis titles "Longitude (°)" and "Latitude (°)"; ticks every 50° (x, -150 to 150) and 20° (y, -60 to 80) in INK_SOFT; framed panel with a subtle grid. All text readable, nothing clipped or overlapping
      Data: 49 cities as circles sized by population (2–9) and colored by region in canonical Imprint order: Asia #009E73, S. America #C475FD, N. America #4467A3, Africa #BD8233, Europe #AE3030, Oceania #2ABCCD; alpha 0.85. Basemap: six coarse continent polygons in #FFFDF6 with thin gray outlines that only roughly resemble the continents (Europe and Asia overlap, Sydney lies outside Oceania)
      Legend: two boxed legends at the bottom: "Population (M)" with dark gray circles for 10–35, and "Region" with six colored circles in a 3×2 grid
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17; the same 92 px transparent strips at the left and right edges
      Chrome: title, axis titles and ticks in light ink (#F0EFE8 / #B8B7B0), all clearly readable; no dark-on-dark text; legend boxes in #242420
      Data: identical region colors and sizes to the light render; only chrome flipped. Basemap polygons in #242420 with #6B6A63 outlines, quieter than the points; brand green clearly visible
      Legend: size-legend circles in gray, dimmer on the dark legend box but visible; region glyphs clear
      Legibility verdict: PASS
