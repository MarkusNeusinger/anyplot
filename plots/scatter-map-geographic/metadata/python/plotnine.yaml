review:
  strengths:
  - 'Size legend glyphs themed with guides(size=guide_legend(override_aes={''color'':
    INK_SOFT})) and readable in both renders'
  - Correct canonical 3200x1800 canvas with library-baseline font sizes
  - 'Real, neutral data: 30 megacities with plausible populations, every point at
    its true latitude and longitude'
  - Region color in canonical Imprint order with Africa on brand green, identical
    across themes
  - Layered grammar with a separate data frame per layer and coord_fixed keeping degrees
    square
  weaknesses:
  - 'VQ-05 (both): the map fills only a middle band of the 3200x1800 canvas, leaving
    about 190 px above the title area and about 270 px below the x-axis title empty
    → let the panel use the height (e.g. ylim from about -58 to 78 with a slightly
    smaller xlim, or the square 6x6 canvas is not needed; reduce the dead top/bottom
    margin by ~70%). Likely cause: coord_fixed(ratio=1.0) on a 360x140 degree extent
    inside the 16:9 figure, with the right-hand legend narrowing the panel.'
  - 'SC-02 (both): the basemap is six hand-drawn coarse continent polygons with no
    coastlines or country boundaries; Cape Town, Sydney, Lima and Los Angeles sit
    in the ''sea'' outside their continent shapes → a real coastline/country basemap
    (e.g. Natural Earth admin-0 polygons via geopandas and geom_map). Likely cause:
    CONTINENT_OUTLINES constant with 9-21 vertices per continent.'
  - 'Suggestion: label the five or six largest cities with geom_text to give the map
    a focal point.'
  - 'Suggestion: draw the basemap in a projection closer to Robinson or Natural Earth
    by projecting the coordinates before plotting.'
