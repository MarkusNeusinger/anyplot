review:
  strengths:
  - Theme-adaptive earth-tone basemap kept quieter than the Imprint-colored points
    in both renders
  - Size legend uses neutral INK_MUTED proxies at quantile-derived values (10M/15M/37M),
    so it cannot be mistaken for a region
  - Data-driven Tokyo callout (idxmax) and population-scaled markers give a clear
    focal hierarchy
  - Tidy DataFrame with column constants; per-region groupby scatter in the data's
    own order
  - Exact 3200x1800 canvas with subplots_adjust instead of bbox_inches='tight'
  weaknesses:
  - 'SC-02 (both): the hand-drawn basemap misplaces coastlines so Lima (-12.0, -77.0)
    and Jakarta (-6.2, 106.8) sit in open sea, Java and Great Britain are missing,
    and the unequal degree aspect (about 2:1 latitude-to-longitude stretch) distorts
    every continent → trace the coasts closer to the real outlines (add Java, Great
    Britain, the Peruvian coast) and set ax.set_aspect(''equal'') or a projected aspect.
    Likely cause: the coarse CONTINENTS polygon list and the default ''auto'' aspect.'
  - 'Suggestion: a slightly darker basemap edge in the light theme would keep coastlines
    legible where land meets the page color.'
