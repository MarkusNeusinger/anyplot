review:
  strengths:
  - sns.scatterplot maps hue to region and size to population in one call on a DataFrame
  - Real city data with correct coordinates and plausible populations
  - 'Theme-adaptive chrome and land fill: readable in both light and dark'
  weaknesses:
  - 'VQ-05 (both): the canvas is 4748x2382, not a canonical size → 3200x1800 (-1548
    x -582). Likely cause: figsize=(16, 9) at dpi=300 with bbox_inches=''tight'' in
    savefig.'
  - 'VQ-07, SC-04 (both): North America and Europe are both drawn in #C475FD and Imprint
    position 5 is skipped, so the two regions cannot be told apart in the map or the
    legend → one Imprint color per region in canonical order. Likely cause: the hand-written
    region_colors mapping.'
  - 'SC-04 (both): the region legend shows a raw ''region'' sub-header entry under
    its ''Region'' title → only the region entries. Likely cause: handles[0:6] includes
    seaborn''s hue title handle.'
  - 'VQ-03 (both): the region legend''s swatches are tiny dots far smaller than the
    city markers they explain → swatches near the median marker size. Likely cause:
    seaborn''s legend handles reused without markersize.'
  - 'SC-02 (both): the hand-drawn basemap has no country boundaries and omits Japan,
    the UK and Indonesia, so Tokyo, London and Jakarta sit in open sea → a basemap
    whose land masses contain the mapped points. Likely cause: the six coarse WORLD_COASTLINES
    polygons.'
  - 'CQ-04 (code): the ''marker_size'' and ''color'' columns are computed but never
    used, and a sys.path workaround needs noqa E402 comments → delete them. Likely
    cause: leftovers from an earlier sizing approach.'
  image_description: |-
