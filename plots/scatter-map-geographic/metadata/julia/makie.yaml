review:
  strengths:
  - 'Continuous depth encoding uses the Imprint imprint_seq gradient (#009E73 -> #4467A3),
    the correct single-polarity colormap choice for a non-negative magnitude-like
    variable.'
  - Earthquake locations loosely follow real seismic belts (Ring of Fire, Mediterranean-Anatolian
    belt, Himalayan front, Mid-Atlantic Ridge), giving a plausible and immediately
    recognizable spatial pattern.
  - 'Clean dual encoding: marker size for magnitude, color for depth, with a separate
    neutral-colored size legend that avoids confusing the two channels.'
  - Theme-adaptive chrome is correctly threaded through title, axis labels, ticks,
    spines, grid, and legend/colorbar text; data colors are identical between light
    and dark renders.
  - Hand-digitized basemap silhouettes are a reasonable workaround for CairoMakie's
    lack of a bundled world-map dataset, and the in-code comment documents that tradeoff
    honestly.
  - 'Idiomatic Makie usage: Figure/Axis grid layout combining poly!, scatter!, Colorbar,
    and Legend in one coherent figure; single Random.seed!(42) for reproducibility;
    no fake interactivity.'
  weaknesses:
  - Spec asks for an 'appropriate map projection (e.g., Natural Earth, Robinson for
    world maps)' but the implementation plots raw longitude/latitude with DataAspect()
    (plate-carree/equirectangular) rather than any true projection -- acceptable given
    CairoMakie's lack of GeoMakie, but worth a code comment acknowledging the simplification
    since it's a named spec requirement.
  - Dark-render basemap fill LAND_FILL=#242017 is nearly the same luminance as PAGE_BG=#1A1A17
    (RGB deltas of only ~10/6/0) -- continents are legible mainly via the stroke outline
    rather than the fill, so the basemap nearly disappears into the background at
    a glance. Increase the dark-theme land fill to a more clearly distinct warm-dark
    tone (e.g. lighten it further from the page background) while staying subtle.
  - Legend panel background (ELEVATED_BG) has very low contrast against PAGE_BG in
    both themes, so the 'Magnitude' legend reads as floating text rather than a clearly
    separated panel, especially at thumbnail/mobile scale.
  - Continent outlines are very abstracted (Eurasia in particular is a single blob
    without the Indian, Arabian, or Scandinavian peninsulas) -- a few more hand-digitized
    vertices at these landmarks would make the basemap read more convincingly as real
    geography without needing a real dataset.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 -- not pure white.
      Chrome: Title "scatter-map-geographic · julia · makie · anyplot.ai" in bold dark ink at top-center, clearly legible. "Longitude (°)" / "Latitude (°)" axis labels in dark ink, tick labels in a softer gray, all readable. Subtle light-gray gridlines at 60°/20° intervals. Colorbar on the right labeled "Depth (km)" with readable ticks 0-700. "Magnitude" size legend bottom-left (M 4.5 / M 6.0 / M 7.5) in a very-low-contrast off-white panel, text still readable.
      Data: Simplified beige continent silhouettes (North America, South America, Africa, Eurasia, Australia) with thin dark stroke outlines. Earthquake points cluster along recognizable seismic belts (west coast of the Americas, Japan/Indonesia, the Mediterranean-Himalayan belt, the Mid-Atlantic Ridge). Points are colored on a green-to-blue continuous scale (depth) and sized by magnitude, mostly shallow/green with a handful of deeper blue points near Indonesia/Tonga. First-color end of the continuous scale is the brand green #009E73.
      Legibility verdict: PASS (all text is clearly readable; the legend panel's low fill contrast doesn't hurt text legibility, just visual separation).

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 -- not pure black.
      Chrome: Same title now rendered in light/off-white ink, clearly legible against the dark background. Axis labels and tick labels are light gray, all readable, no dark-on-dark failures. Grid lines are subtle light lines at low opacity. Colorbar and its "Depth (km)" label are light-colored and legible. "Magnitude" legend text is light-colored and readable, though its panel background is barely distinguishable from the page background.
      Data: Same continent silhouettes, now filled with a very dark brown (#242017) that is only marginally lighter than the #1A1A17 page background -- the landmasses are legible mostly through their light stroke outlines rather than the fill itself, which is the weakest point of this render. Earthquake point colors are identical to the light render (confirmed: same green-to-blue continuous scale, same brand green anchor), only the chrome (background, text, land fill) has flipped for the theme.
      Legibility verdict: PASS for all text; land-fill contrast is a genuine but non-text weakness worth flagging for repair.
