review:
  strengths:
  - 'Depth is colored with imprint_seq (scale_color_gradient #009E73 -> #4467A3),
    identical in both themes'
  - Size legend glyphs are made visible on both backgrounds with guide_legend(override.aes
    = list(colour = INK_SOFT))
  - Theme tokens threaded through every chrome element; all text readable in light
    and dark renders
  - Every point sits at its true longitude/latitude with alpha 0.75 handling the co-located
    epicenters
  weaknesses:
  - 'SC-02 (both): no basemap — points float on a plain longitude/latitude grid with
    no country boundaries or coastlines, and the equirectangular coord_fixed(1.3)
    is no map projection → draw a world basemap (e.g. geom_polygon(data = map_data("world"),
    aes(long, lat, group = group)) in a quiet fill/outline below the points) in a
    projection such as coord_sf(crs = "+proj=robin") or coord_quickmap(). Likely cause:
    the implementation omits any basemap layer and uses coord_fixed.'
  - 'VQ-05 (both): coord_fixed(ratio = 1.3) squeezes the panel into a horizontal band,
    leaving about a quarter of the canvas empty above the title and below the x-axis
    → let the map fill the 3200x1800 canvas (a world map at ~2:1 fits once a projection
    replaces the fixed ratio). Likely cause: coord_fixed(ratio = 1.3) with an 8x4.5
    in canvas.'
  - 'CQ-03 (code): library(dplyr) is loaded but never used — tibble::tibble is called
    by namespace → remove library(dplyr). Likely cause: template import list.'
  - 'CQ-04 (code): the IMPRINT vector (lines 19-20) is defined and never used → delete
    it. Likely cause: template palette block left in.'
  - 'Suggestion: degree units on the axis titles (Longitude (°), Latitude (°)) would
    read more precisely.'
