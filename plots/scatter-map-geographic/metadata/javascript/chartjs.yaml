review:
  strengths:
  - 'Geophysically-grounded synthetic data: shallow thrust events near the trench
    and progressively deeper Wadati-Benioff events inland, generated via a deterministic
    seeded LCG + rejection-sampled Gaussian (no boundary pile-up artifacts)'
  - Correct semantic use of imprint_seq (brand green -> blue) for the single-polarity
    'depth' variable, with a custom afterDraw colorbar plugin drawn entirely outside
    chartArea so it can never collide with a data marker
  - Custom afterDraw magnitude-size legend with reference circles (M4.5/M6.0/M7.5)
    gives the reader a concrete decoding key for point size, matching the spec's size-legend
    requirement
  - Basemap context via two mixed line datasets (coastline + approximate Japan Trench)
    with a custom generateLabels legend, giving real geographic anchoring beyond bare
    lat/lon points
  - 'Both renders are theme-correct: warm off-white / near-black backgrounds, all
    chrome (title, axis labels, ticks, legend, colorbar text) readable in both themes,
    and the Imprint data colors are pixel-identical between light and dark'
  - Rich tooltip with magnitude, depth, and lat/lon per epicenter — good use of interactivity
    that doesn't need to show up in the static PNG
  weaknesses:
  - No zoom/pan is enabled to explore point clusters as the spec's interactivity note
    suggests — likely acceptable since core Chart.js has no built-in zoom/pan and
    the pinned bundle doesn't include chartjs-plugin-zoom, but worth confirming that's
    truly unavailable before ruling it out permanently.
  - In the densest cluster (~37-38.5°N, 141-143°E) many mid-sized markers fully occlude
    smaller ones despite alpha=0.78 and the pageBg point-border halo — a touch more
    transparency or slightly smaller radii floor in that band would help separate
    overlapping shallow events.
  - The 'basemap' is a single simplified coastline polyline rather than a filled landmass/terrain
    context — adequate for orienting the reader but thinner geographic context than
    the spec's 'basemap showing country boundaries, coastlines, or terrain' suggests;
    a filled land polygon (even a rough one) would read more like a map and less like
    an abstract scatter.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1-consistent), not pure white, not dark.
      Chrome: Title "Tohoku-Oki Earthquakes · scatter-map-geographic · javascript · chartjs · anyplot.ai" in bold dark ink, clearly readable. "Coastline"/"Japan Trench (approx.)" line-style legend readable below the title. Axis titles "Longitude (°E)" / "Latitude (°N)" and numeric tick labels all dark-on-cream and legible. Grid lines are faint light-gray, visible but not competing with data. Right-side "Depth" colorbar (green->blue gradient, "0 km"/"600 km" labels) and bottom-right "Magnitude" size legend (M4.5/M6.0/M7.5 outlined circles) both render in dark ink, fully legible.
      Data: ~160 circular epicenter markers colored on a green (shallow) to blue (deep, ~600 km) sequential ramp, radius scaled to magnitude (M3.8-7.9), thin cream-colored halo around each marker for separation, solid dark coastline and dashed trench line for context. First/only continuous series correctly uses imprint_seq, no categorical palette misuse.
      Legibility verdict: PASS — all text is clearly readable against the light background; no light-on-light issues observed.

    Dark render (plot-dark.png):
      Background: Warm near-black, not pure black, not light.
      Chrome: Title, "Coastline"/"Japan Trench" legend, axis titles, tick labels, colorbar labels, and magnitude legend text all render in light off-white ink against the near-black background — all clearly legible, no dark-on-dark failures observed. Grid lines are faint light gray on black, subtle but visible. Coastline/trench lines switch to a light stroke so they stay visible on dark (correct theme-adaptive chrome).
      Data: Same green->blue depth ramp and magnitude-scaled radii as the light render — colors are pixel-identical between themes, only chrome (background, ink, grid, stroke colors) flipped, as required.
      Legibility verdict: PASS — no dark-on-dark or light-on-dark legibility failures found in title, axes, ticks, legend, or colorbar text.
