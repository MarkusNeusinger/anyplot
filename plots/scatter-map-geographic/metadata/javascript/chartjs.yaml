review:
  strengths:
  - 'Correct imprint_seq (green→blue) continuous colormap for depth, with a custom
    canvas-drawn colorbar legend — first color at ratio 0 is the brand green #009E73
    as required'
  - Custom magnitude size legend and depth colorbar are legitimate afterDraw canvas
    plugins, not fake interactivity — a genuinely distinctive Chart.js technique (LM-02)
  - 'Strong geographic/scientific storytelling: coastline + approximate Japan Trench
    reference lines let the viewer see depth increasing inland from the trench as
    the Pacific plate subducts — a real Wadati-Benioff zone pattern, not just a random
    point cloud'
  - Mixed dataset types (line geometry for coastline/trench + scatter for epicenters)
    via Chart.js's per-dataset `type` override, plus per-point pointRadius/pointBackgroundColor
    arrays for dual size+color encoding
  - Deterministic fixed-seed LCG + Box-Muller PRNG (no external dependency) with a
    physically-motivated generation model (shallow thrust near trench, deeper events
    inland)
  - 'Theme-adaptive chrome is fully correct in both renders: warm off-white/near-black
    backgrounds, readable ink/inkSoft text, subtle grid, identical data colors across
    themes'
  - Title, axis titles, and tick labels all readable at full size in both themes;
    mandated title format followed exactly with a sensible descriptive prefix
  weaknesses:
  - The custom depthColorbarPlugin draws an opaque gradient rectangle directly inside
    the data area (chartArea.right - barW - 130) without reserving space via layout.padding
    or excluding that region from the marker domain — it visibly overlaps and partially
    hides at least one epicenter marker, and the rotated 'Depth' axis label text overlaps
    another marker just below the bar, in both light and dark renders. Fix by adding
    right-side layout.padding (or increasing scales.x.max headroom) sized to the colorbar
    box so it sits in genuinely empty chart space, the way the magnitude legend already
    does correctly in the bottom-right.
  - A cluster of epicenters forms a visibly straight line at the top latitude boundary
    (~40.8°N, LAT_MAX - 0.2) because the Gaussian tail is hard-clipped with clip()
    rather than resampled — this reads as a synthetic generation artifact rather than
    natural seismicity. Resample out-of-range draws instead of clamping to avoid the
    boundary pile-up.
  - Auxiliary text (colorbar km labels, 'Depth' axis label, magnitude legend labels)
    is drawn at ~13px, noticeably smaller than the chart's own tick labels (14px)
    and legend (16px) — fine at full resolution but worth nudging up 1-2px so it stays
    comfortably legible once the PNG is scaled to the ~400px mobile width.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "Tohoku-Oki Earthquakes · scatter-map-geographic · javascript · chartjs · anyplot.ai" in dark ink at top, fully visible and not clipped. Below it a small line-style legend for "Coastline" (solid) and "Japan Trench (approx.)" (dashed). Axis titles "Longitude (°E)" and "Latitude (°N)" in dark ink, tick labels in softer gray, subtle light-gray gridlines on both axes. A custom vertical depth colorbar (green→blue gradient, labeled "600 km" / "0 km" / "Depth") sits in the upper-right of the plot area, and a magnitude bubble-size legend ("M7.5" / "M6.0" / "M4.5") sits in the lower-right.
      Data: ~160 circular epicenter markers scattered across the Tohoku/Kanto coastal region (lon 134–144.5°E, lat 33–41°N), colored on a green(shallow)→blue(deep) sequential scale and sized by magnitude, drawn over a solid coastline outline and a dashed approximate trench line. Colors and geometry match the mandated Imprint imprint_seq gradient (starts at #009E73 for depth=0).
      Legibility verdict: PASS overall, with one localized defect — the depth colorbar box is drawn directly on top of a data marker (roughly half of one epicenter circle is hidden behind the opaque bar), and the rotated "Depth" label text sits over another marker just below it. All other text/data elements are clearly readable.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Same layout as the light render with all text and lines flipped to light colors — title, axis titles, and tick labels are clearly legible in near-white/light-gray ink, the legend and gridlines are visible but subtle, and the coastline/trench lines render in light gray instead of dark gray.
      Data: Identical marker positions, sizes, and colors to the light render — the green→blue depth gradient is pixel-identical, confirming only chrome (background, text, line colors) changed between themes, not data colors.
      Legibility verdict: PASS overall, no dark-on-dark failures — all text is light-colored against the near-black background and remains readable. The same colorbar/marker overlap defect from the light render is also present here (theme-independent, a data-layout issue rather than a theme issue).
