review:
  strengths:
  - Correct Imprint `imprint_seq` gradient (brand green → blue) for the single-polarity
    depth variable, identical data colors across themes, with theme-correct chrome
    (background, text, grid, legend) in both renders
  - 'Idiomatic, distinctive D3 usage: d3.geoNaturalEarth1 projection driving d3.geoPath,
    proper data joins (selection.data().join()), and a d3.zoom behavior for cluster
    exploration'
  - Realistic, factually grounded data — earthquake epicenters placed along real-world
    seismic fault zones (Japan Trench, Chile, Aleutians, Himalaya, Mid-Atlantic Ridge,
    etc.) with plausible magnitude (4.0–8.2) and depth (5–573 km) ranges
  - Clear dual legend — sequential color gradient for depth and a sqrt-scaled size
    legend for magnitude — giving perceptually accurate area encoding
  - Reproducible via a fixed-seed LCG (no seeded RNG exists in-browser), clean KISS
    top-to-bottom structure, and no fake/simulated interactivity
  weaknesses:
  - Low-poly landmass outlines are quite crude/blocky (Africa's silhouette is barely
    recognizable, Australia reduced to a rough hexagon) — the geographic context reads
    as approximate rather than polished; a few more vertices per landmass would sharpen
    recognizability without adding real complexity
  - Landmass fill (elevatedBg) contrast against the page background is very subtle
    in both themes, so the basemap is hard to distinguish at a glance, especially
    once scaled down to mobile width — a slightly stronger fill or coastline stroke
    would help
  - Heavy circle overlap in the densest fault clusters (Indonesia, Chile, Japan Trench)
    blends the depth colors together and obscures individual epicenters — a smaller
    minimum radius or a stronger point stroke would help separate points in dense
    regions
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1-like), not pure white — correct.
      Chrome: Title "Global Earthquake Epicenters · scatter-map-geographic · javascript · d3 · anyplot.ai" in bold dark ink, clearly readable. Sphere outline, subtle graticule lines, and low-poly landmasses (near-white fill, thin dark-gray coastline stroke) provide geographic context. Legend text ("Depth (km)", "Magnitude") and tick numbers (5, 573, 4.0, 6.1, 8.2) in soft dark gray — all legible.
      Data: Circles colored on an Imprint imprint_seq gradient from brand green (#009E73, shallow) to blue (deep), sized by magnitude via a sqrt scale, semi-transparent (fill-opacity 0.58) with a light stroke for separation. Clusters concentrate along real-world fault lines (Ring of Fire, Himalaya, Mid-Atlantic Ridge).
      Legibility verdict: PASS — all text and data markers are clearly readable against the light background.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17-like), not pure black — correct.
      Chrome: Same title now rendered in light/white ink, clearly readable against the dark background. Graticule and landmass fills flip to dark-gray tones appropriate for the dark surface; coastline strokes remain visible. Legend text and numbers render in light gray — no dark-on-dark failures observed.
      Data: Same green-to-blue depth gradient and magnitude-based sizing as the light render — data colors are identical between themes, confirming only chrome flipped.
      Legibility verdict: PASS — no dark-on-dark or light-on-light issues found; all chrome elements are clearly visible.
