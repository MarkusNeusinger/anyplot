review:
  strengths:
  - Idiomatic, sophisticated use of d3-geo (geoNaturalEarth1 projection, geoPath,
    geoGraticule10, Sphere outline) with correctly built in-memory GeoJSON landmasses,
    satisfying the 'no fetch/no external data' constraint creatively.
  - 'Correct dual-legend design: sequential Imprint color scale (imprint_seq) for
    depth and a size scale for magnitude, matching continuous-data palette rules exactly.'
  - Theme-adaptive chrome verified correct in both renders — data colors (depth gradient,
    marker fills) are identical between light and dark, only chrome (page background,
    landmass fill, graticule, ink) flips.
  - Realistic, plausible earthquake dataset generated deterministically (fixed-seed
    LCG) along real tectonic boundaries (Japan Trench, Indonesia, Chile, Aleutians,
    Mid-Atlantic Ridge, etc.) with sensible magnitude/depth ranges.
  - Correct canvas size (passes the canvas gate), correct mandated title format, flat
    KISS code structure with no unnecessary abstractions.
  weaknesses:
  - Dense earthquake clusters (Philippines/Indonesia, Chile, Aleutians) render as
    solid overlapping blobs where individual points become indistinguishable — lower
    fill-opacity further (e.g. ~0.55-0.6) or add slight jitter to the tightest clusters
    to preserve per-point visibility.
  - The hand-built low-poly landmasses merge Africa and Eurasia into one continuous
    shape with no visible Mediterranean gap, making the basemap harder to read as
    a recognizable world map at a glance — add a visible strait/gap between the two
    landmasses.
  - Legend text ('Depth (km)', 'Magnitude', and the numeric tick labels) renders at
    12-13px, noticeably smaller than the title and slightly below the ~14px CSS baseline
    for secondary/legend text recommended for the JS-library mount space — bump to
    ~14px for better mobile legibility.
  - No zoom/pan interaction is wired up despite d3 being a JS/interactive library
    and the spec explicitly suggesting 'enable zoom and pan to explore point clusters'
    — consider adding d3.zoom() on the svg for the HTML output.
  - The magnitude size-legend uses unfilled/outline circles while the actual data
    markers are filled with the depth color — a minor visual mismatch between the
    legend symbol and the encoded marker style; consider filling the legend circles
    with a neutral/ink tone.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1-range), not pure white and not dark — correct light-theme surface.
      Chrome: Title "Global Earthquake Epicenters · scatter-map-geographic · javascript · d3 · anyplot.ai" renders in bold dark ink, clearly legible and centered at the top. The sphere outline, graticule lines, and landmass fills use soft dark-gray/near-white tones that read clearly against the cream background. Legend text ("Depth (km)", "Magnitude", numeric tick values) is dark gray and legible, though noticeably smaller than the title.
      Data: Earthquake epicenters are circles colored on a green-to-blue sequential scale (imprint_seq) by depth, sized by magnitude, with a subtle light-toned stroke halo separating overlapping points. First-touch color impression is dominated by brand green (shallow quakes) with blue accents for deep ones (e.g. the large blue circle west of India).
      Legibility verdict: PASS — all text is clearly readable against the light background; no light-on-light issues observed.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17-range), not pure black and not light — correct dark-theme surface.
      Chrome: Title renders in light/white text, clearly legible against the dark background. Landmasses fill with a dark charcoal gray distinct from the near-black ocean/background, graticule lines are faint light-gray, and the sphere outline is a light stroke — all correctly flipped to dark-theme chrome. Legend text is light gray and legible.
      Data: Confirmed identical marker colors (green-to-blue depth scale) and identical marker positions/sizes to the light render — only the chrome (background, landmass fill, ink) flipped as required. The pale stroke halo around markers now matches the dark background tone, still separating overlapping points effectively.
      Legibility verdict: PASS — no dark-on-dark failures; all title, legend, and chrome text is clearly visible against the near-black background.
