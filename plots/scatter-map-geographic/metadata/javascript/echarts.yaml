review:
  strengths:
  - 'Clever workaround for ECharts'' missing bundled world GeoJSON: continents are
    traced as low-vertex polygons and rendered through a custom series (renderItem
    + api.coord) on the same lon/lat axes the data uses, giving real geographic context
    without violating the no-fetch/no-extra-package rule.'
  - 'Dual encoding is well executed: magnitude drives point diameter via a linear
    (not sqrt) scale correctly justified in a comment because magnitude is already
    logarithmic, and depth drives color via a continuous imprint_seq visualMap.'
  - Custom fixed-position magnitude size-key legend (graphic elements) sits cleanly
    beside the depth colorbar with no overlap, and both are readable in both themes.
  - Deterministic, realistic in-memory dataset (~40 real-world epicenters with plausible
    magnitude/depth ranges) with alpha=0.75 applied on markers to mitigate overplotting
    in dense regions, per the spec's own advice.
  - Theme tokens threaded correctly throughout (title, axis, legend, basemap fill/stroke,
    marker border uses pageBg) — both renders are legible and the data colors are
    identical between light and dark.
  weaknesses:
  - No pan/zoom (dataZoom or roam) is enabled, so the dense clusters (e.g. Chile,
    Japan/Ryukyu, Turkey/Greece) that visibly overlap in the static render cannot
    be explored — the spec explicitly asks interactive libraries to 'enable zoom and
    pan to explore point clusters'.
  - The basemap is a plain linear lon/lat (equirectangular) projection rather than
    an explicitly-projected Natural Earth/Robinson (world) or Mercator (regional)
    projection the spec suggests; understandable given ECharts has no bundled world
    GeoJSON to register without fetching, but still a deviation worth a comment in
    code acknowledging the tradeoff more explicitly.
  - Several points overlap heavily in dense regions (Valparaiso/Concepcion in Chile
    render as one nearly-merged blob; Izmir/Athens touch) — alpha helps but a slightly
    larger minimum spacing or jitter would improve legibility further.
  - The depth colorbar only shows qualitative 'Deep'/'Shallow' text labels, not the
    actual depth range in km, so viewers can't read exact values off the legend.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "Global Earthquakes · scatter-map-geographic · javascript · echarts · anyplot.ai" centered at top in dark ink, clearly readable. "Longitude"/"Latitude" axis titles and degree-formatted tick labels (e.g. 150°W, 30°N) are dark gray and legible. Grid lines are subtle light gray, visible but not dominant. Continent silhouettes are filled light gray with a soft outline, providing geographic context without competing with the data markers.
      Data: ~40 circular markers sized by magnitude (M5–M8, per the size-key legend) and colored on a continuous green-to-blue scale for depth (shallow=green/brand #009E73-ish, deep=blue), matching the "Deep"/"Shallow" colorbar on the right. First/dominant color reads as the Imprint brand green for shallow (majority) events. Markers have sufficient contrast against both the off-white ocean and the light gray landmasses.
      Legibility verdict: PASS — all text is readable against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Title, axis titles, and tick labels render in light/white text, clearly legible against the dark background. Grid lines are a subtle dark gray, still visible. Continent silhouettes are a darker gray fill with a lighter outline, distinguishable from both the near-black ocean and the near-black page background.
      Data: Marker colors are identical to the light render (same green-to-blue depth scale, same magnitude sizing) — only the chrome (background, text, grid, basemap) flipped. Markers remain clearly visible and high-contrast against the dark basemap and background.
      Legibility verdict: PASS — no dark-on-dark failures; all title/axis/tick text is clearly visible against the near-black background.
