review:
  strengths:
  - 'Directly resolved the attempt-1 gap: a lightweight coastline/landmass silhouette
    is now drawn via SVGRenderer + chart.events.render + xAxis/yAxis.toPixels() re-projection,
    giving genuine geographic orientation without the forbidden highmaps module.'
  - Depth-legend swatches were pushed to the extremes of each bin (10 km / 145 km
    / 295 km instead of bin midpoints), so the three depth categories are now visually
    distinct along the imprint_seq gradient instead of blurring together.
  - The translucent seismic-belt corridor ribbon plus the 'Java–Banda cluster' callout
    give the plot a clear focal point and orientation aid that attempt 1 lacked, without
    resorting to fake interactivity.
  - The dense Java–Banda sub-cluster now gets shrunk + lightened markers (DENSE_ZONE
    logic), keeping individual epicenters distinguishable where attempt 1 blurred
    into a blob.
  - Dual size/color encoding (Gutenberg-Richter-skewed magnitude → size, depth → imprint_seq
    color), seeded LCG data generation, and theme-adaptive chrome all continue to
    work correctly in both renders.
  - 'Data colors (green→blue depth ramp, brand-green magnitude swatches) are pixel-identical
    between light and dark renders; only chrome flips, confirmed at (10,10) = #FAF8F1
    light / #1A1A17 dark.'
  weaknesses:
  - In the Zagros/Hindu Kush/Himalaya stretch (roughly 45–75°E), several mid-size
    circles still overlap tightly enough to partially fuse into a blob — the DENSE_ZONE
    treatment only covers the Java–Banda box; consider widening the density-aware
    shrink/lighten logic to any locally dense sub-region, not just one hardcoded box.
  - The hand-drawn landmass polygons are deliberately coarse (explicitly noted in
    the code comments) — they read as generic gray blobs rather than recognizable
    coastlines/country shapes at a glance; a slightly higher-fidelity simplified outline
    would strengthen the geographic storytelling further.
  - Only one annotation callout is used; a second small label near another notable
    anchor (e.g. Himalaya or Anatolia) would reinforce the geographic narrative the
    belt-corridor ribbon is already hinting at.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, sampled pixel (10,10) = RGB(250,248,241) = #FAF8F1 exactly. Matches spec.
      Chrome: Bold dark title "scatter-map-geographic · javascript · highcharts · anyplot.ai" and gray subtitle "Alpide seismic belt · synthetic epicenters, magnitude ≥ 4.0" both fully visible, not clipped. X-axis "Longitude (°E)" / Y-axis "Latitude (°N)" with degree-formatted tick labels, subtle gridlines on both axes. New in this attempt: pale gray simplified landmass silhouettes (S. Europe/N. Africa, Middle East, India, mainland SE Asia, Sumatra, Java) drawn with SVGRenderer, clipped to the plot area and re-projected from lon/lat via toPixels(). A soft translucent green ribbon traces the seismic-belt corridor, and an italic "Java–Banda cluster" callout labels the densest sub-cluster in open space (no overlap with markers or other text). Bottom legend (single row) shows three depth-color swatches (green → teal → indigo, now visually distinct — previously too close in hue) and three magnitude-size swatches (all brand green, sizes scaling correctly). All text is clearly readable against the light background.
      Data: ~170 circular epicenters trace the Alpide belt from Iberia to the Banda arc. Marker radius scales with magnitude (Gutenberg-Richter skew: many small, few large). Marker fill color is an imprint_seq (#009E73 → #4467A3) gradient by depth. First/primary series correctly renders in brand green #009E73 at shallow depth. The previously blob-like Java–Banda dense sub-cluster now shows individually distinguishable, smaller/lighter markers.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 (sampled and confirmed via pixel value RGB(26,26,23)).
      Chrome: Title, subtitle, axis titles/ticks, and legend all flip to light ink tones and remain fully readable; landmass silhouettes flip to dark gray fills with light-gray strokes, still visible against the near-black background; the belt-corridor ribbon is present but much fainter here (expected — translucent green over near-black reads as a subtle glow rather than a pastel band, consistent with the same underlying stroke-opacity value, not a bug). "Java–Banda cluster" callout remains clearly legible in light italic text.
      Data: Marker positions, sizes, and colors are pixel-identical to the light render — confirmed the green→blue depth gradient and magnitude sizing hold constant across themes; no dark-on-dark or light-on-light failures anywhere.
      Legibility verdict: PASS
