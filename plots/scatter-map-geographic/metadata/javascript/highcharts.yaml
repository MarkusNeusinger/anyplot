review:
  strengths:
  - 'Correct dual-encoding: point size maps to magnitude (Gutenberg-Richter-like skew,
    realistic) and point color maps to depth via the imprint_seq gradient (#009E73
    -> #4467A3) — matches the spec''s optional size/value encoding requirements.'
  - The manual dummy-series legend cleanly explains both encodings (depth bins and
    magnitude bins) without requiring the forbidden highmaps/highcharts-more modules
    — a legitimate documented workaround.
  - 'Deterministic, seeded (LCG) data generation traced along a geologically accurate
    path (Alpide seismic belt: Iberia -> Anatolia -> Himalaya -> Sunda arc), giving
    strong DQ-02/DQ-03 factual grounding.'
  - Theme-adaptive chrome (title/axis/tick/legend/tooltip colors) is threaded correctly
    through window.ANYPLOT_TOKENS and holds up in both light and dark renders; text
    stays readable in both themes.
  - 'zooming: { type: ''xy'' } satisfies the spec''s ''enable zoom and pan to explore
    point clusters'' recommendation for interactive libraries.'
  - Alpha-blended markers (fillColor alpha 0.78) handle the overlapping points in
    the dense Java-Banda cluster reasonably well.
  weaknesses:
  - 'No basemap or geographic context at all: the spec explicitly asks for country
    boundaries, coastlines, or terrain, but the implementation only draws a plain
    longitude/latitude graticule (grid). Since the highmaps module is forbidden for
    this library, add a lightweight static world/coastline outline (e.g. a simplified
    path array rendered via the Highcharts SVGRenderer in a chart.events.render callback)
    so the epicenters have visible landmass context instead of floating on a bare
    grid.'
  - The three depth-legend swatches ('Depth 5-80 km', 'Depth 80-150 km', 'Depth 150-300
    km') are visually very close in hue (green -> teal) because the represented bin
    midpoints (42.5/115/225 km) only span a modest fraction of the 5-300 km imprint_seq
    range — widen the perceptual spread (e.g. pick more extreme representative depths
    for the legend swatches, or push the interpolation fraction with a mild curve)
    so the color-depth relationship reads clearly at a glance.
  - 'Design Excellence is at the ''well-configured default'' level: it''s a standard
    grid + circles scatter with no distinguishing visual treatment (e.g. a subtle
    shaded band tracing the seismic-belt corridor, or a text callout labeling a notable
    cluster like the Sunda arc) that would elevate it beyond a generic scatter.'
  - 'Library Mastery is generic: the same visual result could be produced with near-identical
    code in D3 or ECharts. Consider leaning into a Highcharts-specific capability
    (e.g. chart.events.selection for the drag-zoom, or SVGRenderer-based annotations)
    to differentiate the implementation.'
  - In the densest cluster (~110°E, 0°N, Java-Banda), overlapping circles blur into
    a single blob even with alpha 0.78 — slightly smaller markers or a touch more
    transparency in that region would keep individual epicenters distinguishable.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matching #FAF8F1 — not pure white.
      Chrome: Title "scatter-map-geographic · javascript · highcharts · anyplot.ai" in bold dark ink at top center, subtitle "Alpide seismic belt · synthetic epicenters, magnitude >= 4.0" in soft gray below it. X-axis "Longitude (°E)" and Y-axis "Latitude (°N)" labels present with degree-formatted tick labels. Subtle light gridlines on both axes. A two-row legend at the bottom lists three depth bins (green-to-teal swatches) and three magnitude bins (green swatches of increasing size).
      Data: ~170 circular markers form a clear diagonal arc from the upper-left (~-8°E, 40°N, Iberia) sweeping down to the lower-right (~135°E, -5°N, Banda region), tracing the real-world Alpide seismic belt. Marker size visibly grows with magnitude; marker color shifts subtly from green toward teal/blue with depth. No basemap, coastline, or country outline is present — only the plain lon/lat grid.
      Legibility verdict: PASS — title, subtitle, axis labels, tick labels, and legend text are all clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, matching #1A1A17 — not pure black.
      Chrome: Same title/subtitle/axis-label/legend layout as the light render, now rendered in light ink/gray tones. Gridlines are faint but visible against the dark surface.
      Data: Identical marker positions, sizes, and colors to the light render (green-to-teal-blue depth gradient, magnitude-scaled radii) — confirms the data palette is unchanged between themes, only chrome flipped. Still no basemap/coastline present.
      Legibility verdict: PASS — title, subtitle, axis labels, tick labels, and legend text are all clearly readable against the dark background; no dark-on-dark failures observed, and the teal/green markers remain clearly visible against the near-black surface.
