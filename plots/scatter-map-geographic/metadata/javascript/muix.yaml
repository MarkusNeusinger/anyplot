review:
  strengths:
  - 'Native MUI X encodings: depth through a zAxis continuous colorMap on the imprint_seq
    tokens and magnitude through a sizeAxisId sizeMap, with ContinuousColorLegend
    bound to the same z axis'
  - Custom basemap layer composed into ChartsSurface via useXScale/useYScale, so land
    outlines share the chart's scales; muted grid-token fill keeps it quieter than
    the points in both themes
  - Size legend glyphs reuse the markers' fill, alpha and page-coloured edge, at the
    radii the linear size map assigns
  - Aspect-correct equirectangular sizing and a padded extent keep antimeridian and
    polar points clear of the axes
  - 'Realistic, neutral earthquake scenario: epicentres follow real plate boundaries,
    with deep events landward of the trenches'
  - Library-native tooltip (valueFormatter) names zone, magnitude and depth in the
    HTML view
  weaknesses:
  - 'Suggestion: an equal-area-looking world projection such as Natural Earth or Robinson,
    which the Notes name for world maps, would reduce the high-latitude stretching
    of the plate carrée (would need projecting lon/lat before plotting, since MUI
    X has no geo projection).'
  - 'Suggestion: highlighting the deepest subduction events (Tonga, Andes) would give
    the map a focal point.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1.
      Chrome: bold dark title "scatter-map-geographic · javascript · muix · anyplot.ai" with a grey subtitle (82 epicentres, encodings, projection); Latitude/Longitude axis titles; degree ticks 90°S–90°N and 180°W–180°E; subtle graticule; dashed Equator and Prime meridian lines with small labels. All readable.
      Data: world basemap in light grey with soft outlines; 82 circles along the Ring of Fire, Alpide belt and Himalaya, coloured on the green (#009E73, shallow) to blue (deep) imprint_seq ramp, sized by magnitude, alpha 0.82 with light outlines. Bottom legend: Depth (km) colour bar 5–545 and Magnitude (Mw) glyphs 5.0 / 6.3 / 7.5.
