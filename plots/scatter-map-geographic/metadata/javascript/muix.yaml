review:
  strengths:
  - Composes the chart from MUI X's ChartsDataProvider / ChartsSurface API and draws
    the land basemap as a custom SVG layer through the useXScale/useYScale hooks,
    so the outlines share the exact scales of the scatter markers
  - Uses zAxis colorMap (depth, Imprint sequential green → blue from t.seq) and zAxis
    sizeMap (magnitude, linear 4–16 px), the library-native way to drive the color
    and size channels, with a native ContinuousColorLegend for depth
  - The size legend circles copy the markers' fill (the middle of the depth ramp),
    fill opacity and page-colored outline, so the key matches the marks in both themes
  - The basemap is kept quiet (land filled with the grid token, a soft ink outline
    at 45 % opacity), so the green and blue epicentres stand out in both themes
  - The map keeps a true 2:1 equirectangular aspect with degree-formatted graticule
    ticks (60° / 30°), and longitudes are wrapped correctly across the antimeridian
    (Tonga points at the left edge)
  - 'Earthquake scenario with M5.0–7.7 magnitudes and 6–591 km depths: deep blue slabs
    under the Andes and Tonga against shallow green Anatolia and Himalaya events read
    immediately'
  - Native tooltip valueFormatter shows zone, magnitude and depth for every point
    in the HTML view
  weaknesses:
  - 'DQ-02 (both): the zone named "Cascadia-Mexico coast" has no epicentre north of
    about 39°N (Cascadia lies at about 40–50°N), and several of its points fall in
    the open Pacific at about 10–15°N, 118°W, about 15° west of the Middle America
    trench → put this zone''s points along the real margin (Cascadia at about 40–49°N,
    124–128°W; Mexican trench at about 14–19°N, 92–105°W), or rename the zone. Likely
    cause: one zone centred at (-112, 24) with spreadLat 15 and spreadLon 9 in the
    zones list.'
  - 'Suggestion: the Notes name Natural Earth or Robinson for world maps; a short
    Robinson or Natural Earth forward transform applied to both the outlines and the
    points would cut the high-latitude stretching of the plate carrée.'
  - 'Suggestion: the meanLatitude cosine correction is always 1 for the full-globe
    extent; it only matters if WORLD is narrowed to a region.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole canvas, no white plot panel.
      Chrome: bold dark title "scatter-map-geographic · javascript · muix · anyplot.ai" with a gray subtitle "80 epicentres · colour: Depth (km) · size: Magnitude (Mw) · equirectangular projection"; the axis titles Longitude / Latitude and the degree ticks 180°W…180°E and 90°S…90°N are in dark ink; the subtle gray graticule sits at 60°/30°; the dashed Equator and Prime meridian lines carry small labels. All readable.
      Data: 80 circles on a light-gray land basemap with soft outlines, clustered along the Aleutians, the Mexican coast, the Andes, Japan, Indonesia-Philippines, Tonga, Anatolia and the Himalaya. Color runs from brand green #009E73 (shallow) to blue #4467A3 (deep: the Andes and Tonga), size 4–16 px by magnitude, alpha 0.82 with page-colored outlines. Bottom legend band: the Depth (km) color bar 6–591, and the Magnitude (Mw) size key 5.0 / 6.3 / 7.7 with circles matching the markers.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17, not pure black.
      Chrome: the title, subtitle, axis titles, tick labels, legend titles and the reference-line labels all render in light ink; the graticule is a subtle dark gray; no dark-on-dark text anywhere.
      Data: marker colors identical to the light render (green → blue depth ramp); the land fill flips to a dark-gray grid token with a lighter outline and stays quieter than the points; marker outlines take the dark page color. The legend glyphs are visible and match the marks.
      Legibility verdict: PASS
