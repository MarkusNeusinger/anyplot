review:
  strengths:
  - Composes the map from ChartsDataProvider + ChartsSurface and draws the land outlines
    in a custom Basemap layer through the useXScale/useYScale hooks, so the basemap
    shares the scatter's exact coordinate system
  - Depth is encoded through a zAxis colorMap on the imprint_seq stops and magnitude
    through a zAxis sizeMap, with a native ContinuousColorLegend; both legends name
    their variable
  - Size-legend glyphs reuse the markers' fill, alpha and page-coloured edge and are
    computed from the same linear size map, so they match the data marks in both themes
  - Markers at 0.82 opacity with a page-coloured outline keep stacked epicentres in
    the Andes and Japan clusters distinguishable; the grey basemap stays quieter than
    the points on both backgrounds
  - Every point sits at its generated latitude/longitude (antimeridian wrap only);
    degree-formatted graticule ticks (60°W, 30°S) and a per-point tooltip naming zone,
    magnitude and depth in the HTML
  - Plausible M5.0+ epicentres along real subduction and collision zones, with deep
    events (up to ~590 km) only in the Andes, Tonga and Indonesia arcs
  weaknesses:
  - 'SC-02 (both): the basemap is five rough continent polygons with no Japan, Indonesia/Philippines,
    New Zealand, Greenland, UK or Antarctica, so the Japan-Kuril and Indonesia-Philippines
    epicentres sit in open water and the Andes outline misses the coast its points
    follow → a basemap whose coastlines carry the island arcs the data sits on (finer
    land rings including the main islands). Likely cause: LAND_OUTLINES holds only
    ~15-35 vertices per continent and no islands.'
  - 'Suggestion: a Robinson or Natural Earth projection (projecting lon/lat to x/y
    before plotting) would reduce the high-latitude stretch of the plate carrée world
    map.'
  - 'Suggestion: intermediate ticks on the depth colour bar (e.g. 100, 300, 500 km)
    would make individual depths easier to read off than the 6 and 591 endpoints alone.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole canvas.
      Chrome: bold dark title "scatter-map-geographic · javascript · muix · anyplot.ai" with a soft-ink subtitle (80 epicentres · colour: Depth (km) · size: Magnitude (Mw) · equirectangular projection); degree ticks 180°W–180°E and 90°S–90°N, axis titles "Longitude"/"Latitude", subtle grid graticule, dashed Equator and Prime meridian lines with small labels; bottom legend band with a "Depth (km)" colour bar (6–591) and a "Magnitude (Mw)" size legend (5.0, 6.3, 7.7). All text readable.
      Data: 80 circles over grey continent polygons, coloured along the imprint_seq ramp from brand green #009E73 (shallow) to blue (deep), sized by magnitude, white page-coloured edges, slight transparency. Clusters at Aleutians, Mexico coast, Andes, Anatolia, Himalaya, Japan, Indonesia, Tonga.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, subtitle, ticks, axis titles and legend text in light ink, grid and dashed reference lines lighter grey; no dark-on-dark text. Land polygons in a dark grey fill with a soft outline.
      Data: identical green→blue colours and sizes as the light render; marker edges flip to the dark page colour. Brand green clearly visible.
      Legibility verdict: PASS
