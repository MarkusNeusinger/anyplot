review:
  strengths:
  - Handcrafted plate-carree basemap (continent silhouettes + 60°/30° graticule) gives
    real geographic context without pulling in a forbidden geo/D3 dependency, and
    the projection math is shared exactly between the SVG basemap and the chart's
    linear axes so points line up perfectly
  - Depth is mapped through the zAxis continuous colorMap using the Imprint sequential
    stops (t.seq[0]/t.seq[1]) with a proper ContinuousColorLegend, and the data colors
    are pixel-identical between the light and dark renders — only chrome flips
  - Magnitude is binned into four series so marker size scales with earthquake magnitude
    (5-17px), giving the map genuine multi-dimensional encoding (position + size +
    color) as the spec calls for
  - Dashed Prime Meridian / Equator ChartsReferenceLines with inline labels add useful
    geographic orientation without cluttering the plot
  - Clean, deterministic LCG-based data generation clustered along real subduction/collision
    zones (Ring of Fire, Alpide belt, Andes) — factually grounded and neutral in topic
  - Explicit font sizing throughout (title 24px, subtitle 13px, axis ticks 14px, axis
    labels 16px, legend 14px) and skipAnimation set correctly per the muix harness
    contract
  weaknesses:
  - The magnitude-tier legend at the bottom renders all four swatches at the same
    fixed size (itemMarkWidth/itemMarkHeight are uniform in slotProps.legend) and
    the same green color, so the legend itself conveys zero visual size difference
    even though the subtitle says 'marker size = magnitude tier' — only the text labels
    distinguish the tiers. Consider a custom legend (e.g. four manually-sized circle
    swatches via a small SVG/Box row) so the legend visually matches the size encoding
    used on the map.
  - In the densest clusters (Japan-Kuril arc, Indonesia-Philippines arc) many overlapping
    circles merge into a single blob at this alpha (0.82), making it hard to distinguish
    individual epicenter counts within a cluster — a touch more transparency (alpha
    ~0.65-0.7) or a thin stroke contrast would help separate them.
  - The spec's optional `label` field (point identifier for tooltips) isn't surfaced
    anywhere in the valueFormatter — only lon/lat/depth are shown; a short place-name
    or zone label would round out the tooltip content for the interactive HTML view.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Title "scatter-map-geographic · javascript · muix · anyplot.ai" in bold dark ink top-left, subtitle in muted gray beneath it explaining the size/color encoding. Longitude/Latitude axes with degree-formatted tick labels (e.g. "60°N", "120°W"), light gray graticule gridlines, dashed Prime Meridian and Equator reference lines with inline labels, continent silhouettes drawn as flat light-gray shapes with soft outlines. Continuous depth legend top-right ("6 km shallow" → "591 km deep"). Magnitude-tier legend row at the bottom. All text is dark ink on the cream background and clearly legible.
      Data: Circular markers cluster along real subduction/collision zones (Japan, Aleutians, Cascadia-Mexico, Andes, Indonesia, Tonga, Anatolia, Himalaya). Marker size varies 5-17px by magnitude tier; color runs from the Imprint sequential green (#009E73-family, shallow) through teal to blue (deep), matching the depth colorbar. Fill opacity ~0.82 with a page-colored stroke keeps overlapping points distinguishable, except in the two densest clusters where several circles fully merge.
      Legibility verdict: PASS — all chrome text reads clearly against the light background; no dark-on-light or light-on-light failures.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Same title/subtitle/axis/legend layout, now rendered in light ink (white/near-white) on the dark surface. Continents render as a slightly lighter charcoal gray with visible outlines against the near-black page. Graticule and reference lines remain visible but subtle.
      Data: Marker colors are pixel-identical to the light render (same green-to-blue depth gradient, same per-tier sizes) — only the chrome (background, text, continent fill, grid) flipped for the dark theme, as required.
      Legibility verdict: PASS — title, axis ticks, axis labels, and both legends are all light-colored and clearly readable on the dark background; no dark-on-dark failures detected.
