review:
  strengths:
  - 'The basemap is built inside MUI X''s composition API: a custom <Basemap> component
    reads useXScale/useYScale and draws the land rings in data coordinates under ChartsSurface,
    so the coastlines and the epicentres share one scale.'
  - 'Two encodings come from the zAxis config: a continuous colorMap from the Imprint
    sequential stops (t.seq) for depth and a linear sizeMap for magnitude. ContinuousColorLegend
    renders the depth color bar natively, and a size legend with three glyphs (5.0
    / 6.3 / 7.5) uses the markers'' own fill, alpha and outline.'
  - The plot area is sized to the true 2:1 equirectangular aspect and centered. The
    graticule (60° meridians, 30° parallels) doubles as the grid, with degree-formatted
    ticks such as 120°W and 30°S.
  - The basemap uses the grid token with a soft outline and stays quieter than the
    points in both themes. The points (alpha 0.82, page-colored outline) stand out
    on land and on ocean, and stacked points in the Banda and Japan clusters remain
    distinguishable.
  - The data is a realistic simulated M5+ catalog along real plate boundaries. In
    the subduction zones the deeper events sit landward of the trench (the Andes,
    Tonga and the Banda arc turn blue inland), which is what real slab seismicity
    looks like.
  - The tooltip valueFormatter names the zone, magnitude and depth of each epicentre
    in the interactive HTML, and skipAnimation is set.
  weaknesses:
  - 'VQ-02 (both): the Tonga-Kermadec epicentre near 180°W / 30°S (~7 px radius) sits
    on the ''30°S'' y tick label and covers its final ''S'' → the tick label should
    stay readable. Likely cause: the map''s left edge is at the axis line and the
    point is drawn over the tick label; a smaller MARKER_RADIUS upper bound or slightly
    more left padding between the y-axis band and the plot area (Y_AXIS_WIDTH / marginX)
    would clear it.'
  - 'Suggestion: the Notes name Natural Earth or Robinson for world maps; projecting
    the lon/lat with a pseudo-cylindrical formula before plotting would shrink the
    oversized Antarctica and polar regions of the equirectangular frame.'
  - 'Suggestion: the depth color bar shows only its endpoints (5, 545); one or two
    intermediate ticks (e.g. 100, 300 km) would make the shallow/intermediate/deep
    split readable.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, landscape 3200x1800.
      Chrome: bold dark title "scatter-map-geographic · javascript · muix · anyplot.ai" with a softer subtitle "82 epicentres · colour: Depth (km) · size: Magnitude (Mw) · equirectangular projection". Axes "Longitude" (180°W–180°E every 60°) and "Latitude" (90°S–90°N every 30°) in dark ink. The graticule grid is subtle. Dashed Equator and Prime meridian lines carry small labels. A bottom band holds the "Depth (km)" color bar (5–545) and the "Magnitude (Mw)" size legend (5.0 / 6.3 / 7.5). All text is readable, except that the '30°S' tick label is partly covered by a Tonga epicentre at the left edge.
      Data: the land polygons are light grey (grid token) with soft outlines. 82 circles sit along the Aleutians, the Cascadia–Mexico coast, the Andes, Tonga, Indonesia, Japan, the Himalaya and the Aegean, colored on the Imprint sequential ramp from brand green #009E73 (shallow) to blue (deep), with radius scaled by magnitude, alpha 0.82 and a page-colored outline.
      Legibility verdict: PASS (minor tick/marker collision at 30°S)

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, subtitle, axis titles, tick labels and legend labels all render in light ink and are clearly readable, with no dark-on-dark text. The grid and the dashed reference lines are light and subtle.
      Data: the land is dark grey and stays quieter than the points. The point colors and the ramp are identical to the light render (green → blue), with dark outlines. The brand green reads well.
      Legibility verdict: PASS (same 30°S tick/marker collision)
