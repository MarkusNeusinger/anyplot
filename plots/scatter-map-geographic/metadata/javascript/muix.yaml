review:
  strengths:
  - 'Rich multi-dimensional encoding: longitude/latitude position, marker size for
    four magnitude tiers, and a continuous green-to-blue colormap for depth — a genuine
    three-variable geographic scatter within the community-only MUI X surface'
  - Deterministic, realistic earthquake epicenter data clustered along real-world
    tectonic belts (Ring of Fire, Alpide belt) with plausible magnitude (5.0-7.8)
    and depth (5-600km) ranges
  - 'Clean theme-adaptive chrome: both light and dark renders are fully readable,
    with the graticule and equator/prime-meridian reference lines reading clearly
    in both themes'
  - 'Correct Imprint palette use: the only categorical color is #009E73, and the continuous
    depth colormap correctly uses imprint_seq (green to blue) for single-polarity
    data'
  - 'Idiomatic MUI X usage: zAxis continuous colorMap combined with ContinuousColorLegend,
    ChartsReferenceLine, and explicit tickInterval formatting are used thoughtfully
    within the community package''s constraints'
  weaknesses:
  - 'No basemap: only a lon/lat graticule plus equator/prime-meridian reference lines
    stand in for a basemap, but the spec explicitly asks for country boundaries, coastlines,
    or terrain for geographic context. Consider adding a minimal hardcoded SVG continent-outline
    overlay (no D3/geo library needed, so it stays within the community-only muix
    rule) so the plot reads as a real world map at a glance rather than an abstract
    coordinate grid.'
  - 'The bottom magnitude-tier legend swatches are all rendered in flat #009E73 green
    regardless of tier, because each point''s visible color actually comes from the
    z-axis depth colorMap, not from the series'' own `color` prop. This can read as
    a bug (legend implies uniform color while the plot shows a gradient). Add a short
    caption clarifying the bottom legend encodes size/magnitude only, or otherwise
    differentiate the swatches.'
  - 'Visual refinement: the default MUI X left/bottom axis frame lines remain visible,
    which reads more like a generic chart frame than a map; consider removing them
    for a cleaner map-like presentation. Also the graticule and the equator/prime-meridian
    reference lines currently use very similar dash styles, making it hard to tell
    the ''meaningful'' reference lines apart from the plain grid at a glance.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Bold dark title top-left ("scatter-map-geographic · javascript · muix · anyplot.ai"), dark "Longitude"/"Latitude" axis labels, dark tick labels with degree+direction formatting (e.g. "60°N", "120°W"), dashed graticule grid, dotted "Prime Meridian" and "Equator" reference lines with small soft-ink labels, bottom row legend for 4 magnitude tiers, top-right continuous color legend ("6 km shallow" to "591 km deep"). All text is clearly legible against the light background.
      Data: ~80 circular markers clustered into 8 groups tracing major real-world tectonic belts (e.g. Japan-Kuril arc, Aleutian-Alaska arc, Andes subduction zone, Indonesia-Philippines arc). Marker fill ranges from brand green (#009E73, shallow) to blue (deep) via the imprint_seq colormap; marker size varies with magnitude tier. Markers have a thin page-background stroke for separation where they overlap.
      Legibility verdict: PASS.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Same title/axis labels/tick labels now rendered in light ink, clearly readable against the dark background; graticule and equator/meridian reference lines still visible at a lower, subtle contrast; both legends (magnitude tiers, continuous depth colorbar) render with light text, fully legible.
      Data: Marker colors are pixel-identical to the light render (same green-to-blue depth gradient, same cluster positions/sizes) — only the chrome (background, text, grid, reference lines) flips to the dark theme, as required.
      Legibility verdict: PASS — no dark-on-dark or light-on-light failures observed in either render.
