review:
  strengths:
  - Equal aspect ratio computed per panel from one units-per-pixel scale for both
    axes (lines 61-75), so the spiral's turns are round and the Lissajous figure keeps
    its true 3:2 proportions
  - Colour gradient along each curve interpolated per segment from the Imprint sequential
    ramp (t.seq, green at t start to blue at t end), identical in both themes, with
    a footer gradient key that names t
  - Start dot and arrowhead sit on each curve's true first and last sample, labelled
    with their t values; page-coloured outlines keep the closed Lissajous curve's
    coinciding start and end both visible
  - Composes ChartsContainer, ChartsGrid and ChartsXAxis/ChartsYAxis with a custom
    SVG layer that reads useXScale/useYScale/useDrawingArea, the MUI X composition
    API for marks the stock series do not offer
  - 800 samples per curve render the Lissajous self-intersections and the spiral centre
    without visible polygon corners
  - 'Clear typographic hierarchy: title, subtitle, per-panel formula titles and sample/t-range
    captions, all theme tokens'
  weaknesses:
  - 'Suggestion: the Lissajous start and end labels both sit on the y = 0 line beside
    the centre; placing one above and one below would make the shared point read less
    crowded.'
  - 'Suggestion: a few small direction ticks along the Lissajous figure would make
    the traversal through its self-intersections easier to follow beyond the colour
    gradient.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white, matches #FAF8F1.
      Chrome: title "line-parametric · javascript · muix · anyplot.ai" top left, subtitle "2 curves · 1,600 samples · equal aspect ratio in each panel"; two panels titled "Lissajous figure: x = sin 3t, y = sin 2t" and "Archimedean spiral: x = t cos t, y = t sin t", each with a caption of sample count and t range; axis titles x(t)/y(t), tick labels in dark soft ink; subtle grey grid; footer gradient key "Colour along each curve: t at the start → t at the end". All text readable.
      Data: Lissajous figure (3 lobes wide, 2 tall) and a two-turn Archimedean spiral, each a 3.5 px line coloured from brand green #009E73 at t start to blue #4467A3 at t end; green start dot and blue arrowhead with labels "start, t = 0.00", "end, t = 6.28" (coinciding at the Lissajous centre) and "end, t = 12.57" at (12.57, 0) on the spiral, with thin leader lines. Equal aspect ratio in both panels.
      Legibility verdict: PASS

