review:
  strengths:
  - coord_fixed on both panels keeps the spiral's turns round and the Lissajous proportions
    true
  - gggrid composes the two panels under one ggtitle and ggsize
  - layer_tooltips with a formatted t line gives the HTML a readable parameter readout
  - Closed Lissajous gets only a start circle; the open spiral gets a start circle
    and an end triangle on its true last point
  weaknesses:
  - 'VQ-07 (both): the t gradient is a two-stop #009E73 to #4467A3 ramp, identical
    in both themes, not imprint_seq → the marks stops of each theme ((0, #009E73),
    (0.338, #4467A3), (1, #002850) on light; (0, #007755), (0.32, #009E73), (1, #CDD9FF)
    on dark) sampled with ramp_color into scale_color_gradientn. Likely cause: scale_color_gradient(low=GRAD_LOW,
    high=GRAD_HIGH).'
  - 'CQ-01 (code): the data is generated in two # Data blocks (lines 28-34) with the
    theme defined inside, no column constants for t, x, y, and the plots read df_lissajous/df_spiral
    with typed column names ''x'', ''y'', ''t'' → one Data block ending in one tidy
    df with a curve column, column constants with # role: comments above it, plots
    derived from df. Likely cause: per-curve DataFrames built inline.'
  - 'Suggestion: the start circle at the Lissajous origin could be a little larger
    to stand out at the crossing point.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, not pure white.
      Chrome: bold title 'line-parametric · python · letsplot · anyplot.ai' top left in near-black; bold panel titles 'Lissajous Figure · 3:2 frequency ratio, closed' and 'Archimedean Spiral · expanding outward'; formula axis titles x(t) = sin(3t), y(t) = sin(2t), x(t) = t·cos(t), y(t) = t·sin(t); tick and colorbar labels in INK_SOFT; subtle solid grid; colorbars 't (rad)' on an elevated box. All readable.
      Data: Lissajous (left) and two-turn Archimedean spiral (right), 1000-point paths with equal aspect, colored by t with a two-stop gradient #009E73 to #4467A3; green start circle at the Lissajous origin and the spiral center, blue end triangle at the spiral's last point (12.57, 0).
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17, not pure black.
      Chrome: title, panel titles and axis titles in light ink, ticks and colorbar labels in light grey; grid subtle; colorbar boxes on #242420. No dark-on-dark text.
      Data: the same two-stop #009E73 to #4467A3 gradient as on light, unchanged for the dark theme; curves and markers visible on the dark page.
      Legibility verdict: PASS
