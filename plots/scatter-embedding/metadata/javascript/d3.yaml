review:
  strengths:
  - Correct Imprint palette canonical order with brand green first; both renders confirmed
    theme-correct (background, text, halo boxes all flip correctly, data colors identical)
  - Deterministic seeded RNG; per-cluster covariance (elongation + rotation) makes
    clusters look like genuine t-SNE output instead of uniform circles
  - 'Full spec compliance: alpha-blended markers for overlap, centroid labels with
    legible halo, subtitle with algorithm + parameter, axis titles present with tick
    labels correctly omitted'
  - Clean minimal-scatter execution -- all spines/grid/ticks removed, generous whitespace,
    legend well separated from the plot
  - Solid idiomatic modern D3 (.join(), scaleOrdinal, d3.mean/d3.extent) and correct
    mount-node/theme-token contract usage
  weaknesses:
  - Legend swatch opacity (0.85) doesn't match data-point opacity (0.62) -- align
    them for visual consistency
  - Centroid halo boxes overlap directly on top of dense point clusters, partially
    hiding markers beneath -- consider nudging labels slightly outside the densest
    region or increasing halo opacity/contrast
  - For 6 categorical series (the style guide's borderline zone), no marker-shape/linestyle
    redundancy was added beyond the text labels -- a subtle secondary encoding would
    strengthen accessibility further
  - Significant point overlap between adjacent clusters (notably Technology/Finance)
    blurs the boundary -- slightly increasing inter-cluster center distance or reducing
    spread would read cleaner while still looking organic
  - 'Library-mastery opportunity left on the table: no use of D3-distinctive features
    like d3-contour/convex-hull cluster outlines or quadtree-based label placement'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 -- not pure white.
      Chrome: Bold dark title, gray subtitle, gray axis titles (no tick labels), dark centroid labels on light halo boxes, legend with dark cluster-name text -- all clearly readable against the light background.
      Data: Six clusters colored in canonical Imprint order -- Technology=#009E73 (brand green, first series), Sports=lavender, Politics=blue, Health=ochre, Finance=matte red, Entertainment=cyan. Moderate marker size (r=5.5) with alpha 0.62 for overlap handling.
