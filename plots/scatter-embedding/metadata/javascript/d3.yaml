      Chrome: Title/subtitle/axis titles/legend text all flip to light tones; centroid halo boxes flip to dark elevated fill with white text. No dark-on-dark failures observed.
      Data: Same six cluster colors as light render, confirmed identical -- only chrome flipped.
      Legibility verdict: PASS
