review:
  strengths:
  - 'Fixed the attempt-1 VQ-04 gap with a genuine redundant-encoding pass: all 8 clusters
    now use distinct pointStyle shapes (circle, triangle, rect, rectRot, star, crossRot,
    rectRounded, cross) mapped 1:1 to clusters, so identity no longer depends on hue
    alone at the CVD discrimination floor'
  - Native Chart.js plugin (afterDatasetsDraw) draws halo-stroked centroid labels
    directly on the canvas — a distinctive, idiomatic use of the plugin API (not a
    community plugin) that gives every cluster a direct label instead of relying solely
    on the legend
  - 'Correct Imprint palette in canonical order, first series is brand green #009E73,
    data colors pixel-identical between light and dark renders'
  - 'Strong biological realism: cluster placement mirrors real immunology relationships
    (T/B/NK lymphocytes near each other, myeloid types Monocytes/Dendritic cells/Neutrophils
    grouped, Erythrocytes/Platelets non-leukocyte types grouped)'
  - 'Clean, idiomatic Chart.js implementation: deterministic seeded LCG for data generation,
    theme tokens threaded through every chrome element, animation disabled, correct
    mount-node handling'
  - Correctly hides axis tick labels per the spec's guidance that embedding coordinates
    aren't directly interpretable, while keeping descriptive UMAP 1 / UMAP 2 axis
    titles
  - Title and subtitle exactly match spec conventions; subtitle communicates algorithm
    and key hyperparameters
  weaknesses:
  - Centroid labels sit directly on top of dense point clouds (e.g. 'T cells', 'Platelets');
    the halo stroke keeps them fully readable, but strictly this is text-over-data
    overlap — nudging label anchors slightly outside the densest region (or increasing
    the halo offset) would be a small polish gain
  - Grid still forms a full boxed rectangle (both axes' grid lines visible on all
    four sides) rather than a more minimal single-axis or no-grid treatment — a further
    visual-refinement pass could drop or soften the top/right-adjacent grid lines
    for an even cleaner look
  - Marker size (pointRadius 4) is adequate but not standout for ~640 total points
    — slightly larger sparse-cluster markers or a touch more alpha contrast between
    overlapping points could sharpen element visibility further
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white, not dark.
      Chrome: Title "PBMC Cell Types · scatter-embedding · javascript · chartjs · anyplot.ai" in dark ink at top, clearly legible, comfortably inside the canvas with margin (no clipping). Italic subtitle "UMAP projection (n_neighbors=15, min_dist=0.1)" beneath it. "UMAP 1"/"UMAP 2" axis titles in dark ink; tick labels intentionally hidden per spec. Right-side legend lists all 8 cluster names with point-style-matched swatches (circle/triangle/square/diamond/star/x/rounded-square/plus), fully inside the canvas with margin to the right edge. Subtle grid visible on both axes. Halo-outlined centroid labels ("T cells", "B cells", "NK cells", "Monocytes", "Dendritic cells", "Neutrophils", "Erythrocytes", "Platelets") are drawn directly over each cluster and remain fully readable against both the cream background and the semi-transparent data points beneath them.
      Data: 8 clusters of ~80 points each in exact Imprint canonical order (T cells #009E73 brand green first, then B cells, NK cells, Monocytes, Dendritic cells, Neutrophils, Erythrocytes, Platelets), semi-transparent (alpha≈0.65), radius 4, each cluster using a distinct point-style shape (redundant encoding beyond hue alone).
      Legibility verdict: PASS — all text readable against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black, not light.
      Chrome: Same title/subtitle/axis-title/legend/centroid-label layout with text and halo strokes switched to the dark-theme tokens, fully legible against the dark background — no dark-on-dark failures anywhere. Grid lines remain subtle but visible. Centroid label halos use the dark page background so they stay crisp against both the surface and the data points.
      Data: Colors are pixel-identical to the light render (same 8 hues in the same canonical order, same point-style shapes) — only chrome (background, text, grid, legend, centroid-label halo) flipped, confirming the palette and shape encoding are theme-independent.
      Legibility verdict: PASS — all text readable against the dark background, no dark-on-dark issues.
