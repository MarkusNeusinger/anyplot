review:
  strengths:
  - 'Correct Imprint palette in canonical order (positions 1-8), first series is brand
    green #009E73, identical data colors between light and dark renders'
  - 'Strong biological realism: cluster placement mirrors real immunology relationships
    (T/B/NK lymphocytes clustered near each other, Monocytes/Dendritic cells/Neutrophils
    myeloid types clustered near each other, Erythrocytes/Platelets non-leukocyte
    types grouped together), plus realistic outlier noise points'
  - 'Clean, idiomatic Chart.js implementation: deterministic seeded LCG for data generation,
    theme tokens threaded through every chrome element, animation disabled, correct
    mount-node handling'
  - Correctly hides axis tick labels per the spec's guidance that embedding coordinates
    aren't directly interpretable, while keeping descriptive 'UMAP 1' / 'UMAP 2' axis
    titles
  - Alpha=0.65 blending with moderate pointRadius=4 appropriately handles overlap
    for ~640 points across 8 clusters
  - Title and subtitle exactly match spec conventions; subtitle communicates algorithm
    and key hyperparameters (n_neighbors, min_dist)
  weaknesses:
  - 8 series rely on hue alone at the CVD discrimination floor (ΔE_CVD ≈ 8.81 per
    the style guide's Color Restraint table, which requires redundant encoding at
    n=8) — add distinct pointStyle shapes per cluster, or annotate cluster centroids
    with their label text (the spec explicitly allows this), so identity doesn't depend
    solely on matching color swatches in the legend
  - Library Mastery is fairly generic scatter-with-multiple-datasets usage beyond
    the subtitle plugin and usePointStyle legend — consider a more distinctive touch
    such as per-cluster centroid label annotations or varied pointStyle shapes (also
    fixes the VQ-04 gap above)
  - Design Excellence is solid but not exceptional — grid/border refinement and whitespace
    are good but default-adjacent; centroid annotations would also sharpen data storytelling
    (DE-03) by giving the viewer an explicit anchor per cluster instead of relying
    only on legend lookup
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Title "PBMC Cell Types · scatter-embedding · javascript · chartjs · anyplot.ai" in dark ink, clearly legible, occupies roughly half the canvas width (no clipping, no overflow). Italic subtitle "UMAP projection (n_neighbors=15, min_dist=0.1)" beneath it in softer ink. "UMAP 1" / "UMAP 2" axis titles in dark ink; axis tick labels intentionally hidden per spec. Legend on the right lists all 8 cluster names with circular color swatches, fully inside the canvas with margin to the right edge. Grid lines subtle, both axes, visible but not competing with data.
      Data: 8 clusters of ~80 points each, colored in exact Imprint canonical order — T cells #009E73 (brand green, first series), B cells lavender, NK cells blue, Monocytes ochre, Dendritic cells matte red, Neutrophils cyan, Erythrocytes rose, Platelets lime — each point semi-transparent (alpha ≈0.65) with radius 4, giving clear cluster shapes with visible internal density and a few realistic scattered outliers.
      Legibility verdict: PASS — all text is clearly readable against the light background, no near-white-on-cream issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Same title/subtitle/axis-title/legend layout, all text switched to light ink (white/light-gray), fully legible against the dark background. No dark-on-dark text anywhere. Grid lines subtle and still visible.
      Data: Colors are pixel-identical to the light render (same 8 hues in the same canonical order) — only the chrome (background, text, grid, legend swatBackground) flipped, confirming the palette is theme-independent as required.
      Legibility verdict: PASS — all text reads clearly on the dark surface, no dark-on-dark failures observed.
