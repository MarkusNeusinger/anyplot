review:
  strengths:
  - 'All four Attempt-1 weaknesses are directly and verifiably fixed: the four-sided
    axis box is gone (axisLine/splitLine now show:false on both axes, a true minimal
    frame), centroid labels are nudged above each cluster core and sit on a solid
    background pill (t.elevatedBg) instead of relying on a text-shadow halo, a 26-point
    silent ''noise'' series adds realistic inter-cluster scatter, and per-cluster
    z-ordering (sorted by descending n) plus density-scaled opacity give the markers
    deliberate, non-default treatment.'
  - 'Correct Imprint palette in canonical order with brand green #009E73 pinned to
    the first-listed series (T cells) via t.palette[idx] indexed on the original array
    position, not render order — both renders are theme-correct (light #FAF8F1 chrome/dark
    ink, dark #1A1A17 chrome/light ink) with identical data hues.'
  - Deterministic, reproducible synthetic data (fixed-seed LCG + Box-Muller gaussian)
    modeling a realistic, neutral single-cell RNA-seq scenario (8 immune cell types)
    with per-cluster variation in shape (elongation/rotation), density, and point
    count.
  - 'All spec-required details present: subtitle notes algorithm and parameters (''UMAP
    (n_neighbors=15, min_dist=0.1)''), axis tick labels correctly hidden since embedding
    coordinates aren''t directly interpretable, descriptive axis names, mandated title
    format, direct centroid labels providing redundant (non-color) encoding at n=8
    categories.'
  - Density-aware marker opacity (denser clusters render slightly more transparent,
    sparser clusters bolder) is a genuine, well-reasoned ECharts-specific refinement
    rather than one flat alpha for every series.
  weaknesses:
  - Still relies on the default canonical Imprint color order and plain circular markers
    as the base treatment; the added polish (opacity/z-order/border) is real but incremental
    rather than a distinctive marker language (e.g. varied symbol shapes or size-encoded
    cluster confidence).
  - Legend swatches and text use library defaults (itemWidth 12/itemHeight 12/circle
    icon) with no further refinement — fine, but a missed opportunity for extra visual
    cohesion with the pill-styled centroid labels.
  - 'CQ-01 KISS: three small helper functions (rnd, gauss, densityOpacity) are needed
    since the browser lacks a seeded RNG, so the script isn''t a single flat sequence
    of statements — justified by the runtime constraint, not a real flaw.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "scatter-embedding · javascript · echarts · anyplot.ai" in bold dark text (~34% of plot width, comfortably short), subtitle "UMAP (n_neighbors=15, min_dist=0.1) · colored by cell type" in softer gray beneath it — both centered and fully legible. Axis names "UMAP dimension 1" / "UMAP dimension 2" in muted gray; no tick labels (correct per spec, since embedding coordinates aren't directly interpretable). No axis lines or box border — a genuinely minimal frame. Vertical legend at right lists all 8 cell types in dark text with circular color swatches, cleanly separated from the plot area. All chrome text is clearly readable against the light background.
      Data: 8 distinct elliptical clusters of scatter points in Imprint palette hues, canonical order (T cells = brand green #009E73, B cells = lavender, NK cells = blue, Monocytes = ochre, Dendritic cells = matte red, Neutrophils = cyan, Erythrocytes = rose, Platelets = lime-green). Small gray "noise" points are visible scattered between clusters (e.g. between T/B cells and between Neutrophils/Erythrocytes), adding realistic projection noise. Each cluster has a bold centroid text label on a light pill background, nudged above the densest core so it doesn't sit directly on top of markers. Sparser clusters (Platelets, Dendritic cells) render cleanly on top of larger neighbors thanks to density-based z-ordering.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Same title/subtitle now rendered in white/off-white text, fully readable against the dark background. Axis names in muted light-gray, same minimal (borderless) frame. Legend switches to light-colored text with the same color swatches, still cleanly separated from data. No dark-on-dark or hard-to-read text anywhere.
      Data: Identical cluster colors and positions to the light render — confirmed the 8 categorical hues (green, lavender, blue, ochre, matte red, cyan, rose, lime) and the gray noise points are unchanged; only chrome (background, text, legend) flipped to the dark theme. Centroid labels now sit on a dark pill with light text, still clearly legible over the marker fill, with the same nudge-above-centroid placement as the light render.
      Legibility verdict: PASS
