review:
  strengths:
  - 'Correct Imprint palette in canonical order with brand green #009E73 as the first
    series; both renders are theme-correct (light #FAF8F1 chrome dark-ink text, dark
    #1A1A17 chrome light-ink text) with identical data colors.'
  - At n=8 categorical series, the style guide requires direct labels per series or
    small multiples — the silent centroid-label scatter series satisfies exactly this
    requirement, a smart accessibility-aware design choice.
  - Deterministic, reproducible synthetic data (fixed-seed LCG + Box-Muller gaussian)
    modeling a realistic, neutral single-cell RNA-seq scenario (8 immune cell types)
    with per-cluster variation in shape (elongation/rotation), density, and point
    count.
  - 'Spec-required details present: subtitle notes algorithm and key parameters (''UMAP
    (n_neighbors=15, min_dist=0.1)''), axis tick labels correctly hidden since embedding
    coordinates aren''t directly interpretable, descriptive axis names, correct mandated
    title format.'
  - Moderate marker size (11) with alpha=0.65 and thin border reasonably handles overlapping
    points in dense cluster regions.
  weaknesses:
  - Grid renders as a full four-sided box (axisLine + boundary splitLine on all sides)
    rather than the style guide's default L-shaped or minimal frame — remove/lighten
    the top and right boundary lines for a cleaner, more refined look.
  - Centroid text labels sit directly on top of dense data points (e.g. 'T cells',
    'B cells', 'Monocytes') and rely only on a soft text-shadow halo for legibility
    — consider offsetting labels slightly from the densest point cluster or adding
    a subtle background pill for stronger separation from the marker fill.
  - Design relies on the palette's default canonical color order and default circular
    markers with no additional refinement (e.g. varied marker treatment, more deliberate
    z-ordering/layering, subtler legend swatch styling) to push past a well-configured
    default look toward genuine polish.
  - Clusters are visually clean/artificial with little of the point-level noise or
    stray outliers real UMAP/t-SNE projections typically show — a few scattered noise
    points between clusters would strengthen realism (DQ-01).
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "scatter-embedding · javascript · echarts · anyplot.ai" in bold dark text, subtitle "UMAP (n_neighbors=15, min_dist=0.1) · colored by cell type" in softer gray beneath it. Axis names "UMAP dimension 1" / "UMAP dimension 2" in muted gray, no tick labels (correct per spec). Vertical legend at right lists all 8 cell types in dark text with color swatches. Subtle gray gridlines on both axes forming a full box border around the plot area. All chrome text is clearly legible against the light background.
      Data: 8 distinct elliptical clusters of scatter points, each a different Imprint palette hue in canonical order (T cells = brand green #009E73, B cells = lavender, NK cells = blue, Monocytes = ochre, Dendritic cells = matte red, Neutrophils = cyan, Erythrocytes = rose, Platelets = lime). Each cluster has a bold centroid text label with a soft light halo overlaid on the points. Clusters vary in shape (elongation/rotation), size, and point density, with some realistic partial overlap between adjacent clusters (e.g. T cells/B cells, Erythrocytes/Neutrophils).
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title/subtitle now rendered in light/off-white text, fully readable against the dark background. Axis names in muted light-gray. Legend text switches to light-colored text with the same color swatches. Gridlines are faint light-gray on dark, still forming the same full box border. No dark-on-dark text anywhere — all chrome elements clearly legible.
      Data: Identical cluster colors and positions to the light render — confirmed the 8 categorical hues (green, lavender, blue, ochre, matte red, cyan, rose, lime) are unchanged; only the chrome (background, text, grid, legend) flipped to the dark theme. Centroid labels now use a dark halo against the light label text, still legible over the data points.
      Legibility verdict: PASS
