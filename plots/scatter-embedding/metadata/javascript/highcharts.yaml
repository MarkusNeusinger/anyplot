review:
  strengths:
  - Marker radius increased from 4px to 6px CSS (per the prior review's VQ-03 feedback)
    — points now read as clearly more prominent for the 600-point plot, at both desktop
    and mobile scale
  - 'Imprint palette used in exact canonical order (green → lavender → blue → ochre
    → matte red) across all 5 clusters, first series correctly #009E73'
  - Distinct marker symbols per cluster (circle, diamond, triangle, square, triangle-down)
    provide redundant shape encoding alongside color
  - Theme-adaptive chrome remains fully correct in both renders — no dark-on-dark
    or light-on-light failures, identical data colors between light and dark
  - Deterministic LCG-seeded data generation (seed=42), clean single-purpose code
    with no fake interactivity
  - Subtitle correctly states the algorithm and key parameter ('UMAP projection (n_neighbors=15)');
    tick labels correctly disabled on both axes per the spec's guidance
  weaknesses:
  - 'Centroid data labels still sit directly on top of the densest part of each cluster
    in both themes — the attempted fix (dataLabels.y: -16, verticalAlign: ''bottom'')
    only nudges the label 16px and does not move it clear of the point cloud. Zoomed
    crops of the ''Shipping'' label show marker diamonds with visible bites taken
    out of them where the opaque text + textOutline halo sits directly on top of markers,
    hiding data underneath. This is the same weakness flagged in the previous review
    and is not meaningfully resolved. Fix: anchor each label outside the cluster''s
    bounding box (e.g., above the cluster''s max-y with a thin connector line/leader,
    or push further via a fixed pixel offset computed per-cluster) rather than a small
    offset from the centroid itself.'
  - Library Mastery is still generic — marker-shape-per-series and a label-only overlay
    series are useful but not deeply Highcharts-distinctive; the previous review's
    suggestion to lean into a more distinctive Highcharts capability (e.g. a richer
    tooltip formatter with per-cluster stats, dataLabels overlap-avoidance via allowOverlap:false
    + a smarter layout engine, or series-level boost) was not adopted in this revision.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 - not pure white, not dark.
      Chrome: Title "scatter-embedding · javascript · highcharts · anyplot.ai" in bold dark ink, subtitle "UMAP projection (n_neighbors=15) of support-ticket embeddings, colored by topic cluster" in softer gray, both clearly legible and not clipped at the top edge. Axis titles "UMAP Dimension 1" / "UMAP Dimension 2" in soft dark gray, similarly sized and balanced. No tick labels on either axis (intentional per spec). Grid lines are thin and subtle. Legend at the bottom lists all 5 cluster names in dark, readable text with matching colored/shaped swatches, not isolated from the plot.
      Data: Five clearly separated clusters - "Billing" (green circles, top-left), "Shipping" (lavender diamonds, top-right), "Product Quality" (blue triangles, center), "Account Access" (ochre squares, bottom-left), "Returns" (red inverted-triangles, bottom-right). First series is #009E73 brand green. Marker radius is visibly larger than the prior attempt (now prominent, not sparse-looking). Each cluster is labeled directly on the plot in bold dark text with a light halo/outline for contrast, but the label bounding box sits inside the densest part of each cluster and visibly covers/hides several markers underneath it (confirmed via zoomed crop on "Shipping" - partial diamond fragments are visible poking out from behind the text, meaning full markers are occluded).
      Legibility verdict: PASS - all text itself is clearly readable against the light background, no light-on-light issues. (Note: the overlap is text-over-data, not text-over-text, and is scored under VQ-02.)

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 - not pure black, not light.
      Chrome: Title and subtitle render in white/light-gray, fully legible against the dark background. Axis titles and legend text are light gray, matching the theme. Grid lines remain thin and subtle, in a light, low-opacity tone. No dark-on-dark failures observed - title, subtitle, axis titles, legend, and centroid labels are all clearly visible.
      Data: Identical cluster colors and shapes to the light render (#009E73 green, lavender, blue, ochre, matte red) - confirms data colors are held constant across themes and only chrome flipped. The same centroid-label-over-marker overlap issue is present here too (confirmed via zoomed "Shipping" crop) - the white text + dark halo sits on top of and hides diamond markers directly beneath it.
      Legibility verdict: PASS - all text itself is clearly readable against the dark background, no dark-on-dark failures found. (Overlap issue is the same as light render, scored under VQ-02.)
