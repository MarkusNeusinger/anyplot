review:
  strengths:
  - Imprint palette used in exact canonical order (green → lavender → blue → ochre
    → matte red) across all 5 clusters, with the brand green correctly first and the
    semantic red landing naturally on the 'Returns' category
  - Distinct marker symbols per cluster (circle, diamond, triangle, square, triangle-down)
    provide redundant shape encoding alongside color, following the style guide's
    recommendation for 5-6 category series
  - Cluster centroids are labeled directly on the plot with text-outline for contrast,
    giving an at-a-glance read without requiring the legend, satisfying the spec's
    optional centroid-annotation note
  - Theme-adaptive chrome is fully correct in both renders — no dark-on-dark or light-on-light
    failures, identical data colors between light and dark
  - Deterministic LCG-seeded data generation (seed=42), clean single-purpose code
    with no fake interactivity
  - Subtitle correctly states the algorithm and key parameter ('UMAP projection (n_neighbors=15)')
    as required by the spec
  - Tick labels correctly disabled on both axes per the spec's guidance that embedding
    coordinates are not directly interpretable, while axis titles remain descriptive
  weaknesses:
  - Centroid data labels sit directly on top of the densest part of each cluster (e.g.
    'Billing', 'Account Access') — the text-outline keeps them legible but the label
    bounding box still visually competes with and partially covers the underlying
    markers; offset the label slightly above/away from the cluster's densest region
    or add a small halo/padding to reduce competition with the data
  - Scatter marker radius (4px CSS → ~8 device px) is on the small side for a 600-point
    plot at the low end of the spec's 500-5000 point range — bump to ~5-6px radius
    per the highcharts sizing guide so points read as more prominent, especially at
    mobile scale
  - Library Mastery is solid but generic — marker-shape-per-series and a label-only
    overlay series are useful but not deeply Highcharts-distinctive; consider leaning
    further into a Highcharts-specific capability (e.g. a richer tooltip formatter,
    series-level zoom/selection config) to push Library Mastery higher
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 - not pure white, not dark.
      Chrome: Title "scatter-embedding · javascript · highcharts · anyplot.ai" in bold dark ink, subtitle "UMAP projection (n_neighbors=15) of support-ticket embeddings, colored by topic cluster" in softer gray, both clearly legible. Axis titles "UMAP Dimension 1" / "UMAP Dimension 2" in soft dark gray, similarly sized and balanced. No tick labels on either axis (intentional per spec, since embedding coordinates are not directly interpretable). Grid lines are thin and subtle, visible without competing with data. Legend at the bottom lists all 5 cluster names in dark, readable text with matching colored/shaped swatches.
      Data: Five clearly separated clusters - "Billing" (green circles, top-left), "Shipping" (lavender diamonds, top-right), "Product Quality" (blue triangles, center), "Account Access" (ochre squares, bottom-left), "Returns" (red inverted-triangles, bottom-right). First series is #009E73 brand green. Each cluster is labeled directly on the plot in bold dark text with a light halo/outline for contrast against the markers behind it. Point density and spread vary realistically across clusters, with a few outlier points scattered outside the main cluster bodies.
      Legibility verdict: PASS - all text is clearly readable against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 - not pure black, not light.
      Chrome: Title and subtitle now render in white/light-gray, fully legible against the dark background. Axis titles and legend text are light gray, matching the theme. Grid lines remain thin and subtle, now in a light, low-opacity tone. No dark-on-dark failures observed anywhere - title, subtitle, axis titles, legend, and centroid labels are all clearly visible.
      Data: Identical cluster colors and shapes to the light render (#009E73 green, lavender, blue, ochre, matte red) - confirms data colors are held constant across themes and only chrome flipped. Centroid labels render in white text with a dark halo, legible against both the dark background and the underlying markers.
      Legibility verdict: PASS - all text is clearly readable against the dark background, no dark-on-dark failures found.
