review:
  strengths:
  - 'Correct Imprint palette in canonical order (T cells = #009E73 brand green through
    Neutrophils = lime), with identical data colors across both renders and only chrome
    flipping between themes'
  - Centroid label annotations (color-matched text on an elevated-bg chip, positioned
    live via useXScale/useYScale) implement the redundant color+text encoding the
    style guide recommends at n=8 series, letting a viewer identify each cluster without
    cross-referencing the legend
  - Title format, subtitle (algorithm + key parameter), and axis labels exactly match
    the spec -- tick labels correctly omitted since UMAP/t-SNE coordinates carry no
    interpretable units
  - Deterministic seeded LCG data generation, clean single-purpose imports, skipAnimation
    set, default-exported component -- solid MUI X harness compliance
  - No edge clipping in either render -- verified pixel-level at all four canvas borders
    in both light and dark PNGs
  weaknesses:
  - Title occupies only ~32% of canvas width (measured pixel bounding box), notably
    below the ~50-70% target for the mandated title format -- increase the title fontsize
    (e.g. 22px to ~28px CSS) for stronger visual hierarchy against the 3200px-wide
    canvas
  - All 8 clusters use identical point count (80) and identical spread (SPREAD=1.7),
    so every cluster looks the same size and tightness -- vary spread and point density
    per cluster (looser for some, tighter for others) to better reflect how real UMAP/t-SNE
    embeddings show clusters of differing compactness, which also improves data feature-coverage
  - Cluster cores are moderately dense with overlapping markers at alpha 0.68 -- a
    touch more transparency or a slightly smaller marker in the densest cluster centers
    would keep individual points more distinguishable
  - Design Excellence is solid (centroid labels, clean chrome removal) but not yet
    publication-level -- consider adding a stronger focal point (e.g. subtle emphasis
    on one or two clusters via size/alpha) to push data storytelling further
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1-consistent), no pure-white areas -- correct.
      Chrome: Title "scatter-embedding · javascript · muix · anyplot.ai" and subtitle "UMAP (n_neighbors=15) · synthetic single-cell RNA-seq embedding" render in dark ink, clearly legible. "UMAP dimension 1" / "UMAP dimension 2" axis labels are dark, similarly sized, and legible; no tick labels (correct per spec, since embedding coordinates are not directly interpretable). Legend on the right lists all 8 cluster names in dark ink with color swatches, clearly readable and not clipped against the right canvas edge. 8 translucent centroid-label chips (near-white boxes) sit inside each cluster with bold text colored to match that cluster's series color -- all legible against their chip background (verified via pixel crop for the lightest palette entries: lime "Neutrophils", ochre "NK cells", cyan "Platelets" -- all readable with adequate contrast).
      Data: 8 clusters of small circular markers arranged in a loose S-curve across the canvas (T cells, B cells, Monocytes, NK cells, Dendritic cells, Platelets, Erythrocytes, Neutrophils), first series (T cells) rendered in brand green #009E73. Markers use ~68% alpha, appropriate for the ~80-points-per-cluster density, with visible overlap only in the densest cluster cores.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17-consistent), no pure-black areas -- correct.
      Chrome: Title and subtitle render in light ink (near-white / soft grey), clearly legible against the dark background. Axis labels and legend text are light-colored and legible; no dark-on-dark or light-on-light failures observed anywhere, including inside the centroid-label chips (dark near-black chip fill, cluster-colored bold text -- verified via pixel crop for lime, ochre, and cyan clusters, all readable).
      Data: Identical marker colors and layout to the light render -- confirmed pixel-for-pixel palette match (same 8 hues, same brand-green first series, same alpha and marker sizing). Only the chrome (background, title/label/tick/legend/chip colors) flipped to the dark-theme tokens.
      Legibility verdict: PASS
