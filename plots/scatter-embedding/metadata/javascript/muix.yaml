review:
  strengths:
  - Composes the chart from MUI X v9 building blocks (ChartsDataProvider, ChartsWrapper,
    ChartsLegend, ChartsSurface, ScatterPlot) and adds the centroid-label layer as
    a custom SVG child that reads the chart's own scales through useXScale/useYScale,
    so the labels sit exactly on the computed centroids
  - Centroid labels (an option the Notes offer) are drawn as chips outlined in each
    cluster's color with a page-colored text halo, legible against the points in both
    themes and matching the legend
  - 'Imprint palette in canonical order with T cells on #009E73; data colors identical
    in both renders, chrome flips cleanly via theme tokens'
  - Embedding axes carry no ticks, tick labels or axis lines, as the spec asks, while
    the axis titles still name the dimensions
  - Subtitle names the algorithm and parameter (UMAP, n_neighbors = 15) plus n and
    the group count
  - Eight simulated PBMC cell types of different size and spread, with a few points
    stranded across neighboring groups, a plausible single-cell scenario
  - Marker opacity set through the v9 class selector .MuiScatterChart-marker; skipAnimation
    set; deterministic LCG data
  weaknesses:
  - 'Suggestion: the legend sits about 150 px right of the outermost points; tightening
    LEGEND_WIDTH or the right margin would let the point cloud use a little more width.'
  - 'Suggestion: the centroid chip width is estimated from LABEL_CHAR_WIDTH; measuring
    the rendered text would make the chips fit labels exactly if a user swaps in longer
    cluster names.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole canvas, no white panel.
      Chrome: bold dark title "scatter-embedding · javascript · muix · anyplot.ai" centered at the top, grey subtitle "UMAP (n_neighbors = 15) · n = 580 · coloured by cell type (8 groups)"; axis titles "UMAP dimension 1" (bottom) and "UMAP dimension 2" (rotated, left) in soft ink; no ticks, tick labels, axis lines or grid. Vertical legend on the right with eight circle swatches and dark labels. All text readable.
      Data: 580 semi-transparent circles in eight clusters — T cells #009E73 (first series), B cells purple, Monocytes blue, NK cells ochre, Dendritic cells red, Platelets cyan, Erythrocytes magenta, Neutrophils olive. Each cluster carries a centroid chip outlined in its color with bold dark text. Clusters differ in size and spread; T cells and Erythrocytes touch, with a few stray points.
      Legibility verdict: PASS

