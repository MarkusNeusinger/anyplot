review:
  strengths:
  - 'Uses the v9 composition API idiomatically: ChartsDataProvider + ChartsWrapper
    + ChartsSurface with ChartsXAxis/ChartsYAxis/ScatterPlot, the HTML ChartsLegend
    outside the SVG, and a custom SVG layer (CentroidLabels) placed through the useXScale/useYScale
    hooks so the centroid labels sit exactly at the data-space centroids'
  - 'Eight cell types in Imprint order (T cells in #009E73 first), each neighbouring
    group distinguishable in both themes, with identical data colours across light
    and dark'
  - 580 points of unequal group size and compactness at their generated coordinates
    (no jitter), markerSize 5 with fillOpacity 0.62 so dense cores read darker
  - Subtitle names the algorithm and its key parameter (UMAP, n_neighbors = 15) plus
    n and group count, in a clear title/subtitle hierarchy
  - Tick labels, ticks and axis lines removed as the spec asks; only the descriptive
    'UMAP dimension 1/2' axis titles remain
  - Centroid label pills outlined in each cluster's colour tie the labels to the legend
    and stay legible on the points in both themes
  - Deterministic LCG + Box-Muller data generation, skipAnimation set, chart sized
    to window.ANYPLOT_SIZE; native MUI X tooltips/highlighting in the HTML output
  weaknesses:
  - 'VQ-02 (both): the near-opaque centroid label boxes (fillOpacity 0.88, about 120×28
    px) sit on the densest part of each cluster and hide its core points, most visibly
    on the small Platelets cluster, where the box covers most of the dense centre,
    and on Dendritic cells → let the core show through (box fill opacity around 0.6
    or a text halo instead of a filled box). Likely cause: the <rect> in CentroidLabels
    with fill t.elevatedBg and fillOpacity 0.88.'
  - 'Suggestion: the legend sits about 150 px clear of the Neutrophils cluster with
    a wide empty band; a narrower LEGEND_WIDTH would give the embedding more width.'
  - 'Suggestion: a slightly larger title (about 24–26 px) would give the header more
    weight against the 16 px subtitle.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole canvas, no white panel.
      Chrome: bold dark title "scatter-embedding · javascript · muix · anyplot.ai" centred at top, grey subtitle "UMAP (n_neighbors = 15) · n = 580 · coloured by cell type (8 groups)"; axis titles "UMAP dimension 1" (bottom) and "UMAP dimension 2" (left, rotated) in soft ink; no ticks, tick labels, axis lines or grid; vertical legend at the right with eight coloured dots and dark labels. All readable.
      Data: 580 semi-transparent dots in eight clusters of differing size and spread — T cells #009E73 (first series), B cells lilac, Monocytes blue, NK cells ochre, Dendritic cells red, Platelets cyan, Erythrocytes plum, Neutrophils olive. Each cluster has a rounded label pill at its centroid, outlined in the cluster colour, dark bold text on a near-opaque light fill; the pills hide some core points (most visibly Platelets).
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title in light ink, subtitle and axis titles in light soft ink, legend labels light — no dark-on-dark text anywhere.
      Data: identical cluster colours and positions to the light render; dots slightly dimmer due to alpha over the dark page but all groups distinct, brand green T cells clearly visible. Centroid pills switch to a dark elevated fill with light text, still outlined in cluster colours.
      Legibility verdict: PASS
