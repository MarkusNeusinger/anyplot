      Background: warm near-black #1A1A17.
      Chrome: title in light ink, subtitle and axis titles in light soft grey, legend labels light; no dark-on-dark text anywhere.
      Data: same eight colors in the same order as the light render (only chrome flipped); centroid chip text is light with a dark halo and reads clearly over the points.
      Legibility verdict: PASS
