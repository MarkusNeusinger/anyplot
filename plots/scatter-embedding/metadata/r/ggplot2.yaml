review:
  strengths:
  - 'Both attempt-1 weaknesses are fixed: the unused `library(dplyr)` import is gone,
    and the optional cluster-centroid label annotations from the spec are now implemented
    via a `geom_label` layer on aggregated centroids'
  - 'Imprint palette applied in correct canonical order (positions 1-6) with identical
    data hues between light and dark renders; first series is brand green #009E73'
  - Redundant shape + color encoding (circle/triangle/square/diamond/plus/asterisk)
    for the 6 cell-type clusters, matching the style guide's 5-6 series accessibility
    guidance
  - Centroid labels use a theme-adaptive elevated background box (ELEVATED_BG at alpha
    0.85) with ink-colored bold text, staying legible over the scattered points in
    both themes
  - Correctly omits axis tick labels/marks per the spec note that embedding coordinates
    aren't directly interpretable, while keeping descriptive axis titles (UMAP 1 /
    UMAP 2)
  - Subtitle states both the algorithm and key parameter ("UMAP projection (n_neighbors
    = 15)") as required by the spec
  - Realistic elongated, rotated cluster geometry (per-cluster rotation matrix) rather
    than plain isotropic blobs, giving an authentic non-linear-embedding look
  - Theme-adaptive chrome (background, ink, ink-soft, legend/elevated surface) correctly
    threaded through; both renders are fully legible with no dark-on-dark or light-on-light
    issues
  weaknesses:
  - At the CD8+ T cells / NK cells cluster boundary the two point clouds still visually
    blend somewhat despite the shape difference; slightly lower alpha or larger cluster
    separation would sharpen the boundary
  - Design execution is solid but still fairly close to theme_minimal defaults outside
    the centroid-label touch — no additional standout polish such as an emphasized
    focal cluster or a more refined legend treatment
  - geom_point(..., stroke = 0.4) has no visible effect since shapes 16/17/15/18/3/8
    are solid/stroke-only glyphs without a separate fill aesthetic (stroke only affects
    shapes 21-25) — harmless but dead styling, remove or switch to an open shape family
    if an edge highlight is actually wanted
