review:
  strengths:
  - 'Imprint palette applied in correct canonical order (positions 1-6), identical
    data hues across light and dark renders, first series brand green #009E73'
  - Redundant shape + color encoding (circle/triangle/square/diamond/plus/asterisk)
    for the 6 cell-type clusters, matching the style guide's 5-6 series accessibility
    guidance
  - Correctly omits axis tick labels/marks per the spec note that embedding coordinates
    aren't directly interpretable, while keeping descriptive axis titles (UMAP 1 /
    UMAP 2)
  - Subtitle states both the algorithm and key parameter ("UMAP projection (n_neighbors
    = 15)") as required by the spec
  - Realistic elongated, rotated cluster geometry (via a rotation matrix per cluster)
    rather than plain isotropic blobs, giving a more authentic non-linear-embedding
    look
  - Theme-adaptive chrome (background, ink, ink-soft, legend/elevated surface) correctly
    threaded through; both renders are fully legible with no dark-on-dark or light-on-light
    issues
  weaknesses:
  - library(dplyr) is imported but never used anywhere in the script (no dplyr verbs
    or pipe operator appear) — dead import, remove it
  - Optional cluster-centroid label annotations from the spec notes are omitted; adding
    them would strengthen feature coverage (DQ-01) though they are explicitly optional
  - Design execution is fairly generic (theme_minimal + standard chrome removal) without
    a distinguishing aesthetic touch such as emphasizing one cluster or a more refined
    legend treatment — limits Design Excellence
  - At the CD4+ T cells / NK cells cluster boundary the two point clouds visually
    blend somewhat despite the shape difference; slightly lower alpha or larger cluster
    separation would sharpen the boundary
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1-consistent), not pure white.
      Chrome: Bold dark title "scatter-embedding · r · ggplot2 · anyplot.ai" top-left, gray-ink subtitle "UMAP projection (n_neighbors = 15) of PBMC single-cell RNA-seq profiles" beneath it. Axis titles "UMAP 1" (bottom) and "UMAP 2" (left, rotated) in dark ink; no tick labels or tick marks (correct per spec — embedding coordinates aren't directly interpretable). A boxed legend titled "Cell type" sits at the right with 6 entries, each showing a distinct color + marker shape (circle, triangle, square, diamond, plus, asterisk).
      Data: Six well-separated, elongated clusters of scattered points — CD4+ T cells (green circles, upper-left), CD8+ T cells (lavender triangles, lower-left), B cells (blue squares, upper-right), NK cells (ochre diamonds, lower-left, adjacent to CD8+), Monocytes (red plus marks, lower-right), Dendritic cells (cyan asterisks, upper-middle). First series is the brand green #009E73 as required.
      Legibility verdict: PASS — all title, subtitle, axis titles, and legend text are clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17-consistent), not pure black.
      Chrome: Same title and subtitle now rendered in light ink (white/off-white for title, light gray for subtitle) against the dark background. Axis titles in light ink, legend box uses a dark elevated surface with light text — all fully legible, no dark-on-dark failures observed anywhere (title, axis titles, or legend text).
      Data: Identical cluster positions, shapes, and colors to the light render — green, lavender, blue, ochre, red, cyan hues are unchanged, confirming the Imprint data palette stayed constant across themes while only chrome flipped.
      Legibility verdict: PASS — all chrome elements read cleanly against the dark surface; brand green remains vivid on both backgrounds.
