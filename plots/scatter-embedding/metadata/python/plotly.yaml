  strengths:
  - Correct 3200x1800 landscape canvas via width=800/height=450/scale=4 — no clipping
    on any edge
  - Title fontsize (13) is correctly scaled down from the style-guide default for
    the long descriptive-prefixed title, avoiding overflow
  - 'Thoughtful semantic-exception color choice: Erythrocytes get the matte-red anchor
    (#AE3030) for the blood association instead of its ordinal palette position, with
    the deviation explained in a code comment'
  - Centroid annotation labels are offset below each cluster (yanchor='top', y_margin
    computed from data range) specifically to avoid covering the data points — a deliberate,
    well-reasoned layout choice
  - 'All spec features present: colorblind-accessible palette + legend, optional centroid
    annotations, moderate marker size with alpha=0.65 for the 1,500-point density,
    subtitle stating algorithm and perplexity, tick labels hidden since embedding
    coordinates aren''t interpretable'
  - 'Fully reproducible: np.random.seed(42) plus random_state=42 on both make_blobs
    and TSNE'
  - Theme-adaptive chrome correctly threaded through backgrounds, fonts, gridlines,
    legend, hoverlabel, and annotation boxes for both light and dark renders
  - Data colors are pixel-identical between light and dark renders; only chrome (backgrounds,
    text, borders) flips
  weaknesses:
  - 'Typography hierarchy is inverted: axis title font size (22) renders visibly taller
    (~63 source-px measured) than the main chart title (13, ~48 source-px measured)
    once scale=4 is applied. The library guide''s own example uses title=16 > axis-title=12;
    here the relationship flipped because axis-title size wasn''t reduced to compensate
    when the title was shrunk for length. Reduce xaxis/yaxis title font size to ~12-14
    so the main title remains the visually dominant text element.'
  - Subtitle (rendered via the <sup> tag, inheriting ~70-80% of the 13px title size)
    is quite small once scaled to a ~400px mobile width — still legible at full resolution
    but worth bumping the subtitle's explicit font size a couple of points for mobile
    comfort.
  - 'Library Mastery is generic: the plotly-specific surface used (hovertemplate,
    add_annotation) is basic API, not a distinctive plotly capability (e.g. no plotly
    express, subplots, range sliders, or other differentiating feature) — LM-02 scored
    low as a result.'
