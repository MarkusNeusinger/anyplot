    font size were never brought below the title. Reduce legend.title.font.size to
    ~12-13, legend.font.size to ~10-11, and the centroid annotation font size to ~13-14
    so the main title stays the single largest, most dominant text element per the
    style guide''s typography hierarchy.'
  - 'Library Mastery remains generic: only basic hovertemplate customization and add_annotation
    are used — no plotly-distinctive capability (e.g. px faceting, updatemenus, subplots)
    that would differentiate this from a minimal go.Scatter usage.'
  - Subtitle (rendered via the <sup> tag, inheriting ~70-80% of the 13px title size)
    is quite small once scaled to mobile width — still legible at full resolution
    but tight; consider a couple points larger for mobile comfort now that headroom
    exists below the (fixed) axis titles.
