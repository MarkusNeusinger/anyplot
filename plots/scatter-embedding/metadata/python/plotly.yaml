    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 target — not pure white, not dark.
      Chrome: Bold dark title "Single-Cell RNA-Seq Clustering · scatter-embedding · python · plotly · anyplot.ai" centered at top, with a smaller gray subtitle "t-SNE (perplexity=30) | 1,500 synthetic transcriptomes across 6 cell types" beneath it. Dark axis titles "t-SNE Dimension 1" / "t-SNE Dimension 2" with tick labels correctly hidden (t-SNE coordinates aren't directly interpretable). Subtle light-gray gridlines on both axes. Bordered legend box top-right titled "Cell Type" listing all six categories with color swatches. All text is clearly readable against the light background — no light-on-light issues found.
