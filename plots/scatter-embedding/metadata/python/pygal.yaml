review:
  strengths:
  - Correctly sets stroke=False on pygal.XY — avoids the common pygal pitfall of scatter
    points being connected by lines, producing a clean true scatter
  - Title splits on \n into a native two-line title/subtitle, satisfying both the
    exact mandated title string AND the spec's request for an algorithm+parameter
    subtitle ('t-SNE embedding · perplexity=30')
  - Centroid markers use the theme-adaptive INK token (black on light, off-white on
    dark) so they read as structural chrome rather than a 7th data color
  - 'Canonical Imprint palette order used across all 6 clusters, identical hues in
    light and dark, first series is brand green #009E73'
  - Alpha-blended RGBA colors (0.65) sensibly sized for ~100 points/cluster to handle
    overlap without being data-dense enough to need more aggressive transparency
  - Tick labels correctly suppressed (show_x_labels=False/show_y_labels=False) since
    embedding coordinates are not directly interpretable, per spec notes
  - value_formatter=Significant(3) trims noisy float tooltip coordinates in the interactive
    HTML export — a thoughtful pygal-specific touch
  - Realistic, neutral single-cell RNA-seq cell-type domain (T-cells, B-cells, NK
    cells, Monocytes, Dendritic cells, Neutrophils) with sensible t-SNE parameters
    (perplexity=30)
  weaknesses:
  - 6 categorical series sit in the 'borderline' ΔE_CVD range (10.7–13.7) per the
    style guide's color-restraint table, which recommends adding a redundant encoding
    (distinct marker shapes) at 5–6 series — none is used here, relying solely on
    color + spatial separation + legend
  - No grid lines at all (show_x_guides/show_y_guides left at default); since tick
    labels are already hidden, a very subtle grid could still help orient the eye
    to relative cluster positions without adding clutter
  - Centroids are shown only as plain dots distinguished via the legend entry, not
    annotated with the cluster label text directly on the plot — the spec lists this
    as optional, but doing it would strengthen the data storytelling
  - 'Design excellence is solid but not exceptional: sizing hierarchy and alpha-blending
    are deliberate, but there''s no strong single focal point beyond the inherent
    cluster separation — a fairly conventional embedding-plot treatment'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Two-line title "scatter-embedding · python · pygal · anyplot.ai" / "t-SNE embedding · perplexity=30" in dark ink, centered top, fully within canvas bounds. Left-side vertical legend lists 6 cell-type names plus "Cluster centroids" in dark ink with small colored square swatches. Axis titles "t-SNE Dimension 1" (bottom, centered) and "t-SNE Dimension 2" (left, rotated) in dark ink. No tick labels on either axis (intentional per spec — embedding coordinates aren't directly interpretable). All chrome text is clearly legible against the light background.
      Data: Six well-separated elliptical point clouds (~100 points each) scattered across the canvas, each colored with a distinct Imprint palette hue at ~65% opacity (green, lavender, blue, ochre, red, cyan, in canonical palette order matching the CELL_TYPES list). Each cluster has one larger solid black dot at its centroid. Colors are clearly distinguishable cluster-to-cluster.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Same two-line title and legend layout, now in light ink (#F0EFE8) against the dark background — clearly legible, no dark-on-dark issues. Axis titles same light ink, fully readable.
      Data: Identical cluster positions, shapes, and hues to the light render (verified — the Imprint palette data colors are unchanged between themes). Only the centroid markers flip from black (light theme) to off-white (dark theme), correctly using the theme-adaptive ink token rather than a fixed color, so they remain visible as structural chrome against either background.
      Legibility verdict: PASS
