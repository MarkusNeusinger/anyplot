review:
  strengths:
  - Excellent theme-adaptive chrome — background, text, spines, and legend correctly
    flip between light (#FAF8F1) and dark (#1A1A17) renders with no dark-on-dark or
    light-on-light failures
  - 'Thoughtful semantic color assignment: matte red (#AE3030) is reserved specifically
    for the ''Churn Risk'' segment (bad/risk semantic cue) rather than following blind
    ordinal order, consistent with the Imprint palette''s semantic-exception rule'
  - Direct in-plot centroid labeling with color-matched bordered callout boxes gives
    immediate visual hierarchy and lets the viewer identify each cluster without hunting
    through the legend
  - Correct 3200x1800 canvas achieved via figsize=(8,4.5)/dpi=400 with bbox_inches
    left at default — respects the hard no-bbox_inches='tight' canvas rule
  - 'Follows the spec precisely: no tick labels on either axis (embedding coordinates
    are not interpretable), subtitle documents algorithm + parameter + sample size
    + segment count'
  - 'Fully reproducible: seeds set for np.random, make_blobs, and TSNE'
  - Idiomatic seaborn usage — sns.scatterplot (axes-level) plus sns.move_legend to
    place the legend outside the axes cleanly
  weaknesses:
  - 'Unbalanced whitespace: roughly 20-25% of the canvas width to the right of the
    legend is empty dead space while the left/top margins are much tighter — tighten
    `tight_layout(rect=...)` or shift the legend further right/up so margins are more
    balanced'
  - Clusters are unrealistically clean and fully separated with zero overlap or boundary
    ambiguity between segments — real t-SNE/UMAP embeddings of behavioral data almost
    always show some fuzzy boundaries or a few ambiguous points; increase cluster_std
    slightly or add light noise so the clustering-QC context reads as realistic rather
    than synthetic-perfect
  - Marker alpha=0.55 is slightly above the recommended 0.3-0.5 range for 300+ point
    density — consider ~0.45-0.5 for slightly better overplotting handling in the
    denser cluster cores
  - The 'Loyal Subscribers' centroid annotation box sits right at / touching the y-axis
    spine on the left edge — nudge its position or increase left-side ax.margins slightly
    so the callout box doesn't visually collide with the axis line
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Title "scatter-embedding · python · seaborn · anyplot.ai" in dark ink, clearly bold/medium weight and legible; subtitle "t-SNE (perplexity=30) · 1500 customers · 6 behavioral segments · clustering QC" in softer grey, legible. Axis labels "t-SNE 1" / "t-SNE 2" dark and readable. No tick labels present (correct per spec). Legend box has a light elevated fill with a soft grey border, title "Segment" and six labeled entries, all readable.
      Data: Six well-separated point clouds (t-SNE clusters), each colored per the Imprint palette — Power Users=#009E73 (brand green, first series, correct), Loyal Subscribers=#C475FD (lavender), Occasional Buyers=#4467A3 (blue), New Signups=#BD8233 (ochre), Cart Abandoners=#2ABCCD (cyan), Churn Risk=#AE3030 (matte red, semantic exception for the "risk" label — intentional and justified). Each cluster has a direct color-matched, bordered text label at its centroid. Markers use alpha=0.55 with a light edge color for a soft "cloud" texture.
      Legibility verdict: PASS — all title, subtitle, axis label, legend, and centroid-annotation text is clearly readable against the light background. No light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Title and subtitle render in light ink (white/light grey) and are clearly legible against the dark background. Axis labels are light-colored and readable. Legend box has a dark elevated fill (#242420-like) with a light-grey border; legend title and all six entries render in light text, fully readable — no dark-on-dark failures observed.
      Data: Colors are identical to the light render — #009E73 green for Power Users (first series, unchanged), and the same lavender/blue/ochre/cyan/red for the remaining five segments. This confirms only chrome (background, text, legend box) flips between themes while data colors stay constant, as required.
      Legibility verdict: PASS — all text elements (title, subtitle, axis labels, legend, centroid annotations) are clearly readable in light color against the dark surface. No dark-on-dark text found.
