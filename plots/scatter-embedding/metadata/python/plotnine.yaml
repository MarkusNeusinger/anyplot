review:
  strengths:
  - 'Canonical Imprint palette in correct order across all six clusters, first series
    is #009E73, identical data colors between light and dark renders'
  - 'Theme-adaptive chrome is correctly threaded through: warm off-white / warm near-black
    backgrounds, all text and legend box colors flip correctly with no dark-on-dark
    or light-on-light failures'
  - Direct centroid labeling via geom_label plus 68% stat_ellipse contours gives the
    plot a genuine visual hierarchy — a viewer can identify each cluster without cross-referencing
    the legend
  - coord_fixed(ratio=1) is a thoughtful, correct choice for an embedding scatter
    plot — prevents the 2D projection from being visually distorted
  - Realistic, neutral single-cell RNA-seq scenario (spec's own suggested application)
    with 6 cell-type clusters showing both well-separated groups (T cells, Monocytes)
    and realistically adjacent/overlapping ones (NK cells/Neutrophils, B cells/Dendritic
    cells)
  - Subtitle correctly reports algorithm and key parameter ('t-SNE (perplexity=30)
    · 1200 cells · 6 clusters') per spec requirement, and axes correctly omit tick
    labels since t-SNE coordinates aren't directly interpretable
  - 'Clean, reproducible, KISS-structured code: fixed seeds throughout, only used
    imports, no functions/classes'
  weaknesses:
  - 'Title is ''scatter-embedding · plotnine · anyplot.ai'' but the mandated format
    is ''{spec-id} · {language} · {library} · anyplot.ai'' — the required ''python''
    language token is missing entirely. Fix: labs(title="scatter-embedding · python
    · plotnine · anyplot.ai", ...).'
  - 'The ''Cluster'' legend title text touches/overlaps the legend box''s top and
    left border in BOTH the light and dark render (the ''C'' crosses the left border
    line, ascenders touch the top border line) — insufficient legend title padding.
    Fix: increase legend_title padding/margin or legend box internal margins (e.g.
    via legend_box_margin / legend_margin in theme()) so the title clears the border.'
  - NK cells (orange) and Neutrophils (cyan) clusters, and separately B cells (purple)
    and Dendritic cells (red) clusters, overlap heavily enough that the two ellipses
    and centroid labels in each pair sit very close together — still readable but
    slightly muddies the at-a-glance cluster separation story; consider nudging label
    positions apart or increasing point alpha contrast between adjacent clusters if
    repair touches this area.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "scatter-embedding · plotnine · anyplot.ai" in dark ink, clearly legible; subtitle "t-SNE (perplexity=30) · 1200 cells · 6 clusters" in softer gray, legible; axis titles "t-SNE Dimension 1" / "t-SNE Dimension 2" in dark ink, legible; no axis tick labels (intentional per spec, since t-SNE coordinates are not directly interpretable); subtle light grid lines; legend box titled "Cluster" on the right with a light cream fill and dark border, listing all 6 cluster names with matching color swatches — all legend text legible, though the "Cluster" title text touches the box's top/left border (minor padding bug, see weaknesses).
      Data: Six clusters shown as semi-transparent (alpha 0.7) circular points — T cells (#009E73 green, top-right, well separated), B cells (#C475FD purple) and Dendritic cells (#AE3030 red) adjacent/overlapping (left-center), Monocytes (#4467A3 blue, bottom-left, well separated), NK cells (#BD8233 ochre) and Neutrophils (#2ABCCD cyan) adjacent/overlapping (bottom-right). Each cluster has a dashed 68%-confidence ellipse and a bold centroid label in a light box. First series is confirmed #009E73.
      Legibility verdict: PASS (all text readable against the light background; the legend-title/border touch is a design nit, not a legibility failure).

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Title and subtitle rendered in light ink (white/soft-white), clearly legible against the dark background; axis titles light-colored and legible; grid lines subtle light-gray on dark; legend box now has a dark fill with light border and light text — all legible. Centroid label boxes correctly flip to a dark fill (#242420-ish) with white bold text, confirmed via close-up crop — no dark-on-dark failure. Same "Cluster" legend-title/border touch issue reproduces here, confirming it's a layout bug rather than a theme-specific issue.
      Data: Same six cluster colors as the light render — #009E73 green (T cells), #C475FD purple (B cells), #4467A3 blue (Monocytes), #BD8233 ochre (NK cells), #AE3030 red (Dendritic cells), #2ABCCD cyan (Neutrophils) — confirmed identical to light render; only chrome (background/text/legend fill) changed between themes.
      Legibility verdict: PASS (no dark-on-dark or light-on-light failures found in either the main chrome or the centroid label boxes).
