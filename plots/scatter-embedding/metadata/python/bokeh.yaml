review:
  strengths:
  - 'Theme-adaptive chrome is executed precisely: PAGE_BG/INK/INK_SOFT tokens flip
    correctly between #FAF8F1 (light) and #1A1A17 (dark), and every categorical data
    color is pixel-identical across both renders.'
  - 'Categorical colors follow the canonical Imprint order with the first cluster
    (Machine Learning) rendered in #009E73, matching the palette contract exactly.'
  - Axis tick labels and tick marks are correctly hidden (major_label_text_alpha=0
    / tick_line_alpha=0) per the spec's note that raw t-SNE coordinates are not directly
    interpretable, while axis titles ('t-SNE 1'/'t-SNE 2') remain descriptive.
  - Subtitle 't-SNE (perplexity=30)' satisfies the spec's requirement to name the
    algorithm and key parameter.
  - Centroid label annotations with color-matched borders give each cluster a clear,
    legible focal point and reinforce the legend redundantly for accessibility.
  - All font sizes are explicitly set (title 50pt, subtitle 30pt, axis labels 42pt,
    legend 34pt, centroid labels 26pt) and remain legible in both themes.
  - 'Idiomatic bokeh usage: one ColumnDataSource + p.scatter() call per cluster for
    automatic legend generation, HoverTool tooltips, and click_policy=''hide'' for
    interactive legend toggling.'
  - Percentile-based axis range (2nd-98th) with 10% padding avoids stray t-SNE outliers
    from skewing the plot margins.
  - No AR-08 (fake interactivity) or AR-09 (edge clipping) issues — canvas gate passed
    and no elements are cut off at the border.
  weaknesses:
  - 'SC-04: Title is ''NLP Document Clusters · scatter-embedding · bokeh · anyplot.ai''
    but the mandated format requires a language token between spec-id and library:
    ''{Descriptive Title} · {spec-id} · {language} · {library} · anyplot.ai''. Fix
    to ''NLP Document Clusters · scatter-embedding · python · bokeh · anyplot.ai''.'
  - 'DQ-01: All six clusters are uniformly tight and identically sized/spaced (same
    cluster_std, same n per cluster), so the plot doesn''t show any of the ambiguity,
    size variation, or partial overlap real embeddings typically exhibit. Vary cluster_std
    slightly per group or let two related clusters (e.g. Machine Learning / Data Engineering)
    sit closer together with light overlap to better demonstrate latent-structure
    nuance.'
  - 'LM-02: Interactivity is limited to a stock HoverTool + legend click-to-hide —
    solid but generic bokeh usage. Consider a more distinctive bokeh-only feature
    (e.g. CustomJS-driven linked selection/highlighting, TapTool) to better showcase
    library-specific mastery.'
  - 'VQ-01/DE-02: The 34pt six-row legend plus six separately bordered, color-matched
    centroid label boxes make the composition a bit busy/heavy at a glance. Slightly
    smaller legend text or lighter-weight centroid box borders would read as more
    refined.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Bold dark title "NLP Document Clusters · scatter-embedding · bokeh · anyplot.ai" top-left, italic subtitle "t-SNE (perplexity=30)" beneath it in soft gray, both clearly readable against the light background. Italic axis titles "t-SNE 1" / "t-SNE 2" in dark ink are visible along the bottom and left; tick labels and tick marks are intentionally hidden per the spec's note that raw embedding coordinates are not interpretable. Grid lines are faint and unobtrusive. Legend box (top right, off-white "elevated" fill) lists all six cluster names with matching color swatches, fully legible with a thin border.
      Data: Six well-separated point clusters (Machine Learning, Data Engineering, Natural Language Processing, Computer Vision, Distributed Systems, Bioinformatics), each in a distinct Imprint color (green, purple, blue, ochre, red, cyan respectively) with semi-transparent (alpha=0.40) markers so overlapping points within a cluster remain visible as slightly darker patches. Each cluster carries a bordered centroid label naming it, border color matching its cluster's data color. First series (Machine Learning) renders in #009E73 as required.
      Legibility verdict: PASS — no light-on-light text, all chrome and data clearly legible.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Same title/subtitle now rendered in light ink, fully legible against the dark background. Axis titles are light-colored and readable; grid lines remain faint. Legend box now uses a dark "elevated" fill with light text — clearly readable, no dark-on-dark failures. Centroid label boxes also flip to the dark elevated background with light text, remaining legible.
      Data: All six cluster colors are pixel-identical to the light render (same green/purple/blue/ochre/red/cyan hues at the same positions) — only the chrome (background, text, grid, legend/label boxes) adapted to the theme, exactly as required.
      Legibility verdict: PASS — no dark-on-dark text, all chrome and data clearly legible; brand green #009E73 (Machine Learning cluster) remains vivid on the dark surface.
