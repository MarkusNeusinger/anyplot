review:
  strengths:
  - 'Excellent Imprint palette compliance: first series (Finance) is #009E73, remaining
    six clusters follow the canonical Imprint order, and data colors are identical
    between the light and dark renders.'
  - 'Redundant encoding at 7-series scale: each cluster gets both a distinct Imprint
    color AND a distinct marker shape (circle/square/triangle/diamond/inverted-triangle/plus/x),
    which is genuinely CVD-safe design.'
  - 'Full spec feature coverage: centroid label annotations (spec''s ''optionally
    annotate cluster centroids''), alpha-blended markers for overlap handling, algorithm
    subtitle (''t-SNE (perplexity=30)''), and tick labels correctly suppressed since
    embedding coordinates aren''t directly interpretable.'
  - Outlier callout ('farthest from centroid') gives the plot a clear data-storytelling
    focal point tied directly to the spec's real-world use case of quality-checking
    cluster assignments.
  - Theme-adaptive chrome is fully correct in both renders — background, text, grid,
    spines, legend box, and annotation boxes all flip appropriately; canvas gate passed
    cleanly at 3200x1800 for both.
  - 'Fully reproducible: fixed seeds (np.random.seed(42) and random_state=42) for
    both make_blobs and TSNE.'
  weaknesses:
  - 'Title is missing the required ''python'' language token: current title is ''Document
    Topic Embeddings · scatter-embedding · matplotlib · anyplot.ai'' but the mandated
    format is ''{Descriptive Title} · {spec-id} · {language} · {library} · anyplot.ai''
    — insert ''python'' between ''scatter-embedding'' and ''matplotlib'' (SC-04).'
  - Marker edgecolors are set to PAGE_BG (matching the plot background) so overlapping
    markers punch small background-colored holes into dense clusters, giving a slightly
    'quilted'/busy texture instead of a clean blob — consider a thinner or neutral
    edge, or dropping edgecolors in the densest clusters (DE-02).
  - Beyond the per-cluster marker-shape loop and fig.text subtitle, the implementation
    doesn't lean on any matplotlib-distinctive capability (e.g. PathEffects, custom
    colormaps, blended transforms) — usage is solid but fairly transferable to other
    libraries (LM-02).
  - Clusters are unusually cleanly separated (make_blobs + TSNE with cluster_std=2.5)
    with almost no boundary overlap or stray points between groups; real embeddings
    typically show at least some cluster bleed/noise, which would better showcase
    this spec's core use case of visually inspecting representation quality (DQ-01).
