review:
  strengths:
  - Centroid labels (geom_label) placed directly on each cluster give an immediate
    visual key to cell type without relying solely on the legend — a genuine storytelling
    touch beyond the spec's optional suggestion
  - 'Palette compliance is pixel-exact: first series #009E73, canonical Imprint order
    for the remaining five clusters, and both plot/label backgrounds match #FAF8F1
    (light) / #1A1A17 (dark) precisely, verified at the pixel level'
  - Theme-adaptive chrome is fully correct in both renders — text, grid, legend box,
    and geom_label fill/color all flip correctly between light and dark with no dark-on-dark
    or light-on-light failures
  - Minimal, uncluttered chrome (no grid, no spines, no axis ticks/text) correctly
    follows the spec's instruction that embedding-dimension axes are not directly
    interpretable
  - Subtitle clearly states algorithm and key parameter ("t-SNE (perplexity=30)")
    as required by the spec
  - Interactive tooltips (layer_tooltips) add real value in the HTML export without
    harming the static PNG render
  - 'Reproducible: np.random.seed(42) plus explicit random_state=42 on TSNE'
  - Clean KISS structure with only used imports and no over-engineering
  weaknesses:
  - 'Title is "scatter-embedding · letsplot · anyplot.ai" but the mandated format
    is "{spec-id} · {language} · {library} · anyplot.ai" — the "python" language token
    is missing. Other letsplot implementations in this repo (e.g. acf-pacf, area-basic,
    arc-basic, audiogram-clinical) correctly include it as "acf-pacf · python · letsplot
    · anyplot.ai". Fix: change the title string to "scatter-embedding · python · letsplot
    · anyplot.ai".'
  - Design Excellence is solid but not yet exceptional — the theme setup closely follows
    the library's documented boilerplate chrome tokens rather than introducing a distinctive
    visual signature. Consider a more deliberate design choice (e.g., subtle size/alpha
    variation to hint at point density, a softer/rounded centroid label style, or
    a restrained accent on one cluster) to push past 'well-configured' into genuinely
    distinctive territory.
  - Cluster point clouds (~250 points each at size=2.5/alpha=0.6) are legible but
    the dense cores still show meaningful marker overlap — a touch more transparency
    or slightly smaller markers would resolve individual points more cleanly in the
    densest cluster centers.
  - 'LM-02: layer_tooltips and geom_label are nice touches but are shared concepts
    across other interactive plotting libraries (bokeh, plotly) rather than something
    uniquely lets-plot/ggplot — consider a feature more distinctive to lets-plot''s
    grammar (e.g., geom_density2d contours per cluster, or facet_wrap for a small-multiples
    comparison view) to raise Library Mastery further.'
