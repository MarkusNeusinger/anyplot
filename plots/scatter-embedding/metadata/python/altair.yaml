review:
  strengths:
  - 'Directly addresses all three attempt-1 weaknesses: added a PAGE_BG halo stroke
    behind centroid labels (`stroke=PAGE_BG, strokeWidth=0.75`), reduced marker size
    50→45, and tightened the axis scale domain to the data extent (+6% pad)'
  - 'Correct Imprint categorical palette in canonical order — first series (T cells)
    is #009E73, and all 7 data colors are pixel-identical between light and dark renders'
  - 'Genuine, non-simulated Altair interactivity: `alt.selection_point` bound to the
    legend lets a viewer click a cell type to highlight its cluster'
  - Halo-stroke centroid labels (T, B, NK, Mono, DC, Mac, PC) now read cleanly against
    every cluster hue in both themes, removing the flat-ink legibility risk flagged
    last attempt
  - Title fontsize computed via an explicit scaling formula so the mandated title
    fills a comfortable ~50% of plot width without overflowing
  - Canvas-safety block never crops — raises loudly on overshoot, only pads on undershoot,
    per the altair library rules
  - Axis chrome correctly follows the spec's guidance that embedding dimensions aren't
    directly interpretable — labels, ticks, domain, and grid all removed, leaving
    only descriptive axis titles
  - Realistic, neutral scRNA-seq scenario matching one of the spec's stated applications,
    with a proper t-SNE subtitle disclosing perplexity=30
  weaknesses:
  - Centroid labels still sit directly on top of their cluster's scatter points —
    the halo stroke keeps them legible, but letterforms are still partially interleaved
    with marker dots rather than floating clear of the data
  - Considerable unused canvas area between clusters remains, inherent to a sparse
    t-SNE embedding — the 6% domain tightening helped marginally but clusters are
    still islands surrounded by empty space
  - Design Excellence is a well-executed, tasteful composition (halo labels, refined
    legend frame, tightened domain) but still reads as a polished standard scatter+legend+label
    layout rather than a distinctly bespoke one
  - t-SNE partially normalizes the intentional cluster_std variation baked into the
    synthetic data, so the compactness differences between cell types are only subtly
    visible in the final layout
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Bold dark-ink title "scatter-embedding · python · altair · anyplot.ai" (~50% plot width) and a softer dark-gray subtitle "t-SNE (perplexity=30) · 20-dimensional synthetic scRNA-seq · 7 cell types, 700 cells" are both clearly legible. Axis titles "t-SNE Dimension 1"/"t-SNE Dimension 2" are dark and readable; no tick labels/ticks/grid are drawn, matching the spec's guidance that embedding coordinates aren't directly interpretable. Legend ("Cell Type") sits top-right in a light-framed box, fully inside the canvas with no clipping.
      Data: Seven well-separated clusters render in canonical Imprint order — T cells green #009E73 (first series), B cells lavender, NK cells blue, Monocytes ochre, Dendritic cells matte red, Macrophages cyan, Plasma cells rose. Each cluster carries a bold abbreviated centroid label (T, B, NK, Mono, DC, Mac, PC) with a background-colored halo stroke that keeps the text legible directly on top of the colored points.
      Legibility verdict: PASS — all text reads clearly against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Title/subtitle/axis titles/legend all flip to light ink (#F0EFE8 primary, #B8B7B0 secondary) and remain clearly legible. Legend box border and fill are theme-adapted correctly.
      Data: The 7 cluster colors are pixel-identical to the light render (same hues, same canonical order) — only chrome (background, text, legend fill, label-halo color) flipped. Centroid labels flip their halo to the dark background color and stay legible against every cluster hue, including the lighter lavender and rose clusters — no dark-on-dark failures observed.
      Legibility verdict: PASS — all text reads clearly against the dark background; no dark-on-dark issues.
