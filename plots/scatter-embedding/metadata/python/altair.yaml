review:
  strengths:
  - 'Correct Imprint categorical palette in canonical order — first series (T cells)
    is #009E73, and all 7 data colors are byte-identical between the light and dark
    renders'
  - 'Genuine, non-simulated Altair interactivity: alt.selection_point bound to the
    legend lets a viewer click a cell type to highlight its cluster — a real distinctive-library
    feature, not faked'
  - Direct abbreviated centroid labels (T, B, NK, Mono, DC, Mac, PC) reduce legend
    cross-referencing and read clearly against every cluster color in both themes
  - Axis chrome correctly follows the spec's guidance that embedding dimensions are
    not directly interpretable — labels, ticks, domain, and grid are all removed,
    leaving only descriptive axis titles
  - Realistic, neutral single-cell RNA-seq scenario that matches one of the spec's
    stated applications almost verbatim, with a proper t-SNE subtitle disclosing perplexity=30
  - Title fontsize is computed via an explicit scaling formula (round(16 * min(1.0,
    67/len(title)))) so the mandated title never overflows
  - Canvas-safety block never crops — it raises loudly if vl-convert overshoots and
    only pads when undershooting, per the altair library rules
  weaknesses:
  - Design Excellence is solid but still reads as a well-configured default rather
    than a fully custom, publication-grade composition — consider a more deliberate
    visual flourish (e.g. a subtle size or alpha emphasis on one cluster, or a refined
    legend frame) to push past 'tasteful default'.
  - Centroid label color is a flat theme-ink value (INK) regardless of the underlying
    cluster color — it reads fine on all 7 hues in both renders here, but a thin contrasting
    halo/stroke behind the text (e.g. mark_text stroke=PAGE_BG, strokeWidth=3) would
    make legibility robust against any future palette or data change instead of relying
    on lucky contrast.
  - Title block occupies only ~40-45% of the plot width at the current fontsize —
    comfortably within the 'no overflow' safe zone, but on the low end of the 50-70%
    comfortable range; a slightly larger title/subtitle could improve visual hierarchy
    without risking overflow.
  - Considerable unused canvas area in the lower-left and upper-right quadrants between
    clusters (inherent to a sparse t-SNE embedding) — a touch more zoom/tighter axis
    domain, or slightly enlarging the marks, would raise canvas utilization without
    harming readability.
  - Marker size (50) sits at the upper edge of the 300+ points guideline (20-50) —
    one notch smaller with the existing opacity would slightly reduce within-cluster
    overplotting for the densest clusters (T, DC).
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "scatter-embedding · python · altair · anyplot.ai" in bold dark ink, subtitle "t-SNE (perplexity=30) · 20-dimensional synthetic scRNA-seq · 7 cell types, 700 cells" in softer dark-gray ink below it, both clearly legible. Y-axis title "t-SNE Dimension 2" (rotated) and X-axis title "t-SNE Dimension 1" are dark and readable; no tick labels/ticks/grid are drawn (intentional, matches spec's "embedding coordinates are not directly interpretable"). Legend box ("Cell Type") sits top-right with a light frame and dark/soft-gray text, fully inside the canvas, not clipped.
      Data: Seven well-separated clusters, each colored with a distinct Imprint hue — T cells green (#009E73, brand-first as required), B cells lavender, NK cells blue, Monocytes ochre, Dendritic cells red, Macrophages cyan, Plasma cells rose — matching the canonical Imprint order. Each cluster carries a bold abbreviated centroid label (T, B, NK, Mono, DC, Mac, PC) in dark ink, readable against every cluster color. Points have a thin background-colored stroke that visually separates overlapping markers within a cluster.
      Legibility verdict: PASS — all text is clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Title and subtitle flip to light ink (near-white / soft light-gray) and remain clearly legible. Axis titles are light and readable. Legend box flips to a dark elevated fill with a light frame and light/soft text, still fully inside the canvas.
      Data: The 7 cluster colors are visually identical to the light render (green/lavender/blue/ochre/red/cyan/rose in the same canonical order and positions) — only the chrome flipped, confirming palette-position consistency. Centroid labels flip to light ink and remain legible against every cluster color, including the lighter/lavender and rose clusters — no dark-on-dark failures observed.
      Legibility verdict: PASS — all text is clearly readable against the dark background; no dark-on-dark issues.
