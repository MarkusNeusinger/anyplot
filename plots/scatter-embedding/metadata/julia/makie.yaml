review:
  strengths:
  - 'Correct Imprint categorical palette in exact canonical order across all 8 clusters,
    first series brand green #009E73, identical data colors between light and dark
    renders'
  - Solves the n=8 series accessibility problem the style guide explicitly warns about
    (ΔE_CVD below discrimination floor) by adding direct per-cluster centroid text
    labels as a redundant, non-color cue
  - 'Both themes render correctly: warm off-white #FAF8F1 / warm near-black #1A1A17
    backgrounds, all chrome (title, axis labels, legend, grid) properly theme-adaptive
    with no dark-on-dark or light-on-light failures'
  - 'Spec followed precisely: axes hide tick labels/ticks since UMAP coordinates aren''t
    directly interpretable, subtitle states algorithm + key parameters, moderate marker
    size with alpha=0.65 handles overlap in dense regions'
  - 'Realistic, well-structured synthetic data: 8 anisotropic (rotated, unequal-spread)
    immune-cell clusters with organic shape and a few stray outlier points, avoiding
    the ''every cluster looks identical'' failure mode'
  - 'Clean idiomatic Makie code: per-group scatter! calls for automatic legend entries,
    Figure/Axis/Legend layout via fig[1,2], KISS structure with no functions/classes,
    Random.seed!(42) for reproducibility'
  weaknesses:
  - Legend labelsize=11 is noticeably smaller than the rest of the chrome (title=20,
    subtitle/axis=14) and sits at the low end for mobile-viewport legibility — bump
    to ~13-14 for better visual balance and readability at ~400px width
  - 'Design Excellence still reads as ''well-configured library default'' rather than
    distinctly polished: spines are kept in the default L-shape even though tick labels/ticks
    are hidden and axis position isn''t meaningfully interpretable for an embedding
    plot — consider removing all spines entirely (the style guide''s explicit ''minimal
    scatter'' alternative) for a cleaner look'
  - No visual hierarchy beyond uniform per-cluster treatment — all 8 clusters get
    identical size/alpha/emphasis, so the plot doesn't highlight any particular insight
    (e.g., which clusters are closest/most similar, or which is the largest population);
    consider a subtle emphasis technique to lift data storytelling
  - 'Library Mastery is correct-but-generic: beyond the standard per-group scatter!+Legend
    idiom (fine, but this is the expected baseline pattern for categorical legends
    in Makie), the implementation doesn''t showcase any Makie-distinctive capability
    — consider something like Makie.hidespines!, a themed Label/footnote, or layout-level
    polish that would be harder to replicate in another library'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "Immune Cell Atlas · scatter-embedding · julia · makie · anyplot.ai" in bold dark ink, clearly legible, comfortably sized relative to the plot width. Subtitle "UMAP (n_neighbors = 15, min_dist = 0.1)" in a softer dark gray beneath it, readable. Axis labels "UMAP 1" / "UMAP 2" in dark ink, balanced sizes. Tick labels and tick marks are intentionally hidden (correct per spec, since embedding coordinates aren't directly interpretable). Subtle light-gray gridlines cross both axes at low opacity. Legend sits directly right of the plot area with a lightly elevated off-white box, dark-ink labels, all 8 entries readable.
      Data: 8 well-separated, organically-shaped (anisotropic) point clusters in the 8 Imprint categorical colors in canonical order (T cells = brand green #009E73, B cells = lavender, NK cells = blue, Monocytes = ochre, Dendritic cells = matte red, Erythrocytes = cyan, Platelets = rose, Neutrophils = lime), each with a bold dark centroid text label naming the cluster. A handful of realistic stray outlier points appear away from the main clusters (e.g. near Neutrophils).
      Legibility verdict: PASS — all text (title, subtitle, axis labels, legend, centroid labels) is clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Same title/subtitle/axis-label layout, now rendered in light cream ink (title/axis) and soft light gray (subtitle), both clearly visible against the dark surface. Gridlines are the same subtle low-opacity lines, now light-toned instead of dark-toned. Legend box uses the dark elevated surface (#242420-equivalent) with light-ink text, fully readable.
      Data: Identical cluster colors and positions to the light render — brand green first series confirmed unchanged, all 8 hues match exactly. Centroid labels flip to light ink (white/cream) for contrast against the dark background, with no dark-on-dark failures anywhere (no black text on near-black surface detected).
      Legibility verdict: PASS — every text element (title, subtitle, axis labels, legend, centroid labels) is clearly legible against the dark background; chrome correctly flipped while data colors stayed identical to the light render.
