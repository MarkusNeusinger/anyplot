review:
  strengths:
  - 'All three attempt-1 weaknesses are directly and cleanly fixed: legend labelsize
    raised 11→13, all spines removed via hidespines! (matches the style guide''s ''minimal
    scatter'' alternative), and a visible T-cell emphasis (larger/alpha-boosted markers
    + bolder larger centroid label) paired with an insight footnote'
  - 'Correct Imprint categorical palette in exact canonical order across all 8 clusters,
    first series brand green #009E73, data colors pixel-identical between light and
    dark renders'
  - Solves the n=8 series color-discrimination problem (below the CVD floor per the
    style guide) with direct per-cluster centroid text labels as a redundant, non-color
    cue
  - Both themes render correctly with fully theme-adaptive chrome (text, grid, legend
    box, centroid labels) — no dark-on-dark or light-on-light failures
  - 'Realistic, well-structured synthetic data: anisotropic clusters with varying
    spread/rotation/density, organic overlap between adjacent clusters, plausible
    single-cell immune-atlas scenario'
  - Clean idiomatic Makie code — per-group scatter! for legend entries, fig[row,col]
    grid layout combining Axis + Legend + footnote Label in one Figure, KISS structure,
    Random.seed!(42)
  weaknesses:
  - T-cell emphasis is present but subtle (markersize 11 vs 9, alpha 0.8 vs 0.65,
    centroid fontsize 17 vs 15) — a viewer scanning the plot without reading the footnote
    may not immediately notice the emphasized cluster; a slightly larger size delta
    would strengthen DE-03 without becoming heavy-handed
  - Bold centroid text labels sit directly over the densest part of each cluster's
    points, locally occluding some markers underneath (e.g. 'T cells', 'Dendritic
    cells') — legible and spec-sanctioned as direct labeling, but a subtle background
    halo/stroke behind each label would improve marker visibility right around the
    text
  - Library Mastery is solid but still fairly close to the standard per-group-legend
    + hidespines! idiom for Makie categorical scatter plots — a further Makie-distinctive
    touch (e.g. Makie.Point2f-based nearest-neighbor jitter, DataInspector, or a custom
    Legend patch element) would help LM-02 without adding complexity for its own sake
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Bold dark-ink title "Immune Cell Atlas · scatter-embedding · julia · makie · anyplot.ai" and softer subtitle "UMAP (n_neighbors = 15, min_dist = 0.1)" above the plot. Axis labels "UMAP 1"/"UMAP 2" present; tick labels/marks intentionally hidden (correct per spec — embedding coordinates aren't directly interpretable). All spines removed (no L-frame or box around the axis). Subtle light-gray gridlines cross both axes at a handful of positions. Legend sits directly beside the plot in a lightly elevated framed box with 8 entries. A one-line footnote ("T cells form the largest population...") sits bottom-left. All text is clearly readable against the light background — no light-on-light issues.
      Data: Eight organically-shaped, well-separated clusters render in Imprint palette canonical order — T cells brand green #009E73 (first, slightly larger/more opaque markers), B cells lavender, NK cells blue, Monocytes ochre, Dendritic cells matte red, Erythrocytes cyan, Platelets rose, Neutrophils lime — each with a bold dark centroid text label (T cells' label is bolder/larger than the rest).
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same layout with title/axis labels/footnote/centroid labels flipped to light cream/white ink, subtitle to soft light gray, gridlines to light-toned, legend box to the dark elevated surface (#242420-consistent) with light-ink text. Spines still fully removed. No dark-on-dark failures detected anywhere — every text element (title, subtitle, axis labels, centroid labels, legend, footnote) is clearly legible against the dark surface.
      Data: Colors are pixel-identical to the light render — brand green first series unchanged, all 8 hues match; only chrome flipped as expected.
      Legibility verdict: PASS
