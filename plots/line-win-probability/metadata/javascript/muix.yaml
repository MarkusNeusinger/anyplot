review:
  strengths:
  - 'Splits the fill exactly at each 50% crossing: interpolated crossing points feed
    two null-gapped area series with baseline: 0.5'
  - Goal annotations are composed natively inside the LineChart through useXScale/useYScale,
    so they stay on their data positions
  - 'Full theme threading: halos, reference lines, grid and text all come from ANYPLOT_TOKENS,
    and both renders read cleanly'
  - The final score sits in the subtitle, clear of the line and the fills, and every
    event label carries the running score
  - The series valueFormatter gives readable percentages in the interactive HTML tooltip
  weaknesses:
  - 'Suggestion: the legend line glyphs are short and thin compared with the filled
    areas they stand for; a wider glyph would read faster in the thumbnail.'
  - 'Suggestion: the gap between the x tick labels and ''Match time (min)'' (axis
    height 64) could tighten a little.'
