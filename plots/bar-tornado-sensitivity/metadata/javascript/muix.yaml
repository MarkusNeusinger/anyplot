review:
  strengths:
  - 'Correctly implements the tornado shape: bars sorted descending by total range
    (|high_value - low_value|) with the widest bar at top, verified against the underlying
    data (Revenue Growth Rate 1.4M range down to Working Capital Change 0.2M).'
  - 'Base-case vertical reference line is correctly positioned via a stacked-offset
    technique (values expressed as deltas from BASE_NPV) so it lands exactly on the
    shared zero point, with a clear theme-adaptive ''Base case: $2.4M'' label.'
  - Bar labels display the actual resulting low/high dollar values (not the raw offsets)
    via a custom barLabel callback plus per-series valueFormatter — a thoughtful UX
    detail beyond the naive approach.
  - 'Realistically reflects inverse-correlation parameters: for Capital Expenditure,
    Tax Rate, and Working Capital Change, the ''low'' input scenario correctly produces
    a higher NPV than the ''high'' scenario, an accurate domain nuance for one-way
    sensitivity analysis rather than assuming both sides always run the same direction.'
  - Title fontsize dynamically scales down using the documented linear formula for
    the long descriptive+mandated title, avoiding overflow while staying legible.
  - 'Idiomatic MUI X usage: band-scale yAxis, stacked ''delta'' series for the diverging
    bars, ChartsReferenceLine, theme tokens for all data/chrome colors, and skipAnimation
    set for a clean static screenshot.'
  - 'Both renders are theme-correct: warm off-white / near-black backgrounds, all
    text legible in both themes, and data colors (brand green + lavender) identical
    across light and dark.'
  weaknesses:
  - Title occupies only ~39% of the plot width (measured from the light PNG) — noticeably
    below the 50-70% target band. The length-scaling formula was applied correctly
    for the long descriptive+mandated title, but consider nudging the base multiplier
    up slightly so long titles still read with reasonably strong visual presence.
  - Vertical grid uses ~$0.1M tick increments, producing roughly 15 grid lines across
    the full x-axis range — a bit busy for the 'subtle, never competes with data'
    grid guideline. Consider wider tick spacing (e.g. every $0.2M-0.25M) or lower
    grid opacity.
  - Design excellence is solid but conventional — mostly library defaults plus the
    required reference line and dual-color encoding. Could push further with a more
    refined visual hierarchy (e.g. bolder treatment for the most influential top bars,
    more restrained treatment for the narrow bottom bars) to feel more distinctive
    rather than a correct-but-standard tornado chart.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "NPV Sensitivity Analysis · bar-tornado-sensitivity · javascript · muix · anyplot.ai" centered at top in dark ink; legend ("Low scenario" green swatch, "High scenario" lavender swatch) centered below the title; y-axis parameter labels (Revenue Growth Rate, Discount Rate, Terminal Growth Rate, Operating Margin, Exit Multiple, Capital Expenditure, Tax Rate, Working Capital Change) in dark ink to the left; x-axis "Net Present Value" label with $-formatted compact tick labels ($1.8M...$3.2M) below the plot; dashed vertical reference line at the base case with "Base case: $2.4M" label in dark ink. All chrome text is clearly legible against the light background.
      Data: Eight horizontal diverging bar pairs, one per parameter, sorted with the widest (Revenue Growth Rate, $1.8M-$3.2M) at the top down to the narrowest (Working Capital Change, $2.3M-$2.5M) at the bottom, producing the characteristic tornado shape. First five parameters have green (low) extending left / lavender (high) extending right of the base line; the last three (Capital Expenditure, Tax Rate, Working Capital Change) correctly flip — lavender (high) extends left, green (low) extends right — reflecting their inverse correlation with NPV. Each bar segment carries a dollar-value label (e.g. "$1.8M", "$3.2M") in dark text, legible against both the green and lavender fills.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same layout as the light render — title, legend, axis labels, tick labels, and the "Base case: $2.4M" reference-line label — all rendered in light/off-white ink against the dark background. No dark-on-dark text found anywhere; every chrome element is clearly visible.
      Data: Identical bar geometry, sort order, and per-parameter direction (including the flipped Capital Expenditure/Tax Rate/Working Capital Change trio) as the light render. Bar fill colors are confirmed identical — brand green #009E73 and lavender — only the chrome (background, text, dashed reference line, grid) flipped to the dark theme. Bar value labels remain legible against both fills in the dark theme.
      Legibility verdict: PASS
