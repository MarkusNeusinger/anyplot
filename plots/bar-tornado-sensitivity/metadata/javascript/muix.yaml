review:
  strengths:
  - 'Composes the chart from ChartsContainer with ChartsXAxis/ChartsYAxis/ChartsGrid
    and a custom TornadoBars layer driven by the useXScale/useYScale hooks: idiomatic
    MUI X composition, so the bars sit at their exact data values on the native band
    and linear scales'
  - 'Colors follow the scenario, not the side: Low input is #009E73 and High input
    the second Imprint color on every bar. Discount Rate, Capital Expenditure, Tax
    Rate and Working Capital Change correctly put their low-scenario color on the
    right'
  - Bars are sorted by |high - low| (1.4M, 1.1M, 0.85M ... 0.2M), so the stack tapers
    into a clean tornado around the dashed base-case line at 2.4M. The ChartsReferenceLine
    stays visible across all bars in both themes
  - Value labels at the bar ends sit 8 px outside each bar, clear of the base-case
    line and the parameter names, and the compact USD formatting (1.75M, 3.15M) is
    shared by ticks, labels, subtitle and legend
  - 'Clear typographic hierarchy: a bold 22 px title over an inkSoft subtitle that
    states the base case and the widest swing. The legend''s base-case entry carries
    its value, and its dashed glyph matches the reference line'
  - Theme tokens are threaded through every element (ink, inkSoft, grid, pageBg),
    so both renders are fully legible with identical data colors
  weaknesses:
  - 'Suggestion: the custom SVG bar layer has no hover tooltip; wrapping the bars
    with MUI X''s tooltip/highlight machinery (or a native diverging BarChart) would
    add interactive value in the HTML view.'
  - 'Suggestion: the y-axis title ''Input parameter'' sits about 100 px left of the
    longest tick label; a narrower y-axis width would tighten the left margin.'
  - 'Suggestion: the header comment states ''muix 7.29.1'' while the harness pins
    @mui/x-charts 9.16; align the version note.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, no pure white.
      Chrome: bold title "NPV Sensitivity Analysis · bar-tornado-sensitivity · javascript · muix · anyplot.ai" (~54% width) above a muted subtitle; centered legend row (Low input swatch, High input swatch, dashed "Base case: 2.4M"); y-axis title "Input parameter" rotated at left, eight parameter names in dark ink; x-axis ticks 1.6M–3.2M and title "Net present value (USD)". Subtle vertical grid lines. All text is readable (dark on light).
      Data: eight horizontal bars split at a dashed black base-case line at 2.4M, widest at the top (Revenue Growth Rate, 1.75M–3.15M) and narrowest at the bottom (Working Capital Change, 2.3M–2.5M). Low-input segments in #009E73, high-input in lavender/purple; Discount Rate, Capital Expenditure, Tax Rate and Working Capital Change have green on the right. Value labels in dark ink at every bar end, clear of the bars.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17, no pure black.
      Chrome: title, subtitle, legend, tick labels, axis titles and parameter names all in light ink; the axis lines are light and the grid is faint but visible. No dark-on-dark text anywhere. The base-case line flips to white dashes and stays visible across all bars.
      Data: identical bar colors (#009E73 green, same purple) and positions as the light render. Only the chrome flips.
      Legibility verdict: PASS
