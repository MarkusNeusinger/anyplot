review:
  strengths:
  - 'Correctly implements the tornado-bar pattern using MUI X''s stack: "delta" to
    build floating/diverging bars anchored to a shared zero point that lands exactly
    on the base case'
  - 'Bars correctly sorted by total range descending (widest at top: Revenue Growth
    Rate, narrowest at bottom: Working Capital Change), matching the spec''s required
    tornado shape'
  - Demonstrates the full sensitivity-analysis feature set including the 'crossing'
    case where a parameter's low scenario exceeds the base case (Capital Expenditure,
    Tax Rate) — not just a one-sided demo
  - ChartsReferenceLine clearly marks and labels the base case ($2.4M) with theme-adaptive
    dashed styling
  - Correct Imprint palette (brand green first, lavender second) with identical data
    colors and fully theme-correct chrome across both light and dark renders
  - Title font size is intentionally scaled down via a length-based formula so the
    long mandated title stays comfortably proportioned (~52% of width) instead of
    overflowing
  - In-bar currency-formatted value labels add readability without a cluttered separate
    annotation layer
  weaknesses:
  - Visual polish is competent but reads as a well-configured MUI X default rather
    than a distinctively custom design — could push further with an emphasis treatment
    on the top 1-2 bars or subtle row banding across the 8 categories
  - X-axis label 'Net Present Value' doesn't itself carry a unit suffix (relies entirely
    on the $-formatted tick labels) — adding '(USD)' would remove any ambiguity
  - Data storytelling relies mainly on the sort order; a callout or subtitle noting
    the widest driver would sharpen the takeaway further
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Title "NPV Sensitivity Analysis · bar-tornado-sensitivity · javascript · muix · anyplot.ai" in dark ink, clearly legible and centered, comfortably under the plot width. Legend ("Low scenario" green swatch, "High scenario" purple swatch) sits centered above the chart, fully readable. Y-axis parameter labels (Revenue Growth Rate ... Working Capital Change) and x-axis $-formatted tick labels are dark and crisp against the light background. Vertical gridlines are subtle. The dashed base-case reference line and its "Base case: $2.4M" label are dark ink, clearly visible near the top of the plot.
      Data: Bars diverge from the $2.4M base line; first series (low scenario) is brand green #009E73, second series (high scenario) is lavender/purple #C475FD — matches the Imprint palette canonical order. Bars are sorted widest-to-narrowest top-to-bottom, correctly forming the tornado shape. In-bar white/dark text shows formatted currency values (e.g. "$1.8M", "$3.2M").
      Legibility verdict: PASS — all text is clearly readable against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Title, legend, y-axis category labels, and x-axis tick labels all render in light/off-white ink, clearly legible against the dark background. The dashed base-case reference line is light-colored with a light "Base case: $2.4M" label, fully readable. No dark-on-dark text detected anywhere in the chrome.
      Data: Data colors are identical to the light render — green #009E73 and lavender #C475FD in the same series order — confirming only chrome flipped between themes. In-bar labels remain legible against both the green and purple fills.
      Legibility verdict: PASS — all text is clearly readable against the dark background; no dark-on-dark failures observed.
