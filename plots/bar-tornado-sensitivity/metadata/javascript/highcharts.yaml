review:
  strengths:
  - 'Correct, idiomatic tornado-chart construction: two stacked bar series with delta-from-base
    values, matching Highcharts'' own canonical tornado pattern'
  - Bars correctly sorted descending by impact range (|high - low|), producing the
    classic widest-at-top / narrowest-at-bottom tornado silhouette
  - Base-case vertical reference line rendered via plotLines with an inline label,
    exactly matching the spec's 'draw a vertical reference line at the base case value'
    requirement
  - Dual-color encoding (green = high-input scenario, purple = low-input scenario)
    is applied consistently even for parameters with an inverse relationship (Discount
    Rate), which is realistic sensitivity-analysis behavior rather than a bug
  - Data labels show the resulting absolute output value ($ millions) at each bar
    segment, satisfying the optional 'display resulting output values' feature
  - Realistic, neutral, well-scaled example data (solar-farm NPV sensitivity across
    8 financial/engineering assumptions) with factually correct direction of effect
    (higher discount rate lowers NPV)
  - Clean, deterministic, KISS-structured code with no imports beyond the provided
    tokens and no fake interactivity
  - First categorical series is the mandated Imprint brand green (#009E73), second
    series correctly takes palette position 2 (#C475FD); theme chrome (title/axis/tick/legend
    colors, transparent background) is correctly threaded through both light and dark
    renders
  weaknesses:
  - Value-axis (yAxis) tick labels use Highcharts' auto interval on the delta-from-base
    data, producing ~16 non-round labels ($8.4M, $8.9M, $9.4M, ...) instead of clean
    $1M-spaced values; at the ~400px mobile thumbnail width these labels visibly crowd
    and overlap, hurting mobile legibility. Set an explicit yAxis.tickInterval (e.g.
    1.0 in the underlying delta space, or a rounder value derived from the data range)
    so the rendered labels land on whole-dollar increments and there are fewer of
    them.
  - 'Design polish is solid but not exceptional: the visual hierarchy relies entirely
    on the tornado sort order with no additional emphasis (e.g. highlighting the top
    1-2 highest-impact parameters, or a subtitle calling out the key insight) to actively
    guide the reader to the takeaway.'
  - 'Library Mastery is generic: stacking, plotLines, and dataLabels formatters are
    common patterns available in most charting libraries; consider a Highcharts-distinctive
    touch (e.g. connector/column range styling, custom point-level colorByPoint override
    for the inverse-relationship rows, or a more tailored tooltip) to differentiate
    the implementation.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "bar-tornado-sensitivity · javascript · highcharts · anyplot.ai" is bold dark text, clearly visible. Y-axis category labels (parameter names: Electricity Price, Discount Rate, Capital Cost, O&M Cost, Panel Degradation Rate, Debt Interest Rate, Construction Delay, Tax Credit Rate) are dark and legible. X-axis title "Project NPV ($ millions)" and its ~16 tick labels ($8.4M...$16.xM) are dark-gray and readable at full resolution. Legend below the chart ("High input scenario" green swatch, "Low input scenario" purple swatch) is legible. A black vertical reference line at the base case with the label "Base case: $12.4M" sits just above the top bar.
      Data: Bars are horizontal, sorted with the widest (Electricity Price, range 6.8) at the top and the narrowest (Tax Credit Rate, range 0.9) at the bottom, creating the tornado silhouette. First series ("High input scenario") renders in brand green #009E73, second series ("Low input scenario") in lavender #C475FD (Imprint palette position 2). For most rows green sits on the right (higher value) and purple on the left (lower value), except Discount Rate where the relationship inverts (green/high-input scenario produces the lower NPV) — this is a realistic sensitivity-analysis behavior, not a rendering bug. White-on-color data labels inside each bar segment show the resulting NPV (e.g. "$8.9M", "$15.7M").
      Legibility verdict: PASS — all text is readable against the light background at full resolution. Minor concern: the dense, non-round x-axis tick labels visibly crowd when the image is scaled down to ~400px mobile width (verified against plot-light_400.png), which is a mobile-legibility weakness (see review_weaknesses.json), not a light-vs-dark failure.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Title, axis labels, tick labels, and legend text are all rendered in light off-white/gray tones, clearly visible against the dark surface. No dark-on-dark elements found. The base-case reference line is white with a light-gray label, clearly visible.
      Data: Data colors are identical to the light render — brand green #009E73 for "High input scenario" and lavender #C475FD for "Low input scenario" — confirming the Imprint palette data colors do not shift between themes. Only chrome (background, text, gridlines, reference line color) adapts to the dark theme.
      Legibility verdict: PASS — all text is readable against the dark background; no dark-on-dark or light-on-light failures observed. Same mobile tick-crowding caveat as the light render applies equally here (chrome-only issue, unrelated to theme).
