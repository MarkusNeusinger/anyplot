review:
  strengths:
  - 'The mobile-legibility weakness from attempt 1 is fully resolved: the value axis
    now uses explicitly-computed round tick positions ($1M increments, e.g. $8M, $9M,
    $10M...) instead of Highcharts'' auto interval, verified clean and uncrowded at
    the 400px mobile thumbnail in both themes'
  - 'Explicit data-storytelling emphasis added since attempt 1: a dynamic subtitle
    names the leading driver of NPV uncertainty with its impact range, and the top-ranked
    bar (Electricity Price) gets a bold ink-colored border plus bold data-label weight,
    giving the viewer an immediate, unmistakable focal point'
  - 'Correct, idiomatic tornado-chart construction: two stacked bar series with delta-from-base
    values, sorted descending by |high - low| to produce the classic widest-at-top
    / narrowest-at-bottom silhouette'
  - Base-case vertical reference line rendered via plotLines with an inline '$12.4M'
    label, exactly matching the spec's reference-line requirement
  - Dual-color encoding (green = high-input scenario, purple = low-input scenario)
    is applied consistently even for the one parameter with an inverted relationship
    (Discount Rate), which is realistic sensitivity-analysis behavior rather than
    a bug
  - Realistic, neutral, well-scaled example data (solar-farm NPV sensitivity across
    8 financial/engineering assumptions) with factually correct direction of effect
    (higher discount rate lowers NPV)
  - First categorical series is the mandated Imprint brand green (#009E73), second
    series correctly takes palette position 2 (#C475FD); theme chrome (title/axis/tick/legend
    colors, transparent background) is correctly threaded through both light and dark
    renders with identical data colors
  - Clean, deterministic, KISS-structured code with no imports beyond the provided
    tokens and no fake interactivity
  weaknesses:
  - 'Library Mastery remains fairly generic: stacking, plotLines, tickPositions, and
    dataLabels/tooltip formatters are common patterns available in most charting libraries;
    no Highcharts-distinctive feature (e.g. a custom point-level marker, connector
    styling, or a series-level renderer hook) differentiates this implementation from
    what another library could produce with minor syntax changes.'
  - 'Axis chrome could be pushed slightly further toward full refinement: the category
    (y) axis line and ticks remain a solid inkSoft stroke rather than being removed
    or lightened further, and the value-axis grid, while subtle, is still present
    on every $1M step rather than reduced to only major/labeled positions.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "bar-tornado-sensitivity · javascript · highcharts · anyplot.ai" is bold dark text, clearly visible. Subtitle "Electricity Price is the leading driver of NPV uncertainty (range: $6.8M)" is dark-gray and legible, directly calling out the chart's key insight. Y-axis category labels (Electricity Price, Discount Rate, Capital Cost, O&M Cost, Panel Degradation Rate, Debt Interest Rate, Construction Delay, Tax Credit Rate) are dark and legible. X-axis title "Project NPV ($ millions)" and its now-round tick labels ($8M, $9M, $10M ... $16M) are dark-gray and readable — this replaces attempt 1's ~16 non-round auto-interval ticks with clean $1M-spaced values, confirmed uncrowded at the 400px mobile thumbnail. Legend below the chart ("High input scenario" green swatch, "Low input scenario" purple swatch) is legible. A black vertical reference line at the base case with the label "Base case: $12.4M" sits just above the top bar, with no overlap against the subtitle or the bar itself.
      Data: Bars are horizontal, sorted with the widest (Electricity Price, range 6.8) at the top and the narrowest (Tax Credit Rate, range 0.9) at the bottom, forming the tornado silhouette. First series ("High input scenario") renders in brand green #009E73, second series ("Low input scenario") in lavender #C475FD (Imprint palette position 2). The top bar (Electricity Price) has a bold dark outline and bold-weight data labels, visually distinguishing it as the leading driver — a new emphasis technique versus attempt 1. For most rows green sits on the right (higher value) and purple on the left, except Discount Rate where the relationship inverts (green/high-input scenario yields the lower NPV), which is realistic sensitivity-analysis behavior, not a bug. Dark data labels inside each bar segment show the resulting NPV (e.g. "$8.9M", "$15.7M").
      Legibility verdict: PASS — all text, including the now-round axis ticks, is readable against the light background at both full resolution and the 400px mobile thumbnail.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Title, subtitle, axis labels, tick labels, and legend text are all rendered in light off-white/gray tones, clearly visible against the dark surface. No dark-on-dark elements found. The base-case reference line is white with a light-gray label, clearly visible and non-overlapping.
      Data: Data colors are identical to the light render — brand green #009E73 for "High input scenario" and lavender #C475FD for "Low input scenario" — confirming the Imprint palette data colors do not shift between themes; only chrome (background, text, gridlines, reference line, bar-outline color) adapts to the dark theme. The top bar's emphasis outline renders as a light/white stroke on dark, still clearly distinguishing Electricity Price as the leading driver. Data labels (white/light text) remain legible against both the green and purple bar fills.
      Legibility verdict: PASS — all text is readable against the dark background at both full resolution and the 400px mobile thumbnail; no dark-on-dark or light-on-light failures observed, and the round tick labels show no crowding.
