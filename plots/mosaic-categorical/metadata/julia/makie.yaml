review:
  strengths:
  - 'Correct mosaic geometry: column widths encode department marginal proportions,
    segment heights encode conditional satisfaction proportions within each department'
  - Theme-adaptive chrome fully threaded through Axis/Legend while all three data
    colors stay pixel-identical between light and dark renders
  - Gap spacing between rectangles cleanly distinguishes categories, matching the
    spec's explicit note
  - Clean, reproducible, KISS-structured code with no unused imports and no fake interactivity
  weaknesses:
  - Design Excellence is close to baseline - consider a storytelling touch (e.g. text!
    cell-count/percentage labels on larger tiles, or emphasis on a notable cell) to
    lift DE-01/DE-03 beyond the inherent mosaic geometry
  - Satisfaction levels (Low/Medium/High) use canonical Imprint order (green/lavender/blue)
    rather than a polarity-based semantic mapping (High=green, Low=warning tone) -
    compliant but a missed opportunity for more intuitive reading
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1, not pure white.
      Chrome: Dark title "mosaic-categorical · julia · makie · anyplot.ai" at top; dark "Department" x-label and "Satisfaction share" y-label; soft-dark tick labels (department names, 0-100% scale); frameless legend "Satisfaction level" with Low/Medium/High swatches. All confirmed readable.
      Data: 4 department columns x 3 satisfaction segments = 12 tiles. Colors: Low=#009E73 (brand green), Medium=lavender/purple (#C475FD), High=blue (#4467A3). First categorical series (Low) is brand green as required.
