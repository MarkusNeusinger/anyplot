review:
  strengths:
  - 'Correct mosaic construction: rectangle widths encode marginal department proportions
    and heights encode conditional satisfaction-level proportions within each column,
    so area is proportional to cell frequency exactly as the spec requires'
  - Theme-adaptive chrome is fully wired through (title/axis/tick colors, spines,
    backgrounds) while the three Imprint data colors stay pixel-identical between
    light and dark renders
  - 'Notable-cell technique: the department with the highest ''Low satisfaction''
    share gets a bolder outline, giving the mosaic a clear focal point and a data-storytelling
    angle beyond a plain grid of tiles'
  - Percentage labels inside every cell add a redundant, color-independent encoding
    of the data, improving accessibility
  - 'Clean, idiomatic Julia: single seeded RNG, no functions/classes, correct 2400x2400
    canvas and plot-$(THEME).png output'
  weaknesses:
  - Palette assignment uses canonical order (Low=green, Medium=lavender, High=blue)
    instead of the sentiment/status semantic exception the style guide calls out for
    traffic-light-style scales (Low->red or amber, High->green) - the current mapping
    puts the brand-positive green on the worst satisfaction tier, which fights viewer
    intuition
  - Title occupies only ~35% of the plot width, below the 50-70% guidance range -
    a modest titlesize bump would strengthen the visual hierarchy without risking
    overflow
  - Percentage cell labels at fontsize=11 are on the small side for a 2400px canvas
    - increasing to ~13-14 would improve legibility at mobile scale
  - The spec's optional 'color coding can indicate residuals/deviations from independence'
    idea is left unused - the current design covers raw proportions only, without
    hinting whether a cell is over/under-represented vs. independence
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 - not pure white, not dark.
      Chrome: Title "mosaic-categorical · julia · makie · anyplot.ai" in bold dark ink, clearly visible; "Department" x-axis label and "Satisfaction share" y-axis label in dark ink, both readable; tick labels (department names, 0-100% y ticks) in a slightly lighter gray, still clearly legible; legend "Satisfaction level" with Low/Medium/High swatches on the right, unframed, dark text - all readable.
      Data: Four department columns (Engineering, Sales, Support, Marketing) of varying widths (proportional to department size), each split vertically into three colored segments - green (Low), lavender (Medium), blue (High) - matching the Imprint palette's first three positions. Every segment carries a black or white percentage label with good contrast against its fill. The Support/Low cell has a bold dark outline calling out the standout finding (highest low-satisfaction share). All text is readable against the light background - no light-on-light issues found.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 - not pure black, not light.
      Chrome: Same title, axis labels, and tick labels now rendered in light ink/gray tones, clearly visible against the dark surface; legend text also flipped to light ink and remains legible; spines/gridless layout unchanged.
      Data: Same green/lavender/blue segments as the light render, pixel-identical hues confirming the palette does not shift between themes. Percentage labels retain the same per-column ink assignment (dark text on green/lavender, white text on blue) and are readable on both the tile fills and against the dark page background. The Support/Low outline switches to a light stroke so it still reads as a highlight against the dark tile fill. No dark-on-dark failures were found - no text or label merges into the background.
      Legibility verdict: PASS
