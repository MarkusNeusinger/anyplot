review:
  strengths:
  - 'Mosaic geometry is mathematically correct: column widths equal the marginal share
    of each department, segment heights equal the conditional share of each work mode
    within a department, and the resulting tile area is proportional to joint frequency
    (count_ij / grand total) — matching the spec''s definition precisely.'
  - 'First categorical series renders as Imprint #009E73 and the remaining series
    follow the canonical Imprint order (#C475FD, #4467A3); data colors are pixel-identical
    between the light and dark renders.'
  - 'Theme-adaptive chrome is clean in both renders: correct #FAF8F1/#1A1A17 backgrounds,
    no dark-on-dark or light-on-light text, no clipped elements at the canvas edges,
    spines/x-axis fully hidden for a minimal look.'
  - Deterministic, realistic HR dataset (department x work mode) with genuine variation
    across departments (Engineering skews remote, Support skews onsite) that gives
    the mosaic an implicit story just from the tile proportions.
  - 'All font sizes are explicitly set and the canvas is well utilized: title, axis
    titles, percent-formatted y ticks, and a ''Work mode'' legend are all present
    and correctly labeled.'
  weaknesses:
  - Visual style is a flat, low-adornment default look — solid fills with thin white
    gaps and a generic sans-serif stack — with no distinctive typography, depth, or
    polish beyond the mandatory palette; reads as 'well-configured default' rather
    than publication-ready (DE-01/DE-02).
  - No explicit storytelling beyond what's inferable from tile sizes — a short subtitle
    (e.g. calling out the Engineering-remote / Support-onsite contrast) or value/percentage
    labels on the larger tiles would sharpen the insight for the viewer (DE-03).
  - 'All visible mosaic tiles are drawn manually via ctx.fillRect() inside a plugin
    afterDraw hook rather than through genuine Chart.js dataset elements/controllers
    — the Chart instance is built with datasets: [] purely to obtain chartArea/scale/legend
    layout. This is a defensible workaround given Chart.js has no native mosaic controller,
    but it means the library''s own rendering pipeline is bypassed for the actual
    data marks, which caps how much idiomatic-usage credit the implementation can
    earn (LM-01).'
  - 'tooltip: { enabled: false } forfeits the one clear interactivity win available
    in the generated plot-*.html detail view for an INTERACTIVE_LIBRARIES entry —
    wiring a real tooltip (department, work mode, count, percentage) via canvas hit-testing
    in the mosaic plugin would be a genuinely distinctive Chart.js feature to showcase
    instead of a purely static-styled canvas (LM-02).'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "mosaic-categorical · javascript · chartjs · anyplot.ai" in bold dark ink at top center, fully visible with no clipping. Y-axis shows percent ticks (0%-100%) in soft gray with a rotated "Share within department" title. Below the plot, dark department labels (Engineering, Sales, Marketing, Support) sit under their respective columns, with a smaller gray caption "Department (column width ∝ headcount share)" beneath them — both fully within the canvas bounds, comfortable bottom margin. A "Work mode" legend with three color swatches (Remote/Hybrid/Onsite) sits at the right, clear of the plot area.
      Data: Four columns of varying widths (Engineering widest, reflecting largest headcount share), each stacked into three colored segments (green Remote, purple Hybrid, blue Onsite) whose heights vary per department — Engineering is mostly green (remote-heavy), Support is mostly blue (onsite-heavy). First series is #009E73 green as required.
      Legibility verdict: PASS — all title, axis, tick, and legend text is clearly readable against the light background.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title now in light/off-white text, fully visible. Y-axis percent ticks and axis title are light gray, clearly legible. Department labels and the caption beneath the plot are white and unclipped. Legend text and "Work mode" title are light-colored and legible against the dark background.
      Data: Tile colors and proportions are pixel-identical to the light render (green/purple/blue in the same positions and sizes) — only the background, gridlines, and text flipped for the dark theme, as required.
      Legibility verdict: PASS — no dark-on-dark or light-on-light failures observed; all text remains legible in the dark theme.
