review:
  strengths:
  - 'Mosaic geometry is mathematically correct: column widths equal the marginal share
    of each department, segment heights equal the conditional share of each work mode
    within a department, and the resulting tile area is proportional to joint frequency
    (count_ij / grand total), matching the spec''s definition precisely.'
  - 'First categorical series renders as Imprint #009E73 and the remaining series
    follow the canonical Imprint order (#C475FD, #4467A3); data colors are pixel-identical
    between the light and dark renders.'
  - 'Theme-adaptive chrome is clean in both renders: correct #FAF8F1/#1A1A17 backgrounds,
    no dark-on-dark or light-on-light text, no clipped elements at the canvas edges,
    spines/x-axis fully hidden for a minimal look.'
  - Deterministic, realistic HR dataset (department x work mode) with genuine variation
    across departments (Engineering skews remote, Support skews onsite) that gives
    the mosaic an implicit story just from the tile proportions.
  - 'New since attempt 1: percentage value labels are now printed directly on tiles
    large enough to hold them, using a WCAG-luminance contrast function (readableTextColor)
    so the label always reads against that tile''s own fill in both themes — this
    directly reinforces the mosaic''s story (Engineering 60% remote, Support 60% onsite)
    instead of leaving the viewer to eyeball proportions.'
  - 'New since attempt 1: a real interactive tooltip is now wired via canvas hit-testing
    (mousemove -> pickTile -> custom-drawn tooltip box with drop shadow) showing department,
    work mode, count, share-of-department, and share-of-total — a genuine distinctive
    Chart.js feature in the HTML detail view rather than a disabled/static tooltip.'
  weaknesses:
  - Visual style remains fairly flat outside the new tile drop-shadows — solid fills,
    generic sans-serif stack, no distinctive typography or intentional hierarchy beyond
    palette + shadow (DE-01/DE-02 still capped).
  - 'Tiles are still drawn manually via ctx.fillRect() inside a plugin afterDraw hook
    (Chart instance built with datasets: [] purely for chartArea/scale/legend layout),
    so the actual data marks bypass Chart.js''s own dataset/controller rendering pipeline
    entirely — defensible since Chart.js has no native mosaic controller, but it caps
    idiomatic-usage credit (LM-01).'
  - The italic 12px explanatory caption under the x-axis ('Department (column width
    ∝ headcount share)') remains slightly undersized relative to the rest of the type
    scale (minor VQ-01 nit).
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "mosaic-categorical · javascript · chartjs · anyplot.ai" in bold dark ink at top center, fully visible with no clipping, with an italic subtitle "Engineering skews remote, Support skews onsite — hover a tile for exact counts" beneath it. Y-axis shows percent ticks (0%-100%) in soft gray with a "Share within department" title. Below the plot, dark department labels (Engineering, Sales, Marketing, Support) sit under their respective columns, with a smaller italic gray caption "Department (column width ∝ headcount share)" beneath them — both fully within the canvas bounds with a comfortable bottom margin. A "Work mode" legend with three color swatches (Remote/Hybrid/Onsite) sits at the right, clear of the plot area.
      Data: Four columns of varying widths (Engineering widest, reflecting the largest headcount share), each stacked into three colored segments (green Remote, purple Hybrid, blue Onsite) whose heights vary per department — Engineering is mostly green (remote-heavy, labeled 60%), Support is mostly blue (onsite-heavy, labeled 60%). Each tile large enough to hold text carries a bold percentage label (e.g. 60%, 30%, 10%, 20%, 50%, 47%, 33%, 20%, 13%, 27%) rendered in a luminance-appropriate contrast color against its own fill. First series is #009E73 green as required. Subtle drop shadows give the tiles slight depth against the flat background.
      Legibility verdict: PASS — all title, subtitle, axis, tick, tile-label, and legend text is clearly readable against the light background.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title and subtitle now in light/off-white and soft-gray text respectively, fully visible. Y-axis percent ticks and axis title are light gray, clearly legible. Department labels and the caption beneath the plot are light-colored and unclipped. Legend text and "Work mode" title are light-colored and legible against the dark background.
      Data: Tile colors, proportions, and percentage labels are pixel-identical to the light render (green/purple/blue in the same positions and sizes, same 60%/30%/10%/... values) — only the background, gridlines, and chrome text flipped for the dark theme, as required. Tile-label contrast color is computed per-tile so it remains readable on the same green/purple/blue fills in this theme too.
      Legibility verdict: PASS — no dark-on-dark or light-on-light failures observed; all text, including the new percentage tile labels, remains legible in the dark theme.
