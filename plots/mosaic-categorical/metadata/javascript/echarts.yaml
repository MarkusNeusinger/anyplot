review:
  strengths:
  - Correctly implements a genuine mosaic plot from scratch using ECharts' custom
    series + renderItem API (ECharts has no native mosaic type) — column widths encode
    channel share of total orders and stack heights encode conditional category share
    within each channel, matching the spec's area-proportional definition exactly.
  - 'Imprint palette applied correctly and in canonical order: Electronics = #009E73
    (brand green, first series), followed by Clothing/Home Goods/Books in the standard
    palette sequence; data colors are pixel-identical between the light and dark renders.'
  - 'Theme-adaptive chrome is fully correct in both renders: warm off-white background
    in light, warm near-black in dark, all text uses ink/inkSoft tokens with no dark-on-dark
    or light-on-light failures, no clipped elements at either canvas edge.'
  - Clean, deterministic, single-pass code (no functions/classes beyond the required
    renderItem/formatter callbacks) with a legend-registration trick (empty-data helper
    series) that is a well-known idiomatic ECharts pattern for giving custom series
    a working legend.
  - Realistic, neutral business dataset (retail orders by channel × product category)
    with clear, non-uniform variation across cells so the resulting mosaic visibly
    demonstrates association between the two categorical variables — the core purpose
    of the plot type.
  weaknesses:
  - 'Mobile-viewport legibility fails broadly: downscaling plot-light.png to ~400px
    width (matching the site''s mobile preview) renders the title, subtitle, legend
    text, axis label, tick labels, and the ''n='' channel-total annotations all as
    illegible blur — cap-height for the title text is only ~27px at native 1800px
    canvas height, which is ~3px once scaled to a 225px-tall mobile preview. Increase
    fontSize across the board (title ~28-32, subtitle ~16, legend/axis/tick text ~16-18,
    custom-rendered channel labels ~16-18) so text holds up at mobile scale, not just
    at native 3200x1800 resolution.'
  - 'Title occupies only ~31% of canvas width (measured: 997px of 3200px) at fontSize
    22 — below the ~50-70% expected for a shorter custom-length title (55 chars, shorter
    than the ~67-char full mandated benchmark). Raising the title fontSize per the
    legibility fix above will naturally also improve this proportion.'
  - X-axis lacks a formal axis-title identifying the first categorical variable (channel/purchase-method)
    — it's only implied by the tick-style channel names and the subtitle text; consider
    an explicit label for full clarity per the spec's 'labels should identify both
    categorical variables clearly'.
  - No residual/deviation-from-independence color coding, which the spec notes as
    an optional enhancement ('Color coding can indicate residuals or deviations from
    independence') — the implementation uses flat per-category colors instead; not
    required, but would add analytical depth.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1-consistent), not pure white, not dark.
      Chrome: Title "mosaic-categorical · javascript · echarts · anyplot.ai" centered at top in dark ink text, subtitle below in softer gray explaining the width/color encoding. Y-axis shows 0-100% with percent-formatted tick labels and a rotated axis title "Share of product category within channel." X-axis shows three channel names (Online, Mobile App, In-Store) each with an "n=" total below. A vertical legend sits at the right listing the four product categories with color swatches. All chrome elements are readable at native 3200x1800 resolution.
      Data: Three mosaic columns of unequal width (Online widest, Mobile App and In-Store narrower and equal), each subdivided into four stacked colored rectangles (Electronics = green #009E73, Clothing = light purple, Home Goods = blue, Books = ochre/amber) separated by thin light gaps. Column widths clearly differ (channel volume) and the internal color proportions differ substantially per column, visibly showing the channel-category association.
      Legibility verdict: PASS at native resolution, but FAIL at mobile scale — downscaling the PNG to ~400px width (simulating the site's mobile preview) renders the title, subtitle, axis label, tick labels, legend text, and "n=" annotations as illegible blur; font sizes are not large enough to survive that scale-down.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17-consistent), not pure black, not light.
      Chrome: Same layout as the light render with all text (title, subtitle, axis label, tick labels, legend, channel/"n=" labels) rendered in light/soft-white ink, clearly visible against the dark background — no dark-on-dark failures observed. Gaps between mosaic cells appear as thin near-black lines consistent with the dark page background showing through.
      Data: Data colors are identical to the light render (green/purple/blue/ochre, matched positions per column) — only the chrome (background, text, gap color) flips as expected.
      Legibility verdict: PASS at native resolution, matching the light render's chrome correctness; FAILS the same mobile-scale legibility check as the light render for the same reason (font sizes too small relative to canvas to survive downscaling to ~400px).
