review:
  strengths:
  - 'Mosaic layout math is exactly correct: column widths encode marginal share of
    category_1 (source), heights within each column encode conditional proportion
    of category_2 (outcome) — matches the specification''s definition precisely.'
  - 'Clever position-redundant color encoding: ''Converted'' is always anchored at
    the bottom and ''Bounced'' always stacked above, so the red/green distinction
    is backed by a non-color cue (position) plus a legend — mitigates the CVD risk
    of a two-hue categorical scheme.'
  - Threshold-based label suppression (only render a percentage label when the segment
    is tall enough, e.g. >32px) avoids illegible squeezed text in small cells like
    the 8% Social Media segment.
  - 'Clean, restrained chrome: y-axis domain line removed, subtle 15%-alpha gridlines,
    generous gaps between columns/segments (gapX=10, gapY=6), two-line column headers
    (source name + sample size) via tspan.'
  - 'Both light and dark renders are correctly themed (#FAF8F1 / #1A1A17 backgrounds,
    theme-adaptive ink/inkSoft/grid), data colors identical across themes, no clipped
    or overlapping text in either render.'
  - Realistic, neutral marketing-analytics dataset (traffic source vs. conversion)
    at a sensible scale (200-800 visits per source, 2000 total).
  weaknesses:
  - No explicit y-axis title (e.g. 'Conversion Rate') — only the '0%..100%' tick values
    are shown; the encoding is only explained indirectly via the subtitle text. Add
    an axis label so the chart is self-explanatory without reading the subtitle.
  - Neither the column headers nor the legend name the two categorical variables themselves
    — only their individual category values ('Organic Search', 'Paid Ads', ... and
    'Converted'/'Bounced') are shown. The spec's 'labels should identify both categorical
    variables clearly' is only partially met; consider a small caption identifying
    'Traffic Source' (x-axis/columns) and 'Outcome' (legend title) as the variable
    names.
  - The 'Bounced' color is hardcoded as the literal '#AE3030' instead of referencing
    't.palette[4]' (the same semantic-red anchor value exposed on the tokens object)
    — correct color today, semantically justified per the style guide's sentiment/polarity
    exception (positive→green, negative→red), but bypasses the token indirection the
    other library-rules examples use.
  - No visual indication of deviation-from-independence (e.g. residual shading) —
    the spec's notes mention this as an optional technique for association analysis;
    the plot currently only shows marginal/conditional proportions, which is sufficient
    but a missed opportunity for a stronger analytical story.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1), consistent with the light theme surface — not pure white.
      Chrome: Title "mosaic-categorical · javascript · d3 · anyplot.ai" and the subtitle ("Traffic source vs. conversion outcome — column width = share of visits, height = conversion rate") are dark ink, clearly readable. Column headers ("Organic Search", "Paid Ads", "Social Media", "Referral" with "n = ..." sample sizes) and the y-axis 0/25/50/75/100% tick labels are all legible dark/soft-ink text against the cream background. Legend ("Converted"/"Bounced" swatches) top-right is readable.
      Data: Four columns of varying width (proportional to visit share) each split into a green "Converted" segment (bottom) and a matte-red "Bounced" segment (top), with white percentage labels inside each segment large enough to hold text (23%/78%, 30%/70%, 8%/92%, 45%/55%). First series (Converted) is #009E73 as required.
      Legibility verdict: PASS — no light-on-light text, no overlapping elements, no clipped edges.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17), not pure black.
      Chrome: Title, subtitle, column headers, and y-axis tick labels all render in light ink (white/light gray), clearly legible against the dark background — no dark-on-dark failures observed. Legend text likewise legible.
      Data: Identical green (#009E73) and matte-red (#AE3030) fills to the light render — only chrome (background, text) flips as required. Percentage labels remain a fixed off-white and stay readable on both saturated fills.
      Legibility verdict: PASS — no dark-on-dark text, colors match the light render, no clipping.
