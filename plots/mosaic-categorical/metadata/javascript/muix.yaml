review:
  strengths:
  - 'Correct mosaic geometry: column widths follow the class marginals (24.7 / 21.7
    / 53.6 %) and the tile heights follow the conditional survival shares, so each
    tile''s area is proportional to its cell count (1st 203/122, 2nd 118/167, 3rd
    178/528, total 1,316)'
  - 'Semantic exception applied correctly: Survived in brand green #009E73 and Did
    not survive in the matte-red anchor #AE3030, the same in every column and in both
    themes'
  - 'Idiomatic MUI X v9 composition: ChartsContainer with a custom SVG layer drawn
    through the useXScale / useYScale / useDrawingArea hooks and a themed ChartsYAxis,
    with skipAnimation set'
  - 'Clear typographic hierarchy: bold class labels over soft n = … (share %) sublabels,
    a stated x-axis meaning (column width ∝ Passengers), and title, subtitle and legend
    bands that are theme-token driven and readable in both renders'
  - Even page-colored gaps between columns and stacked tiles set each class apart
    as a unit, and the gaps come out of the column before the shares are scaled, so
    the tile proportions are kept
  weaknesses:
  - 'Suggestion: the 2-point vertical gap shifts the tile boundaries slightly off
    the % axis (1st-class survival is 62.5 % but its edge reads about 61 %). A conditional-share
    label inside each large tile would let readers read the exact values.'
  - 'Suggestion: the residual color coding that the Notes allow (imprint_div by Pearson
    residual) would show where the association comes from, which the χ² subtitle only
    summarizes.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole 3200x1800 canvas.
      Chrome: bold dark title "Titanic Survival by Class · mosaic-categorical · javascript · muix · anyplot.ai" centered at about 50% of the width; a soft-ink subtitle "Passengers: 1,316 · 3 × 2 table · Pearson χ² = 133.1, df = 2"; a centered HTML legend "Outcome ■ Survived ■ Did not survive"; a left y-axis 0%–100% in 10% steps, titled "Outcome within Passenger class (%)"; bold column labels 1st / 2nd / 3rd Class with "n = 325 (24.7%)", "n = 285 (21.7%)", "n = 706 (53.6%)" below; x-axis title "Passenger class (column width ∝ Passengers)". All text is dark on light and readable.
      Data: three columns whose widths are proportional to the class totals, separated by page-colored gaps; green #009E73 Survived tiles at the bottom (about 61%, 41% and 25% tall) and matte-red #AE3030 Did not survive tiles above them, with a small gap between the stacked tiles.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: the title, legend title, class labels and axis title switch to light ink; the subtitle, n-labels and y ticks switch to soft light gray; the axis line and ticks are a light soft ink. Nothing is dark on dark, and all text is readable.
      Data: the green and red tile colors are identical to the light render; only the chrome flips. The gaps now show the dark page.
      Legibility verdict: PASS
