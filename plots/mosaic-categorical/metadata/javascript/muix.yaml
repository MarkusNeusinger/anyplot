review:
  strengths:
  - 'Elegant composition technique: builds an unsupported chart type (mosaic) from
    ScatterChart''s xScale/yScale plus a custom slots.scatter renderer, exactly the
    kind of richness-within-the-community-surface the library rules encourage'
  - Factually accurate, historically grounded data (survival rates match the real
    Titanic class breakdown)
  - Redundant encoding (color + consistent vertical position) keeps the red/green
    outcome distinction colorblind-safe
  - Clean theme handling - both renders pass the light/dark legibility check with
    zero deductions
  weaknesses:
  - Title renders noticeably smaller than the 50-70% width target due to the conservative
    length-based scaling formula - could grow the title fontsize slightly since there's
    headroom before overflow
  - The axis caption ("Passenger Class (width) - Survival rate (height)") is anchored
    under column 1 only, which can read as belonging to that column rather than the
    whole chart - consider centering it under the full plot width instead
  - Rectangles use flat fills with no edge treatment (e.g. a subtle ink stroke) that
    could add a touch more visual refinement per the style guide's optional outline
    pattern
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 - not pure white.
      Chrome: Title, custom legend (Survived/Did not survive), per-column class labels (1st/2nd/3rd Class), and the "Passenger Class (width) / Survival rate (height)" caption are all dark ink and clearly readable against the light background.
      Data: Bottom rectangle of each column (Survived) is brand green #009E73; top rectangle (Did not survive) is matte red #AE3030. Column widths encode class marginal share; rectangle heights encode conditional survival rate.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 - not pure black.
      Chrome: Title, legend, class labels, and caption all render in light ink and remain fully legible - no dark-on-dark failures observed.
      Data: Colors identical to the light render (#009E73 green / #AE3030 red) - only chrome flipped, confirming theme-adaptive tokens were used correctly.
      Legibility verdict: PASS
