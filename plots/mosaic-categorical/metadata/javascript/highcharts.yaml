review:
  strengths:
  - 'Correct mosaic semantics: rectangle widths are proportional to each department''s
    marginal share of headcount, heights are proportional to conditional rating shares
    within each department, and cell area is therefore faithfully proportional to
    cell frequency.'
  - 'Fully theme-correct chrome: warm off-white / near-black backgrounds, all text
    readable in both renders, and the Imprint categorical palette (green/violet/blue
    in canonical order) is pixel-identical between light and dark.'
  - 'Polished custom SVG drawing via chart.renderer: rounded rectangle corners, automatic
    luminance-based text contrast for in-cell counts, subtle percentage gridlines,
    and clear axis captions explaining the width/height encoding.'
  - Balanced canvas utilization (~67% plot area) with the legend positioned directly
    adjacent to the mosaic rather than isolated in empty space.
  - Realistic, neutral business dataset (performance ratings across four departments)
    with meaningful variation in both department size and rating distribution.
  weaknesses:
  - 'Library Mastery: series is left empty ([]) and the entire chart is hand-drawn
    via chart.renderer inside events.load, bypassing Highcharts'' series/axis system
    entirely. This is a defensible workaround since Highcharts core has no mosaic
    series, but it reads as very low-level — none of Highcharts'' higher-level idioms
    (dataLabels, plotOptions, a real xAxis/yAxis with a custom tickPositioner) are
    used. Routing more of the chrome through Highcharts'' own axis machinery would
    raise LM-01/LM-02.'
  - Data storytelling (DE-03) relies only on the passive width/height encoding — there
    is no explicit callout or annotation highlighting the most notable pattern (e.g.
    Sales' comparatively higher share of 'Below' ratings vs. Engineering). A subtle
    emphasis (accent color, small annotation) would strengthen the visual hierarchy.
  - 'Minor layout risk: the bottom caption (''Department · column width ∝ headcount'')
    sits only ~14 CSS px above the canvas bottom edge, and the legend header ''Performance
    rating'' comes close to the right canvas edge. Neither is clipped in the current
    render, but the margin is thin — add a few more px of buffer for robustness against
    future layout drift.'
  - 'CQ-01: the textColorFor() helper function breaks strict KISS Imports→Data→Plot→Save
    structure. It''s a small, justified utility for accessible label contrast, but
    could be inlined or replaced with a precomputed per-series lookup.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "mosaic-categorical · javascript · highcharts · anyplot.ai" in bold dark text, clearly legible. Y-axis percentage ticks (0/25/50/75/100%) and rotated axis title "Rating share within department" in soft dark gray, legible. Department labels (Engineering, Sales, Marketing, Support) and the bottom caption "Department · column width ∝ headcount" in soft dark gray, fully visible above the canvas edge. Legend "Performance rating" with Exceeds/Meets/Below entries, dark text, readable, positioned comfortably inside the right margin.
      Data: Four mosaic columns (one per department), each split into three stacked cells (Exceeds/Meets/Below). First series (Exceeds) renders in the brand green #009E73, Meets in violet, Below in blue — matching the canonical Imprint categorical order. In-cell counts (e.g. 42, 58, 10) use auto-contrasted text (white on green/blue, dark on violet) and are all legible.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Title renders in light/cream text, clearly legible against the dark background. Y-axis percentage ticks and the rotated axis title render in a light soft gray, legible. Department labels and the bottom caption are light gray and fully visible, not clipped. Legend text and header are light-colored and legible; no dark-on-dark text anywhere.
      Data: Same four mosaic columns with identical cell proportions and identical data colors (green/violet/blue) as the light render — only the chrome (background, text, grid, cell borders) flipped to the dark theme. In-cell counts remain legible with the same auto-contrast logic.
      Legibility verdict: PASS
