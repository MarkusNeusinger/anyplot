review:
  strengths:
  - 'Correct mosaic semantics: rectangle widths are proportional to each department''s
    marginal share of headcount, heights are proportional to conditional rating shares
    within each department, and cell area is therefore faithfully proportional to
    cell frequency.'
  - Now routes chrome through Highcharts' real xAxis/yAxis (linear scale 0..grandTotal
    with a custom tickPositions/formatter for department centers, and a real 0-100%
    yAxis) instead of hand-picked pixel margins — directly fixes the attempt-1 LM-01
    weakness and makes the layout robust to Highcharts' own reserved space for title/subtitle/legend.
  - 'Explicit data storytelling: a subtitle callout ("Sales has the highest ''Below''
    share, at 19%") is paired with an amber-highlighted stroke on that exact cell,
    giving the chart a clear focal point — directly fixes the attempt-1 DE-03 weakness.'
  - 'Fully theme-correct chrome: warm off-white / near-black backgrounds, all text
    legible in both renders, and the Imprint categorical palette (green/violet/blue
    in canonical order) is pixel-identical between light and dark.'
  - 'Polished custom SVG drawing via chart.renderer: rounded rectangle corners, luminance-based
    auto-contrast for in-cell counts, and a real Highcharts legend (title + swatches)
    driven by the series array.'
  - Margin risk from attempt 1 (bottom caption / legend header close to the canvas
    edge) is resolved — both now sit comfortably inside the canvas in both themes.
  - Realistic, neutral business dataset (performance ratings across four departments)
    with meaningful variation in both department size and rating distribution.
  weaknesses:
  - 'Library Mastery is still capped: the mosaic rectangles themselves are drawn manually
    via chart.renderer inside events.load (Highcharts core has no mosaic series),
    and the series array only carries empty-data placeholders to drive the legend.
    This is a defensible workaround per the library''s no-native-series allowance,
    but it means the chart''s core visual content still bypasses Highcharts'' series
    system.'
  - 'CQ-01: the luminance() helper remains a small standalone function, a minor deviation
    from a strictly linear Imports->Data->Plot->Save script structure (acceptable
    given its narrow purpose, but still not fully KISS).'
  - In-cell count labels are fixed at 14px regardless of cell size (only gated on
    a minimum cell size to appear at all) — the smallest labeled cell (Support 'Below'
    = 12) is worth double-checking for legibility at a ~400px thumbnail width.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "mosaic-categorical · javascript · highcharts · anyplot.ai" in bold dark text, clearly legible. Subtitle "Sales has the highest 'Below' share, at 19%" in soft dark gray, legible. Y-axis percentage ticks (0/25/50/75/100%) and rotated axis title "Rating share within department" in soft dark gray, legible. X-axis department labels (Engineering, Sales, Marketing, Support) and the bottom caption "Department · column width ∝ headcount" in soft dark gray, fully visible with comfortable margin above the canvas edge. Legend "Performance rating" with Exceeds/Meets/Below entries in dark text, fully inside the right margin, not clipped.
      Data: Four mosaic columns (one per department, width proportional to headcount), each split into three stacked cells (Exceeds/Meets/Below, height proportional to conditional share). First series (Exceeds) renders in the brand green #009E73, Meets in violet, Below in blue — matching the canonical Imprint categorical order. The Sales/Below cell has a distinct amber-gold stroke matching the subtitle's callout. In-cell counts (e.g. 42, 58, 10) use auto-contrasted text (white on green/blue, dark on violet) and are all legible.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Title and subtitle render in light/cream text, clearly legible against the dark background. Y-axis percentage ticks and the rotated axis title render in light soft gray, legible. Department labels and the bottom caption are light gray, fully visible, not clipped. Legend text and header are light-colored and legible; no dark-on-dark text anywhere.
      Data: Same four mosaic columns with identical cell proportions and identical data colors (green/violet/blue) as the light render — only the chrome (background, text, grid, cell borders) flipped to the dark theme. The same amber-gold stroke highlights the Sales/Below cell. In-cell counts remain legible with the same auto-contrast logic.
      Legibility verdict: PASS
