review:
  strengths:
  - 'Mosaic geometry computed from the table: column widths follow the class marginals,
    heights the conditional survival shares, small gaps keep each class block readable'
  - In-tile count + percentage labels make every cell readable without hover
  - layer_tooltips() with labelled Class/Status/Count/Share lines adds detail in the
    HTML output
  - Data-driven subtitle computes the best-vs-worst survival ratio instead of hard-coding
    it
  - Theme tokens threaded through every chrome element; both renders read cleanly
  weaknesses:
  - 'DE-02 (both): the panel is enclosed by a frame on all four sides, against the
    style guide''s L-shaped-or-none spine rule (a mosaic does not need an enclosed
    frame) → no top and right lines, or no axis lines at all. Likely cause: axis_line=element_line(color=INK_SOFT)
    under theme_minimal() draws the full panel outline; set axis_line=element_blank()
    or draw only the left and bottom lines.'
  - 'Suggestion: the subtitle and the x-axis title call the crew ''passengers'' (''Crew
    passengers'', ''Passenger class''); ''Class'' and ''crew members'' would be more
    exact.'
  - 'Suggestion: the white bold in-tile labels on the lavender #C475FD tiles have
    lower contrast than on green; INK-colored labels on the lavender tiles would read
    more evenly.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, not pure white
      Chrome: bold dark title 'mosaic-categorical · python · letsplot · anyplot.ai', INK_SOFT subtitle 'First Class passengers were 2.6× more likely to survive than Crew passengers', x-axis 'Passenger class (width ∝ count)' with class names centred under each column, y-axis 'Share within class (%)' with 0-100 ticks, legend 'Survival status' on the right; a thin INK_SOFT frame encloses the panel on all four sides; all text dark and readable
      Data: four columns (First, Second, Third Class, Crew) with widths proportional to headcount; Survived tiles #009E73 at the bottom, Did Not Survive tiles #C475FD on top; bold white count + percentage labels in every tile; page-colored gaps between tiles and columns
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17, not pure black
      Chrome: title and axis titles in light ink, ticks, subtitle and legend text in light gray; frame in muted gray; no dark-on-dark text
      Data: identical #009E73 / #C475FD fills and identical tile geometry; gaps now in the dark page color; white tile labels readable
      Legibility verdict: PASS
