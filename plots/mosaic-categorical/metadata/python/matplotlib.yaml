review:
  strengths:
  - 'statsmodels mosaic draws the contingency geometry correctly: column widths follow
    the class marginals and tile heights the conditional survival shares, with even
    gaps between tiles'
  - Theme tokens thread through title, axis titles, ticks, spines and the legend frame;
    both renders are fully legible and the data colors are identical
  - Text sizes follow the matplotlib reference (12/10/8 pt at dpi=400) on a canonical
    3200x1800 canvas with nothing clipped
  - 'Adaptable data block: tidy DataFrame with role-tagged column constants feeding
    axis labels and the legend title'
  weaknesses:
  - 'VQ-02 (both): the framed legend sits on top of the Third-class ''Did Not Survive''
    tile and covers about a sixth of its width in the upper-right corner → keep the
    legend clear of the tiles (outside the axes, for example below the x-axis or right
    of the plot). Likely cause: ax.legend(loc="upper right") inside the mosaic axes.'
  - 'DQ-02 (both): the chart is titled as the real Titanic, but its counts are invented
    (First 136/64, Second 87/93, Third 119/381; the historical passenger counts are
    about First 202/123, Second 118/167, Third 178/528) → use the historical counts
    or relabel as a fictional scenario. Likely cause: the PASSENGERS list in the data
    block.'
  - 'Suggestion: the y tick labels sit at the First-class tile centers only; labelling
    the levels in the legend alone (or per column) would avoid suggesting a shared
    boundary height.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 surface, 3200x1800.
      Chrome: title 'Titanic Passenger Survival · mosaic-categorical · python · matplotlib · anyplot.ai' in dark ink, about 70% of the width; x title 'Passenger Class', y title 'Survival Status' in dark ink; tick labels First/Second/Third and Survived/Did Not Survive in soft dark grey; framed legend 'Survival Status' upper right; all text readable.
      Data: six mosaic tiles separated by page-colored gaps; Survived in #009E73, Did Not Survive in lavender #C475FD; white bold counts 136/64, 87/93, 119/381; Third column widest. The legend box overlaps the top-right corner of the Third/Did Not Survive tile.
