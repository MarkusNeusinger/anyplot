  strengths:
  - Correct mosaic geometry with widths from class totals and heights from conditional
    survival shares
  - Real Titanic data loaded with sns.load_dataset, the spec's own example
  - Direct edge labels for both variables' levels plus a matching legend
  - Theme tokens threaded through set_theme rc; both renders readable with correct
    surfaces
  weaknesses:
  - 'VQ-05 (both): canvas is 5042x2636 instead of the landscape 3200x1800 → 3200x1800
    (-1842 x -836 px). Likely cause: figsize=(16, 9) at dpi=300 with bbox_inches=''tight''.'
  - 'CQ-05 (code): savefig uses dpi=300 with bbox_inches=''tight'' on a 16x9 figure,
    which the library prompt forbids → figsize=(8, 4.5), dpi=400, bbox_inches left
    at None. Likely cause: the plt.subplots and plt.savefig calls.'
  - 'VQ-01 (both): the 24 pt bold title spans ~98% of the canvas width and runs to
    the left edge → under 90% of the width (about -4 pt at the canonical canvas).
    Likely cause: set_title fontsize=24.'
  - 'CQ-04 (code): comments call the colours an ''Okabe-Ito palette'' and the second
    colour ''vermillion'', but IMPRINT[1] is the purple #C475FD → comments that name
    the Imprint palette and the real colour. Likely cause: stale comments above IMPRINT
    and color_not_survived.'
  - 'Suggestion: percentage labels alongside the counts, which the Notes allow, would
    make the survival shares direct to read.'
