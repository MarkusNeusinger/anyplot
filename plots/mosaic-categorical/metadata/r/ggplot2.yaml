review:
  strengths:
  - 'Correct mosaic geometry: column widths from the marginal totals and heights from
    the conditional proportions, computed in one dplyr group_by/cumsum pipeline'
  - Column labels carry the per-category sample size (n = 150 … 90) and the x-axis
    title names the width encoding
  - Page-colored tile borders give clean gaps that flip with the theme
  - 'Full theme adaptation: INK/INK_SOFT/ELEVATED_BG tokens thread through title,
    axes and legend in both renders'
  weaknesses:
  - 'VQ-07 (both): the ordered satisfaction levels Satisfied / Neutral / Unsatisfied
    are drawn in categorical positions 1-3 (#009E73, #C475FD, #4467A3), presenting
    an ordered scale as unrelated groups → ordered steps of imprint_div in their natural
    order: Satisfied #009E73 (good pole), Neutral in the theme-adaptive muted anchor
    (#6B6A63 light / #A8A79F dark), Unsatisfied #AE3030 (bad pole). Likely cause:
    scale_fill_manual(values = setNames(IMPRINT[1:3], satisfaction_levels)), a literal
    slice of a seven-hue constant.'
  - 'Suggestion: direct percentage labels on the larger tiles would let readers compare
    conditional shares without reading the y-axis.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 (sampled 250,248,241), 3200x1800.
