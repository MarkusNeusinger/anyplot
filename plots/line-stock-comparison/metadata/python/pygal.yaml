review:
  strengths:
  - All four series rebased to 100 on the first date and diverging cleanly, with a
    dashed muted reference line at 100 visible in both themes
  - Legend entries carry each symbol's final return, so the ranking reads without
    tracing line ends
  - Monthly-only x labels via x_labels_major and show_minor_x_labels=False keep a
    252-point daily axis clean
  - Per-point dict labels give native pygal hover tooltips (symbol, date, value) in
    the interactive HTML
  - 'Adaptable structure: tidy df, pivot_table and a loop over columns, no per-ticker
    copy-paste'
  weaknesses:
  - 'VQ-05 (both): y tick labels show two sizes — 100 and 150 render at 44 px while
    70-170 render at 56 px → one size for all ticks, 44 px (-12 px on the minor labels).
    Likely cause: label_font_size=56 vs major_label_font_size=44 in Style (line 82-83).'
  - 'VQ-07 (dark): horizontal grid lines take pygal''s default black guide color and
    almost vanish on #1A1A17 → muted grid from INK_MUTED. Likely cause: guide_stroke_color
    and major_guide_stroke_color not set in Style.'
  - 'SC-02 (both): y axis titled ''Rebased Price (Start = 100)'' names a price, while
    the spec asks for an index or change from the start → e.g. ''Performance index
    (start = 100)''. Likely cause: y_title on line 101.'
  - 'DQ-02 (both): real tickers AAPL, GOOGL, MSFT and SPY on real 2024 trading dates
    carry invented paths (MSFT -31.7%, SPY +58.5% in 2024) → replace the scenario
    with clearly fictional symbols or real-shaped figures. Likely cause: the daily_return
    dict keyed by real tickers.'
  - 'CQ-01 (code): helper function fmt_ret (lines 62-64) → inline f-string f"{r:+.1f}%".
    Likely cause: formatting factored into a def.'
  - 'Suggestion: the best performer''s 6 px stroke barely reads against the 3 px lines;
    a clearer weight step would make the intended focal point visible.'
