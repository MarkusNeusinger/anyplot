review:
  strengths:
  - Rebasing computed from the data (price / first price * 100 via groupby transform),
    so every line starts together at 100
  - Colored end-of-series labels with the final index value identify each stock without
    a trip to the legend
  - Best and worst performers drawn thicker, giving a clear focal hierarchy
  - Dashed Span at 100 in INK_SOFT stays subordinate to the series and reads in both
    themes
  - HoverTool in vline mode with symbol, date and rebased value, plus click-to-hide
    legend, in the HTML artifact
  - Horizontal legend in the 'above' slot keeps the plot area free of chrome
  weaknesses:
  - 'VQ-06 (both): the y-axis title ''Rebased price (start = 100)'' names the axis
    as a price, while C2 asks for an index or change from the start → e.g. ''Performance
    index (start = 100)''. Likely cause: y_axis_label=f"Rebased price (start = {BASE})".'
  - 'Suggestion: the x range runs to March 2025 while the data ends in December 2024;
    a right padding just wide enough for the end labels would drop the Jan-Mar 2025
    ticks over empty space.'
  - 'Suggestion: a few dated event spans (earnings, index rebalancing), which the
    Notes allow, would add context.'
