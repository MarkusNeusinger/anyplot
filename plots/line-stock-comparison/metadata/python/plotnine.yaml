review:
  strengths:
  - 'Rebasing done in the data: price / groupby().transform(''first'') * 100, so all
    four lines start exactly at 100 on the first date'
  - 'Canonical Imprint order taken from the data order via scale_color_manual(limits=groups),
    first series #009E73, identical in both themes'
  - 'Benchmark hierarchy: SPY drawn at 1.7 against 1.1 for the stocks, so the comparison
    reads against the index'
  - Dashed reference line at 100 in INK_SOFT stays subordinate to the series and visible
    in both themes
  - Theme tokens threaded through every chrome element; no dark-on-dark text in the
    dark render
  - 'Idiomatic plotnine layering: per-geom data=, scale_x_date with date_breaks and
    date_labels'
  weaknesses:
  - 'SC-04 (both): the ochre shading between the SPY line and the 100 reference has
    no legend key or label, so a reader must guess what it encodes → remove the unrequested
    ribbon (or give it a key). Likely cause: geom_ribbon(data=ribbon_df, fill=bench_color)
    outside any mapped scale.'
  - 'DQ-03 (code): SPY, an index of these large caps, ends at 149 (+49 %) while AAPL,
    GOOGL and MSFT end at 111, 115 and 93 → an index return between its constituents,
    roughly +10 to +25 % (about −25 to −40 points). Likely cause: the four series
    are drawn from independent random walks with no common market factor, so SPY is
    not tied to the stocks it contains.'
  - 'Suggestion: the legend duplicates the colored end labels; a smaller legend or
    one placed inside the empty lower right would give the lines more width.'
