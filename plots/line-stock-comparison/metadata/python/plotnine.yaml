review:
  strengths:
  - Rebasing is computed idiomatically with df.groupby(SYMBOL)[PRICE].transform('first');
    all four lines start together at 100 on 2 Jan 2024 and fan out by relative performance
  - Data model ties every stock to the SPY market factor through its own beta, so
    the index ends at 115, plausibly between its constituents (GOOGL 95, AAPL 124,
    MSFT 148)
  - Benchmark SPY drawn heavier (size 1.7 vs 1.1), giving the comparison a clear reference
    series the Notes do not prescribe
  - Per-layer data= on geom_line/geom_point/geom_text and scale_x_date(date_breaks,
    date_labels, limits) used as plotnine intends; x range padded so the end markers
    have room
  - 'Theme tokens threaded through every chrome element: both renders fully legible,
    dashed 100 reference in INK_SOFT is visible yet thinner than the series'
  weaknesses:
  - 'Suggestion: the right-side legend repeats the colored end-of-line labels; dropping
    it (legend_position=''none'') would give the lines more width.'
  - 'Suggestion: an optional vertical span behind the lines (e.g. an earnings season)
    would give the reader a time anchor, as the Notes allow.'
