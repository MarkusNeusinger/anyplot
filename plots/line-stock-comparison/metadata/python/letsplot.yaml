review:
  strengths:
  - Every series is rebased to 100 at the first date in a single groupby().transform,
    so all four lines start together and separate by relative performance (C1)
  - Y axis titled 'Performance (rebased to 100)' and auto-ranged around 100 without
    being forced to zero (C2)
  - 'Imprint palette in canonical order with AAPL as #009E73; the four lines stay
    distinct in both themes and the legend identifies every symbol (C3)'
  - Dashed reference line at 100 in INK_SOFT at alpha 0.6 stays subordinate to the
    series and visible on both backgrounds (C4)
  - 'Theme tokens threaded through every chrome element: no dark-on-dark or light-on-light
    text in either render'
  - layer_tooltips() with .format('^y', '.1f') and per-line symbol/value rows gives
    the HTML output a clean hover readout
  - Frameless panel with a subtle y-only grid, as the style guide asks for line charts
  - 'Simulated returns are centred so each one-year return follows its drift: SPY
    ends near +13 %, a plausible index year'
  weaknesses:
  - 'Suggestion: a light vertical span behind the lines for one notable period (an
    earnings season or a drawdown) would use the event highlight the Notes allow.'
  - 'Suggestion: the x axis runs to an empty ''Jan'' tick past the last trading day
    in mid-December; limiting the x expansion would close that strip.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole 3200x1800 canvas, not pure white.
      Chrome: title "line-stock-comparison · python · letsplot · anyplot.ai" top-left in dark ink; y-axis title "Performance (rebased to 100)", x-axis title "Date"; month ticks Jan-Jan and y ticks 85-135 in INK_SOFT, all readable. No panel frame or axis lines; subtle horizontal grid only. Legend at right, "Symbol" over AAPL/GOOGL/MSFT/SPY line samples on an elevated #FFFDF6 box.
      Data: four lines (size 1.5, alpha 0.9) over 252 business days: AAPL #009E73 (first series), GOOGL #C475FD, MSFT #4467A3, SPY #BD8233. All start at 100; AAPL dips to about 82 and recovers to about 121, MSFT ends highest near 126 after a peak near 137, SPY ends about 113, GOOGL about 111 after a September peak near 136. Dashed grey reference at 100 behind the lines.
