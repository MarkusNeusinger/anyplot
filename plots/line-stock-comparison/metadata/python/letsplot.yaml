review:
  strengths:
  - Every series is rebased to 100 at the first date in a single groupby().transform,
    so all four lines start together and separate by relative performance (C1)
  - Y axis titled 'Performance (rebased to 100)' and auto-ranged around 100 (about
    80-170) without being forced to zero (C2)
  - 'Imprint palette in canonical order with AAPL as #009E73; the four lines stay
    distinct in both themes and the legend identifies every symbol (C3)'
  - Dashed reference line at 100 in INK_SOFT at alpha 0.6 stays subordinate to the
    series and visible on both backgrounds (C4)
  - 'Theme tokens threaded through every chrome element: no dark-on-dark or light-on-light
    text in either render'
  - layer_tooltips() with a .format('^y', '.1f') and per-line symbol/value rows gives
    the HTML output a clean hover readout
  - Column constants and a Data block that ends in one tidy df make the script adaptable
    to a user's own price table
  weaknesses:
  - 'DE-02 (both): the plot panel is framed by all four spines (a dark rectangle on
    light, a grey one on dark) and the grid runs on both axes, where the style guide
    asks for an L-shaped or no frame and a y-only grid on line charts → remove the
    top and right spines and the vertical grid lines. Likely cause: the theme draws
    a panel border; set panel_border=element_blank() (or axis_line only on x and y)
    and panel_grid_major_x=element_blank().'
  - 'DQ-03 (both): SPY, an S&P 500 index ETF with the lowest volatility parameter,
    ends at about 164, a +64 % year that beats every single stock; an index gain of
    that size is outside its realistic one-year range (roughly −20 % to +30 %) → generate
    the data so SPY ends within about 85-130 (about −35 points). Likely cause: np.random.seed(42)
    with drift 0.0005 draws a lucky SPY path; lower the SPY drift or choose returns
    so the index ends in range.'
  - 'Suggestion: a light vertical span behind the lines for one notable period (an
    earnings season or a market drawdown) would use the event highlight the Notes
    allow.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole 3200x1800 canvas, not pure white.
      Chrome: title "line-stock-comparison · python · letsplot · anyplot.ai" top-left in dark ink, about half the canvas width; y-axis title "Performance (rebased to 100)", x-axis title "Date"; month ticks Jan-Jan and y ticks 80-170 in INK_SOFT, all clearly readable. Subtle grid on both axes; a dark four-sided frame encloses the panel. Legend at right, "Symbol" over AAPL/GOOGL/MSFT/SPY with line samples on an elevated #FFFDF6 box.
      Data: four thick lines (size 1.5, alpha 0.9) over 252 business days: AAPL #009E73 (first series), GOOGL #C475FD, MSFT #4467A3, SPY #BD8233 in canonical Imprint order. All start at 100 in January; SPY climbs to about 164, GOOGL peaks near 148 in September and ends about 126, AAPL ends about 119, MSFT ends about 92. Dashed grey reference line at 100 behind the series.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17, not pure black.
      Chrome: title, axis titles in light #F0EFE8, ticks in #B8B7B0, all clearly readable; no dark-on-dark text. Grid subtle; the panel frame is a grey four-sided rectangle. Legend box elevated #242420 with light text.
      Data: the four line colors are identical to the light render; brand green AAPL clearly visible. Dashed reference line at 100 visible in light grey.
      Legibility verdict: PASS
