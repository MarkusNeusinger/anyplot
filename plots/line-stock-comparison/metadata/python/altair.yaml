review:
  strengths:
  - 'Canvas filled correctly through autosize type=fit with contains=padding: the
    chart occupies the full 3200x1800 frame with no empty border in either render'
  - 'Imprint palette in canonical order (AAPL #009E73, GOOGL #C475FD, MSFT #4467A3,
    SPY #BD8233) with identical data colors in both themes; all four lines clearly
    distinguishable'
  - The SPY benchmark is drawn thicker through alt.condition on alt.datum, which gives
    the comparison a reference series without adding a layer
  - 'Complete theme-adaptive chrome: the page, the grid at 10 % ink, the INK_SOFT
    ticks and domain, and the elevated legend box all flip correctly, with no dark-on-dark
    text'
  - Dashed INK_SOFT reference rule at 100, layered behind the lines and subordinate
    to them, so gains and losses read above and below it
  - Column constants with escaped fields and explicit encoding types follow the library's
    data-block pattern; formatted tooltips add value inspection in the HTML output
  weaknesses:
  - 'SC-02 (both): the series do not begin together at 100 on the first date (GOOGL
    starts at about 102.5, MSFT at about 99.5, AAPL at about 100.5), against C1 →
    every line starts at exactly 100 (signed delta up to −2.5 index points for GOOGL).
    Likely cause: REBASED = BASE * np.cumprod(1 + returns) applies the first day''s
    return to the base; generate a price series and rebase it as price / price[0]
    * 100, or prepend a zero return.'
  - 'VQ-06 (both): the y-axis title ''Rebased price (start = 100)'' names the axis
    as a price, while C2 asks for an index or change from the start → for example
    ''Performance index (start = 100)''. Likely cause: the REBASED column name, which
    doubles as the axis title.'
  - 'Suggestion: label the first x tick ''January'' instead of the year ''2024'' so
    the month ticks read as one series.'
  - 'Suggestion: a click-bound legend selection that fades the other symbols would
    make the HTML view easier to explore.'
