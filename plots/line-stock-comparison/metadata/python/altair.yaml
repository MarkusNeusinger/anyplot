review:
  strengths:
  - 'Canvas filled through autosize type=fit with contains=padding: the chart occupies
    the full 3200x1800 frame in both renders'
  - Every series is rebased as price / first price * 100, so all four lines start
    together at exactly 100 on the first date
  - 'Imprint palette in canonical order (AAPL #009E73, GOOGL #C475FD, MSFT #4467A3,
    SPY #BD8233), identical data colors in both themes'
  - The SPY benchmark is drawn thicker through alt.condition on alt.datum, giving
    the comparison a reference series inside one mark
  - Dashed INK_SOFT reference rule at 100 layered behind the lines and subordinate
    to them, visible in both themes
  - Complete theme-adaptive chrome (grid at 10 % ink, INK_SOFT ticks, elevated legend
    box) with no dark-on-dark text; formatted tooltips in the HTML output
  weaknesses:
  - 'Suggestion: label the first x tick ''January'' instead of the year ''2024'' so
    the month ticks read as one series.'
  - 'Suggestion: a click-bound legend selection (alt.selection_point bound to the
    legend) that fades the other symbols would make the HTML view easier to explore.'
