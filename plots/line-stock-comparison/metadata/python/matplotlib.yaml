    and axis label taken from the constants'
  weaknesses:
  - 'DQ-03 (both): SPY, a broad market index, ends near 159 (+59 %) after one year
    and outperforms every single stock, beyond a plausible one-year index return (about
    -20 to +30 %) → an SPY path ending roughly 105-130 (about -30 to -55 points).
    Likely cause: the seeded random walk for SPY (seed 42, drift 0.0004, vol 0.010)
    draws an outlier path; choose the seed or parameters so the index lands in range.'
  - 'Suggestion: an end label for each series (not only the benchmark) would let the
    reader read final performance without the legend.'
