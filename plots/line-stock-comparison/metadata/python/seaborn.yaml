review:
  strengths:
  - Every series is rebased in the data computation (price / first price * 100 via
    groupby().transform('first')), so all four lines start together at exactly 100
    on the first date.
  - 'Imprint positions 1-4 in canonical order, identical in both renders, with theme-correct
    chrome on #FAF8F1 and #1A1A17.'
  - Reference line at 100 is dashed, INK_SOFT at alpha 0.6 and drawn at zorder 0,
    subordinate to the series and visible in both themes.
  - 'Idiomatic seaborn: one sns.lineplot call on long-form data with hue/hue_order
    and a palette dict, sns.move_legend to place the legend outside the axes, sns.despine.'
  - plt.tight_layout() fills the fixed 3200x1800 canvas with no clipping.
  weaknesses:
  - 'Suggestion: an index-style y label such as ''Indexed performance (start = 100)''
    would read even less like a price than ''Rebased price''.'
