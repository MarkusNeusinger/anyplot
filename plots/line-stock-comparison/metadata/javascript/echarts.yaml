review:
  strengths:
  - 'Correct Imprint palette usage — first series (AAPL) renders as #009E73, remaining
    series follow canonical order (lavender, blue, ochre); data colors identical between
    light and dark renders'
  - Theme-adaptive chrome is fully correct in both renders — warm off-white/near-black
    backgrounds, readable ink-toned text, subtle horizontal grid only
  - Rebase-to-100 logic is implemented correctly (rebased = price / first_price *
    100) with a clear, descriptive Y-axis label "Rebased Price (Start = 100)"
  - Dashed markLine at y=100 gives a clean, idiomatic ECharts reference line for the
    starting point, directly supporting the spec's suggested feature
  - Time-typed x-axis with automatic month-tick formatting is idiomatic ECharts usage
    and avoids manual date-label wrangling
  - Y-axis bounds are computed tightly from the actual rebased data range instead
    of forcing a 0 baseline, so the comparison band fills the canvas well
  - Deterministic LCG-seeded random walk produces a realistic, varied story — clear
    winner (GOOGL), clear laggard (AAPL), and a relatively flat benchmark (SPY)
  weaknesses:
  - 'DE-01: Relies on the mandated Imprint palette and clean defaults without a distinctive
    custom polish layer (e.g. no subtle line-emphasis, no gradient/area accents) —
    reads as a well-configured default rather than a genuinely bespoke design'
  - 'DE-03: No end-of-series labels or callouts identifying the best/worst performer
    at the chart''s end — the dashed 100-line gives a reference point, but the story
    (GOOGL leads, AAPL lags) still has to be read off the legend rather than being
    emphasized visually'
  - 'VQ-03: In the densest crossing zones (Feb-Apr, Jun-Aug) the four 3px lines overlap
    heavily and are momentarily hard to individually trace — a touch of alpha (~0.85-0.9)
    on lineStyle or a subtle z-emphasis for the highlighted symbol would reduce clutter'
  - 'VQ-06 (minor): The x-axis has no explicit axis name (e.g. "Date"); the time-typed
    month ticks make this a common, acceptable omission, but an explicit name would
    remove any ambiguity'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "line-stock-comparison · javascript · echarts · anyplot.ai" is dark, bold-ish, centered, fully readable. Legend (AAPL, GOOGL, MSFT, SPY) sits just below the title in soft dark text with matching-color line/circle swatches — clearly readable. Y-axis tick labels (85-140) and axis name "Rebased Price (Start = 100)" are dark and legible. X-axis month ticks (Feb-Dec) are dark and legible. Horizontal grid lines are subtle light-gray, visible but not competing with data. A black dashed reference line marks y=100.
      Data: Four lines in Imprint palette order — AAPL brand green (#009E73), GOOGL lavender, MSFT blue, SPY ochre — all clearly distinguishable from the background and from each other.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Title is light/near-white, centered, fully readable against the dark background. Legend labels are light-gray, readable. Y-axis and X-axis tick labels are light-gray/soft-white, clearly legible — no dark-on-dark failures observed. Grid lines are subtle light gray at low opacity, visible but unobtrusive. The y=100 reference line is now a light-dashed line, correctly flipped for the dark surface.
      Data: Same four line colors as the light render (brand green, lavender, blue, ochre) — confirmed identical, only chrome (background, text, grid, reference-line color) flips between themes.
      Legibility verdict: PASS
