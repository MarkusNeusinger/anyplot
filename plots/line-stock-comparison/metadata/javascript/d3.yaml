review:
  strengths:
  - Correct Imprint palette in canonical order with FSLR (#009E73) as the first series,
    preserved identically between light and dark renders
  - 'Both renders are fully theme-correct: warm off-white (#FAF8F1) and warm near-black
    (#1A1A17) backgrounds, all text and gridlines legible in both'
  - Direct end-of-line labeling (NEE, FSLR, ENPH, ICLN) combined with a detailed legend
    (symbol + company name) makes each series easy to identify without color-guessing
  - Dashed reference line at rebased = 100 with an inline 'start = 100' label directly
    fulfills the spec's optional baseline suggestion
  - Realistic, neutral clean-energy dataset (FSLR, ENPH, NEE, ICLN) with genuinely
    differentiated drift/volatility per series shows both winners and laggards plus
    an ETF benchmark
  - 'Idiomatic D3: data joins (.data().join()), scaleTime/scaleLinear/scaleOrdinal,
    axisBottom/axisLeft, curveMonotoneX, and explicit font sizes throughout'
  - Canvas is correctly sized (3200x1800) with no edge clipping and no leaking library
    defaults
  weaknesses:
  - Axis domain/spine lines are still drawn (stroke=inkSoft on the .domain path) on
    both left and bottom axes — removing or lightening them would push Visual Refinement
    closer to the 'perfect' tier expected for a top score
  - The persistent top-right legend and the inline endpoint labels (NEE, FSLR, ENPH,
    ICLN) duplicate the same identification info — consider dropping one of the two
    to reduce redundancy and tighten the composition
  - Library Mastery is solid but generic for D3 (standard line/axis/scale idioms);
    a more distinctive D3-specific technique (e.g. a bisector-driven crosshair guide,
    or computed peak/trough annotations) would raise LM-02 above the 'some library-specific
    features' tier
  - No single series or moment is visually emphasized as the story's focal point (e.g.
    FSLR's August peak or NEE's steady late-year climb) — a small annotation on the
    standout move would push Data Storytelling (DE-03) further
