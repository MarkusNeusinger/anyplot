review:
  strengths:
  - 'All four series are rebased on their own first date and start together at exactly
    100, then separate cleanly: MSFT ends near 121, SPY near 117, AAPL near 116 and
    GOOGL below the base near 94'
  - Native ChartsReferenceLine composed as a LineChart child draws a dashed inkSoft
    line at 100 with an end-aligned 'Start = 100' label, subordinate to the series
    and visible in both themes
  - Time-scale x axis with a context-aware valueFormatter (month + year on ticks,
    full day in the tooltip) and per-series valueFormatter rounding the rebased value
    for the HTML tooltip
  - Y limits come from the data plus a 6 % pad, so the axis covers 94–122 around 100
    without being forced to zero
  - Left-aligned title and an informative subtitle (series count, trading days, date
    range, rebasing note) built from the data, with the legend right-aligned above
    the plot
  - 'Imprint palette threaded from window.ANYPLOT_TOKENS in canonical order (AAPL
    #009E73 first); chrome uses ink / inkSoft / grid tokens so both themes read correctly'
  - monotoneX curve joins the daily values without spline overshoot; marks off, 2.5
    px strokes suit 252 points per series
  weaknesses:
  - 'Suggestion: the header''s ''Library: muix 7.29.1'' line names a v7 version while
    the code targets the pinned v9 API; the header rewrite fixes it, but writing the
    pinned version would avoid confusion.'
  - 'Suggestion: slightly heavier strokes (about 3 px) would help the four lines stay
    apart in the 400 px thumbnail where they bunch near the start.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, no white panel.
      Chrome: bold dark title "line-stock-comparison · javascript · muix · anyplot.ai" top-left with a softer subtitle ("4 series · 252 trading days · Jan 2, 2025 to Dec 19, 2025 · Adjusted close (USD) rebased to 100"); y label "Performance index (first date = 100)" rotated, ticks 94–122 step 2; x label "Trading date", monthly ticks Feb 2025 … Dec 2025; subtle horizontal grid; horizontal legend top-right (AAPL, GOOGL, MSFT, SPY). All text dark and readable.
      Data: four lines — AAPL green #009E73, GOOGL purple, MSFT blue, SPY ochre — all starting at 100 on Jan 2; dashed grey reference line at 100 labelled "Start = 100" at the right end. MSFT ends highest (~121), SPY ~117, AAPL ~116, GOOGL falls below the base to ~94.
      Legibility verdict: PASS

