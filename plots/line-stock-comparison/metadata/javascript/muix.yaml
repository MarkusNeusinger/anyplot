review:
  strengths:
  - Smart semantic use of the theme-adaptive `neutral` ink token (t.ink) for the S&P
    500 benchmark line, matching the style guide's semantic-anchor table role of 'totals
    / baseline / outline / reference line' rather than burning a categorical palette
    slot — reinforced with a dashed stroke for redundant encoding.
  - 'Careful workaround for a real MUI X y-axis label collision issue: a hand-rotated
    Typography label in its own flex column, documented in code comments, avoids the
    library''s hardcoded tick-width offset colliding with 3-digit tick labels.'
  - Reference line at 100 with a subtle dashed style and 'Start (100)' label directly
    satisfies the spec's optional note about a horizontal reference line at the starting
    point.
  - Deterministic seeded LCG data generation for four series with plausible drift/volatility
    per stock, correctly rebased to 100 at the first session.
  - Distinctive per-series stroke styling (thicker solid lines for the three stocks,
    thinner dashed line for the benchmark) creates clear visual hierarchy separating
    the subject stocks from the reference index.
  weaknesses:
  - 'Grid lines use a dashed stroke (`strokeDasharray: "4 3"` on `.MuiChartsGrid-line`),
    but the style guide''s Grid Guidelines specify solid thin lines for grid (opacity
    15-25%, ''not dashed'') — switch the grid stroke to solid to match spec; reserve
    dashed strokes for the reference line and benchmark series only.'
  - Data storytelling stays at a competent baseline (clear color hierarchy, reference
    line) but doesn't add any further emphasis (e.g. end-of-series value callouts,
    or highlighting the eventual winner/loser) that would push it from good to distinctive.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Bold dark title "line-stock-comparison · javascript · muix · anyplot.ai" top-left; rotated y-axis label "Rebased price (start = 100)" in soft dark gray; x-axis label "Date"; tick labels on both axes in medium-gray, fully legible; horizontal gridlines are dashed and subtle; legend (row layout, 4 entries with color swatches) sits below the title, fully readable.
      Data: Four lines — AAPL in brand green (#009E73), GOOGL in lavender (#C475FD), MSFT in blue (#4467A3), all solid ~2.5px strokes; SPY benchmark in near-black dashed stroke using the theme-adaptive "neutral" ink token. A dashed horizontal reference line at y=100 with a "Start (100)" label sits mid-chart. All four series and the reference line are clearly distinguishable from each other and from the background.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Title, axis labels, and tick labels have flipped to light/off-white text, fully legible against the dark background; gridlines remain subtle dashed lines in a lighter tone; legend text and swatches are clearly visible.
      Data: AAPL green, GOOGL lavender, and MSFT blue are pixel-identical to the light render (correct — only chrome should flip). The SPY benchmark line has flipped from near-black to near-white dashed, which is the intended behavior of the theme-adaptive "neutral" semantic anchor (used here for a baseline/reference series, not a categorical color) rather than a bug. No dark-on-dark text anywhere; the brand green remains highly visible against the dark surface.
      Legibility verdict: PASS
