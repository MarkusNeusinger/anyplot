review:
  strengths:
  - 'Grid-line fix applied correctly: ''.MuiChartsGrid-line'' now renders solid subtle
    strokes (stroke: t.grid, strokeOpacity: 0.2) instead of the previous dashed grid,
    matching the style guide''s Grid Guidelines and freeing dashed strokes for the
    reference line and benchmark series only.'
  - Smart semantic use of the theme-adaptive 'neutral' ink token (t.ink) for the S&P
    500 benchmark line, matching the style guide's semantic-anchor role of 'totals
    / baseline / outline / reference line' rather than burning a categorical palette
    slot — reinforced with a dashed stroke for redundant encoding.
  - 'Careful workaround for a real MUI X y-axis label collision: a hand-rotated Typography
    label in its own flex column avoids the library''s hardcoded tick-width offset
    colliding with 3-digit tick labels.'
  - Reference line at 100 with a subtle dashed style and 'Start (100)' label directly
    satisfies the spec's optional note about a horizontal reference line at the starting
    point.
  - Deterministic seeded LCG data generation for four series with plausible drift/volatility
    per stock, correctly rebased to 100 at the first session.
  - Distinctive per-series stroke styling (thicker solid lines for stocks, thinner
    dashed line for the benchmark) creates clear visual hierarchy.
  weaknesses:
  - Data storytelling stays at a competent baseline but doesn't add further emphasis
    (e.g. end-of-series value callouts or a subtle end-label showing final rebased
    value) that would push it from good to distinctive.
  - Text legibility relies on explicit but modest font sizes (14-16px axis, 22px title)
    — fine at full resolution but leaves little margin at ~400px mobile scaling; a
    touch larger tick/legend text would be safer.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Bold dark title "line-stock-comparison · javascript · muix · anyplot.ai" top-left; row-layout legend with 4 swatches below it; rotated y-axis label "Rebased price (start = 100)" in its own column; x-axis label "Date"; solid, subtle horizontal grid lines (fixed from the previous dashed grid); dark tick labels on both axes, all clearly legible against the light background.
      Data: AAPL renders in Imprint brand green (#009E73), GOOGL in lavender (palette position 2), MSFT in blue (palette position 3), each as solid ~2.5px lines. The SPY benchmark renders as a near-black dashed line using the theme-adaptive "ink"/neutral token. A dashed reference line at y=100 with a "Start (100)" label sits mid-chart, not colliding with any series.
      Legibility verdict: PASS — no light-on-light issues, no overlap between text and data/legend.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Title, axis labels, tick labels, and grid all flip to light/off-white tones and remain fully legible; grid lines stay solid and subtle (same fix verified in this theme).
      Data: AAPL/GOOGL/MSFT colors are pixel-identical to the light render (confirmed data-color consistency across themes). The SPY benchmark line flips from near-black to near-white dashed — intended behavior of the theme-adaptive "neutral" semantic anchor for a baseline/reference series, not a defect.
      Legibility verdict: PASS — no dark-on-dark text anywhere; brand green remains highly visible on the dark surface.

    Grid-line verification: cropped and zoomed a region of plot-light.png (y-axis 108-110 gridlines) to confirm the strokes are solid, thin, and subtle (no dash pattern) — the attempt-1 weakness (dashed grid contradicting the style guide) is resolved.
