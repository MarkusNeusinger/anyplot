review:
  strengths:
  - Correct rebasing math (price / first_price * 100) with all four series starting
    exactly at 100
  - Custom native Chart.js plugin (afterDraw hook) draws the Start = 100 dashed reference
    line and label without any external annotation dependency
  - 'First series is #009E73 brand green, remaining series follow Imprint canonical
    order; identical data colors across both themes'
  - Deterministic in-memory data generation via a small seeded LCG (seed = 42), no
    external RNG needed
  - 'Data tells a real story: MSFT/GOOGL trending up, AAPL diverging below the SPY
    benchmark by year-end'
  - Title format is an exact match, legend labels correctly show ticker symbols, axis
    titles are descriptive
  weaknesses:
  - 'The Start = 100 baseline label is hardcoded to font: 13px sans-serif instead
    of reusing the chart''s tick font (14px) and theme font family/token'
  - Line width (2.5px) sits at the low end of the moderate range for only 4 series
    - style guide recommends thicker lines when series count is low (1-3)
  - No explicit visual emphasis on the year's best/worst performer (e.g., end-of-line
    label or highlighted final value) - divergence is visible but not called out
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 target - not pure white.
