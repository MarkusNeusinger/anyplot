    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "line-stock-comparison · javascript · highcharts · anyplot.ai" is bold dark text, fully visible at top with no clipping. X-axis title "Trading Date (2024)" and Y-axis title "Rebased Price (Start = 100)" are dark/soft-ink and clearly readable. Tick labels (months on X, price values on Y) are legible. Horizontal gridlines are subtle light-gray, present but not competing with data. A dashed horizontal plotLine at Y=100 carries a small "Start (100)" label in the upper-right area, fully legible. Legend below the plot lists all four series with matching line-style swatches (3 solid, 1 dashed), text is dark and readable.
      Data: Four series — Solaris Power (SOLR) in brand green #009E73 (solid), Windfield Energy (WNDF) in lavender/purple (solid), HydroGen Corp (HYDR) in blue (solid), Clean Energy Index (XCEI) in ochre (dashed, benchmark). All four rebase to 100 at the start of January and diverge over the year, crossing the 100 reference line multiple times — clear differentiation between series via both hue and line style.
      Legibility verdict: PASS — no light-on-light text found, all chrome elements clearly readable against the light background.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Title renders in light/white text, fully visible and uncut. Axis titles and tick labels render in light gray/soft-white tones, clearly legible against the dark surface. Gridlines are faint light-gray horizontal lines, subtle but visible. The "Start (100)" plotLine and label are visible in light gray. Legend text at the bottom is light-colored and fully readable.
      Data: Confirmed identical hues to the light render — brand green, lavender, blue, and dashed ochre — only the chrome (background, text, grid) flips to the dark theme; the four categorical data colors are unchanged between renders.
