review:
  strengths:
  - All lines start together at exactly 100 (cumprod from 1.0) and separate by relative
    performance; dashed reference at 100 is subordinate yet visible in both themes
  - Bold, series-colored end-of-line labels let each final value be read without the
    legend
  - Theme tokens thread through every chrome element; Imprint line colors identical
    across light and dark
  - 'Idiomatic ggplot2: named theme object on theme_minimal, scale_x_date with date_breaks,
    annotate(''label'') callouts, coord_cartesian(clip = ''off'')'
  weaknesses:
  - 'VQ-02, SC-02 (both): the rotated ''NVDA AI Surge'' and ''Rates Peak'' label boxes
    are drawn on top of the lines and cover segments of MSFT, AAPL, SPY and NVDA around
    late May and late October, against C5''s ''stay behind the lines'' → place the
    callouts where no series runs (e.g. ''NVDA AI Surge'' above y≈150, ''Rates Peak''
    below y≈90) or draw them before geom_line. Likely cause: annotate(''label'', y
    = 102, hjust = 0) layered after geom_line().'
  - 'VQ-07 (both): AAPL, the third series, is drawn in matte red #AE3030 and SPY in
    blue #4467A3, skipping ochre; with no loss meaning per ticker, canonical order
    is #009E73, #C475FD, #4467A3, #BD8233 → AAPL #4467A3, SPY #BD8233. Likely cause:
    IMPRINT <- c(''#009E73'', ''#C475FD'', ''#AE3030'', ''#4467A3'') instead of the
    eight-hue Imprint list indexed by position.'
  - 'DQ-02 (both): real tickers NVDA, MSFT, AAPL and SPY plus real 2023 events (SVB
    collapse, ''NVDA AI Surge'') carry invented random-walk prices — e.g. AAPL ends
    2023 at about 88 and NVDA at about 139, far from their actual year → use fictional
    tickers/company names for the simulated series (or real data). Likely cause: tickers
    <- c(''NVDA'', ''MSFT'', ''AAPL'', ''SPY'') on rnorm returns.'
  - 'Suggestion: the legend repeats what the bold end-of-line labels already say;
    one of the two could carry the identification alone and give the panel more height.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, not pure white.
      Chrome: title 'line-stock-comparison · r · ggplot2 · anyplot.ai' and subtitle readable; horizontal legend (NVDA, MSFT, AAPL, SPY) in an elevated box top-left; y axis 'Rebased Price (Start = 100)' ticks 100/120/140; x axis 'Date' with rotated monthly ticks Feb '23–Dec '23; subtle major grid. All dark text readable.
      Data: NVDA #009E73 with a pale green ribbon to 100, MSFT #C475FD, AAPL #AE3030, SPY #4467A3; dashed reference at 100; faint red SVB band in March; dotted event lines with rotated 'SVB Collapse', 'NVDA AI Surge', 'Rates Peak' label boxes (the latter two sit over lines); bold end labels NVDA ~139, SPY ~119, MSFT ~107, AAPL ~88, all complete.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17, not pure black.
      Chrome: title, subtitle, axis titles, ticks and legend text flip to light tones; legend box #242420; grid subtle. No dark-on-dark text; the red 'SVB Collapse' label is dimmer but readable.
      Data: line colors identical to the light render; ribbon, reference line and event markers visible.
      Legibility verdict: PASS
