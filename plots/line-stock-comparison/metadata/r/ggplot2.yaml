review:
  strengths:
  - All four lines start together at exactly 100 and separate by relative performance;
    the dashed 100 reference is subordinate and visible in both themes
  - Event callouts sit in a headroom band above the data, clear of every line, with
    dotted markers and the banking-stress span drawn behind the series
  - Bold series-colored end-of-line labels let each final value be read directly
  - Theme tokens thread through all chrome; Imprint line colors identical in both
    renders and in canonical order
  - 'Idiomatic ggplot2: named theme object, scale_x_date with date_breaks, annotate(''label''),
    coord_cartesian(clip = ''off'')'
  weaknesses:
  - 'SC-01 (both): an unrequested green ribbon fills the area between NOVA and 100,
    a highlight of one series the spec does not ask for (the Notes allow only event
    or period highlights) → remove the ribbon. Likely cause: geom_ribbon(data = nvda_df,
    aes(ymin = 100, ymax = rebased)).'
  - 'DQ-02 (both): the fourth series is labelled MKTX, a real listed ticker, carrying
    invented random-walk prices → a clearly fictional symbol (for example IDXF for
    a fictional benchmark index). Likely cause: tickers <- c(''NOVA'', ''MERI'', ''ORCH'',
    ''MKTX'').'
  - 'Suggestion: the top legend repeats what the bold end-of-line labels already say;
    dropping it would give the panel more height.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, not pure white.
