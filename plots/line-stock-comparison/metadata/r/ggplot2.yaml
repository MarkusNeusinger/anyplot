      Data: NOVA #009E73 with a pale green ribbon to 100, MERI #C475FD, ORCH #4467A3, MKTX #BD8233; dashed reference at 100; faint red banking-stress band in March; dotted event lines; horizontal italic label boxes 'Banking Stress', 'Tech Rally', 'Rates Peak' at y~168, clear of all lines; bold end labels NOVA ~139, MKTX ~119, MERI ~107, ORCH ~88.
