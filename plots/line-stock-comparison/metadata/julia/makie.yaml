review:
  strengths:
  - All four series rebased to 100 on the first date with a subordinate dashed reference
    line at 100 that reads in both themes
  - Final rebased values typeset as direct labels in each series' color beside the
    line ends, at 13 (above the 12 tick size)
  - Horizontal-only grid at 15% ink and x grid off — a grid density chosen for reading
    values vertically
  - Full theme adaptation through PAGE_BG/INK/INK_SOFT tokens; categorical colors
    identical across light and dark
  - Reproducible GBM data with Random.seed!(42), explicit font sizes at the Makie
    reference values
  weaknesses:
  - 'VQ-07 (both): the third series AMZN is drawn in matte red #AE3030 (the loss anchor)
    and the fourth SPY in blue #4467A3, skipping the canonical Imprint order → positions
    1–4 in order: #009E73, #C475FD, #4467A3, #BD8233 (AMZN to blue, SPY to ochre).
    Likely cause: the hand-ordered IMPRINT constant (entries 3 and 4).'
  - 'DQ-03 (both): the x-axis title asserts ''2024 (Daily Close)'' for real tickers,
    yet the invented paths make NVDA (commented ''high-growth tech'') the only loser
    at 96 and AAPL the leader at 217, relations that contradict that year → drop the
    year claim from the x title (e.g. ''Trading days, one year'') or pick seeds/drifts
    whose ranking matches the comments. Likely cause: xlabel string and GBM_PARAMS/seed
    outcome.'
  - 'CQ-01 (code): the data block does not follow the library prompt''s zones — no
    column constants (date, symbol, price), no DataFrame df, a typed TICKERS list
    and a typed series count in `for j in 1:4` → build df with DATE/SYMBOL/PRICE constants
    and derive symbols and n from `unique(df[!, SYMBOL])`. Likely cause: data generated
    straight into a Matrix.'
  - 'Suggestion: use real Date values on a date axis (Makie 0.24 handles Dates) instead
    of a day index with hand-placed month ticks.'
  - 'Suggestion: a thinner or muted line for the SPY benchmark would separate the
    benchmark from the individual stocks.'
