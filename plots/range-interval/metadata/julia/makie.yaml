review:
  strengths:
  - 'Idiomatic Makie geometry: rangebars!(direction=:x) for the core range span, paired
    with scatter! markers at each endpoint per the spec''s ''markers for emphasis''
    note — a genuine library-recipe choice, not a workaround.'
  - hspan! alternating row bands give scan-ability across 12 categories, a distinctive
    Makie-specific touch.
  - 'Data is sorted by midpoint into an intentional low-to-high ''career ladder''
    narrative, with a callout annotation (''Widest range: $85K spread'') giving readers
    an immediate takeaway beyond the sort order.'
  - 'Theme-adaptive chrome is fully correct in both renders: correct backgrounds,
    ink tokens threaded through title/axis/tick colors and grid opacity, brand-green
    data color identical across themes.'
  - Correct title format, correct canvas (3200x1800), and single-series legend appropriately
    omitted.
  weaknesses:
  - Random.seed!(42) is called but never used — min_salary/max_salary are fully hardcoded
    arrays, so the Random import and seed are dead code. Either remove them or use
    Random for the data generation.
  - Title occupies only ~40-45% of the plot width rather than the typical ~50-70%
    target — still fully legible and not a violation, but the header could carry slightly
    more visual weight given how much horizontal space is otherwise unused above the
    plot.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "Salary Ranges by Job Title · range-interval · julia · makie · anyplot.ai" is bold dark text, clearly readable. Y-axis job-title labels (Support Specialist ... VP of Engineering) and x-axis tick labels (100, 200, 300) render in dark/soft-dark ink, all legible. Alternating warm-gray row bands aid scanability. Vertical gridlines are subtle.
      Data: 12 horizontal range bars in brand green (#009E73) with semi-transparent fill and circular endpoint markers (green fill, cream stroke) at min and max salary for each job title. A callout "Widest range: $85K spread" labels the VP of Engineering row in dark ink, fully legible.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Title, axis labels, and tick labels all render in light ink (near-white / soft light gray), clearly readable against the dark surface — no dark-on-dark failures. Alternating row bands are a subtle lighter charcoal, gridlines are faint.
      Data: Same brand-green (#009E73) bars and markers as the light render, with near-black marker strokes — data colors are identical between themes, only chrome flipped. Callout annotation text is bright and legible.
      Legibility verdict: PASS
