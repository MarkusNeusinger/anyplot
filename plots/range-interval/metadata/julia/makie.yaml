  weaknesses:
  - Design Excellence reads as a well-configured library default (single hue, standard
    rangebar geometry) rather than an exceptional, publication-ready design - add
    one polish touch such as alternating row shading for the 12-category list or emphasis
    on the widest-range category, without adding a second hue to the single-series
    data
  - Storytelling relies solely on the ascending midpoint sort; no additional annotation
    or emphasis highlights a specific insight (e.g. the widest salary spread) beyond
    the sort order itself
