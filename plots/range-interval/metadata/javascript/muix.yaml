review:
  strengths:
  - 'Uses the MUI X v9 composition API idiomatically: ChartsContainer with a linear
    value axis and a band category axis, and custom SVG range marks drawn through
    the useXScale/useYScale hooks so every bar and endpoint sits exactly on its data
    bounds'
  - Floating horizontal range bars sorted by midpoint, as the Notes ask, with endpoint
    markers centered on both bounds and outlined in the theme ink token so both ends
    read clearly in both themes
  - Realistic salary-band scenario with ranges of very different length and overlapping
    spans, which exercises the plot type fully
  - 'Theme chrome is threaded through tokens (ink, inkSoft, grid) and verified on
    both surfaces: #FAF8F1 light and #1A1A17 dark backgrounds, identical brand-green
    #009E73 data color'
  - Value-axis limits derive from the data with a proportional pad, and the band axis
    disables ticks so the category labels stand cleanly beside the rows
  weaknesses:
  - 'VQ-06 (both): the x-axis title reads "Minimum base salary ($k) – Maximum base
    salary ($k)", two concatenated column names that repeat the quantity and the unit
    → one reader-facing title such as "Base salary ($k)". Likely cause: xAxis label
    built as `${MIN_SALARY} – ${MAX_SALARY}`.'
  - 'Suggestion: the subtitle ("8 ranges sorted by midpoint · overall span 42–210
    $k") restates what the axes already show; a shorter or no subtitle would let the
    title hierarchy breathe.'
  - 'Suggestion: the vertical grid at every 10 $k draws 19 lines; a 20 $k step would
    quiet the background behind the bars.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white, sampled #FAF8F1 (250,248,241).
      Chrome: bold dark title "range-interval · javascript · muix · anyplot.ai" centered at top, softer grey subtitle "8 ranges sorted by midpoint · overall span 42–210 $k"; y-axis title "Department" (rotated) with eight department tick labels in dark ink; x-axis ticks 40–220 in steps of 10 and x-axis title "Minimum base salary ($k) – Maximum base salary ($k)". Subtle vertical grid lines. All text readable.
      Data: eight horizontal floating bars in brand green #009E73 (0.85 opacity), each with round endpoint markers outlined in dark ink at the min and max, sorted by midpoint from Customer Support (42–58) at top to Engineering Leadership (120–210) at the bottom.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black, sampled #1A1A17 (26,26,23).
      Chrome: title, subtitle, tick labels and axis titles flip to light ink and are clearly readable; grid lines subtle grey, visible. No dark-on-dark text.
      Data: same brand-green #009E73 bars and endpoint markers as the light render; marker outlines flip to light ink. Data colors identical, only chrome flipped.
      Legibility verdict: PASS
