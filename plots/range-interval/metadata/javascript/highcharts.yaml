review:
  strengths:
  - 'Correct Imprint palette: the bar fill is exactly #009E73 in both renders, and
    all chrome (background #FAF8F1/#1A1A17, title, axis labels, gridlines) is theme-correct
    in both light and dark.'
  - Horizontal bar orientation is the right call for the long category labels ("Director
    of Engineering", "VP of Engineering"), and categories are sorted by seniority/midpoint
    as the spec's Notes suggest.
  - In-bar data labels ("$38K – $52K", etc.) are a nice redundant encoding of the
    intended range, with label color swapped between white (light theme) and near-black
    (dark theme) to stay readable against the green fill in both themes.
  - Clean, deterministic, single-file KISS code; correct mandated title format; y-axis
    has descriptive units and a $/K tick formatter.
  weaknesses:
  - 'CRITICAL: the range bars do not float from min to max — every bar visually starts
    at $0 instead of at its ''low'' value. Pixel-measurement of plot-light.png (3200x1800)
    confirms it: all 10 bars'' green fill starts at the exact same x=338px (the $0
    gridline), and each bar''s rendered WIDTH exactly equals (max-min) rather than
    spanning from min to max. Example: ''VP of Engineering'' has true range $170K-$240K
    (a $70K span starting near the right side of the axis) but the rendered bar spans
    pixel x=338 to x=1122, i.e. visually $0-$70K on the 0-250K axis. Identical bug
    confirmed in plot-dark.png. The data-label text overlaid on the bar ("$170K –
    $240K") is numerically correct, but the bar''s actual screen position is not —
    a reader scanning the x-axis sees each role''s salary floor as $0, which is factually
    wrong and defeats the entire purpose of a range-interval chart. Root cause: the
    invisible ''Floor'' series (plotOptions.series.stacking: ''normal'') is not producing
    the intended cumulative offset for the visible ''Base salary range'' series —
    it renders as if stacked on 0 regardless of the Floor''s value. Suspect the ''low''/''high''
    keys on the visible series'' data points (which are reserved property names for
    range-type series) are interfering with Highcharts'' stack-value resolution even
    in a plain column/bar series. Fix: drop the custom low/high keys from the range
    series'' data (keep only ''y'': high-low), derive the data-label text separately
    from the original minSalary/maxSalary arrays via a dataLabels.formatter closure
    over the index, and verify the rendered bar''s left edge now lands at the pixel
    position corresponding to each row''s ''low'' value before merging.'
  - 'Direct consequence of the bug above: because bars only ever draw their (max-min)
    delta anchored at $0 while the axis is scaled to the full 0-250K absolute range,
    roughly 65-70% of the plot''s horizontal extent is dead whitespace — the longest
    bar (VP of Engineering) reaches only ~35% of the axis width. This should self-resolve
    once the floating-bar positioning is fixed.'
  - 'Optional per the spec''s Notes: consider adding a marker or tick at each bar''s
    min/max endpoint for extra emphasis — not required, but would strengthen the ''range''
    reading once positioning is fixed.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — correct, not pure white.
      Chrome: Title "range-interval · javascript · highcharts · anyplot.ai" in bold dark ink, clearly visible. Y-axis category labels (10 job roles, longest "Director of Engineering") in dark gray, fully legible. X-axis "Annual base salary (US$ thousands)" title and $0K-$250K tick labels in dark gray, legible. Subtle vertical gridlines every $25K.
      Data: 10 horizontal green (#009E73) bars, one per role, each with a centered white data label reading "$MinK – $MaxK". BUG: pixel-measurement shows every bar starts at the same left edge (the $0 gridline) instead of starting at its "low" value — the bar's rendered width equals (max-min) but its position does not reflect the min value at all, so e.g. the "VP of Engineering" bar visually reads as spanning $0-$70K on the axis instead of the labeled $170K-$240K. The text labels are numerically correct; the bar geometry is not.
      Legibility verdict: PASS (all text is readable), but the chart's core visual encoding (bar position = range) is broken — see weaknesses.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — correct, not pure black.
      Chrome: Same title in bold light/cream ink, clearly visible against the dark background. Y-axis role labels and X-axis title/ticks in light gray, all legible — no dark-on-dark failures observed.
      Data: Same 10 green (#009E73) bars, identical hue and identical (buggy) positioning/width to the light render — confirms data colors are unchanged between themes. Data labels use near-black text on the green fill (color flipped from white in light mode), which remains readable against the mid-luminance green.
      Legibility verdict: PASS (all text readable in dark mode), same underlying bar-positioning bug present as in the light render.
