review:
  strengths:
  - Solves the missing-columnrange constraint (highcharts-more not loaded) with an
    invisible 'floor' series stacked under a visible 'span' series, landing each bar
    exactly on [min, max] — documented clearly in code comments including the reverse-stacking-order
    gotcha.
  - Data labels combine engineering precision (formatter looks up original min/max
    by point index rather than the derived span value) with theme-adaptive contrast
    (label color = t.pageBg, which is off-white on light and near-black on dark, flipping
    automatically for legibility on the green fill).
  - Categories sorted low-to-high by seniority create a clear monotonic salary-progression
    narrative, and adjacent bands genuinely overlap (e.g. Customer Support $38-52K
    vs Sales Associate $45-65K), which is realistic for salary bands.
  - Realistic, neutral, well-scaled business dataset (career-ladder salary ranges)
    with internally consistent proportions across all 10 roles.
  - 'Clean theme-adaptive chrome: correct light/dark backgrounds, ink tokens on axis/title,
    subtle vertical gridlines only, legend and tooltip both intentionally disabled
    for a single-series chart.'
  - 'animation: false set at both chart and plotOptions.series level; no network/CDN
    calls; fully deterministic hard-coded data.'
  weaknesses:
  - Single flat green hue with no additional visual variation (gradient, alternating
    shade, or accent) across all 10 bars — clean but plain; a subtle emphasis on the
    widest or narrowest range would strengthen the data-storytelling score.
  - Title occupies only ~32% of canvas width at 22px — comfortably legible but underuses
    the guideline's 50-70% range; a slightly larger title fontsize (~24-26px) would
    balance better against the generously sized bars and labels.
  - Distinctive-feature usage is solid (theme-flipped inline data labels, invisible-floor
    stacking hack) but nothing exploits a feature that's uniquely Highcharts (the
    stacking workaround is itself a constraint workaround, not a showcase feature).
  - The spec's optional suggestion to mark min/max endpoints (e.g. small end markers)
    isn't used — the inline dataLabels substitute effectively, but an endpoint marker
    would reinforce the exact bound visually.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "range-interval · javascript · highcharts · anyplot.ai" in bold dark ink at top center; y-axis shows 10 role categories (Customer Support through VP of Engineering) in dark ink, sorted low-to-high seniority; x-axis shows "Annual base salary (US$ thousands)" with $-formatted tick labels ($0K-$250K) in soft dark gray; thin vertical gridlines are subtle and visible.
      Data: All 10 horizontal bars are solid brand green (#009E73), each spanning its role's min-max salary range, with white inline labels ("$38K - $52K" etc.) centered inside each bar.
      Legibility verdict: PASS — all title, axis, tick, and data-label text is clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title now in light/white ink; y-axis category labels and x-axis tick labels rendered in light gray; gridlines remain subtle and visible on the dark surface.
      Data: Bars are the identical brand green (#009E73) as the light render — confirmed no hue shift. Inline data-label text switches to near-black (the page-background token inverted for theme), which reads clearly against the mid-tone green fill.
      Legibility verdict: PASS — no dark-on-dark failures; all chrome text is light-colored against the dark background, and the in-bar labels remain high-contrast against the green.
