      Data: 12 monthly range bars in brand green (#009E73) with semi-transparent fill and solid stroke, rounded corners, circular markers at the min/max endpoints (green fill, light stroke), and a dark horizontal mean-reference tick inside each bar. Bars rise from a narrow ~0-4° range in January to a wide ~17-25° range in July/August and back down to December, tracing a clear seasonal curve.
