review:
  strengths:
  - Custom renderItem draws the range bar directly from the low to the high coordinate,
    correctly sidestepping the classic ECharts stacked-bar-with-negative-base pitfall
    — explained clearly in a code comment
  - Endpoint markers (dark dots with a background-colored halo) give a clean visual
    cue for the exact min/max values without cluttering the bar itself
  - Deterministic, realistic Berlin monthly temperature data with genuine seasonal
    variation in both level and range width
  - 'Theme-adaptive chrome is fully correct: brand green #009E73 identical in both
    renders, background/text/grid tokens flip correctly, no dark-on-dark or light-on-light
    issues'
  - Title follows the mandated format with a sensible descriptive prefix, scaled to
    a legible fontsize that avoids overflow
  weaknesses:
  - The two 'Low / high' scatter series are identical in styling and could be merged
    into a single series (concatenated low+high arrays) — reduces code duplication
  - 'Design Excellence is competent but not exceptional: single-accent-color design
    with no additional visual hierarchy (e.g. highlighting the widest/narrowest range,
    or the coldest/warmest month) beyond the natural chronological ordering'
  - No legend to clarify what the endpoint dots represent — while inferable from position,
    an unobtrusive legend or annotation would remove any ambiguity
  - Marker size is a fixed 9px regardless of category count; fine here at 12 categories
    but not demonstrated to adapt to density
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Title "Berlin Monthly Temperature Range · range-interval · javascript · echarts · anyplot.ai" is dark and clearly legible, centered at top. Y-axis title "Temperature (°C)" and tick labels (-5° to 25°) are dark gray and legible. X-axis month labels (Jan-Dec) are dark gray and legible. Horizontal gridlines are subtle light gray; a slightly more prominent line marks the 0° axis baseline (ECharts axisLine snapped to zero), which reads as an intentional freezing-point reference rather than a defect.
      Data: 12 vertical green (#009E73) bars, one per month, each spanning from the month's low to high temperature. Each bar has rounded corners and a dark dot marker with a light halo at both its low and high endpoints. Bar heights vary appropriately, showing wider ranges in spring/autumn and narrower ranges in winter/summer troughs and peaks.
      Legibility verdict: PASS — all text is clearly readable against the light background.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Title, y-axis title, and tick/axis labels all render in light off-white/gray tones, clearly legible against the dark background. No dark-on-dark text anywhere. The 0° reference line is a light gray, consistent with the theme flip.
      Data: The same 12 green (#009E73) bars in identical size/position/color to the light render — confirms data colors are theme-invariant. Endpoint dot markers use the same dark fill with a background-colored halo, adapted correctly to the dark surface.
      Legibility verdict: PASS — all text is clearly readable against the dark background; no dark-on-dark failures observed.
