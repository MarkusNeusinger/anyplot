review:
  strengths:
  - Correct Imprint palette (#009E73 first/only series) with identical underlying
    data colors between light and dark; both renders are fully theme-correct — warm
    off-white/near-black backgrounds, readable chrome, no dark-on-dark or light-on-light
    failures
  - 'Genuine data-storytelling touch: the widest-range month (May) is rendered with
    a stronger fill opacity and thicker border, giving the viewer an immediate focal
    point instead of a flat, undifferentiated set of bars'
  - Idiomatic Chart.js floating-bar technique — [min, max] pair arrays on a bar dataset
    with borderSkipped:false and per-bar backgroundColor/borderWidth arrays — is the
    library-recommended way to build range/interval bars, not a hacky workaround
  - Realistic, factually plausible Berlin monthly temperature data with correct seasonal
    shape (widest range in late spring, narrow ranges in winter) and a custom tooltip
    callback formatting 'Low X°C – High Y°C'
  - 'Clean, KISS-structured code: deterministic in-memory data, no unused imports,
    appropriate use of reduce/map, animation disabled per the mount-node contract'
  weaknesses:
  - The widest-range emphasis (darker fill + thicker border on May) has no accompanying
    label/annotation explaining why that bar stands out — a small text callout or
    legend note would make the storytelling explicit rather than implicit
  - Spec's optional suggestion to add markers at the min/max endpoints for emphasis
    was not implemented — would strengthen VQ-03/DE-01 further, though the spec marks
    this optional so it is not a compliance gap
  - Single-series legend is disabled entirely; a minimal legend entry (or axis subtitle)
    noting 'shaded bar = widest monthly range' would close the gap left by the missing
    annotation above
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Title "Berlin Monthly Temperature Range · range-interval · javascript · chartjs · anyplot.ai" in dark ink, fully readable and not clipped at any edge. X-axis title "Month" and Y-axis title "Average Temperature (°C)" both dark ink and legible. Tick labels (Jan–Dec, 0–25°C) are muted grey/ink-soft and clearly readable. Horizontal gridlines are subtle but visible; no vertical gridlines (intentional, adds visual quiet).
      Data: 12 floating bars, one per month, spanning each month's low-high temperature range. All bars use the brand green (#009E73) family — translucent green fill (rgba 0.5 alpha) with a solid #009E73 border for eleven months, and a markedly darker/more opaque fill (0.9 alpha) with a thicker border on May, the widest-range month. Bars are clearly distinguishable from the light background and from each other.
      Legibility verdict: PASS — no light-on-light text anywhere.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Title, axis titles, and tick labels all render in light/off-white text, fully legible against the dark background. No dark-on-dark text anywhere — every label is clearly visible. Gridlines are faint but present.
      Data: Same 12 bars in the same brand-green family; the underlying RGBA values (border #009E73, fill rgba(0,158,115,0.5/0.9)) are identical to the light render — the apparent color shift (bars read as more saturated/teal against the dark backdrop) is normal alpha-compositing behavior against a different backdrop, not a palette change. The May bar is still the visually emphasized one via the higher fill opacity and thicker border, consistent with the light render.
      Legibility verdict: PASS — no dark-on-dark failures, all text and data elements clearly visible.
