review:
  strengths:
  - 'Correct plot type: the floating-bar Chart.js technique ([min, max] pairs on a
    bar dataset) idiomatically renders the min-max ranges as filled vertical bars,
    matching the range-interval spec precisely.'
  - 'Realistic, neutral data: Berlin monthly temperature lows/highs track plausible
    real-world climate values across all 12 months, with ranges varying meaningfully
    by season (narrow in winter, wide in spring/autumn).'
  - 'Clean theme-adaptive chrome: title, axis, and tick colors plus background correctly
    flip between light and dark renders, while the brand-green data color (#009E73
    border) stays identical across themes.'
  - 'Thoughtful bar styling: semi-transparent fill + solid border + rounded corners
    (borderRadius, borderSkipped: false) adds a subtle designed feel beyond bare Chart.js
    defaults.'
  - Title font size correctly scales down for the long mandated title string via a
    length-based formula, avoiding overflow or edge clipping.
  weaknesses:
  - 'DE-03 Data Storytelling: every bar uses identical styling with no emphasis or
    hierarchy — consider highlighting the widest-range month or the seasonal extremes
    (e.g. a subtle opacity/color shift on the peak-range bar), or add the optional
    min/max endpoint markers the spec suggests, so the chart tells a clearer story
    instead of only displaying data.'
  - 'Tooltip is disabled (`tooltip: { enabled: false }`) — this doesn''t affect the
    static PNG (tooltips never appear in a screenshot) but needlessly strips a free,
    valuable feature from the interactive HTML detail view. Enable Chart.js''s tooltip
    (or a custom callback showing ''Low X°C – High Y°C'') to leverage the library''s
    interactive strengths per the interactive-library fairness rules.'
  - 'CQ-01 KISS structure: the `withAlpha` helper function breaks the strict linear
    Imports -> Data -> Plot -> Save script structure — inline the rgba conversion
    or hardcode the semi-transparent rgba string directly instead of defining a function.'
  - 'LM-02 Distinctive Features: beyond the floating-bar array trick, the implementation
    doesn''t leverage any other Chart.js-distinctive feature (e.g. a custom tooltip
    callback, a plugin-based min/max marker, or per-bar background color) — adding
    one would strengthen Library Mastery.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "Berlin Monthly Temperature Range · range-interval · javascript · chartjs · anyplot.ai" in dark ink, centered top, fully visible with no clipping. X-axis "Month" title and Jan-Dec tick labels in dark/soft-dark text, all readable and non-overlapping. Y-axis "Average Temperature (°C)" title (rotated) and tick labels (0°C-25°C with unit suffix) fully readable. Subtle horizontal gridlines only (y-axis), no x-axis gridlines.
      Data: 12 vertical floating bars (one per month), semi-transparent brand-green fill (#009E73 at ~55% alpha) with a solid brand-green border, rounded corners. Bar heights represent the low-to-high temperature range per month, clearly rising through summer (Jun-Aug) and falling toward winter (Dec-Feb).
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Title in light/off-white ink, fully visible with no clipping. X-axis "Month" title and tick labels in light gray, all readable. Y-axis title and tick labels in light gray, fully readable against the dark background. Gridlines flip to a light, low-opacity color, still subtle.
      Data: Same 12 bars, same #009E73 border and alpha-blended fill (the fill reads as a deeper green against the darker page background, which is the expected visual result of identical rgba alpha values composited over a different backdrop rather than a change in the underlying data color). No dark-on-dark or light-on-light text failures observed anywhere.
      Legibility verdict: PASS
