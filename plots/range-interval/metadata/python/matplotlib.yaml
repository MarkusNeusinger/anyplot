review:
  strengths:
  - Floating bars via ax.bar(bottom=lows, height=highs-lows) make the span itself
    the mark, on a shared temperature axis that does not start at zero
  - Directional v/^ markers sit exactly on each bound and encode minimum vs maximum
    by shape, not color; the grey midpoint stays subordinate
  - 'Theme tokens threaded through title, ticks, spines, grid, legend frame and bound
    labels: both renders fully readable'
  - Bound labels positioned with annotate(textcoords='offset points') so their gap
    to the markers is fixed in points
  - Data block driven by column constants and a tidy df; ticks and limits come from
    the data
  weaknesses:
  - 'Suggestion: the 7 pt bound labels could match the 8 pt tick labels for a slightly
    calmer type scale.'
  - 'Suggestion: a subtle emphasis on the warmest and coldest months could give the
    seasonal arc a focal point.'
