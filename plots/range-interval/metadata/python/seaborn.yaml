    seniority order, and the long labels are rotated on a vertical layout → sort by
    midpoint or range size and draw the ranges horizontally so the labels read level.
    Likely cause: the row order of the data block and vertical vlines with rotated
    x tick labels.'
  - 'Suggestion: a midpoint tick or label for each range could make the salary bands
    easier to compare, as the Notes allow'
