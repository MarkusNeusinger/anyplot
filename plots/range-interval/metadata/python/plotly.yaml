review:
  strengths:
  - Range bars float exactly between each month's minimum and maximum on a shared
    °C axis, in chronological order, with endpoint markers sitting on both bounds
    and midpoint dots kept small and subordinate to the ranges
  - 'Theme tokens are threaded through every chrome element: title, axis titles, ticks,
    spines, zero line, grid and legend box all flip correctly between #FAF8F1 and
    #1A1A17 while the #009E73 bars and #C475FD endpoints stay identical'
  - Canvas follows the plotly landscape contract (800×450 at scale 4 → 3200×1800)
    with explicit margins and the library prompt's 16/12/10 font sizes
  - 'Per-trace hovertemplates with units ("Max Temperature: 30.8°C") give the HTML
    view exact values without cluttering the static PNG'
  - Data sits in a tidy df with column constants, so the plot block reads only df
    and the constants
  weaknesses:
  - 'SC-04 (both): the legend entries "Min Temperature" and "Max Temperature" carry
    identical glyphs (purple fill, green outline, same size), so neither entry identifies
    which endpoint it explains, and the range bar itself has no entry → one entry
    per distinct glyph, e.g. a single "Min / max bound" entry, or distinct marker
    symbols (triangle-down / triangle-up) for the two bounds. Likely cause: the endpoint
    loop uses the same marker dict for both TEMP_MIN and TEMP_MAX.'
  - 'Suggestion: shading the warm months or labelling the annual extremes could give
    the seasonal arc a focal point.'
  - 'Suggestion: a horizontal-bar layout via go.Bar with base= would express the floating
    range with plotly''s native bar primitive instead of 12 two-point line traces.'
