review:
  strengths:
  - Theme tokens threaded through every chrome element; both renders read cleanly
    with identical data colors
  - Follows the Bokeh canvas contract (3200x1800, toolbar_location=None, min_border_*
    reservations), so nothing is clipped
  - ColumnDataSource(df) driven by column-name constants with segment glyphs for the
    floating ranges
  - Endpoint markers sit exactly on the bounds and midpoint diamonds stay subordinate
    to the ranges
  weaknesses:
  - 'VQ-03 (both): the legend glyphs for Minimum, Maximum and Midpoint render as dots
    of about 4 px while the plotted markers are 26 px (midpoint swatch nearly invisible)
    → swatches that match the plotted markers, about 26 px. Likely cause: default
    p.legend.glyph_width / glyph_height (20 px) at the 3200 px canvas; set them to
    about 40.'
  - 'Suggestion: a location in the title or y-axis label (a named city) would ground
    the temperature scenario.'
  - 'Suggestion: a HoverTool showing exact min / max per month would add value in
    the HTML view.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 on the full 3200x1800 canvas
      Chrome: bold title "range-interval · python · bokeh · anyplot.ai" top-left in dark ink; italic axis titles "Month" and "Temperature (°C)"; month tick labels Jan-Dec and y ticks 0-30 in soft ink; subtle horizontal grid; legend box top-left (Minimum, Maximum, Midpoint) with tiny glyph dots. All text readable.
      Data: twelve vertical semi-transparent #009E73 range bars with round caps, green circles at minima, lavender #C475FD circles at maxima, small dark diamonds at midpoints; seasonal arch peaking in July (~30 °C), Dec minimum ~-3 °C.
