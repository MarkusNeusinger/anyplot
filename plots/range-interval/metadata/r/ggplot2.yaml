review:
  strengths:
  - geom_linerange() with ymin/ymax mapped to the two bounds draws each month as a
    floating span on a shared temperature axis, not anchored at zero, which is the
    native ggplot2 range geom
  - Endpoint markers at min_temp and max_temp sit exactly on the bounds, so both ends
    of every range read clearly in both themes
  - 'Theme tokens thread through every chrome element: #FAF8F1/#1A1A17 backgrounds,
    INK titles, INK_SOFT ticks, subtle y-grid only, and the #009E73 data color is
    identical across both renders'
  - Text sizes follow the ggplot2 reference exactly (title 12, axis titles 10, ticks
    8 at dpi 400) on the canonical 3200x1800 canvas
  - Months stay in chronological order, the logical order the Notes allow, and the
    seasonal arc reads at a glance
  weaknesses:
  - 'Suggestion: the endpoint dots share the line''s color and nearly merge into its
    rounded caps, especially on the dark render; a slightly larger dot or a page-colored
    outline would make the min/max markers read as distinct marks.'
  - 'Suggestion: the unused ELEVATED_BG and INK_MUTED tokens could be dropped.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole 3200x1800 canvas
      Chrome: title "range-interval · r · ggplot2 · anyplot.ai" top-left in dark ink, about 45 % of the width; axis titles "Month" and "Temperature (°C)" in dark ink; tick labels Jan–Dec and -0/10/20/30 in soft dark grey; thin y grid lines at 0, 10, 20, 30; left y-axis line only. All readable.
      Data: 12 vertical #009E73 line ranges, one per month in chronological order, each from the monthly minimum to the maximum (Jan -2 to 5 °C up to Jul 28 to 35 °C, back down to Dec 0 to 6 °C), with round #009E73 endpoint dots on both bounds. Even spacing, one thickness, no overlap.
