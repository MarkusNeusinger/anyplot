review:
  strengths:
  - All four required line styles (solid, dashed, dotted, dash-dot) are used correctly
    and are clearly distinguishable in both themes, directly satisfying the spec's
    black-and-white/accessibility goal
  - 'Redundant color+style coding: each series gets both a distinct Imprint color
    (first series is brand green #009E73, in canonical palette order) and a distinct
    linestyle, which is exactly the accessibility pattern this spec calls for'
  - Line width is held constant (2.75) across all four styles per spec note ('Line
    width should be consistent across styles')
  - 'Realistic, neutral dataset: hourly p50/p90/p99/p99.9 web latency percentiles
    over a week with a clear diurnal cycle plus noise — plausible engineering telemetry,
    good use of 168 points (within the 50-500 recommended range)'
  - Theme tokens (PAGE_BG, INK, INK_SOFT) are threaded consistently through title,
    axis labels, ticks, spines and gridlines; both renders are legible and correctly
    themed
  - 'Clean, idiomatic Makie code: single Axis, theme-adaptive chrome block, axislegend
    with matching label colors, top/right spines removed, subtle single-axis gridlines'
  - Canvas is exactly 3200x1800 (verified, no gate failure), reproducible via Random.seed!(42),
    no unused imports, no fake interactivity
  weaknesses:
  - The p99.9 (orange dash-dot) curve's first peak near hour ~12 rises very close
    to the top-left legend box in both renders — not clipped or overlapping text,
    but tight enough to be visually crowded; consider moving the legend to :rt (top-right,
    where the p50 band leaves more headroom) or nudging it inward.
  - 'Library Mastery is generic: the implementation only uses the basic `lines!` +
    `linestyle=` argument and doesn''t showcase any Makie-distinctive feature (e.g.
    `band!`/`fillrange` for percentile spread, `text!` annotations calling out the
    tail-latency gap, or a Makie-specific legend/layout trick) — LM-02 scored low
    as a result.'
  - 'Design Excellence is competent but not exceptional: the four percentile bands
    read clearly, but there''s no explicit visual emphasis (annotation, highlight,
    or callout) drawing the eye to the story (e.g. ''p99.9 is >6x p50'') — a small
    annotation or subtitle would elevate DE-03 (Data Storytelling).'
  - The title uses the bare mandated format without an optional descriptive prefix
    (e.g. 'API Latency Percentiles · line-styled · julia · makie · anyplot.ai'), so
    it occupies noticeably less than the ~50-70% width guideline — not a violation,
    but a descriptive prefix would use the available title space more effectively.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "line-styled · julia · makie · anyplot.ai" in bold dark ink, clearly visible top-center. Axis labels "Time (hours)" and "Response Time (ms)" in dark ink, fully readable. Tick labels (0/50/100/150 on x; 200/400/600 on y) in softer dark gray, readable against the light background. Legend (top-left) lists p50/p90/p99/p99.9 with matching color+linestyle swatches, dark-ink text, no frame. Top and right spines are hidden; left/bottom spines are a soft gray. Only horizontal gridlines are shown, subtle light gray.
      Data: Four series stacked by percentile — p50 (solid, brand green #009E73, lowest band), p90 (dashed, lavender), p99 (dotted, blue), p99.9 (dash-dot, ochre, highest band). All four linestyles are clearly distinguishable from each other and readable against the light background. Diurnal (24h) oscillation is visible across all four series over the 7-day span.
      Legibility verdict: PASS — all text and all four line styles are clearly readable; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Title in light/off-white ink, clearly visible. Axis labels and tick labels rendered in light ink / soft light-gray respectively, both clearly legible against the dark background — no dark-on-dark failure observed. Legend text is soft light gray, fully readable, no frame. Spines and gridlines are appropriately dim but still visible.
      Data: Same four series in the same colors and linestyles as the light render (p50 green solid, p90 lavender dashed, p99 blue dotted, p99.9 ochre dash-dot) — confirmed identical data colors between themes, only chrome (background/text/grid) flipped. Brand green p50 line and ochre p99.9 line both remain clearly visible against the dark background.
      Legibility verdict: PASS — all text is clearly legible on the dark background, no dark-on-dark or light-on-light failures found.
