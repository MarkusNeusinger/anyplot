review:
  strengths:
  - Correct Imprint palette in canonical order (green/lavender/blue/ochre), identical
    data colors between light and dark renders — only chrome flips
  - Four genuinely distinct line styles (solid, dashed, a fine custom dot pattern,
    and a custom dash-dot pattern) mapped in one legend to both color and linetype,
    satisfying the spec's black-and-white/accessibility use case with real redundant
    encoding
  - Endpoint annotation ('+71%') on the Hardware series creates a clear focal point
    and a small data story without needing to break the spec's 'consistent line width
    across styles' requirement
  - 'Theme-adaptive chrome handled carefully: grid alpha-blended into the ink color
    via adjustcolor() (a valid workaround since element_line() has no alpha param),
    L-shaped axis lines, fully legible text in both themes'
  - 'Clean, idiomatic, reproducible ggplot2 code: single seed, current API (linewidth,
    ragg device), no unused imports, no fake interactivity'
  weaknesses:
  - The 'Services' dotted line (custom dash code "15") renders as small elongated
    dash marks rather than crisp round dots — at a glance it can read as a broken/scattered
    line instead of a clean 'dotted' style; a shorter, more uniform pattern (e.g.
    "12" or "13") would read more clearly as dots while still avoiding the dash-dot's
    leading sub-pattern
  - Design excellence stays close to theme_minimal defaults (standard legend box,
    no de-emphasis of non-focal series) — consider muting the three background series
    slightly (lower alpha or muted-token color) to sharpen the visual hierarchy around
    the highlighted Hardware growth story
  - Line width (1.1) is on the thinner side for only 4 series over 24 points; per
    the data-density heuristic (few series → thicker lines for prominence), nudging
    to ~1.3-1.5 would add prominence, especially at mobile scale
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matching the required #FAF8F1 surface — not pure white.
      Chrome: Title "line-styled · r · ggplot2 · anyplot.ai" in dark ink at top-left, comfortably sized (~40% of plot width, no overflow). X-axis "Quarter" and rotated Y-axis "Revenue Index (base = 100)" labels are dark and clearly readable. Tick labels (5/10/15/20/25 on x; 100/125/150/175 on y) are legible in a slightly softer ink tone. Subtle horizontal gridlines only, at low opacity, not competing with data. Legend "Product Line" sits at the right in an elevated off-white box with dark title text and softer entry labels.
      Data: Four lines from a shared baseline near 100 at quarter 1, diverging over 24 quarters. Hardware (brand green #009E73, solid) climbs steadily to ~172 with a highlighted endpoint dot and "+71%" annotation in matching green. Software (lavender #C475FD, dashed) and Services (blue #4467A3, fine dot pattern) hover and drift upward around 105-127. Accessories (ochre #BD8233, dash-dot pattern) drifts down to ~85. All four styles are visually distinguishable by shape alone, not just color.
      Legibility verdict: PASS — all text is clearly readable against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, matching the required #1A1A17 surface — not pure black.
      Chrome: Same title, now in light ink (#F0EFE8-equivalent), clearly visible against the dark background. Axis titles and tick labels flip to light/soft-light tones and remain fully legible. Gridlines are still subtle, now light-on-dark. Legend box flips to the dark elevated surface (#242420) with light text, fully readable.
      Data: Identical line colors and styles to the light render — brand green, lavender, blue, ochre — confirming positions 1-4 of the Imprint palette are held constant between themes; only the chrome (background, text, grid, legend frame) changed.
      Legibility verdict: PASS — no dark-on-dark failures; every title, axis label, tick label, and legend entry is clearly visible against the dark background.
