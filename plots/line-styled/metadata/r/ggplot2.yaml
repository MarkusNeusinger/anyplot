review:
  strengths:
  - Correct implementation of all four standard line styles (solid, dashed, dotted,
    dash-dot) mapped 1:1 to product lines, matching the spec's monochrome-legibility
    goal
  - Redundant color+linetype encoding (aes(color=product, linetype=product)) merges
    into a single combined legend — accessible, CVD-safe, and an idiomatic ggplot2
    pattern
  - First series correctly uses Imprint brand green (#009E73); remaining series follow
    canonical Imprint palette order
  - 'Clean theme-adaptive chrome: horizontal-only major grid, ticks removed, consistent
    linewidth (1.1) across all styles as the spec requires'
  - Descriptive axis labels with units ("Revenue Index (base = 100)", "Quarter")
  - 'Both renders are theme-correct: identical data colors, chrome flips correctly,
    no dark-on-dark/light-on-light issues'
  weaknesses:
  - library(dplyr) and library(tidyr) are imported but never used anywhere in the
    script — dead imports
  - Dotted (Services) vs. dash-dot (Accessories) line styles become harder to distinguish
    at small/mobile scale (e.g. 400px thumbnail) since the dash-cycle lengths are
    close — the spec explicitly calls out considering line-style visibility at different
    scales; lengthening the dash cycle or nudging linewidth would help
  - Major-y grid lines are rendered in full INK color, giving a fairly high-contrast
    look rather than a subtle guide — a lighter/desaturated tone would read as more
    refined
  - Visual hierarchy relies entirely on incidental data trend (the Hardware line reads
    as focal point mainly because it happens to trend highest) rather than a deliberate
    emphasis technique such as a heavier linewidth or annotation on the intended focal
    series
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "line-styled · r · ggplot2 · anyplot.ai" in dark ink, top-left, clearly readable. Axis titles "Quarter" (x) and "Revenue Index (base = 100)" (y) in dark ink; tick labels in softer gray-ink. Horizontal grid lines at 100/125/150/175 in dark ink, no vertical gridlines. Legend "Product Line" on the right with combined color+linetype swatches and labels, on a slightly lighter cream background box.
      Data: Four lines share the Imprint palette — Hardware (solid, brand green #009E73, trending 105→170), Software (dashed, lavender/purple, oscillating ~105-115), Services (dotted, blue, oscillating 100-128), Accessories (dash-dot, ochre, declining 100→80). First series correctly uses #009E73.
      Legibility verdict: PASS — all title, axis, tick, and legend text is clearly readable against the light background; no overlap.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Same title and axis labels rendered in light ink (near-white), clearly readable against the dark background — no dark-on-dark issue. Grid lines rendered in light ink, subtle but visible. Legend box background is a slightly lighter dark gray with light text, readable.
      Data: Line colors are identical to the light render (green/purple/blue/ochre) — confirms only chrome flips between themes, not data colors.
      Legibility verdict: PASS — all text is readable against the dark background; brand green remains clearly visible.
