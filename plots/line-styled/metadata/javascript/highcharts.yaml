      Chrome: Title, axis titles, tick labels, and plotBand label all render in light ink / soft light-gray tones - fully legible, no dark-on-dark failures. plotBand shading is a subtle darker-gray band, visible but unobtrusive. Gridlines remain subtle horizontal-only, now light-on-dark.
