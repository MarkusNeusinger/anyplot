review:
  strengths:
  - All four standard dash styles (Solid, Dash, Dot, DashDot) are used exactly as
    the spec requires, with a legend that clearly maps each style to its series name
  - Data colors follow the Imprint palette in canonical order (CPU=#009E73, Memory=#C475FD,
    Network I/O=#4467A3, Disk I/O=#BD8233) and are identical between the light and
    dark renders
  - 'Theme-adaptive chrome is fully correct in both renders: warm off-white/near-black
    backgrounds, readable ink-toned text, subtle horizontal-only gridlines'
  - Series show genuinely distinct patterns (smooth daily curve for Memory, bursty
    oscillation for Network I/O, slow drift for Disk I/O, noisy trend for CPU) rather
    than four near-identical shapes, which is exactly what a line-style-distinction
    spec should demonstrate
  - Custom xAxis formatter renders clean '0:00'/'4:00' time-of-day labels instead
    of raw decimal hours, a small but effective polish detail
  - Consistent line width (3px) across all styles per the spec's requirement
  weaknesses:
  - 'Design Excellence is at the ''well-configured default'' level: styling closely
    follows the standard token/legend pattern without an additional distinguishing
    layout or hierarchy choice (e.g. no emphasis on which metric is most notable,
    no annotation for the CPU/Memory peak around 09:00-10:00)'
  - No visual hierarchy singles out an insight (e.g. the simultaneous CPU+Memory peak
    mid-morning) — all four lines carry equal visual weight, so the viewer has to
    find the story themselves
  - 'Library Mastery is solid but generic: dashStyle usage is exactly right for the
    spec but the implementation doesn''t otherwise showcase a distinctive Highcharts-only
    capability (e.g. no use of plotBands/plotLines to mark a shift, no responsive
    legend behavior)'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "line-styled · javascript · highcharts · anyplot.ai" in bold dark ink at top-center; x-axis title "Time of Day (hours)" and y-axis title "Utilization (%)" in medium-gray ink, both similarly sized; tick labels ("0:00" ... "24:00", "0" ... "75") in lighter gray; horizontal gridlines only, subtle and thin; legend centered below the plot with four entries (CPU, Memory, Network I/O, Disk I/O). All text is clearly readable against the light background.
      Data: Four lines share the Imprint palette in canonical order — CPU is solid brand green (#009E73), Memory is dashed lavender, Network I/O is dotted blue, Disk I/O is dash-dot ochre. Line width is consistent (~3px) across all four styles, and each dash pattern is clearly distinguishable even where lines cross or run close together (e.g. CPU/Memory near hour 9-10).
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title, axis titles, and tick labels now rendered in light ink/off-white and soft light-gray tones; gridlines remain subtle horizontal-only lines, now light-on-dark; legend text is light and readable against the dark background. No dark-on-dark or light-on-light failures observed anywhere.
      Data: The four series colors are pixel-for-pixel identical to the light render (green solid, lavender dashed, blue dotted, ochre dash-dot) — only the chrome flipped as required.
      Legibility verdict: PASS
