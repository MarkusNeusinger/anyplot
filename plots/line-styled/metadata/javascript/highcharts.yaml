review:
  strengths:
  - 'The repair directly and effectively addressed both prior weaknesses: the new
    plotBands annotation ("CPU + Memory peak") gives the chart a clear focal point
    (DE-03) while also showcasing a distinctive Highcharts feature beyond the required
    dashStyle usage (LM-02)'
  - All four standard dash styles (Solid, Dash, Dot, DashDot) are used exactly as
    the spec requires, with a legend clearly mapping each style to its series name
  - Data colors follow the Imprint palette in canonical order (CPU=#009E73, Memory=#C475FD,
    Network I/O=#4467A3, Disk I/O=#BD8233), identical between light and dark renders
  - 'Theme-adaptive chrome is fully correct in both renders: warm off-white/near-black
    backgrounds, readable ink-toned text, subtle horizontal-only gridlines, and the
    new plotBand shading reads cleanly in both themes'
  - Series show genuinely distinct patterns (noisy CPU, smooth Memory, bursty Network
    I/O, slow-drift Disk I/O) rather than four near-identical shapes
  - Consistent line width (3px) across all styles per the spec's explicit requirement
  weaknesses:
  - Design Excellence still sits short of "exceptional" - typography and layout remain
    close to the standard token pattern beyond the new plotBand touch
  - No further Highcharts-distinctive capability (e.g. crosshair, shared tooltip on
    hover) is showcased beyond the dashStyle + plotBand combination, though this is
    a minor gap given tooltips are disabled by design for the static PNG
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1
      Chrome: Title "line-styled · javascript · highcharts · anyplot.ai" bold dark ink, top-center (~30% width, no overflow). Axis titles "Time of Day (hours)" / "Utilization (%)" medium-gray, similarly sized. Tick labels lighter gray, formatted as "0:00"-"24:00" on x-axis. Subtle horizontal-only gridlines. New shaded plotBand (~08:30-10:30) with "CPU + Memory peak" label at top, positioned clear of all data lines. Legend centered below plot with 4 entries.
      Data: CPU solid brand green (#009E73), Memory dashed lavender (#C475FD), Network I/O dotted blue (#4467A3), Disk I/O dash-dot ochre (#BD8233); consistent 3px line width.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
