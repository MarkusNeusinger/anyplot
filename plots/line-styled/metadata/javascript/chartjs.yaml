review:
  strengths:
  - 'Repair fully addresses the attempt-1 weaknesses: per-series pointStyle (circle/rect/triangle/rectRot),
    a round cap on the dotted line, and enlarged dash-dot gaps keep all four line
    styles distinguishable even at the 400px mobile thumbnail scale (verified against
    plot-light_400.png)'
  - The new peakAnnotation plugin (afterDatasetsDraw) labels the hottest core's final
    reading directly on the canvas, creating a deliberate focal point and data story
    instead of four equal-weight lines
  - Correct Imprint palette order across all four series (green, lavender, blue, ochre),
    byte-identical data colors between light (#FAF8F1) and dark (#1A1A17) renders
    with only chrome flipping
  - All four standard line styles (solid, dashed, dotted, dash-dot) implemented via
    borderDash/borderCapStyle, consistent 3.5px line width across all styles as the
    spec requires, with legend swatches matching
  - Plausible, neutral domain (CPU core temperatures during a stress test) with sensible
    value range and a clear converge/diverge trend; deterministic LCG-seeded data
    generation, no unused imports, no fake interactivity
  - 'No AR-09 edge clipping: annotation text ends at x=3022 of 3200px canvas (verified
    by pixel scan), bottom axis title ends 12px from the bottom edge, y-axis labels
    start 13px from the left edge — comfortable margins on all sides'
  weaknesses:
  - Data storytelling still relies on a single annotation callout; a more elaborate
    technique (e.g. a subtle secondary emphasis on the annotation's supporting line
    weight, or a shaded plateau band) would push Design Excellence further
  - Library Mastery showcases a custom plugin and scriptable pointRadius, but still
    stops short of more advanced Chart.js-specific capabilities (e.g. segment-level
    styling, gradient fills) that would fully max out that category
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white, verified #FAF8F1 by pixel sample — matches the required light surface exactly.
      Chrome: title "line-styled · javascript · chartjs · anyplot.ai" in dark ink, fully legible; axis titles "Stress Test Duration (minutes)" and "Core Temperature (°C)" include units and are readable; tick labels in a softer dark gray, readable; legend at top shows four swatches (solid green, dashed lavender, dotted blue, dash-dot ochre) labeled Core 1-4; subtle horizontal gridlines on the y-axis only, x-axis grid disabled.
      Data: first series is brand green #009E73 (Core 1), followed by lavender, blue, and ochre in canonical Imprint order. Each series has a distinct dash pattern (solid/dashed/dotted/dash-dot) plus a distinct marker shape (circle/rect/triangle/rotated-rect) sampled every 15 minutes, reinforcing style differentiation. A green annotation "Core 1 hottest · 82.1°C" labels the final point of the hottest series without overlapping any other element; text ends at pixel x=3022 of the 3200px canvas, comfortably inside the frame.
      Legibility verdict: PASS.

    Dark render (plot-dark.png):
      Background: warm near-black, verified #1A1A17 by pixel sample — matches the required dark surface exactly.
      Chrome: same title, axis titles, and tick labels now render in light/off-white ink, fully legible; legend and gridlines flip to light-on-dark equivalents with no contrast loss.
      Data: data colors (brand green, lavender, blue, ochre) and dash/marker patterns are pixel-identical to the light render, confirming only chrome flipped between themes. The peak annotation remains legible in brand green against the near-black background — no dark-on-dark failures anywhere (title, axis labels, ticks, legend, annotation all checked).
      Legibility verdict: PASS.
