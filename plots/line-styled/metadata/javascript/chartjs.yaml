review:
  strengths:
  - Correct Imprint palette order across all four series (green, lavender, blue, ochre),
    identical data colors in both themes with only chrome flipping
  - All four standard line styles (solid, dashed, dotted, dash-dot) implemented via
    borderDash and clearly legible in the legend swatches, matching the spec's core
    requirement
  - Consistent 3.5px line width across all styles as the spec explicitly asks for
  - Plausible, neutral domain (CPU core temperatures during a stress test) with a
    sensible value range and a clear converge-then-diverge trend across the 60-minute
    series
  - Clean, deterministic LCG-based data generation with no unused imports and no fake
    interactivity
  - Y-axis-only grid with x-axis grid disabled, following the style guide's chrome-minimalism
    guidance for line charts
  weaknesses:
  - At the 400px mobile thumbnail scale, the dotted line (Core 3) visually collapses
    into a near-solid line and the dash-dot pattern (Core 4) is hard to distinguish
    from dashed (Core 2) purely by pattern — series remain distinguishable by color
    at this size, but the line-style differentiation that is the whole point of this
    spec degrades; consider slightly larger dash segments or dedicated markers at
    sparse intervals to keep style legible when scaled down
  - 'Design Excellence is generic: no intentional visual hierarchy (e.g. emphasizing
    the hottest core or annotating the plateau) beyond the default equal-weight treatment
    of all four lines'
  - Library Mastery relies only on baseline Chart.js line-chart features (borderDash,
    tension) with no distinctive capability showcased beyond the minimum needed to
    satisfy the spec
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (~#FAF8F1), not pure white, not dark.
      Chrome: Title "line-styled · javascript · chartjs · anyplot.ai" in dark ink, clearly legible; axis titles "Stress Test Duration (minutes)" and "Core Temperature (°C)" in dark ink with units; tick labels in a slightly softer dark gray, all fully visible with no clipped digits; legend at top with four swatches (solid green, dashed purple, dotted blue, dash-dot orange) each labeled "Core 1"-"Core 4"; subtle horizontal gridlines only on the y-axis.
      Data: Four line series starting close together (~44-48°C) and ramping/plateauing to distinct temperature bands (~58°C to ~83°C) by minute 60. First series is brand green #009E73, followed by lavender, blue, and ochre in canonical Imprint order. Each series uses a distinct dash pattern (solid, dashed, dotted, dash-dot) matching its legend swatch.
      Legibility verdict: PASS - all text is clearly readable against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black (~#1A1A17), not pure black, not light.
      Chrome: Same title, axis titles, and tick labels now rendered in light/off-white ink, fully legible against the dark surface; legend and gridlines flip to light-on-dark equivalents with no contrast loss.
      Data: Identical four line colors and dash patterns as the light render (green, lavender, blue, ochre) - confirms only chrome (background/text/grid) changed between themes, not data colors.
      Legibility verdict: PASS - no dark-on-dark failures; all title, axis, tick, and legend text is clearly visible against the near-black background.
