review:
  strengths:
  - Correctly demonstrates all four standard line styles from the spec (solid, dashed,
    dotted, dash-dot) with legend markers that visibly reflect each series' style
  - First series uses Imprint brand green (#009E73); remaining series follow the Imprint
    palette order
  - Chrome (background, text, grid, legend) is correctly theme-adaptive between light
    (#FAF8F1) and dark (#1A1A17) renders, with identical data colors in both
  - Clean KISS code with deterministic in-memory data, correct mount-node contract,
    and animation disabled per harness requirements
  - Realistic, neutral dataset (monthly average temperatures for four cities across
    different climate zones) that naturally produces a readable visual hierarchy
  weaknesses:
  - Only 12 data points per series (one per month), well below the spec's recommended
    50-500 point range meant to test line-style clarity at scale — consider denser
    data (e.g. weekly or daily granularity over 1-2 years) so dash/dot patterns are
    exercised across many more segments
  - 'Line width is inconsistent across series: Berlin uses width 3.5 while Madrid,
    Oslo, and Cairo use width 3 — the spec explicitly calls for consistent line width
    across styles; set all series to the same width (e.g. 3)'
  - 'The x-axis line renders at the y=0 gridline (ECharts axisLine.onZero default)
    rather than at the bottom of the plot area, disconnecting it visually from the
    month tick labels below — set xAxis.axisLine.onZero: false (or hide the axis line)
    for a cleaner, bottom-anchored axis'
  - Design Excellence is only moderately raised above defaults — consider adding a
    touch more visual hierarchy (e.g., subtle emphasis on the most relevant series
    or annotation of peak/trough months) to strengthen data storytelling
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "Monthly Temperature by City · line-styled · javascript · echarts · anyplot.ai" is centered and clearly readable in dark ink. Legend (Berlin, Madrid, Oslo, Cairo) sits below the title with line-style swatches matching each series. X-axis shows Jan-Dec month labels in soft gray, readable. Y-axis label "Avg. Temperature (°C)" is rotated and legible. Horizontal gridlines are subtle. All text is clearly readable against the light background.
      Data: Berlin = solid green (#009E73, first Imprint color), Madrid = dashed lavender/purple, Oslo = dotted blue, Cairo = dash-dot orange/brown. Four distinct line styles are easily distinguishable even without relying on color alone, satisfying the spec's core requirement.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Title, legend text, axis labels and tick labels all render in light/white tones and are clearly visible against the dark background. No dark-on-dark or light-on-light failures observed. Gridlines are faint but visible.
      Data: Same four line styles and the same four colors (green, lavender, blue, orange) as the light render — confirmed identical data colors, only chrome flipped.
      Legibility verdict: PASS
