review:
  strengths:
  - All four standard line styles (solid, dashed, dotted, dash-dot) are correctly
    demonstrated, with a custom dash-array for dash-dot beyond ECharts' built-in named
    types
  - Line width is now consistent across all four series (fixed from attempt 1's 3.5
    vs 3 inconsistency)
  - 'X-axis line no longer sits at the y=0 crossing — onZero: false correctly anchors
    it to the plot bottom (fixed from attempt 1)'
  - Data density increased from 12 monthly points to 365 daily points per series,
    comfortably within the spec's recommended 50-500 range and still keeping every
    line style clearly distinguishable
  - 'Correct theme-adaptive chrome: identical data colors between light and dark renders,
    first series is Imprint brand green (#009E73), backgrounds match the warm off-white/near-black
    tokens'
  - 'Clean, idiomatic ECharts usage: category axis with a custom interval/formatter
    callback compresses 365 daily points into clean Jan-Dec tick labels, deterministic
    in-memory data, animation disabled, correct mount-node contract'
  weaknesses:
  - Data Excellence storytelling is still generic — no deliberate emphasis (annotation,
    callout, or highlight) on peak/trough months as flagged in attempt 1; the visual
    hierarchy relies only on the natural climate-zone ordering
  - The added weekly/sub-monthly 'wobble' is a perfectly regular double-cosine ripple
    rather than natural-looking daily variability, which slightly undercuts the realism
    of the synthetic dataset even though it usefully keeps the dash/dot patterns visible
    at 365 points
  - Aesthetic polish is competent but not exceptional — consider subtle season-band
    shading or a highlighted focal series to strengthen Design Excellence further
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "Daily Temperature by City · line-styled · javascript · echarts · anyplot.ai" is centered near the top in dark ink and fully legible. Legend (Berlin, Madrid, Oslo, Cairo) sits below the title with line-style swatches matching each series' dash pattern. Y-axis label "Avg. Temperature (°C)" includes units. X-axis shows Jan-Dec month labels derived from 365 daily data points via a custom interval/formatter. Horizontal gridlines are subtle but visible; the x-axis line now sits at the plot bottom (fixed from attempt 1's onZero issue) instead of crossing at y=0.
      Data: Four lines with distinct styles — solid green (Berlin), dashed lavender (Madrid), dotted blue (Oslo), dash-dot orange/brown (Cairo) — all rendered at a consistent line width. First series is Imprint brand green (#009E73). Daily wobble keeps the dash/dot patterns visibly distinguishable across all 365 points instead of collapsing into a solid-looking line.
      Legibility verdict: PASS — no light-on-light or illegible text observed.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Title, legend text, and axis labels render in light gray/off-white tones and are clearly legible against the dark background. No dark-on-dark failures — every tick label, the y-axis name, and the legend entries stand out clearly from the background.
      Data: Line colors (green, lavender, blue, orange) are identical to the light render; only the background, text, and gridline colors flip between themes, as required.
      Legibility verdict: PASS — no dark-on-dark failures observed.
