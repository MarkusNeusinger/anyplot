review:
  strengths:
  - All four canonical line styles (solid, dashed, dotted, dash-dot) are correctly
    implemented with a consistent 3.5px stroke-width across series, matching the spec's
    black-and-white/accessibility intent.
  - 'First series correctly uses Imprint green #009E73, and all data colors are identical
    between light and dark renders — only chrome (background, text, grid, legend)
    adapts.'
  - 'Clean chart-junk removal: no plot border box, y-axis-only gridlines kept subtle,
    and generous whitespace separates the legend from the plot area.'
  - Deterministic reproducibility via a fixed-seed LCG, appropriate for the browser
    runtime which has no seeded RNG.
  weaknesses:
  - Dotted (Asia-Pacific, "2,4") and dash-dot (Latin America, "10,4,2,4") styles are
    visually close at a glance — consider widening the dot gap slightly so the two
    remain distinct at small preview sizes (e.g. the 400px thumbnail).
  - 'Data storytelling (DE-03) is generic: the four series are simply ordered by magnitude
    with no additional emphasis (annotation, highlighted series, or callout) to guide
    the viewer to an insight.'
  - 'Library mastery is basic: stroke-dasharray for line styling is the only distinctive
    d3 technique used — no additional d3-specific capability (e.g. curve/annotation
    variety beyond curveMonotoneX) is showcased.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1-like), consistent with the light theme token.
      Chrome: Title "line-styled · javascript · d3 · anyplot.ai" centered at top in bold dark text; y-axis label "Shipment Volume (thousand units)" rotated at left, x-axis label "Month" centered below; subtle horizontal gridlines only; axis ticks and domain lines in soft dark gray; legend at right lists all 4 series with matching line-style swatches.
      Data: Four series from M0-M35 trending upward — North America (green, solid, highest ~82→104), Europe (violet, dashed, ~68→80), Asia-Pacific (blue, dotted, ~45→77), Latin America (amber, dash-dot, ~30→46). First series is Imprint green #009E73 as required.
      Legibility verdict: PASS — all text (title, axis labels, ticks, legend) is clearly readable against the light background; no overlap between text and data.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17-like), consistent with the dark theme token.
      Chrome: Same title, axis labels, and legend layout as the light render but now rendered in light/white text; gridlines remain subtle against the dark surface; axis ticks/domain lines rendered in light gray.
      Data: Same four series with identical colors and line styles as the light render (green solid, violet dashed, blue dotted, amber dash-dot) — confirming data colors do not shift between themes, only chrome inverted.
      Legibility verdict: PASS — no dark-on-dark issues; all title, axis, tick, and legend text is clearly visible against the near-black background.
