review:
  strengths:
  - Correctly implements all four required line styles (solid, dashed, dotted, dash-dot)
    via getLineElementUtilityClass + sx, a MUI X-specific technique since the library
    has no native per-series dash prop
  - Consistent line width (strokeWidth 3) across all styles as the spec requires
  - Custom legend row renders an actual dashed-line swatch per series (not just a
    color square), which correctly maps line style to series name per SC-02/spec Notes
  - 'Realistic, well-chosen dataset: request-latency percentiles (p50/p90/p99/p99.9)
    with a periodic tail-latency spike pattern on p99.9 only — a genuine SRE/monitoring
    scenario that demonstrates why multiple percentiles and line styles matter'
  - 'First series uses Imprint #009E73, remaining series follow canonical Imprint
    order (lavender, blue, ochre); both renders are theme-correct with identical data
    colors'
  - Deterministic seeded PRNG (mulberry32(42)), clean imports, no fake interactivity
  weaknesses:
  - In the 90-115ms band, the dotted p99 line and dash-dot p99.9 line cross frequently
    and read as visually congested — consider a small vertical offset-safe tweak (e.g.
    slightly thicker/denser dash for p99) to ease disambiguation at a glance
  - The p99 dotted dash pattern ('2 6') is very fine and risks blending into the background
    when the PNG is scaled to ~400px mobile width — consider a slightly denser dot
    spacing or marginally thicker stroke for that series specifically
  - 'Design excellence is solid but still reads as a well-configured default rather
    than exceptional: consider a deliberate focal-point touch (e.g. a subtle annotation
    or emphasis on the largest p99.9 spike) to make the tail-latency story more explicit,
    per DE-03'
  - Both the y-axis label and the built-in legend were replaced with manual HTML elements
    to work around real MUI X limitations (no dash preview in the built-in legend;
    rotated axis label collides with 3-digit ticks) — the workarounds are reasonable,
    but if `slotProps.legend`/axis `label` positioning can be tuned to keep the native
    components, that would score higher on idiomatic library usage (LM-01)
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Dark title "line-styled · javascript · muix · anyplot.ai" top-left, dark "Response Latency (ms)" y-axis caption above the chart, dark "Time (minutes)" x-axis label below, soft dark tick labels on both axes, subtle horizontal gridlines. All text is clearly readable against the light background.
      Data: Four lines share the Imprint palette in canonical order — brand green solid (p50 latency, ~42-50ms, flattest), lavender dashed (p90 latency, ~55-70ms), blue dotted (p99 latency, ~90-115ms, oscillating), and ochre dash-dot (p99.9 latency, mostly tracking just above p99 but with three sharp spikes up to ~190ms). A custom legend row below the chart shows each series name next to a small line sample rendered in its actual dash pattern, correctly mapping style to name.
      Legibility verdict: PASS.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Title, axis caption, axis label, and tick labels all render in light ink, clearly legible against the dark background; gridlines are subtle and visible. No dark-on-dark text was observed anywhere (title, axis captions, tick labels, or legend text).
      Data: The four series use the identical hex colors as the light render (brand green, lavender, blue, ochre) — only the chrome (background, text, grid) flipped, exactly as required.
      Legibility verdict: PASS.
