review:
  strengths:
  - All four standard line styles in their Notes order (solid p50, dashed p90, dotted
    p99, dash-dot p99.9) at one stroke width (LINE_WIDTH = 3) applied through the
    v9 `.MuiLineChart-line[data-series=...]` selectors, so the series stay distinguishable
    in monochrome while the Imprint colors sit on top
  - Legend swatches are custom 44 px line samples passed through MUI X's native `labelMarkType`
    slot, drawn with the series' own dash pattern and stroke width, so every legend
    entry shows its full pattern in both themes
  - The p50 → p99.9 latency percentiles are a real, neutral monitoring scenario with
    a built-in ordering (each percentile above the one below by construction) and
    periodic tail spikes that give the tail series a visibly different character from
    the stable median
  - '`curve: "monotoneX"` smooths the lines without overshooting the data values;
    `dataset` + `dataKey` drive the series from the records idiomatically'
  - 'Explicit typography throughout (title 22 px, axis titles 16 px in ink, ticks
    14 px in inkSoft, legend 14 px); text is fully legible on both the #FAF8F1 and
    #1A1A17 surfaces'
  - Library-native hover tooltips and legend interaction in the HTML output
  weaknesses:
  - 'Suggestion: the gray `4 4` dashed vertical reference line at the p99.9 peak is
    a fifth dash pattern on a chart whose encoding is line style; in a monochrome
    print it competes with the p90 dashes, and the peak is already obvious without
    it — consider dropping it or drawing it solid and lighter.'
  - 'Suggestion: in the 400 px thumbnail the dotted #4467A3 p99 line thins out on
    the dark surface; a slightly larger dot (`3 5` → `4 5` with round caps) would
    keep it reading as dots at small scale.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white, consistent with #FAF8F1; no pure white.
      Chrome: left-aligned title "line-styled · javascript · muix · anyplot.ai" in dark ink at the top; y-axis title "Response Latency (ms)" rotated on the left, x-axis title "Time (minutes)" centered below; tick labels 40–200 (step 10) and 0–58 (step 2) in soft dark ink; subtle horizontal-only grid; left and bottom axis lines only. A thin gray dashed vertical reference line at minute 51 with the label "peak p99.9 · 191.1ms" near the top. All text readable.
      Data: four lines over 60 minutes — p50 solid #009E73 (~40–48 ms), p90 dashed #C475FD (~55–69 ms), p99 dotted #4467A3 (~91–113 ms), p99.9 dash-dot #BD8233 (~93–191 ms with spikes at 0, 17, 34 and 51). Same stroke width for all; dots read as dots and dashes as dashes along the whole lines. Bottom-centered horizontal legend with 44 px pattern swatches: "p50 latency", "p90 latency", "p99 latency", "p99.9 latency". First series is #009E73.
      Legibility verdict: PASS

