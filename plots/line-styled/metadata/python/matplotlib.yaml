      Background: Warm off-white #FAF8F1 across the whole 3200×1800 canvas.
      Chrome: Title 'line-styled · python · matplotlib · anyplot.ai' in dark ink at the top centre; axis titles 'Month' and 'Performance Score' in dark ink; month tick labels Jan–Dec and score ticks 90–130 in soft ink; subtle horizontal grid; top and right spines removed; legend in the upper left on an elevated off-white fill with a thin soft-ink frame. All readable.
      Data: Series 1 solid #009E73 rising from about 103 to 135; Series 2 dashed purple #C475FD falling to about 84 in Aug and recovering to about 90; Series 3 dotted blue #4467A3 rising to about 125; Series 4 dash-dot ochre #BD8233 hovering between 90 and 101. One line width; every pattern recognizable along the whole line.
