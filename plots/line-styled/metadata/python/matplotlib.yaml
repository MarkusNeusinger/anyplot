review:
  strengths:
  - All four standard line styles (solid, dashed, dotted, dash-dot) at one line width
    of 2.5, so the series stay distinguishable in monochrome
  - Legend swatches lengthened with handlelength=4 so each dash and dash-dot pattern
    shows in full
  - Theme tokens threaded through title, ticks, spines, grid and the elevated legend
    frame; both renders read cleanly
  - 'Adaptable layout: column constants, one Data block ending in a tidy df, and a
    plot block that reads only df'
  weaknesses:
  - 'DQ-02 (both): the four series are labelled ''Series 1''–''Series 4'', abstract
    labels with nothing tying them to the CPU benchmark the code comment describes
    → name them as real-sounding processors or benchmark runs (for example ''Desktop
    CPU'', ''Laptop CPU'', ''Server CPU'', ''Mobile SoC''). Likely cause: the SERIES
    constant.'
  - 'Suggestion: drop the legend box frame, which the style guide''s decoration checklist
    lists for removal.'
  - 'Suggestion: a direct label at each line''s right end could replace the legend
    lookup.'
  image_description: |-
