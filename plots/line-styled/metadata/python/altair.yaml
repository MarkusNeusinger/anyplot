review:
  strengths:
  - The station field drives both the color and the StrokeDash channels with explicit
    domain/range scales, so Vega-Lite merges them into one 'Weather Station' legend
    with style and hue together
  - The four standard styles (solid, dashed, dotted, dash-dot) at one 2.5 px width
    stay clearly recognizable along every line, so the chart works in monochrome
  - The legend swatches (symbolSize 1600, symbolType stroke) are long enough to show
    each dash pattern in full
  - 'Theme tokens are applied throughout: off-white and near-black backgrounds, an
    elevated legend box, and readable ink in both renders, with identical Imprint
    data colors'
  - Tooltips with station, month and the temperature formatted to one decimal add
    inspection in the HTML output
  weaknesses:
  - 'DQ-02 (both): the four stations are generic terrain types (Coastal, Mountain,
    Valley, Highland), and ''Mountain'' runs 3 °C warmer than ''Highland'' all year,
    which reverses the usual altitude order → name real-sounding stations or order
    the offsets by elevation (the mountain station coldest). Likely cause: the STATIONS
    list and the offsets [0, -3, 5, -6].'
  - 'Suggestion: the spec recommends 50–500 points; a daily or weekly series would
    show how the dash and dot patterns hold up along a longer, noisier line.'
  - 'Suggestion: the inner view is 520×340 against the library prompt''s 620×320 landscape
    starting point; a wider view would fill more of the canvas to the right of the
    plot.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole 3200x1800 canvas, no view frame.
      Chrome: bold dark title "line-styled · python · altair · anyplot.ai" centred at the top; y-axis "Temperature (°C)" with ticks -5 to 35 in steps of 5; x-axis "Month" with Jan–Dec ticks; subtle horizontal grid lines; left and bottom axis lines in soft ink. The legend "Weather Station" sits right of the plot in a slightly lighter elevated box with a thin rule border. All text is dark and readable.
      Data: four lines at one width, Coastal solid #009E73, Mountain dashed #C475FD, Valley dotted #4467A3, Highland dash-dot #BD8233. Each follows a seasonal arc peaking in July/August (Valley highest at about 35 °C, Highland lowest at about -2 °C in February). Dashes, square dots and dash-dot patterns are clearly recognizable; lines cross between Sep and Dec.
