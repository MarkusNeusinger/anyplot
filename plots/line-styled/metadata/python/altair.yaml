review:
  strengths:
  - All four standard styles (solid, dashed, dotted, dash-dot) are mapped through
    a native strokeDash encoding with a custom scale range, so the series stay distinguishable
    in monochrome while Imprint color rides on top
  - Color and strokeDash share one field, title and sort, so Vega-Lite merges them
    into a single legend whose stroke swatches (symbolType stroke, symbolSize 1600)
    are long enough to show each full pattern
  - One strokeWidth for every series, with the dot length set equal to the line width
    so dots render as square dots and stay recognizable along the whole line in both
    themes
  - Theme tokens threaded through title, axes and an elevated legend panel; both renders
    are fully legible and the data colors are identical
  - Temporal x axis with month-abbreviation labels and tooltips with readable titles
    add value in the HTML output
  weaknesses:
  - 'DQ-02 (both): the station offsets ignore the elevations the labels state: Pine
    Ridge at 1,850 m runs only about 6 °C colder than Harbor Point at 10 m, where
    a typical lapse rate of about 6.5 °C/km gives about 12 °C (−6 °C), so a reader
    who checks the labels sees implausible numbers → offsets roughly proportional
    to elevation (for example about −12 °C for Pine Ridge, −6 °C for Elk Plateau).
    Likely cause: the offset list [0, -6, 5, -3] in the data block.'
  - 'Suggestion: a few more points per series (weekly instead of monthly values) would
    sit inside the spec''s recommended 50–500 points and show the patterns over longer
    runs.'
  - 'Suggestion: a slightly wider inner view (the library prompt''s 620 px landscape
    width) would fill the empty space under the legend.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the full 3200x1800 canvas.
      Chrome: bold dark title "line-styled · python · altair · anyplot.ai" centered above the plot; y-axis "Temperature (°C)" from −5 to 35 with subtle horizontal gridlines; x-axis "Month" with Jan–Dec labels, no vertical grid; dark-grey tick labels; legend "Weather Station" on the right in an elevated off-white panel with a thin rule border. All text readable.
      Data: four monthly temperature lines — Harbor Point solid #009E73, Pine Ridge dashed #C475FD, Sun Valley dotted #4467A3, Elk Plateau dash-dot #BD8233 — same stroke width; dots, dashes and dash-dots clearly recognizable; lines cross around Sep–Oct. Legend swatches show the full patterns.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title and axis titles in light ink, tick labels light grey, gridlines subtle light at low opacity, legend panel in a slightly elevated dark grey with a light rule border. No dark-on-dark text.
      Data: colors and dash patterns identical to the light render; the blue dotted line is the lowest-contrast series but remains clearly visible; brand green reads well.
      Legibility verdict: PASS
