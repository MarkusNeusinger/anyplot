review:
  strengths:
  - All four standard styles (solid, dashed, dotted, dash-dot) at one 7 px width,
    with dash patterns proportioned to that width so dots read as dots and dashes
    as dashes
  - 'Theme tokens threaded through pygal''s Style object: chrome flips cleanly while
    the Imprint data colours stay identical'
  - Legend labels name both the series and its line style, below the plot clear of
    the data
  - Native per-series stroke_style dasharray, plus pygal's HTML tooltips for value
    inspection
  weaknesses:
  - 'VQ-01 (both): the y tick labels 10 and 20 render at 44 while every other tick
    renders at 56, so two ticks look smaller for no reason → one tick size on both
    axes (44, the style-guide tick reference, or 56 for all). Likely cause: label_font_size=56
    above major_label_font_size=44; pygal draws the major ticks with the latter.'
  - 'SC-02 (both): the legend swatches are filled colour squares that show none of
    the four line patterns, so the legend maps styles to names only through the label
    text (C5) → line-sample swatches long enough to show each pattern. Likely cause:
    pygal''s default square legend box (legend_box_size=40); draw the legend entries
    as line samples, e.g. a custom legend via the SVG or pygal''s stroke-based legend
    styling.'
  - 'DQ-02 (both): the series are labelled Sensor A–D, which reads generic → name
    the sensors by location, e.g. ''Rooftop'', ''North wall'', ''Basement'', ''Greenhouse''.
    Likely cause: the SENSORS list.'
  - 'Suggestion: the dotted y-guides in the light render share the dotted vocabulary
    of Sensor C; a solid, lighter guide would keep the dotted pattern unique to the
    data.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, 3200x1800.
      Chrome: title 'line-styled · python · pygal · anyplot.ai' centred at top (~51% width); y title 'Temperature (°C)', x title 'Month'; dark ink ticks Jan–Dec and 4–28, with 10 and 20 drawn visibly smaller than the other y ticks; dotted grey y-guides; two-column legend below the axis. All text readable.
      Data: four 7 px lines with 11 px dots: Sensor A solid #009E73, Sensor B dashed #C475FD, Sensor C dotted #4467A3, Sensor D dash-dot #BD8233; seasonal curve peaking in July, lines crossing around Apr and Aug. Legend swatches are filled squares.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: same layout with light ink title, axis titles, ticks and legend; y-guides faint but visible; no dark-on-dark text.
      Data: identical colours and patterns to the light render; brand green clearly visible; dotted blue Sensor C is the faintest but readable.
      Legibility verdict: PASS
