review:
  strengths:
  - Standard styles solid, dashed, dotted and dash-dot mapped in order, with one line
    width (1.3), so the series read apart in monochrome
  - Color and linetype mapped to the same column give plotnine's single merged legend;
    legend_key_width=45 shows each full dash pattern
  - Rotated 30° quarter labels keep twelve 'Qn YYYY' ticks clear of each other
  - Theme tokens threaded through every chrome element; both renders readable, data
    colors identical
  - 'Tidy data via melt and limits taken from the series list keep the Imprint order
    (Product A = #009E73)'
  weaknesses:
  - 'Suggestion: a direct end-of-line label per series could replace the legend lookup
    on the right.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the canvas and panel.
      Chrome: title 'line-styled · python · plotnine · anyplot.ai' in dark ink at top center; x-axis 'Quarter' with 12 tick labels Q1 2022 to Q4 2024 rotated 30°; y-axis 'Sales (thousands USD)' with ticks 80-140; L-shaped axis lines, subtle grid; legend 'Product Line' on a slightly elevated fill at right. All readable.
      Data: Product A solid #009E73 rising ~105 to ~154; Product B dashed #C475FD declining ~102 to ~80 then ~84; Product C dotted #4467A3 volatile 80-96; Product D dash-dot #BD8233 ~97 to ~112. Same line width; dashes, dots and dash-dots stay distinct; legend keys long enough for each pattern.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title and axis titles in light ink, tick and legend labels in soft light gray; legend on #242420; grid subtle. No dark-on-dark text.
      Data: colors and line styles identical to the light render; brand green clearly visible.
      Legibility verdict: PASS
