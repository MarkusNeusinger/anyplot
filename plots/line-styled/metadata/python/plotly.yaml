review:
  strengths:
  - Four standard styles (solid, dash, dot, dashdot) at one 2.5 px width; each pattern
    stays recognizable along the whole line in both themes
  - Horizontal legend strip with a 'Sensor' title and itemwidth-lengthened swatches
    shows every full pattern
  - 'Clean theme-token chrome: readable text, subtle grid and correct backgrounds
    in light and dark'
  - 'Native plotly interactivity: per-trace hovertemplate with x-unified hover in
    the HTML output'
  - 'Adaptable structure: column constants and one loop over SENSORS drive the plot'
  weaknesses:
  - 'DQ-01 (both): each series has 24 points, below the spec''s recommended 50-500
    → at least 50 samples (for example 30-minute readings over 24 h, +24 or more).
    Likely cause: hours = np.arange(0, 24).'
  - 'Suggestion: align the ''Sensor'' legend title vertically with the entries (title
    side ''left'' centered) for a tidier strip.'
  - 'Suggestion: a 4 h dtick with a 6 h alternative (0, 6, 12, 18, 24) would match
    how daily cycles are usually read.'
