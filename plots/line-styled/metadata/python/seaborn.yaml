review:
  strengths:
  - sns.lineplot maps one Service column to both hue and style with a dashes dict,
    so seaborn builds the combined style+color legend natively
  - All four standard styles with tuned dash lengths stay recognizable along dense
    96-point lines in both themes
  - Legend swatches lengthened (handlelength 4.5) so the dash-dot pattern is shown
    in full
  - Realistic daily CPU-load scenario with complementary peaks makes the lines cross,
    which exercises style-only separation
  - Theme tokens threaded through rc params; both renders theme-correct
  weaknesses:
  - 'Suggestion: a subtle shaded night window (00:00–06:00) could anchor the batch-worker
    peak, if a later spec variant asks for annotation.'
  - 'Suggestion: placing the legend outside the plot area on the right would free
    the upper-right corner where Web API and Database run near 40%.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, not pure white.
      Chrome: title 'line-styled · python · seaborn · anyplot.ai' in dark ink at the top centre; axis titles 'Hour of day' and 'CPU load (%)' in dark ink; tick labels 00:00–20:00 every 4 h and 0–80 in soft grey; faint horizontal grid; left and bottom spines only; legend box (elevated off-white, grey frame) titled 'Service' in the upper right. All readable.
      Data: four lines at one width — Web API solid #009E73 (midday peak ~72%), Database dashed #C475FD (evening peak ~43%), Cache dotted #4467A3 (10–25%), Batch worker dash-dot #BD8233 (night peak ~69% at 02:30, then ~12%). Patterns remain recognizable along each line.
