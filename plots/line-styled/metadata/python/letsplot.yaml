review:
  strengths:
  - Four series drawn in the spec's four standard styles in its order (solid, dashed,
    dotted, dash-dot) at one line width (geom_line size=1.2), so the chart reads in
    monochrome
  - Color and linetype mapped to the same City column, so lets-plot merges them into
    one legend whose 60 px swatches (legend_key_width=60) show each full dash pattern
  - Dotted and dash-dot patterns stay recognizable along the whole line in both themes;
    no markers interrupt them
  - Theme tokens threaded through every chrome element; grid at INK 15 % via rgba();
    Imprint palette in canonical order identical across themes
  - Canonical 3200x1800 canvas (ggsize 800x450, scale=4) with text at the style guide's
    lets-plot sizes (16/12/10/10)
  - Interactive HTML export alongside the PNG gives per-point tooltips
  weaknesses:
  - 'DE-02 (both): the panel is drawn with a four-sided frame where the style guide
    asks for the L-shaped left and bottom spines only → remove the top and right edges.
    Likely cause: lets-plot''s default panel border, not turned off in anyplot_theme
    (e.g. panel_border=element_blank() with axis_line kept).'
  - 'DQ-03 (both): daily rainfall never drops to zero and stays at 18-22 mm every
    day for 30 days in Seattle (real daily mean about 2-5 mm) and 4-5 mm every day
    in Athens → daily rainfall with dry days and realistic city magnitudes, or relabel
    the y axis as a quantity that does vary smoothly (e.g. cumulative rainfall or
    daily temperature). Likely cause: the random-walk generator 15/5/20/8 + cumsum(...)/5
    labelled as daily rainfall.'
  - 'Suggestion: a slightly heavier line (size about 1.5) would give the dotted Seattle
    pattern more presence against the grid.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 (pixel check 250,248,241); legend box on the elevated #FFFDF6.
      Chrome: title "line-styled · python · letsplot · anyplot.ai" top-left in dark INK at about 40 % of the width; axis titles "Day of month" and "Rainfall (mm)", tick labels 0-30 and 4-22 in INK_SOFT, all clearly readable; soft grid; a four-sided dark panel frame; legend "City" on the right.
      Data: four lines at one width - Paris solid #009E73, Athens dashed #C475FD, Seattle dotted #4467A3, Delhi dash-dot #BD8233; patterns clearly recognizable along each line and in the 60 px legend swatches.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17 (pixel check 26,26,23); legend box on #242420.
      Chrome: title, axis titles and tick labels in light INK/INK_SOFT, all readable; no dark-on-dark text; soft light grid; grey four-sided panel frame.
      Data: identical colors and line styles to the light render; brand green clearly visible.
      Legibility verdict: PASS
