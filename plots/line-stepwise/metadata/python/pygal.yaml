review:
  strengths:
  - 'True step geometry: every change is a vertical jump at the tier limit and every
    price a flat plateau at its exact value (post alignment throughout)'
  - pygal.XY with numeric (x, y) vertices puts jumps exactly on the data x values
    instead of on category slots
  - Theme tokens threaded through the Style object; chrome flips cleanly while the
    brand-green series stays identical
  - 'Adaptable layout: column constants and one Data block ending in df, with a dropna
    guard for missing values'
  weaknesses:
  - 'VQ-05 (both): y tick labels render in two sizes — 0 and 50 at the major size
    (44) next to 10–40 at the larger label size (56) → one tick size on both axes
    (about −12 px for the minor y labels). Likely cause: label_font_size=56 vs major_label_font_size=44
    in Style, with pygal treating 0 and 50 as major y labels.'
  - 'DQ-01 (code): the tariff table has 41 rows (0–1000 kWh in 25 kWh steps), below
    the spec''s 50–500 size → at least 50 rows, e.g. 20 kWh steps (51 rows). Likely
    cause: np.arange(0, 1001, 25).'
  - 'Suggestion: a lighter grid tone in the dark render would keep the dashed y guides
    visible against #1A1A17.'
