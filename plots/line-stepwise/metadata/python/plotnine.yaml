review:
  strengths:
  - 'Native geom_step(direction=''hv'') draws one post alignment for the whole series:
    flat plateaus at the exact balances, vertical jumps on the posting days'
  - 'Data story fits the plot type: a checking-account balance that only changes when
    a transaction posts, with a large mid-month deposit and plateaus of very different
    length'
  - Axis titles come straight from the column constants, so plotnine labels the axes
    without a labs() call for them
  - 'Theme tokens thread through every chrome element: both renders readable, data
    color identical, backgrounds #FAF8F1 / #1A1A17'
  - Canvas exactly 3200x1800 with the library prompt's text sizes
  weaknesses:
  - 'DE-02 (both): the panel is boxed by all four spines (panel_border) and gridlines
    run on both axes of a line chart, short of the style guide''s L-shaped frame and
    y-only grid → remove the top and right spines (keep axis_line left and bottom)
    and drop the vertical grid. Likely cause: panel_border=element_rect(color=INK_SOFT)
    and panel_grid_major without panel_grid_major_x=element_blank().'
  - 'Suggestion: a small text label on the day-15 deposit jump would give the staircase
    a focal point.'
  - 'Suggestion: a dollar-formatted y axis (scale_y_continuous(labels=...)) would
    read more naturally for a balance.'
