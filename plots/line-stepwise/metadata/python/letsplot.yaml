      Data: one #009E73 post-aligned step line (hv) at 50 → 70 (h6) → 100 (h9) → 110 (h12) → 140 (h15) → 150 (h18) → 140 (h21), ending at h23; six filled green circles at the change points. Plateaus read as single flat segments.
