review:
  strengths:
  - 'Native geom_step(direction="hv") draws a clean post-aligned staircase: every
    plateau reads as one flat segment and every change as a vertical jump at its hour,
    in both renders'
  - Markers are drawn only at the six change points, derived from the data with df[RESPONSE].diff()
    instead of hard-coded hours, so they mark exactly where the state changes and
    stay small next to the 1.0 line
  - 'Theme tokens carried through title, axis titles, ticks, axis lines and background:
    both renders are fully readable on #FAF8F1 and #1A1A17 with identical #009E73
    data'
  - Canonical 3200x1800 canvas (ggsize(800, 450), scale=4) and library-prompt font
    sizes (16/12/10) give a balanced layout; axis titles come straight from the column
    constants
  - Plausible, neutral server response-time scenario with deterministic seed and values
    within 50-150 ms
  weaknesses:
  - 'DE-02 (both): the grid is drawn in solid INK_SOFT on both axes and the panel
    keeps a frame on all four sides, so the grid competes with the step line on a
    simple 24-point line chart → y-axis-only grid at about 10-15 % ink opacity and
    only the left and bottom axis lines (or none). Likely cause: panel_grid_major=element_line(color=INK_SOFT,
    size=0.3) applied to both axes on top of theme_minimal''s panel border.'
  - 'DQ-01 (both): the series has 24 hourly points, below the spec''s 50-500 point
    range (-26 points) → at least 50 points, e.g. 30-minute sampling over 24 hours
    or several days of hourly data. Likely cause: np.arange(0, 24).'
  - 'Suggestion: drop the unused ELEVATED_BG token and the no-op theme(legend_position="none")
    for a leaner script.'
  - 'Suggestion: a lets-plot tooltip layout (layer_tooltips) on the step line would
    make the HTML view show the hour and response time on hover.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, not pure white; canvas 3200x1800.
