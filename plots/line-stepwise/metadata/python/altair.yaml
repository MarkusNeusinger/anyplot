review:
  strengths:
  - Native Vega-Lite step interpolation (mark_line interpolate='step-after') draws
    the series as pure horizontal and vertical segments with every jump on a data
    day and every plateau at its exact price; the four-day hold at 110 and the three-day
    holds read as single flat runs
  - Y scale with zero=False lets the 100–147 price range fill the plot height, so
    even the 1 $ steps at days 20–23 stay visible
  - 'Theme tokens threaded through configure_axis/configure_view/configure_title:
    chrome flips cleanly while the #009E73 line is identical in both renders'
  - Canvas lands exactly on 3200×1800 through the library prompt's pad-only block
  - Escaped column constants feed both the encodings and readable tooltips in the
    interactive HTML
  weaknesses:
  - 'DE-02 (both): vertical dashed gridlines at every second day on a line chart,
    where the style guide''s grid rule allows a y-axis grid only → drop the x grid
    and keep the subtle y grid. Likely cause: configure_axis(gridColor=…, gridDash=…)
    applies the grid to both axes; set grid=False on the x axis.'
  - 'Suggestion: small point markers on the 25 data days would show where each price
    is sampled without breaking the plateaus.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole 3200×1800 canvas, including the pad around the chart
      Chrome: title "line-stepwise · python · altair · anyplot.ai" bold dark ink, centered; axis titles "Day" and "Price ($)" in dark ink; tick labels 0–24 (step 2) and 100–150 (step 5) in soft ink; left and bottom domain lines only; subtle dashed grid on both axes — all readable
      Data: a single #009E73 step-after line, about 3 px; flat plateaus at exact integer prices, vertical jumps on the data days, from 100 rising to 110, dipping to 101, climbing to 129, dipping to 123, then stepping up to 147; no markers
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17
