review:
  strengths:
  - Uses bokeh's native p.step glyph with mode='after', so every value is held flat
    until the next hour and each change is a clean vertical jump
  - Text sizes, borders and toolbar_location=None follow the bokeh canvas contract;
    the render is exactly 3200x1800 with nothing clipped
  - Markers carry a page-colored ring that separates each data point from the step
    corner in both themes
  - Theme tokens are threaded through every chrome element; both renders are fully
    legible
  - HoverTool scoped to the marker renderer gives exact hour and CPU values in the
    HTML artifact
  weaknesses:
  - 'Suggestion: the example uses 24 points, below the Data section''s 50-500; a finer
    sampling (for example readings every 15 minutes with held states) would sit inside
    the range and show longer plateaus.'
