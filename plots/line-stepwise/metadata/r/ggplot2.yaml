    pipeline must re-render plot-light.png/plot-dark.png from the current script before
    this can be scored with confidence - re-running the repair loop on the R code
    will not fix a stale render.'
  - Because the visible point count (~13) is below the spec's mandated 50-500 point
    range, DQ-01/DQ-03/SC-02 are scored against what is actually shown, not what the
    code claims to produce - re-render and re-review once the correct 90-point output
    is confirmed.
  - The intended focal-point annotation (dashed vline + highlighted jump marker +
    caption calling out the largest single floor change) is completely absent from
    both renders, removing the data-storytelling element the code was clearly written
    to add.
  - geom_point(size = 1.6) markers on top of geom_step are fairly small and low-contrast
