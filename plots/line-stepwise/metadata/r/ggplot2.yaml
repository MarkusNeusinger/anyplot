review:
  strengths:
  - Correct use of geom_step(direction = "hv") plus geom_point() cleanly demonstrates
    the horizontal-persistence / vertical-jump structure the spec asks for
  - Largest single change is called out with a dashed guide line, a highlighted ring
    marker, and a caption stating the exact value and location — a genuine focal point
    beyond the raw step shape
  - 'Theme-adaptive chrome is correctly wired: PAGE_BG/INK/INK_SOFT flip between light
    (#FAF8F1) and dark (#1A1A17) while the brand-green data color stays identical
    across both renders'
  - Title format, axis labels, and canvas dimensions (8x4.5in @ 400dpi landscape)
    all match the anyplot conventions exactly
  - 'Clean, reproducible, single-purpose script: set.seed(42), no unused imports,
    no fake interactivity'
  weaknesses:
  - 'Data is too dense and too random for a step-plot showcase: 90 stops with 1-6
    minute gaps over ~340 minutes means most horizontal ''plateau'' segments are only
    a few pixels wide, so the chart reads as a chaotic vertical comb/spaghetti pattern
    rather than clearly legible discrete steps — the core step-plot feature (long,
    readable horizontal persistence) is undersold. Reduce point count (e.g. 30-40
    stops) or widen the average dwell time so plateaus are visually distinguishable.'
  - Because floor changes are drawn from a uniform random distribution excluding immediate
    repeats, there is no discernible pattern (e.g. rush-hour clustering, common-floor
    bias) — purely random noise makes the data feel arbitrary rather than a plausible
    elevator log; a light Poisson/likely-floor weighting would read as more realistic.
  - With so many closely spaced steps, point markers and step corners overlap heavily
    in several regions (e.g. 100-130 min, 200-230 min, 280-300 min), reducing the
    visibility of individual data points.
  - Marker size (2.2) is uniform across the whole series; given the visual crowding,
    a smaller marker or added transparency would reduce the appearance of clutter.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1, not pure white.
      Chrome: Dark title ("Elevator Floor Position · line-stepwise · r · ggplot2 · anyplot.ai") clearly readable at top-left. Axis titles ("Elapsed Time (minutes)", "Floor") and tick labels are dark/soft-dark and legible against the light background. Horizontal gridlines at each even floor value are visible but not overpowering. Caption at bottom-left ("Largest single change: +10 floors at 97 min elapsed") is legible in soft ink.
      Data: All step lines, points, and the highlighted jump marker are brand green (#009E73). No red-green or other palette colors present (single series). A dashed soft-ink vertical guide marks the jump location, and a larger ringed green marker (white/cream-outlined) highlights the jump endpoint.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17, not pure black.
      Chrome: Title and axis titles render in light ink, tick labels in a softer light gray — all clearly legible against the dark background. No dark-on-dark text observed anywhere (title, axis labels, tick labels, caption all pass). Gridlines are light and subtle, visible without dominating.
      Data: Step lines, points, and the highlighted jump marker are the same brand green (#009E73) as the light render — confirmed identical hue across both themes. The highlighted marker's outline switches to the dark page background color as expected (chrome-only flip).
      Legibility verdict: PASS
