review:
  strengths:
  - Correct use of geom_step(direction = "hv") producing genuine horizontal-then-vertical
    transitions, matching the spec's core requirement
  - 'Theme-adaptive chrome is implemented correctly: PAGE_BG/INK/INK_SOFT tokens flip
    properly between light (#FAF8F1) and dark (#1A1A17), all text stays legible in
    both renders'
  - 'First (only) series correctly uses Imprint brand green #009E73, identical between
    light and dark'
  - Realistic, neutral, comprehensible scenario (elevator floor position over a service
    run) with plausible floor numbers and wait times
  - 'Clean KISS structure: seeded reproducible data generation, no functions/classes,
    correct ragg::agg_png save with theme-suffixed filename'
  - Custom y-axis breaks via scales::breaks_width(2) and removal of vertical gridlines/axis
    ticks show some intentional visual refinement beyond raw theme_minimal() defaults
  weaknesses:
  - Only 14 data points are generated (n_stops <- 14), but the specification explicitly
    requires 50-500 points ('depending on temporal frequency'). Increase to roughly
    60-120 stops so the step pattern reads with the density the spec calls for — this
    also gives the plot more visual richness for Design Excellence and Data Quality.
  - 'Design Excellence is generic: a single green step line with no additional visual
    hierarchy or focal point. Consider one restrained enhancement that doesn''t violate
    KISS — e.g. a subtle fill/ribbon under the step to reinforce ''value persistence'',
    or emphasizing the largest jump — to give DE-03 a clear story beyond ''data is
    displayed''.'
  - 'Library Mastery is generic (LM-02): only the basic geom_step + geom_point combination
    is used. With more data points, consider layering a secondary muted reference
    (e.g. a faint horizontal line at the mean floor) or leveraging another ggplot2-idiomatic
    touch to distinguish the implementation beyond default usage.'
  - Visual refinement (DE-02) is still close to theme_minimal() defaults aside from
    removing vertical gridlines — panel.border/legend chrome untouched (though not
    used here); a bit more deliberate spacing/typography polish would help.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "Elevator Floor Position · line-stepwise · r · ggplot2 · anyplot.ai" in dark ink at top-left, clearly readable, spans roughly 65% of canvas width. Axis titles "Elapsed Time (minutes)" (x) and "Floor" (y) in dark ink, both readable. Tick labels in a softer dark gray, readable. Horizontal gridlines are thin dark lines at y = 2,4,6,8,10, subtle but visible; no vertical gridlines (intentional).
      Data: Single step line in Imprint brand green (#009E73) with circular markers at each stop. 14 distinct floor stops visible, showing both small (1-2 floor) and large (up to 8-9 floor) jumps, holding constant between jumps (horizontal segments) before instantaneous vertical transitions — correctly demonstrates step/stepwise behavior.
      Legibility verdict: PASS — all text is clearly readable against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title text now rendered in light/near-white ink, clearly readable. Axis titles and tick labels also rendered in light tones, clearly legible against the dark background. Horizontal gridlines are thin light-gray lines, subtle but visible.
      Data: Step line and markers are the identical #009E73 green as the light render — confirmed unchanged data color between themes, only chrome flipped.
      Legibility verdict: PASS — no dark-on-dark failures observed; all title, axis, and tick text is clearly visible against the near-black background.
