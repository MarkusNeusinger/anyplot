review:
  strengths:
  - Uses the dedicated `stairs!` primitive with `step = :post` — the correct, idiomatic
    Makie recipe for a step plot rather than faking steps by repeating coordinates
    in `lines!`
  - Theme-adaptive chrome is fully threaded through (background, title/label ink,
    soft tick-label ink, rgba grid) — both light and dark renders are legible with
    identical data color across themes
  - 'Clean, minimal composition: L-shaped spines, y-axis-only subtle grid, single
    brand-green line, no redundant legend for the single series'
  - Realistic, neutral domain (warehouse pallet inventory over a 24h day) with a sensible
    value range (400-1600 pallets) that clearly demonstrates horizontal persistence
    and vertical jumps
  weaknesses:
  - Title occupies only ~23% of the canvas width (measured ~725/3200 px), well under
    the ~50-70% comfortable proportion range — consider raising titlesize from 20
    to ~24-26 for better visual weight against the 3200px canvas
  - No visual storytelling or focal point — the random-walk step data has no annotation
    or emphasis calling out a specific inflection point, so it reads as correct but
    flat (DE-03)
  - A few clusters of very closely spaced random event times (near hour 5, 8, 13,
    23) create tightly packed near-vertical spikes that look slightly busy — not a
    code defect, but spacing events with a minimum gap would produce a cleaner illustrative
    step shape
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1, not pure white.
      Chrome: Bold dark title "line-stepwise · julia · makie · anyplot.ai" centered at top; "Hour of Day" x-axis label and "Pallets in Stock" y-axis label in dark ink; grey tick labels (0/6/12/18/24 on x, 1000/1200/1400 on y); subtle horizontal grid lines; L-shaped spine (left + bottom only, top/right removed).
      Data: Single brand-green (#009E73) step line via `stairs!` with post-alignment, showing a pallet count that starts near 950, dips to ~850 around hour 2-3, then climbs with many small step jumps (some very tight clusters around hours 5, 8, 13) up to a peak near 1550 around hour 20-21, before settling back near 1450 by hour 24. Horizontal segments clearly show value persistence; vertical segments clearly show instantaneous jumps.
      Legibility verdict: PASS — title, axis labels, and tick labels are all clearly readable against the light background; no light-on-light text.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17, not pure black.
      Chrome: Same title now rendered in light/white ink, axis labels in light ink, tick labels in a lighter grey secondary tone; grid lines subtle and still visible against the dark background; same L-shaped spine treatment.
      Data: Identical brand-green (#009E73) step line and identical stock trajectory/shape as the light render — only the chrome (background, text, grid) flipped, confirming the data color is theme-independent.
      Legibility verdict: PASS — no dark-on-dark failures; all title/axis/tick text is clearly visible against the near-black background.
