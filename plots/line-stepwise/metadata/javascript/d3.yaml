review:
  strengths:
  - Faithful post-step curve (curveStepAfter) with markers precisely at true value-change
    vertices, visually separating horizontal persistence from vertical instantaneous
    change — directly demonstrates the spec's core concept
  - Realistic, neutral 24h call-center staffing scenario with a good mix of increases
    and decreases in value
  - 'Fully theme-correct rendering: brand green #009E73 identical in both themes,
    Imprint background/chrome tokens correctly applied, no dark-on-dark or light-on-light
    failures'
  - Clean, idiomatic D3 code — proper data().join() binding, d3.line()/d3.area() generators
    with explicit font sizes, no unnecessary complexity or fake interactivity
  - 'Thoughtful minimal-chrome touch: removing the y-axis domain line and tick marks
    in favor of horizontal gridlines for a cleaner, less cluttered frame'
  weaknesses:
  - Title (22px) reads at only ~25% of canvas width, under-using the available visual
    hierarchy for a shorter mandated title — consider bumping to ~24-26px or bold
    weight for stronger anchoring
  - Y-domain uses max+2 padding, leaving a mostly-empty top gridline band (12 to 14)
    that no data reaches — tighten the domain padding to reduce wasted vertical whitespace
  - No visual emphasis on the peak staffing period (14:00, 12 agents) — a light annotation
    or callout would elevate data storytelling beyond 'displays without interpretation'
  - Markers (r=7 CSS) are adequate but could be marginally larger/more prominent given
    only 7 real change-point values, to serve as stronger focal points for the step
    narrative
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "line-stepwise · javascript · d3 · anyplot.ai" in bold dark ink, clearly visible; "Hour of Day" and "Active Support Agents" axis labels in dark ink, clearly readable; tick labels (0:00-24:00, 0-14) in medium-gray ink, legible; subtle light-gray horizontal gridlines only (no vertical gridlines, no y-axis spine/ticks, x-axis has a thin domain line).
      Data: Step line in brand green (#009E73) with curveStepAfter creating clean horizontal-then-vertical transitions; low-alpha green area fill under the line; 7 circle markers (green fill, light-colored stroke halo) at each true value-change vertex.
      Legibility verdict: PASS — all text is clearly readable against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Title, axis labels, and tick labels rendered in light/off-white ink, clearly visible against the dark background; gridlines are subtle light-gray at low opacity, visible but not competing with data.
      Data: Step line and markers use the identical brand green (#009E73) as the light render — confirmed matching hue; area fill under the curve reads as a muted dark-green tint appropriate for the dark surface.
      Legibility verdict: PASS — no dark-on-dark failures; every text element (title, both axis labels, tick labels) is clearly legible against the near-black background.
