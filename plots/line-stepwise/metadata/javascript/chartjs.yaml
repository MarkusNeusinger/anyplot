review:
  strengths:
  - 'Clean, correct step-line rendering: horizontal plateaus and vertical jumps are
    unambiguous in both themes'
  - Theme-adaptive chrome is fully correct — title/axis/tick colors, grid, and background
    all flip properly between light and dark with zero dark-on-dark or light-on-light
    issues
  - Y-axis-only grid (x grid hidden) matches the style guide's grid guidance for line
    charts and keeps the plateau shapes uncluttered
  - Deterministic in-memory data, single canvas mount, animation disabled — mount-node
    contract followed correctly
  - Single-series legend correctly omitted per the decoration-removal checklist
  - suggestedMax headroom above the data max keeps the top step from touching the
    plot ceiling
  weaknesses:
  - 'No markers at the data points (pointRadius: 0) on a sparse 16-point series —
    the style guide''s data-density heuristic calls for prominent markers under 50
    points; small markers at each hourly vertex would make the actual discrete measurement
    points (where the step occurs) legible instead of only the interpolated step shape.'
  - The header comment ('Elevator service requests answered per hour vs. queue depth
    at close') does not describe what is actually plotted (active elevators in service
    by hour) — stale/misleading comment, should be corrected to match the real data
    and axis labels.
  - Design is functionally correct but generic — no visual emphasis (e.g. subtle highlight
    or annotation) drawing attention to the evening peak (5 elevators, 17:00–19:00),
    which is the most notable feature in the data.
  - Title occupies only ~28% of plot width — well under the 50-70% guideline range;
    not a violation given the shorter title (no descriptive prefix), but a slightly
    larger title fontsize would balance the composition better.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "line-stepwise · javascript · chartjs · anyplot.ai" in dark ink, centered, clearly legible. X-axis title "Time of Day" and Y-axis title "Elevators in Service" in dark ink. Tick labels (06:00-20:00, 0-6) in a softer grey, all legible. Horizontal grid lines are faint and only present on the Y-axis; no vertical grid.
      Data: Single brand-green (#009E73) step line, line width ~3.5px, no point markers. The line clearly shows horizontal plateaus (value held constant, e.g. 2 elevators from 06:00-08:00, 4 from 08:00-11:00) connected by sharp vertical jumps at the hour the value changes (e.g. instant jump from 3 to 5 at 17:00). Suggested max of 6 leaves headroom above the data peak of 5.
      Legibility verdict: PASS — no light-on-light text found anywhere.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Title, axis titles, and tick labels correctly flip to light tones (white/light-grey) against the dark background, all clearly legible. Grid lines are faint light lines on the Y-axis only, matching the light render's grid pattern (just inverted contrast).
      Data: Same brand-green (#009E73) step line as the light render — data color is identical between themes, confirming only chrome adapted. Same plateau/jump shape, same suggestedMax headroom.
      Legibility verdict: PASS — no dark-on-dark failures; every text element reads clearly against the near-black surface.
