review:
  strengths:
  - 'Native `curve: "step"` on a LineChart series draws the staircase with only horizontal
    and vertical segments; the 96 quarter-hour samples collapse into five clean plateaus
    with no comb of vertical strokes.'
  - Real, neutral smart-thermostat schedule (62/68/65/72/62 °F) gives jumps up and
    down of different heights and plateaus from 2 to 9 hours, so the data exercises
    the whole plot type.
  - 'Theme handling is complete: page, ink, ink-soft and grid tokens drive the title,
    axis labels, ticks, axis lines and grid, and both renders read cleanly while the
    #009E73 series stays identical.'
  - 'Time axis formatted as HH:MM through the axis `valueFormatter`, with axis bands
    sized explicitly (`height: 64`, `width: 76`) so no tick label is truncated.'
  - The area under the step line uses a vertical gradient defined in an SVG `<defs>`
    child of the chart and targeted through the v9 `.MuiLineChart-area` class, a MUI
    X composition idiom.
  - Animation disabled with `skipAnimation`, the component sized from `window.ANYPLOT_SIZE`,
    and the value formatter adds °F to the HTML tooltips.
  weaknesses:
  - 'VQ-05 (both): the data spans 62–72 °F inside a 55–78 °F y axis, so about a quarter
    of the plot height above the 72 °F plateau stays empty and the staircase uses
    well under half of the vertical space → pad the domain by about 10–15 % of the
    span on each side (roughly 60–74 °F). Likely cause: `Y_MIN = MIN_SETPOINT - 0.7
    * Y_SPAN` and `Y_MAX = PEAK_SETPOINT + 0.6 * Y_SPAN`.'
  - 'Suggestion: `curve: "stepAfter"` would place each jump on the hour the schedule
    changes (06:00, 08:00, 17:00, 22:00) instead of halfway between samples (05:52
    …); mid alignment is allowed by the spec, but post alignment matches how a thermostat
    schedule holds its value.'
  - 'Suggestion: the area fill runs down to a padded floor of 55 °F rather than a
    meaningful baseline, so fill height suggests proportions the setpoints do not
    have (the 72 °F block looks about 2.4 times the 62 °F one); a plain step line,
    or the line without fill, would avoid that reading.'
  - 'Suggestion: the dashed "Peak 72°F" reference line repeats the 72 gridline and
    its label sits at the left edge, far from the evening plateau it describes; dropping
    it would leave the staircase as the only focus.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole canvas.
      Chrome: bold dark title "line-stepwise · javascript · muix · anyplot.ai" top left (~30 % of width); y axis "Setpoint (°F)" with ticks 56–78 every 2; x axis "Time of Day" with HH:MM ticks 00:00–24:00 every 2 h; left and bottom axis lines only; subtle horizontal gridlines; a dashed grey "Peak 72°F" reference line with a small label at the left. All text dark on light and readable.
      Data: one #009E73 step line (3 px) with a green gradient area fill below it; plateaus at 62 (00:00–~05:52), 68 (~05:52–~07:52), 65 (~07:52–~16:52), 72 (~16:52–~21:52), 62 (~21:52–23:45); only horizontal and vertical segments, mid-step alignment. Empty band from ~73 to 78 °F above the peak.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, axis titles and tick labels flip to light ink and are clearly readable; gridlines subtle dark grey; axis lines light; the "Peak 72°F" label light grey, readable. No dark-on-dark text.
      Data: identical #009E73 step line and the same green gradient fill (reads as a darker green over the dark page); same plateaus and jump positions as the light render.
      Legibility verdict: PASS
