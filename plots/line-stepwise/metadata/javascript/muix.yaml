review:
  strengths:
  - 'Native MUI X curve: ''step'' draws the series purely as horizontal and vertical
    segments with one consistent (mid) alignment, so every plateau reads as a single
    flat line at its exact setpoint'
  - 'Realistic smart-thermostat schedule logged every 15 minutes: jumps of different
    height in both directions and plateaus from 2 h to 9 h'
  - Time axis formatted as HH:MM via valueFormatter on a whole-day 00:00–24:00 domain
    with two-hour ticks
  - Axis bands sized explicitly (x height 64, y width 76) so no v9 tick truncation;
    chrome fully token-driven and readable in both themes
  - Library-native tooltip with formatted °F values in the HTML output
  weaknesses:
  - 'CQ-01 (code): a named `formatHour` function and an IIFE data builder sit outside
    the component, against the Imports → Data → Plot structure → inline the hour formatting
    as an arrow in the axis valueFormatter and build the rows with a flat loop or
    `flatMap` at module level. Likely cause: helper-function style for the data and
    formatter.'
  - 'Suggestion: drop the dashed ''Peak 72°F'' reference line; it repeats what the
    y axis and the plateau already show.'
  - 'Suggestion: tighten the y headroom above the peak (the 72–78 band is empty) so
    the staircase fills more of the plot height.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole canvas.
      Chrome: bold dark title "line-stepwise · javascript · muix · anyplot.ai" top-left; y title "Setpoint (°F)" (ticks 56–78 every 2), x title "Time of Day" (ticks 00:00–24:00 every 2 h); subtle horizontal grid; L-shaped axis lines; dashed reference line at 72 labelled "Peak 72°F". All readable.
      Data: single #009E73 step line (3 px) with a translucent green gradient fill: 62 until ~06:00, 68 until ~08:00, 65 until ~17:00, 72 until ~22:00, 62 to 23:45. Only horizontal/vertical segments, jumps halfway between samples (mid alignment).
      Legibility verdict: PASS

