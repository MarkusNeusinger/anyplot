review:
  strengths:
  - 'Directly resolved all three prior-review weaknesses: added markers at each discrete
    step-change point (reinforcing the spec''s "discrete changes rather than interpolated
    values" emphasis), added a low-opacity area fill under the step line for visual
    hierarchy, and added a data label calling out the peak instance count'
  - 'Correct, idiomatic use of Highcharts'' area.step: "right" option for the step
    interpolation, with the alignment choice tied directly to the domain narrative
    (autoscaler resize takes effect exactly at the hour)'
  - 'Both light and dark renders are theme-correct: warm off-white / near-black backgrounds,
    all chrome (title, axis titles, ticks, peak data label) legible in both themes,
    and the brand green (#009E73) is identical across themes'
  - Plausible, well-scaled synthetic data (autoscaling cluster instance count sampled
    3x/hour across 24h, 72 points) forming a clear, readable diurnal bell-curve with
    genuine plateaus (discrete-change persistence) and a labeled peak
  - Clean, deterministic, KISS code — hardcoded data array built with a simple loop,
    no unused imports, correct animation:false / credits:false / mount-node usage
    per the harness contract
  weaknesses:
  - Design is solid but still reads as a well-configured default plus a few embellishments
    rather than a fully custom composition — e.g. the grid remains plain horizontal-only
    and there is no additional typographic or spine refinement beyond the theme baseline
  - Only one data point (the peak) carries a data label; a light annotation calling
    out the trough or the two flat overnight plateaus could reinforce the step-persistence
    story further, though this is a minor polish opportunity, not a defect
  - The per-point marker/dataLabel/step-area combination, while idiomatic, is not
    a feature that is meaningfully unique to Highcharts — the same visual result is
    achievable with comparable effort in most charting libraries
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "line-stepwise · javascript · highcharts · anyplot.ai" in bold dark ink, centered top. X-axis title "Hour of Day" and y-axis title "Active Server Instances" in muted dark-gray ink, both legible. Tick labels (0-24 on x, 0-18 on y) in the same muted tone, clearly readable. Subtle light-gray horizontal gridlines at each y-tick; no vertical gridlines (a deliberate minimal choice). A bold dark "Peak: 14 instances" data label sits above the peak marker with clear whitespace around it.
      Data: Single step-area series in brand green (#009E73): a 2.5px step line (step="right") with a light ~12%-opacity green fill beneath it, plus small green-filled circular markers at each discrete step-change point. Line/fill forms a clean bell-shaped step pattern rising from 2-3 instances overnight to a peak of 14 around midday, then stepping back down — sharp horizontal-then-vertical corners with no smoothing.
      Legibility verdict: PASS — all text (title, axis titles, ticks, peak label) is clearly readable against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Same title now in white/light ink, clearly visible. Axis titles and tick labels rendered in a light muted gray, fully legible against the dark background. Gridlines are a subtle lighter gray, visible but not dominant. The "Peak: 14 instances" data label renders in light/white ink, clearly legible with no dark-on-dark issue.
      Data: Same green (#009E73) step line, fill, and markers, identical shape and values to the light render — only the chrome (background, text, grid) flipped, confirming color consistency between themes.
      Legibility verdict: PASS — no dark-on-dark failures; all title/axis/tick/label text is clearly visible against the near-black background.
