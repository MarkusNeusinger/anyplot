review:
  strengths:
  - 'Theme-correct chrome in both renders: warm off-white/near-black backgrounds,
    ink/inkSoft text tokens threaded through title, axis names, and tick labels —
    no legibility failures in either theme.'
  - 'Idiomatic step semantics: `step: "end"` produces the required horizontal-then-vertical
    transitions, with a marker at every setpoint change reinforcing the discrete-jump
    reading the spec asks for.'
  - 'Realistic, neutral data: an 8-day smart-thermostat setpoint schedule is a textbook
    piecewise-constant signal, fully deterministic (hard-coded schedule, no RNG) and
    easy to regenerate identically.'
  - Clean, minimal-chrome axis styling — y-axis line hidden, x-axis split lines hidden,
    subtle horizontal grid only — keeps focus on the step data.
  - Data colors identical between light/dark renders (Imprint green `#009E73` for
    line, markers, and area fill); only chrome flips as required.
  weaknesses:
  - No distinctive ECharts features beyond the basics — no dataZoom, markLine/markPoint
    for the 22°C peak setpoint, or a custom tooltip formatter showing day/hour context;
    the tooltip stays as generic axis-trigger default.
  - 'Design excellence is close to generic defaults: aside from the area fill, there
    is little intentional visual hierarchy (e.g., no emphasis on the daily peak segments
    or callout for the schedule pattern).'
  - With 56 data points across 8 days, the 8px circle markers at every vertex (including
    both ends of each horizontal hold) add some visual clutter at the step corners
    — could drop to smaller markers or markers only at value-change points.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "line-stepwise · javascript · echarts · anyplot.ai" centered at top in dark ink, clearly legible. Y-axis title "Target Temperature (°C)" and x-axis title "Time (days)" in the same dark ink, both readable. Tick labels ("16°C"–"24°C", "Day 1"–"Day 9") in a slightly softer gray-ink, still clearly legible against the light background. Subtle horizontal gridlines at each 2°C increment; no vertical gridlines. Y-axis line hidden (minimal chrome), x-axis baseline visible.
      Data: Single teal-green (#009E73) step line with circular markers at every setpoint change, plus a light green area fill (alpha ~0.12) under the curve. The stepwise pattern is unambiguous — flat holds at 18°C/19°C/20°C/21°C/22°C connected by vertical jumps, repeating across 8 daily cycles.
      Legibility verdict: PASS — all text is clearly readable against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Title and axis titles render in light/off-white ink, clearly legible against the dark background. Tick labels use a softer light-gray tone, still clearly distinguishable from the background — no dark-on-dark failures observed. Gridlines remain subtle but visible as thin light-gray horizontal lines.
      Data: Same teal-green (#009E73) line, markers, and area fill as the light render — data colors are identical between themes, confirming only chrome (background/text/grid) flipped. The green reads with strong contrast against the dark background.
      Legibility verdict: PASS — all text is clearly readable against the dark background, no dark-on-dark issues found.
