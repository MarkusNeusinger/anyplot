review:
  strengths:
  - Ridgeline built as the maximum of asymmetric tent functions (lines 82-88) gives
    sharp triangular apexes with linear flanks and deep saddles, so each of the 16
    summits is individually recognizable, never bell-shaped bumps
  - 'Every apex sits exactly at its listed angle and elevation: the jitter is damped
    within 3° of each summit and the summit sample is restored afterwards (lines 91-102)'
  - Three-level label staggering (4640/4870/5100 m, Matterhorn at 5250 m) keeps all
    16 two-line name/elevation labels collision-free even in the dense Rimpfischhorn–Monte
    Rosa cluster
  - Theme chrome consolidated into one Makie Theme object applied via with_theme,
    and a layout-row Label subtitle with rowgap! — idiomatic Makie layout
  - 'Both themes fully theme-correct: off-white/near-black page, theme-adapted sky
    and silhouette colors, brand-green summit markers identical in both renders'
  weaknesses:
  - 'SC-02 (both): the Matterhorn, the anchor summit, does not read as the focal point
    — it is drawn with the same symmetric tent shape and fill as its neighbours and
    is lower than Dom, Täschhorn, Liskamm and Monte Rosa beside it; only a 14 px vs
    8 px marker and a higher label set it apart → give the anchor summit visual prominence
    the eye lands on first (e.g. its characteristic steep asymmetric horn profile
    with a much steeper flank and a deeper saddle on both sides, or a stronger marker/label
    weight). Likely cause: PEAKS entry (88.0, 4478.0, "Matterhorn", 8.0, 6.5) and
    ms = 14 being the only emphasis.'
  - 'VQ-01 (both): the 16 peak labels and the tick labels are set at fontsize 12 (24
    px on the 3200 px canvas) and blur to unreadability at the 400 px thumbnail, though
    the peak names are the chart''s primary information → about 14–15 for the peak
    labels (+2 to +3). Likely cause: text!(...; fontsize = 12) and xticklabelsize/yticklabelsize
    = 12.'
  - 'DQ-02 (both): the x axis is titled "Bearing (°)" and the subtitle names a Gornergrat
    vantage, but the bearings are invented — the Matterhorn sits at 88° (east) whereas
    from Gornergrat it lies to the west-southwest, and Breithorn is placed between
    Strahlhorn and Castor instead of next to the Matterhorn → either use plausible
    bearings and order from that vantage (Monte Rosa/Liskamm east, Breithorn/Matterhorn
    west, Mischabel north) or relabel the axis as a generic horizontal position. Likely
    cause: the angle_deg column of PEAKS.'
  - 'Suggestion: the uniform ±15 m white-noise jitter reads as a fine saw-tooth fuzz
    on every flank; a coarser midpoint-displacement pass (as the code comment claims)
    would give fewer, larger rocky notches.'
  - 'Suggestion: an optional lighter background ridge fading toward the sky would
    add the photographic depth the Notes allow.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white page (#FAF8F1) around a light sky-blue (#B8D8EF) axis panel that serves as the sky.
      Chrome: bold title "Wallis Peaks Panorama · area-mountain-panorama · julia · makie · anyplot.ai" (~40% width), small grey subtitle above it ("Swiss Alps · Wallis Region · Gornergrat Vantage · 3100 m"), y axis "Elevation (m)" 2500–5000, x axis "Bearing (°)" 0–180; left/bottom spines only, no grid. All text dark and readable.
      Data: a near-black (#262623) filled silhouette of 16 sharp triangular summits plus three unnamed sub-peaks, serrated flanks, deep saddles (lowest ~2790 m at 95°). Brand-green #009E73 dot on each named apex (Matterhorn larger with page-colored outline), thin grey leader lines up to two-line labels (name / "NNNN m") staggered at three heights, Matterhorn's label highest. No label collisions.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
