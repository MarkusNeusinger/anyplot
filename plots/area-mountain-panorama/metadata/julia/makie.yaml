review:
  strengths:
  - The ridgeline is the maximum over asymmetric tent functions with damped random
    jitter. That gives sharp triangular apexes, linear flanks of different steepness
    and small rocky notches, never bell-shaped bumps.
  - 'All 16 listed Wallis summits sit exactly at their elevations: the summit sample
    is reset after the jitter. Each has a thin leader line and a name-over-elevation
    label on three staggered levels, and no label collides with another or with a
    leader.'
  - 'The Matterhorn reads as the focal point: a larger outlined marker, a brand-green
    leader and a bold 18 pt label. It is also the narrowest horn, isolated by deep
    notches, with a Hörnli shoulder on its right flank.'
  - A composite Makie Theme applied with with_theme carries all the theme-adaptive
    chrome. A Label in its own GridLayout row adds the subtitle above the axis.
  - The x axis is labelled as a clockwise compass sweep from Gornergrat (SE → S →
    W → N → E) with the ticks hidden, as the Notes allow. The subtitle states that
    the horizontal spacing is schematic.
  weaknesses:
  - 'SC-02 (dark): the silhouette is filled in mid slate #5A6E8C, which is lighter
    than the night sky #0D1825, so the mountains read as a light shape on a dark sky
    instead of the dark solid silhouette the characteristic bullet asks for → keep
    the fill dark (near-black, for example #0B0F14) and lift the sky instead (for
    example a dusk navy around #2A3D5C) so the silhouette still stands out by at least
    3:1. Likely cause: the dark-theme branches of the MTN_FILL and SKY_BG constants.'
  - 'Suggestion: the tent floor at BASELINE leaves short perfectly flat stretches
    at 2780 m (left of the Matterhorn and at the left edge); a little jitter or a
    slightly raised valley floor there would keep the whole outline rocky.'
  - 'Suggestion: move the peak data into the library prompt''s Data block (column
    constants plus a DataFrame) and derive xlims and ylims from it, so a user can
    swap in their own panorama.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 figure surface; the axis panel carries a light-blue sky (#B8D8EF), as the spec's optional sky background allows.
      Chrome: the bold title "Wallis Peaks Panorama · area-mountain-panorama · julia · makie · anyplot.ai" fills about 40 % of the width, with a small grey subtitle above it. The y axis "Elevation (m)" has ticks from 2500 to 5000. The x label reads "Clockwise sweep from Gornergrat: SE → S → W → N → E" with the x ticks hidden. Only the left and bottom spines are drawn, with no grid. All text is dark and readable.
      Data: a near-black (#262623) jagged silhouette of 16 triangular summits plus unnamed sub-peaks fills the area from the ridgeline down. Brand-green #009E73 summit dots sit at each apex, with thin grey leader lines up to labels (name / "NNNN m") on three staggered heights. The Matterhorn has a larger outlined dot, a green leader and a bold, larger label.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17 figure surface; the axis panel has a deep navy night sky (#0D1825).
      Chrome: the title, subtitle, axis title, tick labels and peak labels are all light (#F0EFE8 / #B8B7B0) and readable. There is no dark-on-dark text.
      Data: the same ridgeline is filled in mid slate #5A6E8C, which is lighter than the sky, so the silhouette reads as a light shape. The green summit dots and the Matterhorn leader are identical to the light render; the other leaders flip to light grey.
      Legibility verdict: PASS
