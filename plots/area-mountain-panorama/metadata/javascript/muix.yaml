      Background: Warm off-white (#FAF8F1-consistent), not pure white.
      Chrome: Title "Wallis Panorama · area-mountain-panorama · javascript · muix · anyplot.ai" in bold dark ink, clearly legible. Rotated "Elevation (m)" y-axis label on the left in dark ink, legible. Dark gray y-axis tick labels (2,500-5,500 in 500m steps) legible. Subtle dashed horizontal gridlines. 16 peak labels (bold name + lighter elevation line below) in dark ink with thin gray leader lines down to each summit apex — all legible, no overlaps observed even in the densely-spaced peak clusters (Alphubel/Allalinhorn/Rimpfischhorn/Strahlhorn and Pollux/Castor/Liskamm/Monte Rosa). Footer caption "Wallis Alps, Switzerland · view toward the Matterhorn from the Gornergrat ridge" in muted gray, legible.
      Data: Foreground ridge fill is solid brand green (first series = #009E73 as required), with a lighter gray "haze" ridge layered behind it (background sub-summits, offset ~4° east) for depth. Small green apex dots mark each labeled summit.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17-consistent), not pure black.
      Chrome: Title, axis label, tick labels and all 16 peak labels render in white/light-gray ink — clearly legible against the dark background, no dark-on-dark text found anywhere. Leader lines and gridlines are subtle light-gray, visible but not competing with data. Footer caption legible in muted light gray.
      Data: Foreground ridge is the identical brand green (#009E73) as the light render; the haze ridge is the identical gray tone, confirming data colors are unchanged between themes — only chrome (background, text, grid) flipped, as required.
      Legibility verdict: PASS
