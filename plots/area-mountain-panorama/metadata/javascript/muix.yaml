review:
  strengths:
  - The ridgeline is built from per-summit control points (col, apex, col) with varied
    flank widths and saddle drops, then roughened by span-scaled midpoint displacement,
    so apexes stay sharp and exactly at each peak's bearing and elevation while saddles
    pick up notches — a piecewise-linear alpine silhouette, not bell curves
  - 'Summit labels sit on computed shelves: the shelf count grows until labels sharing
    a shelf clear each other by 16 px, giving two clean staggered rows for 16 peaks
    with no text collisions and thin leader lines dropping to each apex dot'
  - Matterhorn anchor is set apart through label weight (17 px / 800), a thicker ink
    leader line and a larger ringed apex marker, readable as the focal summit in both
    themes
  - Custom SVG overlay composed as a LineChart child via MUI X hooks (useXScale, useYScale,
    useDrawingArea), plus per-series sx selectors (data-series) that keep the silhouette
    fill solid and drop the haze outline — idiomatic MUI X composition
  - Y ticks and grid stop at the highest summit so the label sky stays clean, and
    grid lines run behind the silhouette; both themes thread ink/inkSoft/grid tokens
    correctly
  - 'Optional layered depth: a lower, offset background ridge in translucent inkSoft
    rises behind the front ridge''s saddles'
  - Seeded mulberry32 makes the procedural skyline fully deterministic; all 16 elevations
    match the spec's example list
  weaknesses:
  - 'Suggestion: the dark-theme silhouette (#009E73 darkened to 32 %) sits close to
    the #1A1A17 page and relies on the green outline to separate; a slightly lighter
    shade would make the filled mass stand out on its own.'
  - 'Suggestion: the summits follow the spec''s listing order rather than their real
    bearing sweep from Gornergrat (Dom/Täschhorn north, Breithorn–Liskamm south, Matterhorn
    southwest); ordering them geographically would make the panorama usable for summit
    identification.'
  - 'Suggestion: the skyline drops to the 2,650 m valley floor at both edges, leaving
    the lower half of the plot as solid fill; tapering less would let the ridgeline
    fill more of the upper portion.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, no pure white.
      Chrome: title "area-mountain-panorama · javascript · muix · anyplot.ai" bold dark ink top-left (~39 % width), subtitle "16 named summits · 148° field of view · highest: Monte Rosa, 4,634 m" in inkSoft; y-axis "Elevation (m)" with ticks 2,600–4,600 every 200 m in readable dark grey; x axis hidden (permitted); subtle horizontal grid visible in the sky only. All text readable.
      Data: deep dark-green solid silhouette outlined by a 2.5 px brand-green #009E73 ridge line; jagged piecewise-linear skyline with sharp apexes, asymmetric flanks and notched saddles; light grey translucent background ridge behind the saddles; 16 green apex dots with thin grey leader lines up to two staggered label shelves (bold name above, elevation in m below); Matterhorn has a larger ringed dot, thicker dark leader and larger bold label. No label overlaps.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17, not pure black.
      Chrome: title, subtitle, axis label and tick labels in light ink / light inkSoft, all clearly readable; no dark-on-dark text; grid subtle but visible above the ridge.
      Data: identical colors — same dark-green silhouette and #009E73 ridge line and apex dots; background ridge appears as a mid-grey translucent layer; Matterhorn leader line flips to light ink. Silhouette fill is close to the page tone but the bright green outline separates it clearly.
      Legibility verdict: PASS
