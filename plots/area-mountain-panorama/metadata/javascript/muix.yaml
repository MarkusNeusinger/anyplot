review:
  strengths:
  - 'Ridgeline built from per-summit control points (asymmetric flank widths, varied
    col depths) roughened by seeded midpoint displacement: sharp triangular apexes,
    deep saddles and small notches read as alpine rock, never as bell bumps'
  - All 16 Wallis summits sit exactly at their listed elevations with a dot at the
    apex and a thin leader line to a two-line name/elevation label
  - Label shelf count is computed from estimated label widths so the staggered labels
    never collide; ticks and grid stop at the highest summit to keep the label sky
    clean
  - Matterhorn reads as the anchor through a larger ink-outlined apex marker, a heavier
    leader line and a bolder, larger label
  - 'Idiomatic MUI X composition: area series with baseline ''min'', a custom SVG
    overlay via useXScale/useYScale/useDrawingArea inside LineChart, and data-series
    sx selectors to drop MUI''s area brightening filter'
  - Theme tokens threaded through every element; both renders fully legible with identical
    data colors
  weaknesses:
  - 'SC-02 (both): the silhouette below the front ridgeline is filled in the bright
    brand green #009E73, not the dark solid color the Notes and the second ''A good
    version shows:'' bullet ask for, so it reads as a green area chart rather than
    a dusk silhouette → a dark solid fill (e.g. the ink token or a deep shade) with
    the lighter haze ridge behind it. Likely cause: the ridge series color t.palette[0]
    with fillOpacity 1.'
  - 'VQ-05 (both): LABEL_HEADROOM_SHARE = 0.5 reserves half the elevation span above
    the highest summit, leaving roughly 250-300 px of empty sky between the lower
    label shelf and the summits, so the panorama sits in the lower 60 % of the canvas
    → about 0.25-0.3 of the span (−0.2), enough for the two shelves. Likely cause:
    LABEL_HEADROOM_SHARE.'
  - 'Suggestion: an optional dusk sky gradient behind the silhouette would add the
    photographic mood the Notes allow.'
  - 'Suggestion: compass bearings (W, SW, S …) along the x axis would help orientation;
    the Notes leave them optional.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, not pure white.
      Chrome: title "area-mountain-panorama · javascript · muix · anyplot.ai" bold dark ink top-left with subtitle "16 named summits · 148° field of view · highest: Monte Rosa, 4,634 m"; y axis "Elevation (m)" with ticks 2,750–4,500 in steps of 250, subtle horizontal grid stopping at 4,500; x axis hidden. All text readable.
      Data: front ridge filled solid brand green #009E73 from the valley floor to a jagged skyline of 16 triangular summits with deep cols and notches; a lighter translucent grey background ridge peeks out behind the saddles. Each summit carries a small green apex dot and a thin grey leader up to a two-line label (bold name, elevation in m) on two staggered shelves at the top; Matterhorn has a larger ink-outlined dot, heavier black leader and larger bold label. A wide empty sky band separates the label shelves from the summits.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17, not pure black.
      Chrome: title, subtitle, labels and ticks in light ink; grid subtle; no dark-on-dark text.
      Data: identical green #009E73 silhouette and apex dots; the haze ridge renders as a muted dark grey behind the saddles; leaders light grey, Matterhorn leader white with a white-outlined dot.
      Legibility verdict: PASS
