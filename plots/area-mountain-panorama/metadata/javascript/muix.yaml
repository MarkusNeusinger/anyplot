review:
  strengths:
  - Procedural fractal terrain (midpoint-displacement roughening) produces genuinely
    jagged, angular ridgelines with per-peak slope asymmetry, matching the spec's
    explicit ban on Gaussian bell-curve summits
  - Deterministic seeded PRNG (mulberry32, fixed seeds) gives full reproducibility
    despite the browser having no native seeded RNG
  - Optional layered-depth haze ridge (hazier background sub-summits, angularly offset)
    implements the spec's classic Zermatt-panorama depth cue
  - Peak labels correctly follow the 'name on top / elevation below' format with a
    4-tier round-robin vertical stagger that avoids collisions across all 16 closely-spaced
    summits, plus thin leader lines to each apex
  - 'Clean theme handling: brand-green-first palette rule respected, theme-adaptive
    ink/inkSoft/muted tokens threaded through title, ticks, leader lines and footer,
    correct warm off-white / near-black backgrounds in both renders'
  - Y-axis lower bound (2500 m) matches the spec's own suggested example, keeping
    the ridge in the upper portion of the plot
  weaknesses:
  - The Matterhorn (the panorama's stated anchor/focal summit) is not visually distinguished
    from the other 15 peaks — same color, similar width, not the tallest, not centered
    — so the spec's 'should read as visually prominent, the focal point of the composition'
    requirement is unmet. Consider a distinct highlight color/stroke, extra height
    emphasis, or centering it in the composition.
  - Saddle/col elevations between many adjacent summits drop very close to the 2650
    m valley-floor baseline (prominenceRange up to 1450 m), producing an unrealistic
    'witch's-hat' forest of isolated spikes rather than a connected alpine ridge —
    real Wallis 4000m cols between neighboring summits sit far higher (~3400-3900
    m). Reduce the max prominence so cols stay elevated for a more geologically plausible
    connected-ridge read.
  - The spec asks to fill the silhouette with 'a dark solid color (photo-like silhouette,
    evening/dusk feel)'; the implementation correctly uses the mandatory Imprint brand
    green instead (palette compliance is a hard rule), but as a result the panorama
    reads as a bright data chart rather than a photographic dusk silhouette.
  - No legend distinguishes the green foreground ridge from the gray background haze
    ridge — a first-time viewer must infer the gray shape is a receding background
    layer.
  image_description: |-
