review:
  strengths:
  - Genuinely jagged, fractal ridge terrain (midpoint-displacement roughening over
    per-summit control points) with asymmetric flanks and varied prominence — matches
    the spec's explicit 'not a bell curve' requirement precisely.
  - All 16 named Wallis peaks from the spec's example are present with accurate real-world
    elevations (Matterhorn 4478 m, Monte Rosa 4634 m, etc.).
  - 'Strong focal-point storytelling: the Matterhorn is highlighted with a soft brand-green
    radial glow, a bolder/larger label, and a thicker leader line and marker, so it
    immediately reads as the panorama''s anchor summit.'
  - 'Layered depth cue: a lighter, hazier background ridge (theme-adaptive ''muted''
    anchor) sits behind the foreground ridge, echoing the classic panorama-photo depth
    effect called out in the spec notes.'
  - 16 peak labels are cleanly staggered across 4 shelves with leader lines and show
    zero overlap despite dense clustering.
  - 'Theme-correct chrome in both renders: readable title/labels/ticks, correct Imprint
    palette (first series #009E73), correct #FAF8F1 / #1A1A17 backgrounds, identical
    data colors across themes.'
  - Deterministic seeded PRNG (mulberry32) gives full reproducibility without a network/CDN
    dependency.
  weaknesses:
  - Peak apex marker dots are quite small relative to the 3200x1800 canvas — could
    be enlarged slightly (especially the non-focal 6px dots) for stronger element
    visibility.
  - No legend or caption clarifies what the lighter background ridge represents; a
    first-time viewer may read it as stray data rather than an intentional depth layer.
  - The implementation departs from a simple imports->data->plot->save structure (PRNG,
    control-point construction, midpoint-displacement roughening, manual pixel-space
    label overlay) — well justified by the fractal-terrain requirement, but worth
    noting against the KISS structure criterion.
  - Title fontsize sits toward the lower end of the expected width band for the long
    mandated title (~45% of canvas width vs. the typical 70-85%) — still fully legible,
    just more conservative than necessary.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white, not dark.
      Chrome: Title "Wallis Panorama · area-mountain-panorama · javascript · muix · anyplot.ai" in bold dark ink at top-left; rotated "Elevation (m)" y-axis label at far left; dark-ink y-axis tick labels (2,500-5,500 m, 500 m steps); subtle dashed horizontal gridlines; small italic-gray caption "Wallis Alps, Switzerland · view toward the Matterhorn from the Gornergrat ridge" centered at the bottom. All chrome text is clearly legible against the light background.
      Data: Foreground ridge filled solid brand green (#009E73) with a jagged, angular silhouette of 16 named summits (Weisshorn through Monte Rosa), each with a thin leader line up to a two-line label (name + elevation in meters). A lighter gray-green haze ridge sits behind the main ridge as a background depth layer. The Matterhorn (the stated anchor peak) gets a soft green radial glow, a larger/bolder label, and a thicker leader line and marker, making it the clear visual focal point.
      Legibility verdict: PASS — all text (title, axis labels, tick labels, peak labels, caption) is dark-on-light and fully readable; no overlaps observed among the 16 peak labels.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black, not light.
      Chrome: Same title, axis label, tick labels, gridlines and caption as the light render, all re-rendered in light ink (near-white) tones. Gridlines remain subtle dashed lines.
      Data: Ridge fill is the identical brand green (#009E73) as the light render; the haze ridge uses the theme-adaptive lighter "muted" gray tone appropriate for dark mode. The Matterhorn's glow, bold label, and thicker leader line/marker are preserved identically as the focal-point treatment.
      Legibility verdict: PASS — title, axis labels, tick labels, peak labels and caption are all light-on-dark and clearly readable; no dark-on-dark text found anywhere in the render.
