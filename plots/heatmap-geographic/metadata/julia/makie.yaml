review:
  strengths:
  - Correct Imprint sequential colormap (brand green → blue) for single-polarity density
    data, matching the spec's KDE/intensity requirement
  - Imprint data colors are identical between light and dark renders; chrome (background,
    text, ticks) is fully theme-adaptive with no dark-on-dark or light-on-light failures
  - DataAspect() keeps the lon/lat grid proportionally correct and the saved PNG lands
    exactly on the 2400×2400 square canvas target
  - Reproducible, severity-weighted Gaussian KDE built from a seeded 5-cluster synthetic
    wildfire dataset, with explicit font sizes and a title that dynamically scales
    down for the long descriptive-prefixed string
  - Raw ignition points are revealed via a background-colored, low-alpha scatter overlay
    on top of the density surface — a subtle, non-competing way to show underlying
    point data without cluttering the heatmap
  weaknesses:
  - 'Missing geographic context: the spec explicitly asks for ''country boundaries,
    coastlines, or street maps as a basemap'', but the plot is a bare lon/lat Cartesian
    heatmap with no visual cue that grounds it geographically beyond axis labels and
    the title. Add a simplified western-US / state-outline via lines!() with a small
    set of hardcoded boundary coordinates (no GeoMakie/NetworkLayout needed).'
  - The spec asks for the sequential colormap to be applied 'with transparency to
    allow the basemap to show through' — heatmap! has no alpha, and since there is
    currently no basemap this instruction is entirely unaddressed. Once a boundary
    outline is added, give heatmap! an alpha (e.g. ~0.85) so the outline remains visible
    underneath.
  - The KDE surface is computed via a manual triple-nested loop (grid_n×grid_n×n_points
    ≈ 15M inner iterations) rather than a vectorized/broadcast approach — correct
    and fast enough in Julia, but less idiomatic/elegant than a broadcasted distance
    computation.
  - Raw ignition scatter uses a small markersize=3, which risks becoming nearly invisible
    once the PNG is scaled down to mobile width (~400px); consider bumping slightly
    for better visibility at small sizes.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (~#FAF8F1) visible in the margins around the axes; matches the spec target.
      Chrome: Title "Wildfire Ignition Density, Western US · heatmap-geographic · julia · makie · anyplot.ai" in bold dark ink, clearly readable and comfortably within canvas bounds (no clipping). X-axis label "Longitude (°)" and Y-axis label "Latitude (°)" in dark ink, tick labels in a softer gray-ink tone. Colorbar label "Weighted ignition density" and its tick labels (5, 10, 15) are readable on the right edge with adequate margin. No grid lines (intentionally disabled). Top/right spines removed.
      Data: The full plot area is filled by a sequential green-to-blue KDE surface (brand green #009E73 at low density, blue #4467A3 at high density) covering five wildfire clusters at varying intensity (Pacific Northwest, Northern California, Southern California, Utah/Colorado border, Arizona/New Mexico). Small pale dots (raw ignition points, background-colored at low alpha) are visible within the denser blue clusters.
      Legibility verdict: PASS — all text is clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black (~#1A1A17) visible in the margins; matches the spec target.
      Chrome: Same title, axis labels, and colorbar label now rendered in light ink (near-white for primary text, light gray for tick labels/colorbar ticks), fully legible against the dark background. Spines and grid follow the same theme-adaptive treatment as the light render.
      Data: The green-to-blue KDE surface and cluster locations are visually identical to the light render — same hues, same positions, same relative intensities. The raw-point overlay dots are now dark (background-colored at low alpha against the black page), still visible as small dark speckles within the blue cluster cores.
      Legibility verdict: PASS — no dark-on-dark failures; all text and data remain clearly distinguishable from the near-black surface.
