review:
  strengths:
  - Continuous KDE surface via MASS::kde2d rendered with geom_raster(interpolate =
    TRUE), hot spots at the four storm regions
  - Theme tokens applied to all chrome; axis and legend text legible in both renders
  - Degree-formatted tick labels (105°W, 25°N) give the axes their unit
  weaknesses:
  - 'AR-09, VQ-01, VQ-05, SC-04 (both): the title is cut at the right canvas edge
    after ''anyplot'' — the ''.ai'' pixels are missing → the whole title inside the
    canvas (about −6 pt). Likely cause: plot.title size = 22 on the long mandated
    title.'
  - 'VQ-07 (both): the density uses inferno, a forbidden colormap → imprint_seq, scale_fill_gradient(low
    = "#009E73", high = "#4467A3"). Likely cause: scale_fill_viridis_c(option = "inferno").'
  - 'VQ-05, CQ-05 (both): the canvas is 4800x2700 instead of 3200x1800 → width = 8,
    height = 4.5, dpi = 400. Likely cause: ggsave(width = 16, height = 9, dpi = 300).'
  - 'SC-02 (both): the raster is an opaque block with no transparency, and no basemap
    (coastlines, borders) appears, so nothing locates the hot spots (C2, C4) → semi-transparent
    layer over drawn boundaries. Likely cause: no alpha on geom_raster, and the maps
    block skipped because the package is missing in CI.'
  - 'VQ-01 (light): the region labels ''Tornado Alley'', ''Gulf Coast'', ''Florida''
    are grey on the near-black raster and barely readable → readable contrast in both
    themes. Likely cause: annotation text in INK_SOFT on the inferno low end.'
  - 'DQ-01 (both): the narrow bandwidth breaks the Plains cluster into many small
    lumps (C5) → roughly double h (about c(5, 4)) or MASS::bandwidth.nrd. Likely cause:
    h = c(2.5, 2.0) in kde2d.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white consistent with #FAF8F1 around the map; the density raster itself is an opaque near-black block covering most of the panel.
      Chrome: title 'Convective Storm Event Density · heatmap-geographic · r · ggplot2 · anyplot.ai' in dark ink, cut at the right canvas edge after 'anyplot' (pixels of '.ai' missing). Axis titles 'Longitude'/'Latitude' dark; ticks 105°W…65°W and 25°N…50°N readable. Legend box with 'Storm Density', 0.0025–0.0100. Region labels 'Tornado Alley', 'Gulf Coast', 'Florida' in faint grey italic on the black raster, hard to read.
      Data: inferno colormap (black -> purple -> orange -> pale yellow), hot spots at Gulf Coast, Florida, Appalachians and a lumpy Plains cloud; low-density tail cut to transparent at a hard, jagged outline. No basemap visible. Canvas 4800x2700.
      Legibility verdict: FAIL (title clipped at the canvas edge; region labels faint on the raster)

    Dark render (plot-dark.png):
      Background: warm near-black consistent with #1A1A17.
      Chrome: title in light ink, clipped at the right edge as in light; axis titles, ticks and legend text light and readable; region labels light italic, readable.
      Data: same inferno colours as light; the black raster is barely distinguishable from the page, its jagged outline faintly visible. No basemap.
      Legibility verdict: FAIL (title clipped at the canvas edge)
