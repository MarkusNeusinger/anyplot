review:
  strengths:
  - Correctly navigates the missing core-bundle heatmap/colorAxis module by hand-computing
    a Gaussian KDE surface and mapping density to a per-cell imprint_seq RGBA color
    with alpha scaling — a legitimate, well-documented workaround rather than a hack.
  - 'Strong data storytelling: hotspot labels (''Transit Station Plaza'', ''Mall Food
    Court'', ''Boutique Row'', ''Farmers Market Square'') are drawn directly above
    each density blob via chart.renderer, letting the viewer immediately read which
    zones matter without relying on the tooltip.'
  - Deterministic, seeded LCG-based data generation keeps the KDE surface reproducible
    across runs.
  - Hand-built gradient color-scale legend with Low/High labels substitutes cleanly
    for a native colorAxis legend, matching the spec's 'include a colorbar legend'
    requirement.
  - Data colors are pixel-identical between light and dark renders; only chrome (background,
    text, grid) flips, exactly per the theme-adaptive chrome rules.
  - Plot/x/y coordinate system is derived from real km-per-degree conversion at the
    district's latitude so the KDE grid cells stay square (not stretched) on screen
    — a subtle correctness detail most implementations would skip.
  - Realistic, neutral, privacy-conscious data framing ('anonymized, opted-in foot-traffic
    pings') appropriate for a geographic density use case.
  weaknesses:
  - 'Geographic basemap context is minimal: just 5 vertical + 3 horizontal evenly-spaced
    dashed lines on a tinted block background. The spec asks for ''country boundaries,
    coastlines, or street maps as a basemap'' — add a bit more texture (varying block
    sizes, an irregular street layout, or a couple of named landmark reference points)
    so it reads more convincingly as a real district map rather than a generic grid.'
  - The KDE surface is rendered as visible individual square cells (100-column grid),
    giving each density blob a slightly blocky/stepped edge on close inspection, most
    noticeable where the Boutique Row and Farmers Market Square blobs nearly touch.
    Increasing GRID_COLS (e.g. to ~140-160) or adding a touch of edge anti-aliasing
    would make the surface read as smoother continuous density.
  - Script relies on several helper functions (streetLine, drawColorLegend, drawHotspotLabels,
    hexToRgb, jitter/nextRandom) rather than a flatter top-to-bottom Imports -> Data
    -> Plot flow; justified by the render-callback pattern and the need to hand-roll
    the missing heatmap module, but the repair pass could inline or consolidate the
    smaller helpers (hexToRgb, streetLine) to tighten the structure.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white page background (~#FAF8F1) outside the plot area; the plot area itself carries a subtly distinct warm-beige "block fill" tint (~#EDE9DA) used deliberately as basemap chrome for the geographic district, not as data.
      Chrome: Title "heatmap-geographic · javascript · highcharts · anyplot.ai" (bold, dark ink, top-left) and subtitle describing the KDE methodology are both clearly readable. X/Y axis titles ("km east of district center" / "km north of district center") and tick labels are dark-on-light and legible. A schematic dashed street grid (5 vertical + 3 horizontal lines) sits beneath the density surface. Four hotspot name labels ("Transit Station Plaza", "Mall Food Court", "Boutique Row", "Farmers Market Square") sit above their respective blobs in bold dark text, fully readable with no overlap. A hand-drawn horizontal gradient legend bar ("Relative ping density", Low/High) sits bottom-left.
      Data: Four smooth density blobs rendered as a green-to-blue sequential gradient (imprint_seq) with alpha scaling so low-density edges fade into the basemap; peak-density cores read as blue, low-density edges read as pale teal-green. First/only data series correctly starts at the Imprint green (#009E73) end of the gradient.
      Legibility verdict: PASS — all text is clearly readable against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black page background (~#1A1A17) outside the plot area; plot area carries a slightly lighter near-black block tint (~#26261F), consistent with the light render's basemap-chrome intent.
      Chrome: Title, subtitle, axis titles, and tick labels all flip to light ink color and remain fully legible against the dark background. The dashed street grid lines are still visible but subtle (light gray at reduced opacity). Hotspot labels remain bold and light-colored, clearly readable with no overlap. The gradient legend bar and its Low/High labels are unchanged in position and fully legible in light-gray text.
      Data: The four density blobs use the identical green-to-blue gradient and alpha scaling as the light render — pixel-for-pixel identical data colors, confirming only chrome flipped between themes.
      Legibility verdict: PASS — no dark-on-dark text; every chrome element (title, subtitle, axis labels, tick labels, hotspot labels, legend text) is clearly legible against the near-black surface.
