review:
  strengths:
  - 'Basemap now reads as an actual district layout: irregular avenue/side-street
    spacing with distinct line weights, a diagonal boulevard, and two named landmarks
    (Clock Tower, Public Library) — directly resolves the attempt-1 ''minimal basemap''
    weakness.'
  - Correctly works around the missing core-bundle heatmap/colorAxis module by hand-computing
    a Gaussian KDE surface and mapping density to a per-cell imprint_seq RGBA color
    with alpha scaling — a legitimate, well-documented workaround, not a hack.
  - GRID_COLS raised 100 -> 150 for a visibly smoother density surface, and the helper-function
    count was trimmed (hexToRgb and the streetLine function are gone, replaced by
    inline hex parsing and declarative array literals) — both directly address attempt-1
    feedback.
  - Hotspot name labels drawn directly above each density blob via chart.renderer
    give the viewer an immediate read of which zones matter, without relying on tooltip-only
    interactivity.
  - Deterministic seeded LCG-based data generation keeps the KDE surface reproducible
    across runs.
  - Data colors are pixel-identical between light and dark renders; only chrome (background,
    text, grid, block-fill tint) flips, exactly per the theme-adaptive chrome rules.
  - Plot/X/Y coordinate system is derived from real km-per-degree conversion at the
    district's latitude so the KDE grid cells stay square (not stretched) on screen
    — a subtle correctness detail most implementations skip.
  weaknesses:
  - The KDE surface still shows a faint blocky/stepped edge under close inspection
    despite the GRID_COLS 100->150 increase, most noticeable where the Boutique Row
    and Farmers Market Square blobs nearly touch — pushing GRID_COLS higher still,
    or adding a touch of cell-edge anti-aliasing, would read as fully continuous density.
  - Only two landmarks (Clock Tower, Public Library) anchor the basemap; the Boutique
    Row / Farmers Market Square half of the district has no surrounding basemap detail
    besides the street grid and density blobs — a third reference point on that side
    would balance the district read.
  - 'Design excellence is solid but not yet exceptional: the hand-drawn legend and
    street grid are functional rather than highly polished (e.g. the legend bar has
    no tick marks between Low/High, and the street lines use only two dash styles)
    — more visual refinement here would push Design Excellence further.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white page background (~#FAF8F1) outside the plot area; the plot area itself carries a subtly distinct warm-beige "block fill" tint (~#EDE9DA) used deliberately as basemap chrome for the geographic district, not as data.
      Chrome: Title "heatmap-geographic · javascript · highcharts · anyplot.ai" (bold, dark ink, top-left) and the KDE-methodology subtitle are both clearly readable. X/Y axis titles ("km east of district center" / "km north of district center") and tick labels are dark-on-light and legible. An irregular dashed street grid (major "avenue" lines + thinner "side street" lines + one diagonal boulevard) sits beneath the density surface, with two small square landmark markers labeled "Clock Tower" and "Public Library". Four hotspot name labels ("Transit Station Plaza", "Mall Food Court", "Boutique Row", "Farmers Market Square") sit above their respective blobs in bold dark text, fully readable with no overlap. A hand-drawn horizontal gradient legend bar ("Relative ping density", Low/High) sits bottom-left.
      Data: Four smooth density blobs rendered as a green-to-blue sequential gradient (imprint_seq) with alpha scaling so low-density edges fade into the basemap; peak-density cores read as blue, low-density edges read as pale teal-green. The gradient starts at the Imprint brand green (#009E73) for low density.
      Legibility verdict: PASS — all text is clearly readable against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black page background (~#1A1A17) outside the plot area; plot area carries a slightly lighter near-black block tint (~#26261F), consistent with the light render's basemap-chrome intent.
      Chrome: Title, subtitle, axis titles, and tick labels all flip to light ink color and remain fully legible against the dark background. The street grid (avenues, side streets, diagonal boulevard) and the two landmark labels remain visible at reduced opacity but are still clearly distinguishable. Hotspot labels remain bold and light-colored, clearly readable with no overlap. The gradient legend bar and its Low/High labels are unchanged in position and fully legible in light-gray text.
      Data: The four density blobs use the identical green-to-blue gradient and alpha scaling as the light render — pixel-for-pixel identical data colors, confirming only chrome flipped between themes.
      Legibility verdict: PASS — no dark-on-dark text; every chrome element (title, subtitle, axis labels, tick labels, hotspot labels, landmark labels, legend text) is clearly legible against the near-black surface.
