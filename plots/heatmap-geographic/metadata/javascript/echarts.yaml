review:
  strengths:
  - Sunset cluster is now clearly distinguishable from the background baseline, and
    Downtown/Mission show a visible density valley between them — both HIGH-severity
    findings from attempt 2 are fixed
  - Masking low-density grid cells (instead of per-cell opacity) lets the background/coastline
    show through without the seam artifacts the code comment describes trying and
    rejecting, satisfying the spec's transparency requirement
  - Correct imprint_seq sequential gradient, pixel-identical data colors between light
    and dark renders, fully theme-adaptive chrome with no dark-on-dark/light-on-light
    issues
  - dataZoom (inside, both axes) now implemented for interactive zoom exploration
    per the spec's zoom note
  - 'Deterministic fixed-seed LCG RNG, correct mount-node contract (animation: false,
    no explicit size, no devicePixelRatio)'
  - Correct mandated title format with descriptive prefix; square 2400×2400 canvas
    remains the right orientation choice for this grid-based plot
  - Realistic, neutral SF neighborhood retail-visit scenario with clearly labeled
    cluster markers
  weaknesses:
  - The masked density grid shows visible blocky/staircase pixel edges around each
    cluster (a coarse 42x38 categorical grid) rather than a smooth continuous KDE
    surface — increase nx/ny grid resolution so the density reads as a smooth kernel
    density estimate instead of a pixelated raster.
  - The synthetic coastline is still a smooth abstract dashed dome rather than a recognizable
    San Francisco shoreline shape (flagged as lower-priority in attempt 2, still unaddressed)
    — more vertices with sharper direction changes would read as an actual coastline
    rather than a decorative arc.
  - About half the vertical canvas between the top of the data clusters (~37.785)
    and the coastline arc (~37.805) is empty background with no data or geographic
    detail — tightening the mapped extent to the data, or adding more basemap detail
    (e.g. a bay-side boundary), would use the canvas more purposefully.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white matching #FAF8F1, not pure white.
      Chrome: Title "San Francisco Retail Visits · heatmap-geographic · javascript · echarts · anyplot.ai" centered top in dark ink, fully readable. "Longitude"/"Latitude" axis names in soft ink; rotated (45°) longitude tick labels along the bottom and upright latitude tick labels along the left, both readable. A horizontal visualMap colorbar ("Low" -> "High visit density") sits below the plot, readable.
      Data: Two masked KDE heatmap blobs on a lon/lat categorical grid using the imprint_seq gradient (#009E73 green -> #4467A3 blue): a larger blob on the right containing separately-labeled "Downtown" and "Mission" hotspots with a visible lower-density (greener) saddle between their two blue peaks, and a smaller, clearly-visible "Sunset" blob on the left whose center reaches a comparable blue tone to the other two (no longer washed out into the green baseline as in attempt 2). A dashed soft-ink coastline arcs above/around both blobs, drawn first (z:1) so the heatmap masking now lets it show through the low-density gaps. Small dark scatter markers pin each neighborhood label.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black matching #1A1A17, not pure black.
      Chrome: Same layout as light. Title, axis names, tick labels, marker labels, legend text, and the coastline all flip to light gray/off-white. No dark-on-dark issues found — tick labels, title, and marker labels all read clearly against the dark background.
      Data: Heatmap gradient and marker colors are pixel-identical to the light render — only chrome flipped. Same Sunset-visible / Downtown-Mission-valley pattern confirmed here.
      Legibility verdict: PASS
