review:
  strengths:
  - Correct imprint_seq sequential colormap, pixel-identical between light and dark
    renders
  - Theme-adaptive chrome throughout - all text readable in both themes, no dark-on-dark/light-on-light
    issues
  - Deterministic fixed-seed LCG RNG (correct browser-safe reproducibility pattern,
    no seeded Math.random)
  - Correct mandated title format with descriptive prefix; square 2400x2400 canvas
    is the right orientation choice for this grid-based plot
  - Realistic, neutral SF neighborhood retail-visit scenario with clearly labeled
    cluster markers
  - 'Mount-node contract followed correctly (animation: false, no explicit size, no
    devicePixelRatio)'
  weaknesses:
  - No geographic context whatsoever (no coastline, shoreline, street grid, or boundary)
    - the plot's only 'geographic' cue is the lat/lon axis tick labels, so it reads
    as a generic 2D density heatmap rather than a geographic one. The spec explicitly
    asks to 'add geographic context with country boundaries, coastlines, or street
    maps as a basemap.' Since ECharts core (without GL/extensions) can still draw
    a lines/custom series from a small hand-coded set of shoreline vertices, consider
    adding a simplified SF coastline outline underneath the heatmap so the density
    pattern anchors to real geography.
  - The Sunset cluster (lower average weight) is barely distinguishable from the background
    baseline because the shared visualMap scale is dominated by the merged Downtown+Mission
    peak - this undercuts the spec's core purpose of 'identifying hotspots, clusters,
    and spatial patterns.' Consider a stronger nonlinear compression (e.g. log1p instead
    of sqrt) or per-cluster-aware scaling so all three named hotspots read as visually
    distinguishable.
  - Downtown and Mission density blobs merge into a single region rather than reading
    as two separate hotspots, even though they're separately labeled.
  - Spec's 'for interactive libraries, enable zoom to explore density at different
    scales' is unimplemented - no dataZoom/roam component is configured.
  image_description: |-
