      Data: Lon/lat categorical-grid heatmap using imprint_seq (green #009E73 -> blue #4467A3); three small dark scatter markers labeled "Downtown", "Sunset", "Mission" at neighborhood centers.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17.
