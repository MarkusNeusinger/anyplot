review:
  strengths:
  - Added a simplified SF coastline outline anchoring the density grid to real geography,
    plus dataZoom (inside) on both axes for zoom/pan - directly responds to the two
    attempt-1 findings about missing basemap and missing zoom capability
  - Correct imprint_seq sequential gradient (brand green -> blue), pixel-identical
    data colors between light and dark renders, fully theme-adaptive chrome with no
    dark-on-dark/light-on-light issues
  - 'Deterministic fixed-seed LCG RNG (correct browser-safe reproducibility pattern,
    no seeded Math.random), correct mount-node contract (animation: false, no explicit
    size, no devicePixelRatio)'
  - Correct mandated title format with descriptive prefix; square 2400x2400 canvas
    remains the right orientation choice for this grid-based plot
  - Realistic, neutral SF neighborhood retail-visit scenario with clearly labeled
    cluster markers
  weaknesses:
  - 'The core weakness from attempt 1 is still unresolved: the Sunset cluster (lowest
    weightMean of the three) is still nearly indistinguishable from the background
    baseline color - cropped pixel inspection shows its cell color is barely different
    from the surrounding zero-density green. The code comment claims the Downtown/Mission
    spread was ''tightened...so the KDE shows a visible valley between the two peaks,''
    but the rendered heatmap shows Downtown and Mission still merging into one continuous
    blue corridor with no visible valley - bandwidthLon/bandwidthLat and the sqrt()
    compression are unchanged from attempt 1, so this claimed fix did not actually
    change the visual output. Repair needs a real change (e.g. per-cluster-aware normalization,
    a steeper compression such as log1p, or narrowing the bandwidth further relative
    to the ~1.9km Downtown-Mission separation) and must be verified against the rendered
    PNG, not just asserted in a comment.'
  - 'Spec explicitly asks for ''a sequential colormap...with transparency to allow
    the basemap to show through,'' but the heatmap series is fully opaque (itemStyle
    only sets borderWidth: 0, no alpha/opacity). Because the heatmap paints every
    cell opaquely, the coastline had to be drawn ON TOP of the heatmap (z:5) instead
    of underneath as a basemap - this is a reasonable workaround given the constraint,
    but it means there is no actual basemap showing through a translucent density
    layer as the spec intends; it reads as a decorative line overlay rather than geographic
    context underneath the data. Consider adding heatmap opacity (e.g. itemStyle:
    { opacity: 0.75-0.85 }) so a basemap/coastline drawn beneath can actually show
    through.'
  - The synthetic coastline renders as a smooth, abstract dashed oval rather than
    a recognizable San Francisco shoreline shape - it adds some geographic framing
    but doesn't read strongly as 'San Francisco' to a viewer; a lower-priority refinement
    once the hotspot-distinguishability and transparency issues above are fixed.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1.
      Chrome: Title "San Francisco Retail Visits · heatmap-geographic · javascript · echarts · anyplot.ai" centered top in dark ink, fully readable. "Longitude"/"Latitude" axis names in soft ink. Rotated (45°) longitude tick labels along the bottom, non-rotated latitude tick labels along the left, both readable. Horizontal colorbar legend ("Low" -> "High visit density") below the plot, readable. Dashed soft-ink coastline arc drawn above the heatmap.
      Data: Lon/lat categorical-grid heatmap using imprint_seq (green #009E73 -> blue #4467A3). Downtown and Mission render as one continuous merged blue corridor with no visible valley between them despite a code comment claiming otherwise. Sunset is only a very faint tint versus the green baseline - barely distinguishable on close inspection. Three small dark scatter markers labeled "Downtown", "Sunset", "Mission" sit at the neighborhood centers.
      Legibility verdict: PASS (all text readable; the distinguishability problem is a data/design issue, not a legibility one)

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17.
      Chrome: Same layout as light render; title, axis names, tick labels, marker labels, legend text, and the coastline all flip to light gray/off-white. No dark-on-dark issues found.
      Data: Heatmap gradient colors identical to the light render (only chrome flipped); marker positions and labels identical; the same Sunset-washout and Downtown/Mission-merge issues are present here too since the underlying data/scale is unchanged by theme.
      Legibility verdict: PASS
