review:
  strengths:
  - 'All three attempt-1 weaknesses addressed directly: schematic coastline basemap,
    true gradient colorbar (replacing discrete swatches), and native zoom/pan'
  - Zoom/pan implemented without an external plugin — correctly follows the Chart.js
    library rule against reaching for uninstalled community plugins
  - Colorbar gradient direction and tick placement (High near top/blue, Low near bottom/green)
    are internally consistent with the bubble density-color mapping
  - Ocean fill/coastline is subtle enough to read as context rather than competing
    with the data layer, and uses theme tokens (t.seq, t.ink, t.inkSoft) correctly
    in both themes
  - Density floor and alpha/radius floor keep low-density edge cells visible in dark
    mode instead of fading into the near-black background
  - Theme-adaptive chrome remains fully correct in both renders — no dark-on-dark
    or light-on-light failures anywhere, including the new elements
  weaknesses:
  - The coastline is a very rough, minimal sketch (a handful of straight segments)
    rather than a recognizable geographic reference — it reads as 'some water is nearby'
    more than genuine spatial grounding; a slightly denser polyline or a second landmark
    would strengthen the narrative further
  - The underlying visualization is still a grid-of-circles bubble mosaic rather than
    a smoothly interpolated continuous surface, which is the closest Chart.js's core
    chart types can get to a true heatmap — a structural limitation of the library,
    not something further repair is likely to fix
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1), not pure white.
      Chrome: Title "heatmap-geographic · javascript · chartjs · anyplot.ai" in dark ink, clearly legible. Axis titles "Longitude"/"Latitude" and degree-formatted tick labels (e.g. "-122.44°") dark and readable. New schematic coastline with italic rotated "Pacific Ocean" label and light blue water tint along the western edge. Continuous vertical gradient colorbar (green->blue) with "Density" header and High/Medium/Low tick labels on the right. Grid lines faint but visible.
      Data: Grid mosaic of circles across the eastern two-thirds of the longitude range; first/only series uses the Imprint sequential colormap (t.seq green->blue), radius and color both scale with density, hotspot core near -122.41/37.785 clearly the most intense (blue, largest circles).
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17), not pure black.
      Chrome: Title, axis titles, tick labels, colorbar "Density" header and High/Medium/Low ticks, and the coastline's "Pacific Ocean" label are all rendered in light tones and clearly legible. No dark-on-dark failures observed anywhere.
      Data: Colors and circle layout are pixel-identical to the light render — confirms only chrome (background, text, grid, water tint) flips between themes. Low-density edge cells stay visible as small green circles rather than fading into the near-black background, thanks to the alpha/radius floor in the code.
      Legibility verdict: PASS
