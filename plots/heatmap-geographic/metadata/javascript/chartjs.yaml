review:
  strengths:
  - Creative bubble-chart workaround for the missing native heatmap/matrix chart type
    in core Chart.js, producing a continuous-looking density mosaic from discrete
    grid cells
  - Correct KDE-style Gaussian kernel density computation across a 28x16 grid derived
    from 900 simulated incident points clustered around four hotspots
  - Proper Imprint sequential colormap (t.seq green-to-blue) with density-correlated
    alpha and radius, giving a genuine gradient feel
  - Theme-adaptive chrome is fully correct in both light and dark renders -- no dark-on-dark
    or light-on-light failures, identical data colors across themes
  - Clean, dependency-free deterministic data generation via a seeded 32-bit LCG PRNG
  - Degree-formatted axis tick labels add polish and clarify units for latitude/longitude
  weaknesses:
  - Spec explicitly requires 'geographic context with country boundaries, coastlines,
    or street maps as a basemap' -- none is present; the plot is a bare lon/lat grid
    with no geographic reference, so the density pattern can't be grounded to a real
    place
  - Spec asks for 'a colorbar legend showing the density or intensity scale' -- this
    implementation instead synthesizes 3 discrete Low/Medium/High density swatches
    via a custom generateLabels legend rather than a continuous scale bar, losing
    granularity
  - No zoom capability enabled per the spec's interactive-library note ('enable zoom
    to explore density at different scales')
  - Very low-density cells near the DENSITY_FLOOR threshold are nearly invisible against
    the background in dark mode, particularly at the grid edges
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 -- not pure white, not dark.
      Chrome: Title "heatmap-geographic · javascript · chartjs · anyplot.ai" in dark ink, clearly legible; three-item legend (Low/Medium/High density) below the title with colored circular swatches; axis titles "Longitude" and "Latitude" in dark ink; tick labels formatted with a degree symbol (e.g. "-122.44°", "37.79°") in a slightly softer dark tone; faint grid lines visible but subtle.
      Data: A grid mosaic of circles spanning roughly the eastern two-thirds of the plotted longitude range, colored from soft green (low density) through teal (medium) to blue (high density near the hotspot core around -122.41°, 37.78°), with circle radius growing alongside density. First-series/low-density color matches the Imprint brand green #009E73 family.
      Legibility verdict: PASS -- all text is clearly readable against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 -- not pure black, not light.
      Chrome: Same title, now in light/white text, clearly legible; legend swatches unchanged in color, legend text now light-colored; axis titles and tick labels rendered in light tones against the dark background; grid lines faint but visible.
      Data: Identical circle layout, sizes, and colors to the light render -- confirms only chrome (background/text/grid) flips between themes, not data colors. The lowest-density circles at the grid's edges are quite dark and blend somewhat into the near-black background, but this appears to be an intentional "let the page background show through" design choice rather than a text-legibility failure.
      Legibility verdict: PASS -- all title/axis/tick text is clearly readable against the dark background; no dark-on-dark text failures observed. (Note: some very-low-density data markers are hard to see at the edges, which is a data-visibility observation, not a text-legibility one -- flagged separately in weaknesses/VQ-03.)
