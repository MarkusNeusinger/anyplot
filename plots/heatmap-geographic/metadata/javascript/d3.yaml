review:
  strengths:
  - 'Fixed the geographic mismatch flagged in the prior review: coordinates (40.71N,
    -74.01W) now genuinely correspond to Downtown Manhattan / Financial District,
    matching the ''Downtown Ride-Share Pickup Density'' title.'
  - Zoom-to-explore is now implemented via d3.zoom() with the axes rescaling live
    during pan/zoom, addressing the previously-missing SC-02 spec suggestion.
  - New peak-density annotation (dashed circle + leader line + label) creates a clear
    single focal point, addressing the prior 'no dominant focal point' Design Excellence
    weakness.
  - Axis titles now read 'Longitude (°)'/'Latitude (°)', carrying the unit suffix
    in the label text itself as requested in the prior review.
  - d3.contourDensity() KDE clipped to a custom illustrative coastline via SVG clipPath
    remains a standout, distinctive D3 technique.
  - Imprint imprint_seq colormap (brand green -> blue) applied consistently; data
    colors identical between light and dark renders, both fully legible.
  weaknesses:
  - The peak-annotation group (dashed circle, leader line, 'Peak density' text) is
    appended directly to the root <svg>, not inside the mapLayer <g> that receives
    the zoom transform. Panning/zooming the map will visually detach the annotation
    from the actual peak location — reposition it inside the zoom handler (recompute
    its coordinates from the current zoom transform, like the axes already do) so
    it tracks the data point.
  - Design excellence is strong but still short of top-tier editorial polish — e.g.
    the ambient background points could be visually differentiated more from the hotspot
    fill so the density story reads even faster.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1), matching the Imprint light-theme surface — not pure white.
      Chrome: Title "Downtown Ride-Share Pickup Density · heatmap-geographic · javascript · d3 · anyplot.ai" in bold dark ink, fully readable, spans roughly 80% of the canvas width (expected for the mandated long title, no clipping). "Longitude (°)"/"Latitude (°)" axis titles and degree-formatted tick labels (e.g. "74.05°W", "40.80°N") render in soft dark gray, fully legible. Gridlines are subtle and confined to the map's data extent. The "Pickup density" legend title, High/Low labels, and vertical gradient bar sit to the right of the map with comfortable margin from the canvas edge. The dashed "Peak density" annotation circle and leader line are dark and clearly readable against the blue high-density core.
      Data: An irregular, organically-shaped illustrative coastline filled with a green-to-blue KDE density surface (Imprint imprint_seq colormap) showing a strong central/north cluster (deep blue core, marked "Peak density") and secondary clusters to the south — with faint individual pickup-point texture visible beneath the contour fills. Land outside the density surface renders in a light elevated-surface tone; the coastline outline is a crisp dark stroke.
      Legibility verdict: PASS — all text is dark-on-light and clearly readable, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17), matching the Imprint dark-theme surface — not pure black.
      Chrome: Same title, axis titles, and tick labels now render in light off-white/gray ink, fully legible against the dark background — no dark-on-dark failures observed. Gridlines remain subtle. Legend text and High/Low labels are light-colored and readable; the gradient bar itself is unchanged. The peak annotation circle/line/label render in light ink, clearly visible against the dark core.
      Data: The same landmass silhouette, now filled on a darker elevated-surface tone outside the density surface, with the identical green-to-blue KDE gradient and hotspot layout as the light render — confirming the data colors are theme-independent. The coastline outline switches to a lighter stroke color appropriate for the dark surface.
      Legibility verdict: PASS — all text is light-on-dark and clearly readable, no dark-on-dark failures; brand green/blue data colors remain vivid and legible on the dark surface.
