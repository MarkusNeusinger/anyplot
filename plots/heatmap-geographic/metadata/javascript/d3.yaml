review:
  strengths:
  - Synthetic coastline built from a harmonic (Fourier-like) radial function creates
    a believable, organic geographic silhouette rather than a generic bounding box
    — gives the map real spatial context.
  - d3.contourDensity() correctly implements KDE-based spatial density estimation,
    clipped precisely to the landmass via an SVG clipPath — a technique that leverages
    D3's distinctive d3-contour module.
  - Imprint imprint_seq (brand green -> blue) sequential colormap applied consistently
    and correctly, with data colors identical between light and dark renders and a
    clearly labeled continuous legend (High/Low).
  - Individual pickup points overlaid at low opacity (r=1.3, opacity=0.1) add believable
    texture under the KDE surface without competing with the primary density encoding
    — appropriate for ~1400 points.
  - Deterministic LCG-based synthetic data generation (5 hotspots + ambient background)
    is reproducible and shows a clear multimodal density pattern.
  - 'Clean, idiomatic D3: scales, axisBottom/axisLeft with tickSize-based gridlines,
    geoPath, clipPath, linearGradient legend — expert-level use of the library''s
    core modules.'
  weaknesses:
  - Title reads 'Downtown Ride-Share Pickup Density' but the hard-coded coordinates
    (centerLat=40.78, centerLon=-73.97) correspond to Upper Manhattan near Central
    Park, not Downtown NYC (~40.70-40.71 N) - the descriptive title should either
    be renamed to a neutral/non-geography-specific label or the coordinates should
    shift south to genuinely match a 'downtown' district.
  - Axis titles 'Longitude' and 'Latitude' carry no unit annotation in the label text
    itself (units only show up in the tick labels via the deg symbol) - append something
    like '(deg)' to the axis titles for full unit clarity.
  - The spec's suggestion 'for interactive libraries, enable zoom to explore density
    at different scales' is not implemented - no d3.zoom() behavior is attached, leaving
    the interactive HTML output no more explorable than the static PNG.
  - Design excellence is solid but not yet at publication level - the three hotspots
    read as roughly equal-weight blobs; a stronger single focal point (e.g. subtle
    emphasis/annotation on the highest-density cluster) would sharpen the data storytelling.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1) matching the Imprint light-theme surface.
      Chrome: Title "Downtown Ride-Share Pickup Density · heatmap-geographic · javascript · d3 · anyplot.ai" in bold dark ink, clearly readable, spans roughly 75% of the canvas width without clipping. "Longitude"/"Latitude" axis titles and degree-formatted tick labels (e.g. "74.05°W", "40.90°N") render in soft dark gray, fully legible. Subtle gridlines confined to the map's data extent. Legend "Pickup density" title, High/Low labels, and vertical gradient bar sit to the right of the map with comfortable margin from the canvas edge.
      Data: An irregular, organically-shaped landmass (illustrative coastline) filled with a green-to-blue KDE density surface (Imprint imprint_seq colormap) showing three distinct hotspots — a strong central cluster (blue core) and two secondary clusters to the north and south (teal/green) — with faint individual point texture visible beneath the contour fills. Land outside the density surface renders in a light elevated-surface tone; the coastline outline is a crisp dark stroke.
      Legibility verdict: PASS — all text is dark-on-light and clearly readable, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17) matching the Imprint dark-theme surface, not pure black.
      Chrome: Same title, axis titles, and tick labels now render in light off-white/gray ink, fully legible against the dark background — no dark-on-dark failures observed. Gridlines remain subtle. Legend text and High/Low labels are light-colored and readable; the gradient bar itself is unchanged.
      Data: The same landmass silhouette, now filled on a darker elevated-surface tone outside the density surface, with the identical green-to-blue KDE gradient and hotspot layout as the light render — confirming the data colors are theme-independent. The coastline outline switches to a lighter stroke color appropriate for the dark surface.
      Legibility verdict: PASS — all text is light-on-dark and clearly readable, no dark-on-dark failures, brand green/blue data colors remain vivid and legible on the dark surface.
