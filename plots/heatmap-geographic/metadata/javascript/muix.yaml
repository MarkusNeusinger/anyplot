review:
  strengths:
  - 'The repair replaced the scatter-marker density approximation with a true rasterized
    KDE: the Gaussian kernel is sampled onto a 400px-wide grid, colour-mapped per
    pixel, and drawn as a single <image>, so the browser''s bilinear upscaling produces
    a genuinely smooth, continuous density field with no scalloped circle edges.'
  - Correct Imprint sequential palette (t.seq[0] to t.seq[1], green to blue) with
    an alpha floor that fades low-density pixels to transparent; data colors are byte-identical
    between light and dark renders and the colorbar direction (green=Low, blue=High)
    matches the data mapping.
  - Title font size is programmatically scaled down so the long descriptive + mandated
    title fits without overflowing the canvas in either render.
  - Kernel is truncated at 3x bandwidth and distances are converted to km so the density
    field is isotropic in real space, avoiding a visible tail bleeding across the
    whole map.
  - 'Fully self-contained and deterministic: fixed-seed LCG + Box-Muller gaussian
    jitter, no network/CDN calls, no dependencies beyond @mui/x-charts.'
  weaknesses:
  - The rotated 'Latitude' axis title visibly overlaps the '37.60°N' y-tick label
    in both renders — zooming into the region shows the tick label's digits directly
    crossing the letters of 'titude'. This was flagged as a proximity concern in attempt
    1 and was not resolved by the repair; increase MARGIN.left further or add an explicit
    offset/padding between the y-axis label and the tick labels so they no longer
    collide.
  - Geographic context is still limited to a plain lon/lat graticule — the spec asks
    for boundaries/coastlines/basemap context; a lightweight Bay Area coastline outline
    (if feasible in SVG within the community @mui/x-charts surface) would strengthen
    this further.
  - A few small helper functions (rand, gaussian, hexToRgb, MapTitle) push slightly
    past pure KISS structure — reasonable given the RNG/canvas-rasterization/color-conversion
    needs, but worth noting.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 (not pure white).
      Chrome: Title "Bay Area Retail Foot-Traffic Density · heatmap-geographic · javascript · muix · anyplot.ai" is centered, dark ink, ~55% of canvas width, fully readable, not clipped. "Longitude"/"Latitude" axis titles and °W/°N tick labels are dark and legible, EXCEPT the "Latitude" axis title visibly overlaps the "37.60°N" y-tick label (confirmed on zoomed crop: the "60" digits directly cross the "titude" letterforms).
      Data: A single continuous rasterized density field (six soft blended blobs over the Bay Area: SF/Oakland/Berkeley top-left, a faint Fremont patch center-right, Palo Alto and San Jose lower area) rendered as a smooth Imprint-sequential gradient (green at low density → blue at high density), no scalloped/circular artifacts. Colorbar legend confirms "Low"=green (bottom) / "High"=blue (top), matching the data direction.
      Legibility verdict: PASS overall, with one confirmed local overlap (Latitude axis title vs. 37.60°N tick label) that does not make either element fully unreadable but is a visible defect.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 (not pure black).
      Chrome: Same title now in light ink, fully readable and not clipped. Axis titles/tick labels use light/soft-light tokens and are legible; graticule remains subtle. Same "Latitude"/"37.60°N" overlap present, confirmed identically on a zoomed crop of the dark render — not a light-only regression.
      Data: Data colors are confirmed byte-identical to the light render (green → blue gradient, same colorbar direction) — only chrome (background, text) flipped, as required. No dark-on-dark failures anywhere else (title, axis, ticks, "Low"/"High" legend labels all read clearly against the dark background).
      Legibility verdict: PASS overall, with the same local Latitude/tick-label overlap as the light render.
