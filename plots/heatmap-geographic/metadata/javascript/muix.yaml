review:
  strengths:
  - A real Gaussian kernel density in km (2.2 km bandwidth from the point extent)
    is rasterised into an offscreen canvas and placed as one SVG image. The layer
    reads as smooth gradients, with six separate hot spots that never merge and never
    break up into dots.
  - Composes custom SVG layers inside ChartsContainer through the useXScale/useYScale/useDrawingArea
    hooks, so the raster, the coastline, the place markers and the colour bar share
    MUI X's linear axes exactly. ChartsGrid and ChartsXAxis/ChartsYAxis supply the
    chrome.
  - 'Equal ground scale: the map extent is widened so px per degree latitude equals
    px per degree longitude over cos(mean latitude). The Bay Area keeps its true proportions.'
  - imprint_seq (green to blue) comes with a matching opacity ramp and a transparent
    floor below 0.12 of the peak. The water/land basemap and the coastline stay readable
    between and beneath the hot spots, and the colour bar's gradient includes the
    same transparency.
  - Place labels carry a page-coloured halo stroke (paintOrder stroke) that keeps
    them legible over the density layer and the coastline in both themes.
  - Every chrome element is threaded from ANYPLOT_TOKENS (ink, inkSoft, grid, pageBg),
    so both renders are theme-correct with identical data colours.
  weaknesses:
  - 'VQ-03 (dark): the weaker hot spots (Fremont at about 0.4 of the peak, and Berkeley''s
    and Oakland''s outer halos) render as a dim teal at about 30-45 % opacity over
    #1A1A17, and they barely separate from the near-black land. On the light render
    the same cells read clearly. → raise the opacity of the low and mid densities
    so a 0.4 hot spot shows clearly on the dark page (for example a gamma below 1
    on the alpha ramp, or a higher alpha at the floor). Likely cause: the alpha ramp
    is linear from DENSITY_FLOOR to MAX_ALPHA, so pixels.data[i*4+3] stays low for
    mid z.'
  - 'CQ-04 (code): WaterLayer and DensityLayer each call useXScale/useYScale/useDrawingArea
    and rebuild the same WATER path string d. DensityLayer also depends on the map-clip
    clipPath that WaterLayer defines. → build the path once (one layer component,
    or a shared helper) and keep the clipPath with its users. Likely cause: the basemap
    fill was split off into its own component so it can sit under ChartsGrid.'
  - 'Suggestion: the basemap fills water with the grid token and leaves land as the
    page colour, with no cue that says which is which. A short ''water'' label in
    the Pacific, or a slightly tinted land fill, would make the coastline read faster.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1; water (Pacific and SF Bay) filled in a light warm grey with a dark-grey coastline.
      Chrome: bold title "heatmap-geographic · javascript · muix · anyplot.ai" with a grey subtitle (n = 594 points, Gaussian kernel density, bandwidth 2.2 km, equal ground scale at 37.6° latitude); y ticks 37.30°N–37.90°N, x ticks 122.40°W–121.80°W; axis titles "Latitude" and "Longitude"; dashed subtle grid; vertical colour bar on the right labelled "Relative density (peak = 1)" with ticks 0.00–1.00. All text dark and readable.
      Data: six smooth density hot spots rising from pale green to Imprint blue #4467A3 (imprint_seq). San Francisco is the strongest (deep blue), then San Jose, Oakland, Palo Alto, Berkeley and Fremont (pale teal). Each sits on a labelled city dot with a halo, and transparency leaves the basemap visible around them. The scattered background visits fall below the transparent floor.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17; water in a dark warm grey with a light-grey coastline.
      Chrome: title, subtitle, ticks, axis titles and colour-bar labels all in light ink; the grid is subtle and dashed. No dark-on-dark text; the city labels are light with dark halos.
      Data: the same green-to-blue colours and opacity as the light render, only composited over the dark page. San Francisco, San Jose and Palo Alto read clearly; Fremont and the outer halos of Berkeley and Oakland are dim teal with low contrast against the near-black land.
      Legibility verdict: PASS (text); low-density layer contrast weaker than in the light render
