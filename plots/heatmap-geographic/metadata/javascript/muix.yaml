review:
  strengths:
  - Genuine Gaussian KDE computed from real Bay Area check-in data, with the kernel
    truncated at 3×bandwidth so distant points cannot bleed into a visible tail —
    the six hotspots read as distinct clusters instead of one blob.
  - Correct Imprint sequential palette (t.seq[0] → t.seq[1], green → blue) with alpha
    blending; data colors are byte-identical between light and dark renders, and chrome
    (title, axis, grid, reference-line labels) correctly uses t.ink / t.inkSoft /
    t.grid theme tokens.
  - Title font size is programmatically scaled down (Math.max(14, round(22 * min(1,
    67/len))) so the long descriptive + mandated title fits without overflowing the
    canvas.
  - ContinuousColorLegend's colorMap min/max is kept in sync with the zAxis min/max
    (the code comment explicitly flags this MUI X pitfall), avoiding a legend/data
    scale mismatch.
  - 'Fully self-contained and deterministic: fixed-seed LCG + Box-Muller gaussian
    jitter, no network/CDN calls, no external dependencies beyond @mui/x-charts.'
  weaknesses:
  - The KDE surface is approximated with large overlapping scatter markers (markerSize=34),
    which produces visible scalloped/circular edges around each hotspot cluster instead
    of a smooth continuous density gradient — increase GRID_COLS/GRID_ROWS (finer
    grid) while shrinking markerSize proportionally so adjacent cells blend into a
    smoother field, or reduce marker opacity contrast between neighboring cells.
  - Geographic context is limited to a plain lon/lat graticule (dashed reference lines)
    — the spec asks for country boundaries, coastlines, or a street basemap; since
    MUI X community has no tile/basemap layer, consider at least a stylized bay/coastline
    SVG path overlay if feasible, or explicitly document the graticule as the closest
    available substitute.
  - The left-side 'Latitude' axis title sits close to the '37.60°N' y-tick label —
    increase left margin slightly (or axis label offset) for more breathing room between
    the rotated axis title and the tick text.
  - Several small helper functions (rand, gaussian, hexToRgba, MapTitle) push slightly
    past pure KISS structure — justified by the RNG/color-conversion needs, but keep
    an eye on whether MapTitle's custom SVG <text> could instead use ChartsText or
    a built-in title slot if MUI X offers one, for tighter library-idiomatic usage.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "Bay Area Retail Foot-Traffic Density · heatmap-geographic · javascript · muix · anyplot.ai" centered at top in dark ink, clearly readable and comfortably sized (does not overflow). "Longitude" / "Latitude" axis titles and °W/°N tick labels are dark and legible. Dashed gray graticule lines (both the axis grid and the lon/lat ChartsReferenceLine overlay) are subtle and readable, with the reference-line lat labels placed along the right edge and lon labels floating mid-plot — none are clipped by the canvas.
      Data: Six overlapping-circle clusters over the Bay Area (SF/Oakland/Berkeley cluster top-left, Palo Alto and Fremont/San Jose clusters lower-right) rendered in the Imprint sequential ramp — green at the edges, shifting to blue-green at the highest-density cores (SF and San Jose). First/only data series correctly starts from t.seq[0] (green).
      Legibility verdict: PASS overall. Minor concern: the rotated "Latitude" axis title sits close to the "37.60°N" tick label on the left edge — tight but not confirmed as clipped/garbled.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title, now in light ink, fully readable against the dark surface. Axis titles and tick labels use light/soft-light tokens and are legible; graticule lines remain subtle dashed strokes, visible without competing with the data.
      Data: Confirmed identical hotspot geometry and identical Imprint sequential colors (green → blue-green) to the light render — only the chrome (background, text, grid) flipped, exactly as required.
      Legibility verdict: PASS overall — no dark-on-dark failures observed; all text (title, axis labels, tick labels, "Low"/"High" legend labels) reads clearly against the near-black background. Same left-axis-title/tick-label proximity note as the light render.
