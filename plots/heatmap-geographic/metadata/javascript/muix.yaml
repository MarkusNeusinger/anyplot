review:
  strengths:
  - True Gaussian kernel density computed in kilometres (latitude-corrected longitude)
    and rasterised once to an offscreen canvas, so the layer reads as smooth continuous
    color with no visible dots or bins in either render
  - Imprint imprint_seq ramp (t.seq[0] → t.seq[1]) paired with an opacity ramp and
    a transparent density floor, so the gray water polygon and its coastline outline
    stay readable between and beneath the hot spots
  - Custom color bar reproduces the layer's own floor and alpha ramp and is titled
    'Relative density (peak = 1)', which says exactly what the scale measures
  - Map extent is widened on the short side so one degree of latitude and one degree
    of longitude × cos(mean latitude) cover the same pixels, giving an equal ground
    scale that the subtitle states together with n and the bandwidth
  - 'Idiomatic MUI X composition: ChartsContainer with linear x/y axes, valueFormatter
    for °N/°W ticks, and custom SVG layers that read useXScale / useYScale / useDrawingArea,
    with a clipPath on the drawing area'
  - Haloed city labels (paintOrder stroke in pageBg) locate each hot spot and stay
    legible over the density layer and the coastline in both themes
  weaknesses:
  - 'SC-02 (both): the Berkeley and Oakland clusters (7.4 km apart) merge into one
    blob whose peak sits between the two cities at about 37.84°N instead of two separate
    hot spots, against the spec''s ''separate hot spots stay separate'' bullet; the
    4.6 km bandwidth is wider than the 2–3.4 km cluster spreads → a bandwidth near
    2.5–3 km (about −1.5 to −2 km). Likely cause: BANDWIDTH_SHARE = 0.0625 of the
    73 km extent.'
  - 'Suggestion: the water polygon is filled gray and land is the page color with
    no label, so the bay can read as land at first glance; a small ''Pacific Ocean''
    / ''San Francisco Bay'' text label would settle it.'
  - 'Suggestion: WaterLayer and DensityLayer both rebuild the same WATER path string;
    computing it once would shorten the code.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 page; water (Pacific and San Francisco Bay) as a simplified light-gray polygon with a thin inkSoft coastline outline; land in the page color.
      Chrome: dark bold title "heatmap-geographic · javascript · muix · anyplot.ai" centered, gray subtitle "n = 622 points · Gaussian kernel density, bandwidth 4.6 km · equal ground scale at 37.6° latitude"; axis titles "Longitude"/"Latitude", ticks 122.40°W–121.80°W and 37.30°N–37.90°N; dashed subtle grid; vertical color bar right with ticks 0.00–1.00 and title "Relative density (peak = 1)". All text readable.
      Data: smooth green→blue (imprint_seq) density blobs with transparency; strongest peak at San Francisco (deep blue), strong at San Jose, medium Oakland/Berkeley (merged into one blob), lighter Palo Alto and faint Fremont; ink dots with haloed city labels for six cities. Low densities fully transparent.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17; water polygon as a lighter dark-gray fill with a light outline.
      Chrome: title, subtitle, axis titles, tick labels and color-bar labels all in light ink/inkSoft — no dark-on-dark; grid dashed and subtle.
      Data: same green→blue ramp and opacity ramp as the light render (only chrome flipped); hot spots in the same places; city dots white with dark halos on labels.
      Legibility verdict: PASS
