review:
  strengths:
  - Weighted gaussian_kde with bw_method=0.19 keeps the Sacramento, San Joaquin and
    Los Angeles hot spots separate while bridging them with a low band - smooth, continuous
    layer
  - imprint_seq applied as 14 stacked translucent levels; the colour bar is built
    from the same stacked layers so its steps match the map exactly
  - Longitude span corrected by cos(latitude) so California keeps its true proportions
    on the square canvas
  - Degree tick formatters (°N / °W) via x_value_formatter and value_formatter
  - Inline CSS removes heat-fill outlines and mutes the station dots, using pygal's
    css option idiomatically
  - Theme tokens threaded through Style; both renders fully legible
  weaknesses:
  - 'Suggestion: the station dots at 0.55 opacity partly mask the deepest blue in
    the three cores; smaller or fainter dots there would let the peak colour read
    more clearly.'
  - 'Suggestion: the marching-squares tracing (about 45 lines) could be shortened
    with contourpy''s contour_generator if it is accepted as available through matplotlib.'
  - 'Suggestion: neighbouring state and Mexico outlines would extend the geographic
    context beyond California''s border.'
