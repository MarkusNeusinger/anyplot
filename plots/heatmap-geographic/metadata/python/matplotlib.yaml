review:
  strengths:
  - Hot spots sit exactly on the three sensor clusters (Bay Area/Sacramento, Central
    Coast, Los Angeles) with distinct intensities
  - imprint_seq built exactly as the style guide prescribes, identical in both themes,
    with fully theme-adaptive chrome
  - Coastline and state border drawn above the layer at zorder 3, distinguished by
    solid vs dashed line styles, so the basemap stays readable through the hot spots
  - Clean data block with named column constants and a reproducible default_rng(42)
    generator
  weaknesses:
  - 'SC-02 (both): the density layer stops at a hard, stair-stepped edge where the
    6 % mask cuts in, with saturated green at the full 0.8 alpha right up to the cut,
    so each cluster reads as a bounded green patch with pixel steps instead of a gradual
    transition (spec ''A good version shows'' C1) → let the low end fade into transparency
    (alpha rising with density, or a cmap whose low end is transparent) so the edges
    dissolve. Likely cause: np.ma.masked_where(smooth < MIN_DENSITY_SHARE * smooth.max())
    on the 150-cell grid combined with constant alpha=0.8.'
  - 'VQ-06 (both): the axis titles ''Longitude'' and ''Latitude'' state no unit →
    ''Longitude (°)'' / ''Latitude (°)''. Likely cause: ax.set_xlabel(LONGITUDE) /
    ax.set_ylabel(LATITUDE) with the bare column names.'
  - 'DQ-03 (both): the colorbar runs 2-37 and is labelled ''Air Quality Index (weighted
    density)'', so it reads as AQI levels, but the values are kernel-smoothed sums
    of AQI per grid cell in arbitrary units → normalise the layer (for example to
    a 0-1 relative density) or label it as relative AQI-weighted station density.
    Likely cause: np.histogram2d(..., weights=df[AQI]) without normalisation and the
    cbar label.'
  - 'CQ-04 (code): lines 85-89 write out a separable Gaussian kernel and two np.apply_along_axis
    convolutions → scipy.ndimage.gaussian_filter(heatmap, SIGMA) (or scipy.stats.gaussian_kde
    on the points). Likely cause: hand-rolled smoothing instead of the available SciPy
    call.'
  - 'Suggestion: an aspect ratio of 1/cos(37°) (ax.set_aspect) would keep California''s
    proportions closer to a real map projection.'
