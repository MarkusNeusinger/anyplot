review:
  strengths:
  - 'Continuous imprint_seq ramp (#009E73 to #4467A3) at opacity 0.75 keeps the streets
    and coastline readable beneath the hot spots'
  - Basemap style follows the theme (carto-positron / carto-darkmatter), so the map
    chrome flips while the data colors stay identical
  - Native go.Densitymap with zoomable MapLibre tiles and a hovertemplate built from
    the column constants
  - Real Sydney localities (CBD, Newtown, Bondi, Manly, Parramatta) give the hot spots
    a recognisable geography
  weaknesses:
  - 'SC-02 (both): smoothing does not match the scale everywhere (C5): the Parramatta
    cluster breaks into mottled pale patches instead of one smooth hot spot, while
    the nearby CBD and Newtown clusters merge into a single plateau → a radius that
    keeps Parramatta continuous, about 12–14 px (+4 to +6 px), with the data''s Newtown
    spread kept clear of the CBD. Likely cause: Densitymap radius=8.'
  - 'DQ-03 (code): each point is one trip start, yet its weight is drawn 0.05–1.0
    and labelled ''Trips per hour'', an implausible unit for a single trip → a plausible
    weight such as station trips per hour in the tens, or a relative density label.
    Likely cause: the INTENSITY column generation and its name.'
  - 'Suggestion: centering on the land extent rather than the median longitude would
    give the open sea on the right less of the frame.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 page around a carto-positron basemap of Sydney (light land, grey sea).
      Chrome: title "Bike-Share Trip Density · heatmap-geographic · python · plotly · anyplot.ai" centered in dark ink, about 66 % of the width; colorbar at right titled "Trips per hour" with ticks 0.2–1 in INK_SOFT; basemap labels (Parramatta, Chatswood, North Sydney, SYDNEY, Manly, Liverpool) and the OSM/CARTO attribution all readable.
      Data: density layer in the imprint_seq ramp, pale green at low density to blue #4467A3 at the top; blue hot spots over the CBD/Newtown (merged plateau), Bondi and Manly, a fainter mottled green-blue cluster over Parramatta, faint specks of background points, open sea on the right third.
      Legibility verdict: PASS

