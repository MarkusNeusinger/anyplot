review:
  strengths:
  - Uses the Imprint sequential fields ramp with each theme's stops through the prescribed
    ramp_color sampling for scale_fill_gradientn
  - geom_contourf on a gaussian_kde grid gives a smooth density layer whose two hot
    spots stay separate at bandwidth 0.15
  - Theme tokens threaded through every chrome element; both renders fully readable
  - Formatted layer_tooltips (lat, lon, magnitude) add per-event inspection in the
    HTML output
  - 'Canvas fitted per the library prompt: one-panel gggrid at 600x600, scale 4, carrying
    the page color'
  weaknesses:
  - 'VQ-02 (both): the ''Los Angeles'' label at lat 35.3 sits over the top of the
    LA cluster and touches several event markers → place it where no marker lies under
    the text, for example above the density layer''s northern edge. Likely cause:
    CITIES lat for Los Angeles = 35.3.'
  - 'VQ-03 (both): 600 overlay markers with #AE3030 fill at alpha 0.5 pile up over
    the SF and LA hot spots, so the peak density colors read as a reddish-purple blob
    → lower the marker alpha (about 0.25) or shrink the size range so the field''s
    peak stays visible. Likely cause: geom_point alpha=0.5, scale_size range=[1, 5].'
  - 'VQ-05 (both): the fixed-aspect map leaves empty bands of about 12 % of the canvas
    above the title and below the x-axis title → fill more of the square, e.g. trim
    the 1-degree MAP_PAD in latitude only where no event lies so the map is closer
    to square. Likely cause: MAP_PAD = 1.0 on all sides with a wider-than-tall data
    extent.'
  - 'SC-02 (code): the Notes ask interactive libraries to enable zoom, but the HTML
    output has no zoom or pan → add lets-plot''s toolbar (ggtb()) to the plot. Likely
    cause: no ggtb() layer.'
  - 'DQ-03 (both): event magnitudes run to about 15 (size legend 5/10/15), beyond
    any recorded earthquake (max about 9.5; California events mostly 1–7) → draw magnitudes
    in a realistic range, e.g. 1.5–7. Likely cause: np.random.exponential(2.0–2.2)
    + 1 without a cap.'
  - 'Suggestion: the ''San Francisco'' label at lat 39.0 sits about 1.2 degrees north
    of the city; anchoring it nearer 37.8 would locate the hot spot more directly.'
  - 'Suggestion: a state border alongside the coastline would give the basemap more
    geographic context.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole 2400x2400 canvas
      Chrome: bold title 'Seismic Activity Density · heatmap-geographic · python · letsplot · anyplot.ai' in dark ink at about 80 % of the width; Longitude/Latitude axis titles and ticks in dark ink; bold 'San Francisco' and 'Los Angeles' city labels; framed 'Event Density' color bar (0–0.25) and 'Magnitude' size legend (5/10/15). All readable.
      Data: filled KDE contours in the Imprint sequential fields ramp (pale mint → brand green → blue → navy) at alpha 0.85, two separate hot spots (SF darkest, LA) joined by a diffuse central band; a dark-grey coastline polyline; 600 event markers with blue outline and red fill sized by magnitude, crowding the hot spots.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17 across the whole canvas
