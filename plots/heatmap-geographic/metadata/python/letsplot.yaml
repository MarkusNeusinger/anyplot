review:
  strengths:
  - Uses the current Imprint sequential fields ramp with each theme's stops, sampled
    with ramp_color for scale_fill_gradientn
  - geom_contourf on a gaussian_kde grid gives a smooth density layer whose two hot
    spots stay separate at bandwidth 0.15
  - Theme tokens threaded through every chrome element; both renders fully readable
  - Formatted layer_tooltips (lat, lon, magnitude) and the ggtb toolbar add per-event
    inspection and zoom in the HTML output
  - 'Canvas fitted per the library prompt: one-panel gggrid at 600x600, scale 4, page
    color, legends below the fixed-aspect panel'
  weaknesses:
  - 'VQ-03 (both): the Magnitude legend glyphs are drawn opaque (solid #AE3030 fill,
    #4467A3 ring) while the map markers are at alpha 0.25, so the key does not match
    the marks it explains → draw the legend glyphs at the marks'' alpha. Likely cause:
    scale_size guide without guide_legend(override_aes={''alpha'': 0.25}).'
  - 'VQ-05 (both): widening the latitude span to the longitude span leaves the panel
    at about 72 % of the canvas width, with empty strips on both sides and an empty
    band south of lat 32.5 → fill more of the square, e.g. a shorter MAP_PAD or one
    combined horizontal legend row so the panel gets more height. Likely cause: span
    = max(...) with MAP_PAD = 1.0 plus two stacked bottom legends.'
  - 'SC-02 (both): the ''San Francisco'' label sits at lat 39.0 (city at 37.77, +1.2
    degrees) and ''Los Angeles'' at lat 36.3 (city at 34.05, +2.25 degrees), so the
    reference geography does not locate the hot spots → anchor each label at its city''s
    latitude, offset to the offshore side where no events lie. Likely cause: CITIES
    lat = [39.0, 36.3].'
  - 'Suggestion: a state border alongside the coastline would give the basemap more
    geographic context.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole 2400x2400 canvas
      Chrome: bold title 'Seismic Activity Density · heatmap-geographic · python · letsplot · anyplot.ai' in dark ink at about 80 % of the width; Longitude/Latitude axis titles and ticks in dark ink; bold 'San Francisco' and 'Los Angeles' labels; 'Event Density' color bar (0-0.25) and 'Magnitude' size legend (2-7) stacked below the map in framed elevated boxes. All readable.
      Data: filled KDE contours in the imprint_seq fields ramp (pale mint -> brand green -> deep blue -> dark violet) at alpha 0.85: SF hot spot darkest, LA second, joined by a diffuse Central Valley band; dark-grey coastline polyline; 600 event markers (#4467A3 ring, #AE3030 fill) at alpha 0.25 sized by magnitude; peak colors stay visible beneath them.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17 across the whole canvas
      Chrome: title, axis titles, ticks, city labels and legend text in light ink; legend boxes on #242420; coastline in light grey. No dark-on-dark text.
      Data: density field uses the dark fields stops (dark olive -> brand green -> pale blue), the SF peak pale blue; marker colors identical to the light render.
      Legibility verdict: PASS
