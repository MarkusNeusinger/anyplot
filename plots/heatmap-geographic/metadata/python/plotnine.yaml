      Data: seven green→blue KDE hot spots (North Sea, Suez/Red Sea, Arabian Sea, Malacca, Shanghai, Gulf of Mexico, Panama) as stepped tile patches; dark-grey simplified continent outlines on top. Map occupies the middle band; empty bands above and below.
      Legibility verdict: PASS

