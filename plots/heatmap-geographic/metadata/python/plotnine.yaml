review:
  strengths:
  - 'Uses the imprint_seq ramp (#009E73 → #4467A3) through scale_fill_gradient, with
    a colorbar titled Relative density'
  - Theme tokens thread through every chrome element and the ocean panel, so both
    renders read cleanly
  - Vectorized KDE with scipy gaussian_kde on a regular grid, normalized to a 0–1
    relative scale; hubs stay separate (Panama vs Gulf of Mexico)
  - Clean six-zone adaptable layout with named column constants and a seeded generator
  weaknesses:
  - 'VQ-05 (both): the 360°×140° map at coord_fixed(1.0) fills only the middle band,
    leaving about 20 % of the canvas empty above and below, and the legend title ''Relative
    density'' ends a few px from the right canvas edge → fill the canvas height and
    give the legend a right margin. Likely cause: coord_fixed aspect inside the 8×4.5
    figure with legend_position=''right'' and no plot_margin.'
  - 'SC-02 (both): hot spots are coarse 3°×2° tiles cut off at the 6 % floor, so each
    reads as a stepped, hard-edged patch of near-uniform green rather than a gradual
    transition (C1) → a finer grid (about 360×140) and a fade-out of alpha near the
    floor instead of a hard cut. Likely cause: GRID_LON=120, GRID_LAT=70 and df_heatmap[DENSITY]
    > DENSITY_FLOOR.'
  - 'SC-02 (both): the 6–10-vertex continent outlines put the Shanghai, Suez/Red Sea
    and Malacca shipping hot spots over land, so the basemap does not locate them
    (C4) → a coastline basemap with enough vertices that the sea lanes show as water.
    Likely cause: the hand-typed CONTINENTS dict.'
  - 'Suggestion: a log or square-root density scale would let the transit background
    show between the hubs.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 page; light-blue ocean panel #D4E8F7.
