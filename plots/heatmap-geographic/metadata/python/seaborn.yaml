review:
  strengths:
  - Uses the mandated imprint_seq ramp with alpha 0.6, so the bay basemap stays visible
    beneath the layer in both themes
  - Exact 3200x1800 canvas with a latitude-corrected aspect that keeps ground distances
    equal
  - 'Idiomatic tidy seaborn: data=df with column constants into sns.kdeplot with built-in
    colorbar'
  - District labels at each cluster's median make the four hot spots readable at a
    glance
  weaknesses:
  - 'SC-02 (both): the basemap is a 7-point Tokyo Bay shoreline confined to the lower-right
    corner, so none of the four hot spots is located by a coastline, boundary or street
    (C4) → a basemap layer (ward boundaries, rail/street lines or a coastline) that
    runs through or around the clusters. Likely cause: BAY_SHORE is the only geometry
    drawn.'
  - 'Suggestion: drop the contour edge lines of the 30 fill levels (visible as thin
    rings in the light render) for a smoother gradient.'
  - 'Suggestion: round colorbar ticks (e.g. 50, 100, 150, 200) would read more cleanly
    than 33.4 … 216.6.'
