review:
  strengths:
  - 'Native bokeh map stack: mercator axis types, add_tile with theme-matched Esri
    light/dark canvas tiles, and p.image driven by a LinearColorMapper whose nan_color
    leaves the empty map transparent'
  - 'Imprint sequential ramp (#009E73 → #4467A3) for the density, identical in both
    renders, with a ColorBar titled ''AQI-weighted density'''
  - Value-weighted 2D histogram smoothed with a Gaussian kernel yields three distinct
    hot spots that stay separate while the fringe merges, matching the data density
  - Renderer-scoped HoverTool shows AQI and coordinates per station in the HTML, and
    the zoomable map fulfils the Notes' interactive-zoom request
  - Map extent and grid aspect derive from the data bounds, so the plot adapts to
    other tables; correct 3200x1800 canvas with all text at the bokeh guide sizes
  weaknesses:
  - 'SC-02 (both): the density layer jumps from fully transparent to near-opaque brand
    green at the MIN_VISIBLE cutoff, so each cluster group ends in a jagged, stair-stepped
    hard edge and reads as a bounded region (C1), and the basemap''s coastline and
    borders under the layer are barely visible (C2) → let opacity rise with density
    so the fringe fades into the basemap and the low end stays translucent. Likely
    cause: a single alpha=0.7 on p.image with the lowest palette color fully opaque
    #009E73 and the hard np.where(smooth < top * MIN_VISIBLE, nan) cut.'
  - 'VQ-03 (both): 500 station dots at size 12, alpha 0.8, drawn above the layer cover
    the hot-spot cores, so the blue peak of the density gradient is largely masked
    by the green dots → smaller (about 5–6 px) and more translucent (alpha about 0.3–0.4)
    station markers. Likely cause: scatter size=12, alpha=0.8.'
  - 'CQ-01 (code): two helper functions, lerp_hex and to_mercator, break the flat
    Imports → Data → Plot → Save structure → inline the projection as two vectorised
    expressions and drop lerp_hex (see CQ-04). Likely cause: def lerp_hex / def to_mercator.'
  - 'CQ-04 (code): lines 89–94 write out a separable Gaussian blur (kernel build +
    two apply_along_axis convolutions) that scipy.ndimage.gaussian_filter(heatmap,
    SIGMA_CELLS) computes, and lines 35–43 hand-interpolate the two-stop ramp that
    bokeh.palettes.interp_palette(("#009E73", "#4467A3"), 256) computes → use those
    calls. Likely cause: hand-rolled kernel and lerp_hex.'
  - 'Suggestion: color the station markers in an ink tone rather than #009E73, so
    they do not share the lowest density color of the ramp.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white #FAF8F1 page around the map; the map is Esri World Light Gray Canvas tiles (grey ocean, very light land, faint state lines for Nevada/Utah/Arizona).
      Chrome: Bold dark title "California AQI Monitoring · heatmap-geographic · python · bokeh · anyplot.ai" across ~80% of the width; italic axis titles "Longitude (°)" and "Latitude (°)"; tick labels −130 … −110 and 32 … 40 in INK_SOFT; legend "Monitoring stations" top right on an elevated panel; vertical colorbar 0–6 titled "AQI-weighted density" on the right. All text readable.
      Data: Three density hot spots (Sacramento area, Central Coast, Los Angeles basin) in the imprint_seq ramp: brand green #009E73 fringe rising to blue #4467A3 cores; the layer ends in a jagged, stair-stepped hard edge at a near-opaque green, hiding much of the coastline under it; 500 green station dots with dark outlines sit on top and cover most of the blue cores.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black #1A1A17 page; Esri World Dark Gray Canvas tiles (near-black ocean, dark grey land, faint borders).
      Chrome: Title, axis titles, tick labels, legend text and colorbar title/labels in light tokens (#F0EFE8 / #B8B7B0), all clearly readable; no dark-on-dark text.
      Data: Same green-to-blue ramp and the same three hot spots as the light render; station dots are green with light outlines. Data colors identical to the light render; only chrome and tiles flip.
      Legibility verdict: PASS
