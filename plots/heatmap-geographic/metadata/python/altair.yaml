  strengths:
  - Theme-adaptive basemap and legend card flip correctly between light and dark
  - Idiomatic Altair geo layering with alt.topo_feature and a Mercator projection
  - Tooltips with lat/lon/value in the HTML view
  - Real European city clusters at accurate coordinates
  weaknesses:
  - 'VQ-05 (both): the render is 5256x2829, not 3200x1800, and the data fills only
    a small central patch of a world-scale map → 3200x1800 with the projection framed
    on the data extent. Likely cause: width=1600, height=900 at scale_factor=3.0 and
    projection scale=600.'
  - 'VQ-07 (both): the continuous color uses viridis → imprint_seq (#009E73 → #4467A3).
    Likely cause: scale=alt.Scale(scheme=''viridis'').'
  - 'SC-01, SC-02, DQ-01 (both): the layer is individual translucent bubbles, a bubble
    map, not a continuous density surface (C1) → compute a KDE on a lon/lat grid and
    draw it as cells. Likely cause: mark_circle on the raw points.'
  - 'SC-02 (code): no zoom in the HTML although the Notes ask interactive libraries
    for it → bind the projection scale to an alt.param. Likely cause: no param defined.'
  - 'VQ-03, VQ-04 (dark): low-value circles in dark viridis purple nearly disappear
    against #1A1A17 and the #3A3A35 land → a ramp whose low end contrasts on dark.
    Likely cause: viridis low end on a dark surface.'
  - 'VQ-02 (both): overlapping opaque circles in the London and Paris clusters merge
    into whitish blobs that hide the marks beneath → smaller markers or lower alpha.
    Likely cause: size range up to 1500 with opacity 0.5.'
  - 'SC-03 (both): the color domain [0, 30] clamps every value above 30 to the top
    color → a domain from the data. Likely cause: scale domain=[0, 30] typed in.'
  - 'SC-04 (both): the legend says ''Density (%)'' for the raw weight value, which
    is neither a density nor a percentage → a title naming the plotted value. Likely
    cause: legend title string.'
  - 'CQ-04 (code): lines 45-61 append one dict per point in loops where pd.DataFrame
    from the arrays (and pd.concat) does it directly → build the frame from the arrays.
    Likely cause: row-wise data_rows list.'
  - 'Suggestion: label the strongest clusters by city name.'
