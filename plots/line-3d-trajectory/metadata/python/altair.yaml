  - HTML output has pan/zoom bound to the scales and tooltips with the original X,
    Y and Z values
  weaknesses:
  - 'VQ-05 (both): the canvas is 5340x2979, not a canonical size → 3200x1800 (−2140
    × −1179). Likely cause: width=1600, height=900 at scale_factor=3.0 with no pad-to-target
    step.'
  - 'VQ-07 (both): continuous time is colored with viridis → imprint_seq #009E73 to
    #4467A3. Likely cause: alt.Scale(scheme=''viridis'').'
  - 'VQ-03 (dark): the early time steps in dark viridis purple nearly vanish on #1A1A17
    → a ramp whose low end stays visible on both backgrounds. Likely cause: the viridis
    low end (#440154).'
  - 'SC-02 (both): no x, y, z axes are drawn in the projected space, so C2 is missed
    → draw the three projected axis lines with X, Y and Z labels. Likely cause: only
    the data is projected.'
  - 'SC-04 (both): the title ''line-3d-trajectory · altair · anyplot.ai'' lacks the
    language segment → ''line-3d-trajectory · python · altair · anyplot.ai''. Likely
    cause: the title string.'
  - 'CQ-01 (code): line 21 opens the Data block with no column-0 # Plot marker after
    it, and there are no column constants for x, y and z → one Data block ending in
    df, with column constants above it. Likely cause: the plot code is not separated
    from the data generation.'
  - 'CQ-04 (code): lines 59–71 build the segments as a Python loop over a list of
    dicts → build the DataFrame from array slices (x_proj[:-1], x_proj[1:]). Likely
    cause: a row-by-row construction.'
  - 'Suggestion: coarser tick steps would make the axes calmer.'
