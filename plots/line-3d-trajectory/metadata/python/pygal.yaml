review:
  strengths:
  - 'Title format is exactly correct: "line-3d-trajectory · python · pygal · anyplot.ai"'
  - 'First color is exactly Imprint brand green #009E73, and the 30-segment gradient
    correctly interpolates imprint_seq (#009E73 → #4467A3) for the single-polarity
    ''elapsed time'' variable — a legitimate, well-reasoned continuous-encoding choice'
  - 'Theme-adaptive chrome is correctly threaded through the Style object in both
    renders — light background #FAF8F1 with dark ink text, dark background #1A1A17
    with light ink text, no dark-on-dark or light-on-light failures'
  - Data is a real, deterministic Lorenz attractor (classic sigma=10, rho=28, beta=8/3
    chaotic parameters, no randomness) — scientifically accurate and neutral, with
    rich chaotic dynamics (two-lobe switching, spiraling) that exercise the trajectory
    concept well
  - Legend is correctly omitted (30 time-segments would clutter a legend) and the
    code documents the specific pygal SerieConfig limitation that motivated the segmented-gradient
    workaround
  - Clean, flat KISS script structure (no functions/classes), fully reproducible,
    only used imports, correct plot-light/plot-dark.png + .html outputs
  weaknesses:
  - 'Core spec mismatch: the spec is explicitly a ''3D Line Plot for Trajectory Visualization''
    in ''three-dimensional space'' where ''interactive rotation and zoom are critical
    for understanding 3D spatial relationships'' — the implementation drops the Z
    coordinate entirely from the visual encoding (only x_norm, y_norm are plotted;
    z only feeds the ODE integration) and produces a plain 2D XY line chart. Color
    is repurposed to encode time instead of any spatial depth cue. No projection,
    isometric transform, or small-multiples of the XZ/YZ planes are attempted to preserve
    the 3D structure — SC-01 scored 0 and caps the total at 40.'
  - 'SC-02/SC-03: because Z is unmapped, two spec-required aspects are missing — no
    visual representation of the 3rd spatial dimension, and no interactive-rotation
    affordance (unsurprising since pygal.XY is a flat 2D chart, but the spec calls
    this out as essential, not optional).'
  - 'VQ-03: with stroke_width=2.5 and no alpha applied across 3000 points / 30 overlapping
    series, the tightly-wound coil regions near both attractor foci become dense,
    near-solid blobs of color where individual loops are hard to distinguish — the
    data-density heuristic (>500 points -> smaller/alpha<1 lines) was not applied
    to the line rendering.'
  - 'LM-02: the segmented-series gradient is a clever workaround for a pygal-specific
    API limitation, but it is a workaround for a constraint rather than a use of a
    feature distinctive to pygal — scored as fairly generic library usage.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1), matches the required light-theme surface — not pure white.
      Chrome: Title "line-3d-trajectory · python · pygal · anyplot.ai" is dark ink, bold, centered at top, ~72% of plot width. Axis titles "X (2D trajectory projection)" (bottom) and "Y — color encodes elapsed time" (left, rotated) are dark ink and clearly readable. Tick labels on both axes are dark, evenly spaced, similarly sized, no overlap. A subtle dashed gridline grid and darker reference lines at x=0/y=0 are visible without competing with the data.
      Data: A continuous curved trajectory forming the classic two-lobe Lorenz-attractor "butterfly" shape in the (x, y) plane. Color sweeps from brand green (#009E73) through teal/blue tones to blue (#4467A3) across 30 sequential time segments, with no markers (show_dots=False). The 3rd spatial coordinate (Z) is not represented in this view at all — only elapsed time is color-encoded.
      Legibility verdict: PASS — all text is clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17), matches the required dark-theme surface — not pure black.
      Chrome: Same title, axis titles, and tick labels, now rendered in light ink (near-white/light-gray) and fully legible against the dark background — no dark-on-dark failures found. Gridlines and the x=0/y=0 reference lines are visible but subtle, using the dark-theme muted tone.
      Data: Identical trajectory shape and identical green→blue gradient colors as the light render — confirms the Imprint data colors are held constant across themes; only chrome (background/text/grid) flipped, as required.
      Legibility verdict: PASS — all text is clearly readable against the dark background; no dark-on-dark issues.

    Note: Both renders pass the theme-readability and canvas-dimension checks. The primary defect is not a legibility/theme problem but a spec-compliance one: the plot never visually encodes the Z axis that defines the "3D" trajectory the specification asks for (see Weaknesses / SC-01).
