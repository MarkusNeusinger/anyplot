review:
  strengths:
  - 'A true 3D view in a library without 3D: an orthographic projection (elevation
    20°, azimuth -45°) of the trajectory, the axis frame and its ticks, at equal screen
    scale so nothing is stretched'
  - Lorenz attractor from scipy's solve_ivp with 4000 points reads as a smooth continuous
    curve with both wings side by side
  - 'Time progression in imprint_seq (#009E73 to #4467A3), split into segments that
    share end points so the line stays continuous, with a key bar drawn in the same
    gradient and labelled ''Elapsed time (model time units)'''
  - 'Clean theme threading: one Style object carries page, ink and soft-ink tokens,
    so both renders are fully legible with identical data colors'
  - 'Idiomatic pygal: XY series with None breaks and allow_interruptions, print_labels
    as a text overlay, inline css for per-series stroke widths, named segments in
    the interactive HTML tooltips'
  weaknesses:
  - 'SC-03 (both): the Z axis has no label at its floor corner (0), and X''s first
    tick label ''-20'' sits just below the Z tick column, so the column reads 50,
    40, 30, 20, 10, -20 and suggests Z = -20 at the floor → label the Z floor 0 and
    move X''s ''-20'' clear of the Z column (further along the X edge''s outward direction).
    Likely cause: text_world uses z_ticks[1:] and places the x0 label at gap * out_x
    from the shared corner.'
  - 'Suggestion: a slightly thicker line (about 4.5 px) would let the late blue loops
    hold their own against the #1A1A17 background in the 400 px thumbnail.'
  - 'Suggestion: marking the start point (t = 0) would tell the reader where the green
    gradient begins without consulting the key.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole canvas.
      Chrome: bold monospace title "line-3d-trajectory · python · pygal · anyplot.ai" centred at the top (~60% width); a projected box frame in soft ink: a vertical Z axis on the left with ticks 10–50 and the letter Z at its top, X and Y axes running diagonally along the front floor edges with outward ticks (X -20..20, Y -30..30) and the letters X and Y. A time key top right: "Elapsed time (model time units)" over a gradient bar with 0 and 30 at its ends. All text dark and readable.
      Data: a Lorenz attractor as one continuous thin line, both wings side by side; colour runs from brand green #009E73 (early, the first outer loop and the tightly wound left-wing core) to blue #4467A3 (late loops in the right wing and the outer left loops). Overlapping strands stay traceable.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: same layout; title, tick labels, axis letters and key text in light ink, axis lines and ticks in light soft ink; no dark-on-dark text.
      Data: identical green-to-blue gradient as in the light render; the blue late loops are somewhat lower in contrast but clearly visible; brand green reads well.
      Legibility verdict: PASS
