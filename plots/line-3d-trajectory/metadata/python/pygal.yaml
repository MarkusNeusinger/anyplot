review:
  strengths:
  - Builds a true oblique 3D view on pygal's XY chart with an orthographic projection
    (elevation 20°, azimuth -45°) that sets the two Lorenz wings side by side and
    shows extent in x, y and z, with projected axes, outward tick marks and tick labels
    at one shared tick step so the box stays at equal scale
  - 4000 solve_ivp points (rtol 1e-9) give a smooth, continuous Lorenz trajectory;
    segments share their end points so the gradient never breaks the line
  - 'Time is encoded as an imprint_seq gradient (#009E73 to #4467A3) along the path,
    explained by a key in the line''s own gradient titled ''Elapsed time (model time
    units)'' with its 0 and 30 end values'
  - Theme tokens threaded through Style (background, foreground, foreground_subtle)
    give correct chrome in both renders; data colors are identical between light and
    dark
  - 'Uses pygal-native mechanisms well: allow_interruptions with None breaks, print_labels
    for positioned text, inline css injection for stroke widths and the bold title,
    and per-segment series names (''t = a–b'') that become tooltips in the interactive
    HTML'
  weaknesses:
  - 'Suggestion: the time key is drawn at the trajectory''s own stroke width, so it
    reads like a line sample; a thicker key bar would make the gradient easier to
    read in the 400 px thumbnail.'
  - 'Suggestion: the blue end of the gradient (#4467A3 at 0.85 alpha) is dimmer on
    the dark background than the green start; a slightly higher opacity in the dark
    theme would lift the late loops.'
  - 'Suggestion: the plot box leaves an empty band on the right below the key; a slightly
    larger scale would use the canvas more fully.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white, matches #FAF8F1.
      Chrome: bold title "line-3d-trajectory · python · pygal · anyplot.ai" centred at top (~60% width); projected 3D box with a vertical Z axis (ticks 0–50), an X floor edge running down-right (ticks -20 to 20) and a Y floor edge running up-right (ticks -30 to 30), axis names X, Y, Z; all dark ink, crisp and readable. Time key top right: "Elapsed time (model time units)" over a short gradient bar with end values 0 and 30.
      Data: one continuous Lorenz attractor trajectory (two wings, butterfly shape) seen obliquely, coloured by an imprint_seq gradient from brand green #009E73 (start, the spiral-out of the left wing and the first large outer loop) to blue #4467A3 (late loops), thin lines at 0.85 opacity; the tightly wound left-wing centre is dense but traceable as a spiral.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black, matches #1A1A17.
      Chrome: title, tick labels, axis names and key text in light ink; axis and tick lines light grey; no dark-on-dark text anywhere.
      Data: identical geometry and identical gradient colours to the light render (green to blue); the blue late loops are slightly dimmer on the dark surface but clearly visible; brand green reads well.
      Legibility verdict: PASS
