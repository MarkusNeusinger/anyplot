review:
  strengths:
  - 'A real oblique 3D view (elevation 20°, azimuth 55°) built from a projection matrix:
    the X and Y floor edges and the vertical Z edge are drawn with ticks in the original
    units, and tick labels and axis titles point away from the data onto empty canvas'
  - The 2,000-point Lorenz trajectory is drawn as sequential segments colored by time
    through a LinearColorMapper on the imprint_seq ramp (green to blue), with a ColorBar
    titled 'Time (s)'; both lobes and the initial transient read clearly as smooth
    curves
  - 'Library-native interactivity: an invisible scatter layer with hover_fill_color
    and a HoverTool reports time, x, y and z in original units in the HTML version'
  - Theme tokens are threaded through every element (title, axis lines, ticks, labels,
    color bar); both renders are fully legible and the data colors are identical between
    themes
  weaknesses:
  - 'VQ-05 (both): the hidden 2D axes still draw a dashed screen-space grid and an
    outline frame across the plot area; those lines correspond to none of the three
    drawn 3D axes and read as false reference lines behind the projection → remove
    the grid and the frame. Likely cause: p.xgrid/p.ygrid grid_line_color = INK and
    p.outline_line_color = INK_SOFT kept after p.xaxis/p.yaxis.visible = False.'
  - 'VQ-03 (both): the trajectory is drawn at line_width=4 with alpha 0.85 on the
    3200 px canvas, so the strands thin to hairlines in the 400 px thumbnail → about
    6 px (+2 px), keeping the alpha so close loops stay traceable. Likely cause: p.segment(line_width=4).'
  - 'Suggestion: solve_ivp from scipy.integrate with a dense t_eval would replace
    the hand-written Euler loop and give a more accurate trajectory.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, with a faint dashed screen-space grid and a thin grey outline frame left over from the hidden 2D axes.
      Chrome: bold title "Lorenz Attractor · line-3d-trajectory · python · bokeh · anyplot.ai" top left at about 65 % of the width; drawn 3D axes in dark grey: Y (state) along the left floor edge (ticks 20, 0, -20), X (state) along the right floor edge (ticks -10, 0, 10, 20), Z (state) vertical on the right (ticks 0, 20, 40), with bold axis titles. The color bar on the right runs 0-10 with the italic title "Time (s)". All text is dark and readable.
      Data: one continuous Lorenz trajectory of 2,000 points: the outer green transient spirals into the two lobes, and the color shifts along the path from brand green #009E73 (t=0) to blue #4467A3 (t=10). Lines are about 4 px with slight transparency; the loops are individually traceable.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17 with the same faint dashed grid and outline frame.
