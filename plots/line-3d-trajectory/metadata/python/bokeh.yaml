review:
  strengths:
  - 'The line is drawn as bokeh segments whose line_color uses a {''field'': ''t'',
    ''transform'': LinearColorMapper} transform, giving a vectorized imprint_seq time
    gradient explained by a ColorBar titled ''Time (s)'''
  - 'Theme tokens are threaded through every chrome element: title, 3D axis lines,
    arrowheads, axis labels, color-bar labels and frame read cleanly on both #FAF8F1
    and #1A1A17'
  - HoverTool on a thinned point layer reports the original, unprojected X/Y/Z state
    and time, so the HTML view recovers exact values the projection hides
  - Classic Lorenz parameters (sigma=10, rho=28, beta=8/3) with 1500 deterministic
    points show the two-lobed butterfly from an oblique view (elev 20, azim 55) that
    reveals all three dimensions
  weaknesses:
  - 'VQ-02 (both): the 3D axes start at the standardized origin in the middle of the
    attractor, so the ''Z (state)'' and ''X (state)'' labels and the X arrowhead sit
    on top of trajectory strands → place the axis triad at a corner of the data''s
    bounding box (e.g. the min corner) so labels sit on empty canvas. Likely cause:
    origin = project(0, 0, 0) with axis_length=2.5 in standardized space.'
  - 'VQ-03 (both): the hover-target scatter (size 18, INK_SOFT, alpha 0.12) shows
    as about 100 stray grey specks along the line in the static PNG → make the hover
    targets invisible in the render (alpha 0 / fill_alpha 0, keeping hover_alpha).
    Likely cause: scatter alpha=0.12.'
  - 'SC-02 (both): the large first outer loop (t ≈ 0–1 s) reads as a polygon with
    visible straight segments and corners, not a smooth curve as the first ''A good
    version shows:'' bullet asks → integrate with a smaller step (e.g. dt=0.005 with
    more points, or scipy.integrate.solve_ivp with dense t_eval) so fast segments
    stay short. Likely cause: Euler step dt=0.01 where the trajectory moves fastest.'
  - 'SC-03 (both): the drawn 3D axes carry no ticks or values and are shorter than
    the data extent, so no x, y or z value can be read off the static render → add
    a few value ticks along each drawn axis spanning the data range. Likely cause:
    axis lines drawn without tick marks, axis_length=2.5 in standardized units.'
  - 'CQ-01 (code): a project() helper function breaks the Imports → Data → Plot →
    Save structure → inline the projection as vectorized expressions on arrays (stack
    the origin and axis endpoints with the data before projecting). Likely cause:
    def project(px, py, pz).'
  - 'Suggestion: the dashed 2D grid lives in projection space and means nothing for
    the 3D data; dropping it would quiet the background.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 page and plot area, thin INK_SOFT frame around the plot area, faint dashed projection-space grid.
