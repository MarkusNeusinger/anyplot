      Data: one continuous Lorenz trajectory, 1500 points, colored by time on imprint_seq from brand green #009E73 (t=0) to blue #4467A3 (t=15); two-lobed butterfly from an oblique view; the first outer loop shows visible straight segments; faint grey hover dots along the line; axis labels Z and X sit on strands.
