review:
  strengths:
  - Lorenz attractor with standard parameters shows the transient and both wings as
    one continuous smooth path
  - Theme tokens threaded through title, axis text and legend; both renders readable
  weaknesses:
  - 'VQ-05 (both): canvas is 4800x2700 → 3200x1800 (−1600 × −900). Likely cause: ggsize(1600,
    900) with scale=3 instead of ggsize(800, 450) with scale=4.'
  - 'VQ-07, DE-01 (both): time is encoded with viridis (purple-yellow), a colormap
    outside Imprint → imprint_seq via scale_color_gradient(low=''#009E73'', high=''#4467A3'').
    Likely cause: scale_color_viridis().'
  - 'SC-01, SC-02 (both): the trajectory is drawn flat in the x-y plane with no z
    axis and no oblique view, so it is a 2D line plot rather than a 3D one (C2) →
    project x, y, z obliquely and draw and label all three axes. Likely cause: aes(x=''x'',
    y=''y'') on the raw coordinates.'
  - 'SC-03 (both): z is computed but mapped to nothing, so one of the three data dimensions
    is not visible → map z through the projection. Likely cause: z left out of aes.'
  - 'SC-04 (both): title ''line-3d-trajectory · letsplot · anyplot.ai'' lacks the
    language segment → ''line-3d-trajectory · python · letsplot · anyplot.ai''. Likely
    cause: the title string.'
  - 'VQ-06 (both): axis titles ''X Coordinate'' / ''Y Coordinate'' carry nothing beyond
    the letter → name the Lorenz variables (for example ''x (convection)''). Likely
    cause: labs(x=..., y=...).'
  - 'DE-02 (both): major grid drawn in full-opacity INK at size 0.2 competes with
    the path → INK at 15 % (rgba) or no grid. Likely cause: panel_grid_major=element_line(color=INK).'
  - 'CQ-03 (code): `from lets_plot import *` with noqa F403/F405 suppressions on every
    line → named imports. Likely cause: star import.'
  - 'CQ-04 (code): line 56 computes z_norm, which is never used, and the comments
    on lines 52 and 59 claim z is encoded as colour while colour is time → remove
    z_norm and correct the comments. Likely cause: leftover from an abandoned encoding.'
