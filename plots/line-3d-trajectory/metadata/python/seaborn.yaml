    cropping plus a default zlabel position.'
  - 'VQ-05 (both): canvas is 2161x2298 instead of 3200x1800 or 2400x2400 → 3200x1800
    (+1039 x -498). Likely cause: figsize=(16, 9) at dpi=300 with bbox_inches=''tight''.'
  - 'VQ-01, VQ-07 (dark): legend entries ''Trajectory Start'' / ''Trajectory End''
    render black on the #1A1A17 background and cannot be read → INK text color. Likely
    cause: legend text color not set from INK.'
  - 'VQ-07 (both): time coloring uses viridis → imprint_seq. Likely cause: plt.cm.viridis.'
  - 'VQ-06 (both): axis titles are bare X, Y, Z → name the quantities. Likely cause:
    set_xlabel(''X'') etc.'
  - 'SC-04 (both): title ''line-3d-trajectory · seaborn · anyplot.ai'' lacks the language
    segment → ''line-3d-trajectory · python · seaborn · anyplot.ai''. Likely cause:
    title string.'
  - 'SC-02 (both): the time gradient has no colorbar or legend naming the variable
    it encodes (C3) → add a colorbar labeled with the time variable. Likely cause:
    no fig.colorbar call.'
  - 'VQ-02 (both): x tick labels -20 and -15 run into each other → fewer or smaller
    ticks. Likely cause: default x locator at 16 pt tick size.'
  - 'CQ-04 (code): lines 46-47 draw the path with 1999 separate ax.plot calls → one
    Line3DCollection with set_array. Likely cause: per-segment loop.'
  - 'CQ-05 (code): savefig uses bbox_inches=''tight'' at dpi=300, which the seaborn
    prompt forbids → dpi=400 with default bbox. Likely cause: savefig arguments.'
  - 'Suggestion: transparent panes would reduce chrome around the attractor.'
