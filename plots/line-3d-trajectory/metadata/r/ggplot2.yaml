review:
  strengths:
  - Genuinely creative hand-rolled 3D-to-2D orthographic projection built entirely
    from ggplot2 primitives (geom_segment/geom_path/geom_text) instead of falling
    back to another library — respects the 'native capabilities only' rule while still
    delivering a real 3D trajectory visualization.
  - Depth-based alpha blending (near segments opaque, far segments faded) gives genuine
    depth cueing to the static 2D render.
  - 'Correct imprint_seq continuous gradient (#009E73 to #4467A3) mapped to time-in-trajectory,
    identical between light and dark themes as required.'
  - Physically accurate Lorenz attractor generated via RK4 integration with canonical
    sigma=10, rho=28, beta=8/3 parameters and a burn-in period to discard the transient.
  - Minimal 3-edge axis-box style keeps visual focus on the trajectory; theme_void
    chrome (title, axis labels, legend) is properly theme-adaptive in both renders.
  weaknesses:
  - Title (plot.title, hjust=0.5) centers on the panel area excluding the legend gutter,
    so it reads as visually left-shifted relative to the full canvas — consider accounting
    for legend width when centering, or center-justify against the full plot instead.
  - Noticeable empty space in the bottom-right and top-right quadrants around the
    legend; tightening plot.margin or repositioning the legend could balance whitespace
    better.
  - The 'Y' axis-title label sits close to a trajectory line crossing in both renders
    (no actual pixel overlap, but tight clearance) — nudge the label position slightly
    further from the projected corner.
  - Only a single trajectory is drawn; the spec's Notes mention multiple trajectories
    with different colors can help compare paths (an optional enhancement, not a required
    feature).
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "Lorenz Attractor · line-3d-trajectory · r · ggplot2 · anyplot.ai" in dark ink, clearly legible. Bold "X"/"Y"/"Z" axis-title labels in dark ink at the ends of the three projected axis edges. Tick labels (numeric values along X, Y, Z) in a softer gray, all legible. Legend titled "Time (s)" with a vertical continuous color bar and tick labels (0, 4, 8, 12) in soft gray, legend title in dark ink.
      Data: A butterfly-shaped Lorenz attractor trajectory rendered as a continuous line, colored on a green (#009E73) to blue (#4467A3) gradient representing elapsed time, with near-camera segments more opaque and far segments faded for depth cueing.
      Legibility verdict: PASS — all text is dark-on-light and clearly readable, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Title in light/white ink, clearly legible. Bold "X"/"Y"/"Z" axis-title labels in white. Axis lines and tick labels rendered in a soft light gray, all legible against the dark background. Legend "Time (s)" title in light ink, tick labels in soft gray.
      Data: Same butterfly-shaped Lorenz attractor trajectory with the identical green-to-blue time gradient and depth-based alpha fading as the light render — data colors match exactly, only chrome (background/text/axis colors) flipped.
      Legibility verdict: PASS — all text is light-on-dark and clearly readable; no dark-on-dark failures observed.
