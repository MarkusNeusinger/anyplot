review:
  strengths:
  - Hand-rolled 3D-to-2D orthographic projection (RK4-integrated Lorenz attractor)
    built entirely from native ggplot2 geoms (geom_segment/geom_path/geom_text) instead
    of falling back to another library — respects the 'native capabilities only' rule
    while delivering a genuine 3D trajectory visualization.
  - Depth-based alpha blending (near segments opaque, far segments faded) gives real
    depth cueing to the static 2D projection.
  - 'Correct Imprint imprint_seq continuous gradient (#009E73 to #4467A3) mapped to
    elapsed time, identical between light and dark renders.'
  - 'Physically accurate Lorenz attractor: canonical sigma=10, rho=28, beta=8/3 parameters,
    RK4 integration, and a burn-in period that discards the transient before the state
    settles onto the attractor.'
  - Minimal 3-edge axis-box style with theme_void keeps visual focus on the trajectory;
    theme-adaptive chrome (title, axis labels, tick labels, legend) is correct and
    fully readable in both renders.
  weaknesses:
  - Noticeable empty whitespace in the bottom-right and top-right quadrants around
    the legend in both renders — tightening plot.margin or repositioning the legend
    would balance canvas usage better.
  - plot.title uses hjust=0.5, which centers the title within the panel area excluding
    the legend gutter, so it reads as slightly left-of-center relative to the full
    canvas width — use plot.title.position = "plot" to center against the full plot
    width.
  - The 'Y' axis-title label sits close to a trajectory-line crossing point in both
    renders (no actual pixel overlap, but tight clearance) — nudge it slightly further
    from the projected corner for more breathing room.
  - Only a single trajectory is drawn; the spec's Notes mention multiple trajectories
    with different colors can help compare paths or initial conditions — an optional
    enhancement, not a required feature.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "Lorenz Attractor · line-3d-trajectory · r · ggplot2 · anyplot.ai" in dark ink, clearly legible, spanning roughly two-thirds of the canvas width. Bold "X"/"Y"/"Z" axis-title labels in dark ink at the projected axis ends; numeric tick labels (e.g. -20..20 on X/Y, 10..40 on Z) in soft gray. Legend titled "Time (s)" with a vertical continuous color bar and tick labels (0, 4, 8, 12) in soft gray. All chrome text is clearly readable against the light background — no light-on-light issues found.
      Data: A butterfly-shaped Lorenz attractor trajectory rendered as a continuous line on a green (#009E73) to blue (#4467A3) gradient encoding elapsed time, with depth-based alpha (near segments opaque, far segments faded) giving a sense of 3D depth. First/only series correctly starts at Imprint position 1 (#009E73).
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Title, axis-title labels ("X"/"Y"/"Z"), tick labels, and legend text ("Time (s)") are all rendered in light ink / soft light gray, clearly legible against the dark surface. No dark-on-dark failures observed anywhere (title, ticks, axis labels, legend all pass).
      Data: The trajectory uses the identical green-to-blue time gradient and identical depth-based alpha fading as the light render — data colors are pixel-for-pixel consistent between themes; only the chrome (background, text, axis-line color) flipped as expected.
      Legibility verdict: PASS
