review:
  strengths:
  - Correct, idiomatic Axis3 usage with full per-panel and per-spine theme-adaptive
    styling
  - Data colored by time with the Imprint sequential colormap (green→blue), matching
    the spec's time-progression encoding, with a properly labeled colorbar
  - 'First categorical color (start marker) is exactly Imprint brand green #009E73,
    identical between light and dark renders'
  - Theme-adaptive chrome correctly implemented — all text legible in both themes,
    backgrounds match Imprint spec values exactly
  - Clean, deterministic RK4 integration of the classic Lorenz system with correct
    textbook parameters
  weaknesses:
  - Axis labels are generic single letters "X"/"Y"/"Z" with no additional context
    — acceptable given the Lorenz system has no physical units, but scores low on
    the strict VQ-06 rubric
  - The 3D bounding box + colorbar leave some unused whitespace on the sides/top of
    the canvas — consider enlarging the Axis3 relative width (colsize!) or tightening
    figure margins
  - Only a single trajectory is shown; the spec notes multiple trajectories with different
    initial conditions as a nice-to-have for comparison — not required, but would
    strengthen data storytelling
  - Dense self-overlap of the line near the attractor's inner spiral is inherent to
    the math but could be softened slightly with alpha < 1 on the line
