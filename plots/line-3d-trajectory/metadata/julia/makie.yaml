review:
  strengths:
  - 'Correct Imprint palette usage: first (main) trajectory colored via the imprint_seq
    gradient starting at #009E73, diverged trajectory uses canonical palette position
    2 (#C475FD)'
  - 'Genuine data storytelling: two nearby initial conditions (Δx0 = 0.001) are integrated
    and only the diverged tail of the perturbed run is drawn, avoiding a fully-overlapping
    duplicate line while making the butterfly-effect fork the visual focal point'
  - 'Full theme-adaptive chrome: panel backgrounds, spines, grid, tick/axis label
    colors, and legend all correctly flip between the FAF8F1/1A1A17 tokens with data
    colors held identical across renders'
  - 'Physically correct data: classic Lorenz parameters (sigma=10, rho=28, beta=8/3)
    with a deterministic custom RK4 integrator (no randomness needed, fully reproducible)'
  - Colorbar encodes time progression as the spec explicitly suggests, with a clear
    'Time' label
  - Title and legend format are spec-compliant; legend text clearly explains the second
    trajectory
  weaknesses:
  - 'VQ-05: Whitespace is imbalanced — the 3D axis box sits with a large empty margin
    on the left while the colorbar hugs the right edge, and there is a large empty
    gap between the bottom of the 3D plot and the legend row. Tightening colsize!/rowsize!
    or centering the Axis3 within its column would balance margins better.'
  - 'VQ-06: X/Y/Z axis labels are minimal single letters with no additional context
    (acceptable convention for Lorenz phase-space coordinates, but a small caption
    or axis label like ''X (state variable)'' would score higher).'
  - 'CQ-01: The `integrate_lorenz` helper function deviates from the strict KISS ''Imports
    -> Data -> Plot -> Save, no functions'' structure — justified here since RK4 integration
    needs a loop, but a fully inlined version would score higher on this axis.'
  - The inner spiral of the attractor (left wing) is visually dense with many overlapping
    loops; a slightly thinner linewidth or lower alpha in that region could reduce
    clutter without losing the shape.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "line-3d-trajectory · julia · makie · anyplot.ai" is bold dark text, clearly readable, centered near the top. X/Y/Z axis labels and tick labels render in dark ink / soft grey, all legible. Grid lines on the 3D panels are subtle light grey, visible but not dominant. The horizontal legend below the plot ("Diverged path from a perturbed initial condition (Δx0 = 0.001)") is dark text on the light background, fully readable. Colorbar labeled "Time" on the right has readable ticks (0, 10, 20).
      Data: Main Lorenz trajectory is drawn as a continuous line colored by a sequential gradient starting at #009E73 (brand green) at t=0 and transitioning toward blue as time progresses — a green filled circle marks the start point. The diverged trajectory (second nearby initial condition) is a dashed lavender/purple line (#C475FD-family), with a matching lavender dot marking the fork point. Both wings of the classic Lorenz "butterfly" attractor are visible, and the fork between the two trajectories is clearly visible as a color/style-distinct dashed overlay near the top-right lobe.
      Legibility verdict: PASS — all text is clearly readable against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Title, axis labels, and tick labels are rendered in light off-white/soft-grey tones, clearly legible against the dark background. Grid lines remain subtle (low-alpha light grey). Legend text below the plot is light-colored and fully readable on the dark background. Colorbar label and ticks are light-colored and legible.
      Data: The main trajectory's color gradient (green -> blue) and the diverged trajectory's lavender dashed line are visually identical in hue to the light render — confirming data colors are held constant between themes. Both are clearly distinguishable against the dark panel background, with no color shifted or washed out.
      Legibility verdict: PASS — no dark-on-dark failures observed; all title/axis/tick/legend text is clearly visible against the dark background.
