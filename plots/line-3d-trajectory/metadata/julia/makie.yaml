review:
  strengths:
  - Theme-adaptive chrome is fully correct in both renders — backgrounds, ink, grid,
    and spine colors all flip correctly with no dark-on-dark or light-on-light failures
  - 'First categorical color (start marker) is exactly Imprint brand green #009E73,
    identical between light and dark renders'
  - Correct, idiomatic Axis3 usage with the Imprint sequential colormap (green→blue)
    for time progression, paired with a properly labeled colorbar
  - Clean, deterministic RK4 integration of the classic Lorenz system with correct
    textbook parameters (sigma=10, rho=28, beta=8/3), no RNG needed
  weaknesses:
  - 'CRITICAL: The second/perturbed trajectory line (traj2_line, color = IMPRINT_PALETTE[2]
    #C475FD) and its fork-point scatter marker are completely invisible in BOTH plot-light.png
    and plot-dark.png. Verified with an exhaustive pixel scan of the full 3200x1800
    canvas in each render: zero pixels matching the lavender/purple hue exist anywhere.
    The code computes and draws this second trajectory but nothing visibly renders.'
  - 'CRITICAL: The Legend(fig[2, 1:2], ...) describing the diverged path is also completely
    absent from both renders — the canvas ends immediately after the X/Y axis tick
    labels near the bottom edge, with no legend row visible at all. This points to
    row 2 of the Figure''s GridLayout being collapsed to near-zero height (likely
    because Axis3''s default vertical sizing consumes the full 900px figure height,
    leaving nothing for the legend row). Try explicit rowsize!(fig.layout, 2, ...)
    tuning or reduce Axis3''s effective height — and visually confirm the legend actually
    appears in the saved PNG before resubmitting.'
  - Because of the two issues above, the 'multiple trajectories to compare paths'
    enhancement added since attempt 1 has zero visible effect — the rendered plot
    still shows only a single spiral with a green start dot, the same core weakness
    flagged in the previous (rejected) review ('only a single trajectory is shown').
    The added integration/fork-detection/legend code is real but currently produces
    no visual value.
  - Axis labels are still generic single letters 'X'/'Y'/'Z' with no additional context
    — acceptable given the Lorenz system has no physical units, but scores low on
    the strict VQ-06 rubric
