review:
  strengths:
  - Faithful Lorenz attractor generated with a deterministic fixed-step RK4 integrator
    (σ=10, ρ=28, β=8/3, 4,200 steps) — physically accurate and fully reproducible.
  - Highcharts core has no 3D module; instead of faking interactivity or importing
    a forbidden add-on, the implementation honestly computes its own orthographic
    projection and draws the result as plain line series, documenting the tradeoff
    in comments.
  - Time progression is encoded as a fine-grained segmented color gradient along the
    trajectory (imprint_seq, green → blue) — identical data colors between light and
    dark renders, only chrome flips.
  - L-shaped X/Y/Z reference frame plus labeled start/end markers give useful spatial
    orientation cues that a bare line plot would lack.
  - 'Both renders are fully legible with correct theme-adaptive chrome (#FAF8F1 /
    #1A1A17 backgrounds, readable ink/inkSoft text) and no edge clipping.'
  weaknesses:
  - 'Interactive rotation/zoom — which the spec calls ''essential''/''critical'' for
    exploring 3D trajectory structure — is entirely absent: the projection is baked
    into fixed 2D coordinates, and every series additionally sets enableMouseTracking:false
    and tooltip:{enabled:false}, so there isn''t even fallback hover interactivity
    in the HTML output.'
  - Only a single trajectory is rendered; the spec notes that multiple trajectories
    with different colors help compare paths or initial conditions — not required,
    but would strengthen data storytelling.
  - The implementation uses Highcharts purely as an SVG line-drawing engine (no tooltip,
    no legend, no hover) and doesn't exercise any Highcharts-distinctive capability
    beyond basic line/scatter series.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Bold dark title "Lorenz Attractor · line-3d-trajectory · javascript · highcharts · anyplot.ai" and a smaller gray subtitle with the integration parameters are both clearly readable against the light background. The L-shaped X/Y/Z reference frame is drawn in a soft dark gray with black-ish "X", "Y", "Z" labels — all legible.
      Data: The Lorenz butterfly is drawn as a dense multi-loop line trajectory that transitions from brand green (#009E73-ish, at t=0 "start") through teal to blue ("end") — a fine segmented color gradient shows time progression smoothly. Start and end points are marked with small filled circles and light gray text labels, both readable.
      Legibility verdict: PASS.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Title and subtitle switch to white/light-gray text, clearly legible against the dark background. Axis reference lines and "X"/"Y"/"Z" labels switch to white/light gray — no dark-on-dark issue anywhere. "start"/"end" labels remain light gray and readable.
      Data: The green-to-blue trajectory gradient is pixel-identical to the light render — only the chrome (background, axis-frame color, text color) flips as expected.
      Legibility verdict: PASS.
