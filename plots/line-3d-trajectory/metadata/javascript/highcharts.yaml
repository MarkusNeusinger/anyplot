review:
  strengths:
  - Elegant hand-rolled 3D-to-2D orthographic projection (elevation 22°, azimuth 55°)
    that works around Highcharts core's missing 3D module, exactly as prompts/library/highcharts.md
    prescribes instead of shelling out to another library
  - Time-progression color gradient built correctly from window.ANYPLOT_TOKENS.seq,
    identical between light and dark renders — only chrome flips
  - Custom L-shaped X/Y/Z axis frame gives spatial orientation for the projected trajectory
    without a native 3D axis system
  - Real, physically motivated Lorenz attractor parameters (σ=10, ρ=28, β=8/3) surfaced
    in the subtitle — realistic and neutral data
  - Start/end markers with labels add a clear narrative anchor to the time-progression
    story
  - Tooltip formatter surfaces original (unprojected) x/y/z coordinates and time fraction
    on hover — strong use of the interactive HTML output
  - Canvas is exactly 3200x1800 with no clipped or overflowing elements in either
    render
  weaknesses:
  - Trajectory uses 4,200 integration steps, more than double the spec's suggested
    100-2000 point range — consider thinning the plotted points (or increasing DT)
    to land inside the guideline while keeping the curve smooth
  - The 'X'/'Y'/'Z' and 'start'/'end' labels are quite small (16px/13px) relative
    to the title — could be nudged up slightly for stronger presence at small preview
    sizes
  - True interactive 3D rotation (called out as 'critical' in the spec's Notes) isn't
    available since Highcharts core has no 3D module — an inherent library limitation
    rather than an implementation bug, but still a residual gap versus the spec's
    ideal
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Bold dark title "Lorenz Attractor · line-3d-trajectory · javascript · highcharts · anyplot.ai" (19px, scaled down for the 76-char length) is crisp and readable; gray subtitle with the sigma/rho/beta parameters is readable; the dark-gray L-shaped X/Y/Z axis frame and its labels are clearly visible against the light surface.
      Data: Trajectory is drawn as a fine chain of segments transitioning from Imprint brand green (#009E73, time=0, at the "start" marker) through teal/blue to a darker blue (time=1, at the "end" marker) — the classic Lorenz butterfly is fully legible with two spiral wings and a long initial transient loop. First-series green matches the Imprint palette convention.
      Legibility verdict: PASS — no light-on-light text, no illegible elements.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Title and subtitle flip to light/white text, both clearly legible; the axis frame line and X/Y/Z, start/end labels flip to light gray/white and remain fully readable against the dark surface — no dark-on-dark failures observed.
      Data: Trajectory colors (green-to-blue gradient, start/end marker fills) are visually identical to the light render — confirms only chrome tokens flipped, not the data-color mapping.
      Legibility verdict: PASS — no dark-on-dark text, brand green remains vivid on the dark surface.
