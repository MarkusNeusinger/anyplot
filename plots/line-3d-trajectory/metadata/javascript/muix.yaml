review:
  strengths:
  - 'Overplotting fix works: strokeOpacity dropped from 0.9 to 0.55 and strokeWidth
    from 2 to 1.5, so the dense inner spiral now reads as layered winding rings instead
    of a solid blob.'
  - The 'shared start' label was moved to a clear corner of the drawing area (via
    useDrawingArea's padded bounds) and connected with a dashed leader line, fully
    resolving the prior overlap with Trajectory B's spiral.
  - Added an italic 'normalized units' caption near the axis gizmo, giving the reader
    a magnitude reference that was missing before.
  - 'Correct Imprint palette use — Trajectory A is brand green (#009E73), Trajectory
    B is lavender (palette[1]); backgrounds are theme-correct (#FAF8F1 light / #1A1A17
    dark) in both renders, data colors identical across themes.'
  - Deterministic RK4 Lorenz integration with a realistic perturbation (x0=0.1000
    vs 0.1001) directly illustrates chaotic sensitivity to initial conditions — a
    strong, spec-aligned data choice.
  - 'Idiomatic MUI X usage: composes a custom SVG overlay via ChartContainer + useDrawingArea,
    the library''s documented pattern for chart types (3D projections) outside the
    built-in series set.'
  - Clean, deterministic, single-purpose code — no unused imports, no fake interactivity,
    skipAnimation set correctly.
  weaknesses:
  - The innermost loops of Trajectory B are still fairly dense even at opacity 0.55
    — a small further reduction (~0.4-0.45) on just the tightest coils would let the
    very center resolve even more cleanly, though this is no longer a hard readability
    problem.
  - The visualization is entirely custom SVG drawn over an empty ChartContainer, so
    it doesn't showcase MUI X's own series/tooltip/legend components — a real constraint
    of doing 3D projection on a 2D-only community library, not an oversight.
  - True interactive rotation (the spec calls it 'essential' for exploring 3D structure)
    isn't available — only a fixed isometric camera angle — an inherent MUI X community-surface
    limitation rather than something this implementation could add.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1, not pure white.
      Chrome: Title "line-3d-trajectory · javascript · muix · anyplot.ai" in bold dark ink, clearly legible, comfortably sized within the plot width. Legend (top right) with two color swatches and descriptive labels ("Trajectory A · x0=0.1000", "Trajectory B · x0=0.1001") in soft dark gray, fully legible and clear of the data. Axis gizmo (bottom left) with X/Y/Z labels plus a new italic "normalized units" caption, all in soft dark gray, legible. "shared start" annotation now sits in the clear top-left corner of the drawing area, connected to the actual start point by a dashed leader line — no longer crossed by trajectory lines.
      Data: Trajectory A is brand green (#009E73), Trajectory B is lavender/purple (palette[1]) — both densely wound near a shared origin, diverging into two separate "butterfly wing" loops, classic Lorenz-attractor shape. With opacity reduced to 0.55 and strokeWidth to 1.5, the inner loops now show distinct concentric winding rings instead of a solid blob, though the innermost coils are still fairly tight.
      Legibility verdict: PASS (all chrome text clearly readable, no overlap issues remain).

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17, not pure black.
      Chrome: Title in light off-white ink, legend and gizmo labels (including the new "normalized units" caption) in light soft gray — all clearly legible against the dark background, no dark-on-dark issues. "shared start" text sits in the clear top-left corner with its dashed leader line, fully legible with no crossing lines.
      Data: Trajectory colors are identical to the light render (green #009E73 and lavender palette[1]), confirming the palette rule that only chrome flips between themes. Same improved winding-ring visibility in the dense inner loops as the light render.
      Legibility verdict: PASS (no dark-on-dark failures, no label-overlap concerns).
