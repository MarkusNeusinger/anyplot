review:
  strengths:
  - The data is a real RK4 integration of the Lorenz system (σ=10, ρ=28, β=8/3, dt=0.01).
    It drops a 200-step transient and keeps 2,000 points per trajectory. The axis
    extents it reports (X −17 to +18, Y −22 to +24, Z +6 to +44) match the known size
    of the attractor.
  - Two initial states that differ only by 0.0001 in x₀ start from one shared marker
    and end at clearly different points. The example data itself shows sensitive dependence
    on initial conditions, the defining property of a chaotic attractor.
  - The oblique view (elev 24°, azim −40°) shows the full extent of both lobes in
    X, Y and Z. A translucent floor and dashed back walls give depth without competing
    with the data.
  - Each axis title is rotated to run parallel to its floor edge and pushed outward
    from the box. The titles carry the data range, so all three axes are labeled without
    clutter.
  - Thin translucent strands (1.2 px, opacity 0.5) keep the individual windings of
    the dense lobes traceable, as the Notes ask.
  - 'MUI X is used idiomatically: a custom SVG layer goes inside ChartsContainer and
    is placed with the useDrawingArea hook, skipAnimation is set, and every chrome
    color comes from the theme tokens, so both renders adapt correctly.'
  weaknesses:
  - 'VQ-03 (dark): the green Trajectory A strand at 1.2 px and opacity 0.5 renders
    as a dim dark-green line on #1A1A17 and recedes behind the purple strand, so the
    first series is noticeably harder to follow than the second → raise its visibility
    on the dark surface (stroke width about 1.6–1.8 px, +0.4 to +0.6 px, or opacity
    about 0.65–0.7, +0.15 to +0.2), applied to both series so the colors stay identical
    between themes. Likely cause: strokeWidth={1.2} with strokeOpacity={0.5} on the
    trajectory <path>.'
  - 'VQ-02 (both): the ''Shared start'' label (14 px mono, offset +12/−12 px from
    the marker) sits on top of several right-lobe strands, which run through the letters
    of ''Shared'' and behind ''start'' → place it in clear space (for example below-left
    of the marker, outside the inner loops) so no strand crosses the text. Likely
    cause: the fixed x+12, y−12 offset of the callout <text>.'
  - 'VQ-06 (both): the Y and Z axis titles use the abbreviation ''temp var'' (''Horizontal
    temp var (Y)'', ''Vertical temp var (Z)''), which reads like a shortened column
    identifier and is ambiguous (variation or variance) → spell it out, for example
    ''Horizontal temperature variation (Y)'' and ''Vertical temperature variation
    (Z)''. Likely cause: the Y and Z column constants.'
  - 'CQ-04 (code): lines 197–210 write out a Catmull-Rom spline (smoothPath) over
    2,000 points at dt = 0.01, where a plain polyline through the same vertices looks
    identical at this density. SUBSAMPLE = 1 makes the `(i - TRANSIENT) % SUBSAMPLE
    === 0` test on line 89 a no-op → draw each strand as `<polyline points={pts(...traj.points)}
    />` with the existing pts helper and drop SUBSAMPLE. Likely cause: smoothing and
    decimation knobs kept from a sparser draft.'
  - 'CQ-01 (code): besides the required component, the file defines module-level project()
    and axisLabel() functions plus nested px/pts/smoothPath/edgeTitle helpers inside
    TrajectoriesLayer → inline the one-off helpers (edgeTitle is called twice, axisLabel
    three times) as direct expressions where that keeps the code readable, leaving
    project() and px as the only helpers. Likely cause: helper-per-concern structure.'
  - 'Suggestion: short tick marks with a few values along the three labeled edges
    would let readers read approximate positions, not only the extents in the axis
    titles.'
  - 'Suggestion: the mono subtitle repeats all three axis names that the axis titles
    already show; a shorter line (for example ''2 trajectories · 2,000 points each
    · Δx₀ = 0.0001'') would sharpen the header.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the full canvas, not pure white.
      Chrome: the bold near-black title "line-3d-trajectory · javascript · muix · anyplot.ai" sits top-left, with a grey monospace subtitle under it listing 2 trajectories and 2,000 points per trajectory. A horizontal legend sits top-right: a green line for "Trajectory A (x₀ = 5.0000)" and a purple line for "Trajectory B (x₀ = 5.0001)". The 3D box has a dark-grey solid front floor edge and a solid Z edge, plus a faint translucent floor and dashed light-grey back walls. Bold dark axis titles run parallel to their edges: "Convection rate (X) [-17 to +18]", "Horizontal temp var (Y) [-22 to +24]", and the rotated "Vertical temp var (Z) [+6 to +44]". An X/Y/Z orientation triad and the mono note "elev 24°, azim -40°" sit bottom-left. All text is clearly readable in dark ink.
      Data: two Lorenz-attractor trajectories as thin translucent strands, green #009E73 (first series) and purple #C475FD (second). Both butterfly lobes are visible. Where the strands coincide they blend into a blue-grey. A black start dot labeled "Shared start" in mono sits near the center; the label overlaps a few right-lobe strands. A green end dot sits in the right lobe and a purple end dot below the central crossing.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17, not pure black.
      Chrome: the title, legend text, axis titles, triad letters and the "Shared start" label switch to light ink. The subtitle and the elev/azim note use a light-grey soft ink. The front edges turn light grey and the back walls a dim grey dash. No dark-on-dark text: everything is readable.
      Data: the same green and purple strands and marker colors as the light render; only the chrome flipped. The start marker turns light (ink token). The green strand at 1.2 px and opacity 0.5 reads noticeably dimmer than the purple one on the dark surface but is still traceable.
      Legibility verdict: PASS
