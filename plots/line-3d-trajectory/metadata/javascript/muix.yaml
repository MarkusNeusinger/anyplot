review:
  strengths:
  - Builds a custom SVG layer inside the community ChartsContainer and positions it
    with the useDrawingArea hook — the MUI X composition API used for a chart type
    MUI X has no native component for
  - Two Lorenz trajectories with initial conditions 0.1000 vs 0.1001, integrated with
    RK4 and a discarded transient, give a real sensitivity-to-initial-conditions story;
    values (x ±18, y ±25, z 5–45) are correct for σ=10, ρ=28, β=8/3
  - Oblique view with a translucent floor, a dashed back wall and a labeled orientation
    triad makes all three axes and their ranges readable
  - All chrome threads theme tokens (ink, inkSoft, grid, elevatedBg, pageBg); both
    renders are fully readable and the data colors are identical across themes
  - Legend for the two trajectories sits in the header band, clear of the data, and
    names each initial condition
  weaknesses:
  - 'SC-02 (both): the wings of the attractor are seen nearly edge-on, so both lobes
    collapse into thin slivers forming a ''V'' and the butterfly''s extent in the
    wing plane is flattened, against the bullet ''an oblique angle that reveals the
    path''s extent in every dimension'' → choose a view where both lobes open up as
    loops (for example elevation about 25–30° with an azimuth around 120–135°, or
    about −60°). Likely cause: AZIM_DEG = 32 lines up the projection with the plane
    of the wings.'
  - 'SC-02 (both): at the outer turns of the upper-right lobe the polyline shows visible
    facets and corners instead of a smooth curve, against the bullet ''enough points
    that a curved path reads as a smooth curve'' → halve the time step between drawn
    points (0.02 → 0.01 time units) while staying inside the spec''s 100–2000 points
    per trajectory, for example SUBSAMPLE = 1 with STEPS = 2400 (2,000 points after
    the transient). Likely cause: SUBSAMPLE = 2 with DT = 0.01 gives 0.02 time units
    per segment where the trajectory moves fastest.'
  - 'VQ-03 (both): Trajectory A (green) is drawn first and almost completely hidden
    under Trajectory B in the dense left lobe, and A''s end marker (near the bottom
    of the left lobe) is barely visible under B''s strands, so the two paths cannot
    be traced or compared there → lower the stroke opacity to about 0.45 and the width
    to about 1.2 px so both strands show through each other, and draw the end markers
    after both polylines. Likely cause: opacity={0.62} strokeWidth={1.65} on the polyline,
    and each end circle rendered inside its own trajectory''s group.'
  - 'VQ-02 (both): the ''Convection rate (X) [-18 to +18]'' axis title sits on the
    X axis edge line — the line runs through the first letters of ''Convection'' →
    offset the label about 14 px further below the edge (+14 px on y). Likely cause:
    the label at (c0+c1)/2 + 28 px does not account for the slope of the edge.'
  - 'VQ-05 (both): the attractor occupies only about a fifth of the canvas width (roughly
    x 830–1170 of 2000 in the displayed render) and the wireframe box about 37 %,
    leaving large empty bands on the left, right and top → let the data fill about
    60–70 % of the width. Likely cause: the scale is fitted to the full unit cube
    plus PAD_X_SHARE = 0.12 / PAD_Y_SHARE = 0.14, while the edge-on view keeps the
    data itself narrow.'
  - 'CQ-04 (code): lines 203–226 repeat the same pixel-mapping expression six times
    for c0, c1, c2, c3, c5, c6 → one helper mapping, for example `const px = (p) =>
    ({ x: offsetX + (p.sx - DOM_X0) * scale, y: offsetY + (DOM_Y1 - p.sy) * scale
    })` used as `projectedCube.map(px)` and for the polyline points at lines 332–343.
    Likely cause: the projection was unrolled per corner.'
  - 'Suggestion: a color gradient along time (imprint_seq) with a color bar, as the
    Notes suggest, would show where the two trajectories begin to separate.'
  - 'Suggestion: the ''Shared start'' leader line crosses the dense strands of the
    left lobe; a shorter leader would keep the lobe cleaner.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, not pure white.
      Chrome: bold title "line-3d-trajectory · javascript · muix · anyplot.ai" top left with a monospace subtitle "2 trajectories · 1,800 points per trajectory (...)"; inline legend top right (green line Trajectory A x₀ = 0.1000, purple line Trajectory B x₀ = 0.1001). Oblique 3D box: translucent floor, dashed back wall, solid dark outer edges labeled "Convection rate (X) [-18 to +18]", "Horizontal temp var (Y) [-25 to +24]", "Vertical temp var (Z) [5 to 45]". Orientation triad X/Y/Z bottom left with "elev 20°, azim 32°". All dark text readable; the X axis title sits on its edge line.
      Data: two Lorenz trajectories as thin translucent polylines, first #009E73 green, second purple; the attractor appears as a narrow V with two slender lobes, B largely covering A in the left lobe; a black "Shared start" dot with a dashed leader and small end markers. Outer turns of the upper-right lobe show polygonal facets. Data occupies about a fifth of the width.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17, not pure black.
      Chrome: title, subtitle, legend, axis titles, triad labels all in light ink; edges in light gray, back wall dashed gray. No dark-on-dark text.
      Data: identical green and purple trajectories as in the light render; the shared-start dot flips to light ink with a dark outline. Same layout and same overlap of B over A.
      Legibility verdict: PASS
