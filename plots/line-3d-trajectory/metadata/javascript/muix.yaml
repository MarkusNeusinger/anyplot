review:
  strengths:
  - 'Correct Imprint palette use — Trajectory A is brand green (#009E73), Trajectory
    B is lavender (palette[1]); backgrounds are theme-correct (#FAF8F1 light / #1A1A17
    dark) in both renders.'
  - Deterministic RK4 Lorenz integration with a realistic perturbation (x0=0.1000
    vs 0.1001) directly illustrates chaotic sensitivity to initial conditions — a
    strong, spec-aligned data choice.
  - 'Idiomatic MUI X usage: composes a custom SVG overlay via ChartContainer + useDrawingArea,
    the library''s documented pattern for chart types (3D projections) outside the
    built-in series set.'
  - 'Thoughtful storytelling touches: shared-start marker, axis-orientation gizmo,
    and a descriptive two-line legend with subscripted x0 values.'
  - Clean, deterministic, single-purpose code — no unused imports, no fake interactivity,
    skipAnimation set correctly.
  weaknesses:
  - 'Overplotting not mitigated in the dense inner spiral: strokeOpacity is 0.9 (near-opaque)
    despite ~1800 points per trajectory, so the tightly-wound inner loops merge into
    a solid purple blob that hides the winding structure. Lower opacity to roughly
    0.5-0.6 (and/or thin strokeWidth slightly) so overlapping loops stay readable,
    per the data-density heuristic for >500-point series.'
  - The axis gizmo shows only bare X/Y/Z letters with no scale or units, so VQ-06
    credit is limited — there is no way to read absolute magnitude from the chart.
    Consider a small 'normalized units' caption near the gizmo or a numeric tick on
    one arm.
  - The 'shared start' label sits inside the densest part of Trajectory B's spiral;
    multiple lines cross through the text in both renders, mildly hurting legibility.
    Move the label into a clearer gap or add a short leader line away from the busiest
    region.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1, not pure white.
      Chrome: Title "line-3d-trajectory · javascript · muix · anyplot.ai" in bold dark ink, clearly legible. Legend (top right) with two color swatches and descriptive labels ("Trajectory A · x0=0.1000", "Trajectory B · x0=0.1001") in soft dark gray, legible. Axis gizmo (bottom left) with X/Y/Z labels in soft dark gray, legible. "shared start" annotation in soft gray sits inside the densest part of the purple spiral, partially crossed by trajectory lines — reduced but still readable contrast.
      Data: Trajectory A is brand green (#009E73), Trajectory B is lavender/purple (palette[1]) — both densely wound near a shared origin, diverging into two separate "butterfly wing" loops, classic Lorenz-attractor shape. Inner loops of Trajectory B render as a near-solid purple blob due to high line opacity (0.9) over ~1800 overlapping points.
      Legibility verdict: PASS (all chrome text readable; "shared start" label is a minor readability concern, not a failure).

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17, not pure black.
      Chrome: Title in light off-white ink, legend and gizmo labels in light soft gray — all clearly legible against the dark background, no dark-on-dark issues. "shared start" text is soft light gray, legible but again sits inside the densest spiral region with lines crossing through it.
      Data: Trajectory colors are identical to the light render (green #009E73 and lavender palette[1]), confirming the palette rule that only chrome flips between themes. Same overplotting concern in the dense inner loops.
      Legibility verdict: PASS (no dark-on-dark failures; same minor label-overlap concern as light render).
