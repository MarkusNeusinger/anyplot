review:
  strengths:
  - Hand-rolled orthographic 3D-to-2D projection (no echarts-gl) correctly normalizes
    X/Y/Z to a shared scale so the Lorenz attractor's two wings render undistorted
  - Depth-sorted, alpha-faded line segments approximate hidden-line rendering and
    keep the dense, self-overlapping chaotic curve readable instead of a solid smear
  - Time progression is correctly encoded with the Imprint sequential ramp (imprint_seq),
    with a matching bottom-left color-key legend showing t=0..t=48
  - Data colors are identical between light and dark renders; only chrome (axis lines,
    tick/title ink, background) flips as required
  - Title exactly matches the required '{spec-id} · {language} · {library} · anyplot.ai'
    format
  - Deterministic RK4-integrated Lorenz attractor with fixed parameters — fully reproducible,
    no RNG needed
  weaknesses:
  - 'AR-09 Edge Clipping: the X-axis maximum tick label (''20'') is chopped off at
    the canvas''s right edge in BOTH plot-light.png and plot-dark.png — pixel-level
    inspection shows non-background glyph pixels running all the way to the last column
    (x=2399 of 2400) at rows 1314-1332, with the ''0'' character entirely missing.
    The label''s computed center sits at physical x≈2401 (just past the 2400px canvas
    edge) — pull SIDE_MARGIN/PAD in toPixel()/axisTitle() so the full frameCorners
    extent (including tick-label pixel offsets, not just the tick marks) is guaranteed
    inside [SIDE_MARGIN, size.width-SIDE_MARGIN] before scaling.'
  - 'AR-09 Edge Clipping (more severe, same root cause): the Y-axis maximum tick label
    (''28'') and the entire ''Y'' axis-title letter never appear on the canvas at
    all — their computed centers (~x=2746 and ~x=2412 respectively) land past the
    right edge, so they are 100% invisible in both renders. The Y axis ends up unlabeled
    (no ''Y'' title anywhere) and missing one of its three tick values.'
  - 'Root cause for repair: the fit-to-canvas step (boxW/boxH/scale/PAD in the ''Fit
    the projected bounding box into the mount'' section) only fits the trajectory
    + frameCorners geometry, but the tick-label and axis-title pixel offsets (xTick*2.2,
    yTick*2.2, zTick*2.2, plus the [34,0]/[0,34]/[0,-34] title offsets) are added
    AFTER that fit and are not themselves accounted for in the bounding-box/PAD budget
    — so labels near the box''s rightmost corner (Y axis, which sits at the xMax corner)
    can end up outside the canvas even though the frame itself fits. Increase PAD
    or explicitly include the projected tick-label/title positions (not just data
    corners) in the extent computation used to derive scale/origin.'
  - The Z-axis minimum tick label ('0') is not visible in either render either — worth
    double-checking whether it is hidden behind the dense trajectory near the attractor's
    convergence point (VQ-02 overlap) rather than off-canvas; the repair should verify
    all 9 tick labels (3 per axis) plus all 3 axis titles are visible and non-overlapping
    after the fix above.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1), correct.
      Chrome: Title "line-3d-trajectory · javascript · echarts · anyplot.ai" is centered, dark ink, fully readable. Axis frame drawn as three hand-projected edges (X, Y, Z) with tick marks and numeric labels, plus a bottom-left "time" color-key legend with "t=0"/"t=48" labels — all readable.
      Data: Lorenz-attractor "butterfly" trajectory rendered as thousands of thin depth-sorted line segments, colored along the Imprint sequential ramp (t.seq[0] green -> t.seq[1] blue) to encode elapsed time. First-in-time color is the brand green, consistent with palette rules.
      Defect found (pixel-verified): the X-axis maximum tick label ("20") is cut off at the canvas's right edge — only a partial "2" glyph survives (columns up to the very last pixel column, x=2399, are non-background) and the "0" is completely gone, in both this render and the dark render. Separately, the Y-axis maximum tick label ("28") and the entire "Y" axis-title letter are absent from the canvas altogether (their computed pixel centers land at x≈2745 and x≈2412 respectively, both past the 2400px-wide canvas, so the whole label/title never appears) — the Y axis is left completely unlabeled with an incomplete tick set (only "-24" and "2" visible, "28" missing; no "Y" title anywhere in the image).
      Legibility verdict: FAIL — axis content is factually chopped off / entirely missing at the canvas border (AR-09).

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17), correct.
      Chrome: Same layout as light; title, ticks, and legend text recolor correctly to light ink on dark background — no dark-on-dark failures observed for the chrome that IS visible.
      Data: Same Lorenz trajectory, same Imprint sequential colors as the light render — data colors match exactly (only chrome flipped), as required.
      Defect found (pixel-verified): identical to the light render — a byte-for-byte-matching cluster of non-background pixels at columns 2394–2399, rows 1314–1332, confirms the same "20" X-tick clipping, and the same absence of the "28" Y-tick and "Y" axis title.
      Legibility verdict: FAIL — same AR-09 edge-clipping / missing-content defect as the light render.
