review:
  strengths:
  - AR-09 edge-clipping from Attempt 1 is completely fixed - no clipped or off-canvas
    text in either render
  - 'Creative, technically sound workaround for 3D trajectories without echarts-gl:
    RK4-integrated Lorenz attractor, orthographic axonometric projection, back-to-front
    depth sorting with depth-faded alpha'
  - Correct, theme-adaptive use of the Imprint sequential colormap (imprint_seq) for
    the continuous time variable, identical data colors across themes
  - Deterministic, dependency-free code with a clean mount-node contract implementation
  weaknesses:
  - The chart + axis frame only fill roughly 60% of the canvas width and 40% of its
    height, leaving a large, visually dead band between the axis frame and the bottom-left
    time legend. The Math.min(drawW/(boxW*PAD), drawH/(boxH*PAD)) fit is width-bound
    because the projected bounding box (data + axis frame + tick-label anchors) is
    much wider than tall relative to the square canvas - tighten the fit (e.g. re-balance
    elevation/azimuth so the projected box is closer to square, shrink SIDE_MARGIN/TOP_MARGIN/BOTTOM_MARGIN,
    or scale the two axes independently within drawW/drawH instead of a single shared
    scale) so the trajectory actually fills the available canvas.
  - The Z-axis tick labels ("48" and "24") land directly inside the trajectory's left
    coil, overlapping the dense line clutter. Z_CORNER_X = xMax, Z_CORNER_Y = yMin
    was chosen as "the far corner," but for this attractor's geometry that corner's
    screen projection sits in the middle of the data rather than clear of it. Pick
    the Z-axis screen corner by comparing the four candidate (x in {xMin,xMax}, y
    in {yMin,yMax}) corners' actual projected screen position against the data's screen
    bounding box, and use whichever one is farthest from the trajectory's own projected
    centroid - not a fixed (xMax, yMin) assumption.
  - 'The spec calls interactive rotation/zoom "essential" and "critical" for this
    plot type twice, and the implementation is entirely static (silent: true on every
    graphic element, no drag-to-rotate, no dataZoom). Given echarts-gl is unavailable,
    consider adding a lightweight custom drag-rotate handler (recompute AZIMUTH/ELEVATION
    from mousedown/mousemove deltas and re-run chart.setOption) to deliver on the
    spec''s core interactivity requirement in the HTML output, which would also strengthen
    LM-02.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1, not pure white.
      Chrome: Title "line-3d-trajectory · javascript · echarts · anyplot.ai" centered and fully readable in dark ink. X/Y/Z axis frame lines, tick marks, and numeric tick labels (dark grey) plus single-letter axis titles (bold dark) are all legible. Bottom-left "time" color-key legend with t=0/t=48 labels is clear.
      Data: Lorenz-attractor trajectory drawn as thin depth-sorted line segments colored along the Imprint sequential ramp (#009E73 -> #4467A3) for time progression; first/only data channel correctly uses imprint_seq (continuous), not the categorical palette.
      Legibility verdict: PASS overall, with a caveat - the Z-axis tick labels "48" and "24" are positioned inside the dense coil of the trajectory's left wing, overlapping the data lines and reducing local contrast (not unreadable, but cluttered).

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17, not pure black.
      Chrome: Same title, axis frame, tick labels, and axis titles recolored to light ink/white - all clearly visible against the dark background. No dark-on-dark failures found.
      Data: Confirmed pixel-identical trajectory colors to the light render; only chrome (title, axis lines/labels, legend text) flips theme, as required.
      Legibility verdict: PASS overall, same Z-tick/data overlap caveat as the light render reproduces identically.

    Additional note: verified no AR-09 edge clipping in either render (Attempt 1's clipped "20" tick and off-canvas "28"/"Y" label are fixed). Both renders instead show a canvas-utilization problem: the trajectory + axis frame occupy only ~60% width / ~40% height of the 2400x2400 square canvas, leaving a large empty band between the axis frame and the legend.
