review:
  strengths:
  - Genuine hand-rolled 3D projection with real interactive drag-to-rotate (mousedown/mousemove
    rebuild the option), not simulated interactivity — necessary since echarts-gl
    is unavailable in this environment.
  - Dynamic Z-axis-corner selection plus back-to-front depth sorting with depth-based
    alpha fade correctly approximates hidden-line rendering on the dense, self-overlapping
    Lorenz attractor.
  - Continuous time variable is encoded with the Imprint sequential ramp (t.seq) and
    a clear, well-labeled time-progression key (t=0 to t=48), matching the style guide's
    rule for single-polarity continuous data.
  - 'Both renders are theme-correct: chrome (ink, inkSoft, background) flips between
    light and dark while trajectory colors stay pixel-identical.'
  - Deterministic RK4-integrated Lorenz attractor is a canonical, neutral, appropriately-scaled
    3D trajectory example that fully matches the spec's suggested use case.
  weaknesses:
  - Only rotation is wired up interactively; the spec calls out 'rotation and zoom'
    as both critical for exploring 3D structure, but no wheel/scroll zoom handler
    exists.
  - The X-axis tick label ('-18') and the 'X' axis title sit close together near the
    axis-frame corner where thin trajectory strands cross in both renders — not a
    hard overlap, but the region is visually crowded; nudge the label offsets or pick
    a corner farther from the data path.
  - 'CQ-01: the script leans on many small helper functions (projectRaw, outwardPixel,
    axisLine, tickMark, tickLabel, axisTitle, buildOption) — justified by building
    3D projection math from scratch, but it reads as more function-heavy than a typical
    KISS single-script plot.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1), matches the target light surface — not pure white.
      Chrome: Title "line-3d-trajectory · javascript · echarts · anyplot.ai" centered at top in dark ink, fully visible. A hand-drawn 3-edge axis frame (X, Y, Z) sits lower-right with dark-ink tick marks, tick labels (-18/1/20, -24/2/28, 0/24/48), and bold axis titles X/Y/Z. A "time" gradient legend key (green-to-blue bar with t=0 / t=48 labels) sits bottom-left, clear of the data.
      Data: The Lorenz attractor's two "wings" are drawn as a dense, continuously-colored line, transitioning from Imprint green (#009E73, t=0) to blue (t=48) as time progresses, with thin depth-faded strokes that keep the self-overlapping coils readable.
      Legibility verdict: PASS — all title, axis, tick, and legend text is dark-on-light and clearly readable. Minor crowding where the "-18" x-tick label and the "X" axis title sit close to the axis-frame corner near a few thin trajectory strands, but no pixels are obscured or unreadable.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17), matches the target dark surface — not pure black.
      Chrome: Same title, axis frame, ticks, and legend key as the light render, now rendered in light ink/off-white against the dark surface. No dark-on-dark text detected anywhere.
      Data: Trajectory colors are pixel-identical to the light render (green-to-blue Imprint sequential ramp) — only the chrome (ink, axis lines, background) flipped, confirming correct theme-adaptive tokens.
      Legibility verdict: PASS — all text is light-on-dark and clearly readable; same minor crowding near the axis-frame corner as noted in the light render, but no legibility failure.
