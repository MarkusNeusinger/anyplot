review:
  strengths:
  - Genuine drag-driven 3D re-projection (d3.drag handler recomputes YAW/PITCH and
    redraws on every frame) — real interactivity, not simulated
  - Physically accurate Lorenz attractor generated via in-memory RK4 integration with
    the classic chaotic parameter set (sigma=10, rho=28, beta=8/3)
  - 'Thoughtful depth cues: stroke width and opacity scale with projected camera depth,
    so near segments read bolder/more opaque and far segments fade back'
  - Time-progression colorbar correctly uses the Imprint sequential palette (imprint_seq)
    and is identical between light and dark renders
  - Explicit font sizes throughout and consistent theme-token usage (t.ink / t.inkSoft
    / t.grid) for all chrome elements in both themes
  weaknesses:
  - Fixed initial camera angle (YAW=-0.95, PITCH=0.42) presents the attractor as a
    single spiraling vortex rather than the Lorenz attractor's iconic two-lobe 'butterfly'
    structure — a different default rotation would make the chaotic wing-switching
    immediately recognizable and improve data storytelling
  - X-axis and Y-axis tick labels cluster near the shared origin corner at the bottom
    of the frame, making it slightly harder to tell at a glance which number belongs
    to which axis
  - Axis tick label font-size (12px) is noticeably smaller than the axis title font-size
    (17px) — could be bumped slightly (e.g. to 13-14px) for better proportional balance
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "Lorenz Attractor · line-3d-trajectory · javascript · d3 · anyplot.ai" in dark ink, bold, centered top. "Drag to rotate" subtitle in soft gray below it. Three axis lines (X (state), Y (state), Z (state)) drawn as a 3D reference frame with tick dots and numeric tick labels in soft gray, axis titles in dark ink. A subtle floor grid in light gray sits beneath the trajectory. A vertical colorbar legend labeled "Time" with "t = end" (top, blue) and "t = 0" (bottom, green) sits at the upper right.
      Data: A single continuous 3D trajectory (Lorenz attractor) rendered as many connected line chunks, colored along a green-to-blue sequential gradient representing time progression, with line width/opacity varying by projected depth (nearer segments bolder, farther segments thinner/fainter).
      Legibility verdict: PASS — all title, subtitle, axis labels, tick labels, and legend text are clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Same title and subtitle now in light/white text, clearly visible against the dark background. Axis lines, tick labels, and axis titles rendered in light gray/white, fully legible. Floor grid rendered in a dim gray, subtle but visible. Colorbar legend text in light gray, readable.
      Data: The trajectory and colorbar gradient colors (green-to-blue) are pixel-identical to the light render — confirms only chrome (background, text, grid) flips between themes, data colors are constant.
      Legibility verdict: PASS — no dark-on-dark failures; all text elements (title, subtitle, axis titles, tick labels, legend text) are clearly legible against the near-black background.
