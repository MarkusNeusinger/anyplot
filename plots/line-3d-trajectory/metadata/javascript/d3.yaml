review:
  strengths:
  - Genuine from-scratch 3D-to-2D perspective projection (yaw/pitch rotation + perspective
    divide) built from d3-scale/d3-shape/d3-array primitives -- a distinctive, non-trivial
    use of D3's low-level flexibility
  - Time-progression color gradient (Imprint imprint_seq, brand green to blue) combined
    with depth-based opacity and stroke-width creates a genuine sense of depth and
    temporal direction in a static 2D projection
  - Deterministic RK4-integrated Lorenz attractor with the classic textbook parameters
    (sigma=10, rho=28, beta=8/3) -- factually correct and produces the recognizable
    double-wing butterfly shape
  - Theme-adaptive chrome (ink, inkSoft, grid tokens) is correctly threaded through
    axes, ticks, floor grid, and legend in both renders; data colors are identical
    between light and dark
  weaknesses:
  - The specification explicitly calls interactive rotation 'essential' and 'critical'
    for exploring a 3D trajectory, but this implementation renders a single fixed
    viewpoint with no rotation at all -- d3-drag could recompute YAW/PITCH on mouse-drag
    and re-project on every frame for genuine (not simulated) interactivity in the
    HTML output.
  - Axis labels are bare single letters 'X', 'Y', 'Z' with no further descriptor --
    generic per the style guide's axis-label criterion; a short subtitle or parenthetical
    noting these are Lorenz state variables would read better.
  - There is a large empty gap between the right edge of the plotted attractor/frame
    and the colorbar legend (roughly a third of the canvas width) -- the legend reads
    as isolated rather than anchored near the plot; pull it closer or widen the plot
    area.
  - The trajectory is drawn in CHUNK=20-point segments, each with one flat color/opacity/width
    -- this can produce faint banding/stepping along the curve instead of a perfectly
    smooth depth gradient; a smaller chunk size (or per-vertex gradient stroking)
    would smooth this out.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 -- not pure white.
      Chrome: Title "Lorenz Attractor · line-3d-trajectory · javascript · d3 · anyplot.ai" in dark ink, centered, clearly legible. X/Y/Z axis labels and numeric tick labels (in soft dark gray) are all readable against the light background. Floor grid lines are faint and subtle, not competing with the data. Legend title "Time" and the "t = 0" / "t = end" labels next to the vertical colorbar are legible.
      Data: A single Lorenz-attractor trajectory rendered as a continuous ribbon of chunked line segments colored along a green-to-blue sequential gradient (Imprint imprint_seq, brand green #009E73 through blue), with opacity and stroke width both reduced for segments further from the camera to convey depth. The classic double-lobe "butterfly" shape is clearly visible, with the short green tail (t=0) near the bottom-left floor and the trajectory winding through both wings toward the blue (t=end) coloring.
      Legibility verdict: PASS -- all text is readable, no dark-on-light or light-on-light failures observed.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 -- not pure black.
      Chrome: Title, axis labels, and tick labels all render in light/off-white text, clearly legible against the dark background. Floor grid lines are faint light strokes at low opacity, still visible. Legend text and colorbar labels are legible in light gray/white.
      Data: The same green-to-blue trajectory renders with identical hex values to the light version -- only the chrome (background, text, grid, axis-frame strokes) flipped to the dark-theme tokens. No dark-on-dark text failures; every label is clearly distinguishable from the near-black background.
      Legibility verdict: PASS -- all text is readable in both themes, and the data colors are confirmed identical between the two renders.
