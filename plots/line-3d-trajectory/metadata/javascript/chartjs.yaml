review:
  strengths:
  - Legend swatches for "Orbit start" and "Re-entry (impact)" now correctly show their
    green/red marker colors, fixing the Attempt 1 defect (dataset-level backgroundColor
    now matches pointBackgroundColor).
  - Axis tick labels are now displayed with maxTicksLimit, giving the static PNG a
    sense of scale that was previously missing.
  - Honest, well-documented isometric-projection technique for approximating a 3D
    trajectory within Chart.js's 2D-only chart types, instead of reaching for a workaround
    library.
  - Per-segment color gradient (segment.borderColor) correctly encodes elapsed time
    using the Imprint seq scale, verified identical between light/dark renders.
  - Distinct shape-coded start/re-entry markers (circle vs. triangle) plus semantically
    correct palette[4] matte-red for the "impact" role.
  - Fully deterministic, clean, appropriately-scoped code with no fake interactivity.
  weaknesses:
  - The static projection still offers no rotation/zoom, so the plot only partially
    satisfies the spec's emphasis on "interactive rotation and zoom" for exploring
    3D trajectories — this is an inherent Chart.js ceiling (no native 3D chart type),
    not a code defect, and is already honestly documented in the header comment.
  - 'tension: 0 produces straight line segments between points rather than "smooth
    lines" per the spec''s note; mitigated by the high point count (260), which reads
    as smooth in practice.'
  - Tick label font (11px) is noticeably smaller than the axis title font (16px) and
    legend font (15px) — slightly below the ~14px chartjs.md guideline — a minor size-hierarchy
    imbalance rather than a legibility failure.
