review:
  strengths:
  - 'Builds a real orthographic 3D camera on top of Chart.js: drag changes azimuth
    and elevation and the wheel zooms, each re-projecting the data and the axes, so
    the interactive rotation the Notes call critical works in the HTML view'
  - 'Every point sits at its x, y and z values (checked: the start point x=6.4, y=0,
    z=5.5 projects exactly onto the green start marker), with equal screen units in
    both directions so the 16:9 canvas does not stretch the spiral'
  - Time progression runs as a per-segment gradient through Chart.js's scriptable
    segment.borderColor, from Imprint green to blue (t.seq), so the three and a half
    shrinking loops read in order
  - The three axes leave the floor corner farthest from the viewer, with tick marks
    pointing away from the path, and the oblique camera shows the path's extent in
    x, y and altitude
  - 'Theme tokens carry all the chrome: ink and inkSoft text, the page background,
    and identical data colors in both renders; the tooltip lists all four columns
    for each point'
  weaknesses:
  - 'SC-02 (both): the elapsed-time gradient has no scale. The legend names the variable,
    but its swatch is a single solid green line, and no color bar maps green to 0
    h and blue to 18 h, so a reader cannot read time off the line''s color → explain
    both ends of the gradient (a gradient swatch or a small color bar labeled 0 h
    to 18 h). Likely cause: the orbit dataset''s legend entry uses borderColor t.palette[0],
    and nothing draws the t.seq ramp.'
  - 'DQ-03 (code): the decaying orbit ends 1,200 km from the frame''s origin at altitude
    0, which is deep inside the Earth if X/Y are Earth-centered, while the start sits
    6,400 km out and 5,500 km up → keep the horizontal radius and the altitude consistent
    with one frame (for example, a ground-track frame where X/Y are downrange offsets,
    or a radius that never falls below the Earth''s 6,371 km). Likely cause: radius
    = 6.4 - 5.2 * progress next to an independent altitude curve.'
  - 'Suggestion: tick labels such as the X axis''s 0 sit within a few pixels of the
    curve; a little more tick offset would separate them more clearly.'
  - 'Suggestion: the empty band between the legend and the top loop could give the
    3D scene a little more height.'
