review:
  strengths:
  - Honest, well-documented isometric-projection technique for approximating a 3D
    trajectory within Chart.js's 2D-only chart types, instead of reaching for a workaround
    library
  - Per-segment color gradient (segment.borderColor) correctly encodes elapsed time
    using the Imprint seq scale, verified identical between light/dark renders
  - Distinct shape-coded start/re-entry markers (circle vs. triangle) plus semantically
    correct palette[4] matte-red for the impact role
  - Fully deterministic, clean, appropriately-scoped code with no fake interactivity
  weaknesses:
  - 'The ''Orbit start'' and ''Re-entry (impact)'' legend entries render as flat gray/near-black
    boxes instead of their marker colors (green circle, red triangle) in both themes,
    because only pointBackgroundColor is set on those datasets while Chart.js''s default
    legend generator reads dataset-level backgroundColor for the swatch fill. Fix
    by setting backgroundColor to match pointBackgroundColor on those two datasets,
    or by adding usePointStyle: true to plugins.legend.labels'
  - The static projection offers no rotation/zoom, so the plot only partially satisfies
    the spec's emphasis on interactive rotation and zoom for exploring 3D trajectories
    -- inherent to Chart.js's lack of native 3D support, already acknowledged honestly
    in the code comments
  - Axis ticks are fully hidden, so the static PNG alone conveys no sense of scale
    beyond the tooltip values -- consider a small reference annotation
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white, matches #FAF8F1, not pure white.
      Chrome: Title "line-3d-trajectory · javascript · chartjs · anyplot.ai" in dark ink, fully readable. Legend row with 6 entries ("Orbit start", "Re-entry (impact)", "Orbit (color = elapsed time)", "X axis", "Y axis", "Z axis (altitude)") in dark text. Axis titles "Projected X-Y plane" (bottom) and "Altitude (Z)" (left, rotated) both readable. Grid absent (intentional minimalism).
      Data: Isometrically-projected decaying-orbit spiral. Line goes from brand green (#009E73) outer loop to blue (#4467A3) inner loop via segment-level gradient encoding elapsed time. Green circle marks orbit start (outer loop, matches palette[0]). Red triangle marks re-entry/impact (innermost loop, matches palette[4] matte red). Three dashed/dotted reference lines radiate from a shared origin representing projected X/Y/Z axes.
      Legibility verdict: PASS overall, but the "Orbit start" and "Re-entry (impact)" legend swatches render as plain flat gray boxes instead of showing their green/red marker colors -- a real defect, not a legibility failure (text labels still disambiguate).

    Dark render (plot-dark.png):
      Background: warm near-black, matches #1A1A17, not pure black.
      Chrome: Same title, legend, and axis titles rendered in light ink (#F0EFE8 / #B8B7B0), fully legible against the dark surface. No dark-on-dark failures observed anywhere.
      Data: Confirmed identical to light render -- same green-to-blue gradient orbit line, same green circle start marker, same red triangle re-entry marker. Only chrome (background, text) flipped as expected.
      Legibility verdict: PASS overall; same legend-swatch defect reproduces here (flat near-black boxes for "Orbit start" / "Re-entry (impact)").
