      Data: a smooth descending spiral of about 3.5 shrinking loops, a gradient from Imprint green #009E73 on the outer upper loop to blue #4467A3 on the inner bottom loop, about 3 px wide. A large green dot marks the start on the right, and a red triangle marks the end near the bottom center. The first series is #009E73.
