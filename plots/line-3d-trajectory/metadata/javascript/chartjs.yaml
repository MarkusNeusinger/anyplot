      Data: Isometrically-projected decaying-orbit spiral — a thick line sweeping from a wide outer loop (brand green #009E73) through progressively tighter loops shifting to blue (#4467A3) as it spirals inward, using the Imprint sequential scale to encode elapsed time. A large green circle marks orbit start (outer loop); a red triangle marks re-entry/impact (innermost loop). Three dashed/dotted reference lines (X, Y, Z) radiate from a shared origin with distinct dash patterns.
