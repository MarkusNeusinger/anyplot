review:
  strengths:
  - Isometric projection of the (x, y, z) path onto a linear-scale line chart, with
    equal screen units in both directions computed from ANYPLOT_SIZE so the 16:9 canvas
    does not stretch the orbit; the oblique view reveals extent in all three dimensions
  - 'Scriptable segment.borderColor runs the imprint_seq gradient (#009E73 to #4467A3)
    along the path in sequence order, and the legend names the encoded variable (elapsed
    time)'
  - Custom afterDatasetsDraw plugin draws three labeled 3D axes with tick marks pointing
    away from the trajectory, while the canvas frame axes stay hidden
  - 'Theme tokens threaded through all chrome; both renders read cleanly, data colors
    identical across themes, and the semantic red #AE3030 is reserved for the re-entry
    point'
  - Tooltip callback reports the original x, y and z instead of projected screen coordinates
    in the HTML view; the legend filter hides the axis datasets; animation disabled
  weaknesses:
  - 'SC-03 (both): the three axes run only from the origin to the positive ends (0
    to about 7.6), while the orbit spans about −6.4 to +6.4 in x and y, so the half
    of the path behind the origin has no scale → start the floor axes at the data
    minimum (or put the origin at the min-x/min-y corner) so every point lies over
    a scaled axis. Likely cause: axes built with at(0) as origin and length RADIUS_START
    + 1.2 in the positive direction only.'
  - 'VQ-03 (both): the legend shows the start point and the re-entry point as rectangles,
    while the marks are a circle and a triangle, and the orbit entry shows a flat
    green box instead of a line sample → legend glyphs that match the marks. Likely
    cause: legend.labels without usePointStyle: true.'
  - 'VQ-06 (both): axis names ''X position'', ''Y position'', ''Altitude Z'' carry
    no units → add a unit, e.g. ''X position (1000 km)''. Likely cause: the axes[].name
    strings.'
  - 'VQ-01 (both): tick labels at 14 px CSS (axis names 16 px) are small next to the
    22 px title and blur in the 400 px thumbnail → about 18 px ticks and 20 px axis
    names (+4 px). Likely cause: ctx.font = "14px sans-serif" / "16px sans-serif"
    in axisLabelPlugin.'
  - 'SC-02 (both): the Notes call interactive rotation and zoom critical, but the
    HTML view is a fixed isometric projection with no way to turn it → re-project
    on pointer drag (update the projection angle and call chart.update()). Likely
    cause: COS30/SIN30 fixed constants in project().'
  - 'CQ-01 (code): the file does not follow the library prompt''s data-block zones
    (column constants, one ''// Data'' block ending in const data as records) and
    adds helper functions project, lerpChannel, lerpColor → inline the projection
    in the data loop and generate records under a ''// Data'' block. Likely cause:
    the trajectory array built directly with helper functions.'
  - 'Suggestion: a small gradient bar with ''start'' and ''re-entry'' end labels would
    make the time mapping readable without relying on the two markers.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, no plot-area fill.
      Chrome: bold title "line-3d-trajectory · javascript · chartjs · anyplot.ai" centered on top; legend below it (Orbit start, Re-entry (impact), Orbit (color = elapsed time)); three thin ink-soft 3D axes from a common origin, X position toward lower right, Y position toward lower left, Altitude Z vertical, with ticks 2/4/6 (floor) and 2/4 (altitude) in dark grey. All text dark and readable; the tick labels are small.
      Data: a 3.5-turn shrinking, descending spiral (decaying orbit) drawn as one smooth 3 px line, colored by elapsed time from brand green #009E73 (outer, high) to blue #4467A3 (inner, low); green circle marks the start, a matte-red triangle marks re-entry. Legend swatches are rectangles, not the circle and triangle.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, legend text and axis names in light ink, ticks and axis lines in light grey; no dark-on-dark text anywhere.
      Data: identical spiral, gradient, green start circle and red re-entry triangle as the light render; only chrome flipped.
      Legibility verdict: PASS
