review:
  strengths:
  - 'Idiomatic MUI X v9 composition: ChartsContainer with LinePlot for the fitted
    normal curve, native ChartsReferenceLine components (with labelled, styled dashed
    lines) for LSL, USL and Target, ChartsGrid and explicit ChartsXAxis/ChartsYAxis,
    plus a custom SVG layer that reads useDrawingArea() so the histogram bars sit
    on the same linear axis as the reference lines'
  - 'Capability statistics fall out of the data: sample mean and n-1 standard deviation
    drive the normal fit (scaled by n x bin width so it follows the bar outline),
    Cp = 1.189 and Cpk = 1.051 are computed, not typed; the slightly off-target process
    mean (10.0058 mm) makes Cp and Cpk visibly differ'
  - The Cp/Cpk panel sits in the right margin outside the drawing area, so it covers
    neither bars, curve nor limit lines; monospace aligned values, a letter-spaced
    CAPABILITY header, a hairline divider and a computed status line give it a clear
    typographic hierarchy
  - Measurement axis spans both specification limits with symmetric padding, so the
    gap between the process spread and LSL/USL is readable at a glance
  - Theme tokens threaded through every chrome element (title, subtitle, tick and
    axis labels, grid, panel fill and border); data colours identical in both renders,
    semantic matte red for the specification limits and lavender for the target
  - Contiguous bars with a 1 px page-coloured seam keep the histogram contiguous while
    every bin stays distinguishable in both themes; animation disabled with skipAnimation
    on both the container and LinePlot
  weaknesses:
  - 'CQ-04 (code): lines 208-258 write out the four legend entries (Observations,
    Normal fit, LSL / USL, Target) as four near-identical rect/line + text blocks
    of about 13 lines each (~50 lines) → one `.map()` over an array of {label, color,
    dash, kind} entries inside CapabilityLayer (about 15 lines, same render). Likely
    cause: each legend row copy-pasted with only the y offset, stroke and label changed.'
  - 'Suggestion: the y grid draws a line every 2 counts (19 lines); a coarser tick
    interval (every 5 counts via the y axis tickInterval / tickNumber) would quieten
    the background behind the bars.'
  - 'Suggestion: x ticks fall on 9.925, 9.935, …, so LSL 9.95, Target 10.00 and USL
    10.05 sit between ticks; a tick interval aligned to the limits (e.g. tickInterval
    on 0.01 steps starting at 9.93/9.95) would let the axis read the limit values
    directly.'
  - 'Suggestion: the subtitle opens with "Shaft diameter (mm) (n = 200)", two parenthetical
    groups in a row that also repeat the x-axis title; "n = 200 · μ = … · σ = …" would
    read more cleanly.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white matching #FAF8F1 across the whole canvas; the Cp/Cpk panel uses the slightly lighter elevated fill with a thin grid-coloured border.
      Chrome: bold dark title "histogram-capability · javascript · muix · anyplot.ai" top-left (~42% of width), a soft-grey subtitle with n, μ, σ and the three limit values; y axis "Count" (0–36, every 2), x axis "Shaft diameter (mm)" (9.925–10.075, every 0.01); thin subtle horizontal grid; only left and bottom axis lines. All text dark and fully readable, nothing clipped.
      Data: 15 contiguous brand-green #009E73 histogram bars (slightly translucent, 1 px light seams) centred near 10.005 mm; a blue #4467A3 fitted normal curve following the bar outline with tails running to the axis ends; matte-red #AE3030 dashed vertical lines at 9.95 (LSL) and 10.05 (USL) labelled in bold red at the top; a lavender #C475FD dashed Target line at 10.00 labelled "Target". Right-margin panel: "CAPABILITY", Cp = 1.189, Cpk = 1.051, "Status: Marginal", then a legend (Observations, Normal fit, LSL / USL, Target) whose swatches match the marks.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black matching #1A1A17; the panel uses the elevated #242420 fill with a subtle border.
      Chrome: title and axis titles in near-white ink, subtitle and tick labels in light soft grey, grid faint but visible; no dark-on-dark text anywhere; panel text (CAPABILITY header, Cp/Cpk values, status, legend labels) light and readable.
      Data: identical colours to the light render — same green bars (seams now show the dark page), same blue curve, same matte-red LSL/USL lines and labels (readable, bold), same lavender Target line; brand green reads well on the dark surface.
      Legibility verdict: PASS
