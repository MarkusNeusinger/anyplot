review:
  strengths:
  - Fitted normal curve scaled by n x binWidth so it follows the bar outline exactly,
    centered on the sample mean
  - Cp/Cpk computed from the data with sample sigma and shown in a dedicated capability
    panel beside the plot, covering no bars, curve or limit lines
  - Measurement axis padded to 9.925-10.075 so both specification limits and margins
    are visible, with limits red dashed and the target purple dashed, each directly
    labelled
  - 'Idiomatic MUI X v9 composition: ChartsContainer + LinePlot + ChartsReferenceLine
    + ChartsGrid, with a useDrawingArea-driven custom layer for the contiguous histogram
    bars'
  - Theme tokens threaded through all chrome; both renders fully theme-correct with
    identical data colors
  weaknesses:
  - 'VQ-01 (dark): the bold 14 px ''LSL'' and ''USL'' line labels are drawn in #AE3030
    on the #1A1A17 page, about 2.6:1 contrast, and fade at thumbnail size → label
    text at 4.5:1 or better, e.g. t.ink for the label while the dashed line keeps
    the red. Likely cause: labelStyle fill: RED on both LSL/USL ChartsReferenceLine
    elements.'
  - 'Suggestion: the subtitle opens with ''Shaft diameter (mm) (n = 200)'', two parenthesised
    groups in a row; ''Shaft diameter, n = 200 · …'' would read more cleanly.'
  - 'Suggestion: the Normal fit curve runs along the x-axis baseline across the empty
    margins; starting it a few sigma from the mean would keep the axis line clean.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, not pure white.
      Chrome: bold dark title "histogram-capability · javascript · muix · anyplot.ai" top left (~42% of width), grey subtitle with n = 200, mu = 10.0058 mm, sigma = 0.0140 mm and the limits; x axis "Shaft diameter (mm)" with ticks 9.925-10.075, y axis "Count" 0-36; subtle horizontal grid; all text dark and readable.
      Data: 15 contiguous brand-green #009E73 bars separated by page-colored hairlines, peaking at 32 around 10.005; a blue #4467A3 fitted normal curve tracking the bar outline; red #AE3030 dashed LSL (9.95) and USL (10.05) lines and a purple #C475FD dashed Target line (10.00), each labelled at the top. Right-side panel on the elevated surface: "CAPABILITY", "Cp = 1.189", "Cpk = 1.051", "Status: Marginal", then a legend (Observations, Normal fit, LSL / USL, Target) with glyphs matching the marks.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17, not pure black.
