review:
  strengths:
  - 'Uses seaborn''s heatmap natively for the grid: square=True gives true squares,
    a two-entry list cmap maps the parity matrix, linewidths/linecolor draw the borders,
    and xticklabels/yticklabels let heatmap center the a-h and 1-8 labels itself'
  - Board parity from np.indices in two lines, with a8 and h1 light by construction
  - Exact 2400x2400 canvas per the seaborn canvas rules (figsize 6x6, dpi 400, no
    tight bbox)
  - Theme tokens threaded through title, labels, ticks, spines and square borders;
    both renders read cleanly
  - Horizontal rank labels and correct File / Rank chess terminology
  weaknesses:
  - 'Suggestion: a slightly heavier outer frame than the inner square borders would
    set the board apart as one object.'
