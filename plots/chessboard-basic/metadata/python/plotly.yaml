review:
  strengths:
  - 'Correct standard orientation in both renders: a1 dark, h1 and a8 light, with
    a-h along the bottom and 1-8 on the left, each label centered on its file or rank'
  - go.Heatmap with categorical x/y and a stepped two-stop colorscale draws the 64
    squares from one boolean matrix computed with np.add.outer, no per-square loop
  - xgap/ygap of 2 px over a plot_bgcolor of INK_SOFT turns the gaps into thin square
    borders that flip with the theme, while the green/cream board itself stays identical
    in both renders
  - scaleanchor='x' with scaleratio=1 and constrain='domain' keeps every square a
    true square on the 2400x2400 canvas
  - 'Library-native interactivity in the HTML: hovertemplate names each square (''Square
    e4'') from the text matrix, and fixedrange stops the board from being zoomed out
    of shape'
  weaknesses:
  - 'Suggestion: the gap between the title and the top of the board (about 60 px at
    600 px layout) is larger than the bottom label band; a slightly smaller top margin
    would center the board optically.'
  - 'Suggestion: a tick-label colour of INK instead of INK_SOFT would give the file
    and rank labels a little more presence in the 400 px thumbnail.'
  image_description: |-
