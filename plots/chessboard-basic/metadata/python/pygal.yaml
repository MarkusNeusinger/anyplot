review:
  strengths:
  - 'Correct standard orientation in both renders: a1 dark at bottom left, h1 light
    at bottom right, a8 light at top left, with light squares where file index + rank
    index is odd'
  - Board is a true square (about 1840 x 1840 source px) on the 2400 x 2400 canvas,
    with files a-h centered under their columns and ranks 1-8 centered left of their
    rows, read off via explicit x_labels/y_labels value dicts
  - 'Classic wood two-tone scheme: Imprint ochre #BD8233 for dark squares by the documented
    semantic exception (wood -> ochre) and a pale tint of the same ochre for light
    squares; both identical in light and dark, only the theme-adaptive INK square
    borders and text flip'
  - Per-value pygal style dicts color each square and label it with its algebraic
    name (a1..h8), so the HTML output shows the square name in pygal's native tooltip
  - 'No guides, legend or value labels: the empty basic board with only squares, borders
    and coordinate labels, as the spec asks'
  weaknesses:
  - 'Suggestion: pygal''s y-axis line at the left runs about 35 px past the board''s
    top and bottom edges and sits detached from the board; hiding it or aligning it
    with the board edge would tidy the frame.'
  - 'Suggestion: the free band below the file labels (about 250 px) is larger than
    the gap between the title and the board; trimming margin_bottom would center the
    board vertically.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 (sampled 250,248,241), not pure white.
