  strengths:
  - 'Correct standard orientation: a1 dark, h1 and a8 light, with files a-h along
    the bottom and ranks 1-8 on the left, each label centered on its column or row'
  - 'True 1:1 board on the 2400x2400 canvas: squares measure equal in both directions'
  - Wood-toned two-tone scheme from the Imprint ochre (#BD8233) and a pale tint of
    it, identical in both themes, with the board standing out clearly on both page
    colors
  - Native pygal Histogram spans (height, start, end) give gapless squares, and per-value
    style dicts color each square without any hand-built shapes
  - Each square carries its algebraic name (a1...h8) as a pygal tooltip in the interactive
    HTML
  - 'Theme-adaptive chrome: title, labels and square borders switch between INK tokens;
    all text readable in both renders'
  weaknesses:
  - 'CQ-01 (code): a `_lerp_hex` helper function is defined only to compute one constant
    light-square color → replace it with the literal hex value (#E8D5B8) and drop
    the function. Likely cause: the continuous-colormap helper copied from the library
    prompt for a single fixed tint.'
  - 'Suggestion: hide the leftover thin y-axis line left of the rank labels (it extends
    past the board top and bottom) so the board reads as a clean object.'
  - 'Suggestion: the empty band below the file labels is larger than the gap above
    the board; trimming margin_bottom would center the board block vertically.'
