  strengths:
  - 'Correct standard orientation: a1 dark, h1 and a8 light, with files a-h and ranks
    1-8 centred on each square'
  - coord_fixed(ratio=1) keeps every tile a true square on the 2400x2400 canvas
  - scale_x_discrete(limits=df[FILE].unique()) keeps the a-h order from the data instead
    of relying on sort order
  - Theme tokens threaded through title, axis text, tile borders and panel frame;
    both themes read cleanly
  - Classic tournament ivory/green two-tone pair, identical in both renders, clearly
    distinct from each other
  weaknesses:
