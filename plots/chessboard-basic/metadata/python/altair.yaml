review:
  strengths:
  - 'Standard orientation is correct: light squares at h1 (bottom right) and a8 (top
    left), computed by the (i + rank - 1) % 2 formula, not placed by hand.'
  - Exact 2400x2400 canvas via the PAD-only block, with a 460x460 view so every square
    is a true square.
  - 'Theme tokens thread through all chrome: INK title and INK_SOFT labels, borders
    and frame read cleanly on both #FAF8F1 and #1A1A17 while the wheat/brown squares
    stay constant.'
  - 'Idiomatic Altair: escaped field constants with explicit type=, ordinal sort for
    rank order, a domain/range color scale with legend=None.'
  weaknesses:
  - 'Suggestion: a tooltip with the square name (e.g. ''e4'') would add value in the
    HTML view without changing the static board.'
