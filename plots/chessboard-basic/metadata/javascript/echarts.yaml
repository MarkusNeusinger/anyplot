review:
  strengths:
  - 'Correct chess board orientation verified mathematically: (file + rank) % 2 places
    light squares at h1 and a8, matching real-world convention.'
  - Idiomatic use of ECharts' custom series (renderItem + api.coord/api.size) for
    a bespoke grid shape - the right tool for this job.
  - Clean, deterministic, minimal-chrome implementation with no axis lines/ticks/gridlines
    competing with the board.
  - Title, tick labels, and layout are fully theme-adaptive, legible, and unclipped
    in both renders.
  - Thoughtful 'wood' semantic-exception color choice for the dark squares, documented
    directly in code comments.
  weaknesses:
  - The light-square fill (t.elevatedBg) is a UI chrome/surface token rather than
    an Imprint categorical or semantic-anchor color; because it's theme-linked, 'light'
    squares render near-white in light mode but near-black in dark mode, undermining
    the classic light/dark board contrast in dark theme and violating the 'data colors
    stay identical across themes' rule. Replace it with a stable data color (e.g.
    the neutral semantic anchor, or a dedicated light Imprint tone) so the two square
    colors read as a consistent light/dark pair in both themes.
  - Design storytelling is minimal - acceptable for a reference-diagram plot type,
    but a subtle touch (e.g. a light corner accent or caption noting the h1/a8 orientation)
    could lift DE-03 without adding fake interactivity.
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white, matches #FAF8F1.
      Chrome: title "chessboard-basic · javascript · echarts · anyplot.ai" in dark ink, centered above the board; column labels a-h at bottom and row labels 1-8 on the left in soft dark gray. All clearly readable.
      Data: 8x8 board alternates ochre (#BD8233, Imprint "wood" semantic exception) and cream (elevated-surface token) squares. Light square correctly falls at h1 (bottom-right) and a8 (top-left), matching real-world chess convention.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black, matches #1A1A17.
      Chrome: title and tick labels rendered in light gray/white, fully readable against the dark background - no dark-on-dark failures for any text element.
      Data: the ochre "dark square" color is pixel-identical to the light render (correct data-color identity across themes). The "light square" fill, however, is the elevated-surface token which in dark theme is near-black (#242420) - very close in luminance to the surrounding page background (#1A1A17). The checkerboard pattern remains visible via the ochre contrast and thin per-square stroke, but the "light" squares no longer read as light/cream the way they do in the light render.
      Legibility verdict: PASS (text) / FLAG (data-color theme consistency - see VQ-07 and VQ-03 notes)
