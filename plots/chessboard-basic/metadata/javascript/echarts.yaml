review:
  strengths:
  - 'Fixed the attempt-1 theme-flip bug: the light square now uses the amber semantic
    anchor (#DDCC77), a fixed non-theme-adaptive color, so both the light and dark
    squares are pixel-identical across the light and dark renders, matching the ''data
    colors stay identical across themes'' rule.'
  - 'Correct chess board orientation verified mathematically: (file + rank) % 2 places
    light squares at h1 and a8, matching real-world convention.'
  - Idiomatic use of ECharts' custom series (renderItem + api.coord/api.size) for
    a bespoke grid shape - the right tool for this job.
  - Clean, deterministic, minimal-chrome implementation with no axis lines/ticks/gridlines
    competing with the board.
  - Title, subtitle, and tick labels are fully theme-adaptive, legible, and unclipped
    in both renders.
  - Well-documented code comments explain the semantic-exception color reasoning for
    both squares.
  weaknesses:
  - Design storytelling is minimal - acceptable for a reference-diagram plot type,
    but a subtle touch (e.g. a light corner accent, coordinate highlight, or caption
    noting the h1/a8 orientation) could lift DE-03 without adding fake interactivity.
  - The amber semantic anchor is documented for a 'warning/caution' role rather than
    a general light-square wood tone; it works visually here and correctly solves
    the theme-flip issue, but a future iteration could consider whether a dedicated
    light-wood value reads more intentionally than reusing the warning anchor.
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white, matches #FAF8F1.
      Chrome: title "chessboard-basic · javascript · echarts · anyplot.ai" in dark ink, centered above the board; subtitle "White's near-right square (h1) is light — standard orientation" in soft dark gray beneath it; column labels a-h at bottom and row labels 1-8 on the left, all clearly readable.
      Data: 8x8 board alternates ochre (#BD8233, Imprint "wood" semantic exception) dark squares and amber (#DDCC77, semantic anchor) light squares. Light square correctly falls at h1 (bottom-right) and a8 (top-left), matching real-world chess convention. Thin theme-adaptive stroke separates each square.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black, matches #1A1A17.
      Chrome: title and subtitle rendered in light gray/white, tick labels in soft light gray, all fully readable against the dark background - no dark-on-dark failures for any text element.
      Data: both the ochre "dark square" color and the amber "light square" color are pixel-identical to the light render - this is the fix for the attempt-1 weakness, where the light square previously used a theme-adaptive chrome token and flipped from near-white to near-black between themes. Now both squares read as a consistent, high-contrast light/dark pair in both themes.
      Legibility verdict: PASS
