review:
  strengths:
  - 'Distinctive Highcharts technique: chart.events.load computes exact cell size
    from plotSizeX/plotSizeY and updates marker.radius before redraw, so the square
    markers tile edge-to-edge with no gaps or overlap regardless of container size'
  - 'Correct chess geometry: dark squares placed so light squares fall on the h1 and
    a8 corners, matching standard chess board orientation, with all 32 dark squares
    present and labeled with correct algebraic notation'
  - Clean, minimal chrome (no axis lines, ticks, or gridlines) with generous whitespace;
    both light and dark renders pass the theme-readability checklist — identical brand-green
    data color in both themes, chrome correctly flips, no dark-on-dark or light-on-light
    text
  - Code is simple, deterministic, free of fake interactivity, and uses only the mandated
    Imprint palette entry (no custom hexes, no default Highcharts palette)
  weaknesses:
  - 'Color scheme diverges from the spec''s explicit request for ''classic light/dark
    contrast (e.g., cream/brown or white/gray)''. Dark squares render as brand green
    (#009E73) against the plain page background, which reads as an abstract polka-dot/checker
    grid rather than an authentic chess board. Consider the style guide''s Semantic
    Exception mechanism (prompts/default-style-guide.md, ''Semantic exception'' section)
    to reassign a warmer Imprint member (e.g. ochre #BD8233, which the guide already
    maps to ''wood'') to the dark squares instead of the ordinal-first green, while
    keeping light squares on the neutral page background — this stays within the no-custom-hex
    rule but reads as a real chess board.'
  - 'DE-03 (Data Storytelling): a static alternating grid has no visual hierarchy
    or focal point beyond the pattern itself — acceptable for this plot type but not
    evidence for raising above the low default.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "chessboard-basic · javascript · highcharts · anyplot.ai" in bold dark ink, clearly legible at the top. File labels (a-h) at the bottom and rank labels (1-8) on the left in a softer dark-gray ink, all fully visible with no clipping or overlap. No axis lines, ticks, or gridlines are drawn (intentional minimal chrome).
      Data: An 8x8 checkerboard of square markers — 32 filled squares in brand green (#009E73, Imprint palette position 1) representing the dark squares, alternating with the plain cream page background representing the light squares. Squares tile edge-to-edge with no visible gaps or overlaps. Light squares correctly fall on h1 and a8 per standard chess board orientation.
      Legibility verdict: PASS — all text is clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Same title, now in light ink, clearly legible against the dark background. File/rank labels rendered in a softer light-gray tone, fully visible, no clipping or overlap.
      Data: Same 8x8 checkerboard pattern with the identical brand-green (#009E73) squares for the dark squares — confirmed pixel-identical hue to the light render. Light squares are the near-black page background instead of cream, since only chrome color tokens flip and the light-square color is the page background token, not a Imprint palette value.
      Legibility verdict: PASS — all title/axis text is clearly readable against the dark background; no dark-on-dark failures observed. Brand green remains clearly visible against the near-black surface.
