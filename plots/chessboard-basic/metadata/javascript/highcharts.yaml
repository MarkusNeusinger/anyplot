review:
  strengths:
  - 'Correctly resolved the attempt-1 rejection: dark squares now use the ochre semantic-exception
    color (palette[3], #BD8233 ''wood'') instead of the ordinal-first brand green,
    matching the spec''s explicit ''classic light/dark contrast (e.g., cream/brown)''
    requirement and the style guide''s documented wood→ochre exception'
  - 'Distinctive Highcharts technique: chart.events.load computes exact cell size
    from plotSizeX/plotSizeY and updates marker.radius before redraw, so square markers
    tile edge-to-edge with no gaps or overlap regardless of container size'
  - 'Correct chess geometry: light squares fall on h1 and a8 per standard board orientation,
    all 32 dark squares present and labeled with correct algebraic notation'
  - Clean, minimal chrome (no axis lines, ticks, or gridlines) with generous whitespace;
    both renders pass the theme-readability checklist — identical data color in both
    themes, chrome correctly flips, no dark-on-dark or light-on-light text
  - Code is simple, deterministic, free of fake interactivity, and uses only mandated
    Imprint palette entries (no custom hexes, no default Highcharts palette)
  weaknesses:
  - 'Duplicate/stale header block: lines 1-10 contain two conflicting comment headers
    — a stale ''highcharts 12.6.0 | JavaScript 22.23.2'' / ''Quality: 85/100'' block
    (leftover from attempt 1) immediately followed by the current ''Highcharts 12.6.0
    | Node 22'' / ''Quality: pending'' block, with the ''//# anyplot-orientation:
    square'' directive sandwiched between them. Remove the stale first block so the
    shipped file carries one consistent header.'
  - DE-03 (Data Storytelling) remains at the low default — a static alternating grid
    is expected and acceptable for this plot type, but there is no additional visual
    hierarchy or focal point beyond the checker pattern itself.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 -- not pure white, not dark.
      Chrome: Title "chessboard-basic · javascript · highcharts · anyplot.ai" in bold dark ink, clearly legible at the top and comfortably within plot width. File labels (a-h) at the bottom and rank labels (1-8) on the left in a softer dark-gray ink, all fully visible with no clipping or overlap. No axis lines, ticks, or gridlines are drawn (intentional minimal chrome).
      Data: An 8x8 checkerboard of square markers -- 32 filled squares in ochre/wood-brown (#BD8233, Imprint palette position 4, semantic exception for "wood") representing the dark squares, alternating with the plain cream page background representing the light squares. This reads as an authentic wooden chess board rather than an abstract polka-dot grid. Squares are evenly spaced with no visible overlap. Light squares correctly fall on h1 and a8 per standard chess board orientation.
      Legibility verdict: PASS -- all text is clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 -- not pure black, not light.
      Chrome: Same title, now in light ink, clearly legible against the dark background. File/rank labels rendered in a softer light-gray tone, fully visible, no clipping or overlap.
      Data: Same 8x8 checkerboard pattern with the identical ochre (#BD8233) squares for the dark squares -- confirmed pixel-identical hue to the light render, satisfying the "data colors identical between light/dark" rule. Light squares are the near-black page background instead of cream, since only chrome color tokens flip and the light-square color is the page background token, not an Imprint palette value.
      Legibility verdict: PASS -- all title/axis text is clearly readable against the dark background; no dark-on-dark failures observed. Ochre squares remain clearly visible against the near-black surface.
