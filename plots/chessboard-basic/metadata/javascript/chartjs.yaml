review:
  strengths:
  - Custom squareBoard plugin (afterLayout) precisely re-centers the chart area to
    a square before scale.configure() re-runs, so the board stays 1:1 even though
    the title consumes vertical space asymmetrically — a real Chart.js-specific solution
    rather than a fixed-margin guess.
  - pointRadius is computed per-render from getPixelForValue() deltas so the 64 rect
    markers tile edge-to-edge with a deliberate +0.5px overlap that hides antialiasing
    seams between squares.
  - 'Well-reasoned, explicitly documented semantic color exception: dark squares use
    Imprint ochre (wood association) and light squares use the theme-adaptive elevated-surface
    token instead of the canonical brand-green-first order — matches the style guide''s
    real-world-object exception and stays correct in both themes.'
  - 'Correct chess convention: light square at h1 and a8 (isLight = (c+r)%2===1),
    matching the specification''s orientation note.'
  - Crisp outer strokeRect frame (afterDatasetsDraw) reads as one solid block even
    where a corner square's fill is close in value to the page background.
  - 'Clean mount-node contract: animation:false, single canvas appended once, no fixed
    canvas sizing, tooltip callbacks add algebraic notation + square color without
    needing to be visible in the static PNG.'
  weaknesses:
  - Light squares (elevated-surface token) sit close in luminance to the page background
    in both themes — legible thanks to the outer frame and per-square borders, but
    a slightly higher-contrast grid stroke would reinforce the board edge further
    at small (400px) preview sizes.
  - No static legend/key spelling out 'light square / dark square' — fine since the
    checkerboard pattern and tooltip cover it, but a small caption would help on truly
    static (non-interactive) embeds.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (~#FAF8F1), not pure white — matches the light theme surface.
      Chrome: Title "chessboard-basic · javascript · chartjs · anyplot.ai" in dark ink, centered, ~50% of plot width, clearly legible. File letters a-h along the bottom and rank numbers 1-8 along the left in a softer dark grey — all clearly legible against the light background. A dark ink outer frame outlines the 8x8 board.
      Data: 64 squares in a perfect 8x8 grid, alternating ochre (#BD8233, "dark" squares) and near-white cream (elevated-surface token, "light" squares), each with a thin subtle border. Dark square at a1 (bottom-left) and h8 (top-right); light square at h1 (bottom-right) and a8 (top-left) — matches standard chess orientation from the spec.
      Legibility verdict: PASS.

    Dark render (plot-dark.png):
      Background: Warm near-black (~#1A1A17), not pure black — matches the dark theme surface.
      Chrome: Same title text now in light ink, fully legible against the dark background. File/rank labels in a lighter soft grey, fully legible — no dark-on-dark issue. A light-grey outer frame outlines the board.
      Data: Ochre squares are pixel-identical to the light render (data color held constant across themes, as required). Squares that were cream in light mode are now a dark charcoal (elevated-surface dark token) instead of white — this is the intended theme-adaptive chrome behavior for the "light square" role, not a data-color violation, and it keeps the board readable and correctly oriented (h1/a8 still the lighter of the pair relative to the theme).
      Legibility verdict: PASS.

    Both renders were viewed directly. Board orientation, square coloring, and text legibility are consistent and correct in both themes; no dark-on-dark or light-on-light failures observed.
