review:
  strengths:
  - 'Correct chess board conventions: light squares precisely at a8 and h1, matching
    real-world board orientation'
  - 'Distinctive MUI X usage: composes ChartContainer + a custom scatter slot (BoardSquares)
    with direct xScale/yScale bandwidth access to tile exact squares — an idiomatic
    use of MUI X''s composability/slots API rather than the high-level ScatterChart
    convenience component'
  - 'Well-reasoned, in-palette color choice: dark square uses Imprint ochre (palette[3],
    the documented ''wood'' semantic exception), light square uses the amber anchor
    for warm cream contrast — no custom hexes, both squares clearly distinguishable
    in both themes'
  - Board scales to a perfect square via min(availW, availH), keeping true 1:1 cell
    aspect ratio as the spec requires
  - Clean, deterministic code with correct harness contract (export default, skipAnimation,
    sized to window.ANYPLOT_SIZE)
  - 'Both renders are theme-correct: title and axis labels readable in light and dark,
    background-matched square strokes create a clean grid separation in both themes'
  weaknesses:
  - Design Excellence is limited by the plot's inherently static/diagrammatic nature
    — there is no visual hierarchy or storytelling device (e.g. a highlighted example
    square with a notation callout) beyond the base grid, leaving Data Storytelling
    at the default 'no story' tier
  - The custom scatter-slot rendering is MUI X-specific, but the resulting visual
    (a static checkerboard of rects) could in principle be approximated in other libraries
    too, so Distinctive Features credit is only partial rather than maximal
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Title "chessboard-basic · javascript · muix · anyplot.ai" is centered at top in dark ink, clearly legible. Rank labels (8 down to 1) sit on the left in soft ink, file labels (a-h) sit along the bottom in the same soft ink — all fully readable against the light background.
      Data: An 8x8 checkerboard of squares alternating between a warm ochre/brown (#BD8233, the Imprint "wood" semantic exception) and a warm cream/amber (#DDCC77, the Imprint amber anchor). Squares are tiled edge-to-edge with a thin page-background-colored stroke between them, and the whole board is framed by a solid dark outer border. h1 (bottom-right) and a8 (top-left) are correctly light squares, matching standard chess-diagram convention.
      Legibility verdict: PASS — all text is clearly readable, no dark-on-light or light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Same title and axis labels, now rendered in light ink tones, clearly legible against the dark background. No dark-on-dark text observed.
      Data: The same ochre (#BD8233) and amber (#DDCC77) square colors as the light render — confirmed identical, only the chrome (background, text, frame stroke color) has flipped for the theme. Board geometry and square placement are unchanged.
      Legibility verdict: PASS — all text and chrome elements are theme-adaptive and fully readable; data colors match the light render exactly.
