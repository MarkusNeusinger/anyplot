review:
  strengths:
  - 'Correct standard orientation verified in both renders and in code: (fileIndex
    + rank) % 2 === 0 makes h1 (7+1) and a8 (0+8) light, a1 dark; light squares sit
    at the bottom-right and top-left corners'
  - Grid built from two native MUI X band axes with categoryGapRatio 0 so the 8×8
    squares come straight from the scales, and a square ChartsContainer with equal
    axis bands (48 px) gives a true 1:1 drawing area (1016×1016 CSS px)
  - File labels a–h and rank labels 1–8 are drawn by native ChartsXAxis/ChartsYAxis,
    centered on each column/row, at 16 px semibold in the inkSoft token — readable
    in both themes
  - Custom BoardLayer uses the useXScale/useYScale/useDrawingArea hooks to place squares,
    the idiomatic MUI X composition path for marks the stock charts lack
  - Theme-adaptive square separators (pageBg stroke) and an ink frame make the board
    stand out from the page in both themes while the wood tones stay identical across
    renders
  weaknesses:
  - 'Suggestion: the 48 px y-axis band sits only on the left, so the board is offset
    about 40 CSS px right of the canvas center; adding an equal right margin would
    center the board under the title.'
  - 'Suggestion: the light squares in amber #DDCC77 read more yellow than the classic
    cream maple; a paler cream tone would sit closer to the traditional cream/brown
    board.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 page.
      Chrome: bold dark title "chessboard-basic · javascript · muix · anyplot.ai" centered at top (~50% width), muted subtitle "64 squares (8×8) · Algebraic notation (a–h, 1–8)" below it; rank labels 1–8 on the left (1 at bottom) and file labels a–h along the bottom (a at left), each centered on its row/column, dark gray semibold — all readable. A 3 px near-black frame outlines the board.
      Data: 8×8 board of equal squares alternating light (amber #DDCC77) and dark (ochre #BD8233) wood tones, separated by thin cream lines; a1 dark, h1 and a8 light. No pieces, highlights or callouts. Board is square and fills most of the canvas.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17 page.
      Chrome: title in near-white, subtitle and rank/file labels in light gray — all clearly readable, no dark-on-dark text. Board frame flips to a light ink outline; square separators flip to the dark page color.
      Data: identical square colors to the light render (#DDCC77 / #BD8233), same orientation (h1 and a8 light). Board stands out clearly from the dark page.
      Legibility verdict: PASS
