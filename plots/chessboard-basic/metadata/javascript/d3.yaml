review:
  strengths:
  - 'Directly addressed the prior review''s DE-01/DE-02 weakness: the flat checkerboard
    now sits on an elevated bezel with a theme-adaptive drop shadow (feDropShadow
    riding the ink token), giving it a physical, tactile board feel instead of a plain
    grid'
  - Added a subtle amber corner accent on h1 and a8 -- the light-square corners the
    spec explicitly calls out -- creating a small focal point/storytelling touch that
    was missing before (DE-03 improvement)
  - Switched square and label positioning from manual index arithmetic to idiomatic
    d3 scaleBand domains (files / reversed ranks), a cleaner and more d3-idiomatic
    pattern than the previous attempt (LM-01 improvement)
  - 'Chess orientation remains exactly correct per spec: h1 and a8 verified as light
    squares via (col+row)%2 parity, matching real-world convention'
  - 'Both renders are fully theme-correct: chrome (title, frame, rank/file labels)
    uses ANYPLOT_TOKENS and adapts correctly, while board square colors are intentionally
    fixed across themes (documented physical-object design choice) -- no dark-on-dark,
    light-on-light, or edge-clipping issues in either render'
  weaknesses:
  - 'LM-02 still generic: beyond the new drop-shadow filter, the implementation relies
    on basic selection/join + band scales without showcasing more distinctive d3 capabilities
    (transitions, interactivity, custom shapes) -- a reasonable choice for a static
    reference grid, but it keeps Library Mastery modest'
  - DE-01/DE-02 improved meaningfully but the board itself is still a literal checkerboard
    beyond the bezel/shadow -- there is room for further refinement (e.g. subtly rounded
    square corners, finer frame treatment) before this reaches publication-ready polish
  - The corner-accent dots (opacity 0.6, r=9% of square size) are quite subtle by
    design -- intentional restraint given the classic-board look, but could be marginally
    more legible when the PNG is scaled down to mobile width
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 -- not pure white.
      Chrome: Title "chessboard-basic · javascript · d3 · anyplot.ai" in bold dark text at top, clearly legible. The board now rests on a rounded, subtly shadowed elevated bezel (t.elevatedBg + feDropShadow) that visually separates it from the page. Rank labels (8-1, top to bottom) sit to the left in muted dark grey; file labels (a-h) sit below the board in the same style -- all clearly legible against the light background. A thin dark frame outlines the full 8x8 board.
      Data: 64 squares alternating between a warm cream (~#EDE0C8) and a mid-brown (~#8B5A2B) -- classic chess board coloring, positioned via d3 scaleBand. h1 (bottom-right) and a8 (top-left) are both light squares, matching standard chess board orientation, and each carries a small subtle amber accent dot marking it as a named corner.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 -- not pure black.
      Chrome: Same title now rendered in light/white text, clearly legible against the dark background. The bezel drop-shadow reads as a faint glow rather than a shadow (flood-color rides the ink token), still giving the board a lifted, physical presence. Rank and file labels rendered in light grey, clearly legible -- no dark-on-dark failures anywhere. Frame outline still visible in a soft light stroke.
      Data: Identical cream/brown checkerboard colors and corner-accent placement as the light render -- confirms board "data" colors are intentionally theme-independent (a documented physical-object design choice), while only the surrounding chrome (title, labels, frame, bezel) flips with theme.
      Legibility verdict: PASS
