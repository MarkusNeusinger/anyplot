review:
  strengths:
  - 'Chess square coloring is factually correct: a1 and h1 verified dark/light per
    standard algebraic notation, and a8 correctly resolves to a light square — the
    parity formula ''(f + r) % 2'' is right.'
  - DataAspect() combined with a 2400x2400 square canvas correctly enforces the 1:1
    square proportions required by the spec.
  - Column labels (a-h) at bottom and row labels (1-8) on the left follow standard
    chess-board orientation exactly as the spec requests.
  - Subtle theme-adaptive hairline grid (ink at 15% alpha) between squares adds definition
    without competing with the data, and spines/tick marks are cleanly minimized (top/right
    spines removed, tick marks hidden).
  - 'First categorical color is exactly Imprint brand green #009E73, correctly used
    for the dark squares.'
  - 'Clean KISS script structure: theme tokens -> data -> plot -> save, no functions/classes,
    deterministic (no seed needed since the board pattern is fully deterministic).'
  weaknesses:
  - 'VQ-07: LIGHT_SQUARE is theme-adaptive (#FAF8F1 in light theme, #F0EFE8 in dark
    theme) rather than a fixed value — it changes between renders. The style guide''s
    hard rule is that Imprint data colors stay identical across themes and only chrome
    (background/text/grid) may flip. Since the light square is one of the two ''data''
    colors of this grid, make it a single fixed hex that is correct in both themes
    (e.g. a semantic-anchor tone) instead of reusing the light-theme PAGE_BG value.'
  - 'DE-01/DE-02: the design is clean but relies on exactly two flat fills plus hairline
    dividers — there is no additional refinement (e.g. a subtle border/frame around
    the whole board, or corner-square accent) that would push this from ''well-configured''
    toward genuinely publication-grade polish.'
  - 'DE-03: no visual hierarchy or focal point beyond the base checkerboard pattern
    itself — acceptable for a ''basic'' spec but there is room to add a light accent
    (e.g., emphasize the a1 corner or add a thin outer board border) to give the eye
    a starting point without adding fake data.'
  - 'LM-02: the heatmap-with-two-color-colormap technique is generic and could be
    replicated with near-identical code in almost any plotting library (matplotlib
    imshow, etc.) — leaning on a more Makie-distinctive primitive (e.g. `poly!` with
    per-square `Rect` geometries, or a custom recipe) would better showcase library-specific
    mastery.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1-consistent) fills the full canvas, including the axis area outside the board frame.
      Chrome: Title "chessboard-basic · julia · makie · anyplot.ai" is dark ink text, clearly legible, centered above the board with generous margin, not clipped. Column tick labels a-h sit below the board, row tick labels 1-8 sit to the left; both are medium-gray (INK_SOFT), fully legible against the cream background. Left and bottom axis spines are visible as thin soft-ink lines; top/right spines are hidden.
      Data: The board renders as an 8x8 grid of brand-green (#009E73) squares alternating with off-white squares that blend into the page background, separated by thin ink hairlines at low opacity. Bottom-left corner (a1) is green (dark square) and bottom-right corner (h1) is cream (light square), matching standard chess convention. First/only truly categorical data color is #009E73 as required.
      Legibility verdict: PASS — all text is dark-on-light and clearly readable; no light-on-light text issues (the cream light-squares blending into the page is an intentional grid-fill design, not a text-legibility problem).

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17-consistent) fills the full canvas outside and around the board.
      Chrome: Title renders in light off-white text, clearly legible against the dark background, not clipped. Tick labels a-h and 1-8 render in a lighter soft gray, fully legible. Left/bottom spines are visible as thin soft-light lines; top/right spines hidden, matching the light render's chrome logic.
      Data: Dark squares remain the identical brand green (#009E73) as in the light render — confirmed unchanged. Light squares now render as a distinct near-white cream fill (#F0EFE8) that contrasts clearly against the near-black page, rather than blending into the background as in the light render. This means the "light square" data color is NOT identical between the two themes (see VQ-07 weakness) even though it still reads clearly as the intended light square in both cases.
      Legibility verdict: PASS — no dark-on-dark issues found; all title/tick text is light-colored and clearly readable against the near-black surface. Brand green squares remain fully visible.
