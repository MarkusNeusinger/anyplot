review:
  strengths:
  - LIGHT_SQUARE is now a single fixed hex (#DDCC77, the Imprint amber anchor) identical
    across both renders — fully resolves the attempt-1 VQ-07 theme-adaptivity violation.
  - Rebuilt with per-square poly!(Rect2f) geometry instead of a generic two-color
    heatmap — a genuinely Makie-idiomatic geometry-drawing pattern, directly addressing
    the attempt-1 LM-02 feedback.
  - Added a crisp outer board frame (lines! in INK_SOFT) around the 8x8 grid — the
    extra polish the attempt-1 review asked for under DE-01/DE-02.
  - 'Chess square coloring is factually correct: a1 dark, h1 and a8 light, matching
    standard algebraic-notation convention.'
  - DataAspect() plus the 2400x2400 canonical square canvas correctly enforces 1:1
    square proportions.
  - Clean KISS script structure (theme tokens -> data -> plot -> save), fully deterministic,
    only CairoMakie + Colors imported and both used.
  weaknesses:
  - No visual hierarchy or focal point beyond the base checkerboard pattern (expected
    default for a 'basic' spec, but keeps Data Storytelling at the default score).
  - poly!(Rect2f) per-square drawing is a solid Makie geometry pattern but is still
    conceptually replicable in other libraries (e.g. matplotlib patches.Rectangle),
    so it doesn't fully max out Library Mastery's distinctiveness bar.
