review:
  strengths:
  - sns.heatmap on a 1xN matrix with center=0 and vmin=-vmax/vmax=vmax gives a zero-centered,
    symmetric diverging scale directly
  - Stripes touch with no gaps (linewidths=0) across 98% of the width, one per year
    in chronological order
  - Synthetic anomalies interleave warm and cool years around a realistic warming
    trend, so the stripes read as observed data
  - Theme tokens threaded through all chrome; title and year text readable in both
    renders
  weaknesses:
  - 'VQ-07 (dark): the diverging ramp''s dark midpoint is the muted ink #A8A79F, so
    near-zero stripes render as a bright grey that washes out the blue half of the
    band → DIV_FIELDS with the page midpoint #1A1A17 (or the marks midpoint #686762),
    per the style guide''s imprint_div rules. Likely cause: midpoint = "#A8A79F" for
    the dark theme on line 23.'
  - 'SC-02 (both): the ''1850'' and ''2024'' text labels below the band break the
    Notes'' ''no axes, no labels'' requirement (C3) → remove both fig.text year markers.
    Likely cause: the fig.text calls on lines 78-79.'
  - 'Suggestion: sns.heatmap''s mask= could leave missing years blank, a seaborn-native
    way to handle gaps in real data.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1.
      Chrome: title 'heatmap-stripes-climate · python · seaborn · anyplot.ai' in dark ink, centered at the top; '1850' and '2024' in soft ink below the band's left and right ends. No axes, ticks or gridlines. All readable.
      Data: a band spanning about 98% of the width and 60% of the height, 175 touching vertical stripes; pale blues (#4467A3 tints) on the left, near-page neutrals in the middle, reds deepening to #AE3030 at the right. Warm and cool years interleave.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title in light ink, year markers in light soft ink; no dark-on-dark text.
      Data: same stripes and poles; the midpoint is a bright grey (#A8A79F), so the cool half reads as grey-blue and the band looks washed out until the reds at the right. Stripes clearly separated from the page.
      Legibility verdict: PASS
