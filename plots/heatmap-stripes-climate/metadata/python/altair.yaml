review:
  strengths:
  - 'Faithful warming stripes: 175 touching, equal-width stripes in chronological
    order with no axes, ticks, labels, gridlines or legend, exactly as the spec''s
    Notes ask'
  - Stripe band fills the 16:9 canvas edge to edge under the title, so the color progression
    carries the whole image
  - 'imprint_div fields ramp (#4467A3 ↔ page ↔ #AE3030) built with domainMid=0 and
    a symmetric domain [-limit, limit], blended with interpolate=''rgb'' so the intermediate
    colors are the style guide''s; years near zero are the palest in both themes'
  - Synthetic HadCRUT-like anomalies with a piecewise trend plus noise show warm and
    cool years interleaved, so the stripes read as observed data rather than a smooth
    gradient
  - autosize fit with contains='padding' sizes the chart to the canvas the Vega-Lite
    way; formatted tooltips (+.2f) on year and anomaly add value in the HTML export
  - Column constants and an escaped-field pattern keep the plot code independent of
    the data block
  weaknesses:
  - 'Suggestion: a slightly smaller outer padding at the left and right edges would
    let the stripes run fully flush with the canvas, as in the classic warming-stripes
    graphic.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, not pure white.
      Chrome: bold dark title "heatmap-stripes-climate · python · altair · anyplot.ai" centered at the top, about half the width; no axes, ticks, labels, gridlines or legend, as the spec asks. Title fully readable.
      Data: 175 equal-width touching vertical stripes filling the canvas edge to edge under the title (about 3120×1620 px band). Muted blues on the left (1850–1910 cool years), palest near-page tones in the middle (around 1950–1990, with interleaved faint blue and pink stripes), and reds deepening to #AE3030-like red at the right (2010s–2024). Year-to-year variation is clearly visible.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17, not pure black.
      Chrome: title in light ink #F0EFE8, clearly readable; no dark-on-dark text. No other chrome.
      Data: same stripe layout; the fields ramp uses the dark midpoint (#1A1A17), so cool stripes read as dark slate blues, near-zero years merge toward the page, and warm years brighten to strong red at the right. Poles are the same #4467A3/#AE3030 as the light render; only the midpoint flips with the theme, as the style guide prescribes.
      Legibility verdict: PASS
