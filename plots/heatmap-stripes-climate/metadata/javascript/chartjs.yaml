review:
  strengths:
  - 'Faithfully recreates the Ed Hawkins warming-stripes genre: no axes, ticks, or
    gridlines — pure color encoding fills the entire canvas'
  - Diverging color scale is built directly from window.ANYPLOT_TOKENS.div (imprint_div),
    with the midpoint correctly using the theme-adaptive page background — identical
    data colors in both renders, only chrome flips
  - 'Color scale is properly symmetric around zero: fraction = anomaly / maxAbsAnomaly
    ensures equal-magnitude anomalies get equal visual intensity'
  - Distinctive, idiomatic use of Chart.js's plugin lifecycle hooks (beforeDatasetsDraw
    with direct ctx/chartArea access) to draw the stripes — a mechanism unique to
    Chart.js's extensibility model, not a generic bar-gap trick
  - Deterministic synthetic data (fixed-seed LCG) spans 1850-2024 (175 years) with
    a realistic accelerating-warming shape and per-year noise, plausible in both range
    and magnitude for a HadCRUT/GISS-style anomaly series
  - Mandated title is legible and correctly formatted in both themes; animation disabled
    per the mount-node contract
  weaknesses:
  - Canvas uses the default 3200x1800 landscape (16:9) format rather than the spec-suggested
    ~3:1 wide-and-short aspect ratio; this is a minor, system-constrained deviation
    (anyplot only offers 16:9 landscape or 1:1 square) rather than an implementation
    error, but it's worth noting the stripes would read even more powerfully at a
    wider ratio if a third canvas option is ever added
  - Title occupies roughly a third of the canvas width rather than the ~70-85% typical
    for the mandated title string at other libraries' default sizing — still fully
    legible and well-centered in both themes, so no legibility deduction, but there
    is unused horizontal headroom in the title band
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1) fills the thin title band at the top; the stripe area itself covers the entire remaining canvas edge-to-edge.
      Chrome: Title "heatmap-stripes-climate · javascript · chartjs · anyplot.ai" renders in dark ink, bold, centered, fully legible against the light band. No axes, ticks, gridlines, or legend are present, matching the spec's "pure data visualization" requirement.
      Data: 175 vertical stripes (1850-2024) run left to right. The left third is cool blue-grey, transitioning through a near-neutral cream band around the middle years, into progressively deeper reds on the right third, with visible year-to-year noise within the overall smooth trend. First-series/data colors are drawn from the imprint_div diverging scale (blue #4467A3 to red #AE3030) via the theme midpoint.
      Legibility verdict: PASS — title text is crisp and high-contrast; no text sits on top of the stripes.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17) fills the title band; stripes fill the rest of the canvas.
      Chrome: Same title text now renders in light/off-white ink, clearly legible against the dark band. No axes/ticks/gridlines, consistent with the light render.
      Data: Same left-to-right blue-to-red progression as the light render — the blue and red stripe hues are visually identical to the light version; only the near-zero midpoint stripes shift from cream to near-black (the theme-adaptive imprint_div midpoint), which is the expected and correct chrome-only change.
      Legibility verdict: PASS — no dark-on-dark or light-on-light failures; title contrast is strong.
