review:
  strengths:
  - 'Faithful, brand-compliant recreation of the canonical Ed Hawkins ''warming stripes''
    format: pure color encoding, no axes/labels/gridlines, exactly matching the spec''s
    minimalist intent'
  - Correct imprint_div diverging colormap built from t.div (matte-red ↔ theme-adaptive
    midpoint ↔ blue), symmetric around zero via maxAbsAnomaly normalization — not
    a hard-coded custom cmap
  - Data colors are pixel-identical between light and dark renders; only the title-band
    chrome flips background/text, exactly as required
  - 175-year synthetic series (1850–2024) with an accelerating-warming trend plus
    noise closely mirrors the real HadCRUT/GISS anomaly shape and magnitude (~-0.5°C
    to +1.3°C), giving full-range, realistic, non-repetitive data
  - Bars are gapless and equal-width (categoryPercentage/barPercentage = 1.0, borderWidth
    0), and the chart fills virtually 100% of the canvas below the title band — excellent
    canvas utilization
  - 'animation: false set correctly; deterministic LCG(seed=42) data generation; clean
    mount-node usage with no stray DOM nodes'
  weaknesses:
  - 'LM-02: the stripes effect is achieved with a generic bar-chart trick (categoryPercentage/barPercentage=1.0)
    that any bar-capable library could replicate — no chartjs-distinctive feature
    (e.g. a custom plugin draw hook, gradient fill API) is leveraged'
  - 'CQ-01: five helper functions (lcg, hexToRgb, rgbToHex, lerpColor, anomalyColor)
    push the file beyond a strict imports→data→plot KISS shape; understandable given
    JS has no built-in color-interpolation helper, but still a deviation worth tightening
    (e.g. collapse hexToRgb/rgbToHex/lerpColor into one small utility)'
  - Title occupies only ~35-40% of canvas width — comfortably legible and not a defect,
    but on the small side relative to the mandated-title guidance; could grow 1-2pt
    for better visual presence without risking overflow
  image_description: |-
    Light render (plot-light.png):
      Background: The title band across the top is a warm off-white matching #FAF8F1. Below the title, the chart area is entirely covered edge-to-edge by 175 vertical color bars (no visible page background, by design — the spec calls for a pure, chrome-free color-encoded visualization).
      Chrome: Only text element is the mandated title "heatmap-stripes-climate · javascript · chartjs · anyplot.ai", centered, bold, dark ink color, clearly legible against the light title band. No axis labels, tick labels, gridlines, or legend — correctly omitted per spec.
      Data: Stripes progress smoothly from muted blue (left, ~1850) through near-white/cream (middle, ~zero anomaly) to deep matte red (right, ~2024), using the imprint_div diverging scale (#4467A3 blue ↔ pageBg midpoint ↔ #AE3030 red). Bars are gapless and equal width.
      Legibility verdict: PASS — title fully readable, no clipping, no overlap.

    Dark render (plot-dark.png):
      Background: Title band is warm near-black matching #1A1A17.
      Chrome: Same title text now rendered in light ink (#F0EFE8-equivalent), clearly legible against the dark title band. No dark-on-dark or light-on-light issues observed. No axes/labels/gridlines, consistent with the light render and the spec.
      Data: Same blue-to-red progression, data hues (#4467A3 blue, #AE3030 red, and the interpolated stops) are visually identical to the light render — only the title-band chrome (background + text color) flipped, exactly as required. Confirmed no dark-on-dark chrome failures.
      Legibility verdict: PASS — title fully readable, no clipping, no overlap, no dark-on-dark failures.
