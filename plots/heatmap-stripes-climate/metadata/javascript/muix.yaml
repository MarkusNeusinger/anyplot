review:
  strengths:
  - 'Faithful, minimalist recreation of the canonical Ed Hawkins warming-stripes form:
    no axes, ticks, labels, or gridlines, matching the spec''s ''strip away everything
    but color'' requirement'
  - Creative, idiomatic use of MUI X's ordinal xAxis colorMap on a single-value BarChart
    to fake a continuous per-year color stripe, working around the community package's
    lack of a native heatmap component
  - 'Correct ~3:1 aspect ratio (stripeHeight = stripeWidth / 3.1) matching the spec''s
    ''wide and short'' guidance, with equal-width, zero-gap bars (categoryGapRatio:
    0)'
  - 'Fixed diverging endpoints (matte red #AE3030 / blue) are pixel-verified identical
    between light and dark renders at the chart''s hottest year, and the symmetric
    fraction = value / maxAbsAnomaly normalization mathematically satisfies the spec''s
    ''equal visual intensity for equal +/- anomalies'' requirement'
  - Deterministic LCG-seeded synthetic data with a plausible accelerating-warming
    trend, clean code with no unused imports, and a correct output contract (skipAnimation,
    sizes from window.ANYPLOT_SIZE, no hardcoded canvas)
  weaknesses:
  - 'CRITICAL — invisible bars at the zero-crossing: the diverging scale''s midpoint
    (tokens.div[1]) is the theme-adaptive page-background color, so as anomaly ->
    0 the interpolated bar color converges on the exact page background. Pixel-sampling
    both PNGs confirms this is not just ''pale'' but literally zero RGB distance from
    the background at the zero-crossing (~year 1958) in BOTH themes: light bar RGB
    (250,248,241) == page bg (250,248,241); dark bar RGB (25,25,22) ~= page bg (26,26,23).
    A multi-year band of bars is fully invisible, reading as a blank gap in the stripe
    sequence where the data says there IS a year with an anomaly value.'
  - 'Widespread low-contrast band, not just a single seam: because the trend is ''slow
    start, accelerating post-1975'' (progress**2.2), roughly the first 60-70 years
    (1900s-1960s) have small |anomaly| and therefore land close to the theme-adaptive
    midpoint. Sampling a horizontal scanline across the full stripe width shows 30.7%
    of the light render and 49.6% of the dark render sit within a 30-unit RGB distance
    of the page background — i.e. nearly half the dark-theme chart is barely distinguishable
    from its own backdrop. Fix: clamp the interpolation so |fraction| never drives
    the mix all the way to the exact background color — e.g. floor |fraction| at ~0.12-0.15
    before mixing, or interpolate toward a genuine off-background neutral (e.g. a
    fixed light/dark gray offset ~10-15% in lightness from pageBg) rather than literally
    pageBg itself, while keeping the fixed red/blue endpoints unchanged.'
  - 'Because the midpoint token is theme-dependent, every non-endpoint bar''s color
    differs between light and dark renders (verified: a bar at a middling fraction
    reads RGB (212,218,225) in light vs (35,42,52) in dark) — this is the intended
    behavior per the imprint_div style-guide formula for a diverging midpoint, but
    combined with the near-invisible band above it means a large fraction of the chart''s
    data colors are not just theme-flipped but theme-erased.'
  - Pale intermediate hues across roughly the pre-1975 half of the timeline reduce
    color discriminability for low-vision readers beyond what's typical for a diverging
    scale, compounding the contrast issue above (VQ-04).
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1, confirmed by pixel sampling (250, 248, 241) at the canvas edge.
      Chrome: Single title line "heatmap-stripes-climate · javascript · muix · anyplot.ai" in dark ink, centered above the stripe block. Clearly readable, no axes/ticks/gridlines/legend present, matching the spec's "pure data visualization" requirement.
      Data: A horizontal band of ~125 equal-width, zero-gap vertical bars running left (1900, cool blue-gray) to right (2024, deep matte red #AE3030-ish). The left half is dominated by pale blue-gray/off-white bars; the right half deepens steadily into saturated red. A visible band of bars roughly a third of the way from the left is barely tinted, nearly blending into the cream background — pixel sampling confirms at least one bar column is an EXACT match to the page background (0 RGB distance), i.e. genuinely invisible, not just faint.
      Legibility verdict: FAIL — the title and overall chrome are legible, but a real portion of the DATA (the near-zero-anomaly bars) is not legible: it is indistinguishable from the background, which is a data-visibility failure even though no text is affected.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17, confirmed by pixel sampling (26, 26, 23) at the canvas edge.
      Chrome: Same title text now in light ink, clearly readable against the dark surface. No axes/ticks/gridlines/legend, matching spec.
      Data: Same left-to-right cool-to-warm progression, but roughly half the chart (pixel-sampled: 49.6% of the scanned width is within a 30-unit RGB distance of the page background) is so dark it nearly disappears into the near-black backdrop — far worse than in the light render because both the low-anomaly bar tint and the page background are dark. The exact zero-crossing band is again pixel-identical to the background (0 RGB distance measured), producing a literal blank gap. The fixed hot-red endpoint at the far right is confirmed pixel-identical to the light render's endpoint (174, 48, 48 in both), so the two extremes of the palette are correctly theme-invariant — the problem is confined to the theme-adaptive midpoint and its surrounding low-fraction band.
      Legibility verdict: FAIL — text is fine, but the dark-on-dark data problem (not text) is worse here than in light mode: a wide swath of early-20th-century bars is effectively invisible against the near-black page.
