review:
  strengths:
  - 'Faithful warming-stripes form: 125 equal-width, touching, full-height stripes
    (band axis with categoryGapRatio 0, axes hidden with position ''none'', zero margin)'
  - Colour from imprint_div with symmetric limits set by the largest absolute anomaly,
    so equal cold and warm anomalies get equal intensity
  - An intensity floor keeps the palest stripes distinct from the theme-adaptive midpoint,
    so the band holds its edge on both the cream and the near-black page
  - Per-datum colorGetter plus a valueFormatter tooltip exposes each year's anomaly
    in the interactive HTML while the PNG stays pure colour
  - 'Plausible seeded data: slow start, accelerating warming after about 1975, interleaved
    warm and cool years'
  weaknesses:
  - 'Suggestion: a descriptive title prefix such as ''Global Temperature 1900–2024
    · '' would tell a gallery visitor what the stripes encode without adding any chrome
    to the plot.'
