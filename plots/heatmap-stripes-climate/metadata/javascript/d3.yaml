review:
  strengths:
  - 'Correctly applies the temperature semantic exception: reorders the Imprint diverging
    stops (t.div[2]/[1]/[0]) so cold anomalies read blue and warm anomalies read red,
    exactly as the style guide''s ''domain conventions'' carve-out allows.'
  - Symmetric d3.scaleSequential domain ([-extent, extent]) genuinely centers the
    colormap at zero, so equal-magnitude anomalies get equal visual intensity as the
    spec requires.
  - 'Correct minimalism: no axes, ticks, gridlines, or labels — pure edge-to-edge,
    equal-width, no-gap stripes exactly per spec''s ''pure data visualization'' requirement.'
  - Deterministic LCG-based data generation with a plausible, realistic warming curve
    (slow pre-industrial drift, accelerating post-1980 rise, ~-0.35°C to ~+1.2°C vs.
    1961-1990 baseline) that matches real HadCRUT/GISS-style anomaly magnitudes.
  - 'Theme-adaptive chrome is correct in both renders: title uses t.ink and reads
    clearly on both the #FAF8F1 and #1A1A17 title bar, while the data colors are pixel-identical
    between themes.'
  - Clean, idiomatic D3 data-join (`selection.data(years).join('rect')`) with a KISS
    top-to-bottom structure and no fake interactivity.
  weaknesses:
  - Spec explicitly targets an ~3:1 (wide-and-short) aspect ratio to emphasize horizontal
    time progression; the implementation uses the default landscape canvas (3200x1800
    = 16:9 ≈ 1.78:1). This is understood to be constrained by the platform's two hard-gated
    canvas sizes (16:9 landscape or 1:1 square) — landscape is the correct choice
    of the two — but it still falls short of the spec's explicit ratio target and
    is worth noting for anyone revisiting canvas options.
  - 'Library Mastery is generic: the implementation only uses standard d3 scale +
    data-join patterns (scaleBand, scaleSequential+interpolateRgbBasis, selection.data().join())
    that could be replicated in almost any charting library with a for-loop and a
    color-interpolation helper. Nothing here is distinctively D3 (e.g. no custom transitions,
    no D3-specific compositional trick) — though the spec''s ''no chrome'' constraint
    does genuinely limit how much room there is to add D3-idiomatic flourishes without
    violating the minimalism requirement.'
  - 'Design Excellence is competent but not exceptional: the chart is a faithful,
    clean recreation of the well-known ''warming stripes'' genre with correct semantic
    color reasoning, but doesn''t add anything beyond the baseline concept (e.g. no
    subtle emphasis/annotation of the most recent extreme years, no additional refinement
    layered on top of the core color-only encoding).'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white title bar (~#FAF8F1) at the top ~64px strip; the stripe area itself fills the remaining canvas edge-to-edge with no background visible between bars.
      Chrome: Title "heatmap-stripes-climate · javascript · d3 · anyplot.ai" is centered, bold, dark ink text (#1A1A17) on the light title bar — clearly legible, no overlap, no clipping. No axis labels, ticks, or gridlines are present, matching the spec's "pure data visualization" requirement.
      Data: 175 equal-width vertical stripes (one per year, 1850-2024) with no visible gaps, running from muted blue-gray on the left (coolest anomalies, early record) through a near-neutral pale zone in the middle, to progressively deeper red on the right (warmest, most recent years). The reddest stripes at the far right reach a saturated matte red consistent with the Imprint diverging red stop (#AE3030); the bluest stripes on the far left are comparatively pale because the actual coldest anomaly is smaller in magnitude than the domain's symmetric extent — this is expected/realistic given the asymmetric shape of real-world warming data, not a rendering defect.
      Legibility verdict: PASS — title is fully readable, no dark-on-light or clipped text issues.

    Dark render (plot-dark.png):
      Background: Warm near-black title bar (~#1A1A17); stripe area again fills the rest of the canvas edge-to-edge.
      Chrome: Same title text now rendered in light ink (#F0EFE8-ish) on the dark title bar — clearly legible against the dark background, no dark-on-dark issue.
      Data: Confirmed pixel-identical stripe colors to the light render — same blue-to-red progression, same relative saturation pattern from left (pale blue) to right (deep red). Only the chrome (title bar background/text color) flips between themes; the data stripes themselves do not change, as required.
      Legibility verdict: PASS — title text is clearly visible against the dark title bar, no legibility failures in either theme.
