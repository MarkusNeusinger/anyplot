review:
  strengths:
  - Faithful, minimalist recreation of the Ed Hawkins warming-stripes style — no axes,
    ticks, or gridlines, exactly as the spec requires.
  - 'Diverging color scale is correctly symmetric around zero: both cold and warm
    sides normalize against the same maxAbsAnomaly, so equal +/- anomalies get equal
    visual intensity.'
  - 'Thoughtful theme handling for the near-zero midpoint: a fixed off-white (#FAF8F1)
    is used instead of the theme-adaptive imprint_div midpoint, specifically so the
    pale near-zero band stays visible against the near-black dark background instead
    of vanishing into it — while the cold/warm endpoint hues stay theme-invariant,
    so data colors read as identical between light and dark renders.'
  - 'Realistic data trajectory: roughly -0.35°C in the 1850s rising to ~+1.2°C by
    2024, matching real HadCRUT/GISS global anomaly magnitudes relative to a 1961-1990
    baseline.'
  - Uses the full 175-year range (1850-2024), the upper bound of the spec's suggested
    row count, with a deterministic seeded LCG for reproducibility.
  - Custom tooltip formatter adds real interactive value (per-year anomaly on hover)
    in the HTML detail view without affecting the static PNG.
  weaknesses:
  - 'LM-01/LM-02: the hand-rolled hexToRgb/lerpColor interpolation reinvents continuous
    color mapping; ECharts'' native visualMap component (continuous type, feeding
    off `t.div`) is purpose-built for mapping a numeric field to color and would be
    a more idiomatic, library-native approach than manual per-point itemStyle colors.'
  - 'CQ-01: five small helper functions (lcg, hexToRgb, rgbToHex, lerpColor, colorForAnomaly)
    add more structure than strictly necessary — a visualMap-based approach would
    let most of this collapse directly into the option config.'
  - 'SC-02: the spec asks for a ~3:1 wide-and-short aspect ratio, but the implementation
    uses the default 3200×1800 (16:9) landscape canvas. This is the closer of the
    two canvas sizes the ECharts harness allows (3200×1800 or 2400×2400 square) and
    is not the implementation''s fault, but it still falls short of the spec''s stated
    3:1 intent.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1) fills both the title band and the area behind the stripes, consistent with the anyplot light theme surface.
      Chrome: The title "heatmap-stripes-climate · javascript · echarts · anyplot.ai" sits centered in a ~90px band at the top, rendered in bold dark ink. No axes, ticks, gridlines, or legend are present, as the spec requires.
      Data: 175 vertical stripes (one per year, 1850-2024) span the full canvas edge-to-edge with no gaps. Colors progress smoothly from muted steel-blue on the left (pre-industrial, cooler anomalies), through a pale off-white near-zero band around the middle, to increasingly saturated brick-red on the right (recent, warmer anomalies). First-series brand green is not applicable here (continuous diverging data, not categorical).
      Legibility verdict: PASS - title text is clearly readable against the light background; no overlap or clipping.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17) fills the title band and the area behind the stripes, consistent with the anyplot dark theme surface.
      Chrome: The same title text is rendered in light/off-white ink, clearly legible against the dark band. No axes, ticks, gridlines, or legend, matching the light render's chrome layout.
      Data: The same 175 stripes are present with visually identical colors to the light render (blue -> pale near-zero -> red progression). The pale near-zero band remains clearly visible against the dark surroundings because the implementation intentionally hardcodes a fixed off-white midpoint instead of using a theme-adaptive one that would otherwise blend into the near-black background.
      Legibility verdict: PASS - no dark-on-dark failures; title and the pale near-zero stripes both stay clearly distinguishable from the #1A1A17 background.
