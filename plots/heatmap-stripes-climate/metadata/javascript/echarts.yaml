review:
  strengths:
  - Correctly implements the symmetric-around-zero diverging color mapping required
    by the spec (norm = anomaly / maxAbsAnomaly, clamped to [-1, 1]) so equal positive/negative
    anomalies get equal visual intensity
  - Uses the Imprint imprint_div palette with the semantically correct cold=blue /
    warm=red remapping for temperature data, per the style guide's semantic-exception
    rule
  - 'Fully minimalist chrome: no axes, no tick marks, no gridlines, no legend — exactly
    matches the spec''s ''pure data visualization'' requirement'
  - 'Equal-width, no-gap bars (barCategoryGap: 0%, barWidth: 100%) faithfully reproduce
    the classic warming-stripes look'
  - Deterministic seeded LCG data generation with a plausible flat-preindustrial-then-accelerating-warm-tail
    trend shape that matches real HadCRUT/GISS anomaly records
  - Adds a genuinely useful hover tooltip (year + signed anomaly) that only helps
    the interactive HTML view without harming the static PNG
  - Title follows the exact mandated `{spec-id} · {language} · {library} · anyplot.ai`
    format and is legible in both themes
  weaknesses:
  - 'Dark-mode readability defect: the diverging midpoint color (t.div[1]) is literally
    the page background hex (#1A1A17 in dark theme, confirmed by pixel sampling: stripes
    near zero anomaly render as rgb(28,30,31)/(29,32,33), essentially indistinguishable
    from the #1A1A17 chrome). Because the bars fill the entire canvas with barCategoryGap:
    0%, this produces a wide band (roughly 20-30 years around the trend''s zero-crossing,
    ~30% of the chart width) that visually reads as ''missing data'' or a rendering
    hole rather than a neutral midpoint — the classic warming-stripes blue-white-red
    story only survives in the light render. Fix: for a diverging color ramp that
    has to remain visible across the FULL canvas with no exposed page background (unlike
    a heatmap grid with gaps), do not lerp toward the literal theme-adaptive t.div[1]/pageBg
    token — lerp toward a fixed pale-neutral (e.g. a constant light gray/cream) so
    the midpoint stays visually distinct from both the dark chrome and the saturated
    ends in both themes.'
  - Target aspect ratio from the spec ('approximately 3:1, wide and short') isn't
    hit — the implementation uses the default landscape canvas (3200x1800, ~1.78:1).
    This is a reasonable byproduct of the two fixed canvas formats, but note it if
    a squatter crop becomes feasible.
  - 'Library mastery is fairly generic: a bar-series repurposed as a heatmap stripe
    (the only viable ECharts approach here) plus a tooltip formatter — no other ECharts-distinctive
    feature is exercised.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1) visible only in the thin title strip at the top; the rest of the canvas is fully covered edge-to-edge by 175 vertical, equal-width, no-gap bars ("stripes"), one per year from 1850 to 2024.
      Chrome: Title "heatmap-stripes-climate · javascript · echarts · anyplot.ai" is dark ink text, bold, centered, clearly legible against the cream strip. No axes, ticks, gridlines, or legend are present, matching the spec's "pure data visualization" mandate.
      Data: Stripes progress from muted steel-blue on the left (coldest anomalies, ~1850s) through a pale cream/off-white band in the middle (near-zero anomalies, ~1930s) to increasingly saturated brick-red on the right (warmest anomalies, ~2024). The progression is smooth and the cold/warm halves are visually well balanced. First-series green is not applicable here (continuous diverging data, not categorical).
      Legibility verdict: PASS — title is fully readable, no text/data collisions, no clipping.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17) visible in the title strip.
      Chrome: Title text is light (#F0EFE8-ish), bold, centered, clearly legible against the near-black strip. Same absence of axes/ticks/gridlines/legend as the light render — correct.
      Data: Stripes on the left are a muted slate-blue (cold anomalies), and stripes on the right are saturated red (warm anomalies) — pixel sampling confirms these end colors are stable across themes as required. However, the pixel-sampled bars near the middle of the chart (roughly 35-55% of the width, corresponding to years with near-zero anomaly) come back as rgb(28,30,31) and rgb(29,32,33) — visually identical to the #1A1A17 canvas/title background. This creates a wide, nearly invisible "hole" in the middle of the dark-theme render where the classic warming-stripes neutral band should read as a distinct pale/neutral tone instead of near-black. This is a real data-visibility defect specific to dark mode, not a text-legibility problem (no title/label text is dark-on-dark).
      Legibility verdict: FAIL for data — the near-zero-anomaly stripe band is not clearly distinguishable from the plot's own background/chrome in dark theme, even though all title text remains fully readable.
