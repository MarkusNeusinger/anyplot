review:
  strengths:
  - 'Minimalist execution matches the spec exactly: axes, tick marks, gridlines, legend,
    and tooltip are all disabled, leaving pure color-encoded data as required.'
  - 'Deterministic, realistic data: fixed-seed LCG generates 175 years (1850-2024,
    the upper end of the spec''s 100-175 range) with a plausible accelerating-warming
    shape and a magnitude (~-0.45 to ~+1.2C) consistent with real HadCRUT/GISS-style
    anomaly series.'
  - 'Correct diverging color direction and rationale: cold->blue, warm->red is implemented
    via the Imprint imprint_div stops with a documented semantic-exception justification,
    and the two color poles (t.div[0]/t.div[2]) are theme-independent so the most
    extreme years render pixel-identical in light and dark (verified: rightmost bar
    is RGB(160,46,45) in both renders).'
  - 'Genuinely Highcharts-distinctive touch: a subtle SVGRenderer radial vignette
    confined to the plot box (excludes the title band) adds depth without adding forbidden
    chrome.'
  - 'Clean, honest code: no fake interactivity, no unused imports/dependencies, animation
    disabled at both chart and series level per the harness contract, mandated title
    format followed exactly.'
  weaknesses:
  - 'Visible gaps between bars at the top edge, violating the spec''s explicit ''no
    gaps between bars'' rule: Highcharts columns default to a non-zero borderRadius,
    so every one of the 175 bars has rounded top corners, creating small page-background-colored
    notches along the entire top border of the stripe field (confirmed by pixel sampling:
    rows y=140-155 in plot-light.png are full-width page-background color between
    bar tops, directly under the title). Fix: set `borderRadius: 0` in `plotOptions.column`
    (or on the series/point config) so bars are flat-topped rectangles that butt against
    each other with zero gap, matching pointPadding/groupPadding/borderWidth which
    are already correctly set to 0.'
  - 'Data colors are not read-consistent between light and dark for low/medium-magnitude
    years, going beyond the allowed ''only chrome flips'' rule: colorForAnomaly()
    blends each bar from t.div[1] (the theme-adaptive midpoint, #FAF8F1 light / #1A1A17
    dark) toward the warm/cold pole, so the same year renders very differently by
    theme. Example measured at x=10 (leftmost/earliest year, magnitude ~0.38): light
    = RGB(172,182,196) pale blue-gray, dark = RGB(38,49,66) deep navy -- a large lightness/saturation
    jump for identical underlying data, even though the two extreme-magnitude years
    at the far right do correctly converge to an identical color in both themes. Only
    the strongest years currently look consistent; the majority of the record (low/medium
    magnitude) looks qualitatively different across themes. Fix: blend against a fixed,
    theme-independent neutral anchor (or reduce how much of the blend range is anchored
    to the page background) so the color read at a given magnitude stays recognizable
    between the two renders, reserving the theme-adaptive midpoint behavior for the
    true near-zero region only.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1), correct — not pure white, not dark.
      Chrome: Only a single text element, the mandated title "heatmap-stripes-climate · javascript · highcharts · anyplot.ai", set in dark ink (t.ink), bold, ~22px, centered near the top. Clearly legible against the light background. No axes, ticks, gridlines, or legend present (correct per spec — this plot type is meant to be pure color encoding).
      Data: 175 vertical stripes spanning the full canvas width, one per year 1850-2024, colored on a blue-to-red diverging scale. Left third reads as muted blue-gray, fading through a near-white/pale-pink neutral band roughly in the middle-left, then intensifying into saturated red toward the right edge (most recent years). First-glance the trend "from cool to warm" reads clearly. On close inspection (pixel sampling), the very top ~15px of every bar has a small rounded-corner notch that lets the page background peek through between adjacent bars — a thin but visible scalloped seam runs along the entire top edge, just below the title.
      Legibility verdict: PASS (title fully legible; no dark-on-light or missing-contrast issues).

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17), correct — not pure black, not light.
      Chrome: Same title text, now in light ink (t.ink for dark theme), clearly legible against the dark background. Same absence of axes/ticks/grid/legend, consistent with the light render.
      Data: Same 175-stripe layout and left-to-right blue-to-red progression. However, the actual pixel colors of low/medium-magnitude years differ substantially from the light render — e.g. the leftmost (earliest, ~1850) stripe is a much darker, more saturated navy in this render versus a washed-out pale blue-gray in the light render, because the color-blend basis is the theme-adaptive page background rather than a fixed neutral. Only the most extreme (highest-magnitude, rightmost) stripes converge to an identical color across both renders (confirmed via pixel sampling: RGB(160,46,45) in both). The same top-edge rounded-corner notch/gap artifact is present here too, using the dark page background color instead.
      Legibility verdict: PASS (title fully legible, no dark-on-dark failure) — but data-color consistency across themes is a real weakness (see Weaknesses).
