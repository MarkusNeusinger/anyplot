review:
  strengths:
  - Correct, theme-independent per-year diverging color computed directly from the
    Imprint div stops (t.div[0]/t.div[2]); verified pixel-identical between light
    and dark renders at multiple sample points.
  - Pure minimalist stripe field with no axes, labels, tick marks, or gridlines, matching
    the spec exactly.
  - Realistic accelerating-warming synthetic data (-0.45C to +1.2C, 1850-2024) that
    closely tracks the shape of real HadCRUT/GISS-style anomaly records.
  - Distinctive Highcharts SVGRenderer vignette overlay (radial gradient rect) confined
    to the plot box, adding subtle depth without touching title legibility or breaking
    theme-adaptive rules.
  - 'Well-documented code: comments explain why the color-blend midpoint uses the
    pole average rather than the page-background-adaptive div[1] stop (to preserve
    cross-theme color identity).'
  weaknesses:
  - The near-zero-anomaly 'neutral' color is a direct RGB blend of the two diverging
    poles (t.div[0]/t.div[2]) rather than a true desaturated midpoint, producing a
    muddy purple-brown wash across most of the low-magnitude years (roughly 1850-1980).
    This dulls the classic warming-stripes visual impact and makes adjacent low-magnitude
    years hard to tell apart.
  - The mandated 3200x1800 (16:9) landscape canvas gives an aspect ratio of ~1.78:1,
    short of the spec's suggested ~3:1 — largely an unavoidable platform-canvas tradeoff,
    but worth noting.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1) for the title band; below it the plot area is fully covered edge-to-edge by 175 vertical color stripes (no visible page background inside the plot box).
      Chrome: Title "heatmap-stripes-climate . javascript . highcharts . anyplot.ai" in bold dark ink (#1A1A17), clearly readable against the off-white band, roughly centered, ~35% of canvas width. No axes, ticks, or gridlines, matching the spec's "pure data visualization" requirement.
      Data: Stripe field progresses left to right from a muted blue-grey-purple (leftmost sampled pixel ~rgb(94,78,115)) through a muddy purple-brown midsection to a warm brick red on the right (rightmost sampled pixel ~rgb(154,47,48)). A subtle radial vignette darkens the corners slightly for depth. Individual year-to-year noise is visible as fine-grained stripe variation, consistent with real warming-stripes data. First-series color intent (t.div poles) confirmed: rightmost pixel close to t.div[0] #AE3030 (matte red); leftmost pixel is a blend, not the full-saturation t.div[2] #4467A3 (blue), because the underlying data's cold anomalies are smaller in magnitude than its warm anomalies (physically correct for the shared-scale climate record) and because the "zero" blend color is itself a blue/red 50-50 mix rather than a pale neutral, which is the main flagged weakness.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17) for the title band; plot area again fully covered by the stripe field.
      Chrome: Same title text now in light ink (#F0EFE8), clearly readable against the dark band. No dark-on-dark or light-on-light failures observed.
      Data: Sampled pixel colors at matching x-coordinates are identical to the light render (e.g. x=10: rgb(94,78,115) in both; x=3190: rgb(154,47,48) in both), confirming the hard rule that data colors stay pixel-identical across themes and only chrome (title color, page background) flips.
      Legibility verdict: PASS
