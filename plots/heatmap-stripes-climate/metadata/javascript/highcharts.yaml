review:
  strengths:
  - Correct blue-to-red diverging warming-stripes encoding, symmetric around zero
    anomaly, matching the spec's core requirement
  - No axes, gridlines, tick marks, or legend — matches the spec's minimalist mandate
  - Deterministic LCG-seeded synthetic data producing a realistic accelerating-warming
    curve, 1850-2024 (175 years, at the spec's upper bound)
  - Correctly works around the missing heatmap/colorAxis module by computing per-point
    column colors from t.div, with the rationale clearly documented in a comment
  - Title correctly formatted ("heatmap-stripes-climate · javascript · highcharts
    · anyplot.ai") and legible in both themes; canvas passes the 3200x1800 gate
  - Diverging colormap endpoints (deep red / deep blue) are pixel-identical between
    light and dark renders as required; only the theme-adaptive midpoint (per the
    style guide's imprint_div spec) flips
  weaknesses:
  - Bars for near-zero anomalies interpolate all the way to the exact page-background
    color (t.div[1] = pageBg), so low-magnitude years become effectively invisible
    against the canvas in both themes — acceptable for the warming-stripes genre,
    but consider a small minimum-distance floor from bg so no year is fully indistinguishable
    from the frame
  - Design Excellence is solid but generic within the color-only presentation — the
    chart is correct but not especially refined; consider a touch more visual polish
    (e.g. a very subtle vertical vignette or edge treatment) without adding forbidden
    chrome
  - 'Library Mastery is modest: only basic per-point column coloring is demonstrated,
    no other Highcharts-distinctive capability (acceptable given the minimalist spec,
    but flagged for parity with more idiomatic Highcharts usage)'
  - Five small helper functions (lcgRandom, hexToRgb, rgbToHex, lerpColor, colorForAnomaly)
    push past a simple KISS import-to-plot flow — justified by the core-bundle constraint
    (documented in the code comment), but hexToRgb/rgbToHex could be merged into one
    small utility to trim it down
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (~#FAF8F1), not pure white, not dark.
      Chrome: Title "heatmap-stripes-climate · javascript · highcharts · anyplot.ai" in bold dark ink, centered at top, clearly legible against the light background. No other chrome (axes, ticks, gridlines, legend) is present, matching the spec's minimalist mandate.
      Data: ~175 vertical column stripes span the full canvas width and height edge-to-edge with no gaps. Colors progress smoothly from steel/slate blue on the left (coldest anomalies, ~1850s), through near-background cream in the low-magnitude middle years, to deep brick red on the right (warmest anomalies, ~2020s). No red-green confound; blue/red is CVD-safe.
      Legibility verdict: PASS — title text is fully readable, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black (~#1A1A17), not pure black, not light.
      Chrome: Same title text rendered in light/cream ink, centered at top, clearly legible against the dark background. No dark-on-dark failures — the title color flips correctly with theme.
      Data: Same stripe progression as the light render — blue on the left transitioning through near-black in the low-magnitude middle years to deep red on the right. The extreme endpoint colors (deepest blue, deepest red) are visually identical to the light render, confirming only chrome (background + title ink) flips between themes, as required. The near-black middle stripes blend closely with the dark chrome background — this is the intended behavior of the style guide's theme-adaptive imprint_div midpoint (pageBg-colored center), not a bug, though it does make those years hard to distinguish from the canvas.
      Legibility verdict: PASS — title text is fully readable, no dark-on-dark issues.
