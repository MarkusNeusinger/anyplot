review:
  strengths:
  - Physically accurate multi-segment Clausius-Clapeyron sublimation and vaporization
    curves (vaporization explicitly anchored through the real 373.15 K / 101325 Pa
    boiling point) plus a Simon-Glatzel melting curve that correctly reproduces water's
    anomalous negative solid-liquid slope
  - 'Comprehensive, spec-required annotation set: triple point and critical point
    both marked with distinct markers and labeled with their real IAPWS coordinates,
    all three phase regions labeled, and the supercritical-fluid region indicated
    with dashed guide lines'
  - Correct Imprint palette in canonical order (melting=#009E73, vaporization=#C475FD,
    sublimation=#4467A3), identical data colors across themes, both renders fully
    legible with no dark-on-dark chrome issues
  - Distinctive, non-trivial use of MUI X's useXScale/useYScale hooks to sync custom
    SVG annotations (guide lines, point markers, labels) to the chart's own coordinate
    scales — a technique specific to this library's chart-context API
  - 'Both attempt-1 weaknesses are now resolved: title fontSize raised to 34 (measured
    ~52% of plot width, comfortably in the required 50-70% range and now the visually
    largest text element) and region-label fontSize reduced to 22, restoring the correct
    typography hierarchy; the yAxis label-offset value was cleaned up into a well-named,
    well-commented constant (Y_AXIS_LABEL_OFFSET_PX) that documents exactly why tickFontSize
    is being repurposed'
  weaknesses:
  - 'tickFontSize: Y_AXIS_LABEL_OFFSET_PX still fundamentally repurposes a prop meant
    to control rendered tick font size to instead control the rotated-label offset.
    It is now clearly named and commented, but remains a fragile coupling to ChartsYAxis''s
    internal offset formula (tickFontSize + tickSize + 10) that could silently break
    if a future MUI X version changes that internal calculation.'
  - Title now sits at the low end of the recommended 50-70% plot-width range (~52%)
    rather than comfortably mid-range — a few more px of fontSize would give it more
    visual presence as the primary heading, though the hierarchy inversion from attempt
    1 is fully resolved.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Title "phase-diagram-pt · javascript · muix · anyplot.ai" is centered at top in dark ink at fontSize 34, now measured at ~52% of the plot width (up from ~29% of canvas width in attempt 1) — comfortably in the required 50-70% band and clearly the largest text element on the canvas. Axis titles "Temperature (K)" (bottom) and "Pressure (Pa, log scale)" (rotated, left) are dark ink and fully readable with units. Tick labels (200-700 K on X; 1 Pa-100 MPa on Y, log-formatted) are dark and legible, well spaced, no overlap. Horizontal grid lines are thin and subtle. Legend at bottom center with three colored swatches and labels, all readable, close to the plot.
      Data: First series (Solid-Liquid/melting) is brand green #009E73, second series (Liquid-Gas/vaporization) is lavender #C475FD, third series (Solid-Gas/sublimation) is blue #4467A3 — matches Imprint canonical order. Triple point and critical point are marked with solid black-filled circles (cream-colored stroke) and annotated with bold labels plus real coordinate values (273.16 K, 611.7 Pa / 647.1 K, 22.06 MPa). Phase region labels "Solid", "Liquid", "Gas" are now fontSize 22 (down from 30 in attempt 1), correctly smaller than the title, placed in their respective regions as semi-transparent gray text. A dashed guide line marks the supercritical-fluid boundary extending from the critical point. All curves are smooth, distinguishable, and converge correctly at the triple point.
      Legibility verdict: PASS (all text readable; the title-size/hierarchy issue from attempt 1 is resolved)

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Title, axis titles, tick labels, legend text, and region labels all flip to light ink/off-white and remain fully readable against the dark background — no dark-on-dark failures detected anywhere. Grid lines remain subtle. Triple/critical point markers flip to a light (near-white) fill with a dark stroke, staying clearly visible against the dark background.
      Data: Data colors are pixel-identical to the light render (#009E73 green, #C475FD lavender, #4467A3 blue) — only chrome flipped, as required.
      Legibility verdict: PASS (fully readable, no dark-on-dark text; title/hierarchy fix carries over correctly since it stems from fontSize values, not a theme-specific issue)
