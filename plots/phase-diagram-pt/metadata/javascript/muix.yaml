review:
  strengths:
  - 'Real water data computed rather than placed: the Wagner-Pruss saturation equation
    (IAPWS 1992) for vaporization, the Simon-Glatzel melting equation for ice Ih up
    to the ice Ih-III-liquid point at 209.9 MPa (ending at about 251 K), and Clausius-Clapeyron
    sublimation down to about 0.16 Pa at 200 K'
  - 'Water''s anomalous negative solid-liquid slope is visible: the green melting
    curve rises almost vertically from the triple point and leans toward lower temperature
    at high pressure'
  - Triple point (round marker) and critical point (diamond) are drawn in ink, apart
    from the palette lines, with two-level annotations (bold name, soft coordinates
    with units read from the column names)
  - The liquid-gas curve stops exactly at the critical point; dashed Tc/Pc guides
    enclose a labeled supercritical-fluid region, which has room because of the asymmetric
    right padding
  - Log pressure axis with one tick per decade, labeled as 10 with superscript exponents,
    so the 10-decade range reads at a glance
  - 'MUI X composition idiom: a custom SVG layer rendered as a LineChart child that
    uses the useXScale/useYScale hooks, so every annotation sits in data coordinates;
    one hidden x axis per series lets each curve have its own temperature samples'
  - Theme tokens are threaded through every element; chrome flips cleanly between
    light and dark while the three Imprint line colors stay identical
  weaknesses:
  - 'Suggestion: the solid-liquid line is squeezed into a near-vertical stroke on
    the log axis; a small inset or a second linear-pressure view of the melting curve
    could show its negative slope more clearly'
  - 'Suggestion: the bottom legend repeats the boundary names that the region labels
    already imply; direct labels along each curve could replace it'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, landscape 3200x1800.
      Chrome: bold dark title "Water · phase-diagram-pt · javascript · muix · anyplot.ai", soft-ink subtitle (180 boundary points on 3 curves, log scale over 10 decades), y axis "Pressure (Pa), log scale" with decade ticks 10^-1 to 10^8, x axis "Temperature (K)" with ticks from 200 to 700, subtle horizontal grid, bottom legend. All text is dark on light and readable.
      Data: green #009E73 solid-liquid curve rising almost vertically from the triple point and leaning toward lower temperature up to about 251 K / 2x10^8 Pa; lavender #C475FD liquid-gas curve from the triple point up to the critical point at 647 K / 22 MPa; blue #4467A3 sublimation curve from 200 K / 0.16 Pa up to the triple point. A dark round marker for the triple point (273.16 K, 611.657 Pa) and a dark diamond for the critical point (647.096 K, 22,064,000 Pa), both annotated; dashed Tc/Pc guides enclose the "Supercritical fluid" label. Solid, Liquid and Gas labels sit in their regions.
