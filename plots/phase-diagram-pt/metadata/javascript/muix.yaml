review:
  strengths:
  - 'Physically grounded water data: Wagner-Pruss vaporization ending exactly at 647.096
    K / 22.064 MPa, Simon-Glatzel melting with the negative slope up to the ice Ih-III
    limit, Clausius-Clapeyron sublimation'
  - Annotations drawn as SVG children in data coordinates through useXScale/useYScale,
    so labels track the scales
  - Native log pressure axis with one tick per decade and superscript exponent formatting
  - Distinct ink-colored circle and diamond for triple and critical points with two-tier
    labels (name, coordinates)
  - All region labels placed in their correct areas, supercritical region bounded
    by dashed guides beyond the critical point
  - 'Clean theme adaptation: chrome tokens flip, Imprint curve colors identical in
    both renders'
  weaknesses:
  - 'SC-02 (both): the boundary curves carry 36 (melting), 41 (vaporization) and 30
    (sublimation) points, below the spec''s 50-200 per curve; the melting curve shows
    visible corners between 10^8 and 2x10^8 Pa → at least 50 points per curve (+14,
    +9, +20). Likely cause: Array.from length 36 / 41 / 30.'
  - 'CQ-04 (code): the triple and critical coordinates are aliased twice, TT/PT/TC/PC
    at lines 44-47 and tt/tc/logPt/logPc at lines 85-88 → keep one set of aliases.
    Likely cause: the region-anchor block redefining constants already declared above.'
  - 'Suggestion: the subtitle recites point counts and the decade span; a line on
    water''s negative melting slope would tell the reader something the axes do not.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1.
      Chrome: centered bold title "Water · phase-diagram-pt · javascript · muix · anyplot.ai", soft subtitle "107 boundary points on 3 curves · pressure on a log scale over 10 decades"; x axis "Temperature (K)" 200-700 every 20 K; y axis "Pressure (Pa), log scale" with decade ticks 10⁻¹ to 10⁸; subtle horizontal grid; bottom legend with three line glyphs. All text dark and readable.
      Data: green #009E73 melting curve rising almost vertically from the triple point and leaning left to ~251 K at 2x10^8 Pa; lavender #C475FD vaporization curve from the triple point to the critical point; blue #4467A3 sublimation curve from 200 K / ~0.17 Pa to the triple point. Black circle at the triple point (273.16 K, 611.657 Pa) and black diamond at the critical point (647.096 K, 22,064,000 Pa), each annotated. Bold region labels Solid (left), Liquid (top centre), Gas (bottom centre); dashed guides up and right from the critical point bound "Supercritical fluid".
