review:
  strengths:
  - Physically accurate multi-segment Clausius-Clapeyron sublimation and vaporization
    curves (the vaporization curve is explicitly anchored through the real 373.15
    K / 101325 Pa boiling point) plus a Simon-Glatzel melting curve that correctly
    reproduces water's anomalous negative solid-liquid slope
  - 'Comprehensive, spec-required annotation set: triple point and critical point
    both marked with distinct markers and labeled with their real coordinates, all
    three phase regions labeled, and the supercritical-fluid region indicated with
    dashed guide lines'
  - Correct Imprint palette in canonical order (melting=#009E73, vaporization=#C475FD,
    sublimation=#4467A3), identical data colors across themes, both renders fully
    legible with no dark-on-dark chrome issues
  - Distinctive, non-trivial use of MUI X's useXScale/useYScale hooks to sync custom
    SVG annotations (guide lines, point markers, labels) to the chart's own coordinate
    scales — a technique specific to this library's chart-context API
  weaknesses:
  - 'Title renders at only ~29% of canvas width (measured: 923px of 3200px) at fontSize=22
    — far below the ~70-85% expected for the mandated long ''{spec-id} · {lang} ·
    {lib} · anyplot.ai'' title. Meanwhile the phase-region labels (''Solid''/''Liquid''/''Gas'')
    use fontSize=30, larger than the title itself, which inverts the required typography
    hierarchy (title should be the largest text element, per the style guide). Increase
    the title fontSize to roughly 32-36px CSS (and/or reduce the region-label fontSize
    to ~22-24) so the title reads as the primary heading and better fills its row.'
  - yAxis tickFontSize is set to 85, a magic number the code's own comment admits
    doesn't control the actual rendered tick size (only internal label-offset math)
    — this is a hacky workaround rather than a clean fix; replace with a properly
    named constant or adjust axis margin/labelStyle directly instead of an arbitrary
    large tickFontSize value.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Title "phase-diagram-pt · javascript · muix · anyplot.ai" is centered at top in dark ink, clearly readable but visually small relative to the canvas (measured ~29% of canvas width). Axis titles "Temperature (K)" (bottom) and "Pressure (Pa, log scale)" (rotated, left) are dark ink and fully readable with units. Tick labels (200-700 on X; 1 Pa-100 MPa on Y, log-formatted) are dark and legible, well spaced, no overlap. Horizontal grid lines are thin and subtle. Legend at bottom center with three colored swatches and labels, all readable, close to the plot.
      Data: First series (Solid-Liquid/melting) is brand green #009E73, second series (Liquid-Gas/vaporization) is lavender #C475FD, third series (Solid-Gas/sublimation) is blue #4467A3 — matches Imprint canonical order. Triple point and critical point are marked with solid black-filled circles (cream-colored stroke) and annotated with bold labels plus real coordinate values (273.16 K, 611.7 Pa / 647.1 K, 22.06 MPa). Phase region labels "Solid", "Liquid", "Gas" are large, semi-transparent gray text placed in their respective regions; a dashed guide line marks the supercritical-fluid boundary extending from the critical point. All curves are smooth, distinguishable, and converge correctly at the triple point.
      Legibility verdict: PASS (all text readable; only issue is title being disproportionately small relative to the canvas and to the region-label text, not an unreadability issue)

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Title, axis titles, tick labels, legend text, and region labels all flip to light ink/off-white and remain fully readable against the dark background — no dark-on-dark failures detected anywhere. Grid lines remain subtle. Triple/critical point markers flip to a light (near-white) fill with a dark stroke, staying clearly visible against the dark background.
      Data: Data colors are pixel-identical to the light render (#009E73 green, #C475FD lavender, #4467A3 blue) — only chrome flipped, as required.
      Legibility verdict: PASS (fully readable, no dark-on-dark text; same title-proportion issue as the light render since it stems from the fixed fontSize, not a theme problem)
