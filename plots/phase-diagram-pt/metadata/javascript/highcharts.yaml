review:
  strengths:
  - 'Physically accurate P-T phase diagram for water: solid-liquid, liquid-gas, and
    solid-gas boundaries are derived from Clausius-Clapeyron relations calibrated
    to the real triple point (273.16 K / 611.73 Pa) and critical point (647.1 K /
    22.064 MPa), including water''s correctly modeled anomalous negative-slope fusion
    curve.'
  - 'Zero clipping or overlap issues in either render, exact Imprint palette compliance
    (first series #009E73, canonical order for the three boundary series), and fully
    theme-adaptive chrome.'
  - 'Thoughtful annotation approach: triple/critical points marked with diamond markers
    plus direct dataLabels, phase regions labeled in-place with italic text instead
    of a redundant legend, and the title fontsize dynamically scales with the mandated
    title''s length.'
  - Correctly implemented logarithmic pressure axis spanning the full physically relevant
    range with sensible headroom, and a subtitle surfacing the key reference-point
    values.
  weaknesses:
  - Both x- and y-axis gridlines are enabled for what is primarily a 3-series line
    chart; the style guide recommends y-axis-only gridlines for line charts (both
    axes is reserved for scatter-style readouts) — drop the vertical gridlines or
    reduce their opacity further for a cleaner look.
  - Phase regions are labeled with floating text only. Highcharts core (no add-on
    module needed) supports xAxis/yAxis plotBands — a very subtle background tint
    per region (solid/liquid/gas) keyed to region identity would reinforce the boundaries
    visually and raise the data-storytelling hierarchy beyond label placement alone.
  - Design stays close to a standard line-chart-plus-scatter-labels pattern; a bit
    more deliberate visual hierarchy (e.g. varied line weight per curve importance,
    or a soft supercritical-region shading) would elevate the aesthetic sophistication
    further.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Bold dark title "Water Phase Diagram · phase-diagram-pt · javascript · highcharts · anyplot.ai" and a gray subtitle with triple/critical point values, both clearly legible. Axis titles "Temperature (K)" and "Pressure (Pa)" in medium-gray, tick labels (200-700 on x, 0.1-1G logarithmic on y) in lighter gray, all readable. Subtle warm-gray gridlines on both axes, not competing with data. Legend at bottom lists the three boundary series with matching color swatches.
      Data: Three curves — green "Solid-Liquid boundary" (near-vertical, bending left with rising pressure, correctly showing water's anomalous negative fusion slope), lavender/purple "Liquid-Gas boundary" (smooth curve from triple point to critical point), and blue "Solid-Gas boundary" (sublimation curve). First series is confirmed #009E73 brand green. Diamond markers mark the Triple Point and Critical Point with direct text labels. Italic gray labels "Solid", "Liquid", "Gas", and "Supercritical Fluid" sit inside their respective regions with no overlap with curves, markers, or each other.
      Legibility verdict: PASS — all text is clearly readable against the light background, no light-on-light issues found; checked title, axis, tick, legend, and annotation text at full resolution including a zoomed crop of the top-right and top-left corners — no clipping.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Title and subtitle rendered in light/near-white and soft light-gray respectively, both clearly legible against the dark surface. Axis titles, tick labels, and legend text all switch to light tones — no dark-on-dark failures found anywhere (verified via a zoomed crop of the y-axis tick labels).
      Data: Identical green/lavender/blue curve colors to the light render — confirmed only chrome (background, text, gridlines, marker outline) flipped between themes; data hues are pixel-identical.
      Legibility verdict: PASS — all text reads clearly on the dark background, including the italic region labels and the diamond-marker annotations; brand green remains vivid and distinguishable on the dark surface.
