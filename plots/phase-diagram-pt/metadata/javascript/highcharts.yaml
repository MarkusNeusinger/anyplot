review:
  strengths:
  - 'Physically accurate P-T phase diagram for water: solid-liquid, liquid-gas, and
    solid-gas boundaries are derived from Clausius-Clapeyron relations calibrated
    to the real triple point (273.16 K / 611.73 Pa) and critical point (647.1 K /
    22.064 MPa), including water''s correctly modeled anomalous negative-slope fusion
    curve.'
  - 'Both attempt-1 weaknesses are cleanly fixed: x-axis gridlines are now removed
    (y-axis-only grid, matching the style guide''s line-chart rule), and a subtle
    ink-tinted rectangle now shades the Supercritical Fluid corner (T > critical T,
    P > critical P) via a Highcharts render event — reinforcing the region boundary
    without any add-on module.'
  - 'Zero clipping or overlap in either render, exact Imprint palette compliance (first
    series #009E73, canonical order for the three boundary series), and fully theme-adaptive
    chrome verified on both light and dark backgrounds.'
  - 'Thoughtful annotation approach: triple/critical points marked with diamond markers
    plus direct dataLabels, phase regions labeled in-place with italic text instead
    of a redundant legend, and the title fontsize dynamically scales with the mandated
    title''s length.'
  - Correctly implemented logarithmic pressure axis spanning the full physically relevant
    range with sensible headroom, and a subtitle surfacing the key reference-point
    values.
  weaknesses:
  - Line weight is uniform (3px) across all three boundary curves; a slight emphasis
    on the liquid-gas boundary (the one terminating at the critical point) would sharpen
    the visual hierarchy further.
  - No callout draws attention to the physically notable fact that the solid-liquid
    boundary has a negative slope (water's well-known anomaly vs. most substances)
    — a small annotation would add a touch more data storytelling, though it is not
    required by the spec.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white, not dark.
      Chrome: Bold dark title "Water Phase Diagram · phase-diagram-pt · javascript · highcharts · anyplot.ai" and a gray subtitle with triple/critical point values, both clearly legible. Axis titles "Temperature (K)" and "Pressure (Pa)" in medium-gray, tick labels (200-700 on x, 0.1-1G logarithmic on y) in lighter gray, all readable. Only horizontal (y-axis) gridlines are present now — subtle warm-gray, not competing with data; the vertical gridlines from attempt 1 have been removed. Legend at bottom lists the three boundary series with matching color swatches. A faint gray-tinted rectangle now shades the top-right "Supercritical Fluid" corner (T > critical T, P > critical P).
      Data: Three curves — green "Solid-Liquid boundary" (near-vertical, bending left with rising pressure, correctly showing water's anomalous negative fusion slope), lavender/purple "Liquid-Gas boundary" (smooth curve from triple point to critical point), and blue "Solid-Gas boundary" (sublimation curve). First series is confirmed #009E73 brand green. Diamond markers mark the Triple Point and Critical Point with direct text labels, both fully inside the canvas with no clipping. Italic gray labels "Solid", "Liquid", "Gas", and "Supercritical Fluid" sit inside their respective regions with no overlap with curves, markers, or each other.
      Legibility verdict: PASS — all text is clearly readable against the light background, no light-on-light issues found; checked title, axis, tick, legend, and annotation text including the top-right "Critical Point" / "Supercritical Fluid" cluster near the canvas edge — no clipping.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black, not light.
      Chrome: Title and subtitle rendered in light/near-white and soft light-gray respectively, both clearly legible against the dark surface. Axis titles, tick labels, and legend text all switch to light tones — no dark-on-dark failures found anywhere. Only horizontal gridlines present, consistent with the light render. The supercritical-region shading is visible as a slightly lighter gray rectangle against the near-black background, still legible and unobtrusive.
      Data: Identical green/lavender/blue curve colors to the light render — confirmed only chrome (background, text, gridlines, marker outline, region shade) flipped between themes; data hues are pixel-identical.
      Legibility verdict: PASS — all text reads clearly on the dark background, including the italic region labels and the diamond-marker annotations; brand green remains vivid and distinguishable on the dark surface.
