      Data: seven #009E73 markers at 0,2,…,12 mg/L (blank at 0.008), black fit line through them, light grey prediction band behind it (narrow, slightly wider at the ends), purple (#C475FD-like second Imprint color) larger marker at (7.07, 0.60) on the line, dashed muted-grey lines from it to the y axis and down to the x axis.
