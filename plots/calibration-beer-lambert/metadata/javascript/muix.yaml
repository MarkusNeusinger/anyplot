review:
  strengths:
  - Legend added (ChartsLegend) that clearly distinguishes the green 'Calibration
    standards' series from the lavender 'Unknown sample' point via a visual key —
    resolves attempt 1's SC-04/DE-02 gap.
  - Invalid, no-op 'tickFontSize' prop removed from the yAxis config, fixing the dead-prop
    deduction against CQ-04 and LM-01.
  - Title fontSize increased from 22 to 30, improving its share of plot width from
    roughly 35% to roughly 48% — a real step toward the style guide's proportion target,
    though still slightly under the comfortable 50-70% band.
  - 'All attempt-1 strengths retained: idiomatic hook-based custom SVG overlays (95%
    prediction-interval band and dashed unknown-sample guide lines via useXScale/useYScale/useDrawingArea),
    correct theme-adaptive rendering with identical data colors across themes, correct
    Imprint palette usage (green first series, lavender second), realistic 7-point
    UV-Vis calibration dataset including the blank, and clean deterministic KISS code.'
  weaknesses:
  - The rotated y-axis title 'Absorbance' overlaps the '0.5' and '0.6' tick labels
    near the vertical center of the axis, in BOTH light and dark renders — the descender/tail
    of the title text touches the tick numerals. Increase the left margin or the yAxis
    label offset (e.g. raise the ChartContainer margin.left beyond 132, or set a larger
    label-to-tick gap via yAxis slotProps) so the rotated title clears the tick labels
    at every position, not just the ones near the axis ends.
  - Title still occupies only ~48% of plot width at fontSize=30 (CSS px) — under the
    ~50-70% comfortable range the style guide expects for this ~59-character mandated
    title. A further bump to roughly 34-36px would give it a stronger focal presence
    and better survival at the 400px mobile thumbnail.
  - Small annotation and tick fonts (12-14px CSS) carried over from attempt 1 remain
    tight at the 400px mobile thumbnail — consider modestly increasing base font sizes
    for the equation/annotation text for better small-scale legibility.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Bold centered title "calibration-beer-lambert · javascript · muix · anyplot.ai" in dark ink at the top, with a legend at the top-right (green square "Calibration standards", lavender square "Unknown sample"); a two-line annotation block below the title ("y = 0.0847x + 0.0015 · R² = 0.9993" and "Shaded band: 95% prediction interval · Unknown: A = 0.60 → c ≈ 7.07 mg/L") in dark/medium gray; x-axis label "Concentration (mg/L)" and y-axis label "Absorbance" in dark ink; horizontal gridlines subtle light gray; bottom-right caption "n = 7 standards (incl. blank)" in light gray. All text is legible against the light background, EXCEPT the rotated y-axis title "Absorbance" visibly touches/overlaps the "0.5" and "0.6" tick labels near the middle of the axis (both remain individually readable, but the collision is a real layout defect).
      Data: Seven green (#009E73) scatter points along a black OLS regression line, a light-gray shaded 95% prediction-interval band hugging the line, one lavender/purple scatter point marking the "unknown" sample at (7.07, 0.60), and dashed gray guide lines running from that point down to the x-axis and left to the y-axis.
      Legibility verdict: PASS (with the noted axis-label/tick-label overlap as a layout defect, not a legibility failure)

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Same title now in light/white bold text, same legend top-right; annotation block in light gray; axis labels in light ink; gridlines subtle and still visible against the dark surface; bottom-right caption in light gray. No dark-on-dark failures — every text element has clear contrast against the near-black background. The same "Absorbance" / "0.5" / "0.6" tick-label overlap observed in the light render is present here too (identical layout, theme-independent defect).
      Data: Colors are identical to the light render — same #009E73 green standards, same lavender unknown point. The regression line flips from black to white (theme-adaptive ink token) and the prediction band flips to a dark-gray fill, both correctly readable on the dark surface; dashed guide lines remain visible in gray.
