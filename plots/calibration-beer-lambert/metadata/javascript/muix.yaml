review:
  strengths:
  - 'Complete feature coverage matching the spec: regression line with equation/R²
    text, a 95% prediction-interval band drawn as a custom SVG path via useXScale/useYScale,
    and a dashed-guide-line annotation from an unknown sample to both axes via useDrawingArea
    — all genuinely idiomatic, advanced MUI X hook usage rather than basic defaults.'
  - 'Realistic, domain-appropriate dataset: a 7-point UV-Vis calibration series (including
    the blank) with an absorbance range that stays safely under 1.5 (avoiding the
    nonlinear Beer-Lambert regime), framed as a plausible pharmaceutical-assay context.'
  - 'Theme-correct rendering: identical data colors (#009E73 green standards, palette[1]
    lavender unknown) across both renders, correct FAF8F1/1A1A17 chrome backgrounds,
    and all title/annotation/axis text legible in both themes.'
  - 'Clean, deterministic, KISS-structured code: no unused imports, hardcoded reproducible
    data, correct harness contract (skipAnimation belt-and-suspenders, default export,
    sizing from window.ANYPLOT_SIZE).'
  weaknesses:
  - No rendered legend (e.g. ChartsLegend) distinguishes the green 'Calibration standards'
    series from the lavender 'Unknown sample' point — the reader currently has to
    infer that mapping from the text annotations rather than a visual key; add a legend
    component.
  - The manually-drawn title text element uses a fixed fontSize=22 (CSS px) that renders
    at roughly 35% of the plot width, well under the 70-85% the style guide expects
    for a mandated title of this length — consider bumping the title fontSize for
    a stronger focal presence and better survival at the 400px mobile thumbnail.
  - 'The yAxis config sets `tickFontSize: 32`, which is not a real MUI X AxisConfig
    property (the actual tick sizing is driven by the separate `tickLabelStyle.fontSize:
    14`) — dead/no-op prop that should be removed.'
  - At the 400px mobile thumbnail, axis tick labels and the small annotation text
    (12-14px on the 1600 CSS px mount) become hard to read — consider modestly increasing
    base font sizes for better small-scale legibility.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Bold centered title "calibration-beer-lambert · javascript · muix · anyplot.ai" in dark ink at the top; a two-line annotation block below it ("y = 0.0847x + 0.0015 · R² = 0.9993" and "Shaded band: 95% prediction interval · Unknown: A = 0.60 → c ≈ 7.07 mg/L") in dark/medium gray; x-axis label "Concentration (mg/L)" and y-axis label "Absorbance" in dark ink; horizontal gridlines subtle light gray; bottom-right caption "n = 7 standards (incl. blank)" in light gray. All text is clearly readable against the light background.
      Data: Seven green (#009E73) scatter points along a black OLS regression line, a light-gray shaded 95% prediction-interval band hugging the line, one lavender/purple scatter point marking the "unknown" sample at (7.07, 0.60), and dashed gray guide lines running from that point down to the x-axis and left to the y-axis.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Same title now in light/white bold text; annotation block in light gray; axis labels in light ink; gridlines subtle and still visible against the dark surface; bottom-right caption in light gray. No dark-on-dark failures observed — every text element has clear contrast against the near-black background.
      Data: Colors are identical to the light render — same #009E73 green standards, same lavender unknown point. The regression line flips from black to white (theme-adaptive ink token) and the prediction band flips to a dark-gray fill, both correctly readable on the dark surface; dashed guide lines remain visible in gray.
      Legibility verdict: PASS
