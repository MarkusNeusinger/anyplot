review:
  strengths:
  - Composes the chart from MUI X v9 primitives (ChartsDataProvider, ChartsWrapper,
    ChartsSurface with ScatterPlot, LinePlot, ChartsGrid, axes and an HTML ChartsLegend)
    and draws the prediction band and unknown-sample guides as custom SVG layers that
    read the chart's own useXScale/useYScale/useDrawingArea hooks, so they stay registered
    to the axes
  - 'The regression, R² and 95% prediction interval are computed from the standards
    (t critical value by degrees of freedom), and the unknown''s concentration is
    derived from the fit: c = (0.60 − 0.0015)/0.0847 ≈ 7.07 mg/L, which matches where
    the dashed guides meet the x axis'
  - 'Clear visual hierarchy in both themes: green standards, a larger lavender unknown
    marker sitting on the fit line, an ink-colored fit line, and a neutral translucent
    band drawn behind line and markers'
  - Dashed guides start at the unknown marker and run to both axes without overshooting,
    so the concentration readout is easy to trace
  - 'Theme threading is correct: the title, equation, legend and ticks use ink/inkSoft
    tokens, and data colors are identical across light and dark'
  - Native MUI X tooltips and the HTML legend stay available in the interactive HTML
    output, and animation is disabled with skipAnimation
  weaknesses:
  - 'SC-03 (both): the lower edge of the prediction band is clamped at absorbance
    0 (Math.max(0, …)), so near the blank the band flattens onto the 0.0 gridline
    instead of showing the computed interval, which dips slightly below zero → draw
    the interval as computed (fittedY − halfWidth); the y-domain already includes
    values below zero. Likely cause: line 104 `Math.max(0, y - halfWidth[i])`.'
  - 'VQ-01 (both): the band and unknown-sample caption under the equation (13 px,
    muted) and the ''n = 7 standards'' note (12 px) are well under the 14–16 px axis-text
    size and blur at the 400 px thumbnail → about 14–15 px (+2 px). Likely cause:
    fontSize 13 on the caption div and fontSize={12} on the SVG note.'
  - 'VQ-05 (both): the y-axis title ''Absorbance'' sits about 60 CSS px left of its
    tick labels, detached from the axis, and a tall empty band separates the header
    from the plot area → shrink the y-axis band so the title sits near the ticks (about
    width 60, −24 px) and tighten the header-to-plot gap. Likely cause: yAxis `width:
    84` plus the 104 px header and the separate legend row.'
  - 'Suggestion: the caption reads ''A =0.60''; add a space (''A = 0.60'') for consistent
    typography.'
  - 'Suggestion: a 1-unit x tick step (13 ticks instead of 25) would make the concentration
    axis calmer while keeping the 7.07 readout traceable.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, not pure white.
      Chrome: centered bold title "calibration-beer-lambert · javascript · muix · anyplot.ai" in dark ink; below it, left-aligned, the equation "y = 0.0847x + 0.0015 · R² = 0.9993" in inkSoft and a smaller muted caption "Shaded band: 95% prediction interval · Unknown sample: A =0.60 → c ≈ 7.07 mg/L". Horizontal legend top right (Calibration standards, Unknown sample). Y axis "Absorbance" with ticks 0.0–1.1, x axis "Concentration (mg/L)" with ticks 0.0–12.0 in 0.5 steps; subtle horizontal grid; small "n = 7 standards (incl. blank)" note at bottom right. All text dark and readable.
      Data: seven green #009E73 standards (blank at 0 included) on a dark-ink regression line inside a translucent gray prediction band; the band widens slightly toward the ends and its lower edge flattens at 0 near the blank. Lavender #C475FD unknown marker on the line at (7.07, 0.60) with gray dashed guides to the y axis and down to the x axis.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17, not pure black.
      Chrome: title, equation, caption, legend, axis titles and ticks all in light ink; grid lines subtle dark gray; no dark-on-dark text anywhere.
      Data: identical green standards and lavender unknown as in the light render; the fit line flips to light ink and the band to a muted gray that is still visible as a band; dashed guides in light gray.
      Legibility verdict: PASS
