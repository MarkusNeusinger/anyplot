review:
  strengths:
  - Composes the chart from ChartsDataProvider, ChartsSurface, ScatterPlot and LinePlot
    and draws the prediction band and the unknown's guide lines as custom SVG layers
    through useXScale, useYScale and useDrawingArea, so every custom layer shares
    the chart's own scales
  - The 95 % prediction band (t-quantile, residual standard error, leverage term)
    is drawn behind the line and the markers in the muted ink token at 0.2 opacity
    and reads as a band in both themes
  - The drawn fit matches the stated equation y = 0.0847x + 0.0015 (R² = 0.9993);
    the unknown sits exactly on the line at A = 0.60 with its back-calculated c ≈
    7.07 mg/L stated in the header
  - The unknown is set apart from the standards by the second Imprint color and a
    larger marker, with dashed guides running to both axes
  - Fit line drawn in the ink token, so it flips correctly between themes while the
    data colors stay identical
  weaknesses:
  - 'DQ-02 (both): the scenario names no analyte or wavelength; the x label reads
    only "Concentration (mg/L)" and the legend only "Calibration standards", so the
    calibration reads as generic → name the analyte in the x label and series label
    (for example "Nitrate concentration (mg/L)" or "Iron(II) standards"). Likely cause:
    the CONCENTRATION constant and the SAMPLE_TYPE values in the data block.'
  - 'Suggestion: the equation and R² sit in the header above the plot area; placing
    them inside the plot area (upper left, where the band leaves space) would tie
    them to the line they describe.'
  - 'Suggestion: the readout reads "A =0.60" with no space after the equals sign;
    "A = 0.60" matches the equation''s spacing.'
  - 'Suggestion: the x axis ticks every 0.5 mg/L (25 labels) against standards every
    2 mg/L; ticks every 1 or 2 mg/L would calm the axis.'
  image_description: |-
