review:
  strengths:
  - Regression equation and R² are displayed as a precise, clearly formatted subtitle
    annotation, satisfying the spec's core requirement.
  - 'Distinctive Highcharts renderer technique: the prediction-interval band is hand-drawn
    via the chart''s ''render'' event + axis.toPixels() + renderer.path() to work
    around highcharts-more not being vendored, and the legend gets an honest swatch
    for it via an empty-data series with legendSymbol: ''rectangle'' — genuine library
    mastery, not a workaround hack.'
  - The unknown-sample crosshair (dashed lines to both axes + diamond marker + inline
    data label 'c ≈ 5.43 mg/L') makes the 'how to read a calibration curve' story
    immediately clear without adding clutter.
  - 'Realistic, domain-correct data: a nitrate colorimetric assay at 540 nm with 8
    standards including a reagent blank, R² = 0.9999, and absorbance values in the
    typical 0-1 UV-Vis range.'
  - Theme-adaptive chrome is correctly threaded through title, subtitle, axis titles/labels,
    legend, and tooltip in both renders; all data colors are identical between light
    and dark.
  weaknesses:
  - 'Palette order is broken without semantic justification: the regression fit /
    prediction-interval band use t.palette[2] (blue, canonical position 3) instead
    of t.palette[1] (lavender, canonical position 2) — the style guide requires positions
    1→N in order unless a real-world color cue applies, and there isn''t one here.'
  - The 'Unknown Sample' marker uses t.amber, but amber is reserved as the warning/caution
    semantic anchor, not a general-purpose highlight color — this point isn't a warning.
    Use the next canonical categorical slot (palette[1], lavender) or a neutral highlight
    instead.
  - The 95% prediction-interval band is implemented correctly but reads very subtly
    at full canvas size (~30px wide within a 1800px-tall plot, ~1% of plot height)
    because the fit is nearly perfect (R²=0.9999) — easy to miss at a glance. Raising
    the fill opacity from 0.15 to ~0.22-0.25 would make the feature legible without
    obscuring data points.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 (not pure white).
      Chrome: Title "calibration-beer-lambert · javascript · highcharts · anyplot.ai" in bold dark ink at top center; subtitle "R² = 0.9999 · A = 0.0822·c + 0.0036" in softer grey below it; legend row (Calibration Standards, Regression Fit, 95% Prediction Interval, Unknown Sample) top-left with adequate padding; x-axis titled "Concentration (mg/L NO₃-N)" and y-axis titled "Absorbance", both in medium-grey ink; faint horizontal gridlines only. All text is clearly legible against the light background.
      Data: 8 green (#009E73) calibration-standard dots rising linearly from (0, ~0.004) to (12, ~0.99); a blue (palette[2]) regression line through them with a very subtle light-blue prediction-interval band hugging it; black dashed crosshair lines converging on an amber diamond "Unknown Sample" marker near (5.43, 0.45), labeled "c ≈ 5.43 mg/L".
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 (not pure black).
      Chrome: Same title/subtitle/legend/axis-title layout as the light render, now rendered in light ink (near-white for title, soft light-grey for subtitle/ticks/legend/axis titles) — fully readable, no dark-on-dark text anywhere. Gridlines are faint light lines on the dark surface.
      Data: Same green calibration-standard dots, same blue regression line and prediction band, same amber diamond unknown-sample marker and dashed crosshair — all colors are pixel-identical to the light render; only the chrome (background, text, grid, axis lines) flips to the dark-theme tokens.
      Legibility verdict: PASS
