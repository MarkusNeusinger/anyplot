review:
  strengths:
  - 'Correct rose/coxcomb construction: geom_col + coord_polar(theta = "x") gives
    radius proportional to value (not area), matching the spec''s explicit requirement'
  - January is deliberately rotated to 12 o'clock via the start_offset calculation
    instead of sitting at the wedge edge — a thoughtful detail most implementations
    skip
  - Radial gridlines (0/50/100/150) are present to aid value estimation, as the spec
    requests
  - 'Theme-adaptive chrome is correctly threaded through: identical #009E73 brand
    green in both renders, correct #FAF8F1/#1A1A17 backgrounds, all text readable
    in both themes'
  - Defensive title-fontsize scaling (title_fontsize computed from nchar) shows attention
    to the long mandated title string
  - Realistic seasonal rainfall data (cosine signal + noise, floored at 15mm) plausibly
    represents a temperate maritime climate with a winter peak / summer trough
  weaknesses:
  - 'Unused import: library(dplyr) is loaded but never referenced anywhere in the
    script (no %>%, mutate, filter, etc.) — remove it to satisfy Clean Imports (CQ-03)'
  - 'Design Excellence is close to a well-configured default: a single flat fill with
    no additional refinement. The spec explicitly allows ''single color with varying
    saturation'' — consider a subtle radius- or value-driven alpha/saturation ramp
    on the wedges to add depth and strengthen the seasonal story (DE-01/DE-03)'
  - Radial tick labels (7pt, INK_SOFT) are noticeably smaller and lighter than the
    bold 10pt month labels — the imbalance is a legitimate hierarchy choice but could
    be softened slightly (e.g. 8pt) for better cross-axis balance (VQ-05)
  - No visual emphasis on the peak (Jan) or trough (Jul) months — a light annotation
    or subtle color/opacity shift on the extremes would sharpen the data storytelling
    (DE-03), though this is optional polish, not a spec requirement
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "rose-basic · r · ggplot2 · anyplot.ai" centered at top in dark ink, clearly readable. Twelve bold month labels (Jan-Dec) arranged around the circle in dark text, all legible. "Rainfall (mm)" y-axis title rotated on the left in soft ink. Radial tick labels (0, 50, 100, 150) in light gray, subtle but legible. Concentric radial gridlines are faint but visible.
      Data: All twelve wedges filled in a single solid #009E73 brand green, separated by thin light (PAGE_BG-colored) border lines that create clean segment separation. Radius varies by month, showing a clear winter peak (Dec/Jan/Feb reach ~130-155mm) and summer trough (Jun/Jul near ~20-30mm) — a visible seasonal cycle.
      Legibility verdict: PASS — all text is clearly readable against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Title in light/off-white text, clearly readable. Month labels in bold white text, clearly legible. "Rainfall (mm)" axis title and radial tick labels in light gray, readable against the dark background. Gridlines are faint light gray, still visible.
      Data: Wedges remain the identical #009E73 green as the light render — confirmed no shift in data color. Wedge borders now render in the dark PAGE_BG color, still providing clean segment separation against the green fill.
      Legibility verdict: PASS — all text is clearly readable against the dark background; no dark-on-dark failures observed. Brand green reads well on the dark surface.
