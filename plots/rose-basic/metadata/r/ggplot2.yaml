review:
  strengths:
  - Value-driven alpha ramp (aes(alpha = rainfall_mm) + scale_alpha_continuous) directly
    implements the spec's "single color with varying saturation" guidance, strengthening
    aesthetic sophistication and data storytelling
  - Unused library(dplyr) import removed, resolving the attempt-1 Clean Imports deduction
  - 'Correct rose/coxcomb construction: geom_col + coord_polar(theta = "x") gives
    radius proportional to value, matching the spec''s explicit requirement'
  - January deliberately rotated to 12 o'clock via start_offset instead of sitting
    at the wedge edge
  - 'Theme-adaptive chrome correctly threaded through: identical brand-green hue in
    both renders, correct #FAF8F1/#1A1A17 backgrounds, all text readable in both themes'
  - Realistic seasonal rainfall data (cosine signal + noise, floored at 15mm) plausibly
    represents a temperate maritime climate
  weaknesses:
  - Radial tick labels (8pt, INK_SOFT) are still somewhat smaller/lighter than the
    bold 10pt month labels - legitimate hierarchy choice, but slightly more balance
    (e.g. 9pt) would tighten VQ-01 further
  - Design Excellence could still push further - e.g. a light annotation calling out
    the peak (Jan) or trough (Jul) value would sharpen data storytelling from "good"
    to "excellent"
  image_description: |-
