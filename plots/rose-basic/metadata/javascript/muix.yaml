review:
  strengths:
  - 'The rose is built from native MUI X pie series: one series per month with its
    own startAngle/endAngle and a percent outerRadius, so each radius is exactly proportional
    to its value on a zero-based scale (Jan 88 → 0.88 of the 100 ring, checked in
    the render).'
  - 'The v9 composition is idiomatic: ChartsContainer + PiePlot, with custom SVG layers
    that read geometry from the useDrawingArea hook. The grid sits under the wedges
    and the labels sit above them.'
  - The ring scale is derived from the data (nice step 25 → outer ring 100) instead
    of typed limits.
  - Theme tokens are threaded through every chrome element. The data colour is identical
    in both themes, and the separators use the page colour.
  - The ring values sit on page-coloured pills along the shortest wedge's spoke, where
    they cover the least data.
  - Native pie tooltips stay available in the HTML output.
  weaknesses:
  - 'Suggestion: drop "total 715" from the subtitle. A yearly total is not something
    a rose''s radii encode, and the subtitle reads cleaner without it.'
  - 'Suggestion: the outer-ring value "100" and the "Jul" label share the bottom spoke;
    placing the ring values along a diagonal spoke would separate them a little more.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, 2400x2400 square canvas
      Chrome: bold title "rose-basic · javascript · muix · anyplot.ai" plus a softer subtitle "Radius: Average rainfall (mm) by month · total 715 · gridlines every 25"; month labels Jan..Dec clockwise outside the outer ring, Jan at 12 o'clock; ring values 25/50/75/100 on page-coloured pills along the Jul spoke; subtle warm-grey rings and spokes. All text is dark ink and readable, nothing clipped.
      Data: twelve equal 30° wedges in #009E73 with thin page-coloured separators; radius proportional to rainfall (Nov 95, Dec 92, Jan 88 longest; Jul 22 shortest).
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17
      Chrome: title, month labels, and ring values in light ink/inkSoft; rings and spokes dim grey but visible; no dark-on-dark text.
      Data: identical #009E73 wedges; the separators flip to the dark page colour.
      Legibility verdict: PASS
