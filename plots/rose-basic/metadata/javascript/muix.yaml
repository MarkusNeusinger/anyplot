review:
  strengths:
  - 'Correct rose/coxcomb geometry: 12 equal-angle (30 degree) wedges with radius
    strictly proportional to value (not area), matching the spec''s core visual-encoding
    requirement.'
  - Radial gridlines (3 concentric rings) plus spokes at each category angle aid value
    estimation, exactly as called for in the spec notes.
  - Value-driven imprint_seq gradient (brand green to blue) gives a redundant color+radius
    encoding of magnitude, reinforcing the seasonal story without relying on hue alone,
    and is theme-invariant across both renders.
  - Correct mandated title format, clean legend omission (appropriately redundant
    for a single series), and fully theme-adaptive chrome (t.ink / t.inkSoft / t.grid)
    verified correct in both light and dark renders.
  - Deterministic, hardcoded monthly rainfall data with a realistic wet-winter/dry-summer
    pattern; clean single-file structure with helper functions used only for the necessary
    polar-coordinate math.
  weaknesses:
  - 'The ''gridlines: 32 / 63 / 95 mm'' corner caption lists the three ring values
    but isn''t visually tied to the concentric circles (no tick mark or leader line)
    - a viewer must guess which ring maps to which number. Anchoring the labels along
    one spoke (e.g. near the Jan axis) would close the loop.'
  - The rose is built by overlaying 12 independent single-slice PieChart series (a
    workaround, since MUI X community has no native polar/rose chart type) - functionally
    correct and creative, but not the most idiomatic library pattern.
  - Design polish is solid but stops short of a top-tier flourish (e.g. no subtle
    value callout on the largest/smallest petal) that would push the storytelling
    from 'clear' to 'immediately unmissable'.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 - not pure white, not dark.
      Chrome: Title "rose-basic · javascript · muix · anyplot.ai" centered at top in dark ink, clearly legible. Corner caption "gridlines: 32 / 63 / 95 mm" in soft gray top-right. Month labels (Jan-Dec) placed just outside the outer gridline ring in soft gray, all fully readable against the light background with correct anchor/baseline adjustment per angle. Three concentric gridline rings and 12 radial spoke lines in a faint neutral gray, subtle but visible.
      Data: 12 wedges arranged like a compass/clock face, each spanning an equal 30 degree angle (with a small gap between wedges) but extending to a radius proportional to that month's rainfall value. Color is a continuous green-to-blue gradient (imprint_seq: #009E73 to #4467A3) mapped to value, so the largest petals (Nov, Dec, Jan, Oct) read blue and the smallest (Jun, Jul, Aug) read closer to green - redundant encoding of magnitude alongside radius. Rounded wedge tips (cornerRadius) give a refined finish.
      Legibility verdict: PASS - all text (title, caption, month labels) is clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 - not pure black, not light.
      Chrome: Same title, corner caption, and month labels now rendered in light ink/soft-light gray, fully legible against the dark background. Gridline rings and spokes rendered in a faint light-gray, still subtle but visible on the dark surface - no washed-out or invisible grid.
      Data: The green-to-blue wedge gradient is pixel-identical to the light render (same #009E73 to #4467A3 interpolation per month) - only the chrome (background, text, grid) has flipped, exactly as required.
      Legibility verdict: PASS - no dark-on-dark failures observed; title, caption, and all 12 month labels remain clearly legible, and the brand green end of the gradient still reads well against the dark surface.
