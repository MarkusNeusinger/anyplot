      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "rose-basic · javascript · highcharts · anyplot.ai" in bold dark ink at top, subtitle "Wind frequency by compass direction" in softer gray beneath it — both clearly readable. Eight compass letters (N, NE, E, SE, S, SW, W, NW) ring the outer edge in bold dark text. Radial gridline rings labeled 200/400/600/800 plus an italic "hrs/yr" unit label sit in the gap between N and NW, fully legible against the light background.
      Data: Eight wedges radiate from center, radius proportional to value, separated by thin gaps. N (top) is #009E73 green; the remaining seven directions cycle through the canonical Imprint palette (violet, blue, ochre, red, cyan, wine, olive) in index order. A small circular marker sits at each wedge tip (real Highcharts scatter points for hover tooltips).
      Legibility verdict: PASS — all title, subtitle, compass, and scale text is clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Same title and subtitle now rendered in light/white text, fully legible. Compass letters and radial scale labels also flipped to light-colored text against the dark background. Grid rings and spokes are subtle light-gray strokes, visible but not dominant.
      Data: All eight wedge colors are pixel-identical to the light render (green N, violet NE, blue E, ochre SE, red S, cyan SW, wine W, olive NW) — only the chrome (background, text, grid) flipped as expected.
      Legibility verdict: PASS — no dark-on-dark failures found; every text element (title, subtitle, compass letters, ring labels, unit label) is clearly visible against the near-black background.
