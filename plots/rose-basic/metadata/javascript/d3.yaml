      Data: Wedges radiate from center with radius proportional to monthly rainfall (19-158mm). Fill is a lightness-scaled green: full Imprint brand green #009E73 (pixel-verified) at the December peak, fading to a pale mint tint at the driest months (Jun/Jul), double-encoding magnitude via both length and color.
