review:
  strengths:
  - Correct rose/coxcomb chart type built idiomatically with d3.arc() + scaleLinear()
    + the standard .selectAll().data().join() pattern
  - 'Realistic, well-researched data: temperate coastal monthly rainfall with a plausible
    seasonal shape and a sensible ~1011mm annual total'
  - 'Pixel-verified palette compliance: primary series is exactly #009E73, backgrounds
    are exactly #FAF8F1 (light) and #1A1A17 (dark)'
  - Deliberate double encoding of value via both wedge radius and fill-opacity reinforces
    the seasonal story at a glance without needing annotations
  - Radial gridline labels are thoughtfully tucked into the one spoke direction (Jul)
    that stays clear of tall wedges, avoiding label/wedge overlap
  - Title format exactly matches the mandated `rose-basic · javascript · d3 · anyplot.ai`
    string, no clipping in either render, margins verified via bounding-box measurement
  weaknesses:
  - 'Fill-opacity encoding (wedgeOpacity scale 0.45-1) is composited directly against
    t.pageBg, so the SAME data value renders as a visibly different color between
    themes for partial-opacity wedges — e.g. the Jul wedge (opacity ~0.49) measures
    ~#4FBA9B on the light background but ~#087456 on dark, even though the underlying
    fill is #009E73 in both. Equal-value wedges should read as the same hue/lightness
    across themes; consider pre-compositing the opacity onto a fixed neutral or using
    a lightness scale computed independently of the page background.'
  - Grid ring value labels (50 mm / 100 mm / 150 mm) are set to font-size 13px, smaller
    than the 16px month labels and below the ~14px CSS minimum recommended for JS-library
    tick labels; at the 400px mobile thumbnail they are nearly illegible while the
    month labels and title remain readable. Bump to ~15-16px to match the month-label
    scale.
  - 'Design Excellence is solid but not yet publication-tier: the circular grid and
    opacity gradient are tasteful, but there is no additional refinement (e.g. a subtle
    radial value label track, finer-grained opacity legend, or emphasis on the wettest
    month) that would push it from ''good'' to ''excellent'' storytelling.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, pixel-sampled at RGB(250,248,241) = #FAF8F1, exactly on spec.
      Chrome: Bold dark title "rose-basic · javascript · d3 · anyplot.ai" centered at top, fully visible with margin above (no clipping). Twelve month labels (Jan at 12 o'clock, proceeding clockwise through Dec) sit just outside the wedge fan in dark ink-soft gray, all legible and non-overlapping. Three subtle circular gridlines (50/100/150 mm) with small gray value labels tucked along the bottom (Jul) spoke where the shortest wedges leave them clear.
      Data: Wedges radiate from center, radius proportional to monthly rainfall (19-158mm). Fill is Imprint green #009E73 at full opacity for high values (Nov/Dec/Jan), fading via fill-opacity down to a pale mint for the driest months (Jun/Jul) — same base hue throughout, double-encoding magnitude via both length and opacity.
      Legibility verdict: PASS overall. Title and month labels are clearly readable at full size and (checked against the 400px thumbnail) remain legible on mobile. The three "mm" grid-ring labels at 13px are readable at full resolution but become nearly illegible at the 400px thumbnail scale — a legibility weakness, not a failure of the primary chart elements.

    Dark render (plot-dark.png):
      Background: Warm near-black, pixel-sampled at RGB(26,26,23) = #1A1A17, exactly on spec.
      Chrome: Title and month labels render in light gray/white, fully readable against the dark background — no dark-on-dark failures observed. Grid rings and value labels remain subtle but visible.
      Data: Full-opacity wedges (Nov/Dec/Jan) sample as identical RGB(0,158,115) = #009E73 in both renders — confirmed pixel-identical. However, partial-opacity wedges (e.g. the low-rainfall summer months) sample as visibly different colors between themes because fill-opacity is composited against the theme-dependent page background (pale mint on light vs. deep forest on dark for the same data value) — flagged as a weakness below.
      Legibility verdict: PASS for all chrome text (no dark-on-dark issues); the same mobile-scale grid-label legibility concern from the light render applies here too.
