      Data: Wedge colors are pixel-identical to the light render at every sampled value (e.g. Jan wedge (19,166,126) in both renders, Jul wedge (168,224,206) in both renders, Dec wedge (0,158,115)=#009E73 in both renders) - confirms the previous fill-opacity theme-inconsistency issue from Attempt 1 is fixed; the same rainfall value now reads as the same color regardless of theme.
