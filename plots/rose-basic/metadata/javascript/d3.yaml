    both plot-light.png and plot-dark.png), and the grid-ring value labels are now
    16px, matching the month labels and staying legible at the 400px mobile thumbnail'
  - Correct rose/coxcomb chart type built idiomatically with d3.arc() + scaleLinear()
    + the standard selection.data().join() pattern
  - 'Realistic, well-researched data: temperate coastal monthly rainfall with a plausible
    seasonal shape (19-158mm) and sensible ~1011mm annual total'
  - 'Pixel-verified palette compliance: background exactly #FAF8F1 (light, RGB 250,248,241)
    / #1A1A17 (dark, RGB 26,26,23); peak-value wedge (Dec) is exactly #009E73 in both
    themes; title/chrome text exactly matches INK tokens (#1A1A17 light / #F0EFE8
    dark)'
  - Radial gridline value labels thoughtfully tucked into the one spoke direction
    (Jul) that stays clear of tall wedges - no overlap with data or other text in
    either theme
  - Title format exactly matches the mandated string, no clipping in either render
    at any canvas edge, balanced margins verified via crop inspection
  weaknesses:
  - The value-to-lightness wedge fill (wedgeColor = d3.scaleLinear().domain([0,maxRainfall]).range(["#BFE9DB",
    t.palette[0]])) is a genuinely continuous encoding of the mm value via color,
    but it uses a hand-picked custom hex (#BFE9DB) as the low end instead of the sanctioned
    imprint_seq stops (t.seq) that prompts/library/d3.md documents for exactly this
    case (d3.scaleSequential(d3.interpolateRgbBasis(t.seq)).domain(...)). Not a hard
    violation (the brand-green high end is correct and the encoding is theme-consistent),
    but it deviates from the 'only imprint_seq/imprint_div for continuous data' rule
    - swap the range for the documented t.seq interpolation, or simplify to a single
    flat palette[0] fill (the spec explicitly allows either 'single color with varying
    saturation' or 'distinct colors per category', so a flat fill is also a valid
    fix that sidesteps the colormap question entirely).
