review:
  strengths:
  - 'Both attempt-1 weaknesses are resolved: an explicit "Peak · 125 mm" callout with
    an ink-bordered wedge gives the chart a clear focal point, and the data comment/subtitle
    now correctly describe a humid-subtropical, monsoon-influenced seasonality matching
    the shown summer-peak rainfall'
  - Correct, idiomatic ECharts rose/coxcomb implementation (polar bar + angle/radius
    axes) with radius linearly proportional to value; Jan at 12 o'clock, clockwise
    ordering
  - 'Dual encoding: wedge radius AND visualMap continuous color both track rainfall,
    reinforced by the explicit peak-month annotation'
  - Correct, theme-adaptive use of the Imprint imprint_seq sequential colormap; radius-axis
    tick labels use page-bg chip backgrounds so they stay legible over the wedge fills
    in both themes
  - Clean, deterministic, KISS code; no fake functionality; respects the mount-node/animation:false
    contract; canvas gate passes
  weaknesses:
  - Design Excellence still reads as an ECharts-gallery-adjacent composition (polar
    bar + bottom continuous visualMap legend) - the peak-month highlight helps, but
    further differentiation (custom typography, distinctive framing) would push this
    from well-configured to publication-ready
  - Typography remains at default weight/spacing outside the title; no additional
    refinement was added this attempt
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1
      Chrome: Title "rose-basic · javascript · echarts · anyplot.ai" and subtitle "Average monthly rainfall (mm) · humid-subtropical coastal city" centered at top in dark/soft ink, fully legible. Month labels around the ring and 0/30/60/90/120/150 mm radial gridline labels all readable; the innermost tick labels sit on small page-bg chip backgrounds so they stay legible where they cross wedge fills.
      Data: 12 wedges colored on a continuous green-to-blue imprint_seq gradient tied to rainfall value via a horizontal visualMap legend at bottom ("Less rain" -> "More rain"). Radius is linearly proportional to value. The wettest month (Jul, 125 mm) has an added ink-colored border and an in-wedge "Peak · 125 mm" label as an explicit focal-point callout.
