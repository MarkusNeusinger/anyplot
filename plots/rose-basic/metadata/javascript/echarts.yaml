    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17
      Chrome: All chrome (title, subtitle, month labels, gridline-label chips, visualMap legend text) correctly flips to light ink and remains fully readable. No dark-on-dark failures observed.
      Data: Wedge colors are identical to the light render (same green-to-blue gradient/stops) - only chrome flipped as required. The peak-highlight border and "Peak · 125 mm" label flip to light/white ink and remain clearly legible against the blue wedge fill.
      Legibility verdict: PASS
