review:
  strengths:
  - Correct, idiomatic ECharts rose/coxcomb implementation (polar bar + angle/radius
    axes) with radius linearly proportional to value
  - Jan at 12 o'clock, clockwise ordering matches natural time-reading convention
    called out in the spec
  - 'Dual encoding: wedge radius AND visualMap continuous color both track rainfall,
    reinforcing the seasonal story at a glance'
  - Correct, pixel-verified use of the Imprint imprint_seq sequential colormap for
    this continuous dataset, with fully theme-correct chrome in both light and dark
    renders
  - Clean, deterministic, KISS code; no fake functionality; respects the mount-node/animation:false
    contract
  - Well-balanced canvas utilization (~66%x63% pixel-measured bounding box), no clipping
    or overlap
  weaknesses:
  - Design Excellence reads as a faithful adaptation of ECharts' own official Nightingale
    Rose Chart with visualMap gallery example rather than a more original take --
    consider more distinctive typography, framing, or an explicit callout/annotation
    on the peak month
  - The 'temperate coastal city' data comment doesn't quite match the summer-peak
    (Jun-Aug) rainfall pattern shown, which is more typical of a humid-subtropical/monsoon
    coastal climate than a temperate oceanic one -- shift the seasonal profile to
    winter-max, or relabel the scenario
  - The innermost radial gridline labels (0/30/60mm) aren't visible in either render,
    likely occluded beneath the opaque wedge fills -- minor, worth checking axis label
    z-order
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1
      Chrome: Title "rose-basic · javascript · echarts · anyplot.ai" centered top in dark ink; 12 month labels (Jan..Dec) around the circle; radius gridline labels at 90/120/150 mm; visualMap "Less rain"/"More rain" legend at bottom -- all clearly readable
      Data: 12 polar-bar wedges, radius proportional to rainfall value, colored on a continuous green-to-blue gradient (pixel-sampled blue endpoint = #4467A3, confirmed Imprint imprint_seq stop); wedges separated by thin page-bg borders
      Legibility verdict: PASS (minor: 0/30/60mm inner gridline labels not visible, likely occluded under wedge fills since every month exceeds 60mm)

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17
      Chrome: Same title/month labels/gridline labels/legend, all correctly flipped to light ink -- fully readable, no dark-on-dark issues
      Data: Colors pixel-confirmed identical to light render (same #4467A3 blue endpoint sampled at the same wedge) -- only chrome flipped as required
      Legibility verdict: PASS
