review:
  strengths:
  - Correct radius-proportional (not area-proportional) wedge encoding via bokeh's
    native `radius=` parameter on p.wedge — matches the spec's explicit 'radius proportional
    to value, not area' requirement.
  - Single-hue Imprint green fill with fill_alpha graded by value creates a real redundant
    encoding (radius + opacity both track magnitude) and gives the chart a genuine
    focal point on the wet winter months (Nov-Jan).
  - Genuine HoverTool interactivity (Month/Rainfall tooltip) rather than simulated
    hover states — a real bokeh-distinctive feature correctly left out of PNG-only
    scoring per the interactive-library fairness rules.
  - 'Theme-adaptive chrome is correctly wired: exact PAGE_BG/INK/INK_SOFT hexes for
    both themes, subtle dashed radial gridlines (alpha 0.22) and spoke dividers (alpha
    0.18), default axes fully hidden.'
  - Square 2400x2400 canvas is the right format choice for a radially symmetric chart
    and passed the canvas dimension gate exactly.
  weaknesses:
  - Title omits the language segment required by SC-04's `{spec-id} · {language} ·
    {library} · anyplot.ai` format — currently 'rose-basic · bokeh · anyplot.ai' instead
    of 'rose-basic · python · bokeh · anyplot.ai'. Add '· python ·' between the spec-id
    and library name.
  - 'Wedge angle formula is off by one category from the intuitive ''first category
    at 12 o''clock'' reading: center_angle(i) = pi/2 - angle_width*(i+1) puts December
    (index 11) at the top and January (index 0) at 60° clockwise from top, so the
    visible order reads Dec->Jan->Feb...->Nov clockwise instead of Jan starting at
    12 o''clock. Shift the formula (drop the extra +1, i.e. start at i=0 exactly at
    pi/2) so January lands at the top per the spec''s ''start position typically at
    top (12 o''clock) for time data'' note.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white, not dark.
      Chrome: Title "rose-basic · bokeh · anyplot.ai" centered at top in dark ink, clearly legible. 12 month labels (Dec at top, then Jan/Feb/Mar clockwise around to Nov) in dark ink at the perimeter, all readable and none clipped by the canvas edge. Radial scale labels ("23 mm"/"45 mm"/"68 mm"/"90 mm") in soft gray stacked vertically on the right side, legible against the light background. Subtle dashed concentric gridlines and faint spoke dividers visible but not distracting.
      Data: All 12 wedges filled with brand green (#009E73), fill_alpha graded by rainfall value — winter months (Dec/Jan/Nov) render as fully saturated dark green, low-rainfall summer months (Jun/Jul) render as pale, washed-out green. Wedge boundaries separated by thin off-white divider lines matching the page background. Radius clearly proportional to value (largest wedge = Dec at ~90mm, smallest = Jul at ~15mm).
      Legibility verdict: PASS — all text is clearly readable against the light background, no overlaps or clipping observed.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black, not light.
      Chrome: Title and month labels rendered in light cream (#F0EFE8), clearly visible against the dark background — no dark-on-dark failures. Radial mm-scale labels in a lighter gray (#B8B7B0), also legible. Gridlines and spoke dividers use the same light-ink color at low alpha, subtle but visible against the dark surface.
      Data: Wedge fill colors are visually identical brand green (#009E73) with the same alpha gradation as the light render — only the chrome (background, text, gridline color) flipped, confirming theme-adaptive tokens were threaded through correctly rather than the data colors changing.
      Legibility verdict: PASS — all text remains clearly readable on the dark background; no dark-on-dark or light-on-light issues detected.
