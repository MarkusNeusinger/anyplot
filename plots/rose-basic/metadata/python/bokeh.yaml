review:
  strengths:
  - Correct radius-proportional (not area-proportional) wedge encoding via bokeh's
    native radius= parameter, matching the spec's explicit 'radius proportional to
    value, not area' requirement.
  - Single-hue Imprint green fill with fill_alpha graded by value creates a genuine
    redundant encoding (radius + opacity both track magnitude), giving the chart a
    clear focal point on the wet winter months.
  - Circular ordering now correctly places January at 12 o'clock with the months proceeding
    clockwise, matching the spec's 'start position typically at top for time data'
    note.
  - 'Title now matches the mandated format exactly: ''rose-basic · python · bokeh
    · anyplot.ai''.'
  - Genuine HoverTool interactivity (Month/Rainfall tooltip) rather than simulated
    hover states, well-scoped to the HTML artifact per the fairness rules for interactive
    libraries.
  - 'Theme-adaptive chrome correctly wired: exact PAGE_BG/INK/INK_SOFT hexes for both
    themes, subtle dashed radial gridlines, default axes fully hidden.'
  - Square 2400×2400 canvas is the right format choice for a radially symmetric chart
    and passes the canvas dimension gate exactly.
  weaknesses:
  - Design excellence is solid but not exceptional — the alpha-graded fill is a nice
    touch but the overall composition (concentric dashed rings, thin spoke dividers,
    plain month/value labels) still reads as a fairly standard rose-chart treatment
    rather than a highly distinctive one.
  - Library Mastery is good but not maximal — the implementation uses figure/wedge/ColumnDataSource/HoverTool
    idiomatically, but doesn't reach for any further bokeh-distinctive capability
    (e.g. CustomJS interactivity, linked panning/selection, or a colorbar-driven continuous
    encoding) beyond the single HoverTool.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white matching #FAF8F1, not pure white.
      Chrome: Title "rose-basic · python · bokeh · anyplot.ai" centered at top in dark ink (#1A1A17), clearly legible and fully within canvas bounds. 12 month labels (Jan at 12 o'clock, proceeding clockwise through Feb, Mar, ... to Dec) ring the perimeter at 42pt, all readable and none clipped. Radial scale labels ("23 mm"/"45 mm"/"68 mm"/"90 mm") stacked vertically on the right in soft gray ink (#4A4A44), legible against the light background and not overlapping the "Mar"/"Feb" month labels. Subtle dashed concentric gridlines (alpha 0.22) and faint spoke dividers (alpha 0.18) are visible but not distracting.
      Data: All 12 wedges filled with brand green #009E73, with fill_alpha graded by rainfall value — winter months (Dec/Jan/Nov, ~75-90mm) render fully saturated and largest, low-rainfall summer months (Jun/Jul, ~15-20mm) render pale and small. White (page-background-colored) borders cleanly separate adjacent wedges.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black matching #1A1A17, not pure black.
      Chrome: Title and month labels render in light cream (#F0EFE8), clearly visible against the dark background — no dark-on-dark failures. Radial mm-scale labels use lighter gray (#B8B7B0), also legible. Gridlines and spoke dividers use the same light-ink color at the same low alpha values as the light render's dark-ink equivalents.
      Data: Colors are visually identical to the light render — same brand green #009E73 with the same alpha gradation per month. Only chrome (background, text, gridline color) flips between themes, confirming theme-adaptive tokens are threaded through correctly.
      Legibility verdict: PASS
