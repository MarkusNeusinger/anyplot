  strengths:
  - 'Correct rose geometry with geom_bar(stat=''identity'') + coord_polar(): equal-angle
    wedges whose radius is proportional to rainfall on a zero-based radial scale'
  - Jan at 12 o'clock with clockwise natural month order; lets-plot keeps the data
    order of the string column without extra casting
  - Angular spoke gridlines removed (panel_grid_major_x and panel_grid_minor blanked)
    so only radial rings with value labels remain
  - Page-colored wedge outlines (color=PAGE_BG) separate neighbouring wedges cleanly
    in both themes
  - 'Theme tokens threaded through title, axis text and backgrounds; #009E73 identical
    in both renders; full canvas painted via the gggrid wrapper'
  - Interactive HTML export alongside the PNG gives hover values per month
  weaknesses:
  - 'VQ-07 (both): radial gridlines are drawn in solid INK_SOFT (#4A4A44 light / #B8B7B0
    dark), noticeably stronger than the style guide''s grid tone and visible as lines
    across the wedges → the grid token rgba(26,26,23,0.15) / rgba(240,239,232,0.15).
    Likely cause: panel_grid_major=element_line(color=INK_SOFT, size=0.3).'
  - 'Suggestion: the radial value labels sit on the far left axis, with ''0'' directly
    beside ''Oct''; moving the radial axis text closer to the rings would tie the
    values to their circles.'
  - 'Suggestion: lets-plot tooltips (layer_tooltips) could format the hover text as
    ''Jul: 168 mm'' in the HTML export.'
