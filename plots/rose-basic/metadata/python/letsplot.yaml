review:
  strengths:
  - 'Correct rose/coxcomb geometry via coord_polar() + geom_bar(stat=''identity''):
    radius is proportional to value, not area, matching the spec''s explicit requirement'
  - Natural circular ordering with Jan placed at 12 o'clock and months proceeding
    clockwise, exactly as the spec recommends for time-cyclical data
  - Radial gridlines (0/50/100/150) are kept for value estimation while the code intentionally
    simplifies the design; single consistent Imprint brand hue (#009E73) used across
    all 12 wedges per the spec's 'consistent color scheme' option
  - Realistic, neutral seasonal rainfall dataset (65-170mm) with a plausible monsoon-like
    summer peak that gives the chart a clear visual focal point
  - Theme-adaptive chrome correctly threads INK/INK_SOFT/PAGE_BG tokens through title,
    axis text and grid for the interior plot area; data color is pixel-identical between
    the light and dark renders
  - Clean, deterministic, single-block script with no unused imports and correct plot-{theme}.png/.html
    output via ggsave(scale=4)
  weaknesses:
  - 'Unwanted ~25px solid border/frame (RGB 71,112,76 / #476E4C, an olive-green not
    in the Imprint palette or style guide) runs around all four edges of the canvas
    in BOTH plot-light.png and plot-dark.png, at the identical color in both renders.
    This fails the theme-adaptive chrome rule (chrome must flip between light/dark;
    this frame does not) and reads as an unintended rendering artifact rather than
    a design choice. Likely cause: theme_minimal() applies a default plot/panel border
    that the custom theme() override does not fully clear -- plot_background=element_rect(fill=PAGE_BG,
    color=PAGE_BG) sets fill and color to match, but a residual border stroke with
    a different default color is still being drawn. Fix: explicitly zero out the border
    (e.g. element_rect(..., size=0) or the lets-plot equivalent for suppressing panel/plot
    border stroke) and re-render both themes, then sample corner pixels to confirm
    they exactly equal PAGE_BG.'
  - Code comment says panel_grid_major_x=element_blank() should 'drop angular spokes,
    keep radial rings', but both renders still show angular spoke gridlines running
    from the center through each wedge boundary out to the outer ring -- the intended
    visual simplification was not achieved (not a hard failure since the spokes aid
    reading wedge boundaries, but the code's stated intent and the actual render disagree;
    either restyle to truly remove them or update the comment/design decision).
  - Aesthetic polish (DE-01/DE-02) is held back mainly by the border artifact above;
    once removed, the theme-adaptive minimalism would read as considerably more refined.
  - 'Library Mastery: only baseline lets-plot/ggplot grammar is used (coord_polar
    + geom_bar); no interactive tooltip customization or other lets-plot-distinctive
    feature is highlighted despite the interactive HTML export being one of the library''s
    main differentiators versus static plotnine/ggplot2.'
  image_description: |-
    Light render (plot-light.png):
      Background: Interior plot/panel area is a warm off-white matching the required #FAF8F1. However, a ~25px solid olive-green border (measured RGB 71,112,76 / #476E4C) runs around all four outer edges of the 2400x2400 canvas -- this color is not part of the Imprint palette or style guide and does not belong.
      Chrome: Title "Monthly Rainfall Distribution · rose-basic · letsplot · anyplot.ai" is bold, dark, and fully legible at the top-left. Month labels (Jan-Dec) ring the outside of the polar plot in medium-gray, all legible. Radial axis ticks (0/50/100/150) and the "Rainfall (mm)" axis title on the left are legible dark/soft-ink text against the light background. Radial gridlines and angular spokes are thin and subtle, visible but not dominant.
      Data: All 12 wedges are filled with a single Imprint brand green (#009E73, alpha 0.9), radius proportional to monthly rainfall value, tallest at Jul (~168mm) tapering to shortest around Feb (~65mm). Thin white gaps separate adjacent wedges.
      Legibility verdict: PASS for all text; FAIL for the border frame color, which is off-palette and not theme-neutral chrome.

    Dark render (plot-dark.png):
      Background: Interior plot/panel area is a warm near-black matching the required #1A1A17. The same ~25px olive-green border (identical RGB 71,112,76, unchanged from the light render) still rings all four canvas edges -- since it does not flip with the theme, it fails the "only chrome adapts" rule.
      Chrome: Title and axis text switch to light ink (#F0EFE8/#B8B7B0-ish) and remain fully legible against the dark background; no dark-on-dark or light-on-light failures for any title/axis/tick text. Grid rings and spokes are still subtly visible in light gray against the dark panel.
      Data: Wedge colors are pixel-identical to the light render (#009E73), confirming the brand hue is theme-invariant as required. Same radius pattern, same relative sizing, same focal peak at Jul.
      Legibility verdict: PASS for all title/axis/tick text; FAIL for the border frame, which is the same non-adaptive off-palette color as the light render.
