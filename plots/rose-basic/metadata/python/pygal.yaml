review:
  strengths:
  - 'True rose geometry: each month is a closed equal-angle wedge with a curved outer
    arc sampled along ARC_STEPS, centred on its spoke, radius linear from zero'
  - Radial value labels are moved into an SVG group drawn after the series, so the
    mm scale stays crisp above the wedge fill in both themes
  - Grid colored through guide_stroke_color / major_guide_stroke_color from INK_MUTED,
    so the rings and spokes stay subtle but visible on both the light and the dark
    page
  - 'Theme-correct chrome and identical brand-green #009E73 wedges in both renders;
    legend correctly omitted for the single series'
  - Data held in a DataFrame with named column roles and a HEADROOM-derived range,
    deterministic and neutral rainfall scenario
  - Wedges stay reactive SVG elements, so the HTML output keeps pygal's hover behaviour
  weaknesses:
  - 'SC-02 (both): the months run counter-clockwise (Jan at the top, Feb to its left,
    Dec to its right), against the clockwise reading of a calendar or clock face,
    so the spec''s natural circular order (C2) is reversed → clockwise order with
    Jan still at 12 o''clock. Likely cause: pygal''s Radar lays x_labels out counter-clockwise;
    pass the categories (and their values) as Jan, Dec, Nov, …, Feb, or flip the angle
    in the wedge geometry.'
  - 'CQ-01 (code): the wedges are drawn inside a RoseChart(Radar) class that overrides
    pygal''s private _plot(), so the data drawing sits in a class the agent chat''s
    validator refuses → build the wedges at the top level (for example one closed
    polygon per month computed from the angles, drawn with a public pygal chart type).
    Likely cause: the subclass approach to wedge geometry.'
  - 'Suggestion: a labelled outer ring just above the largest value (for example 160
    mm) would let the reader bound the Dec wedge, which now reaches past the last
    labelled ring at 140 mm.'
  - 'Suggestion: circular rather than 12-sided polygon rings would match the curved
    wedge arcs exactly between spokes.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, not pure white.
      Chrome: title "rose-basic · python · pygal · anyplot.ai" in dark ink across ~65% of the width; twelve month labels (Jan at 12 o'clock, then Feb, Mar ... counter-clockwise, Dec to the right of Jan) in dark ink; radial value labels 0 mm–140 mm along the Jan spoke at one size, drawn above the wedges in dark ink. Dashed muted-grey 12-sided rings and thin spokes, subtle but visible.
      Data: twelve brand-green #009E73 wedges at 0.7 opacity with a slightly darker same-hue outline separating neighbours; large winter wedges (Nov–Feb, Dec longest at 155 mm) and slivers in summer (Jul 20 mm). No dots, no legend.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17, not pure black.
      Chrome: title, month labels and radial value labels in light cream ink, all clearly readable; the value labels sit above the dark-green fill and read crisply. Grid rings and spokes in a muted light grey, visible on the dark page. No dark-on-dark text.
      Data: the same #009E73 wedges, identical shape and color to the light render (only chrome flipped).
      Legibility verdict: PASS
