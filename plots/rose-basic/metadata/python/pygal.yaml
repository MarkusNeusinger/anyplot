review:
  strengths:
  - 'The primary weakness from the first review is fully resolved: the chart now draws
    true pie-slice wedge sectors (center → radial edge → curved outer arc sampled
    with ARC_STEPS → radial edge → center) via a custom RoseChart(Radar) subclass,
    instead of the previous connected star/spider polygon — this now matches the spec''s
    rose/coxcomb definition precisely, with each month visually separated as its own
    petal.'
  - Jan is still placed at the 12 o'clock start position as the spec requests for
    time-cyclical data, and the circular month ordering is preserved.
  - Both radial (show_y_guides) and angular (show_x_guides) gridlines are present,
    and value_formatter appends 'mm' units to every radial tick.
  - Single-series legend is correctly omitted (show_legend=False) per style-guide
    decoration-removal guidance.
  - Identical brand-green (#009E73) data color and theme-correct chrome (background,
    title, month labels, tick values) across both light and dark renders; no clipping
    at any canvas edge.
  - Realistic, neutral Pacific-Northwest monthly rainfall dataset with a clear winter-high/summer-low
    seasonal curve spanning the full 20-155mm range.
  - Deterministic hardcoded data, only used imports, correct output convention (plot-{theme}.png
    + plot-{theme}.html).
  weaknesses:
  - 'VQ-01: pygal draws the axis/guide group before the data series group, so the
    semi-transparent wedge fill (opacity=0.7) paints over the radial tick-value labels
    (''100 mm'', ''80 mm'', ''60 mm'', ''40 mm'', ''20 mm'', ''0 mm'') wherever they
    fall inside a wedge, tinting the ink-colored text and softening contrast versus
    labels sitting on plain background. Consider drawing the value labels in a separate
    top-level overlay group (or bumping their z-order) so they always render above
    the wedge fills.'
  - 'VQ-02: the Jan vertex dot marker (dots_size=10, Jan=145mm) sits directly on top
    of the ''140 mm'' guide label and visibly overlaps the trailing ''m'' character
    in both renders. Not severe (the numeric value stays legible) but a real, avoidable
    overlap — nudge the dot''s z-order below the text-overlay, or offset the guide
    label''s x position slightly away from the Jan spoke.'
  - 'CQ-01: achieving true wedge geometry required subclassing Radar and overriding
    the private _plot() method (relying on internal APIs like self._x_pos and self.view()),
    which departs from the KISS ''imports → data → plot → save, no functions/classes''
    structure — justified here since pygal has no public API for coxcomb/rose wedges,
    but worth noting as added structural complexity.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white, matches #FAF8F1, not pure white.
      Chrome: Title "rose-basic · python · pygal · anyplot.ai" in dark ink at top, ~75% of canvas width — expected for the mandated title length, not a deduction. 12 month labels (Jan-Dec) arranged clockwise starting at 12 o'clock, dark and clearly readable, several rotated near the sides for legibility. Radial axis shows "0 mm" through "160 mm" along the Jan spoke; labels overlapping the wedge fill are tinted darker-teal but still legible (see VQ-01 weakness). Dotted circular/radial guide lines are subtle but visible.
      Data: single brand-green (#009E73) series now rendered as 12 discrete pie-slice wedges (true wedge sectors with a curved outer arc per month) instead of a connected star polygon — visible stepped "petal" silhouette between adjacent months of different rainfall values, which is the defining rose/coxcomb visual. Semi-transparent fill (opacity 0.7) so the grid stays faintly visible through it, solid stroke outlining each wedge, dot markers (size 10) at the outer-arc midpoint of every month. Shape clearly bulges toward Nov-Feb (high rainfall) and collapses toward Jun-Aug (low rainfall).
      Legibility verdict: PASS (all text readable; minor tinting of tick labels under the fill and a small overlap between the "140 mm" label and the Jan dot marker, noted as weaknesses but not legibility failures).

    Dark render (plot-dark.png):
      Background: warm near-black, matches #1A1A17, not pure black.
      Chrome: same title and month labels rendered in light cream text, clearly legible against the dark background — no dark-on-dark failures anywhere. Grid guide lines remain subtle and visible in a lighter dotted tone.
      Data: identical brand-green (#009E73) wedge sectors, same shape and vertex positions as the light render — confirms only chrome flipped, data color held constant. Same "140 mm" label / Jan-dot overlap and under-fill tick-label tinting as in the light render.
      Legibility verdict: PASS (all text readable; same minor weaknesses as light render).
