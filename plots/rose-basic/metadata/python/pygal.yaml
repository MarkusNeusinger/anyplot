review:
  strengths:
  - 'Honest, well-documented tradeoff: the code comment explains up front that pygal.Radar
    is used as the closest built-in approximation to a rose/coxcomb chart, and why
    dots are added (low-radius summer months stay readable where the fill collapses
    near center).'
  - Jan is placed at the 12 o'clock start position as the spec explicitly requests
    for time-cyclical data.
  - Both radial (show_y_guides) and angular (show_x_guides) gridlines are present
    to aid value estimation, and a value_formatter appends 'mm' units to the radial
    axis.
  - Single-series legend is correctly omitted (show_legend=False) per style-guide
    decoration-removal guidance.
  - Identical brand-green (#009E73) data color and theme-correct chrome (background/text)
    across both light and dark renders; all text legible in both themes.
  - Realistic, neutral Pacific-Northwest monthly rainfall dataset with a clear, factually
    plausible winter-high/summer-low seasonal curve spanning the full 20-155mm range.
  - Clean KISS structure, deterministic hardcoded data, only used imports, and correct
    output convention (plot-{theme}.png + plot-{theme}.html).
  weaknesses:
  - 'SC-01 Plot Type: pygal.Radar renders a spider/star polygon — straight edges connecting
    12 vertices — not a rose/coxcomb chart. A true rose chart shows discrete pie-slice
    sectors (two straight radial edges at the category''s angular boundary plus a
    curved arc at the outer radius), so each category''s ''wedge'' is visually separated
    from its neighbors. The radar polygon blends adjacent categories along a straight
    chord instead, which is a materially different visual metaphor even though angle=category
    and radius=value are both correctly encoded. Consider building true wedge sectors
    manually with pygal.XY: for each month, compute a closed polygon of Cartesian
    points (center → arc points from angle_start to angle_end at radius=value → back
    to center) and add each as its own filled series/element so the plot actually
    reads as pie-slice wedges rather than a connected star outline.'
  - 'VQ-01: the radial tick-value labels (e.g. ''100 mm'', ''80 mm'', ''40 mm'') sit
    on top of the semi-transparent green fill (opacity=0.78) for most of the lower/mid
    range, and the label color (foreground_subtle) is a similar muted tone to the
    fill blend, which slightly reduces contrast versus labels sitting fully on the
    plain background. Consider nudging the value-label color or reducing fill opacity
    near the label column.'
  - 'VQ-02: the ''140 mm'' radial tick label sits very close to the Jan vertex marker/dot
    (Jan value = 145mm, just above the 140 ring) in both renders — not a severe collision,
    but tight enough to warrant a small buffer (e.g. inset the value labels slightly,
    or nudge the Jan data point label offset).'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white, matches #FAF8F1, not pure white.
      Chrome: Title "rose-basic · python · pygal · anyplot.ai" in dark ink at top, ~75% of canvas width — expected for the mandated title length, not a deduction. 12 month labels (Jan-Dec) arranged clockwise starting at 12 o'clock, dark and clearly readable, some rotated for legibility near the sides. Radial axis shows "0 mm" through "160 mm" in a muted teal-gray tone along the Jan spoke. Dotted circular/radial guide lines are subtle but visible.
      Data: single brand-green (#009E73) filled 12-vertex polygon (pygal Radar) with a solid stroke, dot markers at every vertex (size 10), semi-transparent fill (opacity 0.78) so the grid remains faintly visible through it. Shape clearly bulges toward Nov-Feb (high rainfall) and collapses toward Jun-Aug (low rainfall), so the seasonal pattern is legible at a glance.
      Legibility verdict: PASS (all text readable; minor tight spacing between the "140 mm" tick label and the Jan vertex marker, noted as a weakness but not a legibility failure).

    Dark render (plot-dark.png):
      Background: warm near-black, matches #1A1A17, not pure black.
      Chrome: same title and month labels now rendered in light cream text, clearly legible against the dark background — no dark-on-dark failures observed anywhere (title, month labels, radial tick values all flip to light ink correctly). Grid guide lines remain subtle and visible in a lighter dotted tone.
      Data: identical brand-green (#009E73) polygon, same shape and vertex positions as the light render — confirms only chrome flipped, data color held constant.
      Legibility verdict: PASS (all text readable; same minor "140 mm" label / Jan-vertex proximity as in the light render).
