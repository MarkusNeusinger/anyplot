review:
  strengths:
  - 'True rose geometry: each month is a closed equal-angle wedge with a curved outer
    arc, centred on its spoke, radius linear from zero'
  - Radial value labels are moved into an SVG group drawn after the series, so the
    mm scale stays crisp above the wedge fill in both themes
  - 'Theme-correct chrome and identical brand-green #009E73 wedges in both renders;
    grid colored from INK_MUTED'
  - Neutral deterministic rainfall data with named column roles and a HEADROOM-derived
    range
  weaknesses:
  - 'SC-02 (both): the months run counter-clockwise (Jan at the top, Feb to its left,
    Dec to its right), against the clockwise reading of a calendar or clock face (C2)
    → clockwise order with Jan still at 12 o''clock. Likely cause: pygal''s Radar
    lays x_labels out counter-clockwise; reverse the category order after Jan or flip
    the angle in the wedge geometry.'
  - 'CQ-01 (code): the wedges are drawn inside a RoseChart(Radar) class that overrides
    pygal''s private _plot() → build the wedges at the top level with a public pygal
    chart type. Likely cause: the subclass approach to wedge geometry.'
  - 'Suggestion: a labelled outer ring just above the largest value (for example 160
    mm) would let the reader bound the Dec wedge.'
  - 'Suggestion: circular rather than 12-sided polygon rings would match the curved
    wedge arcs between spokes.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, not pure white.
      Chrome: title "rose-basic · python · pygal · anyplot.ai" in dark ink across ~67% of the width; twelve month labels in dark ink, Jan at 12 o'clock then Feb, Mar ... counter-clockwise (Dec to the right of Jan); radial value labels 0 mm–140 mm along the Jan spoke drawn above the wedges in dark ink. Dashed muted-grey 12-sided rings and thin spokes, subtle but visible.
      Data: twelve brand-green #009E73 wedges at 0.7 opacity with a same-hue outline separating neighbours; large winter wedges (Nov–Feb, Dec longest at 155 mm) and slivers in summer (Jul 20 mm). No dots, no legend.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17, not pure black.
      Chrome: title, month labels and radial value labels in light cream ink, all clearly readable; value labels sit above the fill. Grid rings and spokes in muted light grey, visible. No dark-on-dark text.
      Data: the same #009E73 wedges, identical shapes and color to the light render (only chrome flipped).
      Legibility verdict: PASS
