review:
  strengths:
  - Rose/coxcomb chart correctly built on a polar projection with radius (not area)
    proportional to value, matching the spec's core requirement
  - 'Bars colored via an Imprint sequential gradient (#009E73 -> #4467A3) assigned
    by rainfall rank, so color depth reinforces magnitude alongside radius — a genuine
    continuous encoding, not a decorative gradient'
  - 'Attempt-1 fix confirmed: title now reads ''Monthly Rainfall (mm) · rose-basic
    · python · seaborn · anyplot.ai'', restoring the required language token'
  - 'Attempt-1 fix confirmed: the halo-boxed ''50 mm'' radial tick label was moved
    into the angular gap between the Jun/Jul bars and no longer overlaps bar fill'
  - 'Both renders are theme-correct: #FAF8F1/#1A1A17 backgrounds, all chrome (title,
    month labels, radial ticks, value labels) clearly legible in both themes, data
    colors identical across themes'
  - Clean square 2400x2400 canvas, all 12 months and their value labels fit without
    clipping or overflow
  - Realistic, neutral monthly rainfall dataset with a plausible seasonal curve (72-168
    mm)
  weaknesses:
  - Core petal rendering still uses raw matplotlib ax.bar() on a polar Axes rather
    than any seaborn plotting function — seaborn has no native polar/rose chart API,
    so this is a real library limitation, but it continues to cap Library Mastery
    credit (sns.set_theme + sns.blend_palette are the only idiomatic seaborn touches)
  - Data storytelling still relies mainly on the chart type's inherent bar-length
    encoding; the color-by-magnitude gradient is a nice secondary cue but there is
    no explicit focal-point treatment (e.g. a callout or emphasis on the June peak)
    to create a stronger visual hierarchy
