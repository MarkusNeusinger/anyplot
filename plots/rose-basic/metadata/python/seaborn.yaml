review:
  strengths:
  - Rose/coxcomb chart correctly built on a polar projection with radius (not area)
    proportional to value, matching the spec's core requirement
  - 'Bars colored via sns.blend_palette(#009E73 -> #4467A3) assigned by rainfall rank,
    so color depth reinforces magnitude in addition to radius — a genuine Imprint-compliant
    continuous encoding, not a decorative gradient'
  - Handles the seaborn axisbelow tick-label z-order quirk with a manually drawn,
    halo-boxed '50 mm' label instead of letting it render invisibly behind the bars
  - 'Both renders are theme-correct: FAF8F1/1A1A17 backgrounds, all chrome (title,
    month labels, radial tick labels, value labels) clearly legible in both themes,
    data colors identical across themes'
  - Clean square 2400x2400 canvas, all 12 months and their value labels fit without
    clipping or overflow
  - Realistic, neutral monthly rainfall dataset with a plausible seasonal curve (72-168
    mm)
  weaknesses:
  - 'Title is missing the required language token: current title is ''Monthly Rainfall
    (mm) · rose-basic · seaborn · anyplot.ai'' but the mandated format is ''{Descriptive
    Title} · {spec-id} · {language} · {library} · anyplot.ai'' — insert ''python''
    between ''rose-basic'' and ''seaborn'''
  - The manually drawn '50 mm' halo-boxed radial tick label sits directly on top of
    the Dec/Jan bar boundary at zorder=5, partially overlapping the bar fill beneath
    it (halo box keeps it legible, but it's placed over data rather than in clear
    space) — consider nudging its angular position a few degrees into the gap wedge
    between bars, or placing it just outside the bar radius instead of on top of it
  - Core bar rendering uses raw matplotlib ax.bar() on a polar Axes rather than any
    seaborn plotting function — acceptable since seaborn has no native polar/rose
    chart support, but library-mastery credit is limited to the theming (sns.set_theme)
    and sns.blend_palette usage
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1), consistent with the light theme spec, applied to both figure and polar axes background.
      Chrome: Bold dark title "Monthly Rainfall (mm) · rose-basic · seaborn · anyplot.ai" at top-left, fully visible and not clipped. Twelve bold month labels (Jan-Dec) ring the plot in dark ink. Radial tick labels "100 mm" and "150 mm" in soft gray sit near the upper-right spoke; the "50 mm" tick is instead drawn as a halo-boxed text label near the plot center (workaround for the hidden default tick). Per-bar value labels (89, 72, 95, 112, 135, 168, 142, 125, 98, 76, 82, 91) are placed just outside each bar tip in soft dark gray, bold.
      Data: 12 polar bars ("petals"), one per month, radius proportional to rainfall value, starting at 12 o'clock (Jan) and proceeding clockwise. Bar fill follows an Imprint sequential gradient from brand green (#009E73) to blue (#4467A3) assigned by rainfall rank (driest months greenest, wettest months bluest), each bar outlined with a thin dark edge and separated by white gaps.
      Legibility verdict: PASS — all title, tick, and value text reads cleanly against the light background; no light-on-light text found.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17), consistent with the dark theme spec, applied to both figure and polar axes background.
      Chrome: Same title text now rendered in light ink, fully visible. Month labels switch to light-colored bold text, radial "100 mm"/"150 mm" labels and the halo-boxed "50 mm" label render in light gray with a dark halo box, all legible. Value labels per bar remain in a light-gray tone consistent with the dark theme's INK_SOFT token.
      Data: Same 12 bars in the identical green-to-blue gradient and radial proportions as the light render — only the chrome (background, text, grid, halo box) flipped to dark-theme colors, confirming the data-color identity requirement.
      Legibility verdict: PASS — no dark-on-dark failures observed; all tick labels, month labels, title, and value labels are clearly readable against the near-black background.
