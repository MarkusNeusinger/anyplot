review:
  strengths:
  - Radius is honestly proportional to value (not area) via `value * cos/sin`, matching
    the spec's explicit anti-pattern warning
  - 'Rich, native grammar-of-graphics construction: layered geom_path (radial grid
    + spokes) + geom_polygon (wedges) + geom_text (month + value labels) — no matplotlib
    fallback despite plotnine lacking a robust coord_polar bar path'
  - Alpha scales with rainfall value (scale_alpha_continuous) as a redundant encoding
    on top of radius, on a single consistent brand-green hue, exactly matching the
    spec's 'single color with varying saturation' guidance
  - Correct 12 o'clock start position and natural Jan→Dec circular ordering for cyclical
    month data
  - Fully theme-adaptive chrome (INK/INK_SOFT/INK_MUTED, PAGE_BG) verified correct
    and legible in both light and dark renders, including the wedge-separator strokes
    which correctly flip color per theme
  - 'Clean square-canvas execution: exactly 2400×2400 px, generous balanced margins,
    no clipped text at any edge'
  - Deterministic, KISS-structured script with only used imports and no fake interactivity
  weaknesses:
  - No explicit callout/annotation of the wettest (Nov, 95mm) or driest (Apr, 48mm)
    month — visual hierarchy relies entirely on radius+alpha rather than a direct
    label, which would push Data Storytelling (DE-03) further
  - Radial tick labels (20/40/60/80/100) show bare numbers with no 'mm' unit marker
    on the axis itself — the unit is only conveyed via the title, which is acceptable
    but not maximal
  - geom_polygon fill alpha is a fairly subtle 0.35–1.0 range; the driest months (Feb/Apr/May)
    read close to each other in saturation and lean mostly on radius alone to differentiate
    — a slightly wider alpha floor/ceiling would sharpen the redundant encoding
  - 'LM-02: the manual trigonometric polygon construction is a workaround for plotnine''s
    limited polar-bar support rather than a feature genuinely unique to plotnine —
    a distinctive but not irreplicable technique'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "Monthly Rainfall (mm) · rose-basic · python · plotnine · anyplot.ai" is dark ink, centered, ~77% of canvas width, fully visible with comfortable margins on all sides. Bold month labels (Jan–Dec) ring the chart in dark ink, fully legible, none clipped at any canvas edge. Radial value ticks (20/40/60/80/100) render in a muted gray-brown tone along the Dec/Jan boundary spoke, legible against both the plain background and the semi-transparent green wedges beneath them. Dashed radial gridlines and thin spoke lines are subtle (~12-15% alpha) and do not compete with the data.
      Data: All 12 monthly wedges render in the single Imprint brand green (#009E73) with alpha scaling by rainfall value (higher rainfall = more opaque/saturated green), giving a redundant value encoding on top of radius. Thin off-white strokes separate adjacent wedges cleanly. Radius is proportional to value (not area), correctly per spec.
      Legibility verdict: PASS — all text (title, month labels, tick labels) is clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Title and month labels render in light off-white ink, fully legible against the dark background, no clipping at any edge. Radial value ticks (20/40/60/80/100) render in a light muted gray, clearly legible over both the plain dark background and the semi-transparent green wedges. Grid/spoke lines remain subtle and visible without dominating.
      Data: Data colors are identical to the light render — same brand green #009E73 with the same alpha-by-value gradient across all 12 wedges. Wedge-separator strokes correctly flip to a dark/near-black tone in this theme (matching PAGE_BG) rather than staying off-white, confirming proper theme-adaptive chrome on every non-data element.
      Legibility verdict: PASS — no dark-on-dark failures observed; all title, label, and tick text is clearly readable against the dark background.
