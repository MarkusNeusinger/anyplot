review:
  strengths:
  - 'Correct rose/coxcomb construction: radius is linearly proportional to value (not
    area), exactly as the spec requires, with equal-angle wedges and Jan starting
    at 12 o''clock going clockwise.'
  - Precise, collision-aware label placement — value labels, month labels, and the
    four radial gridline labels are all positioned to avoid the tallest/shortest petals,
    with the tricky Jun/Jul/Aug cluster (values 22-30mm) specifically reasoned about
    in code comments.
  - 'The continuous imprint_seq (#009E73 -> #4467A3) color-value gradient adds a genuine
    second, CVD-safe data channel that is redundant with radius (higher rainfall reads
    bluer), which is a thoughtful design choice beyond a flat single color.'
  - 'Theme-adaptive chrome is fully correct in both renders: exact #FAF8F1/#1A1A17
    backgrounds, readable ink-toned text and gridlines on both surfaces, identical
    data colors between light and dark.'
  - Canvas usage is well balanced — measured bounding box shows symmetric 328px left/right
    margins and close 225/301px top/bottom margins, with plot content filling roughly
    75% of the 2400x2400 canvas.
  - Code comments document real vl-convert quirks that were worked around (radius
    channel collapsing on point/line marks, per-layer theta auto-fit desync) rather
    than leaving a silently broken chart.
  - Realistic, internally consistent Mediterranean-style rainfall data (wet Oct-Jan,
    dry Jun-Aug) showing the full value range and a genuine seasonal/cyclical pattern.
  weaknesses:
  - At mobile scale (~400px), the smallest text — the 11pt value labels and especially
    the 10pt '25 mm'/'50 mm'/'75 mm'/'100 mm' gridline labels — becomes harder to
    read, most noticeably the tight '25 mm' / '22' cluster near the Jun/Jul boundary;
    bumping those two font sizes slightly (e.g. grid labels 10->12, value labels 11->13)
    would hold up better when scaled down.
  - A few label pairs sit close together without overlapping (e.g. 'Nov' / '92', '25
    mm' / '22') — safe today, but with little margin for error if the data changes;
    a bit more radial buffer would add safety.
  - The color gradient's second meaning (value, redundant with radius) is not called
    out anywhere in the chart (no caption/subtitle) — purely optional polish, not
    a defect, since the redundant encoding is still intuitively readable.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "rose-basic · python · altair · anyplot.ai" in bold dark ink, centered above the chart. Twelve bold month labels (Jan-Dec) ring the chart starting at 12 o'clock (Jan) and proceeding clockwise. Four dashed radial gridlines labeled "25 mm", "50 mm", "75 mm", "100 mm" sit in the lower half of the chart, positioned near the shortest petals (Jun/Jul boundary) to avoid crossing any wedge. Bold numeric value labels (e.g. 78, 52, 68, 45, 35, 28, 22, 30, 55, 85, 92, 88) sit just outside each wedge tip.
      Data: 12 pie-slice-style wedges (one per month) with radius proportional to monthly rainfall (mm). Color is a continuous green (#009E73, low values) to blue (#4467A3, high values) gradient keyed to the same value as the radius — e.g. Jun (28mm) and Jul (22mm) are green, Nov (92mm) and Dec (88mm) are blue. Each wedge has a thin background-colored stroke separating it from its neighbors.
      Legibility verdict: PASS — all title, month, and gridline text reads clearly against the light background; no light-on-light issues. At 400px mobile scale the title and month labels stay legible; the smallest gridline/value labels (10-11pt) are a little tight but still legible.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title, month labels, and gridline labels, now rendered in light ink (title/months near-white, gridline labels light gray) — clearly readable against the dark background, no dark-on-dark failures observed anywhere (title, ticks, gridline labels, or value labels).
      Data: Data colors are pixel-identical to the light render — same green-to-blue gradient across the same 12 wedges, confirming only chrome (background, text, grid stroke color, wedge separator stroke) flipped between themes.
      Legibility verdict: PASS — all text is clearly legible on the dark surface; brand green remains visible and unchanged from the light render.
