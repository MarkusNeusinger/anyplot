review:
  strengths:
  - 'Correct rose/coxcomb geometry: equal-angle wedges with radius (not area) proportional
    to value, built via band! sampled over 40 arc points per wedge so edges are true
    curved arcs rather than straight-edged polygon approximations'
  - 'Thoughtful PolarAxis configuration: January placed at 12 o''clock (theta_0 =
    -pi/2) with clockwise month ordering (direction = -1), matching calendar/compass
    convention called out in the spec'
  - Radial tick angle (13*pi/12) deliberately routed through the driest Jul/Aug wedges
    so the '0/20/40/60/80/100 mm' labels never sit on top of the tall bars — verified
    no overlap in either theme
  - 'Full theme-adaptive chrome: background, ink, ink-soft, and grid alpha all keyed
    off ANYPLOT_THEME; first (only) series is Imprint #009E73 and is identical in
    both renders'
  - Realistic, neutral monthly-rainfall data for a temperate coastal city with a clear,
    factually plausible wet-winter/dry-summer cycle and light stochastic noise (randn
    * 4) for texture
  - 'Clean KISS script: imports -> data -> plot -> save, no functions/classes, explicit
    font sizes throughout, correct plot-$(THEME).png output'
  weaknesses:
  - Radial tick labels ('0 mm'/'20 mm'/'40 mm'/.../'100 mm') use rticklabelsize=12,
    the smallest text on the chart — at the ~400px mobile preview they blur into low
    legibility while the title and month labels stay readable. Bump to ~14-16 (and/or
    thicken via a slightly bolder weight if available) so the value scale survives
    the mobile downscale.
  - The chart relies entirely on flat single-color wedges with no secondary visual
    emphasis — the spec explicitly allows this ('single color with varying saturation
    or distinct colors per category'), but leaning into the 'varying saturation' option
    (e.g. a subtle alpha/lightness ramp keyed to value, or a slightly heavier stroke
    on the wettest month) would lift it from 'clean default' to genuinely polished
    and give the chart a clearer focal point.
  - No visual hierarchy beyond wedge length itself — consider a light callout or stroke-highlight
    on the peak (Dec, ~95mm) and trough (Jul, ~33mm) wedges to make the seasonal story
    immediately legible, not just discoverable by scanning.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Title "Monthly Rainfall · rose-basic · julia · makie · anyplot.ai" in dark ink, centered, ~55-60% of canvas width, comfortable clearance above the Jan label. 12 month labels (Jan...Dec) ring the outer edge, clockwise from 12 o'clock, all fully visible with generous margin to the canvas border. Radial gridlines at 0/20/40/60/80/100 mm are subtle gray circles; the "mm"-suffixed tick labels sit in the gap between the Jul/Aug wedges (the two shortest wedges) so they never collide with the data. Outer axis spine is a clean thin dark circle.
      Data: 12 equal-angle wedges (one per month) filled solid Imprint brand green #009E73, radius proportional to rainfall (Jun ~95mm longest at top-left/Dec, Jul ~33mm shortest at bottom). Thin background-colored gaps separate each wedge so boundaries are crisp.
      Legibility verdict: PASS — all text (title, month labels, radial tick labels) is dark-on-cream and clearly readable at full resolution; radial tick labels are the smallest element and read fine at 2400px but soften somewhat once scaled to the 400px mobile preview.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Same title and month-label layout, now rendered in light ink (#F0EFE8 title, #B8B7B0 month/tick labels) against the dark surface. Grid circles are faint light-gray at the same low opacity. Outer spine is a light-gray circle instead of dark.
      Data: Wedges are the identical Imprint green #009E73 as the light render — confirmed no hue shift between themes, only the chrome flipped.
      Legibility verdict: PASS — no dark-on-dark failures found; all title/label/tick text is clearly light-colored against the near-black background, and the green wedges read strongly on both surfaces.
