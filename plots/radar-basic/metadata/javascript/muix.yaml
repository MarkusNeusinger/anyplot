review:
  strengths:
  - 'Composes the community RadarChart from its own parts: RadarSeriesArea for the
    fills, a second RadarSeriesArea pass with fill="none" for the outlines so no translucent
    fill tints the other series'' outline, RadarSeriesMarks for the vertices and RadarAxis
    for the labeled value scale'
  - 'Native radar configuration covers every spec requirement: radar.max=100 with
    divisions=5 gives labeled gridlines at 20/40/60/80/100, shape="sharp" keeps the
    polygons straight-edged and closed through their vertices, stripeColor=null removes
    the default banding'
  - Translucent fills at 0.25 keep both polygons readable through each other in both
    themes; vertex marks are ringed in the page color, so they stay crisp on top of
    the fills
  - Basketball scouting data shows two complementary profiles (Guard leads on Passing
    and Speed, Forward on Rebounding and Defense), so the crossing polygons make the
    comparison readable
  - 'Theme tokens drive all chrome (title ink, inkSoft ring labels, grid strokes,
    legend text); data colors are Imprint #009E73 and #C475FD in both renders'
  - Interactive HTML keeps MUI X's native tooltip and series highlighting for each
    axis
  weaknesses:
  - 'Suggestion: the subtitle ''2 series on 6 axes · shared scale 0–100'' restates
    what the legend and ring labels already show; a subtitle naming the scouting context
    (for example ''Scouting ratings, 0–100'') would tell the reader more.'
  - 'Suggestion: the className ''radar-outline'' on the outline pass is never referenced
    in sx and could be dropped.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, square 2400x2400 canvas.
      Chrome: bold dark title "radar-basic · javascript · muix · anyplot.ai" centered at top, grey subtitle "2 series on 6 axes · shared scale 0–100" below; six bold dark metric labels (Speed, Shooting, Passing, Defense, Rebounding, Stamina) at the outer ends of evenly spaced spokes; ring labels 20/40/60/80/100 in soft grey along the Speed spoke; light grey hexagonal gridlines at five levels; legend "Guard / Forward" at the bottom center. All text is readable against the light background.
      Data: Guard polygon in brand green #009E73, Forward in lavender #C475FD, both filled at about 25% opacity with solid 3 px outlines and circular vertex marks ringed in the page color; the overlap reads as a muted blue-grey and both outlines stay visible above every fill. Polygons are closed and straight-edged, and the vertices sit at their values (for example Guard Passing 92, Forward Rebounding 90).
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title and metric labels flip to light ink, subtitle and ring labels to light grey, gridlines to a subtle dark grey that stays visible; legend text is light. No dark-on-dark text anywhere.
      Data: the same #009E73 and #C475FD for the outlines, fills and marks as in the light render; the vertex rings flip to the dark page color. Only the chrome changes.
      Legibility verdict: PASS
