review:
  strengths:
  - 'Semantic Imprint pairing: brand green #009E73 for rising days and the red loss
    anchor #AE3030 for falling days, identical in both renders and in the finance
    convention the Notes name'
  - 'Candle anatomy built from native Makie primitives: rangebars! with whiskerwidth
    = 0 draws the wicks at 1.5 px, poly! with Rect2f bodies at 0.64 of the period
    width keeps every candle distinct and its wick clearly thinner'
  - 'Complete theme threading: PAGE_BG, INK and INK_SOFT reach title, labels, ticks,
    spines, grid and legend, so both renders read cleanly'
  - Y-only grid at 15 % ink with the x grid and tick marks off suits a price-reading
    chart, and a thin 30 % ink outline on the bodies separates touching colors
  - Legend built from PolyElement entries that match the bodies' fill and outline,
    placed in its own layout column with colsize! Relative(0.87)
  - 'Strictly the basic variant: bodies, wicks and the subtle grid only, with no overlay'
  weaknesses:
  - 'Suggestion: ticks on each Monday (Jun 3, 10, 17, …) would give the date axis
    an even weekly rhythm instead of the 9/10-trading-day steps.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across figure and axis, not pure white.
      Chrome: bold title "candlestick-basic · julia · makie · anyplot.ai" centered at about 25 % of the width; axis titles "Price (USD)" and "Date (2024)" in dark ink; tick labels 170–185 and Jun 3, Jun 14, Jun 28, Jul 12, Jul 26 in INK_SOFT, all readable; left and bottom spines only, no tick marks; faint horizontal grid at each 5 USD. Frameless legend at right: "Bullish (↑)" green swatch, "Bearish (↓)" red swatch.
      Data: 40 candles, bullish in #009E73, bearish in #AE3030, thin same-colored wicks through the body centers, bodies separated by clear gaps. Price falls from about 187 to 168 by early July and recovers to about 180. No overlay lines.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
