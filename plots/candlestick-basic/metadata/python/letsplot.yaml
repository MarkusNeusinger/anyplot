review:
  strengths:
  - 'Correct candlestick anatomy: geom_rect bodies from open to close and geom_segment
    wicks from low to high through the body center, at their data values'
  - Wicks (size 0.7) clearly visible yet much thinner than the 0.7-day-wide bodies,
    with clear gaps between neighbouring candles
  - 'Imprint finance semantic exception applied: Bullish #009E73, Bearish #AE3030,
    identical in both themes'
  - 'Theme-adaptive chrome throughout: INK/INK_SOFT text, 15 % INK grid token, ELEVATED_BG
    legend box; readable in both renders'
  - Trading-day index removes weekend gaps, with weekly date ticks (Jan 02, Jan 09,
    …) that fit daily data; price axis fitted to the lows and highs, not forced to
    zero
  - 'Strictly basic variant: candles alone, no overlays or callouts'
  - layer_tooltips() OHLC hover template on both layers gives working per-candle read-outs
    in the HTML export
  weaknesses:
  - 'Suggestion: format the tooltip prices with layer_tooltips().format(''@Open'',
    ''$.2f'') (and the same for High, Low, Close) so the HTML hover shows two decimals
    instead of the raw float.'
  - 'Suggestion: the random-walk loop in the Data block could be a vectorised np.cumsum
    over the daily changes.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white #FAF8F1 across canvas and panel; not pure white. No panel border.
      Chrome: Bold near-black title "candlestick-basic · python · letsplot · anyplot.ai" top-left, about 58 % of the width; y-axis title "Price ($)", x-axis title "Trading day (Jan–Feb 2024)" in INK; tick labels 92–112 (step 2) and Jan 02, Jan 09, Jan 16, Jan 23, Jan 30, Feb 06 in INK_SOFT, all readable. Subtle horizontal-only grid. Legend at right in an elevated off-white box with green "Bullish" and red "Bearish" swatches.
      Data: 30 candles; bullish bodies in #009E73, bearish in #AE3030, thin wicks in the candle color running low to high through each body. Prices rise from 100 to a 111.6 high on Jan 08, then decline to about 93.4 low in early February and recover slightly to ~99. Several near-doji bodies.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black #1A1A17; not pure black. No panel border.
      Chrome: Title in near-white, axis titles light, tick labels in light grey INK_SOFT; all clearly readable, no dark-on-dark text. Grid lines faint light grey, subtle but visible. Legend box in elevated #242420 with light text.
      Data: Candle colors identical to the light render (#009E73 / #AE3030); both remain clearly distinguishable on the dark surface, brand green reads well.
      Legibility verdict: PASS
