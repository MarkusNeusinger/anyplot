review:
  strengths:
  - 'Bullish solid #009E73 vs bearish hollow #AE3030 bodies give a redundant, CVD-safe
    up/down encoding in both themes'
  - Wicks at 3 px stay clearly thinner than the 0.75-period bodies, and every candle
    stays distinct
  - Candle width and x padding derive from the data's median period instead of a hard-coded
    day
  - Bokeh HoverTool (vline mode, datetime and currency formatters) gives full OHLC
    inspection in the HTML
  - 'Theme chrome flips cleanly: backgrounds, ink, y-only subtle grid and elevated
    legend frame'
  weaknesses:
  - 'DQ-02 (both): the instrument is labelled ''ACME Corp Stock'', the stock placeholder
    name, which reads as generic → a plausible fictional ticker and company name (e.g.
    ''Northwind Logistics (NWLG)''). Likely cause: the title prefix string.'
  - 'Suggestion: a vectorised OHLC build (open = close.shift() with the start price)
    would shorten the data loop.'
