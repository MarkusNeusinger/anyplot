  strengths:
  - 'Clean candlestick: mark_rule wicks and mark_bar bodies layered on shared x/y
    encodings with y/y2 ranges, every candle at its data values'
  - autosize fit makes the 800x450 chart fill the 3200x1800 canvas exactly, with balanced
    margins
  - 'Finance semantic pair #009E73 bullish / #AE3030 bearish, plus an INK outline
    on every body so direction does not rest on hue alone; chrome correct in both
    themes'
  - Horizontal-only price grid at low opacity and x-scale padding keep the first and
    last candles clear of the axis ends
  - 'Adaptable structure: column constants, one Data block, escaped fields, readable
    axis and tooltip titles'
  weaknesses:
