review:
  strengths:
  - 'Stays inside the basic variant: only candle bodies, wicks and a subtle y-grid,
    as the spec''s characteristic section asks — no moving average, highlight markers
    or callouts'
  - 'Builds the candlestick idiomatically from pygal.XY with allow_interruptions=True
    and None breaks: one stroke segment per wick and per body, all at their exact
    OHLC values on the price axis'
  - Wicks (13 px) are clearly thinner than the bodies (51 px), and bodies are wide
    yet separated, so all 30 periods read as distinct candles
  - Green (#009E73, Imprint 1) for up days and matte red (#AE3030, Imprint 5) for
    down days, identical in both renders; grid and spines take INK_MUTED so the chrome
    reads on both pages
  - Y range fitted to the lows and highs (not forced to zero) and x ticks formatted
    as 'Jan 02' dates mapped from the trading-day index, which also drops the weekend
    gaps
  - 'Adaptable layout: column constants with role comments, one Data block ending
    in df, ticks derived from n_candles; tooltips with a $ value formatter in the
    HTML output'
  weaknesses:
  - 'Suggestion: set the Style opacity to 1 so the wick no longer shows through as
    a darker stripe inside each translucent body.'
  - 'Suggestion: format the price ticks without decimals (''$170'' instead of ''$170.00'')
    for a lighter y-axis.'
  - 'Suggestion: legend_at_bottom_columns=2 spreads the two entries half a canvas
    apart; placing them closer together would read as one key.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across canvas and plot area, not pure white.
      Chrome: title "candlestick-basic · python · pygal · anyplot.ai" centered in dark ink at about 58 % of the width; y-axis title "Price ($)" and x-axis title "Date" in dark ink; y ticks $130.00–$170.00 and x ticks Jan 02, Jan 08, Jan 15, Jan 22, Jan 29, Feb 05, Feb 12 all at one size; solid muted-grey horizontal grid, L-shaped left and bottom spine; legend "Bullish (Up)" / "Bearish (Down)" at the bottom in two columns. All text readable.
      Data: 30 candles; green #009E73 for up days, matte red #AE3030 for down days, slightly translucent so the wick shows as a darker stripe through each body. Thin wicks run low to high through the body centre; price rises from 150 to about 170 by mid-January and falls to about 128 by Feb 12. No overlays.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17, not pure black.
      Chrome: title, axis titles, tick labels and legend text in light ink #F0EFE8, all clearly readable; grid lines and spines in the lighter muted grey #A8A79F, subtle but visible. No dark-on-dark text.
      Data: same green and red candle colors as the light render, same geometry; the red reads slightly deeper against the dark page but stays clearly distinct from the green and from the background.
      Legibility verdict: PASS
