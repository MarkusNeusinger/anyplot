    in '$%.0f' fitted to the lows and highs, not forced to zero
  - Proportional min_body keeps near-doji candles visible as thin bodies
  - Headroom above the data keeps the legend clear of every candle
  weaknesses:
  - 'Suggestion: the legend could sit in the empty lower-left corner, which would
    let the top padding shrink and give the candles a little more height.'
