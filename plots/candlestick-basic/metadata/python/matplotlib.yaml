  - Candles built from ax.vlines (wicks, 1.5 pt) behind ax.bar with bottom= (bodies,
    0.6 day) — each period a distinct candle with the wick through the body centre
    at its data values
  - 'Imprint finance semantic exception applied correctly: bullish #009E73, bearish
    #AE3030, identical in both themes, keyed by a two-entry legend'
  - Full theme-adaptive chrome; no dark-on-dark text anywhere in the dark render
