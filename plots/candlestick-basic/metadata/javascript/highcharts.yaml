review:
  strengths:
  - 'Correct semantic color mapping — bullish uses brand green #009E73 (Imprint position
    1) and bearish uses the matte-red anchor #AE3030 (Imprint position 5), consistent
    with the style guide''s explicit finance semantic exception, and identical across
    both themes'
  - 'Clever, well-documented workaround: builds a genuine candlestick (body + high-low
    wick) from core-only column/line series (invisible floor + colorByPoint body,
    null-separated wick line pairs) since the native ''candlestick'' series type lives
    in the unavailable modules/stock bundle'
  - Deterministic LCG-seeded OHLC data with realistic daily volatility, a clear mid-January
    pullback, an overall uptrend, and a mix of bullish, bearish, and a near-doji day
  - Both themes render correctly with full chrome adaptation (background, title, axis
    labels, grid) while data colors (green/red) stay pixel-identical between light
    and dark
  - Wicks are visibly thinner (lineWidth 1.5) than candle bodies (pointWidth 12) per
    the spec's explicit instruction, and the datetime x-axis formats dates appropriately
  weaknesses:
  - Design Excellence reads as a well-configured default rather than a distinctive,
    publication-ready design — grid, spines, and typography are correct but unremarkable;
    consider a stronger visual hierarchy (e.g., a subtle callout on the largest single-day
    move, or refined legend/box treatment)
  - 'VQ-04: hue (green vs. red) is the sole signal distinguishing bullish from bearish
    candles, with no redundant encoding for colorblind readers (e.g., outline weight
    or a small directional glyph on notable candles) — this is an inherent limitation
    of candlestick charts industry-wide and matches the spec''s own guidance, so it
    is a minor deduction rather than a rejection'
  - 'Library Mastery: the floor+body+wick construction is functionally correct and
    clever, but is a generic rect+line workaround rather than something that uniquely
    leverages a Highcharts-only capability — the canonical high-level ''candlestick''
    series API isn''t available in the core-only bundle, capping how much idiomatic/distinctive
    credit is reachable here'
  - Data storytelling relies only on directional coloring and the overall trend; no
    explicit annotation or focal-point emphasis (e.g., a callout on the mid-January
    pullback or the largest move) actively guides the viewer to the most interesting
    insight
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "candlestick-basic · javascript · highcharts · anyplot.ai" in bold dark ink at top-center; x-axis title "Trading Date" and y-axis title "Share Price (USD)" in medium-dark ink; date tick labels (Jan 3 … Feb 12) and price tick labels (123–138) in a slightly softer dark gray; subtle horizontal gridlines at ~15% opacity; legend ("Bullish (Close ≥ Open)" / "Bearish (Close < Open)") centered below the x-axis title with green/red circular swatches. All chrome text is clearly legible against the light background.
      Data: 30 candlesticks over Jan 2 – Feb 12, 2024 (weekdays only). Bullish candles render in brand green (#009E73), bearish candles in matte red (#AE3030). Wicks are thin lines in the matching color, clearly thinner than the candle bodies. A near-doji (very thin cross-shaped body) appears around Jan 25. Overall price trend moves from ~$128 up to ~$134 with a visible dip to ~$124 around Jan 18–19.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Same title, axis titles, and legend now rendered in light/off-white ink; tick labels in a lighter secondary gray; gridlines remain subtle at low opacity against the dark surface. No title/label/tick text is dark-on-dark — all chrome flipped correctly to light-on-dark.
      Data: Candle colors are pixel-identical to the light render — same brand green (#009E73) for bullish and matte red (#AE3030) for bearish — confirming only chrome (not data color) changed between themes. Wick-to-body thickness ratio and candle placement are unchanged.
      Legibility verdict: PASS
