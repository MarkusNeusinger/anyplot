review:
  strengths:
  - 'Repair loop directly addressed the prior review''s Design Excellence / storytelling
    weaknesses: a data-derived shaded plotBand marks the largest peak-to-trough pullback
    and a dashed plotLine marks the largest single-day move, both explained in a concise
    subtitle — a real focal point that guides the viewer instead of a plain default
    candlestick'
  - 'Correct semantic color mapping — bullish uses brand green #009E73 (Imprint position
    1) and bearish uses the matte-red anchor #AE3030 (Imprint position 5), consistent
    with the style guide''s finance semantic exception, and pixel-identical across
    both themes'
  - Genuine OHLC candlestick built from core-only column/line series (invisible floor
    + colorByPoint body, null-separated wick line pairs) since the native 'candlestick'
    series type lives in the unavailable modules/stock bundle — a clever, well-documented
    workaround
  - Deterministic LCG-seeded OHLC data with realistic daily volatility, a clear mid-January
    pullback, an overall uptrend, and a mix of bullish, bearish, and a near-doji day
  - Both themes render correctly with full chrome adaptation (background, title, axis
    labels, grid, plotBand tint) while data colors stay pixel-identical between light
    and dark
  - Annotation values (pullback size, move size, move date) are computed from the
    data itself rather than hard-coded, so the callouts stay accurate if the data
    changes
  weaknesses:
  - 'Header block is missing the mandated ''// License: Highcharts — commercial license,
    free for non-commercial use (highcharts.com/license)'' line required by prompts/library/highcharts.md
    — add it back so the commercial-license disclosure ships with every generated
    snippet'
  - chart.plotBorderWidth/plotBorderColor draws a full four-sided box around the plot
    area in both themes; the style guide's default is an L-shaped frame (top/right
    spines removed) — drop plotBorderWidth or set it to 0 unless a fully enclosed
    frame is intentionally needed
  - 'VQ-04: hue (green vs. red) is the sole signal distinguishing bullish from bearish
    candles, with no redundant encoding for colorblind readers (e.g., outline weight
    or a small directional glyph) — this is an inherent limitation of candlestick
    charts industry-wide and matches the spec''s own guidance, so it remains a minor
    deduction rather than a rejection'
  - 'Library Mastery: the floor+body+wick construction is functionally correct and
    clever, and the new plotBands/plotLines annotations add some Highcharts-flavored
    polish, but the core mechanism is still a generic rect+line workaround rather
    than something that uniquely leverages a Highcharts-only capability — the canonical
    high-level ''candlestick'' series API isn''t available in the core-only bundle,
    capping how much distinctive credit is reachable here'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "candlestick-basic · javascript · highcharts · anyplot.ai" in bold dark ink at top-center; subtitle "Shaded band: largest pullback (-$4.10) · Dashed line: largest single-day move (-$2.00 on Jan 18)" in lighter dark-gray beneath it; x-axis title "Trading Date" and y-axis title "Share Price (USD)" in medium-dark ink; date tick labels (Jan 3 … Feb 12) and price tick labels (123–138) in softer dark gray; subtle horizontal gridlines at low opacity; a thin four-sided plot border in a matching subtle tone; a pale rose-tinted vertical band spans roughly Jan 12–18 marking the largest pullback, with a black dash-dot vertical line near its right edge marking the largest single-day move; legend ("Bullish (Close ≥ Open)" / "Bearish (Close < Open)") centered below the x-axis title with green/red circular swatches. All chrome text is clearly legible against the light background.
      Data: 30 candlesticks over Jan 2 – Feb 12, 2024 (weekdays only). Bullish candles render in brand green (#009E73), bearish candles in matte red (#AE3030). Wicks are thin lines in the matching color, clearly thinner than the candle bodies. A near-doji (very thin cross-shaped body) appears around Jan 25. Overall price trend moves from ~$128 up to ~$134 with a visible dip to ~$124 around Jan 18–19, which sits inside the annotated pullback band.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Same title, subtitle, axis titles, and legend now rendered in light/off-white ink; tick labels in a lighter secondary gray; gridlines and the plot border remain subtle at low opacity against the dark surface; the pullback band renders as a dark maroon tint and the dashed move-line renders in light-gray, both still clearly visible on the dark surface. No title/subtitle/label/tick text is dark-on-dark — all chrome flipped correctly to light-on-dark.
      Data: Candle colors are pixel-identical to the light render — same brand green (#009E73) for bullish and matte red (#AE3030) for bearish — confirming only chrome (not data color) changed between themes. Wick-to-body thickness ratio, candle placement, and annotation positions are unchanged.
      Legibility verdict: PASS
