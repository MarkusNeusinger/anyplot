review:
  strengths:
  - 'Correct semantic color mapping: brand green (#009E73) for bullish and matte red
    (#AE3030) for bearish, matching the Imprint palette''s documented finance semantic
    exception'
  - Data shows both bullish and bearish candles with varied body/wick sizes, plus
    a clear downtrend-then-recovery arc across the 30 trading days
  - Wicks are visibly thinner than candle bodies and remain legible against both themes
  - Clean, idiomatic ECharts candlestick series usage via itemStyle color/color0/borderColor/borderColor0
  - Theme-adaptive chrome correctly threaded through title, axis labels, tick labels,
    and grid — both renders pass the light/dark legibility check
  - Deterministic LCG-based data generation appropriate for a browser environment
    with no seeded RNG
  - Title format exactly matches the mandated `candlestick-basic · javascript · echarts
    · anyplot.ai` pattern
  weaknesses:
  - X-axis date tick labels ('1/2', '1/3', ...) become visually cramped and hard to
    distinguish when the PNG is scaled down to the ~400px mobile width, even though
    they are cleanly spaced at full resolution — consider a sparser tick interval
    (e.g. show every 2nd–3rd date) or a shorter date format for the mobile srcset
  - 'Design Excellence is only at the ''well-configured default'' tier: aside from
    the mandated green/red finance convention, there is no additional visual hierarchy,
    emphasis, or annotation (e.g. a moving-average markLine) that would elevate the
    story beyond a plain OHLC series'
  - No dataZoom, markLine, or markPoint used — the implementation is correct and idiomatic
    but doesn't showcase any ECharts feature distinctive from what a generic candlestick
    renderer would produce
  - No legend/annotation clarifies the green=up / red=down convention for a first-time
    viewer, though this is a widely recognized financial-chart convention so the omission
    is minor
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "candlestick-basic · javascript · echarts · anyplot.ai" bold and centered at top in dark ink; "Price (USD)" axis name top-left in soft gray; Y-axis tick labels ($144-$162) and X-axis date tick labels (1/2 through 2/12) all rendered in legible soft-gray text; subtle horizontal gridlines only, no vertical gridlines.
      Data: 30 candlesticks spanning roughly $144-$161. First-series green matches #009E73 (bullish/up days), red matches the Imprint matte-red semantic anchor #AE3030 (bearish/down days) — colors are identical between light and dark renders. Wicks are clearly thinner than candle bodies. The series shows a mixed early period, a clear dip from 1/16-1/19, and a steady recovery/uptrend through 2/12, giving genuine bullish/bearish variety.
      Legibility verdict: PASS — all title, axis, and tick text is clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Title, axis name, and tick labels all flip to light-colored text (white/light-gray) and remain fully legible; gridlines remain subtle; no dark-on-dark or unreadable elements found.
      Data: Candle colors are pixel-identical to the light render — same brand green and matte red, confirming only chrome (not data colors) adapts to theme.
      Legibility verdict: PASS — no dark-on-dark failures; all text and data elements are clearly distinguishable from the near-black background.
