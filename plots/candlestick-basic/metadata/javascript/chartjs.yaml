review:
  strengths:
  - 'Fixed the prior VQ-04 finding by adding a redundant shape cue: bearish candle
    bodies now get a 1px ink outline while bullish bodies have none, so direction
    no longer relies on hue alone for CVD viewers.'
  - Added a 5-session moving-average overlay (dashed line dataset) that gives the
    chart clear trend context and visual hierarchy beyond raw candles.
  - 'Added a custom Chart.js plugin (beforeDatasetsDraw/afterDatasetsDraw) that highlights
    the single widest daily range with a muted band, connector line, and amber marker
    labeled ''Widest range: $6.08'' - turns the previously ''incidental'' price arc
    into intentional, guided storytelling.'
  - 'Retains the clean, spec-compliant floating-bar-overlay technique (thin wick +
    wide body via grouped: false) using only core Chart.js features, plus correct
    semantic color mapping (bullish #009E73, bearish Imprint red anchor) and theme-adaptive
    chrome.'
  - Data generation, reproducibility (seeded LCG), title/legend format, and all spec/data-quality
    criteria remain solid and correct.
  weaknesses:
  - Annotation text uses a hardcoded '13px sans-serif' font instead of a token-driven
    size, slightly inconsistent with the explicit font-size system used elsewhere
    (title 22 / legend 16 / ticks 14) - cosmetic only.
  - The legend still shows only color swatches and doesn't hint at the new outline
    cue on bearish bodies, so a legend-only reader may not immediately notice why
    bearish candles look outlined.
  - Design Excellence is strong but still single-layered (one annotation + one MA
    overlay); an additional refinement (e.g. a muted volume subplot or shaded macro
    up/down phases) could push DE-03 closer to the ceiling.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 - not pure white, not dark.
      Chrome: Title "candlestick-basic · javascript · chartjs · anyplot.ai" in bold dark ink, fully visible, not clipped at top. Custom legend below the title with green "Bullish (close >= open)", red "Bearish (close < open)", and a dashed gray "5-session avg" swatch - all legible. Y-axis "Price (USD)" title and $139-$157 tick labels in soft dark ink, fully visible with no leftmost-digit clipping. X-axis "Date" title and 45-degree-rotated tick labels (Jan 2 ... Feb 5) are readable and don't overlap each other or the axis title. Subtle horizontal gridlines only (x grid disabled). A muted gray vertical band with an amber marker and "Widest range: $6.08" annotation sits over the single widest-range session without overlapping any other element.
      Data: 26 candlesticks with thin wicks and wider bodies. Bullish bodies are #009E73 green with no border; bearish bodies are the Imprint semantic red with a thin dark ink outline (redundant shape cue). A dashed 5-session moving-average line tracks the trend. Wicks are clearly thinner than bodies and both are clearly visible against the background.
      Legibility verdict: PASS - all text is dark-on-light and clearly readable, no overlap, no edge clipping observed.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 - not pure black, not light.
      Chrome: Same title, legend, axis titles/ticks, and annotation as the light render but rendered in light/white text - all clearly legible against the dark background, no dark-on-dark failures observed. Gridlines remain subtle but visible. The amber annotation marker and connector line are still clearly visible on the dark surface.
      Data: Candle colors and the bearish-outline cue are visually identical to the light render (#009E73 bullish, Imprint semantic red bearish with dark outline) - only chrome (background, text, grid, band shading) flipped as required. The moving-average dashed line switches to a lighter tone for contrast against the dark background, as expected from theme tokens.
      Legibility verdict: PASS - all text is light-on-dark and clearly readable, no dark-on-dark issues, data colors match the light render exactly.
