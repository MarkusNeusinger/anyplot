review:
  strengths:
  - 'Clever, spec-compliant workaround for Chart.js''s missing candlestick type: two
    overlaid floating-bar datasets (thin wick, wider body) on the same category axis
    via grouped: false, using only core Chart.js bar-chart features as the library
    rules require.'
  - 'Correct semantic color mapping per the style guide''s finance exception: bullish
    uses Imprint position 1 (#009E73), bearish uses the matte-red semantic anchor
    (#AE3030, position 5) rather than an arbitrary color.'
  - Custom legend via generateLabels clearly explains 'Bullish (close >= open)' /
    'Bearish (close < open)', and the tooltip is filtered to the Body dataset only
    with a formatted O/H/L/C readout, avoiding duplicate wick+body entries.
  - Data realistically shows both bullish and bearish candles with varying wick lengths
    and body sizes, a weekday-only trading calendar, and deterministic LCG-seeded
    generation for reproducibility.
  - Theme tokens are threaded correctly through title, legend, ticks, axis titles,
    and grid; data colors are identical between light and dark renders while chrome
    flips correctly.
  - Explicit font sizes throughout (title 22, legend 16, axis titles 16, ticks 14);
    x-axis labels rotated 45 degrees with autoSkip/maxTicksLimit to avoid crowding
    across 26 data points.
  weaknesses:
  - 'Data storytelling is incidental rather than intentional: the random-walk price
    series happens to trend up then down, but nothing in the chart emphasizes a specific
    insight or notable move (e.g. the largest single-day range around Jan 20-21).
    A subtle annotation or muted background band around the most significant move
    would lift this from ''default'' to ''guided''.'
  - Candle direction relies solely on the bullish/bearish hue with no redundant encoding
    (shape, pattern, texture) - an inherent limitation of candlestick charts, but
    worth a minor VQ-04 deduction since this implementation is otherwise close to
    the top threshold.
  - 'Aesthetic polish is strong but stops short of publication-ready: no additional
    refined touches (e.g. subtle volume bars, a moving-average overlay, or shaded
    background zones marking the broad up/down phases) that would elevate Design Excellence
    further.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 - not pure white.
      Chrome: Title "candlestick-basic · javascript · chartjs · anyplot.ai" in dark ink, clearly readable and not clipped at top. Custom legend below title with green "Bullish (close >= open)" and red "Bearish (close < open)" swatches, both legible. Y-axis "Price (USD)" and tick labels ($139-$157) in soft dark ink, fully visible with no leftmost-digit clipping. X-axis "Date" title and rotated 45-degree tick labels (Jan 2 ... Feb 5) readable, not overlapping each other or the axis title. Subtle horizontal gridlines only (x-axis grid disabled).
      Data: 26 candlesticks with thin wicks and wider bodies. First (brand) color is #009E73 green for bullish candles, #AE3030 matte red for bearish candles - correct Imprint semantic mapping for finance. Wicks clearly thinner than bodies and both clearly visible against the background.
      Legibility verdict: PASS - all text is dark-on-light and clearly readable, no overlap, no edge clipping observed.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 - not pure black.
      Chrome: Same title, legend, and axis chrome as the light render but rendered in light/white text - all clearly legible against the dark background, no dark-on-dark failures observed. Gridlines are subtle but visible.
      Data: Candle colors are visually identical to the light render (green #009E73 bullish, red #AE3030 bearish) - only the chrome (background, text, grid) flipped as required.
      Legibility verdict: PASS - all text is light-on-dark and clearly readable, no dark-on-dark issues, data colors match the light render exactly.
