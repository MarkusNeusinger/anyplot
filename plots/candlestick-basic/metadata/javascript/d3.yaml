review:
  strengths:
  - 'Correct candlestick anatomy: 2px wicks clearly thinner than the ~49px candle
    bodies, matching the spec''s ''wicks thinner than body'' requirement exactly'
  - 'Imprint semantic color usage is textbook-correct: brand green (palette[0], #009E73)
    for bullish and the dedicated matte-red semantic anchor (palette[4], #AE3030)
    for bearish, per the canonical palette''s documented semantic exception'
  - Deterministic fixed-seed LCG produces a coherent, realistic 40-day price walk
    (spec calls for 20-100 periods) without any external RNG dependency
  - X-axis tick thinning (every 4th day) plus -30deg rotation keeps 40 date labels
    legible without crowding or overlap
  - 'Both renders are theme-correct: identical data colors in light/dark, only chrome
    (background, text, grid) flips, backgrounds match #FAF8F1 / #1A1A17'
  weaknesses:
  - No data storytelling beyond raw OHLC encoding — no annotation or emphasis calls
    out the largest single-day move or the overall Sep 13 peak / Sep 21 trough trend,
    so the chart reads as a data dump rather than a guided narrative
  - Bull/bear signal relies solely on hue (green vs red) with no secondary cue (texture,
    opacity, or label); this is an accepted industry convention for candlestick charts
    but is worth a defensive note for full CVD safety
  - A small lcg() helper function is defined for reproducibility — a reasonable necessity
    given D3 has no seeded RNG, but it's a minor departure from the strict CQ-01 'no
    functions/classes' ideal
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "candlestick-basic · javascript · d3 · anyplot.ai" is bold dark text, clearly readable at top-center. Legend ("Bullish (close >= open)" / "Bearish (close < open)") top-left with matching color swatches. Y-axis labeled "Share Price (USD)" with $-prefixed tick labels ($175-$190). X-axis labeled "Trading Date" with rotated "Sep 01"..."Oct 09" date ticks. Subtle horizontal gridlines at each y-tick. All text renders in dark ink against the light background.
      Data: 40 daily OHLC candles, bodies colored brand green (#009E73, bullish) or matte red (#AE3030, bearish), thin wicks in the same color extending to each day's high/low. Price walks from ~$181 up to a ~$191 peak around Sep 13, back down to a ~$178 trough around Sep 21, then oscillates ~$182-186 through early October.
      Legibility verdict: PASS — all title, axis, tick, and legend text is clearly legible against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Same title, legend, and axis labels now rendered in light/off-white text, clearly visible against the dark background. Gridlines remain subtle but visible. Axis domain lines and tick marks are legible.
      Data: Same 40 candles with identical bullish-green (#009E73) and bearish-red (#AE3030) coloring as the light render — confirmed only chrome (background/text/grid) flips between themes, data colors are unchanged.
      Legibility verdict: PASS — no dark-on-dark failures; all text (title, legend, axis labels, tick labels) is clearly legible against the near-black background.
