review:
  strengths:
  - Correct candlestick composition using useXScale/useYScale against ChartContainer
    — the documented MUI X community pattern for chart types with no native series
    type, since @mui/x-charts has no built-in candlestick.
  - 'Complete OHLC representation: wicks rendered thinner than bodies, both bullish
    and bearish candles present with realistic hour-to-hour BTC/USD variation and
    a readable overall price arc.'
  - Palette applies the style guide's documented finance semantic exception correctly
    — bullish uses brand green (#009E73, position 1), bearish uses matte red (#AE3030,
    position 5, the deferred semantic-red anchor) — identical data colors across both
    themes, chrome fully theme-correct in both renders.
  - Axis labels are descriptive with units ("Time (Hourly)", "Price (USD)"), tick
    density is thinned to every 4th hour to avoid crowding, and the title correctly
    follows the mandated format with dynamic fontsize scaling for the long anyplot
    title string.
  - Clean, deterministic code (seeded LCG PRNG, no fetch/Math.random), correct harness
    contract (default export, skipAnimation, sized from window.ANYPLOT_SIZE).
  weaknesses:
  - 'Design excellence reads as competent-but-conventional: no deliberate visual hierarchy
    or focal point (e.g. calling out the largest single-hour move or the intraday
    low) — the chart displays the data without emphasizing an insight.'
  - Bullish/bearish are distinguished by hue alone (green vs. matte red) with no redundant
    encoding. Consider the style guide's 'Optional outline pattern' (thin ink-color
    stroke on the low-contrast half) or a subtle secondary cue for stronger colorblind-safety
    on this two-category signal.
  - 'Visual refinement is subtle-default rather than distinctive: grid and axis-line
    opacity are toned down appropriately, but nothing (whitespace rhythm, axis-line
    treatment, legend framing) pushes the polish past ''good default'' into publication-grade
    territory.'
  - Legend is a plain centered swatch row — functional and correctly labeled, but
    a generic pattern rather than a design choice that reinforces the chart's story.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "Bitcoin Hourly Price · candlestick-basic · javascript · muix · anyplot.ai" is centered at top in dark ink, clearly legible. X-axis shows "Time (Hourly)" with tick labels (Jan 8, 04:00, 08:00, 12:00, 16:00, 20:00, Jan 9) every 4 hours, no overlap. Y-axis shows "Price (USD)" with dollar-formatted gridline labels ($41,650–$42,500). Subtle horizontal gridlines visible but not competing with data. Legend below the chart with two color swatches: "Bullish (close ≥ open)" and "Bearish (close < open)".
      Data: 48 hourly candlesticks spanning Jan 8–9. Bullish candles are brand green (#009E73), bearish candles are matte red (#AE3030). Wicks are visibly thinner than the candle bodies. Price traces a clear down-then-up arc across the 48-hour window.
      Legibility verdict: PASS — all text (title, axis labels, tick labels, legend) is clearly readable against the light background.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title, axis labels, and legend as the light render, now rendered in light ink/off-white text, fully legible against the dark background. Gridlines are subtle light horizontal lines. No dark-on-dark text anywhere — title, tick labels, axis labels, and legend text all read clearly.
      Data: Candle colors are pixel-identical to the light render — bullish green (#009E73), bearish matte red (#AE3030) — confirming only chrome flipped between themes, not data colors.
      Legibility verdict: PASS — no legibility failures in either theme; brand green and matte red both remain clearly visible against the dark surface.
