review:
  strengths:
  - Candles drawn as a custom SVG layer inside ChartsContainer via useXScale/useYScale,
    so bodies and wicks sit exactly at their OHLC values on MUI X's own axes
  - Wicks (1.6 px) clearly visible yet much thinner than the ~64% band-width bodies;
    dojis keep a 2 px minimum body so every period stays a distinct candle
  - Hourly time axis labels the date at midnight and HH:MM elsewhere, thinned with
    tickLabelInterval; price axis padded from the data, not forced to zero
  - 'Imprint green #009E73 for bullish and Imprint red for bearish, identical in both
    themes, with theme tokens on all chrome'
  - Restrained dashed horizontal-only grid and a faint ink outline on bodies give
    crisp, readable candles
  weaknesses:
  - 'DQ-03 (both): the synthetic prices (41,707–42,482) are labelled as real BTC/USD
    on Jan 8–9, 2024, when BTC actually traded roughly 44,000–47,000 → keep the levels
    consistent with the stated real dates (start near 44,000+) or drop the year/real-date
    anchor (about +2,000 to +5,000 $ shift). Likely cause: `price = 42000` and `Date.UTC(2024,
    0, 8)` in the data block.'
  - 'Suggestion: the subtitle''s period count and price range repeat what the axes
    already show; a shorter subtitle (or none) would put more weight on the candles.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole 3200x1800 canvas.
      Chrome: bold dark title "candlestick-basic · javascript · muix · anyplot.ai" centered at top, inkSoft subtitle "48 periods (Jan 8 – Jan 9, 2024) · Range 41,707–42,482", legend row with green "Bullish (close ≥ open, n=26)" and red "Bearish (close < open, n=22)" swatches. Y-axis "BTC/USD price ($)" with ticks 41,700–42,500; x-axis "Timestamp (UTC)" with labels Jan 8, 04:00 … 20:00, Jan 9, 04:00 … 20:00. Dashed subtle horizontal grid. Left and bottom axis lines only. All readable.
      Data: 48 hourly candles; bullish bodies/wicks in #009E73, bearish in Imprint red; thin wicks through body centers, faint outline on bodies, dojis as thin bars. Dip to ~41,700 around 12:00 Jan 8, then a climb to ~42,400.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, subtitle, legend text, tick and axis labels all light on dark; grid dashes subtle but visible; no dark-on-dark text.
      Data: candle colors identical to the light render (#009E73 green, Imprint red); brand green reads well.
      Legibility verdict: PASS
