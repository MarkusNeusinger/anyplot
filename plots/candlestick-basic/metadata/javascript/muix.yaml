review:
  strengths:
  - OHLC candlesticks are hand-drawn against the shared band/linear scales via useXScale/useYScale
    — the documented ChartContainer composition pattern for chart types outside the
    MUI X community series surface, correctly worked around the lack of a native candlestick
    series.
  - Wicks are visibly thinner (strokeWidth 1.5) than the candle bodies (62% of band
    width), matching the spec's legibility note.
  - Session-high and session-low callouts (dashed reference lines + circle markers
    + labels) give the chart a deliberate focal point instead of a flat, uniform OHLC
    run — strong data storytelling.
  - Data colors (brand green for bullish, red for bearish) are pixel-identical between
    the light and dark renders; only chrome (background, grid, text) adapts per theme,
    exactly as required.
  - Date-label formatting switches between a date format at midnight and a time format
    for other hours, matching the spec's 'appropriate date formatting based on frequency'
    requirement.
  - Deterministic in-memory data generation via a small fixed-seed LCG, no fetch/network
    calls.
  - Title follows the exact mandated format with a sensible descriptive prefix, and
    shrinks its font size proportionally for the longer combined string so it doesn't
    overflow.
  weaknesses:
  - 'The file header is duplicated and inconsistent: lines 1-4 are a stale header
    block ("Library: muix 7.29.1 | JavaScript 22.23.2", "Quality: 88/100") immediately
    followed by a second, different header block on lines 6-10 ("Library: MUI X Charts
    | React | Node 22", "Quality: pending"), with the //# anyplot-orientation directive
    sandwiched between them on line 5 instead of on the very first line as the muix
    header-style rule requires. Remove the stale first block entirely and put //#
    anyplot-orientation: landscape back on line 1.'
  - Bullish vs. bearish candles are distinguished by color alone (green vs. red fill);
    a colorblind viewer without hue discrimination has no secondary cue (e.g. hollow
    vs. filled body, or a directional icon) to tell the two apart beyond the body
    outline, which is applied uniformly to both.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (~#FAF8F1), not pure white, not dark.
      Chrome: Title "Bitcoin Hourly Price · candlestick-basic · javascript · muix · anyplot.ai" in dark ink, centered; subtitle "Jan 8 – Jan 9, 2024 · Hourly candles" in soft gray below it. X-axis "Time (Hourly)" and Y-axis "Price (USD)" labels are dark and clearly legible; tick labels ($41,700–$42,500, hourly time stamps) are readable soft-gray text against the cream background. Subtle horizontal gridlines are visible but do not dominate. Legend at the bottom uses two pill-shaped badges ("Bullish (close ≥ open)", "Bearish (close < open)") with a light border and elevated background, text clearly readable.
      Data: 48 hourly OHLC candlesticks in brand green (bullish) and matte red (bearish), each with a thin wick and a wider body outlined with a subtle ink stroke. Dashed reference lines with open-circle markers and bold labels call out the Session High ($42,482) and Session Low ($41,707), both fully legible and not overlapping any candle or axis text.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black (~#1A1A17), not pure black, not light.
      Chrome: Same title and subtitle, now rendered in white/light-gray text, clearly legible against the dark background. Axis titles and tick labels are light gray/white and easily readable. Gridlines are subtle but visible. Legend badges use a lighter/elevated dark background with light-gray text — no dark-on-dark text was found anywhere in the render.
      Data: Candle body and wick colors (brand green / red) are identical to the light render — only the chrome (background, text, grid, legend frame) flips. Session High/Low callout lines, circle markers, and labels remain crisp and legible against the dark surface.
      Legibility verdict: PASS
