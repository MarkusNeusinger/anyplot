review:
  strengths:
  - Custom candlestick layer drawn on MUI X's own band and linear scales via useXScale/useYScale
    inside ChartsContainer — the idiomatic community-tier route to a series type MUI
    X does not ship
  - 'Semantic finance colors: bullish brand green #009E73 and bearish matte red #AE3030,
    identical in both themes, with theme-adaptive chrome throughout'
  - Wicks at 1.6 px through the body centre, bodies at 64% of the band with a faint
    ink outline — every one of the 48 candles stays distinct
  - 'Time axis tuned to the hourly frequency: hour labels every 4 h with the day name
    at midnight, and a price axis padded 8% around the low/high range instead of forced
    to zero'
  - Seeded data generation guarantees valid OHLC relations (high ≥ max(open, close),
    low ≤ min(open, close))
  weaknesses:
  - 'VQ-06 (both): the y-axis is titled ''BTC/USD close ($)'' but carries open, high,
    low and close prices → a price title such as ''BTC/USD price ($)''. Likely cause:
    yAxis label set to the CLOSE column constant.'
  - 'Suggestion: use MUI X''s own ChartsLegend (via a custom legend slot) instead
    of the hand-built HTML legend row so the legend follows the library''s styling.'
  - 'Suggestion: the ~50 px empty band between the header and the plot could be tightened
    to give the candles more height.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the full canvas.
      Chrome: bold dark title "candlestick-basic · javascript · muix · anyplot.ai" centred top, grey subtitle "48 periods (Jan 8 – Jan 9, 2024) · Range 41,707–42,482", legend row with green "Bullish (close ≥ open, n=26)" and red "Bearish (close < open, n=22)" swatches; y-axis "BTC/USD close ($)" with ticks 41,700–42,500, x-axis "Timestamp (UTC)" with labels Jan 8, 04:00 … 20:00, Jan 9, … 20:00; dashed faint horizontal grid. All dark text clearly readable.
      Data: 48 hourly candles; bullish bodies/wicks brand green #009E73, bearish matte red #AE3030; thin wicks through body centres, a few doji-thin bodies; dip to ~41,700 around 13:00 on Jan 8 then a climb to ~42,400.
