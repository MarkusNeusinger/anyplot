review:
  strengths:
  - 'Clean ggplot2 grammar for the candles: geom_segment wicks under geom_rect bodies,
    with scale_color_manual and scale_fill_manual keyed on the same direction factor
    and show.legend = FALSE on the wicks so the legend shows one swatch per direction'
  - 'Bullish candles in brand green #009E73 and bearish in matte red #AE3030, identical
    in both themes, with every chrome element (title, ticks, axis line, grid at INK
    15 %, frameless elevated legend) threaded through theme tokens'
  - Price axis formatted with scales::label_dollar(accuracy = 0.01) and fitted to
    the lows and highs with expansion(); weekend gaps removed by plotting on a trading-day
    index with weekly date breaks
  - 'Basic variant respected: only bodies, wicks and a subtle y-only grid, every candle
    at its data values'
  weaknesses:
  - 'DQ-03 (code): the data comment reads "40 trading days, Jan–Mar 2024", but the
    40 trading days run from Jan 02 to Feb 27, as the x axis shows → "Jan–Feb 2024".
    Likely cause: the comment above all_dates, written for the 60-calendar-day window
    instead of the 40 trading days kept.'
  - 'Suggestion: the x tick labels are short ("Jan 02") and fit horizontally; the
    40° rotation could be dropped.'
  - 'Suggestion: the data block could follow the column-constant and tibble pattern
    of the library prompt so the file adapts to a user''s OHLC table.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, not pure white.
      Chrome: title "NovaTech Corp (NVTK) · candlestick-basic · r · ggplot2 · anyplot.ai" in dark ink at ~70 % of the width; y-axis title "Price (USD)"; $-formatted y ticks $150.00–$165.00; x ticks Jan 02 … Feb 20 every five trading days, rotated 40°; frameless legend (Bullish/Bearish swatches) on the elevated fill, top centre; y-only grid in INK at 15 %, subtle; left and bottom axis lines. All text readable.
      Data: 40 candles, green #009E73 for close above open, red #AE3030 for close below; thin wicks through the body centres, bodies clearly wider and separated; prices rise from ~$148 to ~$165. No trend or reference lines.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17, not pure black.
