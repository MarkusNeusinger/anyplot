review:
  strengths:
  - Real Unicode chess symbols with a black outline glyph layered over white pieces,
    so white pieces keep a contour on light squares
  - 'Correct orientation: white at the bottom, h1 a light square, files a-h and ranks
    1-8 at the board rim'
  - Theme tokens thread through all chrome; board and piece colors identical across
    light and dark
  - Square 2400x2400 canvas with the board flush to its coordinate rim (expand = c(0,
    0), coord_fixed limits)
  - 'Tidy, idiomatic ggplot2: scale_color_identity for precomputed ink, .data pronoun,
    column constants and a df data block'
  weaknesses:
  - 'VQ-03, SC-02 (both): the white bishops on c1 and f1 render with a solid black
    mitre carrying a square-colored cross, and the white king on e1 shows the brown
    square color through its crown lobes and band, so white pieces read partly black
    or hollow (C3: white pieces told apart from black pieces) → every white piece
    filled white inside a dark contour. Likely cause: overlaying the outline glyph
    (U+2654-2659) on the solid glyph (U+265A-265F) in DejaVu Sans, whose interior
    strokes do not coincide; draw the white piece as the outline glyph over a white-filled
    backing of the same glyph (e.g. the outline glyph with a thick white stroke) instead
    of the solid glyph.'
  - 'Suggestion: the unused set.seed(42) could go, since the position is deterministic.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 around a square 8x8 board.
      Chrome: bold dark title "chessboard-pieces · r · ggplot2 · anyplot.ai" centered on top; rank numbers 1-8 at left and file letters a-h below in soft dark grey, all readable.
      Data: wood-tone board (cream #F0D9B5 / brown #A8794F), h1 light, a1 dark; starting position in Unicode chess glyphs. Black pieces solid near-black; white pieces white with a black outline. White bishops on c1/f1 show a black mitre with a square-colored cross, and the white king's crown lobes show the brown square through them. No Imprint categorical series.
