review:
  strengths:
  - Board built from two native layers, geom_tile for the 64 squares and geom_text
    for the Unicode glyphs, with coord_fixed(ratio=1) keeping every square square
  - 'Standard orientation in both renders: a1 dark, h1 light, white at the bottom,
    files a-h along the bottom rim and ranks 1-8 along the left rim via scale breaks/labels'
  - Every piece of the Scholar's Mate position sits centered on its named square;
    filled (black) and outline (white) glyphs are told apart on light and dark squares
    in both themes
  - Chrome threads theme tokens (PAGE_BG, INK, INK_SOFT) while the board colors stay
    identical across themes; the whole 2400x2400 canvas is painted in the page color
  - 'Column constants and a single # Data block make the position replaceable without
    touching the plot code; HTML export keeps the interactive lets-plot output'
  weaknesses:
  - 'Suggestion: the glyphs fill only about a third of each square (geom_text size=14);
    a size around 20 would give the pieces more presence while keeping the inset the
    Notes ask for.'
  - 'Suggestion: drawing the piece glyphs in near-black (#1A1A17) instead of the default
    gray would sharpen the outline pieces on the dark squares.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the full 2400x2400 canvas, no transparent edge strips
      Chrome: bold title "chessboard-pieces · python · letsplot · anyplot.ai" in INK at the top, ~56% of the width; bold INK_SOFT file letters a-h directly below the board and rank numbers 1-8 directly left of it, all readable; a thin dark-gray line runs along the board's own edge, no empty band
      Data: 8x8 board in #F0D9B5 / #B58863 with thin brown square outlines, a1 dark and h1 light, filling most of the canvas; 34 Unicode pieces of the Scholar's Mate position (white Qf7, Bc4, e4; black e5, Nf6) centered on their squares, black pieces filled, white pieces outlined, both in the default dark gray. No Imprint series apply (board colors are domain colors)
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17 across the full canvas
      Chrome: title in light INK #F0EFE8, coordinates in INK_SOFT #B8B7B0, all clearly readable; no dark-on-dark text
      Data: board and piece colors identical to the light render; only chrome flipped
      Legibility verdict: PASS
