review:
  strengths:
  - Board built from two native layers, geom_tile for the 64 squares and geom_text
    for the Unicode glyphs, with coord_fixed(ratio=1) keeping every square square
  - 'Standard orientation in both renders: a1 dark, h1 light, white at the bottom,
    files a-h along the bottom and ranks 1-8 on the left via scale breaks/labels'
  - Every piece of the Scholar's Mate position sits centered on its named square;
    filled (black) and outline (white) glyphs are told apart on light and dark squares
    in both themes
  - Chrome threads theme tokens (PAGE_BG, INK, INK_SOFT) while the board colors stay
    identical across themes; canonical 2400x2400 canvas
  - 'Column constants and a single # Data block make the position replaceable without
    touching the plot code; HTML export keeps the interactive lets-plot output'
  weaknesses:
  - 'VQ-05 (both): a gray (#474747) rectangle frames the expanded panel about half
    a square outside the board, boxing an empty band and separating the a-h / 1-8
    labels from the board''s rim → no frame, and the board edge flush with the panel
    so the coordinates sit at the rim. Likely cause: the continuous scales'' default
    expand plus the panel border that theme() leaves on; set expand=[0, 0] on both
    scales and panel_border=element_blank().'
  - 'Suggestion: the glyphs fill only about a third of each square (geom_text size=14);
    a larger size such as 20-22 would give the pieces more presence while keeping
    the inset the Notes ask for.'
  - 'Suggestion: drawing the piece glyphs in INK-independent near-black (#1A1A17)
    instead of the default gray would sharpen the outline pieces on the dark squares.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 (sampled), 2400x2400 canvas; lets-plot leaves ~30 px transparent strips at the left and right edges (coord_fixed letterboxing)
      Chrome: bold title "chessboard-pieces · python · letsplot · anyplot.ai" in INK at the top, ~56% of the width; bold INK_SOFT file letters a-h below and rank numbers 1-8 at the left, all readable; a thin gray frame surrounds the panel with an empty band between it and the board
      Data: 8x8 board in #F0D9B5 / #B58863 with a thin brown square outline, a1 dark and h1 light; 34 Unicode pieces of the Scholar's Mate position (white Qf7, Bc4, e4; black e5, Nf6) centered on their squares, black pieces filled, white pieces outlined, both in the default dark gray. No Imprint series apply (board colors are domain colors)
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17 (sampled), same transparent edge strips
      Chrome: title in light INK #F0EFE8, labels in INK_SOFT #B8B7B0, all clearly readable; no dark-on-dark text; the panel frame is the same gray and reads faintly
      Data: board and piece colors identical to the light render; only chrome flipped
      Legibility verdict: PASS
