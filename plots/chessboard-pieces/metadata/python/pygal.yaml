review:
  strengths:
  - Piece bodies in cream vs near-black, each with a contrasting outline, keep white
    and black pieces visible on both square colors in both themes
  - Board squares re-tuned per theme (wood tones in light, umber in dark) while the
    page background and coordinate labels follow the theme tokens
  - 'Correct orientation: h1 light square, white at the bottom, files a-h left to
    right and ranks 1-8 bottom to top'
  - Pieces centered at 70 % of the square size, a clean inset from the square edges
  - Tidy df with Square/Piece columns makes the position easy to swap for the user's
    own
  weaknesses:
  - 'VQ-03, SC-02 (both): the solid body glyph and the hollow outline glyph stacked
    on each square do not register: every piece shows a doubled edge offset by a few
    px, the white bishops on c1/f1 show a dark-filled head and the white queen on
    d1 shows the square color through her crown, so those white pieces read half-black
    (spec bullet C3) → one glyph per piece whose body and outline match, e.g. the
    solid glyph filled in the side''s color with a contrasting SVG stroke. Likely
    cause: the `layers` tuple drawing PIECE_UNICODE[piece.lower()] under PIECE_UNICODE[piece.upper()].'
  - 'VQ-05 (both): the board sits high on the canvas: about 145 px between the title
    and the board, but about 290 px of empty canvas below the file labels → center
    the board-plus-labels block under the title (about +70 px on the board''s y offset).
    Likely cause: the fixed MARGIN_Y = 220.'
  - 'Suggestion: a well-known position (a mating pattern or an opening tabiya) would
    give the diagram a focal point.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, correct.
      Chrome: title "chessboard-pieces · python · pygal · anyplot.ai" in dark ink at the top center; rank numbers 1-8 left of the board and file letters a-h below it in muted gray. All readable.
      Data: 8x8 board of cream (#E8D5C4) and tan (#B5956F) squares, h1 light, white at the bottom. Starting position: black pieces solid near-black on ranks 7-8, white pieces cream with a dark outline on ranks 1-2. The two glyph layers are slightly offset (doubled edges); the white bishops c1/f1 have dark heads and the white queen's crown is hollow. No palette series (domain colors only).
      Legibility verdict: PASS

    Dark render (plot-dark.png):
