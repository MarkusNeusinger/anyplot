      Data: board squares flip to umber (#4A4136) and dark brown (#2D2622). Black pieces now carry a cream outline over a near-black body, white pieces a cream body with outline; both sides visible on every square and distinguishable by body fill. Same layer offset and half-dark white bishops as in light.
      Legibility verdict: PASS
