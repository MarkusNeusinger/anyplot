review:
  strengths:
  - 'Vectorised board: squares and pieces are rect/text glyphs fed from ColumnDataSource,
    colour and symbol mapped from columns'
  - Solid glyph filled white overlaid with the outline glyph in ink gives white pieces
    a crisp rim on light squares in both themes
  - Correct Scholar's Mate final position with h1 light, white at the bottom, coordinates
    outside the board rim
  - Theme tokens thread through title, coordinates and frame; board and piece colours
    identical in both renders
  weaknesses:
  - 'VQ-03 (both): the white bishops on c1 and c4 render with a solid dark mitre under
    the white ball and base, so they read half-black at a glance → a white-filled
    mitre like the other white pieces. Likely cause: the outline glyph U+2657 in the
    fallback font fills its mitre, drawn in #1A1A17 over the white solid glyph; set
    text_font to a font whose U+2654-2659 are true outlines (e.g. DejaVu Sans).'
  - 'CQ-04 (code): IMPRINT_PALETTE (line 26) is defined and never used → delete it.
    Likely cause: template constant left in after the board took chess colours.'
  - 'Suggestion: add a HoverTool on the piece glyphs showing square and piece name
    for the HTML view.'
  - 'Suggestion: in the dark render a faint lighter rectangle outlines the frame area
    around the coordinates; matching the border colour exactly would remove it.'
  image_description: |-
