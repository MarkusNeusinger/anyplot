      Data: 8x8 board with #F0D9B5 light and #B58863 dark squares, a1 dark and h1 light, white at the bottom. Scholar's Mate final position: white queen on f7, bishop c4, pawn e4; black knights c6/f6, pawn e5. White pieces are white with a dark rim, black pieces solid near-black; white bishops show a dark mitre. Pieces centered and inset from square edges.
