review:
  strengths:
  - 'Correct orientation: light square at h1, white at the bottom, a at the left and
    1 at the bottom'
  - White pieces drawn as white-filled glyphs over a slightly larger black glyph,
    so they read on light and dark squares in both themes while piece colors stay
    identical across renders
  - Per-layer data= in plotnine (board tiles, white outline, white fill, black pieces)
    keeps the grammar clean
  - Square names parsed vectorized with df.assign and str accessors instead of loops
  - Lucena position applies the change request and is a legal, recognizable endgame
  weaknesses:
  - 'VQ-05 (both): the 11 pt bold title fills about 97 % of the canvas width and runs
    past the board''s right edge to within ~15 px of the canvas border → under 90
    % of the width (about -1 pt, or a shorter prefix). Likely cause: plot_title element_text(size=11,
    weight=''bold'') with the ''Lucena Position · '' prefix.'
  - 'Suggestion: a thin board border in INK_SOFT would frame the board against the
    page in the dark render.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 around the board.
      Chrome: bold dark title "Lucena Position · chessboard-pieces · python · plotnine · anyplot.ai" spanning almost the full width; bold INK_SOFT file letters a-h below and rank numbers 1-8 left; all readable.
      Data: 8x8 board in #F0D9B5 / #B58863 with a dark a1 and a light h1. White king d8, white pawn d7, white rook f1 as white glyphs with a black outline; black king g7 and black rook g2 as solid black glyphs. Pieces centered with a clear inset. Board colors are domain colors (no categorical series).
