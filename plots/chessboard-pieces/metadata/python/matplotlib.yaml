review:
  strengths:
  - 'Correct orientation: dark a1, light h1 corner, white at the bottom, coordinates
    a-h left to right and 1-8 bottom to top at the rim'
  - Unicode pieces at 34 pt fill their squares with a clear inset and read on both
    square colors; white (outline) and black (filled) are told apart at a glance
  - Theme tokens thread through all chrome (title, coordinates, board frame) while
    the board colors stay identical in both renders
  - Canonical 2400x2400 square canvas via figsize=(6, 6), dpi=400 with explicit subplots_adjust
    instead of bbox_inches='tight'
  weaknesses:
  - 'DQ-03 (both): the position labelled Scholar''s Mate after 4.Qxf7# is not that
    position: the white king stands on d1 (should be e1, -1 file), the g1 knight is
    missing, a black knight stands on b8 although it moved to c6 (three black knights
    on the board), and the f8 bishop is missing → the real position (Ke1, Ng1 added;
    b8 empty; Bf8 added). Likely cause: the position dict entries d1/b8 and the missing
    g1/f8 keys.'
  - 'VQ-05 (both): an empty band of about 170 px (7 % of the canvas height) separates
    the title from the board''s top edge while the board is pushed down → shrink the
    gap so the title sits about 40-60 px above the board (-110 px). Likely cause:
    ax.set_ylim(-0.7, 8.7) leaves 0.7 units of empty space above row 8 (vs 0.3 to
    the right).'
  - 'Suggestion: drawing the coordinate letters in INK_SOFT at a lighter weight would
    quiet the rim and keep the focus on the pieces.'
