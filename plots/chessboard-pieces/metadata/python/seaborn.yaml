review:
  strengths:
  - sns.heatmap with a two-color list cmap and square=True draws the board, with h1
    correctly a light square
  - Solid glyphs for both sides with near-white/near-black fills and a contrasting
    stroke make white and black pieces unambiguous on both square colors in both themes
  - Board and piece colors are theme-independent; only the page, title and coordinate
    labels flip
  - Square 2400x2400 canvas with the coordinates at the board rim and a well-proportioned
    title
  weaknesses:
  - 'DQ-03 (both): the position labelled as the Italian Game after 1.e4 e5 2.Nf3 Nc6
    3.Bc4 Nf6 4.Ng5 d5 5.exd5 Nxd5 is impossible: white has 3 knights (b1, f3, g5),
    black has 4 (b8, c6, d5, f6), and black''s e-pawn stands on e7 although 1...e5
    was played → remove the white knight on f3 and the black knights on b8 and f6,
    and move the black pawn from e7 to e5 (2 knights per side). Likely cause: the
    position dict keeps the start squares of pieces that later moved.'
  - 'CQ-04 (code): IMPRINT_PALETTE and ELEVATED_BG are defined but never used → delete
    both. Likely cause: template constants left in.'
  - 'Suggestion: a thin INK_SOFT frame around the board would separate the cream rim
    squares from the light page background.'
