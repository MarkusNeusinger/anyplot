review:
  strengths:
  - Classic board colours with hairline separators and a fixed DejaVu Sans glyph font,
    so all twelve symbols come from one coherent set and the black pawn no longer
    falls back to a colour emoji
  - 'Black pieces solid #1A1A1A and white pieces outlined in both themes; only the
    page and label chrome flips'
  - Shared nominal file/rank encodings with sort orders give the standard orientation,
    white at the bottom, a left and 1 at the bottom
  - Render padded (never cropped) to exactly 2400x2400 with an overshoot guard
  weaknesses:
  - 'SC-02 (both): the board colouring is inverted: a1 (bottom left) is the light
    square #F0D9B5 and h1 (bottom right) the dark #B58863, against the light-square-at-h1
    rule → a1 dark, h1 light. Likely cause: the parity test `(i + int(r)) % 2 == 1`
    assigns LIGHT_SQUARE; it should assign DARK_SQUARE (or test `== 0`).'
  - 'DQ-02 (both): the ''Scholar''s Mate Setup'' is not a reachable position: white
    has three bishops (c1, f1 and c4), no knight on g1, and the black king stands
    on e7 while e8 is empty → the f1 bishop removed (it is the one on c4), the g1
    knight restored and the black king on e8. Likely cause: the `pieces` dictionary.'
  - 'Suggestion: the board fills about 74 % of the canvas width; a slightly larger
    view would give the pieces more presence.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 around a centred 8x8 board (about 74 % of the 2400x2400 canvas)
      Chrome: title 'Scholar's Mate Setup · chessboard-pieces · python · altair · anyplot.ai' in dark ink above the board; bold rank numbers 8-1 on the left and file letters a-h below, upright and readable
      Data: squares in classic #F0D9B5 / #B58863 with hairline separators, but a1 is light and h1 dark (inverted); black pieces solid near-black glyphs, white pieces hollow outlined glyphs, all centred with an inset; position: white Bc4, Qh5, Pe4, three white bishops (c1, f1, c4), no g1 knight; black Pe5, Nf6, Ke7
      Legibility verdict: PASS

