review:
  strengths:
  - 'Position data is historically accurate: the piece dict exactly reproduces the
    real Fool''s Mate final position (32 pieces, no captures, Black queen correctly
    relocated d8→h4, White pawns correctly on f3/g4) — verified square by square against
    the known 1.f3 e5 2.g4 Qh4# game.'
  - 'Correct chess board conventions: white pieces at the bottom (ranks 1-2), light
    square on h1, and dark square on a1, matching the spec''s explicit orientation
    requirement.'
  - 'Idiomatic and rules-compliant Chart.js solution: since Chart.js has no native
    board/grid chart type, the implementation uses a hidden scatter chart purely as
    a canvas + title/theme host and draws the board via the library''s own `afterDatasetsDraw`
    plugin hook — exactly the sanctioned mechanism (no external chartjs-chart-* plugin,
    no borrowed library).'
  - 'Well-reasoned, explicitly documented departure from the Imprint categorical palette
    for piece color: chess armies are drawn with a fixed black/white identity (using
    the INK / dark-theme-INK token values, not arbitrary hex) so the pieces keep their
    real-world identity across light/dark themes, exactly the way a brand color would.'
  - 'Both renders are clean and legible: warm off-white/near-black theme backgrounds,
    no dark-on-dark or light-on-light text, subtle alpha-tinted checkerboard squares,
    no clipped or overlapping elements, generous margins around the board and coordinate
    labels.'
  - Pieces are well-centered within their squares with sensible padding (pieceSize
    = 0.72 × cell) per the spec's explicit note about not touching square edges.
  weaknesses:
  - No Imprint-palette element appears anywhere in the chart (board squares use ink-token
    tints, pieces use fixed black/white) — defensible given chess's real-world black/white
    convention and explained in a code comment, but flag for awareness since it's
    a full opt-out of the categorical palette rather than a semantic re-mapping within
    it.
  - No visual emphasis on the checkmate itself (e.g. a subtle highlight on the checkmated
    king's e1 square, or the queen's h4-e1 mating diagonal) — the title names 'Fool's
    Mate' but nothing in the diagram calls out why the position is famous, leaving
    some data-storytelling value on the table.
  - Coordinate labels (a-h / 1-8) are sized at cell*0.16 (~43 source px on the 2400px
    canvas); at the 400px mobile thumbnail this scales down to ~7px, on the small
    side even for single-character glyphs — consider cell*0.18-0.20 for extra mobile
    safety margin.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1-consistent), not pure white, not dark.
      Chrome: Title "Fool's Mate · chessboard-pieces · javascript · chartjs · anyplot.ai" in dark ink, fully visible and centered above the board. File labels (a-h) below the board and rank labels (8-1) to its left are in a soft dark gray, small but crisp. Board frame is a thin dark stroke.
      Data: An 8x8 checkerboard alternating between two subtle ink-tinted squares (light gray / slightly darker gray) with correct chess coloring (a1 dark, h1 light). 32 Unicode chess glyphs are placed on their squares: white pieces rendered with light fill + dark outline, black pieces with dark fill + light outline, both fully legible against either square shade. The position matches the historical "Fool's Mate" final position exactly (White pawns on f3/g4, Black queen on h4, no captures).
      Legibility verdict: PASS - title, coordinate labels, and every piece glyph are clearly readable against the light background; no light-on-light text anywhere.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17-consistent), not pure black, not light.
      Chrome: Same title text now in light ink, fully visible and centered. File/rank labels are in a soft light gray, matching size and placement of the light render. Board frame is a thin light stroke.
      Data: The same checkerboard pattern with darker alpha tints appropriate for the dark surface, correct h1-light/a1-dark orientation preserved. Piece colors are identical to the light render (white pieces stay light-filled/dark-outlined, black pieces stay dark-filled/light-outlined) — the brand-consistency invariant holds: piece identity does not flip with theme, exactly as the code intends for chess semantics.
      Legibility verdict: PASS - no dark-on-dark failures; every title character, coordinate label, and piece glyph reads clearly against the near-black background. No element relies on the brand green (not used in this chart, appropriately, since chess pieces need fixed black/white identity rather than categorical color).
