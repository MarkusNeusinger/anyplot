review:
  strengths:
  - Accurately renders a real, well-known chess position (Scholar's Mate, final position
    after 1.e4 e5 2.Bc4 Nc6 3.Qh5 Nf6?? 4.Qxf7#) — verified square-by-square against
    the actual game moves, giving strong data realism instead of an arbitrary arrangement.
  - 'Correct board geometry: light square at h1, standard white-at-bottom orientation,
    and accurate file/rank labels.'
  - 'Thoughtful semantic color exception, explicitly documented in code comments:
    dark squares use the Imprint ochre hue (#BD8233, the palette''s ''wood'' anchor)
    blended at reduced opacity instead of blindly following ordinal categorical order.'
  - Piece rendering uses a fixed, theme-independent ivory/ink duotone (hollow outline
    for white pieces, solid fill for black pieces) that stays legible in both themes
    and matches the real-world white/black chess convention.
  - Idiomatic-but-advanced ECharts usage via a `custom` series `renderItem` for both
    squares and glyphs, using `api.coord`/`api.size` for precise per-square centering
    rather than a simpler, less flexible chart type.
  - 'Clean theme-adaptive chrome, `animation: false` set correctly, and fully deterministic
    hard-coded data.'
  weaknesses:
  - 'In the dark render, ''light'' squares (mapped to t.elevatedBg, a near-black #242420)
    render darker than ''dark'' squares (the ochre blend, which is visually brighter/warmer)
    — the light/dark square luminance relationship is effectively inverted between
    themes even though the alternating pattern itself stays readable. Pick a brighter,
    still theme-adaptive tone for the light squares in dark mode so relative luminance
    ordering matches the light render.'
  - No visual emphasis or annotation calls out the checkmate itself (e.g. a subtle
    highlight on the mated king's square or the delivering queen) — a missed data-storytelling
    opportunity given this is a famous decisive position rather than an arbitrary
    one.
  - Design polish is competent but fairly utilitarian — nothing in the composition
    currently signals 'this position matters' beyond the title text; a highlight on
    the last-move squares (f7/h5) would add hierarchy without clutter.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1) fills the canvas around a centered 8x8 board.
      Chrome: Title "Scholar's Mate · chessboard-pieces · javascript · echarts · anyplot.ai" in dark ink at top, clearly readable. File labels (a-h) below the board and rank labels (1-8) to the left are in a softer gray, both legible against the light background. Board border is a thin dark outline; individual squares have subtle hairline strokes.
      Data: Squares alternate warm cream (light squares, h1 correctly light) and a tan/ochre wash (dark squares, blended from the Imprint ochre hue). Pieces render as recognizable chess-icon glyphs — white pieces as hollow ivory-fill/dark-stroke outlines, black pieces as solid dark-fill/ivory-stroke shapes — matching the real Scholar's Mate final position (queen captured on f7, knights on c6/f6, pawn on e5, etc.).
      Legibility verdict: PASS — all text and pieces are clearly readable, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17) fills the canvas.
      Chrome: Title and axis labels switch to light ink/gray tones, both clearly readable against the dark background. No dark-on-dark text was observed.
      Data: The same Scholar's Mate position and identical piece glyph colors as the light render (white pieces ivory/dark-stroke, black pieces dark/ivory-stroke) — data colors match across themes as required. Squares still alternate two tones, though the "light" square color (near-black elevated surface) now reads slightly darker than the "dark" square's ochre blend, effectively flipping which square looks lighter versus the light render (see Weaknesses) — the checkerboard pattern itself, however, remains clearly distinguishable and readable.
      Legibility verdict: PASS — all text and pieces remain legible; the noted square-luminance inversion is a design nuance, not a readability failure.
