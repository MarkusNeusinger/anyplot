review:
  strengths:
  - 'Both previous-attempt weaknesses are fixed: dark-square/light-square fills now
    alpha-blend over the page background so light squares stay visually lighter than
    dark squares in BOTH themes (verified: ~123 vs ~76 relative luminance in the dark
    render), and a soft amber outline now highlights f7/e8 to call out the delivering
    queen and mated king.'
  - Accurately renders a real, well-known chess position (Scholar's Mate, final position
    after 1.e4 e5 2.Bc4 Nc6 3.Qh5 Nf6?? 4.Qxf7#), verified square-by-square against
    the actual game moves.
  - 'Correct board geometry: light square at h1, standard white-at-bottom orientation,
    accurate file/rank labels.'
  - Piece rendering uses a fixed, theme-independent ivory/ink duotone (hollow outline
    for white, solid fill for black) — legible in both themes, matches the real-world
    chess convention, and is documented in code as an intentional Imprint semantic
    exception.
  - Idiomatic-but-advanced ECharts usage via `custom` series `renderItem` for squares,
    highlight outlines, and glyphs, using `api.coord`/`api.size` for precise per-square
    centering.
  - 'Clean theme-adaptive chrome, `animation: false` set correctly, fully deterministic
    hard-coded data, no unused imports.'
  weaknesses:
  - Design polish is still fairly literal/utilitarian — the checkmate highlight (amber
    outline on f7/e8) is a good addition, but nothing else in the composition builds
    further hierarchy (e.g. a subtle dimming of irrelevant squares, or a move-arrow)
    that would push this from 'accurate diagram' to 'polished editorial graphic'.
  - The two highlighted squares communicate 'these squares matter' but not why (queen
    delivering check vs. king in check) — a tiny caption or legend swatch distinguishing
    the two would remove ambiguity for a viewer unfamiliar with the game.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1) fills the canvas around a centered 8x8 board.
      Chrome: Title "Scholar's Mate · chessboard-pieces · javascript · echarts · anyplot.ai" in dark ink at top, clearly readable. File labels (a-h) below the board and rank labels (1-8) to the left are in a softer gray, both legible against the light background. Board border is a thin dark outline; individual squares have subtle hairline strokes.
      Data: Squares alternate warm cream (light squares, h1 correctly light) and a tan/ochre wash (dark squares, blended from the Imprint ochre hue). The king square (e8) and queen square (f7) are outlined with a soft amber highlight, calling out the checkmating move. Pieces render as recognizable chess-icon glyphs — white pieces as hollow ivory-fill/dark-stroke outlines, black pieces as solid dark-fill/ivory-stroke shapes — matching the real Scholar's Mate final position.
      Legibility verdict: PASS — all text and pieces are clearly readable, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17) fills the canvas.
      Chrome: Title and axis labels switch to light ink/gray tones, both clearly readable against the dark background. No dark-on-dark text observed.
      Data: Identical Scholar's Mate position and identical piece glyph colors as the light render (data colors match across themes, as required). Squares alternate a mid-gray tone (light squares, now correctly blended so they read LIGHTER than the dark squares — the previous-attempt luminance inversion is fixed) and a warm brown/ochre tone (dark squares). The same amber outline highlights e8/f7 and remains clearly visible against the dark board.
      Legibility verdict: PASS — all text and pieces remain legible; light/dark square luminance ordering now matches the light render.
