review:
  strengths:
  - Elegant custom SVGRenderer solution that works around the unloaded heatmap module
    — draws the 8x8 grid and piece glyphs directly via chart.renderer.rect/text, a
    genuinely idiomatic Highcharts technique rather than a workaround.
  - 'Correct standard chess-board orientation: a1 is dark, h1 is light, white pieces
    sit at the bottom (rows 1-2) — matches the spec''s explicit convention notes exactly.'
  - Piece color/team is encoded by glyph shape (hollow outline vs. filled Unicode
    symbol) rather than by hue, so the diagram is fully colorblind-safe with zero
    reliance on color to distinguish white from black.
  - Full token-driven theming (elevatedBg / ink@16% / inkSoft / pageBg) keeps the
    checkerboard and all text legible and consistent in both light and dark renders
    — only chrome flips, exactly as required.
  - Realistic, well-known educational position (Scholar's Mate, final position after
    4.Qxf7#) with a descriptive subtitle, and all six piece types are represented
    for both colors.
  weaknesses:
  - 'Design polish is solid but not top-tier: the checkerboard and coordinate labels
    are clean and correct but fairly plain — a touch more refinement (e.g. subtle
    square corner treatment or slightly more distinctive coordinate-label styling)
    would lift Design Excellence further. Not severe enough to require a fix.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1-consistent), not pure white.
      Chrome: Title "chessboard-pieces · javascript · highcharts · anyplot.ai" in bold dark ink, fully visible with margin above; subtitle "Scholar's mate · final position after 4.Qxf7#" in soft gray below it, clearly readable. Rank labels (1-8) sit in the left gutter, file labels (a-h) in the bottom gutter, both in the same soft-ink color, legible and not clipped.
      Data: 8x8 checkerboard alternates a warm off-white/elevated tint (light squares) with a translucent dark gray (dark squares); a1 is dark and h1 is light, matching standard chess convention. All 32 pieces render as dark-ink Unicode glyphs — white pieces as hollow/outline symbols, black pieces as solid/filled symbols — so team is encoded by shape, not color. Each glyph has a subtle page-background text outline that keeps it crisp against the square fill.
      Legibility verdict: PASS — every title, subtitle, and coordinate label is clearly readable against the light background; no light-on-light text found.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17-consistent), not pure black.
      Chrome: Same title and subtitle, now rendered in light ink, fully legible against the dark background. Rank/file coordinate labels also flip to a light soft-ink tone and remain clearly readable, no clipping.
      Data: The checkerboard flips to two dark grays (a lighter charcoal for "light" squares, near-black for "dark" squares) while preserving the same a1-dark/h1-light pattern. Pieces render as light-ink glyphs (hollow outline for white pieces, solid filled for black pieces) — the shape-based team encoding is identical to the light render, only the ink color itself flips with the chrome, which is expected since piece color is a chrome/ink token, not a categorical data series.
      Legibility verdict: PASS — no dark-on-dark failures; every glyph, label, title, and subtitle is clearly visible against the dark surface.
