review:
  strengths:
  - Clever custom BoardMark render slot builds an accurate 8x8 checkerboard (a1 dark,
    h1 light, per standard chess convention) out of ScatterChart's band scales — a
    resourceful solution given the community-only MUI X surface has no native grid/board
    primitive
  - Historically accurate Scholar's Mate final position (1.e4 e5 2.Qh5 Nc6 3.Bc4 Nf6??
    4.Qxf7#) with every piece correctly placed, including the captured f7 black pawn
    being absent
  - Consistent solid-vs-outline piece styling (black pieces = solid ink fill, white
    pieces = light fill + ink stroke) preserves the black/white piece distinction
    identically across both themes without hardcoding literal black/white hexes
  - Theme-adaptive chrome throughout (title, tick labels, board squares, board frame)
    correctly reads window.ANYPLOT_TOKENS; both renders are legible with no dark-on-dark
    or light-on-light failures
  weaknesses:
  - Title (22px) and axis tick labels (16px) in the 1200x1200 CSS mount are on the
    smaller side — bump toward ~24px title / 18-20px ticks so they stay comfortably
    readable once scaled down to the ~400px mobile srcset
  - 'Design Excellence is minimal: the board is purely two-tone with no additional
    visual hierarchy or emphasis on the named position (e.g. a subtle highlight on
    the checkmating queen/king squares or a last-move indicator) that would elevate
    the data-storytelling angle for a specifically-named historical position'
  - Repurposing ScatterChart with a fully custom marks slot to draw the board is a
    workaround rather than an idiomatic community-API pattern — acceptable given the
    Pro-only heatmap/grid components are out of scope, but it stretches 'scatter'
    semantics
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1) page surface behind an 8x8 checkerboard built from alternating near-white (elevatedBg) and light-grey (ink-tinted elevatedBg) squares, framed by a thin ink-soft border. Files a-h labeled below, ranks 8-1 labeled at left (white sits on ranks 1-2, as required).
      Chrome: Title "Scholar's Mate · chessboard-pieces · javascript · muix · anyplot.ai" in dark ink, centered above the board. File/rank tick labels in ink-soft grey. All fully readable against the light background.
      Data: 32 unicode chess glyphs placed on the correct squares for the Scholar's Mate final position (Qxf7#). Black pieces render as solid dark-ink glyphs; white pieces render as light-fill glyphs with a dark-ink outline stroke, giving clear black-vs-white piece distinction. a1 is a dark square and h1 is a light square, matching the standard chess convention noted in the spec.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17) page surface behind the same checkerboard, now alternating dark-charcoal (elevatedBg) and medium-grey (ink-tinted elevatedBg) squares with a light ink-soft frame.
      Chrome: Title and axis tick labels flip to light ink / ink-soft tones, both fully readable against the dark background — no dark-on-dark failures observed.
      Data: Piece layout and glyph shapes are pixel-identical to the light render (same squares occupied by the same pieces). Black pieces (solid ink fill) render as solid cream/white glyphs in this theme, and white pieces (light fill + ink outline) render as outlined glyphs with a dark stroke — the solid-vs-outline distinction that encodes "black piece" vs "white piece" is preserved consistently across both themes even though the underlying token colors flip.
      Legibility verdict: PASS
