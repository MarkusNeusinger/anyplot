review:
  strengths:
  - 'Correct chess conventions: h1 is a light square, a1 is a dark square, white sits
    on ranks 1-2 — all verified against the code''s band-scale logic and confirmed
    visually'
  - 'The final position is a factually accurate rendering of the real ''Scholar''s
    Mate'' trace (1.e4 e5 2.Qh5 Nc6 3.Bc4 Nf6?? 4.Qxf7#): f7 pawn correctly missing
    (captured), unmoved pieces (e1 king, a1/h1 rooks, g1 knight) correctly still on
    their home squares'
  - 'Clever theme-stable piece encoding: white army renders as a hollow/outlined glyph
    (elevatedBg fill + ink stroke) and black army as a solid ink-filled glyph, so
    the solid-vs-outline distinction — not raw hue — carries the identity, and it
    survives the light/dark theme flip'
  - Genuinely idiomatic use of MUI X's `slots.scatter` custom-mark API to repurpose
    ScatterChart's band scales into a full checkerboard + Unicode piece renderer —
    a distinctive, hard-to-replicate-elsewhere technique
  - Mate squares (e8 king, f7 queen) are highlighted with the amber semantic anchor,
    giving the diagram a clear focal point that tells the 'Scholar's Mate' story at
    a glance
  - 'Clean chrome: spines disabled on both axes, no grid, deterministic in-memory
    data, explicit font sizing throughout, both renders theme-correct with no dark-on-dark
    or light-on-light failures'
  weaknesses:
  - The board squares use muted gray tones (elevatedBg + ink@22%) rather than a higher-contrast
    classic checkerboard look — a valid stylistic choice but slightly less crisp than
    it could be
  - Amber is normally reserved for the 'warning/caution' semantic role; using it to
    flag the checkmate squares is a defensible but borderline stretch of that anchor's
    intended meaning — consider a one-line caption near the title so a first-time
    viewer immediately understands why those two squares are highlighted
  - LM-01 could go one step further by exposing the move context (e.g. via the interactive
    HTML's tooltip data) rather than relying solely on the title text for the narrative
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "Scholar's Mate · chessboard-pieces · javascript · muix · anyplot.ai" is centered at the top in dark ink, fully visible, not clipped. File labels (a-h) run along the bottom, rank labels (8-1, top to bottom) run along the left — both in a slightly softer ink tone, clearly legible.
      Data: 8x8 checkerboard alternates cream (light squares) and medium gray (dark squares, via a semi-transparent ink overlay). a1 is correctly a dark square and h1 is correctly a light square, matching real chess board orientation. The e8 (black king) and f7 (white queen) squares are highlighted with a soft amber fill and border, marking the checkmating move. White pieces render as hollow glyphs (cream fill, dark outline); black pieces render as solid dark glyphs. All 32 starting pieces minus the captured f7 black pawn are present and centered within their squares, not touching square edges.
      Legibility verdict: PASS — all text and pieces are clearly readable against the light background.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title, now in light/cream ink, fully visible and not clipped. File and rank labels are in a light gray tone, clearly legible against the dark background — no dark-on-dark failures observed anywhere.
      Data: The checkerboard pattern is preserved (near-black dark squares, medium-gray light squares); the mate-square highlight is still amber, matching the light render. Piece colors are identical in structure but chrome-flipped: white army pieces render hollow (dark fill, light outline) and black army pieces render solid light-colored — this is a deliberate design choice, since the solid-vs-outline shape distinction (not raw hue) is what encodes white vs. black armies, and that distinction survives the theme flip. Board geometry, piece positions, and the amber highlight are identical to the light render.
      Legibility verdict: PASS — all text and pieces remain clearly readable against the dark background; no dark-on-dark or light-on-light failures found.
