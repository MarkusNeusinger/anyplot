review:
  strengths:
  - Correct Scholar's Mate position (16 white, 15 black pieces) with white at the
    bottom and a light h1 corner
  - Board grid built from MUI X band axes (categoryGapRatio 0) with custom SVG layers
    that read useXScale/useYScale/useDrawingArea, so squares and pieces follow the
    library's own scales
  - White pieces drawn as outline glyph over a light-filled solid glyph with a halo,
    so they read clearly on both light and dark squares in both themes
  - Glyphs derived from Unicode code points (U+2654/U+265A + piece index) with the
    text-style variation selector, avoiding emoji rendering
  - 'Theme-adaptive chrome: title, subtitle, coordinates and board frame flip with
    the theme while board and piece colors stay identical'
  weaknesses:
  - 'VQ-07 (both): the light squares are filled with t.amber (#DDCC77), the warning/caution
    semantic anchor, used here outside its role → a light wood tone that is not a
    semantic anchor, for example a lighter step of the ochre family or the theme''s
    elevated surface, while the dark squares keep ochre (palette[3]). Likely cause:
    SQUARE_COLOR.light = t.amber.'
  - 'Suggestion: the white queen on f7 shows small specks of the light-square color
    between its crown spokes where the solid fill glyph does not fully cover the outline
    glyph; a slightly wider halo stroke would close them.'
  - 'Suggestion: rank labels could sit a little closer to the board edge to match
    the tight spacing of the file letters.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 page around the board.
      Chrome: bold dark title "Scholar's Mate · chessboard-pieces · javascript · muix · anyplot.ai" (~57% of width), grey subtitle "16 white and 15 black pieces · framed: Qxf7#: the white queen on f7 checkmates the black king on e8"; rank numbers 1-8 on the left (1 at bottom), file letters a-h below (a at left); dark ink frame around the board. All readable.
      Data: 8x8 board of pale yellow (amber) light squares and ochre dark squares, h1 light. Black pieces are solid near-black glyphs; white pieces are cream-filled with a dark outline and halo. Position matches Scholar's Mate; f7 (white queen) and e8 (black king) framed in matte red.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
