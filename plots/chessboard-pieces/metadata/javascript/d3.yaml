review:
  strengths:
  - Renders a historically accurate Scholar's Mate final position (verified piece-by-piece
    against the real game) instead of an arbitrary/abstract arrangement
  - 'Theme-inversion bug from attempt 1 is correctly fixed: explicit per-theme board
    tones now guarantee the light square is always the higher-luminance one in both
    light and dark renders, matching the spec''s ''light square at h1'' chess convention'
  - Piece glyphs use a fill+stroke pairing (light fill/dark stroke for white, dark
    fill/light stroke for black) so identity reads clearly regardless of underlying
    square color or theme
  - Dynamic title fontsize formula keeps the long mandated title comfortably within
    the canvas in both themes
  - Contextual subtitle (opening moves) adds data storytelling beyond a bare diagram
  - 'Clean idiomatic D3 usage: d3.scaleBand for grid placement, single data-join builds
    all 64 squares, second join places pieces'
  - KISS code structure with zero external dependencies beyond the d3 global; fully
    deterministic, hardcoded position
  weaknesses:
  - Library Mastery is still fairly generic for D3 beyond the new scaleBand usage
    — no axes, shape generators, or other distinctive modules
  - The board is a plain two-tone checkerboard with no visual emphasis on the checkmating
    square/piece (f7), leaving some data-storytelling upside on the table
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1-consistent) canvas surrounding a centered 8x8 board.
      Chrome: Bold dark title "Scholar's Mate, Move 4 · chessboard-pieces · javascript · d3 · anyplot.ai" and a lighter dark-gray subtitle "White delivers checkmate: 1.e4 e5 2.Bc4 Nc6 3.Qh5 Nf6?? 4.Qxf7#" both sit clearly above the board, fully readable against the cream background. File letters (a-h) below the board and rank numbers (1-8) to its left are legible mid-gray text.
      Data: Board squares alternate between a near-white tone (elevatedBg, "light" squares) and a light warm gray (~#C9C7C1, "dark" squares) — h1 (bottom-right) correctly reads as the lighter of the two, matching standard chess convention. White pieces render as cream-filled glyphs with a thin dark outline, black pieces as dark-filled glyphs with a thin cream outline — both read clearly against either square shade. Position matches the real Scholar's Mate checkmate (Ke1, Ra1/Rh1, Bc1, Bc4, Nb1/Ng1, Qf7 for white; Ke8, Qd8, Ra8/Rh8, Bc8/Bf8, Nc6/Nf6, pawns for black).
      Legibility verdict: PASS — all text and pieces clearly readable, no overlap, no clipping.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17-consistent) canvas.
      Chrome: Title and subtitle render in light cream / soft light-gray text, fully readable against the near-black background — no dark-on-dark failures. File/rank labels remain legible light-gray text.
      Data: Board squares now alternate between a medium warm-gray tone (~#403F38, "light" squares) and a very dark charcoal tone (~elevatedBg/#242420, "dark" squares) — h1 (bottom-right) is still the visually lighter of the two here, so the light/dark square identity no longer inverts between themes (this was the exact defect flagged in attempt 1, now confirmed fixed). Piece colors keep the same fill/stroke structure as the light render (by piece color, not by theme): black pieces read as hollow cream-outlined silhouettes, white pieces as solid cream shapes — both clearly distinguishable from the dark board and from each other.
      Legibility verdict: PASS — no readability failure, and the previously-flagged square-shade inversion is fixed.
