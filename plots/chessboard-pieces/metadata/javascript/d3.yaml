review:
  strengths:
  - Renders a historically accurate Scholar's Mate final position (verified piece-by-piece
    against the real game) instead of an arbitrary/abstract arrangement
  - 'Correct chess board convention: light square algorithmically placed at h1 (col+row
    parity check)'
  - Piece glyphs use a fill+stroke pairing (light fill/dark stroke for white, dark
    fill/light stroke for black) so identity reads clearly regardless of underlying
    square color or theme — a thoughtful CVD-safe touch
  - Dynamic title fontsize formula keeps the long mandated title comfortably within
    the canvas in both themes
  - Contextual subtitle (opening moves) adds data storytelling beyond a bare diagram
  - 'Clean idiomatic D3 usage: single data-join builds all 64 squares, second join
    places pieces, no manual per-piece markup'
  - KISS code structure with zero external dependencies beyond the d3 global; fully
    deterministic, hardcoded position
  weaknesses:
  - 'Dark-theme board squares invert relative to light theme: darkSquare = d3.interpolateRgb(t.pageBg,
    t.ink)(0.22) while light squares use t.elevatedBg. In light theme this yields
    elevatedBg #FFFDF6 (light) vs interpolated #C9C7C1 (light-gray) — light square
    correctly lighter. In dark theme it yields elevatedBg #242420 (dark) vs interpolated
    #494945 (medium-gray) — the ''light'' square is now DARKER than the ''dark'' square.
    Net effect: h1, which must read as the light square ''per chess standards'' (spec
    requirement), renders as the visually darker of the two shades in dark mode —
    a real chess-board convention gets inverted, not just a subtle contrast tweak.
    Fix: derive board-square colors so the light square is always the higher-luminance
    one in both themes (e.g. two fixed board tones per theme, or flip the interpolation
    factor''s direction based on ANYPLOT_THEME instead of always blending toward t.ink).'
  - 'Library Mastery is fairly generic for D3: no use of d3-scale/d3-axis or another
    module beyond a single d3.interpolateRgb call and two selection.data().join()
    calls — a capable but not especially distinctive use of the library''s toolkit.'
  - Board-square color scheme relies entirely on the general-purpose pageBg/ink interpolation
    rather than distinct, purpose-built board tones — visually pleasant but generic
    rather than a deliberately designed board palette (limits Design Excellence upside).
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1-consistent) canvas surrounding an 8x8 board. Board squares alternate between a near-white tone (#FFFDF6-ish, "light" squares) and a light warm gray (~#C9C7C1, "dark" squares) — h1 (bottom-right) correctly reads as the lighter of the two, matching standard chess convention.
      Chrome: Bold dark title "Scholar's Mate, Move 4 · chessboard-pieces · javascript · d3 · anyplot.ai" and a lighter dark-gray subtitle "White delivers checkmate: 1.e4 e5 2.Bc4 Nc6 3.Qh5 Nf6?? 4.Qxf7#" both sit clearly above the board, fully readable against the cream background. File letters (a-h) below the board and rank numbers (1-8) to its left are legible mid-gray text.
      Data: Unicode chess glyphs — white pieces rendered as light glyphs with a dark outline, black pieces as dark glyphs with a light outline — both read clearly against either square shade. Position matches the real Scholar's Mate checkmate (Ke1, Ra1/Rh1, Bc1, Bc4, Nb1/Ng1, Qf7 for white; Ke8, Qd8, Ra8/Rh8, Bc8/Bf8, Nc6/Nf6, pawns for black).
      Legibility verdict: PASS — all text and pieces clearly readable, no overlap, no clipping.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17-consistent) canvas. Board squares alternate between a dark charcoal tone (#242420-ish) and a medium warm gray (~#494945). Critically, the squares assigned "light" in the data model (e.g. h1) render as the DARKER of the two shades here — inverted from the light render and from real chess-board convention (see weaknesses).
      Chrome: Title and subtitle render in light cream / soft light-gray text, fully readable against the near-black background — no dark-on-dark failures. File/rank labels remain legible light-gray text.
      Data: Piece colors are identical to the light render (light-fill/dark-stroke for white, dark-fill/light-stroke for black) — pieces keep their identity and are clearly distinguishable from both square shades.
      Legibility verdict: PASS for text/piece legibility — no readability failure — but the square-shade inversion described above is a real domain-accuracy defect specific to this render.
