review:
  strengths:
  - 'Checkerboard square colors are derived from approved tokens (weighted_color_mean
    of PAGE_BG + brand green #009E73) instead of an invented hue — ties the board
    to Imprint identity while still reading as a felt/wood board.'
  - Piece fill/stroke scheme (PIECE_LIGHT/PIECE_DARK with opposite-polarity stroke)
    keeps white-vs-black piece identity constant across themes while guaranteeing
    contrast against either square shade — a genuinely clever accessibility solution.
  - 'Correct chess conventions: h1 is the light square, white starts at the bottom
    (rows 1-2), matching the spec''s explicit orientation requirement.'
  - Realistic, well-known game position (Scholar's Mate final position) that exercises
    all six piece types (K/Q/R/B/N/P) for both colors — strong feature and data coverage.
  - 'Clean, idiomatic KISS script: heatmap! for the checkerboard, text! with stroke
    for glyphs, no functions/classes, deterministic data (no seed needed, position
    is fixed).'
  - Theme-adaptive chrome (title/tick colors, board border) flips correctly between
    light and dark; canvas gate passed at 2400x2400.
  weaknesses:
  - King and Queen Unicode glyphs (♔/♕/♚/♛) render as a fan-of-dots / blob shape rather
    than a recognizable crown silhouette in both renders, while Rook, Bishop, Knight,
    and Pawn glyphs render cleanly — looks like a font-fallback limitation for those
    specific code points. Set an explicit font with full chess Unicode (Miscellaneous
    Symbols block) coverage in the text! calls (e.g. font = "DejaVu Sans" or "Noto
    Sans Symbols2") and confirm U+2654/U+2655/U+265A/U+265B render as proper chess
    glyphs before relying on the default font.
  - No visual hierarchy highlights the checkmate itself (e.g. a subtle marker on the
    mating queen/attacked king) — the diagram is purely descriptive. Not a spec violation
    since annotations weren't requested, but a highlight would push Design Excellence
    further.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1), matches the required light-theme page surface.
      Chrome: Title "chessboard-pieces · julia · makie · anyplot.ai" in dark ink, centered top, comfortably within width, not clipped. File letters (a-h) below the board and rank numbers (1-8) to the left are rendered in a soft dark gray (INK_SOFT) — all clearly legible against the light background.
      Data: 8x8 checkerboard alternates cream squares and a muted sage/teal-green square (blended from PAGE_BG + brand green #009E73). h1 (bottom-right) is the light/cream square, a1 (bottom-left) is the dark/teal square — correct standard orientation. White pieces (uppercase) render as pale/cream glyphs with a dark outline stroke (near-hollow "outline" look against the cream squares, solid look against teal squares); black pieces (lowercase) render as solid near-black glyphs with a cream outline stroke, fully legible everywhere. Rook, bishop, knight, and pawn glyphs are crisp and recognizable; king and queen glyphs render as an unusual blob/fan shape rather than a canonical crown (see weaknesses).
      Legibility verdict: PASS (all text and both light/dark square combinations of pieces are readable; the K/Q glyph shape issue is a distinctiveness/recognizability concern, not a legibility failure).

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17), matches the required dark-theme page surface.
      Chrome: Title renders in light/cream ink, fully visible against the black background, not clipped. File/rank labels render in a lighter gray (INK_SOFT dark-theme token) — clearly visible, no dark-on-dark failures.
      Data: Checkerboard alternates a mid-gray square and a deep forest-green square (same PAGE_BG + brand-green blend formula, now anchored to the dark background) — clearly distinct from each other and from the page background. Data colors (piece fill logic) are identical in intent to the light render: white pieces stay cream-filled/dark-stroked, black pieces stay near-black-filled/cream-stroked — confirmed same hex values as light render, only the board/chrome tones shifted per theme as expected. All pieces are legible; same K/Q glyph shape issue reproduces here.
      Legibility verdict: PASS (no dark-on-dark or light-on-light failures found; text and piece glyphs are all distinguishable from the background).
