review:
  strengths:
  - The King/Queen glyph fallback issue from Attempt 1 is fixed — explicitly setting
    font="DejaVu Sans" on the text! calls now renders proper crown silhouettes for
    K/Q (distinct from the fan-of-dots blob seen before) alongside the already-clean
    Rook/Bishop/Knight/Pawn glyphs.
  - 'Checkerboard square colors are derived from approved tokens (blend of page background
    + brand green #009E73 via weighted_color_mean) instead of an invented hue — ties
    the board to Imprint identity while still reading as a felt/wood board, and adapts
    correctly between themes.'
  - Piece fill/stroke scheme keeps white-vs-black piece identity constant across themes
    while guaranteeing contrast against either square shade via an opposite-polarity
    stroke — a clever accessibility solution.
  - 'Correct chess conventions: h1 is the light square, a1 is dark, white pieces start
    at the bottom (ranks 1-2) — matches the spec''s orientation requirement exactly.'
  - Realistic, well-known, factually accurate game position (Scholar's Mate final
    position) exercising all six piece types for both colors, with correct piece counts
    including the captured f7 pawn.
  - 'Clean, idiomatic KISS script: heatmap! for the checkerboard, text! with stroke
    for glyphs, DataAspect() for square cells, deterministic fixed position data,
    no functions/classes.'
  - Theme-adaptive chrome flips correctly between light and dark (title, tick labels,
    border); canvas gate passed at 2400x2400.
  weaknesses:
  - No visual hierarchy highlights the checkmate itself — the board is purely descriptive
    with no emphasis (e.g. a subtle ring/accent) on the mating queen or attacked king
    square. Not a spec violation (annotations are only expected when explicitly requested),
    but it caps Data Storytelling (DE-03) at the default score.
  - The board-square colors are a custom-computed blend (weighted_color_mean of PAGE_BG
    + BRAND) rather than a literal Imprint palette hex or semantic anchor — defensible
    here since board shading isn't a categorical data series, but worth flagging as
    a pattern to watch if it recurs elsewhere without a documented rationale.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Title "chessboard-pieces · julia · makie · anyplot.ai" in dark ink, centered top, fully visible, not clipped. File letters (a-h) below the board and rank numbers (1-8) to the left render in soft dark gray — all clearly legible against the light background.
      Data: 8x8 checkerboard alternates cream squares and a muted sage/teal-green square (blended from page background + brand green #009E73); h1 (bottom-right) is light, a1 (bottom-left) is dark — correct standard chess orientation. White pieces render as pale/cream glyphs with a dark outline stroke; black pieces render as solid near-black glyphs with a cream outline stroke — all fully legible against either square shade. Rook, Bishop, Knight, Pawn, King, and Queen glyphs are now all crisp and recognizable (the King shows a crown-with-cross silhouette, the Queen shows a multi-point pearled crown) — the font-fallback blob issue from Attempt 1 is resolved.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Title renders in light/cream ink, fully visible, not clipped. File/rank labels render in a lighter gray — clearly visible, no dark-on-dark failures.
      Data: Checkerboard alternates a mid-gray square and a deep forest-green square (same blend formula, anchored to the dark background) — clearly distinct from the page background. Piece fill/stroke colors are identical in hex value to the light render (white pieces stay pale/cream-filled with dark stroke, black pieces stay near-black-filled with cream stroke) — only the board/chrome tones shifted per theme, as expected. All six piece types remain legible and distinguishable, including King and Queen.
      Legibility verdict: PASS
