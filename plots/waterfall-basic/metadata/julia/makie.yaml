  strengths:
  - Correct, fully-verified cumulative math (running totals match all displayed labels
    exactly)
  - Dotted connector lines and the bold/larger label on the largest single decrease
    create real visual hierarchy and a clear narrative focal point
  - rich() mixed-format subtitle is a Makie-idiomatic storytelling touch that ties
    the headline numbers back into the chart
  - Theme-adaptive total-bar color (INK) keeps start/end bars distinct from data bars
    in both themes without introducing an off-palette color
  - Canvas lands exactly on the 3200x1800 target with no clipping in either render
  weaknesses:
  - Total bars (Starting Balance, Net Profit) are colored via the ink/chrome token
    rather than a dedicated categorical tone; visually distinct and legible, but leans
    on a chrome color for a data-encoding role
  - Design Excellence is solid but still close to the documented style-guide skeleton;
    a bit more customization (e.g. a distinct total-bar hue, subtle bar corner rounding)
    would push DE-01 further
