review:
  strengths:
  - Correct waterfall cumulative math verified by hand (12.40 → 20.90 → 25.20 → 19.80
    → 16.70 → 14.85), with running totals labeled clearly on each bar
  - Uses the Imprint style guide's theme-adaptive `neutral` semantic anchor for the
    start/end Total bars — exactly the documented use case ("totals / baseline / outline
    / reference line"), and it stays visually distinct from the green/red data bars
    in both themes
  - Dotted connecting lines between each bar satisfy the spec's "show connecting lines
    to emphasize cumulative flow" requirement, and correctly link each bar's cumulative
    level to the next bar's start
  - Running-total labels are intelligently placed above bars for increases/totals
    and below bars for decreases, avoiding any overlap with bars or connector lines
  - Legend is unobtrusive (transparent background, no frame, horizontal, tucked top-left
    inside the plot) and its colors correctly track theme changes for the Total swatch
  - Realistic, neutral business scenario (quarterly profit bridge) with sensible dollar
    magnitudes and full coverage of increase/decrease/total bar types
  - 'Clean idiomatic Makie code: `barplot!` with `fillto` for floating bars, KISS
    top-to-bottom structure, only used imports, correct `save("plot-$(THEME).png";
    px_per_unit=2)` API'
  weaknesses:
  - 'Design Excellence is solid but not yet publication-tier: no visual emphasis on
    the largest swing (Operating Costs, the biggest single decrease) or a callout
    on the final net profit — adding a subtle size/emphasis or a short annotation
    would sharpen the story (DE-03)'
  - Value labels (fontsize=13) sit close in size to the axis tick labels (fontsize=12)
    with little hierarchy — bumping label fontsize up slightly (e.g. 14-15) relative
    to ticks would strengthen the visual hierarchy and improve mobile-scale legibility
    (VQ-01)
  - Overall aesthetic is clean but fairly conventional for a waterfall chart; consider
    a touch more typographic or color-depth polish (e.g. a light subtitle summarizing
    the bridge, or slightly bolder connector lines) to move from 'strong' to 'exceptional'
    (DE-01)
  - Library Mastery is correct but generic — consider Makie-distinctive touches like
    `rich()` text formatting for the value labels or a `Label` in the GridLayout for
    a subtitle, which would be harder to replicate in other libraries (LM-02)
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Bold dark title "Quarterly Profit Bridge · waterfall-basic · julia · makie · anyplot.ai" centered at top, fully visible with no clipping. Y-axis label "Amount ($M)" rotated on the left in dark ink. X-axis category labels ("Starting Balance", "Product Sales", "Service Revenue", "Operating Costs", "Marketing Spend", "Taxes", "Net Profit") wrap to two lines each, dark and readable. Horizontal gridlines at 0/10/20 are subtle. Top and right spines are removed; left/bottom spines are a soft muted tone.
      Data: Seven floating bars form the waterfall — first ("Starting Balance") and last ("Net Profit") bars are near-black (theme-adaptive neutral), two increase bars ("Product Sales", "Service Revenue") are Imprint brand green (#009E73), three decrease bars ("Operating Costs", "Marketing Spend", "Taxes") are matte red (#AE3030). Dotted connector lines link each bar's cumulative level to the next bar's base. Running-total dollar labels ($12.40M … $14.85M) sit above bars for increases/totals and below bars for decreases, with no overlap. A small horizontal legend (Increase/Decrease/Total) sits top-left inside the plot with a transparent background.
      Legibility verdict: PASS — all title, axis, tick, and data-label text is clearly readable against the light background.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Same title, now in light/cream text, fully visible with no clipping. Y-axis label and tick labels are light-colored and clearly legible. Gridlines remain subtle. Spines are a soft muted light tone matching the theme flip.
      Data: The green increase bars and red decrease bars are pixel-identical to the light render (#009E73 and #AE3030 respectively) — only the chrome flipped. The Total bars (first and last) flip from near-black to near-white/cream, matching the theme-adaptive `neutral` semantic anchor definition (same hex as chrome text), which is the documented intended behavior for total/baseline series, not a compliance violation. Legend swatch for "Total" also flips to the cream color consistently.
      Legibility verdict: PASS — no dark-on-dark or light-on-light failures observed; all text and data elements are clearly distinguishable from the dark background.
