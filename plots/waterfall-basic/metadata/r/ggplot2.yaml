review:
  strengths:
  - 'Both previously flagged weaknesses (y-axis unit, running-total labels) are fully
    resolved: "Amount ($K)" axis title and italic running-total annotations on every
    intermediate bar'
  - Net Profit bar now has a bold outline focal treatment, sharpening the data storytelling
    around the bridge's punchline as requested
  - 'Well-reasoned Imprint semantic-exception color mapping (profit/gain -> brand
    green #009E73, loss -> matte red #AE3030, totals -> blue #4467A3), documented
    in a code comment and applied consistently between light and dark renders'
  - Explicit font sizing throughout, including a length-aware title-shrink formula
    for the mandated title, with no overlap or clipping in either theme
  - Realistic, arithmetically consistent quarterly P&L data (850 - 320 - 180 - 95
    + 40 - 85 = 210) with a neutral business scenario
  - Theme-adaptive chrome correctly threaded through background, grid, ticks, legend,
    connectors, and the focal outline for both renders
  weaknesses:
  - The waterfall is still built from generic geom_rect/geom_segment/geom_text layering
    that any imperative plotting library could replicate - nothing here is distinctive
    to ggplot2 specifically (e.g. no ggplot2-only stats, coordinate systems, or extension
    packages)
  - With two stacked labels per bar (delta + running total), the chart is getting
    label-dense; still readable at full and mobile scale in this review, but worth
    keeping an eye on if further annotations are ever added
