review:
  strengths:
  - 'Correct waterfall mechanics: floating bars at accurate cumulative heights, dashed
    connector lines, and distinct neutral "total" bars for start/end - all spec-required
    features present'
  - Theme-adaptive Style object with a well-reasoned semantic color exception (green=gain,
    red=loss, neutral ink=total) that stays correct and identical in both light and
    dark renders
  - Creative, well-documented technique for drawing waterfall connectors on top of
    StackedBar by reusing the library's own internal view/margin math - a genuinely
    distinctive pygal-specific solution
  - Deterministic, realistic quarterly-financials dataset that sums correctly to the
    displayed net income
  weaknesses:
  - Title is missing the {language} token - currently "waterfall-basic · pygal · anyplot.ai"
    instead of "waterfall-basic · python · pygal · anyplot.ai"
  - 'Legend layout is scattered/unbalanced: the x-axis title "Category" sits directly
    above the "Total" legend swatch (reading like a legend header), while "Increase"
    is isolated on a separate line far to the left and "Decrease" ends up sharing
    a row with "Total" instead of a clean single-row or aligned legend'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1), matches spec.
      Chrome: Dark monospace title "waterfall-basic · pygal · anyplot.ai" centered at top; y-axis "Amount ($K)" and x-axis "Category" titles in dark ink; x-axis tick labels rotated ~25 degrees combining category name + running total (e.g. "Services ($730K)"); legend below the plot reads "Total"/"Increase"/"Decrease" with color swatches, though positioned in a scattered two-row layout that visually collides with the "Category" x-title. All chrome readable against the light background.
      Data: Two neutral dark-gray "total" bars (Q1 Revenue $500K, Net Income $387K) with white value labels; three teal-green "increase" bars (+$150K, +$80K, +$25K); three brick-red "decrease" bars (-$180K, -$120K, -$68K), each with a dark value label centered on the bar; dashed gray connector lines link consecutive bar edges. First categorical data series (Increase) is #009E73 brand green.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17), matches spec.
      Chrome: Same title/axis titles/tick labels/legend, now rendered in light tones against the dark background. Total bars flip to light gray (theme-adaptive ink token) so they remain visible on dark. Legend has the same scattered layout issue as the light render. No dark-on-dark failures observed.
      Data: Green (#009E73) and red (#AE3030) bars are pixel-identical in hue to the light render - confirms only chrome flipped, not data colors, per the theme-adaptive palette rule.
      Legibility verdict: PASS
