review:
  strengths:
  - 'Genuine waterfall geometry: an invisible spacer series in pygal.StackedBar floats
    every change bar at its exact running total, with the start and end totals rising
    from zero (C1).'
  - 'Semantic color mapping per the style guide: Increase in brand green #009E73,
    Decrease in matte red #AE3030, totals in the theme-adaptive neutral ink, and opacity="1"
    makes the fills render as the exact hex, identical in both themes.'
  - Per-point dict labels with print_labels=True put the signed delta (+$150K, -$180K)
    on each bar and the totals' values on the total bars, while the x-axis tick labels
    carry every step's running total.
  - 'Theme-adaptive chrome threads through the Style: page background, ink text and
    INK_MUTED grid (guide_stroke_color and major_guide_stroke_color), so the grid
    reads on both pages; the HTML output keeps pygal''s native hover tooltips.'
  - 'Adaptable data block: one tidy DataFrame with column constants that also title
    the axes, and the end total recomputed from the changes (500+150+80-180-120+25-68
    = 387).'
  weaknesses:
  - 'VQ-01, VQ-02 (both): the change-bar labels are drawn in dark ink to the right
    of each bar''s centre, so their ends spill past the bar edge ("+$150K", "-$120K",
    "-$180K"; in the dark render the spilled characters fall dark on the #1A1A17 page),
    "+$25K" is taller than its thin 25K bar and sits half on the page, and the dark
    ink on the #AE3030 red reads at only about 2.7:1 → keep every label inside its
    bar, or above the bar in INK, with at least 4.5:1 contrast against what lies behind
    it (light page-colored text on the red and green fills). Likely cause: print_values_position="center"
    with pygal''s StackedBar label anchor and the default value-label color.'
  - 'VQ-05 (both): the plot area fills only about the top 53 % of the canvas height,
    and an empty band of about 20 % of the height sits below the legend row, with
    about 15 % empty on the right → let the plot grow into that space (about −200
    px of bottom margin). Likely cause: margin_bottom=380 plus spacing=34.'
  - 'VQ-03 (both): the legend swatches are about 16 px squares beside 44 px legend
    text, so the Total / Increase / Decrease keys barely show their bar colors → swatches
    about the text height (about +25 px). Likely cause: pygal''s default legend_box_size
    left unchanged.'
  - 'CQ-01 (code): line 65 `class WaterfallChart(pygal.StackedBar)` holds the connector
    drawing in a Python class, which the agent chat''s validator refuses → draw the
    connectors at the top level without a class definition. Likely cause: a subclass
    overriding _plot() to reach the SVG layer.'
  - 'Suggestion: an x-axis title more telling than the generic "Category", such as
    "Income statement step".'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the canvas and plot area, not pure white.
      Chrome: monospace title "waterfall-basic · python · pygal · anyplot.ai" centred at the top in dark ink; y title "Amount ($K)" rotated on the left, x title "Category" under the rotated x tick labels ("Q1 Revenue ($500K)" … "Net Income ($387K)"), y ticks 0–700 at one size; dotted INK_MUTED horizontal grid, subtle but visible; legend row at the bottom "Total / Increase / Decrease" with small swatches. All text dark on light and readable; nothing clipped. The plot area takes only about the top half of the canvas and a wide empty band remains under the legend.
      Data: start total Q1 Revenue ($500K) and end total Net Income ($387K) as near-black #1A1A17 bars from zero with light value labels; increases (+$150K, +$80K, +$25K) in brand green #009E73 and decreases (-$180K, -$120K, -$68K) in matte red #AE3030, each floating at its running total, linked by short dashed muted connectors. The change labels are dark ink right of the bar centre: they spill past the bar edges, "+$25K" is taller than its bar, and the dark text on red has low contrast.
      Legibility verdict: PASS with defects (change-label placement and contrast on red).

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17, not pure black.
      Chrome: title, axis titles, tick labels and legend text in light ink #F0EFE8, all readable; the INK_MUTED grid shows as subtle dotted lines on the dark page; no dark-on-dark chrome.
      Data: green #009E73 and red #AE3030 identical to the light render; the totals flip to the light neutral #F0EFE8 with dark value labels (the neutral anchor is theme-adaptive by design). The change labels stay dark ink, so the characters that spill past the bar edges ("K" of "+$150K", "-$120K"; half of "+$25K") fall dark on the dark page.
      Legibility verdict: PASS with defects (spilled change-label characters dark on dark).
