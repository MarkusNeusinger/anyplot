review:
  strengths:
  - 'Semantic Imprint-palette coloring (green #009E73 for increases, red #AE3030 for
    decreases, blue #4467A3 for start/end totals) matches the spec''s explicit color
    guidance and reads clearly in both themes'
  - 'Correct arithmetic: 150000 + 50000 + 35000 - 8000 - 75000 - 22000 = 130000, matching
    the displayed Net Income bar'
  - 'Idiomatic Bokeh: ColumnDataSource + FactorRange for the categorical axis, factor_cmap
    for the categorical color mapping, and a single batched LabelSet rather than looped
    Label() calls'
  - Dashed connector segments (multi_line) between consecutive bar tops/bottoms clearly
    emphasize the cumulative flow, plus a dotted zero-baseline Span for reference
  - 'Theme-adaptive chrome is fully correct in both renders: warm off-white/near-black
    backgrounds, all text legible, identical data colors between light and dark'
  - Explicit font sizes throughout (50pt title, 42pt axis labels, 34pt ticks/legend,
    28pt data labels) with no overlap or clipping in either render
  - Realistic, neutral quarterly financial breakdown scenario with plausible relative
    magnitudes (largest cost bucket is Operating Costs, small Refunds adjustment)
    that exercises both increase and decrease bars of varying size plus distinct start/end
    totals
  weaknesses:
  - Bar labels show the per-step delta (+$50,000, -$8,000, ...) rather than a running-total
    value on intermediate bars — a defensible convention for waterfall charts, but
    the spec text literally asks for 'running total labels on or near bars'; consider
    adding the cumulative total as a smaller secondary label if this is revisited
  - Increase vs Decrease bars are primarily distinguished by green/red hue; the +/-
    prefix on the value labels and the legend mitigate this for CVD users, but there's
    no shape/pattern redundancy on the bars themselves
  - Bar edges are outlined in the page background color (3px), which visually separates
    adjoining bars at each step — a stylistic choice that slightly reduces the sense
    of continuous stacking, though the dashed connectors already carry that signal
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "waterfall-basic · python · bokeh · anyplot.ai" in bold dark text top-left, italic axis titles ("Financial Category" / "Amount ($)"), rotated (~17°) category tick labels, $-formatted y-axis ticks from $0-$250,000, legend box (Total/Increase/Decrease) top-right with dark text on a light elevated background. All chrome text is clearly readable against the light background.
      Data: 7 bars — blue "Total" bars for Starting Revenue ($150,000) and Net Income ($130,000), green "Increase" bars for Product Sales (+$50,000) and Services (+$35,000), red "Decrease" bars for Refunds (-$8,000), Operating Costs (-$75,000), and Marketing (-$22,000). Dashed gray connector lines link each bar's cumulative edge to the next, and a dotted zero-baseline is visible at y=0. First categorical/semantic series (Increase) renders in #009E73 as required.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same layout as the light render with all text switched to light/white — title, axis titles, tick labels, and legend text are all clearly legible against the dark background. No dark-on-dark or light-on-light failures observed.
      Data: Bar colors are pixel-identical to the light render (green #009E73, red #AE3030, blue #4467A3) — only the chrome (background, text, grid, legend box) flips theme, as required. Connector lines and zero-baseline remain visible and subtle against the dark background.
      Legibility verdict: PASS
