review:
  strengths:
  - Correct, idiomatic use of Plotly's native go.Waterfall trace with proper absolute/relative/total
    measure typing instead of manually stacked bars
  - Mathematically consistent, realistic finance dataset — the revenue-to-net-income
    math checks out exactly ($500,000 - $180,000 - $95,000 - $45,000 + $25,000 - $51,250
    = $153,750) with plausible margins and an ~25% effective tax rate
  - Correct Imprint palette with sound semantic mapping — brand green (#009E73) for
    increases, matte red (#AE3030) for decreases, blue (#4467A3) for totals — matching
    the style guide's finance semantic-exception guidance, applied identically across
    both theme renders
  - 'Full theme-adaptive chrome: background, title, axis labels, ticks, and grid all
    correctly flip between #FAF8F1/#1A1A17 light/dark surfaces with no dark-on-dark
    or light-on-light failures'
  - Dashed connector lines between bars clearly emphasize the cumulative flow the
    spec asks for
  weaknesses:
  - Bar text labels show only the delta amount for every relative step (e.g. "$180,000",
    "$95,000") rather than the running/cumulative total the spec explicitly asks for
    ("Display running total labels on or near bars for clarity") — only the first
    (Revenue) and last (Net Income) bars happen to show a true running total because
    they are absolute/total measures; a reader has to read the y-axis to find the
    cumulative value after each intermediate step
  - Legend shows a confusing 4th entry, "Financial Breakdown", with a garbled multi-color
    checkerboard swatch icon — this is the main go.Waterfall trace itself leaking
    into the legend (showlegend=True, legendgroup="main" on the trace), and it's redundant
    with the clean Increases/Decreases/Totals swatches from the three dummy Scatter
    traces directly below it. Set showlegend=False on the go.Waterfall trace to remove
    it.
  - Title occupies only ~35-40% of the plot width, below the ~50-70% guideline range
    for a short (no descriptive-prefix) mandated title — a modest fontsize bump (e.g.
    16px to 18-20px) would better balance it against the canvas
  - Both x- and y-axis gridlines are drawn; the style guide prefers y-axis-only gridlines
    for bar/waterfall-style charts to reduce visual noise
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Title "waterfall-basic · python · plotly · anyplot.ai" centered at top in dark ink, clearly legible. X-axis title "Category" and y-axis title "Amount ($)" both dark and legible. Tick labels (category names, $-formatted amounts) in a softer dark gray, all legible. Subtle grid lines on both axes, visible but not competing with data. Legend top-right with four rows: a garbled multi-color checkerboard icon next to "Financial Breakdown", then a green circle "Increases", red circle "Decreases", blue circle "Totals" — the first entry (the main Waterfall trace) is a confusing/redundant addition.
      Data: 7 bars — Revenue (blue, $500,000, absolute/total), Product Costs (red, -$180,000), Operating Expenses (red, -$95,000), Marketing (red, -$45,000), Other Income (green, +$25,000), Taxes (red, -$51,250), Net Income (blue, $153,750, total). First categorical/increase color is #009E73 brand green, decreases are matte red #AE3030, totals are blue #4467A3 — consistent with the Imprint palette's finance semantic exception. Dotted connector lines link the top/bottom of consecutive bars, emphasizing the cumulative flow.
      Legibility verdict: PASS — all text is clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Title, axis titles, and tick labels have flipped to light ink/gray and remain fully legible against the dark surface. Grid lines are still subtle (light, low-opacity) and visible without dominating. Legend renders the same four rows (including the same garbled "Financial Breakdown" swatch) with light-colored text, clearly legible against the dark legend background.
      Data: Bar colors are pixel-identical to the light render — brand green for increases, matte red for decreases, blue for totals — confirming only chrome (not data color) changed between themes.
      Legibility verdict: PASS — no dark-on-dark failures observed; all text and data elements are clearly distinguishable from the #1A1A17 background.
