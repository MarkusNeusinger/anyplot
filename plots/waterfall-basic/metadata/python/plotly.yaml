review:
  strengths:
  - Correct, idiomatic use of Plotly's native go.Waterfall trace with proper absolute/relative/total
    measure typing
  - Bar labels now show both the delta AND the running/cumulative total, satisfying
    the spec's explicit requirement — fixed from attempt 1
  - Legend is now clean (Increases/Decreases/Totals only) after setting showlegend=False
    on the main Waterfall trace — the garbled 4th entry from attempt 1 is gone
  - Gridlines restricted to y-axis only per style guide, improving visual refinement
    over attempt 1
  - Mathematically consistent, realistic finance dataset ($500,000 revenue to $153,750
    net income) with plausible margins and tax rate
  - Correct Imprint palette with sound semantic mapping (green=increase, red=decrease,
    blue=totals), theme-adaptive chrome fully correct in both renders
  weaknesses:
  - Title still occupies only ~44% of plot width (improved from ~35-40% but still
    below the ~50-70% guideline for a short, non-prefixed title)
  - Design Excellence still reads largely as a well-configured plotly_white template
    — no custom palette treatment or additional polish beyond the semantic color mapping
  - Data skews heavily toward decreases (5 of 6 relative steps are negative, only
    1 positive) — a more balanced mix would better demonstrate the plot type's ability
    to show both directions
