review:
  strengths:
  - 'Excellent theme-adaptive chrome: both renders are fully readable, backgrounds
    correctly match #FAF8F1 (light) / #1A1A17 (dark), and all text/grid/spine colors
    flip correctly with no dark-on-dark or light-on-light failures'
  - 'Correct Imprint semantic color mapping: brand green #009E73 for increases, matte
    red #AE3030 for decreases, blue #4467A3 for start/end totals — a well-justified
    semantic exception (finance profit/loss convention) rather than arbitrary custom
    hexes'
  - 'All spec-required waterfall features present: dashed connecting lines between
    consecutive bars, visually distinct start/end total bars, and value labels on
    every bar'
  - 'Data is arithmetically correct and realistic: 100,000 + 150,000 - 25,000 - 60,000
    - 30,000 - 18,000 = 117,000 matches the plotted Net Profit bar exactly'
  - Title fontsize correctly scaled down (10pt) for the long descriptive+mandated
    title string, avoiding overflow while still filling a sensible proportion of the
    canvas width
  - Clean KISS code structure with deterministic data, correct save call (bbox_inches
    left at default None, dpi=400, plot-{THEME}.png naming)
  weaknesses:
  - 'seaborn is barely used as a library: the only seaborn call in the entire file
    is sns.set_theme() (a global rc/styling call). Every chart element — bars, connecting
    lines, value labels, tick placement — is built with raw matplotlib (ax.bar(),
    ax.plot(), ax.text(), ax.set_xticks()). prompts/quality-criteria.md''s AR-05 table
    explicitly calls out ''Only sns.set_style()'' as NOT sufficient seaborn usage,
    and sns.set_theme() is the direct successor to set_style()/set_context()/set_palette()
    — it falls in the same category. Incorporate an actual seaborn plotting/utility
    call (e.g. sns.despine() instead of manually toggling ax.spines[...].set_visible(),
    or sns.color_palette() to source the Imprint hexes, or sns.barplot() for at least
    the non-floating portions) so the implementation demonstrably uses the library
    it''s supposed to showcase.'
  - No legend or key clarifies the green/red/blue color convention (increase/decrease/total)
    — a first-time viewer must infer it. A compact 3-entry legend would remove the
    ambiguity.
  - Bar labels show the per-step delta value (e.g. '$-25,000') rather than the spec's
    requested 'running total' label for intermediate bars — a defensible readability
    choice, but a literal deviation from the spec wording.
