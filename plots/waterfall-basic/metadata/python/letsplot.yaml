review:
  strengths:
  - 'Connector-line anchor bug from attempt 1 is fully fixed: every dashed connector
    now touches both the bar it leaves and the bar it enters in both light and dark
    renders, restoring the waterfall''s core cumulative-flow narrative'
  - Correct, theme-adaptive Imprint palette use with a well-justified semantic exception
    (green=increase, matte red=decrease, blue=totals) matching both the palette's
    semantic-exception rules and the spec's own suggested convention
  - Explicit font sizing matching the style guide's scale-based defaults exactly (title
    16px / axis 12px / ticks 10px), fully legible in both themes with no dark-on-dark
    or light-on-light failures
  - layer_tooltips() surfaces the running total on hover in the HTML export, a lets-plot-specific
    interactive complement to the static labels
  - Clean, fully deterministic, flat KISS script with correct dual PNG+HTML output
    at the exact 3200x1800 landscape canvas target
  weaknesses:
  - Composition remains fairly plain beyond the semantic color mapping and bordered
    bars - no additional typographic hierarchy or focal-point treatment (e.g. emphasizing
    the Net Profit bar) to lift Design Excellence further
  - Distinctive Features (LM-02) usage is limited to layer_tooltips(); no other lets-plot-specific
    capability (e.g. custom scale transforms, additional grammar layers) is showcased
