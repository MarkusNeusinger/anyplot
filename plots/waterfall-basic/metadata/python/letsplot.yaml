review:
  strengths:
  - Correct, theme-adaptive Imprint palette use with a well-justified semantic exception
    (green=increase, matte red=decrease, blue=totals) matching both the palette's
    semantic-exception rules and the spec's own suggested convention
  - Explicit font sizing matching the style guide's scale-based defaults exactly (title
    16px / axis 12px / ticks 10px), fully legible in both themes with no dark-on-dark
    or light-on-light failures
  - layer_tooltips() surfaces the running total on hover in the HTML export - a lets-plot-specific
    interactive complement to the static labels
  - Clean, fully deterministic, flat KISS script with correct dual PNG+HTML output
  weaknesses:
  - The dashed connector line after every decrease bar is anchored to the bar's ymax
    (pre-decrease level) instead of ymin (post-decrease level), so it floats one bar-height
    above the next bar instead of touching it - breaks the connector for 3 of 6 transitions
    (Operating Costs->Marketing, Marketing->Taxes, Taxes->Net Profit) in both light
    and dark renders, confirmed by pixel inspection
  - Design Excellence is held back mainly by the connector-line bug, which directly
    undercuts the 'cumulative flow' storytelling that is the core value of a waterfall
    chart
  - Overall composition is correct and clean but fairly plain; could use slightly
    bolder typographic hierarchy or subtle background treatment to lift it toward
    publication-ready
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white, matches #FAF8F1
      Chrome: title "waterfall-basic · python · letsplot · anyplot.ai" in dark ink, y-axis "Amount ($)" with $-formatted ticks, x-axis category labels rotated ~30°, "Change Type" legend (Increase/Decrease/Total) at right - all clearly readable
      Data: Starting Balance/Net Profit = blue (#4467A3) total bars; Product Sales/Service Revenue = green (#009E73) increase bars; Operating Costs/Marketing/Taxes = matte red (#AE3030) decrease bars; bold dark value labels centered in each bar; dashed connector lines between bars
      Legibility verdict: PASS (all text readable against light background; no light-on-light issues)

    Dark render (plot-dark.png):
      Background: warm near-black, matches #1A1A17
      Chrome: same layout with title/axis/tick text flipped to light cream, value labels flipped from black to white, gridlines/borders light gray, legend uses dark elevated surface - all clearly readable, no dark-on-dark failures
      Data: identical green/red/blue data colors to light render, confirmed pixel-identical
      Legibility verdict: PASS (all text readable against dark background; no dark-on-dark failures)

    Defect found identically in both renders: dashed connector lines after decrease bars (Operating Costs->Marketing, Marketing->Taxes, Taxes->Net Profit) are anchored to the wrong bar edge (ymax instead of ymin) and float disconnected above the next bar - verified by pixel-cropping both PNGs.
