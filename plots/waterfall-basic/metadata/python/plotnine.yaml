review:
  strengths:
  - 'Correct semantic color exception for finance data: increases in brand green (#009E73),
    decreases in matte red (#AE3030), with totals rendered in the theme-adaptive neutral
    ink so they read as structural anchors rather than a third arbitrary hue.'
  - Triple-redundant encoding of sign (color + vertical bar direction from the running
    total + explicit '+450'/'-280' labels) avoids relying on red/green alone as the
    sole distinguishing signal.
  - 'Refined, minimal chrome: L-shaped/removed spines, single subtle y-axis gridline
    (alpha 0.15), boxed top legend, and correct theme-adaptive tokens (PAGE_BG/INK/INK_SOFT)
    applied consistently across both renders.'
  - Title fontsize scaling formula correctly compresses the long descriptive+mandated
    title so it fits without overflow or clipping in either theme.
  - Data is internally consistent (1000+450-280-120-150=900) and tells a plausible,
    neutral quarterly financial narrative with both an increase and multiple decreases
    plus start/end totals.
  weaknesses:
  - 'Connector-line height bug: the loop always uses df.iloc[i]["end"] as the bridging
    y-value, but for a decrease bar "end" is the bar''s pre-change (higher) value,
    not the new running total — the code should use "start" instead when bar_types[i]
    == "negative". This makes the Operating Costs -> R&D Investment and R&D Investment
    -> Tax Payment connectors float at the wrong height, disconnected from the next
    bar''s top, in both renders.'
  - The `if i < len(df) - 2` guard drops the final connector (Tax Payment -> Ending
    Balance) entirely, so one gap has no connecting line at all, while the very first
    gap (Starting Balance -> Q1 Sales) does have one — inconsistent connector coverage
    across the chart.
  - Legend order (Decrease, Increase, Total) reads slightly unnaturally — reordering
    to Increase, Decrease, Total (or setting an explicit factor order on bar_type)
    would flow better, though this is a minor polish nit, not a correctness issue.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "Quarterly Financial Summary · waterfall-basic · python · plotnine · anyplot.ai" is bold dark ink, fully readable. Y-axis "Amount ($1K)" and tick labels (0/500/1000/1500) are dark/soft-dark and legible. X-axis category labels are rotated ~45°, soft-dark ink, all readable without overlap. Legend "Change Type" (Decrease / Increase / Total) sits boxed at top, dark text on cream box, clearly readable. A single subtle horizontal gridline set is visible without competing with data.
      Data: First/last bars (Starting Balance, Ending Balance) render in near-black ink (theme-adaptive neutral/total color). Q1 Sales renders in brand green (#009E73). Operating Costs, R&D Investment, and Tax Payment render in matte red (#AE3030). Dashed gray connector lines bridge some but not all bar boundaries (see weaknesses — two connectors float at the wrong height and one gap has none at all). Value labels (+450, -280, -120, -150, and plain totals) sit just above/below each bar without overlapping text or bars.
      Legibility verdict: PASS — all text is clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Title, axis labels, and tick labels all render in light/off-white ink, clearly readable against the dark surface. Legend box is dark with light text, readable. X-axis rotated category labels are legible, no dark-on-dark failures observed.
      Data: Q1 Sales is still brand green (#009E73) and the decrease bars are still matte red (#AE3030) — identical hex values to the light render, confirming only chrome flipped. Starting Balance/Ending Balance totals now render in near-white (theme-adaptive neutral flips light-on-dark), correctly keeping the "total" bars distinct from the green/red change bars while staying part of the structural/ink layer in each theme. The same connector-line placement issue from the light render is reproduced identically here (deterministic bug, not theme-dependent).
      Legibility verdict: PASS — no dark-on-dark text; brand green and matte red both remain clearly visible against the dark surface.
