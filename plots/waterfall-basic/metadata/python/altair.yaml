review:
  strengths:
  - 'Correct waterfall mechanics: running totals, bar_bottom/bar_top offsets, and
    connector-line y-positions are all mathematically consistent across all 7 steps
    in both renders'
  - 'Semantic color mapping is well justified: green (#009E73) for gains and matte
    red (#AE3030) for losses match the style guide''s explicit Finance semantic exception,
    and blue (#4467A3) for total/subtotal bars matches the spec''s own note (''often
    in a different color like blue or gray'') — and it''s redundantly encoded via
    bar position (up/down) and the +/- text prefix, not color alone'
  - 'Clear typographic hierarchy: bold/larger (13px) labels on total bars vs. regular/smaller
    (11px) labels on delta bars, with per-fill text color chosen for contrast (white
    on blue/red, ink on green)'
  - Both renders are pixel-exact on the canonical 3200x1800 canvas and theme tokens
    (PAGE_BG/INK/INK_SOFT) are threaded through axis, title, and configure_* consistently
    — no dark-on-dark or light-on-light failures
  - Dashed connector rules (mark_rule with strokeDash) correctly link each bar's running
    total to the next, reinforcing the cumulative-flow story required by the spec
  - Right spine is absent (no vertical border on the right edge) and grid is subtle
    (opacity 0.12), giving a reasonably clean L-shaped frame
  weaknesses:
  - 'The starting ''Revenue'' total bar displays ''+$500'' (with a ''+'' prefix) while
    the other two total bars show plain totals (''Gross Profit'' -> ''$300'', ''Net
    Income'' -> ''$130''). Root cause: display_values (implementations/python/altair.py
    ~lines 61-68) branches on `values[i] is None` to decide ''total'' formatting,
    but values[0]=500 is not None, so it falls into the positive-delta branch (f''+${int(val)}'')
    even though bar_types[0]=''total''. Fix: format using running_total[i] (plain
    ''$'') whenever bar_type==''total'', matching the other two total bars.'
  - That extra '+' character makes the Revenue label ~140px wide against a ~107px-wide
    bar (measured on the saved PNG) — the label text visibly overflows the bar's left
    and right edges by ~16px on each side into the background, unlike '$300'/'$130'
    which sit flush inside their bars. Purely cosmetic (stays within the canvas/axis
    bounds, no AR-09 clipping), but noticeable proportional inconsistency — fixing
    the label text above will also fix this.
  - No legend or on-chart note explains what green/red/blue mean; a first-time viewer
    must infer semantics from the +/- prefixes and category names alone. Not a spec
    violation (single-series-style legends are optional per the style guide), but
    a small caption or compact legend would strengthen SC-04/DE-03 clarity given three
    semantically distinct colors are in play.
  - 'Design Excellence is solid but not exceptional: the overall composition (colored
    bars + dashed connectors + text labels) is a fairly conventional waterfall treatment.
    Consider a stronger focal-point technique for the repair pass — e.g. a subtle
    rule/annotation calling out the final net-margin percentage, or slightly more
    generous spacing between bars — to push Data Storytelling and Aesthetic Sophistication
    further above the default look.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, sampled pixel (250,248,241) = #FAF8F1 exactly — correct, not pure white.
      Chrome: Bold dark title "waterfall-basic · python · altair · anyplot.ai" centered at top, fully visible, not clipped. Y-axis title "Amount ($)" bold dark, rotated. X-axis title "Category" bold dark. Tick labels (category names, rotated -20°, and numeric y-ticks) in soft dark gray — all clearly legible. Grid lines are faint horizontal gray lines, subtle but visible.
      Data: 7 bars — Revenue (blue, total), Cost of Goods (red, -$200), Gross Profit (blue, total, $300), Operating Expenses (red, -$150), Other Income (green, +$25), Taxes (red, -$45), Net Income (blue, total, $130). First non-total series (Other Income, the only "positive" delta type) is #009E73 brand green; losses are matte red #AE3030; totals are blue #4467A3. Dashed gray connector lines correctly link each bar's cumulative level to the next. Data labels are white/bold on blue and red fills, dark ink on the green fill — all readable. One proportion issue: the "+$500" label on the Revenue bar is visibly wider than the bar itself, overflowing ~16px past each edge into the background (see weaknesses).
      Legibility verdict: PASS (all chrome and data labels readable; the Revenue label overflow is a proportion/consistency issue, not a legibility failure).

    Dark render (plot-dark.png):
      Background: Warm near-black, sampled pixel (26,26,23) = #1A1A17 exactly — correct, not pure black.
      Chrome: Title, axis titles, and tick labels all flip to light tones (white/light-gray) and remain fully readable against the dark background — no dark-on-dark instances found. Grid lines remain faint and visible.
      Data: Identical bar colors to the light render — blue #4467A3 (totals), red #AE3030 (losses), green #009E73 (gains) — confirming the Imprint data colors are theme-invariant; only chrome flipped as required. Same "+$500" overflow issue reproduces identically (layout is theme-independent).
      Legibility verdict: PASS (all chrome and data text legible in dark theme; same cosmetic overflow noted above, not a legibility failure).
