review:
  strengths:
  - Financial waterfall data is fully self-consistent — 850+320+180-95-410-145=700
    checks out exactly against the displayed Net Profit total, and the scenario (quarterly
    revenue → net profit) is realistic and neutral.
  - 'Color assignment (green=Increase, red=Decrease, blue=Total) is a well-justified
    semantic exception to the literal ''first series = #009E73'' rule — it matches
    the spec''s own guidance (''green for positive ... blue or gray'' for totals)
    and universal financial-chart convention, while every color still comes from the
    Imprint palette.'
  - 'Idiomatic ECharts waterfall technique: invisible stacked base bar + colored delta/total
    bars + dashed step-line connector is exactly the community-standard pattern for
    building a waterfall in ECharts (which has no native waterfall series) — clean
    code, no fake interactivity.'
  - 'Both light and dark renders are fully theme-correct: identical data colors, warm
    off-white/near-black backgrounds, and no dark-on-dark or light-on-light text failures.'
  - +/- sign prefixes on bar labels supplement the green/red color coding, avoiding
    a pure red-green-only distinguishing signal.
  weaknesses:
  - 'Design Excellence reads as ''well-executed default'' rather than exceptional:
    the final Net Profit bar uses the exact same blue as Starting Revenue with no
    additional emphasis, and grid/whitespace are functional but not meticulously refined.
    Consider a subtle accent on the ending total (border highlight, slightly bolder
    label) and tighter grid styling for a more publication-ready feel.'
  - Bar labels show per-step delta values (+$320k, -$95k) rather than literal 'running
    total' figures the spec calls out ('Display running total labels on or near bars
    for clarity'). Deltas are a valid, common waterfall convention, but adding a small
    secondary running-total figure near each bar would more literally satisfy the
    spec wording.
  - Title occupies only ~30% of canvas width at fontSize 22 — noticeably smaller than
    the ~50-70% comfortable range for a title this length, giving a slightly sparse
    header relative to the legend row beneath it. Not a hard defect (no overflow/clipping),
    but a modest fontSize bump (24-26) would improve visual balance.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 (not pure white, not dark).
      Chrome: Title "waterfall-basic · javascript · echarts · anyplot.ai" centered in dark ink text; legend row (Total=blue swatch, Increase=green swatch, Decrease=red swatch) below the title; y-axis title "Amount ($ thousands)" top-left; y-axis ticks $0k-$1,500k; x-axis category labels (Starting Revenue, Product Sales, Service Revenue, Returns & Discounts, Operating Costs, Taxes, Net Profit) all in soft dark ink. All fully readable.
      Data: First (Starting Revenue) and last (Net Profit) bars are blue (Imprint palette[2], #4467A3); Product Sales and Service Revenue bars are brand green (#009E73); Returns & Discounts, Operating Costs, and Taxes bars are red (#AE3030). Dashed gray connector line steps between each bar top to the next. Delta/total labels (e.g. "$850k", "+$320k", "-$95k") sit directly above each bar.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 (not pure black, not light).
      Chrome: Same title, legend, axis title, ticks and category labels, all rendered in light/soft-white ink against the dark background. Grid lines are faint but visible. No dark-on-dark text anywhere.
      Data: Bar colors are pixel-identical to the light render (blue Total, green Increase, red Decrease) — only the chrome (background, text, grid, dashed connector color) adapted to the dark theme.
      Legibility verdict: PASS
