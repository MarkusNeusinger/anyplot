review:
  strengths:
  - 'Fixed all three attempt-1 weaknesses: added running-total sub-labels ("Total:
    $Xk") beneath each delta label, added a dark-ink border + bold larger label to
    accent the ending Net Profit bar as a focal point, and bumped the title fontSize
    from 22 to 26.'
  - Data is internally consistent (850+320+180-95-410-145=700) and the quarterly revenue-to-net-profit
    scenario is realistic and neutral.
  - Green/red/blue semantic-exception coloring (Increase/Decrease/Total) is well-justified
    by the spec's own guidance and universal finance-chart convention, while every
    hue still maps onto the Imprint palette; both renders are fully theme-correct
    with identical data colors.
  - Idiomatic ECharts waterfall technique (invisible stacked base + colored delta/total
    bars + dashed step-line connector) is the standard community pattern given ECharts
    has no native waterfall series.
  weaknesses:
  - 'The dashed step-line connector cuts vertically through the middle of each transition
    bar instead of tracing the bar''s top edge: the connector line series sits at
    category-center x-coordinates with step:''end'', so the vertical jump lands inside
    the next bar rather than at the boundary between bars. Visible on Product Sales,
    Service Revenue, Returns & Discounts, Operating Costs, and Taxes in both light
    and dark renders. Fix: anchor the connector to bar-edge coordinates (e.g. a markLine/graphic
    per boundary, or offset the line series so its step happens in the gap between
    bars) so the dashed segments trace bar tops and only jump in the whitespace between
    bars.'
  - Design Excellence still reads as 'well-executed default plus one accent' rather
    than exceptional — grid, spacing, and typography are functional but not meticulously
    refined beyond the Net Profit callout.
  - 'LM-02: the waterfall technique, while correctly executed, is a well-known cross-library
    workaround (the same invisible-stacked-bar + line pattern used in matplotlib/plotly
    waterfalls) rather than something that showcases an ECharts-distinctive capability.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "waterfall-basic · javascript · echarts · anyplot.ai" centered at fontSize 26 in dark ink; legend row (Total/Increase/Decrease swatches) below it; y-axis title "Amount ($ thousands)" top-left with $0k-$1,800k ticks; seven x-axis category labels (Starting Revenue -> Net Profit). All rendered in dark ink/soft-ink, clearly legible against the light background. Subtle horizontal split lines only, no vertical grid, axis lines hidden.
      Data: Blue (#4467A3, Imprint palette[2]) marks the Starting Revenue and Net Profit total bars — the Net Profit bar additionally has a dark-ink 2.5px border and a bold 17px label ("$700k") to emphasize the ending total. Green (#009E73, palette[0]) marks increases, matte red (#AE3030, palette[4]) marks decreases. Each bar has a delta/sign label ("+$320k", "-$95k", ...) plus a smaller running-total sub-label ("Total: $1,170k", ...). A gray dashed step-connector links bar tops to show cumulative flow.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title, legend, axis title, ticks and category labels, now rendered in light/soft-white ink. All fully legible; no dark-on-dark failures found on any title, label, or tick.
      Data: Data colors (blue/green/red, plus the Net Profit border/label accent) are pixel-identical to the light render — only chrome (background, text, grid) flipped for the theme, as required.
      Legibility verdict: PASS

    Cross-render note: both renders show the same visual defect — the dashed connector line's vertical step segment cuts through the middle of each transition bar (Product Sales, Service Revenue, Returns & Discounts, Operating Costs, Taxes) rather than tracing the bar's top edge, because the underlying line series is anchored to category-center x-coordinates. This is a visual-refinement flaw, not a legibility or theme-correctness failure — it does not obscure any text and is identical in both themes.
