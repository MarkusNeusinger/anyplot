review:
  strengths:
  - 'Correct Imprint palette with a well-justified semantic exception: green (#009E73)
    for increases, matte red (#AE3030) for decreases, and the theme-adaptive neutral/ink
    token for totals — matches the style guide''s documented ''totals/baseline'' role
    for the neutral anchor'
  - 'Theme-adaptive chrome is fully correct in both renders: light background #FAF8F1
    with dark text, dark background #1A1A17 with light text, and the data colors are
    pixel-identical across themes'
  - Accurate waterfall float logic — dashed connector lines align exactly with each
    bar's cumulative level; verified arithmetic (850 - 320 - 180 - 95 - 60 - 45 +
    25 = 175) matches the displayed Net Profit total
  - Clean KISS structure with deterministic hardcoded data, correct mount-node/API
    contract, no animations, rounded bar corners and a manually built legend add visual
    polish
  - No edge clipping — title, legend, and rotated x-axis labels all sit comfortably
    inside the canvas with generous margins
  weaknesses:
  - Intermediate change bars label the step delta (e.g. '-320K') rather than an explicit
    running-total figure; only the first and last total bars show the cumulative value
    directly — a minor deviation from the spec note 'display running total labels
    on or near bars'
  - At the ~400px mobile thumbnail width, the eight rotated x-axis category labels
    compress and become harder to read
  - No explicit annotation calls out the largest driver of the decline (Cost of Goods
    Sold, -320K), which would sharpen the data story further
  - D3-distinctive features are present but modest (manual cumulative-flow computation,
    hand-built connector lines) rather than something like transitions or a bespoke
    interactive overlay in the HTML output
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "Quarterly Revenue Bridge · waterfall-basic · javascript · d3 · anyplot.ai" in bold dark ink, clearly legible. Y-axis label "Amount ($K)" and tick labels ($0K-$1,000K) in dark ink, fully readable. X-axis category labels ("Starting Revenue", "Cost of Goods Sold", "Operating Expenses", "R&D Investment", "Marketing Spend", "Tax Adjustment", "Other Income", "Net Profit") rotated -30°, dark text, fully readable and non-overlapping. Legend (Increase / Decrease / Total swatches) top-right, readable.
      Data: 8 bars forming a waterfall — black "Starting Revenue" ($850K) and "Net Profit" ($175K) total bars, five red decrease bars (-320K, -180K, -95K, -60K, -45K), one green increase bar (+25K). First categorical (increase) series is #009E73 as required. Dashed gray connector lines link each bar's cumulative level to the next. Value labels sit just above each bar.
      Legibility verdict: PASS — all text is clearly readable against the light background, no dark-on-light or light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Title, axis labels, and tick labels all render in light/off-white text, clearly legible against the dark surface. The two total bars ("Starting Revenue", "Net Profit") flip from black to a light near-white fill (theme-adaptive neutral/ink token) — correct chrome behavior, not a data-color change. Grid lines and axis domain lines are subtle but visible.
      Data: Green increase bar and red decrease bars are pixel-identical in hue to the light render (#009E73 green, #AE3030 red) — only the total-bar neutral tone and all chrome flipped, as required.
      Legibility verdict: PASS — no dark-on-dark failures observed; all text (title, axis labels, tick labels, legend, value labels) is clearly visible against the near-black background.
