review:
  strengths:
  - Correctly hand-builds a waterfall from stacked columns + custom SVG connector
    lines (chart.renderer.path) since the core Highcharts bundle lacks the native
    waterfall series — the connector math was verified accurate at every step (500
    → 850 → 1000 → 780 → 600 → 570 → 500).
  - 'Excellent semantic color usage: Increase/Decrease correctly use the Imprint green/red
    semantic-exception pair (palette[0] and palette[4] = matte red, matching the style
    guide''s documented ''profit/up→green, loss/down→red'' finance exception), and
    Total bars use the theme-adaptive neutral ink anchor.'
  - Total bar and its data-label color both automatically flip per theme (t.ink /
    t.pageBg) so the bars read as dark-on-cream in light mode and cream-on-dark in
    dark mode without any hardcoded branching — a genuinely elegant technical solution.
  - Both renders are fully legible with no dark-on-dark/light-on-light failures, no
    edge clipping, and no text/element overlap; dashed connector lines are subtle
    and correctly themed via t.inkSoft.
  weaknesses:
  - Spec note 'Display running total labels on or near bars for clarity' is only partially
    satisfied — intermediate bars label the step delta (e.g. '+$350') rather than
    the cumulative running total after that step; the dashed connector communicates
    the level visually but there's no numeric running-total label on middle bars.
  - 'Top-level `colors: t.palette` is set on the chart config but never actually used,
    since every series (Base, Increase, Decrease, Total) specifies its own explicit
    `color` — dead configuration that could be removed.'
  - 'Design Excellence is solid but could go further: no annotation calling out the
    net change from Starting Balance to Net Profit, and typography stays at standard
    style-guide defaults without additional hierarchy.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "waterfall-basic · javascript · highcharts · anyplot.ai" in bold dark text, subtitle "Quarterly financial breakdown — revenue to net profit" in soft gray, Y-axis title "Amount ($ thousands)" rotated on the left, dark x-axis category labels (Starting Balance, Product Revenue, Service Revenue, COGS, Operating Expenses, Interest Expense, Tax Adjustment, Net Profit), subtle horizontal gridlines, legend at bottom (Increase / Decrease / Total). All chrome elements are clearly legible against the light background.
      Data: Starting Balance and Net Profit are dark/black "Total" bars with white "$500" labels inside; Product Revenue and Service Revenue are brand-green "Increase" bars (#009E73) with dark "+$350"/"+$150" labels; COGS, Operating Expenses, Interest Expense, and Tax Adjustment are matte-red "Decrease" bars with dark "−$220"/"−$180"/"−$30"/"−$70" labels. Dashed gray connector lines correctly bridge each bar's top/bottom to the next bar's starting level, visually tracing the cumulative flow from 500 up to 1000 and back down to 500.
      Legibility verdict: PASS — all text is clearly readable, no dark-on-dark or light-on-light issues, no clipping at any edge.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Title and axis title in light/white text, subtitle and tick labels in soft light gray, gridlines subtle, legend readable at bottom. All chrome elements are clearly legible against the dark background.
      Data: Increase (green) and Decrease (red) bars are pixel-identical in hue to the light render, confirming data colors do not shift with theme. The Total bars (Starting Balance, Net Profit) flip to an off-white/cream fill (theme-adaptive neutral ink) with dark "$500" labels — correctly maintaining contrast rather than staying black-on-black. Connector dashed lines render in light gray, clearly visible against the dark background.
      Legibility verdict: PASS — no dark-on-dark failures found; the Total bars' automatic light-fill flip is the key adaptive-design detail that keeps them legible in this theme.
