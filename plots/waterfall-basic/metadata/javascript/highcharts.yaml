review:
  strengths:
  - Correctly hand-builds a waterfall from stacked columns plus a custom SVG connector-line
    layer (chart.renderer.path in a render event) since the core Highcharts bundle
    lacks the native waterfall series — connector heights verified accurate at every
    cumulative step (500 -> 850 -> 1000 -> 780 -> 600 -> 570 -> 500).
  - 'Excellent semantic color usage: Increase/Decrease bars use the Imprint green/red
    semantic-exception pair (palette[0] brand green, palette[4] matte red), matching
    the style guide''s documented finance profit/loss exception; Total bars use the
    theme-adaptive ink anchor.'
  - Total bar fill and its data-label color both automatically flip per theme (t.ink
    / t.pageBg), so Starting Balance/Net Profit read as dark-on-cream in light mode
    and cream-on-dark in dark mode without hardcoded per-theme branching.
  - 'Both renders are fully legible with no dark-on-dark/light-on-light failures,
    no edge clipping, and no text/element overlap; dead top-level `colors: t.palette`
    config from the prior attempt was correctly removed since every series sets its
    own explicit color.'
  weaknesses:
  - 'Code/render mismatch: this attempt''s commit added `fmtChangeWithRunningTotal`
    so intermediate bar labels should read e.g. ''+$350 -> $850'', but both plot-light.png
    and plot-dark.png still show only the bare step delta (''+$350'', ''+$150'', etc.)
    with no arrow or running-total figure anywhere near the bar. The source change
    did not visibly take effect in either render -- verify the harness actually rebuilt
    against the latest commit, and re-check the dataLabels formatter/point.custom
    wiring if it did.'
  - Because the running-total label fix did not visually land, the spec note 'Display
    running total labels on or near bars for clarity' is still only partially satisfied
    for intermediate bars -- the dashed connector marks the level visually but there
    is no numeric confirmation on those bars.
  - 'Design Excellence is solid but not exceptional: no annotation calling out the
    net change from Starting Balance to Net Profit, and typography stays at standard
    style-guide defaults without extra hierarchy.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 -- not pure white, not dark.
      Chrome: Title "waterfall-basic · javascript · highcharts · anyplot.ai" in bold dark text (~32% of canvas width -- proportionate for this short spec-id, no overflow), subtitle "Quarterly financial breakdown — revenue to net profit" in soft gray, Y-axis title "Amount ($ thousands)" rotated on the left, dark x-axis category labels for all 8 steps, subtle horizontal gridlines, legend at bottom (Increase / Decrease / Total). All chrome is clearly legible against the light background; no clipping at any edge (verified y-axis tick labels and Net Profit total bar are fully visible up to the right canvas edge).
      Data: Starting Balance and Net Profit are dark/black "Total" bars with white "$500" labels; Product Revenue and Service Revenue are brand-green (#009E73) "Increase" bars labeled "+$350"/"+$150"; COGS, Operating Expenses, Interest Expense, Tax Adjustment are matte-red "Decrease" bars labeled "−$220"/"−$180"/"−$30"/"−$70". Dashed gray connector lines correctly bridge each bar to the next at the right cumulative height. NOTE: despite the source code's `fmtChangeWithRunningTotal` helper, none of the intermediate bar labels actually show the "-> $cumulative" suffix in the rendered PNG -- only the bare delta is visible even under 2x zoom crops.
      Legibility verdict: PASS -- all text clearly readable, no dark-on-dark/light-on-light issues, no clipping.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 -- not pure black, not light.
      Chrome: Title/axis title in light text, subtitle and tick labels in soft light gray, gridlines subtle, legend readable at bottom. All chrome legible against the dark background.
      Data: Increase (green) and Decrease (red) bars are pixel-identical to the light render, confirming data colors are theme-constant. Total bars flip to an off-white/cream fill with dark "$500" labels (theme-adaptive ink/pageBg swap), avoiding a black-on-black failure. Connector lines render in light gray, clearly visible. Same running-total-label mismatch as the light render: bars show only the delta, not the intended "delta -> cumulative" string.
      Legibility verdict: PASS -- no dark-on-dark failures found.
