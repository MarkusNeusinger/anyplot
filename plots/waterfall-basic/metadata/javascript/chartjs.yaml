review:
  strengths:
  - 'Correct semantic color usage: brand green (#009E73) for increases, matte red
    (#AE3030) for decreases (Imprint semantic exception for gain/loss), and theme-adaptive
    ink (neutral anchor) for total bars — exactly matches the style guide''s recommended
    semantic mapping'
  - Dashed connector lines between consecutive bars clearly visualize the cumulative
    flow, and running-total value labels are placed intelligently above or below each
    bar depending on direction
  - Clean, deterministic in-memory data with a realistic, neutral warehouse-inventory
    scenario covering both large and small increases/decreases plus two distinct total
    bars
  - Custom Chart.js plugin (afterDatasetsDraw) is the correct idiomatic approach given
    Chart.js has no native waterfall type — floating-bar [lo, hi] data pairs plus
    manual connectors and labels
  - 'Both renders are fully theme-correct: legible text, correct backgrounds (#FAF8F1
    / #1A1A17), identical data colors across themes'
  weaknesses:
  - Value labels and tick labels are relatively small (14px CSS mount space) — could
    be nudged slightly larger to strengthen legibility at the ~400px mobile-thumbnail
    scale
  - No subtle edge stroke on bars; the matte-red decrease bars sit below the 3:1 WCAG
    contrast threshold on the cream background per the style guide's optional-outline
    note — a thin ink-colored stroke would add definition
  - Design is very well executed and correct but stops short of an extra storytelling
    touch (e.g. a subtle emphasis on the single largest driver of the net change)
    beyond the inherent waterfall structure
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "waterfall-basic · javascript · chartjs · anyplot.ai" in bold dark ink, fully visible with no clipping. X-axis title "Inventory Event" and Y-axis title "Units in Stock" both in dark ink, readable. Tick labels (category names and y-axis numbers) in a slightly lighter ink, all legible. Legend ("Increase", "Decrease", "Total") sits above the plot area with clear swatches. Subtle horizontal gridlines only, low opacity, do not compete with data.
      Data: 8 floating bars — green (#009E73) for increases (Restock A, Restock B, Returns), matte red (#AE3030) for decreases (Online Orders, Retail Orders, Damaged Stock), and near-black ink for the two total bars (Starting Stock, Ending Stock). Dashed connector lines link the top/bottom of each bar to the next, and bold running-total value labels (e.g. "1,200", "1,650", "1,950" ... "1,070") are placed above or below each bar depending on whether the cumulative total rose or fell.
      Legibility verdict: PASS — all text is clearly readable against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title, axis titles, and tick labels now rendered in light/cream ink, fully legible against the dark surface. Legend swatches for "Total" flip to a light cream fill matching the ink token, consistent with the total-bar color in this theme. Gridlines remain subtle.
      Data: Identical green (#009E73) and matte red (#AE3030) data colors as the light render — confirmed unchanged. Total bars flip from near-black to near-white ink, which is the expected theme-adaptive "neutral" behavior, not a data-color change.
      Legibility verdict: PASS — no dark-on-dark failures observed; all title, axis, tick, and value-label text is clearly visible against the dark background.
