review:
  strengths:
  - 'Idiomatic MUI X waterfall: a transparent stacked base series lifts each change
    bar to the previous running total inside one stack'
  - Connectors drawn with useXScale/useYScale in data coordinates, so they meet the
    bar edges exactly at the shared running total in both themes
  - Running total label on every bar, with label ink chosen per fill by relative luminance
    so it stays readable on green, red and blue
  - Closing balance computed from the start plus all changes (143K checks out), so
    the bridge always closes
  - 'Semantic Imprint roles: green gains, matte red losses, blue totals; chrome threaded
    from ANYPLOT_TOKENS and readable in light and dark'
  - Tooltips and hover highlighting remain available in the interactive HTML
  weaknesses:
  - 'Suggestion: give the invisible ''base'' series an explicit valueFormatter returning
    null (or hide it from the tooltip) so the interactive HTML tooltip does not list
    an unlabelled base segment.'
  - 'Suggestion: place each change bar''s running-total label at the bar end the next
    connector leaves from, so the label sits on the line the reader follows.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole canvas, no white panel.
      Chrome: bold dark title "waterfall-basic · javascript · muix · anyplot.ai" centered at top, a muted subtitle "5 changes from Opening Balance to Closing Balance · bar labels: running total", a horizontal legend (Increase / Decrease / Total) below it; y axis "Cash (USD)" with ticks 0 to 260K in 20K steps, x axis with seven step names (Opening Balance ... Closing Balance). Subtle horizontal grid. All text dark on light and readable.
      Data: blue Opening Balance bar 0-120K, green floating bars Product Sales (to 205K) and Service Revenue (to 247K), matte red floating bars Refunds (to 229K), Operating Costs (to 164K), Taxes (to 143K), blue Closing Balance bar 0-143K. Dashed grey connectors link each bar end to the next bar's start. Bold running-total labels inside every bar (dark ink on green, light ink on red and blue). First series green is #009E73.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, subtitle, legend, axis label and tick labels flip to light ink and are all clearly readable; grid lines subtle dark grey; no dark-on-dark text.
      Data: bar colors identical to the light render (green, matte red, blue); dashed connectors in light soft ink stay visible; in-bar labels keep the same ink per fill and stay readable.
      Legibility verdict: PASS
