review:
  strengths:
  - Elegant floating-bar-stack technique (invisible transparent 'base' filler + increase/decrease/total
    series sharing one `stack` key) reproduces a waterfall chart despite MUI X having
    no native waterfall type
  - 'Correct semantic color mapping per the Imprint style guide: brand green (palette[0])
    for increases, the deferred semantic-red anchor (palette[4], #AE3030) for decreases,
    and theme-adaptive neutral ink for totals'
  - Theme-adaptive contrast handling on total-bar labels (fill switches to t.pageBg
    on 'total' bars vs a fixed cream ON_COLOR_TEXT on the saturated green/red bars)
    keeps every label readable in both renders
  - Dashed step-line (stepAfter curve) tracing the running total reinforces the cumulative
    flow between bars
  - All font sizes explicitly set; deterministic, realistic quarterly cash-bridge
    data whose deltas sum correctly to the stated closing balance
  - Idiomatic use of the ChartContainer + BarPlot + LinePlot composition API to combine
    bar and line series in one chart
  weaknesses:
  - Bar labels show the running total after each step for every bar, including the
    intermediate increase/decrease bars (e.g. the 'Product Sales' bar reads '$205k',
    the cumulative total after that step, not the +$85k delta it represents) — defensible
    per the spec's 'running total labels' wording and the bar height already conveys
    the delta, but adding the signed delta magnitude (e.g. '+$85k' / '−$18k') alongside
    would sharpen the storytelling further
  - Right margin (48px) is much smaller than the left margin (172px); functionally
    justified by the y-axis tick/label width but reads slightly asymmetric — consider
    trimming a little off the left or adding a touch to the right for visual balance
  - Title occupies only ~35% of the canvas width at fontSize=22; there is clear headroom
    to size it up modestly to strengthen the visual hierarchy (not a proportional
    violation, just a minor polish opportunity)
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Bold dark title "waterfall-basic · javascript · muix · anyplot.ai" centered at top; a 3-item swatch legend (Increase/Decrease/Total) directly below it; rotated "Cash Balance" y-axis title in dark ink at the far left; $-formatted y tick labels ($0k-$260k) and category x tick labels (Opening Balance, Product Sales, Service Revenue, Refunds, Operating Costs, Taxes, Closing Balance) in a softer ink tone. All fully readable, nothing clipped at the canvas edges.
      Data: Floating bars — brand green (#009E73) for increase steps (Product Sales, Service Revenue), matte red (#AE3030) for decrease steps (Refunds, Operating Costs, Taxes), near-black neutral ink for the Opening/Closing total bars. A gray dashed step-line traces the running total across the tops of the bars. White/cream bold labels on each bar show the running cash balance ($120k, $205k, $247k, $229k, $164k, $143k, $143k); total bars use dark text on their neutral fill.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Same title, legend, and axis title now rendered in light ink against the dark background; tick labels in a lighter soft-ink tone. All clearly legible, no clipping.
      Data: Increase/decrease bars are the identical #009E73 green and #AE3030 red as the light render — confirmed unchanged. Total bars flip to the theme-adaptive neutral ink (near-cream #F0EFE8) with dark text labels on them, which correctly avoids a dark-on-dark failure (the fixed ON_COLOR_TEXT cream label color used on the green/red bars would fail on a cream bar, so the code branches to pageBg for the 'total' series specifically). Dashed connector line and grid remain subtle and visible.
      Legibility verdict: PASS
