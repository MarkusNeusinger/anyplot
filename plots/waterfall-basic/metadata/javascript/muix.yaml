review:
  strengths:
  - 'Floating bars built idiomatically from one MUI X stack: a transparent base series
    lifts each change to the previous running total'
  - Dashed connectors drawn in data coordinates through the useXScale/useYScale hooks,
    sitting exactly at the shared running total
  - Running-total label on every bar with ink chosen per fill luminance, readable
    on green, red and blue in both themes
  - 'Semantic Imprint colors: gains #009E73, losses matte red #AE3030, totals Imprint
    blue; chrome threads theme tokens so both renders are clean'
  - Closing total is computed from the start plus all changes, so the bridge always
    closes
  - Native MUI X tooltips in the HTML output for each bar
  weaknesses:
  - 'CQ-04 (code): the legend is hand-built as an HTML block of divs and spans (the
    LEGEND_H band and the ROLE_COLORS map loop above ChartsContainer, about 10 lines)
    although MUI X ships a native legend → render <ChartsLegend /> inside ChartsDataProvider/ChartsWrapper
    with the series labels already set (the transparent base series has no label and
    stays out). Likely cause: the composed ChartsContainer without the ChartsDataProvider/ChartsWrapper
    wrapper the native legend needs.'
  - 'Suggestion: show each change''s signed delta (e.g. +85K, −18K) beside its running-total
    label, as the Notes allow.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole canvas.
      Chrome: bold near-black title "waterfall-basic · javascript · muix · anyplot.ai" centered at top, softer grey subtitle "5 changes from Opening Balance to Closing Balance · bar labels: running total", HTML legend (Increase green, Decrease red, Total blue). Y axis "Cash (USD)" with ticks 0–260K in 20K steps, subtle horizontal grid; x axis with seven step names. All readable.
      Data: blue Opening Balance bar 0→120K, green Product Sales 120K→205K and Service Revenue 205K→247K (#009E73), matte red Refunds 247K→229K, Operating Costs 229K→164K, Taxes 164K→143K, blue Closing Balance 0→143K. Grey dashed connectors join each bar top/bottom to the next at the running total. Bold running-total labels centered in each bar (dark ink on green, light ink on red/blue).
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title in light ink, subtitle and tick labels in light grey, axis line and grid flip to light/subtle; legend text light. No dark-on-dark text anywhere.
      Data: bar colors identical to the light render (green, matte red, blue); connectors switch to light-grey dashes and stay visible; bar labels keep the same per-fill ink.
      Legibility verdict: PASS
