review:
  strengths:
  - Floating bars built natively as one stack with a transparent base series, so every
    change starts at the previous running total
  - Connectors drawn as a custom SVG layer in data coordinates through useXScale/useYScale
    inside ChartsContainer
  - Running-total labels via native barLabel, with label ink chosen per fill so all
    labels read on green, red and blue
  - End total computed from the start plus all changes, so the bridge always closes
    (143K)
  - Theme tokens threaded through title, ticks, axis lines and grid; both renders
    read cleanly
  weaknesses:
  - 'Suggestion: render the legend with the native ChartsLegend (hiding the base series)
    instead of the hand-built HTML swatches.'
  - 'Suggestion: a slightly larger title would balance the wide canvas; it fills about
    30 % of the width.'
