review:
  strengths:
  - Correct 3200x1800 landscape canvas via ggsave(width = 8, height = 4.5, dpi = 400)
    with ragg
  - 'Sequential imprint_seq gradient (#009E73 -> #4467A3) mapped to importance, so
    color and bar length tell the same ranking'
  - Horizontal error bars via geom_errorbar(orientation = 'y'), the current ggplot2
    4 API, visible against the fills in both themes
  - Bars sorted with the highest importance at the top and a zero reference line running
    the full height
  - Theme tokens threaded through every chrome element; both renders fully legible
  weaknesses:
  - 'DE-02 (both): x-grid lines drawn in opaque INK_SOFT at 0.3 mm read as dark rules
    that compete with the bars, against the style guide''s grid at about 15 % ink
    → a faint grid (INK blended to ~15 % into the page, or alpha(''#…'', 0.15)). Likely
    cause: panel.grid.major.x = element_line(color = INK_SOFT).'
  - 'DQ-02 (both): seven of the fifteen features are labelled ''Feature 9'' … ''Feature
    15'', which reads as placeholder data in an otherwise concrete diabetes model
    → give them plausible clinical names (e.g. ''HbA1c'', ''Waist Circumference'',
    ''Triglycerides'', ''HDL Cholesterol'', ''Physical Activity'', ''Smoking Status'',
    ''Sleep Hours''). Likely cause: the features vector.'
  - 'CQ-03 (code): library(tidyr) is loaded but never used → remove it. Likely cause:
    copied import block.'
  - 'CQ-04 (code): the feature factor levels and arrange(desc(importance_mean)) set
    an order that reorder(feature, importance_mean) in aes() then replaces → keep
    one ordering (the reorder() call) and drop the other. Likely cause: two ordering
    approaches left in.'
  - 'Suggestion: the legend box is tall with much empty space; a slimmer colourbar
    (guide_colourbar(barheight = ...)) or a legend above the panel would give the
    bars more width.'
