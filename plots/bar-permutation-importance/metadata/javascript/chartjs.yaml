review:
  strengths:
  - Bars sorted descending by mean importance so the most predictive feature (Departure
    delay) sits at top, matching the spec's readability requirement
  - 'Sequential Imprint gradient (#009E73 → #4467A3) is mapped continuously to importance_mean
    via a custom lerp, correctly treating importance as continuous data rather than
    forcing the categorical palette onto it'
  - Custom errorBars plugin renders whisker caps with theme-adaptive ink color, clearly
    showing importance_std variability for every feature in both themes
  - Dashed zero-reference line (custom zeroLine plugin) cleanly separates features
    with genuine positive importance from the two noise features with slightly negative
    importance (Passenger count, Ticket price)
  - 'Both renders are fully theme-correct: #FAF8F1/#1A1A17 backgrounds, ink/inkSoft
    text, and grid all flip correctly while the green→blue data gradient stays pixel-identical'
  - Realistic, neutral flight-delay classifier scenario with plausible ROC-AUC decrease
    magnitudes and sensible relative feature ranking
  - No clipping at any canvas edge — verified all four borders (title, feature labels,
    x-axis ticks including the -0.03 and 0.22 extremes) at full resolution
  weaknesses:
  - Design excellence is solid but stops short of exceptional — no direct value labels
    or colorbar legend clarifying what the gradient encodes; a numeric label on the
    top 1-2 bars would sharpen the storytelling further
  - Two helper functions (hexToRgb, lerpColor) plus two plugin objects add more structure
    than a minimal top-to-bottom script; justified by Chart.js lacking native error-bar/reference-line
    support, but it is a step up in complexity from the KISS ideal
  - Y-axis title 'Feature' is somewhat redundant since the tick labels already spell
    out each feature name in full — could be dropped without losing information
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1), not pure white.
      Chrome: Title "bar-permutation-importance · javascript · chartjs · anyplot.ai" in dark ink, comfortably sized (~55-60% of canvas width, not overflowing). X-axis title "Mean decrease in ROC-AUC (permutation importance)" and y-axis title "Feature" both in dark ink. Tick labels (feature names, x-axis numeric ticks) in a slightly softer dark grey. Subtle vertical gridlines at major x ticks only; y-axis has no grid. All chrome fully readable against the light background.
      Data: 13 horizontal bars sorted descending by mean importance. First two bars (Departure delay, Distance) render in brand green (#009E73); color fades continuously toward blue (#4467A3) as importance decreases, correctly implementing the Imprint sequential colormap on the continuous importance_mean value. Black error-bar whiskers with caps show importance_std for every bar. A black dashed vertical line at x=0 separates the two slightly-negative bars (Passenger count, Ticket price) from the rest.
      Legibility verdict: PASS — no dark-on-light or overlap issues; verified via edge crops that no title/label/tick is clipped at any canvas border.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17), not pure black.
      Chrome: Same title and axis titles now in light ink, tick labels in a lighter soft grey — all clearly legible against the dark background. Gridlines subtle and still visible. No dark-on-dark text anywhere.
      Data: Bar colors are pixel-identical to the light render (green→blue gradient unchanged) — only chrome flipped, confirming Imprint palette invariance across themes. Error-bar whiskers switch to a light/white stroke for contrast against the dark background, and the zero-reference line renders as a light dashed line.
      Legibility verdict: PASS — all text and data elements remain distinguishable; brand green still reads clearly on the dark surface.
