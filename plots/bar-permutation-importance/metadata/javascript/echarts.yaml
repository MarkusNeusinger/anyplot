review:
  strengths:
  - Bars are correctly sorted by mean importance, highest at top, matching the spec's
    requirement for easy scanning
  - Custom renderItem draws clean ±1 SD error-bar whiskers with caps, giving a proper
    variability encoding rather than a simulated one
  - Dashed vertical reference line at x=0 clearly separates positive (real signal)
    from negative (noise) importance, exactly as the spec requests
  - Title format, deterministic hardcoded data, and theme-token usage for chrome (title/axis/grid)
    all follow the library rules correctly
  - Continuous visualMap legend with explicit 'High importance' / 'Low / noise' text
    labels is a thoughtful, self-documenting touch beyond the spec's minimum ask
  weaknesses:
  - 'Dark render: bars for near-zero-importance features (garage_size, year_built,
    parcel_id_checksum, and to a lesser extent population_density/crime_rate/avg_occupancy/num_bathrooms/lot_size)
    are effectively invisible — the visualMap''s inRange color (t.div) has a theme-adaptive
    midpoint that equals the plot background color, so any bar whose value sits near
    that midpoint renders the same color as the canvas. Only the error-bar whiskers
    remain visible for roughly half the dataset in dark mode; the bars themselves
    disappear.'
  - 'Root cause and fix: the spec explicitly asks for a ''sequential color gradient'',
    not diverging. Switching visualMap.inRange.color from t.div to t.seq (brand green
    -> blue, no near-background midpoint) would both match the spec literally and
    eliminate the vanishing-bar bug, since neither endpoint of imprint_seq coincides
    with the theme background.'
  - 'Same near-background-midpoint issue reduces color-vs-background contrast for
    the lower half of the chart in light mode too (bars fade to near-white against
    the #FAF8F1 background), though less severely than in dark mode.'
  - Two data series ('Importance' bar + 'Variability (±1 SD)' custom series) are declared
    but no legend is shown; harmless here since the visualMap functions as the de
    facto legend, but worth confirming intentional.
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white, matches #FAF8F1, not pure white.
      Chrome: Title "bar-permutation-importance · javascript · echarts · anyplot.ai" is centered, bold, dark ink, fully readable. X-axis title "Decrease in Model R² Score" and tick labels (-0.1 to 0.4) are dark gray and legible. Y-axis feature names (median_income ... parcel_id_checksum) are dark and fully legible. Subtle vertical gridlines at each 0.1 interval; a dashed reference line at x=0 separates positive/negative importance.
      Data: 15 horizontal bars, sorted descending by mean importance, each with black horizontal ±1 SD error-bar whiskers with caps. Bar color follows a diverging blue (high importance) -> near-white (low/near-zero) -> red (negative importance) scale (visualMap, right side, labeled "High importance" / "Low / noise"). The bottom 6-8 bars (near-zero mean importance) render as very pale, low-contrast bars against the off-white background — visible but faint.
      Legibility verdict: PASS (all text legible; data bars for near-zero features are low-contrast but not fully invisible).

    Dark render (plot-dark.png):
      Background: warm near-black, matches #1A1A17, not pure black.
      Chrome: Title, axis title, and tick labels render in light/white text, fully readable against the dark background — no dark-on-dark failures. Gridlines and the dashed zero-reference line (white dashed) are subtle but visible.
      Data: Same 15 bars, same sort order. The top ~7 bars (median_income through house_age) show a clearly visible blue-to-dark-navy gradient identical in hue to the light render (only chrome flipped, confirming color mapping is unchanged). However, for the bottom ~7-8 bars (population_density down through parcel_id_checksum), the bar color converges on the theme-adaptive diverging midpoint, which is set to the dark background color itself (#1A1A17) — these bars are effectively invisible; only the white error-bar whiskers mark their position. This is a genuine dark-mode-specific element-visibility failure caused by mapping near-zero data values to a midpoint color that equals the background.
      Legibility verdict: FAIL for data-element visibility (chrome/text itself is fine) — roughly half the bars are indistinguishable from the background in dark mode.
