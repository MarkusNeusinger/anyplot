review:
  strengths:
  - 'Faithfully implements every spec requirement: bars sorted by mean importance
    (highest at top), horizontal ±1 SD error bars via an idiomatic ECharts custom-series
    renderItem, a dashed zero-reference markLine separating positive from noise/negative
    features, and an imprint_seq sequential gradient mapped to importance magnitude
    for visual emphasis.'
  - 'Theme-adaptive chrome verified pixel-exact: light background samples to #FAF8F1,
    dark background samples to #1A1A17, and error-bar strokes sample to #4A4A44 (inkSoft)
    in the light render — text and chrome flip correctly while data colors stay identical
    between themes.'
  - No AR-09 edge clipping on any border — verified via direct pixel crops of the
    left (feature labels), right (visualMap colorbar text), top (title), and bottom
    (x-axis title) edges; all elements sit with comfortable margin inside the canvas.
  - Realistic, neutral housing-price ML feature-importance dataset (median_income,
    avg_rooms, distance_to_coast, ...) with plausible magnitudes, a clean descending
    sort, and an honest near-zero/negative 'noise' feature (parcel_id_checksum) that
    demonstrates the full range of the plot type.
  - Clean, idiomatic ECharts usage combining a bar series + custom renderItem overlay
    + continuous visualMap + markLine — a distinctive technique combination that would
    take significant boilerplate to replicate in another charting library.
  weaknesses:
  - The smallest-magnitude features (year_built, garage_size, parcel_id_checksum)
    render as near-invisible bar slivers right at the zero line — technically honest
    given the near-zero data, but a minimum visible bar-width floor would improve
    VQ-03 legibility for these rows.
  - The x-axis auto-scales out to -0.1 even though data only dips to about -0.03 (mean
    - std), leaving a visible empty band left of the zero markLine — an explicit xAxis.min
    tuned closer to the real data range would tighten canvas utilization.
  - 'Design Excellence is solid but not top-tier: no explicit callout/annotation on
    the dominant feature (median_income) and the default x-axis tick marks are still
    visible while the y-axis ticks were deliberately hidden — minor inconsistency
    in the chrome polish.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, sampled pixel value (250, 248, 241) — matches #FAF8F1 exactly.
      Chrome: Bold dark title "bar-permutation-importance · javascript · echarts · anyplot.ai" centered at top, clearly readable; x-axis title "Decrease in Model R² Score" below the tick labels; feature names (median_income, avg_rooms, ... parcel_id_checksum) right-aligned on the y-axis, all legible dark-gray text against the cream background; subtle vertical gridlines on the value axis only. Error-bar whisker strokes sample to (74, 74, 68), matching the #4A4A44 inkSoft token exactly — not a stray color, confirmed by direct pixel sampling.
      Data: 15 horizontal bars sorted descending by importance (median_income longest/highest at top), colored via a continuous blue→teal→green (imprint_seq) gradient keyed to each bar's importance value, with a "High importance" / "Low / noise" colorbar legend on the right. A dashed vertical reference line marks x=0. Horizontal error-bar whiskers (±1 SD) drawn on every bar.
      Legibility verdict: PASS — all text readable, no overlap, no clipping at any edge (verified via pixel crops of all four borders).

    Dark render (plot-dark.png):
      Background: Warm near-black, sampled pixel value (26, 26, 23) — matches #1A1A17 exactly.
      Chrome: Same title, axis title, and feature-name labels now rendered in light text, clearly legible against the dark background — no dark-on-dark failures observed. Gridlines and error-bar whiskers switch to light gray/white for contrast.
      Data: Identical bar lengths, order, and imprint_seq gradient hues as the light render — confirming the categorical/continuous data colors are unchanged between themes; only chrome (background, text, gridlines, whisker color) flipped.
      Legibility verdict: PASS — all text readable in the dark theme, no dark-on-dark or light-on-light failures.
