review:
  strengths:
  - Composes the chart from ChartsContainer primitives (BarPlot, ChartsGrid, ChartsReferenceLine,
    ChartsXAxis, ChartsYAxis) and draws the error bars as a custom SVG layer that
    reads the chart's own scales through useXScale/useYScale, so whiskers sit exactly
    on each bar's mean in both renders
  - Bars sorted highest at top with Senior Citizen extending left of the zero reference
    line; whiskers are drawn in the ink token and stay visible against every bar fill
    in both themes
  - imprint_seq gradient (green to blue) is mapped to mean importance with a floor
    so the weakest bars remain distinct from both backgrounds; color and length tell
    the same ranking
  - Vertical-only grid matched to the horizontal bar orientation, and a subtitle that
    names the feature count, the whisker definition and the top feature with its value
  - valueFormatter shows mean ± SD in the HTML tooltip; skipAnimation is set and the
    axis bands are sized explicitly so no tick label is truncated
  weaknesses:
  - 'CQ-04 (code): lines 56-68 parse the two seq hex stops and interpolate RGB by
    hand, then feed the result through an ordinal colorMap on the band axis → use
    the axis''s native continuous colorMap (colorMap: { type: ''continuous'', min,
    max, color: [t.seq[0], t.seq[1]] } on the value axis) and drop the manual interpolation.
    Likely cause: the ordinal colorMap workaround on yAxis.'
  - 'Suggestion: the subtitle''s ''Model feature: 15'' reuses the column label as
    a count label; ''Features shown: 15'' would read more naturally.'
  - 'Suggestion: the header''s ''Library: muix 7.29.1'' does not match the pinned
    @mui/x-charts 9 the code is written against.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, not pure white.
      Chrome: bold dark title "Churn Prediction Model · bar-permutation-importance · javascript · muix · anyplot.ai" (~58 % of width) with a grey subtitle; y-axis title "Model feature" (rotated), x-axis title "Mean decrease in accuracy"; tick labels -0.02 to 0.20 and 15 feature names in soft ink; subtle vertical grid lines; left and bottom axis lines only. All readable.
      Data: 15 horizontal bars sorted descending (Contract Type 0.182 at top to Senior Citizen -0.004 at bottom, extending left of zero); imprint_seq gradient from blue (#4467A3-ish, highest) to green (lowest); dark-ink whiskers with caps centered on each bar end; dark vertical reference line at x=0 spanning all bars.
