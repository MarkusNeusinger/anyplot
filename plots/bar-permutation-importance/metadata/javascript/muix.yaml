review:
  strengths:
  - 'Correct, complete feature set: sorted ranking, ±1 SD error bars, x=0 reference
    line, and a sequential color gradient mapped to importance magnitude — directly
    satisfying every spec requirement.'
  - 'Advanced, idiomatic MUI X technique: composing ChartContainer with useXScale/useYScale
    hooks to render a custom error-bar overlay that stays perfectly synced to the
    bar geometry.'
  - Both themes are fully readable with correctly threaded theme tokens; data colors
    are identical across light/dark, only chrome flips.
  - Realistic, well-scaled churn-prediction data showing the full importance range,
    including a plausible near-zero/negative feature.
  weaknesses:
  - The auto-generated x-axis produces ~24 tick labels at 0.01 increments — a cleaner
    explicit tick interval (e.g. every 0.02–0.04) would reduce visual density on the
    value axis.
  - 'Visual refinement stops at "good": grid appears only on the value axis, and bars/whiskers
    have no additional edge or contrast treatment beyond the small border radius.'
  - Error-bar caps (bw*0.22) are a little small relative to bar height, especially
    on the narrower bars near the bottom of the ranking — slightly larger caps would
    improve at-a-glance readability.
