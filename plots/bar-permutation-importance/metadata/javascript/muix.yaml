review:
  strengths:
  - Sequential gradient driven by MUI X's native axis colorMap (continuous, Imprint
    seq stops) so color and bar length tell the same ranking; the weakest bars stay
    a clear green against both page surfaces
  - 'Composed ChartsContainer chart: BarPlot + ChartsReferenceLine at zero + a custom
    ErrorBars layer built on the useXScale/useYScale hooks, so whiskers sit exactly
    on each bar''s end in data coordinates'
  - Theme tokens threaded through every chrome element (ink error bars, inkSoft ticks,
    grid token) — both renders fully legible, data colors identical
  - Realistic telco churn scenario with a negative importance (Senior Citizen), whiskers
    crossing zero and a long near-zero tail, sorted highest at top
  - Tooltip valueFormatter shows mean ± SD per bar in the interactive HTML
  weaknesses:
  - 'Suggestion: drop the ''Top: Contract Type, 0.182 ± 0.021'' segment from the subtitle
    — the top bar already reads as the leader; keep only the whisker definition.'
  - 'Suggestion: tighten the ~70 px gap between the ''Model feature'' axis title and
    the tick labels (smaller y-axis width) to pull the label closer to the categories.'
