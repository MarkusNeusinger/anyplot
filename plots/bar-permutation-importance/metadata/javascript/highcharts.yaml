review:
  strengths:
  - Sorted descending by importance_mean with the mandated zero-reference dashed line,
    matching the spec's core layout requirement
  - 'Sequential imprint_seq gradient mapped to importance value (per spec''s ''sequential
    color gradient'' note) while the top bar still reads true brand green #009E73'
  - Manual SVG error-bar whiskers via chart.renderer.g/path are a well-executed, clearly-commented
    workaround for the missing highcharts-more errorbar series, with stroke color
    threaded from the theme token so it stays legible on both light and dark backgrounds
  - Theme-adaptive chrome fully threaded through title, subtitle, axis labels, gridlines,
    and error bars — no dark-on-dark or light-on-light failures in either render
  - 'Clean minimalist layout: spines removed, subtle vertical gridlines only, generous
    margins, no clipping at any canvas edge'
  - Data shows the full range of the phenomenon, including a near-zero negative-importance
    feature (Num. Dependents), which is realistic for permutation importance output
  weaknesses:
  - Mid-gradient bars (e.g. Annual Income vs Credit Utilization) sit close in hue
    with limited redundant encoding beyond position/length — a small value label per
    bar would reinforce the ranking for low-vision readers
  - 'DE-03 storytelling is only implicit: no explicit callout/annotation on the headline
    insight (Credit Score as the dominant feature)'
  - Title/subtitle occupy noticeably less than the ~70-85% width typical for the mandated
    title string, leaving extra unused top whitespace
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Title "bar-permutation-importance · javascript · highcharts · anyplot.ai" in bold dark ink, subtitle in softer gray-brown giving context (random-forest loan-default classifier, ±1 SD across 30 repeats), 15 horizontal category bars with feature names on the left, x-axis value labels from -0.03 to 0.22 along the bottom, dashed vertical reference line at x=0, y-axis title "Decrease in Model Score" below the ticks. All text is dark-on-cream and clearly readable.
      Data: Bars run from a saturated brand green (#009E73) at the top (Credit Score, highest importance) through teal and blue shades down to the bottom (Num. Dependents, slightly negative importance) — a sequential imprint_seq gradient mapped to importance_mean. Black error-bar whiskers with end caps show ±1 SD on every bar.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Same title/subtitle/axis layout as the light render, now in light cream/gray text against the dark background. Gridlines and axis lines are faint and unobtrusive.
      Data: Data bar colors are identical to the light render (green-to-blue sequential gradient, top bar still #009E73) — only the chrome (background, text, error-bar stroke color, gridlines) flipped. Error-bar whiskers are rendered in near-white so they stay visible against the dark background (adapted via the theme ink token, not hardcoded black). No dark-on-dark text found anywhere — all labels, title, subtitle, and axis text are clearly legible.
      Legibility verdict: PASS
