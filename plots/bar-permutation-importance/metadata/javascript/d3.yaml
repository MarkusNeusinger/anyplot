review:
  strengths:
  - 'Correct, spec-compliant horizontal permutation-importance chart: bars sorted
    by mean importance (highest at top), horizontal error bars showing shuffle variability,
    and a dashed zero-reference line separating positive from negative importance'
  - Correct use of the Imprint imprint_seq continuous colormap (brand green -> blue
    via d3.interpolateRgbBasis(t.seq)) mapped to importance magnitude, exactly as
    the spec's 'sequential color gradient' note requests, with a matching gradient
    legend
  - 'Theme-adaptive chrome is threaded through consistently: title, axis text, ticks,
    and error-bar strokes all use ANYPLOT_TOKENS and flip correctly between light
    and dark, while the data-driven bar colors stay identical across themes'
  - Realistic, plausible customer-churn feature set with a full range of importance
    values (from monthly_charges at 0.182 down to a near-zero/slightly-negative gender
    feature), which also nicely demonstrates the near-zero/negative edge case for
    the metric
  - 'Clean, idiomatic D3: proper selection.data().join() bar construction, scaleBand/scaleLinear/scaleSequential,
    d3.axisBottom/axisLeft generators, and deterministic hardcoded data with no unnecessary
    abstraction'
  weaknesses:
  - 'Title renders visibly smaller than expected for its length: computed titleSize
    is round(22 * 67/82) = 18px, only 2px larger than the 16px x-axis label, so it
    occupies roughly 40-45% of the plot width instead of the ~70-85% expected for
    a mandated title this long. The typographic hierarchy (title clearly largest/most
    prominent) is weaker than ideal -- consider raising the floor of the scaling formula
    slightly (e.g. clamp to a minimum of ~20px) so the title stays visually dominant.'
  - Data storytelling relies entirely on sort order and the color gradient; there
    is no callout/annotation on the top feature (e.g. highlighting 'Monthly Charges'
    as the dominant driver), so a viewer has to read the whole list to find the story
    rather than seeing it emphasized immediately.
  - The gradient legend and sequential-color-mapped bars are correct D3 but not distinctly
    D3-only -- the same effect is easily achieved in Highcharts/Plotly with a colorAxis/colorbar
    option. Consider leveraging a more genuinely D3-specific capability (custom shapes,
    non-standard layout, or finer manual control over the gradient legend) to better
    demonstrate library mastery.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 -- not pure white.
      Chrome: Bold dark title "Customer Churn Model · bar-permutation-importance · javascript · d3 · anyplot.ai" centered at top; dark-ink x-axis label "Mean Decrease in ROC-AUC (Permutation Importance)"; soft dark-gray y-axis feature labels (Monthly Charges, Tenure Months, Contract Type, ... Gender) and x-axis tick labels (0.00-0.20); a small two-stop gradient legend ("Lower importance" / "Higher importance") top-right. All chrome text is clearly legible against the light background.
      Data: 14 horizontal bars sorted descending by mean importance, filled with a green-to-blue sequential gradient keyed to the importance value (top bars blue/teal, bottom bars green), each with a black horizontal error bar + caps showing +/- 1 std, and a dashed vertical reference line at x=0.
      Legibility verdict: PASS -- no light-on-light or unreadable text observed.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 -- not pure black.
      Chrome: Same title, axis label, tick labels, and legend text now rendered in light/off-white tones, clearly readable against the dark background; the reference line and error-bar strokes render in white/light ink for contrast.
      Data: Identical bar order, lengths, and green-to-blue gradient fill colors as the light render -- confirms data colors are unchanged between themes; only chrome (background, text, grid/domain lines) flips.
      Legibility verdict: PASS -- no dark-on-dark failures observed; all text and data elements remain distinguishable from the near-black background.
