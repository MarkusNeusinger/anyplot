review:
  strengths:
  - 'All five spec properties are present: bars sorted with the highest importance
    at the top, horizontal error bars on every bar, a dashed vertical reference line
    at zero running the full height, and an imprint_seq gradient mapped to importance
    so color and length tell the same ranking'
  - 'Example data exercises every aspect the spec names: two negative importances
    extending left of zero, error bars crossing zero (Latitude, Season Encoded), very
    different error widths and a long near-zero tail'
  - 'Theme tokens threaded through every element: error bars flip from INK near-black
    to near-white, tick labels use INK_SOFT, and the green-to-blue data ramp is identical
    in both renders'
  - Value labels only on the top three features, placed past the error bar end, create
    a focal point without crowding the 15 bars
  - 'Idiomatic plotly: a single go.Bar with native error_x, a marker colorscale with
    cmin/cmax from the data, add_vline for the reference, and a hovertemplate that
    reads %{error_x.array} for mean ± std in the HTML output'
  - Descriptive x-axis title with the metric spelled out (Mean decrease in model score
    (R² loss))
  weaknesses:
  - 'Suggestion: the dashed zero line at 1.5 px is light next to the bars; a slightly
    heavier or solid INK_SOFT line would separate the two negative features more decisively.'
  - 'Suggestion: the y-axis title ''Feature'' repeats what the category labels already
    make obvious; dropping it would free left margin for the bars.'
  - 'Suggestion: tick labels at 10 px become small in the 400 px thumbnail; 11–12
    px would hold up better on mobile.'
