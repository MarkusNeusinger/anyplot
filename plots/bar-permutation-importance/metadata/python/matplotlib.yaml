review:
  strengths:
  - 'Sequential imprint_seq ramp from #009E73 to #4467A3 maps importance so color
    and bar length tell the same ranking, and even the weakest bars stay distinct
    from the page in both themes'
  - Native barh xerr with error_kw draws error bars centred on every bar end in INK_SOFT,
    visible against all fills in light and dark
  - Full-height zero reference line separates the negative 'ash' importance at a glance
  - 'Clean adaptable structure: column constants, a tidy DataFrame and a plot block
    that reads only df, with layout=''constrained'' producing the exact 3200x1800
    canvas'
  - Realistic wine-dataset scenario with a negative mean, a near-zero tail and error
    bars crossing zero
  weaknesses:
  - 'Suggestion: the colorbar label ''Importance'' could reuse the x-axis wording
    (''Mean decrease in accuracy'') so the two scales read as the same quantity.'
  - 'Suggestion: snake_case feature names (od280/od315_of_diluted_wines) could be
    rendered as reader text, e.g. ''OD280/OD315 of diluted wines''.'
