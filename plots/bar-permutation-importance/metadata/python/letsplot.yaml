review:
  strengths:
  - Bars sorted by mean importance via as_discrete(order_by=..., order=1) with coord_flip,
    so the ranking comes from the data, not a hand-sorted list
  - Horizontal error bars in the INK token stay visible on every bar fill in both
    themes (near-black on light, near-white on dark), centered on each bar end
  - 'Sequential imprint_seq gradient (#009E73 → #4467A3) mapped to the mean importance,
    so color and bar length tell the same ranking; the weakest green bars stay distinct
    from both pages'
  - Dashed vertical zero line in INK_SOFT runs the full height and separates the negative
    Region Code bar and the error bars that cross zero
  - 'Example data covers the spec''s characteristic cases: a negative mean, error
    bars crossing zero, very different error-bar widths and a long tail near zero,
    in a plausible credit-risk model'
  - layer_tooltips() with formatted mean and std gives a clean hover readout in the
    HTML output
  weaknesses:
  - 'VQ-06 (both): the value-axis title ''Mean decrease in model score'' does not
    name the score being decreased, so the unit of the importance values is unstated
    → name the metric, e.g. ''Mean decrease in accuracy'' or ''Mean decrease in ROC
    AUC''. Likely cause: the IMPORTANCE_MEAN column constant used as the axis title.'
  - 'Suggestion: the per-bar value labels repeat what the bar length and axis already
    show; labelling only the top few features would lighten the right side of the
    chart.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white, consistent with #FAF8F1 across plot and panel.
      Chrome: bold near-black title "bar-permutation-importance · python · letsplot · anyplot.ai" at about 67 % of the width; axis titles "Feature" and "Mean decrease in model score" in dark ink; tick labels (feature names, -0.02 … 0.16) in soft dark grey; subtle thin vertical grid lines only. All text readable.
      Data: 15 horizontal bars sorted with Income Level (0.149) at the top and Region Code (-0.001, a short bar left of zero) at the bottom, filled by the imprint_seq gradient from brand green #009E73 (weakest) to blue #4467A3 (strongest); near-black capped error bars on each bar end; value labels past each error bar; dashed grey vertical zero line over the full height.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black, consistent with #1A1A17.
      Chrome: title and axis titles in light ink, tick labels in light grey, grid lines subtle but visible. No dark-on-dark text.
      Data: identical bar gradient colors to the light render (green → blue); error bars flip to near-white and stay visible on every bar fill; zero line light grey dashed; value labels light grey. Brand green on the weakest bars reads well.
      Legibility verdict: PASS
