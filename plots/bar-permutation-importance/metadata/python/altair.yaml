review:
  strengths:
  - 'Imprint sequential ramp (#009E73 to #4467A3) mapped to importance, so color and
    bar length tell the same ranking in both themes'
  - Native mark_errorbar with ticks=True draws capped error bars centered on each
    bar end, in INK so they stay visible on every fill
  - One EncodingSortField shared by bars and error bars keeps the highest importance
    at the top without pre-sorting the data
  - Full-height dashed zero rule separates the two negative importances clearly
  - Tooltips and .interactive() zoom add inspection value in the HTML output
  - 'Canvas contract met: view 620x320 at scale 4 padded to exactly 3200x1800'
  weaknesses:
  - 'Suggestion: emphasise the top two features (for example a heavier label weight)
    so the clear gap to the rest reads at once.'
  - 'Suggestion: give the error-bar caps the same INK color as the error line; the
    caps currently render a softer grey.'
