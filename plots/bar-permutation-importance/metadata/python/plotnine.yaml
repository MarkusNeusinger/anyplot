review:
  strengths:
  - Continuous fill uses imprint_seq through plotnine's native scale_fill_gradient(low=#009E73,
    high=#4467A3), so color and bar length tell the same ranking and the weakest bars
    stay green against both pages
  - Bars sorted with the strongest feature on top via scale_x_discrete(limits=...)
    taken from the sorted df, with full feature names beside each bar
  - Error bars in INK_SOFT and the dashed zero line in INK adapt to the theme and
    stay visible on every bar fill in both renders
  - Vertical-only value gridlines with category gridlines removed keep the horizontal
    bars clean
  - 'Hospital readmission scenario with a realistic profile: a long tail near zero,
    error bars crossing zero and one negative importance'
  weaknesses:
  - 'VQ-02 (both): the colorbar title "Importance" at 9 pt is as wide as the legend
    box and touches its frame on both sides → leave at least 2–3 px inside the frame
    (about −1 pt or a wider legend margin). Likely cause: legend_title size=9 with
    the default legend_margin.'
  - 'Suggestion: a colorbar title matching the axis wording ("Mean decrease in AUC")
    would tie the two encodings together.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, not pure white.
      Chrome: bold dark title "bar-permutation-importance · python · plotnine · anyplot.ai" across about 70 % of the width; axis titles "Feature" and "Mean decrease in AUC" in INK; ticks 0.000/0.025/0.050 and 15 feature names in INK_SOFT; subtle vertical gridlines only; left and bottom axis lines; colorbar "Importance" (0.00–0.06) in an elevated box whose title touches the frame.
      Data: 15 horizontal bars sorted with Prior Admissions (12 mo) on top, filled from brand green #009E73 (weakest) to blue #4467A3 (strongest); dark grey error bars on every bar; dashed dark zero line running the full height; Primary Language is a sliver at zero and Admission Month extends left of zero.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17, not pure black.
      Chrome: title and axis titles in light INK, ticks and feature names in light grey INK_SOFT, subtle gridlines, colorbar box in #242420 with light text; no dark-on-dark text.
      Data: identical green-to-blue bar colors as the light render; light grey error bars and a dashed light zero line, all visible on the bars and the page; brand green clearly visible.
      Legibility verdict: PASS
