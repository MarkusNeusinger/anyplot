  strengths:
  - Correct sns.barplot with hue and legend=False, sorted highest at top
  - Theme tokens threaded through sns.set_theme rc; all text readable in both themes
  - Real breast-cancer dataset through sklearn's permutation_importance with n_repeats=10
  - Error bars and zero line drawn and visible in both themes
  weaknesses:
  - 'VQ-05 (both): the renders are 4744x2653 px, off both canonical canvases → 3200x1800
    (−1544 × −853). Likely cause: figsize=(16, 9) with savefig(dpi=300, bbox_inches="tight").'
  - 'VQ-07 (both): the bars use seaborn''s ''viridis'' palette, a colormap outside
    the Imprint set → a sequential ramp between Imprint #009E73 and #4467A3 (imprint_seq).
    Likely cause: sns.color_palette("viridis", ...).'
  - 'SC-04 (both): the title reads ''bar-permutation-importance · seaborn · anyplot.ai''
    without the language → ''bar-permutation-importance · python · seaborn · anyplot.ai''.
    Likely cause: the set_title string.'
  - 'DQ-03 (both): permutation importance is computed on the training data the random
    forest memorised, so the largest accuracy drop is only 0.0025 and 20 of 30 features
    are exactly 0 → evaluate on a held-out split so drops reach a realistic 0.01–0.05
    range. Likely cause: permutation_importance(clf, X, y, ...).'
  - 'Suggestion: map the gradient to the importance values rather than to the rank
    position.'
