review:
  strengths:
  - Whisker annotation with dimension='width' draws the error bars natively from upper/lower
    columns
  - Span model gives a zero reference line over the full plot height in both themes
  - Imprint sequential ramp mapped through LinearColorMapper so color and bar length
    tell the same ranking, weakest bars still distinct on both backgrounds
  - Theme tokens threaded through every chrome element; both renders fully readable
  - HoverTool exposes feature, mean and std in the HTML view
  - Column constants and a clean Data block make the table swappable
  weaknesses:
  - 'CQ-01 (code): a lerp_hex helper function (lines 80-83) breaks the linear Imports
    -> Data -> Plot -> Save structure → no function definitions. Likely cause: the
    color ramp built with a custom interpolation helper.'
  - 'CQ-04 (code): lines 80-86 write out hex color interpolation for the 256-step
    ramp that an available call computes → bokeh.palettes.interp_palette((SEQ_START,
    SEQ_END), 256) or matplotlib.colors.LinearSegmentedColormap.from_list with to_hex.
    Likely cause: the lerp_hex helper and the seq256 list comprehension.'
  - 'Suggestion: a slightly thicker zero reference line would separate the two negative
    bars more clearly at a glance.'
