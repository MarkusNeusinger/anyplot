review:
  strengths:
  - 'Full MUI X v9 composition API: ChartsDataProvider + ChartsWrapper + ChartsSurface
    with ChartsGrid, LinePlot, MarkPlot and both axes layered in an explicit order,
    so custom SVG layers sit exactly where they belong (weekend bands under the grid,
    fill under the lines, scope marker under the marks)'
  - Custom layers read the chart's own scales through useXScale / useYScale / useDrawingArea,
    so weekend bands, the ahead/behind fill and the scope-change marker stay aligned
    with the data without hand-computed pixel positions
  - 'Actual series is a true step series (curve: stepAfter with strictStepCurve) with
    circle marks at every day value; the ideal guideline is a muted inkSoft dashed
    straight line, and the legend mark for it is restyled to a dashed sample via data-series
    selectors so the legend matches the plot'
  - 'The ahead/behind fill is split exactly where the held step value crosses the
    falling ideal line and colored red (behind, Imprint semantic anchor #AE3030) or
    green (ahead), keeping the reading obvious; the subtitle states the color key'
  - Weekend gaps are derived from the dates themselves (any gap of more than one calendar
    day) and labelled Sat–Sun, explaining the flat Fri→Mon segments; the +8 scope
    change is a dotted ink vertical line with a bold label at Thu, Jun 4 where the
    series jumps
  - 'Realistic sprint data matching the spec example: 40 points committed, +8 added
    on day 4 (2 completed that day, net +6), ending with 2 points left; subtitle summary
    is computed from the data'
  - All chrome threads ANYPLOT_TOKENS (ink, inkSoft, grid, pageBg); data colors identical
    across both themes and every text element readable in both renders
  - skipAnimation set on the provider, LinePlot and MarkPlot; native tooltips and
    legend interactivity available in the HTML output
  weaknesses:
  - 'Suggestion: the mandated title spans only about 31 % of the width at 22 px; a
    slightly larger title (about 26–28 px) would give the header more presence over
    the long subtitle.'
  - 'Suggestion: the red/green ahead-behind key lives only in the subtitle; adding
    the fill as a legend entry would put the whole encoding in one place.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole canvas, 3200x1800.
      Chrome: centered bold title "burndown-sprint · javascript · muix · anyplot.ai" in dark ink, a softer-ink subtitle "40 story points committed · +8 added during the sprint · 2 left on Fri, Jun 12 · red: behind the ideal line, green: ahead", a right-aligned horizontal legend (green circle-line "Remaining (story points)", dashed dark-grey "Ideal remaining (story points)"). Y axis "Remaining (story points)" 0–40 in steps of 5 with subtle horizontal grid lines; x axis "Day" with 11 ticks Fri, May 29 … Fri, Jun 12. All text dark on light and readable.
      Data: brand-green #009E73 step series with white-filled circle marks at 40, 37, 34, 32, 38, 34, 28, 21, 14, 7, 2; dashed muted ideal line from 40 on Fri, May 29 to 0 on Fri, Jun 12; translucent matte-red fill between the two (the actual series stays above the ideal the whole sprint, so no green appears); two light grey weekend bands labelled "Sat–Sun" over the Fri→Mon intervals, lining up with the flat segments; a dotted vertical ink line at Thu, Jun 4 with the bold label "Scope change +8 story points" where the series jumps from 32 to 38.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, subtitle, legend text, axis titles and tick labels all flip to light ink and read clearly; grid lines subtle but visible; the dashed ideal line flips to light grey; the scope-change line and label render in light ink. No dark-on-dark text anywhere.
      Data: the green step series, the marks (now dark-filled with green outline), and the matte-red fill hue are identical to the light render; weekend bands are a lighter grey on the dark surface and remain visible with their "Sat–Sun" labels.
      Legibility verdict: PASS
