      Data: brand-green #009E73 step series with white-filled circle markers falling 40 → 37 → 34 → 32, jumping to 38 at Thu Jun 4, then 34 → 28 → 21 → 14 → 7 → 2; dashed grey ideal line 40 → 0; light red fill between the steps and the ideal line; two light grey "Sat–Sun" bands over the flat Fri→Mon segments; dotted dark vertical rule with bold "Scope change +8 story points" at Thu Jun 4.
