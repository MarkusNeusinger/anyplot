review:
  strengths:
  - Uses the v9 composition API (ChartsDataProvider + ChartsWrapper + ChartsSurface)
    to layer custom SVG components (weekend bands, behind/ahead fill, scope marker)
    under and over the native LinePlot/MarkPlot, positioned with the useXScale/useYScale/useDrawingArea
    hooks so every layer shares the chart's scales
  - Actual remaining work is a true step series (curve stepAfter with strictStepCurve)
    whose flat segments line up exactly with the shaded Sat–Sun bands in both themes
  - 'The behind-schedule area between the actual steps and the ideal line is split
    at crossings and filled with the red pole of the Imprint diverging ramp, with
    a legend swatch that names the reading (''Behind: above the ideal line''); the
    legend only lists states that occur'
  - Ideal guideline is a straight dashed inkSoft line from 40 to 0, and the legend's
    line sample is restyled via data-series selectors to show the same dash
  - The +8 scope change is marked with a dotted vertical rule and bold label exactly
    on Thu Jun 4 where the series jumps from 32 to 38
  - Subtitle summarises the sprint from the data itself (40 committed, +8 added, 2
    left, above the ideal line on 10 of 11 days); all values are computed, not hard-coded
  - Theme tokens threaded through every custom element; data colors identical in both
    renders, dark-mode fill opacity raised so the red band stays visible
  weaknesses:
  - 'Suggestion: the remaining-work markers fill with white in the light render rather
    than the page color; filling them with t.pageBg would sit more quietly on the
    cream surface.'
  - 'Suggestion: the y axis ends at about 44.8 without a labelled top tick; a round
    maximum (45) would close the axis cleanly.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across page and plot area.
