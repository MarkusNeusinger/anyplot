review:
  strengths:
  - Per-bar zone colors come from the band axis's ordinal colorMap, the MUI X idiom,
    mapping Z1-Z5 to muted grey, blue, green, ochre and red in the nearest Imprint
    hues
  - Location-aware axis valueFormatter puts the bpm range on a second tick line while
    the tooltip keeps the plain zone name; the series valueFormatter adds duration
    and bpm to the HTML tooltip
  - Native barLabel with outside placement and 12% headroom keeps every duration label
    clear of the bars and the frame
  - Clear typographic hierarchy and theme tokens threaded through every text element;
    both renders fully legible
  weaknesses:
  - 'Suggestion: the y-axis title sits far from its tick labels (width 84 with 15
    px ticks); a narrower y band would tighten the left edge.'
  - 'Suggestion: the gap between the tick labels and the ''Heart rate zone'' title
    is generous; a slightly smaller x-axis height would balance the bottom margin.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, not pure white.
      Chrome: semibold near-black title "Tempo Run · bar-heart-rate-zones · javascript · muix · anyplot.ai" top left (~44% of width) with a softer subtitle "60 min across 5 zones · most time in Z2 Endurance: 22 min (37%)"; y-axis "Time in zone (min)" with ticks 0-24, x-axis "Heart rate zone" with two-line ticks (zone name over bpm range, e.g. "Z2 Endurance / 126–145 bpm"); subtle horizontal grid; all text dark and readable.
      Data: five rounded bars in Z1→Z5 order: Z1 muted grey #6B6A63 (8 min), Z2 blue #4467A3 (22 min), Z3 brand green #009E73 (15 min), Z4 ochre #BD8233 (12 min), Z5 red #AE3030 (3 min), each with a bold duration label above it. Green is the semantic Z3 color, not the first series (semantic exception).
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17, not pure black.
      Chrome: title, subtitle, axis titles, tick labels and bar labels all switch to light ink; grid lines subtle but visible; no dark-on-dark text.
      Data: Z2-Z5 colors identical to the light render; Z1 uses the theme-adaptive muted anchor (#A8A79F), as the style guide defines it; all bars stand out from the page, brand green clearly visible.
      Legibility verdict: PASS
