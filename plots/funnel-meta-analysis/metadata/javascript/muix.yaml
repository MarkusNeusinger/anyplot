review:
  strengths:
  - Composes the chart from community MUI X primitives (ChartsContainer, ChartsGrid,
    ChartsReferenceLine, ScatterPlot, ChartsXAxis/ChartsYAxis) with a reversed standard-error
    y axis, exactly the inverted funnel orientation the spec asks for
  - 'Pseudo 95% limits drawn as a custom SVG layer that reads the chart''s own scales
    through useXScale/useYScale, so the diagonals sit exactly at pooled ± 1.96 × SE
    (verified: pooled −0.397, limits −1.71 and +0.92 at the padded SE 0.67)'
  - 'Pooled and null lines are clearly distinguished: solid ink 2.5 px for the pooled
    effect versus dashed ink-soft for the null, each with an inline label at the axis
    end'
  - Inverse-variance pooled estimate is computed from the data, not typed, and the
    subtitle reports it alongside the study count and the funnel definition
  - Realistic, neutral scenario (18 fictional antihypertensive RCTs, log odds ratios
    around −0.4) whose small trials lean to the protective side, so the asymmetry
    the plot exists to show is visible at a glance
  - Theme tokens threaded through every chrome element; both renders are fully legible
    and data colors are identical
  - Tooltip valueFormatter exposes study name, effect and SE in the interactive HTML
  weaknesses:
  - 'Suggestion: the funnel limits and the null line share the same ink-soft dashed
    style; a different dash pattern (e.g. dotted funnel limits) would make the three
    line roles even easier to tell apart.'
  - 'Suggestion: sizing markers by inverse-variance weight, which the Notes allow,
    would add the precision cue directly to the points.'
  - 'Suggestion: the y-axis title sits about 60 px left of its tick labels; a narrower
    y band would tighten the left edge.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, no white panel.
      Chrome: bold dark title "funnel-meta-analysis · javascript · muix · anyplot.ai" centered at top with a smaller ink-soft subtitle (n = 18 studies, pooled effect -0.40, funnel definition). X axis "Log odds ratio" with ticks −1.8 to 1.0; y axis "Standard error" reversed, 0.0 at top to 0.6 at bottom. Subtle grey grid in both directions. All text dark on light and readable.
      Data: 18 brand-green (#009E73) circular markers; a lightly shaded triangular funnel with dashed ink-soft diagonals from the apex at (−0.40, 0) to the bottom edge; solid black pooled line at −0.40 labelled "Pooled -0.40"; dashed vertical null line at 0 labelled "Null effect 0". Small studies spread to the lower left, the lower-right corner is empty (asymmetry).
      Legibility verdict: PASS

    Dark render (plot-dark.png):
