review:
  strengths:
  - 'imprint_seq Fields ramp with per-theme stops via ramp_color: pale mint → deep
    violet on light, dark olive → pale blue on dark, so high energy stands out in
    both themes'
  - Native SVG <title> tooltips on every cell (pitch, time, energy) through chart.svg.node
    — real interactivity in the HTML output
  - 'Clear three-tier type hierarchy: bold pitch labels and axis titles, muted italic
    chord headers, muted italic subtitle'
  - Chord headers and dashed dividers segment the timeline so the I–V–vi–IV progression
    reads at a glance
  - Synthetic chroma with realistic triads, leakage and temporal smoothing; chord
    regions and subtitle derived from the tidy df
  weaknesses:
  - 'VQ-01 (both): x-axis time tick labels at 36 px read small beside the 44 px pitch
    labels and the style guide''s 44 px label size → 44 px (+8 px). Likely cause:
    `font-size:36px` on the time tick text nodes.'
  - 'VQ-05 (both): an empty band of about 240 px sits between the title and the chord
    headers while the subtitle is squeezed at the bottom edge → grow the grid upward
    (about −150 px of top gap). Likely cause: margin_top=160 plus m_t=80 in render_heatmap.'
  - 'CQ-01 (code): line 112 `def render_heatmap(chart)` holds the whole drawing and
    is invoked from the `ChromagramHeatmap(Graph)` subclass''s `_plot` (line 260)
    → draw at the top level, cell by cell, without a Python class (the agent chat''s
    validator refuses every class). Likely cause: a custom pygal Graph subclass used
    as the drawing callback.'
  - 'CQ-04 (code): the chord-region background rects (lines 124–127) are drawn before
    fully opaque cells and never show in either render → delete them. Likely cause:
    shading kept from an earlier layout.'
  - 'Suggestion: label the final time tick (8.0 s) so the axis closes at its end.'
