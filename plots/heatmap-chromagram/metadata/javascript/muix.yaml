review:
  strengths:
  - 'Builds the heatmap on the community surface: a zAxis continuous colorMap in imprint_seq
    read through useZColorScale, with rects placed via useXScale/useDrawingArea inside
    ChartsSurface, since the Heatmap chart is Pro-only'
  - ContinuousColorLegend titled 'Energy' serves as the colour bar the spec asks for,
    vertically centred beside the plot
  - Fine 50 ms frames tile the time axis seamlessly, so the C-G-Am-F chord changes
    appear as sharp boundaries with shared tones carrying across them
  - Chrome fully theme-adaptive through ink/inkSoft tokens; data colours identical
    in both renders
  weaknesses:
  - 'CQ-04 (code): the chord sections are written as pipe-delimited strings ("C major|0,4,7|0|20")
    and re-parsed with split/map(Number) in lines 37-55 → declare them directly as
    object literals ({ label, pcs: [0, 4, 7], start: 0, end: 20 }) and drop the parsing
    block. Likely cause: string encoding of the CHORD_SECTIONS table.'
  - 'LM-01 (code): the colour-scale limits are typed constants (ENERGY_MIN = 0, ENERGY_MAX
    = 1, lines 22-23) against the library prompt''s ''Limits come from the data or
    stay automatic'' rule → derive min/max from the data''s energy values (or leave
    the colorMap domain to the data). Likely cause: ENERGY_MIN/ENERGY_MAX passed to
    zAxis.colorMap.'
  - 'Suggestion: the subtitle builds ''Pitch classes'' from the column constant, leaving
    a capitalised word mid-sentence; lower-casing it would read more naturally.'
  - 'Suggestion: intermediate colour-bar ticks (0.5) would make mid-range overtone
    energy easier to read off.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1.
      Chrome: bold dark title "heatmap-chromagram · javascript · muix · anyplot.ai" centred at the top, soft-ink subtitle "Energy across 12 Pitch classes · C major → G major → A minor → F major (80 frames)", bold chord headers above each 1 s section, y axis "Pitch class" with C (bottom) to B (top), x axis "Time (s)" with ticks 0.0s-4.0s every 0.2 s, colour bar titled "Energy" at the right with 0.0 / 1.0 labels. All text dark on light and readable.
      Data: 80x12 cells in the imprint_seq ramp, #009E73 green (low) to #4467A3 blue (high). Blue bands on C/E/G (0-1 s), G/B/D (1-2 s), A/C/E (2-3 s), F/A/C (3-4 s); teal overtone rows; dark-ink chord dividers at 1, 2, 3 s.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, subtitle, chord headers, axis titles, tick labels and colour-bar labels in light ink, all readable; no dark-on-dark text. Chord dividers flip to a light ink line.
      Data: cell colours identical to the light render; brand green clearly visible.
      Legibility verdict: PASS
