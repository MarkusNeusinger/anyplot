review:
  strengths:
  - Composes the chromagram inside ChartsContainer with a band y-axis and a linear
    time x-axis, drawing the cells as a custom SVG layer positioned through the useDrawingArea
    and useXScale hooks, so the native ChartsXAxis/ChartsYAxis supply theme-adaptive
    ticks and labels
  - All 12 pitch classes in chromatic order C→B with clear labels, and the time axis
    formatted in seconds via valueFormatter
  - 80 frames at 50 ms tile the time axis seamlessly (0.5 px overlap), so each chord
    change shows as a sharp column boundary
  - The imprint_seq gradient is built from window.ANYPLOT_TOKENS.seq, identical in
    both themes, with a labelled 'Energy' color bar
  - 'Data reads as a real chromagram: three bright chord tones per section, weaker
    fifth-overtone leakage, a low noise floor, and the common tones of the C–G–Am–F
    progression (C, E, A) carry across the changes'
  - Deterministic LCG data generation and skipAnimation for a stable harness capture
  weaknesses:
  - 'CQ-04 (code): lines 108–125 parse the seq hex stops and interpolate RGB by hand,
    and the color bar (gradient rect plus 0.0/1.0/Energy texts) is drawn by hand,
    although MUI X community computes both → a `zAxis` with `colorMap: { type: ''continuous'',
    min: 0, max: 1, color: [t.seq[0], t.seq[1]] }` plus `ContinuousColorLegend` from
    `@mui/x-charts/ChartsLegend` (as the repo''s confusion-matrix and heatmap-clustered
    muix implementations do). Likely cause: the hand-rolled colorbar block in ChromagramLayer.'
  - 'Suggestion: intermediate color-bar ticks (0.25, 0.5, 0.75) would make the energy
    scale easier to read than the two end values alone.'
  - 'Suggestion: the subtitle builds ''Pitch classes'' by appending ''es'' to the
    column name, which yields an odd mid-sentence capital (''12 Pitch classes'');
    a plain lowercase phrase reads better.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, not pure white.
      Chrome: bold title "heatmap-chromagram · javascript · muix · anyplot.ai" at the top center, a smaller inkSoft subtitle "Energy across 12 Pitch classes · C major → G major → A minor → F major (80 frames)", bold chord headers (C major, G major, A minor, F major) above each section, y-axis title "Pitch class" with ticks C … B (C at the bottom), x-axis "Time (s)" with ticks 0.0s–4.0s every 0.2 s, a vertical color bar on the right labelled 1.0 / 0.0 and rotated "Energy". All text dark on light and readable.
      Data: 12×80 heatmap in the imprint_seq gradient (#009E73 green = low → #4467A3 blue = high). Bright blue bands: C/E/G for 0–1 s, G/B/D for 1–2 s, A/C/E for 2–3 s, F/A/C for 3–4 s; teal overtone rows and a green noise floor elsewhere. Thin dark vertical dividers at 1, 2 and 3 s.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17, not pure black.
      Chrome: title, subtitle, chord headers, axis titles, tick labels and color-bar labels all flip to light ink and are clearly readable; no dark-on-dark text. Chord dividers flip to light lines.
      Data: cell colors and the color-bar gradient are identical to the light render; only the chrome changed.
      Legibility verdict: PASS
