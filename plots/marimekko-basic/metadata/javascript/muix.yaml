review:
  strengths:
  - Composes the Marimekko as a custom SVG layer inside ChartsContainer, driving every
    rect through the useXScale/useYScale/useDrawingArea hooks so cells and the native
    ChartsYAxis share one linear 0–100 coordinate space
  - 'Bar widths and segment heights are computed from the data: widths 23/14/34/9/20
    % of the $440M grand total and within-column shares (e.g. North Electronics 42
    %), so area equals value'
  - Segment labels pick a fixed dark or light ink per fill by luminance (white on
    green and blue, near-black on lavender and ochre), so every label reads identically
    in both themes
  - 'Two-line x labels: bold region name centered under each variable-width bar plus
    a softer ink line with the column total and its share of the grand total'
  - 2.5 px page-colored cell separators keep the 20 segments crisp without a grid,
    in both themes
  - 'Correct Imprint order (Electronics #009E73, Apparel #C475FD, Home Goods #4467A3,
    Grocery #BD8233) from t.palette by index, stacked in the same order in every bar'
  - Theme chrome from ANYPLOT_TOKENS throughout (pageBg, ink, inkSoft); skipAnimation
    set
  weaknesses:
  - 'Suggestion: the legend is a hand-built HTML row of divs; feeding the product
    names as labelled series to ChartsDataProvider and rendering the community <ChartsLegend
    /> would use the library''s own legend.'
  - 'Suggestion: the unit parsing (regex on the REVENUE column name to split ''$''
    and ''M'') is clever but opaque; a plain formatter constant would read more simply.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole 3200x1800 canvas.
      Chrome: title "marimekko-basic · javascript · muix · anyplot.ai" bold dark ink centered at top (~37 % of width); a centered legend row below it (Electronics, Apparel, Home Goods, Grocery with rounded swatches); y axis on the left with 0%–100% ticks every 10 % in soft ink and a rotated "Share within column (%)" title; no x axis line — under each bar a bold region name (North, South, East, West, Central) and a soft-ink line with the column total and share ($100M (23%), $60M (14%), $150M (34%), $40M (9%), $90M (20%)). All text readable.
      Data: five full-height columns with widths proportional to totals (East widest, West narrowest), each split into four stacked segments: Electronics #009E73 on top, Apparel #C475FD, Home Goods #4467A3, Grocery #BD8233 at bottom; segment boundaries at different heights per column; separated by page-colored 2.5 px strokes. Every segment carries a bold "$value (share%)" label — white on green/blue, near-black on lavender/ochre. No overlaps, nothing clipped.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, legend text, region names in light ink; ticks, y-axis title and column totals in light soft ink — all clearly readable, no dark-on-dark text. Cell separators flip to the dark page color.
      Data: segment fills identical to the light render (#009E73, #C475FD, #4467A3, #BD8233), segment label colors also identical (fixed by fill luminance), brand green clearly visible.
      Legibility verdict: PASS
