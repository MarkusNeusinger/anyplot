review:
  strengths:
  - 'A true Marimekko: the column widths (23/14/34/9/20 %) sum to the $440M grand
    total, every column spans the full 0–100 % height, and the segment heights are
    the within-column shares, so each area is the actual revenue'
  - 'The plot uses the MUI X v9 composition API: ChartsContainer plus the useXScale/useYScale/useDrawingArea
    hooks draw custom variable-width cells in the chart''s coordinate space, and ChartsYAxis
    provides a native percentage axis'
  - Fully theme-adaptive chrome from ANYPLOT_TOKENS, with page-colored cell separators
    that read cleanly in both themes
  - The in-cell label color is picked from each palette color's luminance, so every
    segment label stays legible on its fill
  - A label threshold (share ≥ 8 % and column width ≥ 64 px) skips labels that would
    not fit their cells
  weaknesses:
  - 'CQ-04 (code): lines 58–65 collect the regions and products with a manual for
    loop and includes() checks, where the library prompt names the shorter form →
    const regions = [...new Set(data.map((d) => String(d[REGION])))] (and the same
    for products). Likely cause: written-out dedup loop instead of new Set.'
  - 'Suggestion: the header''s ''Library: muix 7.29.1'' line does not match the pinned
    MUI X Charts 9; state the pinned version.'
  - 'Suggestion: the HTML legend is hand-built, because series={[]} gives ChartsLegend
    nothing to read; a series-backed legend would show off more MUI X.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1
      Chrome: bold centered title "marimekko-basic · javascript · muix · anyplot.ai"; centered legend (Electronics, Apparel, Home Goods, Grocery); y axis "Share within column (%)" with 0–100 % ticks; bold region names, with totals and width shares beneath them in soft ink. All readable.
      Data: five variable-width full-height columns (East widest at 34 %, West narrowest at 9 %), stacked Electronics #009E73 (top), Apparel purple, Home Goods blue, Grocery amber (bottom); page-colored 2.5 px gutters; "$value (share%)" labels in every cell, white or near-black chosen by luminance.
      Legibility verdict: PASS

