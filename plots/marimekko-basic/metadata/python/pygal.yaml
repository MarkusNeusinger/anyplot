review:
  strengths:
  - 'Mathematically correct Marimekko: bar widths are each region''s share of the
    1650 M total and segment heights the within-region share'
  - In-segment percentage labels drawn only where the segment is large enough, plus
    italic width-share sublabels under each region name
  - 'Theme-correct in both renders: Imprint colors identical, page-colored segment
    separators, all chrome readable'
  - Realistic, neutral dataset of 5 regions × 4 product lines with distinct mixes
  weaknesses:
  - 'SC-01 (both): a faint focal tint band behind Asia Pacific, a leader-line callout
    ''Largest market — 32% of revenue'' and a bolded 48-size Asia Pacific label are
    a highlight and a callout the basic variant excludes (C5) → remove all three.
    Likely cause: the focal-band rect, the focal-callout group and the is_focal font
    branch in _plot.'
  - 'VQ-01 (both): y tick labels at font-size 32 in INK_MUTED read small beside the
    44-size region labels, below pygal''s tick-label reference 44 (−12); legend text
    at 40 (−4) → 44 for both. Likely cause: font-size ''32'' in the y-axis loop and
    ''40'' in the legend loop.'
  - 'CQ-01 (code): lines 38–310, the whole chart is drawn inside a Marimekko(Graph)
    subclass → draw at top level, e.g. a pygal.XY chart with fill=True where each
    segment is a closed rectangle series computed from the pivot table. Likely cause:
    the Marimekko class with its _plot override.'
  - 'CQ-04 (code): lines 23–33 and 202–304, a sys.path workaround and about 100 lines
    of hand-drawn x labels, axis titles, legend, y ticks and gridlines replace pygal''s
    x_labels, x_title/y_title, legend and y_labels options → use the native options.
    Likely cause: show_legend=False and show_x/y_labels=False with everything redrawn
    in _plot.'
  - 'LM-01 (code): the chart is built from raw svg.node rectangles and texts rather
    than pygal''s chart API → a built-in chart type (pygal.XY with fill) with Style,
    x_labels and formatters. Likely cause: the Graph subclass approach.'
  - 'Suggestion: legend swatches at 22 px look small next to 40-size text; swatches
    near the text height would match the segments better.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1.
      Chrome: dark title centered at top; rotated y title 'Share within Region (%)' with small muted 0%-100% tick labels and dashed gridlines; region names centered under each bar (Asia Pacific bold and larger) with italic muted width shares (27 %, 23 %, 32 %, 11 %, 7 %); bold 'Region' x title; a legend row (Enterprise, Consumer, SMB, Government) below; a leader-line callout 'Largest market — 32% of revenue' above Asia Pacific. All text readable; the y tick labels are small and muted. Nothing clipped.
      Data: five full-height variable-width bars split into Enterprise #009E73, Consumer #C475FD, SMB #4467A3, Government #BD8233 with bold white percentage labels and page-colored separators.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
