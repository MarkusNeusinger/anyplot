review:
  strengths:
  - 'Mathematically correct Marimekko: bar widths are each region''s share of the
    1650 M total and segment heights the within-region share, so segment areas are
    the actual revenue'
  - A single _column_layout pass shares x position and width between segments and
    labels, so bars and labels cannot drift apart
  - In-segment percentage labels drawn only where the segment is large enough, plus
    italic width-share sublabels under each region name
  - 'Theme-correct in both renders: Imprint colors identical, page-colored segment
    separators, all chrome readable'
  - Realistic, neutral dataset of 5 regions × 4 product lines with distinct mixes
  weaknesses:
  - 'SC-01 (both): a faint focal tint band behind Asia Pacific, a leader-line callout
    ''Largest market — 32% of revenue'' and a bolded 48-size Asia Pacific label are
    highlights and a callout the basic variant excludes (C5) → remove all three. Likely
    cause: the focal-band rect, the focal-callout group and the is_focal font branch
    in _plot.'
  - 'VQ-01 (both): y tick labels at font-size 32 in INK_MUTED read small beside the
    44-size region labels, below pygal''s tick-label reference 44 (−12); legend text
    at 40 (−4) → 44 for both, tick labels in INK_SOFT. Likely cause: font-size ''32''
    in the y-axis loop and ''40'' in the legend loop.'
  - 'CQ-01 (code): the whole chart is drawn inside a ~250-line Marimekko(Graph) subclass,
    which the adaptation validator refuses → draw at top level, e.g. a pygal.XY chart
    with fill=True where each segment is a closed rectangle series computed from the
    pivot table. Likely cause: the Marimekko class with its _plot override.'
  - 'Suggestion: legend swatches at 22 px look small next to 40-size text; swatches
    near the text height would match the segments better.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white, pixel-sampled rgb(250,248,241) = #FAF8F1.
      Chrome: dark title 'marimekko-basic · python · pygal · anyplot.ai' centered at top; rotated y title 'Share within Region (%)' with muted 0–100 % tick labels and dashed gridlines; region names centered under each bar (Asia Pacific bold and larger) with italic muted width shares (27 %, 23 %, 32 %, 11 %, 7 %); bold 'Region' x title; a hand-drawn legend row (Enterprise, Consumer, SMB, Government) below; a leader-line callout 'Largest market — 32% of revenue' above Asia Pacific. All text readable; the y tick labels are small and muted. Nothing clipped.
      Data: five full-height variable-width bars, each split into Enterprise (#009E73, pixel-checked), Consumer (#C475FD), SMB (#4467A3), Government (#BD8233) with bold white percentage labels and page-colored separators.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black, pixel-sampled rgb(26,26,23) = #1A1A17.
