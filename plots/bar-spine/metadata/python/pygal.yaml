review:
  strengths:
  - 'Correct data mapping: bar widths are proportional to the marginal class frequencies,
    and segment heights are the conditional survival proportions, both computed directly
    from the raw counts'
  - Real, factually accurate Titanic survival data by passenger class that closely
    matches well-known historical statistics (1st ~62%, 2nd ~43%, 3rd ~26% survival)
  - Creative, distinctive use of pygal's Histogram (value, x_min, x_max) rectangle
    feature to build adjacent variable-width bars, implementing a spine plot that
    pygal has no native chart type for
  - 'Correct Imprint palette (green #009E73 primary, #C475FD secondary) with theme-correct
    chrome in both light and dark renders, all text clearly legible in both themes'
  - Explicit font sizing across all text elements (title, axis, legend, value labels)
    with good, balanced canvas utilization
  weaknesses:
  - 'Title is missing the mandated language token: it reads ''... · bar-spine · pygal
    · anyplot.ai'' but the required format is ''{spec-id} · {language} · {library}
    · anyplot.ai'' — insert ''python'' between ''bar-spine'' and ''pygal'''
  - Y-axis label 'Survival Rate' does not state the unit explicitly — rename to 'Survival
    Rate (%)' to score full marks on axis labeling
  - Only the 'Survived' segment gets a percentage callout, placed above the bar rather
    than within the segment as the spec suggests, and the 'Not Survived' segment has
    no label at all — consider adding matching labels inside the larger segments (e.g.
    the wide 3rd-class purple area easily fits '74% not survived')
  - Overall aesthetic still reads close to a well-configured library default (flat
    fills, default monospace typeface, no depth/hierarchy beyond color) — a bit more
    typographic or layout distinction would lift Design Excellence
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Dark ink title "Titanic Survival by Passenger Class · bar-spine · pygal · anyplot.ai" at top, dark "Survival Rate" y-axis label, dark 0%-100% tick labels (25% steps), dark x-axis category labels "1st Class (24.7%)" / "2nd Class (21.2%)" / "3rd Class (54.2%)", dark legend text at bottom. All chrome text is clearly readable against the light background.
      Data: Three adjacent variable-width bars (spine plot), stacked green (#009E73, "Survived") on top of lavender-purple (#C475FD, "Not Survived"). Bar widths shrink/grow with each class's marginal share (24.7% / 21.2% / 54.2%); segment split shows declining survival by class (62% → 43% → 26%, called out via labels above each bar). First series is the Imprint green as required.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same layout with all title/axis/tick/legend text now light-colored (off-white/light gray), clearly legible against the dark background. No dark-on-dark elements found — tick labels, axis title, and legend text are all appropriately light-toned.
      Data: Green (#009E73) and lavender-purple (#C475FD) segments are pixel-identical to the light render — only chrome (background, text, grid) flips as required.
      Legibility verdict: PASS
