review:
  strengths:
  - 'Genuinely correct spine-plot construction: bar widths are proportional to marginal
    class frequency and segment heights sum to 100%, with bars perfectly adjacent
    (no gaps) via cumulative x_ranges'
  - Clever, idiomatic pygal technique — uses Histogram's (value, x_min, x_max) tuple
    format with two overlapping full-height series to fake a variable-width stacked
    bar, which pygal has no native chart type for
  - 'Historically accurate data: survived/not-survived counts per class match the
    real Titanic passenger statistics (1st: 200/123, 2nd: 119/158, 3rd: 181/528)'
  - Theme-adaptive chrome correctly threaded through the Style object (background,
    ink tokens, grid) — title, axis labels, and tick labels are all clearly legible
    in both light and dark renders
  - Title fontsize scaling formula keeps the long mandated title comfortably sized
    instead of overflowing
  - Percentage value labels directly on the bars give an immediate, labeled narrative
    of declining survival rate across classes
  weaknesses:
  - 'Dark render: the ''Survived'' series'' print_values labels (''62% survived'',
    ''43% survived'', ''26% survived''), which are anchored above the full-height
    bar top (i.e. in the page-background band above the 100% guide, not on the green
    fill), render in the same fixed dark ink used in the light render instead of a
    theme-adaptive light token — low contrast against the near-black #1A1A17 page
    background. The ''not survived'' labels are fine because they sit inside the bright
    purple/green fill. Set an explicit value_colors (or equivalent per-series label
    color) in the Style tied to INK/INK_SOFT so labels placed on the page background
    flip with theme.'
  - No visual emphasis singles out one class or one segment as the focal insight —
    all three bars carry equal visual weight; a highlight (e.g. bolder label or accent
    on 3rd class, which has both the largest width and the worst survival rate) would
    sharpen the storytelling.
  - X-axis has no explicit x_title (relies solely on the '(24.7%)'-style category
    labels) — an axis title like 'Passenger Class (share of total passengers)' would
    remove any ambiguity about what the parenthetical percentage represents.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 (not pure white).
      Chrome: Serif title "Titanic Survival by Passenger Class · bar-spine · python · pygal · anyplot.ai" in dark ink, clearly readable. Y-axis title "Survival Rate (%)" and 0/25/50/75/100% tick labels in dark ink, legible. X-axis category labels "1st Class (24.7%)", "2nd Class (21.2%)", "3rd Class (54.2%)" centered under each variable-width bar, legible. Subtle dashed horizontal gridlines, not competing with data. Legend at bottom with two square swatches ("Survived" green, "Not Survived" lavender), clearly legible.
      Data: Three adjacent bars (no gaps) with widths proportional to class size (24.7% / 21.2% / 54.2%). Each bar is stacked: brand green (#009E73) "Survived" segment on top, lavender (#C475FD) "Not Survived" segment below, heights summing to 100%. Percentage labels ("62% survived", "38% not survived", etc.) sit on or above each segment, all readable against both the cream background and the bright fill colors.
      Legibility verdict: PASS.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 (not pure black).
      Chrome: Title, y-axis title, all tick labels, x-axis category labels, and legend text render in light ink (theme-adaptive), clearly readable against the dark background. Gridlines remain subtle.
      Data: Same brand green (#009E73) and lavender (#C475FD) segments, identical hues to the light render — only chrome flipped, as required. Bar widths and stacked proportions are pixel-identical to the light render.
      Legibility verdict: PARTIAL FAIL for one specific element — the "Survived" series' top-anchored value labels ("62% survived", "43% survived", "26% survived") sit in the page-background band above the bars (not on the green fill) and are rendered in the same fixed dark ink as the light render, giving them low contrast against the near-black background. This is a narrower issue than the title/axis/tick chrome (which all pass); it affects only these 3 data labels. The "not survived" labels, which sit on the bright colored fill itself, remain fully legible in both themes.
