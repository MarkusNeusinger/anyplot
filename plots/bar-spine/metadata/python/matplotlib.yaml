review:
  strengths:
  - 'Genuine data storytelling: the annotation explicitly calling out "1st class:
    62% survival vs. 24% for crew" gives the viewer an immediate takeaway instead
    of a raw data dump'
  - 'Correct spine-plot mechanics: bar widths are proportional to marginal class size
    (via bar_widths = class_totals / grand_total) and segment heights are conditional
    survival proportions, exactly matching the spec''s definition'
  - Historically accurate Titanic contingency-table data (203/122, 118/167, 178/528,
    212/673) closely matches the real, widely-cited passenger-class survival statistics
  - 'Clean theme-adaptive chrome: title/axis labels use INK, ticks/legend use INK_SOFT,
    legend and annotation boxes use ELEVATED_BG with an INK_SOFT border, all consistently
    flipped between light and dark renders'
  - 'Correct Imprint palette use: first series (Survived) is #009E73, second series
    (Did Not Survive) is #C475FD, identical across both themes'
  - Percentage labels inside segments are blanked below an 8% threshold, avoiding
    illegible tiny-segment text
  - Explicitly set font sizes throughout (title 12pt, axis labels 10pt, ticks/legend
    8pt, annotation 7pt) with no reliance on library defaults
  weaknesses:
  - The spec explicitly says bars should be adjacent with 'no gaps' — the thin axvline
    separators drawn in PAGE_BG (linewidth=2.5) between bars visually punch a small
    gap out of the data area at every boundary; consider removing them or shrinking
    to a hairline (~1pt) so the continuous-proportion effect the spec asks for reads
    more clearly
  - The legend (upper-right) sits directly on top of the Crew bar's 'Did Not Survive'
    segment, occluding a slice of live data area rather than floating in true whitespace
    — consider moving it above the plot or into a corner with less overlap, e.g. loc='upper
    left' has the same issue on the 1st Class bar so a horizontal legend above the
    axes may work best
  - 'Semantic color assignment is a missed opportunity: ''Did Not Survive'' uses canonical
    palette position 2 (lavender) instead of the semantic-red anchor, even though
    survival/death outcomes are a textbook case for the bad/loss-outcome color convention
    the style guide calls out — not a compliance violation (canonical order is always
    valid), but a place the repair loop could consider for stronger storytelling'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "bar-spine · python · matplotlib · anyplot.ai" in dark ink, centered, fully visible with no clipping. "Passenger Class" (x) and "Proportion of Passengers" (y) axis labels in dark ink. Tick labels (0/25/50/75/100% and 1st Class/2nd Class/3rd Class/Crew) in soft dark grey. Subtle horizontal grid lines at each 25% increment. Legend box (top-right, light elevated background, soft border) with green "Survived" and lavender "Did Not Survive" swatches. Callout annotation box near the 1st Class bar with dark arrow and dark text on a light elevated fill.
      Data: Four adjacent variable-width bars (1st Class narrowest-but-not-smallest, Crew widest) stacked with green (#009E73, Survived) on the bottom and lavender (#C475FD, Did Not Survive) on top, each segment labeled with a bold white percentage (62%/38%, 41%/59%, 25%/75%, 24%/76%). Thin light-colored vertical dividers separate the bars.
      Legibility verdict: PASS — all text (title, axis labels, ticks, legend, annotation, percentage labels) is clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title, axis labels, and tick labels now rendered in light ink (#F0EFE8 for primary text, #B8B7B0 for ticks/legend), fully legible against the dark background. Grid lines are faint light lines at 25% increments. Legend box uses a dark elevated fill (#242420) with light text and a soft light-grey border. Annotation callout box is dark-elevated with light text and a light-grey arrow, clearly visible.
      Data: Identical bar geometry and identical data colors to the light render — green #009E73 (Survived) and lavender #C475FD (Did Not Survive) are unchanged, confirming only chrome flipped between themes. Vertical dividers between bars now render as dark lines against the surrounding data color, matching the page background as intended.
      Legibility verdict: PASS — no dark-on-dark failures; all title, axis, tick, legend, and annotation text is light-colored and clearly readable against the near-black surface.
