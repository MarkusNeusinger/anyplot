review:
  strengths:
  - 'Correct spine-plot mechanics: bar widths proportional to marginal totals, segment
    heights are conditional proportions summing to 100%, and x-axis tick labels are
    centered under each variable-width bar via computed x_mids.'
  - 'Strong storytelling addition: dashed amber benchmark line marking the best-in-class
    (Enterprise) churn rate with a bold label, giving viewers an immediate comparison
    anchor across tiers.'
  - 'Fully theme-correct in both renders: identical Imprint data colors, correct #FAF8F1/#1A1A17
    backgrounds, all chrome (title, axes, legend) threaded through theme tokens with
    no dark-on-dark or light-on-light failures.'
  - In-bar percentage labels are gated to segments >=8% height, avoiding clutter on
    the smallest segments while keeping the chart informative.
  - Clean, deterministic, KISS-structured code with every import used.
  weaknesses:
  - Title is missing the required {language} segment - currently "bar-spine · letsplot
    · anyplot.ai", should be "bar-spine · python · letsplot · anyplot.ai" to match
    the mandated {spec-id} · {language} · {library} · anyplot.ai format (see the sibling
    matplotlib implementation of this same spec for the correct pattern).
  - 'Consider the semantic-color exception for Churned: since it represents a clear
    negative/loss outcome, the style guide''s status/finance semantic exception (bad/loss
    to red, #AE3030) could be a stronger, more intuitive read than the canonical position-2
    lavender - optional design polish, not a hard violation since canonical order
    is an explicitly sanctioned default.'
  - Design excellence is solid but still reads close to a well-configured default
    beyond the palette and the benchmark-line annotation - a touch more typographic
    hierarchy (e.g. weight/size contrast between plot title and legend title) or refinement
    of the legend box would push this further toward a publication-ready feel.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 - not pure white, not dark.
      Chrome: Title "bar-spine · letsplot · anyplot.ai" (dark ink, top-left), axis titles "Subscription Tier" / "Customer Proportion" and tick labels (0-100% on y, Basic/Standard/Premium/Enterprise centered under each variable-width bar on x) all rendered in dark/soft-dark ink - all clearly readable. "Status" legend (Retained/Churned) sits in an off-white elevated box to the right of the plot with a visible border.
      Data: Bars are stacked rectangles, bottom segment "Retained" in brand green (#009E73), top segment "Churned" in Imprint lavender (#C475FD). White in-bar percentage labels (40%, 60%, 67%, 33%, 80%, 20%, 90%, 10%) are legible against both fills. A dashed amber (#DDCC77) benchmark line at the Enterprise churn level (10%) has a bold dark-ink label "Enterprise-level churn (10%)".
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 - not pure black, not light.
      Chrome: Same title, axis titles, and tick labels rendered in light ink (title/axis-title primary, tick/legend text secondary) - all clearly legible against the dark background. No dark-on-dark failures observed (no black text on near-black bg). Legend box uses the elevated dark fill (#242420) with light text and a visible border.
      Data: Data colors confirmed identical to the light render - same brand green and lavender segments, same amber dashed benchmark line. White in-bar percentage labels remain legible since they sit on the saturated data fills, not the page background.
      Legibility verdict: PASS
