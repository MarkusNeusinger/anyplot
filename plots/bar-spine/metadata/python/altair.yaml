review:
  strengths:
  - 'Correct spine-plot mechanics: bar widths are proportional to age-group marginal
    counts (x_start/x_end from cumulative totals) and every bar height is normalized
    to 100% conditional proportion, matching the spec''s core requirement'
  - Custom Vega-Lite labelExpr places x-axis category labels precisely at each variable-width
    bar's midpoint instead of relying on ordinal ticks — a genuinely idiomatic and
    non-trivial altair technique
  - Percentage labels are shown only for segments ≥10% (pct_label logic), avoiding
    clutter in the thin bottom-of-scale segments while still surfacing the key numbers
  - Canvas lands exactly on the 3200×1800 target in both themes (canvas gate passed)
    with a clean PAD-only implementation per the altair library rules
  - Subtitle ("Comfort with technology collapses sharply past age 55") gives the chart
    a clear point of view, and the data itself (shrinking green segment, growing ochre
    segment left-to-right) visually reinforces that narrative
  - Theme-adaptive chrome is threaded correctly through axis, title, subtitle, and
    legend tokens — both renders are readable and the Imprint data colors are identical
    across light/dark
  - Clean, flat KISS script with no helper functions/classes, deterministic hardcoded
    data, and only used imports (alt, pd, PIL.Image, os, sys)
  weaknesses:
  - 'Title omits the mandated language segment: it reads "Technology Comfort by Age
    Group · bar-spine · altair · anyplot.ai" but the required format is "{Descriptive
    Title} · {spec-id} · {language} · {library} · anyplot.ai" — insert "python" between
    "bar-spine" and "altair" (compare plots/bar-basic/implementations/python/altair.py
    which does this correctly)'
  - The percentage labels inside segments use a fixed white text color (mark_text
    color="white") regardless of segment fill. On the lavender "Comfortable" segments
    (#C475FD) and, to a lesser extent, the ochre "Uncomfortable" segments (#BD8233),
    white-on-color contrast is roughly 2.9:1 and 3.4:1 respectively — below the 4.5:1
    WCAG threshold for text this size (10pt). Pick text color per-segment (dark INK
    on the lighter lavender/ochre fills, white on the darker green/blue fills) or
    add a subtle text outline/shadow so all percentage labels clear contrast on every
    segment color
  - mark_rect uses stroke=PAGE_BG with strokeWidth=1.2 on every rectangle, which paints
    a visible background-colored seam between adjacent bars (and between stacked segments).
    The spec explicitly asks for bars to be "adjacent with no gaps to emphasize the
    continuous proportion axis" — the underlying x_start/x_end values are contiguous,
    but the stroke renders as a real visual gap between age groups. Reduce the stroke
    to a hairline (or drop it just on the outer bar-to-bar seams) so neighboring bars
    read as touching
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1), matches the required light-theme page surface, not pure white.
      Chrome: Bold dark title "Technology Comfort by Age Group · bar-spine · altair · anyplot.ai" and a grey subtitle ("Comfort with technology collapses sharply past age 55") sit top-left, dark axis titles ("Age Group", "Proportion of Respondents") and soft-grey tick labels/axis lines are all clearly legible against the light background. The legend ("Technology Comfort") sits in a bordered off-white box to the right with dark title text and soft-grey labels.
      Data: Six variable-width bars (18-24 through 65+), each stacked and normalized to 100%. First series "Very Comfortable" is Imprint green (#009E73), followed by lavender "Comfortable", blue "Neutral", and ochre "Uncomfortable" — matching canonical Imprint order. White bold percentage labels appear inside segments ≥10%. Bar widths visibly shrink for older/smaller cohorts (25-34/35-44 widest, 65+ narrowest), and the ochre "Uncomfortable" band visibly grows left to right while the green band shrinks, reinforcing the subtitle's claim.
      Legibility verdict: PASS overall — all title/axis/tick/legend text is readable. Minor caveat: the white percentage-label text on the lavender and ochre segments has borderline-low contrast (see weaknesses), though it remains parseable.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17), matches the required dark-theme surface, not pure black.
      Chrome: Title and axis titles render in near-white ink, subtitle and tick labels in light grey — all clearly legible against the dark background, no dark-on-dark failures observed. Legend box uses the elevated dark fill (#242420) with a soft border, and its title/label text is light and readable.
      Data: Identical bar geometry and identical Imprint data colors (green/lavender/blue/ochre) to the light render — confirmed only chrome (background, text, legend frame, grid) flipped between themes, not the data palette.
      Legibility verdict: PASS overall — same borderline white-on-lavender/ochre percentage-label contrast caveat as the light render, but no chrome legibility failures.
