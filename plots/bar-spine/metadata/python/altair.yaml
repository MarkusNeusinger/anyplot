review:
  strengths:
  - Subtitle delivers genuine data storytelling ("Comfort with technology collapses
    sharply past age 55") that is actually supported by the data ordering (51% ->
    10% Very Comfortable from 18-24 to 65+).
  - Percentage-label text color is chosen per-category for contrast against each fixed
    Imprint fill (LABEL_TEXT_COLOR dict) rather than one hardcoded color -- legible
    white-on-green/blue and dark-on-purple/amber in both themes.
  - Bar widths are correctly proportional to marginal age-group totals and segments
    correctly normalize to 100% height, with bars adjacent (only a thin PAGE_BG-colored
    separator stroke) -- matches the spine-plot definition precisely.
  - Custom Vega-Lite labelExpr axis technique centers each age-group tick label at
    the true bar midpoint despite the irregular variable-width geometry.
  - Light and dark renders use identical Imprint data colors for all four categories
    and correctly swap only chrome tokens (background, ink, grid).
  weaknesses:
  - Aesthetic sophistication is solid but not exceptional -- beyond the contrast-aware
    segment labels and subtitle, the chart relies on fairly standard bar/legend chrome
    with no distinguishing visual flourish.
  - Y-axis gridlines (gridOpacity=0.10) are barely visible at final scale in both
    renders -- could be nudged up slightly (e.g. 0.15) for better guide value without
    becoming heavy.
  - There is noticeable dead space between the rightmost bar and the legend box at
    this canvas width -- tightening legend padding/offset would use the space more
    intentionally.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (~#FAF8F1), correct light-theme token -- not pure white.
      Chrome: Title "Technology Comfort by Age Group · bar-spine · python · altair · anyplot.ai" in bold dark ink, subtitle "Comfort with technology collapses sharply past age 55" in softer dark-grey ink, both fully visible with no clipping. Axis titles ("Age Group", "Proportion of Respondents") and tick labels (0%-100%, six age-group categories) render in dark/soft-dark ink, clearly legible against the light background. Legend box ("Technology Comfort") sits at the right with a near-white fill and soft border, all four category labels readable.
      Data: Six variable-width, adjacent bars (18-24 narrowest through 35-44 widest back down to 65+ narrow), each stacked into four segments colored Very Comfortable=#009E73 (green, first series correct), Comfortable=purple, Neutral=blue, Uncomfortable=amber. Percentage labels inside segments >=10% use white text on green/blue and dark text on purple/amber, all readable.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black (~#1A1A17), correct dark-theme token -- not pure black.
      Chrome: Same title and subtitle text, now rendered in light ink / soft light-grey, fully legible against the dark background. Axis titles and tick labels use light/soft-light ink, clearly visible, no dark-on-dark failures anywhere (ticks, axis titles, legend text all confirmed legible). Legend box uses a dark elevated fill with light text and soft border, readable.
      Data: Identical four Imprint colors and identical proportions/segment layout to the light render -- confirmed pixel-for-pixel color parity (green #009E73, purple, blue, amber unchanged). Only chrome (background, text ink, grid, legend fill) flipped between themes, as required.
