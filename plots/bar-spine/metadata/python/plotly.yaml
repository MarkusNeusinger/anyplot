  - 'Correct spine-plot construction: bar widths are exactly proportional to marginal
    channel counts (widths = counts / total), segments stack to 100%, and bars are
    perfectly adjacent (bargap=0) per the spec''s core requirement'
  - Thoughtful semantic color mapping (Active=brand green, On Trial=amber, Cancelled=matte
    red) that follows the Imprint style guide's status/quality semantic-exception
    rule, with a code comment explaining the reasoning
  - Storytelling annotations calling out the highest-cancellation and best-retention
    channels give the chart a clear focal point and immediate insight (DE-03)
  - Sample sizes (n=NNN) baked into the x-axis tick labels add real context without
    cluttering the legend or adding a separate data table
  - In-segment percentage labels are conditionally suppressed below 9% to avoid clutter
    in thin segments -- a smart, spec-aligned 'when space permits' heuristic
  - 'Both renders are clean: identical data colors between themes, correctly flipped
    chrome, fully legible text, and canvas dimensions land exactly on the 3200x1800
    landscape target'
  weaknesses:
