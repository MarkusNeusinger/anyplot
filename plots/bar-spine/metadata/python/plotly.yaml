    Title} · {spec-id} · {language} · {library} · anyplot.ai'' -- ''python'' is missing
    between ''bar-spine'' and ''plotly'' in the title.text string inside update_layout()'
  - Legend and both annotation boxes draw visible borders (bordercolor/borderwidth=1),
    which is a minor departure from the style guide's 'remove box frames around legends'
    guidance -- consider a borderless legend or a much lighter divider
