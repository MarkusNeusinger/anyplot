review:
  strengths:
  - Semantic color mapping (green=Retained, red=Churned) is well-justified per the
    style guide's semantic exception, and reinforced with explicit legend text so
    it doesn't rely on color alone.
  - 'All spec requirements implemented faithfully: proportional widths, no-gap adjacency,
    in-segment percentage labels, and centered x-axis captions with sample sizes.'
  - Realistic, well-scaled business data that itself tells a clear channel-quality
    story.
  - Clean, deterministic, KISS-structured code.
  weaknesses:
  - 'Library Mastery is weak: no actual seaborn plotting function (sns.barplot, etc.)
    is used - only sns.set_theme/sns.despine for styling, while all data marks are
    drawn via raw matplotlib ax.bar/ax.text. Consider routing colors through sns.color_palette
    or otherwise leaning on a seaborn idiom in the data-drawing path.'
  - 'Design Excellence is solid but not exceptional: the plot would benefit from a
    stronger focal-point callout (e.g., an annotation or highlight on the highest-churn
    channel) to elevate data storytelling from ''visible pattern'' to ''immediately
    obvious insight''.'
  - Minor refinement headroom (cleaner legend frame, tick-mark removal) to move visual
    refinement from 'good' to 'every detail polished'.
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white, consistent with #FAF8F1 - not pure white.
      Chrome: dark title "Customer Retention by Channel · bar-spine · python · seaborn · anyplot.ai" fully visible at top; y-axis "Proportion of Customers" with 0/25/50/75/100% ticks; x-axis channel names with (n=...) sample sizes; subtle horizontal grid; upper-right legend box with "Retained"/"Churned" swatches. All chrome text is dark ink on the light surface and clearly readable.
      Data: 5 variable-width bars (Referral, Organic Search, Email, Direct, Paid Social), each stacked into a green (#009E73) "Retained" segment (bottom) and a matte-red (#AE3030) "Churned" segment (top), each with a bold white percentage label. First series confirmed #009E73.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black, consistent with #1A1A17 - not pure black.
      Chrome: title, axis label, and x-axis captions render in light cream/off-white; tick labels and channel captions in a softer light grey; grid in a faint light tint; legend box uses a dark elevated fill with light border and light text. No dark-on-dark issues found - all chrome text is clearly legible against the dark surface.
      Data: identical green (#009E73) and matte-red (#AE3030) segments in the same positions/proportions as the light render - confirmed unchanged across themes. White in-segment percentage labels remain legible on both fills.
      Legibility verdict: PASS
