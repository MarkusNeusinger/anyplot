review:
  strengths:
  - 'Correct spine-plot mechanics: bar widths are proportional to each channel''s
    marginal frequency (n=850 down to n=290), and every bar''s stacked segments sum
    to exactly 100%, matching the spec''s core requirement'
  - Theme-adaptive chrome is fully correct in both renders — backgrounds, text, grid,
    and legend box all flip appropriately while the Retained/Churned data colors stay
    pixel-identical between light and dark
  - Percentage labels inside segments with a sensible visibility threshold (only shown
    when proportion > 6%) keep the chart readable without clutter in thin segments
  - 'Smart semantic color assignment: Retained uses brand green (#009E73), Churned
    uses the semantic-red anchor (#AE3030) per the style guide''s status exception
    — matches reader intuition immediately'
  - X-axis labels double as the marginal-frequency context (channel name plus n=count),
    reinforcing the spine plot's variable-width semantics for the viewer
  - Channels are ordered by descending retention rate, creating an implicit best-to-worst
    narrative across the row of bars
  weaknesses:
  - Legend (loc='upper right') sits very close to the top of the Paid Social bar's
    Churned segment — add bbox_to_anchor or extra ylim headroom to guarantee a clean
    gap between the legend box and bar tops
  - All bar drawing goes through raw matplotlib ax.bar() rather than a seaborn plotting
    function (seaborn's barplot can't vary width per category) — seaborn usage is
    limited to theming/palette routing, so Library Mastery scores low; consider whether
    any seaborn-native statistical or faceting feature could be layered in without
    breaking the variable-width requirement
  - Design Excellence is solid but not yet publication-grade — consider a subtle secondary
    visual cue (e.g. faint category-total labels above bars, or a reference line)
    to push Data Storytelling further
