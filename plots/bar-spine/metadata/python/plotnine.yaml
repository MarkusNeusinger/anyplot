review:
  strengths:
  - 'Correctly implements the spine-plot mechanics that plotnine has no native geom
    for: bar widths proportional to marginal frequency via geom_rect with cumulative
    xmin/xmax, and segment heights normalized to 100% via per-category cumulative
    proportions.'
  - 'Thoughtful semantic color mapping: Kept keeps the mandatory brand-green slot,
    while Refunded intentionally borrows the semantic-red Imprint slot instead of
    the next ordinal one, and categories are pre-sorted worst-return-rate-first, giving
    the chart a clear ''where do returns hurt most'' narrative.'
  - Percentage labels are suppressed below a 6% threshold, avoiding clutter in thin
    segments while still labeling every meaningfully sized band.
  - Theme-adaptive chrome (backgrounds, ink tokens, legend fill) is correctly threaded
    through and holds up identically in both the light and dark renders.
  weaknesses:
  - panel_border=element_rect(color=INK_SOFT, fill=None, size=0.5) draws a full solid
    rectangle around the plot area — the default-style-guide.md 'No chartjunk' guidance
    calls out decorative borders specifically; prefer an L-shaped bottom+left axis_line
    (or drop the border entirely) instead of boxing the panel.
  - Title ('Product Returns by Category · bar-spine · python · plotnine · anyplot.ai')
    runs to roughly 89% of the canvas width because of the added descriptive prefix
    on top of the mandated title — close to the ~90% overflow ceiling. Trim the prefix
    or drop plot_title size by ~1pt for more breathing room.
  - The thinnest segments (Books' Exchanged ≈1% and Refunded ≈3%) are barely-visible
    slivers with no label (correctly suppressed under the 6% threshold) — consider
    a subtle minimum-visible-width treatment so the smallest categories don't nearly
    vanish.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — correct light-theme surface, not pure white.
      Chrome: Bold dark title "Product Returns by Category · bar-spine · python · plotnine · anyplot.ai" spans most of the top width but stays inside the canvas; dark-ink axis titles ("Product Category (bar width ∝ order volume)", "Share of Orders") and soft-ink tick labels (0%/25%/50%/75%/100%, category names with n= counts) are all clearly legible against the light background. Legend box (title "Outcome", entries Kept/Exchanged/Refunded) sits on an elevated off-white panel with a visible border, fully readable.
      Data: Five variable-width bars (Apparel, Electronics, Home & Garden, Toys, Books) stacked with green (Kept, #009E73), purple (Exchanged), and red (Refunded) segments; white percentage labels are shown inside segments ≥6% of the bar (65/10/25, 72/8/20, 82/4/14, 91/2/7, 96 for Books) and correctly omitted for the two sub-6% Books segments. First series is the mandatory brand green.
      Legibility verdict: PASS — no light-on-light or unreadable text found.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — correct dark-theme surface, not pure black.
      Chrome: Title, axis titles, and tick labels all render in light ink and are clearly visible against the dark background; no dark-on-dark text found. Legend box uses the elevated dark surface (#242420) with light text, fully legible. Segment separator strokes flip from white (light render) to near-black (dark render) since they're drawn in the page-background color, which reads as clean thin dividers in both themes.
      Data: Identical green/purple/red hues and identical percentage values to the light render — only the chrome (background, ink, borders) flipped, data colors unchanged as required.
      Legibility verdict: PASS — no dark-on-dark or unreadable text found.
