review:
  strengths:
  - 'Correct spine-plot semantics: bar widths proportional to department marginal
    totals, segments stacked to 100%, bars adjacent with no gaps'
  - Well-reasoned semantic-exception color mapping (green=on-time, amber=warning,
    red=cancelled) with documented per-fill label-contrast handling
  - 'Effective data-storytelling touch: dashed connector + "Best: 85% on-time" callout
    in the reserved headroom highlights the top-performing department'
  - Theme-adaptive chrome correctly threaded through title, axes, ticks, grid, and
    legend in both renders with no legibility failures
  - Percentage labels inside segments are large and readable, with an 8% threshold
    that avoids clutter in the thin Cancelled bands
  weaknesses:
  - 'Title omits the mandated {language} token: currently ''Project Completion Status
    by Department · bar-spine · bokeh · anyplot.ai'' instead of ''... · bar-spine
    · python · bokeh · anyplot.ai'' — insert ''python'' between the spec-id and the
    library name'
  - Legend (top_left) sits directly above the Engineering bar and its bottom edge
    grazes the 100% gridline, slightly intruding into the top of that bar's Cancelled
    segment — increase headroom or reposition the legend so its bounding box stays
    fully above y=1.0
  - Green (On Time) and red (Cancelled) segments share the same stacked bar; position
    and in-segment labels mitigate it but this pairing is worth a second look for
    red-green color-blind users if the pattern recurs
  - np.random.seed(42) is set but never used — all data is hardcoded constants, so
    the seed call is dead code
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1.
      Chrome: Title "Project Completion Status by Department · bar-spine · bokeh · anyplot.ai" in dark ink, top-left legend (On Time / Delayed / Cancelled) with dark text on a light elevated panel, x-axis "Department (bar width ∝ project count)" and y-axis "Proportion of Projects" labels in dark ink, percentage y-axis ticks (0%-100%) and department names (Engineering, Marketing, Sales, Operations) in soft dark gray. A dashed connector plus "★ Best: 85% on-time" callout sits in the headroom above the Operations bar.
      Data: Four adjacent stacked bars with widths proportional to each department's project count (Engineering widest region on the left down to Marketing narrowest). Segments are green (On Time, #009E73), amber (Delayed), and red (Cancelled) bottom-to-top, with bold percentage labels (e.g. 65%, 27%, 71%, 21%, 73%, 20%, 85%, 12%) inside segments ≥8% of the bar height.
      Legibility verdict: PASS — all text is clearly readable against the light background; the legend's bottom edge grazes the top of the Engineering bar but does not obscure any text.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17.
      Chrome: Same title, legend, and axis labels now rendered in light ink (white title/axis labels, light-gray tick labels and legend text) against the dark elevated legend panel. Grid lines are barely visible, subtle as intended.
