review:
  strengths:
  - Manual geom_rect-based spine plot construction with correctly cumulative proportional
    widths (marginal frequency) and heights (conditional proportions) — the technically
    correct approach since ggplot2 has no built-in spineplot geom.
  - Distinctive dashed trend-line + point-marker overlay connecting the retention
    rate across tiers, reinforced by the subtitle — turns the width+color pattern
    into an explicit data story.
  - Correct semantic color mapping (brand green = Retained, matte red = Churned) using
    the exact Imprint hex values, identical across both themes — only chrome flips.
  - Percentage labels are filtered to segments above 6% of bar height, correctly omitting
    the label from the tiny 4% Enterprise-churn sliver to avoid clutter.
  - 'Clean theme-adaptive chrome: background, ink tokens, and grid all flip correctly
    between light and dark renders while data colors stay pixel-identical.'
  weaknesses:
  - Title runs very close to the canvas's right edge (~95%+ of width) even after the
    length-based fontsize scaling formula was applied — reduce the fontsize slightly
    further or add a bit more right margin so the title isn't crowding the border.
  - The '8%' churn label for the Premium tier sits very close to the retention trend-line
    marker directly above it — nudge the label down or the marker up slightly to add
    breathing room.
  - Red/green is the only hue distinguishing Retained vs. Churned; position and percentage
    labels provide redundant cues, but a CVD-safe accent (subtle outline or texture)
    would strengthen accessibility further.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Bold dark title "Customer Retention by Subscription Tier · bar-spine · r · ggplot2 · anyplot.ai" at top, italic gray subtitle below it, dark axis titles ("Share of Customers" / "Subscription Tier (bar width ∝ customer base)"), gray tick labels along both axes, and a "Status" legend at the right with green "Retained" / red "Churned" swatches. Subtle horizontal gridlines only.
      Data: Four adjacent variable-width bars (Basic, Standard, Premium, Enterprise) stacked green-over-red, normalized to 100% height. Bold white bold percentage labels (68%, 32%, 82%, 18%, 92%, 8%, 96%) inside segments large enough to hold them (Enterprise's 4% churn sliver correctly omits its label). A black dashed line with white-ringed point markers tracks the retention-rate boundary across tiers, rising left to right.
      Legibility verdict: PASS — all title, subtitle, axis, tick, and legend text is clearly readable against the light background; no light-on-light text found.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Same layout as the light render with all chrome tokens flipped to light colors — white/cream title, light-gray subtitle, light axis titles and tick labels, and a "Status" legend with the same swatches. Gridlines are faint and appropriately subtle against the dark surface.
      Data: Identical green (#009E73) and red (#AE3030) segment colors to the light render, confirming the data palette is theme-invariant. The trend line and its point markers flip to white so they remain visible on the dark surface, tracking the same tier-over-tier retention climb.
      Legibility verdict: PASS — title, subtitle, axis titles, tick labels, and legend text are all clearly readable light-on-dark; no dark-on-dark failures found.
