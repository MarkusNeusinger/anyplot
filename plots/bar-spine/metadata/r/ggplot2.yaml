review:
  strengths:
  - 'Correct spine-plot semantics: bar widths proportional to marginal tier frequency,
    segment heights normalized to 100%, bars adjacent with zero gap.'
  - Title fontsize auto-scales with character count (12 * 58 / nchar(title)) so the
    descriptive-prefixed title stays proportioned instead of overflowing.
  - The retained/churned boundary trend line is explicitly designed and commented
    as structural chrome (not a third data series), reinforcing the 'retention climbs
    with tier' story without confusing the legend.
  - Percentage-label placement is offset away from the trend-line marker so labels
    never crowd it, even in the thinnest churn segments (8%, 18%).
  - Semantic palette use (green = retained/good, red = churned/bad) matches the documented
    Imprint semantic-exception order.
  weaknesses:
  - Retained/Churned still relies on a red-green hue pair as one of the distinguishing
    cues; position (bottom/top) and the printed percentages mitigate this for CVD
    viewers, but it's worth keeping in mind if this spec is ever extended to more
    categories.
  - Trend-line point markers (size 2.2) are on the small side at full 3200x1800 resolution
    relative to the bold percentage labels - could be bumped slightly for better visual
    parity.
  - Library mastery is solid but generic grammar-of-graphics usage (geom_rect/geom_line/geom_point/geom_text);
    no ggplot2-distinctive feature (e.g. patchwork, custom stat_*) beyond what any
    grammar-of-graphics tool provides.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1.
      Chrome: Bold dark title "Customer Retention by Subscription Tier · bar-spine · r · ggplot2 · anyplot.ai", italic grey subtitle, dark axis titles, softer grey tick labels, legend "Status" (Retained/Churned) on the right — all clearly readable against the light background.
      Data: Four variable-width bars (Basic, Standard, Premium, Enterprise), each stacked to 100% with a green (#009E73) "Retained" base and a red (#AE3030) "Churned" cap. A dashed reference trend line with white-filled/dark-outlined circle markers traces the retained/churned boundary. Bold near-white percentage labels sit inside each segment.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17.
      Chrome: Title, subtitle, axis titles, tick labels, and legend all flip to light ink and remain clearly legible; no dark-on-dark failures observed anywhere.
      Data: Green/red segment colors are pixel-identical to the light render (only chrome flipped, as required). The trend line and marker outline flip to a light off-white and stay visible against both fills. Percentage labels remain legible near-white text on both segment colors.
      Legibility verdict: PASS
