review:
  strengths:
  - 'Correct spine-plot geometry: bar widths are proportional to per-tier customer
    totals (edges/lefts/rights derived via cumsum of tier_totals), segment heights
    sum to exactly 100%, and bars are drawn adjacent with no gaps'
  - 'Thoughtful semantic-exception color use: Retained/Churned is a documented good/bad
    pair, so brand green (#009E73) and matte red (#AE3030) replace the ordinal 1st/2nd
    palette slots per the style guide''s semantic-exception rule -- explicitly reasoned
    about in code comments'
  - Churned segments carry a diagonal Makie.Pattern hatch on top of the red fill,
    so the good/bad distinction survives red-green color-vision deficiency instead
    of relying on hue alone
  - Percentage labels rendered inside every segment (including the thin 11% Enterprise-churned
    slice) remain legible and correctly centered in both themes
  - 'Theme-adaptive chrome is fully correct: PAGE_BG/INK/INK_SOFT tokens flip cleanly,
    top/right spines hidden, legend frame removed, all text readable on both #FAF8F1
    and #1A1A17 backgrounds'
  - 'All required spec features present: bar-width-as-marginal-frequency, stacked
    conditional proportions, normalized 100% height, adjacent bars, distinct colors
    with legend, x-axis labels centered under variable-width bars, percentage labels
    within segments'
  weaknesses:
  - Design excellence is strong but stops short of a fully 'publication-ready' treatment
    -- e.g. no explicit callout/annotation drawing the eye to the headline insight
    (retention rising monotonically with tier), relying only on left-to-right ordering
    and color to carry the story
  - Percentage labels use plain white text on both green and red fills; a slightly
    darker/mixed tone for the smallest (11%) segment would improve contrast marginally
    further, though legibility is already acceptable
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 -- not pure white.
      Chrome: Title "SaaS Subscription Churn · bar-spine · julia · makie · anyplot.ai" in dark ink, comfortably sized and fully visible with no clipping. X-axis label "Subscription Tier (bar width ∝ customer count)" and y-axis label "Share of Customers" in dark ink, similarly sized. Tick labels (Basic/Standard/Premium/Enterprise and 0%-100%) in a softer dark gray, all clearly legible. Top/right spines removed, left/bottom spines present in soft gray.
      Data: Four adjacent bars of varying width (Basic narrowest through mid-width Standard, wider Premium, widest-looking Enterprise proportionally by customer count). Each bar is split into a green "Retained" segment (bottom, #009E73) and a red diagonally-hatched "Churned" segment (top, #AE3030 with darker hatch lines). White percentage labels are centered in each segment (e.g. 52%/48% for Basic, 89%/11% for Enterprise). Legend at right lists "Retained" (solid green swatch) and "Churned" (hatched red swatch).
      Legibility verdict: PASS -- all text is clearly readable against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 -- not pure black.
      Chrome: Same title and axis labels now rendered in light ink (near-white), tick labels in a lighter soft gray -- clearly legible against the dark surface. Spines and grid follow the same soft-gray treatment adapted for the dark theme.
      Data: Identical green (#009E73) and hatched red (#AE3030) segments as the light render, in the same tier order and proportions -- confirms only chrome (background, text, spine colors) changed between themes, not the data colors. Percentage labels remain white and legible on both fills.
      Legibility verdict: PASS -- all text is clearly readable against the dark background; no dark-on-dark failures observed (title, axis labels, and tick labels are all light-colored and distinct from the near-black background).
