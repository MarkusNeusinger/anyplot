review:
  strengths:
  - Solves Chart.js's lack of native variable-width-bar support by writing a self-contained
    afterDatasetsDraw plugin against a hidden scatter-chart scale host — uses Chart.js's
    own documented extension API rather than reaching for an external plugin or a
    sibling library, exactly per the library's ‘no workarounds’ rule
  - 'Correct spine-plot mechanics: bar width is exactly proportional to marginal tier
    size via cumulative edges, segment height encodes conditional retained/churned
    split, bars are flush with no gaps, and x-axis tick labels are centered under
    each variable-width bar via afterBuildTicks'
  - 'Both renders are theme-correct: page background, title, axis labels, ticks and
    legend text all flip correctly between #FAF8F1/#1A1A17 while the Retained/Churned
    data colors stay pixel-identical'
  - Thoughtful semantic color exception (churn = matte red, retained = brand green)
    reinforced with a redundant ink-color outline stroke on every segment — directly
    implements the style guide's CVD-safety carve-out instead of relying on hue alone
  - Percentage labels are only drawn when a segment is tall enough (>=45px) to hold
    them, so the tiny Enterprise-churned sliver correctly omits its label instead
    of overlapping or clipping
  - Realistic, neutral SaaS churn dataset spanning the full range of the phenomenon
    (40% churn on Free down to 4% on Enterprise), which is exactly the kind of pattern
    a spine plot is built to reveal
  weaknesses:
  - The core bar/segment geometry is drawn entirely with raw ctx.fillRect/strokeRect
    calls rather than through Chart.js's dataset/controller system — a pragmatic and
    necessary choice for a chart type the bar controller can't express, but it means
    the library's high-level API isn't used for the actual data marks (affects Library
    Mastery, not a defect)
  - 'Design polish is strong but stops short of publication-ready flourish: no callout/annotation
    names the churn-vs-tier insight explicitly, and the y grid is configured but fully
    hidden behind the opaque bars rather than an intentional ''no grid'' choice'
  - The edges/centers derivation plus the custom plugin push the script past a pure
    linear Data→Plot→Save structure — justified by the plot type, but worth noting
    for KISS scoring
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matching #FAF8F1 — not pure white.
      Chrome: Title "Customer Churn by Subscription Tier · bar-spine · javascript · chartjs · anyplot.ai" in dark ink, centered at top; legend ("Retained" green swatch, "Churned" red swatch) centered below the title; x-axis tick labels (Free, Basic, Pro, Enterprise) in soft dark gray under each bar; x-axis title "Subscription tier — bar width ∝ customer count"; y-axis ticks 0%–100% in steps of 20; y-axis title "Share of customers". All text is clearly legible against the light background — no light-on-light issues.
      Data: Four flush, variable-width bars (Free ≈29%, Basic ≈44%, Pro ≈20%, Enterprise ≈7% of total width), each stacked with a brand-green "Retained" segment (bottom) and a matte-red "Churned" segment (top), both outlined with a thin dark stroke. In-segment white percentage labels read 60/40 (Free), 78/22 (Basic), 90/10 (Pro), and 96% Retained only on Enterprise (4% Churned segment omitted — too thin to hold a label). Thin off-white divider lines separate the two segments within each bar and separate adjacent bars.
      Legibility verdict: PASS.

    Dark render (plot-dark.png):
      Background: Warm near-black, matching #1A1A17 — not pure black.
      Chrome: Same title, legend, tick labels and axis titles as the light render, now rendered in light ink/off-white tones. All chrome elements are clearly readable against the dark background — no dark-on-dark failures (tick labels, axis titles, and legend text are all light-colored, not black-on-black).
      Data: Identical bar widths, stack heights and percentage labels as the light render. The green "Retained" (#009E73) and red "Churned" segments are pixel-identical in hue to the light render — confirms only chrome flipped between themes, not data colors.
      Legibility verdict: PASS.
