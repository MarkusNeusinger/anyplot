review:
  strengths:
  - 'Elegant workaround for Chart.js''s core limitation (no per-bar-width hook on
    the bar controller): mounts an invisible scatter chart purely for scales/legend/title,
    then draws pixel-precise proportional rectangles in an `afterDatasetsDraw` plugin
    using the scales'' own pixel mapping — a genuinely idiomatic use of Chart.js''s
    documented extension point instead of reaching for another library.'
  - 'Correct spine-plot semantics: bar widths are exactly proportional to marginal
    tier size via cumulative edges, segment heights sum to 100% per bar, and bars
    are flush with no real data gap.'
  - 'Adaptive segment labels: percentage text is only drawn when the segment is tall
    enough to hold it legibly (Enterprise''s 4% churn sliver correctly omits its label),
    avoiding clutter.'
  - 'Realistic, well-chosen dataset: churn decreases monotonically and plausibly from
    Free (40%) to Enterprise (4%), telling a clear story at a glance without needing
    annotations.'
  - 'Theme-correct in both renders: identical data colors, theme-adaptive text/background,
    no dark-on-dark or light-on-light issues.'
  - Semantic red/green choice for Churned/Retained is a deliberate, spec-sanctioned
    use of the style guide's semantic-exception rule, not an arbitrary color pick.
  weaknesses:
  - 'VQ-04: Retained/Churned rely on a green/red hue pair as the primary channel.
    It''s mitigated by a fixed stacking order and inline percentage labels, but since
    churn is a critical status signal, a subtle 1px stroke or texture on one segment
    would make the encoding fully robust for deuteranopia/protanopia readers.'
  - The 2px page-background divider between adjacent bars is a nice legibility touch
    but should stay hairline-thin (it already is) so it never reads as an actual gap,
    since the spec calls for bars to be visually flush.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1) — not pure white, correct.
      Chrome: Title "Customer Churn by Subscription Tier · bar-spine · javascript · chartjs · anyplot.ai" in dark ink, clearly legible. Legend ("Retained" green swatch, "Churned" red swatch) in dark text below the title. Y-axis title "Share of customers" and tick labels (0%-100%, step 20%) in soft dark ink, readable. X-axis title "Subscription tier — bar width ∝ customer count" and tier labels (Free, Basic, Pro, Enterprise) centered under each variable-width bar, readable.
      Data: Four bars of different widths (Free narrowest of the churn-heavy group, Basic widest overall, Pro medium, Enterprise narrowest), each split into a green "Retained" segment (bottom) and red "Churned" segment (top), always summing to 100%. First series is #009E73 brand green as required; second series uses the matte-red semantic anchor (#AE3030) for the loss/churn role. White percentage labels (60%/40%, 78%/22%, 90%/10%, 96%) sit inside each segment large enough to hold them; the thin 4% Enterprise churn sliver correctly omits its label to avoid an unreadable cramped number. Thin off-white divider lines separate segments and adjacent bars for definition.
      Legibility verdict: PASS — all text is clearly readable against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17) — not pure black, correct.
      Chrome: Title, legend text, axis titles, and tick labels all render in light ink (near-white/soft-gray), fully legible against the dark surface. No dark-on-dark failures observed anywhere (title, legend, axis titles, tick labels, tier labels are all clearly visible).
      Data: Same bar widths and proportions as the light render. Data colors are identical to the light render — green #009E73 and red #AE3030 unchanged; only the chrome (background, text) flipped for the dark theme, confirming palette-position stability across themes.
      Legibility verdict: PASS — all text is clearly readable against the dark background, no dark-on-dark failures found.
