review:
  strengths:
  - WCAG-contrast-aware in-segment label coloring (textColorFor) picks black or white
    per fill so percentage labels stay legible regardless of segment color or theme
  - Largest-remainder rounding (roundToHundred) guarantees the in-segment percentage
    labels always sum to exactly 100 per bar instead of drifting to 99/101
  - 'Correctly implements the core spine-plot mechanic: bar widths proportional to
    marginal n via d3.stack''s expand offset, bars fully adjacent with no gaps, all
    normalized to 100% height'
  - Thoughtful semantic color mapping (brand green = Improved, matte red = Worsened,
    muted gray = No Change) matches the style guide's sentiment/polarity and bad/error
    semantic exceptions instead of defaulting to ordinal palette order
  - Graceful label degradation shrinks font size one step before suppressing labels
    outright on thin segments, rather than jumping straight from readable to invisible
  - Legend is precisely centered using measured getBBox widths rather than guessed
    offsets
  - 'Clear hierarchy: title, legend, category + n labels, and an explicit footnote
    clarifying that bar width encodes group size — a convention that is easy to miss
    without it'
  weaknesses:
  - Y-axis gridlines (axisLeft(...).tickSize(-iw)) are drawn before the bar groups
    and are completely hidden behind the opaque, gapless bar rectangles that tile
    the full inner width -- the grid extension has zero visible effect in either render.
    Either drop tickSize(-iw) (keep default short tick marks) or accept the tick labels
    alone as sufficient, since bar segment boundaries already delineate values.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (~#FAF8F1), not pure white.
      Chrome: Bold centered title "Clinical Trial Outcome by Dosage · bar-spine · javascript · d3 · anyplot.ai" in dark ink; a centered legend (Improved / No Change / Worsened swatches) below the title; y-axis tick labels (0%-100%) and a rotated "Share of group" axis label in soft ink; bold category names (Placebo, Low Dose, Medium Dose, High Dose) and lighter "n = ..." counts centered under each bar; an italic footnote at the bottom explaining bar width encodes group size. All chrome text is clearly legible against the light background.
      Data: Four adjacent, gapless bars with widths proportional to n (Medium Dose widest at n=150, High Dose narrowest at n=80). Each bar is stacked bottom-to-top as Improved (brand green #009E73) / No Change (dark muted gray) / Worsened (matte red), each segment separated by a thin light stroke and labeled with a bold percentage in a text color (black or white) chosen for contrast against that segment's fill. First categorical series is confirmed as the brand green #009E73.
      Legibility verdict: PASS.

    Dark render (plot-dark.png):
      Background: Warm near-black (~#1A1A17), not pure black.
      Chrome: Same title, legend, axis labels, category/n labels, and footnote, all recolored to light ink tones (off-white title/labels, softer light-gray secondary text) so everything reads clearly against the dark background. No dark-on-dark text was found anywhere.
      Data: Identical bar widths, stacking, and segment order as the light render. Data colors are pixel-identical to the light render (brand green, matte red, and the muted gray anchor flips from dark-gray-on-light to light-gray-on-dark as intended for the theme-adaptive "muted" token) -- confirming only chrome flipped, not data hues. In-segment percentage labels remain legible via the same contrast-aware text-color logic (e.g. black text on the now-lighter "No Change" gray, white text on the still-vivid green/red segments).
      Legibility verdict: PASS.
