review:
  strengths:
  - 'Correct spine-plot semantics: bar width proportional to marginal n, segments
    normalized to 100% conditional share'
  - Well-justified semantic color exception (Improved=brand green, No Change=muted
    anchor, Worsened=matte-red semantic anchor) with a code comment explaining the
    rationale
  - Dynamic WCAG-contrast text-color selection keeps in-segment percentage labels
    readable regardless of segment fill or theme
  - Clean theme-adaptive chrome throughout; muted anchor correctly flips between themes
    while categorical data colors stay identical
  - 'Helpful supporting context: n = ... sample sizes per bar and an italic footnote
    explaining the width encoding'
  weaknesses:
  - Thinnest segment bands (10%) are close to the 34px label-suppression threshold;
    consider a slightly larger safety margin or leader-line labels for future data
    ranges with even thinner segments
  - Data storytelling relies on implicit ordering/color proportion rather than an
    explicit annotation calling out the dose-response trend
  - Dose-response curve is somewhat idealized (no corresponding uptick in adverse
    effects at the highest dose) - a touch more real-world nuance would strengthen
    DQ-03
