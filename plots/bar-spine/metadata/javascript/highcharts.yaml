review:
  strengths:
  - The spine plot is built inside the core bundle (the variwide module is not loaded)
    as a percent-stacked, fully opaque area series on a linear x-axis. Each tier spans
    its cumulative customer count, so bar widths are exactly proportional to the marginal
    counts (4000/2500/1200/300) with no gaps.
  - 'Native stacking: ''percent'' normalises every bar to 100% from 0, and the shared
    tooltip reads p.percentage and the raw count, a useful hover layer in the HTML
    output.'
  - Percentage labels sit at the vertical centre of each segment. They match the conditional
    shares (70/30, 80/20, 90/10, 96/4), and MIN_LABEL_SHARE keeps thin segments unlabelled.
  - Category labels are centred under each variable-width bar via tickPositions at
    the bar centres plus a label formatter, and page-coloured plotLines draw the hairline
    boundary between adjacent tiers.
  - 'Semantic colour use: Retained takes brand green #009E73 and Churned the deliberate
    red anchor #AE3030. The colours are identical in both renders, and the chrome
    comes from the theme tokens.'
  - The x-axis title 'Subscription tier — width ∝ customer count' tells the reader
    what the bar width encodes.
  weaknesses:
  - 'VQ-07 (both): each segment is filled with a vertical gradient that brightens
    the Imprint hex toward the top (#009E73 → about #1DBE90, #AE3030 → about #CC4E4E),
    which is a gradient fill for style that the style guide''s Minimalism rule forbids,
    and the top of every segment is no longer the palette colour → use a flat fill
    of the Imprint colour (−gradient). Likely cause: the fillColor linearGradient
    with Highcharts.color(color).brighten(0.12) in areaSeries.'
  - 'Suggestion: the header block omits the mandatory ''// License: Highcharts — commercial
    license…'' line, and its ''Library: highcharts 12.6.0'' does not match the pinned
    13.1.1. Write the header as prompts/library/highcharts.md shows.'
  - 'Suggestion: the 14 px percentage labels are small inside the very large Free
    and Basic segments; about 16–18 px would carry better in the thumbnail.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white, #FAF8F1, not pure white.
      Chrome: the bold dark title "SaaS Subscription Churn by Tier · bar-spine · javascript · highcharts · anyplot.ai" spans about 60% of the width. The y-axis title is "Share within subscription tier (%)" with ticks from 0% to 100% every 20%. The x-axis title is "Subscription tier — width ∝ customer count", and the tier labels Free, Basic, Pro and Enterprise are centred under their bars. A boxed legend at the bottom centre shows Retained (green) and Churned (red). All text is dark and readable.
      Data: four adjacent full-height bars of strongly different widths (Free widest, then Basic and Pro, and Enterprise narrow) are separated by thin page-coloured hairlines. The red Churned segments sit at the bottom (30%, 20%, 10%, 4%) and the green Retained segments, the first series in #009E73, sit on top (70%, 80%, 90%, 96%). White bold percentage labels are centred in each segment. The fills carry a subtle vertical gradient that is lighter toward the top.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black, #1A1A17, not pure black.
      Chrome: the title is light, and the axis titles, tick labels and tier labels are a light inkSoft grey, all clearly readable. The legend box uses the elevated dark surface with light text. There is no dark-on-dark text.
      Data: the bar colours, widths, segment heights and labels are identical to the light render. Only the hairline separators flip to the dark page colour, as intended.
      Legibility verdict: PASS
