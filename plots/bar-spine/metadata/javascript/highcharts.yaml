review:
  strengths:
  - 'Clever, well-documented workaround for Highcharts core''s missing variwidth series:
    a stacked step-area chart with epsilon-separated boundaries reproduces true proportional
    bar widths'
  - Percentage data labels add a secondary (non-color) channel distinguishing Retained/Churned,
    suppressed only when a band is too thin to render legibly
  - Both themes render correctly with identical data colors and correctly adapted
    chrome - no legibility failures in either render
  - Realistic, neutral SaaS churn data that clearly tells a story across tiers
  weaknesses:
  - The thinnest band (Enterprise churned, 4%) has no percentage label (below the
    8% threshold), leaving hue as the sole Retained/Churned cue there for color-vision-deficient
    viewers - consider a minimum-width label exception or a texture/border cue for
    very thin bands
  - Title auto-scale ratio renders the mandated title at roughly 40-45% of plot width,
    below the usual 50-70% target - consider tuning the ratio constant so long titles
    fill more of that band without overflowing
  - findSegment/segmentLabelFormatter helpers add moderate structural complexity;
    acceptable given the missing native series type, but worth noting against the
    KISS ideal
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 - not pure white, not dark.
      Chrome: Dark bold title "SaaS Subscription Churn by Tier · bar-spine · javascript · highcharts · anyplot.ai" clearly visible; y-axis title "Share of tier (%)" and x-axis title "Subscription tier — width ∝ customer count" in soft ink, fully legible; tick labels (0-100% and Free/Basic/Pro/Enterprise) legible; legend (Retained/Churned swatches) legible.
      Data: Four variable-width stacked blocks whose widths shrink left-to-right proportional to marginal customer count (Free ~50%, Basic ~31%, Pro ~15%, Enterprise ~4% of total width). First series (Retained) is brand green #009E73 on top; second series (Churned) uses the semantic-red palette slot on the bottom. White percentage labels (70/30, 80/20, 90/10, 96) overlaid where bands are tall enough.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 - not pure black, not light.
      Chrome: Same title, axis titles, tick labels, and legend now render in light ink against the dark background; fully legible; no dark-on-dark failures observed.
      Data: Green/red segment colors and proportions are identical to the light render; only chrome (background, text, axis lines) flipped as required.
      Legibility verdict: PASS
