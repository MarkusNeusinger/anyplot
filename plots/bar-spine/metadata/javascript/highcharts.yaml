review:
  strengths:
  - 'Faithful spine geometry: Free 4000 / Basic 2500 / Pro 1200 / Enterprise 300 customers
    give bars at 50 / 31 / 15 / 4 % of the plot width, set side by side with no gaps,
    and every bar runs from 0 to 100 %'
  - 'Native percent stacking (stacking: ''percent'') normalizes each tier, so the
    segment heights fall out of the counts and are never hand-computed; the tooltip
    reads point.percentage for the exact share'
  - 'Works within the core-bundle constraint: variwide is not loaded, so a flat, opaque,
    percent-stacked area series on a linear x-axis produces the variable-width bars
    without any add-on module'
  - 'Uses the semantic Imprint pair: Retained in brand green #009E73 and Churned on
    the red loss anchor #AE3030, the same in both themes, with Churned stacked on
    the baseline in every bar'
  - Percentage labels are centred in each segment from the data, white with a soft
    outline, so they read on green and red in both themes, and a MIN_LABEL_SHARE threshold
    leaves room to skip slivers
  - Tier labels are centred under their variable-width bars through tickPositions
    at the bar centres, and page-coloured plotLines draw a hairline seam between adjacent
    bars
  - Theme-correct chrome in both renders through tokens (ink, inkSoft, grid, elevatedBg)
    and palette.colorScheme pinned to the theme
  weaknesses:
  - 'Suggestion: restore the `// License: Highcharts — commercial license, free for
    non-commercial use (highcharts.com/license)` line in the header block, as the
    library prompt''s header style shows.'
  - 'Suggestion: the percentage labels at 14 px could go up a step (about 16 px) so
    they hold up better in the 400 px thumbnail of the large Free and Basic segments.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, the page showing through the transparent chart.
      Chrome: title "SaaS Subscription Churn by Tier · bar-spine · javascript · highcharts · anyplot.ai" in dark bold ink, centred, about 60 % of the width; y-axis "Share within subscription tier (%)" with 0 %–100 % ticks every 20 %; x-axis "Subscription tier — width ∝ customer count" with Free, Basic, Pro and Enterprise centred under their bars; a bottom-centred legend (Retained, Churned) in a rounded box on the elevated background. Everything is readable; nothing is clipped. "Enterprise" sits close to the right edge but is fully visible.
      Data: four adjacent full-height bars whose widths are about 50 / 31 / 15 / 4 % of the plot. Churned (#AE3030 matte red) sits on the baseline at 30 / 20 / 10 / 4 %, and Retained (#009E73 brand green) sits above it at 70 / 80 / 90 / 96 %. White bold percentage labels with a thin dark outline sit centred in every segment, and "4 %" fits inside the narrow Enterprise sliver. Hairline page-coloured seams separate the bars and the segments.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title in light ink; axis titles, tick labels and legend text in light inkSoft, all clearly readable, with no dark-on-dark text; the legend box sits on the dark elevated surface with a subtle border.
      Data: identical to the light render. The green #009E73 and red #AE3030 are unchanged, and the brand green is clearly visible. Only the seams flip, to the dark page colour, and they still mark the bar boundaries.
      Legibility verdict: PASS
