review:
  strengths:
  - Correct variable-width spine technique built from a stacked, fully-opaque step-area
    series — a well-documented, clever workaround for the Highcharts core bundle's
    lack of a variable-width column series (variwide module is not loaded)
  - 'Correct Imprint palette semantics: brand green (#009E73) for ''Retained'', matte
    red semantic-anchor (#AE3030, palette[4]) for ''Churned'' — matches the style
    guide''s documented semantic-exception rule for bad/loss categories'
  - 'Clean theme-adaptive chrome: both light (#FAF8F1) and dark (#1A1A17) renders
    are fully legible, all text readable, no dark-on-dark or light-on-light failures'
  - 'Clear data storytelling: the churned (red) share visibly shrinks from Free through
    Enterprise, giving the chart an obvious, easy-to-read focal point'
  - Correct title format and descriptive, unit-bearing axis titles ('Share of tier
    (%)', 'Subscription tier — width ∝ customer count'); legend labels match series
    names
  weaknesses:
  - 'VQ-04: Retained (green) vs Churned (red) is a red-green hue pairing used as the
    primary visual differentiator between two adjacent stacked areas — a CVD reader
    (red-green colorblindness) may struggle to separate the bands by color alone.
    The consistent top/bottom stacking order and the text legend provide a partial
    secondary cue, but consider a CVD-safer color pair or an explicit pattern/texture
    on one band.'
  - 'SC-02: The spec''s suggestion ''Consider adding percentage labels within segments
    when space permits'' was not implemented. The Free and Basic segments are large
    enough to comfortably fit a data label (e.g. ''70%''), which would sharpen the
    story, especially for the small Pro/Enterprise churn bands where the exact split
    is hard to read visually.'
  - 'SC-01: True spine/bar semantics are achieved via a stacked step-area chart rather
    than an actual bar/column series, since the required variable-width column type
    lives in the unloaded variwide module. This is well justified in code comments
    and visually convincing, but it is a workaround rather than the library''s native
    bar API.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1), matches the Imprint light-theme surface — not pure white.
      Chrome: Title "SaaS Subscription Churn by Tier · bar-spine · javascript · highcharts · anyplot.ai" is dark, bold, centered, and fully visible at the top. X-axis title "Subscription tier — width ∝ customer count" and Y-axis title "Share of tier (%)" are both in a muted ink-soft gray, clearly legible. Tick labels (0%-100% on Y, Free/Basic/Pro/Enterprise on X, each centered under its variable-width segment) are all dark-on-light and readable. Legend at the bottom shows two swatches, "Retained" and "Churned", in readable ink-soft text.
      Data: Four adjacent step-shaped segments of varying width (Free widest, Enterprise narrowest) stacked to 100% height. Top band is brand green (#009E73, "Retained"), bottom band is matte red (#AE3030, "Churned"). Thin off-white outlines separate the green/red bands within each tier and separate tier boundaries. The red (churned) band visibly shrinks from left (Free, ~30%) to right (Enterprise, ~4%).
      Legibility verdict: PASS — all text is clearly readable against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17), matches the Imprint dark-theme surface — not pure black.
      Chrome: Same title, now rendered in light/white text, fully visible and legible. Axis titles and tick labels are in a lighter ink-soft gray tone, clearly readable against the dark background. Legend text is likewise light-colored and legible.
      Data: Identical green (#009E73) and red (#AE3030) hues and identical proportions/positions as the light render — only the chrome (background, text, thin segment-divider lines which flip to the dark pageBg color) changed. No dark-on-dark text failures observed anywhere (title, axis labels, tick labels, legend all clear light-on-dark).
      Legibility verdict: PASS — all text is clearly readable against the dark background, data colors match the light render exactly.
