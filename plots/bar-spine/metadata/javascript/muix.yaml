review:
  strengths:
  - 'Faithful spine plot: bar widths exactly proportional to tier totals (Free 48.1%
    of the axis), adjacent bars, every bar 0-100% on an untruncated share axis'
  - 'Semantic traffic-light mapping per the style guide: Retained brand green, Downgraded
    amber anchor, Churned matte red, identical in both themes'
  - Percentage labels only where the segment fits (64x24 px threshold), with ink chosen
    per fill by contrast, readable in both themes
  - 'Idiomatic MUI X composition: ChartsContainer with id''d linear axes and a custom
    layer drawn through useXScale/useYScale'
  - One centered tick per bar via tickInterval + valueFormatter, carrying tier name
    and count on two lines
  - Subtitle states the encoding and n = 10,800, so the reader knows width means customers
  weaknesses:
  - 'Suggestion: render the legend with MUI X''s own ChartsLegend (inside ChartsDataProvider/ChartsWrapper)
    instead of a hand-built Box legend.'
  - 'Suggestion: give the custom segment rects a tooltip (e.g. an SVG <title> with
    tier, outcome, count and share) so the HTML view exposes the 2.9% Enterprise downgrade
    sliver that stays unlabeled in the PNG.'
  - 'Suggestion: x tick labels use t.ink while y tick labels use t.inkSoft; one token
    for both would make the axes match.'
