review:
  strengths:
  - 'Correct proportional-width spine-plot construction: bar widths accurately reflect
    each tier''s marginal share of the customer base, all bars are normalized to the
    same 100% height, and adjacent bars share a seamless boundary with no gaps.'
  - 'Both renders are fully theme-correct: brand green (#009E73) for the Retained
    series and matte red (#AE3030) for Churned stay identical across themes, backgrounds
    are the correct #FAF8F1 / #1A1A17, and all chrome text flips correctly with no
    dark-on-dark or light-on-light failures.'
  - 'Thoughtful composite layout: a single rotated y-axis caption and shared percentage
    ticks are synchronized across four separate BarChart instances via margin math,
    with an explanatory italic caption and an ''n ='' sample-size annotation.'
  - Realistic, neutral SaaS churn scenario with a sensible real-world pattern (churn
    rate falls from 32% on Free down to ~6% on Enterprise as tier size shrinks).
  weaknesses:
  - 'VQ-04: Retained/Churned are encoded only as green vs. red, the classic red-green
    colorblind-risk pairing, with no redundant encoding beyond stacking position.
    Add a thin ink/white stroke on segment edges and/or direct value labels so identity
    doesn''t rely on hue alone.'
  - Spec explicitly suggests 'Consider adding percentage labels within segments when
    space permits' — the Free tier's bar has ample room for both segments. Add direct
    '68%' / '32%'-style labels inside the segments so the conditional proportions
    are legible without reading the y-axis gridlines.
  - 'DE-02: small stray vertical tick marks are visible at the seams between adjacent
    columns (e.g. between ''Free''/''Basic'' and ''Pro''/''Enterprise'') — an artifact
    of each column being an independent BarChart with its own x-axis line/ticks. Disable
    the x-axis ticks and line on every column (not just the y-axis ones) so the composite
    reads as one continuous axis without the extra blemishes.'
  - 'LM-02: the multi-BarChart-instance workaround is functional but fairly generic
    layout plumbing rather than a genuinely MUI X-distinctive technique — consider
    leaning further into MUI X-specific capabilities (e.g. richer tooltip/valueFormatter
    configuration, custom bar labels) to make the implementation feel more purpose-built
    to this library.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Title "Customer Churn by Subscription Tier · bar-spine · javascript · muix · anyplot.ai" in bold dark ink, clearly readable. Legend swatches (Retained / Churned) and the "n = 10,800 customers" annotation are readable secondary-ink text. Y-axis percentage ticks (0%-100%) and the rotated "Share of customers" caption are legible dark text. X-axis tier labels (Free, Basic, Pro, Enterprise) are centered under each variable-width bar and fully readable. Bottom italic caption is readable.
      Data: Four adjacent, variable-width, 100%-stacked bars with no gaps between them. Retained segment (bottom, brand green #009E73) and Churned segment (top, matte red #AE3030) are clearly distinguishable. Free tier is widest with the largest red (churn) share (~32%); Enterprise is narrowest with the smallest churn share (~6%).
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Title, legend text, "n =" annotation, y-axis ticks/caption, x-axis tier labels, and the bottom caption all render in light ink and are clearly readable against the dark background — no dark-on-dark failures found.
      Data: Same bar geometry and segment proportions as the light render. Retained is still #009E73 brand green and Churned is still #AE3030 matte red — colors are identical to the light render; only the chrome (background, text) flipped.
      Legibility verdict: PASS
