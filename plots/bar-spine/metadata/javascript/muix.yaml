review:
  strengths:
  - 'Clever workaround for MUI X''s lack of native variable-width bars: renders one
    synchronized BarChart per tier, sized proportionally to its marginal count, with
    the y-axis (ticks/line) shown only on the leftmost panel so the row reads as one
    continuous spine plot.'
  - 'Correct, well-justified Imprint palette use: Retained = palette[0] brand green,
    Churned = palette[4] matte red — exactly the sanctioned semantic exception (bad/loss
    -> red anchor) rather than an arbitrary ordinal pick.'
  - Segment percentage labels flip fill color per series (dark text on green, light
    text on red) and hide themselves below a 22px height threshold, avoiding unreadable
    squeezed text.
  - Title fontsize scales down via a length-based formula for the long mandated title,
    keeping it inside the canvas with no overflow.
  - Bars are perfectly adjacent with zero gaps, matching the spec's requirement to
    emphasize a continuous proportion axis.
  - Deterministic in-memory data, clean single-purpose helpers, no fake UI, current
    MUI X API usage (skipAnimation, barLabel, slotProps).
  - 'Compelling story: churn rate visibly and monotonically drops as subscription
    tier (and bar width) increases, immediately legible in both themes.'
  weaknesses:
  - Only 2 fill categories (Churned/Retained) — the spec allows 2-5; a 3rd category
    (e.g. a 'Downgraded' status) would better showcase the conditional-distribution
    feature that distinguishes a spine plot from a simple two-color stacked bar.
  - Category identity leans on green-vs-red hue; stacking order (Churned always on
    top) and the text/legend labels provide redundant cues, but a thin stroke or hatch
    on one segment would make the distinction more robust for colorblind viewers.
  - No gridlines at any percentage interval — for the very wide Free bar, a subtle
    25/50/75% horizontal rule would help readers gauge the segment boundary without
    tracing back to the y-axis.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (~#FAF8F1), not pure white — matches the light-theme spec.
      Chrome: Bold dark title "Customer Churn by Subscription Tier · bar-spine · javascript · muix · anyplot.ai" top-left; legend row below with green "Retained" and red "Churned" swatches plus "n = 10,800 customers" note at top-right; rotated "Share of customers" y-axis label on the far left with 0%-100% ticks shown once on the shared left axis; four x-axis category labels (Free, Basic, Pro, Enterprise) centered under variable-width bars; italic caption at the bottom explaining the width/height encoding. All text renders in dark ink and is clearly legible against the light background.
      Data: Four adjacent bars with widths proportional to tier size (Free widest, Enterprise narrowest), each a single 100%-stacked column split into a green "Retained" segment (bottom) and a red "Churned" segment (top). Percentage labels (68%/32%, 79%/21%, 88%/12%, 94%/6%) sit inside each segment, colored for contrast against their own fill. First series is the correct brand green #009E73; churned uses the matte-red semantic anchor.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black (~#1A1A17), not pure black — matches the dark-theme spec.
      Chrome: Same title, legend, axis labels, tick labels, and caption, all re-rendered in light ink/off-white tones (title and axis label in light cream, tick/legend/caption text in a softer light-gray) — fully readable against the dark background, no dark-on-dark text anywhere.
      Data: Identical green/red segment colors and identical percentage values/positions as the light render — confirms data colors are constant and only chrome (text/background) flips between themes.
      Legibility verdict: PASS
