review:
  strengths:
  - Solves MUI X's lack of variable-width-bar support by stitching four independently-sized
    BarChart instances into one continuous spine, with widths computed to exact pixel
    proportion of each tier's marginal share
  - 'Smart semantic color mapping: Retained=brand green (#009E73), Downgraded=amber
    (#DDCC77, the ''caution'' anchor), Churned=matte red (#AE3030, the ''bad/loss''
    anchor) - matches the traffic-light convention a reader would expect for this
    outcome data'
  - Reference gridlines at 25/50/75% are drawn as an overlay confined to the widest
    (Free) bar, working around MUI X's own grid painting behind opaque bar fills -
    a thoughtful, well-documented technical workaround
  - Conditional percentage labels inside each segment hide automatically below a 22px
    height threshold, avoiding cramped/overlapping text in the narrow Enterprise segments
  - Thin ink stroke added only to the amber Downgraded series to fix its sub-3:1 WCAG
    contrast on the cream background, exactly per the style guide's optional outline
    pattern
  - Italic caption at the bottom explicitly explains the dual encoding (bar width
    = tier size, segment height = conditional rate), removing any ambiguity about
    how to read the chart
  - Data tells a clear, realistic business story - churn falls from 32% (Free) to
    6% (Enterprise) as retention climbs from 50.7% to 91.1%, monotonic across all
    four tiers
  - Both renders are pixel-identical in data colors with correctly theme-adapted chrome
    (background, ink, muted caption text) in light and dark
  weaknesses:
  - Title (with descriptive prefix) renders at only ~40% of plot width due to the
    length-based font-scaling formula - well short of the 50-70% comfortable range,
    though not a hard violation since it doesn't overflow or look squeezed
  - No explicit X-axis title (e.g. 'Subscription Tier') - relies on the tier tick
    labels alone being self-explanatory, which is acceptable but slightly less complete
    than a fully labeled axis pair
  - Left/right canvas padding (32px on a 3200px-wide canvas) is extremely tight; still
    balanced and nothing is clipped, but a touch more breathing room would look less
    edge-to-edge
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white, consistent with Imprint #FAF8F1 - not pure white.
      Chrome: Bold dark-ink title top-left ("Customer Churn by Subscription Tier · bar-spine · javascript · muix · anyplot.ai"); a three-item custom legend (Retained/Downgraded/Churned swatches, the Downgraded swatch outlined) plus an "n = 10,800 customers" annotation top-right; a rotated "Share of customers" y-axis label; y-axis tick labels 0%-100% in steps of 10; x-axis tier labels (Free, Basic, Pro, Enterprise) centered under each variable-width bar; an italic muted-gray caption at the bottom explaining the width/height encoding. All chrome text renders in dark ink/soft-ink tones, clearly legible against the cream background.
      Data: Four adjacent, variable-width 100%-stacked bars (widest=Free, narrowest=Enterprise) with three vertically stacked segments per bar - green Retained (#009E73, bottom), amber/khaki Downgraded (with a thin dark stroke for contrast, middle), and matte-red Churned (top). Percentage labels are drawn inside each segment when tall enough (e.g. "50.7%", "17.3%", "32%" for Free), using white text on the red/green segments and dark text on the amber segment for contrast. Thin horizontal reference lines at the 25/50/75% marks are visible confined to the left edge of the widest (Free) bar only.
      Legibility verdict: PASS - all title, legend, axis, tick, and in-segment percentage text is clearly readable against the light background; no light-on-light text found.

    Dark render (plot-dark.png):
      Background: warm near-black, consistent with Imprint #1A1A17 - not pure black.
      Chrome: Same title, legend, axis labels, tick labels, and caption as the light render, all correctly re-colored to light ink / soft-ink tones (off-white/light-gray) against the dark background. The reference gridlines within the Free bar are still faintly visible.
      Data: Identical segment layout, bar widths, and percentages as the light render - green Retained, amber Downgraded (with stroke), and red Churned segments are pixel-identical in hue to the light render; only the chrome (background, text, reference-line tint) has flipped for the dark theme.
      Legibility verdict: PASS - all chrome text is light-colored and clearly readable against the near-black background; no dark-on-dark failures found. In-segment percentage labels (white on red/green, dark ink on amber) remain readable since those label colors are tied to the segment's own fixed data color, not the page theme.
