review:
  strengths:
  - 'Genuinely idiomatic ECharts library mastery: implements the variable-width, 100%-stacked
    spine plot with a custom series (renderItem + api.coord() + echarts.graphic.clipRectByRect)
    since ECharts has no native series for this chart type.'
  - 'Correct spine-plot semantics: bar widths are proportional to each tier''s marginal
    customer total (Free ~46%, Basic ~29%, Premium ~17%, Enterprise ~9%, matching
    the underlying counts), segment heights are conditional proportions summing to
    100%, and bars sit flush against each other with no gaps.'
  - Thoughtful, spec-appropriate semantic color mapping (Churned=matte red, At Risk=amber,
    Retained=brand green) — a legitimate application of the style guide's semantic-exception
    rule for status/quality categories.
  - 'Clear data storytelling: churn rate visibly and monotonically decreases from
    Free through Enterprise, so the business insight reads at a glance without needing
    annotations.'
  - Realistic, internally consistent SaaS churn-by-tier dataset; percentage labels
    are adaptively suppressed on segments too small to hold them, avoiding overlap.
  weaknesses:
  - 'Dark-render percentage-label contrast failure: statusTextColor maps "At Risk"
    labels to t.ink and "Churned"/"Retained" labels to t.pageBg — both are theme-flipping
    chrome tokens applied on top of theme-invariant Imprint data fills. In the dark
    theme this puts near-white text (#F0EFE8) on the light amber fill (#DDCC77) at
    ~1.4:1 contrast (effectively illegible), and near-black text (#1A1A17) on the
    red fill (#AE3030) at ~2.7:1 contrast (well under WCAG AA). Choose each segment''s
    label color from the fixed luminance of its own data color (e.g. a light label
    for red/green, a dark label for amber) independent of theme, rather than borrowing
    t.ink/t.pageBg.'
  - Y-axis title "Share within tier" carries the unit only via the tick formatter
    ("{value}%"); adding "(%)" to the axis name itself would remove any ambiguity.
  - 'Minor: the light-theme green-segment label (white text on #009E73) sits at ~3.2:1
    contrast — acceptable for the current font weight/size but borderline; worth a
    slightly heavier weight or lighter tint if the label-color fix touches this segment
    anyway.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1, correct.
      Chrome: Title "bar-spine · javascript · echarts · anyplot.ai" with a descriptive subtitle centered at top, a 3-swatch legend (Churned/At Risk/Retained) below it, a vertical "Share within tier" y-axis title on the left, percentage y-axis ticks (0%-100%), and centered tier-name labels (Free/Basic/Premium/Enterprise) under each bar. All chrome text is dark ink on the light surface and clearly legible.
      Data: Four adjacent, variable-width 100%-stacked bars (Free widest, Enterprise narrowest, proportional to tier size). Each bar is divided bottom-to-top into Churned (matte red #AE3030), At Risk (amber #DDCC77), Retained (brand green #009E73), separated by thin off-white divider strokes. Percentage labels are printed inside segments large enough to hold them: white text on the red/green segments, dark text on the amber segment — all clearly readable in this theme.
      Legibility verdict: PASS — all chrome and data-label text is readable in the light render.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17, correct.
      Chrome: Same title/subtitle/legend/axis structure as the light render, now rendered in light ink (#F0EFE8) and soft ink for secondary text — all chrome text (title, subtitle, legend, axis title, tick labels, tier labels) is clearly legible against the dark surface.
      Data: Same red/amber/green segment colors and same bar-width proportions as the light render — data colors are identical between themes, confirming palette consistency. However, the in-segment percentage labels use the wrong logic for this theme: the "At Risk" (amber) labels are drawn in near-white ink (#F0EFE8) on the light amber fill (#DDCC77), which is a light-on-light combination (~1.4:1 contrast) that is effectively unreadable; the "Churned" (red) labels are drawn in near-black (#1A1A17) on the red fill (#AE3030), a dark-on-medium combination (~2.7:1 contrast) that is hard to read. Only the "Retained" (green) labels read cleanly in this theme (near-black text on green, ~5:1 contrast).
      Legibility verdict: FAIL for the At Risk and Churned in-segment percentage labels (light-on-light and low-contrast dark-on-red respectively); all other chrome/text elements PASS.
