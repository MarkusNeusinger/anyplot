review:
  strengths:
  - Correct spine/marimekko-style implementation via ECharts custom series (renderItem
    + api.coord) — bar widths are accurately proportional to each tier's marginal
    total, and segments are normalized to 100% height per tier.
  - Semantically meaningful color mapping (red = Churned/bad, amber = At Risk/warning,
    green = Retained/good) using the Imprint semantic-exception guidance, with redundant
    encoding (fixed stack order + inline % labels) so the mapping doesn't rely on
    hue alone.
  - Theme-adaptive chrome is correctly threaded through the custom renderItem callbacks
    (an area that's easy to get wrong for custom series) — both light and dark renders
    are fully legible with correct backgrounds and text colors.
  - The fixed (non-theme-adaptive) segment-label text colors are a deliberate, well-reasoned
    choice since the segment fills themselves are constant across themes; the code
    comments explain the WCAG contrast reasoning for the bold-weight fix on the green
    segment.
  - Clean, deterministic in-memory data; no fake interactivity; correct mount-node
    contract and output-file behavior for a JS/interactive library.
  weaknesses:
  - DE-03 storytelling could go further — the subtitle explains the encoding but there's
    no direct callout of the clear churn-reduction trend across tiers, so the viewer
    has to connect the color/position dots themselves rather than being guided straight
    to the 'higher tiers churn less' insight.
  - Title and subtitle occupy noticeably less than the 50-70% width guideline (not
    a hard deduction since only overflow is penalized, but a touch more generous title
    sizing would strengthen the visual hierarchy at the top of the canvas).
  - The manually-built legend and tier-label series (legendItems/tierMeta) are a reasonable
    workaround for a single custom series lacking native legend sync, but they duplicate
    state that must be kept in sync with statusOrder/tiers by hand if either list
    ever changes.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "bar-spine · javascript · echarts · anyplot.ai" and subtitle centered top in dark ink; manually drawn legend (Churned/At Risk/Retained swatches) beneath the subtitle; y-axis title "Share within tier (%)" and 0-100% tick labels in soft dark gray; x-axis tier labels (Free, Basic, Premium, Enterprise) centered under each variable-width bar. All chrome text is clearly readable against the light background.
      Data: Four adjacent bars with widths proportional to each tier's customer total (Free widest, Enterprise narrowest), each stacked into three segments — matte red (Churned), amber (At Risk), brand green (Retained) — normalized to 100% height. Percentage labels are shown inside segments large enough to hold them; the narrow Enterprise/Churned segment correctly omits its label rather than overflowing. First-series-adjacent brand green (#009E73) is used for the "good" outcome per the semantic-exception rule for status data.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title/subtitle/legend/axis layout, now rendered in light ink/soft-gray tones. All text (title, subtitle, legend labels, axis title, tick labels, tier labels) is clearly legible against the dark background — no dark-on-dark instances found.
      Data: Same red/amber/green segment fills and same bar-width proportions as the light render — confirmed identical to light render; only the chrome (background, text, grid) flipped to the dark-theme tokens.
      Legibility verdict: PASS
