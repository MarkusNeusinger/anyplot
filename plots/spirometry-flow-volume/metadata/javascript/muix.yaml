review:
  strengths:
  - 'The measured loop shows the textbook mild-obstruction shape: a sharp rise to
    PEF at 0.35 L, then a descending limb scooped toward the volume axis (power 2.0).
    The predicted-normal limb beside it declines linearly (power 1.0), so the diagnostic
    contrast reads at once in both themes.'
  - PEF, FEV1 and FVC are computed from the data, not typed in. PEF is the max of
    the measured expiratory flow, and the marker sits on the curve's highest sample.
    FVC is the loop width (5.00 L, matching the x extent). FEV1 (3.39 L) comes from
    integrating dV/flow along the expiratory limb to 1 s, so FEV1/FVC = 68 % agrees
    with the scooped limb.
  - 'Idiomatic MUI X composition: two x axes (one hidden with position: ''none'')
    carry the measured and predicted volume grids under one LineChart. Per-series
    styling goes through ''.MuiLineChart-line[data-series=...]'' sx selectors, and
    ChartsReferenceLine draws the zero-flow line.'
  - A custom child component uses useXScale / useYScale / useDrawingArea to place
    the PEF marker, its leader line and the clinical-values panel in data and drawing-area
    coordinates inside the chart's SVG.
  - 'Measured is solid brand green at 3.5 px and predicted is a 2.5 px dashed inkSoft
    line, so the measured loop stays dominant. All chrome (tick labels, axis titles,
    panel fill #FFFDF6/#242420, grid) comes from theme tokens and reads cleanly in
    both renders.'
  - The PEF label uses a page-colored halo (paint-order stroke) and a bold weight.
    In the panel, muted keys and bold right-aligned values sit below a divider rule,
    a clear typographic hierarchy.
  weaknesses:
  - 'Suggestion: the mandated title fills only about 35 % of the plot width at 22
    px; a slightly larger title (about 26–28 px) would give the header more presence.'
  - 'Suggestion: the ''Expiration ▲ / Inspiration ▼'' notes are small and sit in the
    middle of the loop; they could be dropped or tucked to the left near the y axis
    to leave the loop interior cleaner.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the canvas, no white panel.
      Chrome: centered bold title "spirometry-flow-volume · javascript · muix · anyplot.ai" in dark ink. Axis titles "Volume (L)" and "Flow (L/s)" are dark. Tick labels 0–5 on x and −6 to 10 on y are dark grey. Grid on both axes is subtle and thin. Left and bottom axis lines only. A dark solid zero-flow reference line. Small "Expiration ▲" and "Inspiration ▼" notes sit just above and below zero at mid-volume. The top-right panel (#FFFDF6 fill, thin border) holds the legend (solid green "Measured", dashed grey "Predicted normal"), a divider, and rows PEF 9.5 L/s, FEV1 3.39 L, FVC 5.00 L, FEV1/FVC 68 % (bold values). The panel is clear of both loops. All text readable.
      Data: the measured loop is solid brand green #009E73. Its expiratory limb rises sharply to a green PEF dot at about 0.35 L / 9.5 L/s, labeled "PEF 9.5 L/s" with a thin leader line. It then declines in a scooped curve to 0 at 5.0 L. Its inspiratory limb is a U-shaped curve to about −5.9 L/s, closing the loop at 0 and 5 L. The predicted loop is dashed dark grey: a peak of about 10.6 L/s, a linear decline to 5.6 L, and an inspiratory trough of about −6.6 L/s. It is clearly secondary to the green.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, axis titles and tick labels render in light ink. The grid is subtle light lines, the zero line is light grey, and the panel uses the #242420 fill with light text and bold light values. Leader line and PEF label are light, with no dark-on-dark text anywhere.
      Data: the measured loop and PEF dot are the same #009E73 green as in light. The predicted dashed loop flips to the light inkSoft neutral (chrome-adaptive reference), and the data positions are identical.
      Legibility verdict: PASS
