review:
  strengths:
  - Luminance-adaptive tile ink (relative_luminance + ink_for_tile) keeps symbol,
    number and value readable on every tile and on the grey no-value tiles in both
    themes
  - Every element at its group and period with equal square tiles and a consistent
    gap; position and size come from the table layout only
  - Grey tiles for noble gases and transactinides keep the canonical silhouette and
    sit clearly outside the ramp in both themes
  - Colour bar spans the table width with readable 0.5-step ticks and exact min/max
    end labels computed from the data
  - Interactive HTML export via pygal's render() alongside the PNG
  weaknesses:
  - 'VQ-07 (both): tiles and colour bar use the legacy two-stop ramp #009E73 -> #4467A3,
    the same in both themes, so the f-block and most d-block tiles sit in one narrow
    teal band → the imprint_seq fields stops of each theme (light #66E2B2 / #009E73
    at 0.369 / #024582 at 0.803 / #351E45; dark #404C02 / #009E73 at 0.487 / #CDD9FF)
    for tiles and gradient stops alike. Likely cause: SEQ_START/SEQ_END with lerp_hex
    instead of SEQ_FIELDS with ramp_color from the pygal prompt.'
  - 'VQ-01 (both): colour-bar tick labels at 26 px, group/period numbers and Ln/An
    at 28 px and the colour-bar title at 32 px sit far below the pygal reference (ticks
    44, axis titles 56), and the in-tile atomic number and value at 20 px read small
    → ticks and indices about 44 px (+16 to +18 px), colour-bar title about 56 px
    (+24 px), in-tile secondary text about 28 px (+8 px). Likely cause: hard-coded
    font-size values in the svg.node style strings.'
  - 'SC-02 (both): La and Ac sit in group 3 of periods 6 and 7 and the detached rows
    hold Ce–Lu and Th–Lr, so there is no gap at group 3 in those periods as the Notes
    and the first ''A good version shows'' bullet require → La–Lu and Ac–Lr (15 each)
    in the two detached rows, group 3 left empty in periods 6 and 7. Likely cause:
    the La (3, 6) and Ac (3, 7) tuples and the f-block columns 4–17.'
  - 'CQ-01 (code): line 252 `class PeriodicHeatmap(pygal.Bar)` holds the whole drawing
    (title, indices, tiles, colour bar) in its `_plot()` override → draw at the top
    level without a class, cell by cell. Likely cause: subclassing pygal to reach
    its SVG node API.'
  - 'LM-01 (code): the file overrides pygal''s private `_plot()` and adds a dummy
    series (line 501 `chart.add("EN", [1.0])`) only to trigger rendering, so pygal''s
    data model, value formatting and tooltips are unused → use a public pygal API
    path for the tiles instead of a private-method override. Likely cause: the subclass
    approach.'
  - 'Suggestion: give each tile a pygal tooltip with the element name and its electronegativity
    in the HTML.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, not pure white.
      Chrome: title 'heatmap-periodic-table · python · pygal · anyplot.ai' in dark ink at the top; group numbers 1-18 above and period numbers 1-7 plus italic Ln/An to the left in muted ink; colour-bar title 'Pauling Electronegativity' and ticks 0.70, 1.0 ... 3.5, 3.98 below the table. All dark on light and readable, though the indices, colour-bar text and in-tile atomic number/value are small.
      Data: 118 equal tiles in the canonical layout (La/Ac in group 3, Ce-Lu and Th-Lr detached below with dashed connectors); tiles shaded along a two-stop #009E73 green -> #4467A3 blue ramp (Fr green, F blue); noble gases and Rf-Og as light grey #CCCBC3 tiles with dark text; tile text flips light/dark with luminance.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17, not pure black.
      Chrome: title, indices and colour-bar text in light ink; no dark-on-dark text anywhere.
      Data: tile colours identical to the light render (the same two-stop ramp, not the dark imprint_seq stops); no-value tiles as dark grey #3A3A36 with light text, distinct from the page; brand green clearly visible on the alkali metals.
      Legibility verdict: PASS
