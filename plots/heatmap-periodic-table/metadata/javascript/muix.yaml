review:
  strengths:
  - 'Canonical periodic-table layout is exact: 18 groups × 7 periods, the lanthanides
    and actinides detached by a 20 px gap, and dashed ''57–71'' / ''89–103'' placeholder
    tiles marking the group-3 gap'
  - Tile text switches between dark and light using a WCAG relative-luminance test,
    so symbols stay legible from green Fr to blue F in both themes
  - 'Correct imprint_seq ramp (#009E73 → #4467A3) for a unipolar property, with theme-adaptive
    grey tiles (#CCCBC3 light / #3E3E3A dark) that sit clearly outside the colormap'
  - 'Clear type hierarchy: bold 22 px symbols, monospace atomic numbers and values,
    a labeled colorbar whose ends name the extremes (Fr, F)'
  - Accurate Pauling electronegativity data for all valued elements
  weaknesses:
  - 'VQ-05 (both): the 18×9-tile table (about 2:1) sits on a square 1200×1200 canvas,
    leaving roughly 300 CSS px (~25 % of the height) empty above the title and another
    ~250 px below the caption → a landscape canvas, or larger tiles/type that fill
    the square. Likely cause: `//# anyplot-orientation: square` with TILE derived
    from the width only.'
  - 'VQ-01 (both): atomic numbers and electronegativity values inside the tiles are
    drawn at 11 CSS px (monospace, opacity 0.88–0.9) and become unreadable specks
    in the 400 px thumbnail → about 13–14 px (+2 to +3 px) at full opacity. Likely
    cause: fontSize={11} and opacity on the atomic-number and value <text> elements.'
  - 'DQ-03 (both): the caption says grey tiles are ''noble gases, synthetic elements'',
    but Eu, Tb and Yb are greyed and are neither → a caption that matches the data,
    e.g. ''no Pauling value''. Likely cause: the hard-coded caption string.'
  - 'CQ-01 (code): helper functions tileColor/tileTextColor at module level and no
    // Data / // Plot zones; EN_MIN/EN_MAX are typed numbers instead of derived from
    the data → one // Data block of records with role constants, limits via Math.min/Math.max
    over the values. Likely cause: positional element arrays plus hand-written constants.'
  - 'CQ-04 (code): lines 62–65 and 72–75 write out the same RGB interpolation twice
    → remove the second copy and have the text-color logic reuse the interpolated
    tile color. Likely cause: tileTextColor recomputing what tileColor already computed.'
  - 'LM-01 (code): ChartsContainer is used only as an empty SVG host (series={[]})
    and the colorbar is a hand-built gradient rect with manual ticks → drive the colors
    through a zAxis colorMap built from t.seq and render the scale with MUI X''s ContinuousColorLegend.
    Likely cause: drawing everything as raw SVG children.'
  - 'Suggestion: the ''Low (Fr = 0.70)'' / ''High (F = 3.98)'' labels repeat the end
    tick values directly above them; dropping the 0.70/3.98 ticks would tidy the colorbar.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, not pure white.
      Chrome: title 'heatmap-periodic-table · javascript · muix · anyplot.ai' in dark ink, centered, about 48 % of the width; grey subtitle 'Pauling Electronegativity — periodic trends across all elements'; colorbar title 'Electronegativity (Pauling Scale)', ticks 0.70/1.50/2.50/3.50/3.98, 'Low (Fr = 0.70)' and 'High (F = 3.98)' and an italic caption about grey tiles, all readable dark text. Large empty bands above the title and below the caption (square canvas for a ~2:1 table).
      Data: 118 equal square tiles in the canonical layout, lanthanide/actinide rows detached below, dashed placeholder tiles '57–71'/'89–103' at group 3. Tiles shaded from brand green #009E73 (Fr, Cs, K) to blue #4467A3 (F); N, O, F, Cl, Au darkest blue. Text dark on green tiles, light on the bluer ones. Noble gases He–Ar, Rn, period-7 transactinides, Pm, Eu, Tb, Yb, Lr in light grey #CCCBC3 with grey text. Each tile: atomic number top-left, bold symbol center, value bottom (small 11 px).
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17, not pure black.
      Chrome: title, subtitle, colorbar title, ticks and caption flip to light ink and are clearly readable; no dark-on-dark text.
      Data: tile colors identical to the light render (same green→blue ramp); the missing-value tiles flip to dark grey #3E3E3A with light-grey text, still clearly outside the colormap; the dashed placeholders take a light-grey outline.
      Legibility verdict: PASS
