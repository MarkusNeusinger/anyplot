review:
  strengths:
  - 'Canonical periodic-table layout driven by the records: 18 groups x 7 periods,
    lanthanides and actinides placed in atomic-number order in two detached rows below
    a visible gap, with dashed 57–71 and 89–103 placeholder tiles marking the group-3
    gap in periods 6 and 7'
  - 'Idiomatic MUI X v9 composition: ChartsDataProvider + ChartsSurface with hidden
    linear axes, custom tiles drawn through the useXScale / useYScale / useZColorScale
    hooks, and the zAxis continuous colorMap feeding ContinuousColorLegend, so tiles
    and color bar share one scale'
  - 'Correct imprint_seq ramp (t.seq #009E73 → #4467A3) for a unipolar property, identical
    in both themes, with real Pauling electronegativity values (F 3.98, Fr 0.70, Cs
    0.79, Au 2.54) and greyed theme-adaptive tiles for elements without a value'
  - 'Tile text switches between #1A1A17 and #F0EFE8 by the WCAG luminance of each
    fill, keeping symbol, atomic number and value legible on every tile in both renders'
  - 'The color legend sits in the table''s own empty band between groups 2 and 13,
    labelled with property and unit, its endpoints naming the extreme elements (Low:
    Fr 0.70, High: F 3.98), plus a ''Grey tiles'' key line'
  - 'Clear typographic hierarchy: bold sans element symbols, monospace atomic numbers
    and values, and a subtitle stating the trend direction toward fluorine and francium'
  weaknesses:
  - 'CQ-01 (code): lines 98–105 define a standalone `textOn()` helper that writes
    out the WCAG relative-luminance formula → inline the choice at the call site with
    MUI''s own `getLuminance(fill) > 0.18` from `@mui/material/styles` and drop the
    function. Likely cause: hand-rolled luminance helper instead of the installed
    MUI color utility.'
  - 'Suggestion: a few intermediate ticks on the color bar (e.g. 1.0, 2.0, 3.0) would
    let readers place the many mid-range teal tiles without reading their printed
    values.'
  - 'Suggestion: the mid-range tiles (about 1.3–2.3) share very similar teal shades;
    a slightly larger color-bar thickness would make the gradient easier to match
    against them.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, no white panel.
      Chrome: title "heatmap-periodic-table · javascript · muix · anyplot.ai" in dark ink at the top centre, a grey subtitle on the electronegativity trend below it; color-bar title "Pauling electronegativity (Pauling scale, dimensionless)", end labels "Low: Fr 0.70" / "High: F 3.98" and the italic "Grey tiles: no Pauling electronegativity value" key, all in dark ink and readable. No axes or grid (none needed).
      Data: 118 equal square tiles with a small gap in the canonical layout; lanthanide and actinide rows detached below a visible gap, dashed 57–71 / 89–103 placeholders at group 3. Tiles colored by imprint_seq from brand green #009E73 (Fr, Cs, K) to blue #4467A3 (F); noble gases He/Ne/Ar/Rn, Pm/Eu/Tb/Yb, Lr and 104–118 are grey #CCCBC3 with dark-grey text. Each tile shows atomic number top-left, bold symbol centred, value below; text flips dark/light with tile luminance (light on F, O, N, Au, Xe, I; dark elsewhere).
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, subtitle, color-bar title, end labels and grey-tile key all in light ink and readable; no dark-on-dark text.
      Data: tile colors identical to the light render (same imprint_seq ramp, same per-tile text color); only the no-value tiles flip to dark grey #3E3E3A with light-grey text, and the dashed placeholders show a light-grey outline. Brand green clearly visible.
      Legibility verdict: PASS
