review:
  strengths:
  - 'Correct radial layout: root at the center, leaves equally spaced around the circumference
    with a small top gap, and branch radius exactly proportional to merge distance'
  - Custom from-scratch agglomerative (UPGMA / Lance-Williams) clustering, needed
    because Clustering.jl isn't available in the CI runtime — a legitimate structural
    workaround rather than a shortcut
  - DFS leaf ordering keeps sibling subtrees angularly contiguous so branches never
    cross
  - Color-coded outer ring correctly implements the spec's optional metadata-ring
    feature as contiguous per-module arcs
  - Theme-adaptive chrome (INK, INK_SOFT, PAGE_BG) correctly threaded through; data
    colors are identical between light and dark renders
  - Clean single-file KISS structure with no functions/classes, reproducible via a
    fixed seed
  weaknesses:
  - 'VQ-07: The categorical palette cherry-picks positions 1, 3, 4, 7 (green, blue,
    ochre, rose) instead of the canonical 1-2-3-4 order (green, lavender, blue, ochre).
    The four labels (Immune/Metabolic/Neural/Cardiac) are abstract functional-module
    names without a strong widely-shared real-world color association, so the semantic-exception
    carve-out doesn''t apply — use IMPRINT_PALETTE[1:4] in canonical order instead
    of hand-picking positions 1, 3, 4, 7.'
  - 'VQ-01/VQ-05: Title (titlesize=20) occupies only ~30-35% of the 2400x2400 canvas
    width, well below the ~50-70% comfortable-fill guidance for a square canvas —
    bump titlesize to roughly 24-26 for better proportional balance.'
  - 'VQ-03: Leaf markers (markersize=8) are a bit small at the leaf tips for n=40
    (sparser end of the recommended range) — increase to ~10-12 for stronger element
    visibility without crowding.'
  - 'DE-01/DE-03: The module color-coding and outer ring are directly suggested by
    the spec''s own notes rather than being extra polish beyond what was asked — consider
    adding a stronger focal point (e.g., emphasizing the largest/most divergent merge)
    to push storytelling beyond just implementing the spec-listed features.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "dendrogram-radial · julia · makie · anyplot.ai" in bold dark text at top, clearly visible. A "Module" legend (frameless, dark text, colored line swatches for Immune/Metabolic/Neural/Cardiac) sits to the right of the circle. Leaf labels (e.g., IMM-01, MET-05, NEU-09, CAR-08) radiate outward in dark secondary-ink text, rotated to follow their angular position and flipped on the left half for readability. No overlaps observed.
      Data: A circular radial dendrogram fills most of the canvas. Root sits at the center (small hub), branching outward into four color-coded module clusters occupying roughly a quarter of the circle each — green (Immune, #009E73), blue (Metabolic), ochre (Neural), rose (Cardiac). A thick color-coded outer ring runs around the circumference matching each leaf's module, and small circular markers mark each of the 40 leaf tips in the same module colors. Mixed-ancestry branches (spanning more than one module) render in a neutral soft-ink tone.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title, now in light/off-white bold text, clearly visible. Legend text and leaf labels flipped to light gray/off-white, fully legible against the dark background. Root hub and mixed-branch color correctly flipped from near-black to near-white ink.
      Data: Same radial dendrogram structure, with the four module-colored branch clusters and outer ring in colors identical to the light render (green #009E73, blue, ochre, rose) — data colors confirmed unchanged between themes, only chrome flipped.
      Legibility verdict: PASS — no dark-on-dark failures observed.
