review:
  strengths:
  - Renders now match current HEAD (n_per_group=20, 80 leaves, canonical Imprint order
    with lavender, and the 'Tightest cluster' center callout) — the prior attempt's
    stale-render pipeline issue is resolved.
  - From-scratch UPGMA agglomerative clustering (Lance-Williams update) with no external
    clustering package, respecting the makie.jl runtime constraint of no Clustering.jl.
  - 'Correct radial-dendrogram geometry: root at the center, leaves equally spaced
    with a small gap, radius proportional to 1 - distance/max_height so branch length
    stays quantitatively meaningful.'
  - Pure-cluster color propagation (a node keeps its module color only while every
    leaf beneath it shares that module, else falls back to neutral ink) mirrors the
    standard dendrogram color_threshold convention.
  - Outer color-coded ring and colored leaf-tip markers give a redundant, non-color-only
    encoding of module membership layered on top of branch coloring.
  - '''Tightest cluster: Neural'' center callout is legible and does not collide with
    the converging root branch stubs in either render — verified at pixel level.'
  - Theme-adaptive chrome (PAGE_BG/INK/INK_SOFT) threaded consistently through title,
    labels, legend, and neutral branch segments; both renders pass the light/dark
    legibility check.
  - Canonical square 2400x2400 canvas — correct orientation choice for a symmetric
    radial layout, passes the canvas dimension gate.
  - Clean KISS script structure (imports -> data -> clustering -> plot -> save), reproducible
    via Random.seed!(42), no unused imports.
  weaknesses:
  - With 80 leaves at fontsize=10, leaf labels become illegible once the plot is scaled
    down to the ~400px gallery thumbnail (title stays readable, but per-leaf labels
    are not) — an inherent tradeoff of a dense radial dendrogram, not a quick fix,
    but worth noting as a soft VQ-01 deduction.
  - Design excellence is solid (custom clustering, ring encoding, storytelling callout)
    but stops short of top marks — e.g. no secondary visual emphasis (like a highlighted
    focal branch) beyond the center-text insight, and grid/legend styling is functional
    rather than distinctive.
  - Manual arc!/lines! radial layout is the correct approach given no NetworkLayout.jl/dendrogram
    recipe in this runtime, but idiomatic-usage credit is capped slightly since it's
    a hand-rolled geometry rather than a library-native dendrogram primitive.
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white, consistent with #FAF8F1. Not pure white, not dark.
      Chrome: bold dark title "dendrogram-radial · julia · makie · anyplot.ai" centered at top (~55-60% of canvas width, no clipping). Radially rotated leaf labels (IMM-01..IMM-20, MET-01..MET-20, NEU-01..NEU-20, CAR-01..CAR-20 — 80 total) in muted dark-gray ink around the circumference; corner crops confirm no overlap and comfortable margin to the canvas edge (no AR-09 clipping). Horizontal "Module" legend below the plot with 4 line swatches (Immune/Metabolic/Neural/Cardiac), fully legible. Center callout "Tightest cluster: Neural" sits cleanly inside the converging root arc with no collision with the branch stubs. All text confirmed readable against the light background.
      Data: root at center with short neutral (dark-gray) stub branches fanning into four color-coded quadrants — green #009E73 (Immune, first series = brand green as required), lavender #C475FD (Metabolic), blue #4467A3 (Neural), ochre #BD8233 (Cardiac) — plus a matching color-coded outer ring and colored leaf-tip markers. Canonical Imprint palette order confirmed.
      Legibility verdict: PASS. No dark-on-dark or light-on-light issues; leaf labels are small (fontsize 10) but legible at full resolution — they do fade out at the ~400px thumbnail size, an inherent density tradeoff for an 80-leaf radial layout rather than a theme/legibility bug.

    Dark render (plot-dark.png):
      Background: warm near-black, consistent with #1A1A17. Not pure black, not light.
      Chrome: title, leaf labels, and legend text all switch to light/cream ink (INK/INK_SOFT) and remain fully legible on the dark surface. The neutral root stub branches and the connecting arc around the center callout switch from dark-gray to light-gray as expected for theme-adaptive ink — no dark-on-dark failures anywhere, including the center callout text.
      Data: identical four hues to the light render (green #009E73 / lavender #C475FD / blue #4467A3 / ochre #BD8233) confirming data-color consistency across themes — only chrome (background, ink, neutral branch color) flips.
      Legibility verdict: PASS. Matches the light render's legibility profile; brand green reads clearly against the near-black surface.
