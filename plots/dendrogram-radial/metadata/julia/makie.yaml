review:
  strengths:
  - From-scratch UPGMA agglomerative clustering (Lance-Williams update) with no external
    clustering package, respecting the makie.jl runtime constraint of no Clustering.jl
  - 'Correct radial-dendrogram geometry: root at the center, leaf angles equally spaced
    with a small gap, radius proportional to 1 - distance/max_height so branch length
    stays quantitatively meaningful'
  - Pure-cluster color propagation (a node keeps its module color only while every
    leaf beneath it shares that module, else falls back to neutral ink) mirrors the
    standard dendrogram color_threshold convention
  - Theme-adaptive chrome tokens (PAGE_BG/INK/INK_SOFT) are threaded consistently
    through title, labels, legend, and the neutral branch segments
  - 'Current source uses the Imprint palette in canonical order (green, lavender,
    blue, ochre) for the four modules, first series is #009E73'
  - Square 2400x2400 canvas is the right orientation choice for a symmetric radial
    layout
  - Clean KISS script structure (imports -> data -> clustering -> plot -> save), reproducible
    via Random.seed!(42)
  - Outer color-coded ring and colored leaf markers give a redundant, non-color-only
    encoding of module membership on top of the branch coloring
  weaknesses:
  - 'CRITICAL / PIPELINE: plot_images/plot-light.png and plot-dark.png supplied to
    this review do NOT match the current HEAD implementation (commit c3fb1d1be, the
    ''fix(makie): address review feedback'' commit for this attempt). Pixel-level
    inspection shows only 10 leaves per module (labels stop at e.g. IMM-10) and a
    non-canonical categorical color order (green, blue #4467A3, ochre #BD8233, rose
    #954477) with no lavender anywhere in the image. That exactly matches the very
    first implementation commit (22ea907f0: n_per_group=10, IMPRINT_PALETTE=[green,#4467A3,#BD8233,#954477]).
    Current HEAD instead sets n_per_group=20 (80 leaves total, labels should run IMM-01..IMM-20
    etc.), uses the canonical Imprint order [green,#C475FD lavender,#4467A3 blue,#BD8233
    ochre], and adds a center ''Tightest cluster: {name}'' data-storytelling callout
    — none of these are visible in the reviewed renders. The renders must be regenerated
    from HEAD (and re-uploaded to the GCS staging path) before a visual quality verdict
    can be trusted, since impl-merge.yml promotes whatever is currently in staging
    straight to production without re-rendering.'
  - Because the images are stale, VQ-01/02/03/05/07 and DE-01/02/03 in this review
    are not verified against the actual current output and are scored conservatively/unreliably
    as a placeholder — re-review after a fresh render is required.
  - 'Once re-rendered, specifically re-check: (a) the new ''Tightest cluster'' center
    callout text is legible and doesn''t collide with the converging root branch stubs
    in the now-crowded center; (b) with leaf count doubled to 20/module (80 total),
    the radially-rotated leaf labels still have enough angular spacing to avoid overlap;
    (c) the lavender (#C475FD) Metabolic branches read clearly against both the light
    and dark backgrounds.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white, consistent with #FAF8F1 (sampled pixel ~#FAF8F1). Not pure white.
      Chrome: bold dark title "dendrogram-radial · julia · makie · anyplot.ai" centered at top, comfortably sized; radially rotated leaf labels (e.g. IMM-01..IMM-10, MET-01..MET-10, NEU-01..NEU-10, CAR-01..CAR-10) in muted gray around the circumference, all legible with no overlap; horizontal "Module" legend below the plot with 4 line swatches (Immune/Metabolic/Neural/Cardiac), legible. All confirmed readable against the light background.
      Data: root at center with short neutral (dark gray) stub branches fanning into four color-coded quadrants — green (#009E73, Immune), blue (#4467A3, Metabolic), ochre (#BD8233, Neural), rose (#954477, Cardiac) — plus a matching color-coded outer ring and colored leaf-tip markers. First series is the brand green #009E73. NOTE: this exact 4-hue set (green/blue/ochre/rose, no lavender) and leaf count (10 per module) matches the ORIGINAL first-attempt commit, not the current HEAD fix commit (see weaknesses — the images appear stale).
      Legibility verdict: PASS (for what is actually shown), but see weaknesses: this render does not represent the current source.

    Dark render (plot-dark.png):
      Background: warm near-black, consistent with #1A1A17. Not pure black.
      Chrome: title, leaf labels, and legend text all switch to light/cream tone and remain fully legible on the dark surface; the neutral root stub branches switch from dark gray to light gray as expected for theme-adaptive ink. No dark-on-dark issues observed.
      Data: identical four hues to the light render (green/blue/ochre/rose unchanged) — data-color consistency across themes holds for what is shown.
      Legibility verdict: PASS (for what is actually shown), same staleness caveat as above.
