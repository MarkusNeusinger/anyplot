review:
  strengths:
  - Hand-built radial dendrogram from scratch (UPGMA/Lance-Williams linkage, DFS leaf
    ordering, polar trigonometry) since CairoMakie has no native dendrogram or polar-axis
    recipe — a technically sophisticated implementation
  - 'Branch coloring correctly implements the standard scipy color_threshold convention:
    a merge keeps its module color only while every leaf beneath it is pure, falling
    back to neutral ink otherwise, which gives a clear visual hierarchy at the root'
  - Adds the spec's optional color-coded outer ring as contiguous per-module arcs,
    and DFS leaf ordering keeps each module's leaves angularly contiguous so branches
    never cross
  - 'Clean chrome: hidedecorations!/hidespines! remove all axis clutter, generous
    outer padding (limits 1.32x radius) and a small angular gap at the top keep the
    circle from feeling cramped'
  - No edge clipping in either render — verified programmatically that no non-background
    pixel touches the canvas border in either theme
  - Canvas is exactly 2400x2400 (verified), matching the square target with no drift
  - Code is reproducible (Random.seed!(42)), uses only imported/used packages, and
    cleanly follows Imports -> Data -> Clustering -> Plot -> Save with no functions/classes
  weaknesses:
  - 'CRITICAL — rendered images do not match the committed source: plot-light.png/plot-dark.png
    show Immune=#009E73 (correct), but Metabolic renders as #4467A3 (blue, which is
    IMPRINT_PALETTE[3] in the source), Neural renders as #BD8233 (ochre, IMPRINT_PALETTE[4]),
    and Cardiac renders as #954477 (rose) — a color that does not exist anywhere in
    this file''s 4-element IMPRINT_PALETTE array at all. I verified with `colorant"#C475FD"`
    in a Julia REPL that it parses to (196,117,253) lavender exactly as expected,
    and traced the code by hand: as written, `IMPRINT_PALETTE[node_group[i]]` with
    leaf_group 1..4 for Immune/Metabolic/Neural/Cardiac MUST produce Immune=green,
    Metabolic=lavender(#C475FD), Neural=blue(#4467A3), Cardiac=ochre(#BD8233). The
    rendered PNGs (confirmed via pixel-level analysis, consistent across both light
    and dark) cannot be produced by the current makie.jl. This strongly indicates
    the plot_images checked for this review are stale artifacts from a prior attempt/version,
    not a fresh render of the current source. Before the next review, verify plot-light.png
    and plot-dark.png are regenerated from the current commit — if they are, the palette
    should already be correct and no code change should be needed for this specific
    issue.'
  - Because the rendered artifact's validity is in doubt, the rest of the visual scoring
    (text legibility, layout balance, color accessibility, design polish) in this
    review is necessarily conservative — a genuine re-render is needed for a fully
    trustworthy assessment
  - Only 40 leaves are used; the spec calls out that the radial layout's main value
    is handling 'hundreds of leaves' where linear dendrograms become unwieldy — 40
    is within the stated 20-500 range but doesn't showcase the space-efficiency advantage
    the spec emphasizes. Consider more leaves (e.g. 80-150) to demonstrate the format's
    real strength
  - 40 small rotated leaf labels packed around the circumference are legible at full
    2400px resolution but risk becoming a blur at the ~400px mobile thumbnail size
    — consider whether fontsize should scale up slightly or whether labels should
    thin out for higher leaf counts
  - Data storytelling is limited to color-by-module; there's no annotation or callout
    highlighting the specific insight (e.g., which module has the tightest/loosest
    internal clustering) beyond the raw structure
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — confirmed no non-background pixel touches any canvas edge (no clipping).
      Chrome: Title "dendrogram-radial · julia · makie · anyplot.ai" is bold, dark ink, fully visible near the top with generous margin. All axis decorations/spines are hidden (radial dendrogram has no x/y axes). 40 leaf labels (IMM-01..10, MET-01..10, NEU-01..10, CAR-01..10) are placed radially around the circumference in dark-soft ink, each rotated to stay upright and legible; no overlap between labels observed. Legend "Module" box (top-right, off to the side of the circle) lists all four group names with frameless line swatches, dark ink text.
      Data: Root and mixed-ancestry branches near the circle's center render in neutral ink-soft gray. Outward branches are colored by module. Pixel-level verification found the four module colors actually rendered are: Immune = #009E73 (brand green, correct), Metabolic = #4467A3 (blue), Neural = #BD8233 (ochre), Cardiac = #954477 (rose). Per the source code's IMPRINT_PALETTE array (green, lavender #C475FD, blue, ochre in that order) the expected colors should have been Immune=green, Metabolic=lavender, Neural=blue, Cardiac=ochre — the rose hue used for Cardiac isn't even present in this file's declared palette. An outer color-coded ring mirrors the same four colors as contiguous arcs, and leaf-tip scatter markers are colored to match their module.
      Legibility verdict: PASS (all text is readable against the light background) — but see the color-mismatch finding above; the image most likely does not reflect the current source and needs re-verification.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — confirmed no non-background pixel touches any canvas edge (no clipping).
      Chrome: Same layout as the light render; title and all leaf/tick labels flip to light ink (#F0EFE8 / soft light gray) and remain clearly readable — no dark-on-dark failures observed. Legend text is light-colored and legible against the dark background.
      Data: Confirmed pixel-for-pixel identical data colors to the light render — same green/blue/ochre/rose set in the same angular positions, so whatever produced this render is internally self-consistent between themes even though it disagrees with the source file's declared palette.
      Legibility verdict: PASS (all text readable against the dark background) — same color-mismatch caveat as the light render applies.
