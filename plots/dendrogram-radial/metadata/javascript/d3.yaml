review:
  strengths:
  - Idiomatic D3 pipeline (d3.hierarchy -> d3.cluster -> d3.linkRadial) with a correct
    distance-proportional radius remap (root at r=0, leaves at r=outerRadius)
  - 'Both renders are pixel-identical on data colors and fully theme-correct on chrome
    (no dark-on-dark or light-on-light issues); canonical Imprint order with #009E73
    as the first cluster'
  - Leaf count expanded to ~86 languages across 5 lineages (up from 40), genuinely
    showcasing the radial layout's space-efficiency advantage, and the vertical centering
    now balances the full visual bbox (branches + labels) instead of just the bare
    layout radius
  weaknesses:
  - Leaf labels (13px) and legend text (14px) remain on the small side for a chart
    with ~86 leaves - still borderline once scaled down to a ~400px thumbnail; consider
    a modest size bump or alternating radial offsets
  - Design Excellence still reads close to the standard d3-gallery radial dendrogram
    look (curved links, hollow merge markers) - the optional outer metadata ring from
    the spec, or a subtle merge-distance guide ring, would push the storytelling further
  - A small residual vertical whitespace asymmetry remains even after the bbox-centering
    fix - bottom of the canvas is still marginally emptier than the top
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white, matches #FAF8F1
      Chrome: bold dark-ink title "dendrogram-radial · javascript · d3 · anyplot.ai" at top center; top-left legend maps the 5 cluster colors (Systems & Low-Level, Enterprise OOP, Functional, Dynamic Scripting, Data & Scientific) to swatches; all clearly readable against the light background
      Data: root sits near canvas center, curved (linkRadial) branches fan out to 5 colored lineages (green #009E73, lavender, blue, ochre, matte red - canonical Imprint order); hollow circles mark internal merge points, filled dots mark ~86 leaf tips, leaf labels colored to match their cluster
      Legibility verdict: PASS - all chrome and data text is readable at full canvas size; leaf/legend text is on the smaller side and would benefit from a size bump for small-thumbnail contexts, but nothing is unreadable

    Dark render (plot-dark.png):
      Background: warm near-black, matches #1A1A17
      Chrome: title and legend text switched to light ink, clearly readable against the dark background; internal merge-point circle fill switches from light page background to dark page background; no dark-on-dark issues found
      Data: branch, leaf-tip, and leaf-label colors are pixel-identical to the light render (only chrome flipped), confirming theme-adaptive tokens are threaded correctly
      Legibility verdict: PASS - same small-text caveat as the light render, no legibility failures
