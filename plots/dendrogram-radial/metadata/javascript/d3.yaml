review:
  strengths:
  - Idiomatic, correct D3 dendrogram pipeline (d3.hierarchy -> d3.cluster -> d3.linkRadial)
    with a custom distance-proportional radius remap
  - Both renders are pixel-consistent on data colors and fully theme-correct on chrome
    (no dark-on-dark or light-on-light issues)
  - Clean, deterministic, dependency-free code with a legible legend and correctly
    formatted title
  weaknesses:
  - Leaf labels (12px) and legend text (13px) become hard to read once the plot is
    scaled down to a small thumbnail (~400px) - consider a slightly larger label font
    or fewer/larger leaf labels for small-scale legibility
  - 'Noticeable whitespace imbalance: the bottom of the canvas (below the Functional
    cluster''s leaf labels) is emptier than the top - consider re-centering the circle
    vertically within the drawable area below the title'
  - Leaf count (40) is on the low end of the spec's recommended 20-500 range; a larger
    hierarchy (~80-150 leaves) would better demonstrate the radial layout's space-efficiency
    advantage over a linear dendrogram
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white, matches #FAF8F1
      Chrome: title "dendrogram-radial · javascript · d3 · anyplot.ai" in bold dark ink at top; top-left legend maps 5 cluster colors to lineage names; all clearly readable against the light background
      Data: root near canvas center, curved (linkRadial) branches fan out to 5 colored lineages (green/violet/blue/amber/crimson), hollow circles mark internal merge points, filled dots mark leaf tips, leaf labels colored to match their cluster; first cluster ("Systems & Low-Level") uses Imprint #009E73
      Legibility verdict: PASS at full canvas size (small leaf/legend text becomes hard to read only when scaled down to a ~400px thumbnail)

    Dark render (plot-dark.png):
      Background: warm near-black, matches #1A1A17
      Chrome: title and legend text switched to light ink, clearly readable against the dark background; internal merge-point circle fill switched from light to dark page background; no dark-on-dark issues found
      Data: branch, leaf-tip, and leaf-label colors are pixel-identical to the light render (only chrome flipped)
      Legibility verdict: PASS at full canvas size (same small-text caveat as light render)
