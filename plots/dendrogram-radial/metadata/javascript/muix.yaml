review:
  strengths:
  - Fully custom radial dendrogram built through the documented MUI X ChartContainer
    + useXScale/useYScale composition pattern — complete-linkage clustering, radial
    angle/radius math, and SVG arc paths are all implemented correctly and produce
    a mathematically sound dendrogram (root at center, branch radius proportional
    to merge distance).
  - 'Correct Imprint palette usage in both renders: brand green (#009E73) is the first
    series, the remaining 4 regions follow canonical palette order, and background/text/grid
    chrome flips correctly between #FAF8F1 (light) and #1A1A17 (dark) while data colors
    stay identical.'
  - Outer metadata ring plus branch coloring gives redundant, legible cluster encoding;
    cross-cluster internal merges render in neutral ink instead of an arbitrary child
    color, an honest and accurate touch that most dendrogram implementations skip.
  - No text clipping or overlap anywhere — title, all 30 rotated leaf labels, and
    the 5-item legend comfortably fit the canvas with generous, balanced margins in
    both themes.
  - Deterministic LCG-seeded data generation with a plausible, neutral scenario (coffee-origin
    flavor profiles) whose resulting clustering (Sumatran Lowlands as a late-joining
    outlier, Ethiopian/Kenyan highlands as an adjacent East-African clade) matches
    the intended, factually-grounded story.
  weaknesses:
  - Leaf tick labels (explicit 13px) become hard to read once the PNG is scaled to
    the ~400px mobile thumbnail — largely an inherent tension of packing 30 rotated
    labels around a circle, but worth checking whether a slightly larger font still
    fits without crowding the desktop render.
  - 'Design polish is strong but not maximal: the reference grid rings and branch
    strokes are uniform with no variation in weight/opacity to emphasize hierarchy
    depth, and there''s no quantitative labeling of what the concentric rings represent
    (distance scale).'
  - Data storytelling relies on the viewer already knowing dendrogram semantics (branch
    length = dissimilarity) — the East-African clade adjacency and the Sumatran outlier
    that the code comments call out are not visually emphasized (e.g. via annotation
    or subtle highlight) for a first-time reader.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Bold dark title "dendrogram-radial · javascript · muix · anyplot.ai" centered at top, clearly readable. 30 rotated leaf tick labels (e.g. COL-1, SUM-4, ETH-2) around the circumference in dark-gray ink, all legible at full resolution. Subtle light-gray concentric reference-ring gridlines at 0.25/0.5/0.75/1.0 radius. Circular legend with 5 colored dot swatches + labels at the bottom, fully readable.
      Data: Radial dendrogram with root at center (small dark dot) and 5 color-coded clades — Ethiopian Highlands (brand green #009E73, first series), Kenyan Highlands (lavender), Colombian Andes (blue), Guatemalan Volcanic (ochre), Sumatran Lowlands (matte red) — matching Imprint canonical order 1-5. Branch lines and an outer metadata ring both encode cluster color; internal merges spanning multiple clusters render in neutral dark-gray. The Sumatran cluster's connecting branch runs almost to the center, visually marking it as the most dissimilar/outlier group.
      Legibility verdict: PASS — all title, tick-label, and legend text readable against the light background; no dark-on-light failures.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title now rendered in light/off-white text, clearly readable. Leaf tick labels render in light gray, fully legible against the dark background — no dark-on-dark failures observed. Reference rings are a subtle light-gray at low opacity, still visible without competing with data. Legend text is light-colored and readable.
      Data: All five region colors (brand green, lavender, blue, ochre, matte red) are pixel-identical to the light render — confirmed only the chrome (background, text, gridline color) flipped. Same branch structure, same metadata ring, same outlier pattern for Sumatran Lowlands.
      Legibility verdict: PASS — no dark-on-dark or light-on-light issues in either theme; both renders are fully readable.
