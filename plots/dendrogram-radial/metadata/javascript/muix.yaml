review:
  strengths:
  - 'Merge radii are computed from the complete-linkage heights (radius = 1 − height
    / maxHeight), so radial distance carries the data: the long bare Sumatran branch
    and the tight Ethiopian and Kenyan junctions near the rim read straight off the
    geometry'
  - Branches take a region color only while every leaf below them shares the region,
    and cross-region merges fall back to the neutral inkSoft token, so each origin
    region reads as one colored sector and the inter-cluster skeleton stays quiet
  - The outer metadata ring is drawn as per-leaf segments with small gaps, each aligned
    to its leaf, and the leaf labels sit outside the ring, rotated along their branches
    and flipped on the left half so none read upside down
  - Composes custom SVG inside ChartsContainer through the useXScale/useYScale hooks,
    so the dendrogram, ring and native ScatterPlot leaf markers share one coordinate
    system
  - Theme tokens drive all chrome (pageBg, ink, inkSoft, grid) and the Imprint palette
    maps the five regions in canonical order; both renders are fully legible
  - 'Plausible, neutral data: 30 coffee samples from five origin regions profiled
    on five sensory attributes, generated with a seeded LCG and clustered with a written-out
    complete linkage (allowed: no clustering in the JS runtime)'
  weaknesses:
  - 'CQ-04 (code): the region legend is a hand-built HTML block (lines 346–371: a
    flex row of span swatches and labels) although the scatter series already carry
    label and color → render the native <ChartsLegend /> inside ChartsDataProvider
    / ChartsWrapper as the library prompt prescribes for composed charts, and delete
    the hand-built block. Likely cause: ChartsContainer used without the ChartsWrapper
    / ChartsLegend composition.'
  - 'Suggestion: label the four reference rings with their merge distance (e.g. small
    inkSoft values along one radius) so the radial scale that the rings imply can
    actually be read.'
  - 'Suggestion: draw the merge arcs with the SVG arc command (A rx ry …) instead
    of 14-step polylines; the long inner gray arcs show slight facets.'
  - 'Suggestion: the subtitle interpolates the raw column name (''5 Origin regions'');
    a reader-facing phrase such as ''5 origin regions'' reads more naturally.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, square 2400×2400 canvas.
      Chrome: bold dark title "dendrogram-radial · javascript · muix · anyplot.ai" (~51 % width) with a softer subtitle "30 leaves across 5 Origin regions · complete-linkage clustering over 5 features"; four subtle gray concentric reference rings; 30 leaf labels (ETH-1 … SUM-6) in inkSoft around the rim, rotated along their branches and flipped on the left half; bottom legend with five colored dots (Ethiopian Highlands, Kenyan Highlands, Colombian Andes, Guatemalan Volcanic, Sumatran Lowlands). All text dark on light and readable.
      Data: root dot at the center; elbow-style radial dendrogram with arcs at merge radius and radial segments; intra-region branches colored green #009E73 (Ethiopia), purple (Kenya), blue (Colombia), ochre (Guatemala), red (Sumatra); cross-region merges in neutral gray; the Sumatran cluster joins the rest at the root via a long bare red branch. Leaf dots on the unit circle, and an outer ring of per-leaf colored segments with gaps aligned to each leaf. No overlaps, no clipping.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title in light ink, subtitle and leaf labels in light gray inkSoft, reference rings dim gray but visible, legend text light. No dark-on-dark text anywhere; the root dot and cross-region branches flip to light gray.
      Data: region colors identical to the light render (green, purple, blue, ochre, red); ring segments and leaf markers unchanged; only chrome flipped.
      Legibility verdict: PASS
