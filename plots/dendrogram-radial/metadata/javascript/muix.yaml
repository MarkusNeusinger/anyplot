review:
  strengths:
  - The root is at the centre and the merge radius is 1 - height/maxHeight, so radial
    distance is proportional to the complete-linkage merge distance and is never equalised
    by depth
  - The leaf order comes from a DFS of the linkage tree at equal angular spacing,
    so no branches cross
  - Branches are coloured per region and mixed merges fall back to neutral ink, so
    each region reads as one coloured sector; the outer metadata ring aligns with
    each leaf and has a legend
  - Leaf labels are rotated radially and flipped on the left half, so 30 labels fan
    out without collisions
  - Uses MUI X composition (ChartsDataProvider + ChartsWrapper + ChartsSurface) with
    useXScale/useYScale to draw the custom dendrogram layer in the chart's own coordinates;
    the leaf dots are a native ScatterPlot series with legend and hover tooltips in
    the HTML
  - 'The data is deterministic (fixed-seed LCG) and plausible: coffee cupping profiles
    from five origin regions'
  weaknesses:
  - 'VQ-06 (both): the radial axis encodes merge distance, but the four reference
    rings carry no values and nothing names the measure, so a reader cannot read how
    far apart two clusters are → label the rings with their distance values (e.g.
    ''Euclidean distance'' at 0.25·max … max). Likely cause: the REF_RINGS circles
    are drawn without any <text> value labels.'
  - 'Suggestion: ''Origin regions'' in the subtitle keeps the column name''s capital
    O mid-sentence; lower-casing it would read more naturally.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, square 2400x2400 canvas.
      Chrome: bold dark title "dendrogram-radial · javascript · muix · anyplot.ai" with a softer subtitle; leaf IDs rotated radially outside the ring (left half flipped upright); HTML legend at the bottom listing the five regions; faint reference rings. All readable.
      Data: radial elbow dendrogram with the root dot at the centre; subtrees coloured per region (Ethiopian #009E73 first, then lavender, blue, ochre, matte red); mixed-region backbone in neutral ink; 30 leaf dots at equal angular spacing on the unit circle; segmented metadata ring aligned with the leaves.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, subtitle, leaf labels and legend in light ink, all clearly readable, no dark-on-dark text; the neutral backbone and the root dot turn light grey; the reference rings are subtle but visible.
      Data: branch, dot, ring and legend colours identical to the light render; only the chrome flips.
      Legibility verdict: PASS
