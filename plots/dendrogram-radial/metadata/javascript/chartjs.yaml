review:
  strengths:
  - 'Correct radial dendrogram math: root at center (radius = 1 - height/maxHeight),
    leaves at the rim with equal angular spacing, and a recursive leaf-ordering traversal
    that keeps every subtree in a contiguous angular span'
  - Hand-rolled average-linkage (UPGMA) clustering that produces a genuine scipy-style
    linkage matrix ([childA, childB, distance, size]), fully deterministic via a seeded
    LCG
  - Clever squareAxesPlugin corrects the post-layout aspect ratio in afterLayout so
    the circle stays a true circle despite the title/legend consuming unequal vertical
    space
  - Leaf labels rotated and flipped around the full circumference for readability,
    with tooltips wired to leaf sample names
  - Correct Imprint palette usage (canonical order, first series brand green), theme-adaptive
    chrome verified correct in both light and dark renders, mixed-cluster branches
    rendered in ink-soft
  weaknesses:
  - At the ~400px mobile thumbnail size the 30 rotated leaf labels become illegible
    (title and legend remain readable) — largely inherent to a 30-leaf radial layout,
    but consider a slightly bolder/larger label font to help at small sizes
  - The entire visual (rings, branches, labels) is drawn manually via raw canvas ctx
    calls in a plugin rather than leaning on more of Chart.js's built-in primitives
    — the correct extension path given Chart.js has no native dendrogram type, but
    it leaves little idiomatic-Chart.js surface area
  - No outer color-coded metadata ring is added (spec lists this as optional) — cluster
    identity is only encoded via branch/point color, so DE-03 storytelling stays at
    a conventional baseline rather than adding a second layer of information
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "dendrogram-radial · javascript · chartjs · anyplot.ai" in dark ink at top, clearly readable. Rotated leaf-name tick labels (T-01..T-06, B-01..B-06, NK-01..NK-06, Mo-01..Mo-06, DC-01..DC-06) ring the circumference in dark ink, all legible. Four subtle concentric reference-distance rings in light gray. Bottom legend with 5 color-swatch entries (T cells, B cells, NK cells, Monocytes, Dendritic cells) in dark ink, clearly readable.
      Data: Five color-coded radial arms (green/T cells, lavender/B cells, blue/NK cells, ochre/Monocytes, red/Dendritic cells) fan out from a dark root dot at the center to leaf markers at the rim; branch color matches the Imprint palette in canonical order with brand green (#009E73) as the first series.
      Legibility verdict: PASS — all text (title, tick labels, legend) is clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Title in light/white ink, clearly readable. Rotated leaf-name tick labels in light gray ink around the circumference, all legible. Reference rings and root dot switched to light tones appropriate for the dark surface. Bottom legend text in light ink, clearly readable.
      Data: Same five branch/marker colors as the light render (green, lavender, blue, ochre, red) — confirmed identical data-color values; only chrome (background, text, grid, root dot) flipped to the dark-theme tokens.
      Legibility verdict: PASS — no dark-on-dark failures observed; all title, tick-label, and legend text stands out clearly against the near-black background.
