review:
  strengths:
  - Fully custom radial dendrogram built from ECharts' custom series primitives (arc/line/group/text)
    — a genuine from-scratch implementation since ECharts has no native dendrogram
    type
  - Color-coded outer metadata ring per leaf, exactly matching the spec's optional
    'additional metadata ring' suggestion
  - Radially-aligned leaf labels correctly flipped upright on the left hemisphere
    so text never reads upside-down
  - Deterministic in-browser data generation (seeded LCG) with a realistic gene-expression-by-tissue
    scenario and average-linkage clustering that mirrors scipy.cluster.hierarchy.linkage
  - Theme-adaptive chrome is fully correct in both renders — data colors identical,
    backgrounds/ink correctly flipped, canonical Imprint palette order preserved
  weaknesses:
  - With 45 leaves crammed onto the circumference, individual leaf labels are difficult
    to read once the image is scaled down to a ~400px mobile thumbnail (title/legend
    remain fine) — consider whether a slightly larger leaf font or a reduced default
    leaf count would help mobile legibility, if practical
  - Data storytelling stays at 'clear visual hierarchy via color' rather than adding
    any explicit callout — acceptable since the spec doesn't request annotations,
    but a small distance-scale reference near the root could push this further
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white, matches #FAF8F1
      Chrome: title "dendrogram-radial · javascript · echarts · anyplot.ai" in dark ink at top, radially-aligned leaf labels (45 leaves) flipped upright on the left hemisphere, legend with 5 tissue swatches below the circle — all clearly readable
      Data: root at center, branches colored by cluster in canonical Imprint order (Liver=#009E73 green, Heart=lavender, Kidney=blue, Lung=ochre, Brain=red), color-coded outer metadata ring per leaf
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black, matches #1A1A17
      Chrome: title, leaf labels, and legend render in light ink and are clearly legible; root branch segments (inkSoft token) correctly flip from dark-grey to light-grey — no dark-on-dark failures
      Data: colors identical to light render (Liver green, Heart lavender, Kidney blue, Lung ochre, Brain red) — only chrome flipped
      Legibility verdict: PASS
