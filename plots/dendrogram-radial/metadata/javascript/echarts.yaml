review:
  strengths:
  - 'Quantitatively accurate radial layout: branch length (radius) is proportional
    to actual merge distance, not just tree depth — required a custom ECharts series
    since the built-in radial tree layout wouldn''t achieve this.'
  - From-scratch deterministic average-linkage agglomerative clustering plus leaf-order-preserving
    traversal to avoid crossing branches.
  - Correct, canonical-order Imprint palette usage, identical data colors across light/dark,
    correct theme-adaptive chrome.
  - Leaf labels rotated radially and flipped upright on the left hemisphere for readability
    — a thoughtful, non-obvious detail.
  - Clean, seeded, import-free data generation appropriate for the browser render
    harness.
  - Canvas gate passed exactly at 2400x2400 with the correct square orientation directive.
  weaknesses:
  - The optional metadata ring is implemented as a single larger dot per leaf rather
    than a true color-coded ring/arc band around the outer edge.
  - With 30 rotated leaf labels, legibility will degrade noticeably at the ~400px
    mobile preview size.
  - Leaf count (30) is at the low end of the spec's 20-500 recommended range; a larger
    sample would better demonstrate the radial layout's space efficiency advantage.
  - A couple of sibling merge arcs near the top of the Liver cluster sit close enough
    together that they may read as a single line at reduced scale.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1, not pure white.
      Chrome: Title "dendrogram-radial · javascript · echarts · anyplot.ai" in bold dark ink, centered top. Leaf labels rotated radially, flipped upright on the left hemisphere, dark ink text. Legend row below the plot with 5 colored swatches + labels, dark ink text. All readable.
      Data: 5 clusters (Liver=green #009E73, Heart=lavender, Kidney=blue, Lung=ochre, Brain=matte red) radiating from a gray central hub to 30 leaf nodes around the circumference. First series confirmed as #009E73 (Liver).
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17, not pure black.
      Chrome: Same title, now in light ink. Leaf labels and legend text switched to light ink. Central hub branches switched from dark gray to light gray. All readable, no dark-on-dark issues found.
      Data: Same 5 cluster colors as light render, pixel-identical (green/lavender/blue/ochre/red unchanged) — only chrome flipped as expected.
      Legibility verdict: PASS
