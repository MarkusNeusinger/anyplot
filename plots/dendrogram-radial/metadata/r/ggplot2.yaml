review:
  strengths:
  - Hand-built radial dendrogram (ggplot2 has no native geom for this) with concentric
    distance rings labeled 5/10/15/20 giving a genuine quantitative read of merge
    height, not just decoration
  - Cluster branches colored in canonical Imprint order (green/lavender/blue/ochre)
    with a distinct desaturated 'Mixed branch' treatment for ambiguous near-root merges
    — clear visual hierarchy that a reader grasps at a glance
  - Tangential leaf-label rotation correctly flips hjust/angle past the 180° mark
    so labels on the left hemisphere read right-side-up instead of upside-down — an
    easy-to-miss detail done right
  - 'Theme-adaptive chrome is fully correct in both renders: identical data colors
    between light/dark, backgrounds match #FAF8F1/#1A1A17, all text uses INK/INK_SOFT/INK_MUTED
    tokens'
  - Title format and legend exactly match spec requirements; legend labels ('Cluster
    1'..'Cluster 4', 'Mixed branch') are self-explanatory
  weaknesses:
  - At ~400px mobile scale the 32 leaf labels (Gene_01..Gene_32) become quite small
    and tightly packed — still legible but tight; consider bumping geom_text size
    slightly or trimming to ~24-28 leaves for more mobile breathing room
  - Spec's optional outer metadata ring (e.g. species family / department color band)
    is not implemented — a nice-to-have that would add a second data dimension, not
    a required feature
  - Manual tree-walk helper functions (get_x/get_height/get_cluster) plus a for-loop
    over merges add moderate structural complexity versus a flatter KISS script —
    justified since ggplot2 has no native radial-dendrogram geom, but it's the reason
    CQ-01 isn't a perfect score
  - Data storytelling relies solely on color-coded hierarchy; a small annotation or
    emphasis on the tightest/most distinct cluster would push DE-03 further
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "dendrogram-radial · r · ggplot2 · anyplot.ai" in dark ink, clearly visible and centered; subtitle "Concentric rings mark merge distance (height); root at center" in muted gray below it, fully readable. Concentric ring labels (5, 10, 15, 20) in muted gray near the plot center are legible. Bottom legend ("Cluster 1"–"Cluster 4", "Mixed branch") in soft dark gray text, clearly readable.
      Data: Root (gray "Mixed branch") sits at the exact center with two short gray branches splitting into two super-clusters, which further split into 4 colored quadrant clusters — green (Cluster 1, bottom-right), purple/lavender (Cluster 2, top-left), blue (Cluster 3, bottom-left), ochre (Cluster 4, top-right). First categorical series is #009E73 green as required. 32 "Gene_NN" leaf labels are arranged radially around the circumference, each tangentially rotated to follow the circle, with left-hemisphere labels correctly flipped right-side-up. All text is dark-on-light and clearly readable; no dark-on-light legibility failures observed.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Title and subtitle now render in light ink/light-gray respectively, both clearly legible against the dark background. Ring labels and leaf labels render in light gray, fully readable. Legend text also switches to light gray and remains legible. The "Mixed branch" gray line is a lighter gray on this render than on the light render (it uses the theme-adaptive INK_MUTED token, which is appropriate for a neutral/chrome-like category rather than a data-identity color).
      Data: All four cluster colors (green, lavender, blue, ochre) are pixel-identical to the light render — only chrome (background, text, the neutral "mixed" line) flips as expected. No dark-on-dark or light-on-light failures found anywhere — title, subtitle, ring numbers, leaf labels, and legend are all comfortably legible.
      Legibility verdict: PASS
