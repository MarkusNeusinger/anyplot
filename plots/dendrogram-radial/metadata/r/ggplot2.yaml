review:
  strengths:
  - 'Sophisticated hand-built radial dendrogram: manual tree traversal over hc$merge
    (get_x/get_height/get_cluster helpers) correctly computes polar coordinates from
    hclust output without relying on ggraph/ggdendro extensions.'
  - Cluster-colored branches with a distinct muted-gray "Mixed branch" category for
    merges that span more than one cluster — a genuine storytelling device that surfaces
    cluster purity directly through color, not just decoration.
  - Concentric alpha-blended guide rings (5/10/15/20) give a quantitative read of
    merge height/distance, which most radial dendrogram implementations skip entirely.
  - Tangentially-rotated leaf labels flip hjust past the 180° mark so every one of
    the 48 gene labels stays upright and readable regardless of position around the
    circle.
  - 'Correct Imprint palette usage: Cluster 1 = #009E73, canonical order for clusters
    2-4, identical data colors between light/dark renders, and fully theme-correct
    chrome (background, ticks, legend) in both.'
  weaknesses:
  - The concentric guide rings (5/10/15/20) have no axis label explaining what they
    represent — a first-time viewer sees bare numbers with no unit or description.
    Add a small radial axis title such as "Merge distance" near the rings.
  - With 48 leaf labels packed around the circumference, most individual gene labels
    would become illegible once the PNG is scaled down to a ~400px mobile width. Consider
    slightly larger leaf-label text or trimming toward the low end of the spec's 20-500
    leaf range for better mobile legibility.
  - The tree-traversal helper functions (get_x, get_height, get_cluster, label_with_cluster)
    break from the pure KISS "imports -> data -> plot -> save" structure. This is
    justified by the complexity of the radial layout math, but a flatter script would
    score higher on CQ-01 if it can be simplified further.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white surface consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Dark ink title "dendrogram-radial · r · ggplot2 · anyplot.ai" centered at top, clearly readable. Concentric ring labels (5, 10, 15, 20) in muted gray near the top of the plot, readable but unlabeled (no "distance"/"height" axis title). Bottom legend ("Cluster 1" / "Cluster 2" / "Cluster 3" / "Cluster 4" / "Mixed branch") in soft dark-gray text with matching color swatches, clearly legible against the cream background.
      Data: Four large branch groups radiate from the center, each colored distinctly — teal/green (Cluster 1, bottom-right), lavender/purple (Cluster 2, upper-left), blue (Cluster 3, lower-left), and ochre/orange (Cluster 4, upper-right). The innermost branches connecting the four cluster roots are rendered in a muted gray ("Mixed branch") since they span more than one cluster. 48 leaf labels ("Gene_01" ... "Gene_48") are rotated tangentially around the outer circumference, each oriented so the text reads upright and outward. First categorical series (Cluster 1) is #009E73 as required.
      Legibility verdict: PASS — all title, tick, and legend text is clearly readable against the light background; no light-on-light issues. Minor note: the ring-distance numbers lack an axis label.

    Dark render (plot-dark.png):
      Background: Warm near-black surface consistent with #1A1A17 — not pure black, not light.
      Chrome: Title, ring labels, and legend text all render in light gray/off-white tones, clearly legible against the dark background. No dark-on-dark text was found anywhere in the plot — title, leaf labels, ring numbers, and legend text are all comfortably visible.
      Data: The four cluster branch colors (teal, lavender, blue, ochre) and the "Mixed branch" gray are pixel-identical to the light render — confirmed by side-by-side color comparison. Only the chrome (background, grid rings, text) flips between themes, exactly as required.
      Legibility verdict: PASS — no dark-on-dark or hard-to-read elements detected in the dark render.
