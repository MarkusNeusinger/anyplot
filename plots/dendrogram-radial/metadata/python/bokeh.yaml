review:
  strengths:
  - Leaf labels rotated along their branches via a LabelSet angle column, flipped
    on the left half so all 40 read upright and fan out without collisions
  - Merge radii computed as 1 - d/max_d from the ward linkage, so radial distance
    is the data and the long trunk vs tight rim junctions show real dissimilarity
  - Branches entirely inside one cluster take that cluster's Imprint color while cross-cluster
    merges stay neutral gray, so each cluster reads as one colored sector
  - Theme tokens threaded through title, labels and legend; both renders readable
  - 'Adaptable data block: tidy DataFrame with GENE / CLUSTER column constants feeding
    the plot code'
  weaknesses:
  - 'VQ-03, SC-04 (both): the legend lists Cluster 1-4 but draws no color swatch beside
    any entry, so the colors are not explained → a visible 30 px swatch in each cluster''s
    Imprint color. Likely cause: LegendItems point at p.scatter([], []) renderers
    with no data; attach the legend to renderers that carry data (e.g. one leaf-dot
    scatter per cluster with legend_label=).'
  - 'DQ-02 (both): leaf names Gene-00 … Gene-39 read as placeholders → real-looking
    gene symbols (e.g. MYC, CDK1, TP53-like names) per co-expression group. Likely
    cause: df[GENE] = [f"Gene-{i:02d}" …].'
  - 'CQ-01 (code): helper function branch_color() breaks the flat no-functions structure
    → inline the color lookup in the segment loop. Likely cause: def branch_color(node).'
  - 'Suggestion: the dark render shows a faint box around the plot frame; dropping
    it would keep the chart frameless in both themes.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, 2400x2400 square canvas
      Chrome: bold title 'dendrogram-radial · python · bokeh · anyplot.ai' centered in near-black INK; no axes or grid; 40 leaf labels Gene-00..Gene-39 in dark gray INK_SOFT, rotated along their branches and flipped on the left half; legend bottom-right with italic 'Cluster' title and entries Cluster 1-4 on an elevated frame, but no color swatches beside the entries
      Data: radial dendrogram, root arc at center in gray, four colored sectors: Cluster 1 #009E73 green (right/upper right), Cluster 2 #C475FD purple (lower left), Cluster 3 #4467A3 blue (lower right), Cluster 4 #BD8233 ochre (upper left); leaf dots at the rim in cluster colors; merges at radii set by ward distance, long bare trunks inward, tight junctions near rim
      Legibility verdict: PASS (all text readable; legend swatches missing is an element-visibility defect, not a legibility one)

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17
      Chrome: title in light INK #F0EFE8, leaf labels in light gray #B8B7B0, legend on #242420 with light text; no dark-on-dark text; a faint gray box outlines the plot frame; legend again without swatches
      Data: branch and dot colors identical to the light render; brand green clearly visible; gray trunk switched to the light INK_SOFT
      Legibility verdict: PASS
