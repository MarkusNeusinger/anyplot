review:
  strengths:
  - 'Purity coloring: species-pure subtrees take their Imprint color and mixed subtrees
    fall back to neutral grey, so Setosa reads as one clean sector and Versicolor/Virginica
    visibly interleave'
  - 'Correct radial geometry: root at the centre, leaves at equal 10° spacing in scipy
    leaf order, merge radii proportional to ward distance'
  - Leaf labels tinted in their species color and anchored outward so they fan around
    the rim without collisions
  - Per-leaf hover tooltips in the HTML, with branch traces excluded from hover
  weaknesses:
  - 'VQ-01 (both): leaf labels at 8 px and legend text at 9 px are below plotly''s
    10 px tick reference and read small around the 2400 px circle → 10 px (+2 px labels,
    +1 px legend). Likely cause: annotation font size=8 and legend font size=9.'
  - 'VQ-03 (both): the 36 sparse leaf markers use plotly''s default size 6, which
    the style guide names as too small; they read as dots barely wider than the branch
    lines → size 9-10 (+3 to +4). Likely cause: leaf marker size=6.'
  - 'CQ-01 (code): a helper function branch_color() wraps a two-line lookup → inline
    it as a precomputed list of per-node colors. Likely cause: the def branch_color(node_id)
    block.'
  - 'Suggestion: rotating the leaf labels to follow their branches would tie each
    label more tightly to its leaf at the lower-left, where Ve-11/Vi-11 sit close
    together.'
  - 'Suggestion: grouping the branch segments into one trace per color with None separators
    would replace about 108 single-segment traces.'
