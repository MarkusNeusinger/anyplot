review:
  strengths:
  - Merge radii come straight from the Ward merge distances (1 - d/d_max), so long
    bare inner branches and junctions crowding toward the rim read as real dissimilarity
  - Leaf angles follow scipy's leaves_list order, giving 24 equally spaced leaves
    with no crossing branches
  - Branches inherit their cluster color only below the merge where a cluster is pure,
    so each taxonomic group reads as a colored sector and cross-group merges stay
    neutral INK_SOFT
  - Leaf labels are rotated along their branches and flipped on the left half, so
    all 24 fan out around the rim without collisions
  - 'Theme tokens carry through every SVG element: chrome flips cleanly while the
    Imprint data colors are identical in both renders'
  weaknesses:
  - 'DQ-01 (both): Canines do not read as one colored sector: Wolf and Dog sit at
    the top next to Lion while Fox and Coyote sit between the raptors, because the
    invented trait scores (Fox and Coyote with sociality 1, like the raptors) make
    Ward split the group → trait rows where the four canines share their profile so
    each group forms one contiguous sector. Likely cause: the traits dict values for
    Fox, Coyote and Lion.'
  - 'VQ-01 (both): leaf labels and legend entries at 32 px sit below the 44 px pygal
    tick/legend reference, and the title at 48 px below 66 px; the leaf names are
    the plot''s main content and read small beside the tree → leaf labels and legend
    at 44 px (+12 px), title about 60-66 px (+12 to +18 px). Likely cause: font-size="32"
    on the leaf and legend <text> elements and font-size="48" on the title.'
  - 'CQ-01 (code): a polar_xy helper function is defined for the polar-to-pixel conversion
    → compute the coordinates inline (for example with numpy cos/sin on arrays of
    radii and angles) and keep the script function-free. Likely cause: the def polar_xy
    block above the drawing loops.'
  - 'LM-01 (code): the PNG is a hand-written SVG string rasterized with cairosvg,
    and pygal only renders an HTML scatter of the 24 leaves without any branches,
    so the HTML does not show the dendrogram → draw the branches as pygal.XY series
    (each arc sampled as a stroke-only polyline, radial segments as two-point lines)
    and save the PNG with render_to_png from the same chart that writes the HTML.
    Likely cause: the raw <path>/<line> elems list and cairosvg.svg2png call.'
  - 'Suggestion: the optional outer metadata ring the Notes allow could carry the
    taxonomic group outside the leaves.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white #FAF8F1 across the full 2400x2400 square canvas — correct.
      Chrome: Title "dendrogram-radial · python · pygal · anyplot.ai" bold in near-black at the top center (~53% of width). Legend top-left: bold "Taxonomic group" header and six entries with colored dots (Marine Mammals, Canines, Felines, Raptors, Amphibians, Fish) in dark ink. All text readable.
      Data: Radial dendrogram centered with a grey root dot; 24 leaves on a circle at equal angular spacing, each with a colored dot and a radially rotated, group-colored species label (left-half labels flipped to read outward). Branches are arcs plus radial segments, colored by group below pure-cluster merges (Marine Mammals #009E73, Canines #C475FD, Felines #4467A3, Raptors #BD8233, Amphibians #AE3030, Fish #2ABCCD) and dark grey INK_SOFT above cross-group merges. Merge radii vary strongly (long bare inner branches, junctions crowding near the rim). Canines appear in two sectors (Wolf/Dog at top beside Lion, Fox/Coyote among raptors). No overlap, no clipping.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black #1A1A17 — correct.
      Chrome: Title and legend text in light #F0EFE8, clearly readable; no dark-on-dark text. Cross-group branches switch to light grey INK_SOFT and stay visible.
      Data: Group colors for branches, leaf dots and labels are identical to the light render; only the chrome flips. Brand green #009E73 for Marine Mammals reads well; the Felines blue labels are the dimmest but still legible.
      Legibility verdict: PASS
