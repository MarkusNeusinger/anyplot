review:
  strengths:
  - 'Correct geometry from scipy linkage: leaves in leaves_list order at equal angles,
    merge radii proportional to Ward distance, arcs plus radial segments'
  - Leaf labels set outside the rim and rotated along their radius with side-dependent
    alignment (alt.Angle with scale=None), so the 30 labels fan out without collisions
  - Branches colored per pure cluster subtree with INK_SOFT for mixed merges, so each
    cluster reads as one colored sector
  - Theme tokens threaded through title, labels, legend text and mixed branches; both
    renders fully legible
  - Tooltips on leaf dots (gene, cluster) for the HTML view
  weaknesses:
  - 'VQ-01 (both): leaf labels render at fontSize=9, below the style guide''s 10px
    tick-label reference → 10px (+1px). Likely cause: mark_text(fontSize=9) in label_layer
    (line 169).'
  - 'DQ-02 (both): genes are labelled G01–G30, which read as generic placeholders
    → plausible gene symbols (e.g. MYC, TP53, CDK1 …). Likely cause: the label list
    f"G{idx + 1:02d}" (line 49).'
  - 'CQ-01 (code): a label_layer() helper function (line 166) breaks the no-functions
    rule → inline the two text layers or encode align from a column. Likely cause:
    the two-sided label split wrapped in a function.'
  - 'Suggestion: the cluster legend is assembled from point and text layers; a native
    Altair legend on a separate color scale for leaves would be more idiomatic.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, square 2400x2400
      Chrome: bold title "dendrogram-radial · python · altair · anyplot.ai" in dark ink at top, ~60% of width; 30 gene labels (G01–G30) in dark gray INK_SOFT, rotated along their radii outside the leaf dots; horizontal legend "Cluster 1…5" with colored dots below the circle; no axes or grid. All text readable
      Data: radial dendrogram, root near center; five cluster sectors colored #009E73 (Cluster 1, bottom), #C475FD (2, left), #4467A3 (3, right), #BD8233 (4, lower right), #AE3030 (5, top); inter-cluster merges near the center drawn in dark gray; tight within-cluster merges crowd near the rim
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17
      Chrome: title in light #F0EFE8; leaf labels and legend text in light gray #B8B7B0, clearly readable; no dark-on-dark text
      Data: cluster colors identical to the light render; mixed central branches flip to light gray for contrast; leaf dots slightly translucent so they read a touch darker
      Legibility verdict: PASS
