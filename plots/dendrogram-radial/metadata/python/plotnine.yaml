review:
  strengths:
  - Branches are colored by clade from scipy's own color_list via color_threshold,
    while the merges above the cut stay in the neutral INK_SOFT token, so each clade
    reads as one colored sector around a gray trunk
  - Leaf labels are rotated along their branches and flipped by 180° on the left half,
    so all 30 species names read upright and fan out without colliding
  - Radii come straight from the merge distances (radius = 1 - d/max), with the root
    at the center and the leaves at equal angular spacing in the dendrogram's leaf
    order
  - Theme tokens are threaded through the title, labels, legend frame and gray trunk;
    both renders are fully legible and the data colors are identical
  - Legend sits in the empty lower-left corner, clear of the data, on the 2400×2400
    canonical canvas
  weaknesses:
  - 'CQ-01 (code): the coordinate transforms are written as two named lambdas (theta,
    radius) whose E731 lint is silenced with noqa comments, which is function definitions
    under another name → compute the leaf angles and radii as vectorized numpy expressions
    inline. Likely cause: lines 77–78 `theta = lambda x: …  # noqa: E731`, `radius
    = lambda y: …  # noqa: E731`.'
  - 'CQ-04 (code): two geom_text layers with identical aesthetics and parameters differ
    only in their data subset (leaves[~left] vs leaves[left]) → one geom_text(data=leaves,
    …) layer, since the angle column already carries the flip. Likely cause: lines
    152–167.'
  - 'Suggestion: the outer ring of squares repeats the clade color the branches already
    carry; a ring would add more if it encoded a second variable such as genus.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, square 2400×2400 canvas.
      Chrome: title "dendrogram-radial · python · plotnine · anyplot.ai" in dark ink at the top, about 85 % of the width; no axes (correct for a radial layout); a "Clade" legend in the lower-left corner with an elevated light fill and a soft-ink frame. All 30 species labels (Corvus, Pica, Garrulus plus epithets) are dark, rotated along their branches and readable.
      Data: radial dendrogram with the root at the center; the two top merges drawn in gray INK_SOFT, then three clade sectors colored #009E73 (Clade 1, Corvus, lower right), #C475FD (Clade 2, Pica, top) and #4467A3 (Clade 3, Garrulus, left). Leaf dots sit on the unit circle, with a ring of colored squares just outside them.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: the title and leaf labels flip to light ink, the gray trunk to light INK_SOFT, and the legend to a dark elevated fill with a light frame and light text. There is no dark-on-dark text.
      Data: the clade colors #009E73, #C475FD and #4467A3 are identical to the light render; brand green reads well.
      Legibility verdict: PASS
