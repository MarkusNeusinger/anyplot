review:
  strengths:
  - Radial layout derived from scipy's dendrogram icoord/dcoord, so leaf order comes
    from the tree and no branches cross; radius linear in merge distance
  - 'Cluster colors propagated bottom-up through the linkage with scipy''s link_color_func
    contract; Imprint canonical order with #009E73 first and a neutral ink for cross-cluster
    merges'
  - lets-plot-native layer_tooltips() on the leaf ticks gives sample and cluster on
    hover in the HTML export
  - Canvas painted to every edge in both themes through the one-panel gggrid, no frame;
    both renders theme-correct with identical data colors
  - Data zone reads a tidy table with a SAMPLE column constant, so the linkage and
    the cut are derived from any user table
  weaknesses:
  - 'VQ-02, SC-02 (both): leaf labels in the top and bottom quarters of the circle
    (S09, S31, S27, S10 at the top; S01, S29, S12, S17 at the bottom) run back inward
    over their own leaf ticks and risers instead of outward along their branches,
    and S07 touches S11 → every label reads outward from its tick (C4). Likely cause:
    rotation = angle_deg - 90 (and - 270) mirrors the angle; lets-plot rotates counter-clockwise,
    so use rotation = 90 - angle_deg (and 270 - angle_deg) with the same hjust.'
  - 'VQ-01 (both): the scale-ring labels ''h=7.5'' and ''h=15.0'' at size 3.5 read
    small beside the 8.5 leaf labels and 6 legend text → about size 5 (+1.5). Likely
    cause: geom_text(size=3.5) on ring_labels_df.'
  - 'VQ-05 (both): the tree with its labels fills only about three quarters of the
    square canvas, leaving empty bands of about 15 % above and below → a view half-width
    near 1.3 instead of 1.55 (about -0.25). Likely cause: VIEW = R_OUTER * 1.55.'
  - 'VQ-06 (both): the only radial scale is labelled ''h=7.5'' / ''h=15.0'', and ''h''
    does not tell a reader it is the merge distance → e.g. ''distance 7.5''. Likely
    cause: f"h={ring_height:.1f}".'
  - 'DQ-02 (both): the clusters are labelled ''Type A-D'' (and the features ''Gene
    A-F''), which read as placeholders → real cell-type names, for example T cells,
    B cells, monocytes, NK cells. Likely cause: cell_type_names = f"Cell type {chr(64
    + cid)}".'
  - 'CQ-01 (code): three helper functions to_angle, to_radius and polar_to_xy break
    the flat script structure → inline the vectorised numpy expressions. Likely cause:
    the def blocks above the branch loop.'
  - 'CQ-04 (code): the legend is hand-built from a geom_segment and a geom_text layer
    plus a legend_df table, a stand-in for lets-plot''s native legend, which theme(legend_position=[x,
    y]) can place inside the panel''s empty hub → map the color scale with show_legend
    and position the guide. Likely cause: the ''Legend'' block and its two layers.'
  - 'Suggestion: order the legend Type A-D with Mixed last instead of between Type
    B and Type C.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 to every edge of the 2400x2400 canvas, no frame.
      Chrome: title 'dendrogram-radial · python · letsplot · anyplot.ai' top left in dark ink; two faint dashed scale rings labelled 'h=7.5' and 'h=15.0' in small muted ink; in-hub legend Type A, Type B, Mixed, Type C, Type D in dark gray. All readable.
      Data: 32 leaves S01-S32 around the rim with square ticks; branches colored by cluster: green #009E73 (A, upper right), purple (B, lower right), blue (C, lower left), ochre (D, upper left); cross-cluster merges in muted gray down to the root arc around the hub. Labels at left and right read outward, but those near the top and bottom (S09, S31, S27, S01, S29, S12, S17) run inward over their own ticks and risers.
      Legibility verdict: PASS (text readable; label overlap scored under VQ-02)

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17 to every edge.
      Chrome: title in light ink, leaf labels and legend in light gray, ring labels muted light gray; no dark-on-dark text.
      Data: the four cluster colors are identical to the light render; the Mixed gray flips to the light neutral as chrome-like ink. Same inward-folding labels at top and bottom.
      Legibility verdict: PASS
