review:
  strengths:
  - 'Correct radial geometry: scipy''s dendrogram icoord/dcoord mapped to angle and
    merge-distance radius, root at center and leaves at equal angular spacing on the
    rim'
  - Subtrees inside one family take its Imprint color while mixed merges stay neutral
    ink, so each family reads as one colored sector in both themes
  - Leaf labels rotate along their branches and flip on the left half; family names
    are set tangentially and upright, with no collisions
  - Leaf dots drawn with sns.scatterplot using data=, hue= and hue_order= on a tidy
    DataFrame
  - Canonical 2400x2400 canvas with theme-correct chrome in both renders
  weaknesses:
  - 'CQ-01 (code): lines 92–93 define theta_of and radius_of as lambdas kept with
    `# noqa: E731` → compute the angles and radii inline as numpy expressions (e.g.
    icoord / x_max * 2 * np.pi) with no function and no disable comment. Likely cause:
    a helper replaced by a lambda to pass the linter.'
  - 'CQ-04 (code): line 72 builds fam_colors, which nothing reads → remove. Likely
    cause: a color lookup replaced by IMPRINT_PALETTE[code] indexing.'
  - 'Suggestion: an outer ring of family-colored segments (allowed by the Notes) would
    mark sector boundaries where near-rim branches crowd.'
