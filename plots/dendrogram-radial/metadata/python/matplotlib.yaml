review:
  strengths:
  - scipy dendrogram(no_plot=True, link_color_func=...) drives leaf order and per-cluster
    branch colours
  - Radius is linear in merge distance with an inner-radius offset, keeping merge
    depths quantitative
  - Leaf labels rotated with rotation_mode='anchor' and flipped upright on the left
    half
  - Neutral grey above-cut branches make the coloured cluster sectors the focal structure
  - Theme tokens applied to background, title, labels and legend; both renders readable
  weaknesses:
  - 'VQ-05 (both): the canvas is 3292×3595 px, neither canonical size, with a large
    empty band above the circle → 2400×2400 square (−892 × −1195 px). Likely cause:
    figsize=(12, 12) at dpi=300 with bbox_inches=''tight''.'
  - 'VQ-01 (both): leaf labels at 6 pt on a 12 in figure read small next to the 24
    pt title and 16 pt legend → the 8 pt tick-label reference on a 6 in figure. Likely
    cause: fontsize=6 on figsize=(12, 12).'
  - 'VQ-03 (both): every legend glyph has a blue outline ring that the edge-less leaf
    dots do not have → no edge, matching the marks. Likely cause: Line2D handles without
    markeredgewidth=0, so the default edge colour shows.'
  - 'SC-04 (both): the title reads ''dendrogram-radial · matplotlib · anyplot.ai''
    and lacks the language segment → ''dendrogram-radial · python · matplotlib · anyplot.ai''.
    Likely cause: the title string.'
  - 'DQ-03 (both): the legend names the clusters after families they do not hold —
    green ''Asteraceae'' sits on Ro01–Ro10, purple ''Rosaceae'' on Po01–Po10, blue
    ''Fabaceae'' on La01–La10 → label each fcluster id with the family of its leaves.
    Likely cause: family_names[i] used for fcluster id i+1, whose numbering does not
    follow the family order.'
  - 'CQ-01 (code): lines 75–78 define a helper function to_xy() → compute angle and
    radius arrays from icoord and dcoord once, without a function. Likely cause: a
    per-point coordinate helper.'
  - 'CQ-05 (code): savefig uses bbox_inches=''tight'' and dpi=300, which the library
    prompt forbids → plt.savefig(f''plot-{THEME}.png'', dpi=400, facecolor=PAGE_BG)
    on figsize=(6, 6). Likely cause: the save call.'
  - 'Suggestion: thicker branches (about 1.5–2 pt) would read more firmly at full
    size.'
