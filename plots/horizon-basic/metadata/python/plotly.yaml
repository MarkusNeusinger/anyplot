review:
  strengths:
  - Folded bands use light-to-dark steps of Imprint blue and Imprint red, all three
    steps distinguishable on both backgrounds
  - A single global band size keeps band ranges and color steps identical across all
    six rows, and the key states the step (15.7 points)
  - Theme tokens threaded through title, ticks, axis line and the row-label chips;
    both renders fully readable
  - Idiomatic make_subplots stack with shared_xaxes and domain-relative annotation
    refs for row labels
  - 'Compact folding: one loop over sign and band with np.clip builds every trace'
  weaknesses:
  - 'VQ-02 (both): the row-label chips (page color, opacity 0.85) cover the first
    ~1.5 h of every row and Server F''s label meets the red spike at about 1.8 h →
    keep labels clear of the data, e.g. in a left margin right-anchored at x=0 (margin
    l about +60 px). Likely cause: fig.add_annotation(x=0.008, xanchor=''left'', bgcolor=PAGE_BG)
    inside the plot domain.'
  - 'DQ-02 (both): rows are labelled ''Server A''–''Server F'', which reads generic
    → realistic host names such as ''web-01'', ''web-02'', ''db-primary'', ''cache-01''.
    Likely cause: the name list in the data block.'
  - 'Suggestion: the IMPRINT_PALETTE constant is defined but never used; it could
    be dropped.'
  - 'Suggestion: slightly larger row labels (about 12–13 pt) would carry better in
    the thumbnail.'
