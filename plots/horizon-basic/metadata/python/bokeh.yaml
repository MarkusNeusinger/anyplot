review:
  strengths:
  - 'Diverging color ramp is built by interpolating from the Imprint diverging poles
    (#AE3030 / #4467A3) toward the theme-adaptive page background, exactly matching
    the library''s imprint_div guidance instead of hand-picked hexes.'
  - Rows are ordered by peak volatility rather than alphabetically, and each row carries
    a 'peak +/-X.X' readout — genuine data storytelling and visual hierarchy.
  - 'Distinctive Bokeh interactivity: a shared Range1d x-range links pan/zoom across
    all six panels, plus HoverTool (vline mode) and CrosshairTool for precision reading
    — features a static library could not replicate.'
  - Zebra-striped row backgrounds (alternating PAGE_BG/ELEVATED_BG) help trace a row
    across the full chart width.
  - Font sizes are explicitly set throughout (30pt row labels, 42/34pt axis text,
    50pt title) and chrome is theme-correct in both renders — no dark-on-dark or light-on-light
    text found.
  weaknesses:
  - 'Canvas underfilled at the bottom: summed layout heights are 150 (legend) + 5×215
    (stacked rows) + 400 (last row) = 1625px, but the Selenium window/figure is fixed
    at total_height=1800 — leaving an unbalanced ~175px blank strip below the x-axis
    label in BOTH plot-light.png and plot-dark.png. Grow LAST_PANEL_HEIGHT (or all
    panel heights) so the summed layout equals 1800px exactly.'
  - 'The mandated title substring is missing the required language segment: it reads
    ''horizon-basic · bokeh · anyplot.ai'' instead of ''horizon-basic · python · bokeh
    · anyplot.ai''. Add ''python'' between the spec-id and the library name.'
  - The bold server-name label and the 'peak +/-X.X' readout are layered directly
    on top of the varea fills rather than beside them — still legible thanks to strong
    ink contrast, but a subtle background chip/halo behind each label would read more
    cleanly where a label crosses a saturated high-intensity band peak.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (~#FAF8F1) on the page, with alternating slightly-lighter (~#FFFDF6) zebra stripes for every other row panel. Matches the required light background.
      Chrome: Title "Server Metrics: Hourly Performance Across 24 Hours" (large, bold, dark ink) and subtitle "horizon-basic · bokeh · anyplot.ai" (smaller, muted ink) sit above the stack; the mandated subtitle is missing the "python" language segment. X-axis label "Hour of Day (0-24h)" and tick labels (0/5/10/15/20) render only under the bottom panel, in dark ink on the light background, clearly legible. Row labels ("Database", "Load Balancer", "API Gateway", "Cache Server", "Web Server 2", "Web Server 1", ordered by peak volatility) are bold dark-ink text layered over the data area, legible but sitting on top of the fill. A "peak +/-X.X" readout in muted ink sits near the right edge of each row, comfortably inside the canvas with no clipping.
      Data: Six horizon-folded panels use a blue ramp for positive excursions and a red ramp for negative excursions, each in three intensity bands (light→saturated) built from the Imprint diverging poles #4467A3 (blue) and #AE3030 (red). A legend strip at the very top explains "Positive Values" / "Negative Values" with matching swatches and labels. There is a clearly visible blank strip (~175px) of plain background below the x-axis label at the bottom of the canvas, all on one side (not balanced).
      Legibility verdict: PASS (all text readable; the missing bottom-margin fill and label-over-data layering are layout/polish issues, not legibility failures).

    Dark render (plot-dark.png):
      Background: Warm near-black (~#1A1A17) on the page, with alternating slightly-lighter (~#242420) zebra stripes for every other row — matches the required dark background.
      Chrome: Title and subtitle render in light ink (near-white / muted light gray) against the dark background — fully readable, no dark-on-dark failures found. X-axis tick labels and axis label are light-colored and legible. Row labels and peak readouts are light ink over the data area, same legibility profile as the light render.
      Data: The blue/red diverging bands are visually IDENTICAL in hue/saturation to the light render (only the chrome — background, zebra stripe, text — flips), which is correct: data colors must not change between themes. The same unbalanced ~175px blank strip appears at the bottom of the canvas in this render too.
      Legibility verdict: PASS (no dark-on-dark or light-on-light failures; same layout gap as the light render).
