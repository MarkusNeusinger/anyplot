review:
  strengths:
  - 'Canvas now fills exactly 3200x1800 with no dead strip: LEGEND_HEIGHT (150) +
    5*BASE_PANEL_HEIGHT (240) + LAST_PANEL_HEIGHT (450) sums to 1800px precisely,
    verified pixel-for-pixel against the saved PNG.'
  - Mandated subtitle now reads the full correct string "horizon-basic · python ·
    bokeh · anyplot.ai", including the previously-missing language segment.
  - 'Diverging color ramp is built by interpolating from the Imprint diverging poles
    (#AE3030 / #4467A3) toward the theme-adaptive page background, exactly matching
    the imprint_div guidance instead of hand-picked hexes.'
  - Rows are ordered by peak volatility rather than alphabetically, and each row carries
    a "peak ±X.X" readout — genuine data storytelling and visual hierarchy.
  - 'Distinctive Bokeh interactivity: a shared Range1d x-range links pan/zoom across
    all six panels, plus HoverTool (vline mode) and CrosshairTool for precision reading
    — features a static library could not replicate.'
  - Font sizes are explicitly set throughout and chrome is theme-correct in both renders
    — no dark-on-dark or light-on-light text found anywhere.
  weaknesses:
  - The bold server-name label and the "peak ±X.X" readout are still layered directly
    on top of the varea fills rather than beside them. Legible in both themes thanks
    to strong ink contrast, but a subtle background chip/halo behind each label would
    read more cleanly where a label crosses a saturated high-intensity band peak (minor,
    not a legibility failure).
  - The dense 6-panel stack (200 points x 6 series x 3 bands) still takes real effort
    to parse at a glance beyond the peak call-outs and volatility ordering — a brief
    inline note on how to read the folded bands (e.g. a tiny 'darker = further from
    baseline' cue in the legend) would sharpen first-glance comprehension.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1, with alternating zebra-stripe row backgrounds (#FFFDF6 elevated rows) giving the stack subtle rhythm.
      Chrome: Mandated subtitle "horizon-basic · python · bokeh · anyplot.ai" (now includes the language segment) sits above the bold descriptive title "Server Metrics: Hourly Performance Across 24 Hours", both in dark ink, fully legible. Legend strip at top ("Color Bands & Intensity Levels" + Positive/Negative swatch keys) is dark-on-light and clear. X-axis ticks/label ("Hour of Day (0-24h)") at the very bottom are dark-on-light and fully within the canvas, no clipping. Server-name labels (e.g. "Database") and "peak ±X.X" readouts are layered directly over the data fills but remain legible due to strong ink contrast.
      Data: Six rows (Database, Load Balancer, API Gateway, Cache Server, Web Server 2, Web Server 1 — ordered by peak volatility) show blue/red diverging horizon bands built from the Imprint diverging poles (#4467A3 blue, #AE3030 red) interpolated toward the page background. Positive excursions render blue, negative render red, increasing in saturation with magnitude.
      Legibility verdict: PASS — all title, subtitle, legend, axis, and per-row text is clearly readable against the light background; no light-on-light failures found.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17, with lighter zebra-stripe rows (#242420 elevated rows).
      Chrome: Title, subtitle, axis label, tick labels, legend text, and per-row labels all render in light ink (#F0EFE8 / #B8B7B0) — clearly readable throughout. No dark-on-dark failures found anywhere, including where labels cross saturated band peaks.
      Data: The blue/red diverging band colors are pixel-identical to the light render — confirmed only chrome (background, zebra stripe, text) flips between themes, exactly as required.
      Legibility verdict: PASS — no dark-on-dark or unreadable elements in either row labels, axis, legend, or title/subtitle.

    Canvas fill check: Both PNGs measure exactly 3200x1800 (canvas gate passed). Panel-height budget (150 legend + 5*240 base rows + 450 last row = 1800px) now sums exactly to the canvas height — the ~175px unbalanced blank strip from the prior attempt is gone; a pixel scan down a mid-canvas column shows only local data-trough gaps (expected horizon-chart whitespace) and the intentional bottom axis-label reservation, not a systemic dead zone.
