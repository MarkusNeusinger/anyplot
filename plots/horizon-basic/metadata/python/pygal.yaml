review:
  strengths:
  - Horizon chart implemented from scratch via pygal's Graph subclass extension mechanism
    (pygal has no native horizon-chart type) — the fold/band math (min(remaining,
    band_size) per band, iterating outward from baseline) is correct and produces
    a genuine folded-band encoding.
  - 'Diverging imprint_div palette (#AE3030 red ↔ page background ↔ #4467A3 blue)
    correctly implements the spec''s mirrored positive/negative coloring, with color
    intensity increasing with magnitude within each band via manual hex interpolation.'
  - 'Both light and dark renders are fully theme-correct: backgrounds match #FAF8F1/#1A1A17,
    all chrome (title, sector labels, axis labels, grid, legend) is legible in both
    themes with no dark-on-dark or light-on-light failures, and data (band) colors
    are identical between renders as required.'
  - Real native SVG hover tooltips (<title> elements per band cell showing sector/date/value)
    — genuine interactivity in the HTML output, not simulated.
  - 'Realistic, neutral dataset: 8 market sectors'' cumulative excess return vs. a
    benchmark over one trading quarter, built as a seeded random walk with per-sector
    drift/volatility — plausible finance scenario, reproducible via np.random.seed(42).'
  weaknesses:
  - The implementation bypasses pygal's high-level chart API almost entirely (a dummy
    single-point series just triggers the render pipeline; all real drawing happens
    via direct self.svg.node() calls in a custom Graph subclass). This is a reasonable,
    arguably necessary workaround given pygal has no native horizon-chart type, but
    it scores lower on KISS Structure (class-based architecture) and idiomatic-API
    criteria than a typical single-call chart.
  - Legend swatch labels ('Underperform' / 'Outperform') are set at 26px while the
    rest of the chrome uses 36-56px — noticeably smaller than everything else on the
    canvas and slightly out of proportional balance.
  - 'Visual styling is competent but plain: flat band colors, simple zebra striping,
    standard sans-serif — a bit more refinement (e.g. softer band transitions, a more
    considered legend layout) would lift the design excellence beyond ''solid but
    generic''.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1), correct — not pure white, not dark. Alternating rows use a slightly lighter "elevated" tone for zebra striping.
      Chrome: Title "Sector Performance vs Benchmark · horizon-basic · python · pygal · anyplot.ai" is dark ink, fully visible, comfortably within canvas bounds (~80% width, expected for the long mandated title). Eight bold sector labels (Technology, Consumer Discretionary, Financials, Industrials, Healthcare, Utilities, Real Estate, Energy) run down the left side in dark ink, all legible and not clipped despite "Consumer Discretionary" being the longest. X-axis title "Trading Day (2024)" and date tick labels (Jan 02 ... Jun 18) are muted gray, clearly readable. A small custom legend top-right ("Underperform" / "Outperform" with 3+1+3 color swatches) is present and legible, though its text is noticeably smaller than the rest of the chrome. Subtle dashed vertical grid lines mark ~12 time intervals.
      Data: Each sector row shows folded horizon bands — light-to-dark blue for outperformance, light-to-dark red for underperformance, magnitude-scaled via 3 bands per direction. Colors match the diverging imprint_div endpoints (#4467A3 blue / #AE3030 red) interpolated toward the page background as the meaningful midpoint.
      Legibility verdict: PASS — all text is clearly readable against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17), correct — not pure black, not light. Alternating "elevated" dark tone (#242420) visible in zebra striping.
      Chrome: Title, sector labels, axis title, and tick labels all render in light ink (#F0EFE8 / muted #A8A79F), fully legible against the dark background — no dark-on-dark failures observed anywhere, including the smaller legend text. Grid lines remain subtly visible via the theme-adaptive RULE token.
      Data: Band colors are pixel-identical to the light render (same #4467A3/#AE3030 endpoints and interpolated shades) — only the chrome (background, text, grid, legend swatch outline) flips per theme, as required.
      Legibility verdict: PASS — all text is clearly readable against the dark background, no dark-on-dark failures detected.
