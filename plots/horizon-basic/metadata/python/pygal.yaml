review:
  strengths:
  - Fully custom horizon-chart implementation via pygal's Graph subclass extension
    point — a legitimate, documented way to build a chart type pygal doesn't ship
    natively, rather than faking one with a stock chart type
  - Rows are sorted by final cumulative excess return (best-to-worst leaderboard),
    giving the chart a clear narrative focal point and visual hierarchy
  - Real SVG hover tooltips (native <title> elements per band) rather than simulated
    interactivity, correctly leveraging pygal's HTML export instead of drawing fake
    UI
  - 'Theme-adaptive diverging color scale (imprint_div: matte-red ↔ theme background
    ↔ blue) correctly implements the spec''s mirrored positive/negative coloring note,
    with a clear, well-labeled diverging legend (Underperform/Outperform)'
  - Both light and dark renders are fully legible chrome-wise — title, row labels,
    tick labels, and legend all pass the theme-readability checklist with no dark-on-dark
    or light-on-light failures
  weaknesses:
  - X-axis tick-label font size (30px) is noticeably smaller than the style guide's
    native-pixel baseline for pygal tick labels (~44) and smaller than the sector
    row labels (34) and axis title (40) — increase to ~40-44px for better mobile legibility
    and visual balance with the row labels
  - The lightest (near-zero) horizon band — especially in early-January data for several
    sector rows, and on PAGE_BG-colored rows in the dark render — blends closely with
    its own row's background color, making very small excess-return values hard to
    distinguish from "no signal"; consider a slightly higher minimum saturation for
    band 1 so near-zero deviations stay visible against the row background
  - The custom HorizonChart subclass (_plot/_compute/_lerp_hex) adds real structural
    complexity beyond a typical KISS plotting script — justified by pygal having no
    native horizon chart type, but worth noting as the most complex implementation
    in this batch
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1), matches the required light-theme page surface — not pure white.
      Chrome: Title "Sector Performance vs Benchmark · horizon-basic · python · pygal · anyplot.ai" in large dark ink, fully readable and un-clipped at the top. Eight bold dark sector-name row labels (Consumer Discretionary, Financials, Energy, Real Estate, Technology, Industrials, Healthcare, Utilities) left-aligned and legible. X-axis date tick labels (Jan 02 ... Jun 18) in muted gray, small but legible. Bold "Trading Day (2024)" axis title below. A diverging color-scale legend top-right with "Underperform" / "Outperform" labels over red and blue swatch groups, separated by a neutral (background-colored, outlined) swatch.
      Data: Each sector is a horizon row of folded bands — red intensifying with underperformance, blue intensifying with outperformance, folded into 3 bands per polarity against a shared global scale. Rows alternate between a slightly-elevated white and the cream page background (zebra striping) for scanability. Rows are sorted with the best final performer (Consumer Discretionary) on top and the worst (Utilities) on the bottom.
      Legibility verdict: PASS — all title, row-label, tick-label, and legend text is clearly readable against the light background; no light-on-light text found.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17), matches the required dark-theme page surface — not pure black.
      Chrome: Same title, now in light ink, fully readable and un-clipped. Same eight row labels rendered in light text, legible against the dark rows. X-axis date labels and "Trading Day (2024)" axis title rendered in light muted tones, legible. Same top-right diverging legend, swatch colors unchanged, labels now light-colored and readable against the dark background.
      Data: Data colors (red/blue band endpoints) are visually consistent with the light render — the same hue progression per row and per band, since the diverging scale's fully-saturated endpoints (#AE3030 / #4467A3) are theme-independent; only the near-zero (band-1) tone shifts because its lerp midpoint is intentionally theme-adaptive per the style guide's imprint_div guidance. Zebra striping alternates a slightly-lighter charcoal and the near-black page background.
      Legibility verdict: PASS — no dark-on-dark text; all title, row-label, tick-label, and legend text remains clearly legible. Minor note: the near-zero band on PAGE_BG-colored rows is low-contrast against its own row background in a few early-data stretches (a data-visibility nuance, not a text-legibility failure).
