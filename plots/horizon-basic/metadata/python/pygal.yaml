review:
  strengths:
  - 'A true horizon chart from stock pygal: StackedLine layers with fill=True fold
    each sector''s values onto its row baseline, with an invisible page-coloured spacer
    series lifting the next row'
  - One band range for all eight rows and a legend that names each colour step's value
    range in pp, so every colour means the same magnitude and sign everywhere
  - imprint_div fields ramp sampled from 40% toward each pole, so the palest band
    stays visible in both themes and darker (or, on the dark page, brighter) always
    means larger
  - Rows ranked by final excess return with the best performer on top, and per-point
    tooltips (sector, date, signed pp) in the interactive HTML
  weaknesses:
  - 'DQ-01 (both): no sector falls below about −16 pp, so the darkest red step (−16
    to −24 pp) that the legend lists never appears in any row and the negative side
    shows only two of its three intensities → let at least one sector''s drawdown
    reach the third negative band. Likely cause: the drift/volatility pairs in sector_params
    (Utilities −0.03/0.5 is the deepest loser).'
  - 'Suggestion: IMPRINT_PALETTE is defined but never used — the colours come from
    the imprint_div poles — and could be dropped.'
  - 'Suggestion: a small gap between each legend swatch and its caption would let
    the ''+''/''−'' signs breathe.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across canvas and plot.
      Chrome: title 'Sector Performance vs Benchmark · horizon-basic · python · pygal · anyplot.ai' dark, ~70% width; eight right-aligned sector labels (Consumer Discretionary … Utilities) in dark ink; date ticks Jan 02 … Jun 25 and x title 'Trading day (2024)'; legend top-left listing six colour steps '+16 to +24 pp' … '0 to −8 pp'. All readable.
      Data: eight horizon rows separated by gaps; blue bands (pale, mid, deep #4467A3) for outperformance, red bands (pale, mid) for underperformance folded onto each row's baseline; Energy and Consumer Discretionary reach the deepest blue, Utilities the mid red. Diverging ramp, no categorical series.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, sector labels, ticks, x title and legend in light ink; no dark-on-dark text.
      Data: same layout and band geometry; the ramp starts from the dark page so the pale steps are dark navy / dark maroon and the top steps are the bright poles — every step remains distinguishable from the page and its neighbours.
      Legibility verdict: PASS
