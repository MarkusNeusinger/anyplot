review:
  strengths:
  - One shared band range across all eight rows (global max / 3), so each color step
    stands for the same magnitude and sign in every sector (C4)
  - 'imprint_div fields ramp applied correctly: matte red and blue poles with the
    page color as midpoint, the first step lifted to 40 % so the palest band stays
    visible in both themes'
  - Rows ranked by final cumulative excess return give a clear leaderboard reading
    from outperformers to laggards
  - Real SVG <title> tooltips on every band cell give sector, date and signed value
    in the HTML output
  - 'Theme-correct chrome in both renders: warm page backgrounds, light-on-dark and
    dark-on-light text throughout, and subtle zebra rows'
  weaknesses:
  - 'SC-01, SC-02 (both): bands are not folded onto the row baseline (C2). Band 0
    fills the bottom third of each row, band 1 the middle third and band 2 the top
    third, so the row is a banded area chart three band ranges tall, not a horizon
    → draw every band from the row''s baseline with the full row height equal to one
    band range, each higher band over the lower ones. Likely cause: band_y in _plot
    (lines 143–144) offsets each band by (actual_row_height / n_bands) * band_idx,
    and band_height divides the row by n_bands.'
  - 'VQ-01 (both): row labels at 34 px, legend captions at 32 px and date ticks at
    40 px sit below pygal''s 44 px tick reference, and the ''Underperform / Outperform''
    captions read small → 44 px (+10, +12, +4 px). Likely cause: label_font_size =
    min(34, …) at line 106, legend_font_size = 32 at line 205, x_label_font_size =
    40 at line 172.'
  - 'SC-04 (both): the stepped color key gives only the sign, not the value range
    of each band, so a reader can''t tell what magnitude a step stands for → label
    the band boundaries in pp (for example 0, band_size, 2×band_size, 3×band_size)
    under the swatches. Likely cause: the legend block draws only the two group captions.'
  - 'CQ-01 (code): line 52 `class HorizonChart(Graph)` holds the whole drawing and
    the axis in `_plot` and `_compute` → draw at the top level, cell by cell, for
    example with stock pygal charts or SVG built in top-level code. Likely cause:
    a Graph subclass used as the extension point.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 page; rows alternate a slightly brighter elevated fill and the page color, each with a hairline frame.
      Chrome: title "Sector Performance vs Benchmark · horizon-basic · python · pygal · anyplot.ai" in dark ink across about 70 % of the width, not clipped. Eight bold dark sector labels at the left (Consumer Discretionary, Financials, Energy, Real Estate, Technology, Industrials, Healthcare, Utilities). Muted date ticks from Jan 02 to Jun 18 with the bold axis title "Trading day (2024)" below them. At the top right, a 7-swatch stepped key (3 reds, an outlined neutral swatch, 3 blues) captioned "Underperform" and "Outperform". A dashed hairline vertical grid.
      Data: each row shows blue for positive excess return and red for negative, rising from the row bottom in three intensity steps (#B1BED2 → #7B92BA → #4467A3, and the mirrored reds). The bands are stacked as horizontal strips of the row, not folded onto the baseline. Energy and Consumer Discretionary reach the darkest blue; Utilities reaches the second red step.
      Legibility verdict: PASS. All text is readable; the 32 px legend captions are the smallest text.

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17 page; zebra rows alternate #242420 and the page color.
      Chrome: title, sector labels, date ticks and axis title in light ink, all readable; no dark-on-dark text. The key captions are muted light grey.
      Data: same layout and the same pole colors #AE3030 / #4467A3. The intermediate steps are blended from the dark page midpoint (#2B394F → #375079 → #4467A3, and the mirrored reds), as the imprint_div fields ramp takes its theme's midpoint. Every step stays distinguishable from the row fills.
      Legibility verdict: PASS
