review:
  strengths:
  - 'True horizon folding: three equal-range bands per sign, exact band-edge crossings
    interpolated so every band starts and ends on its edge, the darker band layered
    over the paler ones'
  - Same band ranges and color steps in every row; blue above and matte red below
    from the Imprint diverging anchors, identical in both themes
  - facet_grid(y=...) gives one compact labeled row per host on a shared time axis
  - Legend states the value range of each band, ordered from strongest positive to
    strongest negative
  - Library-native layer_tooltips() shows host, band and deviation on hover in the
    HTML version
  weaknesses:
  - 'Suggestion: a slightly larger strip label size (10 -> 11 pt) would match the
    tick labels.'
  - 'Suggestion: the vertical day grid lines could be dropped to let the band colors
    carry the rows on their own.'
