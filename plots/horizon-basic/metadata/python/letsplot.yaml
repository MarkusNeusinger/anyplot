review:
  strengths:
  - 'Correct horizon folding: three equal-range bands per sign with exact crossing
    points interpolated, so every band starts and ends on its edge and higher bands
    are layered over lower ones in a more intense tint.'
  - Negative values mirrored into the same row in a second hue, with identical band
    ranges and color steps in every row (shared limits=[0, band_size]), so a color
    means the same magnitude across all servers.
  - One compact row per series via facet_grid(y='series') on a shared time axis with
    readable strip labels; no overlays or annotations, as the basic variant requires.
  - Theme tokens threaded through every chrome element; both renders fully legible.
  - 'Library-native interactivity: layer_tooltips() shows series, band and deviation
    in the HTML output.'
  weaknesses:
  - 'VQ-07 (both): the diverging band ramp runs brand green (positive) <-> blue (negative),
    which is neither imprint_div (matte red #AE3030 <-> blue #4467A3) nor the bad/good
    semantic exception (red <-> green) → build the six band steps from one Imprint
    diverging ramp, e.g. blue tints for one sign and #AE3030 tints for the other.
    Likely cause: loss_rgb/brand_rgb built from IMPRINT[2] and IMPRINT[0].'
  - 'DQ-02 (both): the rows are labelled ''Server A'' … ''Server F'', which reads
    as a generic placeholder → realistic host names (e.g. ''web-01'', ''api-02'',
    ''db-primary''). Likely cause: the series_names list.'
  - 'Suggestion: the six rows share almost the same daily sine with phase shifts;
    more varied per-server behaviour (a quiet row, a drifting row) would show off
    the horizon''s at-a-glance comparison.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1.
      Chrome: bold dark title "horizon-basic · python · letsplot · anyplot.ai" (~62% width); y-title "CPU deviation from baseline (%)", x-title "Day of Week", Mon–Sun ticks, one "0" baseline tick per row, bold rotated strip labels (Server D, E, F, B, A, C) on the right, legend "Deviation band (%)" — all readable dark text; subtle day gridlines.
      Data: six stacked horizon rows; positive deviations in three green tints up to #009E73, negative deviations mirrored in three blue tints up to #4467A3, higher bands layered over lower ones.
