review:
  strengths:
  - 'Correct horizon-fold math: values are clipped per band to [0, band_size] with
    mirrored positive/negative handling, which is the mathematically correct core
    of the technique.'
  - 'Band colors are principled tints interpolated from the Imprint brand anchors
    (#009E73 positive, #AE3030 negative) toward white — theme-independent and semantically
    anchored rather than arbitrary.'
  - 'Distinctive lets-plot feature used well: custom layer_tooltips() with formatted
    band/deviation lines, explicitly noted in comments as unavailable in plotnine.'
  - Facets ordered by descending data volatility (groupby(...).std().sort_values)
    — a thoughtful, data-driven presentation choice.
  - Theme-adaptive chrome correctly threaded through PAGE_BG/INK/INK_SOFT tokens;
    both renders pass the light/dark readability check with identical data colors.
  - Clean, reproducible, KISS-structured script with correct canvas/export handling
    (scale=4, HTML export, lets-plot-images cleanup).
  weaknesses:
  - The layout uses 6 full-sized facet_wrap panels (~300px tall each) instead of compact,
    thin per-series strips — this defeats the horizon chart's defining purpose of
    showing many series in minimal vertical space; at the spec's suggested 'dozens
    of series' scale this layout would become enormous. Collapse each series into
    a much shorter horizontal band/row so the compactness value proposition is actually
    visible.
  - Hour-to-hour noise (sigma=4) and frequent large spikes (20-35) make the folded
    bands extremely jagged/serrated, overlapping in a way that's hard to read as smooth
    intensity 'mountains' — reduce noise amplitude and/or apply light smoothing (e.g.
    rolling mean) so band transitions read cleanly.
  - Positive/negative bands use green vs. red, a red-green CVD-risk pairing; consider
    brand blue (#4467A3) for the negative direction instead, per the spec's own suggestion
    of blue/red as the more typical horizon-chart convention.
  - Panel border box is visible around each facet from theme_minimal() defaults —
    remove or lighten it for a more refined look consistent with the 'spines removed'
    style guidance.
  - The 6-entry 'Band Intensity' legend is fairly heavy chrome for what should be
    a compact chart; consider condensing to a smaller intensity key.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1), correct — not pure white, not dark.
      Chrome: Title "horizon-basic · python · letsplot · anyplot.ai" bold dark text at top; 6 facet strip titles (Server B, C, F, D, E, A, ordered by descending volatility); Mon-Sun x-axis labels; "Folded Value (stacked bands)" y-axis label with sparse 0/10 ticks; "Band Intensity" legend (6 swatches) on the right. All readable, dark ink on light background, no light-on-light issues.
      Data: 3 positive bands (teal tints toward #009E73) and 3 negative bands (pink/red tints toward #AE3030) overlaid per facet with alpha=0.85. First/brand color #009E73 correctly anchors the +High band. Data is very dense/jagged due to per-hour noise and spikes, making individual band transitions hard to trace despite colors being distinguishable.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17), correct — not pure black, not light.
      Chrome: Same title/strip titles/axis labels/legend, all correctly flipped to light ink (#F0EFE8 / #B8B7B0) on the dark background. No dark-on-dark failures found — all text clearly legible.
      Data: Band fill colors are visually identical to the light render (only chrome flipped, as required). Same overplotted/jagged readability issue persists.
      Legibility verdict: PASS
