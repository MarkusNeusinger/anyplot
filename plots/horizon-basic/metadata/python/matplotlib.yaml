review:
  strengths:
  - 'Excellent theme-adaptive chrome: title, legend, series labels, and tick labels
    are crisp and fully legible on both the #FAF8F1 light and #1A1A17 dark surfaces
    (verified via close-up crops of title, legend, axis, and label regions)'
  - 'Faithful horizon-chart technique: 3 mirrored positive/negative bands with an
    alpha-ramped intensity encoding (via a reusable mcolors.Normalize-based ramp)
    and gaussian-smoothed ''mountain-range'' fold, exactly matching the spec''s description'
  - 'Correct Imprint palette usage: green #009E73 for positive / matte red #AE3030
    for negative directly matches the style guide''s documented ''sentiment/polarity''
    semantic-exception convention, identical across both themes'
  - Clean 8-series stacked layout fits the 3200x1800 canvas with generous, balanced
    margins and no edge clipping — series labels use a background-matched path-effect
    stroke so they stay legible over any band color behind them
  - 'Realistic, well-differentiated synthetic data: 8 distinct server metrics with
    daily sinusoidal cycles plus localized spikes, giving genuine data-density and
    feature-coverage variety across rows'
  - Custom 6-swatch legend (Low/Mid/High x +/-) clearly documents the band-to-magnitude
    mapping for the reader
  weaknesses:
  - Positive/negative polarity is distinguished purely by hue (green vs. red) with
    no secondary/redundant encoding — an inherent limitation of the horizon-chart
    folding technique (both polarities fill from the same zero baseline), but still
    costs VQ-04 since it is technically a red-green-only signal for sign
  - The band_alpha() helper function is a minor departure from the KISS 'no functions'
    code-quality guideline (CQ-01) — could be inlined as a small lookup/comprehension
    without losing clarity
  - Series row labels (9pt) and the band legend (7.5pt) sit at or below the style
    guide's tick/legend text floor (8pt) — legible at full resolution per the crops,
    but leaves little margin once scaled to a ~400px mobile width across 8 stacked
    rows
  - Data storytelling relies solely on the mirrored-color convention with no annotation
    calling out the most notable spike/anomaly per metric — not required by the spec,
    but would strengthen the at-a-glance insight (DE-03)
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches the mandated #FAF8F1 plot surface (confirmed by direct color sampling of the empty canvas area).
      Chrome: Title "horizon-basic · python · matplotlib · anyplot.ai" is dark ink, centered, fully visible with margin on both edges (no clipping at right edge, confirmed via crop). The 6-swatch band legend ("Low +", "Mid +", "High +", "Low -", "Mid -", "High -") sits inside an elevated-background box with a soft gray border, all text clearly readable. Eight bold series-name labels (CPU Load, Memory, Network I/O, Disk I/O, Requests/s, Latency, Queue Depth, Threads) sit to the right of each row in dark ink with a light-background stroke, staying legible even where they overlap a colored band. Bottom x-axis shows "Time (Hour of Day)" plus hour-of-day tick labels in soft gray, all readable.
      Data: Each of the 8 stacked rows folds its time series into 3 intensity bands of green (#009E73-based, increasing alpha for higher positive magnitude) above the zero baseline, and 3 intensity bands of matte red (#AE3030-based) for negative magnitude — the folding technique described in the spec. Bands read as a smooth, mountain-range-like silhouette with visible daily cycles and localized spikes per metric.
      Legibility verdict: PASS — all text (title, legend, series labels, tick labels) is clearly readable against the light background; no light-on-light issues found.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches the mandated #1A1A17 plot surface.
      Chrome: Title, legend text, series labels, and tick labels all flip to light ink (#F0EFE8 / #B8B7B0-family tones) and remain fully legible — no dark-on-dark failures found in any close-up crop (title/legend, x-axis ticks, or right-edge series-label column).
      Data: The green and red band colors are pixel-identical to the light render (only chrome flipped), confirming Imprint palette data-color consistency across themes as required.
      Legibility verdict: PASS — all text is clearly readable against the dark background; the light-colored ink reads cleanly over the near-black surface with no contrast failures.
