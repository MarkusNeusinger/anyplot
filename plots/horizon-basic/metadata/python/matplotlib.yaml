review:
  strengths:
  - 'Sophisticated custom horizon-chart implementation: fold-based band rendering
    driven by a principled alpha ramp built from mcolors.Normalize instead of a hand-tuned
    arithmetic ladder'
  - 'Excellent theme-adaptive chrome: Imprint data colors (green/red band gradients)
    are pixel-identical between light and dark renders; only background/ink/legend
    chrome flips'
  - Series labels use a path-effect stroke halo (pe.withStroke) so text stays legible
    even sitting directly on top of high-intensity bands, in both themes
  - 'Clean 8-panel layout: top/right/left spines removed, shared bottom axis only
    on the last panel, custom 6-swatch legend clearly explains the Low/Mid/High +
    and - band encoding'
  - Realistic, neutral dataset - 8 common server-monitoring metrics (CPU Load, Memory,
    Network I/O, Disk I/O, Requests/s, Latency, Queue Depth, Threads) over 24 hours,
    matching the spec's dashboard-monitoring application
  weaknesses:
  - Data density (24 hourly points per series) is well below the spec's stated 100-1000
    time points per series, giving the bands a choppier, more triangular silhouette
    than the smooth mountain-range look horizon charts are known for - consider higher-frequency
    sampling (e.g. 5-min intervals over 24h) for a denser fold.
  - X-axis ticks use matplotlib's default verbose date format ('01-15 00', '01-15
    03', ...) even though every point falls on the same day - format ticks as plain
    hour-of-day (e.g. '00:00') to match the 'Time (Hour of Day)' axis label and reduce
    clutter.
  - No annotation calls out the most notable spikes (e.g. the sustained high-load
    Memory stretch around midday) - a light callout would strengthen the data storytelling.
  - Distinguishing positive vs negative deviation relies solely on green/red hue,
    a known accessibility limitation of horizon charts for red-green color-vision-deficient
    viewers; this is inherent to the chart type the spec mandates, so it's a soft
    note rather than a deduction driver.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 - not pure white, not dark.
      Chrome: Title "horizon-basic · python · matplotlib · anyplot.ai" in dark ink, fully visible and centered at top. Below it, a horizontal legend box with 6 swatches (Low +/Mid +/High + in a teal-green gradient, Low -/Mid -/High - in a red gradient) on an elevated off-white panel with soft-ink border. Eight stacked horizon panels are labeled on the right in bold dark text (CPU Load, Memory, Network I/O, Disk I/O, Requests/s, Latency, Queue Depth, Threads). Bottom x-axis shows date-hour ticks ("01-15 00" through "01-15 21") in soft ink and the axis label "Time (Hour of Day)" in dark ink.
      Data: Folded/mirrored bands per panel - green intensity increases with positive deviation magnitude, red intensity increases with negative deviation magnitude, baseline at zero. First/primary hue is Imprint brand green (#009E73), paired with Imprint red (#AE3030) for the mirrored negative side.
      Legibility verdict: PASS - all title, legend, series-label, and tick text reads clearly dark-on-light; no light-on-light issues observed.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 - not pure black, not light.
      Chrome: Same title and legend layout, now rendered in light ink against the dark background, fully legible. Legend panel uses a slightly elevated dark facecolor with a soft-ink border. Series labels on the right are bold light text with a dark stroke halo so they stay readable even directly over a high-intensity band. X-axis tick labels are muted light-gray, clearly visible against the near-black background.
      Data: Green/red band gradients are visually identical to the light render in hue and relative intensity - only the background and text/chrome colors flipped, confirming the Imprint data palette held constant across themes.
      Legibility verdict: PASS - no dark-on-dark or unreadable text observed anywhere in the render.
