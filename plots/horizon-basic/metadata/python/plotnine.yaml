review:
  strengths:
  - Bands are folded properly. Each sign has three bands of equal value range (band_size
    = 98th percentile of |value| / 3), drawn with geom_area(position='identity') in
    pale-to-dark order, so a darker band always sits on top of a paler one.
  - 'The colors are discrete steps of imprint_div: the red #AE3030 and blue #4467A3
    poles are blended toward the page colour of each theme. Warm red for positive
    temperature anomalies and cold blue for negative ones fit the domain.'
  - facet_grid(Station ~ .) gives one compact row per station on a shared datetime
    axis. Left-aligned strip labels name each row, and the y-axis is dropped, so all
    six stations compare at a glance.
  - The legend uses scale_fill_manual breaks and labels to list the bands from the
    largest positive value to the largest negative one, with readable value ranges
    ('+3.5 to +6.9', '−6.9 and beyond').
  - The theme tokens reach every piece of chrome (page, legend box, strips, ticks,
    title), so both renders pass the readability check.
  weaknesses:
  - 'VQ-01 (both): the legend''s band labels are set at 7 pt, the smallest text on
    the canvas, and blur when the chart is scaled down to the 400 px thumbnail → 8
    pt, the same as the strip labels (+1 pt). Likely cause: legend_text=element_text(size=7).'
  - 'CQ-04 (code): the hex-to-RGB parsing on lines 73 and 79 (`int(PAGE_BG[k : k +
    2], 16) for k in (1, 3, 5)`) writes out what matplotlib.colors.to_rgb computes,
    and the hour-by-hour AR(1) loop on lines 61–62 writes out scipy.signal.lfilter([1],
    [1, -0.85], noise) → use those calls. Likely cause: hand-rolled helpers.'
  - 'Suggestion: in the dark render the palest band (40 % strength) sits close to
    the #1A1A17 page; a slightly higher first step such as 0.5 would make quiet rows
    stand out more.'
  - 'Suggestion: a descriptive title prefix such as ''Hourly Temperature Anomalies
    by Station · '' would tell the reader what the chart shows.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole canvas; the legend box is in the elevated #FFFDF6 with an INK_SOFT frame.
      Chrome: the bold title "horizon-basic · python · plotnine · anyplot.ai" spans about 52 % of the width; the x-axis title "Time" and the day ticks "Mon 06 Jul" … "Sun 12 Jul" are dark; the station names (Northern Ridge … Desert Plain) are dark labels to the right of each row; faint vertical day grid lines; no y-axis by design. All readable.
      Data: six horizon rows over one week of hourly data. Positive anomalies are folded into three red steps (pale pink, medium, #AE3030-strength) and negative ones into three blue steps (pale, medium, #4467A3-strength). Desert Plain shows a strong warm spell on Wed 08 Jul in the darkest red, and Forest Edge a cold spell on Tue 07 Jul in the darkest blue. Peaks are cut flat at the top of their rows. Spec-semantic diverging colors, so no #009E73 first series applies.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17; the legend box is #242420 with a light frame.
      Chrome: the title, "Time", the station labels and the legend title are light (#F0EFE8); the ticks and legend text are INK_SOFT light grey. No dark-on-dark text.
      Data: the same layout and the same poles. The band steps are blended toward the dark page (the theme-adaptive imprint_div midpoint), so the pale bands read as dim maroon and navy and the strongest band as bright red and blue. Every step stays distinguishable from its neighbours and from the background, though the palest band is subdued.
      Legibility verdict: PASS
