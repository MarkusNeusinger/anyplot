review:
  strengths:
  - facet_grid(Station ~ .) gives one compact row per station on a shared time axis,
    with the right-hand strips doubling as left-aligned row labels — the grammar-native
    way to stack horizon rows
  - Folding is done in the data (three equal-range bands per sign) and drawn with
    one geom_area(position='identity') layer whose band factor orders pale under dark,
    so a darker fill always means a larger magnitude in every row
  - 'The bands are discrete steps of imprint_div (matte red #AE3030 for warm, blue
    #4467A3 for cold anomalies) mixed into the theme''s page color, so every step
    stays distinguishable in both themes and red reads as warm'
  - Mirrored legend (darkest warm at top, darkest cold at bottom) with computed band
    ranges lets the reader decode magnitude and sign directly
  - Theme tokens are threaded through every chrome element; the y axis, ticks and
    horizontal grid are removed as the plot type allows, leaving only subtle daily
    gridlines
  weaknesses:
  - 'CQ-01 (code): a `mix()` helper function (lines ~66–71) breaks the flat Imports
    → Data → Plot → Save structure → inline the blend as a dict/list comprehension
    over the band strengths (or compute the six colors in the band loop). Likely cause:
    the color blend was factored into a def.'
  - 'DQ-03 (code): the ''Temperature anomaly (°C)'' series carries a full ±8 °C diurnal
    cycle plus single-hour spikes of ±12–18 °C, which is not how hourly anomalies
    at a weather station behave → remove the daily cycle from an anomaly (or relabel
    the value as temperature deviation from the weekly mean) and spread the extreme
    events over several hours with ±4–8 °C amplitude. Likely cause: `daily_cycle =
    8 * np.sin(...)` and the one-hour `extremes` impulses.'
  - 'VQ-05 (both): the legend title ''Temperature anomaly (°C)'' runs edge to edge
    inside the legend frame, touching its left and right borders, so the box looks
    cramped → give the title about 4–6 px of padding (shorter title such as ''Anomaly
    (°C)'' via labs(fill=...) or legend_box_margin/legend_margin). Likely cause: legend_title
    size 8 with the long column name as fill label.'
  - 'Suggestion: band edges at 5.0 and 10.1 °C come from the 98th-percentile quantile;
    rounding band_size to a clean step (e.g. 5 °C) would make the legend ranges read
    more naturally.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across plot and panels; legend box on the elevated #FFFDF6 with an INK_SOFT frame.
      Chrome: bold title "horizon-basic · python · plotnine · anyplot.ai" (~62 % of width) in near-black; x tick labels "Mon 06 Jul" … "Sun 12 Jul" in dark grey; x title "Time"; six station names (Northern Ridge … Desert Plain) as right-hand strip labels; legend "Temperature anomaly (°C)" with six entries. All readable.
      Data: six stacked horizon rows over one week of hourly data; warm anomalies in three steps of matte red (pale pink → #AE3030), cold anomalies in three steps of blue (pale slate → #4467A3), darker bands layered over paler ones; faint vertical daily gridlines. No first-series green needed (diverging imprint_div bands).
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17; legend box on #242420 with a light frame.
      Chrome: title, strip labels and x title in off-white, tick and legend text in light grey — no dark-on-dark text.
      Data: same layout and band geometry; band colors are the same red/blue poles mixed into the dark page instead of the light one (theme-adaptive imprint_div midpoint), so palest bands are dark maroon/navy and the darkest bands are the full #AE3030 / #4467A3 poles. All six steps remain distinguishable from each other and from the background.
      Legibility verdict: PASS
