      Data: Folded horizon bands in light-to-dark blue for gains and light-to-dark pink-to-red for losses. TECH and FINANCE show occasional deep-blue (10-15pp gain) spikes; ENERGY is dominated by red/pink loss bands with a couple of deep-red (10-15pp loss) spikes; HEALTHCARE and RETAIL show a mix of both. First categorical convention (#009E73 green) is intentionally not used since this is a diverging (not categorical) encoding — see review notes.
