review:
  strengths:
  - 'Correct horizon-chart technique: 3 folded intensity bands per polarity, colors
    generated via sns.light_palette from Imprint diverging anchors (blue gain / matte-red
    loss) instead of the default green/red pairing, with an in-code rationale for
    CVD safety'
  - 'Both renders are fully theme-correct: identical data colors across light and
    dark, chrome (background, title, subtitle, row labels, ticks, grid, legend box)
    properly threaded through INK/INK_SOFT/ELEVATED_BG tokens'
  - Compact row-faceted layout via sns.FacetGrid with tight intentional vertical packing
    (hspace=0.06), matching the horizon-chart goal of comparing many series in minimal
    vertical space
  - Explicit font sizes throughout (title, subtitle, row labels, ticks, axis label,
    legend); clear 6-entry legend with correctly labeled bands matching the plotted
    magnitude ranges
  - Good data variety across the 5 series (sinusoidal, volatility spikes, linear trend,
    cosine, drift) exercising both gain and loss directions and reaching the outer
    intensity band in multiple series
  - Shared tick_positions across facets (fixed from the attempt-1 review) keep the
    vertical gridlines aligned across all 5 rows
  weaknesses:
  - Band fills use raw unsmoothed daily noise, producing jagged, spiky edges in several
    rows (especially FINANCE) that reduce the smooth, at-a-glance pattern recognition
    horizon charts are meant to offer — a short rolling window before folding into
    bands would read more cleanly without losing the underlying signal
  - 90 trading days per series is slightly below the specification's suggested 100-1000
    time-point range
  - Deviation magnitudes reaching up to ±15 percentage points from a 20-day moving
    average are on the aggressive end for typical stock behavior outside crisis periods
  - Legend uses matplotlib's default column-major fill (ncol=3), so the two polarities
    are interleaved across columns (e.g. 'Gain 0-5 pp' and 'Gain 10-15 pp' land in
    different columns) rather than grouped Gain-then-Loss — pass an explicit handle
    order or use two separate legends to make the polarity grouping immediately obvious
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Bold black title "horizon-basic · python · seaborn · anyplot.ai" at top, gray subtitle "Deviation from 20-Day Moving Average (percentage points)" beneath it. Five row labels (TECH, FINANCE, ENERGY, HEALTHCARE, RETAIL) in dark ink, right-aligned. X-axis tick labels (Day 0, Day 15, Day 30, Day 45, Day 60, Day 75) and axis title "Trading Days (90-day period)" in dark/soft-dark ink. Legend box with off-white elevated background and soft border, 6 labeled color swatches. All chrome elements are clearly legible against the light background.
      Data: Folded horizon bands in a blue (gain) → matte-red (loss) diverging pair, three intensity shades per polarity from light to saturated. First data color is blue-family (#4467A3 family), not the brand green — this is a deliberate diverging/semantic choice (finance gain/loss), not a categorical series, and is internally consistent across all 5 rows and both themes.
      Legibility verdict: PASS — no dark-on-dark or clipped text observed; subtle vertical gridlines are visible but do not compete with the data.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Title and row labels render in light/white ink, subtitle and tick labels in a softer light gray, legend box uses the dark elevated fill (#242420) with a light border and light text. Every chrome element flips correctly relative to the light render.
      Data: Same blue/matte-red banded fills as the light render — visually identical hues and band boundaries confirmed across all 5 rows, only the chrome (background, text, grid, legend frame) changed.
      Legibility verdict: PASS — no dark-on-dark failures; all title/label/tick text is clearly readable against the near-black surface, and the diverging blue/red data colors remain highly visible on the dark background.
