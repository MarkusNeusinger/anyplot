review:
  strengths:
  - Correctly implements the non-trivial horizon-chart folding algorithm (3 mirrored
    positive/negative bands with progressively darker color per magnitude tier) using
    only base ggplot2 grammar — a chart type the library has no native geom for.
  - Diverging band ramp uses PAGE_BG as the interpolation anchor, which is exactly
    the style guide's own theme-adaptive-midpoint recipe for imprint_div — both renders
    stay correctly readable and the outermost (highest-magnitude) band color is identical
    between themes.
  - facet_wrap(strip.position = "left") gives compact per-server row labels without
    wasting horizontal space on a legend column; the caption substitutes as a concise
    color-meaning key.
  - 'Clean single-pass code: set.seed(42), no unused imports, canvas gate passed,
    no edge clipping in either render, all chrome (title/facet labels/ticks/caption)
    legible in both light and dark.'
  weaknesses:
  - No y-axis title or unit label anywhere on the chart — the deviation values are
    in percentage points per the data-generation comment, but a viewer looking only
    at the rendered plot has no way to know the unit. Add something like y = "Deviation
    (pp)" or fold the unit into the caption.
  - No numeric color-intensity key — the caption states 'color intensity = deviation
    magnitude' but doesn't map color to an actual value range, so a reader can't tell
    what magnitude the darkest band represents. A small annotated strip or caption
    addendum with the band boundary value(s) would close this gap.
  - fold_bands() is a defined function, which is a mild deviation from the KISS 'no
    functions' preference — justified here since it avoids duplicating the same folding
    logic for the positive and negative mirrors, so no action required unless a future
    pass wants to inline it.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1), correct — not pure white, not dark.
      Chrome: Bold dark title "Server Load Deviation · horizon-basic · r · ggplot2 · anyplot.ai" at top, clearly readable dark ink. Ten server-name facet strip labels (web-01..04, api-01..03, db-01/02, cache-01) in soft grey along the left, all legible. X-axis "Date" title and Jun 01–Jun 07 tick labels along the bottom in soft grey, readable. Caption below the x-axis explaining band color = deviation magnitude, blue = above baseline, red = below baseline — readable, appropriate size.
      Data: Ten stacked horizon-chart facets, one per server, each showing folded area bands. Positive deviations render in a blue ramp (light powder blue for the outer/smallest-magnitude band up to a saturated #4467A3 for the innermost/largest-magnitude band), negative deviations mirror into a red ramp (light dusty rose up to saturated #AE3030). No y-axis ticks (by design — horizon charts fold the scale away).
      Legibility verdict: PASS — no light-on-light or illegible text found; all chrome elements checked at full resolution and at the canvas edges (title top, right margin, bottom caption, left facet-label column) with no clipping.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17), correct — not pure black, not light.
      Chrome: Same title now in light ink (#F0EFE8), clearly readable against the dark background. Facet strip labels and axis tick labels rendered in the lighter INK_SOFT grey, all legible, no dark-on-dark failures. Caption remains readable in soft light grey.
      Data: Same ten horizon-chart facets. The most-saturated band colors (#4467A3 blue / #AE3030 red — the "full magnitude" tier) are pixel-identical to the light render, since the ramp always converges to the fixed Imprint diverging endpoints at full magnitude. The lighter inner bands differ somewhat from the light render because the ramp's other anchor is PAGE_BG, which is itself theme-adaptive — this matches the style guide's own imprint_div recipe ("midpoint is theme-adaptive — #FAF8F1 on light bg, #1A1A17 on dark bg"), so it is a correct implementation, not a bug.
      Legibility verdict: PASS — no dark-on-dark text found anywhere (title, facet labels, ticks, caption all checked); no clipping at any canvas edge.
