review:
  strengths:
  - 'Correct horizon-chart mechanism: band! folds each server''s series into 3 alpha-graduated
    bands, mirrored around a zero baseline for positive/negative deviation'
  - Idiomatic Makie small-multiples via GridLayout (fig[row, 1] per server), with
    hideydecorations!/hidexdecorations! keeping only one shared x-axis on the bottom
    row
  - Canvas lands exactly on 3200x1800 (1600x900 x px_per_unit=2), and both renders
    are fully legible with correct theme-adaptive chrome (no dark-on-dark or light-on-light
    issues)
  - 'Palette use follows the style guide''s semantic-exception rule precisely: brand
    green (#009E73, palette position 1) for positive deviation, matte red (#AE3030,
    position 5) for negative deviation'
  - 'Realistic, neutral dataset: 10 named server CPU-load-deviation series, 145 points
    over 24h, within the spec''s 100-1000 point / 5-50 series guidance'
  - Reproducible (Random.seed!(42)), clean imports (CairoMakie, Colors, Random all
    used), no fake interactivity, no functions/classes
  weaknesses:
  - Positive/negative encoding relies solely on green-vs-red hue with no redundant
    cue. Because a horizon chart folds both polarities onto the same baseline, hue
    is the ONLY way to tell them apart at a glance -- a real red-green CVD risk. Add
    a small 2-swatch legend (e.g. '↑ above baseline' / '↓ below baseline') or a compact
    text label near the title.
  - No scale reference for what a band boundary actually represents (e.g. 'each band
    ≈ X pp deviation'). The subtitle explains the folding concept but not the concrete
    magnitude per band, which matters for a technique most readers won't already know
    how to decode.
  - DE-03 hierarchy comes only from color-intensity; there is no explicit callout
    on the most notable anomaly (e.g. search-index's sustained deep-red band from
    ~9h-17h) to anchor the chart's story for a first-time viewer.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 -- not pure white.
      Chrome: Bold dark title "horizon-basic · julia · makie · anyplot.ai" (~65% of the plot-area width, no overflow), a lighter-weight subtitle explaining the folding technique, 10 left-aligned server-name row labels (api-gateway, auth-service, web-frontend, payments-svc, search-index, cache-redis, db-primary, db-replica, worker-queue, load-balancer), and a shared "Time (hours)" x-axis with ticks 0/3/6/.../24 on the bottom row only. All text is dark ink on the cream background and clearly readable.
      Data: Each row is a folded horizon band -- pale green for small positive deviation, saturating to a darker brand green for larger positive deviation; pale pink for small negative deviation, saturating to matte red for larger negative deviation. First (brightest) positive color is #009E73 as required. Thin baseline rules cleanly separate adjacent rows with no visual bleed between them.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 -- not pure black.
      Chrome: Same title/subtitle/row-labels/x-axis layout, now rendered in light ink (#F0EFE8 title, #B8B7B0 subtitle/ticks) against the dark surface -- fully legible, no dark-on-dark failures anywhere (row labels, tick labels, and axis title are all clearly visible).
      Data: Same green/red band-fill colors and alpha progression as the light render -- confirmed identical data colors, only the chrome (background + text) flipped as required.
      Legibility verdict: PASS
