review:
  strengths:
  - Correctly implements the horizon-chart fold algorithm (overlaid bands via clipPath,
    one <path> per band per sign) matching the classic horizon-chart definition rather
    than a fake/simulated version.
  - Color intensity increases with magnitude across 3 mirrored bands, using the spec's
    own suggested blue-positive/red-negative convention with theme-adaptive Imprint
    diverging stops (div[0]/midpoint/div[2]) — data colors identical between light
    and dark renders.
  - Deterministic, reproducible data via a seeded LCG, with a plausible, neutral facility-monitoring
    context (8 named sensors, diurnal cycle + bounded random walk).
  - Theme-correct chrome in both renders (backgrounds, ink/inkSoft text, grid strokes)
    with no legibility failures.
  - 'Clean, idiomatic D3: scaleTime, d3.area + curveMonotoneX, clipPath, axisBottom,
    no extraneous imports, no fake interactivity, animations correctly omitted for
    the static harness capture.'
  weaknesses:
  - The bounding rect drawn around the whole strip area plus a baseline rule under
    every strip add a bit of extra chrome/frame that slightly undercuts visual refinement
    — consider dropping the outer rect or lightening it further.
  - With 8 near-parallel strips and no single-series emphasis, there's no visual hook
    drawing the eye to a specific noteworthy pattern or outlier sensor — a subtle
    highlight (e.g., bolder label or annotation on the most volatile station) would
    strengthen data storytelling.
  - Legend swatch/tick text (13px) and station row labels (15px) are the smallest
    text elements on the canvas — legible at full size but tight once scaled down
    to a ~400px thumbnail.
  - Small helper functions (bandScale, bandPath, makeRng) add minor structural complexity
    versus a fully flat script; justified here by the per-band/per-series repetition
    but worth noting for KISS scoring.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1-consistent), matches the required light-theme surface.
      Chrome: Title "Facility Temperature Deviation · horizon-basic · javascript · d3 · anyplot.ai" is centered at top in bold dark ink, clearly legible. A right-aligned diverging legend ("Deviation from baseline (°C)", -6°C / 0°C / +6°C) sits above the chart. 8 horizontal strips are labeled on the left with station names (Greenhouse North/South, Warehouse A/B, Rooftop Array, Basement Vault, Loading Dock, Server Room) in soft gray-brown ink. A bottom time axis shows "Jan 01"–"Jan 09" tick labels.
      Data: Each strip shows a folded horizon pattern — light-to-dark blue mounds for above-baseline (warmer) periods and light-to-dark red mounds for below-baseline (colder) periods, following a clear diurnal rhythm. Peaks vary in saturation with magnitude as intended.
      Legibility verdict: PASS — all title, legend, row-label, and tick text is clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17-consistent), matches the required dark-theme surface.
      Chrome: Same title, legend, row labels, and axis ticks now rendered in light ink/inkSoft tones, fully legible against the dark background. Strip separator lines and the bounding rect remain visible but subtle.
      Data: Same red/blue diverging bands as the light render, at identical hues and identical magnitude-to-saturation mapping — confirms only chrome (not data color) flips between themes.
      Legibility verdict: PASS — no dark-on-dark failures observed; every text element (title, legend units, row labels, date ticks) reads clearly against the near-black surface.
