review:
  strengths:
  - Genuinely idiomatic, distinctive D3 implementation of the horizon-chart fold technique
    using native SVG clipPath per lane — a feature that would be hard to replicate
    cleanly in a high-level charting library.
  - 'Clean, well-organized layout: 10 station lanes fill the canvas with generous
    whitespace, minimal chrome (no heavy spines/gridlines), and a custom intensity
    legend explaining the anomaly-to-color mapping.'
  - Fully explicit, theme-adaptive typography (px font sizes for title/labels/legend)
    that stays legible in both light and dark renders, including a title fontsize
    that correctly scales down for the long descriptive+mandated title string.
  - Deterministic, seeded per-series LCG random walk keeps the dataset reproducible
    while giving each of the 10 real-world stations a distinct, plausible anomaly
    trajectory.
  weaknesses:
  - 'Color mapping for polarity ignores the style guide''s continuous-diverging rule:
    temperature anomaly is signed/diverging continuous data, which should use the
    `imprint_div` colormap (`t.div`, matte-red <-> neutral <-> blue) per default-style-guide.md
    ''Continuous Data''. Instead the code hard-codes `t.palette[0]` (brand green)
    for positive and `t.palette[4]` (matte red) for negative, ignoring `t.div` entirely.
    This also inverts the explicit ''temperature hot->red / cold->blue'' domain convention
    listed in the same guide: here red represents *cold* (negative) anomaly and green
    represents *warm* (positive) anomaly, which reads backwards versus standard temperature-anomaly
    maps (NOAA/IPCC-style: red=warm, blue=cool). Fix: derive the fill colors from
    `t.div[0]` (red, mapped to positive/warm) and `t.div[2]` (blue, mapped to negative/cool)
    instead of `t.palette`.'
  - Because positive/negative bands are folded into the same lane space with no positional
    redundancy, hue (green vs red) is the only signal distinguishing warm from cold
    anomalies -- a real CVD-accessibility risk for red-green color-blind viewers,
    especially at low band intensity where fills are pale and close in perceived lightness.
    Switching to the red/blue diverging pair recommended above would also fix this,
    since red-blue is far more CVD-robust than red-green.
  - The title occupies only ~43% of the plot width, below the 50-70% target proportion
    for a shortened/prefixed title -- consider a slightly larger base fontsize or
    a shorter descriptive prefix for better visual weight.
  - 'Minor data-realism note: every series is generated from the same mean-reverting
    LCG process (only reseeded), so all 10 lanes share a similar noise ''texture'',
    differing mainly in phase/amplitude rather than genuinely varied series character
    (e.g. a long heatwave streak vs. high-frequency noise) -- this slightly limits
    DQ-01 feature coverage.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 -- not pure white.
      Chrome: Bold dark title top-left ("Regional Temperature Anomalies · horizon-basic · javascript · d3 · anyplot.ai"), a top-right legend ("Anomaly (°C) · 3 bands per side") with red/green swatch ramps and -3.8/0/+3.8 labels, 10 dark station-name labels (Berlin, Madrid, Oslo, Cairo, Tokyo, Nairobi, Lima, Perth, Toronto, Mumbai) to the left of each lane, thin light-gray lane-divider lines, and a bottom x-axis with Jun 01 / Jul 01 / Aug 01 / Sep 01 tick labels in dark ink. All confirmed readable against the light background.
      Data: Each lane shows a folded horizon area using green (#009E73, brand green -- positive/warm anomaly) and matte red (#AE3030 -- negative/cold anomaly), with 3 bands of increasing fill-opacity per polarity encoding magnitude. Perth and Oslo show strong sustained red (cold) excursions; Mumbai and Berlin show strong green (warm) excursions.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 -- not pure black.
      Chrome: Title, legend text, and all 10 station labels flip to light/white text, fully readable against the dark background. Lane-divider lines and axis line switch to a light, low-opacity stroke. No dark-on-dark text observed anywhere.
      Data: Same underlying green/red hues as the light render (identical hex values); they appear visually brighter/more saturated only because of alpha-compositing against the darker page background, which is expected for opacity-based band fills and not a hue change. Band intensity pattern per lane matches the light render exactly (e.g. Perth's sustained red block, Mumbai's sustained green block).
      Legibility verdict: PASS
