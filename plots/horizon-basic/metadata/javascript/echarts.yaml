review:
  strengths:
  - Sector rows are now sorted by mean deviation (strongest to weakest), fixing the
    attempt-1 weakness and giving the chart an immediate top-to-bottom pattern instead
    of requiring the reader to scan all 10 rows
  - Title fontSize raised from 20 to 26 (now ~50-55% of plot width) and legend/tick
    text raised from 11-12px to 13-14px, resolving the attempt-1 undersized-chrome
    feedback
  - 'Correct, well-executed horizon-chart folding technique: 3 mirrored opacity-graduated
    bands per sector row, matching the spec''s folding description exactly'
  - Correct use of the Imprint diverging colormap (t.div, red negative / blue positive)
    for signed-deviation continuous data, with a clean gradient legend showing the
    -15%/0/+15% scale
  - 'Theme-adaptive chrome is fully correct in both renders: warm off-white/near-black
    backgrounds, readable ink-soft text, identical data colors between light and dark'
  - Deterministic seeded LCG data generation with an added mean-reversion term, clean
    small-multiples layout using ECharts' multi-grid pattern, no overlap or clipping
  weaknesses:
  - Sustained extreme deviations (multiple sectors saturating the outer +/-15% band
    for weeks at a time, e.g. Energy and Financials rows) are still visible in this
    attempt despite the added mean-reversion term -- the reversion pull (0.05-0.08)
    looks too weak relative to volatility (0.6-1.5) to meaningfully shorten these
    runs; consider a stronger reversion coefficient or a tighter volatility range
    so the outer band is reserved for genuine spikes
  - The diverging legend still uses hand-built graphic elements (rect + text) rather
    than ECharts' visualMap component -- a piecewise or continuous visualMap would
    be a more idiomatic, library-distinctive way to drive both the gradient bar and
    (optionally) live color mapping
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 -- not pure white.
      Chrome: Title "Sector Return Deviation · horizon-basic · javascript · echarts · anyplot.ai" centered at top in dark ink, fully visible and comfortably sized (~50-55% of plot width). 10 sector row labels (Utilities, Industrials, Technology, Healthcare, Materials, Consumer, Real Estate, Telecom, Financials, Energy, sorted top-to-bottom by mean deviation) in dark-gray ink to the left of each row. Date tick labels (1/2, 1/13, 1/24, 2/4, 2/15, 2/26) only on the bottom row, as expected for a horizon chart. Diverging legend "Deviation from sector avg (%)" with a red-to-blue gradient bar and -15%/0/+15% labels sits top-right.
      Data: Each row folds its time series into 3 mirrored, opacity-graduated bands -- blue above the sector's own baseline (positive deviation), red below it (negative deviation), darker/more saturated where magnitude is larger. Rows are sorted so blue-leaning (Utilities, Industrials) sit at top and red-leaning (Financials, Energy) sit at bottom, revealing a clear pattern at a glance.
      Legibility verdict: PASS -- all title, row-label, tick-label, and legend text is clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 -- not pure black.
      Chrome: Same title, row labels, tick labels, and legend now rendered in light ink against the dark surface -- fully legible, no dark-on-dark failures.
      Data: Band colors and positions are identical to the light render (same red/blue hues, same opacity levels, same sort order) -- confirms only chrome flipped between themes and data colors stayed constant.
      Legibility verdict: PASS -- all text remains clearly readable against the dark background; no low-contrast or invisible elements observed.
