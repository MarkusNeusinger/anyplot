review:
  strengths:
  - 'Correct, well-executed horizon-chart folding technique: 3 mirrored bands per
    sector row with opacity encoding magnitude, matching the spec''s ''folding values
    into color-coded bands'' description exactly'
  - Correct use of the Imprint diverging colormap (t.div, red↔neutral↔blue) for signed-deviation
    continuous data — this is precisely the documented imprint_div use case ('signed
    deviations'), with a clean gradient legend showing the -15%/0/+15% scale
  - 'Theme-adaptive chrome is fully correct in both renders: warm off-white/near-black
    backgrounds, readable ink-soft text, identical data colors between light and dark'
  - Clean small-multiples layout using ECharts' multi-grid pattern (10 synced grids/axes),
    with sector labels and a shared bottom time axis — idiomatic and well-spaced,
    no overlap or clipping
  - Deterministic seeded LCG data generation, no fake interactivity, clean KISS-ish
    structure with no unused imports
  weaknesses:
  - Sector rows are left in the input array's arbitrary order (Technology, Energy,
    Healthcare, …) rather than sorted/clustered by a meaningful signal (e.g. total
    deviation magnitude, trend direction, or correlation) — a sort would let the chart
    reveal an at-a-glance pattern instead of requiring the reader to scan all 10 rows
  - Title occupies only ~39% of the plot width at fontSize 20 — noticeably smaller
    than the ~50-70% comfortable range (or ~70-85% typical for the full mandated title
    string); increasing to ~24-26px would give the title more presence on the 3200px
    canvas without risking overflow
  - Diverging-legend tick labels ('-15%', '0', '+15%') and title are set at 11px/12px,
    smaller than the other chrome text (14-15px) — legible at full resolution but
    the smallest text on the canvas, worth bumping to ~13-14px for better mobile legibility
  - Sustained deviations of ±15-18% for multiple sectors over most of the 60-day window
    (e.g. Energy, Financials) are on the extreme side for 'sector return deviation
    from average' — tightening the volatility/drift constants would keep the outer
    band reserved for genuine spikes rather than a persistent state
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Title "Sector Return Deviation · horizon-basic · javascript · echarts · anyplot.ai" is dark, centered, fully visible with comfortable margin above/below. 10 sector row labels (Technology, Energy, Healthcare, Financials, Industrials, Materials, Utilities, Consumer, Real Estate, Telecom) in soft dark gray at the left of each row. Bottom x-axis shows date ticks (1/2 … 2/26) only on the last row, as expected for a horizon chart. A diverging color-scale legend ("Deviation from sector avg (%)", -15% to +15%) sits top-right with a clean red→cream→blue gradient bar.
      Data: Each row folds its time series into 3 stacked opacity bands — red below the sector's own baseline (0), blue above it, with color intensity increasing at greater magnitude (visible as darker/more saturated peaks e.g. Financials, Energy, Consumer late in the series). No markers, smooth mountain-silhouette area fills.
      Legibility verdict: PASS — all text (title, row labels, tick labels, legend) is clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Same title, row labels, and legend, now rendered in light ink (off-white/light-gray) against the dark surface. Title and axis date ticks remain fully legible; the diverging legend gradient bar and its tick labels are visible against the dark background without merging into it.
      Data: Data colors are identical to the light render — same red/blue diverging bands at the same opacity levels and positions (e.g. Energy stays deep red, Telecom/Real Estate trend blue toward the end in both renders), confirming only chrome flipped between themes.
      Legibility verdict: PASS — no dark-on-dark failures observed; all title/label/tick text is clearly readable in light ink against the near-black background.
