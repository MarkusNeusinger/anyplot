review:
  strengths:
  - Correctly implements the true horizon-chart folding technique using layered, y-scale-clamped
    Chart.js Line charts (fill:'start' + clamped [bandIndex*H, (bandIndex+1)*H] y-domain
    per layer) — a genuinely correct workaround for a chart type Chart.js has no native
    support for, exactly matching the library rule to build out of core primitives
    rather than returning NOT_FEASIBLE.
  - Band color ramps are derived from the fixed Imprint diverging endpoints (t.div[0]/t.div[2]);
    pixel-sampling the full-saturation swatch confirms it is byte-identical (rgb(68,103,163))
    between the light and dark renders, satisfying the 'data colors constant across
    themes' rule.
  - 'Precise spec alignment: mirrored blue-above/red-below coloring, 3 bands per polarity
    (within the spec''s 2-4 band note), meaningful zero baseline (50% CPU), 10 services
    (5-50 range), 121 points/series (100-1000 range).'
  - 'Clean information design: title, subtitle with units, a mini-gradient legend
    that explains the color-intensity encoding, right-aligned service labels, and
    a single shared time axis at the bottom instead of repeating it per row.'
  - Deterministic seeded LCG data generation, no external dependencies, animation:false
    set consistently across all 60 layered Chart instances, no fake interactivity.
  weaknesses:
  - At the 400px mobile thumbnail scale, the 10 stacked service labels, the subtitle,
    and the gradient-swatch legend text become quite small and harder to read — the
    information density (10 rows + subtitle + legend) competes for limited vertical
    space more than a single-panel chart would; consider slightly larger row-label/subtitle
    fontsizes or trimming the subtitle for small viewports.
  - Some rare high-magnitude spikes (the ~4% probability spike noise) render as very
    thin, needle-like slivers only a few pixels wide, which are easy to miss compared
    to the broader sinusoidal peaks — acceptable since it reflects the underlying
    sparse-spike data, but worth noting for repair if legibility needs to improve
    further.
  - The horizontal legend swatches ('above baseline, increasing →' / 'below baseline,
    increasing →') communicate direction via arrow text rather than a numeric scale
    — sufficient for this compact format, but an optional tick value (e.g. '+9 / +18
    / +27') on the swatch would remove any residual ambiguity about the exact band
    thresholds.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1-consistent), not pure white, not dark.
      Chrome: Bold dark title "horizon-basic · javascript · chartjs · anyplot.ai" top-left, a smaller dark-gray subtitle "CPU deviation from 50% baseline · 10 services · 5-minute samples over 10 hours", and a two-part gradient legend ("above baseline, increasing →" in blue swatches, "below baseline, increasing →" in red swatches) — all clearly readable against the light background. Ten right-aligned service-name row labels (api-gateway, auth-service, cache-primary, cache-replica, db-primary, db-replica, queue-worker, search-index, cdn-edge, websocket-gw) in dark ink, and a shared time axis (00:00–10:00) at the bottom in soft gray.
      Data: Each row is a horizon-folded band chart — pale blue-gray to saturated blue peaks rising above a light gray-tan "track" background represent CPU above the 50% baseline; pale pink to saturated matte-red peaks represent CPU below baseline. Color intensity increases with magnitude, mirrored above/below a flat baseline, per the spec's horizon-chart notes.
      Legibility verdict: PASS — every text element (title, subtitle, legend, row labels, axis ticks) is dark-on-light and fully legible; no clipping at any canvas edge.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17-consistent), not pure black, not light.
      Chrome: Same title/subtitle/legend/row-labels/axis layout, now rendered in light cream/gray text against the near-black background — all clearly legible, no dark-on-dark failures observed (verified by close crops of the title block, row-label column, and bottom-right axis label).
      Data: Pixel-sampling confirms the full-saturation band color is byte-identical between renders (rgb(68,103,163) at the darkest blue swatch position in both light and dark PNGs) — the fixed Imprint diverging endpoints (#AE3030 / #4467A3) are preserved across themes. The lighter, less-saturated inner bands are intentionally blended toward each theme's own page background (a legitimate horizon-chart "fade toward baseline" convention), so their exact hex differs by theme while the outermost/most-saturated band matches exactly.
      Legibility verdict: PASS — all text is light-on-dark and readable; brand blue/red bands remain vivid and distinguishable from the near-black track background.
