review:
  strengths:
  - 'Genuinely implements the horizon-chart fold technique with core Chart.js: each
    band is a separate Line chart with its y-scale clamped to [i*BAND_HEIGHT, (i+1)*BAND_HEIGHT)
    and fill:"start", so values above the band saturate to full row height and values
    below collapse to zero — this is the correct ''fold and overlay'' mechanic, not
    a fake/simulated horizon.'
  - Diverging Imprint colormap (imprint_div) is the semantically correct choice for
    signed CPU-deviation data, matching the spec's 'blue up / red down' note.
  - Rows are sorted by peak magnitude (most volatile first), giving the dense 10-row
    layout a clear focal point and visual hierarchy instead of leaving every row equal-weight.
  - Legend explicitly explains the folded color-intensity encoding ("above baseline,
    increasing →" / "below baseline, increasing →") which is essential for a chart
    type most viewers won't recognize on sight.
  - Deterministic seeded LCG data generation with varied amplitude/period/phase per
    service plus occasional spikes gives each row a visually distinct pattern rather
    than uniform noise.
  - 'animation: false is correctly set on every one of the 60 layered Chart instances,
    and only a single wrapper + canvases are appended to #container per the mount-node
    contract.'
  weaknesses:
  - 'Band colors are computed as mix(t.pageBg, t.div[end], frac). Since t.pageBg differs
    between themes (#FAF8F1 light / #1A1A17 dark), the two lower-magnitude bands (frac=1/3,
    2/3) resolve to different absolute RGB values in light vs dark — only the outermost
    band (frac=1) is theme-identical, since mix() at frac=1 always returns the target
    hex regardless of the base. Per the style guide, Imprint data colors must stay
    pixel-identical across themes; switch to alpha-blended rgba(divColorRGB, frac)
    (or equivalent opacity-based compositing) instead of mixing toward pageBg so the
    underlying series color value is identical in both renders.'
  - No explicit axis label states the unit of the encoded value (percentage points
    of CPU deviation) — the subtitle mentions 'CPU deviation from 50% baseline' but
    never states the unit explicitly (e.g. 'pp' or 'percentage points'), which costs
    points under VQ-06.
  - At 10 rows x 6 layered Chart.js instances (60 canvases total), the thinnest single-sample
    spikes in dense/noisy rows (e.g. cache-replica, auth-service) become only a few
    pixels wide, occasionally making a single spike harder to distinguish from neighboring
    noise — slightly denser than optimal for a 121-point series at this row height.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "horizon-basic · javascript · chartjs · anyplot.ai" in bold dark ink, subtitle "CPU deviation from 50% baseline · 10 services · 5-minute samples over 10 hours" in softer gray, a two-swatch legend explaining the folded band gradients ("above baseline, increasing →" blue ramp, "below baseline, increasing →" red ramp), 10 right-aligned service-name row labels (search-index, cache-replica, cache-primary, queue-worker, auth-service, db-replica, cdn-edge, api-gateway, websocket-gw, db-primary), and bottom x-axis time ticks (00:00 through 10:00). All chrome text is dark-on-light and clearly readable.
      Data: Each row is a horizon strip folding a single CPU-deviation series into 3 blue bands (above baseline) and 3 red bands (below baseline), layered to show magnitude via color intensity — pale blue/red for small deviations, saturated blue/red for large ones. First-glance impression: search-index (top row, sorted by peak volatility) shows the most dramatic saturated-blue and saturated-red peaks; db-primary (bottom row) is comparatively calmer.
      Legibility verdict: PASS — all text readable, no overlap, no clipping at any canvas edge.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title, subtitle, legend, row labels, and axis ticks, now rendered in light ink (near-white/light-gray) against the dark surface. All text remains fully readable — no dark-on-dark failures observed anywhere (title, row labels, and axis ticks are all clearly legible).
      Data: Same 10 rows, same fold structure and hue orientation (blue=above baseline, red=below). The hue orientation and the single most-saturated band per polarity are visually consistent with the light render (matching the underlying #4467A3 / #AE3030 anchors, since mix() at frac=1 is theme-independent). However, the two paler intermediate bands read visibly more washed/muted-cool in dark mode than in light mode, because they are blended toward the theme's page background (#1A1A17) rather than kept at a fixed value — see weaknesses.
      Legibility verdict: PASS — text is fully readable in dark mode, no dark-on-dark issues; flagged separately (not a legibility failure) is the cross-theme data-color drift in the two paler bands.
