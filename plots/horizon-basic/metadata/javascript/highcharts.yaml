review:
  strengths:
  - 'Creative, idiomatic solution to a plot type Highcharts has no native chart for:
    one yAxis panel per host plus 2x3 stacked, opaque, mouse-tracking-disabled area
    series per host implements true horizon folding via foldBand()/threshold, not
    a workaround.'
  - Correct semantic choice of the diverging Imprint colormap (imprint_div) for signed
    CPU-deviation data, with band color intensity increasing by magnitude exactly
    as the spec's Notes section describes ('Color intensity increases with magnitude
    within each band').
  - 'Theme chrome is fully compliant — sampled background pixels are exactly #FAF8F1
    (light) and #1A1A17 (dark), all text uses theme-adaptive tokens, and there is
    no clipping at the title, right edge, or bottom edge in either render.'
  - Deterministic Park-Miller LCG for reproducible data; realistic, neutral 'fleet
    CPU monitoring' scenario that matches one of the spec's own example applications
    almost verbatim.
  - No fake interactivity, no legend clutter for what is effectively continuous-encoded
    data — tooltip/legend correctly disabled since each panel already carries its
    own row label.
  weaknesses:
  - 'Layout imbalance (VQ-05): the host-name label column reserves a large empty gutter
    on the left (roughly a third of canvas width is blank before the first label even
    starts), while the chart area butts almost flush against the right canvas edge
    with near-zero margin. Whitespace is not balanced around the plot as the style
    guide requires — tighten the left yAxis.title offset/margin and add a small right-side
    margin so both sides breathe evenly.'
  - 'No visible color/magnitude key: the blue-rises/red-falls/deeper-means-bigger
    encoding is explained only in subtitle prose, with no small legend or scale strip
    showing the actual band thresholds (0/15/30/45 percentage points). A compact color-key
    near the title would make the encoding self-explanatory without requiring the
    reader to parse the subtitle sentence.'
  - Series count sits at the low end of the spec's suggested range (10 hosts vs. the
    spec's '5-50 series for effective comparison' and its own 'Dashboard monitoring
    displaying 50+ system metrics' application) — the example doesn't fully showcase
    the horizon chart's core value proposition of compacting many series into limited
    vertical space.
  - 'CQ-01: makeLcg/foldBand/lerpHex plus nested per-host/per-band loops go beyond
    the KISS ''Imports -> Data -> Plot -> Save'' ideal. The folding logic genuinely
    needs a function, but lerpHex() could be dropped by hardcoding the 6 resulting
    band hex colors as literals since t.div is fixed per render.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, sampled pixel (250,248,241) = #FAF8F1, matches spec exactly.
      Chrome: Title "horizon-basic · javascript · highcharts · anyplot.ai" in bold dark ink, subtitle in softer gray-brown below it, both fully readable and not clipped at the top edge. Ten host-name row labels (api-1, api-2, api-3, api-4, worker-1, worker-2, cache-1, cache-2, db-primary, db-replica) sit in a left gutter, dark-gray, clearly legible, no overlap with the mountain shapes or with each other. X-axis datetime ticks (Jun 10, 02:00 AM ... Jun 11) are dark and readable, fully visible at the right canvas edge (verified via pixel crop — not clipped).
      Data: Each host panel shows a horizon-folded area series in muted blue (values above the CPU baseline) and muted red/rose (values below), with deeper/more saturated shade for bands further from baseline (e.g. api-2's evening hours and db-primary's afternoon hours show a visibly darker red core inside the lighter red halo). Colors are the interpolated Imprint diverging stops (imprint_div), not the categorical palette — an intentional and spec-appropriate choice since the chart encodes continuous, signed magnitude rather than discrete categories.
      Legibility verdict: PASS — all text is clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, sampled pixel (26,26,23) = #1A1A17, matches spec exactly.
      Chrome: Title and subtitle flip to light ink/soft-gray and remain fully legible against the dark background; no dark-on-dark failures observed. Row labels and axis tick labels are all light-colored and readable. Same crop check confirms no edge clipping at title or right-edge date ticks.
      Data: The same blue/red diverging band colors as the light render — confirmed identical hue family and intensity progression (e.g. api-4's midday deep-blue peak and worker-2's early-morning deep-red block both reproduce in the same positions and shades). Only the chrome (background, text) flipped between themes, as required.
      Legibility verdict: PASS — all text is clearly readable against the dark background; no dark-on-dark failures.
