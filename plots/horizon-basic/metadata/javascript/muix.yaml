review:
  strengths:
  - 'True horizon folding: each band is its own ChartsContainer with a strict yAxis
    0–max domain, offset by one band height and clipped, so peaks cut flat and continue
    in the next darker band with equal value ranges (15 pp each) in every row'
  - Positive (blue) and negative (red) values mirrored in the same row from the imprint_div
    poles, with the same band ranges and color steps across all eight series
  - Theme-correct chrome and the theme-adaptive diverging midpoint in both renders;
    skipAnimation on every container and monotoneX curves that never overshoot the
    data
  - Rows, series names and band thresholds all derived from the records (new Set,
    max deviation rounded to 15 pp)
  weaknesses:
  - 'VQ-01 (both): the legend''s threshold numerals (15 / 30 / 45) are 11 px and the
    legend labels 13 px, well under the axis/legend 14–16 px the library prompt names,
    and they blur in the 400 px thumbnail → about 14 px numerals (+3 px) and 15 px
    labels (+2 px). Likely cause: fontSize: 11 / fontSize: 13 in LegendSwatches.'
  - 'DQ-02 (both): all eight services (from redis-cache to payment-worker) follow
    nearly the same clean 24-hour sine with only small noise, so the rows read as
    one synthetic wave repeated rather than distinct server metrics → give the services
    different shapes (load spikes, a quiet night, a drift or an incident on one day)
    in the data generation. Likely cause: daily = amplitude * sin(2πi/24 + phase)
    dominating the small walkScale random walk.'
  - 'CQ-01 (code): mixHex, bandColors, BandStack, HorizonRow and LegendSwatches are
    helper functions/components beyond the required default export → inline them into
    the default-exported component''s JSX maps and module-level constant arrays. Likely
    cause: component decomposition.'
  - 'Suggestion: place the time ticks on day boundaries (Day 1 … Day 7 at 00:00) instead
    of quarter points such as "Day 6 · 05:00".'
  - 'Suggestion: render the shared time axis with MUI X''s own ChartsXAxis on the
    last row instead of absolutely positioned Typography ticks.'
