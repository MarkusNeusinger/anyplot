review:
  strengths:
  - Correctly implements the horizon-chart folding technique (stacked, clipped, vertically-shifted,
    mirrored area layers) via MUI X's composition API (ChartContainer + AreaPlot)
    — a genuinely advanced pattern not natively supported by any high-level MUI X
    chart type
  - Idiomatic, correct use of the Imprint diverging scale (imprint_div, t.div[0]/[1]/[2])
    for the meaningful-zero deviation data, exactly matching the style guide's 'Continuous
    Data' diverging-polarity guidance, with color intensity correctly increasing with
    magnitude per band
  - Theme-adaptive chrome verified correct in both light and dark renders — data colors
    (band gradients) are identical across themes, only background/text/grid/legend
    flip
  - Clean deterministic data generation (seeded mulberry32 LCG, mean-reverting random
    walk + daily sine cycle) producing varied, realistic per-server deviation profiles
    (payment-worker visibly more volatile than email-worker)
  - Thoughtful custom legend with gradient swatches conveying the color-intensity-to-magnitude
    mapping, symmetrically placed around a divider near the plot without overlapping
    any row
  weaknesses:
  - No quantitative scale for the band thresholds — the legend only conveys direction
    (Above/Below baseline) qualitatively, with no indication of what percentage-point
    range each band shade represents
  - Time series length (48 hourly points over 2 days) undershoots the spec's recommended
    100-1000 points per series range, understating the compact-multi-series value
    proposition horizon charts are meant to demonstrate over longer spans
  - Row/tick label text (15px/13px CSS) gets tight at mobile thumbnail scale (~400px
    wide) — legible but small
  - Lower-amplitude series (redis-cache, search-index, email-worker) show washed-out,
    less-distinct band gradations compared to higher-amplitude series like payment-worker
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Bold dark title top-left ("horizon-basic · javascript · muix · anyplot.ai"), a top-right legend with red "Below baseline" swatches and blue "Above baseline" swatches separated by a thin vertical divider, 8 right-aligned server-name row labels (api-gateway, auth-service, orders-db, inventory-db, redis-cache, search-index, payment-worker, email-worker), and bottom x-axis tick labels ("Day 1 · 00:00" through "Day 2 · 23:00"). All chrome text renders in dark ink, clearly legible against the light background.
      Data: Each row folds a server's deviation-from-baseline series into 3 stacked bands above a thin baseline rule (blue, increasing intensity with magnitude) and 3 mirrored bands below (red, same intensity logic). Band colors are graduated tints of the Imprint diverging poles (t.div[2] blue / t.div[0] red) blended toward the midpoint, giving a smooth color-intensity gradient rather than hard color jumps.
      Legibility verdict: PASS — all text (title, legend, row labels, tick labels) is clearly readable against the light surface; no light-on-light issues observed.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title, legend, row-label, and tick-label layout as the light render, now rendered in light ink (title/labels in off-white, secondary text in light gray) — clearly visible against the dark surface.
      Data: The same blue/red band gradients from the light render appear unchanged — colors are identical between themes, confirming only chrome (background + text) flipped, not the data encoding.
      Legibility verdict: PASS — no dark-on-dark text found; all title, row labels, legend text, and tick labels are clearly visible against the near-black background.
