review:
  strengths:
  - 'Correct horizon folding built with the MUI X composition API: each band is its
    own ChartsContainer + AreaPlot sharing a 0–max y domain, shifted one band height
    and clipped, so peaks cut flat at the row top continue in the next, more intense
    band (orders-db, redis-cache, payment-worker).'
  - Positive values fold upward in blue and negatives mirror downward in red within
    the same row, with three equal 15 pp bands and one global maxDeviation, so every
    color means the same magnitude and sign in all eight rows.
  - Band colors are derived from the theme-adaptive imprint_div tokens (midpoint mixed
    toward each pole), so all six steps stay distinguishable in both themes, and the
    custom legend prints the 15/30/45 pp thresholds under each swatch.
  - 'Clear typographic hierarchy: bold title, ink-soft subtitle carrying the value
    unit, right-aligned weight-500 row labels flush against the plot, edge-anchored
    first and last time ticks.'
  - Plausible, deterministic (mulberry32-seeded) server-metric scenario with recognizable
    events — a login storm, an outage followed by a backlog surge, a cache flush,
    newsletter sends — that the darkest bands pick out at a glance.
  - monotoneX curves never overshoot the data, and skipAnimation is set on every chart
    component.
  weaknesses:
  - 'DQ-03 (both): inventory-db drifts from about −22 pp to +22 pp across the week,
    yet the value is a deviation from a 24 h rolling baseline, which absorbs a slow
    drift (a linear drift of 44 pp/week lags that baseline by only about 3 pp) — the
    row shows a full red band for two days and a full blue band for three → keep its
    sustained offset within about ±3 pp and let the nightly batch bumps carry the
    row (about −19 pp of drift). Likely cause: the `-22 + (44 * i) / 167` term in
    the inventory-db shape.'
  - 'Suggestion: place the time ticks on day boundaries (Day 1 · 00:00, Day 3 · 00:00,
    …) instead of the quarter indices that land on 18:00, 12:00 and 05:00.'
  - 'Suggestion: the area fill is set three times (series `color`, the `.MuiLineChart-area`
    sx rule and `slotProps.area.style`), and the TITLE_FONT_SIZE length branch never
    fires for this title; one of each is enough.'
  - 'Suggestion: one ChartsContainer per half with three overlaid series clamped to
    each band would replace the 48 shifted, clipped containers.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, no pure white.
      Chrome: bold dark title "horizon-basic · javascript · muix · anyplot.ai" top-left, ink-soft subtitle "Deviation from 24h rolling baseline, in percentage points (pp)"; legend top-right with three red swatches (45/30/15) "Below baseline", a thin divider, "Above baseline" and three blue swatches (15/30/45); eight right-aligned dark row labels (api-gateway … email-worker); five time ticks along the bottom (Day 1 · 00:00 … Day 7 · 23:00). All readable.
      Data: eight horizon rows, positive deviations folded upward in three blue intensities (pale → deep blue), negatives mirrored downward in three red intensities (salmon → deep red), a thin grid-colored baseline per row. Peaks flatten at the row edge and continue in darker bands (orders-db evenings, redis-cache flush on Day 5, payment-worker outage and surge, auth-service login storm). Diverging Imprint (imprint_div) colors; no categorical palette needed.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17, no pure black.
      Chrome: title, subtitle, legend text, row labels and time ticks all render in light ink and are clearly readable; no dark-on-dark text.
      Data: same layout and bands; the band steps are mixed from the theme-adaptive imprint_div midpoint, so the lowest band is a muted dark blue/red and the top band the brightest blue/red — intensity still rises with magnitude, and all three steps per hue remain distinguishable against the dark page. The pole hues are the same as in the light render; only the theme-adaptive midpoint tint differs, as the diverging token defines.
      Legibility verdict: PASS
