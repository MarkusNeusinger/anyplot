review:
  strengths:
  - Correctly implements the classic horizon-chart fold technique (band stacking +
    overflow clipping), verified at the pixel level to show a genuine 3-tier color-intensity
    progression per polarity, not just a 2-tone approximation.
  - Correct use of the diverging Imprint colormap (t.div, red-blue) for the continuous
    positive/negative deviation encoding instead of the categorical palette, matching
    the style guide's 'Continuous Data' rule.
  - 'Plot backgrounds match the spec hex exactly (#FAF8F1 light / #1A1A17 dark), all
    chrome (title, subtitle, row labels, tick labels, legend) is theme-adaptive and
    legible in both renders, and data colors are pixel-identical across themes.'
  - Descriptive subtitle with units ('Deviation from 24h rolling baseline, in percentage
    points (pp)') plus a quantitative legend that documents the exact band thresholds
    (15/30/45) — a thoughtful, unusually rigorous touch for a horizon chart.
  - No overlap and no edge clipping in either render; deterministic seeded data generation
    (mulberry32 LCG) per server.
  weaknesses:
  - Row labels (server names) and the legend threshold numbers (11-17px CSS) become
    illegible once the image is scaled down to the ~400px mobile thumbnail — the wave
    pattern still reads, but identifying which row belongs to which server does not
    survive the mobile scale. Increase row-label and legend-number font weight/size
    so they hold up at thumbnail scale.
  - Only 8 series are shown; horizon charts earn their place specifically for compactly
    comparing dozens of series (spec notes '50+ system metrics'). 8 rows is within
    the spec's 5-50 range but undersells the technique's core value proposition —
    consider 15-20 servers.
  - 'No explicit data-storytelling focal point: rows are in an arbitrary server order
    with no sorting or highlighting of the most volatile series (e.g., payment-worker
    has the largest amplitude/walk but isn''t visually called out).'
  - The fold effect is built from ~48 stacked ChartContainer/AreaPlot instances (8
    rows x 2 polarities x 3 bands) clipped via CSS overflow rather than a more composed
    higher-level MUI X pattern — functionally correct and visually clean, but a heavier,
    more manual approach than the library's idiomatic API surface would suggest.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, measured pixel value (250,248,241) — exact match for #FAF8F1.
      Chrome: Bold dark title "horizon-basic · javascript · muix · anyplot.ai" top-left, a descriptive subtitle below it ("Deviation from 24h rolling baseline, in percentage points (pp)"), a quantitative legend top-right (red swatches labeled 45/30/15 for "Below baseline", blue swatches labeled 15/30/45 for "Above baseline"), 8 right-aligned server-name row labels (api-gateway, auth-service, orders-db, inventory-db, redis-cache, search-index, payment-worker, email-worker) in dark ink, and 5 "Day N · HH:00" x-axis tick labels at the bottom. All chrome text is dark-on-cream and clearly readable at full resolution; zoomed crops confirm no anti-aliasing artifacts or contrast problems.
      Data: Each of the 8 rows is a folded horizon band: a light-blue outer hump for small positive deviation, a medium-blue mid-tier, and a dark-blue inner core for the largest positive deviation, mirrored below the row's zero baseline with light/medium/dark red bands for negative deviation. A thin baseline rule marks zero in each row. Color intensity visibly increases toward the peak/trough magnitude — confirmed via pixel-level crop of the payment-worker row, which shows 3 distinct blue and 3 distinct red tiers.
      Legibility verdict: PASS at full canvas resolution. At the ~400px mobile thumbnail (plot-light_400.png), the overall wave pattern is still visible and the title remains legible, but the row labels and legend threshold numbers are too small to read — a mobile-scale weakness noted above, not a hard failure.

    Dark render (plot-dark.png):
      Background: Warm near-black, measured pixel value (26,26,23) — exact match for #1A1A17.
      Chrome: Same layout as the light render; title and subtitle render in light ink (F0EFE8-family), row labels and axis tick labels render in soft light-gray ink, legend swatches/numbers unchanged in position. Zoomed crops of the legend, a row label ("api-gateway"), and the x-axis tick row all show clearly legible light text on the dark background — no dark-on-dark failures anywhere.
      Data: Confirmed pixel-identical band colors to the light render — same light/medium/dark blue and red tiers, same 3-tier intensity progression, only the chrome (background, text) flipped as required. Brand accents are not used here since this is a diverging-colormap (not categorical) encoding, which is the correct choice per the style guide for continuous deviation data.
      Legibility verdict: PASS. All text readable against the dark background; no dark-on-dark or light-on-light issues in either theme.
