review:
  strengths:
  - 'Data colors are pixel-identical between light and dark renders (#009E73 line/marks/area),
    and chrome (background #FAF8F1/#1A1A17, grid, title, ticks) is fully theme-adaptive
    in both renders'
  - 'Goes beyond a minimal line chart: ChartsReferenceLine average marker, area fill
    under the trend, dashed grid styling, and mark strokes tuned against the page
    background for contrast'
  - Deterministic LCG-seeded synthetic data (56-day early-spring warming trend with
    realistic day-to-day noise) is reproducible and factually plausible for the domain
  - Explicit font sizing on title, axis labels, and tick labels in both themes; layout
    uses a generous share of the canvas with balanced margins
  - 'Clean code: only used imports, no fake UI/interactivity, correct skipAnimation
    + default-export harness contract'
  weaknesses:
  - Spec says a basic line plot 'connects data points with straight lines', but the
    series uses curve="monotoneX" (smoothed interpolation) instead of a straight-segment
    curve — switch to the library's linear/straight curve type to match the spec's
    described technique
  - The Y-axis label is built by hand (a separate rotated Typography box plus manual
    chartWidth/chartHeight/yLabelWidth arithmetic) instead of using LineChart's native
    yAxis[0].label mechanism — more idiomatic and less brittle to let MUI X reserve
    the axis-label space itself
  - 'Design stays fairly restrained for Design Excellence: a single series plus one
    reference line is tasteful but not yet publication-tier — consider a touch more
    visual hierarchy (e.g. highlighting the peak/trough, or a subtitle) to push aesthetic
    sophistication and storytelling further'
  - 'Library Mastery is solid but not maximal: no use of MUI X''s richer distinctive
    surface (e.g. axis highlight on hover, zoom, or multiple reference bands) beyond
    the single ChartsReferenceLine'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "line-basic · javascript · muix · anyplot.ai" is bold dark ink, top-left, fully visible. X-axis "Date" and rotated Y-axis "Temperature (°C)" labels are dark and clearly legible. Tick labels (Mar 1 ... Apr 25, 0-26) are legible secondary-ink text. Horizontal dashed grid lines are subtle, evenly spaced, non-competing with the data.
      Data: Single line series in brand green (#009E73) with matching area fill (low opacity) and matching markers (green fill, light stroke). A dashed horizontal reference line labeled "Avg 15.7°C" in soft ink sits mid-chart, not overlapping any data point label.
      Legibility verdict: PASS — no light-on-light or unreadable text found.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Title, "Date"/"Temperature (°C)" axis labels, and all tick labels have flipped to light ink and are clearly readable against the dark surface. Grid lines are subtle light dashed lines, visible but unobtrusive. The "Avg 15.7°C" reference label is light-colored and legible.
      Data: Line, markers, and area fill are the identical brand green (#009E73) as the light render — only the chrome flipped, confirming theme-adaptive-but-data-constant behavior as required.
      Legibility verdict: PASS — no dark-on-dark failures; all text and grid lines are clearly visible against the near-black background.
