review:
  strengths:
  - 'Correct theme-adaptive chrome in both renders — dark text/grid on the light #FAF8F1
    surface, light text/grid on the dark #1A1A17 surface, with the brand-green line
    color held identical across both'
  - Deterministic data generation via a seeded LCG (seed 42) producing a realistic
    56-day early-spring warming trend with plausible day-to-day noise
  - 'Idiomatic MUI X usage: time-scale xAxis with a locale-aware valueFormatter, monotoneX
    curve smoothing, horizontal-only grid, and sx overrides for line width and marker
    stroke'
  - Clean layout math (padding/titleBlockHeight/yLabelWidth) sizes the chart to window.ANYPLOT_SIZE
    with a rotated Y-axis label box that never collides with tick labels
  - Legend correctly omitted for the single-series chart per the style guide
  weaknesses:
  - Marker radius is a flat r=4 (CSS px) with no evidence of upsizing beyond the MUI
    X default per the style guide's "2-3x larger than library defaults" sizing rule
    — at 56 points (borderline sparse/medium density) slightly larger markers (e.g.
    r=6-7) would read better at full 3200px resolution and on a 400px mobile crop
  - No visual-hierarchy or data-storytelling device beyond the line itself (e.g. a
    subtle area/gradient fill under the line, or a callout on the final value) — acceptable
    for a basic line plot but leaves Design Excellence at a generic-plus level rather
    than distinctive
  - Library Mastery is solid but conservative — doesn't reach for any MUI X feature
    beyond a single time-scale LineChart (e.g. a reference/average line, area fill,
    or axis highlight) that would demonstrate more of the library's distinctive surface
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Bold dark title "line-basic · javascript · muix · anyplot.ai" top-left, fully readable. Y-axis label "Temperature (°C)" rotated -90° in secondary gray, readable. X-axis label "Date" in dark text, readable. Tick labels (dates Mar 1-Apr 25, temperatures 7-25) in medium-gray, all legible. Horizontal grid lines are subtle dashed strokes that don't compete with the data.
      Data: Single line in brand green (#009E73) with small circular markers (white/pale stroke), monotone-smoothed, tracing a rising trend from ~7°C to ~24.5°C with realistic day-to-day noise.
      Legibility verdict: PASS — no light-on-light issues anywhere.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Title renders in off-white/light text, fully readable against the dark surface. Y-axis and X-axis labels in light secondary gray, readable. Tick labels in light gray, all legible. Grid lines are subtle light-on-dark dashes, same density as the light render.
      Data: Same brand-green line and marker styling as the light render — data colors are identical across themes, only chrome (background/text/grid) flipped as expected.
      Legibility verdict: PASS — no dark-on-dark failures; every title/label/tick is clearly visible against the near-black background.
