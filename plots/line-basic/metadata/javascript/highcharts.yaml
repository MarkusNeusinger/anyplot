review:
  strengths:
  - 'Theme tokens threaded correctly throughout: title/axis colors from t.ink/t.inkSoft,
    grid from t.grid, first series pinned to t.palette[0] (#009E73), background transparent
    so page bg shows through in both themes'
  - Data colors are pixel-identical between light and dark renders — only chrome (background,
    text, grid) flips, exactly as required
  - Deterministic LCG-seeded data generation produces a realistic 48-hour diurnal
    double-sine temperature curve with plausible noise, staying well within the spec's
    10-200 point range
  - 'Title format is exact: ''line-basic · javascript · highcharts · anyplot.ai'',
    comfortably sized within the canvas with no overflow or clipping'
  - 'animation: false set on both chart and plotOptions.series as required, and no
    white background / no default Highcharts palette used'
  weaknesses:
  - 'Purely generic styling: no custom flourishes beyond token application — default
    Highcharts line, no markers, no annotations, no use of Highcharts-distinctive
    features (e.g. plotBands to highlight day/night, zones for gradient emphasis)
    that would elevate design excellence and library mastery'
  - No visual hierarchy or focal point — the two diurnal peaks are visually equal
    weight with nothing drawing the eye to a specific insight (e.g. peak/trough annotation,
    shaded night bands)
  - markers.enabled is false everywhere; with only 49 points a light marker on the
    line would improve individual-value readability per the spec's 'markers optional
    but can enhance visibility' note without adding clutter
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "line-basic · javascript · highcharts · anyplot.ai" in bold dark text at top, clearly readable. X-axis title "Hour of Observation" and Y-axis title "Temperature (°C)" in medium-gray, both legible. Tick labels (0-48 on X, 4-26 on Y) in the same soft gray, all readable. Horizontal grid lines subtle but visible.
      Data: Single green line (#009E73, Imprint brand green) tracing a smooth double-sine diurnal temperature curve across 48 hours, two clear peaks (~24°C) and two troughs (~5.5-6°C). Line width is substantial (3px) and clearly distinguishable from the background. No markers on individual points.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Title in white/light text, clearly visible against the dark background. Axis titles and tick labels in light gray, all legible with no dark-on-dark issues anywhere. Grid lines subtle but visible against the dark surface.
      Data: Same green line (#009E73) as the light render — confirmed pixel-identical hue and shape, only chrome (background/text/grid) has flipped to the dark theme.
      Legibility verdict: PASS
