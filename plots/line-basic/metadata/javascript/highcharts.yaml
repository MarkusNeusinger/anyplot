review:
  strengths:
  - 'Precise theme-adaptive chrome: the brand-green line (#009E73) is identical between
    light and dark renders, backgrounds correctly flip to #FAF8F1/#1A1A17, and all
    title/axis/tick text stays legible in both themes.'
  - Thoughtful data storytelling via amber Peak/Trough callouts that give the chart
    a clear focal point beyond a plain line, without overlapping the data or axis
    text.
  - 'Deterministic, realistic synthetic data: an LCG-seeded 48-hour diurnal temperature
    cycle (5.5-24 degC) with a small drift term, appropriate scale and plausibility
    for outdoor hourly readings.'
  - 'Clean, idiomatic Highcharts wiring: correct mount-node contract, animation disabled
    on chart and series, credits removed, Imprint tokens correctly threaded into colors/backgrounds/chrome.'
  weaknesses:
  - The night/day plotBands shading has no legend, subtitle, or annotation explaining
    what the alternating bands mean - a viewer cannot tell they denote 'night' without
    reading the source; add a brief label/legend entry or drop the shading if it isn't
    essential to the spec's minimal design.
  - tooltip.enabled is set to false on an interactive JS library - this discards Highcharts'
    main advantage (per-point hover detail) for a 49-point hourly series; re-enable
    a themed tooltip (t.ink/t.elevatedBg) so the HTML detail view lets viewers read
    exact hour/temperature values.
  - The added Peak/Trough scatter overlay plus background shading push the chart a
    bit beyond the spec's explicit ask for a 'clean, minimal design with a single
    line' - fine as tasteful enhancement here, but keep 'basic' specs from becoming
    over-decorated in future attempts.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 - not pure white, not dark.
      Chrome: Title "line-basic - javascript - highcharts - anyplot.ai" in dark ink, bold, centered at top. X-axis title "Hour of Observation" and Y-axis title "Temperature (°C)" in soft dark gray. Tick labels (0-48 on X in steps of 6, 4-26 on Y) in soft dark gray. Horizontal gridlines are subtle light gray, visible but not dominant. Alternating vertical plotBands (very faint warm-gray tint) mark overnight windows.
      Data: A single green (#009E73) line with small circular markers traces two diurnal humps (troughs near hour 3/27 at ~5.5-6 degC, peaks near hour 15/39 at ~24 degC). An amber diamond marks the global peak (24°C, hour 15) and trough (5.5°C, hour 3), each with a bold dark data-label callout ("Peak 24°C" / "Trough 5.5°C") placed clear of the line.
      Legibility verdict: PASS - all text is dark-on-light and clearly readable; no overlap between labels, markers, or the line.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 - not pure black, not light.
      Chrome: Same title/axis/tick layout, now in off-white/light-gray ink against the dark surface. Gridlines are a subtle darker-gray, still visible. The overnight plotBands read as slightly darker vertical bands against the near-black background.
      Data: The line and markers use the identical #009E73 green as the light render (confirmed no hue shift). The amber peak/trough markers and their data-labels are unchanged in color and position, now rendered in light text for contrast.
      Legibility verdict: PASS - title, axis titles, tick labels, and the peak/trough callouts are all light-on-dark with no dark-on-dark or light-on-light failures anywhere in the render.
