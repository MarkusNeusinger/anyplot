review:
  strengths:
  - 'Correct plot type and full spec coverage: a single-line hourly temperature series
    with clean markers, descriptive axis labels with units, and subtle gridlines.'
  - Theme-adaptive chrome is implemented correctly and identically in structure between
    renders — backgrounds (#FAF8F1/#1A1A17), text tokens, spines, and gridline opacity
    all flip correctly with zero regressions.
  - 'First (and only) series uses brand green #009E73 exactly, identical between light
    and dark renders, with strong contrast on both surfaces.'
  - Custom hourly tick formatting ("0:00", "4:00", ...) is a nice idiomatic touch
    that fits the time-of-day domain.
  - 'Realistic, plausible, neutral data: a smooth diurnal temperature curve (min ~3°C
    overnight, peak ~23°C midday) with small naturalistic noise — good DQ-01/02/03
    coverage.'
  - Canvas lands exactly on the 3200×1800 landscape target; no clipping or overflow
    anywhere in either render.
  - Reproducible (Random.seed!(42)), KISS script structure, no unused imports, correct
    plot-{theme}.png output naming.
  weaknesses:
  - 'The three ''focal point'' elements the code adds beyond the base line — the midday
    vspan! shading (lines 69, hours 10.5–15.5), the enlarged/stroked peak scatter!
    marker (line 77, markersize=16 vs 10), and the text! ''Peak: X.X°C'' annotation
    (lines 78–85) — render as completely invisible in BOTH plot-light.png and plot-dark.png.
    Pixel-sampled the background inside the 10.5–15.5h band: it is byte-for-byte identical
    to the untinted page background (250,248,241 in light / 26,26,23 in dark) with
    zero blend toward brand green, and no ink-colored text pixels exist anywhere near
    the peak (hour 12, ~23°C) in either render. This isn''t a subtle-alpha issue —
    the shading, the bigger marker, and the label are simply not showing up at all,
    so the code''s intended visual hierarchy/storytelling is not actually delivered
    to the viewer. Root-cause and fix in the repair pass: check whether vspan!/text!/the
    second scatter! are being drawn but then painted over by a later background/axis
    redraw (z-order), whether RGBAf(BRAND.r, BRAND.g, BRAND.b, 0.08) is producing
    a fully-transparent color due to a Colors.jl component-range mismatch, and whether
    text! needs `fig` vs `ax` positioning or an explicit `space=:data` to anchor correctly
    in this CairoMakie version. Either make all three elements actually visible, or
    remove the dead code for a clean, honest single-line implementation — the current
    in-between state pays the code-complexity cost without any of the visual payoff.'
  - Grid lines are enabled on both X and Y axes; the style guide's default guidance
    for line/bar charts is Y-axis-only grid (both-axes grid is reserved for scatter
    plots). Minor — AI-discretion territory, not a hard rule — but consider dropping
    the X gridlines for a cleaner look consistent with the rest of the catalog's line
    charts.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, confirmed byte-exact #FAF8F1 by pixel sampling across the canvas.
      Chrome: Title "line-basic · julia · makie · anyplot.ai" in bold dark ink, centered top, clearly readable. X-axis label "Hour of Day" and Y-axis label "Temperature (°C)" in dark ink, both legible. Tick labels ("0:00".."20:00" on X, "5".."20" on Y) in soft gray, legible. Subtle gridlines on both axes at low opacity, visible but non-competing. Only left/bottom spines shown (top/right removed).
      Data: Single green (#009E73) line with matching circular markers at all 24 hourly points, tracing a smooth diurnal curve from ~3°C overnight up to a ~23°C midday plateau (roughly 11:00–15:00) and back down to ~10°C by 23:00. HOWEVER: the code's intended peak highlight (enlarged, stroked marker) and "Peak: X.X°C" text annotation near the midday plateau are NOT visible anywhere in the render — pixel search around the peak region (hour 11–15, both x/y neighborhoods) found no ink-colored text pixels and no oversized/stroked marker distinct from the other 23 markers. The vspan! shading over hours 10.5–15.5 is also absent — sampled background pixels inside that span are byte-identical to background pixels outside it (no green tint blend).
      Legibility verdict: PASS (all rendered chrome/text is legible) but the intended peak annotation/highlight/shading elements from the code simply do not appear in the output at all — a rendering defect, not a legibility defect.

    Dark render (plot-dark.png):
      Background: Warm near-black, confirmed byte-exact #1A1A17 by pixel sampling.
      Chrome: Same title/axis labels/ticks, now in light ink (#F0EFE8 primary, #B8B7B0 secondary) — all clearly readable against the dark surface, no dark-on-dark failures. Same subtle low-opacity gridlines, same L-shaped spine treatment.
      Data: Identical brand green (#009E73) line and markers, confirmed same hex as the light render — only chrome flipped, as required. Same missing-annotation issue: no peak highlight marker, no "Peak" text, no shaded midday band — confirmed via the same pixel sampling (background pixels inside the 10.5–15.5h band are byte-identical to background pixels elsewhere).
      Legibility verdict: PASS for all elements that do render; same rendering defect as the light theme for the (invisible) peak annotation/shading elements.
