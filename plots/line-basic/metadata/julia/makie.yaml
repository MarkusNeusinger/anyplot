review:
  strengths:
  - 'Canvas is exactly 3200x1800 (landscape target), and both renders are theme-correct:
    #FAF8F1 warm off-white light background, #1A1A17 warm near-black dark background,
    chrome text readable in both.'
  - Data color is identical between themes (#009E73 brand green for the single series),
    only chrome (background, text, grid) flips — correct theme-adaptive pattern.
  - Title exactly matches the required 'line-basic · julia · makie · anyplot.ai' format;
    axis labels are descriptive with units ('Hour of Day', 'Temperature (°C)').
  - 'Minimal chrome done well: top/right spines removed, grid lines subtle (alpha
    0.15) and theme-adaptive, generous whitespace, no overlap or clipping in either
    render.'
  - Realistic diurnal temperature curve (24 hourly points, sinusoidal shape with noise
    and an asymmetric overnight cooldown) with visible markers at every sample and
    reproducible via Random.seed!(42).
  weaknesses:
  - '`using Dates` is imported but never used anywhere in the script (hours is a plain
    Int range, no Date/DateTime calls) — remove the dead import for CQ-03.'
  - 'Library Mastery is generic: the implementation only calls basic lines!/scatter!
    on a single Axis — no distinctive Makie-specific feature (e.g. custom tick formatting
    beyond simple string ticks, annotation of the daily min/max, band/highlight, or
    layered marks) is demonstrated, so LM-02 stays at the low default.'
  - 'No visual hierarchy or storytelling emphasis: the peak (~23°C midday plateau)
    and trough (~3°C at midnight) are not called out (e.g. via annotation, marker
    size/color change, or shaded band), so the chart reads as a competent default
    line rather than one that guides the viewer to a focal point (DE-03).'
  - 'Design polish is solid but not distinctive: only one stylistic decision (spine
    removal + subtle grid) separates this from Makie''s out-of-the-box line plot;
    a slightly heavier stroke on the daily peak segment or a subtler marker treatment
    for the dense midday cluster would lift DE-01/DE-02 further.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Bold dark title "line-basic · julia · makie · anyplot.ai" centered at top, clearly legible dark-ink text. X-axis label "Hour of Day" and Y-axis label "Temperature (°C)" both dark and legible. Tick labels (0:00, 4:00, ... 20:00 on X; 5, 10, 15, 20 on Y) are a softer gray-brown, clearly readable against the light background. Faint horizontal/vertical gridlines visible but subtle. Top and right spines removed; left/bottom spines present in a soft tone.
      Data: Single continuous green (#009E73) line with matching green circular markers at each of the 24 hourly points, tracing a smooth rise from ~3°C at midnight to a ~23°C midday plateau (roughly 11:00-15:00) and back down to ~10°C by 23:00. Line and markers stand out clearly against the warm off-white background.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Title is now bold off-white/light text, clearly legible against the dark background. Axis labels ("Hour of Day", "Temperature (°C)") are light-colored and legible. Tick labels are a lighter soft gray, readable against the dark background — no dark-on-dark issue observed. Gridlines are faint light lines, subtle but visible. Same spine treatment as the light render (top/right hidden).
      Data: Same green (#009E73) line and markers as the light render, at identical positions and values — confirms data colors are identical across themes; only chrome (background/text/grid) flipped. The green line has strong contrast against the near-black background.
      Legibility verdict: PASS
