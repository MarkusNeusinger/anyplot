review:
  strengths:
  - 'Correct Imprint palette usage: single series renders in brand green #009E73,
    identical between light and dark renders'
  - 'Theme-adaptive chrome is fully correct in both renders — backgrounds match #FAF8F1/#1A1A17,
    text and grid tokens flip correctly with no dark-on-dark or light-on-light failures'
  - 'Deliberate grid customization: Y-axis-only major gridlines, no X gridlines, ticks
    removed — goes beyond bare theme_minimal() defaults'
  - 'Realistic, neutral data: a smooth 90-day seasonal sine curve with daily noise
    produces a believable rise-and-fall summer temperature arc with plausible Celsius
    values'
  - Title exactly matches the mandated 'line-basic · r · ggplot2 · anyplot.ai' format,
    axis labels are descriptive with units on the Y-axis
  - 'Clean KISS code structure: imports → theme tokens → data → plot → save, seeded
    with set.seed(42), uses linewidth= (not deprecated size=) and ragg::agg_png per
    the library guide'
  weaknesses:
  - 'Design Excellence is at default/near-default across the board: no visual hierarchy
    or emphasis highlights the seasonal peak (~day 50) — the story of the chart (temperature
    rising then falling) is left entirely for the viewer to notice from line shape
    alone. Consider a subtle peak annotation, a light alpha-filled area under the
    curve, or a soft highlight band around the peak days to create a focal point.'
  - geom_line() at linewidth=1.1 is a bit thin against the noisy day-to-day zigzag
    pattern in the data; bumping to ~1.4-1.6 would read more prominently as the single
    focal series without changing anything else.
  - Library Mastery is generic ggplot2 usage (geom_line + labs + theme only) — no
    feature distinctive to ggplot2 is demonstrated. Consider adding something idiomatic-but-distinctive,
    e.g. scale_x_continuous(expand = expansion(mult = c(0.01, 0.02))) for tighter
    axis framing, or a light geom_smooth(se = FALSE, linetype = 'dashed', color =
    INK_SOFT) trend overlay to show a ggplot2-native statistical layer without adding
    fake interactivity.
  - Typography/DE-01 is competent but plain — no font-family customization or refined
    weight hierarchy beyond the default theme_minimal() text. A custom font family
    or slightly bolder plot.title weight would lift aesthetic sophistication.
