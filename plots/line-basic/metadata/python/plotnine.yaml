review:
  strengths:
  - 'One continuous #009E73 line through 48 monthly points in date order with small
    markers, no smoothing — the line still reads as a line (C1)'
  - 'Realistic data story: monthly airport passengers with a summer peak in July/August,
    year-on-year growth and seeded noise, so the series wiggles like real data (C3)'
  - Y axis spans the data (about 340–720k) without being forced to zero, keeping the
    seasonal swing readable (C5)
  - 'Idiomatic plotnine date handling: scale_x_datetime(date_breaks="6 months", date_labels="%b
    %Y") gives clean half-year ticks from a real datetime column'
  - Theme tokens thread through every chrome element; both renders are theme-correct,
    with the y grid weighted heavier (alpha 0.15) than the x grid (alpha 0.08) and
    minor grid removed
  - Canvas is exactly 3200×1800 via figure_size=(8, 4.5) and dpi=400; column constants
    feed aes() directly so axis titles come from the column names
  weaknesses:
  - 'Suggestion: the airport is called ''regional'' while it handles 4–8 million passengers
    a year; ''a mid-size airport'' would match the scale.'
  - 'Suggestion: markers at size 2.5 on 48 points are slightly heavy next to the 1.2
    line; size 2 would let the line dominate a little more.'
