review:
  strengths:
  - 'Fully theme-adaptive chrome through sns.set_theme rc tokens: warm #FAF8F1 / #1A1A17
    surfaces, INK titles and labels, INK_SOFT ticks and spines; both renders read
    cleanly with no dark-on-dark text'
  - Exact 3200x1800 canvas from figsize=(8, 4.5), dpi=400 without bbox_inches='tight',
    as the library prompt requires
  - Realistic 120-day website-visitor series (growth trend, weekly weekend dips, noise)
    that wiggles like real data, with a y axis spanning 9-24k rather than forced to
    zero
  - Month-level date ticks via mdates.MonthLocator + DateFormatter('%b %Y') keep the
    datetime axis uncluttered over 120 daily points
  - 'Small markers (markersize=3.5) on a 2 px line: every observation is visible and
    the line still reads as a line'
  - Tidy data=df with column constants; seaborn reads the DataFrame directly and the
    axis titles come from the column names
  weaknesses:
  - 'Suggestion: seaborn''s default white marker edges form bright rings on the dark
    render; markeredgecolor=PAGE_BG would let the markers sit quieter on the line
    in both themes.'
  - 'Suggestion: ax.set_xlabel(DATE) / ax.set_ylabel(VISITORS) repeat what seaborn
    already sets from the column names; the font size could be applied via rc instead,
    dropping the two calls.'
  image_description: |-
