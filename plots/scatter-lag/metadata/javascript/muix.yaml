review:
  strengths:
  - Both axes share one padded range computed from the data (axisMin/axisMax) with
    a matching tick step, so the y = x reference line runs exactly along the plot
    diagonal, dashed in inkSoft at 0.6 opacity, lighter than the points
  - Lag order is a configurable constant (LAG) and is stated in the y-axis label,
    the subtitle and the r annotation
  - Time-index coloring uses the Imprint sequential stops through MUI X's native zAxis
    continuous colorMap, with a ContinuousColorLegend titled 'Hour of record'
  - The r annotation picks the empty corner from the sign of r and carries a page-colored
    halo (paintOrder stroke), so it stays clear of the points in both themes
  - Diagonal and annotation are drawn as a custom SVG layer inside ChartsSurface with
    useXScale/useYScale/useDrawingArea, so they share the chart's scales exactly
  - Theme tokens threaded through every text and chrome element; both renders are
    fully legible, and the HTML keeps MUI X's native hover tooltips
  weaknesses:
  - 'DQ-03 (both): the scenario is hourly station temperature, but the AR(1) process
    with sigma about 5 °C and rho 0.82 produces one-hour jumps of up to about 10 °C
    (e.g. the pair at 30.0 → 20.6 °C, and 22.5 → 29.1 °C), which real hourly temperature
    does not show → one-hour changes of a few °C at most, i.e. a higher rho (about
    0.95–0.98) or a smaller shock scale, or a domain where such jumps are plausible
    (e.g. daily returns). Likely cause: rho = 0.82 with the 5 °C scale in the data
    block.'
  - 'Suggestion: the color bar shows only its end ticks 0 and 198; a few intermediate
    hour ticks would make the time mapping easier to read.'
  - 'Suggestion: the axis titles sit about 40–60 px away from their tick labels; a
    slightly smaller x height / y width band would tie them closer to the axes.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole canvas, no white plot box.
      Chrome: bold title "scatter-lag · javascript · muix · anyplot.ai" centered at top with a grey subtitle "Lag k = 1 · 199 pairs from 200 observations · dashed line: y = x"; x-axis "Temperature (°C) at t", y-axis "Temperature (°C) at t + 1", both ranged ~7.6–33 with ticks 8–32 every 2; subtle grey horizontal and vertical grid; "r(lag 1) = 0.747" in bold dark ink at top-left; vertical color bar at right titled "Hour of record" with ticks 0 and 198. All text dark on light and readable.
      Data: 199 unconnected circles (~6 px, 0.85 opacity) colored by hour on the Imprint sequential ramp from brand green #009E73 (hour 0) to blue (hour 198); elongated cloud along a grey dashed y = x diagonal that runs corner to corner; a few outliers (9.2, 15.8), (12.9, 9.2), (30.0, 20.6).
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, subtitle, axis titles, tick labels, r annotation and color-bar title/ticks all in light ink and clearly readable; grid lines subtle grey but visible; dashed diagonal light grey. No dark-on-dark elements.
      Data: point positions and colors identical to the light render (same green-to-blue sequential mapping); only chrome flipped.
      Legibility verdict: PASS
