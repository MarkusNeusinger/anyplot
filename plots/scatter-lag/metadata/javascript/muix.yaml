review:
  strengths:
  - Both axes share one padded range and the same tick step, so the dashed y = x line
    runs exactly along the plot diagonal, drawn lighter than the points
  - Time index mapped through MUI X's zAxis continuous colorMap on the Imprint sequential
    ramp, with a native ContinuousColorLegend titled 'Hour of record'
  - Custom SVG layer (diagonal and r annotation) drawn with useXScale/useYScale/useDrawingArea;
    the annotation is placed in the corner the correlation sign leaves empty, with
    a page-colored halo
  - Lag order is a single LAG constant that drives the pairing, axis titles, subtitle
    and annotation
  - Theme tokens threaded through every chrome element; both renders fully legible
  weaknesses:
  - 'Suggestion: a few intermediate ticks on the color bar (e.g. every 50 hours) would
    make the time index easier to read off individual points.'
  - 'Suggestion: the color bar could be taller to match the plot height, giving the
    time gradient more resolution.'
