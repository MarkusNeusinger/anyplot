review:
  strengths:
  - Classic horizontal stem-and-leaf timeline with alternating above/below label tiers
    that avoids crowding across 13 events
  - geom_hline baseline plus geom_segment stems plus geom_point markers plus geom_text
    labels compose cleanly via coord_cartesian(clip = "off") so labels can extend
    past the panel without being clipped
  - 'Imprint palette correctly applied: Team gets brand green #009E73 as the first
    series, Product/Funding/Expansion follow the canonical order, identical across
    both themes'
  - Theme tokens (PAGE_BG/INK/INK_SOFT) correctly thread through plot/panel background,
    title, axis text, and legend so both light and dark renders are fully legible
    with no dark-on-dark or light-on-light failures
  - Realistic, neutral startup-milestone dataset (funding rounds, product launches,
    hiring, expansion) spanning 2018-2024, well within the 5-50 event guidance
  - Title follows the mandated '{Descriptive Title} · {spec-id} · {lang} · {lib} ·
    anyplot.ai' format and canvas is exactly 3200×1800 (8×4.5in @ 400dpi)
  weaknesses:
  - The panel.grid.major.x year gridlines (drawn in full INK color) cut straight through
    two event labels — 'Employee' in the '10th Employee / Apr 2020' text (near the
    2020 line) and 'sia-Pacific...Feb 2023' text (near the 2023 line) — in both light
    and dark renders. Either offset labels whose date falls within ~2 months of a
    year boundary further from the gridline, or switch the year gridline color to
    INK_SOFT / thinner alpha-equivalent so it reads as background structure rather
    than crossing foreground text.
  - panel.grid.major.x uses full-strength INK rather than the softer INK_SOFT token
    typical for grid chrome elsewhere in the style guide, making the year lines slightly
    more prominent than 'subtle' — a minor visual-refinement nit tied to the overlap
    issue above.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1), consistent across the full canvas — matches spec.
      Chrome: Title "Company Milestones · timeline-basic · r · ggplot2 · anyplot.ai" in dark ink at top-left, clearly readable. X-axis "Year" title and 2018-2024 tick labels in soft ink below the baseline, all legible. Bottom legend "Category" with 4 swatches (Team/Product/Funding/Expansion) in dark/soft ink, fully readable. Thin vertical year gridlines and a horizontal baseline line in dark ink.
      Data: 13 milestone events plotted as colored dots on the horizontal baseline, with colored stems running up (odd-indexed events) or down (even-indexed events) to a three-tier label position, and each stem terminating in a two-line black-text label (event name + "Mon YYYY"). First category (Team) uses brand green #009E73; Product uses lavender #C475FD; Funding uses blue #4467A3; Expansion uses ochre #BD8233.
      Legibility verdict: PASS overall, with one legibility nit — the vertical year gridlines pass directly through the label text for "10th Employee / Apr 2020" (near the 2020 line) and "Asia-Pacific Expansion / Feb 2023" (near the 2023 line). Text remains readable (gridline is thin) but visually crosses letters in both cases.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17), consistent across the full canvas — matches spec.
      Chrome: Title and all axis/legend text render in light ink (#F0EFE8) / soft light ink (#B8B7B0), clearly readable against the dark background — no dark-on-dark failures found. Gridlines now render as a soft light line against the dark background, same crossing issue as light render (through "10th Employee" and "Asia-Pacific Expansion" labels).
      Data: Identical marker/stem colors to the light render (Team green #009E73, Product lavender #C475FD, Funding blue #4467A3, Expansion ochre #BD8233) — confirms only chrome flips between themes, not data colors.
      Legibility verdict: PASS overall, same minor gridline/text-crossing nit as the light render; no dark-on-dark or unreadable elements.
