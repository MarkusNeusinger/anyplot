review:
  strengths:
  - Correct timeline chart type using an idiomatic ggplot2 lollipop pattern (geom_hline
    baseline + geom_segment stems + geom_point anchors + geom_text labels)
  - Alternating above/below label placement with a tiered vertical offset (via dplyr
    row_number()/tier) cleanly prevents label overlap across 13 events
  - 'Palette compliant: Team (first category) uses brand green #009E73, categorical
    order matches the canonical Imprint sequence, and data colors are identical between
    light and dark renders'
  - 'Realistic, well-scaled dataset: 13 plausible startup milestones across 4 categories
    (Team, Product, Funding, Expansion) spanning 2018-2024'
  - 'Clean minimal chrome: y-axis correctly hidden (no meaningful continuous value
    for a timeline), only subtle vertical year gridlines, generous margins, nothing
    clipped at the canvas edge'
  - Title format matches the mandated pattern exactly with a sensible descriptive
    prefix ("Company Milestones · timeline-basic · r · ggplot2 · anyplot.ai")
  weaknesses:
  - 'Light-mode text-color accessibility: geom_text labels use aes(color = category),
    so label text inherits the category''s data color directly against the #FAF8F1
    background. Contrast ratios are well under WCAG AA''s 4.5:1 for normal text for
    3 of 4 categories: Product/lavender #C475FD ~2.7:1 (worst offender), Team/green
    #009E73 ~3.2:1, Expansion/ochre #BD8233 ~3.1:1. Only Funding/blue #4467A3 (~5.3:1)
    passes comfortably. Fix: keep geom_text() labels in a neutral ink color (INK or
    INK_SOFT) and reserve the category color for the geom_segment stem + geom_point
    marker only — that keeps the color-coding on the data elements while making every
    label legible.'
  - 'LM-02: the tiered offset logic is functional but not distinctive to ggplot2 specifically
    — a ggplot2-native touch (e.g. ggrepel for automatic label repulsion, or facet-based
    period grouping) would showcase more library mastery.'
  - 'Design excellence is solid but not exceptional: aside from the Imprint palette
    and minimal theme, there is no additional typographic or compositional flourish
    that would elevate it above a competent baseline.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — correct, not pure white.
      Chrome: Title "Company Milestones · timeline-basic · r · ggplot2 · anyplot.ai" in dark ink at top-left, clearly legible. "Year" x-axis title and 2018-2024 tick labels in soft ink, clearly legible. Bottom legend "Category" with Team/Product/Funding/Expansion swatches, clearly legible. Subtle vertical gridlines per year, visible but not dominant. No y-axis (hidden, appropriate for a timeline with no continuous y-quantity).
      Data: 13 lollipop stems (geom_segment) rising/falling from a central horizontal baseline, each capped with a colored point marker and a colored two-line text label (event + month/year). First category (Team) is #009E73 brand green as required; Product is lavender #C475FD; Funding is blue #4467A3; Expansion is ochre #BD8233 — matches the canonical Imprint order.
      Legibility verdict: FAIL for full-contrast standards — chrome (title/axis/legend) is fully readable, but the category-colored event labels have low contrast against the cream background for 3 of 4 categories (lavender ~2.7:1, green ~3.2:1, ochre ~3.1:1, all below the WCAG AA 4.5:1 normal-text threshold); only the blue (Funding) labels pass comfortably (~5.3:1). Text is still visually distinguishable (not literally invisible/light-on-light), but this is a genuine accessibility shortfall worth flagging and repairing.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — correct, not pure black.
      Chrome: Title, "Year" axis title/tick labels, and legend all render in light ink, clearly legible against the dark background. Gridlines subtle but visible.
      Data: Same 13 lollipop stems/points/labels; data colors are pixel-identical to the light render (#009E73, #C475FD, #4467A3, #BD8233) — only the chrome (background/ink) flipped, as required.
      Legibility verdict: PASS — recomputing contrast against #1A1A17, all four category colors clear ~5:1-9:1 against near-black (e.g. lavender ~6.1:1), so no dark-on-dark issue. The light-mode contrast problem does not carry over to dark mode because the near-black background is far darker than any of the mid-tone category colors.
