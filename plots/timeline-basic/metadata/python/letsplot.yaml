review:
  strengths:
  - Month-start tick positions are derived from the data's own dates, so every marker
    reads at its true date on the time axis
  - Alternating above/below labels on category-colored connectors keep all ten labels
    clear of each other in both themes
  - Theme tokens thread through every chrome element; the Imprint category colors
    are identical in light and dark
  - Native lets-plot HTML export keeps hover tooltips on markers in the interactive
    view
  weaknesses:
  - 'VQ-05 (both): the y range of ±2.2 around labels at ±1.5 leaves empty bands of
    about 15 % of the plot height above and below the labels, so the month ticks sit
    about 500 px below the timeline they date → limits close to the label rows (about
    ±1.8), pulling the date ticks nearer the axis. Likely cause: scale_y_continuous(limits=[-2.2,
    2.2]).'
  - 'Suggestion: scale_x_datetime with format=''%b'' would date the axis natively
    instead of day offsets with hand-built breaks.'
  - 'Suggestion: a lets-plot layer_tooltips() listing event, date and phase would
    enrich the HTML view.'
