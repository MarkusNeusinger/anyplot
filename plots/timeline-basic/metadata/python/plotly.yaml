review:
  strengths:
  - Labels alternate above and below a drawn timeline line, tied to markers by connectors
  - Theme tokens threaded through all chrome; both renders readable
  - Hover template with customdata shows the event name and full date in the HTML
  weaknesses:
  - 'SC-03, SC-02, DQ-01 (both): the nine markers are placed at integer positions
    0-8, evenly spaced, so a 4-month gap looks like a 14-month gap and the clusters
    and gaps of the dates vanish (C1) → plot each marker at its datetime on a date
    x-axis. Likely cause: df[''x_pos''] = range(len(df)) used as x.'
  - 'SC-02, SC-04 (both): six categories share four colours - Market and Growth are
    both #009E73, Recovery and Correction both #C475FD - so the legend cannot tell
    them apart (C4) → one Imprint position per category in order. Likely cause: the
    colors dict reusing IMPRINT[0] and IMPRINT[1].'
  - 'SC-04 (both): the title reads ''timeline-basic · plotly · anyplot.ai'' without
    the language segment → ''timeline-basic · python · plotly · anyplot.ai''. Likely
    cause: the title text.'
  - 'VQ-05 (both): canvas is 4800x2700 instead of 3200x1800 (+1600 x +900 px), and
    large empty bands sit above and below the labels → 3200x1800. Likely cause: write_image(width=1600,
    height=900, scale=3).'
  - 'VQ-02 (both): the dotted connectors run through every date label (''Dec 2018'',
    ''Jul 2019'', ...) → end the connector short of the label or place the date with
    the event name. Likely cause: date annotations at y=±0.15 on connectors spanning
    0 to ±0.4.'
  - 'DQ-02 (both): real market events carry dates and names that do not match them:
    ''Bank Crisis Resolved'' sits on 2023-03-10, the day the bank failure began; ''AI
    Boom Peaks'' (Jan 2024) and ''Bull Run Begins'' (Jul 2019) are invented milestones;
    and the six categories Market / Growth / Expansion / Recovery overlap in meaning
    → a self-contained milestone set (for example a fictional product roadmap with
    Planning / Build / Launch phases), or real events at their correct dates with
    distinct categories. Likely cause: the DATE / EVENT / CATEGORY lists in the data
    dict.'
  - 'CQ-04 (code): tickvals [0, 2, 4, 6, 8] with hand-typed ticktext duplicate the
    dates, and the palette comments name Okabe-Ito colours (vermillion, reddish purple)
    that the hex values are not → a datetime x-axis derives the ticks; fix the comments.
    Likely cause: the index-based x axis.'
  - 'LM-01 (code): integer x positions with typed tick labels bypass plotly''s native
    date axis → pass the datetimes as x and format with tickformat. Likely cause:
    x_pos column.'
  - 'Suggestion: a smaller canvas-filling layout would bring the labels closer to
    the line.'
