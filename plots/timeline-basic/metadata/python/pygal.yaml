review:
  strengths:
  - Markers sit at their true dates on a pygal DateLine axis, so the uneven gaps (Apr
    25 to Jun 15 versus Sep 10 to Oct 20) read as real elapsed time; no marker is
    moved to make room for labels
  - Labels alternate above and below the axis and cycle two connector lengths, so
    Project Kickoff/Architecture Design and Alpha Release/User Acceptance clear each
    other without displacing any marker
  - 'Two-tier label typography: event name in INK, date in INK_SOFT directly beneath,
    giving each event a clear name-then-date hierarchy'
  - Theme tokens threaded through the pygal Style (background, plot_background, foreground,
    value_colors), so both renders are readable with identical Imprint phase colors
  - 'Idiomatic pygal: DateLine with x_value_formatter for month ticks, per-point print_labels
    for event text, allow_interruptions with None separators to draw all connectors
    as one series, and library-native hover tooltips in the HTML output'
  - The Data block ends in a tidy df with role-named column constants; everything
    below reads only df, so the chart adapts to a user's milestone table
  weaknesses:
  - 'VQ-03 (both): the legend swatches render at reduced opacity and do not match
    the full-opacity markers they explain (Planning swatch pale green on light, dull
    dark green on dark, versus the solid #009E73 dots) → draw the legend rects at
    full opacity like the dots. Likely cause: pygal''s default Style opacity (.7)
    applied to the legend rects; set opacity=''1'' in the Style or add ''.legend rect{fill-opacity:1}''
    to the inline CSS.'
  - 'Suggestion: add a small gap between each legend swatch and its label; the text
    currently starts flush against the square.'
  - 'Suggestion: a little more vertical air between the ''Milestone date'' axis title
    and the legend row would separate the two.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across canvas and plot area.
      Chrome: title "Software Project Milestones · timeline-basic · python · pygal · anyplot.ai" in dark ink, about 83% of the width, fully visible; month ticks "Jan 2024" ... "Nov 2024" in dark text along the bottom; x-axis title "Milestone date"; legend row at the bottom (Planning, Design, Development, Testing, Deployment). No y-axis, no grid, no frame line. All text readable.
      Data: a thin grey horizontal time axis with 8 circular markers at their dates; thin grey connectors alternate up and down in two lengths; event names (dark) with dates (soft grey) at each connector end. Colors: Planning #009E73 (2 events), Design #C475FD, Development #4467A3 (2), Testing #BD8233 (2), Deployment #AE3030 — Imprint positions 1–5 in order. Legend swatches appear paler than the markers.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, tick labels, axis title, and legend text in light ink (#F0EFE8); date sub-labels in light grey. No dark-on-dark text anywhere; connectors and axis line in a muted grey, visible.
      Data: marker colors identical to the light render (green, lavender, blue, ochre, red); only chrome flips. Legend swatches render darker/duller than the markers. Brand green clearly visible.
      Legibility verdict: PASS
