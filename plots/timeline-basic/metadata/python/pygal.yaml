      Chrome: title, event names, month ticks, axis title and legend text in light ink; dates in lighter-soft gray; stems and axis line in muted gray, all visible. No dark-on-dark text.
      Data: marker and legend colors identical to the light render; brand green clearly visible.
      Legibility verdict: PASS
