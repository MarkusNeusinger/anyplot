review:
  strengths:
  - Event markers sit at their true dates on a single horizontal DateLine axis, so
    the uneven gaps (e.g. the long Apr–Jun stretch) read as real time between milestones
  - Labels alternate above and below the axis with two connector lengths, so even
    the close Jan 15 / Feb 10 pair never collides
  - 'Two-tier label typography: event name in INK, its short date in INK_SOFT directly
    beneath/above, giving each stem a clear hierarchy'
  - 'Phases colored in canonical Imprint order (Planning #009E73 first) with a bottom
    legend whose solid swatches match the markers in both themes'
  - Theme tokens threaded through pygal's Style, so all chrome flips cleanly while
    data colors stay identical
  - 'Native pygal interactivity: per-point labels feed the HTML tooltips, and allow_interruptions
    with None separators draws all connectors as one series'
  weaknesses:
  - 'VQ-01 (both): the event names, the chart''s primary content, render at 38 px,
    smaller than the 44 px month ticks, and shrink to about 5 px in the 400 px thumbnail
    → at least 44 px (+6 px). Likely cause: value_label_font_size=38.'
  - 'VQ-05 (both): the short x-axis title ''Milestone date'' renders at about 57 px,
    noticeably larger than the 44 px tick labels, and the bottom legend sits only
    about 20 px below it, so axis title and legend crowd the bottom edge → axis title
    at about 44–48 px (−10 px) with more clearance above the legend. Likely cause:
    pygal draws x_title at title_font_size (computed 57), and margin=60 leaves no
    gap between x_title and the bottom legend.'
  - 'Suggestion: center the five legend entries under the axis instead of spreading
    them in fixed left-aligned columns across the full width.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, full canvas 3200x1800.
      Chrome: title "Software Project Milestones · timeline-basic · python · pygal · anyplot.ai" in dark ink, ~83% of width, fully visible; month ticks Jan 2024–Nov 2024 along the bottom; x-axis title "Milestone date"; no y labels, no grid. All text dark on light and readable.
      Data: thin gray horizontal axis line from Jan 15 to Oct 20 with 8 circular markers at their dates; gray stems alternate up/down with two lengths; each stem ends in the event name (ink) plus short date (soft ink). Markers colored by phase: Planning #009E73 (2), Design #C475FD, Development #4467A3 (2), Testing #BD8233 (2), Deployment #AE3030; legend at the bottom with matching solid swatches.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
