      Data: horizontal gray time axis at mid-height; ten markers on colored connectors alternating above/below: Planning #009E73 (first), Design #C475FD, Development #4467A3, Testing #BD8233, Release #AE3030; event labels above/below their markers, no collisions. Legend glyphs are very small dots.
