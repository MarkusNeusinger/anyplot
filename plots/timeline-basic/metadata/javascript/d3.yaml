    no tiered stem lengths). I verified this by executing the current d3.js against
    a stubbed d3/DOM harness: it correctly produces 14 event groups with the expected
    alternating sides, categories, and colors — the discrepancy is in the render/screenshot
    step, not the code.'
  - Because of the above, VQ-01/02/03/05 and DE-01/03 could not be visually verified
