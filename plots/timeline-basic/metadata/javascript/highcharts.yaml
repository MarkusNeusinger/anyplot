review:
  strengths:
  - 'Correct Imprint palette: Planning (first series) is #009E73, colors identical
    between light/dark renders, and each category also gets a distinct marker shape
    (circle/diamond/square) — a CVD-friendly redundant encoding beyond color alone'
  - Quarter plotBands (Q1-Q4) give the timeline a Highcharts-distinctive backdrop,
    add chronological context, and fill vertical whitespace instead of leaving the
    band empty
  - Clear focal point via emphasized Beta Release / General Availability milestones
    (larger ink-outlined markers, bolder labels) creates real data storytelling instead
    of 14 uniform dots
  - Alternating above/below label placement (per the spec's explicit guidance) keeps
    all 14 event labels legible with zero overlap across the full year
  - Clean, deterministic, KISS-structured code; animation:false set correctly in both
    chart and plotOptions.series; no fake interactivity
  weaknesses:
  - Development category color (light violet) has noticeably lower contrast against
    both backgrounds than the Planning green and Release blue — still legible, but
    a slightly more saturated tone would give the three categories more even visual
    weight
  - Design is polished but stops just short of exceptional — the Q1-Q4 band labels
    are quite small/subtle and typographic hierarchy between title/subtitle/labels
    could be pushed a bit further
  - Feature coverage is solid but minimal for the timeline type — no secondary encoding
    beyond category+emphasis (e.g. nothing conveys relative importance beyond the
    two hand-picked milestones)
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "timeline-basic · javascript · highcharts · anyplot.ai" in bold dark ink at top center, subtitle "Software Product Roadmap 2024" in muted grey below it. X-axis shows Jan-Dec month ticks along a thin horizontal baseline. Four alternating quarter plotBands (Q1-Q4, very light grey tint) span the full height with small "Q1"/"Q2"/"Q3"/"Q4" labels at top-left of each band. A bottom legend shows Planning (green circle), Development (violet diamond), Release (blue square). All chrome text is clearly legible against the light background.
      Data: 14 events plotted as colored markers connected to the central axis line by thin grey stems, alternating above/below the axis. Colors: green (Planning), light violet (Development), blue (Release) — first series (Planning) is the brand green #009E73. Beta Release and General Availability are visually emphasized with larger, ink-outlined diamond/square markers and bold labels, creating a clear focal point. No overlapping text, no clipped labels at any edge.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Same title and subtitle now rendered in white/light-grey ink, clearly visible against the dark background. Quarter plotBands use a subtle lighter-grey tint distinguishable from the base background. Axis ticks, quarter labels, and legend text are all light-colored and easily readable — no dark-on-dark failures observed anywhere (title, tick labels, category labels, and quarter labels all confirmed legible).
      Data: Same marker colors and positions as the light render — green, violet, and blue data colors are pixel-identical to the light version, confirming only chrome (background/text/grid) flipped as required. Emphasized Beta Release / General Availability markers retain their ink-outlined styling (now a light outline against dark). No clipping or overlap issues.
      Legibility verdict: PASS
