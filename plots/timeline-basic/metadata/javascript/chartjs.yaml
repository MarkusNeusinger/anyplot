review:
  strengths:
  - Custom Chart.js plugin (beforeDatasetsDraw/afterDatasetsDraw) builds a genuine
    timeline spine and alternating stems from scratch — a distinctive, idiomatic use
    of the library's plugin API rather than a generic scatter chart.
  - 'Correct Imprint palette usage: the first category (API) renders in brand green
    #009E73, Platform and Mobile follow canonical palette positions 2 and 3, identical
    across both themes.'
  - Theme-adaptive chrome is fully correct in both renders — legible ink/inkSoft text,
    subtle grid removed, warm off-white/near-black backgrounds match the style guide.
  - Alternating above/below label placement (explicitly recommended in the spec notes)
    prevents any label collisions across all 12 events.
  - Clean, deterministic, in-memory roadmap dataset with realistic milestone names
    and dates; mandated title format followed exactly.
  weaknesses:
  - Point markers (pointRadius 9) are on the smaller side for only 12 sparse events
    — per the data-density heuristic, sparse data should have more prominent markers;
    consider bumping to ~11-12px radius for stronger visual anchors.
  - Title occupies only ~30% of the plot width at fontsize 22 — not a violation, but
    a slightly larger, more dominant title would better anchor the composition.
  - No visual emphasis differentiates any single milestone (e.g. a GA/launch highlight)
    — all 12 events read with equal visual weight, so the chart shows chronology without
    added storytelling emphasis.
  - Stems/spine use a flat neutral grey in both themes; tying stem color to the event's
    category color would reinforce the color-coding and add polish.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 spec.
      Chrome: Title "timeline-basic · javascript · chartjs · anyplot.ai" in dark ink, bold, centered near top. A horizontal grey spine runs across the chart with thin vertical stems connecting to 12 event markers alternating above and below the spine. Each marker has a bold event name and a lighter month/year date label. A secondary date axis ("Dec 2023" ... "Aug 2025") with an axis title "Date" runs along the bottom, and a bottom legend shows three category swatches (API, Platform, Mobile). All text renders in dark ink/soft-ink tones.
      Data: First category (API) markers are brand green #009E73; Platform markers are lavender/purple; Mobile markers are blue — consistent with the Imprint categorical palette in canonical order.
      Legibility verdict: PASS — all titles, event names, date labels, axis ticks, and legend text are clearly readable against the light background; no overlap or clipping observed.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 spec.
      Chrome: Identical layout and structure to the light render — title, spine, stems, event/date labels, bottom date axis, and legend — but all chrome text (title, event names, date sub-labels, axis ticks, axis title, legend labels) has flipped to light/off-white tones for contrast against the dark background.
      Data: Marker colors are identical to the light render (green #009E73, lavender, blue) — only chrome flipped, as required.
      Legibility verdict: PASS — no dark-on-dark text found; every label, tick, and legend entry is clearly legible against the near-black background.
