review:
  strengths:
  - 'Correct Imprint palette: Planning (first category) renders as brand green #009E73,
    and all four category colors are pixel-identical between light and dark renders
    — only chrome flips.'
  - 'Both themes are cleanly readable: warm off-white (#FAF8F1) and near-black (#1A1A17)
    backgrounds, dark/light text with strong contrast, and a subtle inkSoft baseline/stems
    that don''t compete with the data.'
  - Alternating above/below label placement (per the spec's explicit guidance) cleanly
    avoids overlap across all 10 events without needing zoom or decimation.
  - Deterministic, dependency-free in-memory data; idiomatic ECharts composition combining
    a silent line series (baseline + stems) with per-category scatter series and rich-text
    label formatting for two-line name+date labels.
  - Title exactly matches the mandated '{Descriptive Title} · {spec-id} · {language}
    · {library} · anyplot.ai' format; legend swatches faithfully mirror marker colors.
  weaknesses:
  - 'No tooltip component is configured anywhere in the option — for an interactive
    library this misses a chance to surface hover detail (name + date) in the HTML
    output beyond the static on-canvas labels; add `tooltip: { trigger: ''item'',
    backgroundColor: t.elevatedBg, textStyle: { color: t.ink } }` styled from theme
    tokens.'
  - Title spans only ~40-50% of canvas width even though it is longer (~75 chars incl.
    descriptive prefix) than the 67-char baseline the auto-scale formula was tuned
    against — the font could be scaled up slightly for a stronger presence without
    approaching overflow.
  - Visual design is clean but conservative — there is no single focal point beyond
    the chronological sequence (e.g. no subtle emphasis on the most recent/upcoming
    milestone); a small size or opacity differentiation could add a clearer storytelling
    hierarchy.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "Product Launch Roadmap · timeline-basic · javascript · echarts · anyplot.ai" in dark ink at top, centered; legend below it with four colored swatches (Planning/Development/Testing/Launch) in dark ink text; x-axis tick labels (Jan 2025 … Jan 2026) in a softer gray-brown; all text is clearly legible against the light background.
      Data: A horizontal baseline drawn in soft dark gray runs across the middle; ten vertical stems alternate above and below the baseline, each ending in a colored circular marker (green for Planning, violet for Development, steel-blue for Testing, amber for Launch) matching the legend exactly; each marker has a bold event-name label and a lighter date label placed above (for upward stems) or below (for downward stems) its marker, with no overlap between any two labels.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Title and legend text render in light gray/white, clearly legible against the dark surface; x-axis tick labels are a dimmer light-gray, still readable; no dark-on-dark text anywhere.
      Data: Same baseline/stem layout as the light render, with all four category marker colors (green, violet, steel-blue, amber) visually identical to the light render — confirming only chrome (background, text) flips between themes, not data colors.
      Legibility verdict: PASS
