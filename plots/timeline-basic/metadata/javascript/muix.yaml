review:
  strengths:
  - 'Correct Imprint palette: first category (Launch) uses brand green #009E73, remaining
    categories follow canonical palette order, and data colors are pixel-identical
    between the light and dark renders.'
  - Idiomatic, library-distinctive MUI X composition — uses the useXScale/useYScale
    hooks to draw custom scale-aligned event labels and stems, a documented MUI X
    pattern that isn't trivially replicated in other libraries.
  - Alternating above/below label placement (i % 2) prevents any overlap across all
    8 events, with the first/last labels anchored inward (textAnchor start/end) so
    nothing clips at the canvas edges.
  - Realistic, neutral, well-chosen example dataset (Perseverance rover mission milestones)
    spanning 4 categories in chronological order, matching the spec's 'historical
    events' application.
  - 'Clean, deterministic code: no unused imports, hardcoded dates (no RNG needed),
    skipAnimation set, correct component export contract.'
  weaknesses:
  - 'Significant unbalanced vertical whitespace: roughly 38% of canvas height is blank
    between the title and the top row of event labels, and roughly 31% is blank between
    the bottom row of labels and the x-axis — the timeline band reads as a thin strip
    in a very tall canvas. Tighten TITLE_H/margins or bring the spine closer to the
    title/axis so the chart occupies a larger, better-balanced share of the 3200x1800
    canvas.'
  - Data storytelling is limited to category color-coding; there's no single emphasized
    focal point or callout drawing the eye to the mission's key milestone (e.g. landing
    or first sample) — a subtle size/weight emphasis on one event would strengthen
    the narrative.
  - Event marker size (markerSize=16) is adequate but not maximally prominent for
    a sparse 8-point dataset — could be nudged up slightly for stronger visual presence.
  - 'Minor factual-accuracy risk: double check the ''10th Sample Cached'' (Jan 27,
    2022) milestone date against the public Perseverance mission record before relying
    on it as precisely accurate.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Bold dark title centered at top ("Perseverance Rover Mission · timeline-basic · javascript · muix · anyplot.ai"), clearly legible. A thin horizontal spine runs across the middle with subtle, low-opacity axis line and month/year tick labels ("Jul 2020" … "Jul 2023") along the bottom. A centered legend row below the axis shows 4 category swatches (Launch, Landing, Exploration, Science) with dark-on-light text. All chrome text is dark and fully readable against the light background.
      Data: 8 circular markers along the spine, color-coded by category — Launch is brand green (#009E73), Landing purple, Exploration blue, Science ochre — matching the Imprint palette in canonical order. Each marker has a thin stem connecting it to a bold event label, alternating above/below the spine (Launch/First Powered Flight/10th Sample Cached/Sample Depot Completed above; Landing/First Rock Sample Collected/Reached River Delta Region/Crater Rim Ascent Begins below) so no labels collide.
      Legibility verdict: PASS — all text (title, event labels, tick labels, legend) is clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Same layout as the light render — title, spine, tick labels, and legend — now rendered in light/off-white text, clearly legible against the dark background. The axis line and grid remain subtle (low opacity) but visible.
      Data: Identical marker colors to the light render (green, purple, blue, ochre) — confirms the categorical data colors are theme-invariant and only chrome (background, text) flipped as expected.
      Legibility verdict: PASS — no dark-on-dark failures observed; all title, event-label, tick-label, and legend text is clearly visible light-colored text against the near-black background.
