review:
  strengths:
  - 'Markers sit at their exact dates on a shared time scale (scaleType: "time" with
    6 % padding), so the uneven gaps — the dense 2021 cluster and the long 2023 stretch
    — read as real time between events'
  - Labels alternate above and below the spine in date order, and the first and last
    labels anchor inward (textAnchor start/end), so nothing clips at the canvas edge
    and the close Feb/Apr 2021 pair never collides
  - 'Two-level label typography: bold 16 px event name in ink over a 14 px date in
    inkSoft, with stems colored by mission phase, gives a clear hierarchy in both
    themes'
  - 'Idiomatic MUI X composition API: ChartsDataProvider + ChartsSurface with ChartsXAxis,
    ScatterPlot, ChartsLegend and an item tooltip, and a custom SVG layer that reads
    the chart''s own scales via useXScale/useYScale'
  - Real, verifiable NASA Perseverance milestones (launch 2020-07-30, landing 2021-02-18,
    Ingenuity's first flight 2021-04-19 and final flight 2024-01-18) with four Imprint-ordered
    phase colors and a legend
  - All chrome threaded from ANYPLOT_TOKENS (ink, inkSoft, pageBg) — both renders
    are theme-correct with identical data colors; animation disabled via skipAnimation
  weaknesses:
  - 'Suggestion: the time axis sits about 450 px (physical) below the spine, so reading
    a marker''s date off the ticks takes a long vertical jump; placing the date ticks
    on the spine itself would tie markers and dates more directly.'
  - 'Suggestion: the vertical space between the label rows and the spine is mostly
    empty; shorter stems with the freed height given to slightly larger label text
    would use the canvas more evenly.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole canvas, no pure white.
      Chrome: bold dark title "Perseverance Rover Mission · timeline-basic · javascript · muix · anyplot.ai" centred at top (~49 % of width) with a soft-ink subtitle "7 milestones over 3.5 years · color = mission phase"; a dark-grey horizontal spine across the middle; a bottom time axis with quarterly ticks "Jul 2020" … "Apr 2024" in soft ink; horizontal legend at the bottom (Launch, Landing, Exploration, Science). All text dark on light and readable.
      Data: 7 circular markers with page-colored outlines on the spine at their dates; stems up/down in the category color to two-line labels (bold name, soft date), alternating above (Launch, Ingenuity's First Flight, Delta Front, Ingenuity's Final Flight) and below (Landing, First Rock Sample, Sample Depot). Colors: Launch #009E73, Landing #C475FD, Exploration #4467A3, Science #BD8233 — Imprint order, first series brand green. First and last labels anchored inward, no clipping, no overlap.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17, no pure black.
      Chrome: title and event names in light ink, subtitle, dates, ticks and legend in light soft ink; spine and axis line in light grey. No dark-on-dark text anywhere.
      Data: marker, stem and legend colors identical to the light render (green, lavender, blue, ochre); only chrome flipped. Brand green clearly visible.
      Legibility verdict: PASS
