review:
  strengths:
  - Kaplan-Meier curves drawn as true step functions starting at S=1 at time zero,
    with 95% log-log confidence bands built as patches that step with their curve
    (fill_alpha 0.15), so overlapping bands stay distinguishable in both themes
  - Censored observations marked with rotated bokeh 'dash' markers at their own censoring
    time and the curve height there, small enough not to read as steps
  - 'Group-driven loop assigns Imprint positions 1 and 2 (#009E73 Treatment, #C475FD
    Control) from the data; legend labels carry the group size (n=80)'
  - Canvas is the canonical 3200x1800 with explicit min_border margins; nothing clipped,
    toolbar hidden, theme tokens threaded through title, axes, grid and legend in
    both renders
  - Column-name constants drive the axis label and grouping, so the file adapts to
    a user's own time/event/group table
  weaknesses:
  - 'DQ-03 (both): event times are generated with np.clip(..., 0.5, 36) while keeping
    event=1, so every subject whose exponential time exceeds 36 months becomes an
    event at exactly 36; both curves end in an artificial cliff (Treatment 0.38 →
    ~0.08, Control 0.24 → ~0.06) instead of being administratively censored at end
    of follow-up → mark times beyond 36 months as censored (event = 0) at 36. Likely
    cause: the clip on treatment_times/control_times without resetting the event flag.'
  - 'CQ-01 (code): two helper functions compute_km() and to_steps() break the Imports
    → Data → Plot → Save structure → inline the estimator in the per-group loop (the
    step conversion is two np.repeat lines). Likely cause: helper functions kept from
    the predecessor.'
  - 'Suggestion: label the median survival time of each group where its curve crosses
    the 0.5 dashed line, so the median line carries a value.'
  - 'Suggestion: a HoverTool on the curves (time, survival, at-risk) would use bokeh''s
    interactivity in the HTML output.'
  - 'Suggestion: statsmodels.duration.survfunc.SurvfuncRight could replace the hand-written
    Kaplan-Meier loop if its confidence-interval transform matches the log-log band.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, 3200x1800 canvas, thin INK_SOFT plot outline.
      Chrome: bold title "survival-kaplan-meier · python · bokeh · anyplot.ai" top-left (~55% width), italic axis titles "Time (months)" and "Survival Probability", tick labels 0–35 and 0–1 in dark grey; subtle grid at 10% alpha. All readable.
      Data: Treatment curve in #009E73 and Control in #C475FD as step functions from S=1 at t=0, each with a translucent stepped 95% CI band (overlap reads blue-grey), vertical dash tick marks for censored observations on the curves, a dashed grey horizontal line at S=0.5; both curves drop to near zero in a vertical cliff at 36 months. Legend bottom-left "Treatment (n=80)" / "Control (n=80)" with short line glyphs on an elevated background.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, axis titles in near-white, tick labels light grey, grid subtle, legend box #242420 with light-grey labels; no dark-on-dark text.
      Data: identical curve, band and tick colors to the light render (#009E73, #C475FD); bands read as dark green/purple tints with a slate overlap; dashed 0.5 line in light grey; brand green clearly visible.
      Legibility verdict: PASS
