review:
  strengths:
  - Censoring ticks sit on their curve at the right height, and the curves extend
    flat to the last follow-up so no tick floats (C3)
  - Translucent 15 % log-log 95 % bands step with their curves; overlapping bands
    stay distinguishable in both themes
  - Medians 25.1 and 16.7 months fall out of the KM computation and match the 50 %
    crossings in the render
  - legendgroup ties each band to its curve so a legend click in the HTML toggles
    both; hovertemplate shows survival in percent
  - Theme tokens threaded through every chrome element; both renders read cleanly
  weaknesses:
  - 'SC-02 (both): median survival appears only as a corner text box; C5 places the
    median annotation where the curve crosses 50 % → mark each median at its crossing
    (e.g. a short drop line or marker at (median, 50 %)) and keep the box as its legend
    or drop it. Likely cause: fig.add_annotation with xref/yref=''paper'' at (0.02,
    0.03).'
  - 'CQ-01 (code): three helper functions kaplan_meier, to_steps and hex_to_rgba (lines
    50-88) break the linear Imports → Data → Plot → Save structure → inline them in
    the group loop. Likely cause: the estimator and step expansion written as reusable
    functions.'
  - 'CQ-04 (code): lines 50-71 write out the Kaplan-Meier product and Greenwood variance
    (about 20 lines) → `statsmodels.duration.survfunc.SurvfuncRight(t_all, e_all)`
    gives surv_times, surv_prob and surv_prob_se, from which the log-log band is two
    lines (se_log = surv_prob_se / (surv_prob * |log surv_prob|)). Likely cause: hand-rolled
    estimator.'
  - 'Suggestion: draw the curves with line_shape=''hv'' instead of expanding step
    coordinates by hand.'
  - 'Suggestion: an at-risk table below the time axis, which the Notes allow, would
    show how thin the tail is.'
