      Data: Two step curves - Treatment A in #009E73 green, Treatment B in #C475FD purple - starting at 1.0 at time 0, with translucent 95 % CI bands stepping with them (overlap reads as a gray-blue). Small vertical censoring ticks sit on the curves. Both curves drop vertically at 36 months to about 0.05-0.1. Legend glyphs are pale translucent circles that do not match the solid lines.
