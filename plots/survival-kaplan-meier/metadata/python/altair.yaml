review:
  strengths:
  - Native Vega-Lite step interpolation (interpolate="step-after") on both the survival
    line and the y/y2 CI area, so the bands step with their curves exactly
  - Censored observations drawn with mark_tick at their censoring time and the curve's
    height, small and thin enough not to read as steps
  - Exact 3200x1800 canvas reached by pad-only post-processing, with theme tokens
    threaded through axis, title and legend config in both renders
  - Layered composition shares one x encoding and one color scale across band, line
    and tick layers; the adaptable Data block with escaped column constants passes
    the static and smoke checks
  weaknesses:
  - 'VQ-03 (both): the legend glyphs are pale translucent circles taken from the 25
    %-opacity CI band layer, so they do not match the solid 3 px step curves they
    explain and Treatment A''s glyph nearly vanishes on the #1A1A17 background → a
    solid line sample at full opacity in each group''s color. Likely cause: the color
    legend is merged from the mark_area layer (opacity=0.25); set legend=None on the
    band and tick layers and give the line layer alt.Legend(symbolType="stroke", symbolStrokeWidth=3,
    symbolOpacity=1).'
  - 'DQ-03 (both): both curves plunge vertically at exactly 36 months (Treatment A
    from about 0.38 to about 0.07, Treatment B from about 0.19 to about 0.05) because
    every exponential draw above 36 is clipped to 36 and keeps its random event flag,
    piling a mass of events on the last day of follow-up → observations beyond the
    end of follow-up are censored at 36 (event = 0), so each curve ends on its last
    real step. Likely cause: np.clip(np.random.exponential(...), 1, 36) applied to
    time without censoring the clipped rows (the lower clip at 1 also stacks events
    at month 1).'
  - 'DQ-02 (both): the arms are labelled "Treatment A" and "Treatment B", generic
    placeholders in an otherwise plausible clinical-trial story → name the arms as
    a trial would, for example "Chemotherapy + immunotherapy" and "Chemotherapy alone".
    Likely cause: the GROUP label list in the Data block.'
  - 'CQ-04 (code): lines 60–92 write out the Kaplan-Meier product-limit estimate and
    the Greenwood variance by hand, which statsmodels computes → statsmodels.duration.survfunc.SurvfuncRight(time,
    event) with its surv_times, surv_prob and surv_prob_se. Likely cause: the inline
    estimation loop.'
  - 'Suggestion: a median survival annotation where each curve crosses 0.5, which
    the Notes allow.'
