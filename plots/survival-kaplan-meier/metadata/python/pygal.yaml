review:
  strengths:
  - Correct Kaplan-Meier with Greenwood 95% bands, both stepping vertically at event
    times and starting at 1.0
  - Translucent bands (alpha 0.22) keep both curves and the overlap region distinguishable
    in both themes
  - Censoring ticks drawn as one interrupted series per group via pygal's allow_interruptions
  - Clean legend with only the two treatment groups; native pygal HTML tooltips in
    the interactive output
  - 'Adaptable layout: column constants and a single Data block ending in a tidy df,
    groups handled in one loop'
  weaknesses:
  - 'VQ-01 (both): the major y tick labels 1, 0.5 and 0 render at 44 px while the
    other y ticks render at 56 px, so the axis reads unevenly → one size for all ticks
    (major_label_font_size equal to label_font_size, +12 px). Likely cause: Style
    major_label_font_size=44.'
  - 'CQ-01 (code): two helper functions, hex_to_rgba (lines 52-54) and steps (lines
    57-59), break the linear Imports → Data → Plot → Save flow → inline them as expressions
    in the loop. Likely cause: helpers kept from a refactor.'
  - 'CQ-04 (code): lines 70-84 write out the Kaplan-Meier product and Greenwood variance
    that statsmodels computes → statsmodels.duration.survfunc.SurvfuncRight(times,
    events) with .surv_times, .surv_prob and .simultaneous_cb / surv_prob_se. Likely
    cause: hand-rolled estimator.'
  - 'Suggestion: a median survival annotation where each curve crosses 0.5 would add
    the reading the Notes allow.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, 3200x1800
      Chrome: title 'survival-kaplan-meier · python · pygal · anyplot.ai' in dark ink at top center; y-axis 'Survival probability' (0-1), x-axis 'Time (months)' (0-70); subtle horizontal guides; legend at bottom left with 'Standard Treatment' and 'Experimental Treatment'. All text readable; major ticks 1/0.5/0 slightly smaller than the others
      Data: Standard Treatment step curve in #009E73 with a translucent green Greenwood band, Experimental Treatment in #C475FD with a translucent purple band; overlap region reads as a muted blend; vertical censoring ticks on both curves; standard curve drops to 0 at ~63 months, experimental at ~77
