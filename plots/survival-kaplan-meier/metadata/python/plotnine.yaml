review:
  strengths:
  - Confidence bands step with their curves because the ribbon and line share one
    explicit stair data frame
  - Censoring ticks sit at the curve height at each censoring time and stay clearly
    smaller than the steps
  - Theme tokens threaded through every chrome element; both renders fully legible
    with identical data colors
  - Median lines mapped through aes() from a data frame, so they share the group colors
    and legend
  - Legend placed in the empty lower-left corner of the panel, clear of curves and
    bands
  weaknesses:
  - 'CQ-01 (code): lines 70–102 wrap the per-group computation in a helper function
    `kaplan_meier` → no function; compute the steps, ticks and median inline in the
    per-plan loop at lines 107–113. Likely cause: the estimator written as a reusable
    helper.'
  - 'CQ-04 (code): lines 72–83 write out the Kaplan-Meier product and the Greenwood
    variance (~12 lines) → `statsmodels.duration.survfunc.SurvfuncRight(g[TENURE],
    g[CHURNED])` and its `surv_times`, `surv_prob`, `surv_prob_se`, with the log-scale
    band exp(±1.96·se/S) (statsmodels). Likely cause: hand-rolled estimator.'
  - 'Suggestion: label each median line with its month value near the 50 % crossing.'
  - 'Suggestion: an at-risk table below the time axis, which the Notes allow.'
