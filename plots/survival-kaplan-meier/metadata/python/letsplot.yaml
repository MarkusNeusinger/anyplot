review:
  strengths:
  - Each survival curve is a true step function (geom_step) starting at 1.0 at time
    zero, flat between events and dropping vertically, with a Greenwood 95% band whose
    ribbon steps with its curve thanks to the held-bound duplication of each event
    time
  - Censoring ticks (shape 3) sit exactly on the curve height at each censoring time
    via searchsorted, are small enough not to read as steps, and are mapped to the
    group color so the legend explains both line and tick
  - 'Treatment in brand green #009E73 and Control in Imprint purple #C475FD with alpha
    0.2 ribbons: overlapping bands between 2 and 13 months stay distinguishable in
    both themes'
  - All chrome is threaded through theme tokens (PAGE_BG, INK, INK_SOFT, GRID, ELEVATED_BG),
    so text, grid and legend frame flip cleanly between light and dark
  - Realistic clinical-trial scenario (exponential hazards 0.04 vs 0.08 per month,
    36-month follow-up, administrative plus 20% random censoring) gives plausible
    medians of about 19 vs 11 months and a tail ending above zero
  - lets-plot HTML export adds native hover tooltips on steps, ribbons and censoring
    ticks for inspection in the detail view
  weaknesses:
  - 'DE-02 (both): the panel is drawn with all four borders (a full INK_SOFT/dark
    rectangle around the plot area) although the plot type needs no enclosure → keep
    only the left and bottom axis lines (L-shaped frame) or none. Likely cause: panel_background=element_rect(fill=PAGE_BG)
    without color, which draws a border; set color=PAGE_BG or add panel_border=element_blank().'
  - 'CQ-04 (code): lines 79-100 write out the Kaplan-Meier product-limit estimator
    and Greenwood variance by hand although statsmodels, installed in CI, computes
    them → use statsmodels.api.SurvfuncRight(t, e) and read surv_times, surv_prob
    and surv_prob_se for the curve and band. Likely cause: manual loop over np.unique(t).'
  - 'Suggestion: a median survival annotation at the 0.5 crossing or a log-rank p-value,
    which the Notes allow, would give the comparison a focal point.'
  - 'Suggestion: drop the minor grid so the major grid alone carries the reading guides.'
  image_description: |-
