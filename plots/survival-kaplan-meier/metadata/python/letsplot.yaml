      Background: warm off-white #FAF8F1 across canvas and panel; legend box on the slightly lighter elevated surface.
      Chrome: title "survival-kaplan-meier · python · letsplot · anyplot.ai" top-left in dark ink (~56% width); axis titles "Time (months)" and "Survival Probability" and tick labels 0-35 / 0-1 in dark soft ink, all readable; subtle major+minor grid; a full dark rectangle frames the panel (four borders).
      Data: Treatment step curve in #009E73 and Control in #C475FD, each with a translucent 95% CI ribbon that steps with the curve; plus-shaped censoring ticks on the curves; Treatment ends ~0.32, Control ~0.04 at 36 months; legend "Group" with Treatment/Control.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
