review:
  strengths:
  - Survival estimates come from statsmodels SurvfuncRight (product-limit estimate
    with Greenwood SE) instead of a hand-written estimator, and the 95% band is built
    from that SE
  - The confidence band is turned into a true step ribbon (each bound held until the
    next event time), so the bands step with their curves instead of interpolating
    diagonally between event times
  - Censoring ticks sit at their censoring time and at the curve height there, using
    '+' marks at size 2.5 that stay clearly smaller than the steps
  - 'Theme tokens threaded through every chrome element: warm #FAF8F1 / #1A1A17 page,
    INK title and axis titles, INK_SOFT ticks and legend text, elevated legend box;
    both renders read cleanly'
  - 'Treatment in brand green #009E73 and Control in #C475FD (Imprint positions 1-2),
    identical across themes; overlapping bands at alpha 0.2 blend into a distinguishable
    third tone'
  - The data block uses column constants and a drop-in df, so the plot code adapts
    to a user's own table; the last estimate is held to the end of follow-up so the
    censored tail shows
  - lets-plot layered grammar with geom_ribbon + geom_step + geom_point sharing one
    color/fill mapping produces a single combined legend; the HTML export keeps lets-plot's
    native hover tooltips
  weaknesses:
  - 'Suggestion: the y-axis tick labels mix ''0'' and ''1'' with one-decimal values
    (''0.9'', ''0.8''); a fixed format such as scale_y_continuous(format=''.1f'')
    or percent labels would read more evenly.'
  - 'Suggestion: scale_y_continuous(limits=[0, 1]) types the bounds; probability is
    bounded by definition, but deriving or leaving the limits automatic would follow
    the library prompt''s ''never typed numbers'' convention literally.'
  - 'Suggestion: the Notes allow a median-survival annotation, an at-risk table and
    a log-rank p-value; one of them, e.g. the median crossing at 0.5, would give the
    comparison a focal point.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white, consistent with #FAF8F1; legend box on the slightly lighter elevated surface with a soft outline.
      Chrome: title "survival-kaplan-meier · python · letsplot · anyplot.ai" top-left in dark ink at ~56% of the width; axis titles "Time (months)" and "Survival Probability" in dark ink; tick labels 0-35 (step 5) and 0-1 (step 0.1) in soft dark gray; major and minor grid lines subtle; all readable.
      Data: two Kaplan-Meier step curves - Treatment in #009E73 green, Control in #C475FD purple - both starting at 1.0 at time 0, dropping vertically at event times, Treatment ending around 0.32 and Control around 0.03 at 36 months (censored tails). Each curve carries a translucent stepped 95% CI band (alpha 0.2); the bands overlap into a gray-blue tone between ~2 and ~14 months and widen toward the right. '+' censoring ticks sit on the curves (bunched near 13, 20, 23, 28 months and at 36). Legend "Group" at the right with Treatment / Control swatches.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black, consistent with #1A1A17; legend box on the elevated #242420 surface.
      Chrome: title and axis titles in light ink, tick labels and legend text in light gray; grid lines subtle but visible; no dark-on-dark text anywhere.
      Data: identical to the light render - same green #009E73 and purple #C475FD curves, ticks and bands; bands read as dark green / dark purple tints with the overlap still distinguishable.
      Legibility verdict: PASS
