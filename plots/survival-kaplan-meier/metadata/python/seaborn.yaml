review:
  strengths:
  - The Kaplan-Meier estimate comes from scipy's stats.ecdf on stats.CensoredData,
    with Greenwood confidence intervals from sf.confidence_interval(0.95). Nothing
    is hand-rolled.
  - The survival curves use the seaborn-native sns.lineplot(hue=..., estimator=None,
    drawstyle='steps-post'). They are true right-continuous steps that start at 1.0
    at time zero.
  - The confidence bands are drawn with fill_between(step='post') at alpha 0.16, so
    they step with their curves. Where the two arms overlap the blend stays distinguishable
    in both themes.
  - The censored observations are seaborn scatter '|' ticks at each censoring time
    on the curve's height. They are small enough not to read as steps.
  - Each median survival is marked by a group-colored drop line from the half-survival
    reference line to the time axis, with its value labelled (16.9 vs 22.4 months).
  - 'Every chrome element is threaded through the theme tokens, so both renders are
    fully legible. Treatment is #009E73 and Control is the second Imprint position,
    #C475FD.'
  - The code is a clean column-role and data-block structure with a fixed seed and
    only the imports it uses.
  weaknesses:
  - 'Suggestion: an at-risk table below the plot, aligned with the time axis, would
    complete the clinical-trial reading the Notes allow.'
  - 'Suggestion: a log-rank p-value placed as text clear of the curves (for example
    scipy.stats.logrank) would quantify the gap between the arms.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across figure and axes.
      Chrome: title "survival-kaplan-meier · python · seaborn · anyplot.ai" in dark ink at top center (~55% width); axis titles "Time since randomization (months)" and "Survival probability"; dark-grey tick labels 0–35 and 0.0–1.0; subtle horizontal-only grid; left and bottom spines only; framed legend "Study arm" upper right on elevated surface. All readable.
      Data: Treatment step curve in #009E73 and Control in #C475FD, both starting at 1.0, flat between events with vertical drops; translucent stepped 95% CI bands (overlap blends grey-blue); short vertical censoring ticks on each curve, bunched near 36 months; dashed grey half-survival line at 0.5 with group-colored dotted drop lines at 16.9 (Control) and 22.4 (Treatment) months labelled "median 16.9" / "median 22.4" at the axis foot. Curves end above zero (≈0.41 and ≈0.24).
