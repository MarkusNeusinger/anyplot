review:
  strengths:
  - Kaplan-Meier estimate computed with scipy's stats.ecdf on CensoredData, with Greenwood
    confidence intervals from sf.confidence_interval, so the steps, bands and censored
    heights come from the library instead of a hand-written estimator
  - 'Survival curves drawn through sns.lineplot with hue, estimator=None and drawstyle=''steps-post'':
    right-continuous steps that start at 1.0 at time zero and drop vertically, never
    slope'
  - Censored observations sit on their curve at the right height (fit.evaluate at
    each censoring time) as small '|' ticks in the group color that are clearly smaller
    than a step
  - 'Confidence bands step with their curves (fill_between step=''post'', alpha 0.16):
    overlapping Treatment and Control bands stay distinguishable in both themes'
  - 'Median survival annotation in its usual place: a dashed half-survival line, drop
    lines in each group''s color to the time axis, and muted ''median 16.9'' / ''median
    22.4'' labels at the axis foot, clear of the curves'
  - 'Theme tokens threaded through sns.set_theme rc and the legend text colors: chrome
    flips cleanly while Imprint #009E73 / #C475FD stay identical in both renders'
  - sns.move_legend places the framed 'Study arm' legend in the empty upper-right
    corner
  weaknesses:
  - 'VQ-01 (both): the median labels are set at 7 pt, below the 8 pt tick-label floor
    of the style guide, and become the smallest text on the chart (about 5 px tall
    in the 400 px thumbnail) → 8 pt (+1 pt). Likely cause: ax.annotate(..., fontsize=7).'
  - 'Suggestion: an at-risk table below the time axis, which the Notes allow, would
    show how few patients remain behind the wide late bands.'
  - 'Suggestion: a log-rank p-value, which the Notes allow, would quantify the gap
    between the two arms.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the figure and axes; no pure white.
      Chrome: title "survival-kaplan-meier · python · seaborn · anyplot.ai" at top center in dark ink, about 55 % of the width; x-axis "Time since randomization (months)" (0-35), y-axis "Survival probability" (0.0-1.0); dark-grey ticks; subtle horizontal grid only; top and right spines removed; framed legend "Study arm" (Treatment, Control) upper right on an elevated surface. All text readable.
      Data: two step curves, Treatment in #009E73 and Control in #C475FD, both starting at 1.0 at time 0; translucent stepped 95 % bands in the same hues, overlapping in a grey-blue zone; small vertical censor ticks on both curves, bunched at 36 months for Treatment; a dashed grey line at 0.5 survival, color-matched dotted drop lines at 16.9 (Control) and 22.4 (Treatment) months with small "median 16.9" / "median 22.4" labels at the x-axis foot. Treatment ends near 0.41, Control near 0.24.
      Legibility verdict: PASS

