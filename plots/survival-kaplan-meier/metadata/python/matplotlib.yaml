review:
  strengths:
  - Kaplan-Meier estimate from statsmodels SurvfuncRight, drawn with ax.step(where="post")
    and a matching fill_between(step="post") so curve and 95% band step together from
    S=1 at t=0
  - Censored observations drawn as small '|' scatter ticks at the step curve's height
    via searchsorted, clearly distinct from the vertical drops
  - 'Median survival shown where it belongs: group-colored dotted drop lines at the
    0.5 crossing plus a compact elevated-background text box with both medians'
  - Theme tokens threaded through every chrome element (title, labels, ticks, spines,
    grid, legend frame, annotation box); both renders read cleanly and data colors
    are identical
  - Translucent bands (alpha 0.18) keep the overlapping early-follow-up region and
    both curves distinguishable in light and dark
  weaknesses:
  - 'DQ-03 (both): np.clip(..., 0.5, 60) turns every subject surviving past 60 months
    into a death at exactly month 60 (event stays 1), so the Treatment curve plunges
    vertically from about 0.19 to about 0.02 at the end of follow-up — an artifact
    no real trial shows, where survivors at study end are censored → set event = 0
    for times clipped at the follow-up cutoff so the curve ends at about 0.19 with
    censoring ticks. Likely cause: lines 37–40 clip the times without censoring the
    clipped rows.'
  - 'Suggestion: km.quantile(0.5) from SurvfuncRight could replace the three-line
    manual median lookup (lines 77–79).'
  - 'Suggestion: an at-risk count table below the axis, which the Notes allow, would
    explain the widening bands in the tail.'
  image_description: |-
