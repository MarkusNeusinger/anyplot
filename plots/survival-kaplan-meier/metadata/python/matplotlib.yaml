review:
  strengths:
  - Kaplan-Meier estimate comes from statsmodels SurvfuncRight rather than a hand-rolled
    product-limit loop, with the 95% band from its standard errors
  - Curves drawn with ax.step(where='post') and bands with fill_between(step='post'),
    so the band steps with its curve and each curve starts at S=1 at t=0
  - Censoring ticks are placed at the step curve's height at each censoring time via
    searchsorted, small '|' marks that do not read as steps
  - Median survival is marked where each curve crosses 0.5 with group-colored dotted
    drop lines, and the values sit in an elevated box clear of the curves
  - Theme tokens are threaded through every chrome element; both renders are fully
    readable and data colors are identical across themes
  weaknesses:
  - 'Suggestion: an at-risk table below the plot aligned with the time axis, which
    the Notes allow, would show why the bands widen late in follow-up'
  - 'Suggestion: a log-rank p-value as text clear of the curves (statsmodels.duration.survdiff)
    would quantify the group difference the Notes allow'
