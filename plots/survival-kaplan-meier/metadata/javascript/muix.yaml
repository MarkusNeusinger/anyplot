review:
  strengths:
  - CI band built natively from two stacked `stepAfter` area series (invisible lower
    base + filled width), so the band steps exactly with its curve
  - Censoring marks drawn via a per-point `showMark` callback on the survival series
    itself, so they sit at the curve's height at each censoring time
  - Correct Kaplan-Meier with Greenwood 95% CI; both groups resampled onto a shared
    time grid with step-function forward fill
  - Fully theme-adaptive chrome through the MUI ThemeProvider; identical data colors
    in both renders
  - Legend carries group sizes (n=50); subtitle explains bands and circles
  weaknesses:
  - 'CQ-01 (code): the file does not follow the six-zone Data block of `prompts/adaptable-code.md`
    / the muix "Data block" section — no column constants with `// role:` comments,
    no `// Data` block ending in `const data` (one record per observation with time,
    event, group), no `// Plot` marker, and data generation plus estimation are spread
    over six helper functions (`createRng`, `sampleExponential`, `generateGroup`,
    `kaplanMeier`, `alignToGrid`, `buildGroupSeries`) → role constants `TIME`/`EVENT`/`GROUP`,
    one `// Data` block that ends in `const data` records, and plot code below `//
    Plot` that derives the groups and curves from `data` with as few helpers as possible.
    Likely cause: data generated per group via `generateGroup()` and kept as two separate
    arrays.'
  - 'Suggestion: censoring marks as small vertical ticks (the classic "+"/"|" KM convention
    the Notes name) instead of open circles.'
  - 'Suggestion: a median-survival annotation where the standard curve crosses 50%
    (around month 22) would give the chart a focal point.'
