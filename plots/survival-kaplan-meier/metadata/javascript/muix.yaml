review:
  strengths:
  - Genuine Kaplan-Meier estimator with Greenwood's formula for the 95% CI, computed
    from raw time/event observations rather than pre-baked step coordinates
  - CI bands built via a clever stacked-area technique (invisible base + visible delta),
    with the base fill correctly knocked out via targeted sx rules — a distinctive,
    well-executed use of MUI X's community API
  - Censored observations marked with open-circle marks only at their own step (showMark
    keyed off a per-point censored flag), matching the spec's request for censoring
    tick marks
  - Two groups clearly distinguished by color with a legend, both curves sharing one
    aligned time grid via forward-fill so they can be compared directly
  - Data colors are pixel-identical between light and dark renders; only chrome (background,
    grid, text) adapts to theme
  - Realistic, neutral reliability-engineering scenario (bearing failure, standard
    vs. reinforced design) with a plausible competing-risks data-generation process
    (failure vs. dropout vs. administrative censoring)
  - Deterministic fixed-seed LCG for reproducibility since the browser has no seeded
    RNG
  - Title and subtitle establish clear context; subtitle explicitly explains the CI
    bands and censoring marker convention
  weaknesses:
  - No median survival time annotation, at-risk table, or log-rank p-value — the spec
    lists these as optional ('Consider adding'), so this is not a hard requirement,
    but any one of them would add analytical depth and strengthen the data-storytelling
    score
  - 'The yAxis ''tickFontSize: 42'' value is a layout-offset hack (per the code comment)
    rather than an actual intended tick font size — it works visually but is fragile
    if MUI X''s internal layout formula changes; a named constant with a comment referencing
    the specific MUI X version would be more robust'
  - The CI-band overlap region (where both groups' bands intersect) blends into a
    neutral grey-blue tone that is neither series color — visually reasonable and
    expected from alpha compositing, but worth a conscious check that it doesn't read
    as a third, undefined data category
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Bold dark title top-left ("survival-kaplan-meier · javascript · muix · anyplot.ai"), a grey subtitle explaining the CI bands and censoring marks, dark axis titles ("Time in service (months)", "Survival probability"), dark percentage tick labels (0%-100%) on the y-axis and integer month ticks (0-36) on the x-axis, subtle horizontal-only gridlines, legend swatches top-right. All text is clearly readable against the light background — no light-on-light issues.
      Data: Two step-function curves — green (#009E73, "Standard design (n=50)") and purple/lavender ("Reinforced design (n=50)") — each with a shaded confidence band in its own hue (region where the two bands overlap blends to a neutral grey-blue). Open circle marks appear only at censoring events along each curve. The green curve declines faster and further (down to ~34% by month 36) than the purple curve (~60% by month 36), a clear and legible visual comparison.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same layout as light — title, subtitle, axis titles, tick labels, gridlines, legend — all rendered in light/white ink. No dark-on-dark failures: title, axis labels, tick labels, and legend text are all crisply legible against the dark background.
      Data: Same two step curves in the identical green (#009E73) and purple hues as the light render — confirmed pixel-identical data colors, only the chrome (background, text, grid) flipped to the dark theme. CI bands and censoring circles remain clearly visible against the dark background.
      Legibility verdict: PASS
