      Background: Warm off-white (~#FAF8F1), consistent across the full canvas — no white-washing.
      Chrome: Bold dark title "survival-kaplan-meier · javascript · muix · anyplot.ai" top-left, readable. Subtitle explaining shaded bands and censoring markers below it, readable. X-axis "Time in service (months)" ticked 0-36, Y-axis "Survival probability" ticked 0%-100%. Legend top-right with two color swatches and n= labels, readable. FLAG: the rotated Y-axis title "Survival probability" visually overlaps the "50%" tick label — the "5" digit is partially obscured by the axis-title glyphs where the two text elements cross near mid-height.
      Data: First series (Standard design) uses brand green #009E73 step line with matching translucent CI band; second series (Reinforced design) uses a lavender/purple Imprint palette color with matching band. Step function shape is correctly discrete (not smoothed). Open circle markers appear at censored time points on both curves.
      Legibility verdict: FAIL (title/subtitle/legend/axis titles all readable, but the Y-axis title overlaps the "50%" tick label — a real, if localized, overlap defect)

    Dark render (plot-dark.png):
      Background: Warm near-black (~#1A1A17), consistent across the full canvas — no pure black.
      Chrome: Same title/subtitle in light text, clearly readable against the dark background. Axis titles and tick labels are light-colored and legible. Legend swatches and text readable. FLAG: same Y-axis title / "50%" tick label overlap as the light render, in the same location.
      Data: Colors are identical to the light render (brand green #009E73 and the lavender Imprint tone) — only the chrome (background, text, grid) flipped, as required. No dark-on-dark or light-on-light failures elsewhere; the one legibility issue is the axis-title/tick-label overlap noted above, which is a layout collision rather than a color-contrast problem.
      Legibility verdict: FAIL (same overlap issue as light render; otherwise no dark-on-dark contrast failures)
