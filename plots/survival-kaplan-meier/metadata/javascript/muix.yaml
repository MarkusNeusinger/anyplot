  strengths:
  - 'Correct Kaplan-Meier product-limit estimate with Greenwood 95% CI computed from
    the records and drawn with MUI X curve: ''stepAfter'' on a linear time axis, starting
    at 100% at t=0'
  - CI band built idiomatically from a stacked area pair (lower-bound base + upper-lower
    delta) with the base fill knocked out via v9 .MuiLineChart-area[data-series] selectors
