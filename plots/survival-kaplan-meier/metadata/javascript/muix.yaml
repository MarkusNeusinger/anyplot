review:
  strengths:
  - Correct Kaplan-Meier step function (stepAfter curve) rather than a smoothed line,
    matching the spec's core requirement.
  - Real Greenwood's-formula 95% confidence intervals computed from the data, rendered
    as shaded bands via a stacked base + delta area trick — not a fake/decorative
    band.
  - Censored observations are marked with open circles via a per-index showMark function,
    and the subtitle explicitly explains the encoding.
  - Clean two-group comparison (standard vs. reinforced design) with a legend, distinct
    Imprint palette colors, and n= sample sizes shown in the legend labels.
  - Deterministic data generation via a small fixed-seed LCG (no browser RNG available)
    with a realistic competing-risks simulation (failure vs. dropout vs. administrative
    censoring).
  - 'Correct harness contract: default-exported component, skipAnimation set, sizing
    from window.ANYPLOT_SIZE, first series uses brand green t.palette[0].'
  - 'Both renders are theme-correct: light background is warm off-white, dark background
    is warm near-black, and data colors are identical between themes.'
  weaknesses:
  - The rotated Y-axis title 'Survival probability' visually overlaps the '50%' tick
    label in both light and dark renders — the '5' digit is partially obscured by
    the title's descender/glyph. Increase the left margin (currently margin.left=78)
    or add spacing between the axis label and tick labels (e.g. via yAxis labelStyle/tickLabelStyle
    offset or a larger left margin, ~95-100px) so the rotated title clears the tick
    text.
  - No median survival time annotation or at-risk table, which the spec calls out
    as a way to strengthen the storytelling ('Consider adding median survival time
    annotation and at-risk table below the plot'). Not a required feature, but would
    raise Data Storytelling and Feature Coverage.
  - No log-rank test p-value shown despite comparing two groups, which the spec explicitly
    suggests including for group comparisons.
  - 'CQ-01 KISS: several helper functions (kaplanMeier, alignToGrid, buildGroupSeries)
    are used. This is reasonably justified by the statistical complexity of a real
    KM/Greenwood estimator, but is still a deviation from the flattest possible script
    structure.'
  image_description: |-
