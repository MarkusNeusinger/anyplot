review:
  strengths:
  - Statistically correct Kaplan-Meier estimator with Greenwood's log-log-transformed
    95% CI, properly handling censoring and tied event times
  - 'Genuine step function (step: "end") rendered via echarts line series, not a smoothed
    curve'
  - Confidence-interval bands built with an idiomatic ECharts stacked invisible-line
    trick (lower + width series), correctly shaded and theme-consistent between light
    and dark
  - Censored observations marked with distinct rect tick symbols on each curve
  - Median survival annotated both numerically (subtitle) and visually (dashed drop-lines
    to the 50% reference markLine), for both arms
  - Log-rank chi-square test implemented from scratch (erf approximation) and its
    p-value surfaced in the subtitle
  - 'First series uses Imprint brand green #009E73, second uses canonical position-2
    lavender #C475FD; identical across light/dark renders'
  - Theme-adaptive chrome (ink, inkSoft, grid tokens) correctly threaded through title,
    subtitle, legend, axis labels, and tick labels in both renders
  - Deterministic, seeded data generation (LCG) with realistic oncology two-arm trial
    context and independent per-arm censoring/dropout
  weaknesses:
  - No at-risk table below the plot — the spec explicitly suggests this as a distinguishing
    KM feature; adding one (or a compact at-risk annotation row under the x-axis)
    would raise Data Quality feature coverage and Design Excellence.
  - The two 95% CI bands overlap heavily between ~months 8-25, blending into a muddled
    green/purple wash that makes it harder to tell which band boundary is which at
    a glance — consider lowering band opacity further (e.g. ~0.12) or drawing a thin
    band-edge stroke in each arm's color.
  - Title occupies only ~40% of the plot width even after the length-based shrink
    formula — well under the 50-70% target range, leaving the top of the canvas visually
    sparse relative to the rest of the chart's density. A modest fontsize bump (or
    moving some subtitle stats into the title) would improve top-of-canvas balance.
  - 'Design Excellence is solid but not yet publication-grade: the chart relies on
    the legend + subtitle for group identification rather than direct end-of-line
    labels, which would sharpen the visual hierarchy and reduce eye travel back to
    the legend.'
  - The CI-band stacking technique is a nice ECharts-specific idiom, but nothing else
    in the implementation is distinctly ECharts-only (e.g. no use of markPoint, visualMap,
    or dataZoom) — one more distinctive-feature touch would strengthen Library Mastery.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "Overall Survival by Treatment Arm · survival-kaplan-meier · javascript · echarts · anyplot.ai" in dark ink, subtitle with median OS and log-rank p in softer gray, legend ("New Therapy (n=75)" / "Standard Therapy (n=75)") centered above the plot, y-axis tick labels formatted as percentages, x-axis labeled "Time (months)", y-axis labeled "Survival Probability". All chrome text is clearly dark-on-light and fully readable.
      Data: Two step-function survival curves — green (#009E73, New Therapy) staying consistently above purple/lavender (#C475FD, Standard Therapy). Each curve has a shaded 95% CI band in its own color at low opacity, small rect tick marks along each curve for censored observations, and a dashed vertical drop-line from each curve's median-crossing point down to a horizontal dashed 50% reference line.
      Legibility verdict: PASS — all text readable, no overlap, no clipping at canvas edges.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title/subtitle/legend/axis-label layout as the light render, now rendered in light ink (near-white title, lighter gray subtitle/ticks) against the dark background. Y-axis percentage ticks and "Time (months)" / "Survival Probability" axis names are clearly legible; no dark-on-dark text anywhere.
      Data: Data colors are pixel-identical to the light render — same #009E73 green and #C475FD lavender curves, same CI band shapes, same censoring tick positions and median drop-lines. Only the chrome (background, text, grid) flipped to the dark theme.
      Legibility verdict: PASS — all text readable against the dark background, no dark-on-dark failures observed.
