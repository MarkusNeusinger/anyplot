review:
  strengths:
  - Correct step-function Kaplan-Meier estimator with real Greenwood variance-based
    95% confidence bands (not approximated) — mathematically rigorous
  - Censored observations correctly marked with tick marks positioned at each patient's
    survival level on the curve
  - Clean two-group comparison using canonical Imprint palette order (#009E73 first,
    second palette color for the comparison group), legend includes sample size per
    group (n=95)
  - Theme-adaptive chrome is correct and consistent in both light and dark renders;
    data colors are identical across themes
  - Title, axis labels (with units for the time axis), and legend all correctly formatted
    per spec
  - Deterministic, reproducible data generated via a seeded LCG (no network fetches,
    self-contained browser-side simulation)
  weaknesses:
  - Censoring tick marks are thin and short (14px total height at stroke-width 2 on
    a 1800px-tall canvas) — increase tick length/stroke-width slightly so censoring
    is unmistakable at a glance, not just on close inspection
  - Spec explicitly suggests a median survival time annotation and an at-risk table
    below the plot as enhancements — neither is present; adding at least the median-survival
    marker (e.g. dashed guide line at 50% crossing each curve) would meaningfully
    improve data storytelling and feature coverage
  - Y-axis domain/spine path is still stroked (inkSoft) even though tick lines are
    removed via tickSize(0) — for a fully polished grid-only look, remove or hide
    the y-axis domain path to match the x-axis's minimal treatment
  - Where the two groups' 95% CI bands overlap (~months 5-12), the translucent fills
    blend into a muddied intermediate tone that makes it harder to attribute the shaded
    region to a specific group at a glance — consider a slightly lower band opacity
    or a subtle stroke on the band edges to keep the two bands visually separable
    in the overlap zone
  - No log-rank test p-value or other quantitative comparison summary included, despite
    the spec noting this can be included — would strengthen data storytelling
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1-consistent), not pure white.
      Chrome: Title "survival-kaplan-meier · javascript · d3 · anyplot.ai" is dark, bold, centered, fully visible with no clipping. X-axis label "Time Since Enrollment (months)" and Y-axis label "Survival Probability" are dark and clearly readable. Tick labels (0-35 on x, 0%-100% on y) are dark gray and legible. Horizontal gridlines only, subtle light gray, at 0/20/40/60/80/100%. Legend top-right with colored line swatches and text "Standard Therapy (n=95)" / "Novel Therapy (n=95)", fully readable, no overlap with curve data.
      Data: Two step-function survival curves — Standard Therapy in Imprint green (#009E73) declining faster to ~17% by month 36, Novel Therapy in Imprint purple/lavender (second palette color) declining slower to ~42% by month 36. Both curves show shaded 95% CI bands in matching translucent colors, and small vertical tick marks at several points along each curve marking censored observations. First categorical series is correctly #009E73.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17-consistent), not pure black.
      Chrome: Title, axis labels, and tick labels all render in light/white text, clearly legible against the dark background — no dark-on-dark failures observed. Gridlines are subtle light gray, still visible but not dominant. Legend text is light-colored and readable, swatches match the curve colors.
      Data: Same two curves with identical colors to the light render (#009E73 green and Imprint purple) — confirms only chrome flipped, data colors unchanged. CI bands and censoring ticks are equally visible against the dark background.
      Legibility verdict: PASS
