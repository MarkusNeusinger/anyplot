review:
  strengths:
  - 'Rigorous statistics implemented from scratch: proper Kaplan-Meier estimator with
    Greenwood confidence intervals and a Mantel-Cox log-rank test (with its own erf
    approximation) — no shortcuts or fabricated numbers.'
  - 'Creative, correct workaround for the missing highcharts-more module: hand-built
    step-shaped confidence-band polygons via the core SVGRenderer, plus a custom SVGRenderer.prototype.symbols.tick
    shape for censored observations — idiomatic use of Highcharts'' low-level API
    rather than faking the feature.'
  - Full theme-adaptive chrome in both renders; categorical data colors (green/lavender)
    are pixel-identical between light and dark, and all text remains legible on both
    backgrounds.
  - 'Clear data storytelling: two comparably-sized groups with a visible survival
    gap, per-group median markers, a median reference line, and the log-rank p-value
    surfaced directly in the subtitle.'
  - Exact spec-mandated title format and legend labels matching the two bearing groups;
    step function (not smoothed) correctly represents discrete event times.
  weaknesses:
  - The two 95% CI bands overlap for roughly months 13-27 and blend into a slightly
    muddy gray-green patch; a touch less fill opacity or a thin outline stroke on
    each band would keep group identity crisper through the overlap.
  - The script leans on several small helper functions (kaplanMeier, logRankTest,
    bandOutline, survivalAt, medianSurvival) rather than a flatter top-to-bottom script
    — justified by the underlying statistics, but more structure than the CQ-01 'no
    functions' ideal.
  - The spec's optional 'at-risk table below the plot' suggestion is omitted; not
    required, but would round out a clinical-style KM plot.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "survival-kaplan-meier · javascript · highcharts · anyplot.ai" in bold dark ink, clearly visible; subtitle with the log-rank χ² and p-value in soft gray; x-axis "Months in Service" and y-axis "Survival Probability" titles and percent-formatted tick labels all in dark/soft-dark ink, fully legible; subtle light gridlines; legend below the plot with "Standard Bearing" / "Reinforced Bearing" swatches, clearly readable.
      Data: Two step curves — green (Standard Bearing) and lavender/purple (Reinforced Bearing) — first series confirmed as brand green #009E73. Shaded confidence bands in matching translucent colors trail each curve, overlapping into a blended gray-green zone mid-plot. White vertical tick marks along each curve indicate censored observations. A black dashed horizontal "Median" line sits at 50%, with thin dotted vertical lines in each series' color marking that group's median survival time.
      Legibility verdict: PASS — all text reads clearly against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title, subtitle, axis titles, tick labels, and legend now rendered in off-white / light-gray ink; gridlines subtle and still visible against the dark surface.
      Data: The same green and lavender curves and confidence bands appear with identical hex values to the light render — only the chrome (background, text, grid) flipped. Censoring tick marks are still white and clearly visible against the dark background. The median dashed line and per-group dotted median markers are rendered in light tones and remain legible.
      Legibility verdict: PASS — no dark-on-dark failures; all text and data elements are clearly distinguishable from the near-black background.
