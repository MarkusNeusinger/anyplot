review:
  strengths:
  - Stairstep confidence bands built with geom_rect (not geom_ribbon) — correctly
    represents the step function instead of a misleading linear-interpolated ribbon
  - 'Faithful, idiomatic KM implementation: survival::survfit/survdiff, curves anchored
    at t=0/surv=1, censored observations marked with conventional cross ticks'
  - Theme-correct chrome in both renders; Imprint palette applied in canonical order
    with identical data colors across light/dark
  - 'Clean layout: horizontal-only gridlines, in-plot legend that never collides with
    the data, descriptive axis labels with units and percentage y-axis formatting'
  - Log-rank test p-value included as subtitle, adding immediate statistical context
    to the visual comparison
  weaknesses:
  - Censoring tick marks overlap/cluster tightly in dense regions (~20-24 months for
    both arms), making individual censoring events hard to distinguish
  - Overlapping CI bands where the two curves cross (~5-9 months) create a slightly
    muddied blended color region
  - No median-survival annotation or at-risk table, both suggested (not required)
    by the spec — would strengthen data storytelling
  image_description: |-
