      Data: First series (Free Tier) is anyplot brand green (#009E73) — correct per the palette hard rule. Second series (Premium Tier) renders as a muted slate blue, confirmed by pixel sampling to be #4467A3 (Imprint position 3) rather than the #C475FD lavender (position 2) that the current source code specifies — see weaknesses; this is a stale-render pipeline issue, not a source-code bug. Both curves are clean step functions with shaded 95% CI bands and small vertical censoring ticks; dashed vertical/horizontal reference lines mark each group's median survival time.
