review:
  strengths:
  - 'Complete feature set: step-function KM curves, Greenwood 95% confidence bands,
    censoring tick marks, median-survival reference lines with annotation, log-rank
    p-value, and a number-at-risk table below the main axis — every ''Notes'' item
    in the spec is implemented'
  - 'Genuine data storytelling: Free vs Premium tiers diverge clearly, dashed median
    lines and the log-rank annotation let the viewer read the statistical conclusion
    directly off the chart'
  - Theme-adaptive chrome is correctly threaded through both Axis objects (main +
    at-risk table) — backgrounds, ink tokens, and grid alpha all flip correctly between
    light and dark, with identical data colors in both renders
  - Canvas lands exactly on the 3200×1800 target with well-balanced margins and no
    clipped elements
  - Reproducible (Random.seed!(42)) and uses idiomatic Makie layout composition (fig[1,1]/fig[2,1]
    grid, band!, axislegend) for the compound figure
  weaknesses:
  - 'VQ-07 Palette Compliance: the Premium Tier curve uses IMPRINT_PALETTE[3] (#4467A3,
    blue) instead of the next canonical ordinal position IMPRINT_PALETTE[2] (#C475FD,
    lavender). Subscription tiers carry no strong real-world color association, so
    the semantic-exception rule doesn''t apply here — default to positions 1→2 in
    order. Fix: use IMPRINT_PALETTE[2] for the Premium curve/band/censoring-marks/at-risk
    row (or renumber to use positions 1 and 2 consistently everywhere colors are assigned)'
  - 'CQ-03 Clean Imports: `using Statistics` is imported but never used — no Statistics.mean/median/std
    call appears anywhere in the script (the median survival time is computed manually
    via findfirst). Remove the unused import'
  - 'CQ-01 KISS Structure: the script defines four custom top-level functions (kaplan_meier,
    km_step, survival_at, normal_cdf) rather than a flat imports→data→plot→save script.
    This is understandable given the KM/Greenwood/log-rank math needs to run twice
    (once per group), but consider whether normal_cdf''s polynomial approximation
    could be inlined or simplified, or note this is an accepted exception for statistical-estimator
    plot types'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "Subscription Retention · survival-kaplan-meier · julia · makie · anyplot.ai" is dark, bold, centered, sized to ~55-60% of plot width (scaled down for the long descriptive-prefixed title, as intended). Y-axis label "Survival Probability" and x-axis label "Time Since Signup (months)" are dark and fully readable. Tick labels are soft dark gray, legible. Legend box top-right with "Free Tier" / "Premium Tier" has a light elevated-bg frame with a visible border. Number-at-risk table below the main axis is aligned to the same x-axis and fully legible.
      Data: Two step-function KM curves — green (#009E73, Free Tier) and blue (#4467A3, Premium Tier) — each with a shaded 95% CI band in the matching hue, vertical tick marks for censored observations, dashed vertical/horizontal reference lines marking each group's median survival time, and a text annotation giving median survival times and the log-rank p-value. First series is correctly the anyplot brand green.
      Legibility verdict: PASS — all text is clearly readable against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Title, axis labels, and tick labels have all flipped to light tones (off-white for primary text, soft light gray for tick labels/secondary text) and remain fully readable. Legend frame flips to the dark elevated background with a light border and light label text. Number-at-risk table text and gridlines are visible against the dark background.
      Data: Same two step curves in the identical green (#009E73) and blue (#4467A3) hues as the light render, with the same CI bands, censoring ticks, median reference lines, and annotation text (now light-colored) — confirming only chrome flips between themes, not data colors.
      Legibility verdict: PASS — no dark-on-dark failures observed; all title/axis/tick/legend/annotation text is clearly legible against the near-black background.
