review:
  strengths:
  - 'Full spec-note coverage in one figure: step-function KM curves, shaded 95% Greenwood
    confidence bands, vline censoring tick marks, group comparison with legend, median-survival
    reference lines with annotated values, log-rank p-value, and a ''Number at risk''
    table below the main axis.'
  - Custom Kaplan-Meier estimator, Greenwood standard error, and a Mantel-Haenszel
    log-rank test implemented from first principles (no SpecialFunctions dependency
    for the normal CDF) — statistically correct and genuinely idiomatic Julia.
  - 'Theme-adaptive chrome is threaded through every element including the secondary
    at-risk-table Axis, and both renders (light #FAF8F1 / dark #1A1A17) are clean,
    legible, and free of clipping or overlap.'
  - Title fontsize scales down correctly for the longer descriptive-prefixed title
    via the linear formula, staying well within canvas bounds in both renders.
  - Realistic, neutral scenario (subscription free-vs-premium churn) with plausible
    sample sizes (220/arm) and a sensible 36-month time scale.
  weaknesses:
  - 'PIPELINE FLAG (not a code defect): the rendered plot-light.png/plot-dark.png
    in this review still show the Premium Tier series in IMPRINT_PALETTE[3] (#4467A3,
    blue) — verified by direct pixel sampling of the line and confidence-band tint,
    which matches the pre-fix code exactly. The current source (commit 84bf9071e,
    ''fix(makie): address review feedback'') already corrects every one of these 8
    usages to IMPRINT_PALETTE[2] (#C475FD, lavender), the canonical position-2 color.
    The images appear to be stale renders from before that fix landed. Recommend re-rendering
    from the current commit before the next scoring pass — the repair loop should
    NOT attempt to ''re-fix'' the palette assignment, since the source already targets
    position 2 correctly.'
  - Because of the stale render above, VQ-07 can only be scored against what the pipeline
    actually produced (#4467A3, still a valid on-palette Imprint hue, just the wrong
    ordinal position) rather than the corrected source — docked one point pending
    a fresh render.
  - At-risk table row labels ('Premium'/'Free' on the y-axis, and the per-timepoint
    counts at fontsize=12) are the smallest text elements in the figure; still legible
    at full resolution in both themes, but worth a fontsize bump if this spec-id's
    mobile (400px) rendering is ever spot-checked.
