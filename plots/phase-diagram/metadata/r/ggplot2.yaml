review:
  strengths:
  - 'Physically correct phase portrait: RK2-integrated damped harmonic oscillator
    produces genuine spiral trajectories, not a stylized approximation.'
  - Fixed point at the origin is explicitly marked with a bold X, directly addressing
    the spec's note that equilibria occur where the trajectory crosses dx/dt = 0.
  - Three initial conditions use matching hollow start-point markers (shape 21, page-background
    fill) and reveal basin-of-attraction structure as the spec suggests.
  - 'Correct Imprint palette in canonical order (#009E73, #C475FD, #4467A3) and correct
    theme-adaptive chrome — both renders are legible with identical data colors and
    only chrome flipped.'
  - Title format, axis labels, and legend exactly match spec conventions; code is
    clean with no unused imports and reproducible via set.seed(42).
  weaknesses:
  - No indication of time direction along the trajectories (no arrows, no color gradient)
    — the spec explicitly suggests this and without it a viewer cannot tell which
    way the system evolves along the spiral, only that it spirals; add direction arrows
    at intervals or a subtle alpha/color gradient from start to fixed point.
  - 'Dark-theme grid lines (panel.grid.major using INK = #F0EFE8) read as fairly bright/prominent
    against the near-black background — soften by lowering grid linewidth or blending
    toward INK_SOFT so grid stays present but recedes behind the data.'
  - coord_fixed(ratio = 1) leaves visible empty margin in the plot panel because the
    x-range (~-2 to 2.5) and y-range (~-2.8 to 2.8) aren't symmetric — consider tightening
    expansion / plot margins so the panel area is used more efficiently.
  - The three spirals overlap heavily in the dense central region near the fixed point,
    making individual trajectories hard to distinguish at the smallest oscillations
    — a slightly reduced linewidth or added alpha in that zone would help disambiguate
    without harming the outer loops.
  - Design excellence is solid but still close to a minimal ggplot2 default look (theme_minimal
    + manual palette) — could gain more visual distinctiveness with e.g. a subtle
    radial or ring annotation emphasizing convergence, per DE-01/DE-03.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1), consistent across the whole panel and legend area.
      Chrome: Title "phase-diagram · r · ggplot2 · anyplot.ai" is dark and fully readable at top-left. Axis titles "Displacement x" and "Velocity dx/dt" are dark and clearly legible. Tick labels (-2, -1, 0, 1, 2 on x; -2, 0, 2 on y) are a softer dark gray, readable against the light background. Grid lines are thin dark lines, visible but not overpowering. Legend on the right sits on a slightly elevated off-white card with dark title "Initial condition" and readable entries.
      Data: Three spiral trajectories in Imprint green (#009E73), lavender (#C475FD), and blue (#4467A3), all spiraling inward toward a black X marker at the origin (the fixed point). Each spiral's starting point is marked with a matching hollow (donut-style) circle. Faint horizontal/vertical reference lines cross at the origin.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17), consistent across panel and legend.
      Chrome: Title is off-white/cream and fully readable. Axis titles are light-colored and legible. Tick labels are a lighter gray, clearly readable against the dark background — no dark-on-dark issue. Grid lines are light/whitish and clearly visible (slightly more prominent than ideal, see weaknesses, but not a legibility failure). Legend sits on a dark elevated card with light text, fully readable.
      Data: Same three spiral trajectories in the identical green/lavender/blue colors as the light render, converging to a white X marker at the origin. Start-point markers use the same hollow-circle styling with dark fill matching the page background.
      Legibility verdict: PASS
