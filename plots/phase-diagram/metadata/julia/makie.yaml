review:
  strengths:
  - Trajectory is colored by elapsed time with the Imprint sequential colormap (green
    -> blue), which turns a static spiral into a clear visual story of time direction
    without any fake interactivity
  - Physically correct nonlinear damped-pendulum ODE (RK4 integration of theta'' +
    damping*theta' + (g/L)sin(theta) = 0) with realistic gravity/length/damping constants,
    not a linearized toy model
  - Theme-adaptive chrome is threaded through every element (title, axis labels, ticks,
    spines, grid, legend box, colorbar, and even the star marker color) and is correct
    in both renders
  - Correct axis mapping (theta vs dtheta/dt) with descriptive units in both axis
    labels, matching the spec's phase-diagram definition
  - 'Title format is exactly right: ''Damped Pendulum · phase-diagram · julia · makie
    · anyplot.ai'''
  - Clean L-shaped spines, subtle 15% opacity grid, generous whitespace, elevated-background
    legend with no frame -- follows the style guide's minimalism rules
  weaknesses:
  - using ColorSchemes is imported but never directly referenced (cgrad is re-exported
    by Makie itself) -- drop the unused import for CQ-03 cleanliness
  - Only a single trajectory/initial condition is shown; the spec notes that multiple
    trajectories from different initial conditions can reveal basin-of-attraction
    structure -- optional, but would raise data/feature richness further
  - Title occupies roughly a third of the plot width at titlesize=20 -- readable and
    not clipped, but on the smaller side for a descriptive-prefixed mandated title;
    a slightly larger titlesize would strengthen the visual hierarchy (DE-01/DE-03)
  - No explicit annotation marking the trajectory start point (t=0) to anchor the
    color-gradient story -- the colorbar communicates it but a small label would sharpen
    the storytelling
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 -- not pure white.
      Chrome: Bold dark title "Damped Pendulum · phase-diagram · julia · makie · anyplot.ai" centered at top, clearly readable. Axis labels "Angular Displacement θ (rad)" and "Angular Velocity dθ/dt (rad/s)" in dark ink, tick labels in a softer grey -- all legible. Grid lines are faint horizontal/vertical guides, not competing with data. Only left/bottom spines are drawn (top/right removed). Legend "Equilibrium (stable fixed point)" sits top-right in a light elevated box with no frame border, fully inside the axes and not overlapping the trajectory. Colorbar on the right labeled "Time (s)" with readable tick labels.
      Data: A single spiral trajectory rendered as a continuous line, colored from green (t=0, brand green #009E73) at the outer loops to blue (~t=12s) at the inner loops, correctly depicting the damped pendulum decaying toward equilibrium. A black 5-point star at the origin marks the stable fixed point.
      Legibility verdict: PASS -- all text reads clearly against the light background, no dark-on-light or light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 -- not pure black.
      Chrome: Same title, axis labels, and tick labels now rendered in light ink/off-white and soft light grey respectively -- fully legible against the dark surface. Grid lines are faint light lines. Legend box uses the dark elevated background (#242420-equivalent) with light text, still frameless. Colorbar labels are light-colored and readable.
      Data: The same spiral trajectory with identical green-to-blue time colormap as the light render -- confirms data colors are held constant across themes. The fixed-point marker flips to white/off-white ink color, correctly theme-adaptive since it's a chrome/reference element, not a categorical data series.
      Legibility verdict: PASS -- no dark-on-dark failures observed; all text and the star marker are clearly visible against the near-black background.
