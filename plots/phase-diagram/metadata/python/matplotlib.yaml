review:
  strengths:
  - Square 2400x2400 canvas with equal aspect and symmetric data-driven limits keeps
    the spiral geometry undistorted
  - Direction arrows run with time (rightward above dx/dt = 0, leftward below) and
    colored start markers make each trajectory traceable from its initial condition
  - Exact analytical damped-oscillator solution with the velocity as the true derivative
    of the position
  - 'Fully theme-adaptive chrome: legend frame on ELEVATED_BG, INK/INK_SOFT text,
    equilibrium marker flips from INK on light to light ink on dark and stays visible
    on the converging curves'
  - Imprint palette in canonical order with identical data colors in both renders
  weaknesses:
  - 'VQ-03 (both): the last two of the four direction arrows per trajectory (indices
    up to len − len//10, t ≈ 45 s) sit within ~0.3 units of the origin, where 10-sample
    spans shrink to stubs and eight arrowheads pile up on the equilibrium marker as
    clutter → keep every arrow on the readable outer turns, e.g. place them within
    the first ~40 % of the samples. Likely cause: np.linspace(len(x)//20, len(x) −
    len(x)//10, 4) arrow indices.'
  - 'DQ-01 (both): trajectory 4 (A=2.0, phase 4.0) is trajectory 3 (A=2.5, phase 2.5)
    shifted by Δt = 1.5/ω_d ≈ 1.52 s (2.5·e^(−0.15·1.52) ≈ 2.0), so the blue curve
    runs under the ochre one from (−1.3, 1.7) onward and only three distinct orbits
    are visible → pick a fourth initial condition that lies on none of the other orbits.
    Likely cause: the starts list (2.5, 2.5) and (2.0, 4.0).'
  - 'Suggestion: label the start markers in the legend (e.g. a ''start'' glyph) so
    the dots read as initial conditions without inference.'
