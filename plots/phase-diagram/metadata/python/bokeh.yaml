review:
  strengths:
  - Segment glyphs colored through a LinearColorMapper field transform give each trajectory
    a continuous imprint_seq time gradient, explained by a native ColorBar titled
    Time (s)
  - Start markers in Imprint positions 1-4 with ink outlines, legend entries listing
    each initial condition
  - Equilibrium X sits on the dashed dx/dt = 0 axis and stays visible where all spirals
    converge
  - Theme tokens applied to every chrome element; both renders fully legible
  - Canvas pinned to 3200x1800 with toolbar_location=None and the CDP viewport override
  weaknesses:
  - 'VQ-03 (both): legend glyphs are drawn at about 10 px while the start markers
    on the plot are 34 px, and the equilibrium entry''s ''x'' shrinks to an unreadable
    blob → legend glyphs closer to the plotted marker size so the x shape reads (about
    +10 px). Likely cause: scatter legend glyphs are scaled to glyph_height=36 with
    the marker size not carried over; set a larger legend glyph size or use a LegendItem
    bound to a size-matched renderer.'
  - 'LM-01 (code): HoverTool(renderers=[line]) binds hover to the loop variable `line`,
    so only trajectory 4 responds in the HTML → collect every segment renderer in
    a list and pass all of them. Likely cause: `line` reassigned in the for-loop before
    HoverTool is created.'
  - 'Suggestion: a few direction arrows on the outer turn would reinforce the clockwise
    time flow already carried by the gradient.'
