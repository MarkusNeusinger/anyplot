review:
  strengths:
  - sns.lineplot with units=CONDITION, estimator=None and sort=False keeps every trajectory
    as one unaggregated curve in time order
  - Direction arrows run with time in both half-planes (rightward above dx/dt = 0,
    leftward below), and every trajectory starts at a page-outlined marker in its
    own color
  - Equilibrium cross at the origin sits on the dx/dt = 0 axis, stays visible where
    the spirals converge, and is explained in the legend
  - Theme tokens threaded through set_theme rc, title, labels, ticks and the legend
    frame; both renders theme-correct
  - Tidy df built from column constants; the plotting code reads only df and the constants
  weaknesses:
  - 'DQ-01 (both): the (0.0, 8.0) trajectory lies almost exactly on the (-1.5, -5.0)
    trajectory, because the (-1.5, -5.0) solution passes through (0, 8) about a quarter
    period after its start; the violet curve is hidden under the blue one from its
    start marker to the equilibrium, so it is not traceable on its own (C4) → choose
    an initial condition that no other trajectory passes through, for example (0.0,
    -6.0) or (-0.5, 3.0). Likely cause: the initial-condition list in the Data block.'
  - 'Suggestion: a time-colored gradient (seaborn hue on the time column with an imprint_seq
    colorbar) for a single trajectory would show the time evolution more strongly
    than the small arrows.'
