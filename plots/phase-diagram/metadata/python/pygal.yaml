review:
  strengths:
  - 'Correct phase-plane mapping: position x (m) on the horizontal axis, velocity
    dx/dt (m/s) on the vertical, each trajectory one smooth 2000-point curve sorted
    by time'
  - 'Motion character reads straight from the shape: the damped trajectory (γ = 0.3
    s⁻¹) spirals inward to the origin while the undamped center traces a closed ellipse;
    the spiral runs clockwise (leftward below the dx/dt = 0 axis), the physically
    correct direction'
  - 'Fixed point drawn as a large #4467A3 dot at (0, 0) on the dx/dt = 0 axis, still
    visible where the spiral''s turns converge'
  - 'Data computed from the closed-form damped-oscillator solution (ω = 2 rad/s),
    so values are exact: undamped velocity amplitude x0·ω = 3 m/s matches the render'
  - 'Idiomatic pygal: one XY chart, per-series options on chart.add (stroke=False,
    show_dots=True, dots_size) turn the one-state trajectory into a marker; theme
    fully threaded through one Style object'
  - Native pygal HTML output keeps hover tooltips and toggleable legend entries for
    each trajectory
  weaknesses:
  - 'Suggestion: the legend swatches sit flush against their labels and the first
    column leaves a wide gap before ''Undamped''; a few pixels of swatch padding and
    an even column layout would tidy the legend row.'
  - 'Suggestion: direction arrows or a time gradient, which the Notes allow, would
    make the clockwise time evolution explicit.'
