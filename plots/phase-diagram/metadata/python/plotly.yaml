review:
  strengths:
  - Correct analytic damped-oscillator solution (x and dx/dt derived from the same
    closed form), both spirals end at the marked equilibrium (0, 0)
  - 'Direction arrows run with time: rightward above the dx/dt = 0 axis and leftward
    below it, on both trajectories'
  - Data-coordinate arrow annotations (axref/ayref='x'/'y') and per-trace hovertemplates
    use plotly's native annotation and hover machinery for the HTML view
  - Emphasized zero lines in INK_SOFT make the dx/dt = 0 axis, where the fixed point
    lives, the plot's reference line
  - 'Theme tokens threaded through every chrome element: both renders theme-correct
    with identical Imprint data colors'
  - Data generation loops over initial conditions into one tidy df; the plot block
    reads only df and the column constants
  weaknesses:
  - 'VQ-02, SC-02 (both): the legend box at the top left covers the start of the purple
    trajectory at (−1.5, 3.0), its initial-condition marker and its first ~0.6 units
    of curve, so that trajectory cannot be traced from its starting point (C4) → place
    the legend in an area without data, e.g. the empty lower-left corner or outside
    the plot area. Likely cause: legend x=0.02, y=0.98.'
  - 'SC-02 (both): the direction arrows'' shafts are straight chords across 30 samples
    that visibly leave the curve (green near x≈−1.2 from dx/dt 0.4 to 1.4; purple
    along dx/dt≈−2.1 from x 0.8 to 0.2) → an arrow span of a few samples so the shaft
    lies on the trajectory. Likely cause: ARROW_SPACING = 30.'
  - 'VQ-06 (both): axis titles ''Position x'' and ''Velocity dx/dt'' carry no units
    for a pendulum → e.g. ''Angle θ (rad)'' and ''Angular velocity dθ/dt (rad/s)''.
    Likely cause: the POSITION and VELOCITY constants.'
  - 'Suggestion: a time color gradient with a color bar (the Notes offer it) would
    show the decay rate more directly than three arrows per trajectory.'
