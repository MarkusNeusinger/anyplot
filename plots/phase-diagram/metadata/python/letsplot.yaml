  strengths:
  - 'Correct phase portrait: three damped-oscillator trajectories spiral inward to
    a clearly marked fixed point at (0,0), each traceable from a hollow start ring'
  - Imprint palette in canonical order with theme tokens threaded through every chrome
    element; both renders fully readable
  - Tidy long data frame with column constants drives axis and legend titles directly,
    as lets-plot idiom intends
  - Canvas, font sizes and title format exactly per the library prompt and the mandated
    title
  weaknesses:
  - 'DE-02 (both): the plot panel is enclosed by a full four-sided frame (dark gray
    in light, mid gray in dark), against the style guide''s L-shaped or no-spine default
    → no top and right border. Likely cause: panel_background=element_rect(fill=PAGE_BG)
    without color=PAGE_BG, so lets-plot draws its default panel border.'
  - 'Suggestion: direction arrows along each spiral (geom_segment with arrow()) would
    show the clockwise time direction as the Notes suggest.'
  - 'Suggestion: the Euler loop could be replaced by scipy.integrate.solve_ivp with
    t_eval=t for a more accurate integration.'
