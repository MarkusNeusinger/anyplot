    title string.'
  - 'VQ-01 (both): legend labels (16) and tick labels (18) at scale 3 read small on
    the 5514 px canvas beside the 22 pt axis titles → about 48–52 px text on a 3200
    px canvas. Likely cause: oversized canvas with unchanged font sizes.'
  - 'VQ-02 (both): legend title ''Initial Condition'' runs over the legend frame on
    both sides → give it room inside the frame. Likely cause: legend frame sized to
    the labels, not the bold title.'
  - 'VQ-06 (both): axis titles ''Position (x)'' and ''Velocity (dx/dt)'' carry no
    units for a pendulum angle → ''Angle x (rad)'' and ''Angular velocity dx/dt (rad/s)''.
    Likely cause: the encoding titles.'
  - 'SC-02 (both): C2 missed: the damped spirals stop after 10 s at radius ~1, nowhere
    near the equilibrium → integrate long enough that each spiral ends at (0, 0).
    Likely cause: range(500) with dt = 0.02 and gamma = 0.15.'
  - 'CQ-01 (code): the Data block opened at line 27 has no column-0 # Plot marker
    after it and no column constants for the x and dx_dt roles → one Data block between
    # Data and # Plot that binds df, with role-commented column constants above it.
    Likely cause: column names typed inline.'
  - 'Suggestion: a sparser grid (0.5 steps) would calm the busy 0.2-step tick rhythm.'
