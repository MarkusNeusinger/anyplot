review:
  strengths:
  - 'Continuous time mapped with imprint_seq (#009E73 → #4467A3) through scale_color_gradient,
    explained by a ''Time (s)'' colorbar'
  - geom_path keeps the trajectory in time order, giving one smooth continuous inward
    spiral
  - Start circle in brand green and end square make the trajectory's direction and
    endpoint readable
  - Exact canvas (3200x1800) and style-guide font sizes; all chrome from theme tokens,
    correct in both themes
  - Data computed in closed form with a correct analytical derivative
  weaknesses:
  - 'DE-02 (both): panel_border draws a full four-sided frame around the panel where
    the phase diagram needs none → L-shaped frame (left and bottom only) or no spines.
    Likely cause: panel_border=element_rect(color=INK_SOFT, ...) in anyplot_theme.'
  - 'VQ-06 (both): axis titles ''Position x'' and ''Velocity dx/dt'' have no units
    while the colorbar reads ''Time (s)'' → e.g. ''Position x (m)'' and ''Velocity
    dx/dt (m/s)''. Likely cause: the X and DX_DT column names.'
  - 'DQ-01 (both): the spiral stops at t = 8 s with amplitude still ~0.6 (30 % of
    the initial 2.0); the innermost loop spans x ≈ -0.65..0.7, so the trajectory does
    not end at the equilibrium as C2 asks → final amplitude under ~5 % of the start.
    Likely cause: gamma=0.15 with t up to 8 (raise gamma to ~0.4 or extend t to ~20
    s).'
  - 'Suggestion: mark the fixed point at the origin with a small marker, as the Notes
    allow.'
  - 'Suggestion: a few direction arrows along the outer loop would reinforce the time
    gradient.'
  image_description: |-
