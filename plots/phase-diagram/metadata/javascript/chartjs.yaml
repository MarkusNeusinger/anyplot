review:
  strengths:
  - 'First trajectory correctly uses Imprint brand green #009E73; subsequent trajectories
    follow canonical Imprint order (lavender #C475FD, blue #4467A3)'
  - Physically accurate underdamped-pendulum RK4 integration (deterministic, no RNG)
    with three distinct initial conditions clearly revealing convergence to the same
    stable spiral equilibrium
  - Equilibrium point marked with a distinct high-contrast crossRot marker using theme-adaptive
    ink color; trajectory start points marked with matching-color circles outlined
    in the page background
  - Theme-adaptive chrome (title, axis titles, tick labels, background, grid) is correctly
    implemented in both renders and the data colors are identical between light and
    dark themes
  - Font sizes explicitly set (title 22, axis titles 16, ticks 14, legend 16) and
    well-proportioned on the 2400x2400 canvas; no text overlap or edge clipping in
    either render
  - 'Nice idiomatic touch: legend.labels.filter hides the unlabeled start-point datasets
    so the legend stays clean with only the three trajectories and the equilibrium
    point'
  weaknesses:
  - No time-direction indicator (arrows or a color gradient along the trajectory)
    even though the spec explicitly suggests this to show time evolution — a viewer
    can currently only infer flow direction from the inward-spiraling shape, not confirm
    it
  - All three trajectories show the same qualitative behavior (damped convergence
    to the single stable equilibrium at the same zeta) — varying the damping ratio
    across trajectories, or adding a case that lingers near dx/dt=0, would broaden
    feature coverage of what a phase diagram can reveal
  - 'The equilibrium dataset uses pointStyle: ''crossRot'', but its legend swatch
    renders as a plain rectangle instead of the crossRot symbol (Chart.js default
    legend behavior) — the legend doesn''t visually match the marker shown on the
    plot; set legend.labels.usePointStyle: true to fix'
  - RK4 integration is implemented via two helper functions (derivatives, integrate)
    — reasonable given the numerical-integration nature of a phase-diagram spec, but
    technically departs from a flat imports-to-plot KISS structure
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Bold dark title "phase-diagram · javascript · chartjs · anyplot.ai" centered at top; a one-row legend below it lists the three trajectory labels (θ0/ω0 initial conditions) plus "Equilibrium (θ=0, ω=0)"; dark axis titles "Position θ (rad)" and "Angular velocity dθ/dt (rad/s)"; dark tick labels at -3.2..3.2 on both axes; subtle light-gray gridlines. All chrome text is clearly readable against the light background.
      Data: Three spiral trajectories in brand green (#009E73), lavender (#C475FD), and blue (#4467A3), each starting from a filled circle at its initial condition and spiraling inward toward a black crossRot ("X") marker at the origin, marking the stable equilibrium. Colors match the canonical Imprint palette order with green first.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title and axis titles, now rendered in light/cream text; tick labels and legend text also light-colored; gridlines are subtle light lines on the dark surface; the equilibrium legend swatch and the "X" marker flip from black to a cream/off-white tone (theme-adaptive ink token). All chrome text is clearly readable against the dark background — no dark-on-dark failures observed.
      Data: The three trajectory colors (green, lavender, blue) are identical to the light render — only the chrome (background, text, grid, equilibrium marker color) flipped, as required.
      Legibility verdict: PASS
