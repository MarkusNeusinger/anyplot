review:
  strengths:
  - 'Legend now correctly uses usePointStyle: true, so the equilibrium point''s crossRot
    marker renders as an "X" glyph in the legend, matching the plotted marker and
    fixing the previous mismatch'
  - Time-evolution direction is now encoded via a per-segment alpha gradient (25%
    → 100% opacity along each trajectory) using Chart.js's segment.borderColor callback
    — directly addressing the spec's suggestion to show time evolution, and a genuinely
    idiomatic Chart.js-specific technique
  - The three trajectories now use distinct damping ratios (ζ = 0.05, 0.15, 0.4) with
    step counts scaled to each trajectory's own time constant, producing visibly different
    qualitative behavior (fast collapse vs. slow lingering spiral) instead of three
    copies of the same regime
  - Physically accurate underdamped-pendulum RK4 integration remains fully deterministic
    (fixed dt, no RNG); theme-adaptive chrome, canonical Imprint palette order, and
    the 2400x2400 canvas proportions are all still correctly implemented in both renders
  - No text overlap or edge clipping in either render; font sizes are explicit and
    well-balanced (title 22, axis titles 16, ticks 14, legend 16)
  weaknesses:
  - The time-direction alpha gradient is correctly implemented but visually subtle
    at normal viewing size — the difference between 25% and 100% opacity is hard to
    perceive against the busy overlapping spirals, especially along the sparser outer
    arcs; a small arrowhead near the equilibrium or a wider alpha range (e.g. 0.1→1.0)
    would make the flow direction unmistakable
  - All three trajectories are still underdamped spirals converging to the same single
    stable equilibrium — varying ζ broadens the pacing (fast vs. slow collapse) but
    doesn't yet show a qualitatively different regime (e.g. an overdamped non-oscillatory
    approach) that would fully exploit the spec's suggestion about basin-of-attraction/limit-cycle
    structure
  - RK4 integration still uses two small helper functions (derivatives, integrate)
    — reasonable for the numerical-integration domain but a minor, unresolved departure
    from a flat KISS script structure
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Bold dark title "phase-diagram · javascript · chartjs · anyplot.ai" centered at top; a one-row legend below it lists the three trajectory initial-condition labels plus "✕ Equilibrium (θ=0, ω=0)" — the equilibrium's legend swatch now renders as an "X" glyph (crossRot), matching the plotted marker (usePointStyle: true fixed the prior mismatch). Dark axis titles "Position θ (rad)" and "Angular velocity dθ/dt (rad/s)"; dark tick labels from -3.2 to 3.2 on both axes; subtle light-gray gridlines. All chrome text is clearly readable against the light background.
      Data: Three spiral trajectories in brand green (#009E73), lavender (#C475FD), and blue (#4467A3), each starting from a filled circle at its initial condition and spiraling inward toward a dark crossRot ("X") marker at the origin. Each trajectory's line is drawn with a per-segment alpha gradient (faint near the start, fully opaque near the equilibrium) to cue the time-evolution direction — visible but subtle against the dense central spirals. The three trajectories use different damping ratios (ζ = 0.05, 0.15, 0.4), producing visibly different loop counts/decay rates (a widely-looping, slowly-decaying purple spiral vs. a tighter, faster-converging green/blue spiral) rather than three copies of the same behavior.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Same title and axis titles, now rendered in light/cream text; tick labels and legend text also light-colored; gridlines are subtle light lines on the dark surface; the equilibrium legend "X" glyph and the plotted crossRot marker flip from dark ink to a light/cream tone via the theme-adaptive ink token. All chrome text is clearly readable against the dark background — no dark-on-dark failures observed.
      Data: The three trajectory colors (green, lavender, blue) and their per-segment alpha gradients are identical to the light render — only the chrome (background, text, grid, equilibrium marker color) flipped, as required.
      Legibility verdict: PASS
