review:
  strengths:
  - Physically accurate RK4 integration of a damped harmonic oscillator across three
    distinct initial conditions, producing spirals that plausibly converge to the
    stable fixed point at the origin.
  - Direction of flow is encoded two ways — triangular arrowheads (d3.symbol/symbolTriangle)
    placed along each trajectory, and a per-segment opacity ramp (0.3→1.0) that encodes
    elapsed time — directly addressing the spec's suggestion to add direction arrows
    or a gradient showing time evolution.
  - An explicit fixed-point marker (open ring) at the origin calls out the equilibrium,
    matching the spec's note that fixed points occur where the trajectory crosses
    dx/dt = 0.
  - Correct Imprint palette usage (brand green first, identical data colors across
    themes) and correct theme-adaptive chrome (background, ink, grid) in both renders.
  - 'Clean, idiomatic D3: scales, axisBottom/axisLeft styled from theme tokens, no
    fake interactivity, deterministic data generation, current v7 API, respects the
    mount-node contract.'
  weaknesses:
  - Axes cross at the origin (a good choice for spotlighting the fixed point), but
    this places the x and dx/dt tick labels inside the plot's interior where the three
    spirals overlap most densely — near v=0 and x=0 the tick text visually competes
    with trajectory strokes. Add a small background halo behind tick text, or offset
    the crossing-axis ticks further from the data, to keep numbers cleanly legible.
  - The lavender trajectory's earliest segments (opacity ≈0.3) become very faint against
    the warm cream background — low alpha combined with a naturally paler hue drops
    close to the accessibility floor on the light theme. Raise the opacity floor (e.g.
    0.45 instead of 0.3) so no segment of any of the three hues becomes hard to see.
  - Each trajectory uses 141 points (STEPS=140), a bit under the spec's suggested
    200-2000-point range for smooth trajectories — RK4 already renders the curves
    smoothly so this isn't visible, but increasing STEPS would better match the spec's
    data-size guidance.
  - Only the single damped-spiral qualitative behavior is shown across all three initial
    conditions; the spec also flags closed loops (limit cycles/centers) as an interesting
    phase-portrait feature to consider — optional, so not a required fix, but would
    add richness to the feature coverage.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Bold dark title "phase-diagram · javascript · d3 · anyplot.ai" centered at top; "Position, x" below the plot; rotated "Velocity, dx/dt" on the left; axes cross at the origin (0,0) rather than at the plot edges, with tick labels in dark ink on both axes; a top-right legend lists the three initial conditions with color swatches matching each trajectory. All chrome text is clearly readable against the light background.
      Data: Three spiral trajectories converge toward an open-ring fixed-point marker at the origin — green (#009E73, x0=2.2/v0=0.0), lavender (#C475FD, x0=-1.8/v0=1.4), and blue (#4467A3, x0=0.6/v0=-2.0). Each trajectory fades from low opacity at its outer/start arcs to full opacity near the center, and carries triangular arrowheads indicating the direction of flow. First series is the required brand green.
      Legibility verdict: PASS (all title/axis/tick/legend text is legible; the lavender trajectory's faint outer arc is the only borderline-low-contrast element, flagged as a weakness, but it's a data element, not text).

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same layout as the light render — title, axis labels, tick labels, and legend text are now rendered in light ink, clearly visible against the dark background. No dark-on-dark text was found anywhere (title, axis labels, tick labels, legend labels all read cleanly).
      Data: Identical trajectory colors to the light render (green, lavender, blue at the same hex values) — confirms only chrome flipped between themes, not data colors. The fixed-point marker's ring fill flips to the dark page background with a light-ink stroke, keeping it visible.
      Legibility verdict: PASS (no dark-on-dark issues; all text and data remain distinguishable from the near-black surface).
