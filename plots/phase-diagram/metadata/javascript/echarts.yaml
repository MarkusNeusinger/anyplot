review:
  strengths:
  - 'First-series color is exactly #009E73 and the remaining two trajectories follow
    the canonical Imprint order (lavender, blue) with identical data colors between
    light and dark renders'
  - Axes are symmetric around the origin and cross at (0,0), which is the idiomatic
    layout for a phase-plane plot and makes the fixed point visually central
  - 'Uses ECharts-specific features beyond a basic line series: markPoint circles
    the initial condition of each trajectory, a markLine draws dashed nullclines (theta=0
    / dtheta/dt=0), and a diamond scatter marker plus label calls out the equilibrium'
  - 'Physically grounded synthetic data: RK4 integration of a damped-pendulum ODE
    with three distinct initial conditions that all spiral into the same fixed point,
    illustrating basin-of-attraction structure as suggested by the spec notes'
  - Title format, axis titles (with units), and legend labels are all descriptive
    and match the mandated pattern
  weaknesses:
  - The 'Equilibrium' label and its diamond marker sit directly on top of the tightly-wound
    spiral centers, overlapping the converging trajectory lines in both renders —
    offset the label further from the origin (e.g. increase markPoint/label distance
    or move it to a clear quadrant) so it doesn't collide with the data.
  - theta0 = 2.5 rad (~143 degrees) and other initial conditions exceed the regime
    where the code comment's 'small-angle approximation' (sin(theta) ~ theta) is physically
    valid; either use smaller initial angles (<~0.5 rad) to match the stated approximation,
    or drop the small-angle framing and describe it as a generic damped linear oscillator.
  - The RK4 integrator is implemented via two helper functions (derivative, integrate)
    rather than inline flat code — acceptable for numerical integration but a flatter
    or more minimal approach would score higher on KISS structure.
  - No direction/time-evolution cue (arrowheads or a color gradient along each trajectory)
    is used, even though the spec explicitly suggests this to show which way trajectories
    evolve over time — currently only the start point is marked, so the viewer must
    infer direction from the spiral's tightening alone.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "phase-diagram · javascript · echarts · anyplot.ai" is centered, dark and crisp. Axis titles "Angular displacement θ (rad)" and "Angular velocity dθ/dt (rad/s)" are dark and legible. Tick labels are a softer gray, clearly readable against the light background. Legend at the bottom lists all three trajectories plus the equilibrium marker, all legible. Gridlines are subtle light gray, with darker axis lines crossing through the origin (x=0, y=0).
      Data: Three spiral trajectories converge from distinct starting points (marked with filled circles) toward the origin. First series (θ₀=2.5) is brand green #009E73, second (θ₀=-1.5) is lavender/purple, third (θ₀=0.3) is blue — matching the canonical Imprint categorical order. A dark diamond marker plus an "Equilibrium" text label sits at the origin where all trajectories converge; the label and diamond visually overlap the tightly wound spiral lines right at the center, creating minor clutter at that one spot. A faint dashed nullcline crosses through the origin.
      Legibility verdict: PASS — all text is readable against the light background; the only issue is spatial overlap of the "Equilibrium" label with data lines, not a contrast/legibility failure.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Title, axis titles, and tick labels have all flipped to light/white tones and remain clearly legible against the dark background. No dark-on-dark text was found anywhere (title, axis labels, tick labels, and legend text are all light-colored). Gridlines are a dim gray, visible but unobtrusive; axis lines through the origin are a lighter gray than the gridlines.
      Data: Same three trajectory colors as the light render (green #009E73, lavender, blue) — confirmed identical hues, only the chrome (background, text, gridlines) flipped. The same "Equilibrium" label/diamond overlap with the spiral center observed in the light render is present here too.
      Legibility verdict: PASS — no dark-on-dark or light-on-light failures observed; brand green remains clearly visible against the dark surface.
