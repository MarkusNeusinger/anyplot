      Data: Three spiral trajectories converge from marked circular starting points toward the origin -- series 1 (θ0=2.5) is brand green #009E73, series 2 (θ0=-1.5) is lavender #C475FD, series 3 (θ0=0.3) is blue #4467A3, matching canonical Imprint order. A small dark diamond marks the true fixed point at the origin; a dashed leader line runs from the origin out to an "Equilibrium (θ=0, dθ/dt=0)" label placed in the upper-right corner, well clear of the converging spirals -- no overlap between the label/leader line and any trajectory.
