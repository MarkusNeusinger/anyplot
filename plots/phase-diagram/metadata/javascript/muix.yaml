review:
  strengths:
  - Four damped-oscillator trajectories (x₀=2.2/v₀=0, x₀=-2/v₀=0.6, x₀=0/v₀=2.6, x₀=1.3/v₀=-2)
    each spiral clockwise into the equilibrium, computed from the closed-form underdamped
    solution (ζ=0.15, ω=1) — the motion's character reads straight from the shape
  - Direction arrows are oriented from the curve tangent and run rightward above dx/dt=0
    and leftward below it, exactly as the spec requires; start markers in the series
    color with a page-colored halo make every trajectory traceable from its initial
    condition
  - The fixed point is drawn as a large ink-token circle with a page-colored halo
    at (0, 0), so it stays visible where the spirals converge, and flips correctly
    between themes
  - 'Idiomatic MUI X v9 composition: ChartsDataProvider + ChartsWrapper + ChartsSurface
    with one hidden linear x axis per trajectory lets LinePlot draw parametric (non-monotone
    x) curves, and useXScale/useYScale hooks place the custom SVG arrows and markers
    in data coordinates'
  - Theme handled through ANYPLOT_TOKENS throughout (pageBg, ink, inkSoft, grid, elevatedBg);
    Imprint palette taken in canonical order from t.palette[i] and identical in both
    renders; skipAnimation set
  - 'Library-native interactivity: the HTML output keeps MUI X''s line tooltips and
    legend for inspecting each trajectory'
  weaknesses:
  - 'VQ-02 (both): the ''Equilibrium (0, 0)'' label box (elevatedBg at 0.9 opacity,
    ~190×28 px spanning x≈0.1–0.75, dx/dt≈0.15–0.3) sits on the inner spiral turns,
    hiding segments of all four trajectories and two direction arrows, and its text
    crosses the green and blue loops → move the label (with a short leader line if
    needed) to an empty area outside the spirals, e.g. near x≈0.6, dx/dt≈2.8, so it
    covers no trajectory. Likely cause: the rect/ChartsText offsets origin.x + 18
    / origin.y - 38 in PhaseMarkers.'
  - 'VQ-06 (both): axis titles ''Position x'' and ''Velocity dx/dt'' carry no units
    although the data defines ω in rad/s → ''Position x (m)'' and ''Velocity dx/dt
    (m/s)''. Likely cause: the X and DX_DT column constants.'
  - 'CQ-01 (code): a standalone helper function arrowPoints() (lines 112–124) adds
    structure beyond the one PhaseMarkers component the scale hooks require → compute
    the three polygon points inline in the arrow map. Likely cause: helper extracted
    for the arrow geometry.'
  - 'CQ-04 (code): lines 284–296 repeat the label, labelStyle and tickLabelStyle already
    set in the xAxis/yAxis configs at lines 235–247 → remove the duplicated props
    from <ChartsXAxis>/<ChartsYAxis> (keep axisId). Likely cause: styling set in both
    the provider config and the axis components.'
  - 'Suggestion: the full both-axes grid at 0.2 steps on x (27 vertical lines) is
    busier than the spirals need; a coarser x tick interval (0.5) would quiet the
    background.'
  - 'Suggestion: the mandated title fills only ~40 % of the width at 22 px; a slightly
    larger title would anchor the layout.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, not pure white.
      Chrome: title "Damped Oscillator · phase-diagram · javascript · muix · anyplot.ai" centered at top in dark ink (~40 % width); y-axis "Velocity dx/dt" and x-axis "Position x" in dark ink; tick labels -2.4…2.6 (x, 0.2 steps) and -2.5…3.0 (y, 0.5 steps) in soft ink; subtle full grid both axes, slightly darker x=0 and dx/dt=0 reference lines; horizontal legend centered at bottom with four line swatches. All readable.
      Data: four clockwise inward spirals converging to the origin — green #009E73 (x₀=2.2, v₀=0), lavender #C475FD (x₀=-2, v₀=0.6), blue (x₀=0, v₀=2.6), ochre (x₀=1.3, v₀=-2); each has a series-colored start dot with page halo and four small tangent arrows pointing right above the dx/dt=0 axis and left below it. A large near-black equilibrium dot at (0,0) with an "Equilibrium (0, 0)" label in a pale rounded box that covers part of the inner turns. First series is #009E73.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17, not pure black.
      Chrome: title, axis titles in light ink; tick labels in light soft ink; grid subtle light lines; legend text light. No dark-on-dark text anywhere.
      Data: identical green, lavender, blue, ochre trajectories, arrows and start dots as the light render; the equilibrium dot flips to light ink (off-white) and the label box to the dark elevated surface — chrome-only flip.
      Legibility verdict: PASS
