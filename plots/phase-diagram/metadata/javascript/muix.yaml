review:
  strengths:
  - Analytic underdamped-oscillator solution (zeta = 0.15) from four initial conditions
    gives four clean inward spirals that end at the origin; the start points render
    exactly at (2.2, 0), (-2, 0.6), (0, 2.6) and (1.3, -2)
  - Direction arrows are computed from the time-ordered path tangent and run rightward
    above the dx/dt = 0 axis and leftward below it, as the spec requires
  - 'Composable MUI X API used idiomatically: ChartsDataProvider + ChartsSurface +
    LinePlot, one hidden x axis per trajectory so each series carries its own x data,
    and a custom SVG layer drawn through useXScale/useYScale'
  - Start markers, arrows and the equilibrium dot carry a page-colored halo, so they
    stay separable where trajectories cross; the equilibrium marker flips ink with
    the theme and stays visible in the converging center
  - Theme tokens threaded through title, axes, grid, legend and annotation; Imprint
    palette in canonical order with brand green first, identical across both renders
  - Axis limits derived from the data, records carry a Time column and are sorted
    by it before drawing; skipAnimation set
  weaknesses:
  - 'Suggestion: the dashed leader from the ''Equilibrium (0, 0)'' label runs diagonally
    across six trajectory curves; placing the label close to the origin marker (or
    shortening the leader) would keep the data area clear.'
  - 'Suggestion: the x axis carries 26 tick labels at 0.2 m steps; a 0.5 m step would
    match the y axis and lighten the vertical grid.'
  - 'Suggestion: drop the small tick marks (the style guide removes them where possible)
    to quiet the axis chrome.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole canvas.
      Chrome: title "Damped Oscillator · phase-diagram · javascript · muix · anyplot.ai" centered at top in dark ink (~70 % width); y-axis "Velocity dx/dt (m/s)" (-2.5 to 3.0), x-axis "Position x (m)" (-2.4 to 2.6); dark-grey tick labels, subtle grid, slightly stronger x = 0 and dx/dt = 0 lines; horizontal legend at bottom with four line glyphs labelled x₀=…, v₀=…; label "Equilibrium (0, 0)" upper-left with a dashed leader to a black dot at the origin. All readable.
      Data: four inward spirals — green #009E73 from (2.2, 0), purple from (-2, 0.6), blue from (0, 2.6), ochre from (1.3, -2) — each with a filled start marker and four small arrowheads pointing clockwise (right above the axis, left below). Spirals wind into the origin.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, axis titles, tick labels and legend text in light ink; grid subtle; leader line and equilibrium label light; the equilibrium dot flips to cream so it stays visible. No dark-on-dark text.
      Data: identical green, purple, blue and ochre trajectories, start markers and arrows as the light render; only chrome changed.
      Legibility verdict: PASS
