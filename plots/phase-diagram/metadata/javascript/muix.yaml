review:
  strengths:
  - Correct phase-diagram construction (Position x vs Velocity dx/dt) built from a
    closed-form damped-harmonic-oscillator solution; four initial conditions spiral
    into a shared equilibrium, clearly revealing basin-of-attraction structure.
  - Explicit equilibrium marker at (0, 0) with a legible backing plate, plus ChartsReferenceLine
    axes at x=0 and y=0 — directly implements the spec note that fixed points occur
    where the trajectory crosses dx/dt = 0.
  - 'Distinctive, genuinely idiomatic MUI X composition-API technique: a per-trajectory
    xAxisId array combined with useXScale/useYScale hooks to place custom start-point
    markers precisely, needed because x is non-monotonic (a spiral revisits x values)
    and rules out a single shared/sorted xAxis.'
  - 'Both renders are theme-correct: warm off-white/near-black backgrounds, first
    series is brand green (#009E73), data colors are identical across themes, and
    only chrome (grid, axis text, reference lines) flips.'
  - 'No clipping in either render — title, axis labels, tick labels, and the bottom
    legend are all fully visible with generous margins (MARGIN bottom: 150 CSS px).'
  weaknesses:
  - No time-direction indicator (arrowheads or a color gradient along each trajectory)
    — the spec explicitly suggests this ('Consider adding direction arrows or color
    gradient to show time evolution'); currently the direction of motion along each
    spiral is ambiguous without hovering the interactive HTML.
  - The four spirals bunch tightly right around the shared equilibrium and become
    hard to individually trace at a glance there — inherent to a multi-trajectory
    damped phase portrait, but a small zoomed inset near the origin would help disambiguate
    the innermost windings.
  - Only the damped (spiraling) regime is demonstrated; the spec notes a closed-loop/periodic
    case as an optional variant worth showing — not a compliance gap, but would add
    feature coverage.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "Damped Oscillator · phase-diagram · javascript · muix · anyplot.ai" centered at top, fully visible, dark ink on the light surface. "Position x" (bottom) and "Velocity dx/dt" (left, rotated) axis titles are dark and clearly legible. Tick labels along both axes are readable dark-gray text. A light gray grid (horizontal + vertical) is subtle but visible. Bold reference lines cross at x=0 and y=0. A 4-entry legend sits below the x-axis title, each swatch matched to a trajectory.
      Data: Four spiral trajectories in distinct Imprint colors — teal/green (#009E73, x0=2.2), magenta/purple (x0=-2), blue (x0=0), and amber/brown (x0=1.3) — each spiraling inward from a colored start-point circle toward a shared black equilibrium marker at the origin, labeled "Equilibrium (0, 0)" on an opaque backing plate for legibility over the dense winding. All curves and markers read clearly against the light background.
      Legibility verdict: PASS — no light-on-light text, no clipped elements at any edge.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Same title, now light/white text, fully visible against the dark surface. Axis titles and tick labels render in light gray/white and are clearly legible — no dark-on-dark failures observed. Grid lines are a dim gray, still visible but subtle. Reference lines at x=0/y=0 keep the same stroke treatment. Legend text and swatches are legible with light text.
      Data: Identical four trajectory colors (teal, magenta, blue, amber) and identical shapes/positions to the light render — only the chrome (background, grid, ink, equilibrium-marker fill which flips from black to white, per its explicit t.ink token) adapted to the theme. Confirms the "only chrome flips" requirement.
      Legibility verdict: PASS — no dark-on-dark text found, all chrome and data elements are clearly distinguishable from the near-black background.
