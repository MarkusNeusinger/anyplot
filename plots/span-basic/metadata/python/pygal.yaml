review:
  strengths:
  - 'Correct span-basic feature set: both a vertical (time-based, Recession Period
    2008-2009) and a horizontal (threshold-based, Risk Zone 140-160) span are shown
    in the same plot, covering both direction cases from the spec.'
  - Semi-transparent fills correctly land inside the spec's 0.2-0.3 alpha range and
    are tuned per theme (0.25 light / 0.3 dark), so the underlying price line stays
    visible through both spans.
  - 'Theme-adaptive chrome is fully correct: the three Imprint data colors are pixel-identical
    between light and dark renders, backgrounds match #FAF8F1/#1A1A17 exactly, and
    all text is high-contrast in both themes.'
  - 'Creative library-specific technique: pygal''s XY chart has no native axvspan/axhspan
    primitive, so the implementation builds closed 5-point polygons to simulate rectangular
    span regions - a genuine workaround distinctive to this library.'
  - Realistic, neutral financial scenario (2008 recession dip, post-recession lower
    plateau) with economically plausible proportions and a real-world event pattern.
  - 'Clean, reproducible KISS code: single flat script, np.random.seed(42), no unused
    imports.'
  weaknesses:
  - 'Semantic color mismatch weakens the storytelling: ''Recession Period'' (a negative
    economic event) is rendered in brand green #009E73, which readers typically associate
    with growth/positive outcomes, while ''Risk Zone'' (a danger/threshold zone) uses
    lavender rather than a warning-associated hue. Per default-style-guide.md''s semantic-exception
    rule, reassign span colors to reinforce meaning - e.g. matte red #AE3030 or amber
    #DDCC77 for the recession/bad-period span, amber #DDCC77 for the risk/warning
    threshold - and let the actual price line (the primary data) keep the brand green
    as the first, most prominent series.'
  - Legend swatches and text sit flush against the left canvas edge with almost no
    margin - add left padding/margin so the legend has breathing room instead of crowding
    the border.
  - Aesthetic still reads close to a well-configured pygal default (standard axis
    box lines, default typography weight) - push further into a distinctive custom
    look (e.g. more refined tick/grid treatment, typographic weight variation) to
    lift it out of 'configured default' territory.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 - not pure white.
      Chrome: Title "span-basic · pygal · anyplot.ai" is dark and centered at top, fully visible with no clipping. "Price ($)" y-axis label (rotated) and "Year" x-axis label are dark and clearly legible. Tick labels (130-210 on y, 2006-2016 on x) are dark and readable. Horizontal dashed gridlines are subtle. Legend (top-left: "Recession Period", "Risk Zone", "Stock Price") is dark text with small color swatches, fully readable but sits very close to the left canvas edge.
      Data: A green (#009E73) translucent vertical rectangle spans 2008-2009 (Recession Period); a lavender (#C475FD) translucent horizontal band spans price 140-160 (Risk Zone); a blue (#4467A3) line traces the stock price from ~$196 in 2006 down through the 2008-2009 recession to a ~$140-150 plateau through 2016. Where the green and lavender fills overlap, the blend reads as a muted teal-gray, which is expected alpha-blending behavior.
      Legibility verdict: PASS - all text is clearly readable against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 - not pure black.
      Chrome: Title, axis labels, tick labels, and legend text are all rendered in a light off-white tone and are clearly visible against the dark background. Gridlines are subtle light dashed lines. No dark-on-dark failures observed anywhere.
      Data: The same green (#009E73), lavender (#C475FD), and blue (#4467A3) hues as the light render - confirmed pixel-identical data colors, only the chrome (background, text, grid) flipped to the dark theme.
      Legibility verdict: PASS - all text is clearly readable against the dark background; no dark-on-dark issues.
