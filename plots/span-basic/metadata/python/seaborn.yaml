review:
  strengths:
  - Both vertical (recession, 2007-12 to 2009-06) and horizontal (target zone, 120-140)
    spans are implemented per spec, each with a distinct semantic Imprint color (matte
    red for the negative recession period, blue for the neutral threshold band)
  - Direct in-plot text labels ('Recession', 'Target Zone') replace a legend, keeping
    the chart uncluttered while still identifying each span unambiguously
  - Dashed boundary lines (axvline/axhline) mark span edges precisely, adding a secondary
    non-color cue so the regions read correctly even under color-vision deficiency
  - 'Clean theme-adaptive chrome: despined axes, subtle y-axis-only gridlines, and
    correct #FAF8F1 / #1A1A17 backgrounds in both renders with identical data colors'
  - Reproducible synthetic data (seeded, realistic monthly sales trend with a plausible
    historical recession dip) and canvas lands exactly on 3200x1800
  weaknesses:
  - Horizontal target-zone span uses alpha=0.16, below the spec's recommended 0.2-0.3
    semi-transparent range — bump to ~0.2 for consistency with the vertical span's
    alpha=0.22
  - Spans rely on matplotlib primitives (axvspan/axhspan) layered under sns.lineplot
    rather than any seaborn-native mechanism — acceptable since seaborn has no dedicated
    span API, but library mastery could be strengthened with a more distinctive seaborn-specific
    touch (e.g. sns.despine(offset=...) or a seaborn-styled annotation)
  - '''Target Zone'' label color (#4467A3) sits on a same-hue blue-tinted span in
    the dark render, giving it comparatively lower contrast than the ''Recession''
    label''s red-on-dark-red — still legible but the weakest-contrast label in either
    render'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1), matches spec.
      Chrome: Title "span-basic · python · seaborn · anyplot.ai" is dark ink, centered, fully visible, comfortably sized (~45% of plot width, not squeezed). Axis labels "Date" and "Sales (thousands $)" are dark ink at consistent size. Tick labels (years on x, values on y) are soft ink-gray, clearly legible. Top and right spines removed; subtle horizontal gridlines at low alpha.
      Data: Green (#009E73) line shows monthly sales trending upward 2005-2012 with a visible dip during the shaded recession period. A pink/red-tinted vertical band (alpha 0.22) covers Dec 2007-Jun 2009 with dashed red boundary lines and a vertical "Recession" text label in matte red. A light blue-gray horizontal band (alpha 0.16) covers the 120-140 range with dashed blue boundary lines and a "Target Zone" text label in blue. All colors are Imprint palette values; first/primary series is #009E73.
      Legibility verdict: PASS — all text (title, axis labels, ticks, in-plot labels) reads clearly against the light background with no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17), matches spec.
      Chrome: Title and axis labels render in light ink (near-white), fully legible against the dark background. Tick labels are soft light-gray, clearly visible. Gridlines remain subtle but present. Spine treatment identical to light render.
      Data: The green line (#009E73) is identical in hue/position to the light render — only chrome flipped, as required. The recession span becomes a dark maroon-tinted band with the same dashed red boundary lines and red "Recession" label, still readable. The target-zone span becomes a dark navy-tinted band with the same dashed blue boundary lines and blue "Target Zone" label; the label sits on a same-hue background, which is the lowest-contrast text in either render but still readable — no full dark-on-dark failure.
      Legibility verdict: PASS — no dark-on-dark failures; all chrome and in-plot text remain distinguishable from the near-black background, though the blue "Target Zone" label has the tightest margin of any text element.
