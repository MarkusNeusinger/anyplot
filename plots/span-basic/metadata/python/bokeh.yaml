review:
  strengths:
  - Demonstrates BOTH span directions in one plot — a vertical BoxAnnotation marking
    the Q4 time window AND a horizontal BoxAnnotation marking the target revenue range
    — going beyond a single-span example to cover the full breadth of the span-basic
    concept.
  - 'Idiomatic bokeh: uses BoxAnnotation (the library''s purpose-built span primitive)
    instead of manual patches/rectangles, plus native Label annotations and a HoverTool
    for interactive tooltips in the HTML output.'
  - 'Theme-adaptive chrome correctly threaded through title/axis/tick/legend/grid
    tokens in both renders; Imprint data colors (#009E73 line, #4467A3 blue span,
    #DDCC77 amber span) are pixel-identical between light and dark, only chrome flips.'
  - Realistic, neutral business scenario (24 months of revenue with seasonal wave
    + noise) that plausibly motivates both a time-window highlight and a value-range
    highlight.
  - Clean KISS code structure, reproducible via np.random.seed(42), correct dual output
    (plot-{theme}.html + plot-{theme}.png) via the documented Selenium screenshot
    pattern.
  weaknesses:
  - 'The ''Target Range'' Label overlaps the data line: the ascending line segment
    between month 17 and month 18 cuts directly through the top of the letter ''A''
    in ''Range'', visible in BOTH plot-light.png and plot-dark.png at roughly x=17,
    y=137. Reposition the label to a data-quiet zone — e.g. anchor it near the left
    edge of the horizontal span (mirroring how ''Q4 Peak Season'' is anchored near
    x=10.2, away from the line) or raise its y-offset well above the local line peak
    at that month.'
  - Horizontal span fill_alpha=0.15 is below the spec's suggested 0.2-0.3 range for
    span fills — the amber target-range band reads noticeably fainter than the vertical
    span's 0.25 alpha. Bump it to ~0.2-0.25 for a more consistent, visible highlight
    without hiding the underlying line.
  - The single-series legend ('Monthly Revenue') is largely redundant — the y-axis
    label already identifies the series, and the two spans carry their own inline
    text labels. Per the style guide's Decoration Removal Checklist, consider removing
    the legend to reclaim canvas space, or keep it only if it is judged to add clarity.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1) — correctly not pure white.
      Chrome: Bold dark title "span-basic · python · bokeh · anyplot.ai" top-left, italic axis labels "Month" (x) and "Revenue (thousands $)" (y) in dark ink, secondary-tone tick labels, boxed legend ("Monthly Revenue") top-left with a light elevated-surface fill, subtle horizontal-only gridlines. All chrome elements are clearly visible against the light background.
      Data: A green (#009E73) line with matching circular markers traces 24 months of revenue (roughly 100-145K$), rising with seasonal wobble. A translucent blue-gray vertical BoxAnnotation spans months 10-12 labeled "Q4 Peak Season" in bold dark text (no overlap with the line). A translucent amber horizontal BoxAnnotation spans revenue 122-135 labeled "Target Range" in bold dark text — this label's bounding box is cut through by the ascending line segment between months 17 and 18 (the line crosses the top of the letter "A" in "Range").
      Legibility verdict: PASS overall (all text is readable against the light background), but flagging the line/label overlap noted above as a VQ-02 defect, not a legibility failure — every letter is still fully legible.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17) — correctly not pure black.
      Chrome: Title and axis labels render in light ink, tick labels and legend text in the softer secondary tone, legend box uses the dark elevated-surface fill with a soft border, gridlines are faint light lines. No dark-on-dark failures — all chrome text is clearly legible against the near-black surface.
      Data: Data colors are pixel-identical to the light render — same #009E73 green line/markers, same blue and amber BoxAnnotation fills (only their border/alpha reads slightly differently against the dark surface, which is expected chrome-only variation). The same "Target Range" label/line overlap from the light render reproduces identically here (line crosses the "A" in "Range").
      Legibility verdict: PASS (no dark-on-dark or light-on-light issues), same line/label overlap defect carried over from the light render.
