review:
  strengths:
  - 'Correctly covers both categorical values of the spec''s `direction` field: a
    vertical span (Recession Period, geom_rect over full y-range) and a horizontal
    span (Risk Zone, geom_rect over full x-range) in the same plot'
  - 'Idiomatic plotnine layering: separate per-layer `data=` dataframes for the rects
    vs. the line (ggplot() + geom_rect(data=spans) + geom_line(data=df)) is a clean
    use of the grammar-of-graphics architecture'
  - Semi-transparent fill at alpha=0.25 matches the spec's 0.2-0.3 guidance and keeps
    the underlying line visible through both span regions
  - 'First data series (price line) correctly uses Imprint #009E73; span fill legend
    uses the next two canonical positions (#C475FD, #4467A3) in order'
  - Explicit font sizes set for every text role (title 12pt, axis_title 10pt, axis_text
    8pt, legend 8-9pt) and all text reads clearly in both light and dark renders
  - Theme-adaptive chrome correctly threaded through backgrounds, grid, and legend
    box for both PAGE_BG/INK/INK_SOFT tokens
  - 'Clean, KISS-structured code: imports -> data -> plot -> save, explicit np.random.seed(42),
    no unused imports'
  weaknesses:
  - The 'Risk Zone' horizontal span (ymin=60, ymax=80) sits entirely below the actual
    price data range (line spans roughly 150-220 in both renders) — it never intersects
    or comes close to the price series, leaving a large disconnected empty gap between
    the data and the highlighted band and wasting roughly 40% of the vertical canvas
    as dead space. Reposition the Risk Zone's ymin/ymax to overlap or sit adjacent
    to a realistic price threshold (e.g. 145-165, just under the post-recession trading
    range) so the highlighted zone visually interacts with the line and reads as a
    meaningful threshold rather than a floating decorative bar.
  - Because the Risk Zone doesn't relate to the visible data, the storytelling reads
    as two unrelated annotations rather than one coherent narrative about risk/recession
    — once the y-range issue above is fixed, consider adding a short text label or
    edge line inside one span (spec explicitly allows this as an optional enhancement)
    to reinforce which period/threshold is being called out.
  - Design Excellence is solid but not exceptional (well-configured custom theme,
    not yet publication-grade) — the wasted vertical space from the Risk Zone placement
    is the main drag on both DE-02 (whitespace balance) and DE-03 (visual hierarchy);
    fixing the placement should lift both.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "span-basic · plotnine · anyplot.ai" centered at top in dark ink, clearly legible. Axis titles "Year" (x) and "Price ($)" (y) in dark ink, tick labels ("2006"..."2016", "100"..."200") in a softer grey. Subtle horizontal + vertical gridlines barely visible against the cream background. Legend box "Highlighted Region" sits to the right of the plot area with a thin border and two swatches ("Recession Period", "Risk Zone").
      Data: Green (#009E73) line tracing a stock price from ~200 in 2006 down to ~155 by 2010, then flat/noisy through 2016. A light lavender vertical band (#C475FD at alpha 0.25) covers 2008-2009 across the full plot height, overlapping the price decline. A light blue-grey horizontal band (#4467A3 at alpha 0.25) spans the full x-axis width near the bottom of the plot (y ≈ 60-80), well below the price line, which never dips near that range.
      Legibility verdict: PASS — all text is dark-on-light and fully readable; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title, axis titles, and tick labels now rendered in light ink/soft-grey, clearly visible against the dark background. Gridlines are faint light lines, still subtle. Legend box uses the elevated dark surface with light text and a soft border, fully legible.
      Data: Same green (#009E73) line, identical shape/values to the light render, confirming data-color consistency across themes. The recession band appears as a muted dark-purple wash (same #C475FD hex, alpha-blended over the dark background) and the risk-zone band as a muted dark navy wash (same #4467A3 hex) — again positioned well below the price line with no overlap.
      Legibility verdict: PASS — no dark-on-dark text; title, axes, ticks, and legend all read clearly against the near-black surface.

    Cross-theme check: Data colors (green line, lavender band, blue-grey band) are identical hex values in both renders; only background/text/grid/legend chrome flipped, as required. The Risk Zone's disconnection from the actual data range is a data-placement issue present identically in both renders, not a theme problem.
