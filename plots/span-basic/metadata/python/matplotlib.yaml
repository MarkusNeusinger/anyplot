review:
  strengths:
  - Both span directions from the spec are implemented (vertical time-based recession
    period, horizontal threshold-based risk zone), with in-span text labels as the
    spec's optional enhancement.
  - Span labels use ax.get_xaxis_transform() / ax.get_yaxis_transform() blended transforms
    so they stay anchored to the span regardless of the data's value range, avoiding
    overlap with the price line by construction.
  - 'Correct Imprint palette application: brand green for the primary series, canonical
    positions 2/3 for the two spans, identical data colors across light/dark, theme-correct
    chrome throughout.'
  - Clean, reproducible, KISS-structured code with no unused imports or over-engineering.
  weaknesses:
  - Legend frame is only semi-transparent (default framealpha), so the price line
    washes out visibly underneath it in the 2004-2005 region in both themes -- set
    leg.get_frame().set_alpha(1.0) for a fully opaque frame, or reposition/shrink
    the legend so it clears the highest price values.
  - Horizontal span alpha (0.18) sits just under the spec's recommended 0.2-0.3 range
    -- bump to ~0.2 for consistency with the vertical span (0.22) and full spec compliance.
  - Design excellence is solid but not yet exceptional -- consider differentiating
    the two span types further (e.g., a subtle edge line on one, distinct label styling)
    to sharpen the visual hierarchy.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 -- not pure white, not dark.
      Chrome: Bold dark title "span-basic · matplotlib · anyplot.ai" centered at top; dark "Year" / "Price Index" axis labels; dark-ink tick labels; subtle horizontal grid lines; boxed legend (upper-left) with dark border and near-white fill. All chrome elements clearly readable against the light background.
      Data: Brand-green (#009E73) "Stock Price Index" line runs 2004-2016, declining sharply through a lavender vertical span (2008-2010 "Recession Period") and settling into a blue-gray horizontal span (70-95, "Risk Zone"). Italic in-span text labels do not overlap the data line. One flaw: the legend frame is only semi-transparent, so the top of the price line (2004-2005, the chart's highest values) visibly washes out underneath the legend box and its color swatches. Legend text itself stays fully readable.
      Legibility verdict: PASS (title/axis/tick text fully readable; the legend-over-data wash-out is a VQ-02 overlap issue, not a legibility failure)

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 -- not pure black, not light.
      Chrome: Title, axis labels, and tick labels render in light ink (#F0EFE8 / #B8B7B0 range) and are clearly visible; no dark-on-dark failures observed. Grid lines subtle but visible. Legend frame uses the dark elevated background with light text, fully readable.
      Data: Line color is identical brand green (#009E73) to the light render, confirming data-color consistency. The vertical span reads as a muted plum and the horizontal span as a muted navy -- these are the same underlying Imprint hexes (positions 2/3) alpha-composited onto the dark background, which is expected and not a palette violation. The same legend-over-data wash-out recurs here, identical in nature to the light render.
      Legibility verdict: PASS (no dark-on-dark text; brand green reads clearly on the dark surface; legend/data overlap noted separately under VQ-02)
