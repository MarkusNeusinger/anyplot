  strengths:
  - Legend frame is now fully opaque (leg.get_frame().set_alpha(1.0)), fixing the
    attempt-1 overlap where the price line washed out underneath it — both renders
    now show clean separation between legend and data.
  - Horizontal span alpha raised from 0.18 to 0.22, now inside the spec's recommended
    0.2-0.3 range and consistent with the vertical span's alpha.
  - New axvline edge markers at 2008/2010 give the time-based span a distinct visual
    treatment from the threshold span, sharpening the visual hierarchy between the
    two span types.
  - Both span directions from the spec are implemented (vertical time-based recession
    period, horizontal threshold-based risk zone), with in-span text labels as the
    spec's optional enhancement.
  - Span labels use ax.get_xaxis_transform() / ax.get_yaxis_transform() blended transforms
    so they stay anchored to the span regardless of the data's value range, avoiding
    overlap with the price line by construction.
  - 'Correct Imprint palette application: brand green for the primary series, canonical
    positions 2/3 for the two spans, identical data colors across light/dark, theme-correct
    chrome throughout.'
  - Clean, reproducible, KISS-structured code with no unused imports or over-engineering.
  weaknesses:
  - 'Title is ''span-basic · matplotlib · anyplot.ai'' but the mandatory format is
    ''{spec-id} · {language} · {library} · anyplot.ai'' — the ''python'' language
    token is missing. Fix: ax.set_title("span-basic · python · matplotlib · anyplot.ai",
    ...); the new string is still well under the 67-char baseline so no fontsize change
    is needed.'
  - Design excellence is solid but not yet exceptional — consider one more differentiator
    (e.g. a short data-driven annotation calling out the trough value) to push Design
    Excellence further above the 'good' tier.
  - The 8pt italic vertical-span label is the smallest text element on the chart —
    comfortably readable at full resolution but borderline at ~400px mobile width;
    consider 9-10pt if headroom allows.
