review:
  strengths:
  - Both span directions are demonstrated — a vertical add_vrect for the 2008-2009
    recession (time-range highlight) and a horizontal add_hrect for the 105-115 target
    zone (value-range highlight) — directly covering the spec's 'direction' categorical
    field.
  - 'Thoughtful semantic color mapping: recession span uses the Imprint palette''s
    deferred semantic-red anchor (#AE3030, position 5, bad/loss role) and the target
    zone uses the canonical lavender (#C475FD, position 2), with the reasoning documented
    in a code comment.'
  - Theme-adaptive chrome is threaded consistently through title, axis titles, tick
    labels, gridlines, legend, and even the span annotation text — both light and
    dark renders are fully legible with no dark-on-dark or light-on-light failures.
  - Realistic, neutral economic-index dataset (recession dip 2008-2009, recovery into
    a growth target band by 2013) with plausible real-world scale and shape.
  - Span fill opacity is 0.25, correctly inside the spec's recommended 0.2-0.3 alpha
    range, keeping the underlying line data visible through both shaded regions.
  - Idiomatic plotly usage — add_hrect/add_vrect with integrated annotation_text/annotation_position
    avoid manual shape+text boilerplate that other libraries would require.
  weaknesses:
  - Design Excellence is solid but not exceptional — the plot reads as a well-executed
    default (subtle grid, clean line/marker styling with a background-colored marker
    edge halo) rather than a fully custom, publication-grade composition. Consider
    a more deliberate typographic hierarchy or a distinctive layout touch to push
    DE-01 further.
  - Grid lines run on both axes at the same subtle opacity; a y-axis-only grid (or
    an even lighter x-axis grid) would sharpen the visual refinement further.
  - Tick label fontsize (10pt at the pre-scale layout size) is legible at full 3200x1800
    resolution but may get thin when the PNG is scaled down to a ~400px mobile thumbnail
    — consider bumping tick fontsize slightly for better small-viewport legibility.
  - Distinctive-feature usage (LM-02) is present (integrated shape annotations) but
    modest — leaning on a more plotly-specific capability (e.g., range slider, custom
    hover templates surfaced in the HTML export) would strengthen library mastery
    beyond what add_hrect/add_vrect alone demonstrates.
