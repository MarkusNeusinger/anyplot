review:
  strengths:
  - 'First series uses the correct brand green #009E73, and the highlighted span uses
    the ANYPLOT_AMBER (#DDCC77) semantic anchor exactly as intended for a warning/caution
    highlighted region.'
  - Theme-adaptive chrome is threaded correctly through both renders — title, axis
    text, tick labels, grid, and legend box all flip correctly with no dark-on-dark
    or light-on-light failures.
  - The 'Recession 2008-2009' text annotation inside the span plus the amber border
    adds a clear storytelling focal point tying the shaded region to the dip in the
    line.
  - 'Clean KISS structure: reproducible via np.random.seed(42), no unused imports,
    correct output filenames (plot-{THEME}.png / .html) via ggsave scale=4.'
  - Title format and legend label ('Recession Period') correctly match the spec and
    mandated title convention.
  weaknesses:
  - Full four-sided panel border/spines are retained around the plot in both renders
    instead of the style guide's default L-shaped (bottom+left) or spineless treatment
    — set panel_border to blank (or otherwise drop top/right borders) for a more refined
    look.
  - Only a single vertical span is shown; the spec allows 1-5 span regions and explicitly
    calls out horizontal spans (threshold/value-range highlighting) as a valid direction
    — the implementation only exercises the 'one vertical span' case, so feature coverage
    of the plot type is incomplete.
  - Layering is generic (geom_rect + geom_line + geom_text) and doesn't lean on anything
    distinctive to lets-plot — the same composition is trivially replicable in matplotlib/plotnine/ggplot2;
    consider a lets-plot-specific touch (e.g. tooltips customization surfaced in the
    HTML export, or geom_smooth) to differentiate it.
  - Aesthetic polish is solid but still reads as a well-configured default rather
    than publication-grade — typography is plain library default with no weight/hierarchy
    variation beyond size.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Title "span-basic · python · letsplot · anyplot.ai" in dark ink at top-left, clearly legible. "Year" x-axis title and "Economic Index" y-axis title in dark ink, tick labels in softer gray-brown. Horizontal gridlines only (subtle, y-axis), vertical gridlines removed. A thin dark border frames all four sides of the plot panel. Legend "Highlighted Region" / "Recession Period" sits at right with an amber swatch, on an elevated off-white box with soft border.
      Data: Green (#009E73) line tracing the economic index from 2006-2011, showing decline into a 2008-2009 recession dip and recovery afterward. A semi-transparent amber (#DDCC77) rectangle spans 2008-2009 with an amber border and the text "Recession 2008-2009" centered near the top of the span, in dark ink.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Title and axis titles render in light/white ink, tick labels in a lighter gray, both clearly legible against the dark background. Gridlines are subtle light horizontal lines. Legend box uses the elevated dark surface with light text, fully readable.
      Data: Line color is identical #009E73 green to the light render. The amber span fill and border render as an olive-toned semi-transparent overlay with amber border — visually distinct from the dark background, and the "Recession 2008-2009" label is in light ink, clearly readable. No dark-on-dark or light-on-light failures observed.
      Legibility verdict: PASS
