review:
  strengths:
  - Demonstrates BOTH span directions from the spec in one plot — two vertical spans
    (Recession Period, Stimulus Response) plus a horizontal threshold span (Target
    Range) layered over a continuous line series
  - Alpha=0.22 fill keeps the underlying economic-index line fully legible through
    every overlapping span region, matching the spec's 0.2-0.3 guidance
  - Semantic color choice for the recession span (Imprint amber anchor for 'warning/caution')
    is a well-reasoned use of the style guide's semantic-exception rule
  - Per-layer interactive tooltips (layer_tooltips().title().line()) give each span
    and the line series distinct hover detail in the HTML export — a genuine lets-plot/ggplot-family
    strength, not decorative
  - 'Theme-adaptive chrome is threaded correctly end-to-end: PAGE_BG/INK/INK_SOFT
    tokens applied to plot/panel background, grid, axis text, title, and legend box,
    verified consistent in both renders'
  - Clean grammar-of-graphics composition (geom_rect + geom_line + geom_text layered,
    scale_fill_manual/scale_color_manual tied to a shared span_colors dict) keeps
    the code compact and idiomatic
  - Realistic, neutral economic-cycle dataset (growth → recession dip → stimulus-driven
    recovery) gives the span regions a coherent narrative purpose rather than being
    arbitrary highlight boxes
  weaknesses:
  - 'Span category colors don''t follow canonical Imprint order and the semantic justification
    is uneven: amber for ''Recession Period'' matches the style guide''s warning/caution
    anchor well, but ''Stimulus Response'' -> blue (#4467A3, position 3) and ''Target
    Range'' -> teal (#2ABCCD, position 6) skip positions 2/4/5 without a strong widely-shared
    real-world color cue backing those specific picks — prefer canonical order (position
    2 lavender, then 3 blue) for the two non-semantic spans, keeping amber only for
    the genuinely warning-coded recession span.'
  - 'Y-axis title ''Economic Index'' is descriptive but omits any unit/scale qualifier
    (e.g. ''Economic Index (pts)'') even though the tooltip data (range_desc: ''95
    - 105 index pts'') shows the unit was already defined — surface it on the axis
    title too.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1), matches spec — not pure white.
      Chrome: Bold dark title "span-basic · python · letsplot · anyplot.ai" top-left, clearly legible. "Year" / "Economic Index" axis titles in dark ink, tick labels in softer gray-ink, both readable. Subtle horizontal-only gridlines. Legend "Highlighted Region" box (off-white elevated fill, soft border) sits to the right of the plot with three swatches: Recession Period (amber), Stimulus Response (blue), Target Range (teal).
      Data: Green (#009E73) line traces a 2006-2011 economic index — declining through a recession, recovering after a stimulus period, then climbing further. Two vertical bands (amber for 2008-2009 recession, blue for the following stimulus period) span the full plot height with in-box text labels ("Recession 2008-2009", "Stimulus Response"). A wide horizontal teal band spans the full x-range marking the 95-105 "Target Range," labeled near its top-right edge. All fills are semi-transparent so the green line stays visible underneath.
      Legibility verdict: PASS — no text is light-on-light; all chrome and annotation text reads clearly against the cream background.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17), matches spec — not pure black.
      Chrome: Title, axis titles switch to light ink (#F0EFE8); tick labels and legend text switch to the softer light-gray token (#B8B7B0); legend box uses the dark elevated fill (#242420). Gridlines remain subtle. Layout is otherwise identical to the light render.
      Data: Same green (#009E73) line, same amber/blue/teal span fills and border colors as the light render — data-layer colors are pixel-identical across themes, only chrome inverted, exactly per the theme-adaptive-chrome rule.
      Legibility verdict: PASS — span label text ("Recession 2008-2009", "Stimulus Response", "Target Range") and all axis/tick/legend text render in light ink against the dark background; no dark-on-dark failures observed.
