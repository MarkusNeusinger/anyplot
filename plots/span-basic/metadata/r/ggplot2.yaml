review:
  strengths:
  - Horizontal span (baseline_zone) now added alongside the vertical recession spans,
    fully demonstrating both values of the spec's 'direction' field — directly resolves
    the attempt-1 weakness about only showing the vertical case
  - Gridlines now use mix_color(PAGE_BG, INK, 0.18) to blend a faint tint instead
    of full-opacity INK, matching the style guide's subtle 15-25%-opacity target —
    a genuine, theme-adaptive ggplot2-specific fix since panel.grid has no alpha channel
  - In-span text labels (recession year labels '2001'/'2008' plus the 'Below baseline'
    annotation) add direct-label storytelling without needing a legend, resolving
    the attempt-1 note about missing in-span labels
  - 'Correct semantic-anchor usage: theme-adaptive neutral for the recession reference
    bands, Imprint amber for the below-baseline warning/caution zone — exactly matches
    the style guide''s semantic-anchor guidance rather than borrowing categorical
    palette slots'
  - Both themes remain fully legible with data colors (green line, gray/amber bands)
    unchanged across light/dark; canvas gate passed with no clipping
  weaknesses:
  - Library Mastery is still fairly generic overall — the mix_color grid-blending
    workaround is a nice ggplot2-specific touch, but the core geom_rect/geom_line/geom_text
    layering could be replicated with minor syntax changes in almost any grammar-of-graphics
    library
  - Tick label size (8pt) sits at the style-guide floor default — a touch larger would
    strengthen legibility at mobile widths without crowding the axis
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white, matches #FAF8F1 — not pure white, not dark.
      Chrome: dark-ink title "Market Index · span-basic · r · ggplot2 · anyplot.ai" (~55% of plot width), dark axis titles ("Year", "Market Index Value"), softer-gray tick labels. Horizontal gridlines only, now a faint blended tint (mix of ink and page background) rather than full-opacity ink — subtle and non-competing. Ticks removed, top/right spines removed. All chrome elements clearly readable.
      Data: single green (#009E73) line tracing a monthly market index from 2000-2013; two gray semi-transparent vertical bands (alpha 0.25, full plot height) mark the 2001 and 2007-2009 recessions, each labeled directly above the band ("2001", "2008") in soft-ink text; a semi-transparent amber horizontal band spans the full x-range from the plot floor up to the y=100 baseline, labeled "Below baseline" in the lower-right in soft-ink text. Where the amber and gray bands overlap, the combined tint reads slightly darker/olive — an intentional, legible layering artifact, not a defect.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black, matches #1A1A17 — not pure black, not light.
      Chrome: title, axis titles, and tick labels rendered in light ink / soft-gray tones, fully legible against the dark surface. No dark-on-dark failures. Gridlines present as a faint light tint (same blending technique, flipped direction), ticks/spines removed same as light theme.
      Data: same green (#009E73) line, same-positioned gray recession bands, and same amber baseline zone as the light render — data colors unchanged between themes, only chrome flipped. The "2001"/"2008" and "Below baseline" labels remain legible against the band tints in this theme too.
      Legibility verdict: PASS
