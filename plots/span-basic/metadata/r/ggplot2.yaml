review:
  strengths:
  - Clean, idiomatic geom_rect() + inherit.aes = FALSE pattern for the span layer,
    correctly overlaid beneath the line via layer order
  - Correct, theme-adaptive use of the neutral semantic color for the span fill rather
    than borrowing a categorical palette slot
  - Strong implicit data storytelling — recession bands visibly line up with market
    downturns in the line
  - Both themes are fully legible with no dark-on-dark/light-on-light failures, and
    the canvas gate passed cleanly
  weaknesses:
  - Gridlines use the full-opacity INK token instead of a faint tint, reading bolder
    than the style guide's 'subtle, 15-25% opacity' target — soften to a lighter gray
    or reduce further
  - Only the vertical-span direction is demonstrated; the spec's direction field explicitly
    covers both 'vertical' and 'horizontal', and the sibling matplotlib implementation
    for this same spec shows both — consider adding a horizontal threshold span (e.g.
    a 'risk zone' value band) to round out feature coverage
  - No in-span text label or edge-line accent, which the spec calls out as an optional
    enhancement worth considering for a stronger basic example
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white, matches #FAF8F1 — not pure white, not dark.
