review:
  strengths:
  - Idiomatic use of Highcharts' native xAxis.plotBands for span/highlight regions
    — leverages built-in library support instead of manually drawn overlay rectangles
  - 'Clean theme-adaptive chrome: all tokens (t.ink, t.inkSoft, t.grid, t.amber) correctly
    threaded through chart/xAxis/yAxis; brand green #009E73 used for the primary series
    in both renders'
  - Realistic, well-motivated scenario (API response latency spiking during scheduled
    maintenance windows) with deterministic seeded LCG data generation
  - Span fill alpha (~0.25 via amber + "40" hex suffix) sits squarely in the spec's
    recommended 0.2-0.3 range, and includes optional in-band text labels ("Maintenance
    1"/"Maintenance 2")
  weaknesses:
  - Only demonstrates vertical spans; the spec's `direction` field (vertical/horizontal)
    implies both variants exist — showing a horizontal threshold span alongside the
    vertical maintenance windows would more fully cover the plot type's feature space
    (as multi-direction implementations in other libraries do)
  - plotBands have no distinguishing border/edge line — the spec's optional 'edge
    lines' enhancement is only partially used (label yes, edge line no); a thin border
    in t.amber on each band would sharpen the region boundary, especially in dark
    mode where the fill blends closer into the background
  - 'tooltip is fully disabled (tooltip: { enabled: false }) — for an interactive-capable
    library this forgoes genuine hover-inspection value in the HTML detail view, even
    though disabling it is a common convention across this codebase''s Highcharts
    implementations'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1) — correct, not pure white. PASS
      Chrome: Title "span-basic · javascript · highcharts · anyplot.ai" in bold dark ink, centered at top, fully readable. Subtitle "API response latency with scheduled maintenance windows highlighted" in muted gray below it, readable. X-axis title "Day of Quarter" and Y-axis title "Response Latency (ms)" in dark-gray ink, both readable with correct units on the y-axis. Tick labels in the same muted ink tone, legible. Horizontal gridlines are subtle but visible.
      Data: Single green line (#009E73, brand green) tracing 60 days of latency, no markers (appropriate for this point density). Two tan/khaki plotBands (semi-transparent amber fill) span the full chart height at days 14-18 and 39-43, each labeled "Maintenance 1" / "Maintenance 2" near the top of the band in muted ink — labels sit clear of the data line, no overlap. The line visibly spikes to ~340-370ms inside both bands vs. a ~110-140ms baseline outside them, telling a clear before/during/after story.
      Legibility verdict: PASS — all chrome and data elements are clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17) — correct, not pure black. PASS
      Chrome: Title and subtitle render in light ink, axis titles and tick labels in light-gray ink — all clearly legible against the dark background. Gridlines are dim but still visible. No dark-on-dark failures detected.
      Data: Line color is identical #009E73 green to the light render — confirmed unchanged, as required. The two plotBands render as a dark olive/khaki tint (amber blended into the dark background) with the same "Maintenance 1"/"Maintenance 2" labels in light-gray ink, readable against the olive fill with adequate contrast.
      Legibility verdict: PASS — all text is readable in the dark theme; data colors match the light render exactly.
