review:
  strengths:
  - 'Correct Imprint palette usage: brand green (#009E73) for the line and the semantically-fitting
    matte-red (#AE3030) anchor for the recession/slowdown spans, identical across
    both themes'
  - Span opacity (0.22) sits squarely in the spec's recommended 0.2-0.3 range, keeping
    the underlying line data fully visible through the shaded regions
  - Direct in-span text labels avoid the need for a legend on this single-series chart,
    a clean minimal design choice per the style guide
  - Deterministic seeded data generation, explicit font sizing on every text element,
    and theme-correct chrome in both renders
  weaknesses:
  - Only a "vertical" span direction is shown. The spec's direction field defines
    both "vertical" and "horizontal" as valid categorical values, and the matplotlib/seaborn/plotly
    implementations of this same spec-id all include a horizontal span (e.g. a value-threshold
    "risk zone" band via axhspan/add_hrect). Add at least one horizontal span so the
    plot demonstrates both direction variants.
  - 'The second span ("2011 slowdown", 2011-07-01 to 2011-12-01) extends past the
    x-scale''s domain max (last data point is quarterly, dated 2011-10-01), so x(d.end)
    extrapolates beyond the inner chart width iw. Confirmed by pixel probe on plot-light.png:
    the chart''s own axis/domain line ends at x=3079px, but the pink span fill continues
    unbroken from x=2955px all the way to x=3199px, bleeding through the entire right
    margin to the canvas edge. This leaves the right margin with zero whitespace while
    the other three margins remain intact, and visually implies the highlighted region
    continues past what the x-axis actually represents. Fix by extending the x-domain
    to cover the full span range, or clamp the rect''s right edge to iw (e.g. Math.min(x(d.end),
    iw) - x(d.start)).'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white, matches #FAF8F1 target.
      Chrome: bold centered title "span-basic · javascript · d3 · anyplot.ai" in dark ink; axis titles "Year" / "Market Index" in dark ink; tick labels in softer ink; y-axis-only subtle gridlines. All clearly readable.
      Data: brand-green (#009E73) line tracing a quarterly market index 2006-2011 (peak ~117, trough ~96); two matte-red (#AE3030) semi-transparent vertical bands ("2007-09 recession", "2011 slowdown") with centered in-band labels, alpha ~0.22.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black, matches #1A1A17 target.
      Chrome: title and axis titles switch to light ink, tick labels to softer light ink, gridlines to a low-opacity light color. No dark-on-dark failures observed anywhere.
      Data: identical brand-green line and identical matte-red span fill hue (rendered as a darker translucent maroon against the dark surface, as expected — only chrome flips, not data color).
      Legibility verdict: PASS

    Additional check performed: pixel-probed the right edge of plot-light.png at y=1200. The chart's own axis/domain line ends at x=3079px (matches iw + margin.left), but the "2011 slowdown" span's pink fill continues unbroken from x=2955px to x=3199px (the canvas edge) — an unintended ~120px bleed through the entire right margin caused by the span's end date (2011-12-01) falling outside the x-scale's domain (max data point 2011-10-01), which the linear/time scale then extrapolates past the inner chart width.
