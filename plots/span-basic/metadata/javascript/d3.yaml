review:
  strengths:
  - 'Both attempt-1 weaknesses are fully fixed: a horizontal "Correction zone (index
    < 97)" span now demonstrates the spec''s second direction, and the x-domain now
    uses d3.extent() across both the series dates and every span''s start/end so the
    ''2011 slowdown'' span no longer bleeds through the right margin — confirmed by
    pixel probe: the span fill and axis domain line both stop exactly at x=3080px
    (= 3200 canvas width − 120px right margin), with clean off-white margin beyond
    that point.'
  - 'Correct Imprint palette usage: brand green (#009E73) for the line, matte-red
    semantic anchor for the recession/slowdown spans, and amber semantic anchor for
    the value-threshold band — identical data colors across both themes, only chrome
    flips.'
  - Direct in-span text labels avoid the need for a legend on this single-series chart,
    a clean minimal design choice, and the technique of unioning series + span dates
    into one scale domain is a thoughtful, non-obvious D3 pattern.
  - Deterministic seeded (LCG) data generation, explicit font sizing on every text
    element, and theme-correct chrome in both renders with no dark-on-dark or light-on-light
    legibility failures.
  weaknesses:
  - Title occupies only ~30% of canvas width (measured via pixel scan) — well under
    the 50-70% comfortable range; a slightly larger title fontsize would strengthen
    the typographic hierarchy without risking overflow.
  - The 24-point quarterly line series has no per-point markers; per the data-density
    heuristic, sparse series (< 50 points) should get prominent markers in addition
    to the line to make individual quarters distinguishable.
  - Where the vertical recession span and the horizontal correction-zone span overlap
    (e.g. 2008-2009 inside the < 97 band), the two semi-transparent fills blend into
    an unlabeled third color — consider a slightly different compositing approach
    or a note so the blended region doesn't read as an unexplained third category.
  - Design polish is still fairly minimal beyond the span highlighting itself (no
    additional refinement like an end-point marker on the line, subtle drop-shadow/separation
    for the span labels, etc.) — DE-01 stays mid-range.
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white, matches #FAF8F1 target (verified pixel value 250,248,241).
      Chrome: bold centered title "span-basic · javascript · d3 · anyplot.ai" in dark ink; axis titles "Year" / "Market Index" in dark ink; tick labels in softer ink; y-axis-only subtle gridlines. All clearly readable, no overflow or clipping at any edge (pixel-probed right edge: span fill and axis line both terminate at x=3080px, leaving a clean 120px off-white margin to the canvas edge).
      Data: brand-green (#009E73) line tracing a quarterly market index 2006-2011 (peak ~117, trough ~96); two matte-red (#AE3030) semi-transparent vertical bands ("2007-09 recession", "2011 slowdown") with centered in-band labels; one amber semi-transparent horizontal band ("Correction zone (index < 97)") spanning the full plot width near the bottom. Alpha ~0.22 throughout, underlying line stays visible through all spans.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black, matches #1A1A17 target.
      Chrome: title and axis titles switch to light ink, tick labels to softer light ink, gridlines to a low-opacity light color. No dark-on-dark failures observed anywhere — all text (including the "Correction zone" label sitting on the olive-toned amber band) remains clearly legible.
      Data: identical brand-green line and identical span fill hues (rendered as darker translucent maroon/olive against the dark surface, as expected — only chrome flips, not data color).
      Legibility verdict: PASS
