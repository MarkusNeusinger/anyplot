review:
  strengths:
  - 'Correct Imprint palette usage: brand green (#009E73) for the data line, semantic
    amber for both span regions — an intentional ''warning/caution'' role fit, not
    a decorative color pick'
  - Demonstrates both span directions from the spec in one chart (vertical maintenance
    window across x, horizontal degraded-latency threshold across y) — full feature
    coverage of the 'direction' field rather than only one case
  - Clever hooks-based workaround (useXScale/useYScale/useDrawingArea) to reproduce
    a reference-area fill since no ChartsReferenceArea ships in the @mui/x-charts
    community package — solid distinctive library mastery within the allowed community
    surface
  - Theme-adaptive chrome is correct and consistent in both renders; realistic, plausible
    dataset (24h API latency with a maintenance-driven spike)
  - Single-series legend correctly hidden per style guide; dashed ChartsReferenceLine
    boundaries mark the span edges cleanly without clutter
  weaknesses:
  - Horizontal threshold span uses fillOpacity 0.12, below the spec's suggested 0.2-0.3
    alpha range for span fills — bump toward 0.2 for consistency with the maintenance
    span (0.25) and the spec's own guidance
  - Span annotation text (fontSize 13) is smaller than the axis tick labels (14) and
    axis labels (16) — bump to at least 14px so annotation text doesn't become the
    weakest-legibility element at mobile/thumbnail scale
  - 'Header comment block omits the license line (e.g. ''// License: @mui/x-charts
    — MIT (community). Pro/Premium are out of scope.'') present in the library''s
    header-style template — add for consistency with other muix implementations'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white, not dark.
      Chrome: Title "span-basic · javascript · muix · anyplot.ai" in dark ink, clearly visible top-left. Y-axis label "Latency (ms)" and x-axis label "Hour of Day (UTC)" both dark and legible. Tick labels (100-340 on y, 0:00-24:00 on x, every 2h) are dark gray and readable. Horizontal grid lines are thin and subtle, do not compete with the data line.
      Data: Single green (#009E73) line with circular markers tracing 24 hourly latency values, sharp spike from ~2:00-5:00 up to ~338ms. Two amber-tinted overlay regions: a vertical band from 2:00-5:00 (the "Maintenance window", labeled in the band) bounded by dashed amber vertical lines, and a horizontal band above the 200ms line (the "Degraded (>200ms)" zone) bounded by a dotted amber horizontal line. Where the two bands overlap (top-left) the fill reads visibly darker/more saturated, which correctly signals the double condition.
      Legibility verdict: PASS — all title/axis/tick/annotation text is clearly readable against the light background; no light-on-light text found.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black, not light.
      Chrome: Title in light/off-white ink, clearly visible. Axis labels and tick labels rendered in light gray, legible against the dark background. Grid lines are thin, low-contrast light lines, subtle but present.
      Data: The data line is the identical #009E73 green as the light render — confirmed no shift in data color between themes. The two amber overlay bands render as a warm olive/brown tint against the dark surface, with the same dashed/dotted amber boundary lines as the light render. Annotation text ("Maintenance window", "Degraded (>200ms)") uses the light ink-soft token and reads clearly against the olive-tinted overlay — no dark-on-dark failure.
      Legibility verdict: PASS — all chrome and annotation text is legible in the dark theme; only the chrome (background/text colors) changed between renders, data colors are identical as required.
