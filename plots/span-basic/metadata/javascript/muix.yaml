review:
  strengths:
  - 'Correct Imprint palette use: primary line is brand green (#009E73), and the maintenance-window
    span uses the amber semantic anchor rather than a custom hex'
  - 'Clean minimal chrome: L-shaped axes, subtle horizontal-only grid, and the single-series
    legend is correctly hidden rather than shown redundantly'
  - Spec-compliant, well-documented workaround for the missing community ChartsReferenceArea
    using useXScale/useDrawingArea hooks, staying entirely within the @mui/x-charts
    community surface
  - Both dashed edge reference lines AND a descriptive 'Maintenance window' text label
    are included, exceeding the spec's optional enhancement notes
  - 'Realistic, neutral, causally coherent scenario: hourly API latency spiking during
    an overnight maintenance window'
  - Title format exact, skipAnimation set, deterministic in-memory data, both themes
    render correctly with identical data colors and only chrome flipping
  weaknesses:
  - Axis and tick labels rely on MUI X default font sizing — no explicit tickLabelStyle/labelStyle
    fontSize set on xAxis/yAxis, unlike the title and reference-line label which are
    explicitly sized
  - Line series uses showMark={false} on sparse 24-point hourly data; per the data-density
    heuristic sparse data should have prominent visible markers — consider showMark
    or per-point markers so each hourly measurement reads as discrete
  - Only one vertical span region is demonstrated; the spec allows 1-5 regions on
    either axis — a second overlay (e.g. a horizontal threshold band) would more fully
    exercise feature coverage
  - The 'Maintenance window' label sits just outside (to the right of) the shaded
    span rather than inside it — placing it inside the highlighted region would tie
    the annotation more directly to what it labels
