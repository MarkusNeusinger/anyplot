review:
  strengths:
  - 'Idiomatic MUI X v9 composition: ChartsContainer with ChartsGrid, LinePlot, MarkPlot
    and the two axes, plus a custom SVG SpanLayer that places the rectangles with
    useXScale/useYScale/useDrawingArea, so each span maps exactly to data coordinates
    and fills the drawing area across the other axis'
  - 'Both span directions are shown: a vertical maintenance window (2:00 to 5:00)
    at full height and a horizontal degraded-latency band (200 to 350 ms) at full
    width, both at 0.28 fill opacity. Gridlines and the green series stay visible
    through them in both themes'
  - 'The data tells a story: the latency spike happens inside the maintenance window
    and enters the degraded band, while the daytime curve stays below it'
  - The span edges are dashed in each span's own Imprint color (lavender, blue). Semibold
    labels sit inside each region and use the ink token, so they are readable in both
    themes
  - Axis limits come from the data and the spans with padding shares, the series is
    drawn above the spans, and the x ticks are formatted as HH:00 every 2 hours
  - Native MUI X tooltip and hover highlighting carry over to the interactive HTML
  weaknesses:
  - 'Suggestion: the ''Maintenance window'' label sits on the 100 ms gridline at the
    bottom of the span; raising it a few px would give it a clean background.'
  - 'Suggestion: the mandated title fills only about 28 % of the width at 22 px; a
    slightly larger size would balance it against the plot area.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 throughout, 3200x1800.
      Chrome: left-aligned semibold title "span-basic · javascript · muix · anyplot.ai" in dark ink. The y axis "Latency (ms)" has ticks from 100 to 360 and the x axis "Hour of day (UTC)" has ticks from 0:00 to 22:00. Ticks are soft dark grey, there are subtle horizontal gridlines, and only the left and bottom axis lines are drawn. All text is readable.
      Data: brand green #009E73 monotone line with white-filled circle markers (24 hourly points). A lavender (#C475FD) vertical span from 2:00 to 5:00 at full height, with dashed edges and the label "Maintenance window" at its bottom. A blue (#4467A3) horizontal span from 200 to 350 ms at full width, with dashed edges and the label "Degraded latency" at its top-left. Where they overlap the patch is a darker purple. Gridlines and the line stay visible through both fills.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, axis titles and the span labels are in light ink, the ticks are light grey, and the gridlines are subtle and visible. There is no dark-on-dark text.
      Data: the same green line, with markers filled in the page color, and the same lavender and blue span colors at the same opacity. Only the blend over the dark page differs: the vertical span reads mauve and the horizontal one navy, and both stay distinct from the page. Brand green is clearly visible.
      Legibility verdict: PASS
