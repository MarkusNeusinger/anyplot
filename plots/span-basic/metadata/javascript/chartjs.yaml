review:
  strengths:
  - 'Idiomatic solution to Chart.js''s lack of a native span/band annotation type:
    an inline plugin hooked into beforeDatasetsDraw draws the shaded rectangles behind
    the line, avoiding the disallowed chartjs-plugin-annotation dependency entirely.'
  - 'Correct Imprint palette semantics: brand green (#009E73) for the primary series,
    matte red (#AE3030, the palette''s bad/loss/error anchor) for the crisis spans
    — a textbook semantic-exception use, not an arbitrary color choice.'
  - 'Theme-adaptive chrome is fully correct in both renders: background, title, ticks,
    grid, and the rotated span labels all remain legible on both the cream and near-black
    surfaces, verified by close crop inspection of the narrow Debt-Ceiling Crisis
    band.'
  - 'Realistic, historically-grounded data: an equity index with a 2008-2009 financial-crisis
    drawdown and a 2011 debt-ceiling-crisis dip, both timed and shaped plausibly against
    real economic history.'
  - 'Clean, deterministic, single-pass code (fixed-seed LCG, no functions/classes,
    correct mount-node contract, animation: false).'
  weaknesses:
  - Only the 'vertical' direction from the spec's categorical `direction` field is
    demonstrated (two vertical spans). The spec explicitly models both 'vertical'
    (x-axis) and 'horizontal' (y-axis) spans, and the sibling matplotlib/seaborn/plotly
    implementations for this same spec-id both include a horizontal threshold/risk-zone
    span alongside the vertical one. Add at least one horizontal span (full-width
    ctx.fillRect across a fixed y-value range, e.g. a 'Low Volatility Zone' index-value
    band) inside the same spanHighlight plugin so both direction variants are covered.
  - 'Design Excellence is solid but not yet distinctive: the span fill and rotated
    label are a nice touch, but there is no additional refinement (e.g. a subtle edge
    line at each span boundary, or differentiated styling between the two span types)
    that would separate this from a well-configured default.'
  - Title sits around ~37% of canvas width even though the descriptive-prefixed title
    (~61 chars) is under the 67-char scale-down threshold and keeps the full 22px
    base size — there is headroom to grow the title modestly (e.g. ~26-28px) for a
    more confident focal point without approaching the 90% overflow ceiling.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "Equity Index · span-basic · javascript · chartjs · anyplot.ai" in bold dark ink at top-center; y-axis title "Index Value (Jan 2006 = 100)" and x-axis title "Date" in dark ink; tick labels in softer gray-brown; subtle horizontal-only gridlines. All clearly legible.
      Data: Single teal-green line (#009E73, the mandated brand-green first series) tracing a monthly equity index from Jan '06 to Dec '12, dipping sharply through a wide reddish-pink shaded band labeled "Financial Crisis" (2008-2009) and a narrower band labeled "Debt-Ceiling Crisis" (2011). Span fill is a semi-transparent matte red, rotated dark-gray label text sits cleanly inside each band without touching or overlapping the line.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title/axis titles now in light off-white ink; tick labels in light gray; gridlines faint but visible. All clearly legible, no dark-on-dark failures observed.
      Data: Same teal-green line, identical shape and identical hex color to the light render (confirmed by close crop-comparison of the Financial Crisis and Debt-Ceiling Crisis regions). Span fill is now a deep maroon appropriate for the dark surface; the rotated span-label text is light gray/white and reads cleanly against the maroon band, including inside the narrow Debt-Ceiling Crisis band (verified via pixel crop — no clipping, no overlap with the line).
      Legibility verdict: PASS
