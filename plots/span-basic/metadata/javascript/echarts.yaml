review:
  strengths:
  - Covers both span directions from the spec — a horizontal markArea for the SLA
    threshold (0-200ms) and a vertical markArea for the traffic-spike incident (13:30-16:30)
    — rather than just one variant
  - 'First series renders in Imprint #009E73 and the SLA-zone tint reuses the same
    green, tying the threshold visually back to the data series it constrains'
  - Semantic amber (t.amber) is used correctly as an intentional highlight for the
    anomalous incident window, matching the style guide's semantic-exception rule
  - All font sizes are explicitly set (title 22, axis names 16, tick labels 14, span
    labels 15) and both renders stay legible with correctly flipped theme chrome (grid,
    axis line, ink colors) while data colors stay identical
  - 'Deterministic, realistic server-latency dataset (24 hourly readings, 80-340ms)
    that tells a clear, neutral story: a mid-afternoon traffic spike breaches the
    SLA target'
  - Idiomatic ECharts markArea usage — two-point-per-region data pairs with per-region
    itemStyle/label, matching the library's recommended annotation pattern
  weaknesses:
  - 'Horizontal SLA span uses itemStyle.opacity: 0.16, slightly below the spec''s
    recommended semi-transparent fill range of alpha 0.2-0.3 — nudge toward ~0.2 for
    a touch more visual presence'
  - Where the amber incident span overlaps the green SLA span, the blended color reads
    as a distinct third region with no callout explaining it — minor clarity nit,
    not a functional problem
  - Design Excellence is solid but not yet publication-tier — a bit more typographic
    hierarchy or a light annotation on the peak value would push it further
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "span-basic · javascript · echarts · anyplot.ai" is bold dark text, centered, fully visible and not clipped. Axis names "Time of Day" and "Response Latency (ms)" and tick labels are dark/soft-ink and clearly readable against the light background. Horizontal gridlines at 100/200/300/400 are subtle gray, visible but not dominant. Vertical gridlines are hidden (deliberate refinement).
      Data: A single green (#009E73) line with circular markers tracks latency across 24 hourly readings, rising sharply to ~310-340ms between roughly 13:30 and 16:30 before falling back to baseline. A light green band spans the full x-axis from y=0 to y=200 labeled "SLA target (≤200ms)"; a semi-transparent amber vertical band spans ~13:30-16:30 labeled "Traffic spike incident," overlapping the SLA band where the two intersect.
      Legibility verdict: PASS — no text is light-on-light; all labels, ticks, and annotations are clearly readable.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Title and axis text render in light/white tones, fully legible against the dark background. Gridlines are subtle light gray, still visible without dominating. No dark-on-dark text anywhere — tick labels, axis names, and span labels (rendered in the theme's soft-ink token) are all clearly distinguishable from the near-black surface.
      Data: The line and markers remain the identical #009E73 green seen in the light render — confirmed no hue shift between themes. The SLA band renders as a dark teal-green translucent fill and the incident band as a warm olive/brown translucent fill, both still readable against the dark background and visually distinct from the base surface.
      Legibility verdict: PASS — brand green reads well on both surfaces, and no chrome element fails the dark-mode contrast check.
