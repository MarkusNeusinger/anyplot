review:
  strengths:
  - Correct use of vspan! for both the incident and maintenance highlight regions
    with alpha (0.25, 0.2) inside the spec's suggested 0.2-0.3 range, keeping the
    underlying latency line fully visible.
  - 'Thoughtful semantic color choice: the amber anchor is used for ''Incident: Database
    Failover'' (warning) and the muted anchor for ''Scheduled Maintenance'' (neutral/planned)
    instead of pulling from the categorical pool — correctly follows the style guide''s
    semantic-anchor guidance rather than defaulting to ordinal palette slots.'
  - 'Clean theme-adaptive chrome: title/axis/tick colors, grid opacity via RGBAf(INK...,
    0.15), and a transparent frameless legend all flip correctly between renders while
    the data green (#009E73) stays identical.'
  - Realistic, well-scaled synthetic data (90-day API latency monitoring window in
    ms) with narratively-connected events (incident spike, maintenance bump) tied
    directly to the legend labels — solid data storytelling for a 'basic' spec.
  - Clean KISS script structure, seeded RNG (Random.seed!(42)), single file handles
    both themes via ANYPLOT_THEME, canonical title format matches exactly.
  weaknesses:
  - Only vertical spans are demonstrated; the spec's categorical 'direction' field
    (vertical vs horizontal) is never exercised as horizontal, so the plot never shows
    the 'threshold visualization' use case called out in the spec notes. Not a required
    feature, but a missed opportunity for fuller feature coverage.
  - Beyond the span coloring and theme-token cleanup, the design stays fairly plain
    — no in-span text label or edge line (spec lists these as optional enhancements)
    to give the highlighted regions a bit more visual distinction from each other
    and from the grid.
  - Legend swatches for the two spans are flat, unbordered color patches — a thin
    edge stroke on the swatches (or a subtle span border matching the fill hue) would
    help the muted 'Scheduled Maintenance' gray read more distinctly against the plot's
    own light grid lines.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1-consistent), not pure white.
      Chrome: Bold dark title "span-basic · julia · makie · anyplot.ai" centered at top; dark axis titles "Day of Monitoring Window" (x) and "API Response Latency (ms)" (y, rotated); soft gray tick labels on both axes; subtle horizontal-only gridlines; left/bottom spines only (top/right removed); frameless top-left legend listing "Incident: Database Failover" (amber swatch), "Scheduled Maintenance" (gray swatch), "Response Latency" (green line swatch).
      Data: Single green (#009E73) latency line zig-zagging between ~103-180ms across 90 days, with two semi-transparent vertical bands — a pale amber/olive band around days 34.5-41.5 coinciding with a sharp spike to ~180ms, and a light gray band around days 64.5-70.5 coinciding with a smaller bump to ~144ms.
      Legibility verdict: PASS — all text is clearly readable against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17-consistent), not pure black.
      Chrome: Same layout as light — white/near-white title and axis titles, lighter gray tick labels, subtle horizontal gridlines, left/bottom spines only, frameless legend with light text.
      Data: Same green (#009E73) latency line and same data shape/values as the light render, confirming data colors are identical across themes. The amber span now reads as a dark olive-brown band and the muted span as a dark charcoal band — both still visibly distinct from the near-black page background and from each other.
      Legibility verdict: PASS — all text (title, axis labels, tick labels, legend) is clearly readable against the dark background; no dark-on-dark failures observed.
