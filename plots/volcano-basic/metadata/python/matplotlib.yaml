review:
  strengths:
  - 'Status colors follow the spec''s semantic triple inside the Imprint palette:
    Imprint blue for down, Imprint matte red for up, the muted anchor for non-significant,
    identical in both themes'
  - Two-tier marker hierarchy (s=14 at alpha 0.5 for the gray mass, s=22 at alpha
    0.8 for significant features) keeps 2000 points readable as density while the
    colored arms stand out
  - Threshold lines drawn above the cloud at reduced alpha stay visible through the
    points in both themes
  - 'Fully theme-adaptive chrome: ticks, spines, grid, legend frame and gene names
    all read correctly on #FAF8F1 and #1A1A17'
  - 'Clean adaptable-code structure: column constants, one tidy df, a group table
    driving a single scatter loop, canonical 3200x1800 canvas'
  weaknesses:
  - 'VQ-02 (both): the ''Gene_668'' label sits on the Gene_262 point at about (−4.9,
    4.6) and its baseline touches the ''Gene_1591'' label just below → every name
    clear of other points and of the neighbouring label by a few px. Likely cause:
    the staircase offset xytext=(dx, 3 + 9 * (k % 3)) stacks the five left-side labels
    into the crowded upper-left arm regardless of where the neighbours are.'
  - 'DQ-02 (both): the labelled features read Gene_1971, Gene_262, Gene_209 … — placeholder
    identifiers that make the gene-expression scenario look generic → plausible gene
    symbols for the features. Likely cause: the GENE column is built from f"Gene_{i}".'
  - 'Suggestion: thin leader lines from each staggered name to its point would make
    the name-to-point pairing unambiguous where the offset lifts a label well above
    its point (Gene_1971, Gene_209).'
