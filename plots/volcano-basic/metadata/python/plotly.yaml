review:
  strengths:
  - Native add_hline/add_vline threshold lines at -log10(0.05) and ±1, dashed in INK_SOFT
    and visible through the points in both themes
  - 'Semantic exception applied correctly: up-regulated in matte red #AE3030, down-regulated
    in #4467A3, gray non-significant mass at lower size and opacity'
  - Clean six-zone adaptable script with column constants and a data block that a
    user can swap for their own table
  - hovertemplate carries gene name, log2FC and -log10(p) for the interactive HTML
    view
  weaknesses:
  - 'VQ-07 (both): the non-significant points use the INK_SOFT chrome token (#4A4A44
    / #B8B7B0), a text color rather than an Imprint data color or anchor → the theme-adaptive
    muted anchor (#6B6A63 light / #A8A79F dark). Likely cause: INK_SOFT passed as
    the ''Not significant'' group color.'
  - 'DQ-02 (both): the labelled features read as placeholders (Gene_354, Gene_201,
    Gene_402, Gene_273, Gene_162) → plausible gene symbols for the features. Likely
    cause: GENE column built as f"Gene_{i}".'
  - 'Suggestion: a slightly darker annotation arrow color would tie the labels to
    their points more firmly in the light render.'
