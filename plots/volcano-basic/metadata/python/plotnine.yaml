review:
  strengths:
  - Exact 3200x1800 canvas with the library prompt's text sizes (title 12 pt, axis
    titles 10 pt, ticks 8 pt), readable in both themes
  - Status computed vectorised with np.select and ordered via pd.Categorical plus
    scale_color_manual(limits=...), so blue/gray/red map to Down/Not significant/Up
    in legend order
  - Threshold lines at -log10(0.05) and ±1 derived from named constants and drawn
    in INK_SOFT, visible through the points on both backgrounds
  - Marker size 1.8 with alpha 0.65 lets the dense gray mass read as density
  weaknesses:
  - 'VQ-02 (both): the Gene_469 and Gene_478 labels above the up-regulated arm collide,
    the end of ''Gene_469'' running into ''Gene_478'' by roughly 25 px horizontally
    at about the same height → no overlap between labels (at least 4 px clear). Likely
    cause: geom_text with a fixed nudge_y for two top features about 0.3 log2 units
    apart; label fewer features per side or use a smaller label size, without moving
    the points.'
  - 'VQ-01 (both): the gene-name labels at 6 pt read small beside the 8 pt tick labels
    → 8 pt (+2 pt). Likely cause: geom_text(size=6).'
  - 'VQ-07 (both): the non-significant mass uses a custom gray #8A8A82 → the style
    guide''s theme-adaptive muted anchor (#6B6A63 light / #A8A79F dark). Likely cause:
    MUTED = "#8A8A82".'
  - 'DQ-02 (both): the labelled features read as generic identifiers Gene_416, Gene_443,
    Gene_478 … → plausible gene symbols for the labelled features. Likely cause: GENE
    column built from f"Gene_{i + 1}".'
  - 'Suggestion: give the legend a little inner padding; the title ''Significance''
    and the entry ''Down-regulated'' sit flush against the legend frame.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, not pure white.
      Chrome: title "volcano-basic · python · plotnine · anyplot.ai" in dark ink at the top centre; axis titles "Log2 fold change" and "-Log10(p-value)" dark; tick labels in soft gray; subtle grid; full panel frame in INK_SOFT; legend "Significance" on an elevated light box at the right. All readable.
      Data: about 500 points; 400 gray non-significant points form a mound below the dashed horizontal line at about 1.3; a blue down-regulated arm at log2 FC -3.6 to -1.5 and a red up-regulated arm at 1.3 to 4.0, both at -log10 p 2.0 to 3.6. Dashed vertical lines at ±1. Six small gene labels (Gene_416, Gene_415, Gene_443 on the left; Gene_469, Gene_478, Gene_475 on the right) sit just above their points; Gene_469 and Gene_478 collide. Categorical data uses the semantic up/down exception (Imprint blue #4467A3, red #AE3030), so no #009E73.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17, not pure black.
      Chrome: title and axis titles in light ink, ticks in light soft gray, frame and dashed threshold lines in light gray, legend on a #242420 box with light text. No dark-on-dark text.
      Data: identical blue, gray and red point colors and positions as the light render; only chrome flipped. Same Gene_469 / Gene_478 label collision.
      Legibility verdict: PASS
