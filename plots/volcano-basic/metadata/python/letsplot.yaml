review:
  strengths:
  - 'Status colors follow the Notes through the Imprint semantic exception: matte
    red #AE3030 for up, Imprint blue #4467A3 for down, and the theme-adaptive muted
    anchor for non-significant features'
  - All three threshold lines drawn at their values in dashed INK_SOFT, visible through
    the points in both themes
  - Correct 3200x1800 canvas with library-prompt font sizes; all text readable in
    both themes
  - 'Clean adaptable structure: column constants with role comments, a separate Data
    block and a Plot block reading only df'
  - HTML export keeps lets-plot's native hover tooltips for each gene
  weaknesses:
  - 'DE-02 (both): the major and minor grid is drawn in full-opacity INK (#1A1A17
    light / #F0EFE8 dark) and the panel carries a four-sided frame, so the grid competes
    with the points → grid at the style guide''s 15 % ink (for example #DAD8D1 light
    / #3A3A36 dark), no minor grid, and an L-shaped or no frame. Likely cause: panel_grid_major/minor=element_line(color=INK)
    and theme_minimal''s panel border kept.'
  - 'DQ-03 (code): within each arm -log10 p is drawn from a flat uniform(1.5, 3.5)
    independent of fold change, so the arms read as rectangles instead of rising with
    |log2 FC| → let -log10 p grow with |log2 FC| (for example a z-test p-value from
    fold change over a standard error). Likely cause: the tiered np.random.uniform
    loop at lines 52–59.'
  - 'CQ-04 (code): a per-gene for-loop with if/elif assigns the p-value tiers (lines
    52–59) → one vectorized np.select over np.abs(log2_fc) with three np.random.uniform
    arrays, as the Status column already does. Likely cause: element-wise loop kept
    from an earlier version.'
  - 'Suggestion: label the five most significant features by name, which the Notes
    allow, using geom_text with a gene label column.'
