review:
  strengths:
  - 'Theme tokens threaded through every chrome element: both renders read cleanly,
    the muted anchor for the gray mass flips with the theme'
  - 'Semantic coloring: matte red #AE3030 for up, Imprint blue for down, INK_MUTED
    for not significant, exactly as the Notes ask'
  - Thresholds as native bokeh Span annotations at -log10(0.05) and ±1, drawn from
    constants rather than typed numbers
  - 'Clean adaptable structure: column constants, a Data block binding df, np.select
    classification, one loop over status groups'
  - HoverTool with formatted status / fold change / p-value fields for the HTML view
  weaknesses:
  - 'DQ-03 (both): the strongest hit reaches only -log10 p ≈ 2.6 (p ≈ 0.002) across
    2000 genes, far below the -log10 p of 10+ that the top hits of a real differential
    expression study reach, so the arms barely rise above the 1.3 threshold → let
    the most significant features reach roughly -log10 p 8–15 (about +6 to +12). Likely
    cause: base_pvals drawn from uniform(0.001, 1) and only scaled by (1 − 0.7·fold_effect),
    which floors p near 0.001.'
  - 'Suggestion: label the five or so most significant features by gene name, which
    the Notes allow.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 on both the plot area and the border.
      Chrome: bold title 'volcano-basic · python · bokeh · anyplot.ai' top left in near-black; axis titles 'Log₂ Fold Change' and '-Log₁₀ (P-value)' in dark ink; ticks -4..6 and 0..2.5 in INK_SOFT; subtle grid; legend top right on an elevated panel. All readable.
      Data: ~2000 gray (INK_MUTED) points at alpha 0.5 form the dense base; blue #4467A3 down-regulated points upper left, matte red #AE3030 up-regulated points upper right; dashed horizontal threshold at 1.3 and vertical thresholds at ±1 visible through the points. No #009E73 needed: semantic up/down/neutral coloring.
