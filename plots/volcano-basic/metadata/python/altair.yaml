review:
  strengths:
  - 'Status colors follow the spec''s semantics on the Imprint palette: up-regulated
    in red #AE3030, down-regulated in blue #4467A3, non-significant in the theme-adaptive
    MUTED gray. The data colors are identical in both renders.'
  - alt.Order draws the colored significant points above the gray mass, so both arms
    stay readable through the dense center.
  - Threshold rules sit at exactly ±1 and 1.3 (named constants). Their INK dashes
    stay visible through the points in both themes.
  - The axis domains come from the data (a symmetric x range around zero, nice=False)
    and are not typed numbers. Column constants and escaped fields keep the code adaptable.
  - Formatted tooltips (.2f) in the HTML output support inspecting each feature.
  - Pad-only canvas handling lands exactly on 3200×1800 without cropping.
  weaknesses:
  - 'Suggestion: name a handful of the top significant features (highest -log10 p
    in each arm), which the Notes allow.'
  - 'Suggestion: the x domain is rounded up to ±6 while the data ends near ±5.2, leaving
    thin empty strips at both sides; ceiling to the nearest 0.5 would tighten it.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 over the full 3200×1800 canvas, padded evenly around the chart.
