      Data: 2000 circles at 0.55 opacity. Up-regulated in red #AE3030 on the right arm, down-regulated in blue #4467A3 on the left arm, non-significant in gray #6B6A63 in the central mass. Dashed INK threshold rules at x = ±1 and y = 1.3 show through the points.
