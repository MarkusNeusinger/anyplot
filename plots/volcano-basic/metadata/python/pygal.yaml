review:
  strengths:
  - 'Semantic status colors drawn from the Imprint palette: matte red #AE3030 for
    up-regulated, blue #4467A3 for down-regulated and the theme''s INK_MUTED gray
    for the non-significant mass, identical in both renders'
  - Points carry 0.65 alpha, so the dense non-significant base reads as density, and
    all three dashed threshold lines (-log10(0.05) ≈ 1.3, log2 FC ±1) are drawn in
    the ink token and stay visible through the points in both themes
  - Each point is passed as a pygal value dict with its gene label, so the HTML output
    shows the gene name in a native tooltip, and the threshold lines use per-series
    stroke_style dasharray
  - Text sizing follows the 3200×1800 pygal baseline (66/56/44 px) and every element
    is readable in both themes; the mandated title is correct
  - 'Adaptable layout: column-name constants, a tidy df data block, and plot code
    that reads only df and the constants'
  weaknesses:
  - 'VQ-03 (both): the three threshold-line legend entries show solid filled squares,
    while the lines they explain are dashed strokes, so the legend glyph does not
    match the mark → a line sample (or no legend entry) for the threshold series.
    Likely cause: pygal''s default square legend box for the three stroke-only series
    added with chart.add(..., stroke=True, show_dots=False).'
  - 'DQ-01 (both): significance is drawn independently of effect size (p uniform in
    0.001–0.9 for the base, 0.0001–0.01 for the 100 changed genes), so the colored
    groups sit as two flat bands between y≈2 and y≈3.8 instead of arms that rise with
    |log2 FC| → derive the p-value from the fold change (for example a test statistic
    proportional to |log2 FC| plus noise) so significance grows outward. Likely cause:
    the p_value generation lines.'
  - 'DQ-02 (code): the features are named "Gene 0" … "Gene 499", which read as generic
    placeholders in the HTML tooltips → plausible gene symbols. Likely cause: the
    GENE list comprehension f"Gene {i}".'
  - 'CQ-01 (code): a helper function rgba() is defined to bake alpha into the series
    colors → drop it and set transparency through the Style object (opacity=POINT_ALPHA,
    with the threshold lines kept opaque), so the file has no functions. Likely cause:
    def rgba(hex_color, alpha).'
  - 'Suggestion: label a handful of the most significant features by name, which the
    Notes allow.'
  - 'Suggestion: tightening the y range to just above the highest point (about 4 instead
    of 5) would give the arms more height.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across canvas and plot area.
      Chrome: title "volcano-basic · python · pygal · anyplot.ai" centered at top in dark ink; y-axis title "-Log₁₀(p-value)", x-axis title "Log₂ Fold Change"; tick labels 0–5 and -4–4 in dark text; dotted subtle grid; two-row legend at the bottom (Not significant / Up-regulated / Down-regulated, then p = 0.05 / log₂ FC = -1 / log₂ FC = +1). All text readable.
      Data: 500 points: a gray (#6B6A63, alpha 0.65) mass centered on x=0 near the base, about 50 red (#AE3030) up-regulated points at x≈1–3.4, y≈2–3.5, about 50 blue (#4467A3) down-regulated points at x≈-3.5 to -1, y≈2–3.8. Dashed dark-ink horizontal line at y≈1.3 and vertical lines at x=±1. Threshold legend swatches are solid black squares, not dashed line samples. No brand green (the status colors are semantic, as the spec asks).
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
