      Data: identical red and blue status colors and positions to the light render; the gray mass uses the dark theme's INK_MUTED #A8A79F and reads as light gray; threshold lines dashed in light ink and clearly visible; threshold legend swatches are solid light squares.
      Legibility verdict: PASS
