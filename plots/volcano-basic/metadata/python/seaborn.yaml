review:
  strengths:
  - Status categories drive sns.scatterplot through hue, hue_order and a palette dict,
    and the column constants title the axes directly, the idiomatic tidy-data path
  - Legend sits in the empty wedge above the volcano's center, covering no data point
    in either theme
  - Significant features are drawn after the gray mass, so the red and blue arms stay
    on top
  - Theme tokens are threaded through set_theme rc, so every text element reads in
    both themes
  weaknesses:
  - 'DQ-02 (both): the non-significant genes lie on a near-deterministic curve (-log10
    p = |log2FC|^1.5 times a factor in 0.8-1.5), so the base reads as a thin parabola
    where no near-zero fold change ever has a moderate p-value, unlike real differential-expression
    results → generate p-values with independent noise (for example a mixture of null
    uniform p-values and effect-driven ones) so the base spreads vertically. Likely
    cause: the base_pvalues formula.'
  - 'Suggestion: label a few of the top significant genes by name, which the Notes
    allow.'
  - 'Suggestion: a seaborn-specific touch such as sns.set_context could set the text
    scale in one place.'
