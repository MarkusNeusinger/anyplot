    standard for volcano plots, and the code documents this as an intentional Imprint
    semantic exception rather than an unexplained deviation
  - 'Realistic RNA-seq data generation: independent noise term prevents a deterministic
    ''V'' shape, producing a plausible scattered cloud typical of real differential-expression
    results'
  - Clean, idiomatic Makie code — KISS structure, exact 3200×1800 canvas via resolution=(1600,900)+px_per_unit=2,
    only used imports, seeded RNG
  weaknesses:
  - Gene-label annotations (fontsize=11) sit noticeably smaller than the rest of the
