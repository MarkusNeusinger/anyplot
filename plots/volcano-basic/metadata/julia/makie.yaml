review:
  strengths:
  - Domain-correct, explicitly documented semantic color exception (gray/blue/red)
    rather than defaulting to Imprint categorical order
  - Alpha differentiated by significance tier (0.45 non-sig vs 0.75 sig) manages overplotting
    while preserving visual hierarchy
  - Threshold lines (hlines!/vlines!) clearly demarcate the significance/effect-size
    cutoffs called out in the spec
  - Theme-adaptive chrome is correctly and completely threaded through (background,
    spines, grid, ticks, legend) with identical data colors in both renders
  weaknesses:
  - Spec suggests labeling top significant features by name — not implemented
  - Data-generation formula ties significance too deterministically to fold change,
    producing an artificially clean V-shape instead of a noisier realistic cloud
  - No use of Makie's text!/annotation features — a more distinctive library capability
    left unused
