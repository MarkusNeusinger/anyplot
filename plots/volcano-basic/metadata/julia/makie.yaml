    — consider raising titlesize slightly (e.g. 22-24) since the current title text
    is short
  - The dense non-significant/down/up clouds overlap moderately near the threshold
    boundaries — a slightly lower alpha (e.g. 0.35) on the non-significant layer would
    reduce midfield clutter without hiding the signal
  - Library Mastery is solid but conventional — all primitives used (scatter!, hlines!/vlines!,
    text!, axislegend) are Makie basics; a more distinctive Makie-specific touch (e.g.
    a custom Label subtitle, or linked axis decorations) would strengthen LM-02
