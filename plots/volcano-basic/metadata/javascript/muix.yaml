review:
  strengths:
  - Native ChartsReferenceLine children draw the -log10(0.05) line and both ±1 fold-change
    lines at their exact values, dashed and visible through the points in both themes,
    labelled in reader terms (p = 0.05, FC = ±2).
  - 'Status colors follow the omics convention via the semantic exception: up-regulated
    in Imprint matte red #AE3030, down-regulated in Imprint blue #4467A3, the non-significant
    mass in a translucent theme-adaptive neutral, with identical data colors across
    themes.'
  - Classification falls out of the data and the cutoff constants (P_CUTOFF, FC_CUTOFF)
    rather than being placed, and every point sits at its generated values with no
    jitter or displacement.
  - Hex-alpha translucency plus a thin page-colored marker outline lets the dense
    gray base read as density instead of a blot.
  - Axis titles use proper notation (log₂ fold change, −log₁₀(p-value)) and every
    chrome element is threaded through ANYPLOT_TOKENS, so both renders are fully legible.
  - 'Library-native interactivity: the HTML output keeps MUI X''s hover tooltips and
    legend for per-gene inspection.'
  weaknesses:
  - 'Suggestion: label a handful of the most significant genes by name (the Notes
    allow it) to give the reader concrete anchors at the arm tips.'
  - 'Suggestion: a slightly larger title would give the top band a little more presence
    against the wide plot area.'
