review:
  strengths:
  - Clean, correct volcano-plot structure with well-chosen semantic (not ordinal)
    color mapping, explicitly documented as an intentional deviation from canonical
    Imprint order
  - Threshold lines (p=0.05 horizontal, ±1 fold-change vertical) styled distinctly
    with dashed amber strokes and a labeled horizontal cutoff
  - Alpha transparency and marker edge-stroke thoughtfully applied to mitigate overplotting
    in the dense 350-point dataset
  - Fully deterministic, dependency-free data generation with a realistic funnel-shaped
    distribution
  weaknesses:
  - Densest cluster of non-significant points near the origin has heavy point-on-point
    stacking — consider slightly smaller markers or a touch more transparency there
    to preserve individual-point legibility
  - Vertical fold-change threshold lines are unlabeled while the horizontal p-value
    line is labeled — consider adding a small label (e.g. "FC = 2") for consistency
  - No labeling of top significant features by name (spec listed this as optional/"consider"),
    which would add storytelling value for a genomics audience
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "volcano-basic · javascript · muix · anyplot.ai" in dark ink, clearly centered above the plot. Axis labels "log₂ Fold Change" and "−log₁₀(p-value)" with correct subscript typography. Tick labels dark and legible. Legend top-right with three color swatches (Not significant / Down-regulated / Up-regulated). Dashed amber horizontal line labeled "p = 0.05" and two unlabeled dashed amber vertical lines at ±1.
      Data: ~350 points in three semantic colors — muted gray (non-significant, clustered near origin), matte blue (down-regulated, upper-left), matte red (up-regulated, upper-right). Markers have a thin light stroke to separate overlapping points; alpha transparency reduces overplotting.
