review:
  strengths:
  - Clean, correct volcano-plot structure with well-chosen semantic (not ordinal)
    color mapping, explicitly documented as an intentional deviation from canonical
    Imprint order and fully consistent with the style guide's semantic-exception rule
  - Both vertical fold-change threshold lines are now labeled ("FC = -2", "FC = 2")
    consistently with the horizontal p-value line, fixing the inconsistency flagged
    in attempt 1
  - Alpha transparency and marker edge-stroke thoughtfully applied to mitigate overplotting
    in the dense 350-point dataset
  - Fully deterministic, dependency-free data generation with a realistic funnel-shaped
    distribution; both renders theme-correct with no legibility failures
  weaknesses:
  - Densest cluster of non-significant points near the origin still has meaningful
    point-on-point stacking - a touch more transparency or slightly smaller markers
    there would preserve individual-point legibility
  - No labeling of top significant features by name (spec lists this as optional/"consider"),
    which would add storytelling value for a genomics audience
  - Visual refinement still relies mostly on MUI X defaults beyond the marker/line
    styling already applied
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 - not pure white, not dark.
      Chrome: Title "volcano-basic · javascript · muix · anyplot.ai" centered at top in dark ink, fully legible and not clipped. X-axis "log2 Fold Change" and Y-axis "-log10(p-value)" labels with correct subscript typography, dark ink on light background. Tick labels dense but readable. Legend top-right (Not significant / Down-regulated / Up-regulated) with matching swatches, clear of data. Dashed amber threshold lines labeled "p = 0.05", "FC = -2", "FC = 2".
      Data: ~350 points in three semantic colors - muted gray (non-significant), matte blue (down-regulated, palette[2]), matte red (up-regulated, palette[4]) - forming the expected volcano funnel shape. Note: first categorical series is NOT brand green here by design - this is a documented semantic-exception case (domain convention: up=red, down=blue, non-sig=muted gray) sanctioned by the style guide.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 - not pure black, not light.
      Chrome: Title and axis labels render in light ink, clearly legible against the dark surface. Grid lines subtle but visible. Legend and both threshold-line labels crisp and legible. No dark-on-dark issues found.
      Data: Point colors (gray/blue/red) are pixel-identical to the light render; only chrome flipped as required. Marker edge stroke correctly switches to a dark-compatible accent.
      Legibility verdict: PASS
