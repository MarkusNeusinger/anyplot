review:
  strengths:
  - Correct semantic color mapping (gray/red/blue) exactly matching the spec's domain
    convention for volcano plots, with position (positive/negative log2FC) as a redundant
    encoding so color is never the sole signal
  - Threshold lines (horizontal -log10(0.05) cutoff, vertical +/-1 fold-change cutoffs)
    implemented cleanly via a single markLine block, avoiding extra series or legend
    clutter
  - Deterministic LCG-based data generation with realistic gene-like names and plausible
    fold-change/p-value distributions (650 points, correct funnel shape)
  - Both themes correctly thread theme-adaptive tokens through title, legend, axis
    lines, tick labels and grid, while data colors stay identical across light/dark
  - Alpha transparency (0.5 for non-significant, 0.75 for significant) appropriately
    combats overplotting in the dense 650-point dataset
  weaknesses:
  - 'Top significant genes are not labeled by name (spec: ''Consider labeling top
    significant features by name'') -- a few text labels on the most extreme points
    (e.g. the two right-side outliers near log2FC 5-6) would add storytelling value'
  - Chrome relies on library defaults beyond the theme-token mapping -- no additional
    emphasis (e.g. subtle shading of the significant quadrants) to push Design Excellence
    beyond a solid baseline
  - Dense clustering of ~650 overlapping points near the plot center could benefit
    from slightly smaller markers or lower alpha to further reduce visual clumping
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 -- not pure white, not dark.
      Chrome: Title "volcano-basic · javascript · echarts · anyplot.ai" centered top in dark ink, legend row below it ("Not significant" gray dot, "Up-regulated" red dot, "Down-regulated" blue dot) in soft dark gray text. Axis titles "log2(Fold Change)" and "-log10(p-value)" and numeric tick labels are dark and clearly legible. Subtle light-gray gridlines on both axes. Dashed threshold lines at y≈1.3 and x≈±1.
      Data: ~650 scatter points forming the expected volcano funnel shape -- gray cloud near the origin (non-significant), blue cluster in the upper-left (down-regulated, negative log2FC), red cluster in the upper-right (up-regulated, positive log2FC), including two clear outlier points at the far right (~log2FC 5-6, -log10p ~9-10.4). First categorical Imprint green is not used here because the spec explicitly calls for gray/red/blue semantic coding, which is followed correctly.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 -- not pure black, not light.
      Chrome: Same title, legend, axis titles, tick labels and gridlines as the light render, but chrome is flipped to light/off-white text and lighter gridlines against the dark background. No dark-on-dark or hard-to-read text observed anywhere.
      Data: Same gray/blue/red point cloud and same funnel shape, same outlier points at the far right -- colors are visually identical to the light render, confirming only chrome (not data colors) changed between themes.
      Legibility verdict: PASS
