review:
  strengths:
  - Top 3 most significant genes (TP5314, TP5344, MYC32) are now labeled directly
    on the plot, closing the attempt-1 gap and adding a clear storytelling focal point
    on the outliers
  - Correct semantic color mapping (gray/red/blue) exactly matching the spec's domain
    convention for volcano plots, with point position (sign of log2FC) as a redundant
    encoding so color is never the sole signal
  - Threshold lines (horizontal -log10(0.05) cutoff, vertical +/-1 fold-change cutoffs)
    implemented cleanly via a single silent markLine block, avoiding extra series/legend
    clutter
  - Deterministic LCG-based data generation with realistic gene-like names and a plausible
    RNA-seq-like fold-change/p-value distribution (650 points, correct funnel shape)
  - Both themes correctly thread theme-adaptive tokens through title, legend, axis
    lines, tick labels, grid, and the new gene labels, while data colors stay identical
    across light/dark
  weaknesses:
  - Chrome still relies mostly on token mapping without an additional design flourish
    (e.g. subtle shading of the significant quadrants) to push Design Excellence further
  - Dense clustering of points near the origin still reads slightly busy; a touch
    smaller marker size or slightly lower alpha in that region would further reduce
    clumping
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 - not pure white, not dark.
      Chrome: Title "volcano-basic · javascript · echarts · anyplot.ai" centered top in dark ink; legend row below ("Not significant" gray, "Up-regulated" red, "Down-regulated" blue) all clearly readable; axis titles ("log2(Fold Change)", "-log10(p-value)") and numeric tick labels are dark and legible; subtle light-gray gridlines; dashed threshold lines at y=1.3 and x=+/-1. Three gene labels (TP5314, TP5344, MYC32) sit above their points in dark ink, fully legible and non-overlapping with other elements.
      Data: ~650 scatter points forming the expected volcano funnel: gray non-significant cloud near origin, blue down-regulated cluster upper-left, red up-regulated cluster upper-right, with two clear red outliers at far right and one blue outlier at far left labeled by gene name.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 - not pure black, not light.
      Chrome: Same title, legend, axis titles, tick labels, gridlines and gene labels as the light render, but chrome flipped to light/off-white text and lighter gridlines against the dark background. No dark-on-dark issues observed anywhere - title, axis titles, tick labels, legend text, and gene labels all use light ink and remain fully readable.
      Data: Point colors (gray/red/blue) are visually identical to the light render, confirming only chrome flipped between themes.
      Legibility verdict: PASS
