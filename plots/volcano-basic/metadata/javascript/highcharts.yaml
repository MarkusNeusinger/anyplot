review:
  strengths:
  - Exemplary theme-adaptive palette handling with a well-justified semantic-exception
    color mapping (gray/blue/red) that matches the universal volcano-plot convention
    and is explicitly labeled in the legend.
  - 'Faithful, complete coverage of every spec note: both threshold line orientations,
    tri-state significance coloring, top-feature name labeling, and density-aware
    alpha blending.'
  - Clean, deterministic, dependency-free data generation via a small seeded LCG -
    fully reproducible.
  - Correct use of Highcharts' plotLines and per-point dataLabels features to add
    real analytical value beyond a generic scatter.
  weaknesses:
  - Axis lines/tick marks are fully opaque and visually present alongside the gridlines,
    slightly reducing the minimal-chrome feel the style guide favors - consider lightening
    or removing xAxis.lineColor/yAxis.lineColor.
  - The dense central 'Not significant' cluster near the origin, while spec-compliant
    with alpha blending, could benefit from slightly smaller markers to further sharpen
    visual hierarchy toward the labeled significant genes.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 - not pure white, not dark.
      Chrome: Title "volcano-basic · javascript · highcharts · anyplot.ai" and subtitle "RNA-seq differential expression: treatment vs. control" both dark and fully readable. Axis titles "log2 fold change" / "-log10(p-value)" and tick labels are dark ink-soft, all legible. Dashed threshold lines (2 vertical at ±1, 1 horizontal at ~1.3) render in dark ink-soft, clearly visible but subtle. Legend at bottom with three swatches (gray/blue/red) and matching text, all legible.
      Data: ~600 semi-transparent (opacity 0.65) circular points forming a classic volcano funnel shape. Colors: muted gray for "Not significant" (center), blue (palette[2]) for "Down-regulated" (upper-left arm), matte red (palette[4]) for "Up-regulated" (upper-right arm) - this is a deliberate, spec-consistent semantic-exception color mapping (gray/blue/red), not the default canonical order, and the legend text makes the mapping unambiguous. Four gene names (CDK9, AKT456, VEGF198, VEGF58) are labeled directly next to their markers with no overlap, verified via pixel-level crops.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 - not pure black, not light.
      Chrome: Title, subtitle, axis titles, and tick labels all render in light ink tones and remain fully legible against the dark surface. No dark-on-dark failures found anywhere, including the gene-name data labels (checked via crops of the top-left and top-right extremes). Dashed threshold lines remain visible as light-gray dashes. Legend swatches and text legible.
      Data: Colors are pixel-identical to the light render (gray/blue/matte-red) - only chrome (background, text, grid, legend) flipped between themes, data colors held constant as required.
      Legibility verdict: PASS
