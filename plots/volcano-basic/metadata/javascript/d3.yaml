review:
  strengths:
  - 'Correct volcano-plot construction: log2 fold change on x, -log10(p-value) on
    y, with dashed significance threshold at ~1.3 and dashed effect-size thresholds
    at ±1, exactly matching the specification''s Notes section'
  - Uses the domain-standard red/blue semantic color mapping for up-/down-regulated
    genes (legitimate use of the Imprint palette's semantic-exception rule, since
    'Up-regulated'/'Down-regulated' labels literally match the documented up/down
    convention)
  - Density-appropriate alpha transparency (0.75 significant / 0.35 non-significant)
    sensibly handles the ~2,200-point overplotting scenario
  - Realistic, neutral RNA-seq dataset with recognizable named hits (TP53, MYC, BRCA1,
    EGFR) layered on a deterministic LCG-generated background cloud that produces
    the expected V-shaped volcano silhouette
  - 'Idiomatic D3: scaleLinear + axisBottom/axisLeft + join pattern, custom-built
    legend, theme tokens correctly threaded through title/axes/gridlines/threshold
    lines'
  - Title format, axis labels, and data mapping all match the specification precisely
  weaknesses:
  - 'colorFor.ns is set to `t.muted`, but the harness''s window.ANYPLOT_TOKENS object
    (built in automation/js-render/render.mjs and documented in prompts/library/d3.md)
    only exposes { pageBg, elevatedBg, ink, inkSoft, grid, palette, amber, seq, div
    } -- there is no `muted` field. `t.muted` is therefore `undefined`, so d3''s .attr(''fill'',
    ...) removes the fill attribute entirely and every ''Not significant'' point (plus
    its legend swatch) falls back to the browser''s default SVG fill (black) instead
    of a theme-adaptive gray. This happens to look passable in the light render, but
    produces near-invisible black-on-near-black markers in the dark render (stroke
    is also `t.pageBg`, i.e. the same near-black background color, compounding the
    low contrast) and a flat-black legend swatch barely distinguishable from the dark
    legend box. Fix: use `t.inkSoft` (already theme-adaptive: #4A4A44 light / #B8B7B0
    dark) for the ''ns'' fill instead of the non-existent `t.muted`.'
  - The 'TP53' top-hit label sits directly on top of a data point marker in both renders
    (label offset of only 10-14px from the point), so the marker visually merges with/obscures
    part of the label glyphs -- increase the label offset or nudge it further from
    the marker so the text stays fully clear of any point.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 -- not pure white.
      Chrome: Title "volcano-basic · javascript · d3 · anyplot.ai" bold and centered at top, dark ink, clearly legible. Axis titles "log2 Fold Change" / "-log10(p-value)" dark and legible. Tick labels on both axes legible in a softer dark gray. Grid lines on both axes are subtle and visible without competing with data. Two vertical dashed threshold lines at log2FC = -1/+1 and one horizontal dashed threshold line at -log10(p) ~= 1.3, all rendered in a soft dark gray, clearly visible against the light background. Legend (top-right, light elevated box) lists Up-regulated (red), Down-regulated (blue), Not significant (black) with legible dark text.
      Data: Classic V-shaped volcano silhouette. Blue points (down-regulated) on the left arm, red/maroon points (up-regulated) on the right arm -- consistent with the domain-standard red/blue significance convention. Central cloud of "Not significant" points renders as dark/black dots (see weakness: these should use a theme-adaptive muted gray token, not the browser's default black fill) but remains visually distinguishable from the light background since black-on-off-white still has reasonable contrast. Named hits TP53, MYC, BRCA1, EGFR are labeled near their points; the TP53 label overlaps its adjacent marker (glyphs partially merge with the dot).
      Legibility verdict: PASS (all title/axis/tick/legend text is clearly readable; the only defects are the wrong marker color for the "Not significant" category and label/marker overlap on TP53, not text-vs-background contrast).

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 -- not pure black.
      Chrome: Title, axis titles, and tick labels all render in light (off-white/soft-gray) text, clearly legible against the dark background -- no dark-on-dark failures for any title/axis/tick element. Grid lines and dashed threshold lines render in a subtle light gray, clearly visible. Legend box uses the dark elevated background with legible light text for "Up-regulated" and "Down-regulated".
      Data: Blue and red points are visually identical in hue/saturation to the light render (as required -- only chrome flipped). However, the "Not significant" points and their legend swatch use the browser's default black SVG fill (due to the undefined `t.muted` token bug) with a stroke that also matches the near-black page background -- these markers are individually almost invisible against the dark canvas, only readable in aggregate as a faint darker blob where many overlapping points compound their alpha. The "Not significant" legend swatch is likewise a near-invisible black circle against the dark legend box.
      Legibility verdict: FAIL for the "Not significant" data category and its legend swatch (dark-marker-on-dark-background contrast failure caused by the missing `t.muted` token); PASS for all title/axis/tick/legend text elements.
