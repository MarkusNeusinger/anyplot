review:
  strengths:
  - 'Correct volcano-plot construction: log2 fold change on x, -log10(p-value) on
    y, with both the horizontal significance threshold (-log10(0.05) ≈ 1.3) and the
    two vertical effect-size thresholds (±1) drawn as dashed reference lines exactly
    per spec.'
  - Top hits (TP53, MYC, BRCA1, EGFR) are labeled directly on the plot with readable,
    correctly anchored text, giving the chart a clear analytical focal point.
  - 'Realistic RNA-seq differential-expression data: ~2200 genes with a plausible
    fold-change/p-value relationship (stronger fold changes trend toward lower p-values)
    plus a handful of injected strong hits for coverage of the full significance spectrum.'
  - Title format is exactly correct ("volcano-basic · javascript · d3 · anyplot.ai"),
    legend labels (Up-regulated / Down-regulated / Not significant) match the significance
    categories, and the code is clean, deterministic (fixed-seed LCG), and idiomatic
    D3 (data joins, scaleLinear, axisBottom/Left).
  weaknesses:
  - 'Critical dark-theme failure: in plot-dark.png the ''Not significant'' scatter
    points AND the matching legend swatch render as pure black (sampled RGB (0,0,0))
    against the near-black #1A1A17 background — they are visually indistinguishable
    from the canvas. This affects the majority of the ~2200 plotted genes (everything
    inside the threshold lines). The source (line 52) sets `colorFor = { ns: t.inkSoft,
    ... }`, and `t.inkSoft` IS correctly rendered elsewhere in the very same dark
    render (axis ticks and the dashed threshold lines both show the expected light
    gray #B8B7B0) — so the fill value reaching the ''ns'' circles/legend swatch does
    not match what `t.inkSoft` resolves to elsewhere in the same file. Repair must
    verify `colorFor.ns` actually evaluates to a visible token at both the scatter-circle
    join and the legend-swatch circle, and re-render both themes to confirm the fix
    before resubmitting (rule out a stale/pre-fix render artifact left over from the
    previous repair commit that changed `t.muted` → `t.inkSoft`).'
  - Because the non-significant category is invisible in dark mode, the spec's explicit
    color-coding requirement ('non-significant (gray)') only half-works — it is correct
    in the light render but fails entirely in the dark render.
  - The gene-name labels (esp. "TP53") sit directly on top of a dense cluster of same-colored
    data points; legible today due to bold text + white/dark halo-free contrast, but
    a subtle white text-stroke or small leader line would make the labels read more
    cleanly against the crowded point cloud.
  - 'Design Excellence is only at the ''well-configured default'' tier: no size/alpha
    variation beyond the two-tier significant/non-significant opacity split, and no
    additional visual emphasis (e.g., outlining or slightly enlarging the labeled
    top-hit markers) to reinforce the labeled genes as the analytical focal point.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "volcano-basic · javascript · d3 · anyplot.ai" in bold dark text, axis titles "log2 Fold Change" / "-log10(p-value)" in dark text, tick labels in a slightly softer dark gray, subtle both-axes gridlines, legend box (light elevated fill) top-right with three swatches. All chrome text is clearly readable against the light background.
      Data: ~2200 points forming the classic volcano "V" shape. Right arm colored matte red (up-regulated), left arm colored blue (down-regulated), central/lower cluster colored dark gray (not significant, rendered with a lower fill-opacity of 0.35 vs. 0.75 for significant points). Dashed threshold lines at y≈1.3 and x=±1 are visible in a muted gray. Four labeled top hits (TP53, MYC, BRCA1, EGFR) sit near the plot's outer extremes with bold dark text.
      Legibility verdict: PASS — every chrome element and the "Not significant" legend swatch (rendered as a dark/near-black circle, readable against the light cream background) are legible.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Title and axis titles render in light/white text, tick labels in light gray, gridlines and dashed threshold lines in a light gray (confirmed via pixel sampling at RGB (184,183,176), matching the expected dark-theme inkSoft token) — all clearly visible against the dark background. Legend box uses the darker "elevated" surface with light-gray label text, also readable.
      Data: The red (up-regulated) and blue (down-regulated) arms of the volcano are identical in hue to the light render, confirming data-color consistency across themes. However, the "Not significant" points (the dense central/lower cluster, the majority of the ~2200 genes) and the "Not significant" legend swatch both render as pure black (pixel-sampled RGB (0,0,0)), which is visually indistinguishable from the (26,26,23) background — this category is effectively invisible in the dark render, even though the exact same token (`t.inkSoft`) renders correctly as light gray for the axis ticks and threshold lines elsewhere in this same image.
      Legibility verdict: FAIL — the "Not significant" data category (majority of the plotted genes) and its legend swatch are a dark-on-dark failure in the dark render; every other chrome/text element passes.
