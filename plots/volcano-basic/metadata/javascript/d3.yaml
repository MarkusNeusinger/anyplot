review:
  strengths:
  - 'Correct semantic color mapping using the Imprint palette exactly as the spec
    requires: red (#AE3030, palette[4]) for significant up-regulated, blue (#4467A3,
    palette[2]) for significant down-regulated, and a theme-adaptive gray (inkSoft)
    for non-significant points'
  - Threshold lines (horizontal significance cutoff at -log10(0.05)≈1.3, vertical
    fold-change cutoffs at ±1) are clearly rendered as dashed reference lines exactly
    matching the spec's required cutoffs
  - Top-hit genes (TP53, MYC, BRCA1, EGFR) are highlighted with emphasis rings and
    halo-stroked labels (paint-order stroke in page background color) that stay legible
    even over the dense point cloud in both themes
  - Deterministic fixed-seed LCG data generation with realistic gene names and a plausible
    fold-change/p-value correlation (stronger effect sizes trend toward lower p-values)
  - Clean idiomatic D3 data-join pattern for gridlines, points, emphasis rings, labels,
    and legend; theme tokens (ink, inkSoft, grid, elevatedBg, pageBg) are correctly
    threaded through axes, grid, text, and legend box in both renders
  weaknesses:
  - The dense 'not significant' point cluster in the valley bottom is still somewhat
    visually cluttered even at fill-opacity 0.35 — consider a slightly smaller radius
    (e.g. 4-5px instead of 6px) or lower alpha for the ns category specifically to
    further reduce overplotting in that region
  - Library Mastery is fairly generic scatter usage (scales + axis + join) — no D3-distinctive
    technique beyond basic data-join and manual SVG overlay; acceptable for a static
    PNG but doesn't showcase anything D3-only
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "volcano-basic · javascript · d3 · anyplot.ai" in dark ink, centered top, clearly readable. Axis labels "log2 Fold Change" (x) and "-log10(p-value)" (y) in dark ink, both legible. Tick labels in a softer dark gray, legible against the cream background. Grid lines (both axes, as expected for a scatter plot) are subtle, light gray, non-competing. Legend (top-right, subtle off-white box) with "Up-regulated" (red swatch), "Down-regulated" (blue swatch), "Not significant" (gray swatch) — all text dark and readable.
      Data: Classic volcano "V" shape — gray non-significant cloud in the valley, blue down-regulated points fanning to the upper-left, red up-regulated points fanning to the upper-right. Dashed threshold lines at y≈1.3 and x=±1 clearly demarcate significance regions. Four top-hit genes (TP53, MYC, BRCA1, EGFR) are ringed and labeled with halo-stroked text, fully legible over the data.
      Legibility verdict: PASS — no text is unreadable, no dark-on-light or light-on-light failures.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Title, axis labels, and tick labels have flipped to light ink/soft-light gray and are clearly readable against the dark background. Grid lines are a subtle light gray at low opacity, visible but not dominant. Legend box has flipped to a dark elevated surface with light text, fully legible.
      Data: Identical red (#AE3030) and blue (#4467A3) data colors to the light render — only chrome (background, text, grid, legend box) has flipped, confirming the Imprint data-color invariance rule. The gray "not significant" cluster correctly uses the dark-theme secondary-text token (lighter gray) so it remains visible against the near-black background. Top-hit rings and labels (white halo-stroke) are clearly visible and legible.
      Legibility verdict: PASS — no dark-on-dark failures; all text and data elements are clearly distinguishable from the near-black surface.
