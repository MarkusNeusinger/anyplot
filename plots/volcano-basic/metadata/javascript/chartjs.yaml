      Data: V-shaped scatter — dense gray cluster near origin, blue points fanning upper-left, red points fanning upper-right, dashed black threshold lines (horizontal p=0.05, vertical ±1 fold-change). First categorical role (down-regulated) uses Imprint blue #4467A3, up-regulated uses Imprint matte red #AE3030 — a documented semantic exception matching the spec's explicit color request and standard bioinformatics convention.
