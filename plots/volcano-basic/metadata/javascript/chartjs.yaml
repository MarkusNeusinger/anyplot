review:
  strengths:
  - Correct Imprint hex colors mapped to domain-standard semantic roles (red = up-regulated,
    blue = down-regulated, muted gray = non-significant), matching the spec's explicit
    color request
  - Clean, theme-adaptive dashed threshold lines (p=0.05 horizontal, ±2-fold vertical)
    implemented via Chart.js mixed line+scatter datasets
  - Legend filter callback correctly suppresses the duplicate 'cutoff' line entries,
    keeping only the three meaningful categories
  - 'Both renders are fully theme-correct: warm off-white/near-black backgrounds,
    all text legible, data colors identical across themes'
  - Deterministic seeded LCG data generation producing a realistic, full-coverage
    volcano distribution
  weaknesses:
  - Spec's optional suggestion to label top significant features by name was not attempted
    — labeling the 3-5 most extreme points (highest -log10 p-value in each direction)
    would add data storytelling value
  - Grid lines are visible on both axes; consider a lighter grid or y-axis-only grid
    for a more polished, less busy look given the point density
  - Densest non-significant gray cluster near the origin is somewhat crowded — slightly
    lower alpha (e.g. 0.4) or smaller radius for that series specifically would reduce
    visual noise
  - Overall composition is competent but fairly standard for the chart type; a distinctive
    flourish (quadrant shading, callout for top hits) would raise Design Excellence
    and Library Mastery
  image_description: |-
