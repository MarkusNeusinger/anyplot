review:
  strengths:
  - Top significant features (TP53, EGFR, KRAS, BRCA1, PTEN) are now labeled by name
    via a custom afterDatasetsDraw plugin, directly addressing the prior review's
    data-storytelling suggestion.
  - Grid is now restricted to the y-axis only (x-axis grid disabled), giving a visibly
    cleaner composition than the previous both-axes grid.
  - Non-significant cluster alpha reduced (INK_MUTED at 0.4) to relieve crowding near
    the origin while significant points keep a stronger 0.65 alpha.
  - Correct Imprint hex colors mapped to domain-standard semantic roles (matte red
    = up-regulated, blue = down-regulated, muted gray = non-significant) matching
    the spec's explicit request and real-world bioinformatics convention.
  - 'Both renders are fully theme-correct: warm off-white/near-black backgrounds,
    all chrome and gene labels legible, data colors identical across themes.'
  - Deterministic seeded LCG data generation producing a realistic, full-coverage
    volcano distribution with proper title/legend/axis compliance.
  weaknesses:
  - Title occupies only ~30% of plot width at fontsize 22 — well under the typical
    50-70% target (minor proportional note, not a legibility defect).
  - Composition, while now enriched with gene-name callouts, is still a fairly standard
    volcano-plot treatment without an extra distinctive flourish (e.g. quadrant shading
    or a hover-callout style annotation box).
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1-like), not pure white.
      Chrome: Bold dark title "volcano-basic · javascript · chartjs · anyplot.ai" centered at top; legend row below with three swatches (gray "Not significant", blue "Down-regulated", red "Up-regulated" — the two dashed threshold-line datasets are correctly hidden via the legend filter). Axis titles "log2(Fold Change)" and "-log10(p-value)" are dark and bold; tick labels are a softer dark gray. Black dashed threshold lines (horizontal p=0.05, vertical ±1 fold-change) are clearly visible.
      Data: Classic V/funnel volcano shape — dense gray cluster near the origin below the horizontal cutoff and between the vertical cutoffs; blue points fan toward the upper-left, red points toward the upper-right. Five gene-name labels (TP53, EGFR, KRAS at top-right; BRCA1, PTEN at top-left) mark the top significant hits and do not overlap other text or points. First-series color rule is satisfied via the documented semantic exception (red=up, blue=down, gray=non-sig, matching the spec's explicit request).
      Legibility verdict: PASS — all text clearly readable against the light background.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17-like), not pure black.
      Chrome: Identical layout to the light render with all chrome flipped to light/off-white — title, legend text, axis titles, tick labels, and the dashed threshold lines (now white) are all clearly legible against the dark surface. Gene-name labels are drawn in the light ink color and read cleanly against the dark background.
      Data: Point cloud and gene labels are in the exact same positions with identical data colors (gray/blue/red) as the light render — only chrome flipped, confirming Imprint palette persistence across themes.
      Legibility verdict: PASS — no dark-on-dark failures detected; every text element adapted correctly.
