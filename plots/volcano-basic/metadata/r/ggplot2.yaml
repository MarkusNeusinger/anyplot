review:
  strengths:
  - 'Correct volcano-plot semantics: significance/effect-size thresholds drawn as
    dashed guide lines at the exact spec-mandated positions (±1 log2FC, -log10(0.05)),
    and points are color-coded by status exactly as the spec requests (gray/red/blue
    for not-significant/up/down).'
  - Theme-adaptive chrome is fully correct in both renders — background, title, axis
    labels, tick labels, grid, and legend all use the right theme tokens with no dark-on-dark
    or light-on-light failures, and no edge clipping.
  - Clean, reproducible, KISS-structured R code (single set.seed(42), no functions/classes,
    ragg::agg_png for the PNG device) with a title and legend that match the spec/style-guide
    format exactly.
  - Data is a realistic, neutral RNA-seq differential-expression scenario with a proper
    mix of non-significant, up-regulated, and down-regulated genes at plausible fold-change/p-value
    magnitudes.
  weaknesses:
  - The dense central cluster (~2,000 of the 2,400 points) is heavily overplotted
    into a solid dark blob in both themes — reduce geom_point size/alpha further for
    the non-significant class (or keep current sizing only for the colored significant
    points) so individual points stay distinguishable.
  - Spec says to 'consider labeling top significant features by name' — no gene labels
    are drawn. Add ggrepel-based text labels for the handful of most extreme up/down-regulated
    genes to sharpen data storytelling and demonstrate a distinctive ggplot2 feature.
  - Library usage is fairly generic (geom_point + geom_vline/geom_hline + scale_color_manual
    + theme_minimal) — it doesn't showcase anything distinctive to ggplot2 beyond
    the plotmath y-axis expression. Consider ggrepel labels or annotate()-based count
    callouts (e.g. 'n up / n down') to raise Library Mastery.
  - Visual refinement leans on theme_minimal defaults with only grid-color/alpha tweaks
    — spines are removed by the library default rather than by deliberate styling
    choices, so Design Excellence reads as 'good' rather than 'publication-ready'.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Title "volcano-basic · r · ggplot2 · anyplot.ai" in dark ink at top-left; "Status" legend with gray/red/blue swatches directly below the title; x-axis "Log2 Fold Change" and y-axis "-Log10 (p-value)" (plotmath rendering) in dark/soft-dark ink; subtle light gray gridlines. All text is clearly readable against the light background — no light-on-light issues.
      Data: Dense gray cloud of "Not significant" points centered near (0, low y) forming an overplotted blob; sparser blue "Down-regulated" points scatter to the left beyond the left dashed vertical threshold line; sparser red "Up-regulated" points scatter to the right beyond the right dashed vertical threshold line; both colored groups sit above the dashed horizontal significance line. Two dashed vertical lines at approximately x=-1 and x=+1, one dashed horizontal line at y≈1.3, all in a soft ink tone.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Same title, legend, and axis labels now rendered in light ink (off-white/light-gray) against the dark background; gridlines are a faint light gray. All chrome text is clearly legible — no dark-on-dark failures observed.
      Data: Same spatial distribution as the light render — gray "Not significant" blob (now a lighter muted gray, adapted for dark-bg contrast), red "Up-regulated" and blue "Down-regulated" points in identical positions and identical hex colors to the light render (#AE3030 red, #4467A3 blue). Dashed threshold lines are the same relative positions, now in a light dashed tone. Data colors are confirmed identical to light render, only chrome (background, text, grid, muted-gray tone) flips as expected.
      Legibility verdict: PASS
