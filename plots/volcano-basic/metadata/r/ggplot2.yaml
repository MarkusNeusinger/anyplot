review:
  strengths:
  - 'Directly addresses both prior weaknesses: the non-significant cluster is now
    visibly translucent instead of a solid blob, and top-hit genes are labeled per
    the spec''s "consider labeling" note.'
  - New "191 down" / "187 up" annotate() callouts add a clear narrative focal point
    without cluttering the plot.
  - Theme-adaptive chrome remains fully correct in both renders — no dark-on-dark/light-on-light
    failures, no edge clipping, labels well clear of the canvas border even for the
    extreme GENE2140 point.
  - Clean, reproducible, KISS-structured R code; the comment explaining the ggrepel-unavailable
    workaround is exactly the kind of non-obvious rationale worth keeping in the file.
  weaknesses:
  - The central non-significant cloud is lighter now but still dense enough near the
    origin to read as a soft blob — could go slightly further (e.g. size ~0.8) if
    a future pass revisits this.
  - The manual rank-based label nudge is a reasonable workaround, but it isn't a distinctive
    ggplot2-specific technique — Library Mastery is capped by the missing ggrepel
    dependency rather than the implementation's choices.
  - Visual refinement still reads primarily as tuned theme_minimal rather than a fully
    bespoke chrome (e.g., axis line still drawn continuously rather than a more minimal
    treatment).
