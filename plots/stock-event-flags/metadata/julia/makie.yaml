review:
  strengths:
  - Alternating flag heights keep all eight flags and labels clear of each other and
    of the price line
  - Event types encoded redundantly by marker shape and Imprint color (triangle/#009E73,
    diamond/#C475FD, circle/#4467A3), CVD-safe
  - Colored dashed connectors run exactly from each flag to a dot on the price at
    the event day
  - Earnings windows drawn with poly!(Rect2f) at 12% alpha stay behind the price and
    the flags
  - 'Complete theme adaptation: page, ink, grid and legend tokens flip; data colors
    identical in both renders'
  weaknesses:
  - 'Suggestion: the 9 pt earnings reaction labels sit on or just below the price
    line (-0.9% touches it in July); placing them above the flag labels at 11 pt would
    keep them clear and readable.'
  - 'Suggestion: the 1.2 px price line is thin for the main series; 1.8 px would give
    it more presence without competing with the flags.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1.
      Chrome: title 'TechCorp 2024 · stock-event-flags · julia · makie · anyplot.ai' bold dark ink, ~35% of width; axis labels 'Share Price (USD)' and 'Month (2024)' and month/price ticks in dark ink, all readable; subtle y-grid only; legend lower left on an elevated fill.
      Data: muted dark-gray price line (1.2 px) over a faint gray area fill; four pale green earnings windows; green triangles (earnings), lavender diamonds (dividends) and blue circles (news) at two alternating heights above the price, each with a colored dashed connector to a dot on the price and a dark label; earnings reaction percentages (+1.4%, -7.0%, -0.9%, +4.5%) in small 9 pt green/red text just below the price at each earnings date, partly touching the price line (-0.9%).
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, axis labels and ticks in light ink, all readable; no dark-on-dark text; legend on #242420 with light labels.
      Data: flag, connector and window colors identical to the light render; price line flips to light gray; the small red reaction labels below the price are the dimmest text, faint but present.
      Legibility verdict: PASS
