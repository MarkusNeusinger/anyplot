review:
  strengths:
  - 'Imprint palette applied exactly: price #009E73, event types at positions 2-5,
    identical in both themes with theme-correct chrome'
  - Redundant shape + color encoding for event types, keyed by a legend with matching
    glyphs
  - Connectors drawn as one mark_line layer split per event through the detail channel
  - Tooltips with full event details and .interactive() zoom/pan in the HTML output
  weaknesses:
  - 'VQ-02 (both): the legend title ''Event Type'' and the legend''s triangle and
    diamond glyphs sit on the legend frame''s left border, and the ''Q4 Beat'' label''s
    first letter touches the descending price line around 104 in late January → legend
    content inside its frame with padding, label a few px clear of the line. Likely
    cause: legend padding/offset left at defaults with a small frame; label dy above
    a flag whose offset is too small where the price falls steeply.'
  - 'VQ-05 (both): the chart is drawn smaller than the canvas and padded onto it,
    leaving an empty band below the ''Date'' title and above the title → fill the
    canvas with width=800, height=450 and autosize fit. Likely cause: width=620, height=320
    plus the PIL padding block.'
  - 'DE-02 (both): grid lines on both axes on a line chart, where the style guide
    asks for a Y-axis grid only → configure_axisX(grid=False). Likely cause: configure_axis(gridColor=...)
    applies the grid to both axes.'
  - 'VQ-01 (dark): the ''$0.25 Div'' and ''$0.28 Div'' labels in #4467A3 at 11 px
    bold read dim on the #1A1A17 background (about 3:1) → a label color with at least
    4.5:1 on the dark page, or an INK-colored label beside the colored marker. Likely
    cause: the text layer''s color channel uses the event-type palette scale for the
    label text.'
  - 'SC-02 (both): the Q2 Growth flag (late July) sits on the price line, so the triangle
    covers the line where it climbs to about 89 just before the dip (C2) → place each
    flag clear of the price over the dates around it, e.g. offset from the local max/min
    of a few days rather than the single close. Likely cause: flag_y = close ± a fixed
    18 % of the range, computed from one day''s close.'
  - 'SC-03 (both): the y axis runs 70-120 while the price and flags span about 79-105,
    leaving the 110-120 band and most of 70-78 empty → a domain a little outside the
    lowest flag and the highest label (about 76-111). Likely cause: y_domain padded
    by 1.8 x flag_offset on both sides, then niced to round tens.'
  - 'Suggestion: month tick labels fit horizontally; labelAngle=0 would read easier
    than the -45° rotation.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, view framed in INK_SOFT, chart drawn smaller than the canvas with empty bands top and bottom.
      Chrome: title 'Tech Stock 2024 · stock-event-flags · python · altair · anyplot.ai' bold dark; 'Date' and 'Stock Price ($)' dark; month ticks rotated -45°, y ticks 70-120; grid on both axes; legend 'Event Type' top right on #FFFDF6 with Earnings/Dividend/News/Split, its title and glyphs crowding the frame's left border.
      Data: green #009E73 price line; 8 flags alternating above/below with grey dashed connectors, purple triangles, blue diamonds, ochre circles, red square, labels in event colors. 'Q4 Beat' touches the price line; the Q2 Growth triangle sits on the line.
      Legibility verdict: PASS

