review:
  strengths:
  - Native go.Candlestick with Imprint green/red bull and bear styling and the range
    slider disabled
  - Event types told apart by both shape and Imprint color, with a legend that lists
    only the event types
  - Theme tokens threaded through title, axes, grid and legend; both renders read
    cleanly
  - Per-flag hovertemplate with type, label and date plus x-unified hover in the HTML
    view
  weaknesses:
  - 'VQ-02, SC-02 (both): the Q4 Beat flag (star at about $151, label at about $155)
    is drawn inside the late-January candle cluster whose highs reach $156-$160, so
    the label overlaps candles and the flag obscures the price (C2) → place each flag
    above the highest high in a window of a few trading days around the event, so
    it clears every neighboring candle. Likely cause: flag_y offsets from the event
    day''s own high only, price_at_event = event[HIGH].'
  - 'VQ-03 (both): the Q4 Beat dashed connector spans only a few dollars and vanishes
    among the candles, and the Product Launch and Split connectors are short dashes
    hidden behind wicks → a connector long enough to rise clear of the candles once
    the flag sits above the local high. Likely cause: the same event-day-high anchor
    as the flag position.'
  - 'Suggestion: the flag labels use family "Arial Black", which the renderer lacks,
    so they fall back to a serif face; a sans family matching the chrome would unify
    the typography.'
  - 'Suggestion: the connectors could be layout shapes (add_shape with line dash)
    instead of seven extra scatter traces.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across paper and plot area.
      Chrome: centered title "stock-event-flags · python · plotly · anyplot.ai" in dark ink; axis titles "Date" and "Price ($)" in INK; $110-$170 and Feb-Sep 2024 tick labels in INK_SOFT; subtle grid; left and bottom axis lines only; legend top-right on #FFFDF6 with a thin border listing Earnings (star), Dividend (diamond), News (triangle), Split (square). All readable.
      Data: 180 daily candlesticks, bullish #009E73 and bearish #AE3030; seven event flags in Imprint order (Earnings #009E73, Dividend #C475FD, News #4467A3, Split #BD8233) with short colored dashed connectors down to the day's high and labels (Q4 Beat, Div $0.50, Product Launch, Q1 Miss, 4:1 Split, Div $0.55, Q2 Beat) in a serif fallback font. The Q4 Beat star and label sit inside the late-January candle cluster around $150-155; its connector is lost among the candles.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title and axis titles in light ink #F0EFE8, tick labels in #B8B7B0, grid subtle, legend on #242420 with light border; no dark-on-dark text.
      Data: candle and flag colors identical to the light render; the #4467A3 News label is the dimmest text but still readable; same Q4 Beat crowding among candles.
      Legibility verdict: PASS
