review:
  strengths:
  - Native go.Candlestick with Imprint green/red bull and bear styling and the range
    slider disabled
  - Flags placed above the highest high of an 11-day rolling window with cycled heights,
    so every flag and label clears the candles
  - Event types told apart by both shape and Imprint color, with a legend that lists
    only the event types
  - Theme tokens threaded through title, axes, grid and legend; both renders read
    cleanly
  - Per-flag hovertemplate with type, label and date plus x-unified hover in the HTML
    view
  weaknesses:
  - 'VQ-03, SC-02 (both): the Q2 Beat star sits about $1 above its own wick, so its
    dashed connector is completely hidden, and the 4:1 Split connector shows as one
    dot and one short dash under the square, so the date of those two events cannot
    be read off a line (C3) → a connector of at least about 5 % of the price range
    visible between the candle top and the marker. Likely cause: FLAG_HEIGHTS entries
    0.06 and 0.10 combined with the 18 px marker covering the upper part of the line
    and the long dash pattern.'
  - 'Suggestion: the flag labels use family "Arial Black", which the renderer lacks,
    so they fall back to a serif face; a sans family matching the chrome would unify
    the typography.'
  - 'Suggestion: the connectors could be layout shapes (add_shape with line dash)
    instead of seven extra scatter traces.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across paper and plot area.
      Chrome: centered title "stock-event-flags · python · plotly · anyplot.ai" in dark ink; axis titles "Date" and "Price ($)"; $110-$170 and Feb-Sep 2024 ticks in INK_SOFT; subtle grid; left and bottom axis lines; legend top-right on #FFFDF6 with thin border listing Earnings (star), Dividend (diamond), News (triangle), Split (square). All readable.
      Data: 180 daily candlesticks, bullish #009E73 and bearish #AE3030; seven flags in Imprint order (Earnings #009E73, Dividend #C475FD, News #4467A3, Split #BD8233) with colored dashed connectors and labels (Q4 Beat, Div $0.50, Product Launch, Q1 Miss, 4:1 Split, Div $0.55, Q2 Beat) in a serif fallback font. Every flag now sits above the surrounding candles; Q4 Beat at about $165 with a long connector down to $148. The Q2 Beat star sits just above its wick with no visible connector; the 4:1 Split connector is a dash fragment.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title and axis titles in #F0EFE8, ticks in #B8B7B0, subtle grid, legend on #242420 with light border; no dark-on-dark text.
      Data: candle and flag colors identical to the light render; the #4467A3 Product Launch label is the dimmest text but readable; same flag placement.
      Legibility verdict: PASS
