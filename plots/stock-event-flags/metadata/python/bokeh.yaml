    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, not pure white
      Chrome: title 'stock-event-flags · python · bokeh · anyplot.ai' in dark ink top-left; axis titles 'Date' and 'Price (USD)' and tick labels (Jan-Sep 2024, 120-160) dark and readable; horizontal grid only, subtle; L-shaped frame. Legend in the lower-left empty corner on an elevated fill: Close Price, Earnings, Dividend, News, Split with visible keys
