review:
  strengths:
  - Major/minor event hierarchy through marker size (28 vs 22) and flag offset (0.20
    vs 0.13 of the price range)
  - Legend placed in the empty lower-left area with enlarged glyph_width/glyph_height,
    keys visible in both themes
  - HoverTool restricted to the event renderers with formatted price tooltip ({$0.00})
    for the HTML artifact
  - Fully theme-adaptive chrome; Imprint colors identical across light and dark
  - 'Adaptable data layout: one tidy df with column constants, events derived from
    it'
  weaknesses:
  - 'VQ-02 (both): the price line runs through the ''Partnership'' label (between
    ''a'' and ''r'') and touches the ''t'' of ''2:1 Split'' → keep each flag label
    clear of the price line by at least ~10 px, e.g. by a larger flag offset for these
    events or placing the label on the side away from the line. Likely cause: Label
    x_offset=22 / y_offset=8 with the 0.13/0.20 price_range flag offsets.'
  - 'VQ-03 (both): the News diamond flags read about half the size of the other markers
    (diamond at size=22 is narrow) → size about 30 (+8) for diamonds so all flags
    carry similar weight. Likely cause: scatter size=22 for minor events applied uniformly
    to the diamond marker.'
  - 'Suggestion: highlighted background regions (for example an earnings blackout
    window) behind the price would use the optional Notes feature.'
