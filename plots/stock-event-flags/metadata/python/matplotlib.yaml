review:
  strengths:
  - Brand-green close line stays the dominant series; every event has a dashed connector
    down to a page-edged dot on the price at its exact date
  - Three alternating flag heights keep close events (Feb 14 / Mar 10, May 8 / May
    20) clear of each other
  - 'Event types are told apart twice: semantic Imprint colors and a letter prefix
    (E, D, S, !) in each flag'
  - One-row legend above the axes keeps the plotting area free of chrome
  - Data flows through the column constants and a merge of events onto the price table,
    so the event price is read rather than searched
  - Theme tokens thread through title, ticks, spines, grid, legend frame and flag
    box edges; both renders are fully legible
  weaknesses:
  - 'Suggestion: shade the earnings blackout windows behind the price, as the Notes
    allow, so extended events read as spans.'
  - 'Suggestion: the flag band tops out near 181 while the axis runs to 190; a slightly
    tighter ylim headroom would give the price line more height.'
