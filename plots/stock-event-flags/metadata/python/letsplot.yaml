review:
  strengths:
  - Event types are encoded twice, by Imprint color and by shape, through paired color
    and shape scales that merge into one legend
  - Three-tier staggered flag heights with dashed connectors and price-level dots
    keep the nine flags clear of the price and of each other
  - layer_tooltips gives the price line and the flags templated hover details in the
    HTML export
  - Theme-adaptive chrome with correct backgrounds; both renders are legible
  weaknesses:
  - 'SC-03 (both): the date axis shows only three ticks (Mar, Jun and Sep 2024) for
    a Jan to Sep series, so the dates of the January and February events cannot be
    read off the axis → monthly breaks. Likely cause: scale_x_datetime(format="%b
    %Y") with default breaks.'
  - 'SC-04 (both): the red shaded band from late Jun to mid Aug has no key or label,
    so a reader cannot tell what it marks → a direct label naming the extended event.
    Likely cause: geom_rect drawn without an accompanying geom_text.'
  - 'DE-02 (both): the grid is drawn in solid INK_SOFT, a high-contrast grid, and
    the panel is boxed on all four sides → grid at INK 15 % (rgba(26,26,23,0.15) /
    rgba(240,239,232,0.15)) and left and bottom axis lines only. Likely cause: panel_grid_major=element_line(color=INK_SOFT)
    and the default border of panel_background.'
  - 'Suggestion: flag labels at size 4 could be a step larger to stand beside the
    10 pt tick labels.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white #FAF8F1.
      Chrome: Title 'stock-event-flags · python · letsplot · anyplot.ai' top-left in dark ink; 'Date' and 'Stock Price ($)' axis titles; y ticks 120-175, x ticks only at Mar 2024, Jun 2024 and Sep 2024. The grid is drawn in solid dark gray and reads strongly against the page. The panel is boxed on all four sides. The legend 'Event Type' sits on the right. All text readable.
      Data: Dark-gray price line (about $122-163, Jan to Sep 2024) with a translucent area. Nine flags at staggered heights: Dividend green #009E73 circles, Earnings blue #4467A3 diamonds, News ochre #BD8233 triangles and one Split red #AE3030 square. Each flag has a dashed connector to a gray price dot and a small dark label. A faint red band from late Jun to mid Aug carries no label.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black #1A1A17.
      Chrome: Title, axis titles and labels in light ink; grid lines in light gray are clearly visible; the legend box is elevated dark with light text. No dark-on-dark text.
      Data: The price line is light gray. Flag colors are identical to the light render, and the red band is a dark red tint.
      Legibility verdict: PASS
