      Chrome: title, axis titles and ticks in light ink, all readable; legend and flag boxes on elevated #242420; no dark-on-dark chrome
      Data: same categorical colors as the light render; area fill dark green; blue dividend and red news label text reads weakly on the dark box (~3:1)
      Legibility verdict: PASS (with weak contrast on blue/red flag labels)
