review:
  strengths:
  - Event types encoded redundantly by Imprint color (positions 2-5) and marker shape
    (square, diamond, triangle, circle), CVD-safe in both themes
  - Flags alternate above and below the price with dashed connectors in the type color
    from the price marker, so each event's date reads exactly
  - Flag label text in INK on the elevated box with the type color on the border keeps
    every label legible in both themes
  - Theme tokens threaded through all chrome via sns.set_theme rc; data colors identical
    across themes
  - Realistic tech-equity story with a 2:1 split that really halves the price
  - Price drawn with sns.lineplot(data=df, x=DATE, y=CLOSE) from the tidy frame and
    the column constants
  weaknesses:
  - 'VQ-02 (both): the 2:1 Split flag box sits on the price line''s vertical split
    drop at about $75-87, so the drop runs behind the label → place the split flag
    clear of the drop, e.g. below the post-split price or with a larger offset above
    the pre-split level. Likely cause: flag_y = price_at_event + flag_pct * 1.7 computed
    from the post-split close puts the box inside the drop''s span.'
  - 'Suggestion: highlighted background spans for earnings blackout periods, which
    the Notes allow, would add context.'
