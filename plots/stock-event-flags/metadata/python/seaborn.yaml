review:
  strengths:
  - Event types encoded redundantly by Imprint color and marker shape (square, diamond,
    triangle, circle), CVD-safe in both themes
  - Flags alternate above and below the price with dashed connectors from the price
    marker, so each event's date reads exactly
  - Theme tokens threaded through every chrome element, including the elevated flag
    and legend boxes; data colors identical across themes
  - Realistic data story with a 2:1 split that really halves the price
  - Legend placed in the empty space above the post-split price, clear of the line
    and all flags
  weaknesses:
  - 'VQ-02 (both): the Q4 Earnings flag box sits on the price line around mid-January
    (about $150-160), hiding a short stretch of the price → place that flag clear
    of the line, e.g. a larger offset above. Likely cause: flag_pct = price*0.06*(1+(idx%3)*0.3)
    gives the first flag the smallest offset.'
  - 'SC-01 (both): two dotted regression trend lines with 95% CI bands (Trend (95%
    CI)) are drawn though the spec neither requires nor offers a trend layer → remove
    them and their legend entry. Likely cause: the sns.regplot loop over the pre/post-split
    segments.'
  - 'SC-03 (both): the green area fill under the price runs to an arbitrary baseline
    at 0.9 x the minimum close, so the filled height encodes no value → drop the fill
    (or fill to zero). Likely cause: ax.fill_between(df[DATE], y_base, df[CLOSE])
    with y_base = min*0.9.'
  - 'SC-04 (both): the legend is titled ''Events'' but its first two entries are Stock
    Price and the trend, which are not events → no title, or a title covering all
    entries. Likely cause: ax.legend(title="Events").'
  - 'VQ-01 (dark): the Div $0.50 / Div $0.55 labels (#4467A3) and Product Launch /
    Partnership labels (#AE3030) read weakly on the #242420 flag box, about 3:1 contrast
    → label text in INK with the type color kept on the box border and marker. Likely
    cause: annotate(color=color) for the label text.'
  - 'Suggestion: highlighted background spans for earnings blackout periods, which
    the Notes allow, would add context.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, not pure white
      Chrome: title 'stock-event-flags · python · seaborn · anyplot.ai' dark and centered; 'Date' and 'Stock Price ($)' axis titles and rotated monthly ticks 2025-01..2025-09 readable; y ticks 60-160; y-only subtle grid; top/right spines removed; legend 'Events' in the upper right on an elevated box
      Data: price line in #009E73 with a pale green area fill, falling from ~$160 to ~$132 then halving to ~$66 at the May 2:1 split; two dotted gray trend lines with gray CI bands; 8 flags with dashed connectors - Earnings lavender squares, Dividend blue diamonds, Split ochre triangle, News red circles - with rounded label boxes alternating above and below; the Q4 Earnings box overlaps the price line in mid-January
      Legibility verdict: PASS

    Dark render (plot-dark.png):
