review:
  strengths:
  - 'Imprint palette: price #009E73, event types in positions 2-5, identical in both
    themes'
  - Dashed connectors per event in the event's color link each flag to its date
  - Per-point dict values with labels feed pygal's native HTML tooltips
  weaknesses:
  - 'VQ-01 (both): flag labels print at about 18 px in the light render and in near-black
    on #1A1A17 in the dark render, where they cannot be read → about 44-48 in the
    theme INK. Likely cause: value_font_size=36 for print_labels and no value_colors/value_label_font_size
    in the Style.'
  - 'VQ-07 (dark): wrong-theme chrome: flag labels and the y grid stay near-black
    on the dark page → labels in INK, grid from INK_MUTED. Likely cause: no value_colors
    and no guide_stroke_color/major_guide_stroke_color in the Style.'
  - 'SC-02 (both): C4 missed: the flags'' short labels are not legible in both themes
    → readable labels on every flag. Likely cause: the same value label settings.'
  - 'SC-03 (both): nine month labels are spread evenly over the axis, so ''Dec ''23''
    sits under the Nov 16 dividend and April is missing → ticks at the first trading
    day of each month. Likely cause: chart.x_labels as a string list on pygal.XY.'
  - 'VQ-05 (both): the y axis shows two tick sizes, 300 and 400 at 44 beside the others
    at 56 → one size. Likely cause: label_font_size=56 vs major_label_font_size=44.'
  - 'Suggestion: alternate the flag heights per occurrence instead of one band per
    event type.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1.
      Chrome: title 'Tech Stock 2023 · stock-event-flags · python · pygal · anyplot.ai', axis titles 'Date' and 'Stock Price ($)', y ticks 240-400 and x ticks Jul '23 to Mar '24 in dark ink, readable; y ticks 300 and 400 smaller than the others; nine month labels spread evenly, ending at about 80 % of the axis with no April label; legend Price/Earnings/Dividend/News/Split at the bottom; dotted grid in near-black.
      Data: green #009E73 close-price line over 200 trading days ($236-$363); nine flag dots above the price in per-type bands (earnings lavender, dividend blue, news ochre, split red) with dashed connectors to the price; flag labels ('Q2 Beat', '$0.22', ...) printed at about 18 px, tiny.
      Legibility verdict: PASS for chrome, flag labels barely readable.

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, axis titles, ticks and legend in light ink, readable; the grid stays near-black and almost disappears; the flag labels render in near-black on the dark background and cannot be read.
      Data: price and event colors identical to the light render.
      Legibility verdict: FAIL (flag labels dark-on-dark).
