review:
  strengths:
  - Flags alternate above and below the price in three heights, so no flag covers
    the line and neighbors stay clear of each other
  - Dashed connectors in the event's color run from the exact close to each flag,
    so the event's day reads exactly
  - Event type is encoded twice, by Imprint color and by marker shape, merged into
    one 'Event type' legend through scale_color_manual and scale_shape_manual with
    data-order limits
  - Knock-out geom_label boxes (label_size=0, page fill) keep the bold colored labels
    clean over gridlines
  - Theme tokens threaded through every chrome element; both renders are fully legible
  weaknesses:
  - 'VQ-01 (both): the flag labels are drawn at geom_label size=5.5 and read clearly
    smaller than the 8 pt tick labels and the 8 pt legend text → raise them to the
    8 pt tick reference (about +2.5). Likely cause: size=5.5 in both geom_label layers.'
  - 'Suggestion: highlighted background regions (geom_rect) for an earnings blackout
    period, which the Notes allow, would show the extended-event case.'
  - 'Suggestion: pd.merge_asof(direction=''nearest'') could replace the list comprehension
    that snaps events to trading days.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across canvas and panel.
