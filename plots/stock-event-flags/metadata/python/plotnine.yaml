review:
  strengths:
  - 'Grammar-of-graphics layering: price line, dashed geom_segment connectors, outlined
    geom_point flags and geom_label labels, each from the tidy df'
  - Event type double-encoded by Imprint color in canonical order and by marker shape,
    with legend glyphs that match the marks in both themes
  - Event labels bold in their event's color on page-colored knock-out boxes (geom_label,
    label_size=0), readable and clear of markers in both themes
  - Theme tokens threaded through every chrome element; no dark-on-dark text
  - Neutral, plausible scenario with a 2:1 split jump, quarterly earnings, dividends
    and news inside the spec's size ranges
  weaknesses:
  - 'SC-01 (both): an unrequested LOWESS trend line with a green band (geom_smooth)
    is drawn across the whole series, and it smooths straight through the 2:1 split,
    so it shows a gradual decline the price never had → remove the layer; the price
    line stays the main series. Likely cause: the geom_smooth(method=''lowess'') layer.'
  - 'Suggestion: the price line could carry more weight (slightly thicker or full
    ink) so it stays the clear main series next to the colored flags.'
  - 'Suggestion: highlighted background regions (geom_rect) for an earnings blackout
    period, which the Notes allow, would show the extended-event case.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, not pure white.
      Chrome: bold title 'stock-event-flags · python · plotnine · anyplot.ai' in dark ink; axis titles 'Date' and 'Stock price ($)'; month ticks Jan-Sep 2024 rotated 45 degrees; y ticks 50/100/150; subtle grid; legend 'Event type' at right on the elevated surface without a frame. All readable.
      Data: dark-gray close line ~$150-165 falling to ~$130, a sharp drop to ~$62 at the 2:1 split (late May) and a recovery to ~$75; a green LOWESS trend line runs through it. Eight flags: Earnings green squares (larger, first series #009E73), Dividend lavender diamonds #C475FD, News blue triangles #4467A3, Split ochre circle #BD8233, alternating above/below the price, each joined to the price by a dashed connector in its event color and labelled in bold colored text (Q4 Beat, Div $0.50, New Product, Q1 Miss, 2:1 Split, Div $0.55, Q2 Beat, Partnership), all labels clear of their markers.
