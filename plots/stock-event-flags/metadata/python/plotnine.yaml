      Data: soft-ink price line (~$150 falling to ~$128, the 2:1 split drop to ~$63 in late May, then drifting to ~$74); eight hollow flags alternating above/below: Earnings squares in #009E73 (Q4 Beat, Q1 Miss, Q2 Beat, larger), Dividend diamonds #C475FD, News triangles #4467A3, Split circle #BD8233, each with a colored dashed connector down/up to the close and a bold colored label. No trend layer.
