review:
  strengths:
  - 'Price line in brand green #009E73 stays the dominant series; event types double-encoded
    by shape and Imprint color in one merged legend (scale_color_manual + scale_shape_manual
    sharing the name ''Event'')'
  - Flags staggered in two alternating rows above the price with dashed, type-colored
    connectors down to the close on each event date
  - Earnings windows drawn as faint geom_rect bands behind the price and flags, as
    the Notes allow
  - Bold, type-colored flag labels sit clear above their markers and read in both
    themes
  - 'Full theme-token chrome: correct backgrounds, INK/INK_SOFT text, subtle horizontal
    grid, elevated legend surface'
  weaknesses:
  - 'Suggestion: the ''Decline follows miss'' callout and the red ring are an annotation
    layer the spec does not request; dropping them would keep the chart to the spec''s
    flag vocabulary.'
  - 'Suggestion: the ''New Model'' label starts close to the Q2 Miss emphasis ring;
    a slightly wider gap would ease the top-right cluster.'
