      Data: green #009E73 price line from ~$153 to ~$145 with a peak ~$173; seven flags in two staggered rows above the price (Q4 Beat, Div $0.25, Q1 Beat, Upgrade, Q2 Miss, New Model, Div $0.28), each with a dashed type-colored connector down to the price and a bold type-colored label clearly above its marker; three faint earnings bands; red ring around Q2 Miss and a red curved arrow with italic 'Decline follows miss' left of the price line.
