review:
  strengths:
  - Custom Chart.js plugin (beforeDatasetsDraw/afterDatasetsDraw) implements flag-style
    event markers with alternating up/down and near/far placement across all 8 events,
    avoiding overlap along the full date range.
  - 'All spec-required features are present: dashed connector lines from each flag
    to the exact price level, distinct Imprint-palette colors per event type, a real
    native hover tooltip revealing full event detail via an invisible ''Event Detail''
    dataset, and a shaded blackout-period band for the pre-earnings window.'
  - 'Realistic, factually consistent data: the 2-for-1 split correctly halves the
    nominal price series from the split date forward, dividend amounts are plausible,
    and the price walk is a deterministic LCG-seeded random process.'
  - 'Theme-adaptive chrome and Imprint palette are applied correctly and identically
    across both light and dark renders — first series is #009E73, event-type colors
    use sensible palette positions (skipping the semantic-red anchor since none of
    the event types represent a loss).'
  weaknesses:
  - Y-axis tick values are not evenly spaced/rounded ($199, $180, $160 ... $40, $30)
    because yMin/yMax are computed as minPrice - priceRange*0.3 / maxPrice + priceRange*0.3
    without rounding to a clean step — snap the axis bounds to the nearest round number
    (e.g. nearest $10) so Chart.js generates uniform tick labels.
  - Design Excellence is good but not exceptional — flag badges are uniform rounded
    rectangles differentiated only by color, with no further typographic or shape
    hierarchy between event types.
  - 'Library Mastery: the custom plugin is fairly generic canvas drawing that could
    be replicated with only minor changes in other canvas-based libraries — leaning
    further into Chart.js-specific capabilities would raise distinctiveness.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matching #FAF8F1 — not pure white.
      Chrome: Title "stock-event-flags · javascript · chartjs · anyplot.ai" in bold dark ink, clearly visible; legend (Close Price, Earnings, Dividend, Stock Split, News) centered under the title in dark text with colored swatches; "Trading Date" and "Close Price (USD)" axis titles dark and readable; tick labels in medium-gray, all legible; y-axis gridlines subtle horizontal lines, x-axis has no gridlines.
      Data: Green (#009E73) close-price line runs across the full width; a light tan/gray shaded band marks the pre-earnings blackout window (~Jan 18–Feb 5); 8 rounded-rectangle event flags in distinct colors (lavender=Earnings, blue=Dividend, ochre=Stock Split, cyan=News) sit above/below the price line, each connected by a dashed line down to a colored anchor dot at the exact price/date; the stock split produces a sharp, correctly-modeled halving of the price series.
      Legibility verdict: PASS — no text is light-on-light; all elements are readable at full resolution, and margins/edges have no clipped text (verified via crops of all four canvas borders).

    Dark render (plot-dark.png):
      Background: Warm near-black, matching #1A1A17 — not pure black.
      Chrome: Title, legend, and axis titles render in light/white text against the dark background, clearly visible; tick labels in light gray; gridlines subtle and still visible; blackout band renders as a light-gray semi-transparent rectangle, appropriately visible against dark chrome.
      Data: Data colors are pixel-identical to the light render — the green close-price line, the four event-flag colors (lavender/blue/ochre/cyan), and anchor dots all match; only chrome (background, gridlines, text, dashed connector color) flips to the dark-theme tokens.
      Legibility verdict: PASS — no dark-on-dark failures; every title, axis label, tick label, and flag text string is clearly legible against the near-black surface.
