review:
  strengths:
  - Custom SVG icons per event type (bar icon for earnings, $ circle for dividends,
    split arrows, five-point star for news) differentiate categories beyond color
    alone — CVD-safe by design.
  - 'Robust flag-placement algorithm: alternating above/below anchors, drawingArea-clamped
    box positions, and an elbow-routed dashed connector when the box has to be nudged
    in from the plot edge — no collisions across 8 densely-timed events.'
  - 'Correct Imprint palette usage: brand green (#009E73) reserved for the price line,
    event colors drawn from canonical palette positions with a sensible semantic exception
    (ochre for dividends/money).'
  - Idiomatic MUI X composition pattern — custom marks drawn via useXScale/useYScale/useDrawingArea
    against the shared LineChart scale, exactly the documented approach for content
    outside the community chart surface.
  - Theme-correct chrome in both renders with identical data colors; only background/grid/text
    flip as expected.
  - Explicit font sizing throughout (title auto-shrinks for long strings, axis/tick/legend
    sizes all set), deterministic LCG-seeded data generation, clean imports.
  - Compact pill-style legend for event types sits directly under the plot rather
    than floating isolated.
  weaknesses:
  - Title font auto-shrinks proportionally for the 78-char prefixed title, landing
    near ~45% of plot width — noticeably under the ~70-85% typical for the mandated-title
    format; could size a touch larger for stronger visual presence without risking
    overflow.
  - Y_MAX headroom (maxClose + 0.5*range) leaves a sizeable empty band above the highest
    price that only some flags occupy, giving the chart a slightly top-heavy asymmetric
    margin versus the tighter bottom padding.
  - Design is polished and semantically color-coded but stays within standard patterns
    (palette + custom icons); a stronger visual anchor (e.g., a subtle callout of
    % price move at each flag) would push it into truly publication-grade territory.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matching #FAF8F1 — not pure white.
      Chrome: Title "TechCore Inc. Stock Price · stock-event-flags · javascript · muix · anyplot.ai" centered at top in dark ink, clearly readable. Y-axis "Share Price (USD)" rotated on the far left, X-axis "Trading Date" below the plot, both dark and legible. Tick labels ($140-$205, Jan-Nov) in soft dark gray, subtle dashed horizontal gridlines. Pill-shaped legend (Earnings/Dividend/Stock Split/News) centered below the chart.
      Data: Brand-green (#009E73) price line with a light green area fill beneath it. Eight event flag boxes (white/elevated background, colored left accent bar and border) connected to their exact trading day via a thin dashed pole (plus an elbow segment when nudged off a point) and a small ring marker on the line. Flags alternate above/below the line and use distinct colored icons (blue bar-chart for earnings, ochre $-circle for dividends, lavender arrows for the split, cyan star for news).
      Legibility verdict: PASS — all title, axis, tick, and flag text is clearly readable against the light background; no light-on-light text found.

    Dark render (plot-dark.png):
      Background: Warm near-black, matching #1A1A17 — not pure black.
      Chrome: Same title, axis labels, and tick labels now rendered in light ink/gray, fully legible against the dark surface. Gridlines remain subtle dashed lines, visible but unobtrusive. Legend pills use a dark elevated background with light text.
      Data: Price line and area fill are the identical brand-green (#009E73) as the light render — confirmed unchanged. Event flag boxes keep their identical colored borders/icons (blue, ochre, lavender, cyan); box fill uses the dark elevated surface with light-colored event-label text, and the event sub-label (type · date) in a lighter gray.
      Legibility verdict: PASS — no dark-on-dark failures; all flag text, axis ticks, and title remain clearly visible against the near-black background.
