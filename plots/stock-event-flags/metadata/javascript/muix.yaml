review:
  strengths:
  - Each event type gets both a distinct stroked icon (bar chart for earnings, dollar
    for dividend, star for news, split fork for the stock split) and a distinct Imprint
    color, carried consistently through flag tab, border, dashed pole, event ring
    marker and the pill legend
  - Flags alternate above and below the price and are placed with the drawing-area
    scale hooks against the price extremes under each flag's span, so no flag covers
    the price line and none collides with a neighbour in either render
  - Composes a custom SVG layer as a child of LineChart using useXScale / useYScale
    / useDrawingArea, so flags share the chart's exact coordinate system and the native
    line tooltip still works in the HTML
  - Month ticks via a tickInterval function and a location-aware valueFormatter (month
    on ticks, full day in the tooltip) - idiomatic MUI X v9 axis configuration
  - 'Price data is plausible and tied to the events: earnings beats/miss move the
    close on the day while the ex-dividend dates and the (adjusted) split do not,
    so the chart reads as a real event-impact study'
  - All chrome is threaded from ANYPLOT_TOKENS (ink, inkSoft, grid, elevatedBg, pageBg);
    both themes are fully legible with identical data colors
  weaknesses:
  - 'VQ-07 (both): the Stock split event type is drawn in #AE3030, the matte-red semantic
    anchor reserved for bad / loss / error, reached here only by ordinal position
    although a split carries no negative meaning → a non-semantic Imprint hue such
    as slot 6 cyan #2ABCCD. Likely cause: color: t.palette[1 + eventTypes.indexOf(type)]
    walks the palette in order into slot 5.'
  - 'Suggestion: the area fill runs down to the axis minimum of about 136 rather than
    to zero; a plain line (area: false) would avoid implying a baseline the price
    does not have.'
  - 'Suggestion: tie the Q2 earnings miss to its drop more visibly, e.g. by naming
    the move in the flag''s detail line ("-7 %"), to strengthen the event-impact reading.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole canvas, no pure white.
      Chrome: centered bold title "stock-event-flags · javascript · muix · anyplot.ai" (~31% width) with a soft subtitle "220 trading days, Jan 2, 2024 to Nov 4, 2024 · 8 events"; y-axis "Close (USD)" 140-200 by 5, x-axis "Trading date" with month ticks Jan-Nov; subtle horizontal grid; a row of pill-shaped legend chips at the bottom (News star, Earnings bars, Dividend $, Stock split fork). All text dark and readable.
      Data: brand-green #009E73 close line with a faint green area fill; 8 flag cards (elevated background, colored left tab and border, icon, bold label, soft "type · date" detail) alternating above/below the price with dashed poles to page-filled ring markers on the price at the event date. News lavender, Earnings blue, Dividend ochre, Stock split matte red. No flag covers the price line or another flag.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17, not pure black.
      Chrome: title, subtitle, axis titles and ticks in light ink, grid lines subtle but visible, flag cards and legend chips on the dark elevated surface with light text; no dark-on-dark text anywhere.
      Data: identical colors to the light render (green line, lavender/blue/ochre/red event colors); area fill reads as a dark green tint; brand green clearly visible.
      Legibility verdict: PASS
