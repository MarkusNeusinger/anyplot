review:
  strengths:
  - Flags are drawn as an SVG overlay inside LineChart using the v9 hooks useXScale,
    useYScale and useDrawingArea, so each flag, dashed pole and hollow anchor circle
    sits exactly on the close of its trading day
  - The placement alternates above and below and checks the price under each box's
    own span and the boxes already placed on that side, so all eight flags clear the
    price line and each other in both renders
  - Event types are encoded twice, by Imprint color and by a hand-drawn icon (bars,
    dollar, split fork, star), and the pill legend repeats those icons. Brand green
    stays on the price, and matte red is deliberately kept off all categories
  - 'Flag cards have a two-level type hierarchy: a bold ink label over a soft ''type
    · date'' detail line, plus a colored accent stripe on an elevatedBg card, in both
    themes'
  - 'Uses idiomatic MUI X v9 axis API: tickInterval puts ticks on month starts, and
    a valueFormatter keyed on ctx.location shows short month ticks but full dates
    in the native axis tooltip'
  - Data is a plausible one-year tech-stock scenario. Earnings beats and misses move
    the price on the day, while the ex-dividend dates and the already-adjusted split
    do not, so the flags line up with the price story
  weaknesses:
  - 'Suggestion: give each flag a native SVG <title> (or an onClick detail) so the
    HTML view also reveals event details on hover, in line with the Notes'' interaction
    bullet'
  - 'Suggestion: the area fill runs down to the padded y minimum (about 136) rather
    than a meaningful baseline; a line-only price or a lighter fill would keep the
    flags as the only occupants of the padding band'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole canvas, not pure white.
      Chrome: bold centered title "stock-event-flags · javascript · muix · anyplot.ai" with a soft subtitle "220 trading days, Jan 2, 2024 to Nov 4, 2024 · 8 events". The y-axis is "Close (USD)" with ticks from 140 to 200 in steps of 5, the x-axis is "Trading date" with month ticks from Jan to Nov, and the horizontal grid is subtle. All text is dark on light and readable.
      Data: brand-green #009E73 close line with a pale green area fill. There are 8 flag cards with colored accent stripes, icons, a bold label and a soft "type · date" line. News is lavender (star), Earnings blue (bars), Dividend ochre ($) and Stock split cyan (fork). Cards alternate above and below the price, each with a dashed pole down or up to a hollow circle on the close. No flag overlaps the line or another flag. A bottom pill legend shows the four event types with their icons.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17, not pure black.
      Chrome: the title, subtitle, axis titles and tick labels flip to light ink and are all readable; there is no dark-on-dark text. The grid is subtle but visible, and the flag cards and legend pills use the dark elevated surface with light label text.
      Data: identical colors to the light render (green price, lavender, blue, ochre and cyan flags); only the chrome flipped. The green area fill is a dark green tint. The blue earnings icons are the dimmest element but still distinguishable.
      Legibility verdict: PASS
