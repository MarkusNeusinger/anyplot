      Data: Close-price line is brand green, sampled pixel (0,158,115) = #009E73 exact match. Event markers: purple triangles (Earnings), blue diamonds (Dividend), ochre square (Stock Split), cyan circles (News) — matching Imprint palette positions 2/3/4/6.
