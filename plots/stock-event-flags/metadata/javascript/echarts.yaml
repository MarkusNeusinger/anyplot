review:
  strengths:
  - 'Theme-adaptive chrome is correct in both renders: warm off-white #FAF8F1 background
    with dark ink text in light mode, warm near-black #1A1A17 with light text in dark
    mode, and every data color (candles + 4 event colors) is pixel-identical between
    the two renders.'
  - Custom pin-shaped flag markers with per-lane rotation (upper flags point down,
    lower flags point up) give the event markers a distinct, polished identity beyond
    a generic scatter dot, directly matching the spec's 'distinct icons... for different
    event types' requirement.
  - 'Smart semantic color reuse: candlestick bullish/bearish colors use Imprint palette[0]
    (brand green) and palette[4] (the palette''s designated semantic-red anchor for
    loss/bad), freeing palette[1]/[2]/[3]/[5] for the four event types without collision
    — a thoughtful, non-arbitrary color allocation.'
  - Dashed markLine connectors precisely link each flag to its exact price/date on
    the candlestick series, satisfying the spec's 'vertical dashed lines from flags
    to the price level for precise date alignment' requirement.
  - Alternating upper/lower lane placement is planned around actual event spacing
    (e.g. two nearby events in May are deliberately placed in opposite lanes) so no
    two flags ever collide, and price data is never obscured.
  - Per-series tooltip formatter surfaces the full event label and date on hover,
    satisfying 'hover interactions should reveal full event details' without cluttering
    the static PNG — correctly leveraged as an interactive-library strength.
  - Deterministic in-memory data generation via a small seeded LCG, exactly matching
    the library's reproducibility guidance for browser-side JS.
  weaknesses:
  - The 4 event-type colors (palette[1] lavender, [2] blue, [3] ochre, [5] cyan) are
    otherwise fine but earnings (lavender) and dividend (blue) sit fairly close in
    hue for some CVD profiles — mitigated by the distinct glyph letters (E vs D),
    but worth keeping in mind if more event types are ever added.
  - Roughly 35-40% of the y-axis vertical range is reserved purely for the upper/lower
    flag lanes, compressing the actual candlestick price action into the middle band
    — functional and avoids obscuring data as required, but a slightly tighter lane
    padding would give the price series more visual weight.
  - The optional spec suggestion of highlighted background regions for extended events
    (e.g. earnings blackout periods) was not attempted — acceptable since the spec
    marks it as a 'consider', not a requirement.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white, not dark.
      Chrome: Title "stock-event-flags · javascript · echarts · anyplot.ai" centered at top in dark ink, clearly legible. Legend row below title (Price/Earnings/Dividend/Split/News) in soft ink gray, all readable. Y-axis dollar-formatted tick labels and X-axis date labels (e.g. "Jan 2", "Feb 5") in soft gray, clearly legible against the light background. Grid lines are subtle horizontal gray lines, visible but not dominant.
      Data: Candlestick price series uses brand green (#009E73) for up-days and matte red for down-days, both clearly distinguishable from the background and from each other. Nine pin-shaped event flags (lavender "E" for earnings, blue "D" for dividend, ochre "S" for split, cyan "N" for news) sit in alternating lanes above/below the price band, each connected to its exact price point by a thin dashed line in the same color. First series (bullish candle) is the brand green as required.
      Legibility verdict: PASS — no light-on-light or illegible text anywhere.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black, not light.
      Chrome: Title and legend render in near-white/light-gray text, clearly legible against the dark background. Y-axis and X-axis tick labels are in a light soft-gray tone, clearly visible with no dark-on-dark issue. Grid lines are faint but visible light-gray horizontal lines.
      Data: All data colors (candlestick green/red, and the four event-flag colors: lavender, blue, ochre, cyan) are identical to the light render — only the chrome (background, text, grid) flipped, exactly as required. Flag glyph letters remain off-white and readable against their colored pin backgrounds.
      Legibility verdict: PASS — no dark-on-dark failures; every title, label, and tick is clearly readable.
