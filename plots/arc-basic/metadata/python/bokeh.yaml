review:
  strengths:
  - Arcs are native p.bezier glyphs with both control points at a height proportional
    to node distance, so long-range links rise clearly above short ones
  - Arc color follows the theme's current imprint_seq marks stops, reinforced by width
    and alpha, with the dark stops on the dark render
  - All text sized for the 3200x1800 canvas (50pt title, 34pt labels and legend) and
    readable in both themes
  - 'Vectorized data flow: one DataFrame of arc geometry, one ColumnDataSource per
    weight level, LabelSet for node labels'
  - HoverTool with line_policy='interp' shows each connection and its shared-scene
    count in the HTML
  weaknesses:
  - 'VQ-03 (both): the weight-1 arcs (most visible in dark), the ramp''s low end,
    are drawn at alpha 0.65, so on the dark page the olive #6F7E20 lines fade toward
    about 2.4:1 against #1A1A17 and read dim beside the heavier arcs → let the opacity
    fall from 1 at the low end to the translucent alpha at the high end, as the style
    guide''s marks-ramp opacity rule asks. Likely cause: line_alpha=0.55 + 0.3 * level
    / w_max rises with weight instead of falling.'
  - 'Suggestion: ordering nodes so the Mara hub sits mid-line would shorten the longest
    arcs and reduce crossings.'
  image_description: |-
