review:
  strengths:
  - Arcs are native p.bezier glyphs with both control points at a height proportional
    to node distance, so long-range links rise clearly above short ones
  - Arc color follows the theme's imprint_seq marks stops, with the dark stops on
    the dark render, reinforced by width and alpha
  - All text sized for the 3200x1800 canvas (50pt title, 34pt labels and legend) and
    readable in both themes
  - 'Vectorized data flow: one DataFrame of arc geometry, one ColumnDataSource per
    weight level, LabelSet for node labels'
  - HoverTool with line_policy='interp' shows each connection and its shared-scene
    count in the HTML
  weaknesses:
  - 'Suggestion: ordering nodes so the Mara hub sits mid-line would shorten the longest
    arcs and reduce crossings.'
