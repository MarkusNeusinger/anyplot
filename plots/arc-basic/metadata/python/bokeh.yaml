    Grace, Henry, the stock placeholder sequence, and the subtitle says only ''Chapter
    1'' → character names from a fictional story with its own setting. Likely cause:
    the SOURCE/TARGET name lists.'
  - 'Suggestion: ordering nodes so the hub sits mid-line would shorten the longest
    arcs and reduce crossings.'
