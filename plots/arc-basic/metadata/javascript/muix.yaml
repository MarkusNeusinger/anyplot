review:
  strengths:
  - 'Builds the arc layer the documented MUI X v9 way: ChartsContainer with hidden
    linear axes, and a custom ArcLayer component that reads node and baseline positions
    through the useXScale/useYScale hooks, so every arc and node sits exactly on the
    chart''s own scales'
  - 'Interaction type is double-encoded, color plus dash pattern (Activates solid
    #009E73, Represses dashed #AE3030), so the type stays readable without relying
    on red-green alone'
  - 'Interaction strength drives both stroke width (1.6–3.4 px) and opacity (0.52–0.82):
    the strong PIK3CA→AKT1 link reads as the main arc and weak links recede, which
    matches the semi-transparent arcs the Notes ask for'
  - The header carries a compact inline key (line samples for both types plus the
    height and width encodings) and a data-derived subtitle (18 nodes · 23 arcs ·
    strength 1–4), with no axes or grid, as the spec asks
  - Node labels are rotated −40° and end-anchored at their nodes, so all 18 gene names
    (NOTCH1, PIK3CA included) fit without colliding
  - A realistic gene-regulation scenario that matches the spec's genomics application,
    with plain-language column names
  weaknesses:
  - 'VQ-03 (dark): the weakest arcs (weight 1 at stroke-opacity 0.52, e.g. the FOXP2–ACE2
    span and the dashed BRCA2–CDK4 and BRCA1–ACE2 Represses arcs) almost dissolve
    into the #1A1A17 background, and the long FOXP2–ACE2 arc is hard to follow to
    its end nodes in the 800 px preview → raise the minimum opacity to about 0.7 (+0.18)
    or the minimum stroke to about 2.2 px (+0.6 px). Likely cause: STROKE_ALPHA_MIN
    = 0.52 and STROKE_MIN_PX = 1.6, applied the same way on both themes.'
  - 'VQ-01 (both): node labels at 14 px in inkSoft, rotated −40°, turn into a blur
    at the 400–800 px preview sizes, which is the only place node identity is shown
    → about 16 px (+2 px). Likely cause: fontSize={14} on the node <text>.'
  - 'Suggestion: the gap between the Represses key item and the ''· Arc height ∝ …''
    explanation is wider than the gap between the two key items; one consistent gap
    would tidy the header row.'
  - 'Suggestion: an MUI X tooltip on hover (e.g. through ChartsTooltip with a custom
    item) would let the HTML view name source, target and strength for each arc.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white, #FAF8F1, with no axes, grid or spines.
      Chrome: bold dark title "arc-basic · javascript · muix · anyplot.ai" at the top left (about 29 % of the width), a subtitle in inkSoft ("18 nodes · 23 arcs · Interaction strength: 1–4"), and a key row (green solid line "Activates", red dashed line "Represses", "· Arc height ∝ sequence distance · Stroke width ∝ Interaction strength"). 18 gene labels (FOXP2 … ACE2) are rotated −40° under the nodes, dark grey and readable.
      Data: 18 brand-green #009E73 nodes evenly spaced on one horizontal line; 23 quadratic arcs above it. Activates arcs are #009E73 and solid; Represses arcs are #AE3030 and dashed. Height grows with node distance: 17 short neighbor arcs, mid-range arcs (MYC–TP53, KRAS–BRCA2, TP53–BRCA1), and a tall FOXP2–ACE2 arc spanning the line. Width and opacity grow with weight; the thick PIK3CA–AKT1 arc stands out.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black, #1A1A17.
      Chrome: title in light ink, subtitle, key and node labels in light grey inkSoft. All readable, with no dark-on-dark text.
      Data: identical node and arc colors to the light render (#009E73 green, #AE3030 red, same dashes, widths and opacities). Only chrome flips. Brand green reads well. The low-opacity weight-1 arcs (FOXP2–ACE2, dashed BRCA2–CDK4, BRCA1–ACE2) are faint against the dark page but still traceable at full size.
      Legibility verdict: PASS (text). Weak arcs have low contrast; see the VQ-03 defect.
