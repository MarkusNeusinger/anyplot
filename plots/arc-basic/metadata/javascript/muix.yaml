review:
  strengths:
  - 'Composes the chart natively in MUI X v9: an empty ChartsContainer with hidden
    linear axes provides the scales, and a custom ArcLayer reads them through useXScale/useYScale
    to draw quadratic-Bézier arcs, so node positions come from the sequence index
    and not from data values'
  - Arc apex height is linear in index distance (MIN_ARC_HEIGHT + MAX_ARC_SPAN·|b−a|/maxDistance),
    so the FOXP2→ACE2 span rises clearly above the long-range links, which rise above
    the adjacent-node hops
  - 'Regulation type is encoded twice, brand green solid for Activates and the semantic
    red anchor #AE3030 dashed for Represses, so the two types stay distinguishable
    without color vision'
  - Nodes carry a page-colored 1.5 px ring that separates them from the arcs piling
    into them; the rotated −40° labels at 16 px sit cleanly under each node without
    colliding
  - Theme tokens are threaded through every element (t.ink, t.inkSoft, t.pageBg, t.palette),
    so the chrome flips correctly while data colors stay identical
  - skipAnimation is set, and the data is hard-coded and deterministic
  weaknesses:
  - 'VQ-03 (dark): the weight-1 Represses arcs (BRCA2→CDK4, BRCA1→ACE2) at 2 px, dashed,
    0.7 opacity are faint against #1A1A17 and hard to follow to their end nodes →
    about 2.6 px minimum stroke (+0.6 px) or a minimum opacity of about 0.85 (+0.15).
    Likely cause: STROKE_MIN_PX = 2 together with STROKE_ALPHA_MIN = 0.7.'
  - 'DQ-02 (both): real gene symbols (FOXP2, ACE2, APOE, BRCA1 …) are wired into invented
    regulatory links such as FOXP2→ACE2 and APOE→ACE2 that read as biological claims
    → use the documented edges of one real pathway, or rename the nodes to clearly
    fictional identifiers. Likely cause: the data block''s source/target pairs.'
  - 'Suggestion: the mandated title fills only about 29 % of the width; a slightly
    larger title (about 26 px) would give the header more weight over the long legend
    row.'
  - 'Suggestion: a small stroke-width key (a thin and a thick line sample labelled
    1 and 4) would show the weight encoding instead of describing it in text.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 over the full 3200×1800 canvas.
      Chrome: bold dark title "arc-basic · javascript · muix · anyplot.ai" at the top left, a soft-ink subtitle "18 nodes · 23 arcs · Interaction strength: 1–4", and an inline legend row (green solid "Activates", red dashed "Represses", "· Arc height ∝ sequence distance · Stroke width ∝ Interaction strength"). There are no axes or grid. 18 gene labels (FOXP2 … ACE2) rotated −40° under the nodes, all dark and readable, with no collisions.
      Data: 18 brand-green #009E73 nodes with page-colored rings on one horizontal line near the bottom. 23 arcs above the line: adjacent hops at a uniform low height, longer links rising with distance, and the FOXP2→ACE2 arc spanning almost the full width at the top. Activates arcs are green and solid, Represses arcs are matte red #AE3030 and dashed; stroke widths of 2–3.8 px follow the weight.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: the title is light ink and the subtitle, legend row and node labels are light soft ink, all readable; there is no dark-on-dark text.
      Data: node and arc colors are identical to the light render (green #009E73, red #AE3030); only the chrome flipped. The thinnest dashed red arcs (BRCA2→CDK4, BRCA1→ACE2) are faint on the dark surface but still traceable.
      Legibility verdict: PASS
