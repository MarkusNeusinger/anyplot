review:
  strengths:
  - Clever, correct use of MUI X's low-level useXScale/useYScale hooks with ChartContainer
    to render an arc diagram, a chart type MUI X has no native component for, instead
    of faking it or bailing to NOT_FEASIBLE.
  - 'Faithful coverage of every spec-required feature: ordered nodes along a single
    baseline, arc height proportional to node distance, edge weight (strength) driving
    arc thickness/opacity, semi-transparent overlapping arcs, and readable rotated
    node labels.'
  - 'Thoughtful data-driven encoding: node radius scales with node degree (highlighting
    hub genes like TP53/BRCA1), and arc width/opacity scale with interaction strength,
    creating real visual hierarchy.'
  - Clean, deterministic, minimal code with only the components genuinely needed (edge
    layer, node layer, legend, chart) and no fake interactivity.
  - 'Correct, theme-adaptive Imprint palette usage in both renders: brand green (#009E73)
    for ''activate'', semantic-anchor matte red (#AE3030) for ''repress'' per the
    finance gain/loss convention, with backgrounds and text correctly flipped between
    light and dark.'
  weaknesses:
  - Green (activate) vs. red (repress) is the sole visual signal distinguishing edge
    direction; add a secondary encoding (e.g. dashed stroke for 'repress', or a subtle
    arrowhead) so the distinction survives for readers who can't rely on hue alone.
  - Title and legend rows sit flush against the left canvas edge (text starts at x=0,
    no left padding), which reads inconsistently against the chart area's own 50px
    margins — add matching left padding (~24-32px) to the title/legend container.
  - The longest, weakest-strength arc (FOXP2-ACE2, strength 1) is quite pale in both
    themes (strokeOpacity ~0.42) and easy to miss at a glance; raise the opacity floor
    slightly so long-range, lower-strength connections stay clearly visible.
  - The chart never touches any of MUI X's own chart/series components (series is
    passed as an empty array) — the actual drawing is 100% custom SVG riding on ChartContainer's
    scale context; this is the right call for an unsupported chart type but doesn't
    showcase MUI X-specific richness beyond the scale hooks.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "arc-basic · javascript · muix · anyplot.ai" in dark ink, clearly legible top-left (flush to the canvas edge, no left padding). Legend row below the title lists a green swatch + "Activates", a red swatch + "Represses", and explanatory text "Arc height ∝ distance along the chromosome" — all in readable dark-gray secondary text. 18 gene node labels along the baseline are rotated ~-40°, dark-gray, and legible without overlapping each other or the arcs.
      Data: 18 green node circles (radius scaled by connection degree — TP53 and BRCA1 are visibly the largest hubs) sit on a horizontal baseline. 23 arcs curve above the baseline: green for "activate" edges, matte red for "repress" edges, with stroke width and opacity increasing with interaction strength. Arc height correctly grows with node distance — the tallest arc spans the leftmost and rightmost genes. The first categorical color is #009E73 as required.
      Legibility verdict: PASS — all title, legend, and node-label text is clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Title and legend text switch to light ink/gray, clearly legible against the dark background. Node labels are light gray and legible. No dark-on-dark failures observed anywhere (title, legend, or node labels).
      Data: Node and arc colors are identical to the light render (same green/red hues, same degree- and strength-driven sizing) — only the background and text chrome flipped, exactly as required. Brand green remains clearly visible on the dark surface.
      Legibility verdict: PASS — all text is clearly readable against the dark background; data colors are confirmed identical to the light render.
