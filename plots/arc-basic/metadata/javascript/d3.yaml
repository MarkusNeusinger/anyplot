review:
  strengths:
  - Weight is encoded through two redundant channels (arc stroke-width 1.5-7px and
    stroke-opacity 0.25-0.65), so interaction strength stays readable even where several
    arcs cluster together.
  - Arc height is proportional to node distance exactly as the spec's notes require,
    so the one long-range connection (Elena-Sana) is instantly distinguishable from
    the many short/medium-range interactions.
  - Title font-size is deliberately computed via the mandated linear scaling formula
    (round(22 x 67/len)) rather than left at the default, correctly avoiding overflow
    for the longer descriptive-prefixed title.
  - Minimalist open-circle nodes (page-background fill, ink stroke) and a single thin
    baseline keep the chrome unobtrusive so the arcs read as the primary content.
  - Theme tokens are threaded through every chrome element (baseline, node stroke/fill,
    node-label text, title) - both renders are legible and the data color is identical
    across themes.
  weaknesses:
  - The single Elena-Sana arc (span 11, far larger than any other edge) dominates
    arcHeight's [0, maxSpan] domain, so the other 19 shorter/medium arcs all compress
    into the bottom ~35-40% of the canvas and the upper half is nearly empty except
    for that one line. Use a domain that resists a single outlier (e.g. d3.scaleSqrt,
    or clamp the domain to a lower percentile of spans) so the main cluster fills
    more of the available height.
  - No secondary encoding differentiates edge type/category, only a single Imprint
    green is used for every arc - the spec's optional note ('Consider color coding
    edges by type or weight when applicable') was skipped. Not a hard requirement,
    but a color-by-weight-tier or category encoding would add another layer of storytelling.
  - Library usage is correct and idiomatic (scalePoint, data-join, manual quadratic-Bezier
    arcs, which is the standard D3 arc-diagram technique) but doesn't reach for any
    more distinctive d3-shape/d3-interpolate feature beyond basic scales.
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white, consistent with #FAF8F1 - not pure white.
      Chrome: Bold dark-ink title "Character Interactions in a Novel · arc-basic · javascript · d3 · anyplot.ai" centered at top, clearly readable. Twelve character names (Elena, Marcus, Priya, Tobias, Wren, Osei, Ingrid, Ravi, Nadia, Colton, Beatrix, Sana) sit as small open circles (cream fill, dark ink stroke) along a thin dark baseline near the bottom, each with a soft gray label beneath. All chrome text is dark-on-light and easy to read.
      Data: Semi-transparent brand-green (#009E73) arcs connect node pairs above the baseline. Most arcs are short/medium-height and cluster tightly just above the baseline; one large arc spans almost the full width, rising to just below the title and connecting the first and last characters (Elena, Sana). Stroke width and opacity both vary with edge weight, so heavier interactions read as thicker, more opaque arcs.
      Legibility verdict: PASS - all title and node-label text is clearly readable against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: warm near-black, consistent with #1A1A17 - not pure black.
      Chrome: Title now renders in light/off-white ink, still centered and clearly readable. Node labels render in a lighter gray, baseline and node-outline strokes flip to a light ink tone so nodes stay visible against the dark surface.
      Data: The arcs remain the identical brand green (#009E73) seen in the light render - same hue, same stroke-width/opacity encoding by weight - confirming only chrome (not data color) flipped between themes.
      Legibility verdict: PASS - no dark-on-dark text; all title, node-label, and baseline elements are clearly visible against the dark background.
