review:
  strengths:
  - Correct arc-diagram form implemented via a legitimate Highcharts technique (chart.renderer.path
    drawn on the chart 'render' event over a scatter baseline) since the core-only
    bundle has no native arc/network module — a solid workaround with no forbidden
    add-on modules.
  - Coupling strength is encoded redundantly via both stroke width and opacity, giving
    a clear, readable visual hierarchy without relying on color alone.
  - 'Correct Imprint palette usage (brand green #009E73 for the single series) and
    fully theme-adaptive chrome — title, subtitle, rotated node labels, and node markers
    all flip correctly and stay legible in both the light and dark renders.'
  - Realistic, neutral CI/CD pipeline scenario with plausible coupling weights, showing
    both dense short-range coupling and a clear long-range connection, illustrating
    the intended arc-diagram use case well.
  - Title format matches the mandated pattern exactly, the single-series legend is
    correctly omitted, and animation is disabled per the harness contract (chart.animation
    + plotOptions.series.animation).
  weaknesses:
  - 'Large empty region across the top ~35-40% of the canvas: arcHeight is scaled
    linearly by distance/maxDistance, so only the single longest-distance edge (Checkout→Monitor,
    weight 2, low opacity) reaches near the top while every visually prominent, thick/opaque
    arc is compressed into the bottom third of the plot area. Use a less aggressive
    height curve (e.g. sqrt(distance/maxDistance), or cap maxHeight around 60-70%
    of plotHeight) so mid-distance arcs also rise and the canvas fills more evenly.'
  - The faintest/thinnest arcs (weight=2 edges, e.g. Checkout→DeployProd, Build→DeployProd)
    sit at ~0.37 opacity and are hard to spot against both backgrounds, especially
    at reduced/mobile size. Raise the opacity floor slightly (e.g. 0.35-0.4 minimum
    with a narrower ramp) so low-weight long-range connections stay legible.
  - Design Excellence is held back by the top-heavy whitespace noted above — the composition
    reads as correct-but-unbalanced rather than fully polished; tightening the arc-height
    scale would also lift canvas utilization and visual refinement.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1-consistent), not pure white.
      Chrome: Bold dark title "arc-basic · javascript · highcharts · anyplot.ai" and a grey subtitle explaining the encoding are both clearly legible at the top. 14 node labels ("Checkout" through "Monitor") are rotated ~-55° below the baseline in a soft dark-grey tone, all readable without overlap. No axis lines, ticks, or grid are shown (deliberately minimal chrome).
      Data: All arcs render in a single green hue (brand #009E73) with stroke width and opacity scaled by coupling weight — thick, saturated arcs for tightly-coupled short-range stages near the baseline, and one thin, pale, wide arc spanning almost the full width near the top for the weakest long-range connection. Node markers are solid dark dots with a light ring, evenly spaced along the baseline.
      Legibility verdict: PASS — all text is clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17-consistent), not pure black.
      Chrome: Title and subtitle both render in light cream/grey tones and remain fully legible; the same 14 rotated node labels appear in a light grey tone, readable against the dark background with no dark-on-dark failures.
      Data: Arc colors are identical to the light render (same brand green #009E73, same weight-based thickness/opacity gradient) — only the chrome (background, text, node-marker fill/stroke) has flipped. Node markers now render as light dots with a dark ring, correctly inverted for contrast on the dark surface.
      Legibility verdict: PASS — all text is clearly readable against the dark background; no dark-on-dark failures observed.
