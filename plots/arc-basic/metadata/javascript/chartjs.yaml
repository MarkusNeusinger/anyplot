review:
  strengths:
  - 'Correct arc-diagram type: nodes placed on a single horizontal baseline with quadratic-bezier
    arcs drawn above it'
  - Arc height is cleanly proportional to node-index distance (span/maxSpan), matching
    the spec's 'height indicates distance' requirement
  - Edge weight is redundantly encoded via color (imprint_seq gradient), line thickness,
    and opacity — a CVD-safe multi-channel encoding
  - 'Realistic, neutral dataset: character dialogue-exchange network, closely matching
    the spec''s own worked example'
  - 'Clean minimal chrome: no grid, no spines/border on axes, hidden y-axis, generous
    whitespace'
  - Theme-correct backgrounds and chrome in both renders; palette compliant (brand-green
    nodes, imprint_seq continuous arcs, identical data colors across themes)
  - Idiomatic use of Chart.js's plugin architecture (afterDatasetsDraw + raw canvas
    2D API) to implement a chart type outside Chart.js's core primitives, without
    reaching for an external community plugin — correctly follows the library's 'no
    workarounds' rule
  weaknesses:
  - 'Node markers render as half-circles/clipped domes instead of full circles: each
    point sits at y=0, exactly the y-scale minimum, so Chart.js''s chart-area clip
    mask cuts off the bottom half of every pointRadius=10 marker in both renders.
    Fix by giving the y-scale a small negative min (e.g. min: -0.08) or otherwise
    padding below the baseline so the full circle renders unclipped.'
  - The thinnest/lowest-weight arcs (lineWidth ~2.5px, alpha ~0.4, pale green) are
    noticeably faint against both the light and dark backgrounds, making the weakest
    connections hard to distinguish — raise the minimum lineWidth/alpha floor slightly
    for the low end of the weight range.
  - No small legend or colorbar communicates what the color/thickness gradient encodes
    (edge weight = dialogue-exchange count) — not spec-mandated, but a one-line caption
    or mini scale would strengthen the data storytelling around the continuous encoding.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "arc-basic · javascript · chartjs · anyplot.ai" in bold dark ink, clearly legible, centered near the top. 14 character names (Elena, Marcus, Ines, Devon, Priya, Callum, Sara, Tobias, Naomi, Aiden, Ruth, Felix, Lena, Omar) run along the baseline as tick labels, rotated 45°, in a softer dark gray — all fully readable, none clipped at the canvas edges. No y-axis, no grid, no spines — clean minimal chrome.
      Data: Nodes are small green (#009E73) markers along the baseline, though each renders as a half-circle/dome rather than a full circle (see weaknesses — the point sits exactly at the y-scale minimum and gets clipped by the chart-area mask). Arcs curve above the baseline; color and thickness/opacity scale with edge weight from pale thin green through to thicker, more saturated blue-purple for the highest-weight edges (imprint_seq gradient, green→blue). Taller arcs correctly correspond to longer node-index spans.
      Legibility verdict: PASS (title and all 14 tick labels read clearly against the light background; no dark-on-light or light-on-light failures).

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title, now in light off-white text, clearly legible. Tick labels are a lighter gray, still readable against the dark background, no dark-on-dark failures observed. Same clean minimal chrome (no grid/spines/y-axis).
      Data: Node markers and arc colors are visually identical to the light render (same green nodes, same green→blue weight gradient) — only the chrome (background, text) flips as required. Node markers show the same half-circle clipping artifact as in the light render.
      Legibility verdict: PASS (title and tick labels are clearly readable in light-on-dark; brand green remains visible on the dark surface).
