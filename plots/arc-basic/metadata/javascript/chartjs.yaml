  - Theme-correct backgrounds and chrome in both renders; palette compliant, identical
    data colors across themes
  - Idiomatic use of Chart.js's plugin architecture instead of reaching for an external/community
    plugin
  weaknesses:
  - No small legend or one-line caption communicates what the color/thickness gradient
    encodes (edge weight) - not spec-mandated, but would strengthen data storytelling
