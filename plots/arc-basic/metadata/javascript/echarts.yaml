review:
  strengths:
  - 'Correct, idiomatic ECharts approach: a custom series with renderItem drawing
    bezierCurve shapes, since ECharts has no native arc-diagram type — this is genuinely
    distinctive to the library.'
  - Edge weight is redundantly encoded through both stroke opacity and line width,
    which is CVD-safe and avoids relying on hue alone.
  - Node degree is encoded via marker size, adding a second structural signal (hub
    visibility) beyond the raw arcs.
  - Realistic, neutral data-pipeline narrative (Ingest → Publish) with deterministic,
    in-memory data and no randomness needed.
  - 'Both themes are theme-correct: arcs stay identical #009E73 green, chrome (background,
    ink, node fill/border) flips correctly, and all text is legible in both renders.'
  - 12 rotated category labels along the baseline read cleanly with no overlap.
  weaknesses:
  - 'Large unused vertical space (roughly 40-45% of canvas height) between the title
    and the arcs. Root cause: yAxis max is computed from the raw bezier control-point
    height (`baseline + maxDistance*1.15`), but the custom series only supplies a
    single control point (cpx1/cpy1), so ECharts renders a quadratic bezier whose
    visual peak sits at the midpoint between baseline and control height — peak ≈
    (baseline + controlHeight) / 2, not controlHeight. The tallest arc therefore only
    reaches about half of the axis range, leaving the top of the canvas empty. Fix:
    size yAxis max from the actual rendered peak (e.g. `baseline + maxDistance/2 *
    1.15`), or raise the control-point height so the visual peak reaches closer to
    yAxis max, so the plot fills more of the 3200x1800 canvas.'
  - 'Design Excellence is capped by that same layout imbalance: the weight/degree
    encoding concept is strong, but the top-heavy whitespace makes the composition
    read as under-filled rather than publication-ready. Once the vertical space is
    reclaimed, consider slightly larger baseline arcs or a touch more visual refinement
    (e.g. subtle grid-free zone shading) to push DE-01/DE-02 further.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "arc-basic · javascript · echarts · anyplot.ai" centered near the top in dark ink, clearly readable. 12 stage labels (Ingest, Validate, Dedupe, Enrich, Normalize, Transform, Aggregate, Score, Rank, Filter, Cache, Publish) rotated ~30deg beneath the baseline in soft dark-gray ink, all legible with no overlap.
      Data: Nodes are dark circular markers with a light ring border, sized by degree (busier stages are visibly larger). Arcs above the baseline are all brand green (#009E73), varying in opacity (~0.32-0.72) and stroke width (~1.5-5.5px) proportional to edge weight — thin/faint arcs for weak (weight=1) long-range dependencies, thick/opaque arcs for strong (weight=9) short-range dependencies.
      Legibility verdict: PASS — all text is clearly readable against the light background. Notable layout issue (not a legibility failure): roughly the top 40-45% of the canvas, between the title and the tallest arc, is empty whitespace.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Same title and stage labels, now rendered in light ink/soft-gray against the dark background — fully readable, no dark-on-dark failures observed.
      Data: Node markers flip to light fill with a dark ring border (correct theme-adaptive chrome), while the arcs remain the identical #009E73 green with the same opacity/width encoding as the light render — confirms data colors are unchanged across themes, only chrome flipped.
      Legibility verdict: PASS — all text and data elements are clearly readable against the dark background. Same top-of-canvas whitespace issue as the light render (a layout concern, not a legibility concern).
