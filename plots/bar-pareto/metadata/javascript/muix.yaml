review:
  strengths:
  - Composed ChartsContainer with BarPlot, LinePlot and MarkPlot bound to two named
    y axes (counts left, percent right) is the idiomatic MUI X way to build a dual-axis
    combo chart
  - ChartsReferenceLine is bound to the percent axis via axisId, so the 80% threshold
    sits exactly at 80% on the secondary scale and uses the Imprint amber anchor
  - Bars are sorted descending from the data, the cumulative share is computed (31.7%
    → 100%), and the marker for Warping lands exactly on the 80.0% line, matching
    the subtitle's 'Top 4 reach 80%'
  - 'Clear typographic hierarchy: bold 22 px title, inkSoft 15 px subtitle summarizing
    total and vital-few count, all chrome threaded through ANYPLOT_TOKENS so both
    themes read cleanly'
  - Circle markers with page-colored fill and purple outline stay legible where the
    line crosses the green bars; skipAnimation set on the container and every plot
    layer
  weaknesses:
  - 'VQ-03 (both): the ''80%'' text label at the right end of the reference line repeats
    the right-axis ''80%'' tick drawn directly beside it and the ''80% threshold''
    legend entry, so it tells the reader nothing → drop the line label (or the legend
    entry) so the threshold is stated once. Likely cause: the label prop on ChartsReferenceLine.'
  - 'Suggestion: the header legend is hand-built from Box swatches; a native ChartsLegend
    inside ChartsDataProvider/ChartsWrapper would cover the two series natively (the
    reference line would still need its own key).'
  - 'Suggestion: the vital-few bars (Scratches through Warping) could be told apart
    from the tail, e.g. a subtle tint on the trivial-many bars, to make the 80/20
    split read at a glance.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole canvas, 3200x1800.
      Chrome: bold dark title "bar-pareto · javascript · muix · anyplot.ai" centered at top, inkSoft subtitle "Defect count: 1,300 · Defect type: 8 · Top 4 reach 80%", an HTML legend row (green swatch Defect count, purple line Cumulative share (%), amber dashed 80% threshold). Left y axis "Defect count" 0–450 ticks, right y axis "Cumulative share (%)" 0%–100%, x axis "Defect type" with eight category ticks. Subtle horizontal grid only. All text dark and readable.
      Data: eight brand-green #009E73 bars sorted descending (Scratches 412 → Surface Flaw 32) from a zero baseline; purple cumulative line with page-filled circle markers centered over each bar, rising 31.7% → 100%; amber dashed 80% line across the plot with a bold "80%" label at its right end; the Warping marker sits on the line.
      Legibility verdict: PASS (amber line is pale on cream but clearly visible)

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, subtitle, legend text, axis titles and tick labels all render in light ink; grid lines are subtle dark gray; no dark-on-dark text.
      Data: green bars, purple line and amber dashed reference line identical in hue to the light render; markers now filled with the dark page color; amber line reads with more contrast here.
      Legibility verdict: PASS
