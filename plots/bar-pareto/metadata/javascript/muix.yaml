quality_score: 87
review:
  strengths:
  - 'Composes the dual-axis Pareto natively in ChartsContainer: the bar series binds
    to the ''counts'' y axis and the cumulative line to the ''percent'' axis via yAxisId,
    so each mark reads against its own scale with no manual rescaling'
  - The 80% threshold is a native ChartsReferenceLine bound to the percent axis (axisId="percent"),
    so it sits exactly at 80% on the right scale and the cumulative line visibly crosses
    it at Warping, the fourth bar
  - Bars are sorted descending from the records, cumulative markers sit at each band
    center, and the line rises at every step to exactly 100.0% at the last bar; the
    cumulative share is computed from the data, not typed
  - The subtitle states the computed takeaway (total 1,300 defects, top 4 categories
    reach 80%), giving the chart a focal point derived from the data
  - Theme tokens are threaded through every chrome element (axis lines, ticks, grid,
    labels, legend text), so both renders are fully readable with identical data colors
  - Axis bands sized explicitly (x height 68, y widths 84/88) so no tick labels are
    truncated; skipAnimation set on the container and every plot component
  - Interactive HTML keeps MUI X's native axis tooltip for per-category count and
    cumulative share
  weaknesses:
  - 'Suggestion: the legend row is hand-built from Box/Typography elements; MUI X''s
    own ChartsLegend inside ChartsDataProvider/ChartsWrapper would derive the entries
    from the series and keep legend highlighting in the HTML view.'
  - 'Suggestion: the subtitle segment ''Defect type: 8'' reads oddly; ''8 defect types''
    would read as text for a reader.'
  - 'Suggestion: the light-theme amber reference line is the faintest element on the
    cream page; a slightly heavier stroke would make the 80/20 threshold carry further
    in the 400 px thumbnail.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole canvas, not pure white.
      Chrome: bold title "bar-pareto · javascript · muix · anyplot.ai" centered at top, inkSoft subtitle "Defect count: 1,300 · Defect type: 8 · Top 4 reach 80%", an HTML legend row (green swatch "Defect count", purple line "Cumulative share (%)", dashed amber "80% threshold"). Left axis "Defect count" with ticks 0–450, right axis "Cumulative share (%)" with 0%–100% ticks, x-axis "Defect type" with eight category names. All text dark on light, fully readable; subtle horizontal grid.
      Data: eight brand-green #009E73 bars descending from Scratches (412) to Surface Flaw (32) with slightly rounded tops; purple (Imprint position 2) cumulative line with white-filled circle markers centered on each bar, rising 31.7% → 100%; dashed amber 80% reference line across the plot, crossed exactly at the Warping marker.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17, not pure black.
      Chrome: title, subtitle, legend, axis titles and tick labels all switch to light ink and are clearly readable; grid lines a subtle dark grey; no dark-on-dark text anywhere.
      Data: identical green bars, purple cumulative line and amber dashed 80% line as in the light render; markers now filled with the dark page color. The amber line reads more strongly here than on the cream page.
      Legibility verdict: PASS
