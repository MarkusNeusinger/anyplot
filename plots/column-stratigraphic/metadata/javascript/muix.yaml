review:
  strengths:
  - 'Six SVG <pattern> fills approximate the FGDC symbols closely: stipple for sandstone,
    horizontal dashes for shale, offset bricks for limestone, rhomb hatch for dolomite,
    short random dashes for siltstone, open clasts for conglomerate; recurring Sandstone,
    Shale and Limestone layers reuse the same pattern, and every pattern stays legible
    in both themes'
  - Layers are drawn exactly from top to bottom depth on a downward-increasing 0–280
    m scale, with solid contacts and wavy unconformities at 88 m and 246 m, explained
    in a 'Contacts' legend section
  - 'Clear typographic hierarchy: bold formation names with a softer ''stage · thickness''
    line on the right, period brackets with Ma spans on the left, and a subtitle that
    summarizes units, depth range and lithology count'
  - Composes custom SVG marks inside ChartsContainer through useXScale/useYScale,
    so every position goes through the MUI X scale system; skipAnimation is set and
    the v9 ChartsContainer API is used
  - Real Western Canada Sedimentary Basin formations (Horseshoe Canyon, Bearpaw, Leduc,
    Ireton, Beaverhill Lake) with stages and period spans that agree with the timescale;
    Leduc is correctly encased by Ireton shale and the sub-Cretaceous unconformity
    is placed on Mississippian carbonates
  weaknesses:
  - 'DQ-03 (both): the real WCSB formations carry thicknesses far below their regional
    values — the whole Maastrichtian-to-Cambrian succession spans 280 m (regionally
    about 1.5–2.5 km) and the Leduc Reef is 36 m (typically 150–300 m) → either scale
    the depths toward the real succession or keep 280 m but use proportions closer
    to reality (Leduc and Bearpaw among the thickest units). Likely cause: the TOP/BOTTOM
    values in the data block were chosen evenly (26–36 m per unit).'
  - 'Suggestion: drive the depth scale with MUI X''s own y axis (`reverse: true`,
    `label: "Depth (m)"`, `tickLabelStyle`) instead of the hand-drawn axis line, ticks
    and nice-step computation, which would show more of the library.'
  - 'Suggestion: the subtitle reads ''6 Lithology types'' with a capitalised ''Lithology''
    because it reuses the column constant; a lower-case noun would read more naturally.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, no white box.
      Chrome: title "column-stratigraphic · javascript · muix · anyplot.ai" top-left in dark ink (~37 % of width), a soft-ink subtitle "9 stratigraphic units (0–280 m) · 6 Lithology types across 4 periods", "Depth (m)" axis title over a left depth axis with ticks 0–250 every 50 m increasing downward, period brackets (Cretaceous 145–66 Ma, Carboniferous 359–299 Ma, Devonian 419–359 Ma, Cambrian 539–485 Ma) left of the axis, formation names in bold with "stage · thickness" lines to the right, and a Lithology + Contacts legend on the right. All text dark and readable.
      Data: one schematic column of 9 patterned blocks: sandstone green #009E73 stipple, shale lavender dashes, limestone blue bricks, dolomite ochre rhomb hatch, siltstone red short dashes, conglomerate cyan open circles; light tinted fills with ink outlines; solid contacts and two wavy unconformities (88 m, 246 m). First series is #009E73.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, subtitle, axis title, ticks, period brackets, formation labels and legend text all flip to light ink and are clearly readable; block outlines and contact lines flip to light ink; no dark-on-dark text.
      Data: same six pattern hues as the light render (green, lavender, blue, ochre, red, cyan), tint fills read darker over the dark page but every pattern stays visible; brand green stipple is clearly visible.
      Legibility verdict: PASS
