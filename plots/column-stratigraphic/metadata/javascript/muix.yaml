review:
  strengths:
  - Six distinct lithology patterns (stipple, horizontal dash, brick, rhomb crosshatch,
    random dash, open clasts) that approximate the FGDC symbols and read clearly without
    color in both themes
  - Thickness is to scale on a downward-increasing depth axis, and recurring lithologies
    (Sandstone, Shale, Limestone) are patterned identically at every depth
  - The period brackets with their Ma spans, plus the stage-age · thickness sublabels,
    make every label attributable to its interval
  - Wavy unconformity contacts, explained in a dedicated Contacts legend section
  - Uses MUI X v9 ChartsContainer composition with the useXScale/useYScale hooks so
    the custom SVG patterns live in chart coordinates; theme tokens are threaded through
    all the chrome
  weaknesses:
  - 'VQ-03 (both): the formation leader lines are drawn in t.grid at 1.2 px and are
    near-invisible on both backgrounds, so the link from a label to its layer is lost
    → t.inkSoft at about 0.6 opacity, or 1.5 px. Likely cause: stroke={t.grid} strokeWidth={1.2}
    on the leader <line>.'
  - 'Suggestion: draw the depth scale with a native MUI X y-axis (reverse: true, in
    meters, position: "left") instead of the hand-built tick loop and axis lines.'
  - 'Suggestion: the empty strip to the right of the legend could go to a wider column,
    so the patterns get more presence.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1.
      Chrome: The title "column-stratigraphic · javascript · muix · anyplot.ai" and a summary subtitle sit top-left. The "Depth (m)" axis on the left has ticks every 200 m from 0 to 1400, increasing downward. On the far left, bracketed period labels with Ma spans (Cretaceous, Carboniferous, Devonian, Cambrian). On the right, a Lithology swatch legend and a Contacts legend (conformable, unconformity). All text is dark and readable.
      Data: One column of nine blocks with tinted patterns: Sandstone green #009E73 stipple (first series), Shale purple dashes, Limestone blue bricks, Dolomite ochre rhomb crosshatch, Siltstone red random dashes, Conglomerate cyan circles. Solid ink boundaries, with wavy unconformities at 560 m and 1400 m. Bold formation names with stage · thickness lines to the right. The grid-colored leader lines are near-invisible.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: The title, subtitle, ticks, axis title, period labels, formation labels and legend text are all in light ink and readable. No dark-on-dark text. The outlines, contacts and brackets flip to light ink.
      Data: The pattern stroke colors are identical to the light render; the translucent tints read darker against the page. All patterns are clearly visible. The leader lines are near-invisible here too.
      Legibility verdict: PASS
