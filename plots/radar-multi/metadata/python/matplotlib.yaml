      Data: Three overlapping filled polygons — Product A (green #009E73, circle markers), Product B (lavender #C475FD, square markers, bolder line/larger markers/higher fill alpha as the visual leader), Product C (blue #4467A3, triangle markers). All three are clearly distinguishable by both hue and marker shape.
