review:
  strengths:
  - 'Correct Imprint palette in canonical order (#009E73 green, #C475FD lavender,
    #4467A3 blue) with identical data colors across both renders — only chrome flips
    between light and dark'
  - 'Effective visual-hierarchy technique for storytelling: the leading product (Product
    B) gets a bolder polygon outline, larger markers, higher fill alpha, and bold
    legend text — guides the eye to the strongest overall performer without any extra
    annotation'
  - Distinct marker shapes (circle/square/triangle) per series add CVD-safe redundant
    encoding beyond hue alone
  - Clean, deterministic KISS code with theme-adaptive tokens (PAGE_BG/INK/INK_SOFT)
    correctly threaded through title, tick labels, grid, and legend frame
  - 'Thoughtful touch: radial tick labels get an opaque halo bbox so they stay legible
    where polygon fills cross the radial axis'
  weaknesses:
  - The 'Performance' axis category label (first category, angle=0) is completely
    missing from BOTH renders — it lands directly behind the opaque legend box (ax.legend(bbox_to_anchor=(1.08,
    0.5))) and is fully covered, so one of six required axis labels is invisible.
    Fix by rotating the whole radar via ax.set_theta_offset() so no category lands
    at the same angle as the legend, or by moving the legend further away (e.g. lower/further
    right) so it no longer overlaps the theta=0 tick-label territory.
  - Radial (r-axis) tick labels 20/40/60/80/100 visually collide with each other along
    the Performance axis — the '40' box overlaps '60', and '60' overlaps '80'. Use
    ax.set_rlabel_position() to move the r-axis labels to an empty sector away from
    data-heavy axes (e.g. ~210 degrees, between Display and Build Quality), and/or
    thin the radial gridlines to fewer labels (e.g. 25/50/75/100).
  - Those same radial tick labels sit directly on top of the Performance-axis data
    (Product B's magenta square marker touches the '60' label box, polygon edges cross
    through the label cluster) — repositioning the r-axis label angle (see above)
    resolves this too.
  - 'The chart + legend cluster is pushed toward the upper-middle of the square canvas:
    roughly 400px of empty gap between the title and the chart, and ~600px (25% of
    canvas height) of empty whitespace below the chart with nothing to balance it.
    Center the polar axes vertically (adjust figure/subplot margins) so whitespace
    is distributed evenly top and bottom.'
  image_description: |-
