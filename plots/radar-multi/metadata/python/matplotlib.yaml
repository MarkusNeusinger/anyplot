review:
  strengths:
  - All six axis category labels are now visible in both themes — the theta-zero rotation
    and legend repositioning fully resolve attempt 1's 'Performance' label being hidden
    behind the legend box
  - 'Radial tick labels (25/50/75/100) are redesigned: repositioned via set_rlabel_position(210)
    into the empty sector between Display and Build Quality, with an opaque halo bbox,
    so they no longer collide with each other or with the Performance-axis data'
  - Correct Imprint palette in canonical order (#009E73/#C475FD/#4467A3), identical
    data colors across light/dark renders, only chrome flips
  - 'Effective leader-emphasis technique for storytelling: Product B gets a bolder
    polygon outline, larger markers, higher fill alpha, and bold legend text to guide
    the eye to the strongest overall performer, with no extra text annotation needed'
  - Distinct marker shapes (circle/square/triangle) per series add CVD-safe redundant
    encoding beyond hue alone
  - Clean, deterministic KISS code with theme-adaptive tokens (PAGE_BG/INK/INK_SOFT)
    correctly threaded through title, tick labels, grid, and legend frame
  weaknesses:
  - The polar chart itself only occupies roughly the middle third of the 2400x2400
    canvas width/height — fig.subplots_adjust(left=0.32, right=0.66, top=0.80, bottom=0.20)
    allocates a 0.60-figure-height axes box but the equal-aspect polar plot shrinks
    to fit the narrower 0.34-figure-width budget, so ~0.26 of the allocated vertical
    space goes unused above/below the circle in addition to the margins outside the
    axes box. Widen the axes bbox (e.g. tighten left/right margins so the width budget
    better matches the height budget) so the circle fills more of the canvas instead
    of reading as a small chart floating in a mostly-empty square.
  - Legend box has generous internal padding relative to its 3 entries, adding to
    the overall sparse feel of the right side of the canvas — could be tightened slightly
    (e.g. reduce labelspacing/handlelength) now that more canvas real estate is available
    for the chart itself
