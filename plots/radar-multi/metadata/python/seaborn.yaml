review:
  strengths:
  - Tidy long-format df drawn with one sns.lineplot call (hue + units + estimator=None
    + sort=False) on a polar axis, with closure done by appending each series' first
    vertex at 2π in pandas — every polygon closes exactly on its vertices, no smoothing
  - Gridlines are dashed rings at 20–100 that stay visible through the stacked translucent
    fills (alpha 0.22) in both themes; spokes are solid and lighter, so value rings
    and dimension axes read as two distinct layers
  - Ring value labels are placed between the Performance and Reliability spokes (set_rlabel_position(180
    / n_axes)) so they never collide with a spoke or a vertex
  - Vertex markers carry a page-colored edge, which separates nearly coinciding vertices
    (Performance, Support) in both themes
  - 'Data profiles are deliberately varied: each product leads on different dimensions
    and the outlines cross, so the comparison the chart exists for is visible'
  - 'Full theme-token threading: light and dark renders differ only in chrome, Imprint
    positions 1–3 identical in both'
  weaknesses:
  - 'VQ-06 (both): the radial value scale has no title anywhere — rings read 20–100
    without saying they are scores out of 100 → name the scale once, e.g. a ring-label
    suffix or a short radial-axis caption from the SCORE constant ''Score (0-100)''.
    Likely cause: ax.set_ylabel("") discards the column name seaborn would have used.'
  - 'DQ-02 (both): the series are labelled ''Product A'', ''Product B'', ''Product
    C'', which reads as abstract placeholders next to the concrete dimension names
    → give the products plausible names (e.g. three laptop or CRM product names, invented).
    Likely cause: the keys of the products dict.'
  - 'Suggestion: a slightly larger radial ring-label size (8 pt) would hold up better
    in the 400 px thumbnail.'
