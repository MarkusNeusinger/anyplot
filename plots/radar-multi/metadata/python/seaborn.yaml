      Data: three closed polygons with circular vertex markers (white edges) and translucent fills: Nimbus Pro 14 in #009E73 (first series), Vela Air 13 in #C475FD, Orion Flex 15 in #4467A3. Outlines cross; rings remain visible through the overlapping fills.
