review:
  strengths:
  - 'The plot layer reads the tidy df directly: sns.lineplot with hue, hue_order,
    palette, units=PRODUCT, estimator=None and sort=False draws every outline on matplotlib''s
    polar axes without any reshaping'
  - Each polygon is closed in the data by repeating its first vertex at 2π, so outlines
    and fills follow exactly the same vertices and never smooth past them
  - 'Imprint colors #009E73, #C475FD, #4467A3 in canonical order, identical in both
    themes; fills at alpha 0.22 keep every polygon and the dashed rings visible where
    the three overlap'
  - 'Clear chrome hierarchy: axis names at 10 pt in INK, ring values at 8 pt in INK_SOFT
    on a ray between two spokes, and the scale named once (''Score (0-100)'') along
    that same ray'
  - Vertex markers carry a PAGE_BG edge, which separates near-coincident vertices
    from the outlines in both themes
  - sns.move_legend relocates seaborn's own hue legend with a reader-facing title
    ('Product') instead of rebuilding it by hand
  - 'Plausible, neutral scenario: three fictional laptops scored 0-100 on six dimensions,
    with crossing outlines so no product dominates everywhere'
  weaknesses:
  - 'Suggestion: a single focal choice (for example, ordering the series or the legend
    by overall score) would give the comparison a clearer entry point.'
  - 'Suggestion: legend handles could show the polygon fill alongside the outline
    so the legend mirrors the full mark.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole 2400x2400 square canvas.
