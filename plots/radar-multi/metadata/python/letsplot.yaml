      Chrome: Title, axis category labels, grid value labels, and legend contents all render in light ink (near-white/light grey) and are clearly readable against the dark background — no dark-on-dark failures found anywhere.
      Data: Colors are identical to the light render (#009E73, #C475FD, #4467A3, #BD8233) — data colors do not shift between themes, only chrome flips as required. The hero (OnePlus 12) thicker-outline emphasis is equally visible on the dark background.
