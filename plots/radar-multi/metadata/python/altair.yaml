review:
  strengths:
  - 'Correct Imprint palette (canonical order, #009E73 first) and fully correct theme-adaptive
    chrome in both light and dark renders'
  - Hexagon-fit axis domain computed from actual label geometry, keeping the chart
    tightly and correctly framed
  - 'Distinctive working Altair interactivity: legend-bound click-to-isolate selection
    affecting fill/stroke/point opacity in the saved HTML'
  - 'All spec-required elements present: filled semi-transparent polygons, distinct
    series colors, legend, radial gridlines with value labels, outer axis labels,
    closed polygons'
  weaknesses:
  - 'Fill-spike rendering artifact: on both plot-light.png and plot-dark.png, a large
    triangular wedge of pale fill shoots up from the chart center past the outer 100
    gridline above the Price axis, extending nearly to the plot title -- well beyond
    the actual data (max Price value plotted is 85). Caused by feeding mark_area()
    a non-monotonic looping x/y radar-polygon path, which Vega-Lite fills toward an
    implicit baseline instead of closing as a true polygon. Needs a genuinely closed-polygon
    fill technique (native polar/theta-radius encoding, or an explicit closed-path/geoshape
    fill) instead of mark_area on a looping cartesian path.'
  - Layout/Canvas proportions are broken by the same artifact -- fill extends well
    outside the chart's own gridline boundary (not an AR-09 edge-clip, but a hard
    proportional break).
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white, matches #FAF8F1, correct.
      Chrome: title "radar-multi · python · altair · anyplot.ai" top-left in dark ink, fully legible. Bold dark category axis labels (Price, Quality, Durability, Support, Features, Design) clearly readable. Soft grey tick value labels (20/40/60/80/100) legible along spokes. Boxed "Series" legend top-right with light elevated fill, all text legible.
      Data: Product A green (#009E73), Product B lavender (#C475FD), Product C blue (#4467A3) -- correct Imprint canonical order, first series is #009E73.
      Defect: a large triangular wedge of pale fill shoots up from chart center past the outer "100" gridline on the Price axis, extending almost to the title -- well beyond any data value (max plotted Price is 85). Rendering artifact from mark_area on a non-monotonic closed radar path, not decorative shading.
      Legibility verdict: PASS (all text readable; the defect is a fill-geometry bug, not a text-legibility failure)

    Dark render (plot-dark.png):
      Background: warm near-black, matches #1A1A17, correct.
      Chrome: title, axis labels, and tick labels flip to light ink/soft grey and remain fully legible. No dark-on-dark failures.
      Data: identical colors to light render (green/lavender/blue), confirming Imprint data colors held constant across themes.
      Defect: the same stray triangular fill-spike above the Price axis appears at the same position and shape, confirming it is a data/rendering bug rather than a theme-styling issue.
      Legibility verdict: PASS (all text readable; same fill-geometry bug present)
