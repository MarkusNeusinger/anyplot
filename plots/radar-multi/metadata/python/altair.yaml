review:
  strengths:
  - 'Fill-spike rendering bug from Attempt 1 is fixed: switching from mark_area()
    to mark_line(interpolate="linear-closed", fill=..., strokeWidth=0) produces a
    properly closed polygon fill contained within the hexagon on both renders — no
    stray spikes.'
  - 'Correct Imprint categorical palette in canonical order (#009E73, #C475FD, #4467A3)
    with fully correct theme-adaptive chrome (backgrounds, text, grid, legend box)
    in both light and dark renders.'
  - Axis domain is derived from the actual hexagon label geometry (x_half/y_half from
    cos(30deg) and the label radius) rather than a generic square, keeping the chart
    tightly and correctly framed within the padded canvas.
  - 'Genuine Altair/Vega-Lite-specific interactivity: legend-bound selection_point(bind="legend")
    drives fill/stroke/point opacity for click-to-isolate behavior in the saved HTML.'
  - Clean, flat, deterministic KISS script with only used imports (numpy, pandas,
    PIL for the mandatory pad step, altair).
  weaknesses:
  - Grid value labels (20/40/60/80/100) are drawn on all six spokes (30 text elements
    total) instead of a single reference axis, adding visual clutter to an otherwise
    clean hexagon — consider limiting value labels to one axis (e.g. Price) to reduce
    noise.
  - 'Design Excellence is solid but not yet publication-tier: typography hierarchy
    and per-series visual emphasis (e.g. subtle leader highlighting) could be pushed
    further for a top score.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "radar-multi · python · altair · anyplot.ai" in dark ink, top-left, fully legible. Six bold dark category labels (Price, Quality, Durability, Support, Features, Design) sit at the outer edge of each spoke. Grid value labels (20/40/60/80/100) in soft grey are drawn along every spoke, forming a hexagonal grid of rings. A boxed "Series" legend with light elevated fill sits top-right, listing Product A/B/C with correctly colored swatches.
      Data: Three semi-transparent filled hexagonal polygons with solid outlines and circular markers — Product A green (#009E73), Product B lavender (#C475FD), Product C blue (#4467A3). No fill-spike artifact remains (the Attempt 1 defect is fixed); all fills stay cleanly within the intended hexagon boundary.
      Legibility verdict: PASS — all title, axis, tick, and legend text is clearly readable against the light background; no light-on-light failures.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same layout as the light render; title, category labels, and grid value labels flip to light ink/grey and remain fully legible. Legend box flips to the dark elevated fill with light text, still fully readable.
      Data: Colors are identical to the light render (green/lavender/blue) — confirms the Imprint data palette is held constant across themes as required. Fill polygons are cleanly contained, no spike artifact.
      Legibility verdict: PASS — no dark-on-dark failures observed; all text is clearly visible against the near-black background.
