review:
  strengths:
  - 'Correct Imprint palette with brand green #009E73 as the first series and fully
    theme-correct chrome (background, text, grid) in both light and dark renders'
  - 'Proper multi-series radar construction: filled polygons at opacity=0.25 with
    2.5px strokes, closed shapes, regular gridlines (0/20/40/60/80/100), and a legend
    identifying all three teams'
  - Clean, idiomatic pygal usage via the Style object (theme-adaptive tokens, explicit
    font sizes, dots_size, stroke_style) and the Radar chart's high-level API
  - Deterministic, realistic team-skill-assessment data with genuine variation across
    all six axes and neutral business context
  - Correct mandated title format and correct output artifacts (plot-{theme}.png and
    plot-{theme}.html)
  weaknesses:
  - 'DE-01: Typography and overall look rely almost entirely on pygal''s default font
    family and rendering — only the palette/theme tokens and font sizes were customized.
    Consider setting title_font_family / legend_font_family in the Style object for
    a more distinctive, publication-grade look.'
  - 'DE-03: No visual hierarchy or emphasis singles out a takeaway — the three overlapping
    polygons are equally weighted with no annotation, ordering, or contrast that guides
    the viewer to an insight (e.g. which team is strongest overall).'
  - 'VQ-05: Canvas whitespace is imbalanced — the radar hexagon plus legend sit shifted
    toward the right/top of the square canvas, leaving a visibly larger empty gap
    in the bottom-left than elsewhere. Consider centering the plot area or adjusting
    margins so whitespace is distributed more evenly.'
  - 'LM-02: Radar-specific styling knobs (inner_radius, dots_size, stroke_style) are
    used but only at a basic level — pushing further with pygal-distinctive radar
    features (e.g. tuned interpolation, major-dot-only ticks) would better showcase
    the library''s strengths.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "radar-multi · python · pygal · anyplot.ai" in dark, monospace-style text at top; six category axis labels (Communication, Problem Solving, Teamwork, Creativity, Leadership, Technical) around the hexagon perimeter, rotated to follow their axis; radial value labels (0/20/40/60/80/100) along the top (Communication) axis; legend with colored swatches in the top-left listing Alpha Team, Beta Team, Gamma Team. All chrome text is dark and clearly readable against the light background.
      Data: Three overlapping filled hexagonal polygons with ~25% opacity — Alpha Team in brand green (#009E73), Beta Team in light purple (#C475FD), Gamma Team in muted blue (#4467A3) — each with a solid stroke outline and a solid dot marker at every vertex. Dashed light-gray gridlines radiate from the center at each 20-point interval.
      Legibility verdict: PASS — no overlapping or clipped text, all labels and legend entries fully readable.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title, axis labels, value ticks, and legend layout as the light render, now rendered in light/off-white text. Gridlines are a lighter, subtle gray-blue tone appropriate for the dark surface.
      Data: The same three series in the identical hex colors as the light render (#009E73 green, #C475FD purple, #4467A3 blue) — confirming data colors are unchanged between themes; only chrome (background, text, grid) flipped.
      Legibility verdict: PASS — all text is light-on-dark with good contrast; no dark-on-dark failures observed.
