review:
  strengths:
  - 'Correct Imprint palette with brand green #009E73 as the first (hero) series,
    canonical categorical order across all three teams, and fully theme-correct chrome
    (background, text, grid) in both light and dark renders'
  - The hero-series treatment (bold 6px solid stroke + larger 12px dots for Alpha
    Team vs. thinner 2.5px dashed strokes + 7px dots for Beta/Gamma) directly resolves
    the prior attempt's DE-03 weakness by giving the chart a clear focal point and
    visual hierarchy without hiding the other two series
  - Legend moved to the bottom with legend_at_bottom_columns=3 resolves the prior
    attempt's VQ-05 weakness — the radar hexagon is now well-centered with evenly
    distributed whitespace instead of being shifted toward the top-right
  - 'All required spec features present: filled polygons at opacity=0.25 with visible
    outlines, closed hexagonal shapes, regular gridlines at 0/20/40/60/80/100, outer-edge
    axis labels, and a legend identifying all three teams'
  - Clean, idiomatic pygal usage via the Style object (theme-adaptive tokens, explicit
    font sizes) and the Radar chart's high-level API; deterministic, realistic team-skill-assessment
    data with genuine variation across all six axes
  - Correct mandated title format and correct output artifacts (plot-{theme}.png and
    plot-{theme}.html)
  weaknesses:
  - 'DE-01: Typography still relies on a single global font_family across all elements
    — the prior attempt''s suggestion to set distinct title_font_family / legend_font_family
    for a more distinctive, publication-grade look was not applied.'
  - 'VQ-02: At the ''Problem Solving'' and ''Teamwork'' vertices the three teams''
    values are close together (e.g. 82/88/78 and 88/70/92), so the vertex dots nearly
    touch. The size hierarchy (hero dot larger) keeps them distinguishable, but consider
    a tiny dots_size bump for the non-hero series or a slight jitter/offset so tightly
    clustered vertices stay fully separable.'
  - 'DQ-01: Six axes and three series are within spec range, but per-team variation
    on a couple of axes (e.g. Communication: 85/78/65) is fairly compressed — slightly
    wider spread between at least one pair of teams on more axes would make the comparative
    story even clearer.'
  - 'LM-02: The added stroke_style dasharray and dots_size differentiation is a good
    step up from attempt 1, but still basic — pushing further with another pygal-distinctive
    radar knob (e.g. tuned interpolation, or per-series show_dots toggling) would
    showcase the library''s strengths more fully.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "radar-multi · python · pygal · anyplot.ai" in dark ink at top, fully visible with no clipping. Six category axis labels (Communication, Problem Solving, Teamwork, Creativity, Leadership, Technical) rotated around the hexagon perimeter, all fully readable and none touching the canvas edge. Radial value labels (0/20/40/60/80/100) run along the top (Communication) axis in dark ink. Legend centered at the bottom in three columns — "Alpha Team" (green swatch), "Beta Team" (purple swatch), "Gamma Team" (blue swatch) — fully visible with comfortable margin below.
      Data: Three overlapping filled hexagonal polygons at ~25% opacity — Alpha Team in brand green (#009E73) with a bold 6px solid stroke and large 12px dots (the "hero" series), Beta Team in light purple (#C475FD) and Gamma Team in muted blue (#4467A3), both with thinner 2.5px dashed strokes and smaller 7px dots. Dashed light-gray gridlines radiate from the center at each 20-point interval. All three series are distinguishable by both hue and line/dot styling even where their vertices cluster closely (e.g. Problem Solving, Teamwork).
      Legibility verdict: PASS — all title, axis, tick, and legend text is dark-on-light and clearly readable; no overlapping or clipped text.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Same title, axis labels, value ticks, and bottom legend layout as the light render, now rendered in light/off-white text throughout (title, category labels, tick numbers, legend labels). Gridlines are a lighter, subtle gray-blue tone appropriate for the dark surface.
