review:
  strengths:
  - Imprint palette positions 1–3 in canonical order, identical in both renders, with
    theme tokens threaded through text, rings, spokes and legend
  - Vertex markers with page-colored rims make every data value readable even where
    polygons overlap
  - Value scale derived from the data (rings 20–100) and categories/series read from
    a tidy DataFrame, so the chart adapts to new data
  - Square 2400x2400 canvas with the radar centered and labels comfortably inside
    the frame
  weaknesses:
  - 'VQ-04 (both): Product A''s green outline and vertex markers are drawn before
    Product B and C''s translucent fills, so inside Product C''s polygon (Price Value,
    Support, Features) they read teal-blue instead of #009E73 and blur into Product
    C → draw every outline and vertex marker above all fills. Likely cause: patch
    and scatter for each series added in one loop iteration (lines 129–145).'
  - 'SC-02 (both): the ring value labels are offset by top*0.1 (10 units) up and right,
    so each sits about halfway to the next ring — ''80'' reads closer to the 100 ring
    and ''100'' floats above every ring → place each label at its ring''s radius,
    offset sideways from the spoke only. Likely cause: the + top * 0.1 added to y
    in line 120.'
  - 'DQ-02 (both): the series are labelled ''Product A'', ''Product B'', ''Product
    C'', which read as abstract placeholders → name them as plausible products (e.g.
    three laptop or headphone models). Likely cause: the keys of the scores dict (lines
    40–42).'
  - 'CQ-04 (code): line 30 GRID_STEP = 20 is never read, and its comment says it sets
    the ring interval while lines 61–64 compute grid_step → remove. Likely cause:
    a constant left over from a replaced approach.'
  - 'Suggestion: the dark render shows a thin grey rectangle about 5 px inside the
    canvas edge; setting min_border and the root frame to the page color would remove
    it.'
  - 'Suggestion: a HoverTool on the vertex scatter would give exact scores in the
    HTML view.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 (pixel-checked).
      Chrome: title "radar-multi · python · bokeh · anyplot.ai" in dark bold text centered at the top; six bold dark axis labels (Performance at top, then clockwise Reliability, Features, Support, Price Value, Ease of Use) outside the rings; ring values 20–100 in soft grey to the right of the top spoke, each sitting about half a ring step above its ring; legend box top-right with Product A/B/C. All text readable.
      Data: three closed polygons with 0.25 fills and solid outlines in #009E73 (Product A), #C475FD (Product B), #4467A3 (Product C), vertex dots with off-white rims; five grey rings and six spokes stay visible through the fills. Product A's outline and dots turn teal where they lie under Product C's blue fill.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17 (pixel-checked).
      Chrome: title and axis labels in light text, ring values and legend labels in light grey; no dark-on-dark text. A faint grey rectangle frame runs about 5 px inside the canvas edge.
      Data: same three colors as the light render; fills darker on the dark surface but outlines and dots clearly visible; brand green reads well.
      Legibility verdict: PASS
