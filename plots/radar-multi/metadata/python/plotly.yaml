review:
  strengths:
  - Groupby loop over the tidy df with column constants keeps the plot code independent
    of the sample data
  - Translucent fills (alpha 0.25) with full-color outlines and markers keep every
    polygon and the grid rings readable where they overlap
  - Square canvas with a horizontal legend below the polar area uses the 2400x2400
    frame without wasted side space
  - Theme tokens are threaded through title, ticks, grid, legend frame and backgrounds;
    both renders are clean
  weaknesses:
  - 'VQ-02 (both): the radial tick label "80" on the Performance spoke is crossed
    by the Product A and Product C outlines, and "100" touches the Product C outline
    → tick labels clear of the data outlines (move the radial axis angle to a spoke
    where the polygons stay inside 80, for example radialaxis angle between two spokes
    with tickangle). Likely cause: radialaxis drawn along the default 0° Performance
    spoke, where the highest scores sit.'
  - 'DQ-02 (both): the series are labelled "Product A (Premium)", "Product B (Budget)",
    "Product C (Pro)", which read as generic placeholders → plausible fictional product
    names (for example three laptop models). Likely cause: the scores dict keys.'
  - 'CQ-01 (code): lines 52-54 define a to_rgba helper function, against the no-functions
    structure → an inline conversion with plotly.colors.hex_to_rgb inside the loop.
    Likely cause: a hand-written hex-to-rgba helper.'
  - 'Suggestion: a legend title from the PRODUCT constant (legend_title_text=PRODUCT)
    would tie the legend to the column role.'
