review:
  strengths:
  - Creative core-bundle-only solution for a radar/polar chart via manual polar→Cartesian
    projection plus a custom chart.renderer overlay, avoiding the forbidden highcharts-more/polar
    module — the workaround is clearly documented in the header comment.
  - Real Highcharts scatter series (hidden markers) are bound at the same projected
    vertices as the drawn polygons, giving genuine interactive tooltips in the HTML
    output despite the static PNG being hand-drawn SVG.
  - Correct Imprint palette assignment in canonical order (green → lavender → blue
    for the three models), and both renders are fully theme-correct (backgrounds,
    text, grid all flip correctly, data colors identical).
  - Data shows genuine trade-offs across axes and series (each phone model wins on
    different axes), which fits the spec's product-comparison use case and gives the
    chart a real comparative story.
  - Title, axis labels, and legend fonts are all explicitly sized, and the title fontsize
    is computed to scale with title length so it never overflows or clips.
  weaknesses:
  - Ring/scale reference labels (20, 40, 60, 80, 100) are set at only 12px — noticeably
    smaller than the other chrome text (15px axis labels, 15px legend) and below the
    style guide's ~14px tick-label starting point. At ~400px mobile width these numbers
    will be close to unreadable — bump to ~14-15px to match the other secondary text.
  - The radar polygons and grid are drawn manually via chart.renderer rather than
    through an idiomatic Highcharts series/plotOptions configuration. This is understandable
    given the core-only bundle lacks the polar module, but it means Highcharts' own
    line/area rendering and marker states aren't leveraged for the visible chart —
    this caps Library Mastery / Idiomatic Usage.
  - Data-point markers (circle radius 6px, stroke-width 2.75) are on the smaller side
    for a sparse dataset (6 axes × 3 series = 18 total vertices). Per the data-density
    heuristic, sparse data should get more prominent markers — consider radius 8-10px
    for stronger visual presence.
  - 'Design polish is solid but stops short of publication-ready: legend swatches
    are plain rectangles and grid rings are simple thin strokes with no additional
    refinement (e.g. emphasis on a focal series, more refined legend chip style) —
    raise Design Excellence with more intentional visual hierarchy.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Bold dark title at top ("radar-multi · javascript · highcharts · anyplot.ai") is fully readable. Six axis labels (Battery Life, Camera Quality, Performance, Display, Value, Durability) render in bold dark text at the outer edge of the hexagonal radar, all clearly legible. Small numeric scale labels (20, 40, 60, 80, 100) run up the top spoke in a lighter gray tone. Legend sits centered below the chart with color swatches and model names ("Aurora X1", "Nova S", "Zenith Pro"), all readable.
      Data: Three semi-transparent filled polygons in green (#009E73, Aurora X1), lavender-purple (Nova S), and blue (Zenith Pro), each with a solid-colored outline and white-outlined circular markers at the vertices. First series is the brand green, as required.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Title, the six axis labels, ring scale numbers, and legend text all render in light/off-white tones and remain clearly readable against the dark background. No dark-on-dark failures observed — every text element has strong contrast against the near-black surface.
      Data: Polygon fill/outline colors (green, lavender-purple, blue) are visually identical to the light render, confirming the Imprint data colors are held constant across themes; only the chrome (background, text, grid) flipped as expected.
      Legibility verdict: PASS
