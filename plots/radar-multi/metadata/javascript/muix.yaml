      Data: Three translucent filled polygons with solid outlines — green (AudioMax Pro), lavender/purple (SoundWave Elite), blue (EchoBudget) — matching Imprint palette positions 1, 2, 3 in canonical order. First series is #009E73 green as required. Vertex markers are visible circles with a light halo stroke for contrast against overlapping fills.
      Legibility verdict: PASS

