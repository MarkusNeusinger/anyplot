      Data: three closed straight-edged polygons with translucent fills and solid 3 px outlines plus page-ringed vertex dots — AudioMax Pro #009E73 (first series), SoundWave Elite #C475FD, EchoBudget #4467A3. Gridlines remain visible through the stacked fills. A dashed blue leader and rounded box annotate "Widest lead: Value — EchoBudget 92 vs AudioMax Pro 60" at the lower left.
