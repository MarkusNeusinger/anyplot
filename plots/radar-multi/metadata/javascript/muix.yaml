review:
  strengths:
  - Correct Imprint palette order (green, lavender, blue) held identical across light/dark
    themes, with fully theme-adaptive chrome (title, axis labels, ticks, callout)
    and no dark-on-dark or light-on-light legibility failures in either render
  - 'Genuine design polish: alternating banded rings with eased grid opacity toward
    the outer ring, translucent fill (alpha 0.22) plus solid stroke plus vertex markers
    per the spec''s ''fill and outline'' suggestion'
  - Explicit data-storytelling callout ('Best on Value') gives the chart a clear focal
    point instead of a flat three-way comparison
  - 'Fully covers the spec: 7 axes / 3 series, closed polygons, 20/40/60/80/100 gridlines
    with tick labels, legend, realistic and neutral headphone-comparison dataset'
  - 'Idiomatic solution to the community-package gap: since @mui/x-charts community
    (v7) has no RadarChart, composing on ChartContainer + useDrawingArea is exactly
    the workaround the library doc recommends, done with deterministic in-memory data
    and skipAnimation set'
  weaknesses:
  - Callout box fill uses PAGE_BG (t.pageBg) instead of the elevated-surface token
    (t.elevatedBg) the style guide specifies for callout/legend box fills -- visually
    near-invisible against the page background except for its border stroke; switch
    to t.elevatedBg for a properly 'lifted' card
  - Near the Value axis, the AudioMax Pro (60) and SoundWave Elite (55) vertices sit
    almost on top of the callout's dashed-line anchor point, creating a small cluttered
    cluster of overlapping dots -- nudge the anchor radius or draw order so the cluster
    reads cleanly
  - 'LM-02: relies entirely on hand-drawn SVG (manual polar math, grid/polygon construction)
    rather than exercising more first-party MUI X building blocks (e.g. ChartsTooltip,
    built-in legend/axis primitives) that could coexist with the custom radar layer
    -- a stronger ''distinctive features'' showing would lean on more MUI X pieces'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1), not pure white, not dark.
      Chrome: Title "radar-multi · javascript · muix · anyplot.ai" in bold dark ink, clearly visible; 7 axis category labels (Sound Quality, Noise Cancelling, Battery Life, Comfort, Build Quality, Value, Connectivity) in dark bold text; radial gridline value ticks (20/40/60/80/100) in a softer gray, readable; legend at the bottom (AudioMax Pro, SoundWave Elite, EchoBudget) with color swatches and dark text; a callout card ("Best on Value / EchoBudget trails elsewhere") near the Value axis with a near-white fill, thin border, and dark text.
      Data: Three overlapping filled polygons -- brand green (AudioMax Pro), lavender/purple (SoundWave Elite), and blue (EchoBudget) -- each with translucent fill, solid outline, and circular vertex markers. First series is the Imprint brand green as required.
      Legibility verdict: PASS -- all title, axis, tick, and legend text is clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17), not pure black, not light.
      Chrome: Same title, axis labels, and legend rendered in light/white text, clearly visible against the dark surface; gridline tick labels in a lighter gray, still legible; the callout card now uses a near-black fill with a thin border and white/light-gray text.
      Data: The same three polygons (brand green, lavender, blue) render with identical hues to the light version -- only the chrome (background, text, grid) flipped, as required. No dark-on-dark failures were found; all text remains visible against the near-black background.
      Legibility verdict: PASS -- title, axis labels, ticks, and callout text are all readable in the dark theme; data colors are confirmed identical to the light render.
