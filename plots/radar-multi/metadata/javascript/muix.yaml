review:
  strengths:
  - 'Native RadarChart composition: the chart''s own areas carry only the translucent
    fills (fillOpacity 0.22, no stroke), and a second <RadarSeriesArea fill="none">
    pass draws every outline above all fills, so no fill tints another series'' outline'
  - 'Grid configured through the chart''s own props: divisions={5} rings at 20/40/60/80/100,
    shape="sharp" polygonal rings, stripeColor={null}, and a single <RadarAxis> labels
    the ring values once on the first spoke with a page-colored halo that keeps them
    legible over the fills in both themes'
  - Vertex marks via <RadarSeriesMarks> with a page-colored ring make every data point
    readable at its exact spoke value, including where series nearly coincide (Connectivity,
    Battery Life)
  - Theme tokens threaded through every chrome element (title, subtitle, metric labels,
    grid, legend); both renders read cleanly and the Imprint colors are identical
    across themes
  - Plausible fictional headphone review with real trade-offs (budget model wins Value,
    premium model wins Sound Quality, mid model wins Noise Cancelling), so polygons
    cross and one sits mostly inside another
  - Columns and data block are cleanly separated from the plot code, which reads only
    the data and constants
  weaknesses:
  - 'Suggestion: a focal treatment (e.g. a slightly heavier outline for one model
    the subtitle names) could guide the reader to the main comparison.'
  - 'Suggestion: the ~130 px gap between the subtitle and the top metric label could
    shrink a little so the radar fills more of the square canvas.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, square 2400x2400.
      Chrome: bold dark title "radar-multi · javascript · muix · anyplot.ai" centered at top, soft-ink subtitle "3 series × 7 axes · Score (0–100)"; seven bold dark metric labels (Sound Quality, Noise Cancelling, Battery Life, Comfort, Build Quality, Value, Connectivity) at the outer spoke ends; ring values 20–100 on the top spoke with a page-colored halo; subtle gray heptagonal rings and spokes; horizontal legend at the bottom. All text readable.
      Data: three closed straight-edged polygons with translucent fills and 3 px outlines plus white-ringed vertex dots: AudioMax Pro #009E73 (first), SoundWave Elite #C475FD, EchoBudget #4467A3. Overlaps blend but every outline and the gridlines stay visible.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
