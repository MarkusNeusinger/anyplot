      Chrome: title, metric labels and legend in light ink, subtitle and ring values in soft light ink, grid rings dark gray but visible; no dark-on-dark text.
      Data: identical colors and geometry to the light render; vertex dots ringed in the dark page color; brand green clearly visible.
      Legibility verdict: PASS
