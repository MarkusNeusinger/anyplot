review:
  strengths:
  - Fills and outlines are split into two RadarSeriesArea passes (fills at 0.22 opacity
    with no stroke, then a fill-less outline layer on top), so no series' fill tints
    another series' outline and every polygon edge stays crisp where three fills overlap
  - Ring values 20–100 are labelled once along the Sound Quality spoke through RadarAxis
    with a page-colored text halo, so they stay readable over the stacked fills in
    both themes
  - Vertex marks carry a page-colored ring (stroke t.pageBg) that separates near-coincident
    vertices, e.g. the three Connectivity points
  - 'Chrome is threaded through window.ANYPLOT_TOKENS (ink, inkSoft, grid, pageBg,
    palette), so both renders are theme-correct with identical Imprint data colors
    (#009E73, #C475FD, #4467A3)'
  - Data is a believable headphone review with distinct per-model profiles (AudioMax
    leads sound/build, SoundWave leads noise cancelling/battery, EchoBudget leads
    value), giving crossing polygons that exercise the comparison
  - skipAnimation, sizing from window.ANYPLOT_SIZE and the v9 RadarChart composition
    API follow the harness contract
  weaknesses:
  - 'CQ-01 (code): a second React component WidestLead (about 50 lines with geometry
    hooks and a hand-estimated box width) exists only to draw the ''Widest lead''
    callout the spec does not request → remove the component and its leads/widest
    computation so the file is the single Chart component. Likely cause: the callout
    layer added for a focal point.'
  - 'Suggestion: the ''Widest lead: Value'' callout is an annotation the spec does
    not request; the polygons and legend already carry the comparison without it.'
  - 'Suggestion: the empty band of about 150 px between the bottom axis labels and
    the legend could be tightened by reducing the bottom margin.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, 2400x2400 square canvas.
