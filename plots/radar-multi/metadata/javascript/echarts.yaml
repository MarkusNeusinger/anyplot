review:
  strengths:
  - 'Imprint palette applied correctly: first series AudioMax Pro is #009E73 (brand
    green), second/third series follow canonical order (lavender #C475FD, blue #4467A3),
    and data colors are pixel-identical between light and dark renders — only chrome
    flips.'
  - Filled polygons with alpha ~0.22 plus distinct outline width (3px) satisfy the
    spec's transparency and fill+outline notes, and marker size (6px circles) is well-chosen
    for the sparse 3-series/6-axis dataset.
  - 'Canvas is exactly square 2400x2400 per the `//# anyplot-orientation: square`
    directive, with no clipping, overlap, or overflow in either theme.'
  - Clean, idiomatic single setOption() call with animation:false, no explicit init
    size/devicePixelRatio, and deterministic in-memory data — matches the mount-node
    contract exactly.
  - Title format is exactly `radar-multi · javascript · echarts · anyplot.ai`; legend
    labels match series names; realistic, neutral fictional earbud product data at
    a sensible 0-100 scale.
  weaknesses:
  - radar.axisLabel is set to show:false, so no numeric gridline values (e.g. 20/40/60/80/100)
    are ever visible on any axis — the spec explicitly asks for gridlines 'at regular
    intervals... for value reference'. Set axisLabel.show:true with a small fontsize
    (~10-11px) colored from t.inkSoft so viewers can read the scale, while keeping
    it subtle enough not to clutter the polygon overlap area.
  - 'Design Excellence is generic: no visual hierarchy or distinctive touch beyond
    the palette swap — e.g. no emphasis/highlight on a focal series, no alternating
    splitArea shading for radial depth, uniform line weights across all three series.
    Consider a subtle splitArea banding or emphasis focus state to add polish and
    guide the eye.'
  - Library Mastery is basic idiomatic usage only — no distinctive ECharts radar features
    exercised (e.g. shape:'circle' vs default polygon comparison, rich axisName formatting,
    emphasis.focus:'series' for hover clarity in the HTML view). Leveraging one or
    two of these would better showcase what ECharts specifically offers for radar
    charts.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "radar-multi · javascript · echarts · anyplot.ai" in bold dark ink, centered top, clearly legible. Six axis category labels (Sound Quality, Durability, Value, Noise Cancel., Comfort, Battery Life) in medium-gray ink, all readable and well-balanced in size. Legend at bottom with three color swatches and dark, legible text. Radial split lines (concentric hexagon rings) are subtle light gray, visible but not dominant. No numeric value labels are rendered on any axis (axisLabel.show is false).
      Data: Three overlapping filled polygons — AudioMax Pro in brand green (#009E73), SoundWave Elite in lavender (#C475FD), EchoBuds Plus in blue (#4467A3) — each with ~0.22 opacity fill and a solid 3px outline plus circular markers at each vertex. All three are clearly distinguishable from each other and from the background.
      Legibility verdict: PASS (all text readable; only gap is the absent numeric gridline reference values, which is a spec-completeness issue, not a legibility failure).

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Title renders in light/white ink, clearly legible against the dark background. Axis category labels are in a lighter gray tone, still clearly readable — no dark-on-dark issue observed. Legend text is light-colored and legible. Split lines are a subtle light gray, visible without dominating.
      Data: Same three polygons in the identical brand green / lavender / blue as the light render — confirmed pixel-identical hues; only the surrounding chrome (background, text, grid) flipped to the dark theme. Markers and outlines remain clearly visible against the dark fill.
      Legibility verdict: PASS (no dark-on-dark text; all chrome and data elements remain distinguishable).
