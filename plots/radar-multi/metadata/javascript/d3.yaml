review:
  strengths:
  - 'Correct Imprint palette in canonical order (green #009E73, lavender #C475FD,
    blue #4467A3), identical across light and dark renders, with theme-correct #FAF8F1
    / #1A1A17 backgrounds and chrome'
  - Ring value labels (20/40/60/80/100) use haloed background boxes so they stay legible
    even where overlapping translucent polygons cross them — a thoughtful legibility
    solution
  - Realistic, neutral quarterly-review competency dataset with genuinely differentiated
    shapes per person (each has distinct high/low competencies), satisfying the spec's
    comparison-clarity intent
  - 'All spec notes honored: filled polygons at alpha 0.22, closed via curveLinearClosed,
    both fill and stroke per polygon, gridlines at the specified 20-unit interval,
    axis labels at the outer edge, legend identifying each series'
  weaknesses:
  - 'Library Mastery: only the legend uses D3''s idiomatic `.data().join()` pattern
    — grid rings, axis spokes/labels, series polygons, and per-point circles are all
    built with manual `forEach` + `.append()` loops instead of data joins. Convert
    these to `selection.data(...).join(...)` to better demonstrate D3''s data-binding
    strengths.'
  - 'Data Storytelling: the three overlapping polygons are easy to compare but there''s
    no visual emphasis or focal point (no highlighting of a standout competency or
    an overall leader). Consider a subtle callout, size/opacity emphasis, or ranked
    ordering to guide the viewer toward an insight.'
  - 'Canvas utilization: the square canvas has substantial unused whitespace in all
    four corners due to margin=170 plus the titleH(90)/legendH(90) reserves. Reduce
    the margin or grow the radius so the radar shape fills more of the 2400x2400 canvas
    per the Layout & Canvas guideline.'
  - 'Code structure: angleFor/pointFor are small helper functions; a stricter KISS
    read would inline the trig or minimize the helper surface.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Bold dark title "radar-multi · javascript · d3 · anyplot.ai" centered at top; six category axis labels (Communication, Technical Skill, Leadership, Creativity, Problem Solving, Teamwork) in dark ink around the outer edge; hexagonal gridlines at 20/40/60/80/100 in a subtle light-gray stroke; ring value labels (20-100) sit on small haloed boxes so they stay readable where series overlap; centered legend below the chart with three color swatches and names. All text is clearly readable against the light background.
      Data: Three overlapping filled polygons (alpha ~0.22) with 3.5px strokes and small circular markers (white/page-bg stroke) at each vertex — Alicia Chen in brand green #009E73, Marcus Reyes in lavender #C475FD, Priya Nair in blue #4467A3. Each polygon has a visibly distinct shape (different strengths/weaknesses per person), showing genuine data variation.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Same title, axis labels, gridlines, ring labels, and legend, now rendered in light ink (#F0EFE8-family) against the dark surface. Ring value labels sit on small dark haloed boxes that still contrast against the translucent color fills behind them. All text is clearly legible — no dark-on-dark instances found.
      Data: Same three polygons in the identical green/lavender/blue hues as the light render — confirms data colors are theme-independent; only chrome (background, text, grid) flipped.
      Legibility verdict: PASS
