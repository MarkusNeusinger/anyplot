      Data: Three semi-transparent filled polygons — Aria Pro (brand green #009E73, emphasized with a thicker stroke and larger white-stroked dots as the computed top-scoring series), Sonic Wave (lavender #C475FD), Bass Nova (navy blue #4467A3) — each closed and rendered with fill + stroke. Legend at the bottom center with rounded color swatches and dark labels, evenly spaced, well clear of the canvas edge.
