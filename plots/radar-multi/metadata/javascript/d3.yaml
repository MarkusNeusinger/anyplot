review:
  strengths:
  - 'Correct Imprint palette in canonical order (green #009E73 / lavender #C475FD
    / blue #4467A3) with alpha-blended fills (fill-opacity 0.22) that keep overlapping
    series legible'
  - 'Full spec feature checklist met: reference gridlines at 20/40/60/80/100, polygons
    closed via d3.curveLinearClosed, both fill and stroke per series, legend identifying
    each series, axis labels at the outer edge'
  - 'Clean, idiomatic D3: d3.lineRadial + scaleOrdinal + .join() pattern, deterministic
    hardcoded data, no fake interactivity or drawn UI controls'
  - Theme-adaptive chrome correctly threaded through window.ANYPLOT_TOKENS in both
    renders — data colors identical between light and dark, only chrome (background,
    ink, grid) flips
  - 'Thoughtful details: cosine-based text-anchor logic keeps axis labels from overlapping
    on the left/right sides, white-stroke dots pop against the filled polygons, rounded-rect
    legend swatches'
  weaknesses:
  - 'Minor label crowding: the ''60'' gridline value label on the Sound Quality (top)
    axis sits very close to the Bass Nova marker at that axis (value 62) in both renders
    — increase the level-label x-offset (currently 4px) or nudge it further from the
    axis line so it doesn''t compete with a data dot that lands near that ring.'
  - No small caption near the gridline labels clarifying the 0-100 scale (e.g. 'Score')
    — the numeric rings imply it but an explicit unit/caption would remove ambiguity
    for readers unfamiliar with the review-score domain.
  - Visual hierarchy across the three overlapping series is flat — all three polygons
    share the same stroke width and opacity, so no series reads as a focal point;
    a slightly heavier stroke/marker on a 'best overall' series (if the data intends
    one) would sharpen the storytelling.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "radar-multi · javascript · d3 · anyplot.ai" in bold dark ink, centered top, fully legible. Six axis labels (Sound Quality, Battery Life, Comfort, Noise Cancel., Build Quality, Value) in medium-weight dark text at the outer edge of each spoke, all readable. Radial gridline value labels (20/40/60/80/100) in small soft-gray text along the top spoke, legible but positioned close to the Bass Nova marker on that axis. Concentric circular gridlines and radial spokes are thin, light gray — subtle but visible. Legend at the bottom with three rounded color swatches (green, lavender, blue) and dark labels (Aria Pro, Sonic Wave, Bass Nova), clearly readable.
      Data: Three semi-transparent filled polygons — Aria Pro in brand green (#009E73), Sonic Wave in lavender/purple, Bass Nova in navy blue — each with a solid stroke, filled interior at ~22% opacity, and white-stroked circular markers at each vertex. All three are clearly distinguishable from each other and from the background.
      Legibility verdict: PASS (minor tight spacing between the "60" gridline label and a data marker on the Sound Quality axis, not a legibility failure).

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Title and all six axis labels render in light/white text, clearly legible against the dark background — no dark-on-dark issues. Gridline value labels (20/40/60/80/100) remain in a soft light-gray tone, legible. Concentric gridlines and spokes are thin and subtle but still visible against the dark surface. Legend at the bottom uses the same three color swatches with light text labels, fully readable.
      Data: The same three data colors — brand green, lavender, navy blue — are visually identical to the light render; only the chrome (background, text, grid) has flipped to the dark theme. Markers and fills remain clearly distinguishable from the dark background and from each other.
      Legibility verdict: PASS — no dark-on-dark or light-on-light failures in either theme.
