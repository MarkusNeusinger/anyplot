review:
  strengths:
  - 'Imprint palette used in exact canonical order (#009E73, #C475FD, #4467A3), identical
    data colors across light and dark renders, with fully theme-correct chrome (backgrounds,
    text, grid) in both themes'
  - Fill alpha (0.25) sits precisely in the spec-recommended 0.2-0.3 range, and every
    series uses both a filled polygon and a distinct outline as the spec suggests
  - Point markers use the page-background color as their border, creating a clean
    'cutout' effect where polygons overlap in both themes
  - Gridlines and angle lines at regular 20-unit steps with category labels clearly
    placed at the outer edge, matching the spec's gridline and labeling requirements
  - 'Realistic, neutral data: three headphone models with plausible, differentiated
    strength/weakness profiles (audio-focused, battery-focused, comfort-focused) rather
    than generic or flat values'
  - 'Deterministic, KISS-adjacent code that respects the JS mount-node contract exactly
    (canvas appended to #container, animation: false, no fixed sizing)'
  weaknesses:
  - 'DE-01: Aesthetic treatment is competent but generic — three equal-weight overlapping
    polygons with palette defaults and no distinctive visual flourish beyond the required
    tokens (e.g. no varied line/point treatment to add polish)'
  - 'DE-02: Some refinement exists (transparent tick backdrop, page-bg point borders)
    but the grid/angle lines use plain default weight and there''s no further whitespace
    or chrome tuning beyond the baseline tokens'
  - 'DE-03: No visual hierarchy or focal point — all three series are drawn with identical
    line weight and z-order, so the chart shows raw comparison data without guiding
    the viewer to an insight; consider emphasizing one series (e.g. thicker line/higher
    opacity) or adding a brief callout on the standout attribute'
  - 'LM-02: Radar-specific config (pointLabels, angleLines, stepped ticks) is fairly
    generic — nothing here is distinctively Chart.js (e.g. no custom point-style shapes
    per series, no plugin-based enhancement) that couldn''t be replicated easily in
    another library'
  - 'CQ-01: The hexToRgba helper function is a reasonable necessity for alpha-blended
    fills, but it''s a deviation from the strict KISS ''imports -> data -> plot''
    shape — inlining or precomputing the rgba strings would tighten this further'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matching the required #FAF8F1 surface — not pure white.
      Chrome: Bold dark title "radar-multi · javascript · chartjs · anyplot.ai" centered at top; six category
        labels (Sound Quality, Battery Life, Comfort, Noise Cancelling, Build Quality, Value) in dark ink at the
        outer edge of the hexagonal grid; subtle light-gray radial gridlines at 20/40/60/80/100 with numeric
        tick labels; legend with colored swatches and model names centered below the plot. All text is clearly
        readable against the light background.
      Data: Three overlapping filled polygons — AuraSound Studio in brand green (#009E73), PulseWave Air in
        lavender (#C475FD), EchoFit Sport in blue (#4467A3) — each with a solid outline, semi-transparent fill,
        and circular point markers bordered in the page background color for a clean cutout look against
        overlaps.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, matching the required #1A1A17 surface — not pure black.
      Chrome: Same title and category labels now rendered in light/off-white ink, clearly legible against the
        dark background; gridlines and angle-spokes remain subtle light gray at low opacity; legend text is
        light-colored and fully readable; no dark-on-dark text anywhere.
      Data: Identical green/lavender/blue polygon colors to the light render — confirmed unchanged data-color
        identity, only the chrome (background, text, grid) flipped for the dark theme. Point borders now pick
        up the dark page background for the same cutout effect.
      Legibility verdict: PASS
