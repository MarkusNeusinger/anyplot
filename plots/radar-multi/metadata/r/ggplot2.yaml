review:
  strengths:
  - 'Perfect Imprint palette compliance: first series is #009E73, positions 2-3 follow
    the canonical order (#C475FD, #4467A3), and chrome (background, text, grid, legend
    box) is correctly theme-adaptive in both renders.'
  - Custom coord_radar() ggproto extension (is_linear=TRUE) correctly keeps polygon
    edges straight instead of letting coord_polar() arc-interpolate them — a distinctive,
    idiomatic ggplot2-specific technique for radar charts.
  - No text or data overlap in either render; all font sizes are explicitly set via
    theme() and remain readable in both light and dark themes.
  - Realistic, neutral phone-comparison dataset with genuine trade-offs across series
    (each phone leads on a different axis), avoiding flat/uniform data.
  - Title and legend format exactly match the spec requirement, and required spec
    features (filled polygons with alpha, distinct colors, legend, regular gridlines,
    closed polygons, fill+outline) are all present.
  weaknesses:
  - 'Unused imports: library(dplyr) and library(tidyr) are loaded but never used anywhere
    in the code (no %>%, mutate, filter, pivot_* calls) — remove them; library(scales)
    is also unused unless kept deliberately for expansion() (which ggplot2 already
    re-exports).'
  - Radial value axis (0-100) has no descriptive label or unit (e.g. 'Score') — only
    bare numeric ticks, which under-explains what the scale represents.
  - 'Design Excellence is at well-configured-default level: the grid, legend box,
    and typography are correct and compliant but don''t go beyond following the spec/style-guide
    — no extra visual hierarchy or polish (e.g. subtly emphasizing one series, alternating
    ring shading, or refined line/marker weight contrast) to lift it above ''good
    default''.'
  - 'No visual hierarchy or storytelling emphasis: all three phone polygons carry
    equal visual weight, so the viewer must compare all three from scratch rather
    than being guided toward an insight.'
  - Marker size (2.5) is adequate but conservative for a sparse dataset (only 18 points
    total across 3 series) — slightly larger points would add more visual pop, especially
    at thumbnail scale.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "radar-multi · r · ggplot2 · anyplot.ai" is dark, centered, fully visible at the top. Six category axis labels (Camera, Performance, Display, Value, Durability, Battery Life) are dark and clearly legible around the polar grid. Radial value ticks (0/20/40/60/80/100) are soft gray on the left, legible without colliding with the "Battery Life" label. Grid rings/spokes are dark, moderately bold (matches ink color) but appropriate for a radar chart where the reference grid is a primary structural element, not a secondary decoration. Legend sits centered below the plot in a bordered box with square color-and-dot swatches for "Aurora X12", "Nimbus S8", "Ridgeline Pro" — all readable.
      Data: Three translucent (alpha ~0.25) filled polygons with matching outline and point markers — green (#009E73, Aurora X12), lavender (#C475FD, Nimbus S8), blue (#4467A3, Ridgeline Pro). Each phone clearly leads on a different axis (Ridgeline Pro on Camera/Display, Nimbus S8 on Battery Life/Value, Aurora X12 on Performance), consistent with the spec's comparative-analysis intent.
      Legibility verdict: PASS — all text is clearly readable against the light background, no dark-on-light or light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Title, axis category labels, and radial tick numbers all render in light/off-white tones and remain fully legible against the dark background — no dark-on-dark failures observed. Grid rings/spokes flip to a light off-white color at the same weight as the light render. Legend box background flips to the elevated dark surface with light text, fully readable.
      Data: Data colors are pixel-identical to the light render — green (#009E73), lavender (#C475FD), blue (#4467A3) — confirming only chrome (not data) flips between themes.
      Legibility verdict: PASS — all text is clearly readable against the dark background; no dark-on-dark or light-on-dark issues found.
