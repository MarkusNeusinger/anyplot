      Data: First series (Aurora X12) is the brand green #009E73, second (Nimbus S8) lavender, third (Ridgeline Pro) blue — matches canonical Imprint order. Filled polygons with ~0.25 alpha overlap legibly; each phone's polygon shape checked against its score vector and confirmed correct on all six axes.
