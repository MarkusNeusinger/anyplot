review:
  strengths:
  - 'First series correctly uses Imprint brand green #009E73, with Team Lead (#C475FD)
    and New Hire (#4467A3) filling positions 2 and 3 in canonical order'
  - Radial value labels (20/40/60/80) are cleverly placed in the empty sector between
    the Communication and Technical Skill axes, avoiding overlap with category labels
    or polygon strokes
  - Category labels use angle-aware halign/valign logic (cos/sin thresholds) so labels
    shift alignment around the ring instead of colliding with the outer edge
  - Polygons combine fill (alpha 0.22), stroke (linewidth 3), and vertex markers with
    a background-colored stroke for definition — matches the spec's 'both fill and
    outline' guidance and keeps overlap regions readable
  - Theme tokens (PAGE_BG, INK, INK_SOFT, INK_MUTED) are threaded consistently through
    title, labels, spokes, and grid rings, and hold up correctly in both light and
    dark renders
  - Canvas hits the exact 2400x2400 square target via resolution=(1200,1200) + px_per_unit=2,
    appropriate for a 6-axis radar
  - Clean, function-free top-to-bottom script with hardcoded literal data (no seeding
    needed since nothing is random) and no unused imports
  weaknesses:
  - Title occupies only ~35-40% of the plot width at titlesize=26 — well under the
    50-70% comfortable target from the style guide; could grow slightly to fill more
    of the canvas without approaching overflow risk
  - 'Data storytelling is generic: three series are shown with equal visual weight
    and no emphasis technique (e.g. highlighting the strongest/weakest performer)
    to guide the viewer to a specific insight'
  - Library mastery is fairly basic — poly!/lines!/scatter!/text!/axislegend are all
    common Makie primitives; nothing distinctive to CairoMakie is showcased (e.g.
    no Colorbar, no custom Legend entries, no Blocks-level theming) beyond the manual
    polar-to-Cartesian trick, which is itself a reasonable but not particularly novel
    workaround
  - Radial value labels and category tick labels sit on the small side (fontsize 12)
    relative to the 2400x2400 canvas — legible but could be bumped up 1-2pt for more
    comfortable mobile-width readability
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "radar-multi · julia · makie · anyplot.ai" in bold dark ink at top-center, fully visible. Six category axis labels (Communication, Technical Skill, Leadership, Creativity, Problem Solving, Time Management) in dark ink around the hexagon perimeter, all legible with no clipping. Concentric hexagonal gridlines (20/40/60/80/100) in faint dark tone, small muted-gray value labels (20/40/60/80) placed in the gap between Communication and Technical Skill. Spokes from center to each vertex in soft ink at reduced opacity. Legend (Senior Engineer / Team Lead / New Hire) bottom-right, frameless, dark text.
      Data: Three overlapping filled polygons — Senior Engineer in brand green (#009E73), Team Lead in lavender (#C475FD), New Hire in blue (#4467A3) — each with alpha-blended fill, solid stroke, and outlined vertex markers. Overlap regions read clearly through the transparency.
      Legibility verdict: PASS — all text is dark-on-light and clearly readable; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title and six axis labels, now in light ink (near-white), clearly visible against the dark background. Gridlines and spokes rendered in light ink at reduced opacity, still subtle but visible. Value labels (20/40/60/80) in muted light-gray, readable. Legend text flipped to light ink, still frameless.
      Data: Same three series colors as the light render — green, lavender, blue — confirming data colors are held constant across themes; only chrome (background, text, grid) flipped.
      Legibility verdict: PASS — no dark-on-dark failures observed; all title/axis/tick/legend text is clearly legible against the near-black surface.
