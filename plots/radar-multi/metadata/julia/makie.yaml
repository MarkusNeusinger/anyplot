review:
  strengths:
  - Correct Imprint palette order (green Senior Engineer, lavender Team Lead, blue
    New Hire) with data colors pixel-identical between light and dark renders
  - Radial value labels (20/40/60/80) are thoughtfully placed in the empty sector
    between the Communication and Technical Skill axes to avoid cluttering the polygons
  - Idiomatic use of the scatterlines! recipe to draw stroke, connecting outline,
    and vertex markers for each series in a single Makie call
  - Clear three-tier data story (Senior Engineer > Team Lead > New Hire) with the
    New Hire polygon visibly smaller and more compact across every axis
  - Canonical 2400x2400 canvas hit exactly, no clipped text, correct mandated title
    format
  weaknesses:
  - Radial value labels (text! calls for 20/40/60/80) are drawn before the series
    poly!/scatterlines! calls, so they render underneath the translucent series fills
    in Makie's z-order — the digits get slightly color-tinted wherever a polygon's
    fill covers that sector. Move the text! calls for ring labels after the series
    loop (or increase alpha contrast) so they always render at full contrast on top.
  - The three series carry equal visual weight with no additional emphasis technique
    (e.g. a slightly bolder outline or a short annotation on the standout metric)
    to sharpen the single takeaway beyond the general size-comparison story.
