review:
  strengths:
  - Deterministic custom force-relaxation packing algorithm (index-seeded, no RNG)
    avoids the missing highcharts-more dependency entirely and is reused cleanly for
    both the leaf level and the directory level
  - 'Per-leaf label ink is computed from each fill''s own luminance rather than the
    page theme, so text stays readable on every one of the 8 Imprint colors in both
    light and dark renders — first series correctly uses brand green #009E73'
  - SVG <title> hover tooltips on every circle (root, ring, leaf) preserve full names
    and totals even where the static label is truncated for space — a good, non-fake
    use of the interactive-library allowance
  - 'Theme-adaptive chrome is threaded correctly end-to-end: page background, title/subtitle
    ink, and ring stroke colors all flip appropriately while the 8 categorical data
    colors stay pixel-identical across themes'
  weaknesses:
  - Leaf labels on the smallest labeled circles (~24-30px radius, e.g. 'types.d...',
    'fixture...', 'changel...') use 9-10px font — legible at full 2400px resolution
    but likely to disappear when the PNG is downscaled to the ~400px mobile thumbnail;
    consider raising the minimum labeled-circle radius or the font floor slightly.
  - Hierarchy is only 2 levels deep (root -> directory -> file) even though the spec
    allows up to 4; one more nesting level (e.g. splitting 'components/' into named
    sub-files) would better demonstrate the packing algorithm on deeper hierarchies
    and improve DQ-01 feature coverage.
  - Visual treatment is uniform across all 5 rings (same stroke width, same 10% fill
    alpha everywhere) — a touch more depth (subtle shadow, stroke-weight variation
    by depth, or stronger ring-outline vs leaf-fill contrast) would push this from
    'strong' toward 'publication-ready'.
  - 'chart.renderer is used for 100% of the drawing (series: []) — a deliberate and
    well-justified workaround given highcharts-more isn''t vendored, but it means
    the implementation doesn''t exercise Highcharts'' higher-level series/plotOptions
    API at all.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "circlepacking-basic · javascript · highcharts · anyplot.ai" in bold dark ink at top; subtitle "Repository directory sizes — circle area = file/folder size (KB), colour = directory" in softer gray ink below. Each of the 5 directory rings has a dark-ink label above it (e.g. "build/ · 1.3 MB"). All chrome text is clearly readable against the light background.
      Data: Root circle outlined in light gray encompasses 5 tinted category rings (src=green #009E73, tests=lavender, docs=blue, assets=ochre, build=matte red — canonical Imprint order). Each ring has a 10%-alpha fill in its category color and contains solid leaf circles in the same color, area-scaled to file/folder size. Leaf labels use ink chosen per-leaf from the fill's own luminance (white text on green/red/blue/lavender leaves, dark text on ochre leaves) — first series is confirmed #009E73.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title and subtitle now rendered in light ink, clearly readable against the dark background. Ring category labels (e.g. "src/ · 1.4 MB") flip to light ink for contrast against the page.
      Data: All 5 category ring colors and all leaf fill colors are pixel-identical to the light render (green/lavender/blue/ochre/red) — only the chrome flipped. Leaf label ink is unchanged from the light render (e.g. "components/" still white-on-green, "images/" still dark-on-ochre) since it's computed from each leaf's fixed fill color rather than the page theme — this is the intended design and reads correctly in both themes. No dark-on-dark or light-on-light failures observed.
      Legibility verdict: PASS
