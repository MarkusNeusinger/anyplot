review:
  strengths:
  - Leaf radius is 8*sqrt(value), so area is proportional to value, and every circle
    sits inside its parent with the root enclosing all groups
  - 'Depth reads clearly in both themes: faint ink outline for the root, tinted fill
    with colored stroke for asset classes, solid leaves separated by page-colored
    rings'
  - Label ink switches by fill luminance (cream on blue and red, near-black on green,
    lavender and ochre), and names are only drawn where they fit
  - 'Idiomatic MUI X composition: ChartsContainer with hidden axes, useDrawingArea
    to scale the custom SVG layer, ChartsText for multi-line labels, skipAnimation'
  - Legend with group totals and a subtitle stating the area encoding and portfolio
    total; group sums are computed from the leaves
  - Native SVG title hover gives every node, including the unlabeled leaves, its name
    and value in the HTML view
  weaknesses:
  - 'Suggestion: Commodities (70 $K) is about the size of the labeled Hedge Funds
    leaf but stays unlabeled because the single 11-character word fails the width
    test; a slightly smaller minimum name size for single words would label it.'
  - 'Suggestion: the asset classes leave a large empty arc inside the root on the
    lower right and top; a tighter front-chain packing of the top level would let
    the groups fill more of the canvas.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, square 2400x2400 canvas.
      Chrome: centered bold title "circlepacking-basic · javascript · muix · anyplot.ai" in dark ink, a gray subtitle "Portfolio · 5 groups · total 2,040 $K · circle area ∝ Market value ($K)", and a one-row legend with colored dots: Equities (865 $K), Fixed Income (530 $K), Real Estate (260 $K), Alternatives (285 $K), Cash & Equivalents (100 $K). No axes or grid. All readable.
      Data: a large root circle with a faint gray outline holds five asset-class circles with tinted fills and colored strokes: Equities in #009E73 (US Large Cap 420, Int'l Developed 210, US Small Cap 140, Emerging Markets 95), Fixed Income lavender (Government Bonds 260, Corporate Bonds 180, Municipal Bonds 90), Real Estate blue (REITs 150, Direct Property 110), Alternatives ochre (Private Equity 130, Hedge Funds 85, one unlabeled leaf), Cash matte red (Money Market, one unlabeled small leaf). Leaves are solid with page-colored separating rings; bold names with values below, dark ink on green/lavender/ochre, cream ink on blue/red. No overlaps; noticeable empty space inside the root.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
