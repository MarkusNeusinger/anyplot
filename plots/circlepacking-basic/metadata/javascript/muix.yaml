review:
  strengths:
  - 'Truncation weakness from attempt 1 is fully fixed: wrapLabel() balances long
    leaf names onto two lines via MUI X''s own ChartsText primitive, so every leaf
    circle now shows its full label (''Corporate Bonds'', ''Government Bonds'', ''Int''l
    Developed'', ''Treasury Bills'', etc.) instead of ellipsis-truncating mid-word'
  - 'Correct Imprint palette usage: first branch #009E73, remaining branches in canonical
    order, identical data colors between light/dark renders, theme-correct chrome
    (background, ink, grid) in both'
  - Genuinely custom circle-packing layout (seeded force simulation, seed=42) since
    the community MUI X package has no built-in packing layout -- real engineering,
    fully deterministic and reproducible
  - Luminance-based text color switching keeps every leaf label high-contrast regardless
    of the branch's fill tint or the page theme
  - Clean, correctly-sized square canvas with no overlap, no clipping, and correct
    use of ChartContainer/useDrawingArea/ChartsText per the harness contract (skipAnimation,
    ANYPLOT_SIZE sizing)
  weaknesses:
  - 'The file header is duplicated/corrupted: lines 1-10 contain two overlapping ''//
    anyplot.ai'' comment blocks (one with ''Library: muix 7.29.1 | JavaScript 22.23.2''
    and ''Quality: 87/100'', another with ''Library: MUI X Charts | React | Node 22''
    and ''Quality: pending'') -- collapse this into a single clean header block.'
  - MUI X is still used mostly as an SVG canvas (ChartContainer + useDrawingArea +
    ChartsText) with series=[] -- no actual MUI X chart component (e.g. PieChart,
    ScatterChart) or MUI X-specific tooltip/legend primitive is exercised, so Library
    Mastery stays capped; this may be an inherent limit of circle-packing on the community
    package rather than something fixable.
  - Dataset still sits at the floor of the spec's size range (20 nodes / 3 levels),
    unchanged from attempt 1 -- a fourth hierarchy level or more leaf nodes per branch
    would better demonstrate the plot type's ability to show deep nesting.
