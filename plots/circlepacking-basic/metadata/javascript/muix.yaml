review:
  strengths:
  - 'Correct Imprint palette usage: first branch #009E73, remaining branches in canonical
    order, identical data colors between light/dark renders, theme-correct chrome
    in both'
  - Genuinely custom circle-packing layout (seeded force simulation) since the community
    MUI X package has no built-in packing layout -- real engineering, not a workaround
    shortcut, and fully deterministic (seed=42)
  - Luminance-based text color switching keeps every leaf label high-contrast regardless
    of the branch's fill tint or the page theme
  - Clean, correctly-sized square canvas with no overlap, no clipping, and sensible
    use of ChartContainer/useDrawingArea per the harness contract (skipAnimation,
    ANYPLOT_SIZE sizing)
  weaknesses:
  - Several leaf labels truncate mid-word ('Direct...', 'Corporate...', 'Int'l...',
    'Municipal...', 'Treasury...', 'Emerging...', 'Money...') -- tune truncateLabel/maxChars
    so more leaf circles show their full label, especially ones as large as 'Corporate
    Bonds' ($180K) that currently truncate while smaller 'US Small Cap' ($140K) does
    not
  - MUI X is used only as an SVG canvas (ChartContainer + useDrawingArea) with series=[]
    -- no actual MUI X chart component or MUI X-specific tooltip/legend primitive
    is exercised, so Library Mastery stays low
  - Dataset sits at the floor of the spec's size range (20 nodes / 3 levels) -- a
    fourth hierarchy level or more leaf nodes per branch would better demonstrate
    the plot type's ability to show deep nesting
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white cream matching #FAF8F1, not pure white.
      Chrome: Title "circlepacking-basic · javascript · muix · anyplot.ai" in bold dark ink, fully legible. Subtitle in softer gray ink, legible. Legend row (5 color-dot + label pairs: Equities, Fixed Income, Real Estate, Alternatives, Cash & Equivalents) fully legible dark-on-cream. Root circle outlined in a subtle light-gray stroke.
      Data: Branch circles use light-tinted fills with a 2px colored stroke matching their legend swatch (green, lavender, blue, ochre, red -- canonical Imprint order, first branch #009E73). Leaf circles are white-mixed tints of their branch color scaled by relative value, each labeled in bold dark or white text chosen by relative luminance -- text color correctly switches per fill so every label stays high-contrast. Several smaller/mid leaf labels are truncated with an ellipsis (e.g. "Direct...", "Treasury...", "Money...", "Corporate...").
      Legibility verdict: PASS (all title/subtitle/legend/leaf text readable against the light background; no light-on-light failures)

    Dark render (plot-dark.png):
      Background: Warm near-black matching #1A1A17, not pure black.
      Chrome: Title and subtitle rendered in light/off-white ink, fully legible against the dark background. Legend text is light-colored and legible. Root circle stroke rendered in light gray, visible against dark background.
      Data: Branch and leaf circle colors are visually identical to the light render (green, lavender, blue, ochre, red branches; same value-scaled tints) -- only the chrome (background, title/subtitle/legend text, root stroke) flipped to light tones as expected. No dark-on-dark failures: leaf/branch labels stay legible because the text-color logic is luminance-based on the fill, independent of the page theme.
      Legibility verdict: PASS (all title/subtitle/legend/leaf text readable against the dark background; no dark-on-dark failures)
