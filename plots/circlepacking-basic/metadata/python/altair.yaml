review:
  strengths:
  - 'Real nested packing: every leaf sits inside its department and every department
    inside the root with even padding, built from sqrt(value) radii so leaf area is
    proportional to budget'
  - 'Theme tokens threaded through every element: INK labels, INK_SOFT outlines, ELEVATED_BG
    root fill, PAGE_BG canvas; both renders read cleanly'
  - Depth is readable by fill opacity (root elevated surface, department tint at 0.22,
    leaves at 0.6) while hue carries the department, from one shared Imprint Color
    scale
  - Idiomatic Altair layering with shared encodings, Size scale=None for exact pixel
    areas, native bottom legend and per-node tooltips in the HTML
  - 'Canvas handled per the library rule: small inner view, save at scale 4, pad to
    exactly 2400x2400 without cropping'
  weaknesses:
  - 'VQ-05 (both): the horizontal department legend starts near x≈200 px and ends
    near x≈1460 px, so it sits left of the chart''s centre axis at x≈1200 px under
    a centred title and root circle → centre the legend under the root circle. Likely
    cause: alt.Legend(orient="bottom") anchors to the view''s start; set legend layout
    anchor to middle (configure_legend(layout={"bottom": {"anchor": "middle"}})) or
    place it with orient="none" and legendX.'
  - 'CQ-01 (code): lines 65-104 define pack() and lines 133-137 define to_frame(),
    two helper functions against the Imports → Data → Plot → Save structure → inline
    to_frame''s three lines once over the concatenated rows, and run the packing as
    an inline loop over the two levels. Likely cause: the packing was factored out
    to reuse it for leaves and departments.'
  - 'Suggestion: department names drawn directly at the top edge of each department
    circle would let the reader skip the legend lookup.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 canvas, 2400x2400; the root circle is filled with the slightly lighter elevated surface and outlined in a grey INK_SOFT stroke.
      Chrome: bold dark title 'circlepacking-basic · python · altair · anyplot.ai' centred at the top, grey subtitle 'Circle area proportional to Budget (thousand USD)'; no axes or grid; horizontal legend at the bottom (Engineering, Marketing, Operations, Sales) in grey text, placed left of centre. All text readable.
      Data: four department circles inside the root, tinted at low opacity in Imprint green #009E73 (Engineering, largest, left), lilac #C475FD (Marketing, right), blue #4467A3 (Operations, top), ochre #BD8233 (Sales, bottom); 17 team leaf circles at 0.6 opacity in the same hues, each with a bold dark two-line label (name and value, e.g. 'Backend 180'). Leaves never overlap and stay inside their departments; departments stay inside the root.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17; root circle on the slightly lighter elevated surface with a light-grey outline.
      Chrome: title in near-white, subtitle and legend text in light grey; no dark-on-dark text anywhere.
      Data: same layout and the same Imprint hues; the 0.6/0.22 fill opacities blend over the dark surface so leaves read deeper (green, purple, navy, brown), outlines flip to light grey; leaf labels in near-white bold, all readable.
      Legibility verdict: PASS
