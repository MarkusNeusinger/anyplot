review:
  strengths:
  - Leaf areas share one sqrt(value) scale across all four folders, so Videos (65
    GB) reads as about 2.6 times Work (25 GB); every circle sits inside its parent
    with padding and no sibling crossings
  - Leaf label ink is chosen per fill by WCAG luminance contrast (light text on the
    blue Projects leaf, dark text on lavender, green and ochre), so every leaf label
    is readable in both themes
  - 'Bold page-colored folder names sit on the root ring beside their circles, never
    over the nested leaves, against regular-weight leaf names: a clear two-level type
    hierarchy'
  - Circle polygons get a vertex count proportional to their radius, so the root and
    folder outlines stay smooth at full size
  - The one-panel gggrid wrapper paints the whole canvas in the page color, so no
    transparent strips are left by coord_fixed; scale_fill_identity/scale_color_identity
    map the computed colors directly
  - The layout runs over a generic id/parent table with 24 nodes on three levels,
    and the HTML export keeps the chart interactive in the detail view
  weaknesses:
  - 'CQ-01 (code): a module-level helper function luminance() breaks the flat imports-data-plot-save
    structure → inline the contrast choice, for example a precomputed dict of label
    ink per Imprint color or an inline expression in the leaf-label branch. Likely
    cause: def luminance(hex_color) above the placement loop.'
  - 'Suggestion: a lighter root fill (for example the tertiary text token) would let
    the root read as a container rather than the dominant mass of the light render.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the full 2400x2400 canvas, no edge strips
      Chrome: title 'circlepacking-basic · python · letsplot · anyplot.ai' in dark ink, centred, about 58% of the width, readable; no axes or grid
      Data: large smooth root circle in the soft ink gray #4A4A44; four folder circles Media #009E73, Games #C475FD, Code #4467A3, Documents #BD8233 with page-colored outlines; five leaves per folder in the folder hue, outlined; bold page-colored folder names on the root ring; leaf names Emulators, Library, Photos, Music, Videos, Work in dark text and Projects in light text on blue; small leaves unlabeled
      Legibility verdict: PASS

    Dark render (plot-dark.png):
