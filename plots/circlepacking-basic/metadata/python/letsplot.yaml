review:
  strengths:
  - Every circle sits fully inside its parent with padding and no sibling crossings,
    and leaf areas share one sqrt(value) scale across groups, so Videos (65 GB) reads
    as about 2.6 times Work (25 GB)
  - Group names are bold and placed on the root ring beside their circles, so they
    never cover the nested leaves; leaf names are regular weight, giving a clear two-level
    type hierarchy
  - Theme tokens thread through background, title, outlines and labels; Imprint group
    colors are identical in both renders
  - The layout recurses over a generic id/parent table, so the data block can be replaced
    by any hierarchy
  - letsplot HTML export keeps the chart interactive in the detail view
  weaknesses:
  - 'VQ-01 (both): leaf labels have low contrast against their fill: dark #1A1A17
    text on the #4467A3 blue leaves (Work, Personal, Archive) in light at about 3:1,
    and light #F0EFE8 text on the #C475FD lavender leaves (Libraries, Projects) in
    dark at about 2.5:1 → at least 4.5:1, choosing dark or light text per fill luminance.
    Likely cause: one INK color for the leaf geom_text layer.'
  - 'VQ-03 (both): the root circle shows visible straight facets along its about 1500
    px outline → a smooth outline (about 180-240 vertices for large circles). Likely
    cause: np.linspace(0, 2*np.pi, 60) in circle_rows for every circle regardless
    of radius.'
  - 'DQ-01 (both): the hierarchy has 13 nodes (root, 3 folders, 9 leaves), below the
    spec''s 20-200 nodes → at least 20 nodes, for example 4-5 folders with 4-5 subfolders
    each. Likely cause: the 12-row data block.'
  - 'CQ-01 (code): four functions (circle_rows, pack, layout, place) replace the flat
    imports-data-plot-save structure → inline the polygon and placement steps as loops
    at module level. Likely cause: helper-function decomposition of the layout.'
  - 'Suggestion: a slightly lighter root fill would make the root read as a container
    rather than the dominant mass of the chart.'
  image_description: |-
