review:
  strengths:
  - Leaf radius is sqrt(value), so leaf area is proportional to species count; every
    circle sits fully inside its parent and the root encloses all habitats with padding
  - 'Depth reads clearly in both themes: faint ink root disc, translucent habitat
    tints, near-opaque leaves of the same Imprint hue separated by page-colored outlines'
  - Labels are drawn only where the circle can hold them, switching between name+value
    and name only, so no text collides
  - Invisible hover layer with customdata and hovertemplate gives taxon, habitat and
    species count for every leaf in the HTML view
  - Theme tokens threaded through title, legend and outlines; data colors identical
    between the light and dark renders
  weaknesses:
  - 'VQ-01 (both): leaf labels are set at 8 px, below the 10 px smallest-text reference
    for plotly, and read small inside their circles → 10 px (+2 px), keeping the fit
    test so long names still drop out. Likely cause: LEAF_FONT = 8.'
  - 'VQ-01 (dark): leaf labels in #1A1A17 on the red Alpine (#AE3030) and blue Grassland
    (#4467A3) fills, darkened by opacity 0.9 over the near-black page, have weak contrast
    (''Beetles 44'', ''Bees 71'') → pick label ink per fill (light ink on red, blue
    and purple) or raise leaf opacity to 1. Likely cause: font color fixed to ''#1A1A17''
    and leaf opacity=0.9.'
  - 'SC-02 (both): the largest circles, the five habitats, carry no label (only the
    legend names them), and sizable leaves such as Butterflies (64) and Crustaceans
    (55) stay unlabeled because their names exceed the 8 px fit test → label each
    habitat circle (e.g. at its top edge inside the tint) and shorten or wrap long
    leaf names so circles of that size are named. Likely cause: annotations are only
    added for leaves; the fit test uses len(name) at one font size.'
  - 'CQ-01 (code): two helper functions, enclose() (lines 55-62) and pack() (lines
    65-101), break the Imports → Data → Plot → Save flow → inline the packing as a
    loop over levels. Likely cause: the packing algorithm was factored into functions.'
  - 'Suggestion: align the legend title ''Habitat'' with the entries'' baseline and
    tighten the swatch-to-label gaps.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, square 2400x2400 canvas
      Chrome: title 'circlepacking-basic · python · plotly · anyplot.ai' in dark ink, centered; legend box 'Habitat' below the packing with Wetland, Forest, Grassland, Coastal, Alpine; no axes or grid
      Data: faint grey root disc enclosing five translucent habitat circles (Wetland #009E73, Forest #C475FD, Grassland #4467A3, Coastal #BD8233, Alpine #AE3030) each holding 3-5 near-opaque leaf circles with thin page-colored outlines; larger leaves labeled in bold dark text with counts (Beetles 150, Birds 118, Birds 96, Fungi 88, Fish 83...); habitat circles unlabeled; small and long-named leaves unlabeled
      Legibility verdict: PASS (leaf labels small at 8 px; dark text on red/blue fills weaker)

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17
      Chrome: title and legend text in light ink, legend box on #242420 with light border; no dark-on-dark chrome
      Data: same Imprint fills as light; habitat tints darker over the dark page; leaf outlines now near-black; leaf labels stay #1A1A17 — readable on green, purple and ochre, low contrast on the red Alpine and blue Grassland leaves
      Legibility verdict: PASS (with the weak label contrast on red/blue leaves noted)
