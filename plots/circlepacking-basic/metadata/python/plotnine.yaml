review:
  strengths:
  - 'Depth levels follow the Imprint order (#009E73 root, #C475FD, #4467A3) with theme-adaptive
    outlines and chrome'
  - Labels at a comfortable size, bold, readable in both themes on the blue holdings
  weaknesses:
  - 'VQ-05 (both): the canvas is 3600x3600 instead of the canonical 2400x2400 square,
    and the title presses against the top edge → 2400x2400 with a top margin. Likely
    cause: figure_size=(12, 12) with dpi=300 in plot.save.'
  - 'VQ-02 (both): the Bonds and Real Estate labels sit on top of the Corporate and
    Commercial circles, and overlapping holdings (Tech/Healthcare/Finance, Corporate/Government,
    Commercial/Residential) hide each other''s outlines → each parent label clear
    of its children and holdings that do not overlap. Likely cause: hand-typed label_y
    = cy + r*0.60 and fixed child offsets.'
  - 'SC-02 (both): sibling circles overlap and Stocks crosses into Bonds, against
    C2 (no circle crossing another or its parent''s edge) → a real packing that places
    siblings tangent without overlap. Likely cause: hand-placed coordinates such as
    tech_x = stocks_x - 0.10.'
  - 'SC-02, SC-03 (both): leaf areas are not comparable across parents (Corporate
    150k is drawn larger relative to Tech 180k than their values allow) because each
    parent scales its children by its own factor, against C1 → one sqrt(value) scale
    for all leaves. Likely cause: stock_scale / bond_scale / realestate_scale per
    parent.'
  - 'SC-04 (both): the title ''circlepacking-basic · plotnine · anyplot.ai'' lacks
    the language segment → ''circlepacking-basic · python · plotnine · anyplot.ai''.
    Likely cause: the labs(title=...) string.'
  - 'VQ-01 (dark): near-white bold labels on the #C475FD asset-class fill (Stocks,
    Bonds, Real Estate) have weak contrast, about 2.8:1 → a text color reaching at
    least 4.5:1 on that fill. Likely cause: one color=INK for every geom_text label.'
  - 'DQ-01 (code): the hierarchy has 11 nodes, below the spec''s 20-200 → at least
    20 nodes. Likely cause: the nodes list.'
