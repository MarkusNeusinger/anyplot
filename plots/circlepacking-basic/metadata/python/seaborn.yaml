review:
  strengths:
  - 'True nested circle packing: front-chain placement plus a minimax enclosing circle,
    with every leaf inside its continent and every continent inside the root'
  - Leaf radius = sqrt(population), so areas compare correctly (China vs India nearly
    equal, Asia dominating)
  - Continent names as bordered chips on each group ring, a clear second label tier,
    readable on both backgrounds
  - Leaf text color picked by contrast against each fill, so white on red/blue and
    near-black on green/ochre/purple
  - Adaptable column constants and a single tidy df drive the whole layout
  weaknesses:
  - 'SC-02 (both): leaf labels are dropped by name length, not circle size: Bangladesh
    (172 M), Germany (84 M) and Colombia (52 M) stay blank while the smaller Japan
    (124 M), Italy (59 M) and Peru (34 M) are labeled, against the spec''s ''labels
    for the larger circles'' → label leaves in order of radius, wrapping or abbreviating
    long names (e.g. a two-line ''United\nKingdom'') so every leaf larger than the
    smallest labeled one gets its name. Likely cause: line 188 divides the font size
    by len(label), pushing long names below LABEL_MIN_PT = 5.5.'
  - 'VQ-01 (both): ''United States'' and ''Ethiopia'' render at about 5.5-6 pt, below
    the 8 pt tick-label reference, and read small beside the 8.5 pt ''Mexico'' and
    ''Nigeria'' → at least 7 pt (+1.5 pt) by wrapping long names onto two lines. Likely
    cause: the same length-based size formula at line 188.'
  - 'VQ-02 (both): the OCEANIA chip overlaps Asia''s ring and fill, and the SOUTH
    AMERICA chip covers the top of its smallest leaf (Chile) → keep each group chip
    clear of other circles, e.g. place it inside the group''s own circle near its
    top edge. Likely cause: every chip is anchored at (x, y + r) on the ring regardless
    of neighbours (lines 195-207).'
  - 'CQ-01 (code): five helper functions (pack, enclose, build, place, text_on); the
    recursive build/pack are needed, but text_on (lines 159-166) and place (lines
    143-149) are single-use helpers → inline the contrast check into the leaf loop
    and place into a loop over layout. Likely cause: one helper per step.'
  - 'Suggestion: leaf label size varies with name length (Mexico larger than United
    States); one size per tier would read calmer.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1; the root circle is filled with the elevated #FFFDF6 and ringed in INK_SOFT.
      Chrome: title 'circlepacking-basic · python · seaborn · anyplot.ai' in dark ink at the top, ~75% of width; no axes. Continent chips (ASIA, AFRICA, EUROPE, NORTH AMERICA, SOUTH AMERICA, OCEANIA) in bold dark text on page-colored boxes with colored borders sit on each group's ring.
      Data: six continent circles - Asia #009E73 (largest, holding India and China as two big near-equal circles), Africa #C475FD, Europe #4467A3, North America #BD8233, South America #AE3030, Oceania #2ABCCD (tiny) - each a translucent fill with a solid ring; solid leaf circles with page-colored outlines. Labels: India, China, Pakistan, Japan, Indonesia, Nigeria, Egypt, Ethiopia, United States, Mexico, Brazil, Peru, Russia, Italy, France; Bangladesh, Germany, Colombia and others unlabeled. 'United States' and 'Ethiopia' are visibly smaller text. The OCEANIA chip overlaps Asia's ring.
      Legibility verdict: PASS (small 6 pt leaf labels noted)

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17; root filled #242420 with a light-gray ring.
      Chrome: title in light ink, chips with light text on dark boxes; no dark-on-dark text.
      Data: identical leaf and ring colors to the light render; group fills are the same hues at low alpha over the dark surface; leaf outlines flip to the dark page color. Leaf labels keep their contrast-chosen colors (near-black on green/ochre/purple, white on red/blue), all readable.
      Legibility verdict: PASS
