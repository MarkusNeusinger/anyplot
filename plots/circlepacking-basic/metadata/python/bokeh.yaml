review:
  strengths:
  - Leaf radius is computed from sqrt(value), so leaf areas are proportional to the
    holdings, and every circle sits inside its parent with even padding
  - 'Color by depth in Imprint order (root #009E73, asset classes violet, holdings
    blue) with identical data colors in both themes and theme-correct ink on the labels'
  - Asset-class labels are placed at the clearest spot near the parent's rim, so none
    sits on the circles nested inside it
  - 'Idiomatic bokeh: ColumnDataSource, LabelSet, Legend from LegendItems, and a HoverTool
    that shows name, level and value of every circle in the HTML'
  - 'Data block in the adaptable layout: a tidy id/parent/value/label table and column
    constants drive the whole plot'
  weaknesses:
  - 'VQ-02 (both): the ''Fixed Income'' label''s leading F sits on the Intl Bonds
    circle outline and ''Real Assets'' ends right against the Commodities outline
    → each asset-class label clear of every child circle by at least about 10 px.
    Likely cause: the free-spot search scores only the label''s centre point at 0.68
    r and ignores the half-width of the text.'
  - 'CQ-01 (code): a one-line helper `def alpha_for(depth)` (lines 245-246) adds a
    function where an inline expression does → inline it in the alpha column, e.g.
    `[0.6, 0.65, 0.75][min(n[''depth''], 2)]`. Likely cause: the alpha rule extracted
    into a helper.'
  - 'Suggestion: a slightly larger legend glyph (the circles render near 15 px beside
    24pt labels) would balance the legend.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 on the full 2400x2400 square canvas.
      Chrome: centred bold title 'circlepacking-basic · python · bokeh · anyplot.ai' in near-black ink; legend top right on an elevated off-white box with INK_SOFT border (Portfolio, Asset Class, Investment). No axes or grid. All chrome readable.
      Data: green #009E73 root circle (Portfolio) enclosing four violet asset-class circles (Equities, Fixed Income, Real Assets, Alternatives), each holding blue #4467A3 holding circles (US Large Cap largest, Crypto smallest). Siblings packed tangent, all inside their parents with padding. Bold dark labels on every holding and on each asset class in free space near its rim; the 'Fixed Income' F touches the Intl Bonds outline.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title in light ink, legend on the dark elevated box with light-grey labels, thin INK_SOFT plot outline; no dark-on-dark text.
      Data: identical green, violet and blue fills and the same layout as the light render (green reads darker by alpha over the dark page); labels flip to light ink and read well on the fills.
      Legibility verdict: PASS
