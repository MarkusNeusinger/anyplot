review:
  strengths:
  - Correct, spec-accurate sequence logo built from scratch using SVG glyphs stretched
    via textLength + a vertical scale transform, exactly matching the 'stretched glyphs,
    not plain text' requirement.
  - Real Shannon-entropy information-content calculation (max 2 bits for DNA), with
    letters correctly stacked in ascending-frequency order so the most frequent letter
    ends up on top.
  - Idiomatic, sophisticated use of MUI X's useXScale/useYScale hooks to synchronize
    custom SVG marks with the chart's own axes -- a genuinely distinctive library
    feature, not a generic bar/line chart with labels bolted on.
  - Semantically appropriate nucleotide color mapping (A=green, C=blue, G=ochre, T=red)
    drawn from the Imprint palette tokens, matching the standard bioinformatics color
    convention while staying within the Imprint pool.
  - Clean theme-adaptive chrome -- both renders are fully readable, backgrounds are
    theme-correct, and data colors are identical across light and dark.
  - Realistic, well-motivated synthetic ChIP-seq/SELEX-style motif data with a clearly
    conserved core (positions 3-7) and weakly conserved flanks, giving good dynamic
    range in stack heights.
  weaknesses:
  - Missing `skipAnimation` on `<ChartContainer>` -- the muix library rules mandate
    it on every chart component as a hard, no-deviation belt-and-suspenders measure
    alongside the harness's reduced-motion emulation. Currently low-risk because `series=[]`
    leaves nothing to animate, but add it for compliance and future-proofing.
  - Glyphs are large, solid color fills with no outline/stroke; ochre (G) sits below
    the 3:1 contrast floor on the light cream background per the style guide. Not
    a failure at this glyph size, but consider a thin ink-color stroke (style guide's
    'Optional outline pattern') if this technique is reused at smaller sizes (e.g.
    a denser protein-alphabet logo).
  - Vertically-stretched system-font glyphs (scale(1, 1/0.72) on Arial/Liberation
    Sans) produce slightly warped letterforms for some letters (e.g. C, G) compared
    to the bespoke seqlogo fonts used by tools like WebLogo/ggseqlogo -- acceptable
    and clearly identifiable, but not pixel-perfect typography.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 -- not pure white, not dark.
      Chrome: Title "sequence-logo-basic · javascript · muix · anyplot.ai" centered at top in dark ink, clearly legible. X-axis labeled "Position" with tick labels 1-10 below the chart. Y-axis labeled "Information content (bits)" (rotated) with tick labels 0.0-2.0 in steps of 0.2, all in dark/soft-dark ink. Subtle horizontal gridlines only, faint and non-competing with data.
      Data: A ten-position sequence logo. Positions 3-7 form a tall, clearly conserved core (T, A, G, C, G reaching roughly 1.0-1.3 bits), flanked by shorter, more mixed stacks at positions 2 and 8, and near-invisible stacks at positions 1, 9, and 10 (near-zero information content, consistent with near-uniform frequencies in the source data). Each stack is composed of vertically stretched, color-coded letters: A=brand green (#009E73), C=blue, G=ochre, T=matte red -- these are the Imprint palette tokens applied via a semantic nucleotide-color convention. All data elements are clearly distinguishable from the light background.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 -- not pure black, not light.
      Chrome: Same title, axis labels, and tick labels as the light render, but rendered in light ink/off-white -- fully legible against the dark background, no dark-on-dark text anywhere. Gridlines remain subtle and visible.
      Data: Identical stack heights, letter identities, and letter colors as the light render (A=green, C=blue, G=ochre, T=red) -- confirms only chrome (background, text, grid) flipped between themes while the four categorical data colors stayed constant, as required.
      Legibility verdict: PASS
