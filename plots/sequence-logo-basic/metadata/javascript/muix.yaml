review:
  strengths:
  - 'True scaled glyphs: textLength + lengthAdjust stretch each letter to its band
    width, and a cap-height-corrected vertical scale stretches it to its bit height,
    so letter height encodes the value'
  - Information content computed from the frequencies (log2(alphabet) - Shannon entropy),
    with the alphabet size derived from the data rather than hard-coded
  - 'Idiomatic MUI X v9 composition: ChartsContainer with a band x axis and the useXScale/useYScale
    hooks place the custom glyph layer in the library''s own coordinate system, so
    the grid and axes line up exactly'
  - Standard DNA colour scheme mapped to Imprint slots (A green, C blue, G ochre,
    T red), identical in both themes, with theme-token chrome readable on both surfaces
  weaknesses:
  - 'CQ-05 (code): ChartsContainer is rendered without the skipAnimation prop that
    the muix library prompt requires on every chart component → add skipAnimation
    to <ChartsContainer>. Likely cause: the prop was left out because series is empty.'
  - 'Suggestion: a slightly larger title (about 26 px) would give the header more
    presence against the tall glyphs.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the full canvas, no white panel.
      Chrome: centred title "sequence-logo-basic · javascript · muix · anyplot.ai" in dark ink; y axis "Information content (bits)" with ticks 0.0-2.0 in steps of 0.2; x axis "Position" with band ticks 1-10; subtle horizontal grid lines. All text is dark on light and readable.
      Data: ten letter stacks. Positions 1, 9 and 10 are nearly empty (≈0 bits); position 2 is topped by a blue C (~0.33 bits total); the conserved core reads T (red, ~1.11), A (green, ~1.32), G (ochre, ~1.25), C (blue, ~1.34), G (~1.12), then A (~0.63) at position 8. Minor letters sit stacked below each dominant one in ascending frequency. Glyphs are stretched to fill their segments. A uses #009E73 as the first colour.
