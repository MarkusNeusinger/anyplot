review:
  strengths:
  - 'Letters are real scaled glyphs: an SVG <text> per segment with textLength + lengthAdjust="spacingAndGlyphs"
    fills the column width and a vertical scale stretches each glyph to its bit height,
    as the Notes ask'
  - Stacks are built by construction from frequency and Shannon information content
    (MAX_BITS = log2 of the alphabet size), ordered by frequency with the most frequent
    letter on top, on a 0–2 bit axis from zero
  - 'Idiomatic MUI X v9 composition: ChartsContainer + ChartsGrid + ChartsXAxis/ChartsYAxis
    with a custom mark layer driven by the useXScale/useYScale hooks, so the band
    axis positions the stacks'
  - 'Standard DNA colors from the Imprint palette (A #009E73, C #4467A3, G #BD8233,
    T #AE3030), identical in both themes; chrome threaded through ink/inkSoft/grid
    tokens and readable on both backgrounds'
  - 'Adaptable data block: positions, alphabet and bit maximum come from the records,
    and unknown letters (RNA U, amino acids) fall back to unused palette slots'
  weaknesses:
  - 'SC-03 (both): the glyphs are drawn about 4 % shorter than their bit height, so
    every stack top sits below its information content — position 3 T tops out at
    about 1.11 bits vs the computed 1.15 (−0.04), position 4 A at about 1.32 vs 1.37
    (−0.05), position 8 A at about 0.63 vs 0.65 (−0.02) → glyph tops at the stack''s
    information content (±0.01 bits). Likely cause: CAP_HEIGHT_RATIO = 0.72 overestimates
    the rendered font''s cap height, so scale(1, 1/0.72) under-stretches; measure
    the glyph with getBBox() or derive the ratio from the actual font metrics.'
  - 'Suggestion: the mandated title at 22 px fills only about 31 % of the width; a
    slightly larger title would give it more presence.'
  - 'Suggestion: the useXScale()/useYScale() `as any` casts are unnecessary in an
    esbuild-only bundle and could be dropped.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole 3200x1800 canvas.
      Chrome: centered title "sequence-logo-basic · javascript · muix · anyplot.ai" in dark ink; y axis "Information content (bits)" 0.0–2.0 in 0.2 steps, x axis "Position" 1–10 as band ticks; subtle horizontal grid only; all text dark on light and readable.
      Data: ten letter stacks of stretched bold glyphs — A green #009E73, C blue #4467A3, G orange #BD8233, T red #AE3030. Positions 3–8 spell the conserved core T A G C G A (tallest ~1.3 bits at positions 4 and 6), position 2 a short C-topped stack, positions 1, 9, 10 nearly empty (uniform). Smaller letters stack beneath the dominant one, most frequent on top.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, axis titles and tick labels in light ink, axis lines and grid lighter grey; no dark-on-dark text.
      Data: glyph colors and geometry identical to the light render; brand green A clearly visible.
      Legibility verdict: PASS
