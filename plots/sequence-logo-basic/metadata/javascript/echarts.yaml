review:
  strengths:
  - Correctly implements true scaled-glyph rendering via a custom ECharts renderItem
    (stretches each letter shape to fill its exact stack cell using approximated Helvetica-Bold
    glyph metrics), not plain text at fixed size — the hardest and most distinctive
    requirement of this spec.
  - Correct information-content math (bits = 2 - Shannon entropy per position) and
    frequency-ascending stack order so the most frequent letter lands on top, matching
    the spec exactly.
  - Semantic DNA color convention (A=green, C=blue, G=ochre, T=matte red) mapped cleanly
    onto Imprint palette members, with color + letter-shape redundant encoding that
    is inherently colorblind-safe.
  - Realistic, recognizable biological motif (CACGTG E-box core flanked by degenerate
    positions) — the conserved core visually pops without needing any extra annotation,
    which is good data storytelling.
  - Idiomatic, correct use of ECharts custom series (api.coord/api.size for coordinate-to-pixel
    mapping) — there is no built-in chart type for sequence logos, so custom rendering
    is the right and only approach.
  - Theme-adaptive chrome correctly threaded through title/axis/grid tokens; data
    colors are identical between light and dark renders, only chrome flips.
  weaknesses:
  - At very low information-content positions (1, 2, 3, 10, 11, 12), the four letter
    glyphs compress into a smeared, largely illegible horizontal band as targetHeight
    approaches zero. Some smear is expected for near-uniform base distributions, but
    the current 1px cutoff (targetHeight < 1 || targetWidth < 1) is too permissive
    — raising the visibility floor (e.g. skip rendering the smallest 1-2 letters per
    stack, or omit letters entirely below ~6-8px rendered height and leave a thin
    color-coded sliver instead) would keep these positions honest without the muddy
    overlap.
  - No stroke/outline on the ochre (G) or matte-red (T) glyphs at the tiniest stack
    heights, which slightly reduces contrast right where legibility is already stressed
    by the small scale — optional per the style guide's outline-pattern judgment call,
    but would help specifically in the smeared low-information clusters.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "sequence-logo-basic · javascript · echarts · anyplot.ai" centered in bold dark ink, clearly visible. X-axis "Position" (1-12) and y-axis "Information content (bits)" (0-2, gridlines at 0.5 steps) both in dark/soft-dark ink, fully readable. Subtle horizontal gridlines, not competing with data. Bottom axis line only, no boxed frame.
      Data: Stacked, scaled letter glyphs at each position, colored by semantic DNA convention — A=green (#009E73), C=blue (#4467A3), G=ochre (#BD8233), T=matte red (#AE3030). Positions 4-9 show a tall, clearly dominant CACGTG core (E-box motif); positions 1-3 and 10-12 show short/near-invisible stacks reflecting low information content, with letters at the very smallest heights compressing into a thin colored smear. All large-stack letters are crisp, well-stretched to fill their cell, and easily distinguishable by both color and shape.
      Legibility verdict: PASS (chrome text and the dominant motif letters are fully legible; only the near-zero-bit position letters are hard to read individually, which is expected/inherent to the visualization type).

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title, now in light ink, clearly visible against the dark background. Axis labels and tick labels in light/soft-light tones, fully readable. Gridlines subtle but present.
      Data: Identical letter colors and stacking to the light render — A=green, C=blue, G=ochre, T=matte red — confirming only chrome flipped between themes. Brand green (#009E73) reads clearly on the dark surface (position 5 "A"). Same CACGTG core dominance and same near-invisible flanking positions.
      Legibility verdict: PASS. No dark-on-dark failures — all title/axis/tick text is clearly visible against the near-black background.
