review:
  strengths:
  - 'Creative solution to Chart.js''s lack of a native sequence-logo type: invisible
    stacked bars supply the layout math while a custom afterDatasetsDraw plugin scales
    and draws the actual letter glyphs into each segment''s rectangle.'
  - Correct, well-reasoned nucleotide color mapping (A=green, C=blue, G=ochre, T=red)
    using the Imprint palette's semantic-exception rule for a widely shared domain
    convention, while still landing A on brand green.
  - Accurate Shannon entropy computation for information content, with stack order
    derived by ascending frequency per position so the most frequent letter sits on
    top, exactly per spec.
  - 'Realistic domain data: the conserved core spells the canonical E-box motif CACGTG,
    every position''s frequencies sum to 1.0, and flanking positions are plausibly
    near-degenerate.'
  - 'Both renders are theme-correct: warm off-white/near-black backgrounds, readable
    chrome, and identical data colors between light and dark.'
  weaknesses:
  - Flanking positions (1, 2, 3, 11, 12) render as near-invisible hairlines because
    their computed information content is ~0.01-0.05 bits; biologically accurate,
    but it leaves roughly 40% of the x-axis visually empty. A slightly less uniform
    flanking distribution would keep a faint but perceptible stack visible instead
    of disappearing entirely.
  - Design polish is functional but plain beyond the glyphs themselves — no subtle
    refinement (e.g. tighter inter-letter gap, faint outline) to lift the stacked-letter
    rendering further.
  - No small caption or legend maps letter to color for readers unfamiliar with nucleotide
    conventions; the letters double as their own legend, but an explicit key would
    make the chart accessible to non-specialists.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "sequence-logo-basic · javascript · chartjs · anyplot.ai" in bold dark ink, clearly visible. X-axis title "Position" and y-axis title "Information content (bits)" both dark and legible. Tick labels (1-12 on x, 0-2.0 in 0.2 steps on y) in soft dark gray, readable. Subtle horizontal gridlines only.
      Data: Twelve x-axis positions, each a vertical stack of colored letter glyphs (A=green #009E73, C=blue, G=ochre, T=red) whose height is scaled by per-position information content in bits. The conserved core at positions 5-10 spells "CACGTG" (the canonical E-box motif) with tall, prominent letters; flanking positions 1-3 and 11-12 are compressed to near-invisible hairlines reflecting their near-zero information content. Letters are stretched glyphs, not plain text, matching the spec requirement.
      Legibility verdict: PASS — all title/axis/tick text is clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Title, axis titles, and tick labels all rendered in light/white ink, clearly visible against the dark background. Gridlines are subtle but present.
      Data: Identical letter colors and identical stack heights/order to the light render — only chrome (background, text, grid) flipped, confirming palette compliance. Same CACGTG core motif and same near-empty flanking positions.
      Legibility verdict: PASS — no dark-on-dark failures observed; all text and letter glyphs read clearly against the near-black background.
