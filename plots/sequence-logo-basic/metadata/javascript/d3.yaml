review:
  strengths:
  - Correct entropy/information-content math (Shannon entropy vs. log2(4)=2-bit DNA
    ceiling) drives the stack heights, matching the spec's bits-based scaling requirement.
  - Letters are stacked in true frequency order (most frequent on top) via a stable
    ascending sort, and each letter is a real scaled glyph (getBBox + scale transform)
    stretched to fill its allocated cell width and height, not plain text.
  - Nucleotide color coding follows the standard convention (A=green, C=blue, G=ochre,
    T=red) mapped onto the closest Imprint hues — a well-justified domain semantic
    exception, with data colors identical between light and dark renders.
  - 'Clean, idiomatic D3: scaleBand/scaleLinear + axisBottom/axisLeft + data-join
    pattern, subtle y-axis-only gridlines, L-shaped spines, generous margins, no overflow
    or clipping in either theme.'
  - Both renders are correctly theme-adaptive (background, ink, grid) while the data-color
    palette stays fixed, and the mandated title format is exact.
  weaknesses:
  - Near-uniform positions (4 and 10, ~0.01-0.02 bits total) collapse to hairline-thin
    colored slivers at the baseline — scientifically correct, but at mobile widths
    (~400px) these are effectively invisible, which could read as 'missing data' rather
    than 'low conservation' to an unfamiliar viewer. Consider a very thin minimum-height
    floor or a subtle baseline tick to signal presence without misrepresenting the
    value.
  - Typography is generic 'sans-serif' throughout (title, axis labels, ticks, and
    the letter glyphs) with no distinctive typeface choice — functional but not particularly
    refined design-wise.
  - The y-axis fixed ceiling of 2.0 bits (correct per the DNA log2(4) convention)
    leaves roughly 40% of vertical space empty above the tallest stack (~1.2 bits);
    acceptable since it's the domain-standard comparability convention, but worth
    noting as an unavoidable trade-off rather than a deliberate storytelling choice.
  - infoContent() is a small standalone helper and the letter-stacking uses a map/sort/entries
    chain rather than a single flat top-to-bottom script — still simple and readable,
    but a slight step away from the purest KISS top-level style.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "sequence-logo-basic · javascript · d3 · anyplot.ai" in bold dark ink at top-center; y-axis "Information content (bits)" (rotated) and x-axis "Position" labels in dark ink; tick labels (0.0–2.0 in 0.5 steps on y, 1–10 on x) in dark ink; subtle horizontal gridlines at each y tick; L-shaped left+bottom axis lines visible.
      Data: Ten position columns of stacked, scaled letter glyphs. First (top, largest) letter per position colored by nucleotide — A=green (#009E73), C=blue (#4467A3), G=ochre (#BD8233), T=red (#AE3030) — with smaller letters stacked below in ascending-frequency order. Tallest stacks at positions 3 (T, ~1.0 bit), 6 (A, ~1.2 bits); near-flat/invisible slivers at positions 4 and 10 (low information content, as expected for near-uniform frequencies).
      Legibility verdict: PASS — all title/axis/tick text is clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title, axis labels, and tick labels now rendered in light ink (theme-flipped), fully legible; gridlines remain subtle; axis lines visible in light ink.
      Data: Identical letter colors and stack geometry to the light render (green/blue/ochre/red) — confirms only chrome flipped, not data colors.
      Legibility verdict: PASS — no dark-on-dark failures observed; all text and letter glyphs are clearly distinguishable from the near-black background.
