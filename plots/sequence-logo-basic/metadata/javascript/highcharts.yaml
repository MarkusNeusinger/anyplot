review:
  strengths:
  - 'Creative, correct solution to a chart type Highcharts has no native series for:
    custom SVG glyph rendering via chart.renderer, scaled to fill each letter''s allocated
    position/height box'
  - 'Full spec feature coverage: frequency-ordered stacking, information-content scaling,
    standard DNA color convention mapped as a deliberate semantic exception onto the
    Imprint palette, and a deliberately included zero-information position'
  - Theme-adaptive chrome and identical cross-theme data colors correctly implemented;
    both renders pass the readability check
  - Letter identity is redundantly encoded by shape AND color, aiding CVD accessibility
  weaknesses:
  - Very-low-height letters (frequency x information-content < ~0.05 bits, e.g. the
    T at position 1 and minor bases at positions 9-10) render as near-flat colored
    bars rather than recognizable letterforms - consider a minimum glyph height floor
  - Overall aesthetic is fairly minimal - no additional design flourish beyond the
    correct baseline styling
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white, consistent with #FAF8F1 - not pure white
      Chrome: title "sequence-logo-basic · javascript · highcharts · anyplot.ai" in dark bold text at top; y-axis "Information content (bits)" 0-2 with subtle gridlines at 0.5 intervals; x-axis "Position" labeled 1-10 - all clearly readable against the light background
      Data: ten letter-stacks as scaled glyphs; TATA-box-like pattern visible at positions 2-6 (T-A-T-A-A-A dominant letters); position 8 empty (zero information content); first series color is brand green #009E73 for A
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black, consistent with #1A1A17 - not pure black
      Chrome: same title/axis labels rendered in light gray/off-white, clearly legible - no dark-on-dark failures observed
      Data: letter-glyph colors (green A, blue C, ochre G, matte red T) are pixel-identical to the light render - only chrome flipped
      Legibility verdict: PASS
