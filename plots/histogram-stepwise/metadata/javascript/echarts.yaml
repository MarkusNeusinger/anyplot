review:
  strengths:
  - 'Correct step-histogram semantics: outline-only line (showSymbol: false, no areaStyle)
    closed to zero at both ends, exactly matching the spec''s ''no fill, only outline''
    requirement.'
  - 'Clean, refined chrome: horizontal-only split lines, no axis ticks, no y-axis
    line — minimal-chrome styling above library defaults.'
  - 'Palette and theme compliance: first (only) series is #009E73 in both renders;
    backgrounds are #FAF8F1 (light) / #1A1A17 (dark); all text uses theme-correct
    ink/inkSoft tokens with no dark-on-dark or light-on-light failures.'
  - All font sizes explicitly set (title 22, axis names 16, tick labels 14) and legible
    in both themes; no clipping at any canvas edge (checked all four borders on the
    light render).
  - Deterministic, reproducible data generation via a fixed-seed LCG (seed=42) with
    a realistic, neutral scenario (n=1500 simulated reaction times).
  - Title format matches the mandated '{spec-id} · {language} · {library} · anyplot.ai'
    convention exactly.
  weaknesses:
  - 'Step outline is built by manually pushing paired left/right-edge points into
    the data array instead of using ECharts'' native step-line rendering (series.step:
    ''end''/''middle''). The manual approach works but isn''t idiomatic ECharts and
    doesn''t showcase a library-distinctive feature — consider `series: [{ type: ''line'',
    step: ''end'', data: binLeftEdges.map((x,i)=>[x, counts[i]]) }]` plus the two
    zero-closing points, which is simpler and leverages the library''s built-in capability.'
  - 'The reaction-time distribution is generated as a symmetric normal (Box-Muller),
    but real reaction-time data is typically right-skewed (ex-Gaussian: a fast, sharp
    rise and a long right tail toward slow outlier responses) rather than symmetric
    — a minor realism gap for DQ-03.'
  - The binned counts show fairly large bin-to-bin swings near the peak (e.g. 157
    → 130 → 135 → 125 across adjacent ~13ms bins) that read as a bit noisy/jagged
    for a unimodal distribution with n=1500; increasing bin width slightly or the
    sample size would produce a visually smoother, more recognizable bell shape.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "histogram-stepwise · javascript · echarts · anyplot.ai" is centered near the top in dark ink, fully visible with no clipping. X-axis title "Reaction Time (ms)" is centered below the tick labels; y-axis title "Count" is rotated and fully visible along the left edge. Tick labels (130–520 on x, 0–180 on y) are all legible in a secondary gray-ink tone. Only horizontal grid lines are drawn (subtle, light gray); no vertical grid lines, no axis ticks, no y-axis line — clean minimal-chrome treatment.
      Data: Single step-line series in the brand green (#009E73), 3px stroke, no fill, no markers — reads clearly as a step/outline histogram of a roughly bell-shaped, right-of-center-peaked distribution (peak near 300–320ms) with some bin-to-bin noise near the top of the curve.
      Legibility verdict: PASS — all text is clearly readable against the light background, no dark-on-light or contrast issues, no edge clipping found on any of the four canvas borders (verified via pixel crops of top/left/right/bottom margins).

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
