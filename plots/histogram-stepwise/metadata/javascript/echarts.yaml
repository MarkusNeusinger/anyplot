      Data: The step-line series is the identical #009E73 green as the light render — same shape, same stroke width, same position — confirming data colors do not shift between themes; only chrome (background + text) flips as expected.
      Legibility verdict: PASS — all text readable, brand green reads well against the dark surface, no theme-adaptation defects found.
