review:
  strengths:
  - 'Fixed: step outline now uses ECharts'' native `step: "end"` line option instead
    of manually pushing paired left/right-edge points — idiomatic, simpler code, and
    a library-distinctive rendering path.'
  - 'Fixed: reaction-time data is now generated as an ex-Gaussian (normal + exponential
    tail) instead of a symmetric normal, producing the correct sharp-rise/long-right-tail
    shape real reaction-time distributions have.'
  - 'Fixed: a `markLine` annotation now marks the distribution''s peak ("Peak: 249
    ms"), giving the chart a clear focal point and visual hierarchy instead of leaving
    the viewer to find the mode unaided.'
  - 'Correct step-histogram semantics preserved: outline-only line (`showSymbol: false`,
    no `areaStyle`), closed to zero at both ends, exactly matching the spec''s "no
    fill, only outline" requirement.'
  - 'Clean, refined chrome: horizontal-only split lines, no axis ticks, no y-axis
    line — minimal-chrome styling above library defaults.'
  - 'Palette and theme compliance: the single series is `#009E73` in both renders;
    backgrounds are `#FAF8F1`/`#1A1A17`; all text uses theme-correct tokens with no
    dark-on-dark or light-on-light failures, and no edge clipping.'
  - Deterministic, reproducible data generation via a fixed-seed LCG (seed=42), n=1500,
    realistic and neutral scenario.
  - Title format matches the mandated `{spec-id} · {language} · {library} · anyplot.ai`
    convention exactly.
  weaknesses:
  - Overall aesthetic is still a single default-weight green line with one annotation
    — polished and correct, but not yet an exceptional, highly art-directed look (DE-01
    headroom).
  - Only one distinctive ECharts feature (markLine) is leveraged; a second touch (e.g.
    a subtle low-alpha area fill strictly secondary to the stroke, or a second markLine/markArea
    for the mean or a percentile band) would further raise Library Mastery and Data
    Storytelling.
  - The step still shows a fairly sharp single-bin drop right after the peak (~215
    to ~130 count) — plausible for an ex-Gaussian tail, but slightly more bins or
    a touch more smoothing would soften the transition and read less abruptly.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "histogram-stepwise · javascript · echarts · anyplot.ai" centered near the top in dark ink, fully visible with no clipping. X-axis title "Reaction Time (ms)" and rotated y-axis title "Count" are both legible in dark ink. Tick labels (160-620 on x, 0-250 on y) are legible in secondary gray. Only horizontal grid lines are drawn; no axis ticks, no y-axis line — clean minimal-chrome treatment. A dashed vertical markLine with rotated label "Peak: 249 ms" sits just below the title, fully within the canvas (verified via pixel crop — no clipping at the top edge).
      Data: Single green (#009E73) step-line, ~3px stroke, no fill, no markers, tracing a right-skewed (ex-Gaussian) distribution: sharp rise to a peak near 220-250 ms then a long tail out past 600 ms.
