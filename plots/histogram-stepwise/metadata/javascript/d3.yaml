review:
  strengths:
  - 'Faithful step-histogram construction: no fill, horizontal bin segments plus vertical
    connectors, dropping to zero at both ends — matches the spec''s ''outline only''
    requirement precisely.'
  - Theme-adaptive chrome is threaded correctly through every non-data element (axes,
    grid, legend, title) sourced from ANYPLOT_TOKENS; both renders are fully legible.
  - Canonical Imprint palette order used correctly (brand green then lavender), identical
    data colors between light and dark.
  - Deterministic, seeded data generation (LCG + Irwin-Hall normal approximation)
    with no external RNG dependency.
  - Realistic use case (bus vs. train commute times) that directly demonstrates the
    spec's 'overlay distributions for comparison' application.
  weaknesses:
  - Visual hierarchy is fairly flat — both step outlines carry equal visual weight;
    no annotation or emphasis calls out the comparison story (e.g. train times cluster
    tighter/faster than bus times).
  - Step outline is built by manually pushing (x0,count)/(x1,count) point pairs into
    d3.line(); using d3's built-in curveStepAfter/curveStepBefore interpolator would
    be more idiomatic and reduce custom geometry code.
  - Large unused whitespace between the x-axis end and the legend column on the right
    side of the canvas — legend/margins could be tightened for a more composed layout.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1), consistent with the spec — not pure white.
      Chrome: Title "Commute Times by Transit Mode · histogram-stepwise · javascript · d3 · anyplot.ai" is bold dark text, clearly legible. Axis labels "Commute Time (minutes)" and "Number of Commuters" are dark, readable, and balanced in size. Tick labels on both axes are a softer dark gray, legible. Subtle horizontal (y-axis only) gridlines are visible but do not compete with the data. Legend (top right, "Bus" / "Train") uses dark text with colored line swatches, no box frame, clearly readable.
      Data: Two step-outline (unfilled) histograms overlap — Bus in brand green (#009E73), Train in lavender/purple (palette position 2). Each series is a clean horizontal-then-vertical step line, closing to zero at both ends, with no fill. Colors are clearly distinguishable from the light background and from each other.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17), consistent with the spec — not pure black.
      Chrome: Title, axis labels, and tick labels have all flipped to light/off-white tones, clearly legible against the dark background. No dark-on-dark text anywhere. Gridlines remain subtle or line white/light rgba lines, visible but not dominant. Legend text is light and readable, swatches unchanged.
      Data: Same two step-outline series in the identical brand green and lavender hex values as the light render — confirms data colors are constant between themes, only chrome inverted. Both curves remain crisp and distinguishable against the dark surface.
      Legibility verdict: PASS
