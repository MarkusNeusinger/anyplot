review:
  strengths:
  - 'Correctly builds the step-histogram outline (fill: none) with a drop-to-zero
    segment at both ends, matching the matplotlib histtype=''step'' convention the
    spec describes.'
  - Uses shared bin thresholds across both series so the Bus and Train step outlines
    are directly comparable — a thoughtful touch that fulfills the spec's 'overlaying
    multiple distributions' application.
  - Theme-adaptive chrome is threaded correctly through every element (axis text,
    ticks, grid, legend, title) via window.ANYPLOT_TOKENS; both light and dark renders
    are fully legible.
  - 'Palette compliance is correct: Bus uses Imprint #009E73 (position 1), Train uses
    #C475FD (position 2), identical across both themes.'
  - Deterministic LCG + Irwin-Hall normal approximation gives fully reproducible synthetic
    data without relying on a seeded RNG in the browser.
  weaknesses:
  - 'Typography hierarchy is inverted: the title and the axis labels both use 18px
    (title only distinguished by font-weight 600). Per the style guide''s JS sizing
    defaults, the title should read noticeably larger (~22px) than axis labels (~14px)
    so it reads as ''the first thing readers see'' — right now it barely stands out.'
  - 'Design storytelling is minimal: both series carry equal visual weight with no
    emphasis or callout on the clear insight in the data (Train commuters peak ~8
    minutes earlier and with a tighter spread than Bus commuters) — a missed opportunity
    for a stronger focal point.'
  - The right margin reserved for the legend (260px) is much wider than the left margin
    (100px), creating slightly unbalanced whitespace distribution around the plot.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "Commute Times by Transit Mode · histogram-stepwise · javascript · d3 · anyplot.ai" is dark and centered at top; x-axis label "Commute Time (minutes)" and y-axis label "Number of Commuters" are dark and clearly legible; tick labels are a slightly softer dark gray; subtle horizontal gridlines run only on the y-axis; legend ("Bus" / "Train" with colored line swatches) sits to the right of the plot area.
      Data: Two step-outline (unfilled) histograms — Bus in Imprint brand green (#009E73) peaking around 33-38 minutes, Train in lavender (#C475FD) peaking earlier around 24-27 minutes with a narrower spread. Both curves drop cleanly to zero at their outer edges, confirming proper step-histogram construction.
      Legibility verdict: PASS — all text is clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Title, axis labels, and tick labels have flipped to light/off-white tones and remain fully legible; gridlines are still subtle; legend text and swatches are visible against the dark background.
      Data: Bus and Train step outlines use the identical #009E73 / #C475FD hex values as the light render — only the chrome (background, text, grid) flipped, confirming correct theme-adaptive implementation.
      Legibility verdict: PASS — no dark-on-dark failures observed; all text and both data series are clearly distinguishable from the background.
