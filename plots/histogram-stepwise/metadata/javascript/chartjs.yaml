review:
  strengths:
  - 'Imprint palette applied correctly: first series (API v1) is #009E73, second series
    (API v2) is the canonical position-2 lavender, identical between light and dark
    renders'
  - Theme-adaptive chrome is threaded through correctly — title, legend, axis labels,
    and tick labels are all legible in both the light (#FAF8F1) and dark (#1A1A17)
    renders, with no dark-on-dark or light-on-light failures
  - 'Step-outline construction correctly satisfies the spec: no fill (backgroundColor:
    transparent, fill: false), horizontal segments at each bin''s count connected
    by vertical segments at bin edges, and the outline closes to zero at both ends'
  - Two overlaid distributions with distinct shapes (narrow/fast API v2 vs. wider/slower
    API v1) directly serve the spec's 'overlaying distributions for direct comparison'
    use case
  - 'Clean layout: no text overlap, no edge clipping, generous canvas utilization,
    y-axis-only grid kept subtle per style guide'
  weaknesses:
  - 'LM-01: Misses Chart.js''s native `stepped` line option (stepped: ''before''/''after''/''middle''),
    which draws exactly this step-outline shape natively. The implementation instead
    manually duplicates each bin''s point onto (leftEdge, rightEdge) to fake the step
    — more code than needed and not the library''s idiomatic pattern for this exact
    chart shape.'
  - 'DE-01/DE-02: Reads as a well-configured but fairly generic line chart — solid
    execution, but no distinctive polish beyond the style-guide defaults (e.g. legend/typography
    hierarchy, subtle emphasis on the faster distribution) that would push it into
    ''publication-ready'' territory.'
  - 'DE-03: Visual hierarchy is present only through color; consider a stronger focal
    point (e.g., emphasizing the rewrite''s tighter/faster distribution) to sharpen
    the story.'
  image_description: |-
