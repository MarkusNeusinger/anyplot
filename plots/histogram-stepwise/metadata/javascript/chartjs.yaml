      Data: Two step-outline (unfilled) lines — API v1 (legacy) in brand green #009E73, wider and shifted right (slower, ~150-400ms tail); API v2 (rewrite) in lavender/purple (#C475FD), narrower and shifted left (faster, peak ~130-140ms). No fill, only outline, matching the step-histogram spec. Lines cross around 180-220ms but remain distinguishable by color.
      Legibility verdict: PASS

