review:
  strengths:
  - 'Correct step-histogram math: the manual stepX/stepV construction rises at each
    bin''s left edge, holds flat across the bin, transitions at boundaries, and returns
    to zero at both ends — a textbook unfilled step outline.'
  - Realistic, neutral dual-distribution narrative (API v1 vs v2 latency before/after
    an optimization pass) that doubles as a natural use case for overlaying two histograms.
  - 'Correct Imprint palette and theme handling: brand green first series, lavender
    second series, identical data colors across themes, warm off-white/near-black
    backgrounds both readable.'
  - Deterministic, seeded data generation via a small fixed-seed LCG (no external
    RNG dependency).
  - Dynamic title-fontsize scaling formula guards against overflow for longer titles,
    and legend/axis labels use sensible explicit font sizes.
  weaknesses:
  - 'LM-01: Does not use MUI X LineChart''s native curve="step"/"stepBefore" support.
    Instead the code manually duplicates every bin edge (54 points instead of ~28)
    to fake the step shape. Using the built-in step curve type with bin edges/counts
    directly would be simpler and more idiomatic.'
  - 'LM-02/DE-01/DE-03: Fairly generic MUI X LineChart composition beyond the required
    palette and step transform — no distinctive library feature (reference lines,
    area threshold, custom tooltip formatting) and no additional visual-hierarchy
    technique (annotation, highlighted region, emphasis marker) to strengthen the
    before/after storytelling beyond color and data shape alone.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white, matches #FAF8F1, not pure white.
      Chrome: title "histogram-stepwise · javascript · muix · anyplot.ai" in dark ink top-left; legend swatches "API v1 latency" (green) / "API v2 latency" (lavender) below title; x-axis "Response latency (ms)" with tick labels every 5ms from 35-195; y-axis "Count" with tick labels 0-120. All text renders in dark ink, clearly legible against the light background. Subtle horizontal gridlines only.
      Data: two step-outline (unfilled) lines. First series (API v1 latency) is brand green #009E73, right-skewed peak around 110-130ms. Second series (API v2 latency) is lavender/purple, peak around 85-95ms, lower and shifted left of v1 (illustrating the "after optimization" story). No fill, only outline segments with clean horizontal/vertical step transitions.
      Legibility verdict: PASS.

    Dark render (plot-dark.png):
      Background: warm near-black, matches #1A1A17, not pure black.
      Chrome: same title, legend, axis labels and tick labels, now rendered in light ink (off-white) against the dark background. Gridlines are subtle light-on-dark. No dark-on-dark or unreadable text anywhere.
      Data: identical green (#009E73) and lavender step lines as the light render — confirms only chrome flipped, not data colors.
      Legibility verdict: PASS.
