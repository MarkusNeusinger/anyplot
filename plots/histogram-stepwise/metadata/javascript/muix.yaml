review:
  strengths:
  - 'The step outline uses MUI X''s native curve: "stepAfter" on a numeric LineChart,
    with the bin edges as x values. A doubled first edge and trailing zeros lift each
    outline off and back onto the zero baseline, so every bin is a horizontal segment
    at its count, joined by vertical segments at the shared edges.'
  - Both distributions share 26 bin edges computed from the pooled range. The count
    axis starts at 0, and the 3 px Imprint green (#009E73) and purple (#C475FD) outlines
    stay clearly visible against the page and gridlines in both themes.
  - The chrome is themed through tokens (ink, inkSoft, grid, pageBg). Explicit axis
    bands (x height 64, y width 72) keep every tick label and axis title untruncated.
    The subtitle states n per group and the bin width with its unit, derived from
    the data.
  - 'The data is deterministic: a seeded LCG with a Box–Muller draw. The records are
    in long format, keyed by role constants. skipAnimation is set, and the default
    export follows the harness contract.'
  - The legend uses the native horizontal MUI X legend, top-right, with line-sample
    glyphs that match the series colors. The HTML adds native hover tooltips.
  weaknesses:
  - 'Suggestion: the 14 px tick labels are near the lower end for the 400 px thumbnail;
    15–16 px would hold up better when the plot is scaled down.'
  - 'Suggestion: the peak-marker layer (dashed lines plus bold labels) goes beyond
    what the spec asks; the outlines alone already show the shift between the versions,
    so the layer could be dropped for a cleaner minimal histogram.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white, consistent with #FAF8F1 (not pure white).
      Chrome: bold title "histogram-stepwise · javascript · muix · anyplot.ai" centered at top, a soft-ink subtitle "API v1 n = 800 · API v2 n = 800 · 26 shared bins of 6.0 ms · dashed lines: centre of each tallest bin", legend top-right (API v1, API v2), y-axis "Frequency (count per bin)" with ticks 0–130 by 10, x-axis "Response latency (ms)" with ticks 40–190 by 10. Subtle light-gray horizontal gridlines. All text dark on light and fully readable; nothing clipped.
      Data: two step outlines, no fill. API v1 in brand green #009E73 (first series), peaking ~102 at ~114 ms with a right tail to ~195 ms; API v2 in Imprint purple #C475FD peaking ~119 at ~90 ms. Outlines cross around 111–117 ms; empty bins lie on the baseline. Dashed vertical peak markers in each series color with bold labels "API v2 peak 90 ms" (left of its line) and "API v1 peak 114 ms" (right of its line), clear of the outlines.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black, consistent with #1A1A17 (not pure black).
      Chrome: title, subtitle, legend, axis titles, tick labels and peak labels all render in light ink and are clearly readable; gridlines are subtle dark-gray, visible but not dominant. No dark-on-dark text.
      Data: identical green #009E73 and purple #C475FD outlines and dashed peak markers as the light render; only the chrome flipped. Brand green reads well on the dark surface.
      Legibility verdict: PASS
