review:
  strengths:
  - Now uses MUI X LineChart's native curve="stepAfter" over bin-edge data directly,
    fixing the attempt-1 weakness of hand-duplicating every x/y pair into a fake step
    shape.
  - Adds ChartsReferenceLine peak markers (dashed, series-colored) with labels calling
    out the v1/v2 latency-shift story, directly answering the attempt-1 feedback for
    a distinctive MUI X feature and a stronger before/after narrative.
  - 'Correct step-histogram math: values are binned into 26 bins, stepped from zero
    up through counts and back to zero, producing a clean unfilled outline for both
    distributions.'
  - Realistic, neutral dual-distribution narrative (API v1 vs v2 latency before/after
    an optimization pass) that doubles as a natural overlay-comparison use case for
    a step histogram.
  - 'Correct Imprint palette and theme handling: brand green first series, lavender
    second series, identical data colors across themes, correct warm off-white/near-black
    backgrounds, and reference-line/label colors matched to their series.'
  - Deterministic, seeded data generation via a small fixed-seed LCG; dynamic title-fontsize
    scaling guards against overflow.
  weaknesses:
  - 'Visual Refinement (DE-02) is still baseline: no spine/frame customization or
    extra whitespace tuning beyond the horizontal-only grid already present in attempt
    1.'
  - The reference-line annotations are a real improvement but a fairly common MUI
    X pattern (single ChartsReferenceLine + label) rather than a deep showcase of
    library-distinctive capability (e.g. custom tooltip formatting, zoom, or a highlighted
    divergence band).
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Title "histogram-stepwise · javascript · muix · anyplot.ai" in dark ink, top-left, fully legible. Legend below it with green "API v1 latency" and lavender "API v2 latency" swatches. X-axis "Response latency (ms)" with tick labels every 5ms from 35-195; Y-axis "Count" with ticks 0-120. Horizontal-only grid, subtle. Two dashed vertical reference lines labeled "v2 peak ~90ms" (lavender text) and "v1 peak ~114ms" (green text), positioned in clear whitespace above the gridline — no overlap with the step lines or each other (verified via pixel crop).
      Data: Two unfilled step-outline lines built with curve="stepAfter" over bin-edge data — brand green #009E73 (API v1, right-skewed, peak ~110-130ms) and lavender #C475FD (API v2, left-shifted after the optimization, peak ~85-95ms). No fill, matching the "step histogram, outline only" spec requirement.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Same title, legend, and axis labels now in light ink, fully legible against the dark surface — no dark-on-dark failures. Reference-line labels remain in their series colors (lavender/green) and stay readable on the dark background.
      Data: Step-outline colors are pixel-identical to the light render (brand green + lavender) — only chrome (background, text, gridlines) flipped, confirming Imprint palette consistency across themes.
      Legibility verdict: PASS
