review:
  strengths:
  - geom_step(direction = "hv") is the correct, idiomatic ggplot2 approach to a step
    histogram, which has no dedicated geom
  - 'Clean minimalist chrome: only horizontal major gridlines, blanked legend background/key,
    subtle axis lines'
  - Both renders are fully legible with correct theme backgrounds and pixel-identical
    data colors across light/dark
  - Title, axis labels, and legend all correctly formatted per spec
  - Realistic, neutral data scenario (reaction times under two lighting conditions)
    at a sensible scale
  weaknesses:
  - Second series color (#4467A3, canonical position 3) skips the canonical position-2
    color (#C475FD, lavender) with no semantic justification for "Bright light"/"Dim
    light" -- use the palette in canonical order unless a real color association applies
  - make_steps() custom function violates the KISS Imports -> Data -> Plot -> Save
    structure -- inline the binning (e.g. via dplyr::group_by()/summarise() or duplicated
    hist() calls) instead of defining a function
  - Design Excellence is only modestly above baseline; a stronger focal point (e.g.
    subtle alpha or an annotation calling out where reaction times diverge) would
    raise DE-03
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 -- not pure white.
      Chrome: Title "histogram-stepwise · r · ggplot2 · anyplot.ai" in dark ink top-left; "Condition" legend with two swatches near top; axis titles "Reaction Time (ms)" and "Number of Trials" in dark ink; tick labels in softer ink; only horizontal gridlines at 0/50/100. All readable.
      Data: Two step-function histograms (no fill), green "Bright light" (#009E73) and blue "Dim light" (#4467A3), each built from horizontal count segments connected by vertical steps, spanning ~150-550ms.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 -- not pure black.
      Chrome: Same title, axis titles, tick labels, and legend now rendered in light ink / off-white against the dark surface. No dark-on-dark issues found anywhere.
      Data: Same green (#009E73) and blue (#4467A3) step lines as the light render -- confirmed pixel-identical data colors, only chrome flipped.
      Legibility verdict: PASS
