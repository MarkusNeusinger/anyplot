review:
  strengths:
  - Outline-only step histogram built from shared bin edges, with closing vertical
    drops to the zero baseline at both ends
  - Count axis anchored at zero via scale_y_continuous(expand=(0, 0, 0.06, 0)) so
    steps sit on the baseline
  - Theme tokens threaded through every chrome element; both renders readable
  - 'Adaptable code: column constants, full Imprint palette with limits=VALUES keeping
    data order (Standard gets #009E73)'
  - Canvas exactly 3200x1800 with style-guide text sizes
  weaknesses:
  - 'VQ-05 (both): the right-hand legend frame sits about 35 px from the canvas edge
    and the ''Optimized'' label runs to within a few px of the frame''s right border
    → keep at least ~1 % of the width between legend and canvas edge and pad the label
    inside the frame. Likely cause: legend_position="right" with default legend_box_margin
    / no legend_margin.'
  - 'Suggestion: placing the legend inside the empty upper-right panel area (legend_position=(0.95,
    0.95)) would free the right margin for the data.'
  - 'Suggestion: plotnine''s stat_bin with shared breaks could feed the outline instead
    of the manual np.histogram loop, if edge-aligned steps can be kept.'
