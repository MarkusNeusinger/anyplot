review:
  strengths:
  - Step path built from np.histogram edges and counts, so every horizontal segment
    sits exactly at its bin's count and the outline starts and ends on the baseline
  - Count axis pinned at zero from the data (domain [0, max*1.05]), so step heights
    compare as counts
  - Theme tokens threaded through title, axis titles, ticks, domain and grid; only
    the green outline stays constant between themes
  - Canvas sized per the library contract (620x320 view at scale 4, padded to 3200x1800)
    with tooltip-free HTML export alongside the PNG
  weaknesses:
  - 'VQ-06 (both): the x-axis title ''Measurement Value'' names no quantity and no
    unit → a measured quantity with its unit, e.g. ''Sensor reading (mV)''. Likely
    cause: VALUES = [''Measurement Value''].'
  - 'DQ-02 (both): the scenario is the generic ''Measurement Value'' with no domain
    → a concrete bimodal measurement (e.g. commute time in minutes, sensor readings
    in mV) named in the column. Likely cause: the VALUES constant and data block.'
  - 'Suggestion: overlaying a second distribution on shared bin edges, as the Notes
    allow, would show what step histograms are for.'
