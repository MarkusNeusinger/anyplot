review:
  strengths:
  - Uses ax.hist(histtype='step') with one shared edge array from np.histogram_bin_edges,
    so both outlines step at the same bin edges
  - Outlines are told apart by color (Imprint positions 1 and 2) and line style, and
    the legend glyphs match both encodings in both themes
  - 'Theme tokens applied to every chrome element — readable on #FAF8F1 and #1A1A17
    with identical data colors'
  - Exact 3200x1800 canvas with style-guide text sizes and a correctly formatted title
  weaknesses:
  - 'Suggestion: a legend title such as ''Species'' would name what the two outlines
    share.'
