review:
  strengths:
  - 'Correct step construction with np.repeat over shared np.histogram_bin_edges:
    one horizontal segment per bin, vertical joins at the edges, no fill'
  - Count axis pinned to zero with Range1d computed from the data, so the step heights
    compare as counts
  - Theme tokens threaded through every chrome element; both renders read cleanly
    and the Imprint colors stay identical
  - Text sizes follow the bokeh library prompt (50/42/34 pt) on the exact 3200x1800
    canvas with toolbar_location=None
  weaknesses:
  - 'DQ-02 (both): the two series are labelled only ''Sensor A'' and ''Sensor B'',
    which reads as generic → name what each sensor measures (for example ''Reactor
    inlet'' / ''Reactor outlet''). Likely cause: the SENSORS label list.'
  - 'LM-01 (code): both p.line calls take raw numpy arrays instead of a ColumnDataSource,
    which the bokeh library prompt asks for → build a ColumnDataSource per sensor
    with the step x and count columns. Likely cause: the arrays passed directly to
    p.line.'
  - 'Suggestion: a HoverTool reporting bin range and count would add value to the
    HTML view.'
