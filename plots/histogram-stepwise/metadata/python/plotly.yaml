review:
  strengths:
  - Theme tokens threaded through title, axis titles, ticks, grid and axis lines;
    both renders read cleanly
  - 'Outline-only rendering in #009E73 at 3 px carries the distribution without a
    fill, on a count axis anchored at zero (rangemode=''tozero'')'
  - Column constant and a Data block that ends in df keep the plot code reusable with
    other tables
  - Native hovertemplate gives value and frequency in the HTML view
  weaknesses:
  - 'SC-01, SC-02 (both): every bin is drawn as a closed bar outline that drops to
    the baseline at each interior edge, so the plot reads as unfilled bars, not a
    step outline (C1) → one continuous staircase whose vertical segments join neighbouring
    counts, dropping to zero only at the outer edges. Likely cause: the 4-point-per-bin
    coordinate arrays (lines 39-45) that return to y=0 after every bin.'
  - 'CQ-04 (code): lines 39-45 interleave four coordinates per bin by hand where plotly
    draws the step itself → go.Scatter(x=edges, y=np.append(counts, counts[-1]), line_shape=''hv'')
    (pad with zeros at both ends for the closing drops). Likely cause: hand-built
    coordinate arrays.'
  - 'VQ-06 (both): x-axis titled ''Value'' names no quantity or unit → a descriptive
    title with its unit, e.g. ''Reaction time (ms)''. Likely cause: VALUES = [''Value''].'
  - 'DQ-02 (both): the data is an abstract ''Value'' around 100 with no real-world
    context → a named measurement (e.g. reaction times in ms, heights in cm) with
    matching values. Likely cause: the column name and the generic normal(100, 18)
    draw.'
  - 'Suggestion: overlaying a second distribution on the same bin edges would show
    the step histogram''s main use case (C4).'
