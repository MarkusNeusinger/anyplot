review:
  strengths:
  - Correctly uses Makie's native `stephist!` recipe — the idiomatic, purpose-built
    API for outline-only step histograms, exactly matching the spec's 'no fill, only
    outline' requirement without any manual bin/line construction.
  - Both step histograms overlay cleanly with no fill, letting the two commute-time
    distributions be compared directly — exactly the use case the spec calls out.
  - 'Full theme-adaptive chrome: title/axis/tick colors, spine colors, and the subtle
    12%-opacity gridline all correctly branch on ANYPLOT_THEME, and the Imprint data
    colors (#009E73, #C475FD) are pixel-identical between light and dark renders.'
  - Realistic, neutral dataset (cyclist vs. driver commute times in minutes) with
    sensible ranges and a physically-motivated floor via `max(..., 3.0)` to avoid
    negative commute times.
  - 'Clean KISS script structure: theme tokens → palette → data → plot → save, with
    `Random.seed!(42)` for reproducibility and only-used imports.'
  weaknesses:
  - 'Design Excellence is at ''well-configured default'' level (DE-01=4): the chart
    follows the style guide correctly but has no intentional aesthetic flourish beyond
    compliance — e.g. no differentiated line style/marker for the busier overlap region,
    no subtle emphasis on the more interesting driver/cyclist crossover points.'
  - Data Storytelling (DE-03=4) relies only on color contrast between the two series;
    there is no visual cue (annotation, callout, or emphasis) pointing the viewer
    to the key insight — that drivers' commute-time distribution is shifted noticeably
    later/wider than cyclists'.
  - Only 2 of the two distributions shown are simple unimodal bell shapes; a touch
    more feature variety (e.g. slight skew or a secondary mode in one series) would
    better demonstrate the step-histogram's ability to reveal distribution shape (DQ-01).
  - Title occupies only ~20-25% of the plot width at titlesize=20 — well under the
    50-70% guideline range; consider a modest bump (e.g. titlesize≈22-24) to give
    the mandated title more visual presence, since it currently reads as a slightly
    minor element relative to the rest of the chrome.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "histogram-stepwise · julia · makie · anyplot.ai" in bold dark ink, clearly visible top-center. Axis labels "Commute Time (minutes)" (x) and "Number of Commuters" (y) in dark ink, both readable. Tick labels in a softer gray, legible. Subtle horizontal gridlines only (~12% opacity). Only left/bottom spines visible (soft gray), top/right removed. Legend ("Cyclists" / "Drivers") sits top-right, no frame, no overlap with data.
      Data: Two step-outline histograms, no fill — green (Cyclists) peaks earlier (~30 min) and higher (~83 count), lavender/purple (Drivers) peaks later (~44 min) and slightly lower (~69 count). First series is Imprint #009E73 (brand green) as required; second series is Imprint position-2 lavender #C475FD.
      Legibility verdict: PASS — all text clearly readable against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Title, axis labels rendered in light/off-white ink, tick labels in a lighter soft gray — all clearly legible against the dark background. Gridlines remain subtle (light-tinted, low opacity). Spines flipped to a light soft-gray tone. Legend text also correctly flipped to a light tone, no frame.
      Data: Same two step-outline histograms with identical data colors to the light render — green #009E73 and lavender #C475FD unchanged, confirming only chrome (not data color) flips between themes.
      Legibility verdict: PASS — no dark-on-dark failures observed; all title/axis/tick/legend text is clearly visible against the dark surface.
