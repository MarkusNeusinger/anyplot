review:
  strengths:
  - Correctly uses Makie's native stephist! recipe -- the idiomatic, purpose-built
    API for outline-only step histograms, exactly matching the spec's 'no fill, only
    outline' requirement.
  - 'Addressed attempt-1 feedback directly: the driver distribution now has a real
    right-skewed secondary mode (congestion_hit) instead of a plain bell curve, giving
    the step outline actual shape to reveal.'
  - Dashed median vlines for both series add an explicit storytelling focal point
    -- the ~10-minute commute-time gap between cyclists and drivers is now readable
    at a glance, not just inferred from color contrast.
  - Title size increased from 20 to 23, resolving the prior under-sized-title weakness;
    now occupies a comfortable proportion of the canvas.
  - Differentiated linewidths (3.0 cyclists vs 4.0 drivers) create subtle intentional
    hierarchy beyond flat style-guide defaults.
  - 'Full theme-adaptive chrome with Imprint data colors (#009E73, #C475FD) pixel-identical
    between light and dark renders; both renders pass the theme-readability check
    with no dark-on-dark or light-on-light issues.'
  - Clean KISS script structure, Random.seed!(42) for reproducibility, only-used imports
    (CairoMakie, Colors, Random, Statistics all exercised).
  weaknesses:
  - Data storytelling still relies on dashed median lines alone -- a short text annotation
    or subtitle naming the ~10-minute gap would push DE-03 further, though this is
    a minor polish item, not a defect.
  - LM-02 distinctive-feature usage (vlines median markers, linewidth hierarchy) is
    solid but still modest relative to the 5/5 ceiling -- richer use of Makie-specific
    idioms (e.g. band!/rangebars! for an IQR ribbon) could be explored in a future
    iteration.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 -- not pure white, not dark.
      Chrome: Bold dark title "histogram-stepwise · julia · makie · anyplot.ai" centered at top; dark-ink axis labels "Commute Time (minutes)" (x) and "Number of Commuters" (y); softer-gray tick labels; subtle horizontal-only gridlines; L-shaped spine (top/right removed). All clearly readable.
      Data: Two outline-only step histograms, no fill -- green "Cyclists" (Imprint #009E73, unimodal, peak ~28 min) at linewidth 3.0, and lavender "Drivers" (Imprint #C475FD, right-skewed with a visible secondary bump ~37-40 min from the congestion effect) at linewidth 4.0. Two dashed vertical median lines (translucent, matching each series' color) mark ~28 min (cyclists) and ~40 min (drivers), making the commute-time gap explicit. Frameless legend top-right, no overlap with data or axes.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 -- not pure black, not light.
      Chrome: Same title/axis/tick text now rendered in light/off-white tones; spines and gridlines flipped to light-tinted low-opacity variants; legend text light-colored. All clearly legible -- no dark-on-dark failures.
      Data: Colors are pixel-identical to the light render (#009E73 green, #C475FD lavender) and the same shapes/secondary mode/median lines are preserved -- confirms only chrome flips between themes, not data encoding.
      Legibility verdict: PASS
