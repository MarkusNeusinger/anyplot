    (e.g. explicit `RGBAf(0,0,0,0)` fill with real stroke, or drawing an unfilled
    `:xcross`/`:circle` via `Makie.Circle` primitive) plus a confirmed-visible `text!`
    call is needed. Since this is entirely dead code producing no visual effect, it
    should either be fixed so the ring+label are clearly visible in both themes, or
    removed.'
  - 'Minor: the crossover annotation, if fixed, should be checked for overlap with
    the two data markers at hour 3 (they sit almost on top of each other in the current
    data) — offset the text further if the ring and ''crossover'' label would crowd
    the intersection point.'
