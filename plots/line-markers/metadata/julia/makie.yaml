review:
  strengths:
  - Theme-adaptive chrome tokens (INK, INK_SOFT, PAGE_BG) are correctly threaded through
    title, axis labels, tick labels, and spines in both renders — no dark-on-dark
    or light-on-light failures.
  - Distinct marker shapes (circle for Line A, upward triangle for Line B) provide
    colorblind-safe redundant encoding alongside color, per the spec's 'use different
    marker shapes for multiple series' requirement.
  - Marker sizes (16-18px) are well-adapted to the sparse 12-point series, with a
    background-colored stroke that gives markers a clean 'cutout' look against the
    crossing lines.
  - 'Clean KISS script structure: single seeded random-walk data generation, no functions/classes,
    no fake UI elements.'
  - Correct title format and legend labels; L-shaped spines (top/right removed), subtle
    y-axis-only gridline at low opacity.
  weaknesses:
  - 'VQ-07: Second series color skips the Imprint canonical position 2 (lavender #C475FD)
    and jumps straight to position 3 (blue #4467A3) — the local IMPRINT_PALETTE array
    only defines [#009E73, #4467A3]. ''Line A''/''Line B'' are abstract labels with
    no semantic color association (not sky/water), so canonical order should be preserved:
    use IMPRINT_PALETTE[1:2] (green then lavender) instead of cherry-picking blue.'
  - 'LM-01/LM-02: Uses two separate lines!+scatter! calls instead of Makie''s dedicated
    scatterlines! recipe, which is the more idiomatic single-call primitive specifically
    built for a ''line plot with markers'' spec — switching to scatterlines!(ax, x,
    y; marker=..., markersize=..., color=...) would better demonstrate library mastery.'
  - 'DE-03: No visual hierarchy or emphasis beyond raw color — the two lines cross
    several times but nothing calls out the crossing points or a clear trend/insight;
    consider a subtle annotation or emphasis technique to give the chart a stronger
    storytelling focal point.'
