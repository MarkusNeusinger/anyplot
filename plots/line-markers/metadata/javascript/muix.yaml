review:
  strengths:
  - 'Every reading carries a marker centred on its (x, y) value: a filled green circle
    for Station A and a hollow purple diamond for Station B. Shape, fill and line
    dash (solid against dashed) each tell the two series apart without relying on
    colour.'
  - The markers (radius 9 px, about 3.5 line widths) stand out against the 2.5 px
    lines without swamping them. Page-coloured outlines on the filled markers and
    page-coloured fills on the hollow ones keep every symbol separate where it sits
    on its line.
  - 'Theme tokens reach every element: ink and inkSoft for the title, subtitle, axis
    titles and ticks, t.grid for the horizontal grid, and t.pageBg for the marker
    outlines and hollow fills. Both renders read cleanly, and the data colours are
    identical in light and dark.'
  - The x-axis gets X_PAD_SHARE padding and one tick per checkpoint (tickNumber equals
    the checkpoint count, tickMinStep 1), so the outer markers stay whole and every
    reading lines up with an integer checkpoint.
  - 'Idiomatic MUI X v9 configuration: skipAnimation, hideLegend, numeric axis bands
    (height 64 on x, width 76 on y) so no tick label is truncated, per-series dash
    styling through the .MuiLineChart-line[data-series] selector, and a series valueFormatter
    that adds the unit to the interactive tooltip in the HTML output.'
  - 'Realistic, neutral QC scenario: torque-wrench readings around a 42.5 N·m target
    at 14 sequential checkpoints on two assembly stations. The 0.1 N·m resolution
    and the ±0.3 N·m spread are plausible for production fastening.'
  weaknesses:
  - 'Suggestion: the hand-built MarkerLayer (useXScale/useYScale plus SVG paths) and
    the HTML legend reproduce what MUI X draws natively: series showMark: true with
    shape: "circle" / "diamond", mark fill and stroke through ''& .MuiLineChart-mark[data-series=...]'',
    and the built-in legend. Using the native marks would make the code more idiomatic,
    as long as the marker size stays proportional to the line.'
  - 'Suggestion: the target-torque reference line and its right-margin label go beyond
    what the spec asks for. They cost nothing on a non-basic spec, but they earn no
    storytelling or library credit. The line-plus-marker form carries the chart on
    its own.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white, matches #FAF8F1 (not pure white).
      Chrome: the bold title "Fastener Torque QC · line-markers · javascript · muix · anyplot.ai" sits top-left at about 42 % of the width, with the grey subtitle "28 readings at 14 checkpoints from 2 stations · range 41.5–42.8 N·m" below it. The header legend at the top right shows a line sample with a marker for "Station A" and "Station B". The y-axis "Torque (N·m)" has ticks from 41.4 to 42.9 at a 0.1 step; the x-axis "QC checkpoint (sequential reading)" has ticks 1–14. Horizontal grid lines are subtle and light grey, and the left and bottom axis lines are dark. A dashed ink reference line at 42.5 is labelled "Target torque / 42.5 N·m" in the right margin. All text is dark on light and clearly readable.
      Data: Station A is a solid #009E73 green line with filled green circles that have page-coloured outlines, on 14 points between 42.2 and 42.8. Station B is a dashed purple line with hollow purple diamonds on 14 points between 41.5 and 42.1. Every marker sits on its own value and none overlap.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black, matches #1A1A17 (not pure black).
      Chrome: the title, subtitle, legend text, axis titles and tick labels flip to light ink and are all clearly readable. There is no dark-on-dark text anywhere. The grid lines are subtle dark grey and still visible, and the target reference line and its label render in light grey.
      Data: the green circles and line and the purple diamonds and dashed line are identical to the light render. The filled markers' outlines and the hollow diamonds' fills switch to the dark page colour, as intended. Brand green reads well.
      Legibility verdict: PASS
