review:
  strengths:
  - First series matches brand green (#009E73), second series lavender (#C475FD) —
    correct Imprint canonical order, identical between light and dark renders.
  - Distinct marker shapes (filled circle for Station A, hollow diamond for Station
    B) plus solid vs dashed line styling gives triple redundant encoding for series
    differentiation.
  - Custom marker overlay via useXScale/useYScale/getValueToPositionMapper hooks demonstrates
    real library mastery beyond the basic showMark API, since community MUI X only
    natively draws circular marks.
  - ChartsReferenceLine with a clear 'Target 42.5 N·m' label adds meaningful data-storytelling
    context for a QC chart.
  - Clean L-shaped axis frame, subtle horizontal grid, and generous margins give good
    visual refinement in both themes.
  weaknesses:
  - Reference-line label 'Target 42.5 N·m' is set at 12px, the smallest text on the
    chart — bump to ~13-14px so it stays legible when the mobile 400px srcset variant
    is generated.
  - Title comfortably occupies only ~40-45% of plot width at the current 22px size
    — well within readable range and not a violation, but a touch more presence (e.g.
    24-26px) would strengthen the visual hierarchy since this title is short (~66
    chars, under the 67-char scaling threshold).
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1-range), not pure white, not dark.
      Chrome: Title "Fastener Torque QC · line-markers · javascript · muix · anyplot.ai" in bold dark ink, centered above the plot. X-axis label "QC Checkpoint (sequential reading)" and Y-axis label "Torque (N·m)" (rotated) both in dark ink. Tick labels for both axes are dark gray and clearly legible. Horizontal gridlines are subtle (low opacity). L-shaped axis frame (left + bottom only). A dashed gray "Target 42.5 N·m" reference line runs horizontally near the top of the data band. Legend at the bottom center reads "Station A" (solid green line) and "Station B" (dashed lavender line).
      Data: Station A is a solid brand-green (#009E73) line with filled green circle markers, ringed with a thin page-background stroke for definition. Station B is a dashed lavender (#C475FD) line with hollow diamond markers (lavender stroke, page-background fill). 14 sequential checkpoints per series, torque values clustered between ~41.5 and ~42.8 N·m.
      Legibility verdict: PASS — all text (title, axis labels, ticks, legend, reference-line label) reads clearly against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17-range), not pure black, not light.
      Chrome: Same title, axis labels, and legend text now rendered in light/off-white ink, clearly visible against the dark background. Tick labels are a lighter gray, still legible. Gridlines remain subtle. The "Target 42.5 N·m" reference-line label is light gray and readable against the dark surface.
      Data: Station A (brand green #009E73) and Station B (lavender #C475FD) use identical hex values to the light render — only the chrome (background, text, grid, axis lines) flipped polarity, as required.
      Legibility verdict: PASS — no dark-on-dark failures; every text element (title, both axis labels, tick labels, legend, reference-line label) is clearly visible against the near-black background.
