      Data: Two saturating (Michaelis-Menten) curves with visible markers at each of the 11 data points - Wild-type in brand green (#009E73) with circle markers, Mutant in lavender (#C475FD) with diamond markers. Markers have a thin light-colored border for contrast against the line.
      Legibility verdict: PASS - no text is light-on-light, no clipping observed.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 - not pure black.
      Chrome: Same title, legend, and axis chrome now rendered in light ink (title/axis names near-white, tick/legend text light gray), fully legible against the dark background. Grid lines are faint light-gray, visible without competing with the data. No dark-on-dark text anywhere.
      Data: Same two curves in the identical green (#009E73) and lavender (#C475FD) hues as the light render - data colors are unchanged between themes, only chrome (background, text, grid) flips as required. Marker borders now use the dark page background color for contrast.
      Legibility verdict: PASS - all chrome text is clearly readable on the dark surface, no dark-on-dark failures.
