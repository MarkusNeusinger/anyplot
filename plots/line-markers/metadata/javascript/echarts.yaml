review:
  strengths:
  - 'Correct Imprint palette order (brand green #009E73 for Wild-type, lavender #C475FD
    for Mutant), identical data colors across light and dark renders'
  - Distinct marker shapes (circle vs. diamond) per series as required by the spec,
    sized proportionally to the 3.5px line weight
  - 'Theme-adaptive marker borders (itemStyle.borderColor: t.pageBg) give the markers
    definition against the line without introducing off-palette colors'
  - All font sizes explicitly set (title 22px, axis names 18px, tick/legend 14-16px)
    and balanced between X and Y axes
  - Realistic, neutral scientific dataset (Michaelis-Menten enzyme kinetics) with
    a clear, factually plausible Vmax/Km contrast between wild-type and mutant
  - Deterministic data generation via a fixed-seed LCG (no Math.random), consistent
    with the mount-node contract's offline/reproducibility requirement
  - Canvas well-utilized (~around 65-70% of the mount) with balanced margins and no
    clipped or overlapping text in either theme
  weaknesses:
  - 'Design Excellence is at ''well-configured default'' level: no visual hierarchy
    or emphasis beyond the two plain lines - consider a subtle areaStyle fade under
    one curve, a markLine/markPoint calling out the Vmax asymptote or Km crossover,
    or a slightly heavier line weight on the primary series to create a focal point'
  - Grid uses both X and Y split lines at full density for a 2-series line chart -
    consider dropping the X-axis split lines (keep Y-axis grid only) per the style
    guide's grid guideline for line charts, which would also declutter the plot
  - 'Library Mastery is generic: the option object (line + symbol series, standard
    legend/axes) could be built almost identically in Chart.js or Highcharts - leverage
    an ECharts-distinctive feature such as markLine (e.g., a dashed asymptote at Vmax)
    or a smooth/step interpolation toggle to demonstrate library-specific capability'
  - Only one data-quality dimension is exercised (two smooth saturating curves) -
    consider adding a visual cue for the 'sparse/discrete measurement' framing from
    the spec notes, e.g., slightly larger markers or a subtitle noting units, to sharpen
    the 'quality-control style discrete readings' angle mentioned in the spec's Applications
    section
  image_description: |-
