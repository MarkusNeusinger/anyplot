review:
  strengths:
  - 'Correct Imprint palette order — brand green #009E73 for Line A, lavender #C475FD
    for Line B — identical data colors in both themes, only chrome flips.'
  - Shape + color redundant encoding (circle vs. triangle markers) gives CVD-safe
    series distinction beyond hue alone.
  - pointBorderColor set to the page background creates a clean halo around each marker,
    separating it from the crossing lines — a deliberate polish touch beyond the library
    defaults.
  - 'Theme-adaptive chrome correctly threaded through tokens: title, axis titles,
    ticks, and grid all read cleanly in both light and dark renders.'
  - Realistic, neutral bolt-torque quality-control dataset fits the spec's 'quality
    control charts with individual readings' application directly.
  weaknesses:
  - Line A and Line B markers coincide at Inspection Number 3 (both at 24.6 N·m),
    momentarily merging into a less distinguishable overlapping shape at the crossing
    point.
  - No visual hierarchy or storytelling device (annotation, highlight, callout) draws
    attention to the pattern that Line A consistently runs above Line B — purely a
    default side-by-side comparison.
  - Both series use solid/filled markers; the spec notes suggest considering filled
    vs. unfilled markers for extra distinction, which was not explored.
  - Legend labels 'Line A'/'Line B' are generic — a touch more domain-specific naming
    (e.g. 'Assembly Line A') would reinforce the quality-control context established
    by the axis title.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "line-markers · javascript · chartjs · anyplot.ai" in dark ink, centered, comfortably within plot width. Legend ("Line A" circle, "Line B" triangle) sits below the title using matching point styles. Axis titles "Inspection Number" (x) and "Bolt Torque (N·m)" (y) in dark ink; tick labels in a softer dark gray. Horizontal gridlines only (y-axis), subtle and unobtrusive; x-axis grid is hidden with only a bottom border line.
      Data: Line A rendered in brand green (#009E73) with circular markers; Line B in lavender (#C475FD) with triangular markers. Both lines cross near Inspection Number 3. Markers have a light halo (border colored to match the page background) separating them cleanly from the connecting lines.
      Legibility verdict: PASS — all text is clearly readable against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title, legend, and axis titles now rendered in light/white ink, clearly legible against the dark surface. Tick labels in a lighter soft gray. Gridlines remain subtle but visible against the dark background.
      Data: Line A and Line B retain the exact same hex colors (#009E73 green, #C475FD lavender) as the light render — only the chrome (background, text, grid) flipped, as required. Marker halos now match the dark page background.
      Legibility verdict: PASS — no dark-on-dark failures; all text and gridlines remain clearly visible against the near-black background.
