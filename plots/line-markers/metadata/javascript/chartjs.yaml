review:
  strengths:
  - 'The `fill: "+1"` area between the two lines (with `withAlpha(palette[0], 0.12)`)
    turns the chart from a bare comparison into a clear visual story about the consistent
    torque gap between assembly lines — directly resolves the prior attempt''s ''no
    storytelling'' weakness.'
  - Filled (solid green circle) vs. unfilled (hollow lavender triangle, pointBackgroundColor
    = pageBg) markers now give a third redundant encoding dimension on top of color
    + shape, addressing the spec's explicit note to 'consider filled vs. unfilled
    markers for distinction'.
  - The `order` property (A=2, B=1) resolves the messy double-marker clash at the
    Inspection Number 3 crossing point from Attempt 1 — it now renders as a single
    clean hollow triangle instead of two overlapping shapes.
  - Domain-specific legend labels ('Assembly Line A' / 'Assembly Line B') reinforce
    the quality-control narrative established by the axis titles, instead of the generic
    'Line A' / 'Line B' from Attempt 1.
  - Correct Imprint palette order — brand green `#009E73` for Line A, lavender `#C475FD`
    for Line B — identical data colors in both themes, only chrome flips.
  - Theme-adaptive chrome (title, axis titles, ticks, grid, marker halos) correctly
    threaded through tokens in both renders; realistic, neutral bolt-torque QC dataset.
  weaknesses:
  - At the Inspection Number 3 crossing point, Line A's circular marker is now fully
    hidden behind Line B's opaque hollow triangle (pointBackgroundColor = pageBg covers
    whatever is beneath) — clean-looking, but Line A's actual data point at that x-value
    has no visible marker of its own.
  - 'Legend order shows ''Assembly Line B'' before ''Assembly Line A'' even though
    A is defined first in the data/dataset array — a minor cosmetic inconsistency
    from the `order: 2` / `order: 1` z-index trick used to fix the marker overlap.'
  - The gap-highlighting fill is a strong storytelling addition but is not reinforced
    with a label/annotation stating the actual average gap — a small additional touch
    (e.g. a callout with the mean delta) would push Design Excellence further.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "line-markers · javascript · chartjs · anyplot.ai" in dark ink, centered, comfortably within plot width. Legend below the title reads "Assembly Line B" (hollow triangle swatch) then "Assembly Line A" (filled circle swatch), using matching point styles. Axis titles "Inspection Number" (x) and "Bolt Torque (N·m)" (y) in dark ink; tick labels in a softer dark gray. Y-axis gridlines only, subtle and unobtrusive; x-axis grid hidden with only a bottom border line.
      Data: Line A rendered in brand green (#009E73) with solid filled circular markers; Line B in lavender (#C475FD) with hollow (page-background-filled) triangular markers, giving a filled-vs-unfilled redundant encoding on top of color and shape. A soft translucent green band (12% alpha) fills the area between the two lines, visually emphasizing the consistent torque gap — a clear storytelling device. At Inspection Number 3, where both series coincide at 24.6 N·m, the z-ordering (order: 2 / order: 1) resolves what was a messy double-marker overlap in the previous attempt into a single clean hollow triangle.
      Legibility verdict: PASS — all text is clearly readable against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title, legend, and axis titles now rendered in light ink, clearly legible against the dark surface. Tick labels in a lighter soft gray. Gridlines remain subtle but visible against the dark background.
      Data: Line A and Line B retain the exact same hex colors (#009E73 green, #C475FD lavender) as the light render — only chrome (background, text, grid, marker halo fill) flipped, as required. The translucent gap-fill band and the hollow-triangle treatment at the crossing point read identically to the light render, just against the dark surface.
      Legibility verdict: PASS — no dark-on-dark failures; all text and gridlines remain clearly visible against the near-black background.
