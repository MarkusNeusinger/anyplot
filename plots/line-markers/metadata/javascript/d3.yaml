review:
  strengths:
  - 'First series correctly uses brand green #009E73, with the full three-series slice
    of the Imprint palette (green, lavender, blue) held identical between light and
    dark renders — only chrome flips'
  - Distinct marker shapes (circle, square, triangle) per series via d3.symbol give
    redundant shape+color encoding, satisfying the spec's 'different marker shapes
    for multiple series' requirement and helping CVD accessibility
  - Marker size (d3.symbol size=260) is large and prominent relative to line thickness
    (3px), correctly matching the sparse-data (13 points/series) heuristic from the
    style guide
  - Custom legend combines a line swatch, the matching marker symbol, and the series
    label per row — clearer than a plain color swatch and reinforces the shape/color
    pairing
  - Bell-curve enzyme-activity-vs-pH domain data is realistic, neutral, and appropriately
    scaled (0-100% activity, pH 4-10), with a deterministic seeded LCG for reproducibility
  - 'Theme-adaptive chrome is threaded correctly throughout: axis text/ticks use inkSoft,
    title/axis labels use ink, grid uses grid token at 0.15 opacity, marker strokes
    use pageBg for definition — verified legible in both PNGs'
  - Canvas gate passed (3200x1800 landscape) and no edge-clipping in either render
  weaknesses:
  - 'Design excellence is competent but generic: no annotation or emphasis calls out
    the three optimum peaks (pH~5 Pepsin, ~7.5 Trypsin, ~9.5 Alkaline phosphatase),
    which would give the crossing-curves layout a clearer focal point/storytelling
    hook'
  - Markers for all three series cluster and slightly overlap near pH 4-4.5 where
    activity is near zero for all enzymes — shapes/colors keep them distinguishable
    but it's visually the busiest spot on the chart
  - Legend swatch line length (36px) is short enough that the overlaid marker makes
    the line look broken/dashed rather than clearly a solid line matching the plotted
    line style
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "line-markers · javascript · d3 · anyplot.ai" in bold dark ink, centered top. Axis labels "pH Level" (x) and "Enzyme Activity (%)" (y) in dark ink, matching size. Tick labels and legend text in a softer dark gray. Subtle horizontal-only gridlines at low opacity. All text clearly legible against the light background.
      Data: Three bell-shaped curves — Pepsin (green #009E73, circle markers) peaking near pH 5, Trypsin (lavender, square markers) peaking near pH 7.5, Alkaline phosphatase (blue, triangle markers) peaking near pH 9.5. Markers have a light-colored stroke matching the page background for separation from the lines. Legend at right lists all three series with line+marker+label.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title, now in light/white text, clearly legible. Axis labels and tick labels flipped to light-gray/white tones, all readable against the dark surface. No dark-on-dark text anywhere.
      Data: Identical green/lavender/blue curve colors and marker shapes/positions as the light render — confirms data colors are held constant across themes. Marker strokes now use the dark page background color for edge separation, matching the theme.
      Legibility verdict: PASS
