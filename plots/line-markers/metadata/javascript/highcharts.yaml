review:
  strengths:
  - 'Perfect Imprint palette compliance: Furnace A in brand green #009E73, Furnace
    B in lavender #C475FD (canonical position 2), identical data colors across light
    and dark renders'
  - All font sizes explicitly set (title 22px, axis titles 16px, tick/legend labels
    14px) and fully readable in both themes with no overlap or clipping
  - Distinct marker shapes (circle vs. diamond) plus a dashed line style for Furnace
    B satisfy the spec's 'different marker shapes for multiple series' note and give
    CVD-safe redundant encoding beyond color alone
  - Realistic, neutral manufacturing scenario (furnace hardness in HRC) with plausible
    values and non-monotonic week-to-week variation
  - 'Clean, idiomatic Highcharts snippet: correct mount-node contract, animation disabled
    on both chart and series, no fake interactivity, no deprecated APIs'
  weaknesses:
  - 'DE-01: Aesthetic sophistication reads as a well-configured default — correct
    palette and sizing but no extra design flourish (e.g. subtle area fill under one
    series, a highlighted endpoint, refined typography contrast) to lift it above
    a standard line chart'
  - 'DE-03: No visual hierarchy or emphasis — both furnaces get equal visual weight
    with no annotation/callout surfacing the actual insight (Furnace A consistently
    runs several HRC points harder than Furnace B, and the gap persists through week
    10)'
  - 'LM-02: Marker-shape + dashStyle differentiation is generic and portable to any
    charting library; consider a Highcharts-distinctive touch such as a `plotLines`/`plotBands`
    spec threshold, a `dataLabels` callout on the peak point, or `series.marker.states.hover`
    to showcase library-specific capability'
  - 'DQ-01: Both series only trend gently upward with minor noise — a single anomalous
    dip/spike in one series would better demonstrate the spec''s emphasis on ''sparse
    data where individual observations are significant'''
