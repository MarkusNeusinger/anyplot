review:
  strengths:
  - 'Excellent data storytelling: a per-point marker override plus a data-label annotation
    calls out the "Refractory dip" anomaly, a dashed plotLine marks the spec threshold,
    and a "+2.8 HRC vs B" callout closes the comparison — the chart has a clear narrative
    focal point, not just raw series.'
  - Series are differentiated by BOTH marker shape (circle vs diamond) AND dash style
    (solid vs short-dash), not color alone — satisfies the spec's "use different marker
    shapes for multiple series" note and is CVD-safe/print-safe.
  - 'Theme-adaptive chrome is fully correct in both renders: background, text, and
    grid flip between light/dark while data colors (including the amber anomaly marker)
    stay identical; first categorical series is Imprint green #009E73.'
  - 'Clean, idiomatic Highcharts snippet: deterministic in-memory data, animation
    disabled on chart and series, credits disabled, no bare plot.png output, no add-on
    modules.'
  weaknesses:
  - X-axis renders weeks as discrete categories ("Week 1"..."Week 10") rather than
    a continuous numeric axis, though the spec defines x as continuous numeric — fine
    for evenly-spaced weekly cadence, but a numeric xAxis would match the spec more
    literally and support uneven spacing if the data ever needs it.
  - Annotation/dataLabel text ("Refractory dip", "+2.8 HRC vs B") is set at 12px,
    the smallest text on the chart — bump to ~13-14px so callouts stay legible at
    reduced viewport sizes without changing the axis-tick/label balance.
  - Distinctive-feature usage is solid (per-point marker override, plotLines with
    label, dataLabels) but stays within a fairly common Highcharts toolkit — a plotBand
    around the anomaly week or a zoom/reset-zoom affordance would push library mastery
    further for the HTML detail view.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1-like), consistent with the light theme surface, not pure white.
      Chrome: Bold dark title "line-markers · javascript · highcharts · anyplot.ai" centered at top; axis titles "Production Week" (x) and "Hardness (HRC)" (y) in dark-gray; tick labels "Week 1"..."Week 10" and 51-64 gridline labels all in dark-gray, clearly legible; subtle light-gray horizontal gridlines only (no vertical gridlines); dashed amber "Min spec: 56 HRC" reference line with its own label; bottom legend with "Furnace A" (circle icon) and "Furnace B" (diamond icon) in dark-gray text.
      Data: Furnace A is a solid Imprint-green (#009E73) line with filled circle markers, trending up 58.2 -> 63.0 HRC with a "+2.8 HRC vs B" callout near its last point. Furnace B is a dashed light-purple line with diamond markers, dipping sharply at week 7 to a highlighted amber diamond marker labeled "Refractory dip" before recovering. All series/annotation text is dark and reads clearly against the light background.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17-like), not pure black.
      Chrome: Title, axis titles, tick labels, legend text, and the "Min spec" plotLine label all render in light/white tones, clearly legible against the dark surface. Gridlines are subtle dark-gray, still visible. No dark-on-dark text found anywhere (title, ticks, legend, annotations all flip to light text).
      Data: Furnace A green line/markers and Furnace B purple dashed line/diamond markers are pixel-identical in hue to the light render — only the chrome (background, text, grid) flipped, as required. The amber anomaly marker and dashed spec line remain visible and legible against the dark background.
      Legibility verdict: PASS
