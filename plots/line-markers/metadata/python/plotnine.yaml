review:
  strengths:
  - Every data point carries a marker centered on its (x, y) value, sized 2.5 against
    a 1.0 line so neither dominates
  - Circle, square and triangle shapes per channel distinguish the series by shape
    as well as by color
  - Color and shape mapped to the same variable, so plotnine draws one merged legend
    with line-and-shape glyphs
  - Integer week breaks via scale_x_continuous match the discrete weekly measurements
  - Theme tokens threaded through every chrome element; both renders read cleanly
    with identical Imprint data colors
  weaknesses:
  - 'VQ-05 (both): the legend entry ''Organic search'' runs into the right edge of
    the legend frame, and the frame sits about 30 px from the right canvas edge →
    leave about 8 px of padding inside the frame and pull the legend inward. Likely
    cause: legend_position=''right'' with the default legend margin at figure_size
    (8, 4.5).'
  - 'Suggestion: a direct label at the series ends could replace the legend and free
    the right-hand space.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, panel the same tone, subtle INK_SOFT panel border.
      Chrome: bold dark title 'line-markers · python · plotnine · anyplot.ai' centered (~51 % of width); axis titles 'Week' and 'Sessions (thousands)' in dark ink; tick labels 1-12 and 10-60 in INK_SOFT; faint major/minor grid; legend 'Channel' on an elevated box at the right. All readable.
      Data: Organic search in #009E73 circles rising from 42 to 64k; Email in #C475FD squares with spikes in weeks 3, 6, 9, 12; Social media in #4467A3 triangles with a viral peak of 38.5k in week 6 decaying afterwards. Lines alpha 0.85, every point marked.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17 with a light INK_SOFT panel border.
      Chrome: title and axis titles in light ink, ticks in light grey #B8B7B0, legend box #242420 with light text. No dark-on-dark text.
      Data: identical colors and shapes to the light render; only chrome flipped. Green, purple and blue all read on the dark surface.
      Legibility verdict: PASS
