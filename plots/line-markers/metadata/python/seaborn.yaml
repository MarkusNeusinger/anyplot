review:
  strengths:
  - 'Idiomatic seaborn: one sns.lineplot call on a long-format frame maps hue and
    style to Stock, so markers=True gives each series its own shape (circle, x, square)
    with matching legend glyphs'
  - Marker size 5 with a thin page-colored edge on a 1.3 pt line keeps 60 points per
    series separate and in proportion to the line
  - 'Theme tokens threaded through sns.set_theme rc: correct #FAF8F1 / #1A1A17 backgrounds
    and readable chrome in both renders, Imprint colors identical across themes'
  - Exact 3200x1800 canvas with style-guide font sizes and the full mandated title
  weaknesses:
  - 'DQ-02 (both): the series are labelled Stock A, Stock B and Stock C, which read
    as generic placeholders → plausible fictional ticker or company names (e.g. a
    growth, a volatile and a dividend stock). Likely cause: the STOCK labels in the
    data block.'
  - 'Suggestion: highlight the Stock A / Stock C crossover around day 25 to give the
    chart a focal point.'
