review:
  strengths:
  - Different marker shape per series (circle, square, triangle) via a shape mapping
    in aes() and scale_shape_manual, so the series are told apart by shape as well
    as color in both renders and in the legend
  - 'Marker size 3.5 on 1.0 lines: markers stand out against the line without dominating
    it, and stay separate symbols at 12 points per series'
  - Y-only major grid with x grid and minor grid removed, matching the style guide
    for line charts
  - 'Full theme-token threading: page, legend, text and grid colors flip cleanly while
    the Imprint data colors stay identical'
  - Interactive HTML export alongside the PNG gives lets-plot's native hover tooltips
    in the detail view
  weaknesses:
  - 'DE-02 (both): all four panel spines are drawn (top and right frame lines around
    the panel) where a line chart needs only the left and bottom axis → remove the
    top and right spines (L-shaped frame) or all of them. Likely cause: theme_minimal()
    plus axis_line still draws a panel border; set panel_border=element_blank() and
    keep axis_line for x and y only.'
  - 'DQ-02 (both): the series are labelled ''Product A'', ''Product B'', ''Product
    C'', which read as generic placeholders → name the product lines concretely (for
    example ''Cloud Storage'', ''Analytics Suite'', ''Mobile App''). Likely cause:
    the PRODUCT label list in the data block.'
  - 'Suggestion: the gridlines are drawn in solid INK at size 0.3; a lighter tone
    closer to the style guide''s 15 % ink would push them further behind the data.'
  - 'Suggestion: unfilled markers for one series (for example shape 1 or 0) would
    add the filled-vs-unfilled distinction the Notes mention.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across canvas and panel.
      Chrome: bold dark title 'line-markers · python · letsplot · anyplot.ai' top-left at about 53% width; axis titles 'Quarter' and 'Revenue (Million USD)' in dark ink; ticks 1-12 and 35-75 in soft dark grey; thin y-only gridlines; legend 'Product' on the right in an elevated off-white box. All four panel edges carry a frame line. All text readable.
      Data: Product A #009E73 circles rising from 46 to 78, Product B #C475FD squares falling from 61 to 43 and recovering to 48-52, Product C #4467A3 triangles rising from 34 to 57; lines 1.0, markers 3.5, a marker on every quarter. Crossings near Q3 and Q7-Q8.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title and axis titles in light ink #F0EFE8, ticks and legend text in #B8B7B0, light thin y gridlines, legend in a #242420 elevated box; no dark-on-dark text. Frame on all four panel edges as in light.
      Data: identical colors and shapes to the light render; green, lilac and blue all clearly visible on the dark surface.
      Legibility verdict: PASS
