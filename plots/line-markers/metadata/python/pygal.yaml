review:
  strengths:
  - Each series gets its own marker shape and fill treatment (filled circle, hollow
    square, filled triangle), as the Notes ask, so the series can be told apart by
    shape and fill as well as by color
  - Uses pygal's add_xml_filter hook to redraw both the data dots and the legend boxes
    as each series' shape, so the legend glyphs match the marks exactly in both themes
  - Filled markers carry a page-colored outline and hollow markers a page-colored
    fill, so every marker stands clear of its line and of crossing lines
  - Theme tokens are wired through a single Style object; chrome flips cleanly between
    light and dark while the Imprint data colors stay identical
  - The HTML output keeps pygal's native hover tooltips, with values formatted to
    one decimal place by value_formatter
  weaknesses:
  - 'DQ-02 (both): the Greenhouse series peaks in April (27.3 °C) and bottoms out
    in Sep–Nov (about 15 °C), which is out of phase with any greenhouse season and
    reads as a generic sine wave → shift the seasonal phase so the warm peak falls
    in Jun–Aug. Likely cause: sin(x_values * np.pi / 6) peaks at x = 3 (Apr).'
  - 'Suggestion: drop or mute the y-axis line pygal draws at the Jan position, which
    runs through the first markers.'
  - 'Suggestion: narrow the bottom legend so its three entries sit closer together
    under the plot instead of spread across the full width.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the canvas and plot area.
      Chrome: title "line-markers · python · pygal · anyplot.ai" centered at the top (~42% of the width), y-axis title "Temperature (°C)", x-axis title "Month", month tick labels Jan–Dec and y tick labels 13.0–27.0, all dark ink and clearly readable; dashed horizontal grid subtle; legend at the bottom in three columns.
      Data: three series of 12 monthly points each. Greenhouse is #009E73 with filled circles, Warehouse is #C475FD with hollow squares, Server Room is #4467A3 with filled triangles. Every marker sits on its value, the lines cross several times, and the Greenhouse circle and Warehouse square touch in Oct (permitted).
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, axis titles, tick labels and legend text are light ink (#F0EFE8) and fully readable; grid subtle but visible; no dark-on-dark text.
      Data: the same marker colors, shapes and fills as the light render; the hollow squares are filled with the dark page color. Brand green reads well, and the blue triangles are still clearly visible.
      Legibility verdict: PASS
