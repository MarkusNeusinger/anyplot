review:
  strengths:
  - 'Each series gets its own marker style through pygal''s per-value `node` style
    overrides: filled dots for Sensor A, hollow rings for Sensor B and dashed rings
    for Sensor C. Together with the Imprint colors the three series stay distinct.'
  - Markers are sized for 12 sparse points (r=15 against a 5 px line), so every observation
    stands out from its line without the markers taking over the chart.
  - 'Theme tokens reach the title, axis titles, tick labels and legend text. All text
    reads cleanly on #FAF8F1 and #1A1A17, and the data colors are the same in both
    renders.'
  - 'Native interactivity in the HTML output: value_formatter gives one-decimal tooltips
    for each point.'
  weaknesses:
  - 'VQ-07 (both): the y-guide grid lines are drawn near-black (#111110 in light,
    #010101 in dark) instead of the theme ink at about 15 % opacity. On #1A1A17 they
    are almost invisible (dark on dark), and on #FAF8F1 they stand out more than a
    subtle grid should → rgba(26,26,23,0.15) light / rgba(240,239,232,0.15) dark.
    Likely cause: Style() sets no guide_stroke_color / major_guide_stroke_color, so
    pygal falls back to its default dark guide stroke.'
  - 'SC-02 (both): all three series use circle markers that differ only in fill and
    outline (filled, ring, dashed ring). The Notes and the spec''s characteristic
    bullet ask for a different marker shape per series → give each series its own
    shape (for example circle, square, triangle) and keep the filled/unfilled treatment
    as an extra distinction. Likely cause: pygal Line dots are circles only; a custom
    marker needs the per-value node/SVG override (or a Style/CSS change), not just
    stroke and fill.'
  - 'VQ-03 (both): the legend shows solid color squares for every series, so it does
    not show the hollow and dashed-ring treatments that tell Sensor B and C apart
    on the chart → the legend glyphs should match each series'' marker treatment.
    Likely cause: pygal draws legend boxes from the series color only; the per-value
    node styles never reach the legend.'
  - 'DQ-02 (both): the series are labelled ''Sensor A'', ''Sensor B'', ''Sensor C'',
    which reads as generic → name concrete sensors or sites (for example ''Greenhouse'',
    ''Warehouse'', ''Rooftop''). Likely cause: the SENSORS label list.'
  - 'Suggestion: the legend spreads over three wide columns far below the ''Month''
    title. A tighter legend set closer to the plot would close the empty band at the
    bottom.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across canvas and plot area.
      Chrome: title "line-markers · python · pygal · anyplot.ai" centered at top (~40% width); y-axis title "Temperature (°C)", x-axis title "Month"; y ticks 13.0–27.0, x ticks Jan–Dec; legend at bottom with three color squares (Sensor A/B/C). All text is dark ink and readable. Horizontal dotted y-guides are near-black (#111110), stronger than a subtle grid.
      Data: three lines with a marker on every month. Sensor A in #009E73 with filled dots, Sensor B in #C475FD with hollow rings, Sensor C in #4467A3 with dashed rings. Sensor A peaks at about 27.3 in Apr and falls to about 15 in Sep; Sensor B dips to about 12.3 in Aug; Sensor C rises to about 25.3 in Nov. A and B coincide near Oct.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, axis titles, tick labels and legend text in light ink, all readable, no dark-on-dark text. The dotted y-guides are drawn near-black (#010101) and almost vanish on the dark surface.
      Data: line and marker colors identical to the light render (#009E73, #C475FD, #4467A3); the inner fills of the rings follow the page color. Brand green stays clearly visible.
      Legibility verdict: PASS (text). The grid is nearly invisible: chrome defect, not a text defect.
