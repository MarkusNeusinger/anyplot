review:
  strengths:
  - Native go.Scatter mode="lines+markers" with one marker symbol per series (circle,
    square, diamond) on the Imprint colors, so the three sensors read apart by shape
    as well as color in both renders
  - Markers carry a thin page-colored outline (marker.line color=PAGE_BG), which keeps
    each symbol separate where Sensor B and Sensor C cross at hours 5 and 11 in both
    themes
  - Marker size 10 against a 2.5 px line keeps markers and lines in proportion, with
    every one of the 15 points per series a distinct symbol
  - Custom hovertemplate per trace gives sensor, time and a one-decimal temperature
    in the HTML view
  - 'Adaptable structure: column constants with role comments, a single Data block
    binding df, and one loop over SENSORS drives every trace'
  weaknesses:
  - 'Suggestion: the x zero line at hour 0 draws a heavy INK_SOFT vertical through
    the first data column; zeroline=False on the x axis would leave the axis line
    alone as the frame.'
  - 'Suggestion: named sensor locations (for example ''Lab bench'', ''Window'', ''Server
    rack'') would give the three series more context than letters.'
  image_description: |-
