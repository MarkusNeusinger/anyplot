review:
  strengths:
  - Distinct marker shape per series (circle, square, triangle) taken from a MARKERS
    constant in palette order, so the three stations separate by shape as well as
    by color, as the Notes ask
  - 'Markers at 8 pt on 2.2 pt lines with a 1.2 pt page-colored edge: they stand out
    against their line and stay readable where the Inland and Mountain series cross
    (days 5-7, 13-14)'
  - Every data point sits on its (day, temperature) value; lines sorted by x per group
    with df.groupby(sort=False) in data order
  - 'Theme tokens threaded through title, labels, ticks, spines, grid and legend frame:
    both renders read cleanly with identical Imprint data colors'
  - Integer day ticks via MaxNLocator(integer=True) line up one tick with each observation;
    constrained layout keeps the exact 3200x1800 canvas without bbox_inches
  weaknesses:
  - 'Suggestion: unfilled markers for one series (markerfacecolor set to PAGE_BG)
    would add the filled-vs-unfilled distinction the Notes mention where Inland and
    Mountain overlap.'
  - 'Suggestion: the station names could be concrete (for example a named coastal,
    valley and alpine station) to make the scenario less generic.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across figure and axes.
      Chrome: bold dark title "line-markers · python · matplotlib · anyplot.ai" at ~54% of the width; axis titles "Day" and "Temperature (°C)" in INK; tick labels 1-14 and 6-22 in INK_SOFT; subtle horizontal grid only; top/right spines removed; legend "Weather station" upper left on an elevated frame. All text readable.
      Data: three lines with markers on all 14 days - Coastal #009E73 circles (18-21.6 °C), Inland #C475FD squares (13 down to ~7 °C), Mountain #4467A3 triangles (9.4 down to 5.8 °C); Inland and Mountain cross around days 5-7 and 13-14, markers touching there but distinguishable by shape.
