  - 'VQ-03 (both): size-18 markers in the line''s own color at alpha 0.85 with no
    outline barely stand out from the 4 px lines → larger markers with a contrasting
    outline. Likely cause: scatter size=18, color equal to the line color.'
  - 'DQ-02 (both): stations labelled Station A–C read generic → named stations. Likely
