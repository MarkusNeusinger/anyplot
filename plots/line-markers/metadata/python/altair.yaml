  - 'VQ-02 (both): the legend title ''Batch'' is drawn flush on the legend frame''s
    left stroke, its ''B'' touching the border → at least 4 px of padding inside the
    frame. Likely cause: configure_legend has strokeColor/fillColor but no padding
    (e.g. padding=6, titlePadding).'
  - 'DQ-03 (both): Quality (%) readings reach about 101 % (Batch C at t=6, Batch B
    at t=9), above the 100 % a quality percentage can hold → all values at or below
    100 % (about −1 %). Likely cause: unbounded rng.normal noise around means of 98.8-99.5
    %; clip at 100 or lower the means.'
  - 'Suggestion: a tooltip with batch, time and quality on the points would add value
    to the HTML view.'
