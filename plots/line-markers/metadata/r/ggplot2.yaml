  strengths:
  - 'Correct Imprint palette (brand green #009E73 first series) with distinct marker
    shapes (circle vs triangle) giving CVD-safe redundant color+shape coding'
  - 'Clean theme_minimal-based chrome: horizontal-only gridlines, no axis ticks, generous
    whitespace, both themes fully readable with no clipping'
  - Exact canvas size (3200x1800 landscape) and correctly themed backgrounds in both
    renders
  - Realistic, neutral quality-control dataset (machined part diameter across two
    production lines/16 shifts) with plausible noise and scale
  - 'Idiomatic ggplot2 code: geom_line + geom_point using fillable shapes 21/24 with
    fill=PAGE_BG for a hollow-marker effect, reproducible via set.seed(42), correct
    ragg::agg_png save'
  weaknesses:
  - Both series use the same hollow/open marker treatment (fill=PAGE_BG) — differentiation
    relies solely on shape+color; consider a filled marker for one series per the
    spec's 'filled vs unfilled' suggestion for extra visual distinction
  - No annotation or emphasis calls out the notable crossover around shift 6 where
    the two lines converge — a small callout would strengthen the data storytelling
  - Legend sits with a fair amount of empty vertical space between it and the title
    before the panel starts — could tighten slightly for a more polished look
