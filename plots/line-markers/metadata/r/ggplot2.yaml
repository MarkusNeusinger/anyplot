review:
  strengths:
  - First-series brand green (#009E73) and theme-adaptive chrome verified correct
    via pixel sampling in both plot-light.png (#FAF8F1 bg) and plot-dark.png (#1A1A17
    bg)
  - 'Clean theme_minimal styling: no boxed panel/spines, subtle y-axis-only gridlines,
    generous margins, legend placed top-center close to the plot'
  - Distinct marker shapes (circle vs. triangle) give redundant shape encoding on
    top of color, which is good for CVD accessibility
  - Realistic, neutral quality-control scenario (machined part diameter readings across
    two production lines) with plausible mm-scale tolerances
  - All font sizes explicitly set (base_size, axis.title, axis.text, plot.title, legend.text);
    both renders fully legible with no overlap or clipping
  weaknesses:
  - The crossover callout (annotate 'point' shape=1 ring + annotate 'text' "Lines
    converge" at shift=6) never appears in either render — confirmed via pixel-level
    inspection of both plot-light.png and plot-dark.png at the shift=6 crossing point,
    only the two regular series markers are visible with no extra ring or gray text
    nearby. Fix the layer so it actually paints on top, or remove the dead annotation
    code.
  - 'scale_fill_manual(values = c(IMPRINT_PALETTE[1], PAGE_BG)) intends Line A''s
    circle markers to render solid-green-filled versus Line B''s hollow triangles,
    but pixel sampling shows BOTH series render as hollow outlines with background-colored
    interiors (marker center reads exactly #FAF8F1 in light / matches bg in dark)
    — the fill mapping has no visible effect. Either fix the fill scale so Line A
    markers are visibly solid, or drop the unused fill aesthetic.'
  - Second series color skips Imprint canonical position 2 (#C475FD lavender) and
    jumps to position 3 (#4467A3 blue) with no semantic justification — production-line
    categories carry no inherent color association, so a 2-series chart should use
    canonical positions 1 and 2.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 (verified by pixel sample at (50,50) = rgb(250,248,241)).
      Chrome: Title "line-markers · r · ggplot2 · anyplot.ai" top-left in dark ink; legend "Line A" / "Line B" centered above the plot; axis titles "Inspection Shift" (x) and "Part Diameter (mm)" (y) in dark ink; tick labels in softer gray; subtle horizontal gridlines only (no vertical gridlines). All readable against the light background.
      Data: Two series across 16 inspection shifts. Line A (green, circle markers) starts near 25.00, dips to ~24.965 at shifts 2-3, crosses Line B around shift 4-6, then climbs steadily to ~25.105 by shift 16. Line B (blue, triangle markers) starts near 25.03, declines through the crossover, then oscillates lower (~24.92-24.96) through the rest of the series. Both marker types render as hollow outlines (green ring / blue ring) with background-colored interiors rather than the solid-green fill the code's scale_fill_manual intends for Line A — verified by pixel sampling at marker centers (returns exact background color, not #009E73). Border colors confirmed as #009E73 (Line A) and #4467A3 (Line B) via pixel sampling. The "Lines converge" annotation described in the source code (open ring + text label at the shift-6 crossover) is NOT visible anywhere near that point in the render.
      Legibility verdict: PASS (no readability issues; the annotation absence is a content bug, not a legibility bug)

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 (verified by pixel sample at (50,50) = rgb(26,26,23)).
      Chrome: Same layout as light render; title/axis text render in light ink (#F0EFE8, verified by pixel sample), tick labels in softer light gray. All text clearly readable against the dark background — no dark-on-dark failures observed.
      Data: Data colors identical to the light render — Line A green (#009E73) and Line B blue (#4467A3) borders confirmed unchanged. Same hollow-marker rendering and same missing crossover annotation as in the light render (checked at the equivalent shift=6 pixel region).
      Legibility verdict: PASS (no dark-on-dark text; same content-bug caveat as light render)
