review:
  strengths:
  - Iterative DFS spanning tree over ring/sector cells guarantees exactly one route
    from the outer entry gap to the center opening, reproducible with set.seed(42)
  - 'Walls, text and ring tints all come from theme tokens, so both renders read correctly;
    the goal disc keeps #009E73 in both'
  - Interior walls at one consistent 0.9 linewidth with a heavier 1.3 outer frame
    and round line ends, as the Notes allow
  - Corridors are wide enough to trace with a pencil, with long curved runs and many
    dead ends
  weaknesses:
  - 'VQ-05 (both): the maze spans only about two thirds of the square canvas, leaving
    empty bands between the title and the outer wall and between START and the caption
    → draw the maze larger so the margins hold only title, START and caption. Likely
    cause: extent = OUTER_R * 1.20 together with the title and caption margins.'
  - 'CQ-01 (code): four helper functions (ring_in, ring_out, sec_angle, append_seg
    with <<- accumulation) break the linear imports → data → plot → save structure
    → inline the radius/angle arithmetic and collect segments with a vector/list instead
    of a closure. Likely cause: helpers kept for geometry readability.'
  - 'Suggestion: use more sectors in the outer rings than near the center so outer
    cells are not much longer than inner ones.'
  image_description: |-
