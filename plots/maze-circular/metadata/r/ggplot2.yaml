      Data: 7 concentric rings, 12 sectors, near-black walls (0.9) with a heavier outer frame (1.3); even rings tinted #EDEAE0; entry gap between 6 and 5 o'clock; green #009E73 goal disc with a small page-colored star inside a center ring that opens toward the upper right.
