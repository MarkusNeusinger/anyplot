review:
  strengths:
  - A randomized recursive backtracker carves a spanning tree over all 139 cells (hub,
    then 6/12/24/24/24/48 sectors), so exactly one route leads from the entry to the
    center, as the spec requires
  - Rings subdivide adaptively (6 → 12 → 24 → 48 sectors) so the cells stay close
    to square, which keeps the corridors evenly wide and easy to trace with a pen
    in every ring
  - 'Highcharts renderer used in a chart.events.load hook: SVG arc commands draw the
    ring walls, and Highcharts.color().brighten() with a radialGradient fill gives
    the goal hub its depth'
  - 'Theme tokens throughout: walls in t.ink flip from near-black on #FAF8F1 to off-white
    on #1A1A17, START stays brand green #009E73 and the goal stays Imprint position
    2 in both renders'
  - Heavier outer perimeter (5 px against 3.5 px interior walls) with one gap, a faint
    green tint on the entry cell and a START tick make the entry unmistakable without
    drawing the solution
  weaknesses:
  - 'CQ-05 (code): the chart config lacks `palette: { colorScheme: t.theme }` and
    `plotOptions.series.animation: false`, both mandated by the Highcharts library
    prompt; unpinned, the HTML''s default-colored elements follow the viewer''s OS
    dark-mode setting → add both keys to the Highcharts.chart options. Likely cause:
    the script predates the Highcharts 13 colorScheme rule.'
  - 'CQ-01 (code): seven helper functions (rand, cellKey, edgeKey, neighbors, point,
    cellAngles, wedgePath) where several are one-line expressions used in a few places
    → inline cellKey/edgeKey/point/cellAngles and wedgePath (used once) into the drawing
    loops, keeping only the PRNG and neighbor logic the backtracker needs. Likely
    cause: a function-per-concept structure instead of the flat data → plot script.'
  - 'Suggestion: expose the spec''s `difficulty` parameter (for example a sector-count
    or ring-count choice per level) so the ''medium'' configuration is named in the
    code.'
  - 'Suggestion: point the START tick along the exact center of the perimeter gap
    at the top (angle -90°) so it reads as vertical instead of slightly tilted.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white #FAF8F1 across the full 2400x2400 square canvas.
      Chrome: Title "maze-circular · javascript · highcharts · anyplot.ai" in dark ink, bold 27px, centered at the top (~53% of the width). "START" in brand green above a short green tick at the perimeter gap (top), "GOAL" in dark ink above the center hub. No axes, grid or legend (expected for a maze).
      Data: Seven concentric rings with near-black walls (3.5 px interior, heavier 5 px outer perimeter), radial walls dividing the rings into 6/12/24/24/24/48 sectors, gaps forming passages. The entry cell has a faint #009E73 tint; the goal is a small lavender (Imprint position 2) circle with a radial gradient at the center.
      Legibility verdict: PASS — all text and walls read clearly; no light-on-light elements.

    Dark render (plot-dark.png):
      Background: Warm near-black #1A1A17.
      Chrome: Title and GOAL in off-white ink, START in brand green; all readable, no dark-on-dark text.
      Data: Identical maze geometry with off-white walls; the START tick, entry tint and goal circle keep the same Imprint colors as in the light render (only the walls and chrome flip).
      Legibility verdict: PASS — strong wall/corridor contrast, all text legible.
