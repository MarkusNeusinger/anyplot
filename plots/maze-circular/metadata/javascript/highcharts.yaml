review:
  strengths:
  - 'Correct maze algorithm: a randomized recursive backtracker builds a perfect spanning
    tree over every ring cell, guaranteeing exactly one solvable path from entry to
    goal per the spec.'
  - 'Theme-adaptive chrome is fully correct: wall geometry and the goal marker are
    pixel-identical between light and dark renders, only background/ink/wall color
    flip via ANYPLOT_TOKENS; passes the theme-readability check in both renders with
    no dark-on-dark or light-on-light failures.'
  - 'Distinctive Highcharts renderer usage: a native radial gradient (Highcharts.color().brighten())
    gives the goal hub subtle raised depth, low-level SVG path drawing renders the
    rings/radial walls/perimeter, and a soft translucent wedge highlights the entry''s
    first step.'
  - 'Clear wayfinding: START and GOAL are explicitly labeled with palette-correct
    accent colors (brand green #009E73 for entry, secondary palette color for goal),
    and the outer perimeter has a deliberate gap plus a tick mark at the entry point.'
  - 'Square canvas correctly reserved: the titleClearance offset recenters the maze
    below the title with no overlap or clipping in either theme.'
  weaknesses:
  - 'The spec''s `difficulty` parameter (which should affect passage density: ''easy''/''medium''/''hard'')
    is not implemented or reflected anywhere in the code — only a single fixed-density
    perfect maze is generated. Consider varying dead-end branching frequency, loop-back
    edges, or ring/sector granularity based on a difficulty setting.'
  - Wall thickness is intentionally inconsistent between interior walls (3.5px) and
    the outer perimeter (5px) — the spec explicitly asks for 'consistent' wall thickness
    suitable for pen/pencil solving. The heavier perimeter is a defensible print convention
    but is a direct spec deviation worth calling out.
  - The generator leans on several small helper functions (cellKey, edgeKey, neighbors,
    point, cellAngles, wedgePath) for the procedural maze — necessary for the recursive-backtracker
    algorithm, but it reduces KISS simplicity relative to a typical anyplot chart
    snippet.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1), consistent with the Imprint light surface.
      Chrome: Title "maze-circular · javascript · highcharts · anyplot.ai" in dark ink at top center, comfortably ~55% of plot width. "START" label in brand green above a short green tick mark, with a faint green-tinted wedge marking the first step. "GOAL" label in dark ink above the center hub.
      Data: Maze walls (rings + radial spokes) drawn in dark ink; goal marker is a small purple/lavender circle with a subtle radial gradient for depth.
      Legibility verdict: PASS — all text and wall geometry read clearly against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17), consistent with the Imprint dark surface.
      Chrome: Title, "START", and "GOAL" labels render in light ink / brand green, fully legible. Maze walls are drawn in light ink (correctly inverted from dark ink in the light render).
      Data: Goal marker (purple gradient circle) is pixel-identical in color, size, and position to the light render — confirming data colors do not shift between themes, only chrome.
      Legibility verdict: PASS — no dark-on-dark failures; all text and wall lines stand out clearly against the near-black background.
