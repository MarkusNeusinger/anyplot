review:
  strengths:
  - 'Correct, elegant Theta-maze construction: a randomized recursive backtracker
    builds a spanning tree over the ring/sector cell graph, guaranteeing exactly one
    solvable path as the spec requires.'
  - Clean, minimalist print-style aesthetic — a monochrome ink maze with only two
    semantic accent colors (green START, lavender GOAL), which reads as a deliberate
    design choice rather than a library default.
  - 'Fully theme-adaptive: walls, text, and background correctly flip between light
    and dark (t.ink, t.pageBg), while the two accent colors stay pixel-identical across
    themes per the Imprint palette contract.'
  - Well-balanced canvas utilization (maze diameter ~82% of the square canvas) with
    generous, even margins and no clipped elements.
  - Deterministic, self-contained data generation (fixed-seed LCG, no network/CDN
    calls) matching the browser-runtime constraints for JS libraries.
  weaknesses:
  - 'Design Excellence is only ''good default'', not exceptional: the plot is correct
    and clean but doesn''t add extra visual hierarchy or refinement beyond the base
    maze render (e.g. varied stroke weight between perimeter and interior walls, or
    a subtle finishing touch around START/GOAL).'
  - Data Storytelling is limited to the inherent start-to-center geometry; there's
    no additional visual emphasis (e.g. a faint highlighted first step, or a short
    caption) that would push the puzzle's narrative further.
  - Library Mastery relies entirely on the low-level SVG Renderer (path/circle/text)
    rather than any native Highcharts series/plotOptions — a legitimate and arguably
    necessary approach given there is no built-in maze series, but it means no Highcharts
    chart-level features (tooltip, tick/axis system, tooltip formatter, etc.) are
    demonstrated.
  - 'Code Quality: several helper functions (cellKey, edgeKey, neighbors, point, cellAngles)
    are used rather than a flat imports->data->plot script; justified by the algorithmic
    complexity of maze generation, but it''s a step away from the KISS ideal used
    for simpler chart types.'
  - Title text fills only ~35-40% of the square canvas width — well under the usual
    50-70% guidance; not a legibility defect, but there is room to size it slightly
    larger for the square format.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "maze-circular · javascript · highcharts · anyplot.ai" in bold dark ink at the top, clearly readable. "START" label in green above a short green tick mark at the top of the outer ring, where a gap in the perimeter marks the entry. "GOAL" label in dark ink above a lavender dot at the center hub. All maze walls (concentric arcs + radial spokes) render as dark ink lines with rounded caps against the cream background.
      Data: The "data" here is the maze topology itself — a fully connected spanning tree of 7 concentric rings subdivided into sectors, rendered as dark ink walls with one accent-green entry marker and one accent-lavender goal marker (palette[0] and palette[1] respectively). No other stray colors.
      Legibility verdict: PASS — title, START, and GOAL labels are all clearly legible against the light background; no light-on-light text.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title, START, and GOAL labels, now rendered in light ink (title/GOAL text) and the same green (START text/line) against the dark background. Maze walls now render as light/near-white ink lines against the dark background — correctly flipped chrome.
      Data: Green START marker and lavender GOAL dot are pixel-identical in hue to the light render — only the ink/background chrome inverted, confirming the Imprint palette data-color-identity rule.
      Legibility verdict: PASS — no dark-on-dark failures; title and labels are clearly visible light-on-dark, and the wall lines are equally crisp as in the light render.
