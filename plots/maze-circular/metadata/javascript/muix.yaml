review:
  strengths:
  - The carve is a randomised Prim's spanning tree over a hub plus 7×12 ring cells,
    so there is exactly one route from the entry to the goal and no cell is sealed
    off; the entry is chosen as the outer cell farthest from the hub along the passages,
    which gives the longest route (21 cells, stated in the subtitle)
  - 'Uses MUI X composition idiomatically: ChartsContainer with hidden linear axes
    (position: ''none'', reversed y) gives a 1:1 coordinate space, and the Maze child
    reads useXScale/useYScale to draw the arcs and radial walls as SVG paths'
  - 'Walls are drawn in t.ink with one 3.5 px interior stroke and a heavier 5.5 px
    outer boundary with round caps: near-black on #FAF8F1 in light for print, near-white
    on #1A1A17 in dark, with strong contrast in both'
  - 'The entry arrow and GOAL disc use brand green #009E73 in both themes; the arrow
    sits outside the outer wall and the disc stays inside the hub cell, so neither
    marker blocks a corridor, and GOAL is set in #1A1A17 on green for contrast in
    both themes'
  - Difficulty is a real parameter (the chance of extending the newest passage), and
    the layout reserves room only on the side that holds the START label while keeping
    one px-per-unit on both axes so the circle stays round
  weaknesses:
  - 'CQ-01 (code): lines 116–128 define two helper functions, fitUnit and viewRange,
    for a one-off layout calculation (the Maze component itself is required for the
    scale hooks) → inline the computation at module level or use a fixed symmetric
    x/y range with a margin for the START label. Likely cause: the auto-fit for the
    label side was written as reusable helpers.'
  - 'Suggestion: more sectors in the outer rings (for example 12 → 24 from ring 4)
    would narrow the very wide outer cells and make the puzzle more even to trace.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the square 2400×2400 canvas.
      Chrome: the bold near-black title "maze-circular · javascript · muix · anyplot.ai" is centred at the top, with a soft grey subtitle "7 rings × 12 sectors · medium difficulty · seed 42 · one 21-cell route from START to GOAL". There are no axes or grid (permitted). All text is readable.
      Data: a circular maze of 7 concentric rings around a central hub, with 12 sectors per ring. Interior walls are thin near-black arcs and radial lines with one consistent stroke; the outer boundary is heavier. The outer wall has one gap at about 2 o'clock, marked by a brand-green #009E73 triangle pointing inward and a bold "START" label just outside. The centre holds a green #009E73 disc labelled "GOAL" in dark ink. Corridors are wide enough for a pen. The maze sits slightly left of centre to make room for the START label.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: the title is near-white, the subtitle a light grey, and START is in light ink. All are readable, with no dark-on-dark text. GOAL stays dark ink on the green disc, which reads well.
      Data: the walls flip to light ink with the same geometry and stroke widths. The green entry arrow and goal disc are identical to the light render; only the chrome and wall ink flip.
      Legibility verdict: PASS
