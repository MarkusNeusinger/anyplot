review:
  strengths:
  - 'Mathematically correct maze generation: a randomized Prim''s spanning tree over
    the ring/sector graph, verified to produce exactly one wall/passage split with
    a guaranteed single solvable path (no cycles).'
  - 'Excellent theme handling: chrome (page background, title) flips correctly between
    light/dark while the print-style maze ink stays identical, per the spec''s own
    "black walls on white background" requirement and matching established codebase
    precedent.'
  - Clear, well-marked entry (START tick + label) and goal (brand-green center disc),
    both legible in both themes with no edge clipping.
  - Deterministic, seeded generation for reproducibility.
  weaknesses:
  - The spec's difficulty parameter (passage density for easy/medium/hard) is not
    implemented or visually demonstrated — only a single fixed-density maze is shown.
  - 'Library Mastery is low: the ScatterChart component is used purely as a sized
    canvas via a single dummy point and a slots.scatter override, not for its actual
    charting/data-encoding capabilities.'
  - Design Excellence is solid but not exceptional — the plain black-bordered square
    frame around the circular maze feels slightly utilitarian.
  image_description: |-
