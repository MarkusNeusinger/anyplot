      Chrome: Title text flips to light/white, fully readable against the dark page. START label and tick remain black-on-cream within the maze panel, still fully legible since that panel stays light.
      Data: Maze wall colors and goal marker (#009E73) identical to the light render — no unintended color drift.
      Legibility verdict: PASS
