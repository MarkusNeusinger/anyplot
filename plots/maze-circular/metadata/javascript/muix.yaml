review:
  strengths:
  - Difficulty parameter is now genuinely wired into the maze generator (CONTINUE_BIAS
    biases Prim's frontier selection) and surfaced in the caption ('7 rings · medium
    difficulty'), fixing the attempt-1 weakness where difficulty had no visible effect.
  - 'Mathematically correct maze: a randomized Prim''s spanning tree over the ring/sector
    graph guarantees exactly one solvable path (no cycles), regardless of the difficulty
    bias.'
  - 'Excellent theme handling: chrome (page background, title) flips correctly between
    light/dark while the print-style maze ink stays fixed cream-on-black, matching
    the spec''s own ''black walls on white background for print-friendly output''
    requirement and the established crossword-basic precedent.'
  - Clear, well-marked entry (START tick + label) and goal (brand-green center disc),
    both legible in both themes with no edge clipping.
  - Rounded-corner frame (rx=20) is a real, if modest, visual-refinement improvement
    over the plain black-bordered square from attempt 1.
  - Deterministic, seeded generation (mulberry32) for reproducibility.
  weaknesses:
  - 'Library Mastery remains low: the ScatterChart component is still used purely
    as a sized canvas via a single dummy point plus a slots.scatter override, not
    for any of MUI X''s actual data-encoding/series capabilities — this attempt did
    not address that attempt-1 weakness.'
  - Only one difficulty tier (medium) is ever rendered — the parameter now affects
    generation and is labeled, but the catalog image still can't show how 'easy' or
    'hard' visually differ.
  - Design Excellence is solid but still short of exceptional — beyond the new rounded
    corners, the frame and wall styling remain fairly plain/utilitarian.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white #FAF8F1 page background; the maze's own "paper" panel (rounded-corner rect) is the same #FAF8F1 so it blends seamlessly into the page.
      Chrome: Title "maze-circular · javascript · muix · anyplot.ai" in dark ink at the top, clearly legible. START label (bold black) with a short diagonal entry tick sits just outside the circle at the gap in the outer wall. Caption "7 rings · medium difficulty" in soft ink at bottom-left is legible despite reduced opacity.
      Data: Maze walls drawn in black (#1A1A17) with rounded caps across 7 concentric rings and 12 sectors, forming a clean radial labyrinth. Goal marker at center is a solid Imprint brand-green (#009E73) disc with a thin cream stroke.
      Legibility verdict: PASS — no light-on-light text, no overlaps.

    Dark render (plot-dark.png):
      Background: Warm near-black #1A1A17 page background; the maze panel keeps its #FAF8F1 cream fill unchanged (intentional print-artifact exception per spec — "black walls on white background for print-friendly output" — matching the crossword-basic precedent), producing a "cream card floating on a dark canvas" effect.
      Chrome: Title text flips to light ink, fully readable against the dark page background. START label, entry tick, and caption remain black-on-cream inside the maze panel, still fully legible since that panel itself stays light in both themes.
      Data: Maze wall colors and the brand-green goal marker are pixel-identical to the light render — no unintended color drift between themes.
      Legibility verdict: PASS — no dark-on-dark text; the fixed-palette maze panel is a deliberate, spec-mandated exception rather than a theme-adaptation bug.
