review:
  strengths:
  - Randomised Prim's carve from the hub with a fixed-seed LCG builds a spanning tree
    over the cell graph, so exactly one route connects the entry to the goal, and
    the difficulty bias steers corridor length without breaking that guarantee
  - Entry is placed at the outer cell farthest from the goal along the carved passages
    (BFS), and the subtitle reports the resulting 21-cell route
  - Composes the maze inside ChartsContainer with hidden linear axes and draws it
    through the useXScale/useYScale hooks, so every wall sits in one equal-aspect
    unit-disc coordinate space
  - Consistent 3.5 px interior walls with round caps and a heavier 5.5 px outer boundary,
    drawn in the theme ink token; chrome flips correctly while the brand-green START
    arrow and GOAL disc stay identical across themes
  - START label anchors away from the circle based on the entry angle, so it never
    collides with the maze
  weaknesses:
  - 'VQ-05 (both): the maze diameter fills only about 72 % of the 1200 px canvas,
    leaving empty bands of about 240 px above and below it, because the 1.28 view
    extent reserved for the START label is applied on all four sides → about 85 %
    of the canvas (+13 %). Likely cause: the symmetric EXTENT = 1.28 for both axes;
    only the side holding the entry label needs the extra room.'
  - 'VQ-01 (both): the GOAL label at 14 CSS px and the subtitle at 15 CSS px fall
    to about 5 px in the 400 px thumbnail and blur → about 17-18 px (+3 to +4 px).
    Likely cause: fontSize={14} on the GOAL text and fontSize: 15 on the subtitle
    div.'
  - 'Suggestion: more sectors in the outer rings (doubling outward) would keep cell
    shapes closer to square, so the inner ring is less cramped and the outer corridors
    less elongated.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white cream (#FAF8F1), not pure white.
      Chrome: centred bold title "maze-circular · javascript · muix · anyplot.ai" in dark ink, a smaller soft-ink subtitle "7 rings × 12 sectors · medium difficulty · seed 42 · one route of 21 cells from the entry to the goal". No axes, ticks, grid or legend, as the spec permits. All text readable.
      Data: a circular maze of 7 concentric rings × 12 sectors drawn as near-black (#1A1A17) arcs and radial segments of one thickness, with a heavier outer boundary. The outer wall has one opening at about 2 o'clock, marked by a brand-green (#009E73) arrow and a bold "START" label outside the circle on the right. A brand-green disc labelled "GOAL" in dark ink sits in the central hub. Many dead ends and long curved corridors.
      Legibility verdict: PASS

