review:
  strengths:
  - Recursive-backtracker spanning-tree algorithm correctly guarantees exactly one
    solvable path from entry to goal, matching the spec's core requirement
  - Sector count doubles every other ring so corridor width stays visually consistent
    as circumference grows — a genuinely thoughtful geometry detail
  - Entry point (green, outer edge) and goal (blue, center) are unambiguous and clearly
    labeled in both themes
  - Data colors (brand green entry marker, blue goal marker, ink walls) are pixel-identical
    between light and dark renders; only chrome flips as required
  - Deterministic fixed-seed LCG makes the maze fully reproducible despite the browser
    having no seeded RNG
  - Clean use of Chart.js's own plugin lifecycle (afterDatasetsDraw + chartArea) to
    host a custom canvas drawing without reaching for an external plugin or a sibling
    library
  - Title fontsize scaling formula and mandated title string are both correctly implemented
  weaknesses:
  - 'Library Mastery is only moderate: the entire maze is drawn with raw Canvas 2D
    primitives inside one plugin hook, so Chart.js contributes little beyond canvas
    provisioning, theming and the title plugin — no chart.js-native rendering (scales,
    native drawing helpers) is actually exercised'
  - 'Tooltip and interactivity are fully disabled (tooltip: {enabled:false}), which
    is a missed opportunity for the HTML detail view — e.g. a hover affordance that
    highlights the solved path or reveals ring/sector indices would add real value
    without touching the static PNG'
  - 'Visual refinement is good but not exceptional: the maze disc has no subtle border/shadow
    separating it from the page background beyond the flat elevatedBg fill, and wall
    line joins are plain — a touch more polish (e.g. a hairline stroke around the
    disc, refined corner joins) would lift Design Excellence'
  - Label sizing (labelSize = minDim * 0.018) leaves a fairly small safety margin
    at mobile scale (~400px) for the START/GOAL captions — consider a slightly larger
    minimum to guarantee legibility when scaled down
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: title "maze-circular · javascript · chartjs · anyplot.ai" in dark ink, centered top, clearly readable. "START" caption in brand green at bottom-left, "GOAL" caption in blue directly under the center marker — both dark-on-light and fully legible. No axis/grid chrome present (none needed for this plot type).
      Data: seven concentric rings of black corridor walls on a very slightly lighter (elevatedBg) maze disc, radial walls subdividing each ring into sectors, a green diagonal tick marking the entry gap on the outer perimeter, and a filled blue disc at dead center marking the goal. Wall color reads as dark ink against the light disc.
      Legibility verdict: PASS.

    Dark render (plot-dark.png):
      Background: warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: title in light ink, START in brand green, GOAL in blue — all clearly readable against the dark background. No dark-on-dark text anywhere; every label uses a light or brand color against the dark disc/page.
      Data: same seven-ring maze structure, walls now rendered in light ink against the dark maze disc, entry tick still brand green, goal disc still the same blue as the light render — colors are identical to the light render, confirming only chrome flipped.
      Legibility verdict: PASS.
