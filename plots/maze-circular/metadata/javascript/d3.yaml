review:
  strengths:
  - 'Correct maze-generation algorithm: a growing-tree spanning tree over the polar
    cell graph guarantees exactly one solvable path from goal to any cell, satisfying
    the spec''s core requirement'
  - Clean, minimalist, print-friendly aesthetic — consistent wall thickness (stroke-width
    4) with rounded line caps, black walls on the theme background as the spec's note
    requests
  - Theme-adaptive chrome is correctly implemented — the green markers are pixel-identical
    between light and dark renders, and background/ink/inkSoft flip correctly with
    no dark-on-dark or light-on-light failures
  - Good canvas utilization (~83-85% of the 1200x1200 mount) with balanced margins
    for title and caption, no clipping at the canvas edge
  - Creative, idiomatic use of d3.arc() (innerRadius = outerRadius) to draw curved
    ring-wall segments — a genuinely D3-specific technique
  - Deterministic and reproducible via a fixed-seed LCG (seed=42)
  - Descriptive caption compensates for the absence of a traditional legend/axis labels,
    explicitly explaining what the green markers mean
  weaknesses:
  - The entry/start marker (short green radial tick just outside the outer boundary)
    is subtle — only ~4% of the maze radius — and nearly disappears at the 400px mobile
    thumbnail scale; make it more prominent (thicker stroke, small arrow/notch, or
    slightly longer tick) so it reads as clearly as the goal marker at a glance
  - Wall rendering uses raw `walls.append("path")` calls inside nested `for` loops
    instead of D3's idiomatic data-join pattern (`selection.data(wallData).join("path")`);
    it works correctly but doesn't leverage D3's recommended declarative binding —
    collect the wall descriptors (radial + ring segments) into an array first, then
    bind with `.data().join()`
  - 'Design Excellence is good but not yet publication-ready-exceptional: consider
    a slightly bolder focal treatment (e.g. a subtle color or weight cue distinguishing
    the true entry passage from the maze''s outer boundary) to push Data Storytelling
    further'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1-consistent), not pure white — matches the anyplot light-theme surface.
      Chrome: Title "maze-circular · javascript · d3 · anyplot.ai" in bold dark ink at the top, clearly readable; caption "7 rings · medium difficulty · green marks the goal (center) and start (outer edge)" in lighter ink-soft gray below the maze, clearly readable. Maze walls are solid black/dark-ink strokes with rounded caps, evenly weighted throughout.
      Data: A large circular maze of 8 concentric polar rows (7 outward rings plus the center goal cell) subdivided into radial sectors that roughly double in count moving outward to keep cells near-square. A green (#009E73) filled dot marks the goal at the center; a short green radial tick just past the outer boundary (upper-right, roughly 1-2 o'clock) marks the entry point. No other colors are used.
      Legibility verdict: PASS — all text is clearly readable against the light background; the maze itself reads cleanly with good contrast between walls and background.

    Dark render (plot-dark.png):
      Background: Warm near-black, not pure black — matches the anyplot dark-theme surface.
      Chrome: Title and caption both render in light ink tones (light text on dark background), fully legible with no dark-on-dark failures. Maze walls are light-colored strokes against the dark background, same weight and rounded caps as the light render.
      Data: Identical maze geometry and identical green (#009E73) markers for goal (center) and entry (outer edge, same position) as the light render — confirms data colors are unchanged between themes and only chrome (background, wall stroke color, text) flipped.
      Legibility verdict: PASS — all text and maze walls remain clearly readable against the dark background; no unreadable or dark-on-dark elements observed.

    Additional check (400px mobile thumbnail, both themes): the maze remains legible with individual wall segments still distinguishable at typical mobile widths, though the outer-ring entry tick becomes very small and easy to miss — flagged as a weakness above. Caption text is small but still legible at 400px.
