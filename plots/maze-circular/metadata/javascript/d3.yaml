      Data: A circular maze of 8 concentric rings subdivided into radial sectors, with the outer perimeter as a full circle broken only at one gap (the entry). A solid green (#009E73) dot marks the center goal, and a solid green triangular arrow points inward at the outer-edge entry gap. No other colors present.
