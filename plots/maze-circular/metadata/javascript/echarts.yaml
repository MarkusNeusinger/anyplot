review:
  strengths:
  - 'DIFFICULTY is now functionally implemented: a RING_MOVE_WEIGHT bias (inward/lateral/outward)
    steers the randomized-DFS spanning tree so ''easy'' favors short direct paths
    toward the center and ''hard'' favors long winding paths, fixing the prior attempt''s
    cosmetic-only difficulty label.'
  - 'CQ-01 improved: the one-line polar() helper was inlined at both call sites, reducing
    indirection while the remaining helpers (cellId, neighborsOf, ringOf, arcPoints)
    stay justified by genuine graph/geometry complexity.'
  - 'Layout rebalanced: the grid''s top/bottom split (170/130) now centers the maze
    in the square canvas -- the previous excess whitespace below the circle is gone,
    with the maze''s mathematical center now within ~20px of true canvas center.'
  - 'Still genuinely novel: a hand-built circular maze rendered through an ECharts
    custom series with api.coord() for pixel-precise polar-to-cartesian mapping, with
    the spanning-tree construction correctly guaranteeing exactly one solution.'
  - 'Clean Imprint theming carries through unchanged: GOAL hub and START arrow/label
    use brand green #009E73 identically in both themes, walls use theme-adaptive ink,
    backgrounds are correct #FAF8F1 / #1A1A17.'
  - Deterministic reproducibility via seeded mulberry32-style RNG (seed=42); GOAL
    label text color is tied to pageBg so it stays readable on the fixed green hub
    regardless of theme.
  weaknesses:
  - DE-03 (Data Storytelling) is still capped by the green START/GOAL accents alone
    -- a subtle radial gradient, ring-count callout, or dimmed-vs-highlighted solution
    path would push the 'navigate inward' narrative further.
  - Title spans only ~40% of the square canvas width at fontsize=22px -- not a deduction
    (readable, no overflow) but there is headroom to grow it slightly for stronger
    visual presence on the square format.
  - The DIFFICULTY fix is only exercised for 'medium' in this concrete scenario (medium
    uses equal inward/lateral/outward weights, so this attempt's rendered maze is
    structurally similar to the pre-fix version) -- the differentiation is real in
    code but not visually demonstrated by the single shipped example.
