review:
  strengths:
  - Genuinely novel, hand-built circular maze rendered via an ECharts custom series
    with api.coord() -- pixel-precise polar-to-cartesian mapping that few other libraries
    could replicate as cleanly.
  - Maze generation uses a randomized DFS (recursive backtracker) that carves a spanning
    tree, which mathematically guarantees exactly one solution from entry to goal
    -- correct and clearly documented in code comments.
  - 'Clean Imprint theming: GOAL hub and START arrow/label use brand green #009E73,
    walls use theme-adaptive ink -- identical data colors between light and dark,
    correct #FAF8F1 / #1A1A17 backgrounds.'
  - Deterministic reproducibility via a seeded mulberry32-style RNG (seed=42).
  - Entry arrow and GOAL hub are both clearly marked and legible in both themes; GOAL
    label text color is tied to pageBg so it stays readable on the fixed green circle
    regardless of theme.
  - Consistent 5px wall thickness throughout, with smoothly sampled arcs (6 steps
    per segment).
  weaknesses:
  - DIFFICULTY ("medium") is displayed in the subtitle but not functionally implemented
    -- the randomized-DFS spanning tree always produces the same loop-free structure
    regardless of difficulty, so the label doesn't actually control passage density.
    Consider adding a small number of extra random passages (removed walls, creating
    short loops) that scale with difficulty so 'easy' visibly differs from 'hard'.
  - 'CQ-01 (KISS Structure): the implementation leans on several small helper functions
    (cellId, neighborsOf, edgeKey, angleOf, ringRadius, polar, arcPoints) rather than
    a flat imports->data->plot script. The graph/geometry logic genuinely justifies
    some helpers, but a couple of the one-line ones (e.g. polar()) could be inlined
    to reduce indirection.'
  - There is noticeably more whitespace below the maze circle than above it within
    the square canvas -- tightening the grid's bottom margin slightly would balance
    the layout.
  - Data Storytelling (DE-03) is decent via the green GOAL/START accents but could
    go further -- e.g. a subtle radial gradient or ring-count callout to reinforce
    the 'navigate inward' narrative.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 -- not pure white, not dark.
      Chrome: Title "maze-circular · javascript · echarts · anyplot.ai" is bold dark ink, centered top, fully legible. Subtitle "7 rings · 12 sectors · medium difficulty · seed 42" in softer ink gray beneath it, also legible.
      Data: The maze itself is drawn as black/dark-ink concentric ring walls and radial dividers on the off-white surface -- consistent ~5px stroke throughout, smoothly sampled arcs. A brand-green (#009E73) circle marks the GOAL at the center with white "GOAL" text on top (readable, good contrast). A green triangular arrow labeled "START" in brand green sits just outside the outer ring at the entry gap, pointing inward.
      Legibility verdict: PASS -- all text (title, subtitle, GOAL, START) is clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 -- not pure black, not light.
      Chrome: Title and subtitle render in light ink (near-white / soft gray), clearly legible against the dark background. No dark-on-dark failures observed.
      Data: Maze walls now render in light ink (near-white) against the dark surface, same geometry as the light render. The GOAL circle and START arrow/label are identical brand green (#009E73) in both renders -- confirmed unchanged. "GOAL" text inside the green hub is now dark ink (tied to pageBg token), which still reads clearly against the green fill in this theme.
      Legibility verdict: PASS -- all text and wall lines are clearly readable against the dark background; no dark-on-dark issues; data colors (green accents) are identical to the light render, only chrome (walls, text, background) flipped as expected.
