      Data: The maze is drawn as dark-ink concentric ring walls and radial dividers on the off-white surface -- consistent ~5px stroke, smoothly sampled arcs, now visually centered in the square canvas with balanced whitespace above and below (fixed from the prior attempt's bottom-heavy margin). A brand-green (#009E73) circle marks the GOAL at the center with pageBg-colored "GOAL" text on top (readable, good contrast). A green triangular arrow labeled "START" in brand green sits just outside the outer ring at the entry gap, pointing inward.
      Legibility verdict: PASS -- all text (title, subtitle, GOAL, START) is clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 -- not pure black, not light.
      Chrome: Title and subtitle render in light ink (near-white / soft gray), clearly legible against the dark background. No dark-on-dark failures observed.
      Data: Maze walls now render in light ink (near-white) against the dark surface, identical geometry and layout balance to the light render. The GOAL circle and START arrow/label are identical brand green (#009E73) in both renders -- confirmed unchanged. "GOAL" text inside the green hub is dark ink (tied to the pageBg token), which still reads clearly against the green fill in this theme.
      Legibility verdict: PASS -- all text and wall lines are clearly readable against the dark background; no dark-on-dark issues; data colors (green accents) are identical to the light render, only chrome (walls, text, background) flipped as expected.
