review:
  strengths:
  - Maze generated as a DFS spanning tree over ring cells whose sector count grows
    outward, giving long curved corridors and many dead ends
  - 'Walls on theme ink tokens: near-black on the warm off-white page and cream on
    the near-black page, with a heavier outer circle'
  - START (Imprint green) and GOAL (Imprint lavender) labelled directly, the GOAL
    inside a center cell large enough to hold it
  - Wall weight mapped as data through scale_size_identity, coord_fixed keeps the
    rings circular, and the plot sits in a page-colored gggrid
  - HTML output adds layer_tooltips() on the markers and the ggtb() toolbar for zooming
    into the maze
  weaknesses:
  - 'SC-02 (both): the maze has loops: 164 openings between its 115 cells where a
    single-route maze has exactly 114 (+50), so there is more than one way from START
    to GOAL (spec: exactly one route, no second way through) → open only the 114 passages
    of the spanning tree. Likely cause: the arc-wall loop (lines 108–125) drops a
    ring''s whole outer arc for an inner sector when any one of its passages leads
    outward, which opens it to every outer sector it borders, and the int(sector*ratio)
    mapping (lines 63–72, 113–116) does not match the sectors'' real angular overlap
    when the counts are not multiples (6→8, 8→12, 12→16 …); draw the outer arc per
    overlapping (inner, outer) span and leave out only the span of the passage.'
  - 'SC-02 (both): the outermost ring''s radial walls (the heavy spokes at about 1,
    2, 4, 5, 7 and 11 o''clock and beside the entry) are drawn at the boundary weight
    3.0 while every other interior wall is 1.5, so the interior walls are not one
    consistent thickness → 1.5 for every radial wall, 3.0 only for the outer circle.
    Likely cause: lw = 3.0 if ring == num_rings in the radial-wall loop (line 141).'
  - 'Suggestion: a slightly larger START label would hold its own against the heavy
    outer boundary.'
  - 'Suggestion: an arrow or notch at the entry opening would tie START to the gap
    more visibly than the label alone.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 over the whole 2400x2400 canvas, no white strips.
      Chrome: centered title 'maze-circular · python · letsplot · anyplot.ai' in dark ink, clearly readable; no axes, ticks or grid (theme_void).
      Data: seven concentric rings of near-black walls with more sectors outward, a heavier outer circle (and heavier spokes in the outer ring), the entry gap at the bottom of the outer circle with a green #009E73 bold START label below it, and a lavender #C475FD bold GOAL label inside a center circle that holds it clear of the walls.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
