review:
  strengths:
  - Kruskal spanning tree with union by rank and a BFS route from the entry
  - Full theme-adaptive chrome with strong wall contrast in both themes
  - Entry gap clearly marked with a green dot and START callout
  weaknesses:
  - 'VQ-05 (both): canvas is 2228x2336, off the 2400x2400 square target (-172 x -64
    px). Likely cause: plt.savefig(..., bbox_inches=''tight''), which the seaborn
    prompt forbids.'
  - 'SC-02 (both): the center disc is drawn as a closed ring, so no corridor reaches
    the goal and the maze as drawn has no route from entry to center (C3) → leave
    the ring open where the spanning tree opens it. Likely cause: mpatches.Circle(...,
    edgecolor=INK) around the center.'
  - 'SC-03 (both): drawn walls do not match the generated passages — ring-to-ring
    walls are drawn as radial segments and sector walls as arcs, a second wall runs
    inside the frame, and the path crosses walls → draw ''radial'' (ring r to r+1)
    entries as arcs at the ring boundary and ''circular'' (sector) entries as radial
    segments, with the frame at the outermost ring. Likely cause: the two drawing
    loops test the swapped wall kind, and FRAME_R = OUTER_R + 0.04.'
  - 'SC-01 (both): a cyan ''Solution Path'' line traces the answer, turning the puzzle
    into a solved one; the Notes never ask for it → remove the path layer and its
    legend entry. Likely cause: the sns.lineplot(path_df) call.'
  - 'VQ-03 (both): the ''Goal (Center)'' legend glyph has a white line and edge (a
    white bar across the swatch in dark) unlike the plain red star → marker-only red
    star. Likely cause: plt.Line2D(..., color=''w'') without linestyle=''none''.'
  - 'VQ-07 (both): the marks after brand green take Imprint positions 5 (#AE3030)
    and 6 (#2ABCCD); the goal carries no bad/loss meaning → canonical next position
    #C475FD for the goal. Likely cause: GOAL_COLOR constant.'
  - 'CQ-01 (code): four helper functions (cell_id, find, union, cell_center) break
    the flat-script structure → inline the index arithmetic. Likely cause: helper-based
    maze code.'
  - 'Suggestion: a seaborn-native touch would give the library more presence than
    lineplot/scatterplot wrappers.'
