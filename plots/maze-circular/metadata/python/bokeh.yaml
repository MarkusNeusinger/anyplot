review:
  strengths:
  - Iterative recursive backtracker generates the maze from a seed, with difficulty
    mapped to ring count
  - 'Theme tokens thread through walls, title and annotation: ink walls on #FAF8F1
    and cream walls on #1A1A17, both in strong contrast'
  - 'Imprint palette used semantically: START in brand green #009E73, goal in Imprint
    position 5 #AE3030, identical in both themes'
  - match_aspect=True keeps the rings circular; outer boundary drawn heavier than
    the interior walls as the Notes allow
  - HoverTool tooltips on the START and GOAL renderers add native interactivity to
    the HTML output
  weaknesses:
  - 'SC-02 (both): the goal is unreachable: the central hub is drawn as a closed circle
    around the goal disk and no ring-0 cell ever has its inner wall opened, so no
    route leads from START to the centre (violates C3) → open one ring-0 sector into
    the hub and draw the hub circle with that gap. Likely cause: lines 153-155 draw
    ring_radii[0] as a full circle and the backtracker has no hub cell; also, each
    removed arc spans the whole inner sector (lines 127-134) and so opens up to two
    outer cells, which can add second routes → draw each arc per outer cell from its
    own ''inner'' flag.'
  - 'Suggestion: point the entry triangle inward through the boundary gap instead
    of outward, so it reads as ''enter here''.'
  image_description: |-
