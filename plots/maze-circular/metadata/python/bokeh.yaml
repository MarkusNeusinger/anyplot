      Data: 7-ring circular maze in near-black walls, heavier outer boundary with a gap at about 3 o'clock; green #009E73 triangle and bold green 'START' outside the gap; red #AE3030 goal disk with a dark star at the centre, enclosed by a closed hub circle.
