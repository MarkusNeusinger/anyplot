review:
  strengths:
  - 'Walls flip cleanly between INK on #FAF8F1 and light ink on #1A1A17 while the
    #009E73 goal stays identical in both themes'
  - 'Goal marked with a solid #009E73 dot plus a translucent halo and bold GOAL label,
    START label in bold muted ink at the opening'
  - coord_fixed(ratio=1) with theme_void keeps the rings truly circular with no stray
    axes
  - Inline depth-first generation from a fixed seed keeps the script flat and reproducible
  weaknesses:
  - 'SC-02 (both): the maze has loops, not exactly one route: the centre cell has
    no wall at r=1, so the goal opens onto all six ring-1 sectors, and ring 1 has
    radial walls at only two of its six angles (120° and 240°), so the goal is reachable
    around closed cycles; every arc opening also removes the whole inner-sector arc
    and connects to two or more outer cells → one passage per tree edge, opening only
    the arc piece shared by the two linked cells. Likely cause: arc_walls is indexed
    by the inner sector and cleared whole (arc_walls[ring][sector] = False / arc_walls[ring-1][ns]
    = False) instead of per inner/outer cell pair.'
  - 'SC-02 (both): interior walls come in two thicknesses, 0.45 in rings 0–2 and 0.9
    in rings 3–7, while the spec asks for one consistent interior thickness (only
    the outer boundary may be heavier) → one stroke size for every interior wall (0
    px difference). Likely cause: the walls_inner_df / walls_outer_df split with size=0.45
    vs size=0.9.'
  - 'SC-02 (both): the INK_SOFT entry-gate arc at r≈7.7 spans the whole entry opening
    just inside the outer boundary and reads as a wall across the entrance, leaving
    only thin slivers at its ends → mark the entry without a stroke across the corridor
    (the START label alone, or a marker outside the boundary). Likely cause: the entry_gate_df
    geom_segment layer at r_gate = radii[-1]*0.965.'
  - 'Suggestion: the stub wall from the goal dot to r=1 at 0° (ring 0''s single radial
    wall) adds a meaningless line inside the goal cell; skipping radial walls for
    the one-sector centre would clean it up.'
  image_description: |-
