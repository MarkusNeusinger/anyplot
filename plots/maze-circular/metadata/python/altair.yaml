review:
  strengths:
  - Kruskal union-find generation over ring/sector cells with a fixed seed gives a
    reproducible maze with long curved corridors and many dead ends
  - detail+order encoding on mark_line draws hundreds of disconnected wall polylines
    from one tidy table — the idiomatic Altair answer
  - 'Theme handling is clean: walls and title flip with the theme while the blue entry
    and red goal markers stay identical'
  - Entry marker position is derived from the gap in the outer boundary, so START
    and its arrow always sit over the opening
  weaknesses:
  - 'VQ-05 (both): the canvas is 2440x2520, neither 3200x1800 nor 2400x2400 → 2400x2400
    (−40 × −120 px). Likely cause: .properties(width=600, height=600) without autosize
    fit, so title and padding grow the canvas past 600x600 × 4.'
  - 'SC-02 (both): the maze has more than one route to the goal — no wall closes the
    center, so the star is open to all 12 innermost sectors, and every opened ring
    arc spans a whole inner sector, so it opens onto two outer cells where the spanning
    tree counted one; both add loops, against C3 (''exactly one route … no second
    way through'') → exactly one opening into the center and one opening per removed
    ring wall. Likely cause: the radial walls start at r=0.3 with no wall circle there,
    and the ring arcs are cut on the inner ring''s sector grid (`ring_theta`) instead
    of over the outer cell `outer_sector` chosen in the Kruskal step.'
  image_description: |-
