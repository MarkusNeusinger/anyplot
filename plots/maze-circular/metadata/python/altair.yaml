      Data: near-black walls — 7 concentric ring arcs with gaps and radial sector walls, outer boundary heavier (4 px) than interior (2.5 px); a red ★ on a translucent red halo at the center. No data series, so no first-series green applies; markers use Imprint blue (#4467A3) and red (#AE3030)
