review:
  strengths:
  - Fibonacci sector progression (5, 8, 13, 21, 34, 34) gives naturally varied cell
    widths across the rings
  - 'Clean theme adaptation: walls INK on both surfaces (near-black on cream, near-white
    on near-black), accents identical in both renders'
  - Elevated corridor disc plus 5 % alternating ring bands separate the rings quietly
  - 'Idiomatic matplotlib geometry: Arc segments with theta1/theta2, Wedge rings and
    a batched LineCollection for radial walls'
  weaknesses:
  - 'SC-02 (both): the inner boundary at r = 0.5 is drawn as a full 360° arc, so the
    goal ring has no opening and the maze cannot be solved from START to GOAL (spec
    C3) → leave one gap in that arc at the sector the generator connects to the goal.
    Likely cause: the ''Inner boundary and goal'' Arc with theta1=0, theta2=360.'
  - 'DQ-01 (code): the ''Modified Prim''s'' generator does not produce a perfect maze,
    so exactly one route is not guaranteed despite the comment → a spanning-tree carve
    (Prim or recursive backtracker) where every accepted edge removes exactly the
    wall between the two cells it joins. Likely cause: the inward frontier entry (r-1,
    inner_s, ''radial'', r-1, inner_s) opens radial wall inner_s without linking (r,
    s); min(s, src_s) picks wall 0 instead of n-1 on the wrap-around, so the 0° radial
    wall is never opened; a ring passage removes the whole inner-sector arc, which
    spans up to three outer cells.'
  - 'VQ-04 (light): the START label in lavender #C475FD on #FAF8F1 reads at about
    2.6:1 contrast at 8 pt → a stronger marker, for example INK text with a lavender
    or green entry arrow, at 4.5:1 or better. Likely cause: color=ENTRY_COLOR on the
    START text.'
  - 'Suggestion: an arrow or notch at the entry gap would mark the opening itself,
    not only the label beside it.'
