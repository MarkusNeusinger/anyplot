review:
  strengths:
  - 'Theme tokens threaded through every element: ink walls on #FAF8F1 in light and
    light walls on #1A1A17 in dark, both at full contrast and print-friendly'
  - Outer boundary drawn one step heavier than the consistent 3 px interior walls,
    as the Notes allow
  - 'Entry arrow and START label in #009E73 sit clear of each other and of the maze;
    the green goal disc marks the center'
  - More sectors in outer rings (6 to 42) keeps corridor widths even across radii
  weaknesses:
  - 'SC-02, DQ-01 (both): the drawn walls do not form a single-route maze. An openings
    check of the drawn walls gives 36 independent loops among the 168 cells when every
    overlap counts as a passage; when the openings narrower than about 0.35 units,
    which the wall stroke closes, are treated as sealed, there are 7 disconnected
    regions and the center cannot be reached from the entry. Target: exactly one route
    from the entry to the center, with no loop (−36 loops). Likely cause: an outward
    DFS carve ("out") opens ring_walls[r-1][int(cs*SECTORS[r-1]/n)], which maps back
    to a different inner sector, and each opening is drawn as one narrow outer-sector
    arc that can straddle an inner radial wall. Carve and draw the openings from one
    shared outer→inner sector mapping.'
  - 'VQ-05 (both): the maze fills only about 46 % of the canvas width, and empty bands
    sit above and below it on the square canvas → about 60–70 % (+15 to +25 points).
    Likely cause: the axis range ±(OUTER_R + 4.5) adds 4.5 units of padding on every
    side.'
  - 'VQ-07 (both): the goal star is filled with #DDCC77, the amber warning anchor,
    outside its semantic role and outside the Imprint categorical pool → an Imprint
    or neutral token, for example the page color on the #009E73 goal disc. Likely
    cause: marker color "#DDCC77".'
  - 'CQ-04 (code): the BFS (lines 94–116) never reaches the innermost ring because
    the passage graph it builds (lines 76–92) is disconnected (165 edges for 168 cells),
    so `solution` is empty and the "Show Solution" trace draws a single point at the
    center → one cell map shared by the DFS carve, the graph and the drawing, so that
    the BFS path follows the drawn corridors. Likely cause: the inconsistent outer/inner
    sector mapping between the "out" carve and the graph construction.'
  - 'Suggestion: place the GOAL label next to the center marker rather than below
    the maze, so the label and the goal read as one.'
