review:
  strengths:
  - Kruskal's algorithm over the ring/sector graph builds a spanning tree, so the
    corridors form exactly one route between any two cells
  - Walls drawn at a consistent 10 px with rounded caps and joins, in near-black ink
    on the light page and near-white on the dark page
  - 'Entry marked in brand green #009E73 and goal in lavender #C475FD (Imprint positions
    1 and 2), identical in both themes'
  - Named pygal series ('Entry →', 'Goal ★') give the interactive HTML meaningful
    tooltips
  weaknesses:
  - 'SC-02 (both): the goal circle at r=0.10 is drawn as a closed wall with no opening,
    so the goal at the center is sealed off from ring 0 and the maze cannot be solved
    to the center (C3) → leave one sector of the goal circle open toward a ring-0
    cell. Likely cause: inner_arc spans the full 0–2π circle.'
  - 'SC-02 (both): the entry arrowhead''s wings run from the tip toward the center,
    so the mark reads as a fork pointing outward, and the wing ends reach about 0.08
    into the entry corridor (C2) → point the wings back outward from the tip so the
    arrow points inward and stays outside the boundary. Likely cause: wing angles
    use mid_angle + π ± 0.45.'
  - 'SC-02 (both): the goal star''s outer points (r=0.12) cross the goal-circle wall
    (r=0.10) into the ring-0 corridor (C2) → keep the star inside the goal circle
    (outer radius about 0.07). Likely cause: r_s = 0.12.'
  - 'VQ-03 (both): walls render at pygal''s default series opacity, so they read as
    gray instead of solid black (light) or solid near-white (dark), with darker dots
    where segments overlap (C4) → opacity 1. Likely cause: Style without opacity=''1''.'
  - 'VQ-05 (both): the maze diameter fills only about 64 % of the 2400 px canvas,
    leaving bands of about 400 px empty above and below → about 80 % (+16 %). Likely
    cause: xrange/range of ±1.25 around an outer radius of 0.88 plus an entry arrow
    reaching r=1.23.'
  - 'Suggestion: a slightly heavier outer boundary (the Notes allow it) would frame
    the puzzle for print.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, correct.
