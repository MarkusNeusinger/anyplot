review:
  strengths:
  - 'Correct maze topology: a randomized-Kruskal spanning tree over the ring/sector
    cell graph guarantees exactly one solvable path from entry to goal, matching the
    spec''s core requirement'
  - Clear entry (arrow + "START") and goal (star + soft halo + "GOAL") markers, both
    in brand green, giving the puzzle an obvious visual focal hierarchy
  - 'Theme-correct chrome in both renders: background, ink, and soft-ink tokens flip
    correctly between light and dark while the brand-green accents stay pixel-identical'
  - Consistent wall thickness (linewidth = 4.5) throughout, suitable for pen/pencil
    solving as the spec requests
  - Clean minimalist presentation via hidedecorations!/hidespines! with DataAspect()
    keeping the rings circular
  - 'Idiomatic, distinctive Makie usage: NaN-separated polyline batching for walls,
    arrows! for the entry marker, poly!(Circle(...)) with alpha for the goal halo'
  weaknesses:
  - 'Inner rings are cramped: num_sectors stays fixed at 12 from the outermost ring
    down to the innermost, so inner-ring cells shrink into very narrow wedges and
    the center becomes a dense cluster of short arc/line segments that''s harder to
    read than the outer rings. Real circular maze generators typically halve the sector
    count every ring or two toward the center to keep cell size roughly consistent
    — reduce sectors for inner rings for a cleaner, more solvable center.'
  - 'Layout is asymmetric: the uniform pad = outer_r + 2.0 margin combined with the
    START arrow/label sitting only on the right side leaves noticeably more empty
    space on the right side of the canvas than the left/bottom — tighten the padding
    or balance the entry marker placement so whitespace reads even on all sides.'
  - Title/subtitle sit on the smaller side relative to the 2400x2400 canvas (titlesize=20,
    subtitlesize=13 at px_per_unit=2) — a modest fontsize bump would improve legibility
    when the image is scaled down to mobile widths (~400px).
  - 'CQ-01: two small helper functions (find_root, union_cells!) are needed for the
    Kruskal/Union-Find maze-carving algorithm, a minor deviation from the ideal flat
    Imports -> Data -> Plot -> Save script structure; acceptable here since the algorithm
    genuinely requires them, but flagging for awareness.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (~#FAF8F1), not pure white — matches the required light-theme surface.
      Chrome: Bold dark-ink title "maze-circular · julia · makie · anyplot.ai" centered at the top, with a smaller soft-ink subtitle "8 rings · medium difficulty · single solution" beneath it. Both are clearly legible against the light background.
      Data: A circular maze of 8 concentric rings divided into 12 sectors, drawn as dark-ink (near-black) wall lines of consistent thickness. A brand-green (#009E73) star sits at the center inside a faint green halo circle, labeled "GOAL" in dark ink below it. A brand-green arrow points inward from outside the outer ring toward an opening in the boundary, labeled "START" in dark ink. Inner rings near the center look visibly denser/more cramped than the outer rings because sector count doesn't shrink toward the center.
      Legibility verdict: PASS — all text (title, subtitle, START, GOAL) is clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black (~#1A1A17), not pure black — matches the required dark-theme surface.
      Chrome: Same title and subtitle, now rendered in light ink (near-white / soft-gray) against the dark background — both fully legible with no dark-on-dark issues.
      Data: Identical maze geometry, now drawn with light-ink (near-white) wall lines against the dark background. The GOAL star and halo, and the START arrow, remain the exact same brand green (#009E73) as in the light render — confirming data colors are theme-independent. "GOAL" and "START" text labels are rendered in light ink and are clearly readable against the dark background.
      Legibility verdict: PASS — no dark-on-dark or unreadable elements in either the chrome or the data labels; brand green reads well on the near-black surface.
