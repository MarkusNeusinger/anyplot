review:
  strengths:
  - Variable ring_sectors doubling scheme (3→6→12) fixes the previously cramped center
    while keeping the outer rim's cell width reasonable
  - Content-hugging canvas limits computed from actual drawn geometry balance whitespace
    on all sides, resolving the prior right-side-heavy padding
  - Increased title/subtitle fontsizes (24/15 vs the previous attempt's 20/13) improve
    mobile legibility without overflowing the canvas
  - Correct maze topology via a randomized-Kruskal spanning tree over the ring/sector
    cell graph, guaranteeing exactly one solvable path from entry to goal
  - 'Theme-correct chrome in both renders: background, ink, and soft-ink tokens flip
    correctly while brand-green accents stay pixel-identical'
  - 'Idiomatic, distinctive Makie usage: NaN-separated polyline batching for walls,
    arrows! for the entry marker, poly!(Circle(...)) with alpha for the goal halo'
  weaknesses:
  - The solution path from entry to goal isn't visually distinguished from the rest
    of the maze, which would elevate the data-storytelling further
  - Two small helper functions (find_root, union_cells!) remain necessary for the
    Union-Find maze-carving algorithm — a minor, justified deviation from a fully
    flat KISS script
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (~#FAF8F1), not pure white — matches the required light-theme surface.
      Chrome: Bold dark-ink title "maze-circular · julia · makie · anyplot.ai" (~58% of plot width, comfortably within bounds, confirmed clipping-free via pixel crop) centered at top, with a smaller soft-ink subtitle "8 rings · medium difficulty · single solution" beneath it. Both clearly legible against the light background.
      Data: A circular maze of 8 concentric rings with sector count doubling outward (3 → 6 → 12), drawn as dark-ink wall lines of consistent thickness (linewidth 4.5). A brand-green (#009E73) star sits at the center inside a soft translucent halo circle, labeled "GOAL" in dark ink below it. A brand-green arrow points inward from outside the outer ring toward a matching gap in the boundary, labeled "START" in dark ink, confirmed via pixel-level crop to have full margin on all sides (no clipping). The variable sector density keeps inner-ring cells from being cramped, unlike the previous attempt.
      Legibility verdict: PASS — all text (title, subtitle, START, GOAL) is clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black (~#1A1A17), not pure black — matches the required dark-theme surface.
      Chrome: Same title and subtitle, rendered in light ink (near-white / soft-gray) against the dark background — fully legible, no dark-on-dark issues.
      Data: Identical maze geometry, now drawn with light-ink wall lines against the dark background. The GOAL star/halo and the START arrow remain the exact same brand green (#009E73) as in the light render, confirming data colors are theme-independent. "GOAL" and "START" text labels are rendered in light ink and clearly readable against the dark background.
