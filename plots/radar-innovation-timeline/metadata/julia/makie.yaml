review:
  strengths:
  - Palette-tinted quadrant wedges over neutral ring bands, sector headers colored
    in their series hue.
  - Full Imprint and theme-token compliance; both renders readable with identical
    data colors.
  - Realistic technology-radar content with plausible horizon assignments.
  - Makie layout grid places the title Label and a horizontal MarkerElement legend
    in their own figure rows.
  weaknesses:
  - 'SC-02 (both): the radar is a full 360-degree circle with no open part for the
    legend or title, where the Notes ask for a half-circle or three-quarter layout
    (C1) → a 180- or 270-degree layout. Likely cause: the sector span covers 2π.'
  - 'VQ-02, SC-02 (both): the ring names Adopt, Trial, Assess and Hold run diagonally
    through the DevEx quadrant; ''Adopt'' sits about 10 px above the DevEx Adopt marker
    and reads as its label, ''Trial'' crowds ''Dev Containers'' (C5) → place the ring
    names outside the data cells. Likely cause: ring labels positioned along a data-sector
    angle.'
  - 'VQ-01 (both): item labels at fontsize 10, below the 12 px Makie tick reference,
    read small beside the 14 px sector headers → 11-12 px (+1 to +2). Likely cause:
    text! fontsize = 10.'
  - 'Suggestion: draw all markers with one scatter! call and all item labels with
    one text! call over vectors.'
  - 'Suggestion: a subtle emphasis on the long-horizon Hold items could give the radar
    a focal point.'
