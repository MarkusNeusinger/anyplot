review:
  strengths:
  - Correct, creative use of the Chart.js Plugin API to natively render a chart type
    with no built-in equivalent, instead of faking it or reaching for another library.
  - Well-engineered label-placement algorithm (radius-weighted angular lanes + diagonal
    offset) that keeps all 16 item labels legible with zero overlap in both themes.
  - 'Full palette and theme compliance: canonical Imprint order, identical data colors
    across themes, correct light/dark chrome backgrounds.'
  - Fully deterministic, clean, single-file implementation with no fake interactivity.
  weaknesses:
  - Item label font (11px) is noticeably small relative to the 22px title; likely
    to become hard to read at thumbnail (~400px) scale.
  - Dataset places exactly one item per (sector, ring) cell, so the spec's called-out
    overlap-avoidance-within-a-shared-cell scenario is never actually exercised.
  - '"Cybersecurity" sector header (blue) has visibly lower contrast against the dark-theme
    background than the other three sector colors — still legible, but the weakest
    link.'
  - Visual refinement and storytelling are solid but fairly flat/grid-like; a slight
    visual hierarchy would elevate it further.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title, ring labels (Now/Near-Term/Mid-Term/Future), sector headers (AI & ML,
        Cloud & Infrastructure, Cybersecurity, Sustainability Tech), item labels, and legend
        all render in dark ink and are clearly legible against the light background.
      Data: First series (AI & ML) uses #009E73 brand green; remaining three sectors use
        Imprint palette positions 2-4 (lavender, blue, ochre) in canonical order. Distinct
        marker shapes per sector (circle/triangle/rotated-square/square).
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Title, ring labels, item labels render in light ink and are clearly readable.
        Sector headers keep their brand colors; "Cybersecurity" (blue) is legible but the
        lowest-contrast element in the piece — not a dark-on-dark failure, just the weakest
        link. Grid rings/spokes are subtle lighter-gray strokes, visible without dominating.
      Data: Marker colors verified pixel-identical to the light render — only chrome flips.
      Legibility verdict: PASS
