    realistic-looking radar snapshot.
  - Full Imprint palette compliance with identical data colors and theme-correct chrome
    across both renders; no overlap or edge clipping found in any checked region.
  - Correctly reaches for MUI X's ChartContainer + scale-hook composition pattern
    — the right escape valve since no built-in MUI X chart type covers a ThoughtWorks-style
    rings-and-sectors radar.
  - Deterministic, realistic, neutral technology data with sensible ring (time-horizon)
    assignments.
