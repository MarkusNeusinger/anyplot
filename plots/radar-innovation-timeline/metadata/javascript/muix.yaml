review:
  strengths:
  - 'Composes the radar from MUI X building blocks: ChartsDataProvider + ChartsSurface
    with a custom RadarFrame layer drawn through useXScale/useYScale, so the ring
    bands, arcs and spokes share the scatter''s coordinate system and the native ScatterPlot
    and ChartsLegend stay intact'
  - Half-circle layout opens downward onto the baseline, with the ring names mirrored
    under both halves of the baseline and the native legend in the open space below,
    matching the spec's layout bullet
  - Every item sits inside its own ring/sector cell (fanned evenly across the sector
    and stepped across the ring band), and labels are placed by a slot search that
    avoids markers, headers, ring names and other labels; no label collides in either
    render
  - Alternating subtle ring fills from inkSoft at 5%/10% opacity plus a heavier outer
    arc and baseline give the time horizons clear separation without competing with
    the data
  - Labels carry a page-colored halo (paintOrder stroke), so they stay readable over
    spokes and arcs in both themes
  - Data colors come straight from the Imprint palette by sector index (#009E73 first)
    and are identical in both renders; all chrome is threaded through ink/inkSoft/grid/pageBg
    tokens
  - skipAnimation set on the data provider; native scatter tooltips by item name remain
    available in the HTML output
  weaknesses:
  - 'Suggestion: a few labels (Zero Trust Access, AI Threat Detection, Serverless
    Functions) run across a sector spoke into the neighbouring sector; preferring
    the inward or above slot for those markers would keep each label visually inside
    its own sector.'
  - 'Suggestion: the band between the subtitle and the outer arc is fairly tall; the
    half circle could grow slightly to use it.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 page, 3200x1800.
      Chrome: centered bold title "radar-innovation-timeline · javascript · muix · anyplot.ai" with a gray subtitle "25 items · 4 rings, nearest horizon at the center · 4 sectors"; a half circle on its baseline split into four equal sectors by thin gray spokes, with bold dark sector headers (AI & ML, Cloud Infra, Security, Green Tech) just outside the outer arc; four concentric ring bands with alternating subtle warm-gray fills and thin boundary arcs, a darker outer arc and baseline; ring names (Now (0–6 mo), Near-Term (6–18 mo), Mid-Term (18–36 mo), Future (3+ yr)) mirrored under both halves of the baseline, nearest horizon innermost. All text is dark on light and readable.
      Data: 25 circular markers with a page-colored outline, colored by sector — AI & ML #009E73 green, Cloud Infra purple, Security blue, Green Tech ochre — each inside its own ring/sector cell with its name beside it in dark text with a page-colored halo; no label collides with another label, a marker, a header or a ring name. Native MUI X legend centered at the bottom with circle glyphs.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, sector headers and item labels flip to light ink, subtitle and ring names to light gray; ring fills become subtle light-gray tints, arcs and spokes muted gray, the outer arc and baseline light gray. No dark-on-dark text anywhere.
      Data: marker colors identical to the light render (green, purple, blue, ochre); marker outlines switch to the dark page color; legend text light and glyphs visible.
      Legibility verdict: PASS
