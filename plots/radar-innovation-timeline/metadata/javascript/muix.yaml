      Data: 25 circle markers with a page-colored outline, AI & ML in #009E73, Cloud Infra #C475FD, Security #4467A3, Green Tech #BD8233; each item named beside its marker, no text collisions; the Now ring is the most crowded, where 'AI Threat Detection' stretches across the vertical spoke.
