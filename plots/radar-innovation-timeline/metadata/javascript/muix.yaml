review:
  strengths:
  - 'Half-circle Tech-Radar layout matches the spec''s Notes precisely: concentric
    time-horizon rings with alternating subtle fills, clear ring boundary lines, sector
    divider spokes, and outer-edge sector headers.'
  - 'Imprint palette is fully compliant: first sector (AI & ML) renders in brand green
    #009E73, remaining sectors follow the canonical palette order, and data colors
    are pixel-identical between the light and dark renders — only chrome flips.'
  - 'Both renders are cleanly legible: warm off-white / near-black backgrounds, dark-on-light
    and light-on-dark text with no overlap or edge clipping across any of the 16 item
    labels, 4 sector headers, or 4 ring labels.'
  - Correctly uses the ChartContainer + useXScale/useYScale low-level composition
    pattern to build a custom polar diagram — a sound choice since MUI X's native
    RadarChart (spider/polygon style) cannot express a ThoughtWorks-style rings-and-sectors
    radar.
  - Deterministic, realistic technology data (LLM Fine-Tuning, Post-Quantum Crypto,
    Direct Air Capture, etc.) with ring assignments that are plausible for real adoption
    horizons.
  - Title format, legend, and skipAnimation/window.ANYPLOT_SIZE sizing all follow
    the muix contract correctly.
  weaknesses:
  - 'Canvas utilization is uneven: the semicircle diagram is centered in a narrow
    horizontal band, leaving large balanced-but-empty margins on the far left/right
    beyond the sector-header labels. Consider enlarging R_MAX / the chart''s chartWidth-to-canvas
    ratio, or widening label offsets, so the diagram itself fills more of the 3200x1800
    canvas.'
  - The spec's Notes explicitly call for 'smart label placement, slight angular jittering,
    or radial offset within rings' to avoid label overlap — but the data is laid out
    as an exact 4x4 grid with precisely one item per (ring, sector) cell, so no two
    labels ever compete for space and the collision-avoidance technique specified
    is never exercised. Add a few extra items sharing a ring/sector (bringing the
    total closer to the middle of the spec's 15-40 range) and implement the offset/jitter
    technique to fully satisfy this requirement.
  - Because every ring x sector cell has exactly one item, the dataset feels artificially
    uniform rather than a realistic radar snapshot (real technology radars cluster
    unevenly — some cells crowded, others empty). Vary the item count per cell for
    a more organic, realistic distribution.
  - 'Design Excellence is solid but not yet publication-grade: consider a stronger
    visual hierarchy (e.g., subtle sector wedge tinting, a highlighted/emphasized
    item, or refined ring-label integration closer to the rings themselves rather
    than a separate row below the baseline) to push past a ''well-configured custom
    build'' into genuinely distinctive design.'
  - 'Library Mastery is generic relative to MUI X''s distinctive capabilities: the
    diagram is essentially hand-drawn SVG on top of the scale hooks. Since PNG-only
    review doesn''t penalize interactivity, consider adding MUI X''s native ChartsTooltip/ChartsLegend
    or highlight-on-hover wiring so the HTML output demonstrates library-specific
    interactive value beyond generic SVG marks.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "radar-innovation-timeline · javascript · muix · anyplot.ai" is bold dark text, clearly legible, centered near the top. Four sector headers (AI & ML, Cloud Infra, Security, Green Tech) sit along the outer edge of the semicircle in dark, bold text. Four ring-name labels (Now (0-6 mo), Near-Term (6-18 mo), Mid-Term (18-36 mo), Future (3+ yr)) sit in a row just below the semicircle's baseline in a softer ink tone. A "Sector" legend header plus four swatch+label rows sit near the bottom. All text is dark-on-light and fully readable, no overlaps or clipped characters observed.
      Data: 16 labeled points, one per (ring, sector) cell, each drawn as a colored circle with a light-bg-colored stroke outline and an outward radial text label. Colors: AI & ML = brand green, Cloud Infra = light purple/violet, Security = dark blue, Green Tech = ochre/brown. First series (AI & ML) is #009E73 as required. Ring boundaries are drawn as concentric arcs with subtle alternating gray fill bands, and thin gray spokes divide the four sectors; the outer ring boundary and the baseline diameter are drawn bolder than the inner ring lines.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Same title, sector headers, ring-name row, and "Sector" legend, now rendered in light/white text against the dark background. All text is clearly legible with no dark-on-dark elements — title, sector headers, ring labels, item labels, and legend text are all light-colored and readable.
      Data: The same 16 points in the same positions with the same four colors (green / purple / blue / ochre) as the light render — data colors are identical across themes, confirming only chrome (background, text, grid/ring lines) flipped. Ring boundary lines and sector spokes are still visible as subtle light-gray strokes on the dark background, alternating ring fills are faint but visible.
      Legibility verdict: PASS
