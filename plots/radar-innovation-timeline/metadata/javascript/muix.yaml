review:
  strengths:
  - Half-circle radar with the open lower half used for mirrored ring names and the
    legend, exactly as the spec's layout asks
  - Native ScatterPlot series rendered inside ChartsSurface next to a custom SVG frame
    drawn with useXScale/useYScale, so the rings, spokes and labels share the chart's
    coordinate system and the HTML keeps MUI X tooltips
  - Label placement searches eight slots per marker, avoiding markers, headers, ring
    names and earlier labels, while markers stay in their cells
  - Halo-stroked item labels (page-colored stroke) and alternating subtle ring fills
    keep text readable over arcs in both themes
  weaknesses:
  - 'VQ-02 (both): in the Now ring the ''AI Threat Detection'' label (Security marker)
    reaches left across the vertical spoke and sits about 14 px above ''Serverless
    Functions'', so it reads as part of the Cloud Infra cluster → place it on the
    marker''s outer (right) side or below it, kept on its own side of the spoke. Likely
    cause: the slot score in the labels block counts spoke crossings only as a tie-breaker
    after clash area, so a left slot that crosses the spoke wins once the right slot
    touches the ''Zero Trust Access'' label box.'
  - 'Suggestion: a heavier or tinted label for the Now-ring items could give the radar
    a focal point on what to adopt first.'
  - 'Suggestion: the near-synonymous ''Passwordless Auth'' and ''Passkeys Everywhere''
    could be replaced by two clearly distinct security items.'
  image_description: |-
