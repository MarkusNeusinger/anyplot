review:
  strengths:
  - Genuinely bespoke radial layout built from scratch in D3 (arc bands, d3.symbol
    markers, and a real getBBox-based iterative collision-avoidance loop) — 24 densely
    packed labels render with zero visible overlap in either theme
  - Correct Imprint palette in canonical order (green/lavender/blue/ochre for AI &
    ML/Infrastructure/Sustainability/Biotech) with distinct marker shapes per sector
    for redundant CVD-safe encoding
  - Full theme-adaptive chrome — both renders are cleanly legible, backgrounds match
    the spec tokens exactly, and data colors are identical across light and dark
  - 'Comprehensive, realistic dataset: every one of the 4 sectors has items spread
    across all 4 time-horizon rings, with factually sensible placements (e.g. mRNA
    Therapeutics in ''Now'', Fusion Power Plants in ''Future'')'
  - Correct mandated title format plus a complete sector legend and ring key, both
    auto-centered via a real-browser width measurement
  weaknesses:
  - Ring time-horizon names ('Now', 'Near-Term', 'Mid-Term', 'Future') only appear
    in a key below the chart, not on the rings themselves — the spec explicitly asks
    to 'label each ring with its time-horizon name'. Consider placing subtle ring
    labels in the empty gap along the sector divider at 0 degrees (or another unclaimed
    angular gap), offset radially per ring, so the ring identity reads directly off
    the chart.
  - Radius and color mapping rely on manual math (ring.inner + frac*(outer-inner),
    direct t.palette[d.sector] indexing) instead of d3 scales (d3.scaleLinear, d3.scaleOrdinal)
    even though these mappings are a textbook fit for D3's scale API — a missed opportunity
    for more idiomatic usage.
  - Ring divider lines and item-label typography are functional but fairly plain;
    softer/thinner ring boundaries or a stronger typographic contrast between sector
    headers and item labels would raise the visual polish further.
  - No focal emphasis on 1-2 standout/breakthrough items (e.g. a subtle highlight
    or slightly larger marker) — the chart relies entirely on radial position and
    color for hierarchy rather than adding an explicit point of emphasis.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Bold dark title "radar-innovation-timeline · javascript · d3 · anyplot.ai" centered at top, clearly readable. Four sector headers (AI & ML, Infrastructure, Sustainability, Biotech) in bold dark text along the outer edge of the half-circle dome. A ring key (Now, Near-Term, Mid-Term, Future) and a sector legend (colored marker + label) sit centered below the dome, both readable dark-on-light text. Concentric ring boundary lines and sector divider lines are subtle gray, alternating ring bands add faint shading. All chrome elements are clearly visible against the light background.
      Data: 24 labeled items placed as colored markers within their ring/sector cell — green circles (AI & ML), lavender squares (Infrastructure), blue triangles (Sustainability), ochre diamonds (Biotech). First series color is #009E73 (brand green) as required. Item labels are small dark-gray text with a light halo stroke for legibility against the ring shading, positioned via an iterative collision-avoidance pass with no visible overlaps.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Same title, sector headers, ring key, and legend all correctly flipped to light-colored text (white/light-gray), fully readable against the dark background. Ring boundary and divider lines remain subtle. No dark-on-dark text anywhere — title, sector headers, item labels, ring key, and legend are all legible.
      Data: Marker colors are pixel-identical to the light render (green/lavender/blue/ochre) — only the chrome (background, text, grid) flipped, as required. Item label halo strokes correctly use the dark-theme page background so text stays legible over the ring shading.
      Legibility verdict: PASS
