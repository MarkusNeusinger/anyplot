review:
  strengths:
  - Ring time-horizon names now render directly on the rings (along the flat diameter,
    radially positioned per ring) in addition to the below-chart key -- fully satisfies
    the spec's "label each ring with its time-horizon name" requirement flagged in
    Attempt 1
  - Radius and color mapping now use idiomatic d3.scaleLinear (frac to radius) and
    d3.scaleOrdinal (sector to Imprint palette) instead of manual math -- directly
    addresses the Attempt 1 LM-01 feedback
  - 'Genuinely bespoke radial layout: d3.arc ring bands and boundaries, d3.symbol
    markers with 4 distinct shapes, and a real-browser getBBox-based iterative collision-avoidance
    loop resolve 24 densely packed labels with zero visible overlap in either theme'
  - Correct Imprint palette in canonical order (green/lavender/blue/ochre) with distinct
    marker shapes per sector for redundant CVD-safe encoding; data colors identical
    across light and dark renders
  - Full theme-adaptive chrome -- both renders cleanly legible, backgrounds match
    spec tokens, no dark-on-dark or light-on-light failures
  - 'Comprehensive, factually plausible dataset: every sector has items spread across
    all 4 time-horizon rings (24 items, within the spec''s 15-40 range), with sensible
    near-to-far placements (e.g. LLM Copilots at Now, AGI at Future)'
  weaknesses:
  - No focal emphasis on 1-2 standout items -- visual hierarchy still relies entirely
    on radial position, color, and shape rather than an explicit point of emphasis
    (e.g. a highlighted or annotated item)
  - Ring dividers and item-label typography remain functional rather than maximally
    refined -- more contrast between sector-header and item-label typographic weight,
    or softer ring boundaries, would raise polish further
  - Several small arrow-function helpers (polar, labelPos, boxesOverlap, nudge, centerRow)
    push the script slightly past pure KISS Imports->Data->Plot->Save structure, though
    the added structure is justified by the genuine collision-avoidance requirement
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 -- not pure white.
      Chrome: Bold dark title centered at top ("radar-innovation-timeline · javascript · d3 · anyplot.ai"). Four sector headers (AI & ML, Infrastructure, Sustainability, Biotech) in bold dark text along the outer edge of the half-circle dome. Ring time-horizon names ("Now", "Near-Term", "Mid-Term", "Future") now appear directly on the rings along the flat diameter, in addition to a below-chart ring key and sector legend. Concentric ring boundaries and sector dividers are subtle gray with faint alternating ring-band shading. All text -- title, sector headers, on-ring labels, item labels, legends -- is clearly readable against the light background.
      Data: 24 items rendered as colored/shaped markers -- green circles (AI & ML), lavender squares (Infrastructure), blue triangles (Sustainability), ochre diamonds (Biotech) -- matching Imprint palette positions 1-4 in canonical order. First series (AI & ML) is #009E73 as required. Each marker has a halo-stroked text label with zero visible overlap across the 24 densely packed items.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 -- not pure black.
      Chrome: The same title, sector headers, on-ring labels, ring key, and legend correctly flip to light-colored text, all fully legible against the dark background. No dark-on-dark failures observed anywhere (ring labels, item labels, and legend text all use light ink tokens with visible contrast).
      Data: Marker colors (green/lavender/blue/ochre) are pixel-identical to the light render -- only the chrome (background, text, grid, dividers) flipped, as required. Brand green #009E73 remains clearly visible on the dark surface.
      Legibility verdict: PASS
