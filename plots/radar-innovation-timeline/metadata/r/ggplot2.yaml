review:
  strengths:
  - 'Three-quarter layout done properly: rings and bands stop at 270 degrees and the
    opened quadrant carries the ring names and the legend'
  - 'Native polar geometry: geom_rect and geom_segment under coord_polar draw the
    bands, arcs and spokes'
  - Typographic hierarchy of bold sector headers, soft bold ring names and sector-colored
    item labels, identical data colors in both themes
  - Legend keys at data-marker size via guide_legend(override.aes) on the elevated
    legend fill
  weaknesses:
  - 'VQ-02 (both): ''AI-Powered SIEM'' runs into the Platform Eng. marker, ''Zero
    Trust'' and ''Copilot'' touch their own markers, ''Serving'' and ''Foundation''
    cross the 67.5 and 0 degree spokes, the outer arc cuts through ''Dev Tools'',
    and the Agentic AI and Platform Eng. markers sit on spokes → 0 label-marker or
    label-line contacts. Likely cause: angle_offset values of 4 degrees and labels
    padded with only three spaces (gsub) beside markers up to size 6.5; sector header
    y = ring_edges[5] + 0.22 too close at the Dev Tools angle.'
  - 'VQ-01 (dark): Security item labels in #4467A3 at about 7.7 pt read at about 3:1
    on #1A1A17 → a lighter label tone (for example the label in INK_SOFT beside the
    colored marker) at 4.5:1 or more. Likely cause: geom_text color = sector for all
    labels.'
  - 'Suggestion: vary the number of items per cell so the radar shows where activity
    concentrates.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, square 2400x2400 canvas.
      Chrome: title 'radar-innovation-timeline · r · ggplot2 · anyplot.ai' centred in dark ink; bold dark sector headers AI & ML, Cloud & Infra, Security, Dev Tools outside the outer ring; bold INK_SOFT ring names Now / Near-term / Mid-term / Future in the open upper-left quadrant; 'Sector' legend box on the elevated fill at upper left. All readable.
      Data: three-quarter radar (0-270 degrees), four rings with alternating subtle grey bands, four equal sectors; 16 markers (one per cell) in #009E73, #C475FD, #4467A3, #BD8233, larger in inner rings, with two-line colored labels. 'AI-Powered SIEM' runs into the Platform Eng. marker; 'Zero Trust', 'Copilot' touch their markers; outer arc cuts 'Dev Tools'.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
