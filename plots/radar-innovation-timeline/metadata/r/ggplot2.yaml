review:
  strengths:
  - Three-quarter radar with sector spokes at equal 67.5° steps and the open quadrant
    carrying the ring names
  - Correct Imprint palette in canonical order with theme-adaptive chrome; all text
    readable in both renders
  - Item labels placed on the outward side of each marker, so no label collides with
    another label or a header
  - Realistic, neutral technology taxonomy across four sectors and four time horizons
  - Clean linear script using only ggplot2 and ragg
  weaknesses:
  - 'VQ-02 (both): item labels run across structural lines — ''LLM Deployment'' and
    ''Agentic AI'' over the AI & ML / Cloud spoke and ring circle, ''Zero-Trust Network'',
    ''AI-Powered SIEM'' and ''Edge ML Platforms'' over the Security / Cloud spoke,
    ''Homomorphic Encryption'' across the Dev Tools spoke, ''Kubernetes Automation''
    and ''Foundation Models'' over ring circles; ''Near-term'' sits on the Now ring
    line → each label kept inside its own cell (0 crossings). Likely cause: fixed
    angle_offset values near the sector edges with labels of ~25° angular width, and
    ring_ann_df at r = 1:4 instead of the band centres.'
  - 'VQ-03 (both): legend dots are about a quarter of the data markers'' diameter
    and the key column sits on a background strip different from the legend box →
    keys at about the data marker size on the legend box fill. Likely cause: no guide_legend(override.aes
    = list(size = ...)) and legend.key not themed to ELEVATED_BG.'
  - 'SC-02 (both): C1 is only partly met — the ring circles and alternating fills
    continue through the 270–360° quadrant, so the chart reads as a full circle with
    one empty sector, and the legend sits outside that quadrant → stop circles and
    fills at 270° and place the legend (or ring names plus legend) in the opened area.
    Likely cause: angles_seq and theta_full run 0–360.'
  - 'CQ-04 (code): lines 53–68 sample 301-point polygons and paths for the ring bands
    and circles that coord_polar draws natively → geom_rect(xmin = 0, xmax = 270,
    ymin, ymax) for the bands and geom_segment / geom_hline for the circles; also
    delete the unused items$color (line 46). Likely cause: hand-built polar geometry.'
  - 'Suggestion: vary the number of items per cell so the radar shows where activity
    concentrates.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, square 2400x2400.
      Chrome: title "radar-innovation-timeline · r · ggplot2 · anyplot.ai" in dark ink across ~86% of the width; bold dark sector headers (AI & ML, Cloud & Infra, Security, Dev Tools) outside the outer ring; bold INK_SOFT ring names Now / Near-term / Mid-term / Future stacked in the open upper-left quadrant; "Sector" legend in a bordered elevated box top-left. All readable.
      Data: 16 markers, one per ring × sector cell, colored #009E73 (AI & ML), #C475FD (Cloud & Infra), #4467A3 (Security), #BD8233 (Dev Tools); marker size decreases outward. Rings 1 and 3 have a subtle beige fill. Labels sit beside markers on the outward side; several run across spokes or ring circles (LLM Deployment, Agentic AI, Zero-Trust Network, AI-Powered SIEM, Edge ML Platforms, Homomorphic Encryption, Kubernetes Automation). Ring circles continue through the open quadrant. Legend dots much smaller than data markers.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title and sector headers in light ink, ring names in light grey, legend box on #242420 with a light border; no dark-on-dark text.
      Data: categorical colors identical to the light render; ring fills a slightly lighter near-black tint; spokes and circles light grey and subtle. Same label-over-line crossings as in light.
      Legibility verdict: PASS
