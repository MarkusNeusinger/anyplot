review:
  strengths:
  - Three-quarter (270°) polar layout with four equal sectors, sector-colored headers
    along the outer edge and the four time-horizon rings labeled in the open quarter,
    nearest horizon innermost
  - 'Single sns.scatterplot call encodes sector by hue and style (Imprint positions
    1–4 in canonical order, #009E73 first) and redundantly encodes horizon by size'
  - Every item sits inside its own ring-and-sector cell, spread evenly by a cumcount-based
    layout inside the cell
  - 'Theme tokens threaded through all chrome: ring-label and item-label boxes, legend
    frame and text flip cleanly between #FAF8F1 and #1A1A17'
  - 'Seaborn helpers used for the chrome: sns.blend_palette for the ring boundary
    accents and sns.desaturate for the softened boundary and cue colors'
  - Plausible, neutral horizon-scanning content across Healthcare, Mobility, Finance
    and Space with 25 items in all 16 cells
  weaknesses:
  - 'VQ-02 (both): several leader lines run through other labels'' text and cross
    each other: the Open Banking leader cuts through ''Tokenized Assets'', the Gene
    Editing leader through ''AI Triage'', the Digital Therapeutics leader through
    ''Wearable ECG'', and the Smallsat Fleets leader through the ''◂ Ready'' cue →
    no leader crosses any text box. Likely cause: the greedy placer in lines 251–299
    only tests label boxes against boxes, never the leader segment, and accepts distances
    up to 135 pt.'
  - 'SC-02 (both): the Now-ring labels sit far from their markers (Open Banking about
    600 px above its diamond, Smallsat Fleets and Telehealth about 450 px away, EV
    Charging across the Mobility sector), so a name is not beside its marker as the
    characteristic section asks (C5) → each label within about one ring width of its
    marker. Likely cause: inner-ring items are placed last against an already crowded
    box list, so the search escalates to the 94–135 pt distances.'
  - 'SC-02 (both): the ring fills are drawn over the full 360° (theta 0..2π), so the
    open quarter is filled like the rest and the chart reads as a full circle rather
    than the three-quarter layout the Notes ask for (C1) → fill only the 270° sector
    span. Likely cause: theta_fill = np.linspace(0, 2 * np.pi, 200).'
  - 'VQ-03 (both): legend glyphs do not match the marks: the horizon size glyphs are
    about half the drawn marker size (Now glyph ~8 pt vs the ~17 pt marker) and the
    sector glyphs at 10 pt are smaller than the Now-ring markers → glyph sizes equal
    to the drawn marker sizes. Likely cause: markersize=np.sqrt(sz) / 2.2 and markersize=10
    in the Line2D handles.'
  - 'VQ-07 (both): the four ordered rings are filled in categorical Imprint colors
    (green, blue, ochre, red) that also repeat the sector colors (Now = Healthcare
    green, Near-term = Finance blue, Mid-term = Space ochre) → ordered steps of one
    Imprint ramp (imprint_seq marks stops) or one neutral tint. Likely cause: RING_FILLS
    = ["#009E73", "#4467A3", "#BD8233", "#AE3030"].'
  - 'VQ-01 (both): the ''◂ Ready'' cue in desaturated green at 9 pt sits on the green
    Now-ring fill and its boundary line and reads at low contrast, worst on the dark
    render → place it on the page background or in INK_SOFT. Likely cause: cue at
    ring_boundaries[0] + 0.1 with color sns.desaturate("#009E73", 0.55).'
  - 'Suggestion: the band between the outer ring and the legend could be tightened
    so the radar grows slightly.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, not pure white.
      Chrome: title "radar-innovation-timeline · python · seaborn · anyplot.ai" in dark ink at the top; sector headers Finance (blue), Mobility (lavender), Healthcare (green), Space (ochre) in bold along the outer edge; ring names Now / Near-term / Mid-term / Future in bold INK_SOFT on rounded boxes in the open bottom-left quarter; "◂ Ready" and "Emerging ▸" cues in desaturated green/red; bottom legend box with sector shapes and horizon sizes. All text readable; the "◂ Ready" cue is low-contrast on the green Now fill.
      Data: 25 items as markers — Healthcare green circles (#009E73, first series), Mobility lavender squares, Finance blue diamonds, Space ochre triangles — sized by horizon, with labels on boxed annotations and thin leader lines. Ring fills (green/blue/ochre/red at low alpha) cover the full circle. Several Now-ring labels are far from their markers on long leaders that cross other labels (Open Banking through Tokenized Assets, Gene Editing through AI Triage).
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17, not pure black.
      Chrome: title, ring names, item labels and legend text all in light ink on #242420 boxes; legend frame flips to the dark elevated surface. No dark-on-dark text. The "◂ Ready" cue is dim on the dark green Now fill but readable.
      Data: sector colors identical to the light render (#009E73, #C475FD, #4467A3, #BD8233); marker edges flip to the dark page color; ring fills become dark tints. Same leader-line crossings as the light render.
      Legibility verdict: PASS
