review:
  strengths:
  - Every item label sits beside its own marker with no text-on-text collision, placed
    by a side-choosing pass over the markers and the ring names
  - Ring names carry their horizon inline ('Trial (0–1 yr)'), which reads the time
    scale without a separate key
  - Marker size and ring-fill intensity both fall outward, putting the near-term items
    in focus
  - Sector headers in their sector colors match the legend's colors and shapes
  - hovertemplate with customdata shows ring and sector in the interactive HTML
  - 'Both themes threaded through every element: INK labels, theme-tuned ring fills
    and grid lines, elevated legend surface'
  weaknesses:
  - 'VQ-02 (both): the ring boundary arcs run through the letters of the ''Biotech''
    sector header on the left edge of the circle → the header clear of every arc (about
    +0.4 radial units further out, or anchored away from the circle on the side headers).
    Likely cause: every header sits at R_MAX + 0.55 with xanchor ''center'', so a
    wide header on the side of the circle reaches back over the outer arcs.'
  - 'VQ-02 (both): several item labels sit across ring boundaries and sector dividers,
    such as ''mRNA Therapeutics'' over the Biotech/Sustainability divider and the
    Adopt arc, ''LLM Agents'' over the Adopt/Trial arc, and ''Green Software'' and
    ''Digital Product Passports'' over arcs → each label inside its own cell. Likely
    cause: the label-placement cost counts markers and labels already placed, but
    not the ring arcs or the divider lines.'
  - 'VQ-05 (both): the radar fills only about 75 % of the canvas height, with a wide
    empty band between the title and the top of the circle and empty canvas around
    the legend → enlarge the circle until its headers nearly reach the title and the
    bottom edge. Likely cause: unit_px = 36 with pad = 0.9 and a fixed x_span = 740
    / unit_px.'
  - 'SC-02 (both): C1 is not met: the open quadrant of the three-quarter circle holds
    the ring names, and the legend sits outside the circle on the far right → the
    legend (or the title) in the open quadrant, as the spec asks. Likely cause: legend
    x = 0.83, y = 0.5.'
  - 'Suggestion: the ring names could run along the end of each ring arc so a reader
    ties them to their ring without tracing the diagonal.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1.
      Chrome: title 'radar-innovation-timeline · python · plotly · anyplot.ai' in dark INK, fully visible. Sector headers 'AI & ML', 'Cloud & Infra', 'Sustainability', 'Biotech' bold in their sector colors along the outer edge; the outer arcs cross the 'Biotech' header. Ring names 'Adopt (now)', 'Trial (0–1 yr)', 'Assess (1–3 yr)', 'Hold (3+ yr)' bold INK_SOFT on the diagonal of the open top-left quadrant. Legend 'Sector' at right on an elevated surface. All text readable.
      Data: 270° radar with four rings and four equal sectors (dotted dividers), outward-fading green ring fill. AI & ML #009E73 circles, Cloud & Infra #C475FD diamonds, Sustainability #4467A3 squares, Biotech #BD8233 triangles; marker size falls outward. 26 items, each labelled in INK beside its marker, no text collisions; a few labels sit over ring arcs or dividers.
      Legibility verdict: PASS

