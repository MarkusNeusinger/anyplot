review:
  strengths:
  - 270-degree arc leaves the top gap for boxed ring-name labels (Adopt/Trial/Assess/Hold),
    nearest horizon innermost as the spec asks
  - 'Sector colors follow Imprint positions 1-4 (AI & ML = #009E73) and stay identical
    across both themes'
  - Most item names sit right beside their markers with short leaders
  - layer_tooltips() gives each item its name, ring and sector in the interactive
    HTML
  weaknesses:
  - 'VQ-07 (both): pure-black strips about 95 px high at the top and bottom of both
    renders - the canvas outside the coord_fixed plot box is left unpainted → page
    color #FAF8F1 / #1A1A17 across the whole 2400x2400 canvas. Likely cause: coord_fixed
    without the one-panel gggrid([plot]) + ggsize(600, 600) + plot_background wrapper
    the library prompt prescribes.'
  - 'VQ-02, SC-02 (both): ''Green Cloud'', ''Synthetic Biology'', ''Circular Design''
    and ''Ocean Cleanup AI'' are drawn over or against their own markers, ''Biodegradable
    PCBs'' and ''Fusion Energy'' run together into one line, and ''Nanomedicine''
    touches the ''Biotech'' header → every label clear of markers, other labels and
    headers. Likely cause: the vertical-only repulsion (MIN_Y_SEP=0.75) ignores markers
    and headers.'
  - 'VQ-07 (both): ring background fills are custom hexes (#DCEDC8, #FFF9C4, #FFE0B2,
    #FFCDD2 in light; #DDCC77 in dark) outside the Imprint palette for an ordered
    category → ordered steps of one Imprint ramp (or a single neutral tint) in ring
    order. Likely cause: ring_fills dict.'
  - 'CQ-04 (code): the 35-iteration label repulsion loop (prev lines ~139-151) writes
    out what lets-plot''s geom_text_repel computes → replace the loop and the connector
    geom_segment with geom_text_repel. Likely cause: hand-rolled declutter.'
  - 'Suggestion: in the dark render the ring boundaries draw as thick near-white strokes
    that compete with the data; a thinner INK_SOFT outline on the ring polygons would
    match the light render.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 inside the plot, but pure-black strips about 95 px high at the top and bottom of the canvas.
      Chrome: bold dark title at top left; bold black sector headers outside the arc; boxed ring labels Adopt/Trial/Assess/Hold in the top gap; legend 'Sector' at the bottom. All readable.
      Data: 270-degree radar, 4 pastel ring fills (green/yellow/peach/pink), 4 sectors; 24 markers colored #009E73, #C475FD, #4467A3, #BD8233 by sector with names mostly beside their markers on short leaders. 'Green Cloud', 'Synthetic Biology', 'Circular Design', 'Ocean Cleanup AI' sit on their markers; 'Biodegradable PCBs' and 'Fusion Energy' run together; 'Nanomedicine' touches 'Biotech'.
      Legibility verdict: PASS (text readable; pure-black canvas strips scored under VQ-07)

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17 inside the plot, pure-black strips at top and bottom.
      Chrome: light title, headers, ring labels and legend text; thick near-white ring boundaries. No dark-on-dark text.
      Data: identical sector colors to the light render; low-alpha ring tints. Same label collisions as light.
      Legibility verdict: PASS
