review:
  strengths:
  - Three-quarter (270°) layout with the open bottom quarter carrying the four ring
    names Adopt → Hold, innermost first, so ring labels never compete with items (C1,
    C2)
  - Every one of the 24 items sits inside its own ring-and-sector cell, with its full,
    untruncated name beside its marker; no item label collides with another label,
    a ring name or a sector header (C4, C5)
  - 'Four equal 67.5° sectors with solid dividers, uppercase sector headers outside
    the outer edge, and a bottom legend mapping the Imprint colors #009E73, #C475FD,
    #4467A3, #BD8233 to the sectors in canonical order (C3, VQ-07)'
  - 'Typographic hierarchy chosen beyond the baseline: uppercase sector headers against
    title-case ring names and item labels, and dashed inner ring boundaries against
    solid outer edges and dividers'
  - 'pygal.XY used as a polar canvas: per-series stroke_style dasharray for the guide
    rings and print_labels with per-point label dicts for the item names, with theme
    tokens threaded through Style so both renders are theme-correct; HTML export keeps
    pygal''s hover tooltips'
  weaknesses:
  - 'VQ-02 (both): the outer ring line runs through the ''DATA ENGINEERING'' sector
    header (through the ''EE'') and touches the final ''S'' of ''CLOUD PLATFORMS'';
    several item labels (''Zero Trust Network'', ''Platform Engineering'', ''Post-Quantum
    Crypto'', ''Supply Chain Security'') are crossed by the dashed ring boundaries
    → headers fully outside the outer ring and item labels clear of guide lines where
    the cell allows. Likely cause: header centers at outer + 0.45 radius units with
    the text extending inward horizontally, and `taken` holding no boxes for the ring
    and divider lines.'
  - 'VQ-01 (both): sector headers and ring names are drawn at 36 px, below the style
    guide''s 44 px tick-label reference, and read small beside the 48 px legend →
    44 px (+8 px) for headers and ring names. Likely cause: every text drawn through
    the single LABEL_PX = 36 value label series.'
  - 'Suggestion: the four legend entries are spaced unevenly (a wide gap before ''DevOps'');
    a centered legend would balance the bottom edge.'
  - 'Suggestion: a subtle per-ring background fill, which the Notes suggest, would
    separate the time horizons further.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the full 2400x2400 canvas, not pure white.
