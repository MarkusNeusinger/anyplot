      Data: 24 circular markers (~36 px) in Imprint colors: Data Engineering #009E73 (first series, brand green), Cloud Platforms #C475FD, Security #4467A3, DevOps #BD8233. Each marker sits in its own ring/sector cell, with its full name beside it; no label collides with another label. Some labels are crossed by dashed ring boundaries.
