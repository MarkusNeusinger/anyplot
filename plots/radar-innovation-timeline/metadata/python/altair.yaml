    themes correct
  - Redundant color-by-sector and shape-by-ring encoding with two clearly titled legends
  - Ring fills tinted from the palette with opacity fading outward, a subtle cue that
    later horizons matter less now
  - 'Altair-native hover: selection_point(nearest=True) drives alt.condition on marker
    size and label opacity, with tooltips in the HTML'
  weaknesses:
  - 'VQ-03, SC-04 (dark): the Ring legend''s circle, diamond, triangle and square
    glyphs are drawn near-black on the #242420 legend box and nearly vanish → fill
    them with a theme ink such as INK_SOFT. Likely cause: the shape legend inherits
    Vega''s default black symbol fill; configure_legend has no symbolFillColor.'
  - 'VQ-02 (both): three item labels run over neighbouring markers — ''Vision Models''
    across the Neuro-symb. AI triangle, the end of ''RAG Pipelines'' into the Auto.
    ML Ops triangle, ''Neuro-symb. AI'' against the AGI Frameworks square → keep every
    label clear of all markers, not only of other labels. Likely cause: the declutter
    loop (lines 120-144) checks text boxes against text boxes and headers only, never
    against marker positions.'
  - 'Suggestion: lift the Adopt-ring items (bolder label weight) so the near-term
    items read first.'
