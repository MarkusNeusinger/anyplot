review:
  strengths:
  - 'Imprint positions 1-4 in canonical order per sector plus a distinct marker shape
    per sector: redundant, CVD-safe encoding'
  - Marker area decreasing from Adopt to Hold gives near-term items visual priority
  - Fully theme-adaptive ring fills, label boxes, legend frame and text in both renders
  - 'Realistic, neutral technology-radar data: 23 real technologies across 4 rings
    and 4 sectors'
  weaknesses:
  - 'VQ-02, SC-02 (both): label boxes collide — ''Confidential Computing'' hides ''Post-Quantum
    Crypto'', ''AI Threat Detection'' and ''Homomorphic Encryption'' overlap, ''FinOps
    Tooling'' sits under ''Edge Computing'', ''Quantum Cloud APIs'' covers the ''Cloud
    & Infra'' header (C5) → every label clear of other labels and headers. Likely
    cause: fixed radial offsets in data units (base_offset 0.55/0.42) that ignore
    neighbouring labels.'
  - 'VQ-03 (both): about ten markers (FinOps Tooling, Edge Computing, Serverless Containers,
    Real-time Lakehouse, Streaming SQL, Platform Engineering, Data Mesh, Quantum Cloud
    APIs, SBOM Tooling, Post-Quantum Crypto) are hidden under label boxes → every
    marker fully visible. Likely cause: label text at zorder 6 placed onto the markers
    by the data-unit offsets.'
  - 'SC-02 (both): the arc spans 300°, while the spec asks for a half-circle (180°)
    or three-quarter (270°) layout (C1) → 270° (−30°). Likely cause: arc_span = 5
    / 6 * 2 * np.pi.'
  - 'VQ-05 (both): an empty band of roughly 300 px separates the title from the top
    of the chart → chart moved up toward the title. Likely cause: ylim padding (ring_boundaries[-1]
    + 2.5) with the 300° arc''s gap at the top.'
  - 'Suggestion: Line2D proxy handles instead of empty plt.scatter calls would be
    the more idiomatic legend construction.'
