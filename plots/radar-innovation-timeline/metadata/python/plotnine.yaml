review:
  strengths:
  - Markers sit at their given angle inside their own ring and sector cells
  - Near-term markers larger and opaque, outer ones faded, giving a focal hierarchy
  - Idiomatic plotnine composition with geom_polygon/geom_path/geom_segment, scale_fill_identity
    and scale_size_manual/scale_alpha_manual
  - Correct theme chrome in both renders
  weaknesses:
  - 'VQ-01 (both): item labels render at about 4 pt (geom_text size=3.8), sector headers
    at about 4 pt and ring names at about 3.5 pt, below the 8 pt reference, and the
    labels are drawn in sector colors on tinted ring fills, so blue ''Causal AI Systems''
    on the brown Assess band and rose ''Organoid Platforms'' on the olive Trial band
    read weakly in dark → labels in ink at about 8 pt (+4 pt). Likely cause: geom_text
    size values and color=''sector'' on the label layers.'
  - 'VQ-02 (both): ''Atmospheric CO2 Tech'' overlaps the ''Sustainability'' sector
    header, and labels lie on markers: ''eBPF Observability'' on a Biotech marker,
    ''AI Agent Frameworks'' on its marker, ''Lab-Grown Proteins'' on an Infrastructure
    marker, ''Energy Analytics'' and ''Carbon Accounting SW'' on green markers → every
    label clear of headers and markers. Likely cause: the vertical-only nudge ignores
    sector headers and markers.'
  - 'VQ-05 (both): the framed legend at legend_position (0.13, 0.10) sits on the Infrastructure
    Assess and Hold rings and hides their lower ends, labels such as ''Photonic Computing''
    float outside the arc, and a wide empty band separates the subtitle from the arc
    → legend in the open part or below the chart, labels inside the arc. Likely cause:
    legend_position=(0.13, 0.10) and fixed axis limits (-9.5, 9.5) / (-7.5, 8.5).'
  - 'SC-02 (both): names are not beside their markers (C5): the nudge pushes ''Photonic
    Computing'' to the upper left while its marker sits on the lower-left Hold ring,
    and ''Organoid Platforms'', ''Synthetic Biology'' and ''mRNA Therapeutics'' land
    in the Infrastructure sector or below the arc; the legend covers the rings instead
    of using the open part (C1) → each name next to its own marker. Likely cause:
    labels nudged up to several units vertically with no link back to the marker.'
  - 'VQ-03 (dark): the Hold-ring markers at alpha 0.6 and size 3.5 fade into the dark
    red Hold fill → alpha 0.85 or higher (+0.25). Likely cause: RING_ALPHA_PT[''Hold'']
    = 0.6.'
  - 'VQ-07 (both): the four ordered rings are filled with four unrelated hues (green,
    amber #DDCC77, ochre, red) instead of ordered steps of one Imprint ramp → steps
    of one Imprint ramp in ring order, green pole on Adopt and red pole on Hold. Likely
    cause: the RING_FILL_COLOR dict.'
  - 'Suggestion: a frameless legend would suit the minimal chrome.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1.
      Chrome: bold title and italic subtitle 'Inner rings → near-term adoption · Outer rings → future exploration' in dark ink; bold sector headers outside the arc; ring names Adopt/Trial/Assess/Hold in the open bottom gap; framed 'Category' legend at the lower left on top of the Infrastructure rings. Text readable, item labels small (about 4 pt).
      Data: 270 degree arc with green, amber, ochre and red ring fills; 26 markers colored by sector (AI & ML blue, Biotech rose, Infrastructure ochre, Sustainability green), larger inside, faded outside. Labels in sector colors are pushed far from their markers (Photonic Computing upper left, mRNA Therapeutics below the arc); 'Atmospheric CO2 Tech' overlaps the 'Sustainability' header; several labels lie on markers.
      Legibility verdict: PASS (small, detached labels)

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, headers and ring names in light ink; legend on #242420 with a soft frame; no dark-on-dark text.
      Data: sector colors identical to the light render; sector-colored labels on the dark brown and olive bands have low contrast; faded Hold markers dim on the dark red band.
      Legibility verdict: PASS (weak contrast for some colored labels)
