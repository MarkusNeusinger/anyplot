review:
  strengths:
  - Uses MUI X v9 composition (ChartsContainer + ScatterPlot + ChartsGrid + ChartsXAxis/ChartsYAxis)
    and the useXScale/useYScale hooks to draw the per-group mean lines as a native
    SVG layer in data coordinates
  - Seeded sideways jitter of half-width 0.27 slots keeps every value exact on the
    y axis while each group forms a clear strip with wide gaps between neighbours
  - Points share one size at fillOpacity 0.62, so the dense middle of each strip reads
    darker in both themes
  - Groups ordered Placebo → Naproxen form a descending staircase of means, and each
    mean line takes its group's Imprint color so the reference reads without a legend
  - Theme tokens threaded through every chrome element (title, subtitle, ticks, axis
    lines, grid); both renders are fully legible
  weaknesses:
  - 'Suggestion: the mandated title fills only about 27 % of the width; a slightly
    larger title (about 26 px) would give the header more presence.'
  - 'Suggestion: the y axis line could be dropped, since the horizontal grid already
    carries the value scale.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white, consistent with #FAF8F1 (not pure white).
      Chrome: bold dark title "strip-basic · javascript · muix · anyplot.ai" centered at top with a grey subtitle "168 observations in 4 groups · line: group mean"; y axis "Time to relief (minutes)" 0–70 with ticks every 10, x axis "Treatment group" with Placebo, Paracetamol 1 g, Ibuprofen 400 mg, Naproxen 500 mg; subtle light-grey horizontal grid; all text readable dark-on-light.
      Data: four jittered strips of 42 translucent circles each — Placebo in brand green #009E73, Paracetamol lavender #C475FD, Ibuprofen blue #4467A3, Naproxen ochre #BD8233 — each with a short solid mean line in its own color (~48, ~29, ~19, ~12 min). Overlapping points read darker; two low Placebo outliers (~21, ~14) visible.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black, consistent with #1A1A17 (not pure black).
      Chrome: title in light ink, subtitle and tick labels in light grey, axis titles light; grid subtle dark grey; no dark-on-dark text anywhere.
      Data: identical positions and the same four Imprint hues as the light render (translucency makes them look deeper on the dark page); mean lines identical; brand green clearly visible.
      Legibility verdict: PASS
