review:
  strengths:
  - Jitter width (0.18) and point alpha (0.62) both land inside the spec's recommended
    ranges (0.1-0.3 and 0.5-0.7), producing a legible density-revealing strip plot.
  - Idiomatic composable MUI X usage (ChartContainer + ScatterPlot + ChartsXAxis/ChartsYAxis/ChartsGrid)
    with the Imprint palette applied via t.palette in canonical order and skipAnimation
    set correctly.
  - Deterministic seeded LCG + Box-Muller data generation yields a realistic, neutral
    clinical dataset (time to symptom relief across four treatment groups) with a
    clear decreasing-trend narrative from Control to Drug C.
  - 'Clean theme-adaptive chrome: top/right spines hidden, subtle horizontal-only
    gridlines, generous margins, both light and dark renders fully readable.'
  weaknesses:
  - Title omits the optional descriptive prefix, so it occupies only ~25% of the plot
    width and reads as visually small against the generous whitespace above the plot
    area — consider a short prefix like 'Time to Symptom Relief · strip-basic · javascript
    · muix · anyplot.ai' to better balance the composition.
  - No mean/median reference lines were added despite the spec's suggestion ('Consider
    adding horizontal lines for group means or medians as reference') — a subtle per-group
    mean tick or line would strengthen the decreasing-trend narrative and improve
    data storytelling.
  - Points within each category (especially Control, n=42) overlap heavily; widening
    jitter toward the upper end of the recommended range (~0.25-0.3) or slightly reducing
    markerSize would improve individual point distinguishability without harming category
    identity.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Bold centered title "strip-basic · javascript · muix · anyplot.ai" in dark ink at the top; dark "Treatment Group" x-axis label and dark "Time to Relief (minutes)" y-axis label; soft grey tick labels on both axes; subtle horizontal-only gridlines. All chrome text is clearly readable against the light background.
      Data: Four jittered strip columns (Control, Drug A, Drug B, Drug C) using the Imprint palette in canonical order — Control is brand green #009E73, Drug A is lavender, Drug B is blue, Drug C is ochre/amber. Points use alpha transparency (~0.62) so overlapping observations are visible as denser blobs. Values decrease from Control (highest, ~20-69 min) through Drug C (lowest, ~4-22 min), a clear treatment-effect narrative.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Same title, now in light/white ink; axis labels and tick labels flipped to light grey/white; gridlines remain subtle but visible against the dark surface.
      Data: Same four category colors as the light render (green, lavender, blue, ochre) — data hues are identical between themes, confirming only chrome flipped. No dark-on-dark text found; all titles, axis labels, and tick labels are clearly legible against the near-black background.
      Legibility verdict: PASS
