      Data: Each category shows a jittered strip of ~70 circular markers in a distinct Imprint color — green #009E73 (Lecture-Based), lavender (Flipped Classroom), blue (Project-Based), ochre (Blended), matching canonical Imprint order with the first series green as required. A dark dashed horizontal line sits within each category's band marking the group mean.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Same title/axis/tick chrome now renders in light ink, clearly legible against the dark surface — no dark-on-dark failures anywhere. The dashed mean-reference lines render in light gray, clearly visible against the dark background.
      Data: Marker colors confirmed identical to the light render (green/lavender/blue/ochre unchanged, same opacity and border treatment) — only chrome (background, text, grid, mean-line stroke) flipped as required.
