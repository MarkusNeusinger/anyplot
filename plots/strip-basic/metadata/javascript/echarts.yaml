    composition — push DE-01 further with more deliberate typographic hierarchy or
    subtle refinements beyond the palette itself'
  - 'No data storytelling / visual hierarchy (DE-03 default): the spec explicitly
    suggests ''adding horizontal lines for group means or medians as reference'' —
    add a markLine per category (or one global reference) to give the viewer an immediate
    focal point instead of a flat point cloud'
  - Within-category marker overlap is heavy (70 points per category with symbolSize=16,
    opacity=0.65) — consider slightly smaller markers or a wider jitter spread to
    reduce clumping and improve VQ-03 element visibility
  - 'Library Mastery is generic-to-moderate: leans on a basic scatter+symbolOffset
