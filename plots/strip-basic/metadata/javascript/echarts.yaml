review:
  strengths:
  - Group-mean dashed reference lines directly address the attempt-1 feedback and
    the spec's Notes suggestion, giving each category a clear visual focal point for
    comparison
  - The mean line is implemented as a `custom` series with `renderItem`/`api.coord`
    rather than a native `markLine` — a technically sophisticated, well-reasoned choice
    (explained in a code comment) since a category axis can't confine a markLine to
    a single band
  - Marker size reduced from the prior attempt (16 -> 12) with opacity 0.6, directly
    reducing within-category clumping while still showing density via accumulation,
    matching the spec's jitter/alpha guidance
  - 'Border ring (`borderColor: t.pageBg`) around each marker creates a subtle cutout
    effect that helps separate overlapping points without extra visual noise'
  - 'Imprint palette pixel-consistent between renders: green/lavender/blue/ochre in
    canonical order, first series is brand green `#009E73`'
  - Theme-adaptive chrome fully correct in both renders — background exactly `#FAF8F1`/`#1A1A17`,
    all text and the mean-line color (`t.inkSoft`) readable with no dark-on-dark or
    light-on-light failures
  - Deterministic, reproducible data via fixed-seed LCG + Box-Muller, clamped to plausible
    0-100 exam scores
  - Redundant legend correctly omitted since category identity is already carried
    by the x-axis
  weaknesses:
  - The dashed mean-reference line has no label or legend entry — a first-time viewer
    can infer it's some kind of reference from the dash style, but cannot tell it
    specifically represents the group mean without external context; a small text
    annotation near one line (e.g. 'mean') or a legend entry would close this gap
  - Within-category overlap is still fairly heavy in the densest clusters (e.g. Project-Based
    ~78-82 band) — a slightly wider jitter width could further separate points without
    harming the category-band containment
  image_description: |-
