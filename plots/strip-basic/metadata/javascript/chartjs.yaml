review:
  strengths:
  - Correct Imprint palette in canonical order (green, lavender, blue, ochre) across
    all 4 treatment groups, identical data colors between light and dark renders
  - Deterministic fixed-seed LCG RNG (seed=42) with a clean Box-Muller gaussian helper
    — fully reproducible data generation
  - Jitter width (0.22) and marker alpha (0.65) both fall inside the spec-recommended
    ranges (0.1-0.3, 0.5-0.7), effectively reducing overplotting
  - Theme-adaptive chrome correctly threaded through every text element (title, axis
    titles, ticks) via window.ANYPLOT_TOKENS — both renders are fully legible with
    no dark-on-dark or light-on-light failures
  - The dose-response relationship (decreasing response time and spread from Placebo
    to High Dose) is immediately visible without any extra annotation
  weaknesses:
  - 'Markers have pointBorderWidth: 0 — no white/light edge stroke despite frequent
    point overlap in the Placebo and Low Dose clusters; the style guide recommends
    an edge stroke for overlapping scatter markers to preserve individual point definition'
  - Spec explicitly suggests adding horizontal reference lines for group means/medians
    ('Consider adding horizontal lines for group means or medians as reference') —
    none are present; a subtle dashed per-group mean line would meaningfully strengthen
    the data storytelling (DE-03) without adding clutter
  - 'Library Mastery is generic: the linear-scale + ticks.callback trick to fake categorical
    x-positions is a standard workaround replicable in almost any charting library
    — nothing here is distinctly Chart.js (e.g. no use of a Chart.js-specific plugin,
    scriptable style function, or interaction mode)'
  - Title occupies only ~30-35% of canvas width at the default 22px size, leaving
    the top of the canvas visually light relative to the dense plot area below — not
    a violation, but bumping title size slightly would improve visual-hierarchy balance
  - Visual refinement stays close to the library-prompt skeleton defaults (grid, spacing)
    with little extra polish beyond what the reference example already provides
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Bold dark title "strip-basic · javascript · chartjs · anyplot.ai" centered at top, clearly readable. X-axis title "Treatment Group" and Y-axis title "Response Time (minutes)" in dark ink, tick labels in a slightly softer gray. Subtle horizontal gridlines only (no vertical gridlines). All chrome text is dark-on-light and fully legible.
      Data: Four jittered point clusters over category positions Placebo / Low Dose / Standard Dose / High Dose. Placebo = brand green (#009E73), Low Dose = lavender (#C475FD), Standard Dose = blue (#4467A3), High Dose = ochre (#BD8233) — matches Imprint canonical order 1-4. Points are semi-transparent (alpha ~0.65) so overlapping density reads clearly. Response times visibly decrease and tighten in spread from Placebo (~25-57 min) to High Dose (~10-29 min).
      Legibility verdict: PASS — no light-on-light or hard-to-read text anywhere.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Title and axis titles render in light/near-white ink, tick labels in a softer light gray — all clearly visible against the dark background. Gridlines are faint light-toned horizontal lines, subtle but present.
      Data: Same four category colors as the light render — green, lavender, blue, ochre — pixel-identical hues, confirming only chrome (not data) flips between themes. Same distributional pattern (dose-response trend) is equally readable on the dark surface.
      Legibility verdict: PASS — no dark-on-dark failures; every title/label/tick is clearly visible against the near-black background.
