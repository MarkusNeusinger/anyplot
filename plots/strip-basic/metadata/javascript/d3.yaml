review:
  strengths:
  - Correct Imprint palette assignment across all 4 batches (green → lavender → blue
    → ochre, positions 1-4), identical hues in both light and dark renders
  - 'Theme-adaptive chrome correctly threaded end-to-end: backgrounds (#FAF8F1 / #1A1A17),
    title/axis text, tick labels, and gridlines all read correctly in both themes
    with no dark-on-dark or light-on-light failures'
  - Jitter width, marker opacity (0.6), and points-per-category (60) all sit within
    the spec's recommended ranges (0.1-0.3 relative jitter, 0.5-0.7 alpha, 10-200
    points)
  - Deterministic, reproducible data generation via a seeded LCG + Box-Muller normal
    sampler
  - Y-axis-only gridlines are the right convention for a categorical-x scatter-style
    plot, and the single-series-per-position legend is correctly omitted since color
    and x-position both already encode category
  - Correct mandated title format; idiomatic D3 usage of scaleBand/scaleOrdinal/scaleLinear
    plus a proper selection.data().join() marks pattern
  weaknesses:
  - Design Excellence is generic — the chart looks like a well-configured default
    with no distinctive typographic or visual polish beyond palette + gridline choices
  - 'No data-storytelling device is used even though the spec explicitly suggests
    one: ''Consider adding horizontal lines for group means or medians as reference.''
    Adding per-category mean/median tick marks (in the neutral/muted token color)
    would both create a visual focal point — Batch 3''s much wider spread and lower
    mean stand out clearly in the data — and satisfy DE-03/data-storytelling'
  - Library Mastery is generic — the jitter is plain uniform random offset (rand()
    - 0.5) * jitterWidth, which is trivially replicable in any plotting library. A
    D3-distinctive touch (e.g. d3.forceSimulation()-based collision jitter for a true
    beeswarm layout, or d3.randomNormal for the RNG instead of a hand-rolled LCG)
    would leverage something unique to this library
  - Batch 2's dense cluster around 12.05-12.11 shows moderate point overlap — slightly
    smaller radius or lower opacity in the densest band would sharpen element visibility
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white, not dark.
      Chrome: Bold dark title "strip-basic · javascript · d3 · anyplot.ai" centered at top; dark "Production Batch" x-axis label and rotated "Shaft Diameter (mm)" y-axis label; dark tick labels on both axes; subtle horizontal gridlines only (appropriate for a categorical-x scatter-style plot). All fully legible.
      Data: Four jittered strip columns (Batch 1-4) in Imprint palette order — green (#009E73), lavender (#C475FD), blue (#4467A3), ochre (#BD8233). Points have a thin cream stroke for edge definition against the light background. Batch 3 shows a visibly wider spread and several low outliers (down to ~11.76) versus the tighter clusters of Batches 1, 2, and 4.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black, not light.
      Chrome: Title and axis labels render in light/off-white text, clearly visible; tick labels are light gray and readable; gridlines are subtle light lines on the dark surface. No dark-on-dark or light-on-light failures observed.
      Data: Identical four hues to the light render (green, lavender, blue, ochre) — data colors did not shift with theme, only chrome flipped as expected. Point stroke color adapts to the dark page background.
      Legibility verdict: PASS
