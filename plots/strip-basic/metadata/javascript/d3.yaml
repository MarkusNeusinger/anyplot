review:
  strengths:
  - Genuinely idiomatic use of the d3-force submodule (forceX + forceCollide, pinned
    fy) to resolve horizontal jitter algorithmically instead of a naive uniform random
    offset — a distinctive, library-appropriate technique
  - Batch mean dashed reference lines plus an explanatory caption create real data
    storytelling, drawing the eye to Batch 3's downward mean shift and wider spread
  - 'Correct Imprint palette: first series is #009E73, remaining batches follow canonical
    order (#C475FD, #4467A3, #BD8233), identical across light/dark, only chrome flips'
  - 'Clean visual refinement: y-axis-only gridlines, domain/tick lines themed via
    inkSoft/grid tokens, no default spine clutter'
  - Descriptive axis labels with units ("Shaft Diameter (mm)"), correct mandated title
    format, both fully legible in both themes
  weaknesses:
  - The spec calls for "random horizontal jitter"; the implementation instead uses
    a deterministic force-simulation collision layout (a beeswarm technique). It still
    reduces overplotting and reads well, but it is a step beyond the basic strip-plot
    jitter the spec describes — worth noting since the spec explicitly distinguishes
    strip plots (random jitter) from swarm plots (collision-resolved layout) as different
    chart types.
  - In the densest regions per batch (e.g. Batch 3 around 11.85-11.90mm, Batch 2 around
    12.05-12.10mm) points still visually merge because only x is jittered while y
    stays pinned to the true value — a slightly smaller point radius or lower alpha
    in those clusters would improve individual-point visibility.
  - The "Dashed line = batch mean" annotation is quite small (14px, top-left corner)
    relative to how load-bearing it is for interpreting the reference lines — a touch
    more visual weight (size or placement nearer the lines) would help it register
    faster.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "strip-basic · javascript · d3 · anyplot.ai" in bold dark ink at top-center; x-axis label "Production Batch" and rotated y-axis label "Shaft Diameter (mm)" in dark ink; tick labels (Batch 1-4, 11.75-12.15 in 0.05 steps) in soft dark gray; italic caption "Dashed line = batch mean" top-left inside the plot area; subtle horizontal-only gridlines.
      Data: Four category swarms (Batch 1-4) of jittered circles in Imprint palette order — green (#009E73), lavender (#C475FD), blue (#4467A3), ochre (#BD8233) — each ~55% fill-opacity with a thin light-colored stroke for edge definition; a dashed gray horizontal line marks each batch's mean, visually calling out Batch 3's lower mean and wider spread (down to ~11.76mm) versus the tighter Batch 1/2/4 clusters.
      Legibility verdict: PASS — all title, axis labels, tick labels, and the annotation caption are clearly readable against the light background; no light-on-light text.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Same title, axis labels, tick labels, and caption now rendered in light gray/white ink; gridlines switch to a subtle light-gray tone visible against the dark background; mean reference lines render as light dashed gray.
      Data: Identical marker colors and positions to the light render (green/lavender/blue/ochre swarms, same jitter layout, same mean lines) — confirms only chrome flipped between themes, not data colors.
      Legibility verdict: PASS — all text (title, axis labels, ticks, caption) is clearly legible light-on-dark; no dark-on-dark failures; brand green remains visible on the dark surface.
