review:
  strengths:
  - 'Excellent theme-adaptive chrome — both light and dark renders are fully legible
    with correct #FAF8F1/#1A1A17 backgrounds, subtle gridlines, and no dark-on-dark
    or light-on-light failures.'
  - 'Idiomatic, distinctive Altair implementation: uses the native xOffset quantitative
    channel for jitter combined with a genuine Box-Muller Gaussian random offset (transform_calculate)
    instead of a naive uniform-random hack — a technique that''s hard to replicate
    as cleanly in other libraries.'
  - Mean-reference tick layer with its own legend entry gives the strip plot a clear
    data-storytelling element (group comparison at a glance) without cluttering the
    raw observation points.
  - 'Correct Imprint palette usage — brand green #009E73 for the data series, #C475FD
    accent for the mean ticks, both identical and stable across themes.'
  - Realistic, neutral business scenario (survey response scores by department) with
    genuine per-group variance (different means/stds per department) demonstrating
    real feature coverage rather than four identical-looking blobs.
  weaknesses:
  - Aesthetic sophistication and visual refinement (DE-01/DE-02) are close to a well-configured
    default — consider a stronger typographic hierarchy or a subtitle/annotation calling
    out the highest- or lowest-mean department to push past 'good default' into 'publication-ready.'
  - Y-axis title 'Response Score' has no unit or scale hint — add something like 'Response
    Score (0–100)' for full VQ-06 credit.
  - Marker overlap is noticeable in the denser clusters (Engineering, Sales) — consider
    nudging the jitter multiplier toward the upper end of the spec's 0.1–0.3 range
    or slightly lowering opacity to reduce visual clumping.
  - The bordered 'Group Mean' legend box sits a little isolated below the x-axis title
    with a full stroke frame around it — consider tightening the spacing to the plot
    or dropping the box frame per the style guide's Decoration Removal Checklist for
    a cleaner look.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Title "strip-basic · python · altair · anyplot.ai" bold dark text top-center, comfortably sized (well under 90% of width, not overflowing). Y-axis "Response Score" (30–110) with subtle horizontal gridlines only. X-axis "Department" with 4 categories (Engineering, Marketing, Sales, Support), labels horizontal (labelAngle=0), no rotation needed. "Group Mean" legend box bottom-left with a horizontal purple tick swatch. All chrome text (title, axis titles, tick labels, legend) renders in dark ink tones (INK / INK_SOFT) — clearly readable against the light background.
      Data: Green (#009E73) circles at opacity ~0.65, jittered horizontally within each category band, showing 35–50 individual response scores per department. Lavender (#C475FD) horizontal tick marks overlaid per category mark each group's mean.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Identical layout to the light render — title, axis titles, tick labels, and the "Group Mean" legend all render in light ink tones (F0EFE8 / B8B7B0), clearly readable against the dark background. No dark-on-dark text found on any element (title, ticks, axis labels, legend all confirmed legible).
      Data: Same green (#009E73) circles and lavender (#C475FD) mean ticks as the light render — data colors are identical between themes; only the chrome (background, text, grid, legend box fill) flips.
      Legibility verdict: PASS
