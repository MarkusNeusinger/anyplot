review:
  strengths:
  - stat_summary(fun="mean", fun_min="lq", fun_max="uq", geom="pointrange") overlay
    adds genuine analytical value and visual hierarchy on top of the raw jittered
    points.
  - Jitter width (0.25) and alpha (0.65) both land in the spec-recommended ranges,
    and geom_jitter(..., seed=42) keeps the jitter itself reproducible.
  - Correct canonical Imprint palette order and fully theme-correct chrome (mean marker
    flips black to white, all text legible in both themes).
  - Clean, minimal, well-organized code - flat script, only used imports, sensible
    variable names.
  weaknesses:
  - Title omits the {language} token from the mandated format - currently "strip-basic
    · letsplot · anyplot.ai", should be "strip-basic · python · letsplot · anyplot.ai".
  - Full 4-sided panel border (theme_minimal() default) reads as less refined than
    a top/right-spine-removed look - consider panel_border=element_blank() or thinning
    it via theme() to match the "spines removed" style-guide guidance.
