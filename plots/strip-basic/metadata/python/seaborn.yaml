review:
  strengths:
  - Clean strip plot with proper jitter (0.3) and alpha (0.6), both squarely inside
    the spec's recommended ranges
  - 'Custom Imprint palette applied correctly via hue, first series is #009E73, canonical
    order preserved'
  - 'Effective storytelling: group-mean diamond overlay + dashed overall-mean reference
    line + callout annotation on the top department creates clear visual hierarchy
    without clutter'
  - Theme-adaptive chrome correctly threaded through INK/INK_SOFT/PAGE_BG tokens —
    both light and dark renders are fully legible with no dark-on-dark or light-on-light
    failures
  - Canvas is exactly 3200x1800 (landscape default), no bbox_inches="tight" clipping
  - Reproducible via fixed seed; realistic, neutral synthetic dataset with a nice
    bimodal Sales distribution for added realism
  weaknesses:
  - The 'Engineering leads · 77 avg' annotation arrow passes very close to a high-value
    Marketing data point (~88), creating minor visual crowding near the callout text
    — nudge xytext further right/up or shorten the arrow for clearance
  - Library mastery is solid but fairly standard (stripplot + pointplot overlay);
    could push further with an additional distributional cue (e.g. a faint violin/box
    outline underlay) while keeping the strip-plot identity
  - Data is clipped to [40, 100], slightly truncating the low tail of Marketing's
    distribution (one point sits right at ~40.6 near the boundary) — a wider clip
    range would preserve the natural spread more faithfully
