review:
  strengths:
  - 'Idiomatic seaborn layering: stripplot for raw observations + pointplot(errorbar=None,
    linestyle=''none'') for group means, avoiding manual aggregation code'
  - Correct hue= + palette= + legend=False pattern per the 0.14+ API compatibility
    guidance
  - 'Genuine data variety: Sales uses a bimodal two-component distribution while other
    departments vary in spread, giving the strip plot real distribution shape to reveal'
  - Theme-adaptive chrome is fully correct in both renders, including the mean-marker
    color flipping via the INK token
  - Marker edgecolor=PAGE_BG creates a subtle punch-hole separation effect between
    overlapping points
  weaknesses:
  - The black Group Mean diamond marker sits directly on top of underlying data points
    in dense clusters (Sales, HR), hiding several observations behind it — add a background-colored
    halo/edge stroke around the diamond (e.g. markeredgecolor=PAGE_BG, markeredgewidth=1.5)
    so it reads as a distinct overlay layer rather than occluding data
  - Strip points overlap substantially within the densest sub-clusters (Sales ~60-65,
    HR ~52-59) — with ~35-40 points/category at size=6/alpha=0.7/jitter=0.25, several
    pairs of points are hard to distinguish as separate observations; try a slightly
    wider jitter (~0.3) or lower alpha (~0.55-0.6) to reduce visual clutter
  - Design Excellence is solid but generic beyond the mandated palette and the mean-overlay
    technique — consider a small storytelling touch (e.g., a subtle annotation naming
    the highest/lowest-mean department, or a faint overall-average reference line)
    to sharpen the insight
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white (#FAF8F1-like), not pure white
      Chrome: title "strip-basic · python · seaborn · anyplot.ai" centered at ~43% canvas width in dark ink; axis labels "Department"/"Satisfaction Score" and tick labels dark/soft-dark, all clearly readable; "Group Mean" legend box top-right, fully within canvas
      Data: four department clusters colored via Imprint canonical order - #009E73 green (Engineering), #C475FD lavender (Marketing), #4467A3 blue (Sales), #BD8233 ochre (HR); black diamond marks each group's mean
