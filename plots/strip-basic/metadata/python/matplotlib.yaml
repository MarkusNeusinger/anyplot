review:
  strengths:
  - 'Clear data storytelling: the flagged Line C is called out with amber color, a
    matching mean-reference line, and a contextual callout box explaining the +0.038mm
    drift and ~2x spread — the viewer sees the insight immediately'
  - Correct, well-justified Imprint palette use — first three lines use canonical
    positions 1-3 and the flagged line intentionally borrows the amber semantic anchor
    for its 'warning/caution' role, explained in the annotation text
  - Tolerance band (axhspan) and target reference line (axhline) give the strip plot
    a factual frame of 'in spec' vs 'out of spec' that ties directly into the realistic
    QC scenario
  - Full theme-adaptive chrome — both plot-light.png and plot-dark.png are clean,
    legible, and use identical data colors with correctly flipped background/text/grid
  - 'Realistic, appropriately scaled manufacturing tolerance data (25.000mm +/- 0.050mm)
    with genuine feature coverage: different means and spreads per production line,
    including a visibly wider-spread flagged group'
  - Correct canvas (3200x1800), explicit font sizing throughout, mandated title format,
    no clipping at any canvas edge in either render
  weaknesses:
  - Title occupies only ~48% of the plot width — on the low end of the typical range
    for a plain mandated title; a touch more fontsize (e.g. 13-13.5pt) would balance
    it closer to the 50-70% target without risking overflow
  - X-axis margins are slightly asymmetric — noticeably more empty space to the right
    of Line D than to the left of Line A; tightening set_xlim's right bound would
    balance canvas utilization
  - Distinctive-feature usage (annotate + axhspan) is solid but fairly replicable
    in other libraries; a more matplotlib-specific touch (e.g. custom Path/patch for
    the callout, or violin-style KDE outline behind the strip) would push Library
    Mastery higher
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Title "strip-basic · python · matplotlib · anyplot.ai" in dark ink, centered top. X-axis "Production Line" with categorical ticks Line A/B/C/D; y-axis "Shaft Diameter (mm)" with numeric ticks from 24.950 to 25.100. Subtle horizontal gridlines, L-shaped spines (top/right removed). A shaded tolerance band (24.95-25.05) and a dashed target line at 25.000 sit behind the data. All text renders in dark ink, clearly legible.
      Data: Four jittered strip columns. Line A = brand green (#009E73), Line B = lavender (#C475FD), Line C = amber (#DDCC77, semantic "warning" override in place of the canonical blue slot) with a matching amber mean line and a callout box reading "Line C: +0.038mm above target, ~2x spread — check tooling wear", Line D = ochre (#BD8233). Solid horizontal mean-reference lines sit within each column (dark ink for A/B/D, amber for C). Markers are appropriately sized (s=110) with alpha=0.65 and background-matched edges to separate overlapping points.
      Legibility verdict: PASS — all text is dark-on-light and clearly readable; no clipping at any canvas edge; annotation box and arrow stay clear of the data cloud.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Same title, axis labels, and ticks now rendered in light ink (off-white/light-gray), clearly visible against the dark surface. Gridlines and spines flip to light, subtle tones. Tolerance band and dashed target line remain visible at low contrast, as intended.
      Data: Identical four data colors to the light render — green, lavender, amber, ochre — confirming palette consistency across themes. Mean-reference lines are white/light for A, B, D and amber for the flagged Line C, both clearly distinguishable from the dark background. The callout box uses the dark "elevated" fill (#242420) with a light border and light text, fully legible.
      Legibility verdict: PASS — no dark-on-dark failures observed; every title, axis label, tick label, and annotation is clearly readable against the #1A1A17 surface.
