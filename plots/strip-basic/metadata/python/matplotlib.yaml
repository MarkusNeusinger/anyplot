review:
  strengths:
  - 'Excellent data storytelling: the amber-flagged Line C with an annotated callout
    immediately draws the eye to the out-of-spec production line and explains why
    (mean offset + spread) in plain language.'
  - 'Correct Imprint palette use, including a legitimate semantic exception (amber
    #DDCC77 for the ''flagged/warning'' line), while the other three lines still follow
    canonical palette order starting at brand green.'
  - Theme-adaptive chrome is fully correct in both renders — title, axis labels, tick
    labels, mean-line color, and annotation box all flip appropriately with no dark-on-dark
    or light-on-light failures.
  - Sensible reference elements (tolerance band, target dashed line, per-group mean
    bars) give the strip plot real analytical context without cluttering the individual-point
    encoding.
  - Jitter width (±0.18) and marker alpha (0.65) both land inside the spec's recommended
    ranges (0.1-0.3 jitter, 0.5-0.7 alpha), and the seed is fixed for reproducibility.
  weaknesses:
  - Annotation callout text (fontsize=7.5) becomes illegible when the PNG is scaled
    to the 400px mobile thumbnail — increase to ~9-10pt or shorten the annotation
    so it survives the mobile-width legibility check.
  - 'Title omits the required ''{language}'' segment: it reads ''strip-basic · matplotlib
    · anyplot.ai'' but the spec format is ''{spec-id} · {language} · {library} · anyplot.ai''
    — should be ''strip-basic · python · matplotlib · anyplot.ai''.'
  - The subtle violin KDE silhouette behind the jittered points blends the strip plot
    with the visual language of a violin plot, which the spec explicitly frames strip
    plots as an alternative to ('Unlike box plots or violin plots that show summary
    statistics...'). Keep it very low-emphasis (already alpha=0.15) or drop it so
    the individual points stay the unambiguous focal encoding.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "strip-basic · matplotlib · anyplot.ai" in dark ink, centered and fully visible; x-axis label "Production Line" and y-axis label "Shaft Diameter (mm)" in dark ink; tick labels in a softer grey; a light shaded tolerance band (24.95-25.05mm) and a dashed target line at 25.000mm sit behind the data.
      Data: Four production-line groups (Line A-D) shown as jittered scatter points over faint violin silhouettes, each with a solid mean-line bar. Line A is brand green (#009E73), Line B lavender (#C475FD), Line C amber (#DDCC77, semantic "flagged" color), Line D ochre (#BD8233). An annotated callout box (light elevated fill, dark border) explains why Line C is flagged, connected to the Line C violin by a thin leader line.
      Legibility verdict: PASS for title/axis/tick text; FAIL for the small annotation text, which becomes blurry/illegible once the image is scaled down to the 400px mobile thumbnail (verified against plot-light_400.png).

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Title, axis labels in light cream ink; tick labels in a softer light grey; tolerance band and dashed target line rendered in the theme-adaptive muted tone, still visible against the dark surface.
      Data: Same four category colors as the light render (green/lavender/amber/ochre) — confirmed identical data colors across themes, only chrome flipped. Mean-line bars are white/cream instead of black (correctly using the theme-adaptive INK token). Annotation box uses the dark elevated fill (#242420) with a light border and light text, clearly readable against the dark plot background — no dark-on-dark failure.
      Legibility verdict: PASS for title/axis/tick text and annotation chrome contrast; FAIL for the same small annotation fontsize issue as the light render (mobile-scale legibility).
