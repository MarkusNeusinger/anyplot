      Data: Four jittered point clouds in Imprint canonical order — Engineering #009E73 (green), Marketing #C475FD (lavender), Sales #4467A3 (blue), Support #BD8233 (ochre) — each ~40 points at opacity 0.60 spread by random horizontal jitter. Larger red (#AE3030) mean markers per category, connected by a dashed red line, sit above the scatter cloud as a focal reference layer. First series is confirmed brand green #009E73.
      Legibility verdict: PASS — no light-on-light or illegible text found; checked title, axis titles, tick labels, and legend individually via edge crops.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title/axis-title/tick-label/legend layout as the light render, but all rendered in light/off-white ink. Fully readable against the dark background; grid lines remain subtle.
      Data: Identical to the light render pixel-for-pixel in hue — green/lavender/blue/ochre categorical points plus red mean markers and dashed connector — confirming only chrome (not data color) flips between themes.
      Legibility verdict: PASS — no dark-on-dark failures; verified via top/bottom edge crops that title, axis labels, tick labels, and legend text are all light-colored and legible.
