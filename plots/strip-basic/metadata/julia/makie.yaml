review:
  strengths:
  - Composite design combining jittered strip points with translucent ±1 SD range
    bars and a mean-tick overlay per batch — genuine data storytelling beyond a bare
    strip plot, computed from the actual sampled readings (not hardcoded).
  - Explicit font sizing at every level (titlesize=20, xlabelsize/ylabelsize=14, tick
    label sizes=12) with a clean theme-token flip (INK/INK_SOFT/PAGE_BG); all text
    stays legible in both light and dark renders, including at the ~400px mobile thumbnail.
  - Full Imprint categorical palette in canonical order (green batch A → lavender
    → blue → ochre) applied consistently, identical data colors across light/dark,
    correct theme-adaptive chrome (spines, grid, tick colors, background).
  - Realistic manufacturing QC scenario (ball-bearing diameter across 4 production
    batches) matching the spec's own suggested application, with plausible tolerances
    and per-batch mean/std computed from real sampled data.
  - 'Clean, idiomatic Makie: Figure/Axis grammar, rangebars!, linesegments!, scatter!
    — no functions/classes, seeded RNG (Random.seed!(42)), minimal and fully-used
    imports, correct px_per_unit=2 save producing exact 3200×1800 canvas.'
  weaknesses:
  - Densest sub-clusters (e.g. Batch D points around 9.90–9.95mm) show noticeable
    point overlap — consider markersize ~8 or alpha ~0.5 there for slightly cleaner
    separation.
  - Mean-tick linewidth (3) reads a bit bold next to the deliberately subtle range
    band it sits beside — a touch thinner would integrate the two overlay elements
    more smoothly without losing legibility.
  - rangebars!/linesegments! is a nice combination but is conceptually replicable
    via errorbar-style calls in other libraries; leaning on a more Makie-unique composition
    device (e.g. Block-based layout) would push Library Mastery further.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Bold dark title "strip-basic · julia · makie · anyplot.ai" centered at top, dark axis labels ("Production Batch" / "Bearing Diameter (mm)"), soft grey tick labels and category names (Batch A–D), subtle horizontal-only gridlines, top/right spines removed. All chrome text is clearly legible.
      Data: Four jittered strip columns — Batch A green (#009E73), Batch B lavender, Batch C blue, Batch D ochre — matching Imprint canonical order. Each batch has a translucent ±1 SD range band and a solid black mean-tick line drawn over the point cloud.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Title, axis labels, and tick labels have flipped to light/white tones, fully readable against the dark surface; mean-tick lines flipped from black to white; gridlines remain subtle. No dark-on-dark text anywhere.
      Data: Same four batch colors (green/lavender/blue/ochre) as the light render — data hues are identical between themes, only chrome flipped, confirming correct theme-adaptive implementation.
      Legibility verdict: PASS
