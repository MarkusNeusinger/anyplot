review:
  strengths:
  - 'Correct plot type: strip plot with per-point random horizontal jitter (±0.25
    units, within the spec''s moderate-jitter guidance) cleanly separates the four
    production batches without adjacent-category bleed'
  - Theme-adaptive chrome is fully threaded through INK/INK_SOFT/PAGE_BG tokens —
    title, axis labels, ticks, spines, and grid all flip correctly between light and
    dark, while the four data colors stay pixel-identical
  - 'Categorical color mapping follows the canonical Imprint palette order (index
    1–4) with Batch A correctly anchored to brand green #009E73'
  - 'Clean, reproducible, KISS-structured code: single seeded RNG call, one data-generation
    loop, no unused imports, correct canvas (1600×900 @ px_per_unit=2 → 3200×1800)
    and save call'
  - Title format exactly matches the mandated `strip-basic · julia · makie · anyplot.ai`
    convention, and axis labels are descriptive with units ("Bearing Diameter (mm)")
  weaknesses:
  - No visual hierarchy or focal point beyond the raw jittered points — the spec explicitly
    suggests 'horizontal lines for group means or medians as reference'; adding a
    short hlines!/linesegments! tick per batch spanning the jitter width would give
    viewers an immediate summary statistic and materially improve data storytelling
  - Design execution is competent but generic — same marker size, alpha, and stroke
    for every batch with no secondary encoding (e.g., emphasizing the mean marker,
    subtle per-category background banding, or size/opacity variation) to create a
    clear visual hierarchy
  - No Makie-distinctive feature is used beyond a plain scatter! call — consider a
    small idiomatic touch such as errorbars!/rangebars! for batch means±std, or crossbar!/bracket!
    for the mean/median reference lines mentioned above, to demonstrate library mastery
    beyond generic scatter usage
  - Batch B and Batch C show a few tightly clustered points near y≈10.11–10.12 and
    y≈10.20–10.25 that visually merge into near-solid blobs — a touch more jitter
    spread or a slightly lower alpha in the densest clusters would keep individual
    observations distinguishable at a glance
  image_description: |-
