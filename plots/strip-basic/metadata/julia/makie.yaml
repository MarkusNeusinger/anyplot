      Data: Four vertical bands of jittered points, one per batch. Batch A = teal-green (#009E73), Batch B = lavender (#C475FD), Batch C = blue (#4467A3), Batch D = ochre (#BD8233) — matches the canonical Imprint palette order. Points have a thin light stroke that helps separate overlapping markers. All colors read clearly against the light background.
      Legibility verdict: PASS — all text is dark-on-light and easily readable; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Title is bold off-white/cream text, clearly visible against the dark background. Axis labels are the same light ink tone and fully legible. Tick labels use a lighter grey-beige tone, still clearly readable against the near-black background — no dark-on-dark failure observed. Grid lines are faint light lines, subtle but visible. Spines are a soft light-grey tone matching the chrome token.
      Data: Same four colors as the light render (teal-green, lavender, blue, ochre) at identical positions — confirms data colors are theme-invariant, only chrome flipped. Points remain clearly distinguishable from the dark background with no contrast issues.
      Legibility verdict: PASS — all text is light-on-dark and easily readable; no dark-on-dark issues found.
