review:
  strengths:
  - Correct use of MUI X's useXScale/useYScale hooks to render dynamic, accurately-positioned
    total labels above each stack — solves the spec's core requirement (total labels
    above bar stacks) in an idiomatic, library-native way.
  - Imprint palette applied correctly and identically across both themes (green →
    lavender → blue canonical order), with theme-adaptive chrome (title, axis labels,
    tick labels, grid) reading cleanly in both light and dark renders.
  - Y-axis max computed with deliberate headroom (`Math.ceil((maxTotal * 1.18) / 10)
    * 10`) specifically to leave clear vertical space for the total labels — directly
    satisfies the spec's 'adequate vertical space above tallest bar' note.
  - skipAnimation set, deterministic hardcoded data, clean imports — no extraneous
    dependencies or fake functionality.
  weaknesses:
  - Bar segments use flat fills with no edge stroke; a subtle 1px lighter/darker edge
    per the style guide's 'Bar edges' guidance would add definition, especially for
    the lavender segment which has lower contrast against the cream background.
  - Beyond the custom total-label overlay, styling stays close to out-of-the-box MUI
    X BarChart defaults — no differentiating typographic treatment, rounded bar corners,
    or other polish that would push Design Excellence higher.
  - Segment (per-bar) value labels are omitted (optional per spec) — adding them would
    let readers read individual cost-type contributions (e.g. Development's Labor
    segment) without estimating from the axis.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1), not pure white — correct.
      Chrome: Bold dark title top-left "bar-stacked-labeled · javascript · muix · anyplot.ai", clearly readable. Y-axis label "Cost ($ thousands)" and X-axis label "Project Phase" both dark, readable, similarly sized. Tick labels dark and legible. Horizontal gridlines subtle, light gray. Legend at bottom-center (Labor / Materials / Equipment swatches + labels) fully readable.
      Data: First series (Labor) is brand green #009E73, second (Materials) is lavender, third (Equipment) is blue — matches Imprint canonical order. Bold black total labels ("$28k", "$56k", "$94k", "$50k", "$42k") sit directly above each stack with clear headroom below the y=120 axis max.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17), not pure black — correct.
      Chrome: Title, axis labels, and tick labels render in light/white text, clearly legible against the dark surface. Gridlines subtle. Legend text white and readable.
      Data: Labor/Materials/Equipment colors are pixel-identical to the light render (green, lavender, blue) — only chrome flipped, as required. Total labels flip to white text, clearly readable above each stack with no dark-on-dark issues anywhere.
      Legibility verdict: PASS
