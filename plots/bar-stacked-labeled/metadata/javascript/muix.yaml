review:
  strengths:
  - Total labels are drawn as a custom SVG layer composed into BarChart through useXScale/useYScale,
    so each bold 20 px total sits exactly 12 px above its stack and is computed from
    the data, matching the segment sums (28, 56, 94, 50, 42)
  - Segment labels use the native barLabel callback with ctx.bar.height to drop labels
    from segments under 30 px (Planning's 4-unit Equipment segment), as the spec permits
  - Segment label ink is chosen per fill by a WCAG contrast test, so dark ink sits
    on green/purple and light ink on blue, readable in both themes
  - Segment separators stroked in the elevatedBg token give crisp light seams on cream
    and dark seams on near-black
  - Headroom above the tallest stack (max × 1.12) comes from the data, so the 94 total
    stays inside the plot area
  - Data-computed subtitle names the grand total and the largest phase (Development,
    35 %), giving the chart a focal point
  - 'Muted data-agnostic structure: role constants, long-format records, phases and
    cost types ordered by appearance'
  weaknesses:
  - 'Suggestion: the y axis domain runs to about 105 with its last tick at 100, leaving
    a short tickless stub of axis line above the top grid line; a nice-rounded max
    would end the axis on a tick.'
  - 'Suggestion: the ~60 px gap between the subtitle and the top of the plot area
    could be tightened to give the bars more height.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, no white panel.
      Chrome: bold dark title "Project Budget by Phase · bar-stacked-labeled · javascript · muix · anyplot.ai" at ~52 % width, softer subtitle "5 phases, 3 cost types · budget total 270 · largest phase: Development (35% of the total)"; y axis "Cost (thousand USD)" with ticks 0–100, x axis "Project phase" with Planning/Design/Development/Testing/Deployment; subtle horizontal grid; bottom legend Labor/Materials/Equipment. All text dark and readable.
      Data: five stacks from a zero baseline, Labor in #009E73 at the bottom, Materials purple, Equipment blue on top, white separators between segments; bold totals 28, 56, 94, 50, 42 above each stack; segment labels in dark ink on green/purple and light ink on blue; Planning's small Equipment segment carries no label.
      Legibility verdict: PASS

