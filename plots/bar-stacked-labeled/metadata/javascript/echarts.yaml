review:
  strengths:
  - Correct Imprint palette order (brand green, lavender, blue, ochre for the 4 components),
    identical data colors across light and dark renders — only chrome flips
  - Dynamic y-axis max headroom calculation (max total * 1.15, rounded to nearest
    50) directly satisfies the spec's note to 'ensure adequate vertical space above
    the tallest bar for label placement' — no label ever collides with the axis ceiling
  - 'Idiomatic ECharts technique: an invisible zero-value ''Total'' series stacked
    on top of the real series hosts the bold total labels, and legend.data explicitly
    excludes it so no fake legend entry appears'
  - Full theme-adaptive chrome via window.ANYPLOT_TOKENS (ink/inkSoft/grid) — both
    renders are legible with no dark-on-dark or light-on-light failures
  - 'Clean minimalist layout: y-axis-only horizontal gridlines, y-axis line hidden,
    x-axis has no split lines, matching the style guide''s grid/spine guidance'
  - Title fontsize is dynamically scaled (round(22 * 67/len)) so the longer descriptive-prefixed
    title never overflows the canvas
  - Deterministic, realistic dataset (quarterly cloud spend by service) with totals
    that correctly sum their displayed segments ($380K, $408K, $439K, $475K, $508K,
    $545K)
  weaknesses:
  - Title occupies only ~40% of the plot width — below the 50-70% ideal — because
    the descriptive prefix 'Cloud Spend by Service' pushed the full title past 67
    chars and triggered the fontsize-shrink formula; a shorter or omitted prefix would
    let the title read larger while staying within bounds
  - X-axis tick label fontSize (16) and y-axis tick label fontSize (14) are slightly
    imbalanced — the style guide calls for visually similar tick label sizing between
    axes absent a semantic reason for the difference
  - Design Excellence is solid but not distinctive beyond the total-label technique
    — no additional emphasis (e.g. highlighting the latest/largest quarter) to strengthen
    the data storytelling
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "Cloud Spend by Service · bar-stacked-labeled · javascript · echarts · anyplot.ai" in dark ink, centered top; legend below title with 4 swatches (Compute/Storage/Networking/Database) in dark text; y-axis "Spend ($K)" title and tick labels in soft dark gray; x-axis quarter labels (2023 Q1 ... 2024 Q2) in soft dark gray; subtle light-gray horizontal gridlines only. All chrome clearly legible against the light background.
      Data: 6 stacked bars, one per quarter, each built from 4 segments bottom-to-top: Compute (brand green #009E73), Storage (lavender), Networking (blue), Database (ochre) — matches Imprint canonical order 1-4. Bold black total labels ($380K…$545K) sit directly above each stack with clear headroom before the 650 gridline.
      Legibility verdict: PASS — no light-on-light or illegible text anywhere.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Same title, legend, axis labels and ticks, now rendered in light ink/soft-light-gray tones; gridlines are faint light-gray on dark. All fully legible against the dark background, no dark-on-dark failures observed.
      Data: Same 4 segment colors (green/lavender/blue/ochre) in the same stacking order and same total-label positions/values as the light render — confirms data colors are theme-independent; only chrome (background, text, grid) flipped.
      Legibility verdict: PASS — bold white total labels and light tick/axis text are clearly readable against the near-black surface.
