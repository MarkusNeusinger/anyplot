review:
  strengths:
  - Fixed the x/y axis tick label fontSize imbalance flagged in attempt 1 — both axes
    now use fontSize 14
  - Added a distinct highlighted total label on the most recent quarter (2024 Q2,
    $545K), directly addressing the attempt-1 feedback to sharpen the data-storytelling
    focal point
  - Correct Imprint palette order (brand green, lavender, blue, ochre) with identical
    data colors across light and dark renders
  - Dynamic y-axis max headroom calculation (max(totals) * 1.15, rounded to 50) leaves
    clean space for total labels above the tallest bar
  - 'Idiomatic ECharts technique: an invisible zero-value ''Total'' series stacked
    atop the real series hosts the bold total labels, explicitly excluded from legend.data
    so no fake legend entry appears'
  - Full theme-adaptive chrome via window.ANYPLOT_TOKENS, legible in both renders
    with no overlap or clipping
  - Deterministic, realistic cloud-spend dataset with totals that correctly sum their
    displayed segments
  weaknesses:
  - The highlighted last-quarter total label uses t.palette[0] (brand green) — the
    same color as the 'Compute' series in the legend — which creates ambiguous color
    semantics; a viewer could misread the green $545K label as tied to the Compute
    segment rather than as a distinct 'latest quarter' emphasis. Use t.amber (or another
    non-series accent token) for the highlight instead.
  - Title still occupies only ~40% of the plot width in both renders, below the 50-70%
    ideal band, even after shortening the descriptive prefix from 'Cloud Spend by
    Service' to 'Cloud Spend' — the length-based shrink formula (22 * min(1, 67/title.length))
    still triggers at 69 characters and only marginally raises the effective fontsize
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1, not pure white.
      Chrome: Title "Cloud Spend · bar-stacked-labeled · javascript · echarts · anyplot.ai" in dark ink, centered top. Legend below with 4 swatches (Compute/Storage/Networking/Database) in dark ink text. Y-axis title "Spend ($K)", axis tick labels in soft ink, all clearly legible.
      Data: Six stacked bars (2023 Q1 through 2024 Q2), each built from 4 segments in canonical Imprint order: Compute (brand green #009E73), Storage (lavender), Networking (blue), Database (ochre). Bold black total labels ($380K...$508K) sit directly above each stack with clear headroom, except the final bar (2024 Q2, $545K) whose total label is rendered larger and in the same brand-green as the Compute segment to emphasize the latest quarter.
      Legibility verdict: PASS (all text readable against the light background; no light-on-light issues)

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17, not pure black.
      Chrome: Same title, legend, and axis labels rendered in light ink / soft-light-gray tones, all fully legible against the dark surface.
      Data: Identical data colors to the light render (same green/lavender/blue/ochre stacking) — only chrome flipped. Bold white total labels read clearly against the near-black surface; the final bar's highlighted total label remains the same brand-green as in the light render.
      Legibility verdict: PASS (no dark-on-dark failures; all text and data elements clearly distinguishable from the background)
