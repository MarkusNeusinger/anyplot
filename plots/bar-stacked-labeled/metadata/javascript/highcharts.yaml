review:
  strengths:
  - Correct idiomatic use of Highcharts' built-in stackLabels with a custom formatter
    ("$XM") to render bold total labels above each stack — exactly the distinctive
    feature this spec calls for, not a manual workaround.
  - 'Imprint palette applied correctly: first series is #009E73, remaining series
    follow the canonical order (#C475FD, #4467A3, #BD8233), identical between light
    and dark renders.'
  - 'Theme-adaptive chrome is fully correct: warm off-white background in light, warm
    near-black in dark, all text (title, axis labels, ticks, legend, stack labels)
    readable in both themes with no dark-on-dark or light-on-light failures.'
  - Realistic, neutral business scenario (quarterly revenue by product line, $M) with
    plausible values and a coherent quarter-over-quarter growth story.
  - 'Clean, minimal code: in-memory deterministic data, no functions/classes, only
    used tokens, borderWidth:0 and pointPadding/groupPadding tuned for a polished
    column look, yAxis maxPadding reserves headroom so total labels never crowd the
    top of the canvas.'
  weaknesses:
  - 'Design Excellence is at the ''well-configured default'' tier: styling comes entirely
    from the standard token mapping (colors, grid, chrome) with no extra polish layer
    — e.g. no subtle background band, no refined typography hierarchy, no accent treatment
    that would lift it above a solid baseline implementation.'
  - Data storytelling relies solely on the mandated total labels; there's no additional
    visual emphasis (e.g. highlighting the strongest quarter or fastest-growing component)
    to sharpen the takeaway beyond 'revenue grew every quarter'.
  - The mandated title renders at only ~35-40% of the plot width at the default 22px
    — noticeably smaller than the ~70-85% the style guide expects for this exact title
    format, leaving the top of the canvas visually light relative to the data below.
  - Data variation across the four stacked components is fairly uniform (each grows
    roughly monotonically quarter over quarter) — a touch more contrast, e.g. one
    component that plateaus or dips more sharply, would better showcase the stacked-composition
    aspect of the plot type.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "bar-stacked-labeled · javascript · highcharts · anyplot.ai" in bold dark ink at top-center; y-axis title "Revenue ($M)" rotated on the left; x-axis category labels Q1-Q4 in soft dark gray; y-axis tick labels (0-140, step 10) in soft dark gray; subtle horizontal gridlines; legend centered below the plot with four colored dot swatches (Hardware, Software, Services, Support). All chrome elements are clearly legible against the light background.
      Data: Four stacked column groups (Q1-Q4), each with four segments bottom-to-top: Support (ochre/brown), Services (blue), Software (purple), Hardware (green, #009E73, topmost). Bold black total labels ("$97M", "$105M", "$111M", "$130M") sit directly above each stack with clear headroom below the y-axis max.
      Legibility verdict: PASS — every title, axis label, tick label, legend entry, and stack-total label is fully readable with no overlap or clipping.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same layout as the light render but title, axis titles, tick labels, and legend text are rendered in light/white tones; gridlines are subtle and still visible against the dark background.
      Data: Same four-segment stacks in the same colors and same relative sizes as the light render (Support ochre, Services blue, Software purple, Hardware green #009E73) — colors are identical between themes, confirming only chrome flipped. Stack-total labels are white/bold and clearly readable against the dark background — no dark-on-dark failure.
      Legibility verdict: PASS — all text is readable in the dark theme; no black-on-black or unreadable elements observed.
