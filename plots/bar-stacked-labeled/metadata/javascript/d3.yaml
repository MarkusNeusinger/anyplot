review:
  strengths:
  - Correct Imprint palette order — Hardware=#009E73 (brand green), Software=lavender,
    Services=blue — identical data colors between light and dark renders
  - Total labels sit clearly above each stack in bold, distinct from the smaller in-segment
    value labels — the spec's core requirement is well executed
  - In-segment labels use white fill with a dark paint-order stroke, keeping them
    legible against all three fill colors in both themes
  - Segment labels are conditionally rendered only when the segment is tall enough
    (>=46px) to hold them, avoiding clutter on thin slices
  - Y-domain padded to 1.15x the max total gives the tallest bar's total label headroom
    without ever approaching the canvas edge
  - Clean idiomatic d3.stack()/scaleBand/scaleLinear usage, theme tokens correctly
    threaded through axes, grid, legend, and title
  weaknesses:
  - Legend item spacing is a fixed 170px per entry rather than measured from actual
    label width — works for these labels but could misalign if component names were
    longer
  - Design excellence is solid but not fully distinctive — e.g. bars are plain rectangles
    with no subtle refinement (corner treatment, bar edge stroke) that would push
    it from 'good' to 'exceptional'
  - Number formatting uses manual template literals (`$${d}M`) rather than d3-format
    (`d3.format`) — works fine here but is a missed opportunity to show more D3-idiomatic
    formatting mastery
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "bar-stacked-labeled · javascript · d3 · anyplot.ai" is bold dark text, clearly legible, occupying roughly 40% of the plot width (well within the 50-70% range). X-axis title "Quarter" and Y-axis title "Revenue ($M)" are dark and legible. Tick labels ($0M-$150M, Q1-Q4) are readable in a soft dark gray. Legend (Hardware/Software/Services swatches + labels) sits top-right, fully legible, no overlap with the title. Horizontal gridlines are subtle and only on the Y-axis.
      Data: Four stacked bars (Q1-Q4), each with three segments — green (Hardware, bottom), lavender/purple (Software, middle), blue (Services, top). First series is confirmed #009E73 brand green. In-segment value labels (e.g. "$42M", "$28M", "$15M") are white text with a dark stroke halo, clearly readable against every fill color. Bold total labels ("$85M", "$91M", "$106M", "$124M") sit directly above each stack with clean spacing from the tallest segment.
      Legibility verdict: PASS — all text is readable against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Title, axis titles, and tick labels have flipped to light/white tones and remain fully legible against the dark background. Legend text and swatches are clearly visible. Gridlines remain subtle but visible against the dark surface.
      Data: The same three data colors (green, lavender, blue) are used — confirmed identical to the light render, only chrome (background/text/grid) flipped. In-segment white-stroke-outlined labels remain legible on all three segment colors. Total labels in bold white are clearly visible above each stack.
      Legibility verdict: PASS — no dark-on-dark failures observed; every title, axis label, tick label, and data label is clearly visible against the dark background.
