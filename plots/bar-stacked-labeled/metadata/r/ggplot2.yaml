review:
  strengths:
  - Total labels ($1.05M, $1.21M, $1.35M, $1.53M) sit directly above every stack in
    bold INK, equal the segment sums and read cleanly in both themes
  - 'One number format throughout: totals and y-axis ticks both use two-decimal $X.XXM
    via the same formatter'
  - expansion(mult = c(0, 0.1)) seats the stacks flush on the zero baseline while
    leaving headroom so the tallest total stays inside the panel
  - 'Factor levels keep the data order, so Electronics (first series) gets #009E73
    and the legend order matches the top-to-bottom stack order'
  - Column constants with .data[[...]] and labs() from the constants follow the adaptable-code
    layout; canvas exactly 3200x1800 in both themes
  weaknesses:
  - 'CQ-01 (code): line 46 defines a named helper `fmt_millions <- function(x) ...`
    for the label and tick format → replace it with `scales::label_dollar(scale =
    1e-6, suffix = "M", accuracy = 0.01)` used in both scale_y_continuous(labels =
    ) and the geom_text label. Likely cause: hand-written formatter instead of the
    scales labeller.'
  - 'Suggestion: optional segment labels inside the larger segments (white or INK
    text by fill) would let readers read component values without the axis.'
