review:
  strengths:
  - All four stacks rise from a shared zero baseline on an untruncated axis; the bold
    total labels ($250K, $295K, $325K, $360K) equal the segment sums and sit inside
    the plot thanks to the data-derived 12 % headroom (alt.Scale(domain=[0, max*1.12],
    nice=False))
  - Segments are separated by a stroke in the page color, so the boundaries read cleanly
    in both themes instead of a fixed white outline
  - Stack order is pinned to the data order with an alt.Order channel driven by a
    Vega expression (transform_calculate with indexof), so Software sits at the base
    of every bar and the order is the same in every stack
  - Native Altair tooltips with readable titles add segment-level inspection in the
    HTML output
  - Column constants are escaped once and every encoding carries type= and title=,
    so the chart survives column names with dots, brackets or colons
  - 'Theme tokens are threaded through view, axes, title and legend; both renders
    are fully legible on #FAF8F1 and #1A1A17'
  weaknesses:
  - 'Suggestion: list the legend entries in stack order (Services on top, Software
    at the bottom) so the legend reads the same way as the bars.'
  - 'Suggestion: a slightly larger total-label font would give the totals more presence
    beside the 13 pt axis titles.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the full 3200x1800 canvas, view framed by a thin INK_SOFT stroke.
      Chrome: centered bold title "bar-stacked-labeled · python · altair · anyplot.ai" in dark ink; y-axis title "Revenue ($K)" and x-axis title "Quarter" in bold dark ink; tick labels (0-400 by 50, Q1-Q4 horizontal) in soft gray; subtle horizontal grid; legend "Product" on the right in an elevated off-white box. All text readable.
      Data: four stacked bars Q1-Q4, Software #009E73 at the base, Hardware #C475FD in the middle, Services #4467A3 on top, separated by thin page-colored strokes. Bold dark total labels $250K, $295K, $325K, $360K directly above each stack, all inside the plot area with headroom above the $360K stack.
