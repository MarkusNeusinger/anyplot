review:
  strengths:
  - Totals computed with table.sum(axis=1) and attached as per-point formatters on
    the top series, so each label is exactly the stack sum in one $NNNK format
  - Theme tokens threaded through Style (background, foreground, value_colors) — all
    text readable in both renders
  - 15% range headroom keeps the tallest total inside the plot area
  - Clean six-zone layout with column constants and a tidy df pivoted via pivot_table(sort=False)
  - Interactive HTML output with pygal's native hover tooltips
  weaknesses:
  - 'VQ-07 (both): the segment fills render translucent (pygal''s default fill opacity),
    so the page shows through and the same Imprint hue looks pale in light and muddy
    in dark (Clothing #4467A3 reads near-navy on #1A1A17) → solid fills identical
    in both themes (opacity 1). Likely cause: Style(...) without opacity=''1'' / opacity_hover.'
  - 'VQ-02 (both): the total labels rest directly on the stack tops — the ''$'' descenders
    touch the top edge of each Accessories segment and $500K sits on the 500 gridline
    → clear the stack top by at least 8 px. Likely cause: print_values_position=''top''
    anchors the text baseline at the bar edge; raise the label (e.g. a larger range
    headroom with a value-label offset in the style''s value CSS) rather than moving
    bars.'
  - 'VQ-05 (both): y tick labels come in two sizes — the major ticks 0 and 500 at
    44 px beside 100–400 at 56 px → one tick size on the axis (major ≥ minor). Likely
    cause: major_label_font_size=44 smaller than label_font_size=56.'
  - 'Suggestion: a bold or slightly larger total label (the Notes'' optional emphasis)
    would set totals apart from the tick labels.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, 3200x1800.
      Chrome: title 'bar-stacked-labeled · python · pygal · anyplot.ai' centered top, dark ink; y title 'Revenue ($K)', x title 'Quarter'; y ticks 0-500 (0 and 500 smaller than 100-400); Q1-Q4 x ticks; legend top-left (Electronics, Furniture, Clothing, Accessories); dotted y guides. All dark text readable.
      Data: four stacks Q1-Q4, Electronics #009E73 at the base, then Furniture purple, Clothing blue, Accessories ochre, consistent order; fills slightly translucent. Totals $312K, $330K, $408K, $500K in dark text resting on each stack top.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: same layout; title, axis titles, ticks, legend and totals in light ink, all readable; no dark-on-dark.
      Data: same hex colors in the same order, but the translucent fills blend with the dark page so the segments read darker (Clothing near navy).
      Legibility verdict: PASS
