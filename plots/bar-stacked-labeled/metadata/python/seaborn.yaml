review:
  strengths:
  - Stacks built with sns.histplot(weights=..., hue=..., multiple="stack", shrink=0.7)
    straight from the tidy df, so seaborn handles the stacking, the hue order and
    the legend instead of a manual ax.bar loop
  - Total labels ($1,105K, $665K, $890K, $595K, $445K) sit above every stack, each
    equal to its segment sum, and the 12 % headroom keeps the tallest one well inside
    the plot area in both themes
  - Segment labels appear only in segments of at least 7 % of the tallest stack, and
    their ink (near-black or white) is picked from the fill's luminance, so 120 on
    purple and 130 on ochre stay readable
  - Page-colored 0.8 px segment edges separate the stacked components cleanly in both
    themes, and sns.move_legend places a framed 'Cost type' legend in the empty top-right
    corner
  - 'Theme tokens are applied throughout: #FAF8F1 / #1A1A17 surfaces, INK text, INK_SOFT
    ticks and spines, an elevated legend frame, Imprint colors identical in both renders'
  weaknesses:
  - 'Suggestion: give the segment labels the same unit treatment as the totals (for
    example ''820'' → ''$820K'', or totals without ''$'' and ''K'') so every label
    reads in one visible format.'
  - 'Suggestion: sorting the departments by total would give the descending stacks
    a clearer reading order.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, 3200x1800 canvas.
      Chrome: title "bar-stacked-labeled · python · seaborn · anyplot.ai" in dark ink, about 53 % of the width; y-axis "Expenses (thousand USD)", x-axis "Department"; ticks 0–1200 and five department names in INK_SOFT; subtle horizontal grid; top and right spines removed; framed "Cost type" legend in the top-right corner, clear of all bars and labels. All text readable.
      Data: five stacks (Engineering, Marketing, Sales, Operations, Support) of four components in Imprint order, bottom to top: Equipment #BD8233, Travel #4467A3, Software #C475FD, Salaries #009E73 (first series green). Bold total labels $1,105K, $665K, $890K, $595K, $445K above each stack. Segment labels (820, 140, 110, 410, 95, 120, 530, 120, 185, 360, 130, 290, 85) inside the larger segments, white on green and blue, near-black on purple and ochre; thin segments (Engineering travel, Operations software and travel, Support travel, small equipment) carry no label.
