review:
  strengths:
  - Totals computed with groupby from the same table and drawn as a separate geom_text
    layer with bold, theme-adaptive INK text directly above every stack
  - Value axis headroom derived from the data (limits max*1.12), so every total sits
    inside the plot area
  - Imprint palette in canonical order, identical across themes, with readable chrome
    in both renders
  - Canonical 3200x1800 canvas via ggsize(800, 450) and scale=4; lets-plot HTML export
    adds native hover tooltips
  weaknesses:
  - 'VQ-07 (both): grid lines drawn in opaque INK_SOFT on both axes, with minor lines
    and vertical lines running through every bar, plus a full panel frame; they read
    as high-contrast chrome, strongest on the dark background → y-axis major grid
    only at the style guide''s ~15 % ink opacity, no x grid, no minor grid, no top/right
    frame. Likely cause: panel_grid_major=element_line(color=INK_SOFT, size=0.3) with
    no panel_grid_major_x/panel_grid_minor=element_blank().'
  - 'Suggestion: a slightly heavier weight on the Q4 total could mark the year''s
    peak quarter.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, legend box on #FFFDF6.
      Chrome: bold title "bar-stacked-labeled · python · letsplot · anyplot.ai" at top left (~60 % width), axis titles "Quarter" and "Revenue (Millions USD)" in dark ink, ticks Q1–Q4 and 0–140 in soft ink; all readable. Grid is opaque gray on both axes with minor lines and a full panel frame.
      Data: four stacks (Q1–Q4), Electronics #009E73 at the bottom, Software #C475FD, Services #4467A3 on top, white separators; bold totals $95M, $112M, $114M, $131M directly above each stack, with headroom to ~155.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17, legend box on #242420.
