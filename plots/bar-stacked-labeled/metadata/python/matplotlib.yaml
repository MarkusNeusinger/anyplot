review:
  strengths:
  - Native ax.bar_label(label_type='center') with a per-segment label list draws the
    segment values and leaves out any segment under 7 % of the value axis, so labels
    fit their segments
  - 'Segment label color is picked from each fill''s luminance: dark text on the light
    purple Hardware fill, white on the other fills. Every segment label is readable
    in both themes'
  - Totals come from table.sum(axis=1) and are drawn bold at 10 pt directly above
    each stack ($115M, $130M, $153M, $177M). They match the segment sums and set a
    clear hierarchy above the 8 pt segment labels
  - The legend is reversed to match the top-down stack order, and page-colored segment
    edges separate the stacked components in both themes
  - The value axis starts at zero and is computed as 1.15 × the largest total, so
    the tallest total label sits inside the plot area
  weaknesses:
  - 'Suggestion: a dedicated total-label pass via ax.bar_label on the top container
    with labels=totals would replace the annotate loop with the library''s own bar
    labeling call'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, not pure white.
      Chrome: title "bar-stacked-labeled · python · matplotlib · anyplot.ai" at the top center in dark ink; y-axis "Revenue ($ millions)" with ticks 0–200 in steps of 25; x-axis "Quarter" with Q1–Q4; subtle horizontal grid; top and right spines removed; legend "Product line" to the right of the plot on an elevated frame (Support, Services, Hardware, Software top-down). All text is readable.
      Data: four stacks rising from zero. Software #009E73 at the bottom, then Hardware #C475FD, Services #4467A3, Support #BD8233. Segment labels like "$45M" sit centered in each segment (dark text on purple, white on the others). Bold totals $115M, $130M, $153M and $177M sit above the stacks, and each one equals its segment sum.
