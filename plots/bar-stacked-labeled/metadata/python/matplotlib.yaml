review:
  strengths:
  - Every stack starts at zero, and every segment starts where the one below it ends;
    the totals are computed from the data (115/130/153/177 are the segment sums)
  - The bold totals sit 4 pt above each stack via annotate offset points and read
    clearly in both themes; the 1.15× y-limit leaves headroom
  - Segments and totals share one $NNM format; each segment label's color is picked
    from its fill's luminance, so every label is readable against its fill
  - The page-colored segment gaps separate the segments in both themes; the reversed
    legend order matches the stack order
  - The native ax.bar_label(label_type='center') and pivot_table(sort=False) read
    the data through the column constants
  weaknesses:
  - 'VQ-01 (both): the segment labels are 7 pt, smaller than the 8 pt tick labels,
    and the white text on the ochre Support fill is faint in the 400 px thumbnail
    → 8 pt (+1 pt). Likely cause: bar_label(..., fontsize=7).'
  - 'Suggestion: a subtle emphasis on the Q4 total or on the quarter-over-quarter
    growth would give the chart a focal point.'
