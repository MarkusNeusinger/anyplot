review:
  strengths:
  - Totals come from a pandas groupby on the data and are drawn with geom_label on
    a page-coloured box (label_size=0), so the 400 gridline never runs through the
    388 label; every total equals its stack's sum (250, 295, 318, 388)
  - position_stack(vjust=0.5, reverse=True) centres segment labels in their own segments
    and matches the legend, which guide_legend(reverse=True) orders top-to-bottom
    like the stacks
  - Segment-label ink is picked per Imprint fill (near-black on green and purple,
    cream on blue), so every segment label reads against its fill in both themes
  - 'Clear hierarchy: bold 10.5 mm totals above bold 9 mm segment labels, one integer
    format throughout, y-axis from a true zero with 14 % headroom derived from the
    data'
  - 'Theme tokens thread through every chrome element; segment separators in PAGE_BG
    keep stacks crisp on both surfaces; Imprint palette in data order starting with
    #009E73'
  weaknesses:
  - 'Suggestion: give the legend title a little left padding so ''Product'' does not
    sit flush against the legend frame.'
  - 'Suggestion: the x-axis title ''Quarter'' repeats what the Q1–Q4 ticks already
    say; dropping it would free vertical space for the bars.'
