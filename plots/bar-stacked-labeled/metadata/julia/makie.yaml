review:
  strengths:
  - Theme-adaptive chrome is threaded cleanly through Figure/Axis (background, title/axis/tick
    colors, spines, grid opacity) with correct tokens in both renders
  - Total labels use Makie's rich() to mix bold/oversized value text with a smaller,
    softer unit suffix ($X.XM) — a genuinely library-distinctive touch that elevates
    the spec's total-label requirement
  - Realistic, plausible quarterly SaaS revenue scenario with a sensible growth trend
    across Q1-Q4
  - First categorical series is the mandated Imprint green (#009E73), canonical palette
    order preserved for the series that do render, correct light/dark background tokens
  - Y-axis headroom (ylims!) is deliberately set last so it survives any autolimits
    reset triggered by the legend/text calls — a thoughtful defensive layout choice
  weaknesses:
  - 'CRITICAL data-rendering bug: product_lines declares 4 components (Subscriptions,
    Services, Hardware, Support) and totals correctly sum all 4 ($8.7M/$9.4M/$10.6M/$11.9M
    match), but the stacked bars only draw 3 visually distinct segments. Pixel-level
    measurement on both renders confirms the ''Hardware'' (blue) segment''s height
    equals Hardware+Support combined in every quarter (e.g. Q1 blue segment = $1.4M
    = 0.9+0.5; Q4 blue segment = $1.6M = 0.9+0.7); the ochre #BD8233 reserved for
    ''Support'' never appears anywhere in either PNG, and the Legend lists only 3
    entries, omitting ''Support'' entirely. This silently misrepresents the data —
    a reader comparing the blue segment to the ''Hardware'' legend swatch would think
    it represents only Hardware''s value.'
  - 'Likely root cause: color = colors passes a raw pre-computed per-element color
    vector alongside stack=, instead of the library-documented pattern for multi-series
    categorical color (color = stack, colormap = IMPRINT_PALETTE[1:n_product]) — prompts/library/makie.md
    explicitly recommends the colormap-based approach for this exact case. Switch
    to that pattern (or otherwise verify empirically that all 4 stack groups render
    as 4 separate rectangles with 4 legend entries) before resubmitting.'
  - Legend is incomplete as a direct symptom of the bug above — only 3 of 4 declared
    product lines appear; re-verify the legend shows all 4 swatches once the stacking
    bug is fixed
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white, consistent with #FAF8F1 — correct light-theme surface.
      Chrome: title "bar-stacked-labeled · julia · makie · anyplot.ai" is bold, dark, and clearly legible; axis labels "Quarter" (x) and "Revenue ($M)" (y) are dark and readable; tick labels and legend text use a softer dark gray, all readable; subtle y-axis-only gridlines at 5/10.
      Data: four quarterly stacked bars (Q1-Q4) in Imprint green (#009E73, Subscriptions), lavender (#C475FD, Services), and blue (#4467A3, Hardware), with bold "$X.XM" total labels above each stack (e.g. $8.7M, $9.4M, $10.6M, $11.9M). Legend lists only 3 entries (Subscriptions, Services, Hardware) despite the implementation defining a 4th component "Support" — pixel measurement confirms the blue segment's height equals Hardware+Support combined in every quarter, and the ochre color reserved for "Support" (#BD8233) never appears anywhere in the image. This is a data-representation bug, not a legibility issue.
      Legibility verdict: PASS (all text readable; the data-mapping bug above is a correctness issue, not a theme-legibility issue)

    Dark render (plot-dark.png):
      Background: warm near-black, consistent with #1A1A17 — correct dark-theme surface.
      Chrome: title, axis labels, and tick labels all render in light/white tones against the dark background — no dark-on-dark failures observed. Legend text and swatches are legible.
      Data: colors identical to the light render (verified #009E73 / #C475FD / #4467A3 unchanged). Same bug as light render — only 3 stacked segments visible, "Support" silently merged into the Hardware segment with no distinguishing color and no legend entry (confirmed: 0 ochre-colored pixels found anywhere in this render).
      Legibility verdict: PASS (theme chrome is correct; the missing 4th data series is a rendering/data-mapping bug that reproduces identically in both themes, independent of theme tokens)
