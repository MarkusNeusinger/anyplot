review:
  strengths:
  - 'Data mapping is numerically correct end-to-end: each total label is the exact
    sum of its stacked segments (e.g. Q1 = 5.2+2.1+1.4 = $8.7M), verified against
    the raw revenue matrix'
  - 'Correct Imprint palette usage: first series (Subscriptions) is brand green #009E73,
    remaining series use canonical positions 2-3, and data colors are byte-identical
    between light and dark renders'
  - 'Theme-adaptive chrome is fully threaded through: title/axis/tick colors, spine
    colors, and grid alpha all read from INK/INK_SOFT tokens, with no dark-on-dark
    or light-on-light failures in either render'
  - Total-label headroom is computed programmatically (`ylims!(ax, 0, maximum(totals)
    * 1.16)`) after all text/legend calls, so the largest total ($11.9M) has clear
    margin above it with no clipping
  - Canonical title format and canvas size are both correct (3200x1800 landscape,
    canvas gate passed)
  - 'Clean KISS script: no functions/classes, only imports actually used (CairoMakie,
    Colors), deterministic hard-coded data needing no seed'
  weaknesses:
  - The comment above the total-label loop claims labels are 'bold and larger than
    any other text,' but the text! call only sets fontsize=19 with no font=:bold (or
    equivalent) — labels render in regular weight in both renders, contradicting the
    code's own stated intent and the spec's suggestion to give totals extra visual
    weight to distinguish them. Add font = :bold to the text! call.
  - Design execution is competent but generic — it closely follows the standard Imprint
    styling skeleton (default grid, default spine treatment) without an extra visual-hierarchy
    touch (e.g. genuinely bold/emphasized totals, a subtle baseline rule, or highlighting
    the latest quarter) that would lift it past a solid baseline stacked bar chart.
  - Library-mastery features are basic (a single barplot! with stack, a manually built
    Legend of PolyElement swatches) — little that showcases a distinctive Makie capability
    beyond the boilerplate stacked-bar pattern; e.g. Makie's rich() for mixed-weight/mixed-size
    text in the total labels would both fix the bold-label gap above and add a distinctive
    touch.
  - Only 3 stacked components (the low end of the spec's recommended 2-5 range) —
    an extra product line would give the stack a bit more visual richness without
    changing the story.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white, not dark.
      Chrome: Title "bar-stacked-labeled · julia · makie · anyplot.ai" in bold dark ink, clearly readable. "Quarter" (x) and "Revenue ($M)" (y) axis labels in dark ink. Tick labels (Q1-Q4, 0/5/10) in soft dark gray. Subtle horizontal gridlines at y=5 and y=10. Left/bottom spines visible in soft gray, top/right spines removed. Legend at right (Subscriptions/Services/Hardware) with soft-gray text, no frame, blends into background.
      Data: Four stacked bars (Q1-Q4), each split into three segments bottom-to-top: brand green (#009E73, Subscriptions), lavender/purple (#C475FD, Services), blue (#4467A3, Hardware). Bold total labels ("$8.7M", "$9.4M", "$10.6M", "$11.9M") sit directly above each stack with clear headroom, in dark ink.
      Legibility verdict: PASS — all text is clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black, not light.
      Chrome: Same title, axis labels, and tick labels now rendered in light/off-white ink, clearly legible against the dark background. Gridlines subtle but visible. Legend text is light-colored and readable, background blends with the page.
      Data: Same three-segment stacking with identical green/lavender/blue hex values as the light render — only the chrome (background, text, grid, spines) flips. Total labels ($8.7M-$11.9M) render in light ink above each stack, clearly visible with no clipping.
      Legibility verdict: PASS — all text is clearly readable against the dark background; no dark-on-dark failures observed anywhere (title, axis labels, ticks, legend, and total labels are all light-on-dark as expected).
