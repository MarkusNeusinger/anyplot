review:
  strengths:
  - Correct horizontal bar chart, sorted descending by value (largest at top) with
    clean value labels at the end of every bar in both themes
  - Real, accurate country-population data (correct order of magnitude and relative
    proportions) with a wide, realistic value spread
  - 'Theme-adaptive chrome fully correct: backgrounds, title/axis/tick text, and grid
    all flip properly between light and dark, while the brand-green data color stays
    identical'
  - 'First (only) categorical series is the correct Imprint brand green #009E73; single-series
    legend correctly omitted'
  - Grid convention correctly matches the horizontal orientation — vertical gridlines
    aligned to the x (value) axis only, y-axis grid off
  - Left spine removed in addition to top/right (not just the default L-shape) since
    the y-axis carries category labels instead of a numeric scale — a thoughtful refinement
  - Clean KISS code structure, deterministic hardcoded data, correct save call and
    file naming
  weaknesses:
  - 'Design Excellence is generic: a single flat brand-green fill with no additional
    design accent (e.g. subtle bar-end treatment, top-rank emphasis, or secondary
    tone on the leading bar) — reads as a well-configured default rather than a publication-ready
    design'
  - 'Data storytelling is passive: the ranking itself is the only ''story'' element;
    consider a stronger focal point (e.g. visually distinguishing the #1 bar, or a
    short annotation calling out the top country) to guide the viewer more deliberately'
  - 'Library Mastery is generic (LM-02): direction=:x plus a yticks category axis
    is the standard/expected way to build a horizontal bar in Makie — no distinctive
    Makie-only feature (e.g. custom Theme(), GridLayout composition, Observable-driven
    elements) is demonstrated'
  - Title renders fairly small relative to the canvas (roughly 20-25% of plot width)
    versus the ~70-85% typically expected for the mandated `{spec-id} · {lang} · {lib}
    · anyplot.ai` string at default sizing — not a legibility failure, but there is
    room to grow titlesize for stronger visual hierarchy
  image_description: |-
