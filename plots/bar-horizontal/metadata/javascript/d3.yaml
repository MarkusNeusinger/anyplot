review:
  strengths:
  - 'Correctly threads ANYPLOT_TOKENS/ANYPLOT_SIZE through the mount-node contract;
    first series is the mandated #009E73 brand green and chrome (title, ticks, grid,
    domain lines) flips correctly between light and dark with data color held constant'
  - Bars sorted ascending so the largest value lands at the top of the reversed band
    scale, giving the chart a clear ranked-list focal point per the spec's storytelling
    note
  - Value labels placed at bar ends improve readability without adding legend clutter
    for a single-series chart
  - 'Clean, idiomatic D3: scaleBand/scaleLinear, axisBottom/axisLeft, and the selection.join()
    pattern; x-axis-only gridlines are the correct convention for a horizontal bar
    chart (value axis, not category axis)'
  - No AR-09 edge clipping in either render — all labels, title, and value text stay
    fully within canvas bounds with generous margins
  weaknesses:
  - 'Data scale is unrealistic: GitHub star counts are labeled in millions (46.9M–118.5M)
    but no real repository has anywhere near that many stars — the most-starred GitHub
    repos top out in the low hundreds of thousands (e.g. freeCodeCamp ~412k, VS Code
    ~170k). Rescale the data to plausible star counts (thousands, not hundreds of
    millions) or switch to a metric that genuinely reaches millions.'
  - Library mastery is generic idiomatic usage only — no D3-distinctive technique
    (e.g. a custom tick formatter beyond the basic `${d}M`, an annotation layer, or
    a scale/format module feature) to differentiate it from a tutorial-level bar chart.
  - 'Design polish is solid but stays close to baseline: single flat green fill with
    no secondary refinement (e.g. subtle bar-end rounding, hover-ready but static
    value-label emphasis) to push aesthetic sophistication further.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 (not pure white).
      Chrome: Title "bar-horizontal · javascript · d3 · anyplot.ai" in bold dark ink, centered top. Y-axis category labels (Vue, Bootstrap, TensorFlow, React, Flutter, VS Code, Node.js, freeCodeCamp) in dark gray at left. X-axis tick labels (0M-120M) and axis title "GitHub Stars (millions)" in muted gray below. Subtle vertical gridlines aligned to x-axis ticks. Bottom and left axis domain lines visible (L-shaped frame), top/right spines absent.
      Data: Single-series horizontal bars in brand green (#009E73), bars sorted ascending bottom-to-top so freeCodeCamp (118.5M) is the longest bar at top and Vue (46.9M) the shortest at bottom. Value labels in dark text placed just past each bar's end.
      Legibility verdict: PASS — all title, axis, tick, and value-label text is clearly readable against the light background; no light-on-light text.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 (not pure black).
      Chrome: Same title now in white/light ink. Y-axis category labels and x-axis tick labels rendered in light gray, clearly visible against the dark surface. Gridlines are faint light vertical lines. Axis domain lines visible in a lighter tone matching the L-shaped frame convention.
      Data: Bars are the identical brand green (#009E73) as the light render — confirmed unchanged across themes. Value labels in light-colored text at bar ends, fully legible.
      Legibility verdict: PASS — no dark-on-dark failures; all text (title, axis labels, ticks, value labels) reads clearly against the near-black background.
