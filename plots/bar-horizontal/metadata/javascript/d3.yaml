      Data: 8 horizontal bars in brand green (#009E73) with a value-driven opacity ramp — the top bar (freeCodeCamp, 119k) is full-opacity and its value label is bold, lower-ranked bars fade slightly toward 62% opacity. Value labels ("119k", "108k", "98.7k", ...) sit just past each bar's end in dark ink.
