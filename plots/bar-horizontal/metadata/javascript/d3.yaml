review:
  strengths:
  - 'Clean, idiomatic D3 usage: scaleBand/scaleLinear, selection.join(), d3.format("~s")
    for SI-prefix ticks, .nice() domain'
  - Value-driven opacity ramp (d3.scaleLinear on fill-opacity) creates a clear visual
    hierarchy that draws the eye to the top-ranked bar without deviating from the
    Imprint palette
  - All font sizes explicitly set (16px ticks/labels, 18px axis label, 30px title)
    and legible in both themes
  - Bars sorted ascending so the largest value lands at the top of the reversed band
    scale, matching the spec's ranking guidance
  - Correct title format, single-series legend correctly omitted, subtle x-axis-only
    gridlines, rounded bar corners, generous margins
  weaknesses:
  - 'DQ-03: star counts for these specific, well-known named repos deviate substantially
    from real-world GitHub star counts and even reverse the actual relative ranking
    (e.g. Vue is shown as the lowest bar despite having far more real stars than Node.js,
    Bootstrap, VS Code, TensorFlow, and Flutter). Since these are real, easily-verifiable
    public projects, either scale the values to roughly match real proportions/ranking,
    or rename the categories to fictional entities to avoid the factual mismatch.'
  - 'DE-01/DE-03: the opacity ramp and bold top label are a nice touch but the plot
    still relies on a single accent-color idea for storytelling — a small callout
    or delta annotation on the leading bar would push this toward publication-grade
    hierarchy.'
