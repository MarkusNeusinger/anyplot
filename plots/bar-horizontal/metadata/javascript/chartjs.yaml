review:
  strengths:
  - 'Correct use of indexAxis: ''y'' for idiomatic Chart.js horizontal bars, with
    barPercentage/categoryPercentage tuned for clean, evenly spaced bars'
  - Bars sorted descending by value, creating a clear ranking focal point (Mandarin
    Chinese at top) as the spec recommends
  - 'Both renders are theme-correct: warm off-white / near-black backgrounds, fully
    readable chrome, identical #009E73 data color in both themes'
  - Right-side layout padding keeps the longest bar (Mandarin Chinese, ~941M) from
    crowding the canvas edge
  - Y-axis gridlines hidden while X-axis gridlines stay subtle — a deliberate minimal-chrome
    choice appropriate for a horizontal bar ranking
  - Realistic, neutral data (native speaker counts) with a sensible 0-1000 axis scale
    and round tick intervals
  weaknesses:
  - No distinctive Chart.js-specific feature beyond the basic bar API (e.g. no data-label
    plugin at bar ends, no custom tooltip config) — functional but generic library
    usage (LM-02)
  - No value labels at bar ends despite the spec noting this as an option for easier
    comparison — would strengthen readability without cluttering the chart
  - 'Design is competent but largely default: single flat color, no additional visual
    hierarchy beyond the sort order (e.g. no accent/highlight on the top bar) — DE-01/DE-02
    read as solid-but-standard rather than distinctive'
  image_description: |-
