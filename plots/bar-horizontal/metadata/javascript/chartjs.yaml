review:
  strengths:
  - 'Correct, idiomatic indexAxis: ''y'' horizontal-bar setup with tuned barPercentage/categoryPercentage
    for clean, evenly spaced bars'
  - 'Both renders are fully theme-correct: warm off-white/near-black backgrounds,
    all chrome legible, identical #009E73 brand-green data color across themes'
  - Bars sorted descending by value, giving an immediate ranking read (Mandarin Chinese
    to Vietnamese), matching the spec's recommendation
  - Realistic, neutral, reasonably accurate native-speaker-count data across 10 languages
    with a sensible 0-1000 axis scale
  - Title format, axis labeling, and single-series legend omission all correctly follow
    spec/style-guide conventions
  weaknesses:
  - 'Broken value-label plugin: the custom valueLabelsPlugin (afterDatasetsDraw hook)
    is meant to draw ''{value}M'' text at the end of every bar, but direct pixel-inspection
    of both plot-light.png and plot-dark.png shows no text glyphs anywhere near any
    bar end (checked e.g. source-px ~(2966,176) for the Mandarin Chinese bar tip,
    and the Spanish/Portuguese bar ends) - only background/bar-edge antialiasing pixels
    are present. The plugin silently fails to render in the browser harness.'
  - 'Broken bar-highlight coloring: barColors intends bar 0 (Mandarin Chinese) to
    render solid #009E73 and bars 1-9 to render a muted hexToRgba(''#009E73'', 0.55)
    overlay, but pixel-sampling every bar''s fill color returns the identical solid
    RGB (0, 158, 115) for all 10 bars - the alpha-blended color never appears anywhere.
    There is zero visual differentiation between the ''highlighted'' bar and the rest.'
  - Because both newly-added features are non-functional, the rendered chart is visually
    indistinguishable from the Attempt 1 version that already scored 84 - this repair
    added code complexity without any corresponding visual improvement.
  - Design still relies solely on sort order for hierarchy; no other visual-hierarchy
    device compensates for the non-functional highlight.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1. Not pure white.
      Chrome: Title "World's Most Spoken Languages · bar-horizontal · javascript · chartjs · anyplot.ai" and X-axis title "Native Speakers (millions)" in dark ink; Y-axis category names and X-axis tick labels in medium-grey ink. All readable.
      Data: All 10 bars are solid #009E73 (pixel-sampled at multiple bars: RGB (0,158,115) identical across every bar). Sorted descending Mandarin Chinese (~941M) to Vietnamese (~85M). No value-label text found near any bar end despite code intending to draw it via a custom plugin. No muted/alpha-blended color found on bars 1-9 despite code intending it.
      Legibility verdict: PASS (all chrome text legible; the missing plugin output is a functional/code bug, not a legibility issue)

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17. Not pure black.
      Chrome: Title and axis title in light ink, tick/category labels in lighter grey-white. No dark-on-dark issues found.
      Data: Identical #009E73 green as light render (only chrome flipped, correct). Same absence of value-label text and same absence of bar-color differentiation as the light render.
      Legibility verdict: PASS (all chrome text legible; same plugin/color functional bug present)
