review:
  strengths:
  - 'First series correctly uses Imprint brand green #009E73 (t.palette[0]); background/text/grid
    tokens (t.ink, t.inkSoft, t.grid) are threaded through title, axes, and gridlines
    so both renders are fully theme-correct.'
  - Bars sorted descending (largest reason to smallest) with inverse:true category
    axis, creating an immediate ranking narrative appropriate for survey-results data.
  - Value labels placed at the end of each bar with a % formatter, plus an explicit
    x-axis max (80) that leaves clean headroom for the longest bar (68%) and its label
    without crowding the plot edge.
  - Data is a realistic, neutral business scenario (multi-select software-subscription
    survey) with a plausible, well-spread value range (18-68%) and a code comment
    clarifying why shares don't sum to 100.
  - 'Clean KISS structure: deterministic in-memory data, no functions/classes, only
    the used echarts global, animation:false set correctly for the harness screenshot.'
  weaknesses:
  - 'Design Excellence is at ''well-configured default'' level: uniform flat green
    bars with no focal point beyond the sort order — no emphasis (distinct shade,
    outline, or callout) on the top-ranked bar to strengthen the story.'
  - Title only fills ~28% of the canvas width (well under the 50-70% guideline for
    a non-mandated-length title) — the top margin above the plot area reads a little
    heavy relative to the small title; consider a slightly larger title fontSize or
    tighter top grid margin for better canvas balance.
  - Library Mastery is generic — the implementation only uses standard bar + category-axis
    + label-formatter patterns, easily replicated in any bar-chart library. No ECharts-distinctive
    feature is used (e.g. a markLine for the average share, a graphic/itemStyle callback
    to highlight the top bar, or a richer label rich-text style) to demonstrate deeper
    library mastery.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "bar-horizontal · javascript · echarts · anyplot.ai" centered top in dark ink, clearly legible. Y-axis category labels (8 survey reasons, e.g. "Ease of use and onboarding", "Brand reputation") in soft dark gray, fully readable, none clipped. X-axis title "Respondents citing this reason (%)" below the tick labels, readable with units. Tick labels (0%, 20%, 40%, 60%, 80%) legible. Subtle light vertical gridlines at each tick.
      Data: All 8 bars render in the Imprint brand green #009E73, sorted descending from 68% (Ease of use and onboarding) to 18% (Brand reputation). Bars have rounded right end-caps. Value labels (e.g. "68%", "61%") sit just past the bar end in dark ink, no overlap with bars or gridlines.
      Legibility verdict: PASS — all text is clearly readable against the light background, no dark-on-light or light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title, now in light/white text, clearly legible against the dark background. Y-axis category labels in light gray, fully readable. X-axis title and tick labels in light gray, legible. Gridlines subtle and visible against the dark surface.
      Data: Bars are the identical #009E73 green as the light render — confirmed no color drift between themes. Value labels in white/light ink, clearly readable against both the green bars and dark background, no overlap.
      Legibility verdict: PASS — no dark-on-dark or otherwise unreadable text; all chrome elements correctly flipped to light-on-dark while data color stayed constant.
