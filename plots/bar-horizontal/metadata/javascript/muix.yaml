review:
  strengths:
  - 'Accent on the leader is data-driven: the most-voted bar takes Imprint #009E73
    and every other bar the theme-adaptive muted anchor (#6B6A63 light / #A8A79F dark)
    via the y-axis ordinal colorMap, exactly the highlight the Notes allow'
  - Ranking order computed in code (sort descending) so the leader sits at the top;
    one bar thickness with categoryGapRatio 0.35 gives even, generous gaps
  - Zero-based, untruncated value axis with an 8 % headroom (PAD_SHARE) so the outside
    bar labels never touch the plot edge
  - Native barLabel="value" with barLabelPlacement="outside" draws bold, theme-inked
    value labels at every bar end, readable in both themes
  - Subtitle computed from the data (count, leader, margin over runner-up) gives the
    chart a clear reading without any annotation layer
  - All chrome threaded through ANYPLOT_TOKENS (ink, inkSoft, grid, pageBg); both
    renders are theme-correct with identical accent color
  - 'Current MUI X v9 API: layout="horizontal", hideLegend, skipAnimation, borderRadius,
    axis width/height bands, grid={{ vertical: true }}; tooltips remain available
    in the HTML'
  weaknesses:
  - 'Suggestion: right-aligned category labels sit 8 px from the axis line; a few
    more pixels of gap would let the label column breathe.'
  - 'Suggestion: the x-axis title ''Customer votes'' repeats the subtitle''s wording;
    a unit-style title such as ''Votes (count)'' would vary the text.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole canvas, no white plot panel.
      Chrome: bold near-black title "Feature Requests by Customer Votes · bar-horizontal · javascript · muix · anyplot.ai" top-left (~57 % of width), soft-ink subtitle "8 requests ranked by customer votes · Dark mode support leads with 842, 127 ahead of Offline data sync"; eight category labels right-aligned beside their bars, all in full; x ticks 0–900 and axis title "Customer votes"; subtle vertical grid lines at every 100; left and bottom axis lines only. All text readable.
