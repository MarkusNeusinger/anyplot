review:
  strengths:
  - 'Precise Imprint palette usage: brand green reserved for the single highlighted
    leader bar, with the exact theme-adaptive INK_MUTED tokens (#6B6A63 light / #A8A79F
    dark) from the style guide for the supporting bars.'
  - Per-bar label coloring (LABEL_ON_BRAND vs. LABEL_ON_MUTED, itself theme-adaptive)
    keeps every in-bar value label contrast-safe in both themes.
  - 'Strong data storytelling: sorted ranking + single highlighted leader + narrative
    subtitle gives the chart an immediate, legible point of view.'
  - 'Fully spec-compliant: correct title format, canvas size, sorted bars, in-bar
    value labels, and adequate spacing between the 8 categories.'
  weaknesses:
  - 'Dead CSS rule: sx targets .MuiChartsGrid-line but no ChartsGrid is enabled anywhere
    in the chart, so the rule never applies.'
  - series[0].valueFormatter ("${v} votes") is defined but the rendered barLabel="value"
    shows only the bare number; the formatter only reaches the non-visible-in-PNG
    tooltip.
  - No explicit y-axis title, though the category tick labels are self-descriptive
    so this is a minor nit.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title (dark ink) and subtitle (soft gray) top-left, fully legible. X-axis label "Customer Votes" and tick labels (0-950, step 50) in soft gray, legible. Y-axis category tick labels (8 feature names) in soft gray, legible, no truncation.
      Data: Top bar "Dark mode support" filled brand green (#009E73) with bold dark-ink value label "842" centered inside. Remaining 7 bars filled muted olive-gray (#6B6A63-family) with white/cream value labels centered inside, sorted descending 715 -> 312.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Title and subtitle render in light ink / soft gray, fully legible against dark background. Axis label, tick labels, and category names all light-on-dark, legible. No dark-on-dark failures.
      Data: Top bar identical brand green (#009E73) with the same dark-ink label, reads well on both surfaces. Remaining bars use the theme-adaptive muted gray (#A8A79F, lighter than the light-theme muted value by design per style guide's INK_MUTED token) with dark value labels that stay contrast-safe against the lighter fill. Bar colors are conceptually identical brand-vs-muted scheme across themes; only the muted tone's specific value adapts per the style guide's semantic-anchor rule, which is expected and correct (not a violation of "data colors stay identical" -- that rule applies to the 8 core categorical palette positions, not the theme-adaptive muted/neutral anchors).
      Legibility verdict: PASS
