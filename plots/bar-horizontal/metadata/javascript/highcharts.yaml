review:
  strengths:
  - Correct, idiomatic use of Highcharts' native bar type for true horizontal bars
    (not a rotated column workaround)
  - Theme tokens threaded through every chrome element correctly — both renders are
    fully legible with zero dark-on-dark or light-on-light issues
  - Clean, readable data labels with thousands-separator formatting ({y:,.0f}) that
    scale well from '130' to '1,441'
  - Sensible axis range/tick interval choice giving the largest bar (India, 1441)
    comfortable headroom without wasting canvas
  weaknesses:
  - The code comment above the countries/population arrays claims the ascending sort
    renders at the top of the inverted category axis, but the render shows the opposite
    (ascending top-to-bottom, smallest at top) — fix the comment to match actual behavior,
    or reverse the sort/axis if a largest-at-top ranking was the intent
  - No visual emphasis or focal point beyond uniform bar color — consider highlighting
    the top entry or adding a subtle callout to strengthen the data storytelling
  - Design execution is solid but conforms closely to expected defaults; a bit more
    distinctive polish would raise Design Excellence
