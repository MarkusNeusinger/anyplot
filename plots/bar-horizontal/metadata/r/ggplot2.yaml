review:
  strengths:
  - Bars sorted descending by value creates a clean ranking narrative, matching the
    spec's suggestion to sort for easier comparison.
  - 'Correct Imprint palette usage (brand green #009E73 as the sole series); data
    color is identical across light and dark renders, only chrome flips.'
  - Title fontsize auto-scales via the length-based formula (title_ratio = 67/title_n)
    precisely matching style-guide guidance, avoiding overflow for the long descriptive
    + mandated title.
  - Value labels placed directly at bar ends with coord_flip(clip = "off") and scale_y_continuous
    expansion tuned so the largest label (34.5%) never clips the canvas edge.
  - Grid restricted to the value axis only (x, post-flip) with y major grid removed
    and axis ticks hidden — a clean minimalist layout appropriate for horizontal bars.
  weaknesses:
  - dplyr is loaded via library(dplyr) but never actually called — reorder() is base
    R and tibble::tibble() is explicitly namespaced without needing library(tibble)/dplyr
    — drop the unused import (CQ-03).
  - The '18.3%' value label for 'Fully in-office' sits directly on top of the x=20
    vertical gridline, creating a minor visual collision — nudge hjust slightly further
    or draw grid lines behind bars/labels more distinctly.
  - Design excellence is solid but could push further — e.g. a subtle highlight or
    annotation on the top bar would sharpen the focal point beyond what sorting alone
    provides.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Title "Preferred Work Arrangement Survey · bar-horizontal · r · ggplot2 · anyplot.ai" in dark ink at the top, spanning ~65% of plot width. Y-axis category labels (7 work-arrangement descriptions) in dark ink, left-aligned. X-axis "Share of Respondents (%)" label and 0/10/20/30/40 tick labels in softer grey ink. Vertical gridlines at each tick mark, thin and dark-ink colored. Axis ticks removed, only tick labels remain.
      Data: 7 horizontal bars, all filled with brand green #009E73, sorted descending from "Fully remote" (34.5%) to "Job-share arrangement" (1.2%). Percentage value labels in dark ink placed just past each bar's end.
      Legibility verdict: PASS — all title, axis, and tick text is clearly readable against the light background. Minor nit: the "18.3%" label crosses the x=20 gridline but remains fully legible.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Same title, now in light ink (#F0EFE8), same ~65% width. Y-axis category labels in light ink. X-axis label and tick labels in a softer light-grey ink. Vertical gridlines rendered in light ink at reduced visual weight, still visible but subtle against the dark surface.
      Data: Same 7 bars in the identical brand green #009E73, same sort order and same percentage values/positions as the light render — confirming data colors are unchanged between themes.
      Legibility verdict: PASS — no dark-on-dark failures; all title, axis, and tick text is light-colored and clearly readable against the near-black background. Green bars read strongly on both surfaces.
