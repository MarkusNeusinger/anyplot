review:
  strengths:
  - Bars sorted descending by value via reorder(), making the ranking immediately
    readable — matches the spec's 'consider sorting for easier comparison' note
  - Top category ('Fully remote') is deliberately emphasized with a bolder bar border
    and bold data-label text, creating a clear focal point without adding a second
    color
  - Data labels placed at the end of every bar communicate exact values while the
    axis still carries the scale, satisfying the spec's 'value labels at bar ends'
    option
  - Values sum to exactly 100% (34.5+24.8+18.3+12.1+6.4+2.7+1.2) for a plausible,
    neutral 'work arrangement survey' scenario with realistic proportions
  - Theme tokens (PAGE_BG/INK/INK_SOFT) are threaded through plot/panel background,
    grid, axis text and title consistently, and both renders keep the brand green
    identical
  - Title fontsize scales dynamically with title length (title_ratio formula), keeping
    the long mandated title readable without manual tuning
  - Y-axis needs no title (category names are self-descriptive) and the single-series
    legend is correctly omitted — reduces clutter per the style guide
  weaknesses:
  - The 'Fully in-office' row's data label '18.3%' visually collides with the x=20
    major gridline in BOTH renders — the vertical grid line passes directly through
    the glyphs (label position = value + label_gap = 18.3 + 2.415 = 20.7, landing
    right on the gridline). Text stays legible but the crossing line is a visible
    defect; increase label_gap slightly or draw grid lines behind a wider label halo/background
    to avoid the collision.
  - The is_top border-linewidth highlight (1.1 vs 0.4, both colored PAGE_BG) is nearly
    imperceptible against the small bar edge — the bold data-label carries almost
    all of the emphasis. Consider a more visible highlight (e.g. slightly darker/lighter
    fill tint or a small marker) if a stronger focal point is desired.
  - Right-side canvas margin beyond the 34.5% bar is fairly generous relative to the
    data range (scale runs to ~40 while max value is 34.5) — acceptable given label
    space is needed, but could be tightened slightly for better canvas utilization.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "Preferred Work Arrangement Survey · bar-horizontal · r · ggplot2 · anyplot.ai" in dark ink at the top, fully visible, not clipped. Y-axis category labels (7 survey response options) in dark ink to the left of each bar. X-axis "Share of Respondents (%)" title and 0/10/20/30/40 tick labels in soft ink below. Subtle vertical major gridlines at each decade tick.
      Data: 7 horizontal bars in brand green (#009E73), sorted descending from "Fully remote" (34.5%) to "Job-share arrangement" (1.2%). Each bar has a data label (e.g. "34.5%") placed just past its end in dark ink; the top bar's label is bold to mark the focal point.
      Legibility verdict: PASS — all title, axis, tick, and data-label text is clearly readable against the light background. One minor defect: the "18.3%" label for "Fully in-office" is crossed by the x=20 gridline (still legible, but a visible collision — see weaknesses).

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title, now in light ink (#F0EFE8), fully visible. Y-axis category labels and X-axis title/ticks rendered in light ink, fully legible against the dark surface. Gridlines are a faint light color, still visible but subtle.
      Data: Same 7 bars in identical brand green (#009E73) — confirmed pixel-identical hue to the light render — only chrome (background/text/grid) flips.
      Legibility verdict: PASS — no dark-on-dark or light-on-light failures; all text is light-colored against the dark background and clearly readable. Same minor gridline/label collision on "18.3%" as in the light render (theme-independent issue, not a legibility failure).
