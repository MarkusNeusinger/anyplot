review:
  strengths:
  - Brand green (#009E73) correctly highlights the leading category (Python), with
    the theme-adaptive Imprint 'muted' semantic anchor used for the rest — a deliberate
    emphasis technique that directly follows the spec's own guidance to 'highlight
    specific bars to draw attention'.
  - Theme-adaptive chrome is threaded through every element (title, axis labels, ticks,
    grid, value labels) — both light and dark renders are fully readable with no dark-on-dark
    or light-on-light failures.
  - Clean KISS code structure with deterministic, literal data (no unnecessary randomness),
    and every font size explicitly set.
  - Value labels are placed outside the bars with cliponaxis=False, so even the longest
    bar (Python, 2847) never risks edge clipping.
  - Bars sorted descending by value, aiding rankability per the spec's own recommendation.
  weaknesses:
  - Design Excellence reads as a well-configured default beyond the single-bar highlight
    (DE-01=4/8) — no custom typography, subtitle, or additional polish pushes it into
    'publication-ready' territory yet.
  - Vertical gridlines plus the 10% x-axis headroom leave visible dead space to the
    right of the longest bar; tighten the x-range/right margin, or drop the grid entirely
    per the style guide's 'prefer no grid for simple plots with few data points' guidance,
    to improve canvas utilization (VQ-05).
  - Library Mastery is generic (LM-02=2/5) — consider a plotly-specific touch such
    as a custom hovertemplate for the interactive HTML view, a texttemplate for the
    outside labels, or an annotations layer to differentiate beyond basic go.Bar usage.
  - Data Storytelling (DE-03=4/6) relies solely on the single-bar color contrast;
    a short subtitle or annotation (e.g., framing the survey sample size/date) would
    strengthen the narrative further, though it is not required by the spec.
