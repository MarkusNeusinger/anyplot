review:
  strengths:
  - Real interactivity (pointer-hover alt.selection_point dimming non-hovered bars)
    rather than any simulated/fake widget
  - Careful headroom calculation (x_max = max * 1.15) keeps end-of-bar labels from
    ever clipping or overlapping the axis frame
  - Theme tokens (PAGE_BG, INK, INK_SOFT) are threaded consistently through title,
    axis, grid, and labels - both renders are fully legible with identical data color
  - Realistic, neutral dataset that sums cleanly to 100%, appropriately sized for
    a horizontal bar chart (10 categories)
  weaknesses:
  - Title omits the {language} segment mandated by the style guide - should be "bar-horizontal
    · python · altair · anyplot.ai" instead of "bar-horizontal · altair · anyplot.ai"
  - 'Design Excellence is on the generic side: a single flat color and default Vega-Lite
    chrome with no additional visual hierarchy (e.g., emphasizing the top-ranked bar)
    beyond the descending sort'
  - Distinctive Altair capabilities are underused beyond the hover highlight - the
    chart is functionally close to a minimal mark_bar + mark_text combination
