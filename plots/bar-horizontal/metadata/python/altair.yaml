      Chrome: same layout; title and axis titles in light ink, tick/value labels in soft light gray. All text clearly legible against the dark background - no dark-on-dark failures.
      Data: top (Python) bar samples ~#019766, consistent with the light render's top bar. The 9 non-highlighted bars sample ~#077D5C - a darker, more saturated green than their light-theme counterpart (#3FB492), because the same 0.75-opacity fill composites differently over the near-black background. Underlying source color is identical in code; the composited pixel color is not identical across themes for most bars. Flagged as a VQ-07 partial deduction, not a legibility failure.
      Legibility verdict: PASS
