review:
  strengths:
  - Correct horizontal bar chart with clean, idiomatic bokeh (figure + hbar + ColumnDataSource)
    implementation
  - Bars sorted by value with the largest at the top, giving an at-a-glance ranking
    from JavaScript (65.6%) down to Kotlin (9.2%)
  - 'Full theme-adaptive chrome: title, axis labels, tick labels, grid, and outline
    all correctly branch on ANYPLOT_THEME, and both plot-light.png / plot-dark.png
    backgrounds match the required #FAF8F1 / #1A1A17 surfaces'
  - 'First (only) series uses the Imprint brand green #009E73, identical across both
    renders'
  - All font sizes explicitly set (title 50pt, axis label 42pt, tick labels 34pt,
    value labels 26pt) and well-proportioned at the 3200x1800 canvas
  - End-of-bar value labels (LabelSet) give direct, precise readouts without requiring
    the viewer to interpolate against the axis
  - PrintfTickFormatter cleanly renders '%d%%' ticks; realistic, neutral, factually-plausible
    developer-popularity data
  - KISS code structure, deterministic/static data (no seed needed), clean imports,
    correct plot-{theme}.png / plot-{theme}.html output pair
  weaknesses:
  - 'Design Excellence is at ''well-configured default'' level: a single flat green
    fill with no visual emphasis on the leading bar (e.g. the #1 JavaScript bar looks
    identical to all others) — the sorted order alone carries the storytelling, but
    there''s no additional focal point or hierarchy device to guide the eye to the
    headline insight'
  - p.outline_line_color draws a full four-sided box around the plot area (bokeh default
    look) rather than the style guide's preferred L-shaped or spine-free frame — consider
    dropping or fading the top/right outline edges for a more refined finish
  - 'Library Mastery is generic/idiomatic but not distinctive: no HoverTool or other
    bokeh-specific interactive feature is used in the HTML output, so LM-02 stays
    at the ''could be any library'' floor — adding a HoverTool with formatted tooltips
    would strengthen this without affecting the PNG render'
  - Value labels (26pt) sit noticeably smaller than the tick labels (34pt) they're
    paired with along the same axis — acceptable per the typography hierarchy, but
    a touch more parity would tighten the visual balance
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Bold centered title "bar-horizontal · python · bokeh · anyplot.ai" in dark ink at the top; italicized x-axis label "Developer Popularity (%)" below the axis; dark-gray category tick labels (JavaScript, Python, TypeScript, Java, C#, C++, PHP, Go, Rust, Kotlin) on the left; percentage tick labels (0%-70%) along the bottom; faint vertical gridlines at each x-tick; thin box outline around the plot area. All chrome is clearly readable against the light background.
      Data: 10 horizontal bars in Imprint brand green (#009E73) with a subtle darker-ink edge stroke, sorted ascending bottom-to-top so JavaScript (65.6%) is the longest bar at the top and Kotlin (9.2%) the shortest at the bottom; each bar has a small end-of-bar percentage value label in secondary ink color.
      Legibility verdict: PASS — no text is light-on-light; all title, axis, tick, and value-label text is clearly legible.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title, axis label, tick labels, and gridlines as the light render but recolored to light ink (title/axis label near-white, tick labels light gray) and grid at low alpha against the dark surface; box outline visible in a muted light-gray tone.
      Data: Bars are the identical #009E73 green as the light render (confirmed same hue/saturation), same sort order and value labels, now shown in a lighter secondary-ink tone for contrast against the dark background.
      Legibility verdict: PASS — no dark-on-dark failures; every title, axis, tick, and value label is clearly legible against the near-black surface, and the brand green remains vivid on the dark surface.
