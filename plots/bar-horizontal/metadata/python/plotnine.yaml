review:
  strengths:
  - Correct, idiomatic horizontal bar chart via coord_flip() + geom_bar(stat='identity')
    — clean grammar-of-graphics composition
  - Categories sorted ascending so the flipped chart reads largest-to-smallest top-to-bottom,
    giving an instant ranking insight
  - Value labels placed at bar ends per the spec's suggestion, formatted to one decimal
    with a percent sign
  - Theme-adaptive chrome is threaded correctly through background, ink, grid, and
    panel-border tokens — both renders are fully legible
  - Imprint brand green (#009E73) used as the sole data color and is pixel-identical
    between light and dark renders
  - Clean KISS script structure with deterministic hard-coded data and theme-suffixed
    output filenames
  weaknesses:
  - panel_border draws a full four-sided box around the plot area instead of the style
    guide's default L-shaped frame (top/right spines removed) — remove panel_border
    or set only left/bottom lines for a more polished, on-brand look
  - geom_text value labels are quite small (size=2.8) relative to the tick-label font
    (size=8pt) — bump slightly for better legibility once scaled down to ~400px mobile
    width
  - Techniques used (coord_flip, geom_text, categorical reordering) are generic ggplot2/grammar-of-graphics
    patterns that translate directly to R ggplot2 with almost no changes — consider
    leaning on a plotnine-distinctive touch (e.g. a themed layer or plotnine-specific
    scale/stat) to better showcase the library
  - Data storytelling is currently limited to sorting; the spec explicitly allows
    'highlight specific bars to draw attention' as an alternative to single-color
    — consider giving the top bar (JavaScript) a subtle visual accent to sharpen the
    focal point
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Bold dark title "bar-horizontal · python · plotnine · anyplot.ai" centered at top, clearly readable. Y-axis lists 10 programming languages (JavaScript down to Swift, largest to smallest). X-axis "Developer Usage (%)" with ticks at 0/20/40/60, dark tick labels on light background. A thin four-sided panel border encloses the plot area; subtle vertical gridlines aligned to the x-axis ticks are visible but unobtrusive.
      Data: All 10 bars rendered in Imprint brand green (#009E73), consistent width and spacing, with small dark-gray (#4A4A44) percentage value labels placed just past each bar's end (e.g. "65.6%", "6.6%").
      Legibility verdict: PASS — title, axis titles, tick labels, and value labels are all clearly readable against the light background; no light-on-light text found.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title and axis labels rendered in light/off-white and light-gray tones, fully legible against the dark background. The same thin panel border (now light gray) and faint gridlines are present. No dark-on-dark text was found — tick labels and value labels are light-toned and readable.
      Data: Bars are the identical Imprint brand green (#009E73) as the light render — confirmed pixel-matched hue; only the chrome (background, text, border, grid) flipped.
      Legibility verdict: PASS — all text elements are clearly legible against the dark background.
