review:
  strengths:
  - 'Perfect Imprint palette compliance: highlighted bar samples exactly #009E73 in
    both renders (verified via pixel sampling), background samples exactly #FAF8F1
    (light) / #1A1A17 (dark) with fully theme-adaptive chrome.'
  - Alpha-based emphasis (top-ranked bar at full opacity, rest at reduced alpha, single
    hue throughout) directly implements the spec's 'use a single color for all bars,
    or highlight specific bars to draw attention' guidance and creates a clear focal
    point.
  - Bars sorted descending by value (via ascending categorical + coord_flip) — the
    recommended ranking layout for immediate readability, exactly per spec notes.
  - Value labels placed at bar ends per spec requirement; subtle x-only grid, blank
    y-grid, minimal ticks, and an L-shaped axis-line frame keep the chrome clean without
    clutter.
  - 'Idiomatic, KISS plotnine code: geom_bar + coord_flip + scale_alpha_manual + geom_text
    layered cleanly, all font sizes explicitly set, no functions/classes, clean imports.'
  weaknesses:
  - Value labels at bar ends (geom_text size=3.5, nudge_y=1.6) become hard to read
    once the PNG is scaled down to the ~400px mobile thumbnail — bump geom_text size
    to ~4.5-5 (or shorten the nudge) so percentages stay legible at mobile width.
  - 'LM-02: the alpha-highlight technique is elegant but is a fairly generic grammar-of-graphics
    pattern (replicable with a manual color list in other libraries) — consider leaning
    into a more plotnine-distinctive feature (e.g. labs(subtitle=...), custom scale
    transform) to raise Library Mastery further.'
  - Title occupies only ~53% of canvas width — safely within bounds and not a defect,
    but there is headroom to grow the title fontsize slightly for more visual presence
    without risking overflow (optional polish, not required).
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, sampled pixel = (250, 248, 241) = #FAF8F1 exactly. Matches required light surface.
      Chrome: Bold dark title "bar-horizontal · python · plotnine · anyplot.ai" centered at top, clearly readable. Y-axis category labels (JavaScript, Python, Java, TypeScript, C#, C++, PHP, Go, Rust, Swift) in dark-gray, all legible. X-axis "Developer Usage (%)" label and 0/20/40/60 tick labels legible. Subtle vertical (x-axis) gridlines only, y-grid removed, thin L-shaped axis line (left+bottom), no tick marks. All primary/secondary text is dark-on-light and clearly readable.
      Data: 10 horizontal bars sorted descending by value (JavaScript 65.6% at top down to Swift 6.6% at bottom). Top bar (JavaScript) rendered at full-opacity brand green, sampled pixel = (0, 158, 115) = #009E73 exactly — the ★ brand color. Remaining 9 bars are the same hue at reduced alpha (~0.45), creating a monochrome ranking with one highlighted focal point. Value-percentage labels sit just past each bar's end in soft gray text.
      Legibility verdict: PASS. All chrome text reads cleanly at full resolution. Minor caveat: the small value-percentage labels (e.g. "65.6%") become difficult to make out once the image is scaled down to the ~400px mobile thumbnail, while all other text (title, axis labels, category names, tick labels) remains legible at that size.

    Dark render (plot-dark.png):
      Background: Warm near-black, sampled pixel = (26, 26, 23) = #1A1A17 exactly. Matches required dark surface.
      Chrome: Title, axis labels, category tick labels, and x-axis tick labels all render in light/off-white tones, fully readable against the dark background — no dark-on-dark failures observed. Gridlines and axis line use the same theme-adaptive soft tones as light mode, correctly inverted.
      Data: Colors are identical to the light render — top bar (JavaScript) samples exactly (0, 158, 115) = #009E73, confirming the data hue is unchanged across themes; only the background/text/grid chrome flipped as required. The reduced-alpha bars blend against the dark background analogously to how they blend against the light background in the light render.
      Legibility verdict: PASS. All chrome text is clearly readable against the dark surface, with the same mobile-scale value-label caveat as the light render (labels become small at ~400px, but this is a shared, theme-independent issue rather than a dark-mode-specific failure).
