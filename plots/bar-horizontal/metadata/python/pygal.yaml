review:
  strengths:
  - Clean, minimal horizontal bar chart with categories correctly sorted descending
    by value (largest at top-visual/bottom-index per pygal's bottom-up rendering),
    matching the spec's ranking-display recommendation
  - 'Theme tokens correctly threaded through the Style object: backgrounds are exactly
    #FAF8F1 (light) / #1A1A17 (dark), and chrome text (title, tick labels, category
    labels) flips from dark-on-light to light-on-dark with zero readability issues
    in either render'
  - 'First (and only) series uses brand green #009E73 exactly, identical in both renders
    per Imprint rules; value labels use a dark, fixed color that stays legible sitting
    directly on the green bars in both themes'
  - Value labels formatted with a custom formatter ($842.6M style) placed at the end
    of each bar, giving precise reading without requiring a separate axis scan
  - Title follows the exact mandated format with a sensible descriptive prefix, and
    title font size is computed via the length-based scaling formula so it doesn't
    overflow the canvas
  - 'No axis-guide clutter: legend, y-guides and x-guides are suppressed since a single
    series and value labels make gridlines unnecessary, keeping the chart visually
    quiet'
  - Fully deterministic, hardcoded dataset with realistic and neutral retail-revenue
    values across a plausible $M range - no randomness, no seed needed
  - Saves both plot-{THEME}.png and plot-{THEME}.html as required for an interactive
    library, using current pygal 3.x API (render_to_png / render_to_file)
  weaknesses:
  - No custom font-family override, so labels render in pygal's fallback monospace
    typeface rather than a more polished sans-serif - a minor, systemic pygal styling
    limitation rather than a spec violation, but it caps DE-01/DE-02 below top marks
  - Chart relies entirely on a single flat color and default bar styling (no edge
    highlighting, no subtle gradient, no secondary visual cue) - functional and clean
    but doesn't create a strong focal point beyond the sort order, limiting DE-03
  - x_labels/y_labels axis semantics for pygal.HorizontalBar are non-obvious (transposed
    relative to a normal Bar) and rely only on an inline comment for future maintainers
    - acceptable but worth double-checking if pygal's API changes in a future version
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, confirmed #FAF8F1 (sampled pixel (250,248,241)) - matches spec exactly, not pure white.
      Chrome: Title "Retail Revenue by Category · bar-horizontal · python · pygal · anyplot.ai" in dark ink at top, fully visible, not clipped. Category labels (Electronics, Apparel, Home & Furniture, ... Garden & Outdoor) in dark text along the y-axis, all fully readable. X-axis tick labels (0, 150, 300, ... 900) in dark text below the plot. X-axis title "Revenue ($M)" clearly visible beneath the ticks. All chrome text renders as dark-on-light with strong contrast.
      Data: Single series in Imprint brand green (#009E73), 10 horizontal bars sorted descending in value from Electronics ($842.6M) at bottom to Garden & Outdoor ($97.6M) at top of the visual stack. Each bar carries a dark value label ("$842.6M", etc.) at its end/inside, clearly legible against the green fill.
      Legibility verdict: PASS - all text readable, no overlap, no clipping at canvas edges.

    Dark render (plot-dark.png):
      Background: Warm near-black, confirmed #1A1A17 (sampled pixel (26,26,23)) - matches spec exactly, not pure black.
      Chrome: Same title, category labels, tick labels, and axis title as the light render, now rendered in light cream/off-white ink, fully legible against the dark background. No dark-on-dark failures observed - verified via pixel crop that category labels ("& Beauty", etc.) render in light ink while the value labels drawn on top of the green bars stay dark for contrast against the green fill (not the background), which is a valid and legible choice.
      Data: Identical bar order, values, and green fill (#009E73) as the light render - only the chrome (background + text ink) flipped, exactly as required. Bars remain crisp and clearly distinguishable from the near-black background.
      Legibility verdict: PASS - all text readable, no dark-on-dark issues, data colors identical to the light render.
