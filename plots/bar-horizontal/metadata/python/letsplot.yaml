review:
  strengths:
  - 'Correct Imprint palette usage: brand green (#009E73) for all bars, position-3
    blue (#4467A3) highlighting the top language — identical across both renders,
    only chrome flips'
  - Theme-adaptive chrome fully threaded (PAGE_BG, INK, INK_SOFT) — both light and
    dark renders pass the readability check with no dark-on-dark or light-on-light
    text
  - Data sorted ascending so the largest value renders at the top of the categorical
    axis, giving an intuitive top-to-bottom ranked read reinforced by the highlighted
    leader
  - Value labels placed at bar ends (geom_text, hjust=left, nudge_x) improve readability
    without cluttering the bars
  - Canvas matches the 3200x1800 landscape target exactly (ggsize(800,450) + scale=4),
    no clipping of title, ticks, or value labels
  weaknesses:
  - 'DE-01/DE-02: styling is clean but conventional — axis_line/spines are kept rather
    than removed, and there''s no secondary annotation (e.g. average reference line,
    subtitle) to lift it beyond a standard ranked bar chart'
  - 'LM-02: doesn''t showcase letsplot-distinctive capabilities beyond baseline ggplot-grammar
    usage aside from the HTML export — consider a lets-plot-specific touch (e.g. custom
    tooltip config surfaced via ggsave html) to differentiate from the plotnine/ggplot2
    twins'
  - Title occupies only ~45% of plot width, under the comfortable 50-70% target for
    this canvas — a slightly larger plot_title fontsize would improve visual balance
    (minor, not a hard deduction)
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "bar-horizontal · python · letsplot · anyplot.ai" in dark ink at top-left, fully visible and not clipped. Axis titles ("Developers Using Language (%)" / "Programming Language") and tick labels in soft dark gray, all clearly legible against the light background. Subtle vertical gridlines only (major_x), no y gridlines, no axis ticks marks, thin axis line.
      Data: 10 horizontal bars, one per programming language, sorted so the largest value (JavaScript, 65.4%) is at the top and the smallest (Rust, 11.8%) at the bottom. All bars use brand green #009E73 except the top bar (JavaScript), which uses the Imprint position-3 blue #4467A3 to highlight the leader. Value labels (e.g. "65.4%") sit just past each bar's end in soft gray text, with no overlap on bars or other labels.
      Legibility verdict: PASS — all text reads clearly against the light surface, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Same title, axis titles, and tick labels now rendered in light ink/soft-light gray, clearly legible against the dark background. Gridlines remain subtle but visible. No dark-on-dark text found anywhere (title, axis text, tick labels, value labels all read clearly).
      Data: Same 10 bars in the same order and proportions as the light render. Bar colors are pixel-identical to the light render — brand green #009E73 for all bars except the JavaScript leader bar in #4467A3. Only the chrome (background/text/grid) has flipped for dark mode, confirming palette-position consistency across themes.
      Legibility verdict: PASS — all text reads clearly against the dark surface, no dark-on-dark failures observed.
