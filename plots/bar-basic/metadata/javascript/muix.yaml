review:
  strengths:
  - 'First series color is the required brand green #009E73, identical between light
    and dark renders — only chrome flips as expected'
  - Value labels (barLabel="value") are colored from t.ink, so they stay readable
    in both themes (dark text on light, light text on dark) instead of a fixed color
  - Data sorted descending by consumption creates a clear ranking narrative that supports
    the comparison use case from the spec
  - Grid restricted to horizontal-only, legend correctly hidden for a single series,
    and margins are tuned so the long y-axis label and x-axis category labels never
    clip
  - Deterministic in-memory dataset with a real-world, neutral topic (Nordic coffee
    consumption) appropriate to the domain and scale
  weaknesses:
  - Library usage is fairly standard MUI X BarChart configuration (dataset + band
    xAxis + single series) — no distinctive MUI X-only feature (e.g. highlightScope,
    custom bar rendering, reference lines) is demonstrated beyond barLabel and grid
    config
  - 'Design Excellence is functional but generic: aside from the horizontal-only grid
    and value labels, there is no additional visual hierarchy or refinement (e.g.
    subtle emphasis on the top bar, custom tick formatting) to elevate it beyond a
    competent default'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1, not pure white.
      Chrome: Title "bar-basic · javascript · muix · anyplot.ai" centered at top in dark ink, clearly readable. Y-axis label "Coffee Consumption (kg per capita/year)" and x-axis label "Country" both dark and legible. Tick labels (0-12 on y, country names on x) are dark and crisp. Subtle light-gray horizontal gridlines only.
      Data: Seven bars in the brand green #009E73, sorted descending from Finland (12) to Switzerland (7.9). Value labels are centered inside each bar in dark text, clearly legible against the green fill. Bar widths and spacing are consistent.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17, not pure black.
      Chrome: Title, axis labels, and tick labels all rendered in light ink, clearly visible against the dark background — no dark-on-dark issues. Gridlines are subtle and visible without dominating.
      Data: Same seven green (#009E73) bars, identical heights and values to the light render — confirms data colors are unchanged across themes. Value labels are centered inside each bar in light text, clearly legible against the green fill (the implementation swaps label color from t.ink, which flips between themes).
      Legibility verdict: PASS
