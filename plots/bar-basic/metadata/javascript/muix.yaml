review:
  strengths:
  - 'Single brand-green #009E73 bar series sorted by value from a true zero baseline,
    so the ranking and the dominant Finland bar read instantly; the y axis is never
    truncated'
  - 'Value labels via the native barLabel formatter with barLabelPlacement: "outside"
    sit just above each bar end, one decimal, readable in both themes and never colliding'
  - 'Idiomatic MUI X v9 usage: dataset + dataKey binding, explicit axis band sizes
    (height: 72 / width: 84) so no tick labels truncate, a domainLimit callback that
    derives label headroom from the data max, hideLegend for the single series, skipAnimation'
  - 'Theme handling is clean: chrome comes from the harness ThemeProvider plus t.ink
    for the title and bar labels; both renders are fully readable with identical data
    colours'
  - 'Realistic, neutral data: per-capita coffee consumption for seven countries (Finland
    12.0 kg down to Switzerland 7.9 kg), with a descriptive y-axis title that carries
    units'
  weaknesses:
  - 'Suggestion: restructure the data into the library prompt''s data block (role
    constants such as COUNTRY / CONSUMPTION and one `const data` array of records)
    instead of two parallel arrays zipped into `dataset`, so the ''Use with my data''
    agent can swap the block.'
  - 'Suggestion: the 22 px title is only slightly larger than the 18 px axis titles;
    a little more size or weight would give the title a clearer place in the type
    hierarchy.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, no white panel painted over it.
      Chrome: centred title "bar-basic · javascript · muix · anyplot.ai" in dark ink; y-axis title "Coffee Consumption (kg per capita/year)" rotated on the left, x-axis title "Country" below; tick labels 0–12 and the seven country names all dark and readable; L-shaped frame (left and bottom axis lines only); subtle horizontal grid at each integer.
      Data: seven equal-width bars in #009E73 with even gaps, sorted descending (Finland 12.0, Norway 9.9, Iceland 9.0, Denmark 8.7, Netherlands 8.4, Sweden 8.2, Switzerland 7.9), rising from 0; one-decimal value labels just above each bar end, no collisions. No legend (single series).
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, axis titles, tick labels and value labels all render in light ink and read clearly; axis lines light; grid lines subtle light-on-dark. No dark-on-dark text anywhere.
      Data: bars are the identical #009E73 green as in the light render, same heights, widths and order; only chrome flipped.
      Legibility verdict: PASS
