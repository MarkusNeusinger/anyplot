      Legibility verdict: PASS — no light-on-light or unreadable text anywhere.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Title, axis title, and tick/category labels have flipped to light-colored text (near-white for title, soft light gray for ticks/axis-title) and remain fully legible against the dark background. Gridlines are still subtle and visible. Data labels above bars flip to a light gray tone and remain readable.
      Data: Bars remain the identical Imprint green #009E73 as in the light render — confirmed no hue shift between themes.
      Legibility verdict: PASS — no dark-on-dark failures observed; every text element is clearly readable.
