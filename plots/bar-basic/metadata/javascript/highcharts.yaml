review:
  strengths:
  - 'First series correctly uses Imprint brand green #009E73, and data colors are
    identical across light and dark renders'
  - 'Both themes are fully theme-adaptive: warm off-white/near-black backgrounds,
    correct ink/inkSoft chrome, subtle grid opacity'
  - Data is sorted descending by headcount, giving the chart an immediate, readable
    ranking story without needing annotations
  - Realistic, neutral business scenario (department headcount) with plausible, well-scaled
    values
  - Clean, minimal KISS code structure with explicit font sizing throughout and no
    fake interactivity
  - Correct mandated title format and appropriately omits the legend for a single-series
    chart
  weaknesses:
  - 'Design Excellence is at library-default level: flat single-color bars with only
    a subtle borderRadius, no additional visual hierarchy device beyond bar order
    (e.g. color emphasis on the top category, subtle value-driven opacity) — reads
    as ''correct'' rather than ''polished'''
  - tooltip.enabled is set to false, which removes Highcharts' native hover-tooltip
    entirely from the interactive HTML output; since dataLabels already show values
    this is a defensible choice for the static PNG, but it forfeits a distinctive
    Highcharts interactivity feature that would strengthen Library Mastery (LM-02)
    — consider re-enabling a lightly styled tooltip for the HTML view
  - No other Highcharts-distinctive touches (e.g. per-point color emphasis via colorByPoint
    on a highlighted bar, negativeColor, custom dataLabel formatter) are used beyond
    the basic column + dataLabels combination — usage is idiomatic but generic
  - Grid/margin utilization is generous on the right side past the last category;
    could tighten slightly for a marginally denser layout, though this is a minor
    issue
  image_description: |-
