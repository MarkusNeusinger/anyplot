      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "bar-basic · javascript · highcharts · anyplot.ai" is bold, dark ink, centered, fully visible with no clipping. Y-axis title "Headcount" (rotated) and x-axis category labels (Engineering, Sales, Support, Marketing, Operations, Finance) are dark/soft-gray and clearly legible. Horizontal gridlines are subtle and do not compete with the bars. Data labels (186, 142, 97, 68, 54, 31) sit cleanly above each bar with no overlap.
