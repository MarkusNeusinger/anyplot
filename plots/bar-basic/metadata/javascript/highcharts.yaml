review:
  strengths:
  - Clean, idiomatic Highcharts implementation with theming tokens correctly threaded
    through title, axes, grid, tooltip, and data labels for both light and dark themes
    — no dark-on-dark or light-on-light failures in either render.
  - 'Effective data storytelling: descending sort by value plus a Highcharts.color().brighten()-derived
    highlight on the top-ranked department (Engineering) directly matches the spec''s
    "highlight specific bars to draw attention" guidance, and stays palette-compliant
    since it''s derived from #009E73 rather than a foreign color.'
  - Deterministic, realistic headcount data (31-186) with a sensible descending scale
    and a spec-exact title.
  - 'Value labels above bars for precise reading, consistent bar/group padding, subtle
    rounded corners, and animation: false correctly set on both chart and series per
    the harness contract.'
  weaknesses:
  - Design Excellence is solid but not exceptional — no additional refinement beyond
    the highlight bar and rounded corners (e.g. a subtle reference/average plotLine,
    more deliberate typography hierarchy) that would push DE-01/DE-02 higher.
  - Library Mastery could lean on more distinctive Highcharts capabilities (e.g. yAxis.plotLines
    for an average marker, custom dataLabels.formatter) to better showcase what sets
    Highcharts apart from a generic bar-chart renderer.
  - Feature coverage (DQ-01) is complete for a basic ranking bar chart but doesn't
    add an extra informational layer (e.g. a benchmark/average line) that would round
    it out further.
