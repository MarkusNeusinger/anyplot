  strengths:
  - Bars are sorted by value, with equal widths and even gaps, and rise from a zero
    baseline on an untruncated 0-150,000 axis with readable 30,000 steps computed
    from the data
  - 'A single brand-green accent on the leader stands against a theme-adaptive muted
    grey at full opacity, so #009E73 is identical in both themes'
  - Value labels now sit clear of the bar ends in both themes, with thousands separators
    from value_formatter
  - The title uses the single-line descriptive-prefix form 'Website Traffic by Channel
    · bar-basic · python · pygal · anyplot.ai'
  - 'pygal idioms: per-point dicts ({''value'', ''color''}) for the accent, native
    print_values with rounded_bars, and the interactive HTML export with tooltips'
  weaknesses:
  - 'Suggestion: a slightly lighter grid (the muted ink at full opacity) would sit
    further behind the bars.'
