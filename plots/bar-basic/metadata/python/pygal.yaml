review:
  strengths:
  - Bars sorted by value with equal widths and even gaps, rising from a zero baseline
    on an untruncated 0-150,000 axis
  - 'Single brand-green accent on the leader against the theme-adaptive muted grey,
    at full opacity so #009E73 is identical in both themes'
  - 'Fully theme-correct chrome: grid, tick labels and value labels follow INK/INK_MUTED
    and read cleanly on both surfaces'
  - 'Idiomatic pygal: per-point dict values for the accent color, value_formatter,
    native print_values and rounded_bars, plus interactive HTML output'
  - 'Adaptable structure: a tidy df with named column constants drives every label,
    tick and share'
  weaknesses:
  - 'VQ-02 (both): the value labels sit directly on the bar ends with no gap; the
    commas of ''142,500'', ''87,300'' and ''72,600'' touch the bar tops, against C4
    (labels clear of the bar ends) → a gap of about 10-15 px between label baseline
    and bar top. Likely cause: pygal print_values_position=''top'' places the text
    at the bar edge; offset it via a larger value margin or print_values_position
    with a small padding in the value text style.'
  - 'SC-04 (both): the title adds a second line (''Organic Search leads Q4 2025 traffic
    at 28% share'') after the mandated ''bar-basic · python · pygal · anyplot.ai''
    instead of the allowed ''{Descriptive Title} · '' prefix → a single line ''Website
    Traffic by Channel · bar-basic · python · pygal · anyplot.ai'' or the bare mandated
    string. Likely cause: the f-string title with ''\n''.'
  - 'Suggestion: a slightly lighter grid (the muted ink at full opacity) would sit
    further behind the bars.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across canvas and plot area.
      Chrome: two-line title "bar-basic · python · pygal · anyplot.ai" / "Organic Search leads Q4 2025 traffic at 28% share" in dark ink, centred; y-axis title "Visits (Q4 2025)" rotated on the left, x-axis title "Channel" below; tick labels 0-150,000 in 30,000 steps and the seven channel names, all dark and readable; thin solid grey horizontal grid lines, left and bottom axis lines only.
      Data: seven rounded vertical bars sorted descending (Organic Search 142,500, Direct 98,700, Social Media 87,300, Paid Ads 72,600, Email 53,200, Referral 41,800, Affiliates 18,900); the leader in #009E73, the rest in muted grey #6B6A63; value labels in dark ink sitting directly on each bar top, commas touching the bar edges.
