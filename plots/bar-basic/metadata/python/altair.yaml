review:
  strengths:
  - Single Imprint green (#009E73) for all bars with one ochre (#BD8233) accent on
    the top seller via alt.condition(), the accent the spec's Notes allow, identical
    in both themes
  - Bars sorted by value from a zero baseline, with a data-driven domain (max × 1.1)
    that keeps the $45,200 label clear of the plot top
  - autosize type='fit' fills the 3200×1800 canvas with the whole chart; horizontal
    category labels need no rotation
  - 'Theme tokens threaded through title, axis titles, tick labels, value labels,
    domain and grid: all text readable on both #FAF8F1 and #1A1A17'
  - Escaped column constants with explicit type= and title=, dollar-formatted axis
    and labels, tooltips for the HTML view
  weaknesses:
  - 'Suggestion: a slightly larger band padding (paddingInner around 0.2) would widen
    the gaps between the bars.'
  - 'Suggestion: with value labels on every bar, a sparser y-axis tick step ($10,000)
    would reduce the redundant tick text.'
