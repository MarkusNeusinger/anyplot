review:
  strengths:
  - 'One p.scatter renderer per product from its own ColumnDataSource with legend_label
    gives an exact one-to-one mapping between colors, legend entries and groups; groups
    iterate with sort=False so Sparkling Water takes #009E73 and the rest follow the
    Imprint order'
  - Translucent fills (fill_alpha=0.8) with a 2 px page-colored outline keep coincident
    points distinguishable in both themes, exactly the overlap handling the spec suggests,
    with every point at its exact (x, y) value
  - Legend glyph box sized (glyph_width/height=60) so the legend markers match the
    24 px data marks; bold legend title on the elevated surface reads cleanly in both
    themes
  - Native bokeh tooltips with formatted fields ({0.1}) and brace-wrapped column names
    expose product, spend and engagement per point in the HTML output
  - Plausible, neutral beverage-marketing scenario with readable axis titles and units
    taken from the column constants
  weaknesses:
  - 'Suggestion: varying marker shapes per product (the Notes allow it) would add
    a redundant cue for readers who cannot separate Energy Drink #4467A3 from the
    dark page at small sizes.'
  - 'Suggestion: a modest within-group correlation in the generated data would let
    the chart also show the ''comparing correlation patterns'' use case.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across canvas and plot area; no frame box, only left and bottom axis lines in INK_SOFT.
      Chrome: bold title "scatter-categorical · python · bokeh · anyplot.ai" top-left (~52% of width), axis titles "Marketing Spend ($K)" and "Customer Engagement Score (0–100)" in dark ink, tick labels 20–100 / 20–80 in soft dark gray, subtle light grid. Legend top-right on an elevated panel with bold title "Product" and three entries. All text readable.
      Data: 150 points in three clusters — Sparkling Water (#009E73) low spend / low engagement bottom-left, Cold Brew Coffee (#C475FD) mid spend / high engagement top-center, Energy Drink (#4467A3) high spend / mid engagement right. Translucent fills with thin page-colored outlines; markers well sized for the density.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17; no frame box, left/bottom axis lines in light soft gray.
      Chrome: title and axis titles in light ink, tick labels light gray, grid subtle but visible, legend panel #242420 with light text. No dark-on-dark text.
      Data: identical colors and positions to the light render; only the chrome and the marker outline (page color) flip. Energy Drink blue is the dimmest series on the dark page but still clearly visible.
      Legibility verdict: PASS
