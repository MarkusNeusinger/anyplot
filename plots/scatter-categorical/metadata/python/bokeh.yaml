review:
  strengths:
  - 'One p.scatter renderer per product built with df.groupby(sort=False) and its
    own ColumnDataSource, with legend_label: idiomatic bokeh, and the legend comes
    from the data with the column constant as its title'
  - 'The Imprint palette is in canonical order (#009E73, #C475FD, #4467A3), identical
    in both renders. The chrome is threaded through INK, INK_SOFT and ELEVATED_BG,
    so every text element reads correctly in both themes'
  - Markers at size 24 with fill_alpha 0.8 and a 2 px page-colored outline keep coincident
    points separable (visible where Product A points touch near x≈22–26) without moving
    any mark off its value
  - Legend glyph box set to 60 px so bokeh's 0.4 factor draws the legend markers at
    the same 24 px as the data marks, which keeps legend and plot visually matched
  - Figure-level tooltips format product, spend and engagement to one decimal for
    inspection in the HTML output
  weaknesses:
  - 'DQ-02 (both): the categories are labelled "Product A", "Product B", "Product
    C", which reads as a generic placeholder scenario → concrete product names that
    fit the marketing-spend story (for example product lines of a consumer brand).
    Likely cause: the keys of the clusters dict.'
  - 'Suggestion: a descriptive title prefix (for example "Campaign Spend vs Engagement
    · ") would tell the reader what the clusters represent.'
  - 'Suggestion: marker shapes varied per product (circle, square, triangle via the
    scatter marker argument), which the Notes allow, would add a second, non-color
    distinction between the groups.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 on both the plot area and the border; no white seam.
      Chrome: bold dark title "scatter-categorical · python · bokeh · anyplot.ai" top-left (~47 % of the width); dark axis titles "Marketing Spend ($K)" and "Customer Engagement Score (0–100)"; INK_SOFT tick labels 20–100 / 20–80; subtle grid at 15 % alpha; left and bottom axis lines only; legend top-right on an elevated card with a bold title "Product". All text is clearly readable.
      Data: 150 points in three well-separated clouds: Product A #009E73 bottom-left (spend ~15–35, engagement ~14–40), Product B #C475FD top-middle (spend ~36–67, engagement ~58–92), Product C #4467A3 right (spend ~63–98, engagement ~27–65). Markers are 24 px, translucent, with page-colored outlines. The first series is #009E73.
      Legibility verdict: PASS

