review:
  strengths:
  - One merged lets-plot legend for color, fill and shape, so every category reads
    by color and by marker shape
  - Filled, outlined markers with alpha 0.75 keep points of one treatment visible
    inside another's cloud in both themes
  - Theme tokens threaded through every chrome element; data colors identical in light
    and dark
  - Canonical ggsize(800, 450) with scale=4 gives the exact 3200x1800 canvas
  - Interactive HTML export keeps lets-plot's native hover tooltips
  weaknesses:
  - 'DE-02 (both): the panel is enclosed by a four-sided frame (top and right lines
    drawn) instead of the style guide''s L-shaped left and bottom spines → remove
    the top and right lines. Likely cause: axis_line=element_line(...) on theme_minimal
    draws a border on all sides; set the panel border blank or style only axis_line_x/axis_line_y
    at the bottom and left.'
  - 'DQ-02 (both): the four groups are labelled ''Treatment A''–''Treatment D'', which
    reads as generic → name real treatments (for example ''Control'', ''Nitrogen'',
    ''Phosphorus'', ''Mycorrhiza''). Likely cause: the name column of the groups table.'
  - 'DQ-03 (both): the temperature axis spans about 26–84 °C and growth keeps rising
    at 84 °C, which no plant survives → keep temperatures within roughly 10–40 °C
    (about −45 °C at the top). Likely cause: temp means 38–55 with sd up to 10 in
    the groups table.'
  - 'Suggestion: a slightly lighter grid (closer to the style guide''s 15% ink) would
    let the markers carry more of the contrast in the light render.'
