review:
  strengths:
  - 'Points-only XY via stroke=False with one colour per laptop class from the Imprint
    palette, first series #009E73, identical in both themes'
  - 'Theme tokens threaded through the pygal Style: warm off-white and near-black
    surfaces with readable chrome in both renders'
  - Opacity 0.7 keeps the overlapping Gaming and Workstation points visible without
    moving any mark off its values
  - Plausible laptop benchmark vs battery-life data with unequal group sizes and a
    partial overlap, behind column constants and a self-contained Data block
  weaknesses:
  - 'VQ-01 (both): y and x tick labels render at two sizes (major labels such as ''10''
    and ''15'' at 42 px beside minor ones at 52 px), so the tick row looks uneven
    → one size for all tick labels (major_label_font_size = label_font_size, e.g.
    both 44). Likely cause: Style label_font_size=52 vs major_label_font_size=42.'
  - 'VQ-05 (both): the bottom legend wraps its three entries into two columns across
    two rows, leaving Gaming at mid-width and Workstation alone on a second row →
    all three entries on one row. Likely cause: legend_at_bottom without legend_at_bottom_columns=3.'
  - 'Suggestion: a lighter guide density (y guides only, or fewer x guides) would
    quiet the dashed grid in the light render.'
