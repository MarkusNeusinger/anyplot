review:
  strengths:
  - Color and shape share field, title and domain, so Vega-Lite merges them into one
    legend whose glyphs match the circle/square/triangle marks in both themes
  - Page-colored marker outline plus opacity 0.75 keeps overlapping points distinguishable
    without moving any mark
  - Exact 3200x1800 canvas via the pad-only step, with balanced margins and the legend
    beside the plot
  - 'Theme tokens threaded through title, axes, grid and legend: readable in both
    renders with identical Imprint data colors'
  - Native Vega-Lite tooltips with readable titles in the HTML output
  weaknesses:
  - 'DE-02 (both): the plot area is boxed by a four-sided INK_SOFT frame although
    nothing in a categorical scatter requires it → remove the top and right spines
    (L-shaped frame) or the frame entirely. Likely cause: configure_view(stroke=INK_SOFT).'
  - 'DQ-03 (both): two Setosa points show a petal width at or below 0 cm (lowest about
    −0.06 cm), which no flower has → keep every petal width positive (lowest real
    Setosa width is 0.1 cm). Likely cause: np.random.normal(0.2, 0.1) for Setosa widths
    without clipping or a log-normal draw.'
  - 'Suggestion: the overshoot branch resizes the PNG silently; the library prompt
    asks for a loud failure (SystemExit) so a too-large chart is fixed in the chart
    definition instead.'
  - 'Suggestion: a slightly lower marker opacity (about 0.6) would let the densest
    Setosa core read more clearly.'
