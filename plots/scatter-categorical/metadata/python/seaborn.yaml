review:
  strengths:
  - 'Theme tokens threaded through sns.set_theme rc: chrome flips cleanly while the
    Imprint data colors stay identical in both renders'
  - Exact 3200x1800 canvas with style-guide font sizes (12/10/8 pt)
  - Alpha 0.7 plus a thin page-colored outline keeps overlapping Temperature and Humidity
    points distinguishable
  - Column constants with role comments make the data block replaceable
  weaknesses:
  - 'DQ-03, VQ-05, DQ-01 (both): the x axis ''Ambient Value'' puts pressure (~1005
    hPa) on the same scale as temperature (~25 °C) and humidity (~28 %), so about
    94 % of the x-range (≈45 to ≈995) is empty and Temperature and Humidity are squeezed
    into one ~40 px-wide strip where their within-group pattern cannot be read → choose
    two variables that share units across all groups (e.g. one x and one y quantity
    measured for every category) so every cluster spans a comparable part of the axis.
    Likely cause: pressure_x = np.random.normal(1005, 5, ...) in the data block.'
  - 'VQ-06, DQ-02 (both): axis titles ''Ambient Value'' and ''Sensor Output'' have
    no units and read as generic placeholders for physically different quantities
    → name a real measured variable with its unit on each axis (e.g. ''Ambient Temperature
    (°C)''). Likely cause: the AMBIENT and OUTPUT column names.'
  - 'Suggestion: varying marker shape by category (style=SENSOR), which the Notes
    allow, would add a second channel for distinction.'
