review:
  strengths:
  - 'First series correctly uses Imprint #009E73 green; palette order matches canonical
    Imprint categorical sequence across all three tiers'
  - Marker shape varies by category (circle/diamond/triangle) in addition to color
    — a genuine CVD-safe redundant encoding, not just a color-only signal
  - 'Clear three-tier visual story: Basic/Pro/Enterprise bands are cleanly separated
    and show a believable positive engagement-spend correlation that strengthens with
    tier'
  - Theme-adaptive chrome is fully correct in both renders — data colors identical,
    background/text/grid flip correctly with no dark-on-dark or light-on-light failures
  - Explicit font sizing throughout (title 22px, axis titles 16px, ticks/legend 14px),
    title fits without overflow, all axis labels carry appropriate units on Y
  weaknesses:
  - Visual refinement is minimal — gridlines are default full-strength on both axes
    and the plot area has no spine/border removal, giving it a 'library default' look
    rather than a polished chart (DE-02)
  - In the densest clusters (e.g., Enterprise ~175-200 spend band, mid-range Pro cluster)
    markers overlap noticeably; radius 6 with opacity 0.75 is workable but could drop
    slightly (radius ~5, opacity ~0.65) to reduce clutter without losing density signal
    (VQ-03)
  - Design is correct but generic beyond the shape-per-category touch — no distinctive
    typographic hierarchy or subtle background/grid treatment that would elevate it
    past a well-configured default (DE-01)
  - Library usage is correct but doesn't reach for a distinctive Highcharts feature
    beyond marker symbols (e.g., jitter, connector/regression overlay, or bubble-style
    sizing) that would set it apart from a generic scatter implementation (LM-02)
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "scatter-categorical · javascript · highcharts · anyplot.ai" in bold dark ink, clearly legible. X-axis "Engagement Score" and Y-axis "Monthly Spend ($)" both dark, readable. Tick labels dark gray, subtle light-gray gridlines visible but not dominant. Legend "Subscription Tier" with Basic/Pro/Enterprise entries centered below the plot, fully legible.
      Data: Three series — green circles (Basic, #009E73), purple/violet diamonds (Pro), slate-blue triangles (Enterprise). Clear diagonal positive-correlation bands per tier, tiers well separated with only minor overlap at cluster edges.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Title and axis titles rendered in light/white text, clearly legible against the dark background. Tick labels light gray, gridlines subtle dark-gray, visible but unobtrusive. Legend text is light-colored and fully readable — no dark-on-dark failures anywhere.
      Data: Same green/purple/slate-blue colors as the light render — confirmed identical, only chrome (background, text, grid) flipped.
      Legibility verdict: PASS
