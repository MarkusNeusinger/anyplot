review:
  strengths:
  - Correct Imprint palette in canonical order (Adelie=#009E73, Chinstrap=lavender,
    Gentoo=blue), identical between light/dark, with fully theme-adaptive chrome (background,
    text, grid, spines)
  - 'Clean, idiomatic d3 code: scaleOrdinal + scaleLinear + axisBottom/axisLeft +
    data-join pattern, deterministic seeded LCG for reproducible data, no fake interactivity'
  - Title, axis labels, and legend all comply with spec format; no clipping, overlap,
    or dark-on-dark/light-on-light failures in either render
  weaknesses:
  - Design excellence is fairly generic — no visual-hierarchy device (e.g. per-species
    mean markers, density hulls, or emphasis on an outlier) gives the reader a focal
    point beyond raw categorical coloring
  - Library mastery stays at basic scatter + ordinal color scale; no distinctive D3-specific
    technique (e.g. a d3-voronoi overlay for cleaner hover targets in the HTML output,
    or a custom interactive legend that toggles series) is used to showcase what D3
    uniquely offers over a higher-level charting library
  - In the dense central cluster (~190-200mm flipper, ~3600-4000g mass) Adelie and
    Chinstrap points overlap heavily; consider a slightly smaller marker radius or
    lower fill-opacity there to improve individual point discrimination
