review:
  strengths:
  - 'First categorical series is exactly #009E73 with the next two positions (#C475FD,
    #4467A3) following canonical Imprint order, identical across both renders'
  - Explicit font sizes set for title, legend, axis names, and tick labels; all text
    is clearly readable in both light and dark themes with no dark-on-dark or light-on-light
    failures
  - Data shows a realistic, neutral botanical scenario (three plant groups with positive
    leaf length/width correlation) with genuine cluster overlap between two groups
    and clear separation of the third — good feature coverage for a categorical scatter
  - Deterministic fixed-seed LCG generates identical point clouds across both theme
    renders, correctly following the browser-harness reproducibility pattern for JavaScript
    libraries
  - 'Clean idiomatic ECharts usage: single chart.setOption call, animation disabled,
    no explicit init size/devicePixelRatio, correct mount-node contract'
  weaknesses:
  - Scatter markers have no white/theme-adaptive border (itemStyle.borderColor + borderWidth)
    — the style guide calls for edge highlighting especially where points overlap,
    and the Marsh Iris / Alpine Iris clusters overlap heavily in the 5.5-6.5cm length
    range, making individual points hard to distinguish there
  - 'Design Excellence is at well-configured-default level: no custom typography (font
    family unchanged from ECharts default), no visual-hierarchy device (e.g. emphasis
    on the overlap zone, size/opacity variation, or a brief annotation) to guide the
    viewer toward the correlation story — add a subtle refinement pass (lighter axis
    line, slightly larger/emphasized markers for one group, or a short annotation
    calling out the correlation) to lift above generic defaults'
  - No library-distinctive ECharts feature used (e.g. visualMap-driven emphasis, tooltip
    formatter tuned for the static PNG story, or emphasis.focus for series highlighting)
    — usage is generic and would look the same in any charting library
  - Marker size (symbolSize 22) is on the larger side for 135 total points with three
    overlapping series; consider trimming slightly and/or lowering opacity further
    in the dense overlap band to reduce occlusion
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "scatter-categorical · javascript · echarts · anyplot.ai" centered at top in dark ink, clearly readable; legend below title with three swatches (Sepal Iris, Marsh Iris, Alpine Iris) in dark text; axis names "Leaf Length (cm)" / "Leaf Width (cm)" and numeric tick labels in dark/soft-dark ink, all legible; subtle light-gray gridlines on both axes.
      Data: Sepal Iris cluster in brand green (#009E73) at lower-left, Marsh Iris in lavender/purple in the middle band, Alpine Iris in blue at upper-right; markers are semi-transparent (opacity 0.8) circles, ~22px, showing a clear overall positive correlation between leaf length and width with a visible overlap zone between the purple and blue clusters around 5.5–6.5 cm length.
      Legibility verdict: PASS — no text is unreadable against the light background.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Title, legend text, axis names, and tick labels rendered in light ink (near-white/soft-light), clearly legible against the dark background; gridlines are faint light lines, subtle but visible; no dark-on-dark text anywhere.
      Data: Same three colors as the light render — green, lavender/purple, blue — confirmed identical positions and hues; only the chrome (background, text, grid) flipped to the dark theme as expected.
      Legibility verdict: PASS — all chrome elements are clearly readable against the dark background, no dark-on-dark failures observed.
