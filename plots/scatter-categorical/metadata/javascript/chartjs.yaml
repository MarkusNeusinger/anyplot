review:
  strengths:
  - 'First categorical series is the mandated brand green #009E73, and the remaining
    three segments follow the canonical Imprint palette order (lavender, blue, ochre)
    exactly.'
  - Data colors are pixel-identical between the light and dark renders — only chrome
    (background, title, ticks, grid) flips, exactly as required.
  - Four customer segments are cleanly separable with a realistic, monotonic spend-vs-visits
    relationship; the legend uses matching circular point styles for quick color-to-label
    lookup.
  - Deterministic in-memory data generation via a tiny fixed-seed LCG plus a Box-Muller
    gaussian, with no external dependencies and no filesystem access — matches the
    JS runtime contract.
  - 'animation:false, responsive:true, maintainAspectRatio:false all set correctly
    per the mount-node contract; a single canvas is appended to #container.'
  weaknesses:
  - No alpha transparency on the point fills despite the spec explicitly suggesting
    it ('Consider alpha transparency for overlapping points') — the Budget and Regular
    clusters have visibly overlapping markers that fully occlude each other; add backgroundColor
    alpha (e.g. ~0.8) to let occluded points show through.
  - Styling is close to Chart.js defaults beyond the white point border — no distinctive
    library feature is used (e.g. per-segment pointStyle shapes, scriptable point
    radius/opacity, a subtle trend/callout annotation) to lift Design Excellence and
    Library Mastery above a generic scatter.
  - Marker shapes are identical circles across all four categories; the spec notes
    shape variation is an option for additional distinction on top of color — using
    Chart.js's pointStyle per dataset would add a redundant (colorblind-friendly)
    encoding channel.
  - No visual hierarchy or storytelling device (e.g. a highlighted VIP cluster, a
    subtle trend guide, or annotated callout) — the chart reads as four same-weight
    clusters with no guided focal point.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Bold dark title "scatter-categorical · javascript · chartjs · anyplot.ai" centered at top, fully visible. Legend below the title with four circular swatches labeled Budget/Regular/Premium/VIP in dark ink. Axis titles "Monthly Spend ($)" and "Visit Frequency (visits/month)" in dark ink, tick labels in a slightly softer gray. Grid lines are light gray, subtle but visible. All chrome text is clearly readable against the light background.
      Data: Four color-coded clusters — Budget (brand green #009E73), Regular (lavender #C475FD), Premium (blue #4467A3), VIP (ochre #BD8233) — each point has a thin white border for edge definition. Points show a clear positive relationship between spend and visit frequency, progressing diagonally from bottom-left (Budget) to top-right (VIP). Some markers within the Budget and Regular clusters overlap and fully occlude one another (no alpha transparency applied).
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Title and legend labels rendered in light/white ink, clearly legible against the dark background. Axis titles and tick labels are light gray / off-white, easily readable. Grid lines are a subtle dark gray, visible without dominating the plot. No dark-on-dark text anywhere.
      Data: Same four category colors as the light render (green, lavender, blue, ochre) at identical hex values — only the chrome (background, text, grid) has flipped for the dark theme. Same overlap pattern as the light render in the Budget/Regular clusters.
      Legibility verdict: PASS
