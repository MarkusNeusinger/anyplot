review:
  strengths:
  - 'Both weaknesses from Attempt 1 are fixed: hexToRgba alpha-blending (0.8) now
    handles overplotting in the dense Budget/Regular clusters, and each segment gets
    a distinct pointStyle (circle/triangle/rect/rectRot) for a colorblind-safe redundant
    channel.'
  - 'First categorical series is the mandated brand green #009E73, and the remaining
    three segments follow the canonical Imprint palette order (lavender, blue, ochre)
    exactly.'
  - Data colors, alpha, and marker shapes are pixel-identical between light and dark
    renders — only chrome flips, as required.
  - 'Four customer segments are cleanly separable with a realistic, monotonic spend-vs-visits
    relationship; legend uses matching point-style swatches (usePointStyle: true).'
  - Deterministic in-memory data generation via a fixed-seed LCG + Box-Muller gaussian,
    no external dependencies, no filesystem access.
  - 'animation: false, responsive: true, maintainAspectRatio: false all correctly
    set; single canvas appended to #container.'
  weaknesses:
  - No explicit visual hierarchy or storytelling device beyond the four same-weight
    clusters — e.g. no annotation calling out the VIP segment's higher variance, no
    trend guide.
  - Styling still leans on Chart.js defaults for grid/legend chrome beyond the palette
    tokens; a bit more visual refinement would lift DE-02 further.
  - Library Mastery is solid but not exceptional — pointStyle variation is the only
    distinctive Chart.js touch; no scriptable options, custom tooltip formatting,
    or other library-specific features.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Bold dark title "scatter-categorical · javascript · chartjs · anyplot.ai" centered at top; top legend with four point-style swatches (circle/Budget, triangle/Regular, square/Premium, diamond/VIP); dark axis titles; softer-gray tick labels; subtle light-gray gridlines on both axes. All clearly readable.
      Data: Four color-and-shape-coded clusters (green circles, lavender triangles, blue squares, ochre diamonds) with semi-transparent fills (alpha 0.8) and white marker borders. First series is #009E73 brand green. Clear positive spend-vs-visits trend across segments.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Title, legend, axis titles and tick labels render in light/white ink and remain fully legible; gridlines are subtle light-on-dark. No dark-on-dark failures.
      Data: Colors, alpha, and marker shapes are pixel-identical to the light render — only chrome flipped. Brand green #009E73 unmistakable on both surfaces.
      Legibility verdict: PASS
