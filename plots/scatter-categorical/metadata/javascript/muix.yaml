review:
  strengths:
  - 'Correct Imprint canonical palette order (brand green Adelie, lavender Chinstrap,
    blue Gentoo) with identical data colors across both themes, and exact #FAF8F1
    / #1A1A17 backgrounds'
  - Title matches the required 'scatter-categorical · javascript · muix · anyplot.ai'
    format exactly, and both axis labels are descriptive with units (Flipper Length
    (mm), Body Mass (kg))
  - Deterministic seeded LCG (no Math.random()) generating realistic penguin flipper-length/body-mass
    distributions that closely mirror the real Palmer Penguins dataset's per-species
    means
  - Thoughtful manual y-axis-title placement (with an explanatory code comment) that
    sidesteps a real MUI X label-offset quirk instead of letting it collide with tick
    labels
  - Canvas is exactly 3200x1800 with generous margins, no clipped or overflowing text
    in either render
  weaknesses:
  - Scatter markers have no white/edge stroke — the style guide calls for white marker
    edges 'especially with overlapping points,' and the Adelie/Chinstrap clusters
    overlap heavily (flipper ~184-200mm, mass ~3.0-4.4kg) where markers visually merge
    without a separating edge; add a stroke (e.g. via series markerSize/slotProps
    or a white outline) to each point.
  - No alpha transparency was applied despite the specification's explicit suggestion
    to 'consider alpha transparency for overlapping points' — in the dense central
    cluster, fully opaque markers completely occlude points underneath, hiding real
    data density; lower marker opacity to roughly 0.8-0.85.
  - Distinctive MUI X ScatterChart capabilities are underused (LM-02) — only basic
    series/xAxis/yAxis/legend wiring is present; consider highlightScope/series-fade-on-hover
    or another scatter-specific feature to better showcase the library beyond a generic
    scatter plot.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, confirmed #FAF8F1 by pixel sample at (10,10) and mid-canvas — not pure white, not dark.
      Chrome: Title "scatter-categorical · javascript · muix · anyplot.ai" centered at top in dark ink, clearly legible. X-axis label "Flipper Length (mm)" and manually-placed rotated Y-axis label "Body Mass (kg)" both dark ink, fully readable. Tick labels on both axes in a slightly softer gray-ink tone, readable. Both-axis grid lines are thin and subtle, not competing with data. Legend on the right lists "Adelie" (green swatch), "Chinstrap" (lavender swatch), "Gentoo" (blue swatch) in dark ink, clearly readable box-free legend.
      Data: ~112 circular markers colored by species — green (Adelie) clustered around 180-200mm flipper / 2.5-4.6kg mass, lavender (Chinstrap) overlapping the Adelie cluster around 184-208mm / 2.8-4.3kg, and blue (Gentoo) forming a visually distinct cluster at 205-233mm flipper / 4.4-6.1kg mass. First series (Adelie) is #009E73 brand green, confirmed by pixel sampling. Markers have no visible white edge stroke, so overlapping points in the dense center-left cluster blend into each other with no separating outline.
      Legibility verdict: PASS — no text is unreadable; only the marker-edge/overlap-transparency point above is a design (not legibility) concern.

    Dark render (plot-dark.png):
      Background: Warm near-black, confirmed #1A1A17 by pixel sample at (10,10) — not pure black, not light.
      Chrome: Title, axis labels, and tick labels have all flipped to light ink/off-white tones against the dark surface — no dark-on-dark text anywhere. Grid lines remain thin and subtle in the light-on-dark direction. Legend text and swatches are equally legible as in the light render, positioned identically on the right.
      Data: Same ~112 markers in the same three colors (green/lavender/blue) at pixel-identical positions and hues as the light render — confirmed only chrome (background, text, grid) flipped, data colors are unchanged.
      Legibility verdict: PASS — no dark-on-dark or light-on-light failures observed in either theme.
