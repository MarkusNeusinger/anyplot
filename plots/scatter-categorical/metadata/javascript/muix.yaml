review:
  strengths:
  - 'One MUI X scatter series per species built from the records (new Set order),
    each with t.palette[i]: Adelie #009E73, Chinstrap #C475FD, Gentoo #4467A3, identical
    in both renders'
  - Overlap between Adelie and Chinstrap is handled with fillOpacity 0.82 plus a 1.5
    px page-coloured marker edge via the v9 .MuiScatterChart-marker class, so points
    of one species stay visible inside the other's cloud without moving any mark
  - Realistic penguin morphometrics (flipper 180-233 mm, mass 2.5-6.1 kg, unequal
    group sizes 40/34/38) with a seeded LCG for determinism
  - 'Correct v9 API: axis bands sized with height/width, tickLabelStyle/labelStyle,
    slotProps.legend.sx, skipAnimation; axis limits derived from the data span'
  - highlightScope series highlight with global fade gives a useful per-species focus
    on hover in the HTML output
  weaknesses:
  - 'Suggestion: varying marker shape per species (the Notes allow it) would add a
    redundant, print-safe encoding next to colour.'
  - 'Suggestion: the 170 px legend band leaves a wide empty strip on the right; a
    slightly narrower band would give the data area more width.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole 3200x1800 canvas.
      Chrome: bold dark title "scatter-categorical · javascript · muix · anyplot.ai" centred at the top (~32% width); y-axis "Body mass (kg)" with ticks 2.5-6.0, x-axis "Flipper length (mm)" with ticks 180-230, all in dark ink and readable; subtle grey grid on both axes; left and bottom axis lines only; vertical legend at middle-right (Adelie, Chinstrap, Gentoo) with circle glyphs matching the marks.
      Data: ~112 circular markers. Adelie brand green #009E73 and Chinstrap lavender #C475FD overlap in the lower-left (flipper 180-208 mm, 2.5-4.6 kg); Gentoo blue #4467A3 forms a separate cloud upper-right (202-233 mm, 4.4-6.1 kg). Translucent fill plus a page-coloured edge keep overlapping points distinguishable.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, axis labels and tick labels flip to light ink and are clearly readable; grid lines subtle light grey; legend text light; no dark-on-dark text anywhere.
      Data: marker positions and colours identical to the light render (#009E73, #C475FD, #4467A3); the blue Gentoo points remain visible against the dark page; marker edges switch to the dark page colour.
      Legibility verdict: PASS
