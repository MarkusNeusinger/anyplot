review:
  strengths:
  - Thoughtful marker styling (page-background-colored stroke + fillOpacity 0.82)
    keeps overlapping Adelie/Chinstrap points individually distinguishable in both
    themes instead of merging into solid blobs.
  - Manually positioned y-axis title (rotated <text> element, independent of MUI X's
    tick-fontsize-based offset heuristic) avoids collision with tick labels regardless
    of digit count — a real MUI X layout gotcha handled correctly.
  - Realistic, neutral penguin body-measurement dataset with three genuinely overlapping-but-separable
    clusters is a strong, on-spec choice for demonstrating a categorical scatter plot.
  - Deterministic seeded LCG (no Math.random()) for reproducibility, correct skipAnimation,
    and correct harness contract usage (default-exported component sized to window.ANYPLOT_SIZE).
  weaknesses:
  - 'Duplicate/stale file header: two stacked ''anyplot.ai'' comment blocks at the
    top of the file (lines 1-4 and 6-10) with conflicting metadata — one says ''Library:
    muix 7.29.1 | JavaScript 22.23.2'' / ''Quality: 85/100'', the other says ''Library:
    MUI X Charts | React | Node 22'' / ''Quality: pending''. Remove the leftover first
    block and keep a single canonical header matching the muix.md skeleton, with the
    ''//# anyplot-orientation'' directive (if kept) as the very first line.'
  - Design excellence is fairly generic beyond the marker/legend polish — no additional
    data-storytelling emphasis (e.g., annotating the body-mass gap between Gentoo
    and the other two species, or highlighting the densest overlap region) to guide
    the viewer's eye.
  - In the densest cluster (~190mm flipper length, Adelie/Chinstrap overlap around
    3.5-3.9kg), several points still visually merge despite the alpha/stroke treatment
    — a slightly smaller marker size or lower fillOpacity there would improve separability.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (~#FAF8F1), matches spec — not pure white, not dark.
      Chrome: Title "scatter-categorical · javascript · muix · anyplot.ai" is bold, centered, dark ink, clearly readable. X-axis title "Flipper Length (mm)" and rotated y-axis title "Body Mass (kg)" are both dark ink and legible. Tick labels on both axes are soft dark gray, small but readable. Gridlines are light gray, subtle but visible. Legend ("Adelie", "Chinstrap", "Gentoo") sits at middle-right with square swatches and dark text, no overlap with data or axes.
      Data: Three color groups — Adelie (teal/brand green #009E73), Chinstrap (light purple/magenta), Gentoo (steel blue-gray) — spread across three roughly separable, slightly overlapping clusters of circular markers with a thin edge stroke and slight fill transparency, which keeps overlapping points distinguishable. First series (Adelie) correctly uses the brand green.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black (~#1A1A17), matches spec — not pure black, not light.
      Chrome: Title, axis titles, and tick labels have all flipped to light/white ink and remain clearly legible against the dark background. Gridlines are a muted light gray, subtle but visible. Legend text and swatches are equally legible with light text on the dark surface. No dark-on-dark text anywhere.
      Data: Same three marker colors (brand green, purple, blue-gray) as the light render — confirmed identical data colors, only the chrome (background, text, grid) flipped as expected.
      Legibility verdict: PASS
