review:
  strengths:
  - 'Correct Imprint palette usage: canonical order with brand green (#009E73) as
    the first series, identical hues across light and dark renders — only chrome changed.'
  - 'Theme-adaptive chrome is fully threaded through: title, axis text, tick labels,
    grid, and legend all use the INK/INK_SOFT/PAGE_BG/ELEVATED_BG tokens, so both
    renders are cleanly readable with no dark-on-dark or light-on-light failures.'
  - White-stroke markers (shape=21, color="white", stroke=0.3) give clean point definition
    against the busy three-cluster scatter, per the style guide's overlapping-points
    recommendation.
  - Realistic, appropriately scaled real-world dataset (palmerpenguins bill/flipper
    measurements) with a clear three-species structure that suits a categorical-scatter
    spec.
  - 'KISS R script: no functions, only the imports actually used (ggplot2, dplyr,
    ragg, palmerpenguins), set.seed(42) for reproducibility, correct ggsave/agg_png
    output contract.'
  weaknesses:
  - The stat_ellipse() confidence-ellipse layer (linewidth=0.6, alpha=0.6, level=0.68)
    produces no visible mark in either render — checked multiple low-density regions
    at the periphery of each species cluster (e.g. around bill=25-38mm/flipper=172-188mm
    for Adelie, and the sparse top/right margins of the Gentoo cluster) on both plot-light.png
    and plot-dark.png, and there is no elliptical outline anywhere, only point markers.
    Either the layer isn't rendering as intended or its line is too faint/thin to
    read at this resolution — the code carries the complexity of a design feature
    that currently delivers zero visual value. Either make the ellipse actually visible
    (thicker linewidth, e.g. 1.0-1.2, and/or a fixed ink-toned stroke instead of the
    species color so it reads distinctly from the point fill) or remove the layer.
  - 'geom_point alpha=0.85 is too high for this density: each species has roughly
    130-150 overlapping points, and the Adelie cluster in particular renders as a
    dense, hard-to-separate blob. Lower alpha to ~0.6-0.65 (per the data-density heuristic
    in the style guide) to improve within-cluster point separation.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with the required #FAF8F1 surface — not pure white, not dark.
      Chrome: Title "scatter-categorical · r · ggplot2 · anyplot.ai" in dark ink top-left, comfortably within ~50% of plot width. Axis titles "Bill Length (mm)" / "Flipper Length (mm)" in dark ink, tick labels in a softer gray-ink, all clearly legible. Grid is a faint horizontal/vertical line grid, subtle and non-competing. Legend "Species" sits at the right with three swatches (Adelie/Chinstrap/Gentoo) on a slightly lighter elevated panel, text fully readable.
      Data: Three overlapping point clouds by species — Adelie in brand green (#009E73, bottom-left), Chinstrap in lavender (#C475FD, right-of-center), Gentoo in blue (#4467A3, top). Each marker has a thin white stroke. Points are semi-transparent (alpha 0.85) but still show heavy overlap within the dense Adelie and Gentoo cores. No visible trace of the stat_ellipse layer that the code adds (checked multiple low-density areas at cluster edges — no elliptical outline present in either theme).
      Legibility verdict: PASS (all title/axis/tick/legend text is clearly readable against the light background; no overlap or clipping observed).

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with the required #1A1A17 surface — not pure black, not light.
      Chrome: Same title, axis titles, and tick labels now rendered in light ink (#F0EFE8 primary / #B8B7B0 secondary) against the dark surface — fully legible, no dark-on-dark failures anywhere. Grid lines are faint light strokes, visible but subtle. Legend panel uses the darker elevated background (#242420) with light text, readable.
      Data: Identical hues to the light render — brand green, lavender, blue — confirming the Imprint palette data colors are held constant across themes; only chrome flipped. Same overlap pattern as light render, and again no visible ellipse outline in either theme.
      Legibility verdict: PASS (all chrome elements read cleanly on the dark surface; brand green remains vivid; no light-on-light or dark-on-dark issues).
