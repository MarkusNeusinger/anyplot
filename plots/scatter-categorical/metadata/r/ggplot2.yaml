review:
  strengths:
  - Uses the real palmerpenguins dataset — a well-known, neutral, scientifically realistic
    scatter-categorical example that naturally shows the three-cluster feature coverage
    the spec asks for
  - 'Correct Imprint palette in canonical order (#009E73 / #C475FD / #4467A3), identical
    across both themes'
  - All theme chrome (background, title, axis, tick, legend colors) correctly threads
    ANYPLOT_THEME with no dark-on-dark or light-on-light failures
  - Explicit font sizes throughout (axis.title, axis.text, plot.title, legend.text/title),
    and axis.ticks = element_blank() keeps tick labels while dropping tick marks per
    the style guide
  - Title format exactly matches the mandated {spec-id} · {language} · {library} ·
    anyplot.ai pattern; legend labels (Adelie, Chinstrap, Gentoo) correctly match
    the data
  weaknesses:
  - Grid lines (panel.grid.major) use full INK color in both themes, making them read
    as bold/high-contrast rather than the 'very subtle' 15-25%-opacity grid the style
    guide calls for — since ggplot2 doesn't expose grid alpha, blend INK toward the
    background (e.g. mix with PAGE_BG) or use INK_SOFT instead of full INK to lower
    the contrast
  - No white edge stroke on geom_point() markers (shape = 21, color = 'white', fill
    = ...) despite meaningful overlap in the dense Adelie cluster — the style guide
    recommends this for scatter marker definition, especially with overlapping points
  - Design is essentially theme_minimal() plus a palette swap — no distinctive ggplot2
    feature (e.g. stat_ellipse() per group, geom_density_2d() contours, or coord_fixed())
    that would showcase the library's strengths or add data storytelling beyond raw
    color-by-category
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "scatter-categorical · r · ggplot2 · anyplot.ai" in dark ink top-left; "Bill Length (mm)" / "Flipper Length (mm)" axis titles in dark ink; tick labels in softer gray. All clearly readable. Grid lines present on both axes but rendered in near-full dark ink rather than a faint tint — bolder than the "very subtle" style-guide target, though not a legibility failure.
      Data: Three clusters colored by species — Adelie in brand green (#009E73), Chinstrap in lavender (#C475FD), Gentoo in blue (#4467A3) — clearly distinguishable, first series correctly uses the brand green.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Title, axis titles, and tick labels flip to light/off-white tones and remain fully readable. No dark-on-dark failures. Legend card uses the elevated dark surface (#242420-consistent) with light text. Grid lines flip to a light tint but are similarly bold/high-contrast as in the light render (same underlying issue, not a legibility failure).
      Data: Colors are pixel-identical to the light render (green/lavender/blue) — only chrome flipped, as required.
      Legibility verdict: PASS
