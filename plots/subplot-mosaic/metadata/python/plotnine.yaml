      Data: Sales Trend (top left, spanning the two bottom-left columns) has three lines with dots: Alpha #009E73, Beta #C475FD, Gamma #4467A3 with direct end labels; Quarterly Revenue bars in green, purple, blue, ochre; Margin Analysis green scatter of 80 points; Regional Heat 4x3 tiles on a green-to-blue ramp with white values; Performance six green bars Jan-Jun
