review:
  strengths:
  - 'Genuine mosaic: Sales Trend spans exactly the two columns of Margin Analysis
    and Regional Heat below it, with flush edges and consistent gutters, composed
    with plotnine''s | and / operators'
  - Direct end labels in each product's color replace a legend, with axis expansion
    reserved so they never collide with the lines
  - One theme broadcast to all five panels with the & operator; chrome flips cleanly
    between light and dark while data colors stay identical
  - 'Heatmap uses the allowed #009E73->#4467A3 sequential ramp with page-colored tile
    gutters and in-cell values'
  weaknesses:
  - 'SC-02, DE-03 (both): the primary Sales Trend panel is the same width and height
    as Quarterly Revenue and Performance, so the largest panel does not hold the primary
    data (C2) → make Sales Trend clearly the largest panel, e.g. a wider left column
    or B and E stacked in a narrower right column. Likely cause: `left_col | right_col`
    gives both columns equal widths.'
  - 'VQ-07 (both): the ordered quarters Q1-Q4 are filled with four unrelated categorical
    hues (#009E73, #C475FD, #4467A3, #BD8233), which hides their order → one color
    for all bars (the x axis already names the quarter) or ordered steps of imprint_seq.
    Likely cause: `aes(fill=GROUP)` with GROUP = quarters and `scale_fill_manual(values=IMPRINT_PALETTE)`.'
  - 'VQ-06 (both): the heatmap title ''Regional Heat'' and its blank y title never
    say what the 0-100 cell values measure → a title naming the measure and its unit,
    e.g. ''Regional index (0-100)''. Likely cause: PANEL label ''Regional Heat'' and
    Y_LABEL ''''.'
  - 'DQ-02 (both): products named Alpha, Beta and Gamma and Sales/Profit/Growth cells
    drawn from one uniform(0, 100) read as placeholders → concrete product names and
    per-metric values in plausible units. Likely cause: the `products` list and `rng.uniform(0,
    100, ...)` in the heat block.'
  - 'CQ-01 (code): `def axis_labels(sub, title)` (lines 125-126) is a helper function
    in a script that should run flat → inline `labs(x=..., y=..., title=...)` per
    panel. Likely cause: the helper for the per-panel labs.'
  - 'Suggestion: a ''.'' empty cell in the layout (plot_spacer) would demonstrate
    the gap feature the Notes allow.'
