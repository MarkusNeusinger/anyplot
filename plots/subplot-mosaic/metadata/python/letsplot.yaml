review:
  strengths:
  - The mosaic is defined as the string 'AAA;BBC;DEF' (with '.' gaps supported) and
    turned into ggbunch regions, the way the spec asks
  - Whole canvas, gutters and main title follow the theme in both renders
  - Heatmap replaces its color bar with in-cell values whose ink flips by tile luminance
  - Six plot types, each titled and with unit-bearing axis labels suited to its panel
  - The spanning revenue panel is flush with the left edges of the panels below it
  - Every y axis carries enough breaks to read values off
  weaknesses:
  - 'DQ-02 (both): the panels ''Effort vs Output'', ''Score Distribution'' (''Performance
    Score'') and ''Regional Score'' carry generic labels that do not belong to the
    retail story of the revenue and product panels → name concrete retail measures
    (e.g. ''Ad spend (k$) vs Orders'', ''Customer satisfaction score'', ''Store rating
    by region''). Likely cause: the labs() titles and axis titles of panels C, D and
    F.'
  - 'Suggestion: tighten the empty band between the main title and the top panel (TITLE_SHARE
    plus GAP) so the primary panel gains height.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole 3200x1800 canvas, gutters included.
      Chrome: centered bold dark title 'subplot-mosaic · python · letsplot · anyplot.ai'; bold left-aligned panel titles; dark axis titles and soft-ink ticks all readable; subtle grid. The plot boxes of A, B and D share one left edge (about x=232-240 px at full size).
      Data: A full-width green line over a translucent green area from zero (y ticks 0-1,500 every 500); B five green bars Laptops..Headsets with dark outlines; C green scatter with a lavender #C475FD lm line; D bimodal green histogram (x 20-100, y 0-30 every 5); E green line with markers Jan-Jun (y 2-5 every 1); F 4x3 heatmap mint -> green -> blue -> deep purple (imprint_seq light field stops) with values in cells. First series #009E73.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17 across the whole canvas.
      Chrome: title, panel titles, axis titles and ticks light and readable; no dark-on-dark text.
      Data: greens and the lavender trend identical to the light render; bar and histogram outlines flip to light ink; heatmap on the dark field stops (olive -> green -> pale lavender-blue) with contrasting cell values.
      Legibility verdict: PASS
