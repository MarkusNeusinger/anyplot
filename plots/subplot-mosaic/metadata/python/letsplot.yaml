review:
  strengths:
  - The mosaic is defined as the string 'AAA;BBC;DEF' (with '.' gaps supported) and
    turned into ggbunch regions, the way the spec asks
  - Whole canvas, gutters and main title follow the theme in both renders
  - Heatmap replaces its color bar with in-cell values whose ink flips by tile luminance
  - Six plot types, each titled and with unit-bearing axis labels suited to its panel
  - Concrete retail scenario with real product and region names
  weaknesses:
  - 'VQ-05 (both): the plot boxes do not share a left edge — the spanning revenue
    panel starts at about x=235 px, Sales by Product at about 197 px and Score Distribution
    at about 176 px — so the spanning panel is not flush with the panels it spans
    (spec C3) → one shared left edge (about -60 px drift to 0). Likely cause: each
    ggbunch region holds the whole plot, including y tick labels whose widths differ
    per panel.'
  - 'SC-03 (both): the revenue y-axis shows only 0 and 1,000, the Score Distribution
    y-axis only 0 and 20 and the Monthly Growth y-axis only 2 and 4, so values above
    1,000 $, counts between 0 and 20 or growth above 4 % cannot be read off → about
    4-6 round breaks per axis. Likely cause: default breaks on short panels; set scale_y_continuous
    breaks.'
  - 'VQ-07 (both): the heatmap ramp uses outdated SEQ_FIELDS stops — light (0.368
    #009E73, 0.582 #4467A3, 1 #002850), dark (0 #00573D, 0.467 #009E73) — instead
    of the style guide''s imprint_seq field stops → light (0 #66E2B2, 0.369 #009E73,
    0.803 #024582, 1 #351E45), dark (0 #404C02, 0.487 #009E73, 1 #CDD9FF). Likely
    cause: the SEQ_FIELDS constant.'
  - 'Suggestion: tighten the empty band between the main title and the top panel (TITLE_SHARE
    plus GAP) so the primary panel gains height.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole 3200x1800 canvas, gutters included.
      Chrome: centered bold dark title 'subplot-mosaic · python · letsplot · anyplot.ai'; bold left-aligned panel titles; dark axis titles and soft-ink ticks all readable; subtle grid. Left plot-box edges drift: revenue panel at about x=235 px, Sales by Product about 197 px, Score Distribution about 176 px.
      Data: A full-width green line over a translucent green area from zero (revenue, 100 days, y ticks 0 and 1,000 only); B five green bars Laptops..Headsets with dark outlines; C green scatter with a lavender #C475FD lm line; D bimodal green histogram (x ticks 20-100, y ticks 0 and 20); E green line with markers Jan-Jun (y ticks 2 and 4); F 4x3 heatmap mint -> green -> blue -> navy with values in cells. First series #009E73.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17 across the whole canvas.
      Chrome: title, panel titles, axis titles and ticks light and readable; no dark-on-dark text.
      Data: categorical greens and the lavender trend identical to the light render; bar and histogram outlines flip to light ink; heatmap on dark stops (deep green -> green -> pale blue/lavender) with contrasting cell values.
      Legibility verdict: PASS
