review:
  strengths:
  - Layout derived from the string pattern 'AAA;BBC;DEF' (with '.' gaps supported)
    into ggbunch regions, so the mosaic is defined the way the spec asks
  - Whole canvas, gutters and main title follow the theme in both renders
  - Heatmap uses the imprint_seq field stops per theme, with in-cell values whose
    ink flips by tile luminance
  - Six plot types, each titled and with unit-bearing axis labels suited to its panel
  - Concrete retail scenario with real product and region names
  weaknesses:
  - 'VQ-05 (both): the plot boxes do not share a left edge — the spanning revenue
    panel''s frame starts at about x=235 px, Sales by Product at about 197 px and
    Score Distribution at about 176 px — so the spanning panel is not flush with the
    panels it spans (spec C3) → align the plot-box edges across rows (about -60 px
    drift to 0). Likely cause: each ggbunch region holds the whole plot including
    its y-axis title and tick labels, whose widths differ per panel.'
  - 'SC-03 (both): the revenue y-axis carries only the ticks 0 and 1,000 and the growth
    y-axis only 2 and 4, so values between 1,000 and 1,470 $ or above 4 % cannot be
    read off → about 4-6 ticks per axis. Likely cause: default breaks on short panels;
    set scale_y_continuous breaks or n-breaks.'
  - 'CQ-01 (code): regions_from_layout() (lines 90-103) is a helper function beyond
    the mandated ramp_color → inline the layout parsing into the plot zone as a loop
    over the letters. Likely cause: helper kept from the earlier structure.'
  - 'Suggestion: tighten the empty band between the main title and the top panel (TITLE_SHARE
    plus GAP) so the primary panel gains height.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole 3200x1800 canvas, gutters included.
      Chrome: centered bold dark title 'subplot-mosaic · python · letsplot · anyplot.ai'; bold left-aligned panel titles; dark axis titles and soft-ink ticks all readable; subtle grid.
      Data: A full-width green line over a translucent green area from zero (revenue over 100 days); B five green bars (Laptops..Headsets) with dark outlines; C green scatter with lavender #C475FD lm line; D bimodal green histogram; E green line with markers Jan-Jun; F 4x3 heatmap on imprint_seq light stops (mint -> green -> blue -> navy) with values in cells, light ink on dark tiles and dark ink on light ones. First series #009E73.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17 across the whole canvas, gutters included.
      Chrome: title, panel titles, axis titles and ticks light and readable; no dark-on-dark text.
      Data: categorical greens and the lavender trend identical to the light render; bar and histogram outlines flip to light ink; heatmap uses the dark imprint_seq stops (deep green -> green -> pale blue/lavender) with contrasting cell values.
      Legibility verdict: PASS
