review:
  strengths:
  - Layout AAA/BBC/DEF via ggbunch regions with a full-width primary panel and varied
    panel sizes
  - Six different plot types, each with a title and labelled axes suited to its panel
  - Generous font sizes keep panel text readable at full size
  weaknesses:
  - 'VQ-01, VQ-07 (dark): the main title renders near-white #F0EFE8 on a pure-white
    outer canvas and cannot be read → title on the #1A1A17 page. Likely cause: the
    ggbunch-level theme sets no plot_background, so the bunch canvas stays white.'
  - 'VQ-07 (both): outer canvas and gutters are pure white #FFFFFF around the #FAF8F1
    / #1A1A17 panel boxes → whole canvas in the theme background. Likely cause: no
    plot_background on the ggbunch.'
  - 'VQ-07 (both): heatmap uses viridis → imprint_seq (#009E73 → #4467A3). Likely
    cause: scale_fill_viridis.'
  - 'VQ-05 (both): canvas 4800x2700, not a canonical size → 3200x1800 (−1600 × −900).
    Likely cause: ggsize(1600, 900) with scale=3 instead of ggsize(800, 450) with
    scale=4.'
  - 'VQ-04 (light): black heatmap cell values on the darkest viridis tiles (61, 63,
    64) have low contrast → label color that contrasts with every tile. Likely cause:
    geom_text color=INK on a dark-to-bright colormap.'
  - 'SC-04 (both): title ''subplot-mosaic · letsplot · anyplot.ai'' lacks the language
    segment → ''subplot-mosaic · python · letsplot · anyplot.ai''. Likely cause: ggtitle
    string.'
  - 'SC-02 (code): the layout is typed as six fraction tuples, with the ASCII pattern
    only in a comment, while the Notes ask for a layout defined by a string pattern
    → derive the regions from a pattern string such as "AAA;BBC;DEF". Likely cause:
    regions list written by hand.'
  - 'DQ-02 (both): labels Product A–E and Region A–C read as generic placeholders
    → concrete product and region names. Likely cause: the categories list and the
    heatmap column labels.'
  - 'CQ-01 (code): no column-0 # Data block and no column constants for the x/y roles
    → one data block binding df with column constants above it. Likely cause: six
    separate DataFrames with column names typed where used.'
  - 'Suggestion: a focal accent in the primary panel would strengthen the dashboard
    story.'
  image_description: |-
    Light render (plot-light.png):
      Background: outer canvas and gutters pure white #FFFFFF; each panel sits on its own #FAF8F1 box.
      Chrome: bold dark title 'subplot-mosaic · letsplot · anyplot.ai' at top; panel titles, axis titles and ticks dark and readable; rotated product labels.
      Data: A green line over a green area from zero (flat-looking trend); B green bars; C green scatter with lavender lm line; D green histogram; E green line with markers; F heatmap in viridis with black cell values, low contrast on the darkest purple tiles. Canvas 4800x2700.
      Legibility verdict: PASS (with low-contrast heatmap values on dark tiles)

    Dark render (plot-dark.png):
