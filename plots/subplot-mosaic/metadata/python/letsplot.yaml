review:
  strengths:
  - Layout derived from the string pattern 'AAA;BBC;DEF' (with '.' gaps supported)
    into ggbunch regions, so the mosaic is defined the way the spec asks
  - Whole canvas, gutters and main title follow the theme in both renders
  - Heatmap uses the imprint_seq field stops per theme, with in-cell values whose
    ink flips by tile luminance
  - Six plot types, each titled and with unit-bearing axis labels suited to its panel
  - Concrete retail scenario (product and region names) replaces placeholders
  weaknesses:
  - 'CQ-01 (code): the adaptability self-check fails three perturbations — renamed
    columns (KeyError at line 134), fewer_categories (KeyError ''Score'' at line 177)
    and fewer_rows (KeyError ''Day'' at line 170) — and the plot zone adds panel(),
    luminance() and regions_from_layout() helpers beyond the mandated ramp_color →
    plot code that derives every panel from df without assuming a panel keeps all
    its columns or rows, and inline the one-line panel filter. Likely cause: panel()
    drops all-NaN columns, so a panel that loses a column or its rows under perturbation
    raises KeyError on the column constants.'
  - 'Suggestion: tighten the empty band between the main title and the top panel (TITLE_SHARE
    plus GAP) so the primary panel gains height.'
  - 'Suggestion: a fixed y-axis label width would line up the left edges of the plot
    boxes across rows.'
  image_description: |-
