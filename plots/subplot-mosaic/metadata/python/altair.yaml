      Data: top row: wide green (#009E73) line of daily revenue spanning two cells, and a green progress ring with "78" in bold; middle-left: purple (#C475FD) rounded bars for five regions; bottom-left: blue (#4467A3) area of visitors by hour; right two-by-two block: 80 scatter points of efficiency vs output coloured on the imprint_seq green-to-blue ramp with page-coloured outlines. First series is #009E73.
      Legibility verdict: PASS

