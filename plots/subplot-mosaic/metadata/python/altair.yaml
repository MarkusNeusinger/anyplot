review:
  strengths:
  - Panel spans are computed from the ASCII layout strings AAB/CDD/EDD (span() reads
    repeats per row and column), so the mosaic definition drives the sizes the way
    the spec describes
  - 'Spanning panels sit on one cell/gap grid: A covers two columns, the primary scatter
    D covers two rows and two columns, and the gauge, bar and area panels fill the
    remaining cells'
  - 'Palette is Imprint throughout: green line and gauge, purple bars, blue area in
    canonical order, and the continuous Quality index on the imprint_seq green-to-blue
    ramp, identical in both themes'
  - Gauge built natively with layered mark_arc and an alt.expr theta2 computed from
    the datum
  - Theme chrome flips cleanly through configure_axis/configure_legend/configure_title;
    every data panel carries tooltips for the HTML view
  weaknesses:
  - 'VQ-01 (both): tick labels at 9 px and axis titles at 10 px are below the style
    guide''s scale-based 10 px / 12 px and read small beside the 11 px panel titles
    → tick labels 10 px (+1 px), axis titles 12 px (+2 px), shrinking CELL_W/CELL_H
    instead if the canvas runs short. Likely cause: axes() labelFontSize=9, titleFontSize=10.'
  - 'VQ-05 (both): vertical gaps are uneven: about 80 px between the top row''s x-axis
    title and the middle row''s panel titles, about 45 px between ''Region'' and ''Traffic
    by hour'', and D''s title and bottom edge sit about 15-40 px off C''s title and
    E''s bottom → one uniform gap and flush outer edges (C3). Likely cause: the fixed
    CHROME_H=58 estimate does not match each panel''s real axis-title height, so view_size()
    mis-sizes the views.'
  - 'CQ-01 (code): five helper functions (span, view_size, axes, base, titles) wrap
    one-off logic → inline the per-panel sizes and axis dicts as constants or a dict
    comprehension. Likely cause: generic layout helpers.'
  - 'CQ-04 (code): axes() accepts a panel argument it never uses, and the legend position
    is the hand-summed chain props[''width''] - 170 + CELL_W + GAP + 10 → drop the
    unused parameter and place the legend with orient=''bottom-right'' (or a named
    offset constant). Likely cause: lines 91-93 and 166-172.'
  - 'Suggestion: a short note on what ''Target reached'' measures (e.g. ''% of quarterly
    goal'') would make the gauge self-explanatory.'
  image_description: |-
