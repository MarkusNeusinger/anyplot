review:
  strengths:
  - plt.subplot_mosaic with the readable ASCII pattern AAB;AAB;CDE gives a 2x2 primary
    panel, a 2-row side panel and three small bottom panels, exactly the hierarchy
    the spec asks for
  - 'Theme tokens threaded through every element: all text readable on #FAF8F1 and
    #1A1A17, data colors identical in both renders'
  - Native ax.bar_label for the bar values and gridspec_kw height_ratios passed through
    subplot_mosaic
  - Data block with role-tagged column constants and one DataFrame; each panel reads
    its own columns
  - 'Key Metrics panel fixed: name and value on one row each, nothing collides with
    the frame'
  weaknesses:
  - 'VQ-01 (both): the tick labels of the Correlation and Distribution panels and
    the bar value labels of Product Performance are set at 7 pt, below the style guide''s
    8 pt reference, and read small next to the 9 pt axis titles → 8 pt (+1 pt). Likely
    cause: tick_params(labelsize=7) in panels C and D and bar_label(fontsize=7).'
  - 'VQ-05 (both): an empty band of about 12 % of the canvas height (about 210 px)
    sits between the suptitle and the top panel titles → about half of that. Likely
    cause: tight_layout(rect=(0, 0, 1, 0.95)) reserving space above the panels while
    the suptitle stays at its default y; layout="constrained" in subplot_mosaic places
    the suptitle and panels together.'
  - 'DQ-02 (both): the bar categories ''Product A''–''Product D'', the scatter axes
    ''Feature X'' / ''Feature Y'' and the histogram axis ''Value'' read as placeholders
    → real product names and named variables (for example ad spend vs. revenue, order
    value in $). Likely cause: placeholder labels in the Data block.'
  - 'Suggestion: the Key Metrics values take Imprint positions 1–3 although the color
    encodes nothing; a single ink color would keep the focus on the numbers.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 on the figure and every axes; 3200x1800 canvas.
      Chrome: suptitle "subplot-mosaic · python · matplotlib · anyplot.ai" in dark ink, centered. Panel titles "Sales Overview", "Product Performance", "Correlation", "Distribution", "Key Metrics" in dark ink; axis labels (Day, Cumulative Sales ($), Units Sold, Feature X/Y, Value, Frequency) dark; ticks in INK_SOFT gray; subtle grids; top/right spines removed. A wide empty band separates the suptitle from the top panel titles. Small-panel ticks (7 pt) read slightly small.
      Data: mosaic AAB;AAB;CDE. A (2x2): green #009E73 cumulative sales line with a light green area fill, 500 → 648 over 100 days. B (2 rows): four green horizontal bars Product A–D with value labels 85/120/95/110. C: purple #C475FD scatter of 80 points with a positive correlation. D: blue #4467A3 histogram of 200 values around 100. E: framed Key Metrics tile with Growth 12.5% (green), Conversion 3.2% (purple), Retention 87.4% (blue), names left, values right, no collisions.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17 on the figure and every axes.
      Chrome: suptitle, panel titles and axis labels in light ink #F0EFE8; ticks in #B8B7B0; grids subtle but visible; bar edges and Key Metrics frame light gray. No dark-on-dark text anywhere.
      Data: identical colors to the light render (#009E73 line and bars, #C475FD scatter, #4467A3 histogram, same three metric value colors); area fill reads as a dark green tint. Brand green clearly visible.
      Legibility verdict: PASS
