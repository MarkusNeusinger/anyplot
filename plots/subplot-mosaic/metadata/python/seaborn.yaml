review:
  strengths:
  - 'plt.subplot_mosaic(''AAB;CCD;EFG'') with height_ratios=[1.35, 1, 0.85] gives
    a clear size hierarchy: the wide revenue time series (A) is the largest panel,
    the bar chart (C) spans two columns, and the narrow and bottom panels hold supporting
    views'
  - 'Spanning panels are flush with the panels they span: constrained layout aligns
    the left axis edges of A, C and E and the right edges of A, C and F, with even
    gaps throughout'
  - Six different plot types (line, scatter, bar, histogram, box) each matched to
    its panel shape, every panel titled and axis-labelled with units
  - Panel title sizes step down with panel size (10/9/8 pt, bold, left-aligned), making
    the hierarchy readable in the typography as well as the geometry
  - Channel colors are the same Imprint positions in the bar chart (C) and the box
    plot (G), so the two channel panels read as one encoding
  - 'Idiomatic seaborn on a tidy long table: barplot(estimator=''sum'', errorbar=None)
    aggregates per channel directly from df, hue=CHANNEL with palette sliced from
    the data and legend=False'
  - Theme tokens threaded through sns.set_theme rc; both renders are theme-correct
    with identical data colors
  weaknesses:
  - 'VQ-01 (both): the bottom-row panels (E, F, G) set tick labels and axis titles
    at 7 pt, the smallest text on the canvas, and they blur at a ~400 px mobile width
    → about 8 pt (+1 pt) to match the style-guide tick size. Likely cause: tick_params(labelsize=7
    if small …) and label.set_size(7 if small …).'
  - 'VQ-05 (both): the y-axis titles ''Response time (ms)'' on G and ''Total revenue
    ($)'' on C are longer than their axes and run past the axis top and bottom → shorter
    labels that fit the axis height (for example ''ms'' with the panel title naming
    the measure, or ''Revenue ($)''). Likely cause: G inherits the RESPONSE column
    name and C''s set_ylabel prefixes ''Total''.'
  - 'Suggestion: the ConciseDateFormatter offset text ''2024-Apr'' under A, E and
    F suggests the data is April only; a plain ''2024'' offset (offset_formats) would
    read more naturally for a Jan–Apr span.'
  - 'Suggestion: the layout fills every cell; an empty ''.'' cell, which the Notes
    allow, would show off the mosaic''s gap support.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the figure and all axes, no pure white.
      Chrome: bold title "subplot-mosaic · python · seaborn · anyplot.ai" centered on top; seven bold left-aligned panel titles stepping down 10/9/8 pt; dark ink axis labels and INK_SOFT tick labels, all readable; subtle horizontal grid; top/right spines removed.
      Data: mosaic AAB;CCD;EFG. A (wide, tallest row): green #009E73 total daily revenue line rising from ~12k to ~18k, Jan–Apr 2024. B: green scatter of marketing spend vs conversions (~400 translucent points, positive trend). C (wide): four bars per channel — Online #009E73, Retail #C475FD, Partner #4467A3, Direct #BD8233. D: green histogram of response times, right-skewed. Bottom row: E daily conversions line, F revenue per conversion line (both green), G box plot of response time per channel in the same channel colors as C. Spanning panels align flush with the panels below.
      Legibility verdict: PASS (bottom-row 7 pt text is small but readable at full size)

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17 across figure and axes, no pure black.
      Chrome: title, panel titles and axis labels in light ink #F0EFE8, ticks in #B8B7B0, spines light grey; grid subtle; no dark-on-dark text anywhere; box whiskers and medians in light INK_SOFT and visible.
      Data: colors identical to the light render (green lines/scatter/histogram, Imprint channel colors in C and G); scatter edges switch to the page color only.
      Legibility verdict: PASS
