review:
  strengths:
  - 'plt.subplot_mosaic("AAB;CCD;EFG") with height_ratios builds a clear hierarchy:
    the spanning revenue overview (A) is the largest panel, the wide channel bar chart
    (C) second, and the three small metric panels sit in the shortest row'
  - Five different seaborn plot types (lineplot, scatterplot, barplot with estimator="sum",
    histplot, boxplot) each suit their panel's shape, and every panel carries a left-aligned
    bold title whose size steps down with the panel size (10/9/8 pt)
  - Spanning panels are flush with the panels below them and the constrained layout
    keeps spacing even; no tick label or axis title runs into a neighbor in either
    render
  - EngFormatter (12k, 400k) and ConciseDateFormatter with per-panel maxticks keep
    the dense dashboard readable
  - 'Theme tokens threaded through sns.set_theme rc: both renders have correct backgrounds
    and fully readable chrome'
  weaknesses:
  - 'VQ-07 (both): the bar and box fills are not the Imprint hexes — Online renders
    #148A6A instead of #009E73 and Retail #C186EC instead of #C475FD — and the histogram
    green differs between themes (#3FB492 light vs #067C5B dark) because it is translucent
    over the page → exact Imprint fills, identical in both themes. Likely cause: seaborn''s
    default saturation=0.75 in barplot/boxplot (pass saturation=1) and histplot''s
    default alpha=0.75 (pass alpha=1).'
  - 'VQ-06 (both): panel F''s y-axis title "Per conversion" names no quantity or unit
    → "Revenue per conversion ($)" or "Order value ($)". Likely cause: order_value
    = "Per conversion".'
  - 'VQ-01 (both): tick labels in the bottom-row panels E, F, G and the "2024-Apr"
    offset text are set to 6 pt (about 33 px on the 3200 px canvas, about 4 px at
    a 400 px mobile width) and blur when scaled down → about 7 pt (+1 pt). Likely
    cause: tick_params(labelsize=6 if small …) and offset_text set_size(6).'
  - 'Suggestion: an empty ''.'' cell in the mosaic would also exercise the gap feature
    the Notes allow.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 (sampled 250,248,241).
      Chrome: bold suptitle "subplot-mosaic · python · seaborn · anyplot.ai" centered at ~55% width; seven panels in a 3x3 mosaic — "Total daily revenue" (A, spans two columns, tallest row), "Marketing ROI" scatter (B), "Revenue by channel" bar chart (C, spans two columns), "Response times" histogram (D), and bottom row "Daily conversions", "Revenue per conversion" lines and "Response time by channel" boxplot. Dark ink titles and labels, soft-ink ticks, subtle y grid, top/right spines removed. All text readable; bottom-row ticks at 6 pt are small.
      Data: single-series panels in green; bars and boxes in Online/Retail/Partner/Direct = green/purple/blue/ochre, but desaturated (Online bar #148A6A rather than #009E73); histogram translucent green (#3FB492).
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17 (sampled 26,26,23).
      Chrome: same layout; titles and axis titles in light ink, ticks in light soft ink, grid subtle. No dark-on-dark text anywhere.
      Data: lines, scatter and bars identical to light (bars #148A6A both themes); histogram fill shifts to #067C5B because of its alpha over the dark page, so it is not identical to the light render.
      Legibility verdict: PASS
