review:
  strengths:
  - 'Clean AAB;CDB;EEE mosaic: revenue spans two columns, profitability spans two
    rows and orders spans the full width, with equal gutters between panels'
  - Every panel carries its own descriptive title and unit-bearing axis labels, and
    legends appear only where a panel has two series
  - Theme tokens are threaded through every figure, including the axis-free title
    banner; both renders are fully legible and data colors are identical
  - Tidy df with ColumnDataSource per series, a categorical x_range from the data,
    and NumeralTickFormatter thousands separators
  - Exact 3200x1800 canvas via the CDP viewport override
  weaknesses:
  - 'VQ-01 (both): tick labels at 15pt, axis titles at 18pt and panel titles at 24pt,
    against bokeh''s references of 34/42/50pt, render about 20 px tall on the 3200
    px canvas and read small next to the plot area → tick labels about 24pt (+9pt),
    axis titles about 28pt (+10pt), panel titles about 32pt (+8pt), with min_border
    values enlarged to match. Likely cause: major_label_text_font_size=''15pt'', axis_label_text_font_size=''18pt'',
    title.text_font_size=''24pt'' in make_panel.'
  - 'SC-02 (code): the Notes ask for a layout defined by a string pattern where repeated
    characters span cells, but the mosaic is hand-built from nested row()/column()
    calls and the pattern appears only in a comment (''AAB;CFB;DDD'', which does not
    even match the drawn layout) → define the layout as a string such as ''AAB;CDB;EEE''
    and derive each panel''s (row, col, rowspan, colspan) from it for bokeh''s gridplot/GridBox.
    Likely cause: the nested column(banner, row(column(...), p_profit), p_orders)
    layout.'
  - 'SC-02 (both): the full-width orders panel''s plot frame starts about 11 px left
    of the revenue and sales frames above it, so the spanning panel is not flush with
    the panels it spans (C3) → frames aligned on one left edge (0 px offset). Likely
    cause: min_border_left=30 lets bokeh size the left border from each panel''s own
    y tick-label width.'
  - 'CQ-01 (code): a make_panel() helper function wraps all panel construction, against
    the Imports → Data → Plot → Save structure → build the panels in straight-line
    code. Likely cause: the def make_panel(key, width, height, kind) block.'
  - 'Suggestion: the line p.y_range.start = 0 if categorical else p.y_range.start
    is a no-op in its else branch, and marker_size''s ''bar'': 0 entry is never used;
    both could go.'
  - 'Suggestion: a HoverTool per panel would make the HTML dashboard inspectable.'
