  - 'VQ-01 (both): tick labels at 18 px and axis titles at 22 px on a 1600x900 layout
    (about 9 / 11 px at the 800x450 reference) sit below the 10 / 12 px references
    → 10 / 12 px on an 800x450 layout (+1 px each). Likely cause: tickfont size=18,
    title_font size=22.'
  - 'DQ-02 (both): the Product Performance scatter is labelled ''Feature X'' / ''Feature
    Y'', placeholder names in an otherwise concrete sales dashboard → name the measured
    quantities with units. Likely cause: the update_xaxes / update_yaxes title_text
    for row 2, col 1.'
  - 'CQ-01 (code): no column-0 # Data / # Plot zones and no column constants for the
    x and y roles → one Data block that binds df between the markers and one constant
    per column role above it. Likely cause: data generated as loose arrays used directly
    in each add_trace call.'
  - 'CQ-04 (code): the comment ''# Okabe-Ito palette'' (line 23) labels the Imprint
    colors below it → ''# Imprint palette''. Likely cause: a stale comment.'
  - 'Suggestion: the seven near-identical add_trace blocks could be one loop over
    a panel table.'
