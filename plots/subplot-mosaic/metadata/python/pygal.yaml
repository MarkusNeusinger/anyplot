review:
  strengths:
  - Builds the mosaic geometry from the layout string itself ('AAB;AAC;DDF' → bounding
    box per letter), so spanning panels A and D are flush and gaps are a uniform 24
    px
  - 'Clear hierarchy: the primary revenue-vs-costs line chart fills the 2x2 cell,
    supporting bar, donut and scatter panels fill the single cells, and the unused
    cell stays a blank gap'
  - 'Theme tokens threaded through one pygal Style: chrome flips cleanly between #FAF8F1
    and #1A1A17 while the Imprint data colors stay identical'
  - HTML output reuses the same layout string as CSS grid-template-areas, keeping
    pygal's native SVG tooltips per panel
  weaknesses:
  - 'SC-02, VQ-06 (both): Sales by Category draws five bars with no category names
    (show_legend=False and no y labels), so the panel cannot say which bar is Electronics
    or Books, and its value axis has no title or unit → name each bar (x_labels of
    the categories on the category axis) and give the value axis a title with unit,
    e.g. ''Sales ($K)''. Likely cause: one series per category with show_legend=False
    and no x_labels/x_title on the HorizontalBar.'
  - 'VQ-01 (both): tick and legend labels at 28 px and bar value labels at 26 px sit
    below the pygal reference (44 px / 36 px) and read small beside the 44 px panel
    titles → about 36–40 px ticks/legend (+8 to +12 px) and 32 px values (+6 px).
    Likely cause: major_label_font_size=28, legend_font_size=28, value_font_size=26
    in Style.'
  - 'VQ-01 (dark): the near-black bar value labels (''450'', ''320'', …) sit on the
    darkened bar fills with low contrast → light ink on the dark render, or values
    outside the bar ends. Likely cause: print_values_position=''center'' with pygal''s
    default value colour.'
  - 'CQ-01 (code): three helper functions panel_size, panel_origin and sub → inline
    the box arithmetic into a dict of sizes/origins computed in the layout loop and
    filter df directly. Likely cause: helper-function structure for the grid geometry.'
  - 'Suggestion: the empty cell could use the conventional ''.'' placeholder in the
    layout string instead of an unused letter F.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the full 3200x1800 canvas
      Chrome: bold title 'subplot-mosaic · python · pygal · anyplot.ai' centred on top; panel titles, axis titles and ticks in dark ink, all readable; dashed grid subtle
      Data: Panel A (2x2) Revenue line in #009E73 and Costs in #C475FD with dots; Panel B horizontal bars in Imprint order with centred values (no category names); Panel C donut North/South/East/West with bottom legend; Panel D (2x1) scatter of marketing spend vs sales in #009E73; bottom-right cell is a blank gap
      Legibility verdict: PASS (ticks and legend somewhat small)

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17
      Chrome: title, panel titles, axis titles and ticks in light ink, all readable; no dark-on-dark chrome
      Data: same Imprint colors as light; bar fills appear darker over the dark page and their near-black value labels have low contrast
      Legibility verdict: PASS (bar value labels low-contrast)
