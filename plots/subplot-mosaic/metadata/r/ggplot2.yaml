review:
  strengths:
  - Patchwork design-string mosaic ("AAA\nBBC\nDEF") directly matches the spec's ASCII-art
    layout requirement, with genuine cell spanning and asymmetric panel sizes
  - Consistent single-hue Imprint green across all six panels reads as a coherent
    analytics dashboard rather than six unrelated charts, and data colors are pixel-identical
    between light and dark renders
  - 'Good plot-type variety across cells: area+line trend, labeled bar chart, size-encoded
    bubble scatter, and three small-multiple trend lines'
  - Peak annotation ("2.8%") on the conversion-rate panel and the bubble-size legend
    add a second data dimension and a clear focal point without any fake-interactivity
    tricks
  - Realistic, internally consistent web-analytics dataset (page views, device split,
    bounce/session/conversion trends) with plausible relative magnitudes
  - Explicit font sizing throughout (per-panel theme overrides) and clean KISS-ish
    structure with set.seed(42) for reproducibility
  weaknesses:
  - Bubble-legend text in the "Page engagement" panel is set at ~6pt, and the small-multiple
    panel titles at ~8.5pt — both are readable at native 3200x1800 but will be the
    first elements to blur out once the PNG is scaled down to a ~400px mobile thumbnail;
    consider nudging legend text up to ~7-7.5pt
  - '"Daily page views" panel (top row) has generous unused vertical headroom above
    the area fill relative to its cell height, and the bubble-chart legend sits with
    a visible gap from the data rather than tight against it — minor layout balance
    deduction, not a hard overflow'
  - peak_label() introduces a tiny helper function; strict KISS (no functions/classes)
    would inline the which.max lookup directly since it's used only once
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1), matches spec.
      Chrome: Title "subplot-mosaic · r · ggplot2 · anyplot.ai" bold black top-left, fully visible with no top-edge clipping. Six panel titles ("Daily page views", "Traffic by device", "Page engagement", "Bounce rate (%)", "Avg session (s)", "Conversion rate (%)") all dark ink, clearly legible. Axis tick labels dark gray, readable. Grid lines subtle horizontal-only major lines.
      Data: All series render in Imprint green (#009E73) with alpha-blended fills/points; bar labels ("12,500", "8,700", "2,100") in dark ink; bubble-size legend ("Pageviews": 2,000/5,000/9,000) fully inside the canvas, not clipped; "2.8%" peak annotation in bold dark text.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17), matches spec.
      Chrome: Same title and panel titles now in light/white text, clearly legible against the dark background — no dark-on-dark failures observed. Axis tick labels light gray, readable. Grid lines subtle.
      Data: Data colors identical to light render (#009E73 green, area fill alpha unchanged) — only chrome flipped as required. Bar value labels and the "2.8%" annotation now render in light ink, correctly readable against dark fill/background.
      Legibility verdict: PASS
