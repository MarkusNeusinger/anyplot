review:
  strengths:
  - 'Mosaic layout correctly implements varying panel sizes with a clear visual hierarchy:
    a large overview area chart on top, medium device/engagement panels in the middle,
    and three small trend panels at the bottom, matching the spec''s ''larger cells
    for primary data'' requirement.'
  - 'Grid usage follows the style guide''s per-chart-type guidance precisely: y-axis-only
    grid on the bar/line panels, both-axes grid on the scatter/bubble panel.'
  - Brand green (#009E73) is applied consistently across all six panels and both themes;
    theme chrome (background, text, grid) flips correctly light-to-dark with no dark-on-dark
    or light-on-light failures.
  - Six genuinely distinct plot types across the mosaic cells (area+line, bar, bubble
    scatter with size encoding, three point+line trend charts) cover the 'different
    plot type per cell' requirement well.
  - Coherent 'website analytics dashboard' narrative ties all six panels together
    with plausible, realistic values throughout.
  weaknesses:
  - Layout is built with a raw gridExtra layout_matrix (numeric matrix) instead of
    the patchwork package's plot_layout(design = "AAA\nBBC\nDEF") string syntax, which
    is the more idiomatic ggplot2-ecosystem analog to the ASCII-art mosaic pattern
    the spec describes.
  - The bottom-row small panels (Bounce rate, Avg session, Conversion rate) use axis.text
    at 6.5pt and geom_point(size = 1.4) for only 14 points each -- undersized relative
    to the 'sparse data needs prominent markers' guidance, and risky once the full
    3200x1800 canvas is scaled down to a ~400px mobile width since each cell already
    occupies roughly a ninth of the canvas.
  - The 'Page engagement' bubble chart maps pageviews to bubble size but has no size
    legend or direct labels, so a reader can compare bubbles relatively but can't
    read an actual pageview value off the chart.
  - 'Design polish is solid but standard: theme_minimal() defaults plus one accent
    color and light/dark chrome, with no extra visual-refinement touch (value labels
    on the bar chart, a highlighted peak in a trend panel, etc.) that would push it
    toward publication-ready.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 -- not pure white.
      Chrome: Bold dark title "subplot-mosaic · r · ggplot2 · anyplot.ai" at top, dark panel titles ("Daily page views", "Traffic by device", "Page engagement", "Bounce rate (%)", "Avg session (s)", "Conversion rate (%)"), soft dark-gray axis titles/tick labels, subtle light-gray horizontal gridlines. All text is clearly readable against the light background.
      Data: All six panels use the same brand green (#009E73) -- area+line chart (top), bar chart (device breakdown), bubble scatter sized by pageviews (page engagement), and three point+line trend panels (bounce rate, avg session, conversion rate). First/only series is correctly #009E73 throughout.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 -- not pure black.
      Chrome: Same title and panel titles now rendered in light/off-white text, tick labels in light gray, gridlines flipped to a faint light color against the dark background. No dark-on-dark or light-on-light issues found -- every title, axis label, and tick label is clearly visible.
      Data: Data colors are identical to the light render -- same brand green (#009E73) fills/lines/bars/bubbles in every panel, confirming only chrome (not data color) changed between themes.
      Legibility verdict: PASS
