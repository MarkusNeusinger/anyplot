review:
  strengths:
  - Mosaic layout matrix (1 wide top panel, 2 medium middle panels, 3 small bottom
    panels) directly mirrors the spec's own "AAA;BBC;DEF" example, giving a clear,
    deliberate visual hierarchy
  - 'Theme-adaptive chrome is correct and consistent: backgrounds, ink colors, and
    grid lines flip correctly between light and dark while all data colors stay identical'
  - Good diversity of plot types across the six cells (area+line, bar, bubble scatter,
    three line trends), satisfying the spec's "each cell can contain a different plot
    type" note
  - Realistic, neutral website-analytics dataset with plausible value ranges (page
    views, device split, session/bounce/conversion metrics)
  - 'Mandated title format is exactly correct: "subplot-mosaic · r · ggplot2 · anyplot.ai",
    rendered with no clipping at the canvas edge in either theme'
  weaknesses:
  - 'The attempt-2 fix (adding coord_cartesian(clip = "off") to panels B/C/F and widening
    scale_y_continuous(expand=...)) did NOT resolve anything: pixel-level inspection
    of the newly rendered plot-light.png/plot-dark.png shows the exact same three
    defects flagged in the previous review, byte-for-byte unchanged in appearance.
    Root-cause correction for the repair loop: coord_cartesian(clip = "off") only
    disables clipping to a panel''s own plot area within that single ggplot''s own
    gtable; once panels are combined with gridExtra::arrangeGrob(), each subplot is
    still confined to its allotted grid-layout cell, so any geom or label that overflows
    the panel is still cut at the cell boundary regardless of clip="off". Fix by keeping
    all drawn content strictly inside each panel''s own coordinate range (e.g. explicit
    ylim()/coord_cartesian(ylim=...) sized to include label/marker extents) instead
    of relying on off-panel overflow, or switch the composition mechanism to patchwork::plot_layout(design
    = "AAA\nBBC\nDEF") which composites full plot grobs (including legends and any
    intentional overflow) correctly and even matches the spec''s own ASCII-art layout-string
    syntax more directly than a numeric layout_matrix.'
  - 'Panel C ("Page engagement"): the "Pageviews" size legend (scale_size_area(name
    = "Pageviews", ...), legend.position = "right") never appears anywhere on the
    canvas in either theme — confirmed by scanning the full right edge of both renders.
    Without it, the size-encoded z-variable (the spec''s optional "z (numeric) - tertiary
    variable for color or size encoding") is completely undecodable to a viewer. This
    is a gridExtra::arrangeGrob() limitation: it does not preserve per-panel legends
    when arranging raw ggplot objects (unlike patchwork, which collects/keeps legends
    automatically).'
  - 'Panel B ("Traffic by device"): the geom_text(aes(label = scales::comma(visits)),
    vjust = -0.4, ...) value labels above the three bars are completely invisible
    in both renders — verified with a zoomed crop showing only blank space between
    the bar tops and the panel title, with no "12,500 / 8,700 / 2,100" text anywhere.'
  - 'Panel C: the two leftmost bubbles (~46-47% bounce, the "Product" and "Pricing"
    pages) are visibly clipped at the top edge of the panel in both themes, rendering
    as flat-topped semicircles instead of full circles — part of the encoded data
    is literally missing from the image.'
  - 'Panel F ("Conversion rate"): the enlarged peak point''s sprintf("%.1f%%", value)
    callout label never renders in either theme, so the intended "highlight the peak"
    storytelling device has no visible effect.'
  - 'CQ-04 docked to 0: across two consecutive fix attempts, the geom_text()/legend
    code for panels B, C, and F produces zero visible effect in the actual saved PNGs
    — functionally dead code that looks purposeful in the source but does nothing
    in the shipped artifact.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1, not pure white, not dark.
      Chrome: Bold dark title "subplot-mosaic · r · ggplot2 · anyplot.ai" fully visible with no edge clipping; dark ink axis titles/tick labels on all six panels, all clearly readable against the light background; subtle horizontal (and light vertical, in Panel C) gridlines.
      Data: All series use brand green #009E73 (area fill, line, bars, bubbles) — Panel A: area+line chart of daily page views; Panel B: bar chart of visits by device (Desktop/Mobile/Tablet); Panel C: bubble scatter of avg session vs. bounce rate, sized by pageviews; Panels D/E/F: small line-trend charts (bounce rate, avg session, conversion rate).
      Legibility verdict: PASS for all chrome text that is actually rendered. FAIL for three content defects verified by zoomed crops: (1) the two leftmost bubbles in Panel C are clipped at the top of the panel (flat-topped semicircles, not full circles); (2) the "Pageviews" size legend for Panel C is entirely absent from the canvas; (3) the geom_text value labels above the Panel B bars and the peak-percentage callout on Panel F never render at all.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17, not pure black, not light.
      Chrome: Title and all axis/tick text switch to light ink and remain clearly readable; no dark-on-dark failures observed.
      Data: Colors identical to the light render (brand green #009E73 throughout); only chrome (background, text, grid) inverted, as expected.
      Legibility verdict: PASS for chrome text. FAIL for the same three content defects as the light render — Panel C bubble clipping, the missing Panel C legend, and the missing Panel B/F text labels reproduce identically in dark mode, confirming the root cause is a compositing/clipping bug independent of theme.
