review:
  strengths:
  - 'Deliberate visual hierarchy: wide overview panel on top, two medium detail panels
    in the middle, three small trend panels at the bottom, closely mirroring the spec''s
    own "AAA;BBC;DEF" example layout'
  - 'Correct, consistent theme-adaptive chrome: backgrounds, ink colors, and grid
    all flip correctly between light and dark with identical data colors'
  - Good variety of plot types across cells (area+line, bar, bubble scatter, three
    line trends) satisfying the spec's "each cell can contain a different plot type"
    note
  - Realistic, neutral analytics-dashboard dataset with sensible value ranges
  - Correct title format and legend labeling
  weaknesses:
  - 'Panel C bubble clipping (both themes): the two leftmost bubbles in "Page engagement"
    (Home ~47% bounce, Blog ~46% bounce) are visibly cut off at the top of the panel,
    rendering as flat-topped semicircles instead of full circles. Root cause: scale_size_area(max_size
    = 8) produces large point radii for these bounce values, but the y-scale has no
    top expansion / coord_cartesian(clip = "off"), so ggplot2''s default panel clipping
    (clip = "on") chops the tops of the circles. Add scale_y_continuous(expand = expansion(mult
    = c(0.05, 0.15))) (top-biased expansion) to Panel C, or set coord_cartesian(clip
    = "off").'
  - 'Panel B bar-value labels never render: geom_text(aes(label = scales::comma(visits)),
    vjust = -0.4, ...) is present in the code but no "12,500 / 8,700 / 2,100" text
    appears above the bars in either rendered PNG. Same clipping root cause as above.'
  - 'Panel F peak-percentage label never renders: the enlarged peak point on "Conversion
    rate (%)" shows, but its sprintf("%.1f%%", value) label above it does not appear
    in either render. Increase top expansion / clip="off" for panel F, and re-verify
    the actual saved PNG before submission.'
  - Mosaic assembled via gridExtra::arrangeGrob() + manual layout matrix rather than
    a ggplot2-native mosaic mechanism; consider patchwork::plot_layout(design = "AAA\nBBC\nDEF")
    if available in the CI image, since it matches the spec's ASCII-art syntax directly.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1, not pure white, not dark.
      Chrome: Bold dark title "subplot-mosaic · r · ggplot2 · anyplot.ai" (~45% of width); dark ink axis titles/tick labels on all six panels; all clearly readable against the light background.
      Data: All series use brand green #009E73 (area fill, line, bars, bubbles). Panel A: area+line chart of daily page views. Panel B: bar chart of visits by device. Panel C: bubble scatter (avg session vs. bounce rate, size = pageviews) with a "Pageviews" size legend. Panels D/E/F: small line-trend charts (bounce rate, avg session, conversion rate).
      Legibility verdict: PASS for chrome text. FAIL for two content defects: (1) the two leftmost bubbles in Panel C are clipped at the top of the panel (flat-topped semicircles, not full circles); (2) the intended geom_text value labels above the Panel B bars and the peak-percentage label on Panel F never render at all.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17, not pure black, not light.
      Chrome: Title and all axis/tick text switch to light ink and remain clearly readable; no dark-on-dark failures observed.
      Data: Colors identical to the light render (brand green #009E73 throughout); only chrome (background, text, grid) inverted, as expected.
      Legibility verdict: PASS for chrome text. FAIL for the same two content defects as the light render — Panel C bubble clipping and missing Panel B / Panel F text labels reproduce identically in dark mode, confirming the root cause is a clipping/expansion bug independent of theme.
