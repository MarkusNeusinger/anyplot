review:
  strengths:
  - Faithful, creative CSS-grid-template-areas implementation of the mosaic-layout
    concept, including a genuine "." gap cell exactly as the spec calls for (grid-template-areas
    "metric0 metric0 . metric1 metric1 metric2")
  - Six independent Highcharts instances with four distinct chart types (spline, column,
    area, bar) demonstrate real per-cell type flexibility, matching the spec's 'each
    cell can contain a different plot type' requirement
  - Thoughtful semantic color use on the KPI panels — brand green for above-target
    metrics, amber for the below-target Conversion Rate — creates a real signal instead
    of arbitrary decoration
  - Theme-adaptive tokens (t.ink, t.inkSoft, t.grid, t.palette) are threaded consistently
    through every one of the six charts; both light and dark renders are fully legible
    and correctly themed
  - The percentage-height mount reflow workaround (double requestAnimationFrame +
    chart.setSize from getBoundingClientRect) is a real, non-obvious Highcharts/CSS-grid
    timing gotcha and is documented clearly in the code comments
  weaknesses:
  - The bottom KPI row leaves a visually heavy blank gap between the 'Conversion Rate'
    and 'Avg. Basket Size' cards (the mosaic's '.' placeholder column) — it currently
    reads as an empty hole rather than deliberate grid structure; consider a faint
    background tint/border on that cell, or narrowing the gap column, so it registers
    as intentional.
  - Spline markers (radius 4) on the sparse 12-point weekly revenue trend are on the
    small side for the sparse-data sizing heuristic (<50 points should get prominent
    markers) — bump marker.radius to ~5-6 for a bit more presence.
  - 'Panel chrome (axis lines via lineColor: t.inkSoft, standard rounded elevated
    cards) is clean but still close to a well-configured default look — pushing further
    on visual refinement (e.g. removing axis lines entirely on the small KPI/detail
    panels, adding a touch more differentiation between card tiers) would raise the
    aesthetic sophistication above ''strong but standard dashboard''.'
  - Data storytelling relies solely on the amber-vs-green status color; consider reinforcing
    the focal insight with a small explicit delta value or directional indicator (e.g.
    '-0.7pp vs target') on the KPI panels so the story reads even without relying
    on hue alone.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (~#FAF8F1), matching the required light-theme surface — not pure white.
      Chrome: Header "subplot-mosaic · javascript · highcharts · anyplot.ai" in bold dark ink, fully visible top-left. Each of the six card panels (elevated slightly lighter background, rounded corners) has a dark bold sub-title ("Weekly Revenue by Region", "Units Sold by Category", "Foot Traffic by Hour", "Conversion Rate", "Avg. Basket Size", "Return Rate"). Axis tick labels and legend text render in a soft dark gray, clearly readable against the light card backgrounds. Grid lines in the top chart are thin and subtle.
      Data: Weekly revenue trend shows three lines — North in brand green (#009E73), South in lavender, West in blue — matching Imprint palette order 1/2/3. Units-sold bars use five Imprint colors in canonical order (green, lavender, blue, ochre, matte red). Foot-traffic area chart is green with a soft fill. KPI bars use green (on-target) or amber (below-target) for "Actual" and a neutral gray for "Target", with $/% data labels overlaid in dark ink.
      Legibility verdict: PASS — all titles, axis labels, tick labels, legend entries, and data labels are clearly readable against the light background; no light-on-light text.

    Dark render (plot-dark.png):
      Background: Warm near-black (~#1A1A17), matching the required dark-theme surface — not pure black.
      Chrome: Same header and six card panels, now with light off-white text (title, sub-titles, axis/tick labels, legend) rendering clearly against the dark card backgrounds. Grid lines remain thin and subtle, visible but non-competing.
      Data: All data colors are pixel-identical to the light render — North green, South lavender, West blue, the five category bars in the same canonical Imprint order, the foot-traffic area in green, and the same green/amber status coding on the KPI panels. Only the chrome (background, card fill, text, grid) flipped to the dark palette.
      Legibility verdict: PASS — no dark-on-dark failures; every title, tick label, legend entry, and KPI data label is clearly legible against the dark surface.
