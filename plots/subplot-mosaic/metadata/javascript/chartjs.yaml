review:
  strengths:
  - 'Fixed VQ-07: panels A, B, and C (all single-series) now consistently use the
    canonical Imprint slot #009E73, directly addressing attempt-1 feedback.'
  - Scatter markers in the Wind vs. Humidity panel enlarged from pointRadius 4 to
    6.5, clearly more visible for the sparse 35-point dataset.
  - Legend/tick fonts in the three smallest panels (D/E/F) bumped to 12px, improving
    mobile-thumbnail legibility.
  - Faithful mosaic-to-CSS-grid mapping with a caption narrating the design intent;
    strong visual hierarchy from full-width dominant panel down to three small metric
    panels.
  - Six distinct core Chart.js chart types (line+gradient fill, bar, scatter, doughnut,
    polarArea, horizontal bar) demonstrate library breadth without any plugin workarounds.
  - Deterministic LCG-seeded data; clean minimal code; animation:false set correctly
    on all six charts; theme-adaptive chrome verified correct in both renders.
  - Traffic-light semantic exception on the Air Quality panel remains correctly documented
    and applied.
  weaknesses:
  - The spec's optional empty/placeholder-cell mosaic capability (e.g. using "." as
    a gap character) still isn't demonstrated — minor, since it's explicitly optional
    in the spec.
  - D/E/F legend/tick fonts at 12px are improved but still near the lower end for
    mobile-thumbnail legibility; could go slightly larger if the panels have room.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1) across the page and each of the six elevated panel cards.
      Chrome: Title, italic caption, all six panel titles, axis titles (°C, mm, Wind (km/h), Humidity (%)), tick labels, and legends render in dark ink/soft-dark tones — all clearly readable.
      Data: Panel A (line+gradient fill), Panel B (bar), Panel C (scatter) all now use the canonical green #009E73 (palette[0]), fixing the attempt-1 palette-compliance weakness. Panels D/E use the canonical 4-color Imprint order for categorical labels. Panel F correctly applies the traffic-light semantic exception (green/amber/red for Good/Moderate/Poor).
