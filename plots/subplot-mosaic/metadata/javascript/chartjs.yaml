review:
  strengths:
  - Faithful mosaic-to-CSS-grid mapping with clear code comments documenting the "AAA;BBC;DEF"
    -> grid-template-areas translation, mirroring matplotlib's subplot_mosaic ASCII-art
    syntax described in the spec.
  - 'Strong visual hierarchy: dominant full-width temperature trend on top, a medium
    row, and three small metric panels at the bottom, reinforced by a caption that
    narrates the design intent.'
  - Six distinct core Chart.js chart types used across the six cells (line with gradient
    fill, bar, scatter, doughnut, polarArea, horizontal bar), demonstrating library
    breadth without any plugin workarounds.
  - Correct traffic-light semantic-exception coloring on the Air Quality panel (brand
    green / amber / matte red for Good / Moderate / Poor).
  - 'Deterministic LCG-seeded data generation; clean minimal code with no fake interactivity,
    all six charts correctly set animation: false.'
  - Theme-adaptive chrome correctly threaded through all six charts — both renders
    pass the legibility check with no dark-on-dark or light-on-light failures.
  weaknesses:
  - 'Panels B (Monthly Rainfall) and C (Wind vs. Humidity) are single-series charts
    that use palette[2] (blue) and palette[1] (lavender) instead of the canonical
    first slot #009E73 green, with no documented semantic reason for the choice or
    consistent 1->N assignment across panels (A=0, C=1, B=2, skipping around) - either
    default single-series panels to palette[0] or state the semantic mapping explicitly.'
  - 'Legend and tick font sizes in the three smallest panels (D/E/F: 14px titles,
    10-11px ticks/legend) are close to the readability floor at the 400px mobile thumbnail
    scale - bump legend labels and tick labels in those cells to ~12px CSS.'
  - Scatter markers in panel C (35 points, a sparse dataset) use pointRadius 4 CSS,
    which reads a bit small for the data-density heuristic favoring prominent markers
    below 50 points - increase to radius 6-7 CSS.
  - The spec's optional empty/placeholder-cell mosaic capability (e.g. "." gaps) isn't
    demonstrated since the "AAA;BBC;DEF" pattern fills every cell - minor, since it's
    an optional capability rather than a required feature.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (~#FAF8F1) across the page and each of the six elevated panel cards (slightly lighter, rounded corners).
      Chrome: Title "subplot-mosaic · javascript · chartjs · anyplot.ai" and the italic mosaic-pattern caption are dark ink and fully readable. All six panel titles (Daily Avg Temperature, Monthly Rainfall, Wind vs. Humidity, Conditions, Wind Direction, Air Quality Days), axis titles (°C, mm, Wind (km/h), Humidity (%)), tick labels, and legend text are dark/soft-dark and clearly legible against the light background. Grid lines are thin and subtle, not competing with the data.
      Data: Panel A's temperature line and gradient fill are brand green (#009E73). Panel B's rainfall bars are blue (palette[2]); panel C's scatter points are lavender (palette[1]); panels D/E use the first four Imprint slots (green/lavender/blue/ochre) for the four categorical labels; panel F correctly uses the traffic-light semantic exception (green/amber/red for Good/Moderate/Poor).
      Legibility verdict: PASS - no light-on-light or illegible text anywhere in the render.

    Dark render (plot-dark.png):
      Background: Warm near-black (~#1A1A17) across the page and each panel card (slightly lighter elevated cards), matching the light render's layout exactly.
      Chrome: Title, caption, panel titles, axis titles, tick labels, and legend text all flip to light ink/soft-light tones and remain clearly readable against the dark background. Grid lines remain thin and subtle. No element is dark-on-dark.
      Data: All data colors are pixel-identical to the light render (brand green line/fill, blue rainfall bars, lavender scatter points, the same four-color donut/polar segments, and the same green/amber/red Air Quality bars) - confirming only chrome flips between themes, not data colors.
      Legibility verdict: PASS - no dark-on-dark or illegible text anywhere in the render.
