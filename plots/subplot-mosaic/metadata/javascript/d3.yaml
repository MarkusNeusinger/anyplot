review:
  strengths:
  - Faithful ASCII-pattern mosaic parser with true spanning, matching the spec's own
    suggested dashboard layout (wide overview + two medium + three small panels).
  - Six genuinely distinct plot types across the six cells, showing real variety rather
    than repeating one chart type.
  - Correct canonical Imprint palette order in both multi-series bar panels, with
    the brand green consistently first.
  - 'Clean theme handling: identical data colors between light/dark, chrome tokens
    correctly threaded through every panel with no dark-on-dark or light-on-light
    failures.'
  - 'Distinctive D3 technique: dynamic title auto-sizing via measured getBBox() width
    instead of a heuristic.'
  weaknesses:
  - Panel-level axis-unit labels are set at 10px, small relative to canvas size -
    consider bumping to ~11-12px minimum for better legibility at reduced scale.
  - The "." empty-cell placeholder capability, called out explicitly in the spec,
    is implemented but not demonstrated in the example layout.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1.
      Chrome: Titles, axis labels, tick labels, and value annotations across all six panels are dark ink and clearly readable; panel cards use a subtly elevated off-white background with rounded corners; grid lines are faint and non-dominant.
      Data: First/primary series is brand green (#009E73) in panels A, C, E, F; multi-series bar panels B and D use the canonical Imprint order (green, purple, blue, ochre, red).
