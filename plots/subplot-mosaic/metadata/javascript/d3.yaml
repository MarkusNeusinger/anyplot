review:
  strengths:
  - Genuinely flexible, generic mosaic-layout engine (ASCII pattern to bounding boxes,
    with '.' placeholder support) rather than a hardcoded 6-panel layout
  - Six clearly distinct chart types across the cells, well beyond the spec's minimum
    requirement
  - Palette and theme-chrome are fully compliant and pixel-identical across light/dark
    for all data series
  - Deterministic seeded RNG and a coherent, realistic 'website analytics' scenario
    spanning all six panels
  - Elevated-card panel treatment and compact ~s number formatting give the dashboard
    a polished, professional feel
  weaknesses:
  - No panel has an explicit axis-title/unit label - add a short axis-title (e.g.,
    'Duration (min)', 'Pages') at least to panel C, where the unit of 'duration' is
    otherwise ambiguous
  - Title auto-shrinks to ~44% of canvas width due to the length-based scale factor;
    a larger fixed base size would fill the available space more confidently without
    risking overflow
  - Design stays within a competent, conventional dashboard-card aesthetic (DE-01/DE-02
    at default-ish levels) - consider removing axis domain lines (spines) on the panels
    and/or giving panel A extra visual weight to sharpen the visual hierarchy further
  - Four helper functions plus six per-panel blocks add structural overhead versus
    a flatter script - could share more margin/axis-styling logic to cut boilerplate
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 - not pure white, not dark.
      Chrome: Title, six panel titles, all axis tick labels, and value annotations (e.g. "38%", "2.6%") render in dark text and are clearly readable against both the page background and the lighter elevated-card panel backgrounds. Gridlines are subtle but visible.
      Data: First/primary series is brand green (#009E73) in every panel (area+line, scatter, sparkline, lollipop dots). The 5-category "Traffic by Channel" bar chart and 3-category "Bounce Rate by Device" bars use the canonical Imprint order (green, lavender, blue, ochre, red / green, lavender, blue).
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 - not pure black, not light.
      Chrome: Title, panel titles, axis ticks, and value annotations all flip to light-colored text and remain clearly readable against both the page background and the darker elevated-card panels. No dark-on-dark text found anywhere (checked bounce-rate %, referral-source labels, and all tick labels specifically).
      Data: Colors are pixel-identical to the light render - same brand green, lavender, blue, ochre, red across all panels; only chrome (background, text, grid) flipped.
      Legibility verdict: PASS
