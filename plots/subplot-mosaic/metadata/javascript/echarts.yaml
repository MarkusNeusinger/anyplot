review:
  strengths:
  - 'Mosaic layout (AAAA / BBCC / DEF pattern) exactly mirrors the spec''s own suggested
    example: a dominant wide overview panel, two medium detail panels, and three small
    metric tiles, achieved via six manually percent-positioned grid/xAxis/yAxis triples
    — the correct idiomatic workaround for ECharts, which has no native subplot_mosaic
    API.'
  - 'Clear size-based visual hierarchy: the eye lands on the full-year traffic trend
    first, then the two medium panels, then the three small quarterly tiles — matching
    the spec''s ''clear visual hierarchy with larger cells for primary data'' requirement.'
  - Each cell uses a different, well-matched chart type (line+area, bar, scatter,
    bar, line, bar) per the spec's 'each cell can contain a different plot type' note.
  - 'First categorical series (dominant panel A) is the brand green #009E73, with
    the remaining panels cycling through the rest of the Imprint palette in canonical
    order via `color: t.palette`.'
  - Minimal-chrome tile styling on the three small metric panels (axisLine/axisTick
    hidden, no split lines) keeps them clean and appropriately understated relative
    to the two larger detail panels.
  - Deterministic LCG(42) generates all synthetic data in-memory; realistic, neutral
    web-analytics context (traffic, device share, session duration, bounce/conversion
    rates) with plausible scales.
  - 'Both renders are theme-correct: identical data colors between light/dark, warm
    off-white / near-black backgrounds, fully legible chrome in both themes, no clipped
    elements at any canvas edge.'
  weaknesses:
  - Panel colors are assigned purely by series-index cycling through the full palette
    (green, purple, blue, orange, red, cyan) rather than a more deliberate scheme
    (e.g. muted/desaturated tones for the supporting tiles) — the six saturated hues
    compete for attention and slightly undercut the size-based focal hierarchy the
    layout otherwise establishes.
  - Beyond the manual grid layout itself, no distinctive ECharts-only features are
    used (no dataZoom, visualMap, graphic elements, markLine, or custom tooltip formatter)
    — the individual series are fairly basic line/bar/scatter configurations.
  - Small-tile axis label fontsize (11px) and x-axis label interval on panel A leave
    limited margin for further data density; fine at current scale but worth watching
    if this layout is reused with longer labels.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (~#FAF8F1), consistent across the full canvas including behind all six panels.
      Chrome: Main title "subplot-mosaic · javascript · echarts · anyplot.ai" in bold dark ink, centered top. Each of the six panels has its own left-aligned descriptive title (dark ink for the two large/medium panels, softer ink for the three small tiles). Axis tick labels and axis names are in soft dark gray, all clearly legible against the light background. Grid lines are faint warm-gray, visible but unobtrusive.
      Data: Panel A (Weekly Website Traffic) uses the brand green #009E73 line with a light green area fill. Panel B (Traffic Share by Device) uses purple bars. Panel C (Session Duration vs Pages Viewed) uses navy/blue scatter points. Panel D (Bounce Rate) uses ochre/orange bars. Panel E (Avg. Session) uses a red line with circle markers. Panel F (Conversion Rate) uses cyan bars. All six colors are distinct Imprint-palette hues, first series = brand green.
      Legibility verdict: PASS — no text overlaps, nothing clipped, all titles/labels/ticks readable.

    Dark render (plot-dark.png):
      Background: Warm near-black (~#1A1A17), consistent across the canvas.
      Chrome: Same title and per-panel titles now rendered in light ink/soft-white, clearly legible against the dark background. Axis labels and tick text are light gray, no dark-on-dark text anywhere. Grid lines are faint light-gray, still subtle but visible.
      Data: Colors are identical to the light render — brand green line/area (panel A), purple bars (B), navy scatter (C), ochre bars (D), red line (E), cyan bars (F) — confirming only chrome flipped between themes, not data colors.
      Legibility verdict: PASS — all text reads clearly against the dark background, no dark-on-dark or contrast failures observed.
