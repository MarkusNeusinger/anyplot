review:
  strengths:
  - The ASCII mosaic string drives the layout directly through CSS grid-template-areas,
    and the same string is parsed to size each MUI X chart, so editing the string
    re-lays out the dashboard
  - 'Clear hierarchy: the full-width 30-day pageview trend dominates, two medium detail
    panels and three small KPI gauges support it'
  - Four MUI X chart families (LineChart, BarChart, ScatterChart, Gauge) in one figure,
    the gauges styled through gaugeClasses with theme tokens
  - Plot-area left edges of panels A and B align through a shared 76 px y-axis band;
    spanning panel A ends flush with panel C
  - 'Coherent, plausible data: daily sessions per device × ~2.7 pageviews per session
    match the pageview trend'
  - 'Both themes render cleanly: ink/inkSoft/grid tokens on every axis, gauge reference
    arcs on the grid token, identical data colors'
  weaknesses:
  - 'Suggestion: a focal point of the implementation''s own choosing (for example
    emphasising the month-end pageview peak in panel A) would give the dashboard a
    story beyond the Notes'' hierarchy.'
  - 'Suggestion: using one ''.'' gap in the mosaic string (the Notes allow it) would
    show off the parser''s empty-cell support in the render.'
