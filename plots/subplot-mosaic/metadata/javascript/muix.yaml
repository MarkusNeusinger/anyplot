review:
  strengths:
  - Faithful, elegant CSS Grid recreation of matplotlib's subplot_mosaic ASCII pattern
    — the MOSAIC array + mosaicRect()/cellSize() helpers correctly derive row/col
    spans, mirroring the spec's dominant-panel example exactly (wide overview top,
    two medium detail panels, three small KPI panels).
  - 'Clear visual hierarchy: the 30-day pageview trend dominates (44% height), two
    medium detail panels (device sessions, channel scatter) sit in the middle, and
    three small gauge KPIs anchor the bottom — a genuine dashboard storytelling structure.'
  - 'Correct Imprint palette discipline: first series is brand green (#009E73) in
    every panel, the four-channel scatter uses canonical palette order (green/lavender/blue/ochre),
    and data colors are byte-identical between light and dark renders — only chrome
    flips.'
  - Deterministic, self-contained data generation via a small seeded LCG (no Math.random,
    no network) — fully reproducible.
  - 'Smart focal-point emphasis on the Sessions by Device panel: the leading device
    (Mobile) stays brand green while the others mute to a soft ink tone, calling out
    the takeaway without extra annotation infrastructure.'
  - Title format, axis labels (with units — %, s, Day of Month), and scatter legend
    all match the spec and style-guide contract precisely; title fontsize correctly
    scaled down via the length-based formula for the long mandated string.
  weaknesses:
  - Scatter markers (markerSize=5) in the Bounce Rate vs. Session Duration panel are
    modest for ~140 combined points across 4 channels — slightly larger markers (or
    a touch more alpha contrast) would improve legibility at mobile widths.
  - The de-emphasized Sessions by Device bars reuse the chrome token t.inkSoft (secondary
    text color) rather than a dedicated data-muted anchor — visually fine and the
    ANYPLOT_TOKENS contract has no separate 'muted' data token to reach for, but it's
    worth noting the role overlap.
  - The scatter panel's horizontal grid line only renders at the 200 tick (0 and 400
    coincide with the frame) — a second faint gridline (e.g. at 100/300) would make
    the grid styling read as more intentional rather than incidental.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1-range) across the full canvas, consistent behind all six mosaic panels.
      Chrome: Title "Website Analytics Dashboard · subplot-mosaic · javascript · muix · anyplot.ai" in bold dark ink, centered at top. Panel captions ("Pageviews — Last 30 Days", "Sessions by Device", "Bounce Rate vs. Session Duration, by Channel", "Conversion Rate", "Uptime SLA", "Support CSAT") in medium-weight dark-soft ink. Axis tick labels and axis titles ("Day of Month", "Bounce Rate (%)", "Duration (s)") all rendered in dark ink, clearly legible against the cream background.
      Data: Panel A is a smooth brand-green line (pageviews trending 42k→50k) with no markers. Panel B is a 3-bar chart (Desktop/Mobile/Tablet) where Mobile (the leading device) is brand green and the other two bars are a muted gray-ink tone — a deliberate focal-point choice. Panel C is a 4-color scatter (Organic=green, Paid=lavender, Direct=blue, Referral=ochre) with a legend at top-right of the panel. Panels D/E/F are brand-green gauge arcs over light-gray track arcs, each with a bold percentage value beneath.
      Legibility verdict: PASS — all text is clearly readable against the light background; no light-on-light text found anywhere.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17-range) across the full canvas, matching the dark surface token.
      Chrome: Title and panel captions flip to light ink/off-white tones, fully readable against the dark background. Axis tick labels and axis titles are rendered in a lighter secondary-ink tone — no dark-on-dark text anywhere; every label, tick, and legend entry is clearly visible.
      Data: All data colors are pixel-identical to the light render — the pageview line, the Mobile-highlighted bar, the 4-channel scatter colors, and the gauge arc green are unchanged. Only the gauge track arc and de-emphasized bars swap to a darker/lighter chrome-appropriate neutral, consistent with the theme.
      Legibility verdict: PASS — no dark-on-dark failures; title, captions, ticks, axis labels, and legend text are all legible against the near-black surface.
