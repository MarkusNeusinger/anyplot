review:
  strengths:
  - Mosaic layout is a genuine CSS-grid generalization of matplotlib's subplot_mosaic
    — the ASCII pattern ["AAAAAA","BBBCCC","DDEEFF"] drives spanning-cell geometry
    (mosaicRect/cellSize) rather than hard-coded pixel boxes, matching the spec's
    core ask.
  - 'Clear visual hierarchy: one wide overview panel (44% height) on top, two medium
    detail panels in the middle, three small KPI gauges at the bottom — mirrors the
    spec''s suggested dashboard example almost exactly.'
  - Four distinct chart types in one composition (LineChart, BarChart, ScatterChart,
    Gauge) showcase real breadth of the MUI X community surface, each with a consistent
    per-panel caption.
  - 'Imprint palette compliance is clean: first series is #009E73 in every panel (line,
    bar, gauges), scatter''s 4-channel series use the next palette positions in order,
    and data colors are pixel-identical between light and dark renders — only chrome
    flips.'
  - Custom Gauge styling via sx overrides (valueArc fill, translucent referenceArc,
    cornerRadius, custom value-text formatter) goes beyond a configured default.
  - Deterministic LCG-seeded data generation; all axis labels carry units (Duration
    (s), Bounce Rate (%)); title matches the exact mandated format with a sensible
    descriptive prefix.
  - No edge clipping or overflow in either render (verified pixel-by-pixel at all
    four canvas borders).
  weaknesses:
  - 'Scatter panel (C) grid is a fairly bold horizontal+vertical double grid (grid={{
    horizontal: true, vertical: true }}) rather than a subtle single-axis grid — lighten
    or drop the vertical gridlines for a more refined look (DE-02).'
  - No single insight is visually emphasized — the layout provides structural hierarchy
    (big/medium/small) but nothing calls out a specific takeaway (e.g. annotating
    the mobile-share lead in the device bar chart, or the pageview upswing in the
    last week). Raises DE-03 from 'default' toward 'good' without needing new annotation
    infrastructure.
  - Scatter markers overlap moderately in the 35-55% bounce-rate band where all four
    ~35-point channel series cluster — reducing markerSize slightly (e.g. 6 → 5) or
    adding a touch of alpha would keep the four colors distinguishable there (VQ-03).
  - Helper-function count (mosaicRect, cellSize, kpiPanel, withAlpha, nextRandom)
    is well justified by the mosaic-geometry problem, but keep an eye on CQ-01 KISS
    drift if the layout logic grows further in a repair pass.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "Website Analytics Dashboard · subplot-mosaic · javascript · muix · anyplot.ai" centered at top in dark ink, clearly readable. Each of the six panel captions ("Pageviews — Last 30 Days", "Sessions by Device", "Bounce Rate vs. Session Duration, by Channel", "Conversion Rate", "Uptime SLA", "Support CSAT") render in medium-gray ink above their panel. Axis titles and tick labels are dark and legible; scatter panel legend (Organic/Paid/Direct/Referral) sits inline above the plot area with readable swatches.
      Data: Line chart (A) uses brand green #009E73 for the 30-day pageview trend. Bar chart (B) uses the same green for all three device bars. Scatter (C) uses green (Organic), a light purple (Paid), a blue (Direct), and an amber/brown (Referral) — consistent with Imprint palette positions. The three gauges (D/E/F) show green value arcs against light-gray reference arcs, with bold percentage values underneath.
      Legibility verdict: PASS — all text is clearly readable against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title and captions now render in light gray/white ink, clearly legible against the dark background. Axis labels, tick labels, and the scatter legend all flip to light text with no dark-on-dark occurrences anywhere. Gauge reference arcs flip to a darker gray track appropriate for the dark surface.
      Data: All data colors are pixel-identical to the light render — green (#009E73), purple, blue, and amber — confirming only chrome adapted to theme, not data encoding.
      Legibility verdict: PASS — no dark-on-dark text found; all titles, captions, axis labels, tick labels, and gauge values are clearly readable.
