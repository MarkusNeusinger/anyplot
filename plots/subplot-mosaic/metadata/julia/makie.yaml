review:
  strengths:
  - 'Excellent asymmetric mosaic hierarchy: wide hero row (0.42), medium detail row
    (0.34), small metric row (0.24) with consistent col/row gaps -- a clean native-Makie
    equivalent of a string mosaic pattern'
  - Shared theme-adaptive chrome via a single `chrome` NamedTuple splatted into all
    six Axis calls -- DRY and guarantees consistent light/dark styling across every
    panel
  - Genuine variety of plot types per cell (band+line, bar, scatter, bar, line, scatter)
    demonstrating real mosaic flexibility rather than six copies of the same chart
  - 'Palette handled correctly: brand green anchors the hero chart, canonical Imprint
    order used for both categorical bar charts, non-conflicting accent colors distinguish
    the other single-series panels'
  - Coherent, realistic 'household energy dashboard' narrative -- all six panels derive
    from one consistent day-long dataset, giving the mosaic layout a believable real-world
    use case
  weaknesses:
  - Temperature-vs-Draw scatter (row 2, right panel) is fairly dense with overlapping
    points, especially in the 24-27C cluster -- a light alpha (e.g. 0.7) on the scatter
    would cut overplotting without hurting legibility
  - No mosaic cell is left as an intentional empty/placeholder gap (spec explicitly
    calls out '.' placeholder cells) -- optional, but including one would round out
    the mosaic-completeness demonstration
  - Data storytelling relies entirely on relative panel sizing; no annotation or emphasis
    calls out a specific insight (e.g. peak evening draw, HVAC dominance) to sharpen
    the narrative
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 -- not pure white, not dark.
      Chrome: Bold dark title "subplot-mosaic · julia · makie · anyplot.ai" centered at top; six panel titles (dark, bold) sit above each cell; axis labels and tick labels render in dark ink / soft dark-grey respectively, both clearly legible against the light background; subtle light-grey horizontal gridlines visible in the hero and Temperature-vs-Draw panels, absent (by design) in the smaller row-3 panels.
      Data: Hero panel shows a mint-green area band under a #009E73 line tracing 24h power draw; device bar chart uses the canonical Imprint order (green, lavender, blue, ochre, red) for 5 categories; Temperature-vs-Draw scatter uses cyan (#2ABCCD); period bar chart reuses green/lavender/blue/ochre; Cumulative Cost line uses rose (#954477); Humidity scatter uses lime (#99B314). First series (hero chart) is confirmed #009E73.
      Legibility verdict: PASS -- all titles, axis labels, and tick labels are clearly readable against the light background; no light-on-light text found.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 -- not pure black, not light.
      Chrome: Same title and panel-title layout, now rendered in light ink (#F0EFE8-ish) against the dark background; axis and tick labels flip to light/soft-light tones and remain fully legible; gridlines remain subtle but visible on the panels that have them; no dark-on-dark text found anywhere (row-3 panel titles, which are the smallest text at 13pt, are still clearly legible).
      Data: All data colors are pixel-identical to the light render -- mint-green area/line in the hero, same 5-color Imprint order in the device bars, cyan scatter, green/lavender/blue/ochre period bars, rose cumulative-cost line, lime humidity scatter. Only chrome (background, text, grid) changed between themes, confirming correct theme-adaptive implementation.
      Legibility verdict: PASS -- all text is clearly readable against the dark background; brand green remains vivid on the near-black surface.
