review:
  strengths:
  - Trend line (dashed regression fit) explicitly guides the viewer to the positive
    density-income correlation, adding a clear storytelling focal point
  - Third variable (green space) is doubly encoded via both bubble size and the imprint_seq
    color ramp, reinforcing the pattern and improving CVD-safe readability
  - 'Correct continuous colormap choice: imprint_seq (green -> blue) for single-polarity
    green-space data, identical across light/dark themes'
  - 'Realistic, neutral, well-scaled data: population density, income and green-space
    values are all plausible and appropriately correlated'
  - 'Clean idiomatic bokeh usage: ColumnDataSource, transform(), LinearColorMapper,
    HoverTool with formatted tooltips, toolbar_location=None with correct min_border_*
    reservations'
  - 'Theme-adaptive chrome fully correct in both renders: backgrounds, text, grid
    and legend box all use the right tokens with no dark-on-dark or light-on-light
    failures'
  weaknesses:
  - 'Legend reference bubbles (8 / 34 / 60 m2/capita swatches) render almost invisible/washed-out
    pale gray in BOTH themes instead of showing the green-to-blue imprint_seq gradient
    the main data bubbles use. Cause: BoxAnnotation defaults to render_level=''overlay'',
    which bokeh always paints above the ''glyph'' level regardless of add-order, so
    the ELEVATED_BG box (fill_alpha=0.9) is painted OVER the reference scatter glyphs
    added later in the loop, washing out their fill color. Fix: give the BoxAnnotation
    an explicit level=''underlay'' (or draw the box before configuring it as an overlay-safe
    layer) so the reference bubbles'' true color renders on top, matching the main
    plot bubbles.'
  - Title occupies only ~40% of the plot width -- on the low end of the ~50-70% guideline
    for a short custom-length mandated title; consider a slightly larger title fontsize
    to give it a bit more visual presence relative to the 3200px canvas.
  - Considerable unused whitespace in the upper-right quadrant beyond the legend box;
    a slightly larger legend or repositioned annotation could improve canvas utilization.
  - Legend swatch bug aside, verify the size-legend reference labels ('8 m2/capita',
    '34 m2/capita', '60 m2/capita') stay visually distinct in size once the color
    fix is applied -- currently size differences alone carry the encoding since color
    is broken.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1), consistent with the light theme surface -- not pure white.
      Chrome: Title "bubble-basic · python · bokeh · anyplot.ai" in bold dark ink, fully visible with no clipping. Italic axis labels ("Population Density (people/km²)", "Median Income (thousands USD)") and tick labels in dark/soft-dark ink are all clearly readable. A subtle horizontal grid (y-axis only) is visible but unobtrusive. A dashed gray trend line crosses the plot area.
      Data: Bubbles range from muted blue (high green-space, low density, left side) to teal-green (low green-space, high density, right side), following the imprint_seq (green->blue) continuous colormap, sized by sqrt(green-space) with ~0.65 alpha to handle overlap. A "Green Space" legend box sits top-left with three reference bubbles (8 / 34 / 60 m²/capita) -- their size differences are visible, but their fill colors are washed out to near-white/pale gray rather than showing the green-to-blue gradient (see weaknesses).
      Legibility verdict: PASS (all title/axis/tick text is readable; the legend swatch color issue is a color-mapping bug, not a text-legibility failure).

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17), consistent with the dark theme surface -- not pure black.
      Chrome: Title and axis labels render in light/off-white ink, tick labels in a softer light gray -- all clearly legible against the dark background, no dark-on-dark failures. Grid lines are faint light horizontal lines, still visible but subtle. The dashed trend line remains visible in muted gray.
      Data: Bubble colors are identical to the light render (same teal-green-to-blue imprint_seq ramp, same positions/sizes), confirming the data colormap doesn't shift between themes. The same legend swatch washed-out-color bug is present here too (swatches read as barely-visible dark blue-gray blobs against the dark legend box).
      Legibility verdict: PASS (no dark-on-dark text; brand green tones are visible in the data bubbles on the right side of the chart).
