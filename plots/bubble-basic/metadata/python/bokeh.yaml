review:
  strengths:
  - Trend line + outlier callout create a genuine data-storytelling focal point rather
    than a raw scatter dump
  - Correct imprint_seq colormap (green -> blue) applied to the continuous green-space
    variable, with area-proportional bubble sizing (sqrt scaling) matching the spec's
    guidance exactly
  - HoverTool with custom, well-formatted tooltips leverages a bokeh-distinctive interactive
    feature that adds value in the HTML detail view
  - Theme-adaptive chrome (background, title, axis labels, ticks, grid, legend box)
    correctly threaded through every element in both light and dark renders, with
    identical data colors across themes
  - Clean KISS code structure (imports -> data -> plot -> save), explicit font sizing
    throughout, correct 3200x1800 canvas and correct plot-{THEME}.png/.html output
    pattern via the canonical Selenium screenshot approach
  weaknesses:
  - Size legend is built manually with BoxAnnotation + Label rather than bokeh's native
    Legend/ColorBar API - functional and clean but not maximally idiomatic for a continuous-color
    + size-scale explanation
  - Bubble size and bubble color both encode the same variable (green_space) - a legitimate
    reinforcing choice for a single continuous dimension, but it leaves color available
    for nothing else; consider noting in a comment why the redundancy is intentional
  - Design excellence is strong but stops short of true publication-level distinctiveness
    - e.g. a native ColorBar alongside the size legend would clarify the continuous
    color mapping even more explicitly
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 - not pure white.
      Chrome: Bold dark title "bubble-basic · python · bokeh · anyplot.ai" at top, fully visible, not clipped. Italic dark-ink axis titles ("Population Density (people/km²)", "Median Income (thousands USD)") and soft-ink tick labels are all clearly readable. Subtle horizontal/vertical grid lines barely visible against the cream background. Legend box ("Green Space" with 10/55/100 m²/capita reference bubbles) sits in the empty upper-left region with a cream elevated fill and soft border, fully legible.
      Data: ~55 bubbles colored on the imprint_seq green-to-blue scale (green = low green-space, blue = high), alpha ~0.65 so overlapping bubbles remain distinguishable. A dashed gray trend line shows the positive density/income correlation, and an arrow + italic label call out the single point sitting well above the trend.
      Legibility verdict: PASS - all text is clearly readable against the light background, no light-on-light issues found.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 - not pure black.
      Chrome: Title and axis titles render in light ink (near-white), tick labels in a lighter soft-ink gray, all clearly legible against the dark background. Grid lines are faint but visible. Legend box uses the dark elevated fill (#242420-equivalent) with a soft border, text fully legible.
      Data: Identical green-to-blue imprint_seq bubble colors as the light render (confirmed color parity), trend line and outlier arrow/label render in the same soft-ink color, remaining legible on the dark surface.
      Legibility verdict: PASS - no dark-on-dark failures observed; every title/label/tick/annotation is clearly readable, and the brand green end of the colormap still reads well on the near-black surface.
