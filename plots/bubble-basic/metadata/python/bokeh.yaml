review:
  strengths:
  - 'Renders exactly the basic variant the spec asks for: x, y and size only, a single
    brand-green fill for every bubble, and no colour scale, colour bar, trend or reference
    line, highlight, band or annotation layer.'
  - 'Area-proportional sizing with a visible floor: bubble_size = sqrt(16^2 + (80^2
    - 16^2) * norm) makes bubble AREA grow linearly with green space, so the smallest
    marks stay readable and the largest do not swallow the plot.'
  - 'The size legend''s reference bubbles are drawn with exactly the data marks''
    glyph - same #009E73 fill, same 0.65 alpha, same 2 px page-coloured stroke - on
    an ELEVATED_BG card, labelled in m2/capita, and clearly visible on both the #FAF8F1
    and the #1A1A17 surface.'
  - Theme tokens (PAGE_BG / ELEVATED_BG / INK / INK_SOFT) are threaded through every
    chrome element - title, axis titles, tick labels, tick marks, grid, legend card
    and legend labels - so both renders pass the light/dark readability check with
    no dark-on-dark or light-on-light element.
  - 'Library-native interactivity (5e): bokeh''s vectorized hover_fill_alpha / hover_line_color
    / hover_line_width glyph props auto-build the hover glyph with no custom JS, and
    the HoverTool is scoped with renderers=[main_renderer] so the legend''s reference
    bubbles do not fire tooltips in the HTML artifact.'
  - 'Overplotting is handled the way the spec''s characteristic section asks for:
    alpha 0.65 plus a thin page-coloured outline keeps each bubble distinguishable
    inside the dense mid-density cluster, and every bubble sits at its true (x, y)
    values.'
  - Visual refinement beyond bokeh defaults - toolbar and plot outline removed, axis
    lines and minor ticks removed, grid at 12% alpha, explicit min_border_* reservations
    so nothing crowds the canvas edge.
  weaknesses:
  - 'DQ-01 (both): green space is generated as an almost deterministic inverse of
    the x variable (100 - density_norm * 90 plus only sigma=5 noise), so the bubble-size
    channel largely restates the x axis and the third dimension adds little independent
    information -> loosen the coupling in the data generation (larger noise term,
    or a partly independent driver) so size varies visibly at a given density. Likely
    cause: `green_space = 100 - density_norm * 90 + np.random.normal(0, 5, n_cities)`.'
  - 'Suggestion: the smallest reference bubble in the size legend is a ~16 px dot;
    a slightly higher size_min floor would keep it legible in the 400 px thumbnail
    as well as at full canvas.'
  - 'Suggestion: the title occupies roughly 42% of the canvas width and leaves the
    upper-right chrome band empty - a slightly larger title size would balance the
    top of the composition.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white matching #FAF8F1 across both the plot area and the outer border — not pure white, not dark.
      Chrome: Bold near-black title "bubble-basic · python · bokeh · anyplot.ai" top-left; italic dark axis titles "Population Density (people/km²)" (bottom) and "Median Income (thousands USD)" (left); softer gray tick labels (0/2000/…/12000 and 30/40/50/60); a very subtle ink grid at ~12% alpha on both axes; no spines or outline. A "Green Space" size legend sits on an elevated #FFFDF6 card with a faint gray border in the sparse bottom-right region, holding three reference bubbles labelled "10 m²/capita", "55 m²/capita" and "100 m²/capita". Every text element is clearly readable against the light background; nothing is light-on-light and nothing is clipped at a canvas edge.
      Data: 55 bubbles, all one colour — Imprint brand green #009E73 at fill_alpha 0.65 with a 2 px page-coloured (#FAF8F1) stroke. Bubble diameters run ~16–80 px, area-proportional to green space per capita. The cloud rises from bottom-left (low density, low income, large bubbles) to top-right (high density, high income, small bubbles). Overlapping bubbles in the mid-density cluster stay individually readable thanks to the translucency plus the page-coloured outline. First (and only) series is #009E73 as required.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black matching #1A1A17 across plot area and border — not pure black.
      Chrome: Identical layout with every chrome token flipped: title and axis titles in light ink #F0EFE8, tick labels and legend labels in #B8B7B0, grid drawn in light ink at ~12% alpha. The "Green Space" legend card is the elevated #242420 surface with a faint light border; its title and labels read clearly. No dark-on-dark failure anywhere — no near-black text sits on the near-black surface. No clipping at any canvas edge.
      Data: Bubble fill, alpha and sizes are identical to the light render — the same #009E73 at 0.65 alpha; only the 2 px stroke follows the page colour (#1A1A17 here), which is the intended theme-adaptive outline. Brand green remains clearly visible against the dark surface.
      Legibility verdict: PASS
