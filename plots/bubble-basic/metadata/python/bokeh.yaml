      Data: Bubbles use a sequential green-to-blue continuous colormap (Imprint imprint_seq, #009E73 → #4467A3) mapped to green-space value, with alpha 0.65 for overlap handling. Bubble sizes vary from small (~22px, low green space) to large (~80px, high green space), area-proportional. A dashed gray trend line shows the positive density-income correlation. An arrow + italic label calls out one high-income outlier. An inset legend box (top-left, off-white elevated background) shows three reference bubble sizes with "Green Space" title and labeled values (10/55/100 m²/capita).
      Legibility verdict: PASS — all text (title, axis labels, ticks, colorbar, legend, annotation) is clearly readable against the light background; no light-on-light text found.

    Dark render (plot-dark.png):
