review:
  strengths:
  - Theme-adaptive chrome tokens are threaded through every element (title, axes,
    ticks, grid, colorbar, legend, annotation) - both renders pass the light/dark
    readability check cleanly.
  - Correct, informative use of the imprint_seq continuous colormap for a genuinely
    independent fourth variable (transit score), rather than decoration.
  - Area-proportional bubble sizing (size proportional to sqrt(value)) with a clear,
    well-placed size legend - matches the spec's "scale by area" and "include a size
    legend" notes precisely.
  - Trend line + outlier callout add real data storytelling without cluttering the
    chart.
  - Idiomatic native Bokeh widgets (ColorBar, HoverTool with vectorized hover props,
    BoxAnnotation, Arrow) instead of manual/custom workarounds.
  weaknesses:
  - The italic outlier-annotation text (28pt) is the smallest text element in the
    chart; consider bumping it a notch (e.g. 30-32pt) so it holds up as well as the
    rest of the chrome at mobile widths.
  - The size-legend and colorbar together with the trend line and outlier callout
    add moderate visual density - nothing overlaps, but a future pass could simplify
    if the catalog wants an even cleaner default bubble-chart look.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1, not pure white.
      Chrome: Bold dark title "bubble-basic · python · bokeh · anyplot.ai" top-left; dark axis labels ("Population Density (people/km²)", "Median Income (thousands USD)"); softer-gray tick labels; ColorBar titled "Transit Score (0-10)" on the right; "Green Space" size legend (three reference bubbles + labels) in the bottom-right; dashed trend line; arrow + italic annotation calling out the outlier. All readable against the light background.
      Data: 55 bubbles positioned by density (x) and income (y), sized by green space (area-proportional), colored on the green->blue imprint_seq ramp by transit score. First/only continuous series uses imprint_seq (brand green -> blue), matching the palette rules for single-polarity continuous data.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17, not pure black.
      Chrome: Same title, axis labels, tick labels, colorbar text, legend text, and outlier annotation, all flipped to light ink tones (INK / INK_SOFT). No dark-on-dark issues - text remains fully legible.
      Data: Bubble colors and sizes are identical to the light render (same transit-score -> color mapping and same green-space -> size mapping); only chrome adapted to the theme.
      Legibility verdict: PASS
