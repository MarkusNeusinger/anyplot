review:
  strengths:
  - Area-proportional bubble sizing (size = sqrt of the normalized value) matches
    the spec's 'scale by area, not radius' note exactly
  - fill_alpha=0.65 handles overlapping bubbles as recommended by the spec
  - Clear hand-built inset size legend with min/mid/max reference bubbles and labels,
    explaining the bubble scaling
  - Correct 3200x1800 canvas, no toolbar-induced shrink, no edge clipping on either
    render
  - Theme-adaptive chrome (background, ink, grid, colorbar) is correct and consistent
    between light and dark, with identical data colors
  - 'Bonus data-storytelling elements: a dashed regression trend line and an arrow+label
    callout on the furthest outlier'
  - 'Idiomatic, distinctive bokeh usage: ColumnDataSource + transform(), vectorized
    hover_fill_alpha/hover_line_color for a zero-JS hover glyph, and a native ColorBar'
  - Realistic, neutral, plausible data (city population density vs. median income,
    green space per capita) with sensible scale
  - Title format and axis labels match spec exactly, with units included
  weaknesses:
  - Large blank region reserved at the top of the plot for the inset legend (y_end
    padding uses y_pad*5.5) — data tops out around y=65 while the axis extends to
    ~75-78, leaving disproportionate empty space above the cluster; shrink the top
    padding multiplier or reflow the legend to reclaim that space.
  - Color and bubble size both encode the same variable (green_space) — a reinforcing-redundancy
    choice noted in a code comment, but it forgoes using color for an independent
    fourth attribute or a categorical grouping, which would add more information density.
  - In the densest bubble cluster (~2200-2900 population density, 30-45 income) several
    similarly colored/sized bubbles overlap enough that individual points become hard
    to distinguish even with alpha blending — consider a touch more edge contrast
    or slightly smaller minimum size in dense regions.
