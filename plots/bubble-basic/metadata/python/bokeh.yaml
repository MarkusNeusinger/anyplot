review:
  strengths:
  - 'Dual encoding of the third variable: bubble size AND fill color both map to green
    space, reinforcing precision and CVD-accessibility beyond a size-only encoding'
  - Custom size legend built from BoxAnnotation + reference-glyph scatter + Label
    mirrors the exact color/size mapping used in the main plot, not a generic swatch
  - Dashed regression trend line (np.polyfit) adds clear data storytelling for the
    density/income correlation without cluttering the chart
  - HoverTool tooltips are cleanly formatted with units (@density_display{,} people/km²,
    $@income_display{0.0}k, @green_display m²/capita)
  - 'Idiomatic bokeh: ColumnDataSource, transform(), LinearColorMapper, theme-adaptive
    chrome fully threaded through title/axes/ticks/grid'
  - 'imprint_seq colormap correctly interpolated from #009E73 to #4467A3 for the continuous
    green-space variable'
  - Canvas is exactly 3200x1800 with no clipped elements; both light and dark renders
    are fully legible
  weaknesses:
  - n_cities=40 is below the spec's recommended 50-500 data points for a bubble chart
    — a few more points would give the density/income correlation more visual weight
  - The 'size' data column (green_space, clipped to 5-60) sits below the spec's suggested
    10-100 range for bubble-size values — plausible in real-world units, but worth
    nudging up to match the spec's guidance
  - Only y-axis gridlines are shown; the style guide's default grid guidance for scatter-type
    plots is both axes — an acceptable AI-discretion call here but flagged for consistency
  image_description: |-
