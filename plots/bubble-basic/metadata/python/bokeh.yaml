review:
  strengths:
  - Area-proportional bubble sizing implemented correctly (size ∝ sqrt(value), not
    linear) matching the spec's requirement
  - Custom size legend with three reference bubbles anchored in a data-free region,
    avoiding overlap with the main cluster
  - Continuous 'Green Space' variable double-encoded via size AND the compliant imprint_seq
    (green→blue) colormap, reinforcing the third dimension
  - Theme-adaptive chrome is correct and consistent in both light and dark renders
    — background, text, grid, and legend box all flip correctly while data colors
    stay identical
  - Dashed regression trend line adds a clear visual narrative (density vs. income
    correlation) without faking interactivity
  - 'Idiomatic bokeh code: ColumnDataSource, transform() + LinearColorMapper for color
    mapping, HoverTool for detail-on-demand, correct Selenium PNG export pipeline'
  weaknesses:
  - Axis lines are still rendered (in muted INK_SOFT) rather than fully removed —
    a more minimal/publication-level look would drop them entirely and rely on the
    subtle grid alone
  - No explicit annotation calls out the standout outlier (~7300 density, ~62k income,
    well above the trend line) — an annotation would elevate the storytelling from
    'good' to 'excellent'
  - The assumed positive correlation between population density and median income
    is a plausible simplification for a synthetic demo but doesn't hold universally
    in the real world (many dense areas are low-income) — DQ-03 scored as 'plausible'
    rather than 'established fact'
  - Library-mastery usage (HoverTool, transform, BoxAnnotation) is solid but no single
    feature is uniquely bokeh — could lean further into bokeh-specific interactivity
    (e.g. custom hover styling, linked selections) for a stronger LM-02 score
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (~#FAF8F1), not pure white — matches spec.
      Chrome: Title "bubble-basic · python · bokeh · anyplot.ai" in bold dark ink, clearly legible. Italic axis titles "Population Density (people/km²)" and "Median Income (thousands USD)" both dark and readable. Muted gray-brown tick labels and axis lines. Subtle grid lines barely visible against the background. Legend box ("Green Space", elevated cream background) sits top-left with three reference bubbles (10/55/100 m²/capita) and readable labels.
      Data: ~55 bubbles from teal-green through purple-blue (imprint_seq gradient — low green-space = green #009E73, high green-space = blue #4467A3), area-proportional sizes, semi-transparent (alpha 0.65) with light-colored edge strokes so overlapping bubbles stay distinguishable. A dashed gray trend line runs from bottom-left to top-right showing the density/income correlation.
      Legibility verdict: PASS — all text (title, axis labels, ticks, legend) reads clearly against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black (~#1A1A17), not pure black — matches spec.
      Chrome: Same title now in near-white ink, fully legible. Axis titles and tick labels rendered in light gray/off-white, clearly visible. Grid lines subtle. Legend box uses a dark-elevated background (#242420) with light gray/white text — no dark-on-dark failures observed.
      Data: Identical bubble colors and positions to the light render (green→blue imprint_seq gradient unchanged), confirming only chrome flipped between themes as required. Trend line still visible in muted light gray.
      Legibility verdict: PASS — no dark-on-dark text; all chrome elements are theme-appropriate and legible.
