review:
  strengths:
  - Correct area-based bubble sizing (sizemode="area") with a sensible sizeref calculation
    tied to the max revenue value
  - Full theme-adaptive chrome (background, ink, grid, legend, colorbar) correctly
    implemented in both renders, with identical data colors between light and dark
  - Custom hovertemplate exposing all three dimensions (R&D %, PMF score, Revenue)
    with sensible formatting — strong use of Plotly's native interactivity
  - 'Correct Imprint palette usage: brand green #009E73 anchors the size-legend reference,
    and imprint_seq (green→blue) is used for the single-polarity Revenue colorscale'
  - Realistic, neutral business dataset (tech company R&D spend vs. product-market-fit
    vs. revenue) with deliberately anchored points (R&D powerhouses, underinvestors,
    an efficient-innovator outlier) that create a visible trend
  - 'Clean KISS code structure: explicit seed, only used imports, no fake functionality,
    correct plot-{THEME}.png/.html outputs'
  weaknesses:
  - The top-left size-only legend ($100M/$500M/$1500M) renders all three reference
    bubbles in flat brand green, while actual data bubbles at those revenue levels
    shift toward blue via the imprint_seq colorscale — a viewer could momentarily
    expect a large bubble to look green like the legend swatch. Consider a short caption
    (e.g. "size only") or coloring the swatches along the same colorscale to remove
    the ambiguity.
  - The smallest bubbles (e.g. the ~$120M point near R&D=41%) sit close to sizemin=3
    and read noticeably smaller than the bulk of the distribution — a slightly higher
    sizemin/sizeref balance would keep the low end legible without shrinking the large
    bubbles.
  - 'Design Excellence is solid but conventional rather than exceptional: the layout,
    typography, and legend styling are clearly above library defaults but stop short
    of a truly distinctive, publication-grade composition (e.g. no annotation calling
    out the ''efficient innovator'' outlier at R&D=22%, PMF=92 to sharpen the story).'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Title "bubble-basic · python · plotly · anyplot.ai" in dark ink, centered, fully visible and not clipped. Axis titles "R&D Spend (% of Revenue)" (x) and "Product-Market-Fit Score" (y) in dark ink, clearly readable. Tick labels in a softer gray, legible. Grid lines on both axes, thin and subtle, visible but not competing with data.
      Data: 38 bubbles scattered with a clear positive trend (higher R&D spend % correlates with higher PMF score). Bubble size and color both encode Revenue: color ranges from brand green (#009E73, low revenue) to blue (#4467A3, high revenue) via the imprint_seq colorscale, consistent with the style guide. A top-left legend box (elevated cream fill) shows three green reference bubbles for $100M/$500M/$1500M sizing; a colorbar on the right shows the Revenue gradient in millions.
      Legibility verdict: PASS — all text is clearly readable against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Title and axis titles render in light cream ink, fully visible. Tick labels render in a softer light gray, legible. Grid lines are thin, light-colored, and subtle. Legend and colorbar boxes use the elevated dark fill (#242420-ish) with light text and borders, clearly readable against the near-black canvas.
      Data: Bubble positions, sizes, and colors (green→blue gradient) are identical to the light render — confirming only chrome (background, text, grid, legend/colorbar frames) flipped between themes, as required.
      Legibility verdict: PASS — no dark-on-dark failures observed; all title/axis/tick/legend text is clearly legible against the near-black background.
