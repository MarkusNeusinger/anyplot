review:
  strengths:
  - Creative dual-encoding of revenue via both bubble size and an Imprint imprint_seq
    color gradient, with legend swatches tinted to match the exact colors real data
    bubbles would render at that value
  - 'Effective data storytelling: targeted annotations for the ''Efficient innovator''
    and ''Underinvested laggard'' outliers, plus a dashed zone-highlight rectangle
    around the R&D-powerhouse cluster'
  - Correct area-based bubble sizing (sizemode='area', sizeref) — plotly's idiomatic
    scaling method, avoiding the common radius-vs-area perceptual error
  - Theme-adaptive chrome fully threaded through title, axis titles, tick labels,
    legend, grid, and annotations in both renders — palette and background are Imprint-compliant
    in both themes
  - opacity=0.5 plus PAGE_BG-colored marker edges cleanly separate overlapping bubbles,
    matching the spec's transparency guidance
  weaknesses:
  - Axis lines are only recolored (linecolor=INK_SOFT), not removed — a fully spine-free
    or L-shaped-frame treatment per the style guide's Visual Refinement guidance would
    read as more polished
  - The size-legend swatches reuse the same color-by-revenue interpolation as the
    data marker color, which double-encodes the same 'Revenue' variable through both
    size and color in the legend — a single neutral swatch color for the size legend
    would avoid implying an extra encoded dimension
  - 'LM-02: the main distinctive technique (sizeref/sizemode=''area'') is a fairly
    standard bubble-chart idiom rather than a feature unique to plotly specifically'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1-consistent), not pure white.
      Chrome: Title "R&D Investment vs. Product-Market Fit · bubble-basic · python · plotly · anyplot.ai" centered at top in dark ink, fully visible, ~55-60% of canvas width. X-axis title "R&D Spend (% of Revenue)" and Y-axis title "Product-Market-Fit Score" in dark ink, tick labels in softer gray-ink. Subtle light gridlines on both axes. Legend box ("Revenue": $100M/$600M/$2000M) top-left with cream elevated background and thin border. Two callout annotations ("Efficient innovator", "Underinvested laggard") with arrows pointing to specific bubbles, and a dashed-outline shaded zone labeled "R&D powerhouses" around a cluster of large bubbles in the top right.
      Data: ~62 bubbles varying in size (revenue) and color (green→blue gradient along imprint_seq, revenue-mapped), all with semi-transparent fill (alpha 0.5) and light-colored edges for separation. Low-revenue bubbles render solid brand green (#009E73); highest-revenue bubbles render blue (#4467A3).
      Legibility verdict: PASS — all text and data elements are clearly readable against the light background; no light-on-light issues observed.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17-consistent), not pure black.
      Chrome: Same title, axis titles, and tick labels now rendered in light ink/gray-ink, clearly legible against the dark background. Gridlines are faint and light-toned. Legend box uses a dark elevated background (~#242420) with light text, still clearly readable. Same two annotation callouts and the zone-highlight rectangle, now with light-colored dashed outline and light annotation boxes.
      Data: Bubble colors are identical to the light render (same green→blue imprint_seq gradient, same first-series green), confirming the data-color/theme-chrome separation rule.
      Legibility verdict: PASS — no dark-on-dark failures observed; all text, gridlines, and data markers remain distinguishable against the near-black background.
