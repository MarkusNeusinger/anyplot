review:
  strengths:
  - Size legend uses three reference bubbles whose swatch colors are computed along
    the same imprint_seq gradient as the real data markers, so the legend accurately
    previews what a bubble of that revenue actually looks like
  - Annotation callout on the 'efficient innovator' point (low R&D spend, high PMF
    score) adds a clear narrative focal point that guides the reader to the most interesting
    outlier
  - Theme-adaptive chrome is threaded correctly through title, axis titles, tick labels,
    gridlines, legend, and annotation box in both renders — no dark-on-dark or light-on-light
    failures
  - Idiomatic plotly bubble sizing via sizemode='area' with a computed sizeref and
    sizemin floor keeps the smallest bubbles visible while scaling area (not radius)
    correctly
  - Reproducible synthetic data (np.random.seed(42)) with plausible tech-company R&D/PMF/revenue
    values and no unused imports
  weaknesses:
  - Data point count (n=38) is below the specification's recommended 50-500 points
    for a bubble chart — consider increasing n toward the low end of that range for
    denser, more convincing coverage
  - Bubbles in the mid R&D-spend cluster (~26-27% on the x-axis) overlap tightly enough
    that individual points are hard to distinguish even with alpha=0.65 — a touch
    more jitter or a slightly lower sizeref in that range would help
  - Visual hierarchy relies on a single annotation as the only storytelling device;
    the rest of the chart is fairly uniform in emphasis
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (~#FAF8F1), not pure white — matches the light-theme surface.
      Chrome: Title "bubble-basic · python · plotly · anyplot.ai" is centered, dark ink text, clearly legible. X-axis title "R&D Spend (% of Revenue)" and Y-axis title "Product-Market-Fit Score" are dark and readable. Tick labels are soft dark gray, legible against the cream background. Gridlines are faint and unobtrusive. A "Revenue (size)" legend box sits top-left with an off-white elevated fill and thin border, showing three color-tinted reference bubbles ($100M, $600M, $2000M). An annotation box "Efficient innovator (low R&D, high PMF)" with an arrow points to a standout bubble near (22, 92).
      Data: Bubbles are colored along a green-to-blue continuous scale (imprint_seq) tied to revenue, with the smallest/lowest-revenue bubbles rendering near brand green #009E73 and the largest/highest-revenue bubbles near blue #4467A3, each with a thin light-colored stroke matching the page background for definition against overlapping neighbors.
      Legibility verdict: PASS — all text is clearly readable against the light background; no light-on-light issues observed.

    Dark render (plot-dark.png):
      Background: Warm near-black (~#1A1A17), not pure black — matches the dark-theme surface.
      Chrome: Same title, axis titles, and tick labels now render in light ink/off-white tones, fully legible against the dark background. Gridlines remain faint but visible. The legend box switches to the dark elevated fill (#242420) with a light border, and the annotation box follows the same dark-elevated styling with light text.
      Data: The bubble colors and gradient (green→blue) are identical to the light render — only the chrome (background, text, grid, legend/annotation frames) flipped, confirming the palette rule holds.
      Legibility verdict: PASS — all text is clearly readable against the dark background; no dark-on-dark failures observed. Brand green remains vivid and distinguishable from the near-black surface.
