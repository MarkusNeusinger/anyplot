review:
  strengths:
  - 'Dual encoding: the continuous imprint_seq colorscale is tied to revenue and reinforces
    bubble size, and the legend swatches are tinted to match the actual rendered bubble
    colors at those revenue values — a thoughtful internal-consistency touch.'
  - Clear data storytelling via two annotated archetypes ("Efficient innovator", "Underinvested
    laggard") that give the viewer an immediate entry point into the R&D-vs-PMF relationship.
  - 'Full compliance with the spec''s notes: area-based sizing (sizemode="area"),
    alpha=0.6 transparency for overlap handling, and a proper size legend built via
    dummy traces.'
  - Clean, idiomatic plotly code — go.Figure with sizeref/sizemode, a custom hovertemplate,
    and theme-adaptive tokens threaded through every layout element (title, axes,
    grid, legend, annotations).
  - 'Both renders are fully theme-correct: correct backgrounds, all text legible,
    and the imprint_seq data colors are pixel-identical between light and dark — only
    chrome flips.'
  weaknesses:
  - Some bubbles in the dense low-R&D cluster (x approx 5-10%) overlap heavily enough
    that a couple of the smallest markers are nearly fully occluded — consider alpha
    closer to 0.5 or slightly more sizemin separation to keep individual points readable
    in that cluster.
  - Title fills only ~35% of the plot width because the mandated string has no descriptive
    prefix — adding the optional '{Descriptive Title} · ' prefix would both fill the
    title proportion closer to the 50-70% guideline and reinforce the R&D/PMF narrative
    the annotations already set up.
  - Beyond the two callouts, the layout is a fairly standard bubble scatter with no
    further engineered visual hierarchy (e.g. highlighting the top-performer cluster
    near x=35-40%), which caps the data storytelling at two isolated points.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "bubble-basic · python · plotly · anyplot.ai" in dark ink, centered top. Axis titles "R&D Spend (% of Revenue)" and "Product-Market-Fit Score" in dark ink. Tick labels in soft grey-brown. Subtle light-grey gridlines on both axes. Only left/bottom spines drawn (top/right removed). Legend box "Revenue (size)" top-left with three swatches ($100M green, $600M teal, $2000M blue-grey) on an elevated off-white card with thin border. Two annotation callout boxes ("Efficient innovator", "Underinvested laggard") with arrows pointing to specific bubbles.
      Data: 62 bubbles ranging from small bright green (low revenue) through teal to blue-grey (high revenue), area-scaled by revenue, opacity ~0.6, thin off-white bubble edges for separation on overlaps. First-series baseline color is #009E73 green as required, shifting toward #4467A3 blue for higher-revenue bubbles via the imprint_seq colorscale.
      Legibility verdict: PASS — all title, axis, tick, legend, and annotation text is clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title and axis titles now in light ink (#F0EFE8), tick labels in light grey-brown (#B8B7B0), gridlines subtle light-on-dark. Legend card and annotation callout boxes now use the dark elevated background (#242420) with light text and a visible light border. Spines and structure identical to the light render, just re-tokened for dark chrome.
      Data: Bubble colors are pixel-identical to the light render (green-to-blue imprint_seq gradient, same positions/sizes) — only the chrome (background, text, grid, legend/annotation frames) flipped, as required.
      Legibility verdict: PASS — no dark-on-dark failures; all text (title, axis labels, ticks, legend, annotations) reads clearly against the near-black background.
