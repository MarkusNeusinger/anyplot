review:
  strengths:
  - Idiomatic plotly bubble scaling via sizemode='area' + sizeref, keeping perceived
    size proportional to the revenue value rather than radius
  - 'Redundant encoding: revenue drives both size AND a continuous imprint_seq color
    mapping, with legend swatches individually tinted to match the exact color a real
    bubble of that revenue would render'
  - 'Three-layer visual hierarchy: a dashed zone-highlight rectangle around the R&D-powerhouse
    cluster plus two pointer-arrow callouts on specific bubbles, guiding the reader
    to the story beyond a raw scatter of points'
  - Title fontsize scales via an explicit linear formula (round(16 * 67 / len(title)))
    so the descriptive-prefixed title lands in the intended width proportion instead
    of overflowing
  - 'Theme-adaptive chrome fully threaded through: axis lines, gridlines, tick/label
    colors, legend box, and annotation callout boxes all branch on ANYPLOT_THEME;
    data colors (green-to-blue continuous scale) are identical across both renders'
  - Alpha (0.5) and max on-screen bubble diameter were deliberately tuned down from
    a prior revision specifically to reduce occlusion in the dense low-R&D cluster,
    per the code header's regen notes
  weaknesses:
  - The dense low-R&D cluster (x≈5-12, y≈15-30) still has 6-8 heavily overlapping
    bubbles where individual boundaries are hard to trace even with alpha=0.5 — could
    push sizemin down slightly or nudge a couple of the synthetic points apart for
    cleaner separation
  - 'LM-02: the zone-highlight rectangle and callout annotations use plotly''s generic
    shapes/annotations API, which is straightforward to replicate in most other charting
    libraries — nothing here is uniquely plotly-only'
  - Font family is left at the generic 'Arial, Helvetica, sans-serif' stack rather
    than a more distinctive typographic choice, which caps the aesthetic sophistication
    just short of top-tier polish
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "R&D Investment vs. Product-Market Fit · bubble-basic · python · plotly · anyplot.ai" is dark ink, centered, fully visible above the plot area. X-axis title "R&D Spend (% of Revenue)" and y-axis title "Product-Market-Fit Score" are dark and readable. Tick labels are a softer gray-ink, readable. Grid lines are faint horizontal/vertical lines, subtle. A "Revenue (size)" legend box sits top-left with an off-white elevated fill and thin border, three reference bubbles labeled $100M/$600M/$2000M. A dashed rectangle labeled "R&D powerhouses" highlights the top-right cluster of large blue-tinted bubbles. Two annotated callouts with arrows point at an "Efficient innovator" bubble (high PMF, low R&D) and an "Underinvested laggard" bubble (low R&D, low PMF), each in bordered off-white boxes.
      Data: ~62 semi-transparent bubbles positioned by R&D spend (x) vs. PMF score (y), sized by revenue (area-scaled) and colored along a green(#009E73)-to-blue(#4467A3) continuous gradient tied to the same revenue value. Overall pattern trends upward-right (more R&D spend correlates with higher PMF), with a dense overlapping cluster of small green bubbles in the low-R&D/low-PMF corner.
      Legibility verdict: PASS — all text (title, axis titles, tick labels, legend, annotations) is clearly dark-on-light and readable; no light-on-light issues found.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title, axis titles, and tick labels now rendered in light ink/off-white and light gray respectively, fully legible against the dark background. Grid lines are faint light lines at low opacity. The legend box and callout/annotation boxes now use the dark elevated fill (~#242420) with light borders and light text, matching the theme-adaptive chrome rules. The zone-highlight rectangle's dashed border and fill are visible as light-on-dark rather than dark-on-light.
      Data: The same ~62 bubbles at identical positions, sizes, and green-to-blue color gradient as the light render — confirmed the data-color mapping (green #009E73 for lower revenue through blue #4467A3 for higher revenue) is unchanged between themes; only the chrome (background, text, grid, legend/box fills) flips.
      Legibility verdict: PASS — no dark-on-dark failures observed; all title/axis/tick/legend/annotation text is light-colored and clearly readable against the near-black background.
