review:
  strengths:
  - Correct, idiomatic sizemode="area" bubble-size scaling with a properly derived
    sizeref, rather than the common mistake of scaling by radius.
  - 'Strong data storytelling: two annotated callouts plus a shaded cluster highlight
    give the chart a clear point of view without cluttering the data.'
  - Clean theme-adaptive chrome — both renders pass the light/dark legibility check
    with no dark-on-dark or light-on-light failures.
  - Custom three-bubble size legend (built via invisible x=[None] traces) is an idiomatic
    Plotly technique and clearly explains the size scaling as required by the spec
    notes.
  weaknesses:
  - The "Revenue" colorbar and the "Revenue (size)" legend both encode the same variable
    — consider dropping one (most likely the colorbar) to reduce visual clutter and
    let the remaining legend read as more intentional.
  - Colorbar title/tick fonts (9px/8px) are noticeably smaller than the rest of the
    chrome (axis 12px, ticks 10px) — bump them closer to the tick-label default (10px)
    for consistency and mobile legibility.
  - The dense low-revenue cluster (x≈4-12, y≈10-30) has many small, similarly-sized
    bubbles overlapping into an indistinct blob — consider a slightly lower sizemin
    or marginally higher transparency in that region's bubble population.
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white, consistent with #FAF8F1 (cream, not pure white)
      Chrome: dark-ink title "R&D Investment vs. Product-Market Fit · bubble-basic · python · plotly · anyplot.ai" centered at top; dark-ink axis titles "R&D Spend (% of Revenue)" / "Product-Market-Fit Score"; softer-grey tick labels; L-shaped axis frame (top/right spines removed); subtle grid lines on both axes — all readable
      Data: ~62 bubbles on the imprint_seq green(#009E73)->blue(#4467A3) continuous scale, sized by revenue (area-scaled), alpha≈0.5. Size legend ("Revenue (size)": $100M/$600M/$2000M) top-left in a cream callout box; matching "Revenue" colorbar at far right. Two annotated callouts ("Efficient innovator", "Underinvested laggard") with arrows, plus a dashed-rectangle highlight around the "R&D powerhouses" cluster
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black, consistent with #1A1A17 (not pure black)
      Chrome: light-ink title and axis titles, lighter-grey tick labels, same L-shaped frame and subtle grid — all clearly legible against the dark surface, no dark-on-dark failures
      Data: identical bubble colors/positions/sizes to the light render (green->blue gradient, same annotations and shaded-cluster highlight); only chrome (background, text ink, box/border fills) flipped to dark-theme tokens. Brand green #009E73 remains vivid at the colorbar's low end
      Legibility verdict: PASS
