review:
  strengths:
  - 'Correct imprint_seq colorscale (brand green -> blue) used for the continuous
    Revenue dimension, matching the style guide''s Continuous Data rule, and backgrounds
    are exactly #FAF8F1 (light) / #1A1A17 (dark) in both renders.'
  - Thoughtful custom size legend built from three anchor traces ($100M / $500M /
    $1500M) with swatch colors tinted along the same imprint_seq gradient, so each
    swatch previews the color a real data bubble of that revenue would render.
  - 'Clear data storytelling: anchored ''R&D powerhouse'', ''underinvestor'', and
    ''efficient innovator'' points create a legible diagonal trend, with a labeled
    annotation calling out the efficient-innovator outlier.'
  - Theme-adaptive chrome (title, axis titles, tick labels, grid, legend, colorbar,
    annotation box) is fully threaded through INK/INK_SOFT/GRID/ELEVATED_BG tokens
    and is correct in both renders.
  - 'Reproducible (np.random.seed(42)) and idiomatic go.Scatter bubble implementation:
    sizemode=''area'' with a computed sizeref for perceptually correct area-based
    scaling per the spec''s notes.'
  weaknesses:
  - 'Revenue is double-encoded: bubble size AND continuous marker color both map to
    the same revenue_m variable, producing two separate legends (size legend + colorbar)
    for one underlying quantity. Consider dropping the colorbar (the size legend +
    hover already cover it) or mapping color to a genuinely distinct dimension for
    a less cluttered composition.'
  - opacity=0.75 is above the spec's recommended 0.5-0.7 overlap-transparency range;
    the tightly packed bubble cluster around R&D~25-27% / PMF~30-45 is hard to parse
    into individual bubbles because of it -- lower alpha slightly (e.g. 0.65) in that
    region's density.
  - Legend size-reference values ($100M / $500M / $1500M) are somewhat arbitrary relative
    to the actual revenue_m range (40-2200); picking round anchors closer to the data's
    min/median/max (e.g. $100M / $600M / $2000M) would make the legend a more useful
    read of the real distribution.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 -- clearly not pure white.
      Chrome: Title "bubble-basic · python · plotly · anyplot.ai" in dark ink, centered at top. X-axis "R&D Spend (% of Revenue)" and Y-axis "Product-Market-Fit Score" in dark ink, tick labels in a lighter grey-brown. Subtle light-grey gridlines on both axes. A framed "Revenue (size)" legend (top-left) with three reference bubbles ($100M/$500M/$1500M), a framed annotation box ("Efficient innovator, low R&D, high PMF") pointing at one bubble, and a "Revenue ($ millions)" colorbar on the right. All text is clearly readable against the light background.
      Data: ~38 bubbles scattered showing a rising diagonal trend (higher R&D% broadly correlates with higher PMF score), bubble size scales with revenue, bubble color follows the imprint_seq green-to-blue gradient (small/low-revenue bubbles green, large/high-revenue bubbles blue). Overlapping bubbles use alpha transparency to stay legible, though one dense cluster (R&D~25-27%) is fairly crowded.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 -- clearly not pure black.
      Chrome: Same title, axis titles, and legend/annotation/colorbar layout as the light render, now rendered in light ink (#F0EFE8 primary, #B8B7B0 secondary) against the dark background. Gridlines are subtle light-on-dark. No dark-on-dark text observed anywhere -- title, axis titles, tick labels, legend text, colorbar labels, and the annotation box text are all clearly legible.
      Data: Bubble positions, sizes, and colors are pixel-identical to the light render (same green-to-blue imprint_seq gradient) -- only the chrome (background, text, grid, legend/annotation frame fills) flipped to the dark theme tokens, as required.
      Legibility verdict: PASS
