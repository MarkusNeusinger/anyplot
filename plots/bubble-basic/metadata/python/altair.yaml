    themes with only chrome flipping'
  - 'Theme chrome fully correct in both renders: #FAF8F1 warm off-white light background,
    #1A1A17 warm near-black dark background, all text (title, axis labels, ticks,
    legend) readable in both'
  - 'Distinctive Altair/Vega-Lite feature: legend-bound point selection (alt.selection_point(bind=''legend''))
    dims non-selected stages on click — a genuinely library-specific interaction preserved
    in the saved HTML'
  - Bubble size correctly encodes area (Vega-Lite size channel) for Market Share,
    with an explicit, clearly labeled size legend (values 10/25/40/55) as the spec
    requires
  - 'Thoughtful data storytelling: top-3-by-revenue companies are labeled with alternating
    dy offsets to avoid collision, and an intentional low-revenue/high-funding outlier
    is included to demonstrate the full chart dynamics'
  - Canvas gate passed cleanly (padded to exact 3200×1800), no edge clipping in either
    render, and code follows KISS structure with a fixed seed for reproducibility
  weaknesses:
  - The dense overlap cluster around Funding $68-72M (one Series B bubble stacked
    with two Growth bubbles) blends colors at the intersection, making it momentarily
    harder to tell which stage owns which sub-region — consider a slightly lower default
    opacity (e.g. 0.55-0.6) or a touch more jitter/offset for that cluster
  - The 'Growth · $97.6M' annotation sits close to the neighboring unlabeled Growth
    bubble at the top of the chart — nudge dx/dy a little further to guarantee a visible
    gap as data changes across regenerations
  - Design is solidly above default (legend-bound selection, layered annotations,
    subtitle) but stops short of top-tier polish — e.g. no deliberate secondary visual
    emphasis (like a subtle callout band or size-based ordering) that would push the
    top-3 story to true 'insight at a glance' status
  - Data generation produces a fairly tight, near-linear funding→revenue relationship
    across all four stages; a bit more spread or one additional counter-example (beyond
    the single outlier) would demonstrate feature coverage more thoroughly
