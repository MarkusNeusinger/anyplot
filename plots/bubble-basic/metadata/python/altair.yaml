    stacked with a Series B bubble and another Growth bubble) still blends colors
    at the intersection -- opacity was left at 0.58 from the prior attempt; try 0.5
    for just that region or add a touch more positional separation
  - 'LM-02: the legend-bound click-to-highlight selection is Altair-specific but remains
    a fairly common recipe -- a more unusual Vega-Lite feature (e.g. a cross-filtering
    second view, a regression trend layer) would push Library Mastery higher'
