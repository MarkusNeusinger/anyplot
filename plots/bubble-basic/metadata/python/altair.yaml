review:
  strengths:
  - Correct Imprint categorical palette in canonical order with fully theme-correct
    chrome in both light and dark renders
  - Legend-bound point selection (alt.selection_point(bind="legend")) is a genuinely
    distinctive Altair/Vega-Lite feature, carried into the interactive HTML export
  - Top-3-by-revenue text annotations with collision-avoiding offsets create a clear
    visual narrative without cluttering the chart
  - Bubble strokes colored with PAGE_BG cleanly separate overlapping bubbles in both
    themes, a thoughtful detail beyond library defaults
  - Clean, KISS-structured code that correctly implements the mandatory PAD-to-target
    canvas step from prompts/library/altair.md
  weaknesses:
  - Grid lines use gridDash=[3, 3] (dashed); the style guide calls for solid thin
    gridlines - switch to a solid, low-opacity line
  - Market Share values reaching up to ~95% for a single company are unrealistic for
    a competitive market with four visible funding-stage cohorts - narrow the recommended
    range (e.g. 10-60%) for better real-world plausibility
  - The Funding 20-28 cluster has several bubbles overlapping closely enough that
    individual points become hard to distinguish even with stroke + alpha - consider
    a touch more jitter or a slightly narrower size range in that density band
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1, not pure white and not dark.
      Chrome: Bold dark title "bubble-basic · python · altair · anyplot.ai" with a lighter dark-gray subtitle "Tech Startup Metrics — Funding vs Revenue by Stage & Market Share". Axis titles "Funding ($M)" and "Revenue ($M)" and their tick labels are dark/soft-dark and clearly legible. Dashed low-opacity gridlines on both axes. Three bold dark annotation callouts ("Growth · $97.6M", "Growth · $96.7M", "Growth · $77.5M") are fully readable and do not overlap each other or the bubbles. Legend panel (Stage + Market Share (%)) sits in an elevated cream panel at the right, all text legible.
      Data: Bubbles colored by Stage using the Imprint palette in canonical order - Seed = #009E73 (brand green, first series), Series A = lavender, Series B = blue, Growth = ochre. Bubble area encodes Market Share (%), with a white/PAGE_BG stroke around each bubble to separate overlaps.
      Legibility verdict: PASS - no light-on-light issues found.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17, not pure black and not light.
      Chrome: Title and annotation text render in near-white ink; axis/tick/legend text renders in a soft light gray; gridlines are faint light dashed lines. All chrome elements flipped correctly and remain clearly readable against the dark surface. No dark-on-dark failures observed (no black text on near-black background anywhere).
      Data: Stage colors and bubble strokes are identical to the light render (#009E73 green first, lavender, blue, ochre in the same canonical order) - only the chrome (background, text, grid, legend panel fill) changed between themes.
      Legibility verdict: PASS - all text remains legible in the dark theme.
