review:
  strengths:
  - 'Two genuinely distinctive Altair/Vega-Lite features used well: legend-bound point
    selection (selection_point(bind=''legend'')) for interactive cohort spotlighting
    preserved in the HTML output, and transform_regression for a declarative, no-extra-dependency
    trend line.'
  - 'Clear data storytelling: the top-3-by-revenue companies get outline rings plus
    collision-avoided text callouts, and two deliberate counter-example points (a
    capital-inefficient laggard, a capital-efficient climber) break the naive funding-to-revenue
    trend, turning a ''basic'' bubble chart into a narrative.'
  - 'Correct area-based size encoding (Altair''s mark_circle size channel, matching
    the spec''s ''scale by area not radius'' note), density-appropriate alpha (0.5/0.65),
    and canonical Imprint palette order (Seed = #009E73 first) held pixel-identical
    across both theme renders.'
  - 'Clean KISS script: explicit font sizes throughout, theme tokens threaded through
    axis/legend/view/title configs, reproducible via np.random.seed(42), and the mandatory
    PAD-to-target canvas safety block correctly implemented.'
  weaknesses:
  - Market Share (bubble size) correlates strongly with Stage, which is already encoded
    via color (Seed clusters ~10-20%, Growth ~40-58%) instead of varying independently
    per company — this reduces the payoff of showing a truly independent third variable.
    Decorrelate size from the stage-cohort mean so market share varies more freely
    within each stage.
  - Market share values (10-58%) don't sum to a coherent whole across 51 companies
    if read literally as shares of one market — reframe as a bounded proxy (e.g. 'market
    share within segment') or otherwise scope the metric so the percentages stay factually
    plausible.
  - Small tick marks are still drawn (tickSize=6) alongside the tick labels on both
    axes; per the style guide's decoration-removal checklist, drop the tick marks
    (axis=alt.Axis(ticks=False, ...)) and keep only the labels for a more refined
    finish.
  - Tick/legend labelFontSize=10 renders at roughly 5px once scaled down to a 400px-wide
    mobile thumbnail — comfortably readable at full 3200px width but borderline at
    mobile scale; consider nudging to 11-12 given the generous surrounding whitespace.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Bold dark title "bubble-basic · python · altair · anyplot.ai" centered at top, gray subtitle "Tech Startup Metrics — Funding vs Revenue by Stage & Market Share" beneath it. Axis titles "Funding ($M)" / "Revenue ($M)" in dark ink, tick labels in soft gray, subtle gridlines. Legend (top right) lists Stage categories (Seed/Series A/Series B/Growth) with circular swatches, and a separate Market Share (%) size legend below it. All chrome text is clearly readable against the light background.
      Data: First series (Seed) renders in Imprint brand green #009E73, followed by lavender (Series A), blue (Series B), and ochre (Growth) — canonical Imprint order. Bubbles are semi-transparent with a light stroke to separate overlaps. A dashed gray regression line runs through the cluster. Three Growth-stage bubbles near the top-right carry a dark outline ring plus a text callout ("Growth · $103.0M", "Growth · $100.6M", "Growth · $75.9M").
      Legibility verdict: PASS — no light-on-light text, no clipped elements observed.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title/subtitle/axis layout, now rendered in light cream (title/axis titles) and light gray (tick labels, subtitle, legend text). Legend boxes use the dark elevated background. Grid lines are faint light-on-dark. No dark-on-dark failures — every label, tick, and legend entry is clearly visible against the near-black surface.
      Data: Identical hues to the light render (green/lavender/blue/ochre bubbles, same regression line position, same three ringed+labeled Growth bubbles), confirming the data-color channel did not shift between themes; only the ring/stroke color flipped from dark ink to cream to stay visible on the dark surface.
      Legibility verdict: PASS — all text readable, no dark-on-dark issues.
