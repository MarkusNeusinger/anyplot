review:
  strengths:
  - 'Sophisticated Altair-native storytelling: a Vega-Lite regression trend line (transform_regression)
    sits under the bubbles, three narratively meaningful companies (top performer,
    capital-inefficient laggard, capital-efficient climber) get stroke-only highlight
    rings plus offset callout labels, and a legend-bound point selection lets a click
    on a Stage spotlight that cohort in the saved interactive HTML.'
  - 'Correct, theme-consistent Imprint palette: first series (Seed) renders as #009E73,
    the remaining three stages follow the canonical palette order, and every chrome
    element (background #FAF8F1/#1A1A17, text, grid, legend fill) flips correctly
    between light and dark with no wrong-theme artifacts.'
  - Data deliberately breaks the naive funding-to-revenue trend with two hand-placed
    outliers (a high-funded laggard and a capital-efficient climber), giving real
    variation instead of a single linear cloud.
  - Descending size-sort draw order (largest bubbles behind, smallest on top) plus
    opacity keeps the 51-point overlapping cluster legible without extra dataprep.
  - 'Clean KISS structure: seeded RNG (np.random.seed(42)), only used imports (including
    PIL for the mandatory canvas pad-to-target step), no functions/classes, correct
    plot-{theme}.png/.html output.'
  weaknesses:
  - 'The ''Series A · $54.0M'' callout annotation collides with the rotated ''Revenue
    ($M)'' y-axis title in BOTH light and dark renders — the ''S'' in ''Series'' overlaps
    the axis-title letters so both are partially illegible right at the intersection
    (bottom-left corner of the plot area, near y=54). Fix: give this specific annotation
    more dx/dy clearance from the axis title zone (e.g. push dx further negative and
    dy further so the label sits fully inside the plot rather than at the extreme
    left edge), or nudge the x-domain/left padding so left-edge annotations don''t
    collide with the axis title.'
  - Design Excellence execution has a rough edge (the same annotation-collision bug)
    that keeps DE-02 (Visual Refinement) from full marks despite otherwise strong
    polish — fixing the label placement above should also resolve this.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Bold dark title "bubble-basic · python · altair · anyplot.ai" centered at top, gray subtitle below it, dark "Funding ($M)" / "Revenue ($M)" axis titles, gray tick labels, subtle light-gray gridlines on both axes. All clearly readable EXCEPT one localized collision: the "Series A · $54.0M" callout label overlaps the rotated "Revenue ($M)" axis title at the bottom-left of the plot, where the first letters of each string visually interleave.
      Data: Bubbles colored by Stage — Seed=#009E73 (green, first series, correct), Series A=lavender/purple, Series B=blue, Growth=ochre — matching the canonical Imprint order. Size legend "Segment Share (%)" uses neutral gray swatches (correct, since it's a size encoding, not a hue). Two dashed-line trend and three highlighted/annotated outlier bubbles (Growth·$103.0M, Series A·$54.0M, Series B·$7.2M) are visible.
      Legibility verdict: FAIL (localized) — the "Series A · $54.0M" / "Revenue ($M)" text collision described above; everything else passes.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Title and axis titles in light/off-white, tick labels and subtitle in light gray, gridlines in light gray at low opacity — all readable against the dark surface, no dark-on-dark failures. Legend box uses the elevated dark fill (#242420), text readable.
      Data: Same four Stage colors as the light render (Seed green identical hex, Series A/B/Growth identical hex) — only chrome flipped, confirming palette-vs-theme separation is implemented correctly. Highlight rings on the three outliers are now light-colored (INK for dark theme) instead of dark, correctly following the theme-adaptive ink token.
      Legibility verdict: FAIL (localized) — the identical "Series A · $54.0M" vs "Revenue ($M)" collision reproduces in this render too (same layout, different theme), confirming this is a layout bug rather than a theme-specific coloring issue.
