review:
  strengths:
  - 'Two genuinely distinctive Altair/Vega-Lite features used well: legend-bound point
    selection (selection_point(bind="legend")) for interactive cohort spotlighting
    preserved in the HTML output, and transform_regression for a declarative, no-extra-dependency
    trend line.'
  - Segment Share is now drawn independently of Stage (a single wide distribution
    per the code comment), so bubble size carries genuinely new information instead
    of tracking the color-encoded cohort - fixes the attempt-1 DQ-01 redundancy finding.
  - Segment Share is reframed as each company's own addressable-segment share rather
    than a single global market, so the 10-62% values no longer imply an impossible
    >100% total across 51 companies - fixes the attempt-1 DQ-03 finding.
  - Tick marks are now removed on both axes (ticks=False) alongside the domain lines,
    matching the style guide's decoration-removal checklist - fixes the attempt-1
    DE-02 finding.
  - Axis and legend labelFontSize bumped to 11-12 (from 10), improving mobile-scale
    legibility while staying proportionate to the generous surrounding whitespace
    - fixes the attempt-1 VQ-01 finding.
  - 'Clear data storytelling: top-3-by-revenue companies get outline rings plus collision-avoided
    text callouts, and two deliberate counter-example points (a capital-inefficient
    laggard, a capital-efficient climber) break the naive funding-to-revenue trend.'
  - Correct area-based size encoding (mark_circle size channel, matching the spec's
    "scale by area not radius" note), density-appropriate alpha, and canonical Imprint
    palette order held pixel-identical across both theme renders.
  - 'Clean KISS script: explicit font sizes throughout, theme tokens threaded through
    axis/legend/view/title configs, reproducible via np.random.seed(42), and the mandatory
    PAD-to-target canvas safety block correctly implemented.'
  weaknesses:
  - The x=70 cluster still overlaps a Series B (blue) and two Growth (ochre) bubbles
    at near-identical positions, blending into a muddy gray-brown patch that briefly
    obscures the Stage color encoding at that spot - consider a small manual jitter
    or slightly lower opacity there.
  - The three top-3-revenue annotations all read "Growth · $...M" since the top 3
    by revenue happen to share one stage, which limits the label's incremental storytelling
    value versus a single occurrence.
  - The Segment Share size-legend swatches are rendered in brand green (symbolFillColor)
    regardless of a bubble's actual Stage color, which is a common Vega-Lite convention
    for size legends but could be misread as implying the size legend only applies
    to the Seed category.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 - not pure white, not dark.
      Chrome: Bold dark title "bubble-basic · python · altair · anyplot.ai" centered at top with a gray subtitle "Tech Startup Metrics — Funding vs Revenue by Stage & Segment Share" beneath it. Axis titles "Funding ($M)" / "Revenue ($M)" carry units in dark ink; tick labels in soft gray; subtle gridlines at low opacity; no axis domain lines or tick marks (removed per style guide). Legend panels ("Stage" and "Segment Share (%)") sit to the right with a light elevated fill and no border. All chrome is clearly legible against the light background.
      Data: First categorical series (Seed) is the brand green #009E73; Series A is lavender, Series B is blue, Growth is ochre - matches canonical Imprint order. Bubbles are alpha-blended (~0.5-0.65) and area-scaled by Segment Share, with a light stroke separating overlaps. A dashed gray regression line runs through the cluster, and the top-3-by-revenue bubbles carry a dark outline ring plus bold text callouts ("Growth · $103.0M", etc.).
      Legibility verdict: PASS - no light-on-light issues; all text and data are clearly distinguishable from the background.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 - not pure black, not light.
      Chrome: Title and axis titles flip to light cream, tick labels/subtitle/legend text flip to light gray, the highlight-ring stroke flips from dark ink to cream so it stays visible against the dark surface, and legend panels use the dark elevated background (#242420-consistent). Grid lines remain subtle.
      Data: Same four Imprint hues (green/lavender/blue/ochre) as the light render, confirming the data-color channel is identical across themes and only chrome flipped.
      Legibility verdict: PASS - no dark-on-dark failures; title, axis labels, tick labels, legend text, and annotation callouts are all clearly readable against the dark background.
