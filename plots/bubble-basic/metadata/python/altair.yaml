review:
  strengths:
  - Legend-bound `alt.selection_point(fields=["Stage"], bind="legend")` combined with
    `alt.condition` on the opacity channel lets a click on a Stage swatch spotlight
    that cohort in the saved interactive HTML — a Vega-Lite selection-grammar capability
    distinctive to Altair, and the default "all selected" state leaves the static
    PNG unaffected.
  - Four-field tooltip (Stage, Funding, Revenue, Segment Share) makes every bubble's
    third dimension inspectable in the HTML detail view without adding any mark to
    the static render.
  - '`alt.Order("Segment Share (%):Q", sort="descending")` draws the largest bubbles
    behind the smallest, so the dense low-funding cluster stays readable without moving
    a single mark off its (x, y) values.'
  - 'Overlapping bubbles stay distinguishable in both themes: `mark_circle(stroke=PAGE_BG,
    strokeWidth=2)` at opacity 0.5 gives every bubble a page-colored rim that separates
    it from its neighbours, exactly the translucency-plus-thin-outline treatment the
    spec''s characteristic section describes.'
  - 'Size legend is pinned to explicit reference values (10/25/40/55) titled in the
    size variable''s own units, drawn with the marks'' translucency and page-colored
    outline, and visible against both the #FAF8F1 and the #1A1A17 surface.'
  - 'Imprint palette in canonical order with the first series (Seed) at #009E73, and
    every chrome element — background, axis titles, tick labels, grid, legend box
    fill — driven from PAGE_BG / ELEVATED_BG / INK / INK_SOFT tokens, so light and
    dark flip cleanly with identical data hexes.'
  - 'Visual refinement through subtraction: `axis=alt.Axis(domain=False, ticks=False)`
    removes the axis spines and tick marks, and the grid sits at gridOpacity=0.15
    — quiet chrome that lets the bubbles carry the plot.'
  - 'Clean KISS script: `np.random.seed(42)`, no functions or classes, only used imports,
    and the mandated pad-to-3200x1800 block saving `plot-{THEME}.png` plus `plot-{THEME}.html`.'
  weaknesses:
  - 'VQ-03 (both): the smallest bubbles (Segment Share around 8-10 %) render roughly
    13 px across in the 3200 px canvas — the one near Funding 55 / Revenue 43 and
    the one near Funding 70 / Revenue 57 read as specks rather than as sized marks,
    so the low end of the size encoding is barely legible → lift the area floor to
    about 120-150 px² (+70 to +100). Likely cause: `alt.Scale(range=[50, 1500], domain=[8,
    62])` on the size channel.'
  - 'VQ-01 (both): tick labels and both legends sit at 12 pt inside a 620x320 inner
    view, so in the saved 3200 px PNG they measure about 48 px and shrink to roughly
    6 px when the catalog preview is scaled to a 400 px mobile width → about 14 pt
    (+2 pt). Likely cause: `configure_axis(labelFontSize=12)` and `labelFontSize=12`
    on both `alt.Legend` blocks.'
  - 'Suggestion: tightening the y-axis domain from 125 to about 110 would trim the
    empty band above the highest bubble without clipping any mark.'
  - 'Suggestion: a larger step between the 16 pt title and the 12 pt subtitle would
    sharpen the typographic hierarchy at the top of the canvas.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white matching #FAF8F1 across the whole 3200x1800 canvas — clearly not pure white; the two legend boxes on the right sit on the slightly lighter elevated fill #FFFDF6.
      Chrome: Bold near-black title "bubble-basic · python · altair · anyplot.ai" centred at the top, grey subtitle "Tech Startup Metrics — Funding vs Revenue by Stage & Segment Share" directly beneath it. Bold dark axis titles "Funding ($M)" (bottom) and rotated "Revenue ($M)" (left). Grey tick labels 0-85 in steps of 5 on x and 0-120 in steps of 20 on y. Axis spines and tick marks are absent; a light grey grid sits at low opacity behind the marks. Legend titles "Stage" and "Segment Share (%)" are dark and bold, their entry labels grey. All text is readable against the light background — no light-on-light element anywhere, and nothing is clipped at any canvas edge.
      Data: 51 translucent circles, each with a thin page-colored rim, colored by Stage — Seed = #009E73 (first series, correct), Series A = #C475FD lavender, Series B = #4467A3 blue, Growth = #BD8233 ochre, i.e. Imprint positions 1-4 in canonical order. Circle area encodes Segment Share (%). Bubbles form a rising Seed → Series A → Series B → Growth progression from the bottom-left to the upper-right, with a dense overlapping Seed/Series A cluster below Funding 10 and two deliberate counter-examples (a high-funded low-revenue point at ~68.5/7.2 and a capital-efficient point at ~11/54). No trend line, no highlight rings, no callout labels, no color bar. The size legend shows four grey reference bubbles at 10/25/40/55 drawn with the marks' translucency and page-colored rim.
      Legibility verdict: PASS — warm off-white surface, dark chrome, subtle but visible grid, every bubble distinguishable from the background.

    Dark render (plot-dark.png):
      Background: Warm near-black matching #1A1A17 — not pure black; the two legend boxes use the elevated dark fill #242420, visibly distinct from the page.
      Chrome: Title in off-white (#F0EFE8), subtitle and tick labels in light grey (#B8B7B0), axis titles "Funding ($M)" / "Revenue ($M)" in off-white, grid drawn in light grey at low opacity. Legend titles off-white, entry labels light grey. No dark-on-dark failure anywhere — every title, axis title, tick label and legend label is clearly readable, and nothing touches or crosses a canvas edge.
      Data: Identical Stage hexes to the light render — Seed #009E73 is unchanged and still clearly visible on the dark surface, Series A #C475FD, Series B #4467A3, Growth #BD8233. Bubble positions, sizes, draw order and the 0.5 opacity are identical; the marks read darker overall only because the same translucent fills composite against a near-black page instead of an off-white one, which is the intended effect of the spec's required transparency. The bubble rims flip to the dark page color and still separate overlapping circles. The size legend's four reference bubbles flip to the light-grey INK_SOFT token and remain clearly visible against the elevated dark box.
      Legibility verdict: PASS — warm near-black surface, light chrome throughout, grid subtle but present, brand green #009E73 fully visible.
