review:
  strengths:
  - Correct area-based (sqrt) bubble-size scaling, satisfying the "scale by area,
    not radius" requirement.
  - Alpha transparency (0.70) intentionally applied to manage overlapping bubbles,
    exactly as the spec notes recommend.
  - Clear tiered size legend with descriptive vehicle-registration ranges, satisfying
    the "include a size legend" requirement.
  - 'Correct imprint_seq sequential gradient (brand green #009E73 to blue #4467A3)
    applied to the continuous third variable.'
  - 'Both renders are fully theme-compliant: correct backgrounds, fully legible chrome,
    data colors identical across light/dark.'
  - Focal-point highlighting (amber "Congestion Hotspot") adds a layer of data storytelling
    beyond a plain bubble scatter.
  - Explicit font sizing across every text role via the Style object (title, label,
    major_label, legend, value, tooltip).
  weaknesses:
  - The 5 discrete size tiers compress into a narrow pixel-size range, making adjacent
    tiers hard to visually distinguish, especially inside dense overlap clusters (e.g.
    the 10-20% transit-coverage group). Widen the size range between the smallest
    and largest tier, or reduce the number of tiers to increase the visual step between
    them.
  - Heavy bubble overlap in the densest clusters (10-20% and 30-40% transit-coverage
    regions) obscures individual data points despite alpha blending - consider a slightly
    wider dots_size spread or a touch more transparency in those regions.
  - 'Design excellence is solid but not yet publication-grade: consider a subtler
    grid opacity, or an explicit trend annotation to make the downward relationship
    the immediate takeaway rather than something the viewer infers.'
  - The amber hotspot highlight is a reasonable focal-point technique, but amber's
    canonical semantic role is warning/caution - consider whether a neutral/ink-toned
    highlight, or a legend label framing it more clearly as "notable" rather than
    "warning", would be a cleaner semantic fit.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 - not pure white, not dark.
      Chrome: Title "bubble-basic · python · pygal · anyplot.ai" in dark ink, centered top, fully legible. X-axis "Public Transit Coverage (%)" with %-suffixed ticks (~10%-90%). Y-axis "Traffic Congestion Index" with numeric ticks (20-90). Bottom legend (3 columns) lists 5 vehicle-registration tier ranges plus the "Congestion Hotspot" marker. Subtle dotted gridlines on both axes. All chrome confirmed readable against the light background.
      Data: ~50 bubbles on a green->blue sequential gradient (lowest tier #009E73 brand green through teal/blue shades), sized by sqrt-scaled vehicle-registration tier; one larger amber (#DDCC77) bubble marks the focal "Congestion Hotspot" city. Clear downward trend (higher transit coverage -> lower congestion).
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 - not pure black, not light.
      Chrome: Same layout as light render. Title, axis titles, tick labels, and legend text all render in light ink, clearly legible against the dark background. No dark-on-dark failures found anywhere.
      Data: Colors identical to the light render - same green->blue tier gradient and amber hotspot bubble; only background, gridlines, and text color flipped as expected.
      Legibility verdict: PASS
