review:
  strengths:
  - 'Correct area-based bubble sizing: tier radii are derived from sqrt(value) rather
    than value directly, so visual area scales proportionally with the underlying
    vehicle-registration metric'
  - Page-background halo stroke around every dot keeps individual overlapping bubbles
    traceable despite heavy overplotting — a well-justified workaround for pygal's
    lack of a per-point alpha/stroke API
  - 'Imprint sequential colormap (#009E73 -> #4467A3) correctly used for the continuous
    size dimension, with the amber accent reserved only for the single focal-point
    highlight instead of polluting the categorical palette'
  - 'Strong data storytelling: the congestion-hotspot city is called out with a print_labels
    annotation that sits cleanly clear of the title and other bubbles in both renders'
  - Quantile-based (not equal-width) tier binning keeps all 7 legend entries populated
    instead of one tier absorbing the dense mid-chart cluster
  - Theme tokens (background, ink, grid) are correctly threaded through the Style
    object; both renders pass the light/dark legibility checklist with no dark-on-dark
    or light-on-light failures
  - Clean, reproducible, single-pass script (seeded RNG, no unused imports, no functions/classes)
    appropriate for the KISS structure criterion
  weaknesses:
  - Despite the halo-ring mitigation, the 40-60% transit-coverage band still stacks
    6-8 overlapping bubbles on top of each other, making individual points hard to
    trace in that cluster — consider a stronger stroke/opacity contrast or slight
    y-jitter to further separate that region
  - dot_opacity=0.48 sits marginally below the specification's recommended alpha range
    of ~0.5-0.7 for overlap handling; harmless visually but worth nudging into range
  - The vehicle-registrations size column spans ~150-700, above the specification's
    illustrative 10-100 range for the bubble-size column — not a functional problem
    since it is correctly area-scaled and realistic, but a literal spec deviation
    worth noting
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1-consistent), not pure white and not dark.
      Chrome: Title "bubble-basic · python · pygal · anyplot.ai" in dark ink, fully visible, comfortably above the tallest bubble. X-axis title "Public Transit Coverage (%) — bubble size ↔ vehicle registrations" and y-axis title "Traffic Congestion Index (0-100 scale)" both dark, readable, similarly sized. Tick labels ("10%"..."90%", "20"..."90") dark and legible against the light background. Subtle dashed gridlines visible without dominating. 4-column legend at the bottom lists all 7 vehicle-registration tiers plus the "Congestion Hotspot" entry, all text dark and crisp.
      Data: 50 bubbles in a sequential green-to-blue-gray gradient (first/lowest tier = brand green #009E73, highest tier = blue #4467A3), each with a light halo stroke separating overlapping bubbles. The single amber/tan focal bubble (highest congestion) stands out clearly with a "★ Congestion Hotspot: 12% coverage, 95 congestion index" annotation placed to its right, not overlapping the title or other bubbles. Data show a clear inverse relationship between coverage and congestion, with bubble size (vehicle registrations) increasing toward the upper-left congested/low-coverage cities.
      Legibility verdict: PASS — all chrome text and annotation text is clearly readable against the light background.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17-consistent), not pure black and not light.
      Chrome: Same title, axis titles, and tick labels now rendered in light ink, fully legible against the dark background. Gridlines remain subtle. Legend text at the bottom is light-colored and crisp against the dark background — no dark-on-dark failures observed anywhere (title, axis labels, ticks, legend, and the hotspot annotation are all light-on-dark).
      Data: Identical bubble colors and positions to the light render (green-to-blue sequential gradient, same amber focal bubble) — only the halo-stroke color flips to the dark background tone, confirming chrome-only theme adaptation of the data encoding.
      Legibility verdict: PASS — all chrome and annotation text is clearly readable against the dark background; no dark-on-dark or contrast issues found.
