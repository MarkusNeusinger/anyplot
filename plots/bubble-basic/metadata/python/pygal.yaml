review:
  strengths:
  - 'First series correctly uses brand green #009E73; the 4 size tiers interpolate
    along the imprint_seq green→blue gradient exactly as prescribed for continuous/binned
    data, and the focal bubble uses ANYPLOT_AMBER as an out-of-pool accent'
  - Area-scaled bubble sizing (sqrt of normalized value) gives perceptually accurate
    size differences instead of naive radius scaling
  - Alpha=0.70 transparency directly follows the spec's guidance to handle overlapping
    bubbles, with opacity_hover=0.95 for interactive emphasis
  - The highest-congestion city is pulled out as a dedicated amber '★ Congestion Hotspot'
    series, giving the chart a clear focal point and a data story (inverse coverage/congestion
    relationship)
  - 'Both renders are theme-correct: #FAF8F1/#1A1A17 backgrounds, ink and grid tokens
    flip correctly, and data colors are identical between light and dark'
  - Rich per-point tooltips (coverage/congestion/vehicle values formatted with units)
    are a genuine value-add for the HTML detail view, appropriately not penalized
    for being invisible in the static PNG
  - Reproducible via np.random.seed(42), clean imports, correct plot-{THEME}.png/.html
    output naming
  weaknesses:
  - Bubble size is quantized into only 4 discrete tiers (a pygal API constraint, noted
    in the code comments) rather than continuous per-point sizing, so the size legend
    maps ranges rather than exact values — acceptable given the library limitation
    but a real loss of precision for the third dimension
  - Dense clusters (~35–40% and ~65–75% transit coverage) have heavy bubble overlap
    where several same-tier bubbles nearly fuse into a single blob even at alpha=0.70
    — consider a touch more transparency or slight jitter in those clusters
  - Color tier and size tier encode the exact same underlying variable (vehicle registrations),
    so color is fully redundant with size rather than adding independent information
    — a reasonable legibility aid but not additional data storytelling
  - Visual refinement is mostly limited to palette/opacity tuning; pygal's default
    grid and chrome otherwise carry the look, so it reads as polished but not deeply
    customized
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1), matches spec exactly.
      Chrome: Title "bubble-basic · python · pygal · anyplot.ai" centered at top in dark ink, fully visible, not clipped. X-axis title "Public Transit Coverage (%)" and Y-axis title "Traffic Congestion Index" both dark and legible. Tick labels (10%-90% on x, 20-90 on y) dark and readable. Gridlines are faint dashed lines, subtle but visible. Legend at bottom in 3 columns with small color swatches and text, all readable.
      Data: ~50 bubbles arranged in a downward-sloping band (higher transit coverage -> lower congestion). First/lowest size tier is brand green (#009E73), then a teal, a blue-teal, and blue for increasing vehicle-registration tiers, plus one large amber (#DDCC77) bubble marked as the "Congestion Hotspot" near the top-left. Bubbles are alpha-blended (~0.70) so overlaps show as darker blended regions rather than hard occlusion.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17), matches spec exactly.
      Chrome: Same title and axis titles now rendered in light ink (near-white), fully visible against the dark background, no dark-on-dark issues anywhere (title, axis titles, tick labels, and legend text are all light-colored and clearly legible). Gridlines are faint light dashed lines, subtle but visible on the dark surface. Legend swatches and text at bottom are readable.
      Data: Same bubble layout and identical data colors as the light render (green/teal/blue-teal/blue tiers, amber hotspot bubble) — only the chrome (background, text, grid) flipped, confirming palette compliance across themes.
      Legibility verdict: PASS
