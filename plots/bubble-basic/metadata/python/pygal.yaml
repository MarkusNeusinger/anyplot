review:
  strengths:
  - Bubble size correctly scaled by area (sqrt of tier midpoint) via quantile-based
    tiers, keeping tiers evenly populated instead of one tier absorbing the dense
    low-coverage cluster.
  - Thin PAGE_BG halo-ring stroke around every bubble keeps individual bubbles distinguishable
    in the dense overlap zone instead of melting into a single blob under alpha blending.
  - Focal 'Congestion Hotspot' bubble rendered in ANYPLOT_AMBER with a print_labels
    annotation creates a clear visual anchor and data story for the extreme point.
  - 'First categorical/tier color is exactly #009E73, and the 7-tier legend is a correct
    imprint_seq interpolation to #4467A3 for the continuous vehicle-registration variable
    — identical data colors across both theme renders.'
  - All font sizes explicitly set (title, axis labels, ticks, legend, tooltip, value-label);
    both light and dark renders are fully legible with no dark-on-dark or light-on-light
    failures.
  weaknesses:
  - The dense low-coverage cluster (~10-45% transit coverage) has many heavily overlapping
    bubbles; the halo rings help but individual points are still hard to trace precisely
    in that region.
  - The size legend is an indirect 7-tier color-coded proxy (vehicle-registration
    ranges) rather than a traditional small/medium/large reference-circle legend —
    functional, given pygal's lack of a per-point size API, but slower to read than
    a real size key.
  - Styling relies on inline CSS that matches pygal's internal `#chart-{uuid} .dot`
    / `.text-overlay text.label` selectors by specificity — well documented and currently
    correct, but fragile if pygal's internal graph.css selectors change in a future
    version.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Title "bubble-basic · python · pygal · anyplot.ai" in dark ink, centered-right of a warm off-white canvas, fully visible, not clipped. X-axis title "Public Transit Coverage (%)" and Y-axis title "Traffic Congestion Index (0-100 scale)" in dark ink, both descriptive with units. Tick labels ("10%"-"90%", "20"-"90") in dark ink, fully readable. Grid lines are light dotted, subtle but visible. Legend at bottom in 4 columns, 7 tier-range labels ("209-341 vehicles/1,000" ... "521-624 vehicles/1,000") plus "★ Congestion Hotspot", all in dark ink with colored swatches matching the bubble tiers.
      Data: 50 bubbles positioned by (transit coverage, congestion index), sized by area and colored by a 7-step sequential scale from #009E73 (brand green, low vehicle registrations) to #4467A3 (blue, high vehicle registrations). Bubbles carry a thin off-white halo stroke so overlapping bubbles in the dense low-coverage cluster (~10-45%) stay individually traceable. One focal bubble is rendered in amber (#DDCC77) with a "★ Congestion Hotspot: 15% coverage, 95 congestion index" annotation as a visual anchor.
      Legibility verdict: PASS — all text (title, axis titles, ticks, legend, annotation) is clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Same title and axis titles now in light/off-white ink, fully visible and not clipped. Tick labels and legend text are light-colored and clearly legible against the dark background. Grid lines are a lighter, subtle dotted tone, still visible without dominating. The annotation text ("★ Congestion Hotspot: ...") is rendered in light ink, confirmed readable against both the dark canvas and the overlapping amber/olive bubble region — no dark-on-dark failure.
      Data: Identical bubble positions, sizes, and colors as the light render — the same #009E73→#4467A3 sequential scale and the same #DDCC77 amber focal bubble. Halo strokes now match the dark PAGE_BG, preserving the same separation effect between overlapping bubbles.
      Legibility verdict: PASS — all text remains readable in the dark theme; no dark-on-dark or unreadable elements found.
