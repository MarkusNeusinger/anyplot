review:
  strengths:
  - Correct area-based (not radius-based) bubble sizing via sqrt of quantile-normalized
    tier midpoints
  - 'Genuine, well-documented pygal-specific fixes: dot_opacity vs. opacity CSS cascade,
    value_label_font_size for the print_labels overlay, and an injected halo-stroke
    rule to keep overlapping bubbles individually traceable'
  - 'Clear data-storytelling focal point: the amber Congestion Hotspot bubble with
    an on-canvas metric callout'
  - 'Correct Imprint sequential palette (#009E73 to #4467A3) applied to the continuous
    size dimension; first series is #009E73 as required'
  - Both renders pass the theme-readability check with no legibility or clipping issues
  weaknesses:
  - The densest cluster (roughly 10-50% transit coverage) still has heavy bubble-on-bubble
    overlap even with the halo strokes and 0.58 opacity - consider a lower dot_opacity
    or a touch more jitter/spacing in that region
  - Legend swatches render as uniform-size squares that convey tier color but not
    the actual bubble-size progression - the color+label workaround is a reasonable
    substitute given pygal's lack of a native bubble-size legend, but a supplementary
    size-key hint would be stronger
  - Color and bubble size both encode the same underlying variable (vehicle registrations),
    which is a legitimate legibility choice but leaves color as a redundant rather
    than independent channel
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1.
      Chrome: Title "bubble-basic · python · pygal · anyplot.ai" in dark ink, centered and legible. Y-axis title "Traffic Congestion Index (0-100 scale)" wraps to two lines on the left; x-axis title "Public Transit Coverage (%) — bubble size ↔ vehicle registrations" along the bottom. Tick labels ("10%"-"90%", "20"-"90") are dark and readable. Bottom legend (4 columns x 2 rows) maps tier color swatches to vehicle-registration ranges. All chrome text confirmed readable.
      Data: ~50 bubbles on a green-to-blue sequential gradient across 7 vehicle-registration tiers, first tier is #009E73. One larger amber (#DDCC77) bubble marks a "Congestion Hotspot" with a print-labels text callout. Each bubble has a thin light-colored halo stroke separating overlapping circles.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17.
      Chrome: Same layout; title, axis titles, tick labels, and legend all render in light ink and are clearly legible against the dark surface. No dark-on-dark issues found.
      Data: Colors identical to the light render (green-to-blue tier gradient, amber hotspot bubble) - only chrome (background, halo-stroke color, text ink) flips, as required. Halo strokes now render dark-on-bubble and still visibly separate overlapping bubbles. Hotspot annotation text is light-colored and reads clearly.
      Legibility verdict: PASS
