review:
  strengths:
  - 'Clever workaround for pygal''s lack of per-point bubble sizing: quantizes vehicle-registration
    values into 4 tiers, each its own XY series with a distinct dots_size, approximating
    area-scaled bubbles within the library''s constraints'
  - 'Tier colors correctly interpolate the Imprint imprint_seq gradient (#009E73 to
    #4467A3) for the continuous vehicle-registration variable, with the focal ''Congestion
    Hotspot'' city called out using the semantic amber anchor (#DDCC77) as a legitimate
    data-storytelling device'
  - Theme-adaptive chrome (background, ink, grid) is correctly threaded through the
    Style object and verified correct in both light and dark renders
  - Realistic, neutral urban-planning dataset (transit coverage vs. congestion vs.
    vehicle ownership) with sensible domain scale and clear inverse relationship
  - Explicit reproducible seed (np.random.seed(42)) and clean KISS top-to-bottom script
    structure with no functions or classes
  - Documents a real pygal-specific gotcha (dot_opacity vs opacity CSS-cascade behavior
    for XY dots) demonstrating genuine library mastery
  weaknesses:
  - Bubble 'size' is quantized into only 4 discrete tiers via np.digitize rather than
    continuous per-point sizing, which collapses fine-grained third-dimension variation
    into buckets and reduces feature coverage for a genuinely continuous bubble-size
    encoding
  - With 50 overlapping bubbles and only 4 distinct sizes, points within the same
    tier become hard to visually differentiate by size in the dense mid-chart cluster
    (40-60% transit coverage)
  - Y-axis 'Traffic Congestion Index' has no explicit unit or scale note (abstract
    index), slightly less descriptive than the fully unit-labeled x-axis 'Public Transit
    Coverage (%)'
  - 'Design Excellence is solid but not yet publication-tier: grid/whitespace refinement
    and storytelling could go further, e.g. a direct annotation naming the focal hotspot
    city''s exact values next to the amber bubble instead of relying purely on color
    contrast'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "bubble-basic · python · pygal · anyplot.ai" in dark ink, comfortably sized (~40% of canvas width), clearly visible. Axis titles "Public Transit Coverage (%)" (x) and "Traffic Congestion Index" (y) in dark ink, balanced sizes. Tick labels dark, legible against the cream background. Grid lines are subtle dotted gray, present on both axes but not competing with data. Legend at bottom shows 4 tier-range swatches ("214-315", "315-416", "416-517", "517-617 vehicles/1,000") plus a 5th amber "★ Congestion Hotspot" swatch, all readable.
      Data: Bubbles form a clear negative correlation between transit coverage and congestion index. Colors run from brand green (#009E73, smallest vehicle-registration tier) through teal and blue (#4467A3, largest tier) — a correct imprint_seq-style gradient for continuous data — plus one amber (#DDCC77) bubble marking the focal "Congestion Hotspot" city at low transit coverage / high congestion. Bubble sizes increase with tier as expected (area-like scaling), transparency (~0.62-0.70 alpha) handles the heavy overlap in the mid-density cluster.
      Legibility verdict: PASS — all text is clearly readable against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Title and axis titles render in light ink (~#F0EFE8), clearly visible against the dark surface. Tick labels are light gray and legible. Grid lines remain subtle (theme-adaptive muted tone) and visible without dominating. Legend text and swatches read the same as the light version, fully legible.
      Data: Bubble colors are visually identical to the light render — same green-to-blue tier gradient and the same amber hotspot bubble — confirming positions 1-N of the palette and the amber anchor are held constant across themes; only the chrome (background/text/grid) flipped as required.
      Legibility verdict: PASS — no dark-on-dark failures observed; all title, axis, tick, and legend text is clearly readable against the near-black background, and the brand green remains visible.
