review:
  strengths:
  - 'Correctly fixed prior review issues: dot_opacity now applies real alpha transparency
    to bubble fills (opacity alone previously left bubbles fully solid), and value_label_font_size
    now themes the hotspot annotation text instead of falling back to a hardcoded
    black default.'
  - Page-background halo stroke around every bubble keeps overlapping dots visually
    distinct instead of melting into a single blob under alpha blending.
  - 'Redundant encoding: bubble size AND color both map to the vehicle-registration
    tier via a correct imprint_seq gradient (#009E73 to #4467A3), reinforcing the
    third data dimension while staying CVD-safe.'
  - 'Clear focal-point storytelling: the highest-congestion outlier city is rendered
    in amber with an on-canvas annotation, giving the reader an immediate insight
    beyond the general trend.'
  - Quantile-based tier binning keeps all 7 size/color bins populated instead of one
    tier absorbing the dense mid-chart cluster.
  - 'Theme-adaptive chrome is correct in both renders: text, grid, and background
    all flip correctly while the data colors stay identical.'
  weaknesses:
  - The dense low-coverage cluster (~10-30% transit coverage) has heavy bubble-on-bubble
    overlap that makes individual bubbles hard to distinguish even with the halo stroke
    — consider a touch more size differentiation or jitter to ease crowding in that
    region.
  - The manual CSS-injection overrides (#chart-{uuid} .dot and .text-overlay text.label
    selectors) and quantile-tier math add real complexity for a spec labeled 'basic'
    — justified by pygal's API limits, but noticeably more code than a plain per-point
    chart.add() loop.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "bubble-basic · python · pygal · anyplot.ai" in dark ink, clearly visible. Axis titles "Public Transit Coverage (%)" and "Traffic Congestion Index (0-100 scale)" are dark and readable. Tick labels (20%-90% on x, 20-90 on y) are dark and legible. Subtle dashed gridlines on both axes, visible but not competing with data. Bottom legend (4 columns) with dark text, fully readable.
      Data: 50 bubbles in a sequential green-to-blue gradient (imprint_seq, #009E73 to #4467A3) sized by vehicle-registration tier, each with a thin off-white halo stroke separating overlapping bubbles. One bubble stands out in amber (#DDCC77) marking the "Congestion Hotspot" outlier, with an on-canvas text annotation in dark ink next to it, fully readable against the light background.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Title, axis titles, and tick labels all render in light/off-white ink, clearly visible against the dark surface. Gridlines are subtle light dashed lines. Legend text at the bottom is light-colored and fully readable.
      Data: Bubble colors are identical to the light render (same green-to-blue gradient and amber highlight) — only the halo stroke color and chrome flipped to the dark-background tone, confirming palette consistency across themes. The "Congestion Hotspot" annotation text renders in light ink, clearly readable — no dark-on-dark failure (this was a fixed issue from the prior review attempt).
      Legibility verdict: PASS
