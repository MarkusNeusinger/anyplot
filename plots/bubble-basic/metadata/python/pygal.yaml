review:
  strengths:
  - 'Correct use of the Imprint sequential colormap (imprint_seq, #009E73 -> #4467A3)
    for the continuous vehicle-registration dimension, exactly matching the library-specific
    continuous-data guidance instead of a categorical palette or an external cmap.'
  - 'Strong data storytelling: the highest-congestion city is rendered in the ANYPLOT_AMBER
    semantic anchor with a star annotation, creating a clear, intentional focal point
    distinct from the ordinal tier colors.'
  - Quantile-based (not equal-width) tier binning keeps the size-legend buckets evenly
    populated, and bubble radii are derived from sqrt(tier midpoint) for accurate
    area-based scaling as required by the spec.
  - 'Theme-adaptive chrome is correctly threaded through the pygal Style object --
    both renders are fully legible, backgrounds match #FAF8F1/#1A1A17, and the data
    colors are pixel-identical between light and dark.'
  - dot_opacity=0.58 correctly implements the spec's alpha-transparency requirement
    for handling the expected heavy bubble overlap.
  - The quantile-range legend doubles as the required size legend, clearly explaining
    what each bubble size/color represents.
  weaknesses:
  - 'The point-level annotation text ("★ Congestion Hotspot: 15% coverage, 93 congestion
    index") renders far smaller than every other text element on the chart (title=66,
    label=56, major_label=44, legend=44) -- none of the configured Style font-size
    tokens cascade to pygal''s `print_labels` overlay, so it falls back to pygal''s
    small built-in default. At mobile widths (~400px) this annotation would be effectively
    unreadable. Fix: find the CSS selector pygal uses for the point-label overlay
    text (distinct from `.value`) and set it explicitly via a custom CSS rule in `custom_style`,
    targeting a comparable source-pixel size (~36-44px).'
  - In the densest low-coverage cluster (top-left, ~10-30% transit coverage) many
    bubbles overlap heavily and individual tier boundaries are hard to distinguish
    even with alpha blending -- consider a thin ink-colored edge stroke on the bubbles
    or slightly reduced dot_opacity in that region's tiers to improve separation.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 -- not pure white.
      Chrome: Title "bubble-basic · python · pygal · anyplot.ai" in dark ink, large and centered; x-axis title "Public Transit Coverage (%)" and y-axis title "Traffic Congestion Index (0-100 scale)" both dark and clearly readable; tick labels (percent on x, numeric on y) dark and legible; a bottom legend in 2 rows of 4 lists the 7 vehicle-registration quantile tiers plus a "★ Congestion Hotspot" entry, all in dark text on the light surface.
      Data: ~50 bubbles positioned by (transit coverage %, congestion index), colored on a green-to-blue sequential gradient (imprint_seq, #009E73 -> #4467A3) keyed to vehicle-registration tier, rendered with alpha (~0.58) so overlapping bubbles remain distinguishable; one large bubble in the top-left is rendered in ANYPLOT_AMBER (#DDCC77) marking the "Congestion Hotspot" city, with a small star + text annotation next to it. The first/smallest tier is confirmed #009E73 (brand green).
      Legibility verdict: PASS overall, with one caveat -- the small annotation text next to the amber hotspot bubble is noticeably smaller than every other text element on the chart (looks like it falls back to a pygal default rather than the explicitly configured font sizes) and would likely be unreadable at mobile widths, though it is still legible at full canvas resolution.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 -- not pure black.
      Chrome: Same title/axis-title/tick-label/legend layout as the light render, all flipped to light-colored ink (near-white) against the dark surface -- clearly readable, no dark-on-dark failures observed.
      Data: Confirmed identical data colors to the light render -- same green-to-blue sequential gradient for the 7 tiers and the same ANYPLOT_AMBER hotspot bubble; only the chrome (background, text, grid, legend) flipped for the dark theme.
      Legibility verdict: PASS overall, with the same caveat as the light render -- the hotspot annotation text is disproportionately small relative to the rest of the chart's typography.
