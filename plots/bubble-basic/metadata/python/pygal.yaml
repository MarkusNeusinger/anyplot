review:
  strengths:
  - 'Excellent data storytelling: the highest-congestion city is deliberately pulled
    out with a distinct amber color, a larger dot, and a star-labeled annotation,
    giving the chart an immediate focal point'
  - True area-scaled bubble sizing derived from each quantile tier's actual midpoint
    value (not the tier index), so bubble area honestly represents vehicle registrations
  - Sequential imprint_seq (green -> blue) palette applied to the size tiers reinforces
    the third dimension with a redundant color encoding instead of an arbitrary categorical
    palette
  - Page-background halo stroke around every bubble keeps overlapping dots visually
    separable in the dense low-coverage cluster instead of melting into one blob
  - Deep pygal CSS-cascade mastery documented inline (dot_opacity vs opacity, value_label_font_size
    vs value_font_size) shows genuine library expertise
  - Clean KISS script structure, seeded reproducibility (np.random.seed(42)), and
    correct plot-{THEME}.png/.html output naming
  weaknesses:
  - 'Dark render dark-on-dark failure: the ''★ Congestion Hotspot'' annotation text
    (pygal''s print_labels text-overlay, styled via value_label_font_size) renders
    in dark ink on the near-black #1A1A17 background, while every other text element
    (title, axis labels, ticks, legend) correctly flips to light ink. The Style object''s
    foreground/foreground_strong tokens don''t cascade to the ''.text-overlay .label''
    CSS class. Fix by extending the existing chart.css inline-override pattern (already
    used for the ''.dot'' stroke) with a theme-aware rule, e.g. inline:#chart-{chart.uuid}
    .text-overlay .label { fill: <INK>; }'
  - In the dense 10-35% transit-coverage cluster, the 7 sequential teal-to-blue tiers
    are hard to tell apart at a glance under heavy bubble overlap; consider slightly
    wider hue steps between adjacent tiers or reducing to 5-6 tiers so the color-as-size
    redundant encoding stays legible in the busiest region
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Title "bubble-basic · python · pygal · anyplot.ai" in dark ink, large and centered at top. Axis titles "Public Transit Coverage (%)" and "Traffic Congestion Index (0–100 scale)" are dark, descriptive, and include units. Tick labels ("20%"..."90%", "20"..."90") are dark and clearly legible. Subtle dashed gridlines on both axes. Legend sits below the plot in 4 columns of colored swatches with vehicle-registration range labels plus the amber "Congestion Hotspot" entry. The "★ Congestion Hotspot: 15% coverage, 93 congestion index" annotation text is dark ink on the light background.
      Data: 50 bubbles sized by vehicle-registration tier (sqrt-area scaled) and colored on a green (#009E73) to blue (#4467A3) sequential ramp across 7 tiers, with one standout bubble in amber (#DDCC77) marking the focal high-congestion city. Bubbles use alpha transparency (~0.58-0.70) with a thin light-background halo stroke so overlapping bubbles in the dense low-coverage cluster stay visually separable.
      Legibility verdict: PASS — all text (title, axis titles, ticks, legend, annotation) is clearly readable against the light background.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Title, axis titles, and tick labels correctly flip to light/white ink and remain clearly legible against the dark background. Gridlines flip to a lighter, still-subtle tone. Legend swatches and text below the plot are also light-colored and legible.
      Data: Bubble colors and sizes are pixel-identical to the light render — same green-to-blue tier ramp, same amber focal bubble, same halo-stroke treatment — confirming only chrome (not data color) flips between themes.
      Chrome defect: the "★ Congestion Hotspot: 15% coverage, 93 congestion index" annotation text (pygal's print_labels overlay) does NOT flip to light ink like the rest of the chrome — it remains in the same dark ink color used in the light render, sitting directly on the near-black background. This is a genuine dark-on-dark legibility failure isolated to this one text element; every other text element on the chart correctly adapts.
      Legibility verdict: FAIL — the focal-city annotation text is illegible (dark-on-dark) in the dark theme; all other text elements pass.
