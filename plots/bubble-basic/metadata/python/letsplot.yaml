review:
  strengths:
  - scale_size_area used for bubble sizing, scaling by area rather than radius exactly
    as the spec requires
  - geom_smooth adds a dashed linear trend line that gives the chart a clear analytical
    narrative (payroll correlates with win rate) rather than a flat scatter of bubbles
  - layer_tooltips() is configured with formatted per-field tooltips (payroll as $M,
    win_pct as %, attendance as K) for the HTML export, without cluttering the static
    PNG
  - Theme-adaptive chrome tokens (PAGE_BG, INK, INK_SOFT, RULE, ELEVATED_BG) are threaded
    consistently through plot background, panel, axis, and legend styling in both
    renders
  - Size legend breaks (15, 25, 35, 45) are chosen to span the actual attendance data
    range, making the size-to-value mapping easy to read
  - ggtb() overlay is added only to the HTML export, keeping the static PNG free of
    interactive-toolbar clutter
  weaknesses:
  - The payroll cluster around $135-145M has 4-5 heavily overlapping bubbles of similar
    size and color that are hard to parse individually even with alpha=0.5 - consider
    a touch more transparency or a small size/position nudge in dense regions
  - Design relies on the mandated Imprint palette plus theme_minimal with no additional
    distinctive visual device beyond the trend line - solid execution but not much
    extra design risk-taking beyond the baseline recipe
  image_description: |-
