review:
  strengths:
  - Uses scale_size_area to scale bubbles by area rather than radius, exactly matching
    the spec's accuracy requirement, and alpha=0.7 handles overlap cleanly
  - geom_smooth loess trend line plus geom_text_repel outlier annotations (largest
    market share, steepest decline) give the chart genuine data storytelling beyond
    a raw scatter of bubbles
  - 'Distinctive lets-plot features used well: layer_tooltips with custom per-field
    formatting for the interactive HTML export, and ggtb() pan/zoom toolbar layered
    on only for the HTML output'
  - 'Imprint palette applied correctly (first series #009E73, canonical order for
    the remaining sectors) with fully theme-adaptive chrome verified correct in both
    light and dark renders'
  - All font sizes explicitly set, reproducible via np.random.seed(42), clean imports,
    no fake interactivity
  weaknesses:
  - Full four-sided panel border (box frame) renders around the plot area in both
    themes instead of the style guide's default L-shaped frame (top/right spines removed)
    — set panel_border/axis_line so only left+bottom lines remain
  - Beyond the color/font/grid overrides, the panel styling still reads close to a
    configured theme_minimal() default; more deliberate visual refinement (e.g. actually
    dropping the top/right border) would push Design Excellence further
  - Dataset totals 45 rows, marginally under the spec's recommended 50-500 point range
    for this plot type (minor, not a functional gap)
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Title "bubble-basic · python · letsplot · anyplot.ai" in dark ink, fully visible, not clipped. Axis titles "Revenue (Million USD)" / "Growth Rate (%)" and tick labels in dark/soft-dark ink, clearly legible. A full rectangular panel border (all 4 sides) surrounds the plot area — style-guide default calls for only left+bottom spines. Grid lines subtle. Two legends below the plot ("Market Share (%)" size legend, "Sector" color legend) sit on an elevated cream box, both fully readable.
      Data: Bubbles colored by sector — Technology #009E73 (brand green, first series, correct), Healthcare lavender, Finance blue, Energy ochre, Consumer Goods matte red — all matching Imprint canonical order. Bubble size encodes market share via area scaling; alpha=0.7 keeps overlapping bubbles distinguishable. A loess trend line with confidence band runs through the cloud, and two geom_text_repel annotations ("Finance — largest share", "Finance — steepest decline") point to specific outlier bubbles with leader lines; both are fully legible, not clipped near the right canvas edge.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Title, axis titles, and tick labels render in light ink (#F0EFE8/#B8B7B0), clearly legible against the dark background — no dark-on-dark failures found. Same 4-sided panel border issue persists (theme-consistent but the same L-shape deviation as light). Grid lines are subtle and visible. Legends use the dark elevated box (#242420) with light text, fully readable.
      Data: All sector colors are pixel-identical to the light render (verified visually) — only chrome flipped as expected. Trend line and confidence band render in light gray against dark, annotation text is white and legible in both spot-checked crops near the largest-share and steepest-decline bubbles.
      Legibility verdict: PASS
