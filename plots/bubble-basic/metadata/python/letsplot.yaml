review:
  strengths:
  - Correct area-based bubble sizing via scale_size_area (matches spec's 'scale by
    area, not radius' requirement) with a clear, explicit size legend showing four
    reference sizes
  - 'Adds real analytical value beyond a bare scatter: an lm trend line (geom_smooth)
    plus dotted mean-payroll/mean-win-rate reference lines give the chart a genuine
    focal point and narrative'
  - 'Correct Imprint palette usage — first series #009E73, second series the canonical
    second hue #C475FD — identical data colors between light and dark renders, only
    chrome flips'
  - Theme-adaptive chrome is correctly threaded through (plot/panel background, axis
    text, grid, legend background) with the lets-plot 4.11.0 fill/color-matching quirk
    explicitly documented in a comment
  - Rich, well-formatted layer_tooltips (currency, percentage, and thousands formatting
    per field) that add real value in the HTML export without being simulated/fake
    in the PNG
  - Exact required title format used, descriptive axis labels with units (Million
    USD, %), clean KISS structure, reproducible via np.random.seed(42)
  weaknesses:
  - geom_point alpha=0.32 sits noticeably below the spec's recommended 0.5-0.7 range
    for overlapping-bubble transparency — on the light background especially, several
    bubbles read as pale/washed-out pastels rather than vivid Imprint hues, slightly
    reducing data prominence and aesthetic impact. Consider raising to ~0.45-0.55
    to keep overlap legible while restoring more color saturation.
  - The lm trend line and the two dotted mean-reference lines share a very similar
    muted grey/INK_SOFT styling (dashed vs. dotted is the only differentiator) — a
    short direct label or slightly more contrast between the two line roles would
    make the storytelling layer easier to parse at a glance.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "bubble-basic · python · letsplot · anyplot.ai" in dark ink, fully visible near the top, comfortably within canvas bounds. Axis titles "Team Payroll (Million USD)" / "Win Rate (%)" and tick labels render in dark/soft-dark ink, clearly legible. Grid lines are faint horizontal/vertical warm-grey lines, subtle but visible. Two bottom legends ("Avg. Attendance (K)" size legend, "Conference" color legend) sit in slightly elevated cream boxes with dark text, fully readable, no overlap with each other or with plot content.
      Data: ~70 bubbles across two hues — green (#009E73, Eastern) and violet/purple (#C475FD, Western) — rendered at alpha≈0.32, giving a pastel, semi-transparent look that handles overlap but reads as somewhat washed out for isolated bubbles. A dashed grey linear trend line and two dotted grey mean-reference lines (vertical at mean payroll, horizontal at mean win rate) overlay the scatter, creating a clear upward-trend narrative.
      Legibility verdict: PASS — all text (title, axis labels/ticks, legend text) is clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Same title now rendered in light/off-white ink, fully visible and legible. Axis titles/ticks flip to light ink (title) and soft light-grey ink (ticks), clearly readable against the dark surface. Grid lines are faint light-grey, subtle but present. Legend boxes use a slightly lighter elevated dark background with light text, fully legible, no overlap.
      Data: The same two hues (green #009E73, violet #C475FD) at the same alpha — confirmed identical to the light render; only the chrome (background, text, grid, legend fill) flipped. Against the dark background the semi-transparent bubbles actually read with good contrast and pop nicely. The dashed trend line and dotted mean-reference lines are now light-grey and remain clearly visible.
      Legibility verdict: PASS — no dark-on-dark failures; every title/axis/tick/legend element is clearly legible against the near-black background.
