    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17-range), matches spec — not pure black, not light.
      Chrome: Same title now in white/light ink; axis titles in light ink; tick labels in light gray; subtle darker gridlines; dashed light-gray trend line, clearly visible against the dark panel. Legend boxes now use a slightly elevated dark fill with light borders and light text.
      Data: Same two bubble series in identical green (#009E73) and purple hues as the light render — only the chrome (background, text, grid, legend frames) flipped, not the data colors, as required.
      Legibility verdict: PASS — no dark-on-dark failures observed; all title, axis, and legend text remains clearly legible against the near-black background.
