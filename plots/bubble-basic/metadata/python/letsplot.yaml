review:
  strengths:
  - Area-correct bubble sizing via scale_size_area(max_size=13) with explicit breaks
    [15, 25, 35, 45] — a value twice as large covers twice the area, the 12K bubbles
    stay visible and the 45K ones do not swallow the panel
  - shape=21 with a thin INK_SOFT stroke plus alpha=0.55 keeps every bubble distinguishable
    inside the dense 105-125 M cluster while each mark stays exactly at its (x, y)
    values
  - 'The size legend''s reference bubbles are drawn like the data marks (override_aes
    fill #009E73, INK_SOFT outline, alpha 0.55) and stay clearly visible on both the
    #FAF8F1 and the #1A1A17 surface, labelled in the size variable''s own units'
  - 'Correct Imprint usage — first series #009E73, second the canonical #C475FD —
    with theme-adaptive chrome threaded through plot/panel background, axis text,
    grid and legend, and the lets-plot 4.11.0 fill/color-matching quirk documented
    in a comment'
  - 'Distinctive lets-plot work: layer_tooltips with per-field currency/percent/thousands
    formatting and ggtb() layered onto the HTML export only, so the static PNG stays
    toolbar-free'
  - Flat, reproducible script — np.random.seed(42), no functions or classes, every
    imported name used, saves plot-{THEME}.png at the canonical 3200x1800 and plot-{THEME}.html
  weaknesses:
  - 'DE-02 (both): each legend key sits on its own rectangle a shade off the surrounding
    legend panel, clearest in the dark render, so the two bottom legends read as a
    row of small boxes instead of one clean strip -> give the keys the legend background.
    Likely cause: legend_key left at the theme_minimal default instead of element_rect(fill=ELEVATED_BG,
    color=ELEVATED_BG).'
  - 'VQ-01 (both): axis tick labels at size=10 against a size=13 axis title scale
    down to roughly 4 px in the catalogue''s 400 px preview and stop being readable
    there -> about 12 pt (+2 pt). Likely cause: axis_text=element_text(size=10).'
  - 'Suggestion: a slightly larger plot_title would let the mandated title carry more
    of the header band''s width.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white matching #FAF8F1 across both the plot and panel area — not pure white, not dark. No panel border; faint warm-grey major grid lines run horizontally and vertically, subtle but clearly present.
      Chrome: Title "bubble-basic · python · letsplot · anyplot.ai" in near-black ink at the top left, fully inside the canvas with generous headroom. Axis titles "Team Payroll (Million USD)" (x) and "Win Rate (%)" (y) in dark ink; tick labels 90–190 and 20–60 in soft dark grey. Two legends sit in a cream elevated strip below the x-axis title: the "Avg. Attendance (K)" size legend with four reference bubbles (15/25/35/45) and the "Conference" colour legend (Eastern / Western). All chrome text is clearly readable against the light background; no light-on-light anywhere.
      Data: ~70 bubbles, two hues — green #009E73 (Eastern) and violet #C475FD (Western) — drawn as shape=21 at alpha 0.55 with a thin soft-grey outline. Positions rise from bottom-left to top-right; sizes span roughly 12K to 45K attendance. Overlapping bubbles in the 105–125 M cluster remain individually traceable thanks to the outline and translucency. No trend line, reference line, callout or bubble label anywhere in the panel.
      Legibility verdict: PASS — title, axis titles, tick labels and both legends are all clearly legible; data marks stand well clear of the off-white page.

    Dark render (plot-dark.png):
      Background: Warm near-black matching #1A1A17 — not pure black, not light. Same borderless panel; grid lines flip to a faint light grey at the same weight.
      Chrome: The same title now in off-white ink, fully visible. Axis titles in light ink, tick labels in soft light grey — all clearly readable, with no dark-on-dark failures anywhere. The two bottom legends sit on the slightly lifted #242420 elevated surface with light title text and soft-grey labels, fully readable. Individual legend keys sit on their own slightly darker rectangles, which reads as a row of boxes (noted as a DE-02 defect) but costs no legibility.
      Data: Identical hues to the light render — #009E73 for Eastern and #C475FD for Western, same alpha 0.55 and same outline; only the chrome flips. Composited over the near-black page the translucent marks read as a deeper teal and plum, which is the expected effect of the spec-required translucency, not a palette change. The brand green is plainly visible on the dark surface. Bubble positions and sizes match the light render one for one.
      Legibility verdict: PASS — every title, axis, tick and legend element is clearly legible against the near-black background; no dark-on-dark text.
