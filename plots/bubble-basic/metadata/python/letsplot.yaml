review:
  strengths:
  - 'Theme-adaptive chrome is threaded correctly through every non-data element (background,
    title, axis text, ticks, grid, legend box) and is identical in structure across
    both renders, with the two Imprint categorical hues (#009E73 Eastern, #C475FD
    Western) unchanged between light and dark.'
  - 'Strong data storytelling: a dashed OLS trend line (geom_smooth, method=''lm'')
    plus dotted average reference lines on both axes turn a plain payroll-vs-win-rate
    scatter into a quadrant-style read (over/under-performing teams relative to payroll).'
  - scale_size_area (area-based, not radius-based) is used for the bubble-size encoding,
    matching the spec's explicit 'scale bubble sizes by area' requirement, with alpha=0.42
    to handle overlap as the spec recommends.
  - Rich, well-formatted layer_tooltips (currency, percent, and K-suffixed fields)
    add genuine value to the interactive HTML export without faking anything in the
    static PNG.
  - Clean, reproducible, single-pass script (np.random.seed(42), no functions/classes)
    with only used imports and a realistic sports-analytics scenario (payroll vs.
    win rate vs. attendance) covering the full range of bubble sizes and both conference
    categories.
  weaknesses:
  - The lower-left cluster (payroll ~90-96M, win rate ~15%) has heavy Eastern/Western
    bubble overlap that makes individual points hard to distinguish — a touch more
    transparency or a slightly smaller max bubble size in that region would help.
  - Legend boxes keep a visible border (legend_background element_rect(color=INK_SOFT,
    size=0.5)); the style guide's decoration-removal checklist prefers dropping legend
    frames entirely for a cleaner look.
  - The mandated title renders comfortably compact (~45-50% of plot width) rather
    than the 70-85% typical for this title length — not a defect, but there is unused
    header whitespace if a slightly larger plot_title size is ever wanted.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "bubble-basic · python · letsplot · anyplot.ai" in dark ink, clearly visible top-left. Axis titles "Team Payroll (Million USD)" and "Win Rate (%)" in dark ink. Tick labels in a softer dark gray. Subtle light gridlines (major only). A dashed dark-gray OLS trend line and dotted average-reference lines cross the plot. Two legends at the bottom in lightly-bordered elevated-cream boxes: a bubble-size legend ("Avg. Attendance (K)": 15/25/35/45) and a color legend ("Conference": Eastern/Western).
      Data: ~70 bubbles in two hues — green (#009E73, Eastern) and lavender (#C475FD, Western) — at alpha ~0.4, positioned by payroll (x) and win rate (y), sized by average attendance. First series is confirmed brand green.
      Legibility verdict: PASS — all title, axis, tick, and legend text is clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Same title and axis titles now rendered in light/off-white ink; tick labels in a lighter gray; gridlines are faint light-on-dark. The trend line and reference lines switch to a light dashed/dotted gray. Legend boxes now sit on a dark elevated panel with light text, borders in a soft light-gray tone.
      Data: The same two hues — green (#009E73) and lavender (#C475FD) — are pixel-identical to the light render; only the chrome flipped as expected.
      Legibility verdict: PASS — no dark-on-dark failures; every title, axis, tick, and legend text element is legible light-on-dark, and the brand green remains vivid against the near-black surface.
