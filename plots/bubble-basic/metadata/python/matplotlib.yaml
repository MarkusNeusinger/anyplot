review:
  strengths:
  - Custom inset-axes bubble-size legend (Market Cap) is properly calibrated against
    the same market_cap.max() used for the main scatter sizing, so the legend bubbles
    are truthful references, not decorative.
  - Outlier annotations ("High-Growth Unicorn", "Market Leader", "Breakout Performer")
    create genuine data storytelling with a clear focal point, correctly anchored
    to the exact data points they label.
  - Bubble sizes are scaled by area via the s= parameter (already area-proportional
    in matplotlib), matching the spec's 'scale by area, not radius' requirement.
  - Alpha blending (0.65) with theme-adaptive edge colors cleanly handles overlapping
    bubbles in the dense lower-left cluster.
  - 'Imprint palette applied correctly: Cloud/SaaS (first series) uses #009E73, remaining
    3 sectors follow canonical palette order; chrome flips correctly between light
    and dark renders while data colors stay identical.'
  - Spines fully removed, y-axis-only subtle grid, generous margins — clean, uncluttered
    composition.
  weaknesses:
  - Dataset has 41 points (35 base + 6 outliers), below the spec's recommended 50-500
    point range — a denser base sample would fill out the mid-revenue region more
    convincingly.
  - Bubble-size variable (market_cap) ranges 5-400, wider than the spec's suggested
    10-100 for the size column — acceptable given realistic market-cap scale, but
    worth noting for the size-legend granularity.
  - Title fontsize is dynamically shrunk (~11pt) because the descriptive prefix pushes
    the string past the 67-char baseline; still fully legible but has a bit less presence
    than the 12pt default.
  image_description: |-
