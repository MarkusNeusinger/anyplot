review:
  strengths:
  - Genuine third-dimension size legend built as a real inset_axes panel (not a faked
    overlay), with three representative caps ($25B/$100B/$300B) matching the scale
    of the data
  - Bubble area (not radius) scaled correctly via matplotlib's native `s` parameter,
    and alpha=0.65 is used exactly in the spec's recommended 0.5-0.7 range to manage
    overlap
  - Three annotated callouts (High-Growth Unicorn, Market Leader, Breakout Performer)
    with arrowprops and path_effects halos add real data storytelling and a clear
    focal hierarchy
  - Theme tokens threaded consistently through background, spines, grid, ticks, legend
    frames and annotation halos — both renders are correctly and identically themed
    with unchanged Imprint data colors
  - 'Clean, reproducible, single-purpose script: seeded RNG, only used imports, Axes-based
    API throughout, correct plot-{THEME}.png output'
  weaknesses:
  - Dense bubble overlap in the right-side cluster (Annual Revenue ~95-120) makes
    it hard to distinguish individual sector membership and size at a glance — consider
    slightly lower alpha or minor jitter for that cluster
  - The Cloud/SaaS and Social Media bubbles near (74, 16) nearly fully overlap, visually
    merging into a blended color that could be misread as a single bubble
  - Legend and annotation text sit at 8pt, which is legible at full size but feels
    tight when the image is scaled down to ~400px for mobile/thumbnail views
  image_description: |-
