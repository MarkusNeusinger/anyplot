      Data: Four categories in Imprint palette order — Electronics (#009E73 green), Furniture (lavender), Kitchenware (blue), Outdoor Gear (ochre). Bubble size encodes sales volume, alpha ~0.62 with page-background-colored edges for separation. Low-price region (roughly $0-150) is densely packed with overlapping Kitchenware/Electronics/Outdoor bubbles.
