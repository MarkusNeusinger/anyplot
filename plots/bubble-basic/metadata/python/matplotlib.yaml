review:
  strengths:
  - Correct theme-adaptive chrome throughout — backgrounds, ink tokens, grid, legend
    frames, and annotation box all flip cleanly between light (#FAF8F1) and dark (#1A1A17)
    while the Imprint palette data colors (green/lavender/blue/ochre) stay pixel-identical
  - Real inset-axes size legend (Sales Volume) built with mpl_toolkits.axes_grid1.inset_locator.inset_axes
    — a genuine matplotlib technique, not a faked/simulated legend, and deliberately
    placed in the one empty region of the scatter (high price, low quality) so it
    never covers data
  - Bubble size scaled by area (not radius) per the spec's explicit accuracy requirement,
    with alpha=0.5 and background-colored edge strokes to keep the dense low-price
    Kitchenware cluster legible despite heavy overlap
  - Focal-point annotation ('Premium standout') computed from the actual data (argmax
    of price*quality within Electronics) rather than a hardcoded position, adding
    a genuine storytelling layer
  - 'First categorical series correctly uses Imprint brand green #009E73 (Electronics),
    remaining 3 categories take palette positions 2-4 in canonical order'
  - Category color legend and size legend are both positioned so neither overlaps
    any data bubble or each other in either render
  - 'Clean, single-pass KISS script: no functions/classes, seeded RNG (np.random.seed(42)),
    only used imports, correct plot-{THEME}.png output contract'
  weaknesses:
  - The dense low-price cluster (Kitchenware/Electronics under ~$100) still has heavy
    bubble overlap even with alpha=0.5 — consider a slightly wider x-axis zoom inset
    or jitter to give that region more room to breathe
  - 'Design Excellence is solid but not maximal: the annotation and inset legend are
    good touches, yet the overall composition still reads as a fairly standard scatter-with-size
    rather than a fully art-directed chart'
  - Legend title 'Sales Volume' and category legend title 'Product Category' are both
    at 9pt — matches body legend text size, so the title doesn't visually lead the
    legend as strongly as it could with a slightly bolder or larger title weight
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "Retail Product Portfolio · bubble-basic · python · matplotlib · anyplot.ai" in dark ink, comfortably sized, not clipped. X-axis "Retail Price ($)" and Y-axis "Customer Quality Rating (1-10)" labels in dark ink, clearly readable. Tick labels in a softer dark grey, legible. Subtle horizontal (y-axis-only) gridlines at low opacity. Upper-right "Product Category" legend (Electronics/Furniture/Kitchenware/Outdoor Gear) in an elevated cream panel with dark border and dark text — fully readable. Lower-right "Sales Volume" inset panel shows three reference bubbles (120K/60K/15K units) in muted grey with dark labels — fully readable. A "Premium standout" annotation box (cream fill, dark border, dark text) points to a high price/quality Electronics bubble via a thin connector line.
      Data: Four categories in Imprint palette colors — Electronics = brand green (#009E73, first series, correct), Furniture = lavender, Kitchenware = blue, Outdoor Gear = ochre/tan. Bubbles are semi-transparent (alpha ~0.5) with light-background-colored edge strokes, sized by sales volume (area-scaled). The low-price cluster (<$100) is dense with overlapping bubbles but individual categories remain distinguishable through color and alpha.
      Legibility verdict: PASS — no light-on-light text, no illegible elements.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Same title, axis labels, and tick labels now rendered in light ink (near-white for primary text, light grey for tick labels) — all clearly legible against the dark background, no dark-on-dark failures anywhere. Gridlines remain subtle. The "Product Category" legend and "Sales Volume" inset panel now use a dark-elevated panel background (#242420-style) with light borders and light text — fully readable. The "Premium standout" annotation box uses the same dark-elevated fill with light border/text and remains legible.
      Data: Colors are identical to the light render — same brand green for Electronics, same lavender/blue/ochre for the other three categories, confirming only chrome (not data color) flipped between themes. Bubble sizes, positions, and the annotated standout point are unchanged from the light render.
      Legibility verdict: PASS — no dark-on-dark failures; all text and legend elements read clearly against the dark surface.
