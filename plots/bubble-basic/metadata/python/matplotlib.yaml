      Data: Four sector colors — Cloud/SaaS green (#009E73, first series, correct), E-Commerce purple/magenta, Semiconductors blue, Social Media tan/brown — all clearly distinguishable against the light background. Bubbles sized by market cap via area scaling, alpha ~0.65 handles overlap in the dense lower-left cluster. Three annotated outliers ("High-Growth Unicorn", "Market Leader", "Breakout Performer") with dark bold text and arrow callouts, all pointing to the correct data points.
      Legibility verdict: PASS — no light-on-light issues, all text and data crisply legible.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Title and axis labels rendered in light/off-white ink, clearly legible against the dark background. Tick labels light gray, readable. Gridlines subtle but visible. Legend panels (sector legend and size legend) use a dark elevated panel with light-gray text and borders — fully readable, no dark-on-dark failures anywhere (titles, ticks, legend text, annotation text all confirmed light-on-dark).
      Data: Same four sector colors as the light render — green, purple, blue, tan — confirmed identical hues; only the chrome (background, text, grid, legend frames, annotation halos) flipped for the dark theme, matching the "identical data colors across themes" requirement.
