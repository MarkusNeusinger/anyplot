      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "Tech Sector Landscape · bubble-basic · python · matplotlib · anyplot.ai" in dark ink at top, clearly readable and comfortably sized (fontsize scaled down for the long descriptive-prefixed title, no overflow). X-axis "Annual Revenue ($B)" and Y-axis "Revenue Growth Rate (%)" labels in dark ink, matched in size. Tick labels in soft dark gray, all legible. Subtle horizontal y-axis gridlines plus a slightly heavier zero-line. All spines removed (minimal-chrome). Sector legend (upper right) and a separate inset "Market Cap" size-reference legend (lower left) both use elevated off-white panels with dark ink text — fully readable.
      Data: ~66 bubbles colored by sector using the first four Imprint palette hues (green #009E73 Cloud/SaaS, purple E-Commerce, blue Semiconductors, tan Social Media), sized by market cap (area-scaled) with alpha=0.65 transparency to manage overlap. Three annotated callouts point to notable outliers with dark-ink bold text and white-halo outlines for contrast.
      Legibility verdict: PASS — all text is clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Same title, axis labels and tick labels now rendered in light ink/soft light gray, clearly visible against the dark background. Gridlines and zero-line remain subtle but visible. Both legend panels (Sector, Market Cap) use a dark elevated panel background with light ink text and soft-gray borders — no dark-on-dark failures observed anywhere (titles, ticks, legend text, annotation labels are all light-colored and readable).
