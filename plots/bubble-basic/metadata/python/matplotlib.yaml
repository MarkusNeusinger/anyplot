review:
  strengths:
  - Size legend is a real matplotlib inset_axes panel with three labeled reference
    bubbles, not a text callout — a genuinely library-native technique placed in the
    one clear data gap so it never covers bubbles
  - Imprint palette applied in canonical order (green/lavender/blue/ochre) for the
    four categories, identical across both themes
  - Theme-adaptive chrome is threaded through every element, including bubble edge
    colors keyed to PAGE_BG for depth/separation in both themes
  - Title fontsize computed via the length-scaling formula so the long mandated title
    with descriptive prefix fits without overflow or clipping
  - Realistic, well-differentiated retail dataset (four categories with distinct price/quality/volume
    distributions) that reads as a coherent portfolio story
  weaknesses:
  - The low-price cluster (roughly $0-150, dominated by Kitchenware) has many overlapping
    mid-to-large bubbles that merge into an indistinct mass even at alpha=0.62 — individual
    bubbles are hard to distinguish there; reduce alpha further and/or narrow the
    size range for that density to keep it readable
  - Design is polished but not yet at full publication-level sophistication (DE-01)
    — a stronger focal-point technique (e.g. one annotated standout bubble) would
    sharpen the storytelling beyond color/size hierarchy alone
  - Library usage is correct and idiomatic (Axes API, inset_axes) but stays fairly
    generic beyond the inset legend — could lean further into matplotlib-distinctive
    capabilities for a higher Library Mastery score
  image_description: |-
