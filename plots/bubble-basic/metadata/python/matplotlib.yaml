review:
  strengths:
  - Hand-built size legend on a real `inset_axes` panel from `mpl_toolkits.axes_grid1`,
    with a theme-adaptive elevated background and frame, placed in the one empty data
    region (high price, low quality) so it covers no bubbles in either render
  - Bubble area encoded through matplotlib's native `s=` area semantics combined with
    alpha 0.5 and 0.8 pt page-colored outlines, so the dense Kitchenware cluster around
    $50-$90 stays individually readable in both themes
  - Log-scaled price axis with `NullLocator` minor ticks and a `FuncFormatter` dollar
    format, which spreads the right-skewed $8-$1,200 price range evenly across the
    canvas instead of crushing the low-price categories into a clump
  - Full theme-adaptive chrome threaded through both renders - page and elevated backgrounds,
    ink tokens for title, axis labels, ticks, grid and both legend frames - with identical
    Imprint data hues in light and dark
  - 'First categorical series is #009E73 with Imprint positions 2-4 in canonical order
    for the remaining three categories, and both legends label the encodings in their
    own units (Product Category, Sales Volume in K units)'
  - Explicit per-category bargain/flagship pairs derived from each category's own
    mean and standard deviation, so every category visibly spans its realistic price
    and quality range instead of relying on the draw
  weaknesses:
  - 'VQ-02, VQ-05 (both): in the size legend the "120K units" label runs into and
    about 5 px past the panel''s right spine (text pixels reach x=2600, spine at x=2595-2598)
    and the trailing "s" is bisected by the frame line -> keep the label fully inside
    the panel, by widening the inset to about 24% or moving the text to x~0.50. Likely
    cause: `legend_ax.text(0.55, y, ...)` inside a `width="20%"` inset.'
  - 'SC-02 (both): the bubble-size ramp `(v / v.max()) * 380 + 25` makes area affine
    rather than proportional, so 15K -> 120K is 8x the value but only 5.5x the area
    (69 -> 376 pt^2) and small bubbles read too large -> scale area proportionally
    with a smaller floor, about `(v / v.max()) * 395 + 10`. Likely cause: the +25
    minimum-area offset in `size_scaled`.'
  - 'Suggestion: the size-legend reference circles use the neutral grey INK_MUTED
    while the data marks carry the four Imprint category hues; drawing them in the
    brand green would tie the glyphs more directly to the marks they explain.'
  - 'Suggestion: the reference circles'' outline is set to PAGE_BG although they sit
    on the ELEVATED_BG panel surface, so each ring reads as a faint halo; matching
    the outline to the panel background would be tidier.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white #FAF8F1 across figure and axes (sampled (250,248,241)) — not pure white.
      Chrome: Title "Retail Product Portfolio · bubble-basic · python · matplotlib · anyplot.ai" in dark ink, spanning roughly 68% of the canvas width, fully inside the canvas with no clipping. X-axis label "Retail Price ($, log scale)" and Y-axis label "Customer Quality Rating (1–10)" in dark ink; tick labels ($10 / $30 / $100 / $300 / $1,000 and 2 / 4 / 6 / 8 / 10) in soft dark grey. Horizontal gridlines only, faint but visible; all spines removed and tick marks suppressed. Two panels: the "Product Category" legend upper right and a "Sales Volume" inset-axes size legend lower right, both on the elevated off-white surface (#FFFDF6) with dark-grey frames and bold dark titles. Defect noted: inside the size legend the "120K units" label runs into and about 5 px past the panel's right frame line (text pixels reach x=2600, spine at x=2595–2598), so the trailing "s" is bisected by the border.
      Data: 98 bubbles in four Imprint hues — Electronics #009E73 (first series, brand green), Furniture #C475FD lavender, Kitchenware #4467A3 blue, Outdoor Gear #BD8233 ochre — at alpha 0.5 with 0.8 pt page-colored outlines. Bubble area encodes sales volume; the dense Kitchenware cluster around $50–$90 overlaps heavily but individual bubbles remain distinguishable through their outlines. The size legend's three reference circles (15K / 60K / 120K units) are neutral grey at the same alpha and outline.
      Legibility verdict: PASS — no light-on-light text; title, both axis labels, all tick labels, both legend titles and all legend entries are clearly readable against the off-white surface.

    Dark render (plot-dark.png):
      Background: Warm near-black #1A1A17 across figure and axes (sampled (26,26,23)) — not pure black.
      Chrome: Same title, now in near-white ink (#F0EFE8), fully readable. Axis labels in light ink; tick labels in soft light grey (#B8B7B0). Gridlines remain faint but visible on the dark surface. Both panels flip to the dark elevated surface (#242420, sampled (36,36,32)) with light-grey frames, light legend body text and near-white bold legend titles. No dark-on-dark failure anywhere — no element renders in near-black on the near-black page. The same "120K units" overflow past the size-legend panel's right frame is present here too.
      Data: Identical Imprint hues to the light render — #009E73, #C475FD, #4467A3, #BD8233 — only the chrome flipped. The bubbles composite darker because alpha 0.5 blends against the dark page instead of the light one, which is inherent to the spec-mandated transparency, not a palette change; every category including the brand green stays clearly visible and separable against #1A1A17.
      Legibility verdict: PASS — all text readable, no dark-on-dark, brand green #009E73 clearly visible.
