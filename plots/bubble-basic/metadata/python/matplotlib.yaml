review:
  strengths:
  - Correct Imprint palette usage in canonical order (Electronics=#009E73, Furniture=#C475FD,
    Kitchenware=#4467A3, Outdoor Gear=#BD8233), identical across both themes
  - Theme-adaptive chrome is fully correct in both renders — no dark-on-dark or light-on-light
    failures anywhere
  - 'Genuine matplotlib-distinctive technique: a real inset_axes panel used as a size
    legend, deliberately placed in the one empty region of the data so it never covers
    bubbles'
  - Log-scale x-axis is a well-reasoned choice for the right-skewed retail price data
    (Kitchenware ~$55 mean vs Furniture ~$680 mean) and is clearly labeled
  - Bubble sizing scales by area (not radius) per the spec's requirement, with alpha=0.5
    to handle overlap and theme-colored edge strokes for definition
  - Data shows all four categories with distinct price/quality/sales-volume distributions,
    plus a clear high/low spread in all three dimensions
  - Clean KISS code structure, reproducible via np.random.seed(42), only necessary
    imports, no fake interactivity
  weaknesses:
  - The 'Premium standout' annotation leader line is routed straight through the interior
    of the 'Product Category' legend box (enters at the left edge, crosses the Furniture
    swatch row, exits at the bottom) in both renders — reroute the leader (e.g. anchor
    xytext further left/below so the line approaches the target bubble from outside
    the legend's bounding box) so it never crosses the legend.
  - Two data bubbles sit directly behind the 'Product Category' legend and are faintly
    visible bleeding through it (framealpha=0.95 is not quite opaque) in both light
    and dark renders — set framealpha=1.0 (or move the legend a few percent further
    right/up to clear the data) so no bubble is visible through the box.
  - 'Design Excellence is solid but not yet ''excellent'' tier: a single annotation
    is the only storytelling device beyond color/size encoding — consider one more
    deliberate emphasis (e.g. a subtle highlight ring or slightly bolder edge on the
    standout bubble) to sharpen the focal point now that the legend overlap is fixed.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "Retail Product Portfolio · bubble-basic · python · matplotlib · anyplot.ai" in dark ink, comfortably sized, not clipped. X-axis label "Retail Price ($, log scale)" and y-axis label "Customer Quality Rating (1–10)" both dark, same fontsize, fully readable. Tick labels ($10...$1,000 log ticks; 2-10 linear ticks) are legible dark-gray text. Subtle y-axis-only horizontal gridlines at low opacity. Two legends: a "Product Category" box (upper right, opaque cream fill, dark border, bold title, colored swatches + labels) and a "Sales Volume" size-legend box (lower right, built via a real inset_axes panel) — both fully inside the canvas, not clipped.
      Data: ~90 bubbles across 4 categories, first series (Electronics) is #009E73 brand green; Furniture lavender, Kitchenware blue, Outdoor Gear ochre — matches Imprint canonical order. Bubble size encodes sales volume (area-scaled), alpha=0.5 with theme-colored edges to handle overlap. One annotated "Premium standout" bubble is called out with a leader line and boxed label.
      Legibility verdict: PASS overall, but flagging two flaws: (1) the "Premium standout" leader line visibly crosses through the interior of the Product Category legend box, and (2) two data bubbles are faintly visible bleeding through the semi-transparent (framealpha=0.95) legend box. Neither makes text unreadable, but both are real visual-polish defects.

    Dark render (plot-dark.png):
