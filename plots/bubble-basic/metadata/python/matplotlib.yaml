      Data: Identical bubble colors and positions to the light render (confirmed — Electronics green, Furniture lavender, Kitchenware blue, Outdoor Gear ochre are pixel-identical hues); only the chrome (background, text, grid, legend frames) flipped as expected.
      Legibility verdict: PASS overall, no dark-on-dark or light-on-light failures found. Same two flaws as the light render apply here too: the annotation leader line crosses the legend interior, and two bubbles are faintly visible through the semi-opaque legend box.
