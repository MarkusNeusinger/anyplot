review:
  strengths:
  - 'Faithful three-dimensional bubble chart: x/y position plus bubble size (population)
    plus optional hue (income tier), covering every spec feature'
  - Dashed lowess trend line (sns.regplot, scatter=False) visualizes the spending-versus-mortality
    relationship as a subtle narrative cue without adding text clutter
  - Bubble area (not radius) is scaled via seaborn's sizes= interpolation, and alpha=0.65
    sits exactly in the spec-recommended 0.5-0.7 range for overlap handling
  - 'Consistent theme-adaptive chrome: correct backgrounds and Imprint palette in
    both renders, legend styled with the elevated-surface tokens and matching edge/alpha
    treatment'
  - Combined hue+size legend is carefully recolored (including the non-tier size-handle
    markers) so swatches stay legible against the elevated panel in both themes
  weaknesses:
  - Within the Low Income and Upper-Middle Income tiers, bubbles cluster tightly and
    overlap heavily; even with alpha=0.65 several same-color bubbles are hard to tell
    apart as individual points
  - Design polish is solid but still close to seaborn's default 'ticks' template in
    feel (grid/spine treatment) - a bit more custom typography or a focal annotation
    would lift Design Excellence further
  - Legend title 'Income Tier / Population (M)' merges two conceptually separate legends
    into a single bold header; a subtler visual separation between the two sub-legends
    would read more clearly (not a legibility failure, just a polish opportunity)
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1-consistent cream), not pure white.
      Chrome: Title "bubble-basic · python · seaborn · anyplot.ai" in dark ink, centered, clearly visible. Axis labels "Healthcare Spending ($ / year)" and "Child Mortality (per 1,000 births)" in dark ink, both readable. Tick labels in softer grey-brown, legible against the cream background. Subtle grid lines on both axes, visible but not competing with data. Legend box (upper right) has a slightly elevated cream fill with a soft border, all text dark and readable.
      Data: First tier (Low Income) uses brand green #009E73, followed by lavender (#C475FD), blue (#4467A3), and ochre (#BD8233) for the remaining three income tiers - canonical Imprint order. Bubble size encodes population, alpha=0.65 with page-background-colored edges to separate overlapping circles. A dashed grey lowess trend line traces the inverse spending/mortality relationship.
      Legibility verdict: PASS - no light-on-light text, all chrome and data clearly distinguishable from the background.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17-consistent), not pure black.
      Chrome: Title and axis labels rendered in light ink (near #F0EFE8), tick labels in a softer light grey, all clearly visible against the dark surface. Grid lines are faint light lines, subtle but present. Legend box uses the elevated dark panel fill (#242420-consistent) with light text and a soft border - fully readable, no dark-on-dark text anywhere.
      Data: Same four colors as the light render (green/lavender/blue/ochre) - the Imprint categorical palette held identical between renders as required, only the chrome flipped. Bubble sizes and alpha are identical; the dashed trend line is now a light-grey dash, still readable against the dark background. Brand green #009E73 remains clearly visible.
      Legibility verdict: PASS - no dark-on-dark failures; every chrome element and all four data colors read clearly against the near-black surface.
