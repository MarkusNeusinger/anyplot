review:
  strengths:
  - Excellent combined hue+size legend implementation with clearly separated 'Income
    Tier' and 'Population (M)' sections
  - 'Correct Imprint palette application in canonical order, first series #009E73'
  - Effective use of a lowess trend line to visually communicate the inverse spending/mortality
    relationship without a text callout
  - Both themes render correctly with identical data colors and properly adapted chrome
  - Clean, idiomatic seaborn code (scatterplot semantic mapping, sns.move_legend,
    sns.regplot)
  - Bubble sizes are area-scaled (via s/sizes) and edge-colored to the page background
    for clean overlap separation
  weaknesses:
  - Low Income tier cluster (top-left) has heavy bubble overlap because its healthcare-spending
    range (50-300) is very narrow relative to bubble size, making several of the 15
    individual data points indistinguishable — widen the spending spread slightly
    or reduce marker size for that tier
  - Dense overlap in that cluster partially obscures the intended showcase of Population
    (M) size variation within the tier
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1.
      Chrome: Title "bubble-basic · python · seaborn · anyplot.ai" is dark and clearly legible; x-axis label "Healthcare Spending ($ / year)" and y-axis label "Child Mortality (per 1,000 births)" are dark and readable; tick labels are soft dark gray, readable; gridlines are faint but visible.
      Data: First series (Low Income) uses #009E73 teal-green, matching the Imprint palette's first position. Lower-Middle Income is lilac/purple, Upper-Middle Income is blue, High Income is tan/amber — all four match the canonical Imprint palette order. Bubbles are semi-transparent (alpha ~0.65) with page-background-colored edges to separate overlapping circles. A dashed gray lowess trend line traces the inverse relationship between spending and mortality. Legend in the upper right cleanly separates "Income Tier" swatches from a "Population (M)" size scale.
