review:
  strengths:
  - 'First categorical series is exactly #009E73 and all four income-tier colors follow
    the Imprint canonical order, with backgrounds correctly themed (#FAF8F1 light
    / #1A1A17 dark) and all chrome (title, ticks, grid, legend frame) properly theme-adaptive
    in both renders'
  - Combined hue+size legend (sns.move_legend + manual handle recoloring so size swatches
    stay INK_SOFT in both themes) is a genuinely idiomatic seaborn feature that would
    take significantly more manual work in most other libraries
  - Bubble sizes are area-scaled via matplotlib's s= parameter (not radius) exactly
    as the spec requires, with edgecolor matched to the page background so overlapping
    bubbles read as distinct discs instead of a muddy blob
  - 'Data tells a clear, real-world-plausible story: four income tiers cluster distinctly
    along the spending axis with population size as a legible third dimension, and
    values (spending $50-$8500/yr, mortality 0.5-97 per 1,000) track real-world development
    statistics closely'
  - Clean KISS script structure with explicit np.random.seed(42), only used imports,
    and correct plot-{THEME}.png output without bbox_inches='tight'
  weaknesses:
  - The smallest bubbles (Population ~1-2M, s~40) are legible at full 3200x1800 resolution
    but will shrink to only a few pixels at the ~400px mobile preview width — consider
    raising the sizes= floor slightly (e.g. 55-900) for the low end.
  - Alpha is set to 0.72, just above the spec's recommended 0.5-0.7 range for handling
    bubble overlap — a touch more transparency (e.g. 0.65) would let the densest low-income
    cluster overlaps read even more clearly.
  - Design Excellence is solid (custom palette, styled legend, subtle grid) but stops
    short of a genuine focal-point callout — e.g. no annotation or trend cue calling
    out the spending-vs-mortality relationship — so Data Storytelling scores 'good'
    rather than 'excellent'.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "bubble-basic · python · seaborn · anyplot.ai" in dark ink, centered, clearly readable. X-axis label "Healthcare Spending ($ / year)" and Y-axis label "Child Mortality (per 1,000 births)" in dark ink, both descriptive with units. Tick labels in a softer dark gray, fully legible. A subtle off-white/light grid (both axes) is visible but not competing with data. Top and right spines removed; left/bottom spines present in a soft ink tone. A legend box in the upper-right, titled "Income Tier / Population (M)", uses an elevated cream fill with a soft border, lists four income-tier color swatches plus four gray size swatches (15/30/45/60) — all text and swatches are clearly legible and do not overlap the data (the bubble cluster sits well below/left of the legend box).
      Data: Four color-coded clusters of bubbles — green (#009E73, Low Income) at low spending/high mortality, lavender/purple (Lower-Middle Income) just to the right, blue (Upper-Middle Income) further right at low-mid mortality, and ochre/tan (High Income) spread across the highest spending values at near-zero mortality. Bubble sizes vary with population, from small dots (~1-2M) to large discs (~60M+); overlapping bubbles use a background-colored edge stroke so overlaps read as distinct discs rather than a solid blob. Overall shape is a clear downward-sloping/inverse relationship between spending and mortality.
      Legibility verdict: PASS — all title, axis, tick, and legend text is clearly readable against the light background; no light-on-light text found.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Title, axis labels rendered in light/off-white ink, clearly legible against the dark background. Tick labels in a lighter soft gray, also legible. Grid lines are a faint light-on-dark tone, subtle as in the light render. Spines follow the same L-shaped (left+bottom only) treatment. The legend box now uses a dark elevated fill (~#242420) with light text for both the income-tier labels and the "Income Tier / Population (M)" title — no dark-on-dark failures observed anywhere (title, axis labels, ticks, and legend text all flip correctly to light ink).
      Data: The four bubble clusters render in identical hex colors to the light version (green #009E73, lavender, blue, ochre) — confirmed data colors are unchanged, only the chrome (background, text, grid, legend fill) flipped to the dark theme.
      Legibility verdict: PASS — no dark-on-dark text; all chrome elements are correctly theme-adaptive and legible.
