review:
  strengths:
  - 'Thoughtful data storytelling: a subtle dashed lowess trend line visualizes the
    inverse healthcare-spending/mortality relationship without needing a text callout.'
  - Correct area-based bubble scaling via seaborn's `sizes=(50, 650)` parameter combined
    with alpha=0.58 to handle overlap, exactly matching the spec's guidance on both
    points.
  - 'Well-crafted combined hue+size legend: custom title, tightened borderpad/labelspacing/handletextpad,
    and size-handle markers explicitly recolored so they stay legible against the
    elevated panel.'
  - Log-scale x-axis with clean custom ticks (100/300/1,000/3,000/8,000) avoids crushing
    the Low Income cluster — smart handling of a spending range that spans two orders
    of magnitude.
  - Theme-adaptive chrome correctly threaded end-to-end through matplotlib rc params
    (background, ink, grid, legend panel); both renders pass legibility and palette
    checks with identical data colors.
  weaknesses:
  - Dataset uses only 60 points (15 per income tier) — the low end of the spec's '50-500
    data points recommended' range; more density, especially within each tier, would
    strengthen feature coverage.
  - The Low Income cluster near $90-150/year has several bubbles heavily stacked;
    alpha=0.58 helps but individual bubble boundaries are still hard to fully disambiguate
    in that region.
  - The Population size legend only shows ticks up to 50 despite the underlying data
    being clipped to a 10-100 range, so the very largest bubbles on the canvas aren't
    represented by any legend tick (minor — seaborn's 'brief' legend auto-selects
    from realized data quantiles, not the sizes= scale bounds).
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1, clearly not pure white and not dark.
      Chrome: Title "bubble-basic · python · seaborn · anyplot.ai" in dark ink, fully legible and centered at ~43% of plot width. X-axis label "Healthcare Spending ($ / year)" and y-axis label "Child Mortality (per 1,000 births)" both dark ink, clearly readable. Log-scale x tick labels (100/300/1,000/3,000/8,000) and y tick labels (0-140) are soft gray, legible. Legend box (upper right) has an elevated cream fill with a bold dark title "Income Tier / Population (M)" and readable dark entry labels.
      Data: First series (Low Income) renders in Imprint green #009E73; Lower-Middle Income in purple, Upper-Middle Income in blue, High Income in amber — canonical Imprint palette order. Bubbles use alpha≈0.58 with page-background-colored edges, so overlapping bubbles remain visually separable via faint ring outlines. A dashed gray lowess trend line traces the inverse spending/mortality relationship across the full x-range.
      Legibility verdict: PASS — all text is dark against the light background, no light-on-light issues found.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17, clearly not pure black and not light.
      Chrome: Title, axis labels, and tick labels all render in light ink (near-white for title/axis labels, soft light gray for ticks), fully legible against the dark surface. Legend panel switches to a dark elevated fill with light title/entry text — no dark-on-dark failures observed anywhere (title, axis labels, ticks, legend text all pass).
      Data: Confirmed identical to the light render — same green/purple/blue/amber bubble colors, same positions and sizes, same lowess trend line. Only the chrome (background, text, grid, legend panel) flipped between themes as expected.
      Legibility verdict: PASS — all text is light against the dark background, no dark-on-dark issues found; brand green #009E73 remains vivid and distinguishable on the dark surface.
