review:
  strengths:
  - 'Correct Imprint palette in canonical order across the 4 income-tier categories,
    first series #009E73, and identical data colors between the light and dark renders.'
  - Theme-adaptive scatter edge color (edgecolor=PAGE_BG instead of a hardcoded white)
    gives overlapping bubbles a clean halo in both themes.
  - A subtle dashed lowess trend line (sns.regplot) gives the chart a clear narrative
    (inverse healthcare-spending / child-mortality relationship) without cluttering
    it with text annotations.
  - Categorical (Income Tier, via color) and continuous (Population, via size) legends
    are combined cleanly into a single themed legend box via sns.move_legend.
  - Explicit, well-tuned font sizes throughout (length-scaled title, 10pt axis labels,
    8pt ticks/legend) with no clipping or overflow in either render.
  weaknesses:
  - 'Dark-mode population-size legend swatches are nearly invisible: the code comment
    claims ''override colors so they''re visible in dark mode'' via handle.set_facecolor(INK_SOFT)/set_edgecolor(INK_SOFT)
    inside a try/except AttributeError, but in plot-dark.png the ''15/30/45/60'' size-legend
    circles render as near-black (~RGB 45,45,43) against the near-black elevated legend
    box (~RGB 37,37,33) - virtually indistinguishable except for a faint rim, contradicting
    the code''s own intent. Verify the handle type the seaborn size-legend actually
    returns (print/inspect legend.legend_handles) and confirm set_facecolor/set_edgecolor
    actually applies - e.g. use plt.setp(legend.legend_handles, ...) or iterate only
    the non-tier handles with a guaranteed-supported setter.'
  - Data point count (48 total, 12 per income tier) sits slightly below the spec's
    recommended 50-500 range, and the Population(M) size-variable's underlying values
    (~1 to ~200) exceed the spec's recommended 10-100 size-variable range - widen
    the per-tier sample count slightly and rescale the population column to better
    match the suggested band while keeping realistic proportions.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 - not pure white.
      Chrome: Title "bubble-basic · python · seaborn · anyplot.ai" in dark ink, centered, fully visible with no clipping. X-axis label "Healthcare Spending ($ / year)" and Y-axis label "Child Mortality (per 1,000 births)" both in dark ink, similar size. Tick labels in soft gray, all readable. A legend box in the upper right ("Income Tier / Population (M)") sits on an elevated cream panel with a soft gray border, listing 4 income-tier color swatches and 4 gray population-size reference bubbles (15/30/45/60), all legible against the cream legend background.
      Data: Bubbles colored by income tier - green (Low Income), lavender (Lower-Middle Income), blue (Upper-Middle Income), ochre (High Income) - first series is the Imprint brand green #009E73 as required. A dashed gray lowess trend line curves from the high-mortality/low-spending cluster down to the low-mortality/high-spending cluster, visually reinforcing the inverse relationship. Bubble sizes vary noticeably by population, with semi-transparent fills (alpha ~0.65) and page-background-colored edges giving overlapping bubbles clean separation.
      Legibility verdict: PASS - all text and data elements are clearly readable against the light background.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 - not pure black.
      Chrome: Title, axis labels, and tick labels have all flipped to light ink/soft-light-gray and remain fully readable against the dark background - no dark-on-dark text failures. The legend box now sits on the dark elevated panel (#242420) with light text and a light-gray border, matching the theme.
      Data: The four income-tier bubble colors are identical to the light render (green/lavender/blue/ochre unchanged), confirming correct theme-adaptive-chrome-only behavior for the categorical data. However, the four gray "Population (M)" size-legend reference bubbles (15/30/45/60) are a near-black gray that blends almost completely into the near-black legend panel - only a faint rim outline distinguishes them from the background, undermining the size legend's purpose in this theme (see weaknesses).
      Legibility verdict: FAIL for the population-size legend swatches specifically (near-invisible fill against the dark legend panel) - all other text/chrome elements PASS.
