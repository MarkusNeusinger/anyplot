review:
  strengths:
  - Lowess trend line (sns.regplot, scatter=False) makes the inverse spending/mortality
    relationship immediately visible, adding real data storytelling beyond a plain
    scatter.
  - Log-scale x-axis correctly handles the two-order-of-magnitude spread in spending,
    spacing all four income tiers evenly instead of crushing low-income countries
    into a sliver.
  - Combined hue+size legend cleanly explains both encodings under one custom title,
    with theme-adaptive marker edge coloring (edgecolor=PAGE_BG) for cleaner overlap
    separation.
  - 'Perfect Imprint palette compliance: canonical order, first series #009E73, identical
    data colors across themes, correct theme-adaptive chrome (background/text/grid/legend)
    in both renders.'
  - Clean, reproducible KISS code with explicit font sizing throughout and a canvas-safe
    save (no bbox_inches='tight'), matching the seaborn canvas hard rule exactly.
  weaknesses:
  - Low-income cluster (spending ~$80-120) has several overlapping bubbles that read
    as a congested blob despite alpha=0.65 — slightly more jitter/spread or a lower
    alpha would separate the outlines further.
  - Legend box occupies a fairly large share of the upper-right canvas; tightening
    its padding would improve overall layout balance.
  - Data storytelling relies entirely on implicit visual hierarchy (trend line + color);
    the extreme outlier bubble at ~150 child mortality has no callout, so its anomaly
    isn't explained to the viewer.
  image_description: |-
