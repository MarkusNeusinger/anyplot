      Data: Log-scale x-axis with four income-tier bubble clusters colored green (#009E73, Low Income), lavender (Lower-Middle), blue (Upper-Middle), and ochre (High Income) — canonical Imprint order, first series correctly #009E73. Bubble size encodes population, alpha=0.65 with page-background-colored edges handles overlap. A dashed gray lowess trend line traces the inverse spending/mortality relationship across all points.
      Legibility verdict: PASS — no light-on-light text anywhere.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Title, axis labels rendered in light off-white ink, clearly legible; tick labels in light gray, all readable; grid lines subtle and visible; legend box has a dark elevated fill (#242420-like) with light, readable text and a soft border — no dark-on-dark failures observed anywhere (title, ticks, legend all correctly flipped to light ink).
      Data: Identical bubble colors to the light render — green #009E73, lavender, blue, ochre — confirming the categorical data colors are unchanged between themes; only chrome (background, text, grid, legend fill) flipped as expected. Trend line and overall layout match the light render exactly.
