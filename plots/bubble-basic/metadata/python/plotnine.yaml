review:
  strengths:
  - Background-colored bubble stroke creates a subtle halo effect that visually separates
    overlapping bubbles without adding visual noise
  - Correct use of scale_size_area with an explicit limits=(0, 100) floor anchor,
    so bubble area scales accurately and the smallest values stay visible
  - override_aes on the size legend correctly gives the legend glyphs a visible ink-colored
    fill/stroke instead of inheriting the page-background stroke
  - Trend line and insight-driven subtitle give the chart a clear narrative point
    instead of a flat scatter of dots
  - Both renders are fully theme-correct with no legibility failures
  weaknesses:
  - Library Mastery is solid but fairly standard for a bubble chart; a more distinctive
    plotnine-specific technique (e.g. geom_smooth with a per-region confidence ribbon)
    would push it further
  - 'Minor headroom on VQ-01: tick label weight is a touch light relative to axis
    titles at very small preview sizes'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white, not dark.
      Chrome: Title "bubble-basic · python · plotnine · anyplot.ai" and subtitle in dark ink, axis titles/tick labels in dark/soft-ink, legend text in soft-ink — all clearly readable against the light background.
      Data: Four region colors (Asia-Pacific green #009E73, Europe purple, Americas blue, Middle East & Africa tan) mapped via scale_fill_manual; bubble size mapped to Population via scale_size_area; dark gray OLS trend line visible. First series is #009E73 as required.
