review:
  strengths:
  - Uses scale_size_area (not scale_size) so bubble size scales by area, exactly matching
    the spec's explicit 'scale by area not radius' requirement
  - alpha=0.65 transparency on markers handles overlapping bubbles cleanly, matching
    the spec's recommended 0.5-0.7 range
  - A geom_smooth(method='lm') trend layer overlaid in INK_SOFT (excluded from the
    legend via inherit_aes=False) adds real data storytelling — showing the GDP-vs-life-expectancy
    correlation across regional clusters
  - Custom $Xk axis-tick formatter and descriptive, unit-bearing axis titles improve
    readability over raw numeric ticks
  - 'Both renders are fully theme-adaptive: warm off-white / warm near-black backgrounds,
    correct INK/INK_SOFT chrome tokens, and identical Imprint data colors across light
    and dark'
  - Region categories (abstract groups) correctly use canonical Imprint palette order
    with Asia-Pacific as the first (green) series
  - Reproducible via a single np.random.seed(42), clean KISS script with no unused
    imports or fake UI elements
  weaknesses:
  - The Population (M) size legend appears to render only the 10 and 25 breaks; the
    smallest configured break (2) is not clearly distinguishable in the guide, which
    weakens the size legend's ability to explain the low end of the bubble scale
  - The smallest-population bubbles (values near the low end of the 1-35 clipped range)
    shrink to near-pinpoint dots in dense clusters (e.g. small purple dots around
    $30k/77yr and $57k/86yr) — bump the size floor slightly so the minimum bubble
    stays clearly visible per the spec's 'ensure minimum bubble size is visible' note
  - The size-encoded data column (population, clipped to roughly 1-35) sits below
    the spec's recommended 10-100 value range for the size variable — consider rescaling
    population (e.g. to hundreds of thousands or a different unit) so raw values land
    closer to the recommended band
  - Legend box keeps a solid border frame (legend_background element_rect with color=INK_SOFT);
    the style guide's decoration-removal checklist suggests dropping box frames around
    legends when the elevated background alone is enough to separate it from the plot
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "bubble-basic · python · plotnine · anyplot.ai" in dark ink at top, clearly legible; X-axis title "GDP per Capita (USD thousands)" and Y-axis title "Life Expectancy (years)" in dark ink; tick labels ($10k-$80k, 60-90) in a softer gray, all readable; subtle horizontal-only gridlines; L-shaped axis frame (left+bottom only, no top/right spines); legend box (Population size + Region color) sits on a slightly lighter elevated panel with a thin border, fully legible.
      Data: Bubbles colored by region — green (Asia-Pacific), lavender (Europe), blue (Americas), ochre (Middle East & Africa) — the first series (Asia-Pacific) is Imprint brand green #009E73 as required. A dark gray linear trend line runs diagonally through the cloud. Bubble size encodes population, scaled by area; alpha=0.65 lets overlapping bubbles remain distinguishable.
      Legibility verdict: PASS — all text is clearly readable against the light background; no light-on-light issues found.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Same title and axis titles now rendered in light ink (near-white), tick labels in a lighter soft gray, both clearly visible; gridlines and axis frame use the same soft tones adapted for the dark surface; legend box background lightens to the dark "elevated" tone with a visible border, text fully legible.
      Data: Confirmed identical Imprint colors to the light render — same green/lavender/blue/ochre region colors and gray trend line — only the chrome (background, text, grid, legend frame) flips between themes, exactly as required.
      Legibility verdict: PASS — no dark-on-dark failures; all title, axis, tick, and legend text is clearly visible against the near-black background.
