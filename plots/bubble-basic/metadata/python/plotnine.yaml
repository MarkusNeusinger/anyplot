review:
  strengths:
  - Bubble size is mapped by area via scale_size_area (not radius), with limits=(0,
    100) anchoring the sqrt-area formula to a true zero baseline instead of the data's
    own min — exactly what the spec's 'scale by area, not radius' note asks for.
  - Alpha=0.65 transparency correctly handles overlapping bubbles per the spec's recommendation,
    and fixing geom_point(color=PAGE_BG) gives every bubble a subtle halo that separates
    it from overlapping neighbors.
  - Fully theme-adaptive chrome — background, ink, grid, axis line and legend colors
    all read cleanly in both light and dark renders, and the four Imprint-palette
    region colors are pixel-identical between themes.
  - A geom_smooth(method='lm') trend line reinforces the subtitle's claim ('Higher
    GDP per capita tracks with longer life expectancy') without cluttering the chart,
    adding real data-storytelling value.
  - Title format, axis units (USD thousands, years), and the optional region color-coding
    beyond the spec's required x/y/size are all handled correctly.
  weaknesses:
  - 'The ''Population (M)'' size legend renders as empty key boxes in BOTH themes
    — no bubble glyph is visible next to the 20/50/90 labels, so the size-to-value
    mapping the spec explicitly requires (''Include a size legend to explain bubble
    scaling'') is illegible. Likely cause: geom_point(color=PAGE_BG) is a fixed (unmapped)
    aesthetic applied to every point, including the size-legend''s key glyphs; since
    ''fill'' is mapped only to ''region'' (a separate guide), the size-only legend
    key falls back to a glyph whose edge/stroke is PAGE_BG, which then blends into
    the PAGE_BG legend_key background, leaving nothing visible. Fix: give the size-legend
    key glyphs a visible outline distinct from legend_key''s background — e.g. drop
    the PAGE_BG stroke override for a neutral INK_SOFT edge, or override the size
    guide''s key aesthetics explicitly (guide_legend(override_aes=dict(...))) so the
    reference circles actually render.'
  - Because the size legend is non-functional, SC-02 (Required Features) and SC-04
    (Title & Legend) both take a hit even though the size-to-data mapping itself (scale_size_area)
    is implemented correctly in the plot area.
  - The largest cluster of overlapping brown (Middle East & Africa) bubbles around
    $10-20k GDP is dense enough that individual bubble boundaries become hard to distinguish,
    even with the halo stroke and alpha blending — minor VQ-02 crowding, not a legibility
    failure.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Dark title "bubble-basic · python · plotnine · anyplot.ai" and grey subtitle are both crisp against the light background; axis titles ("GDP per Capita (USD thousands)", "Life Expectancy (years)") and tick labels ($10k-$80k, 60-90) are dark/soft-dark and clearly legible; gridlines are faint but visible horizontal/vertical lines. Region legend (Asia-Pacific/Europe/Americas/Middle East & Africa) shows four clearly visible filled circles in the Imprint palette colors. The "Population (M)" size legend, however, shows only the 20/50/90 tick labels with NO visible bubble/circle glyph next to them — the key boxes appear empty.
      Data: Four bubble color groups map to the Imprint palette — Asia-Pacific = #009E73 (green, first series, correct), Europe = purple/lilac, Americas = blue, Middle East & Africa = tan/brown. Bubbles vary visibly in size (area-scaled) and overlap with alpha-blended transparency plus a light-background-colored halo stroke. A grey linear trend line runs diagonally through the cloud.
      Legibility verdict: PASS for all title/axis/tick text and the region legend; FAIL for the size legend's key glyphs — the reference circles for 20/50/90 are not visible in this render.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Title and subtitle switch to white/light-grey text, clearly readable against the dark background; axis titles and tick labels are light-toned and legible; no dark-on-dark failures observed — all text and the trend line (light grey) are readable. Gridlines remain subtle but visible. Region legend circles remain clearly visible with the same four hues as the light render.
      Data: Bubble fill colors are identical to the light render (same Imprint hues per region), confirming only chrome flipped between themes as required. Same overlap/alpha/halo treatment as light render.
      Legibility verdict: PASS for all title/axis/tick text and the region legend; FAIL for the size legend's key glyphs — same invisible-bubble issue as the light render, confirming it's a rendering/legend-configuration bug rather than a theme-specific contrast problem.
