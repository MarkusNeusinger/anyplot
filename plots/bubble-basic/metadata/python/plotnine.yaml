review:
  strengths:
  - Correctly implements area-based bubble sizing via scale_size_area with limits=(0,100)
    anchoring to a true zero baseline, exactly matching the spec's 'scale by area,
    not radius' requirement
  - Per-region geom_smooth trend lines (inherit_aes=False, show_legend=False) add
    genuine data storytelling — each region's own GDP-to-life-expectancy slope is
    visible instead of a single flattened trend
  - 'Thoughtful legend engineering: guide_legend(override_aes=...) gives the size-legend
    keys a visible INK_SOFT fill/edge so they don''t blend into the legend background,
    since geom_point''s fixed color=PAGE_BG stroke would otherwise render them as
    empty boxes'
  - Correct Imprint palette usage in canonical order (green/lavender/blue/ochre) with
    identical data colors across light and dark renders, and fully theme-adaptive
    chrome (backgrounds, text, grid, legend box)
  - Clean KISS structure with explicit font sizes throughout, np.random.seed(42) for
    reproducibility, and no unused imports
  weaknesses:
  - Bubble alpha is 0.45, below the spec's recommended 0.5-0.7 range for handling
    overlap — the densest cluster (Middle East & Africa, ~$15-20k GDP) still reads
    as a partially merged blob rather than clearly separable bubbles
  - Title occupies only ~40% of the plot-area width at the current fontsize (12pt),
    below the ~50-70% comfortable range for a short custom title — a slightly larger
    title fontsize would improve visual balance
  - The wide geom_smooth confidence bands (especially the Europe/lavender band) overlap
    several data points, adding some visual clutter in already-dense regions
  - Right-side legend column has noticeable unused vertical whitespace below the Region
    legend — could be tightened or the legend moved for slightly better canvas utilization
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matching #FAF8F1 — not pure white, not dark.
      Chrome: Title "bubble-basic · python · plotnine · anyplot.ai" and subtitle "Each region's own GDP-to-life-expectancy trend, with population size layered on top" render in dark ink, clearly legible. Axis titles ("GDP per Capita (USD thousands)", "Life Expectancy (years)") and tick labels ($10k-$80k, 60-90) are dark/soft-dark and fully readable. Legend ("Population (M)" size key with 20/50/90 reference bubbles in a solid dark fill, and "Region" color key listing Asia-Pacific, Europe, Americas, Middle East & Africa) sits on a slightly elevated cream panel and is legible. Grid lines are faint horizontal/vertical off-white-on-cream lines, subtle but visible.
      Data: Four bubble clusters colored green (#009E73, Asia-Pacific), lavender (#C475FD, Europe), blue (#4467A3, Americas), and ochre (#BD8233, Middle East & Africa), each with a matching linear trend line and a light confidence band. Bubble sizes scale with population. First categorical series is confirmed as brand green #009E73.
      Legibility verdict: PASS — all text reads clearly against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, matching #1A1A17 — not pure black, not light.
      Chrome: Title, subtitle, axis titles, and tick labels all render in light/off-white ink (INK / INK_SOFT tokens), clearly legible against the dark surface. Legend panel switches to the elevated dark fill (#242420) with light text, and the size-legend key circles remain visible due to the override_aes fill/edge fix (INK_SOFT), rather than disappearing into the legend background. Grid lines are faint light-on-dark, subtle but present.
      Data: Colors are pixel-identical to the light render (same green/lavender/blue/ochre hues and trend lines) — only the chrome (background, text, grid, legend panel) flips as expected.
      Legibility verdict: PASS — no dark-on-dark failures observed; every title, axis label, tick label, and legend entry stays clearly readable against the near-black background.
