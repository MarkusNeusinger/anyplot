review:
  strengths:
  - Correct area-based size scaling (scale_size_area) with explicit limits=(0, 100)
    anchoring to a true zero baseline, matching the spec's 'scale by area, not radius'
    requirement
  - Sophisticated per-region geom_smooth trend layer (inherit_aes=False, show_legend=False)
    revealing each region's own GDP-to-life-expectancy slope instead of one pooled
    trend line — strong data storytelling and library mastery
  - Halo technique (geom_point color=PAGE_BG, stroke=0.5) separates overlapping bubbles
    without a heavy outline, paired with guide_legend(override_aes=...) so the size-legend
    glyphs stay visible against the legend background in both themes
  - 'Full theme-adaptive chrome: spines removed, subtle grid, correct warm off-white/near-black
    surfaces, and the first-series Imprint green is pixel-identical across light and
    dark renders'
  - Realistic, appropriately scaled cross-region dataset (GDP per capita, life expectancy,
    population) with clean, minimal, reproducible code (seeded RNG, no unused imports)
  weaknesses:
  - 'Dense overlap in the lower-middle cluster: the large Middle East & Africa bubble
    around $15-20k GDP stacks on top of several smaller bubbles, nearly obscuring
    a couple of them despite the alpha and halo edge — consider a touch more transparency
    or slight jitter in that crowded region'
  - The four regression confidence bands (especially Asia-Pacific vs. Americas) overlap
    across a wide x-range, adding some visual noise — a slightly lower ribbon alpha
    would sharpen the per-region separation
  - '''Middle East & Africa'' bundles two distinct sub-regions into a single label
    — a common demographic-dataset convention and not controversial, but worth a more
    precise split if the repair loop wants to tighten Data Quality further'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1), matches the required light-theme surface.
      Chrome: Title "bubble-basic · python · plotnine · anyplot.ai" and subtitle in dark ink at top-left, both fully visible with no clipping. Axis titles ("GDP per Capita (USD thousands)", "Life Expectancy (years)") and tick labels ($10k-$80k, 60-90) render in dark/soft-dark ink against the light background — all clearly legible. Legend on the right ("Population (M)" size key with 20/50/90 reference circles, "Region" color key with Asia-Pacific/Europe/Americas/Middle East & Africa) is fully readable with a slightly elevated card background.
      Data: Four regions rendered as translucent bubbles (alpha ~0.65) sized by population and colored by region using the Imprint palette — Asia-Pacific is #009E73 (first series, correct), Europe is purple, Americas is blue, Middle East & Africa is amber/brown. A linear trend line with confidence ribbon is layered per region, showing distinct upward GDP-vs-life-expectancy slopes for each cluster.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17), matches the required dark-theme surface.
      Chrome: Title and subtitle render in light ink, fully visible against the dark background. Axis titles and tick labels use light/light-gray ink and are clearly legible with no dark-on-dark issues. Legend text and titles are light-colored against a slightly elevated dark card, fully readable — no black-on-black text found anywhere.
      Data: Same four bubble colors and sizes as the light render — Asia-Pacific green (#009E73), Europe purple, Americas blue, Middle East & Africa amber — confirmed pixel-identical to the light render; only the chrome (background, grid, text, legend card) flipped to dark. Trend lines and confidence ribbons remain visible against the dark surface.
      Legibility verdict: PASS
