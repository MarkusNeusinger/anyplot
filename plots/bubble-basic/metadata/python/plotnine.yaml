review:
  strengths:
  - Bubble size uses scale_size_area with an explicit limits=(0, 100) zero-anchor,
    avoiding the classic radius-vs-area misperception bug and keeping the smallest
    floor-clipped bubbles visible
  - Subtitle plus a subtle geom_smooth trend line gives the chart a clear narrative
    ("higher GDP tracks with longer life expectancy") without cluttering the data
    layer
  - Theme-adaptive chrome is threaded correctly through every element (title, subtitle,
    axis text, legend key/background, grid) and both renders are legible with no dark-on-dark
    or light-on-light failures
  - Categorical color uses the Imprint palette in canonical order for the four abstract
    regions, consistent across light and dark
  - Alpha (0.65) and stroke are tuned for the ~72-point overlapping bubble density,
    and the size legend clearly documents the scale
  weaknesses:
  - Grid is y-axis only (panel_grid_major_x = element_blank()); the style guide recommends
    both axes for scatter/bubble plots — consider a very subtle x-axis grid to match
    convention
  - geom_point stroke=0.4 has no explicit theme-adaptive edge color, so overlapping
    bubbles rely solely on alpha rather than the style guide's suggested white/ink
    edge highlighting for extra separation in the densest cluster (Middle East & Africa,
    bottom-left)
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1, not pure white.
      Chrome: Title "bubble-basic · python · plotnine · anyplot.ai" in dark ink, storytelling subtitle in softer grey below it, axis titles ("GDP per Capita (USD thousands)", "Life Expectancy (years)") in dark ink, tick labels and legend text in softer grey — all clearly readable against the light background.
      Data: Four regions colored with Imprint palette positions 1-4 (green Asia-Pacific, lavender Europe, blue Americas, ochre Middle East & Africa), bubble size encodes population, a thin grey diagonal trend line shows the GDP-vs-life-expectancy relationship. First series is the brand green #009E73.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
