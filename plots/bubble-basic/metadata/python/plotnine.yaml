review:
  strengths:
  - Trend line (geom_smooth, lm) overlays the GDP/life-expectancy correlation, giving
    the chart an immediate storytelling focal point beyond a raw scatter
  - scale_size_area correctly scales bubble area (not radius) as the spec requires,
    with a clear 'Population (M)' size legend (15/40/80 breaks)
  - 'Theme-adaptive chrome is threaded through consistently: both renders use the
    correct #FAF8F1/#1A1A17 backgrounds, INK/INK_SOFT text tokens, and identical Imprint
    data colors across light and dark'
  - 'First categorical series (Asia-Pacific) is the mandated brand green #009E73,
    remaining regions follow canonical Imprint order'
  - 'Clean, idiomatic ggplot-style composition: single aes() mapping x/y/size/color,
    layered geoms, explicit font sizes throughout theme()'
  weaknesses:
  - A handful of bubbles (smallest population values, clipped to the spec's 10 floor)
    render as near-invisible pinprick dots (2-4px) in both themes -- e.g. an isolated
    tiny orange dot near GDP ~$18k/life-expectancy ~77 and a tiny purple dot near
    GDP ~$40k/life-expectancy ~79. Spec explicitly asks to 'ensure minimum bubble
    size is visible.' Raise the effective minimum size, e.g. via scale_size_area(max_size=18)
    combined with a higher size floor when generating the population data (clip to
    ~18-100 instead of 10-100), or add a minimum rendered radius so the smallest points
    stay clearly legible.
  - 'Design Excellence is good but not yet publication-tier: grid/spine refinement
    (DE-02) and data storytelling (DE-03) could go further -- e.g. direct-label the
    trend line or the outlier regions, or lighten the panel_grid_major_x grid choice
    further since it''s already off; consider a subtitle or annotation calling out
    the GDP/life-expectancy relationship to sharpen the insight.'
  - Legend title 'Population (M)' and 'Region' plus their entries are all at the same
    8pt scale as tick labels -- fine for legibility now, but with the near-invisible
    small bubbles noted above the size-legend's smallest circle (15) doesn't clearly
    telegraph that raw data goes as low as 10, worth double-checking the legend breaks
    still bracket the actual data range after adjusting the size floor.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1), consistent across the full canvas including the legend panel.
      Chrome: Title "bubble-basic · python · plotnine · anyplot.ai" in dark ink, centered, fully visible, no clipping. Axis titles "GDP per Capita (USD thousands)" and "Life Expectancy (years)" in dark ink, tick labels in a slightly softer gray -- all clearly readable. A subtle horizontal-only gridline (~15% alpha) sits behind the data without competing. A dark-gray linear trend line cuts diagonally through the cloud of points, readable against the light background. Region and Population(M) legends sit to the right of the plot, fully inside the canvas with a lightly elevated panel fill.
      Data: Bubbles are colored by region (Asia-Pacific = brand green #009E73, Europe = lavender, Americas = blue, Middle East & Africa = ochre/tan) at ~0.65 alpha so overlaps read as slightly darker blends rather than occlusion. Bubble size encodes population area-proportionally per scale_size_area. Most bubbles are comfortably sized and legible; a small number of the lowest-population bubbles (clipped to the spec's floor of 10) render as barely-visible 2-4px pinpricks (e.g. near GDP ~$18k/life-expectancy ~77 and near GDP ~$40k/life-expectancy ~79) -- these are a legibility weakness, flagged below.
      Legibility verdict: PASS (all text readable; a few data markers are near-invisible, which is a VQ-03 sizing issue, not a text-legibility failure)

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17), matching the light render's structure but flipped chrome.
      Chrome: Title, axis titles, and tick labels all render in light ink/off-white tones -- clearly readable against the dark background, no dark-on-dark anywhere. The trend line switches to a light gray, remaining visible against the dark panel. Gridlines are a faint light overlay, subtle but present. Legend panel background is a lightly elevated dark tone, text is light and legible.
      Data: Identical Imprint hues to the light render (brand green #009E73 first, same lavender/blue/ochre mapping for the other three regions) -- confirmed unchanged between themes; only the chrome flipped as required. The same handful of near-invisible smallest bubbles are present here too (same underlying data), equally hard to see against the dark background.
      Legibility verdict: PASS (no dark-on-dark text failures; same VQ-03 marker-size weakness as the light render, not a legibility failure)
