review:
  strengths:
  - Correct Imprint palette usage (green/lavender/blue/ochre, canonical positions
    1-4) identical between light and dark renders
  - Per-region geom_smooth trend lines with confidence bands add genuine data storytelling
    about the GDP-to-life-expectancy relationship per region
  - scale_size_area with limits=(0, 100) correctly anchors bubble area scaling to
    a true zero baseline, and override_aes gives the size-legend keys a visible fill
    instead of blending into the legend background
  - All font sizes explicitly set via theme() matching style-guide starting values,
    legible in both themes
  - Both renders pass the light/dark theme-readability check with no dark-on-dark
    or light-on-light text
  - Descriptive axis labels with units ("GDP per Capita (USD thousands)", "Life Expectancy
    (years)") and correct mandated title format plus a clarifying subtitle
  weaknesses:
  - Heavy bubble overlap in the Middle East & Africa cluster (~$15-20k GDP, ~62-67
    years life expectancy) merges several large bubbles into an indistinct blob -
    lower alpha further (e.g. ~0.4-0.45) for this cluster's density or slightly reduce
    max_size so the largest bubbles overlap less severely
  - Library Mastery is competent but only moderately distinctive - the per-group geom_smooth
    + scale_size_area combination could be fairly closely replicated in seaborn's
    regplot+hue; leaning on a more plotnine-unique feature (e.g. facet_wrap small
    multiples layered with the main scatter) would push this further
  - Visual refinement (grid, legend chrome) is solid but default-adjacent rather than
    exceptional - tighter integration between the legend block and the plot area would
    help
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white, consistent with #FAF8F1 - not pure white, not dark.
      Chrome: Title "bubble-basic · python · plotnine · anyplot.ai" in dark ink, fully visible; italic-weight subtitle in medium-gray below it; axis titles "GDP per Capita (USD thousands)" and "Life Expectancy (years)" in dark ink with units; tick labels in medium-gray; subtle horizontal/vertical gridlines at low opacity. All chrome text is clearly readable against the light background.
      Data: Four regions rendered as semi-transparent bubbles - Asia-Pacific in brand green (#009E73), Europe in lavender (#C475FD), Americas in blue (#4467A3), Middle East & Africa in ochre (#BD8233) - matching Imprint palette positions 1-4 in canonical order. Bubble size encodes population via scale_size_area; a per-region regression line (matching each region's color) with a light confidence band runs through each cluster. A size legend ("Population (M)") with three reference circles (20/50/90) and a region color-swatch legend sit to the right of the plot, both with dark, legible keys against the elevated legend background.
      Legibility verdict: PASS - all text is legible; the only softness is dense overlap among several large ochre bubbles in the ~$15-20k cluster, which is a data-visibility note rather than a text-legibility one.

    Dark render (plot-dark.png):
      Background: warm near-black, consistent with #1A1A17 - not pure black, not light.
      Chrome: Same title/subtitle/axis-title/tick-label structure, now rendered in light ink (white/light-gray) against the dark background; gridlines are faint light lines at low opacity. No dark-on-dark or hard-to-read text anywhere.
      Data: The four region colors (green, lavender, blue, ochre) are pixel-identical to the light render - confirming palette consistency across themes; only the chrome (background, text, grid, legend box) flips. Trend lines and confidence bands remain visible against the dark background, though the bands are necessarily more muted (as expected for translucent fills on a dark surface).
      Legibility verdict: PASS - all title, axis, tick, and legend text is clearly readable in light color against the dark surface; no dark-on-dark failures observed.
