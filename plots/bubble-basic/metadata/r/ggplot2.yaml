review:
  strengths:
  - 'Correct Imprint palette in canonical order — Africa is #009E73 (brand green,
    first series), then Americas/Asia/Europe/Oceania follow palette positions 2-5
    exactly — identical across both themes with theme-correct chrome'
  - scale_size_area() correctly implements the spec's core requirement (bubble size
    scaled by area, not radius), paired with a clearly labeled Population size legend
    (50M/200M/500M/1B breaks)
  - 'Real, neutral, factually accurate dataset (gapminder 2007: GDP per capita vs.
    life expectancy vs. population) with China/India/USA population-outlier labels
    adding a clear storytelling focal point'
  - Explicit font sizing throughout (axis.title=10, axis.text=8, plot.title=12, legend
    text/title=8/10) matching style-guide defaults, with a clean minimal theme — no
    spines, subtle major-only grid on both axes
  - 'Clean, idiomatic ggplot2 code: KISS structure, single set.seed(42), only used
    imports, ragg::agg_png device, sensible log-scale x-axis for GDP''s wide range'
  weaknesses:
  - The 'USA' outlier label sits in a visually dense cluster at the top-right (overlapping
    Asia/Europe/Americas bubbles packed tightly together) — nudge the label further
    out or add a short leader line so it doesn't risk touching neighboring bubbles
  - 5 categorical series (continents) is at the style guide's 'borderline' distinguishability
    threshold (n=5-6) which recommends redundant encoding (e.g. marker shape) alongside
    color — not required, but would strengthen accessibility further
  - The gapminder-bubble treatment (colored continents, log-x GDP vs. life expectancy,
    population-size bubbles) is a well-known reference pattern rather than a distinctive
    one-of-a-kind design — a subtle enhancement (e.g. a soft trend guide or continent
    grouping) could push Design Excellence further
