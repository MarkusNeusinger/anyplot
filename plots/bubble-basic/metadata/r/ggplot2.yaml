review:
  strengths:
  - scale_size_area() with an explicit domain floor gives strictly area-true bubble
    scaling — a value twice as large covers twice the area — while keeping the smallest
    bubbles visible and the largest (100 K units) well short of swallowing the panel
  - shape 21 with fill = category, a page-colored 1.0 stroke and translucency keeps
    heavily overlapping bubbles individually distinguishable in the dense $0-$100
    band of both renders, exactly the treatment the spec's overlap bullet asks for
  - Draw order sorted by descending sales volume puts the largest bubbles at the back
    so smaller ones stay readable on top of them
  - Theme tokens are threaded through every chrome element (plot and panel background,
    grid, axis titles, tick labels, title, subtitle, legend panel), so both renders
    are theme-correct and the data fills are identical between them
  - 'Correct Imprint usage: first series is #009E73, and slot 5 matte red is deliberately
    skipped for an ordinary category in favour of slot 6 cyan, keeping red free as
    the bad/loss/error anchor'
  - 'Idiomatic ggplot2 throughout: scale_size_area, scale_fill_manual, expansion(),
    scales::label_dollar(), theme_minimal() plus targeted theme() overrides, vectorized
    data generation and the native pipe — no helper functions or wrappers'
  weaknesses:
  - 'VQ-03, SC-02, SC-04 (both): the "Monthly Sales Volume (K units)" legend''s three
    reference circles (40/70/100) are drawn with no fill and a PAGE_BG-colored outline,
    so they are effectively invisible on the #FFFDF6 legend panel and only a faint
    ring on #242420 — the size encoding has no readable key in either theme → draw
    them like the data marks (a data fill, page-colored outline, same translucency).
    Likely cause: guides() overrides only fill; add size = guide_legend(override.aes
    = list(fill = INK_SOFT, color = PAGE_BG, alpha = 0.6)).'
  - 'VQ-04 (both): geom_point(alpha = 0.42) sits below the Notes'' ~0.5-0.7 band and
    flattens the fills against the page — on light, brand green renders as pale mint
    (~#91D2BC) and sits close to the pale cyan of Sporting Goods; on dark both darken
    toward the same teal → raise alpha to about 0.55 (+0.13). Likely cause: alpha
    = 0.42 in geom_point.'
  - 'VQ-05 (both): the right-hand legend column stops at about 82 % of the canvas
    height, leaving a dead block below the "Product Category" box while the panel
    keeps full height → center the two guide boxes vertically in the legend column.
    Likely cause: legend.justification.right = "center" is not taking effect on the
    guide-box stack.'
  - 'Suggestion: the coded breaks = c(10, 40, 70, 100) render as only 40/70/100 —
    showing the 10 break as well would cover the small end of the size range.'
  - 'Suggestion: a shorter size-legend title ("Monthly sales (K units)") would narrow
    the legend column and give the panel more width.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1) across plot and panel — not pure white, not dark. The two guide boxes on the right sit on the slightly lighter elevated surface (#FFFDF6).
      Chrome: Title "bubble-basic · r · ggplot2 · anyplot.ai" in dark ink at 12 pt, spanning ~1216 px of the ~1930 px panel width (~63 %). Subtitle "Bubble size encodes monthly sales volume" in soft ink below it. Y-axis title "Average Retail Price" (measured 51 px rotated width) and x-axis title "Customer Satisfaction Score (0-100)" (45 px height) are balanced at the same 10 pt; tick labels ($0-$500 dollar-formatted, 50-90) at 8 pt in soft ink. Horizontal and vertical major gridlines in #D3D1CA are subtle but visible; minor grid removed; no spine box. Nothing touches or crosses the canvas border (border-pixel scan: zero deviation from the page color on all four edges). All text is clearly readable against the light background — no light-on-light.
      Data: 110 translucent bubbles (alpha 0.42, shape 21, page-colored 1 px stroke) in five Imprint fills — Consumer Electronics #009E73 (first series, correct), Apparel & Footwear #C475FD, Home & Kitchen #4467A3, Beauty & Personal Care #BD8233, Sporting Goods #2ABCCD. Area-true sizing via scale_size_area; largest bubbles drawn first so smaller ones stay on top. The dense $0-$100 band overlaps heavily but every bubble stays separable by its page-colored outline, and no bubble is displaced from its (x, y) values. The "Product Category" legend swatches are solid and legible; the "Monthly Sales Volume (K units)" reference circles at 40/70/100 have no fill and a page-colored outline, so they are essentially invisible against the panel.
      Legibility verdict: PASS for all text and all data marks. The size-legend reference circles are the one element that fails to be visible — recorded as a VQ-03/SC-02/SC-04 defect, not a text-legibility failure.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17) — not pure black, not light. Guide boxes on the elevated #242420 surface.
      Chrome: Title, subtitle, axis titles, tick labels and both legend titles/labels all flip to light ink (#F0EFE8 / #B8B7B0) and remain fully readable. No dark-on-dark anywhere — every text element was checked against the near-black surface. Gridlines flip to #3A3A37, still subtle but visible. Layout, tick set and title width are identical to the light render; nothing is clipped at any canvas edge.
      Data: The five fill hexes are identical to the light render (#009E73 / #C475FD / #4467A3 / #BD8233 / #2ABCCD) — only chrome flips. Brand green #009E73 remains clearly visible on the dark surface. Because alpha 0.42 composites against a dark page the bubbles read deeper than on light, but the underlying fills are unchanged. Bubble positions, sizes and draw order are identical. The size-legend reference circles are again unfilled, here reading as a very faint dark ring on the #242420 panel — barely perceptible.
      Legibility verdict: PASS for all text and all data marks; the unfilled size-legend circles fail the same visibility check as in the light render.
