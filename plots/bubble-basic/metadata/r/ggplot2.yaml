review:
  strengths:
  - Correct area-true bubble sizing via scale_size_area(), with a size-domain floor
    just below the observed minimum so the smallest bubbles stay visible without breaking
    proportional area encoding
  - Draw order sorts largest bubbles to the back and smallest to the front (alpha
    = 0.42) so heavy overlap in the dense midfield never fully buries a smaller bubble
  - Top-3 best-seller callouts (leader line + label, alternating placement) add real
    data storytelling beyond a plain scatter dump
  - Theme-adaptive chrome is correctly threaded through title, subtitle, axis text,
    grid, and legend box in both plot-light.png and plot-dark.png
  - 'Clean, idiomatic ggplot2: scale_size_area, guide_legend(override.aes=...) for
    legible legend swatches, scale_fill_manual with the Imprint palette, no custom
    functions or over-engineering'
  weaknesses:
  - Top-seller callout labels ('BEAU-008', 'APRL-004') sit close to/slightly over
    adjacent bubble edges in the dense midfield of both renders — a bit more vertical
    clearance from the bubble cloud would remove the residual text/data overlap
  - The legend column has noticeable empty whitespace below the 'Product Category'
    block, leaving that side of the canvas underutilized — tightening vertical spacing
    or recentring the legend block would improve canvas balance
  - 'Sporting Goods (5th category) lands on matte red #AE3030 purely by canonical
    ordinal position; the style guide frames slot 5 as a deferred semantic anchor
    for bad/loss/error roles rather than a default ordinal — since there''s no error
    semantic here, consider position 6 (cyan #2ABCCD) instead to keep red reserved
    for its semantic role'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (~#FAF8F1), not pure white — matches the required light-theme page surface.
      Chrome: Title "bubble-basic · r · ggplot2 · anyplot.ai" and subtitle "Bubble size encodes monthly sales volume" render in dark ink, fully legible and comfortably sized (well under the ~90% width overflow line). Axis titles ("Customer Satisfaction Score (0-100)", "Average Retail Price") and tick labels are dark/soft-ink and clearly readable. Gridlines are thin and subtle, visible but non-competing. The "Product Category" legend and "Monthly Sales Volume (K units)" size legend sit in an elevated off-white panel on the right, text fully legible, no clipping at the canvas edge (verified via pixel crop).
      Data: Five translucent (alpha≈0.42) bubble categories colored Consumer Electronics=#009E73 (green, first series, correct), Apparel & Footwear=#C475FD (lavender), Home & Kitchen=#4467A3 (blue), Beauty & Personal Care=#BD8233 (ochre), Sporting Goods=#AE3030 (matte red) — matches Imprint canonical order. Bubble size is area-scaled to monthly sales volume with a legible 3-stop size legend (40/70/100). Three top-seller bubbles are labeled with bold text and short leader lines.
      Legibility verdict: PASS — no text is illegible or clipped; minor label/bubble proximity noted as a weakness, not a legibility failure.

    Dark render (plot-dark.png):
      Background: Warm near-black (~#1A1A17), not pure black — matches the required dark-theme page surface.
      Chrome: Title, subtitle, axis titles/ticks, and legend text all flip to light ink (white/soft-light gray) and remain fully readable — no dark-on-dark failures anywhere, including the legend panel (elevated dark box #242420-ish with light text) and the callout labels ("APRL-004", "BEAU-001", "BEAU-008" render in white with full contrast).
      Data: All five bubble colors are pixel-identical to the light render (#009E73/#C475FD/#4467A3/#BD8233/#AE3030) — only chrome (background, gridlines, text, legend box) flips between themes, as required.
      Legibility verdict: PASS — no dark-on-dark or light-on-light issues detected in either render.
