review:
  strengths:
  - 'Correct Imprint palette with brand green (#009E73) as the first categorical series,
    and theme-correct #FAF8F1/#1A1A17 backgrounds with properly flipped chrome in
    both renders'
  - 'Thoughtful data storytelling: the five zone types form clearly separated bands
    along the log-density axis instead of one overlapping blob, and the top-3 green-space
    neighborhoods are called out with leader-line annotations'
  - Proper area-true bubble sizing via scale_size_area (not radius), log-scale x-axis
    with annotation_logticks, and a floored size domain that keeps the smallest bubbles
    visible without breaking area-proportionality
  - Clean, well-commented, reproducible code (set.seed(42), fully vectorized rlnorm/rnorm
    data generation with no explicit per-zone loop)
  weaknesses:
  - scale_y_continuous(limits = c(15, 150)) is narrower than the income data's clamp
    ceiling (pmin(180, ...)); a rare high-income draw would silently vanish from the
    plot (ggplot2 drops out-of-range rows instead of clipping them) rather than being
    clamped visually — raise the axis limit to 180 or lower the data clamp to 150
    so the two stay in sync
  - With ~110 overlapping bubbles across 5 categories, the mid-density band (Inner
    Ring/Outer Ring around 3,000-8,000 density) reads a bit busy — a slightly lower
    alpha or a touch more stroke contrast would help disentangle the densest cluster
  - The size-legend breaks list (3, 10, 25, 60, 120) declares a 120 break that falls
    outside the actual data range and is silently dropped by ggplot2, leaving only
    4 legend circles — trim the breaks list to match the true data range so it doesn't
    look like a legend was cut off
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Dark title "bubble-basic · r · ggplot2 · anyplot.ai" and gray subtitle "Bubble size encodes green space per capita" both clearly legible. Axis titles "Population Density (people/km², log scale)" and "Median Household Income ($K)" are dark and readable; tick labels (1,000 / 3,000 / 10,000 / 30,000 and 20-140) are soft gray but fully legible. Horizontal gridlines are subtle. Legend panels "Zone Type" (5 color swatches with labels) and "Green Space (m²/capita)" (4 size-reference circles) are both fully within the canvas, not clipped.
      Data: Bubbles colored by zone — Urban Core is brand green (#009E73, first series, correct), Inner Ring lavender, Outer Ring blue, Industrial District ochre, Suburban Fringe red. Alpha ~0.58 blending is visible where bubbles overlap. Three "SUBF-0xx" bubbles are called out with bold black leader-line labels.
      Legibility verdict: PASS — all text is clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Title and subtitle flip to light ink/soft-gray text, both legible on the dark surface. Axis titles and tick labels flip to light tones and remain fully readable. Gridlines are faint but visible. Both legend panels render with a slightly elevated dark background and light text, fully legible and fully within the canvas.
      Data: Bubble colors are identical to the light render (same green/lavender/blue/ochre/red hues at the same positions and sizes) — only the chrome (background, text, grid, legend panel fill) flips. The "SUBF-0xx" annotation labels flip to bold white text, clearly readable against the dark background.
      Legibility verdict: PASS — no dark-on-dark failures observed; all title/axis/tick/legend text is clearly visible.
