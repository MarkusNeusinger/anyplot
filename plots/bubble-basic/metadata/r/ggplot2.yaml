review:
  strengths:
  - 'Correct Imprint palette application: first series (Electronics) is #009E73, remaining
    categories follow canonical order, and chrome (background, text, grid, legend
    box) is theme-correct in both light and dark renders'
  - Uses scale_size_area (not scale_size) for bubble sizing, exactly matching the
    spec's requirement to scale by area rather than radius
  - Alpha blending (0.58) combined with a background-colored bubble stroke (color
    = PAGE_BG) creates a clean 'punch-hole' separation between overlapping bubbles,
    and largest bubbles are drawn first so smaller ones stay visible on top
  - 'Genuine data storytelling: top-3 best-sellers are annotated with alternating
    leader lines (direction chosen by price order to avoid label collisions) instead
    of a generic unlabeled scatter'
  - 'Idiomatic ggplot2 usage: scale_x_log10 + annotation_logticks for the skewed price
    axis, guide_legend(override.aes=...) to keep legend swatches legible independent
    of bubble alpha/size'
  - Realistic, neutral retail dataset (5 categories, price vs. rating vs. annual sales)
    with plausible category price ordering and wide, well-covered ranges across all
    three encoded dimensions
  weaknesses:
  - Y-axis is fixed to the full 1-5 rating scale but all data sits within ~3.1-5.0,
    leaving a large empty band across the bottom ~40% of the plot area; consider tightening
    scale_y_continuous limits (e.g. ~2.8-5.2) to give the bubble cluster more vertical
    presence, unless the full 1-5 scale is intentionally kept for rating-context honesty
  - The smallest bubbles (annual sales near the 5K end of scale_size_area, e.g. some
    far-right Electronics points) render as only a couple of pixels wide - technically
    visible but borderline; a slightly higher minimum via scale_size_area's range
    floor would improve visibility without breaking the area-accurate encoding
  - Legend key spacing between the '5K' and '50K' Annual Sales markers looks visually
    large relative to the actual size difference - minor cosmetic nit, not a functional
    issue
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 - not pure white, not dark.
      Chrome: Title "bubble-basic · r · ggplot2 · anyplot.ai" and subtitle "Bubble size encodes annual sales volume" render in dark ink, clearly legible. Axis titles ("Price ($, log scale)", "Customer Rating (out of 5)") and tick labels are dark/soft-dark and fully readable against the light surface. Y-axis gridlines are subtle light-grey horizontal lines; x-axis uses log ticks instead of gridlines. Two legends ("Annual Sales" size legend, "Category" color legend) sit in a lightly elevated box to the right of the plot, clearly separated from the data.
      Data: Bubbles are filled with the Imprint palette - Electronics = brand green #009E73 (first series, correct), Apparel = lavender, Home & Kitchen = blue, Beauty = ochre/tan, Sports = matte red - all in canonical palette order. Bubble outlines match the page background color, giving overlapping bubbles a clean separated look. Three best-selling products (BEAU-008, APRL-004, BEAU-001) are called out with bold labels and thin leader lines.
      Legibility verdict: PASS - no light-on-light text, all chrome and data clearly distinguishable from the cream background.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 - not pure black, not light.
      Chrome: Title, subtitle, axis titles, and tick labels flip to light/off-white and soft-light tones respectively, fully legible against the dark surface. No dark-on-dark failures observed - all text is clearly readable. Gridlines and log-tick marks are faint light lines, visible but not competing with data. The legend box uses a slightly lighter elevated dark fill, distinct from the page background.
      Data: Bubble fill colors are pixel-identical to the light render (#009E73 green first, then lavender, blue, ochre, matte red) - only the chrome (background, text, grid, legend box) changed between themes, as required. The three annotated best-seller labels remain legible in light text against the dark background.
      Legibility verdict: PASS - all text and data elements are clearly readable, with correct theme-adaptive chrome and identical data colors across both renders.
