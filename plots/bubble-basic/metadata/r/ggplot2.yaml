review:
  strengths:
  - Correct area-based bubble sizing via scale_size_area(max_size = 18) exactly as
    the spec requires ("not radius"), with a realistic Annual Sales legend (5K/50K/150K/400K
    breaks)
  - 'Genuine data storytelling: the top-3 best-sellers by sales volume are called
    out with product-id labels and alternating leader lines that avoid collision'
  - Category price medians follow a real-world cheap-to-expensive ladder (Beauty <
    Apparel < Home & Kitchen < Sports < Electronics), keeping the 5 categories visually
    separated along the log-price axis instead of fully overlapping
  - 'Perfect Imprint palette compliance and theme-adaptive chrome in both renders
    — first series (Electronics) is #009E73, backgrounds/text/grid flip correctly
    between light and dark'
  - All font sizes explicitly set with a clean typographic hierarchy (title 12pt,
    subtitle 9pt, axis 10pt, ticks/legend 8pt) and well-balanced canvas utilization
  weaknesses:
  - Dense bubble cluster in the $10-$30 price band (Beauty/Apparel/Home & Kitchen
    overlap heavily) makes many individual bubbles hard to distinguish even with alpha
    = 0.48 — nudge alpha toward the spec's 0.5-0.7 range or add slightly more separation
    to sharpen that region
  - Grid lines (both major x and y) read a bit more present than "very subtle" against
    the flat categorical fills — consider lowering opacity further or dropping the
    vertical grid to sharpen focus on the data
  - Data generation uses an anonymous function inside lapply() per category rather
    than a flat generate-in-place structure — a minor structural deviation from the
    strict Imports -> Data -> Plot -> Save script flow
  - Library mastery is solid but modest beyond scale_size_area — no other ggplot2-distinctive
    feature (e.g. deeper layer composition, coord adjustments) that would be hard
    to replicate in another library
  - Legend size swatch for the smallest break (5K) renders as a nearly invisible dot
    — accurate to scale_size_area but worth double-checking it stays perceptible at
    mobile width
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Title "bubble-basic · r · ggplot2 · anyplot.ai" and subtitle "Bubble size encodes annual sales volume" render in dark ink at top-left, clearly legible. Axis titles "Price ($, log scale)" and "Customer Rating (out of 5)" are dark and readable; tick labels are a softer gray but still clear. Grid lines are light gray, subtle but visible on both axes. The "Annual Sales" size legend and "Category" color legend sit in an elevated cream box on the right, fully readable.
      Data: Five category colors (Electronics = green, Apparel = lavender, Home & Kitchen = blue, Beauty = ochre, Sports = red) — first series is #009E73 as required. Three best-selling products (BEAU-013, APRL-008, BEAU-004) are called out with bold labels and thin leader lines pointing to their bubbles, alternating above/below to avoid collisions.
      Legibility verdict: PASS — no light-on-light text, all chrome clearly readable against the cream background.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Title, subtitle, axis titles now render in light cream/ink; tick labels and legend text render in a lighter gray-white. Grid lines flip to a faint light-gray tone against the dark background, still subtle but visible. Legend box background flips to the dark-elevated tone with light text.
      Data: All five category colors are pixel-identical to the light render (green/lavender/blue/ochre/red) — only the chrome (background, text, grid, legend box) changed. Best-seller labels and leader lines flip to light ink, remaining fully legible against the dark bubbles/background.
      Legibility verdict: PASS — no dark-on-dark failures observed; all title/axis/tick/legend text is clearly visible against the near-black surface.
