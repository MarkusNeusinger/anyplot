review:
  strengths:
  - 'Correct Imprint palette: brand green (#009E73) is the first categorical series,
    remaining four zone colors follow canonical order, and chrome (background, text,
    grid, legend) is theme-correct in both light and dark renders'
  - Bubble size uses scale_size_area() (true area-scaling, not radius) with a floored
    lower limit so the smallest real values still get visible presence, matching the
    spec's area-accuracy requirement
  - Direct-labeled top-3 green-space bubbles with alternating leader-line direction
    create a genuine focal point without collisions, and z-ordering (largest bubbles
    drawn first) keeps small bubbles visible on top
  - Realistic, neutral synthetic dataset (density vs. income vs. green space across
    five city zone types) with meaningful, factually plausible variation across categories
  - All font sizes explicitly set, KISS script structure (imports → data → plot →
    save), reproducible via set.seed(42), clean imports (dplyr/scales/ragg all actually
    used)
  weaknesses:
  - Dense overlapping clusters (especially the Outer Ring blue bubbles around density
    3,000-10,000) partially bury individual data points under stacked alpha — a slightly
    lower alpha or gentle jitter in the densest region would keep more individual
    bubbles distinguishable
  - panel.grid.major.x is fully removed while the style guide's default for scatter/bubble
    charts is grid on both axes; the log-scale annotation_logticks partially substitutes
    for it, but a faint x grid would align closer to the default guidance
  - Some generated green-space values (e.g., Industrial District, Urban Core) fall
    below the spec's recommended 10-100 size-column range — the low end is realistic
    for those zones but drifts from the suggested guidance
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "bubble-basic · r · ggplot2 · anyplot.ai" and subtitle "Bubble size encodes green space per capita" in dark ink, clearly legible. Axis titles ("Population Density (people/km², log scale)", "Median Household Income ($K)") dark and readable. Tick labels in a softer grey, fully legible. A subtle horizontal-only grid is visible without competing with the data. The "Zone Type" and "Green Space (m²/capita)" legends sit in a lightly elevated box to the right of the plot, fully readable. Three neighborhoods (SUBF-017, SUBF-012, SUBF-019) are direct-labeled in bold dark text with thin leader lines, with no overlap between labels.
      Data: Five zone-type colors from the Imprint palette — Urban Core = brand green (#009E73), Inner Ring = lavender, Outer Ring = blue, Industrial District = ochre, Suburban Fringe = matte red. Bubble sizes are area-scaled to green-space-per-capita, ranging from small dots to large translucent circles, with semi-transparent fills (alpha ~0.58) and off-white strokes so overlapping bubbles stay distinguishable.
      Legibility verdict: PASS — no light-on-light or hard-to-read text anywhere in this render.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Title, subtitle, axis titles, and tick labels have all flipped to light tones (light ink for primary text, lighter grey for tick/legend text) and remain clearly legible against the dark surface. The legend box uses a slightly elevated dark fill, still readable. The same three neighborhoods are labeled in bold white text with white leader lines, fully legible and not overlapping.
      Data: The five zone-type bubble colors are pixel-identical to the light render (same brand green, lavender, blue, ochre, matte red) — only the chrome (background, text, grid, legend fill) changed. Brand green (Urban Core) remains clearly visible against the dark background.
      Legibility verdict: PASS — no dark-on-dark failures; every title/label/tick element is clearly visible against the near-black surface.
