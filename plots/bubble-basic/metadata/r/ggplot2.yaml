review:
  strengths:
  - Correct area-true bubble sizing via scale_size_area, with a domain floor just
    below the observed minimum so the smallest real values keep visible presence instead
    of shrinking to near-invisible dots
  - 'Genuine data storytelling: top-3 sellers by sales volume are called out with
    leader lines and product-ID labels, with offset direction alternated by satisfaction
    order (not sales order) to avoid label collisions between nearby points'
  - 'Full Imprint palette compliance in the canonical 5-color order, first series
    #009E73 as required, with correct chrome-only flip between light (#FAF8F1) and
    dark (#1A1A17) themes and identical data colors across both renders'
  - Clean, reproducible, single-file KISS implementation (set.seed(42), no functions/classes)
    with comments documenting non-obvious design choices (largest-bubbles-drawn-first
    layering, size floor rationale, label offset math)
  - Correct canvas size via ggsave(width=8, height=4.5, dpi=400) with ragg::agg_png,
    proper plot-{THEME}.png naming, no bare plot.png
  weaknesses:
  - In the dense high-satisfaction cluster (x≈70-95, y≈$0-150), overlapping Home &
    Kitchen / Beauty / Apparel / Sporting Goods bubbles blend into a visually muddled
    mass despite alpha=0.55 — try alpha≈0.4 or slight jitter to improve category separability
    in that region.
  - The two stacked legends (Product Category + Monthly Sales Volume) consume roughly
    30% of canvas width — tightening legend key spacing/margins would give the plot
    panel more room without dropping either legend.
  - Size-legend breaks (10, 30, 60, 100) are unevenly spaced, which is slightly less
    scannable than round even steps (e.g. 10/40/70/100) — a minor polish item, not
    a functional issue.
  image_description: |-
