review:
  strengths:
  - Correct 3-dimension bubble encoding (x=price on a log scale, y=rating, size=sales
    via area-accurate scale_size_area) plus a well-motivated 4th channel (color=category)
    per the spec's optional-color note
  - Data generation follows a real-world price ladder across categories (Beauty <
    Apparel < Home & Kitchen < Sports < Electronics) instead of arbitrary overlapping
    distributions
  - Top-3 best-seller callouts with alternating directional leader lines add genuine
    data storytelling beyond a raw data dump
  - 'Theme-adaptive chrome verified pixel-exact in both renders (#FAF8F1 / #1A1A17
    backgrounds), Imprint palette in canonical order with identical data hues across
    themes'
  - All font sizes explicitly set (axis.title=10, axis.text=8, plot.title=12, legend
    text/title=8/10), with a dollar-formatted log-scale price axis
  weaknesses:
  - The 'Annual Sales' size legend only renders 3 of the 4 breaks defined in scale_size_area(breaks=c(5000,50000,150000,400000))
    — the 400K key/label never appears in the legend box in EITHER theme, so the largest
    bubbles on the chart (products near ~450K annual sales, e.g. the biggest Beauty
    bubble) have no corresponding reference size. Fix the guide/scale_size_area configuration
    so all 4 breaks render (check for key-spacing or override.aes conflicts with guide_legend).
  - The dense low-price cluster (~$10-$60, spanning Beauty/Apparel/Home & Kitchen)
    has such heavy bubble overlap that individual points and their category color
    blend into indistinct muddy patches despite alpha=0.65 — consider slightly higher
    transparency, a small horizontal jitter, or thinning that region for clarity.
  - Both legend boxes (Category, Annual Sales) keep a visible outline frame; the style
    guide's decoration-removal checklist recommends dropping box frames around legends
    for a cleaner look.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, pixel-verified #FAF8F1 (RGB 250,248,241) — matches the required light surface.
      Chrome: Title "bubble-basic · r · ggplot2 · anyplot.ai" in dark ink top-left, spans ~56% of the plot panel width (within the 50-70% guidance). X-axis "Price ($, log scale)" with $10/$30/$100/$300/$1,000 ticks; Y-axis "Customer Rating (out of 5)" 1-5. All titles, axis labels, and tick labels render in dark ink against the light background and are clearly readable.
      Data: Bubbles colored by category — Electronics=#009E73 (green), Apparel=#C475FD (lavender), Home & Kitchen=#4467A3 (blue), Beauty=#BD8233 (ochre), Sports=#AE3030 (red), semi-transparent (alpha 0.65) with a light-colored edge stroke. Three top-selling products (BEAU-013, APRL-008, BEAU-004) are labeled with bold text and thin leader lines pointing to their bubbles. "Category" legend (color swatches) and "Annual Sales" size legend (bubble-size key) sit at upper/lower right; the size legend only shows 5K/50K/150K keys — the 400K key defined in code is missing.
      Legibility verdict: PASS — no light-on-light text; all chrome is dark ink on the warm off-white surface.

    Dark render (plot-dark.png):
      Background: Warm near-black, pixel-verified #1A1A17 (RGB 26,26,23) — matches the required dark surface.
      Chrome: Same title/axis/tick layout, now rendered in light ink (#F0EFE8 primary / #B8B7B0 secondary) against the dark background. All text is clearly legible with no dark-on-dark failures.
      Data: Confirmed identical hues to the light render (same 5 Imprint categorical colors at the same positions) — only the chrome (background, text, grid, legend box, bubble edge stroke) flips with the theme. Size legend again shows only 5K/50K/150K, missing the 400K key.
      Legibility verdict: PASS — no dark-on-dark text; all labels and ticks are clearly visible against the near-black surface.
