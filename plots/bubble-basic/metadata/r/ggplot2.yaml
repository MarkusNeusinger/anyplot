      Background: Warm off-white, matches the required #FAF8F1 — not pure white, not dark.
      Chrome: Title "bubble-basic · r · ggplot2 · anyplot.ai" and subtitle "Bubble size encodes monthly sales volume" render in dark ink, clearly legible. Axis titles ("Customer Satisfaction Score (0-100)", "Average Retail Price") are dark and crisp; tick labels are soft gray but readable. Gridlines are thin and subtle (major x/y only, no minor grid). The "Product Category" and "Monthly Sales Volume (K units)" legends sit on a slightly elevated off-white panel with dark, readable text.
      Data: Five product categories rendered as semi-transparent bubbles (alpha≈0.55) with a light stroke matching the page background: Consumer Electronics (green, #009E73 — confirmed first series), Apparel & Footwear (lavender), Home & Kitchen (blue), Beauty & Personal Care (ochre), Sporting Goods (red). Top-3 best-sellers (APRL-004, BEAU-001, BEAU-008) are labeled in bold dark text with thin leader lines pointing to their bubbles.
      Legibility verdict: PASS — no light-on-light text found anywhere, including inside the dense overlapping-bubble region.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches the required #1A1A17 — not pure black, not light.
      Chrome: Title and subtitle render in light ink (near-white / soft light gray) against the dark background, clearly legible. Axis titles are light and crisp; tick labels are a lighter soft gray, easily readable. Gridlines are subtle dark-gray lines that stay visible without dominating. Both legend panels use a dark elevated background with light text, fully readable.
      Data: All five category colors are visually identical to the light render (green, lavender, blue, ochre, red) — only the chrome (background, ink, grid, legend panel) flipped, as required. The bold product-ID callout labels (APRL-004, BEAU-001, BEAU-008) render in light ink and are clearly visible against the dark background — no dark-on-dark failure observed.
      Legibility verdict: PASS — no dark-on-dark text found; all titles, axis labels, tick labels, legend text, and annotation labels are legible.
