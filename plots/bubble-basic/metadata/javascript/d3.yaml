review:
  strengths:
  - d3-force collision decluttering (forceX/forceY anchored at strength 0.92 + forceCollide)
    is a genuinely distinctive, well-executed library-specific technique that keeps
    the densest funding cluster (100-150) individually legible without bubbles stacking
  - Trend line plus annotated callout card (with brand-green accent bar) elevates
    the chart from a raw data dump to genuine storytelling — the viewer immediately
    sees the 'growth slows as funding scales up' insight
  - Size legend circles mirror the exact fill-opacity (0.58), background-colored stroke-cutout,
    and per-tercile stroke-width of the real bubbles, so the reference set is visually
    consistent with the data it explains
  - Theme-adaptive chrome (grid, ticks, legend box, annotation card) is correctly
    threaded through window.ANYPLOT_TOKENS in both renders — no dark-on-dark or light-on-light
    failures
  - Bubble size is correctly scaled by area via d3.scaleSqrt (per spec requirement)
    with alpha=0.58 to handle overlap, exactly matching the spec's guidance
  weaknesses:
  - Bottom and left axis domain lines remain solid, fairly dark strokes — a fully
    modern minimalist treatment would soften or remove them to match the subtlety
    of the gridlines
  - The trend line and its dashes are drawn after (on top of) the bubbles, so in a
    couple of spots the dashed pattern visibly interrupts a bubble fill — drawing
    the line before the bubbles (or giving it a subtle halo) would give a cleaner
    z-order
  - The decluttering force nudges bubble centers away from their exact (funding, growth)
    coordinate to avoid overlap; strength=0.92 keeps the shift small, but the rendered
    position is a close approximation rather than the literal data point — worth a
    one-line code comment caveat if not already sufficiently explained
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1-like), not pure white.
      Chrome: Bold centered title "bubble-basic · javascript · d3 · anyplot.ai" in dark ink, fully visible with no clipping. X-axis "Funding Raised ($M)" (0-160) and rotated Y-axis "Revenue Growth Rate (%)" (-10 to 70) labels are dark, descriptive, with units, and fully readable. Subtle light-gray gridlines run behind the data. A rounded legend card top-right ("Team Size (employees)") shows three reference bubbles (10/50/100) with matching fill/stroke treatment. A callout card ("Growth slows as funding scales up") with a green accent bar sits mid-plot near the trend line, background-filled so it doesn't blend into any bubble.
      Data: ~120 green (#009E73) bubbles scaled by area via d3.scaleSqrt, fill-opacity 0.58 with a page-background-colored stroke cutout that keeps close/adjacent bubbles visually separated (reinforced by a d3-force collision simulation that nudges overlapping bubbles apart). A dashed green trend line shows the negative funding-vs-growth correlation.
      Legibility verdict: PASS — all title, axis, tick, legend, and annotation text is clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17-like), not pure black.
      Chrome: Same title, axis labels, tick labels, gridlines, legend card, and callout card, all correctly re-themed to light text (white/light-gray) and dark elevated-surface fills. No unreadable elements observed.
      Data: Bubble fill color (#009E73), fill-opacity, stroke treatment, and trend line color are pixel-identical to the light render — only the chrome (background, text, grid, legend/card surfaces) flips, exactly as required.
      Legibility verdict: PASS — no dark-on-dark failures; all text (including the legend and callout card text) is clearly legible against the dark surfaces.
