      Data: All ~120 bubbles are the brand green #009E73 at ~0.48 fill-opacity with a light (background-matching) stroke separating overlapping circles. A dashed green trend line runs from upper-left to lower-right, with a callout card ("Growth slows as funding scales up") in dark text on a light card with a green accent bar.
