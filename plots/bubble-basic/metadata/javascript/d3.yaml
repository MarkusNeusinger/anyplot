review:
  strengths:
  - Area-accurate bubble sizing via d3.scaleSqrt, matching the spec's explicit "scale
    by area, not radius" requirement
  - Dedicated, clearly labeled size legend (10/50/100 employees) with matching stroke-width
    treatment reused from the real bubbles
  - d3-force collision simulation genuinely declutters the densest funding cluster
    -- a distinctive, idiomatic D3 technique
  - Trend-line annotation with a themed callout card adds real data storytelling around
    the funding-vs-growth relationship
  - 'Palette and theme chrome are fully correct: brand green first series, #FAF8F1/#1A1A17
    backgrounds, all text readable in both themes'
  - Deterministic LCG-seeded synthetic data, clean mount-node usage, current d3 v7
    API throughout
  weaknesses:
  - Even after decluttering, the dense high-funding cluster (funding ≈ 100-150) still
    has substantial bubble overlap that reduces per-point legibility -- widen the
    collision padding further or reduce max bubble radius/alpha in that regime
  - The force simulation (forceX/forceY strength 0.6) shifts bubbles away from their
    literal (funding, growth) coordinates to reduce overlap; raise the anchor strength
    or cap displacement so rendered positions stay closer to the true data values
  - Legend swatch fill-opacity (0.12/0.18/0.24) doesn't match the real bubbles' constant
    fill-opacity (0.58), so the legend visually undersells how solid the actual bubbles
    look -- align legend opacity with the real marks
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1-range), not pure white, not dark.
      Chrome: Dark title "bubble-basic · javascript · d3 · anyplot.ai" centered at top, clearly bold and legible. Dark axis labels "Funding Raised ($M)" (x) and "Revenue Growth Rate (%)" (y) with units. Dark tick labels on both axes. Faint gridlines on both axes (subtle, non-competing). Top-right "Team Size (employees)" legend card with a light elevated fill, thin border, three reference bubbles (10/50/100) and dark labels. Trend-line callout card ("Growth slows as funding scales up") also on a light elevated card with a green accent bar.
      Data: Brand-green (#009E73) bubbles at fill-opacity ~0.58 with a light (page-bg colored) stroke separating overlapping bubbles; dashed green trend line. Sizes clearly vary with team size, area-proportional via scaleSqrt.
      Legibility verdict: PASS -- all text is clearly readable against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17-range), not pure black, not light.
      Chrome: Light/white title and axis labels, light tick labels, faint light-toned gridlines. Legend card uses a dark elevated fill with light text, still clearly readable. Trend-line callout card also uses the dark elevated fill with light text and the same green accent bar.
      Data: Same brand-green (#009E73) bubbles at the same fill-opacity (~0.58) as the light render -- confirmed identical to light render. Bubble strokes are now dark (page-bg colored), which shows as dark separators between overlapping bubbles instead of light ones, correctly flipping only the chrome/stroke, not the fill color.
      Legibility verdict: PASS -- all text is clearly readable against the dark background; no dark-on-dark failures were found (title, axis labels, tick labels, and legend/callout text all use light ink tokens).
