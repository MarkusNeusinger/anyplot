review:
  strengths:
  - Correct area-proportional bubble sizing via d3.scaleSqrt with a sensible 8-42px
    radius range
  - Deterministic seeded data generation (LCG) producing a plausible negative correlation
    between funding and growth rate, with team size scaling alongside funding
  - Clear, well-labeled size legend with a rounded elevated-bg box, placed in a corner
    that avoids overlapping data
  - Theme-adaptive chrome is fully correct in both light and dark renders; palette
    compliance is perfect (#009E73 first series, correct backgrounds)
  - Explicit font sizing throughout (13-22px), clean L-shaped axes, subtle gridlines,
    pageBg-colored bubble strokes that help separate overlapping circles
  weaknesses:
  - Dense bubble cluster around funding=130-150 merges into a near-solid blob where
    individual bubbles are hard to distinguish from heavy overlap; lower fill-opacity
    slightly (e.g. to ~0.45-0.5) or trim the max radius in the r scale to keep bubbles
    distinguishable in the densest region
  - Design Excellence is fairly generic/default — single hue with no visual hierarchy
    beyond the size encoding itself; consider a subtle annotation or callout highlighting
    the funding-vs-growth trend, or vary stroke weight/opacity by team-size tier for
    added depth
  - n=60 data points sits at the low end of the spec's recommended 50-500 range; bumping
    toward ~100-150 points would give richer feature coverage and a denser, more convincing
    bubble-chart look
  - Size legend circles use fixed values [20, 50, 90] rather than values derived from
    the actual teamExtent — tie the legend values to the data's min/median/max for
    tighter alignment with what's visible on the chart
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "bubble-basic · javascript · d3 · anyplot.ai" in bold dark text at top center. Axis labels "Funding Raised ($M)" (x) and "Revenue Growth Rate (%)" (y) in dark ink, clearly readable. Tick labels in a slightly softer dark gray, legible. Subtle off-white/gray gridlines on both axes. A rounded, elevated off-white legend box top-right titled "Team Size (employees)" with three outlined reference circles (20/50/90) and labels beneath.
      Data: ~60 green (#009E73) bubbles with ~0.6 fill-opacity and a thin off-white stroke separating overlapping circles. Bubbles are small at low funding and grow larger toward high funding (team size increases with funding), while growth rate trends downward as funding increases — a visible negative correlation. A cluster of bubbles in the funding=130-150 region overlaps heavily, forming a denser blob where individual circles are harder to separate.
      Legibility verdict: PASS — all title/axis/tick/legend text is clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title and axis labels now rendered in light (near-white) text, tick labels in a softer light gray — both fully legible against the dark background. Gridlines are faint light lines, subtle but visible. The legend box is now a dark elevated panel (#242420-like) with light text and light-stroked reference circles.
      Data: The same ~60 green (#009E73) bubbles, identical color and position/size to the light render — only the chrome (background, text, grid, legend box) has flipped. The stroke around each bubble is now a dark (near-background) color instead of off-white, still separating overlapping bubbles. The same dense cluster near funding=130-150 shows the same heavy overlap.
      Legibility verdict: PASS — no dark-on-dark text; title, axis labels, tick labels, and legend text all read clearly against the near-black surface.
