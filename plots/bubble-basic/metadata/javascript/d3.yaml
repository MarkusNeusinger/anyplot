review:
  strengths:
  - Bubble radius uses d3.scaleSqrt() so area (not radius) scales with team size,
    matching the spec's explicit accuracy requirement
  - A d3-force collision simulation gently declutters overlapping bubbles while pulling
    them back toward their true (funding, growth) coordinates — a genuinely D3-specific
    technique that keeps the dense high-funding cluster legible
  - Explicit trend-line annotation ('Growth slows as funding scales up') with a callout
    card and accent bar creates a clear visual focal point and data story instead
    of a raw scatter dump
  - Size legend with three reference bubbles (10/50/100 employees) correctly mirrors
    the real bubble styling and area scaling
  - Theme-adaptive chrome is threaded through consistently — title, axis labels, ticks,
    gridlines, legend box, and annotation card all use ANYPLOT_TOKENS and remain fully
    readable in both light and dark renders
  - 'First (only) series correctly uses Imprint brand green #009E73, identical across
    both themes'
  weaknesses:
  - In the densest cluster (funding ~120-150M) bubbles still pack tightly enough that
    several overlap 2-3 deep despite the collision force — a slightly wider collision
    padding or lower alpha in that region would improve individual-bubble legibility
  - Bubble fill-opacity is 0.48, just under the spec's recommended 0.5-0.7 alpha range
    for handling overlap
  - Design is polished but stops short of a fully custom aesthetic treatment (e.g.
    no secondary encoding like marker outline emphasis tied to team-size tiers) that
    would push Design Excellence into the top tier
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "bubble-basic · javascript · d3 · anyplot.ai" in bold dark text, clearly visible. Axis labels "Funding Raised ($M)" and "Revenue Growth Rate (%)" in dark ink, tick labels in a slightly softer dark gray. Subtle light gridlines on both axes. Legend box "Team Size (employees)" is an off-white card with a thin border, positioned top-right, fully readable. Trend annotation sits in a matching off-white card with a green accent bar.
      Data: ~120 semi-transparent green bubbles (brand green #009E73) with a thin cream stroke for edge definition, sized by team size via an area-correct sqrt scale, showing a clear downward-sloping cluster (higher funding correlates with lower/negative growth) plus a dashed trend line matching the data color.
      Legibility verdict: PASS — all text is clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Title and axis labels render in light/off-white text, tick labels in a softer light gray, all clearly legible. Gridlines are subtle light lines on the dark surface. Legend box is a dark elevated card with light text, still fully readable. Trend annotation card is dark with light text and the same green accent bar.
      Data: Same ~120 bubbles in identical brand-green hue and identical (x, y, size) positions as the light render — only the surrounding chrome inverted. The alpha-blended fill reads as a darker, more saturated green against the black surface (expected compositing behavior for a semi-transparent fill, not a palette deviation), with the stroke and outline giving each bubble clear separation.
      Legibility verdict: PASS — no dark-on-dark failures; all title/axis/tick/legend text is clearly visible against the near-black background.
