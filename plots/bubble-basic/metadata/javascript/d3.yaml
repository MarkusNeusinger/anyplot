review:
  strengths:
  - Radius comes from d3.scaleSqrt() over the team-size extent with a 7-18 px range,
    so bubble area rather than radius grows with the value, the smallest bubbles stay
    visible and the largest never swallow the plot
  - Every bubble sits at its true (funding, growth) coordinate; overlap in the dense
    $100-160M cluster is handled with 0.58 fill-opacity plus a page-coloured outline,
    so individual marks stay distinguishable in both renders without any mark being
    displaced
  - The size legend reuses the data marks' exact fill, fill-opacity, page-coloured
    stroke and stroke-width scale, and is labelled in the size variable's own units
    ("Team Size (employees)", 10/50/100), so the reference set is trustworthy on both
    backgrounds
  - Gridlines are built the canonical D3 way - d3.axisBottom(x).tickSize(-ih).tickFormat("")
    with the domain path removed - giving a subtle grid with no separate grid module
  - 'Theme chrome is threaded from ANYPLOT_TOKENS throughout (ink, inkSoft, grid,
    pageBg, elevatedBg), so both renders are theme-correct with identical data colour,
    and the mount-node contract is respected: one svg sized from ANYPLOT_SIZE, deterministic
    seeded LCG, no animation'
  weaknesses:
  - 'DQ-01 (both): bubble size is almost a deterministic function of the x variable
    - team = 10 + 0.55 x funding with only a +/-10 jitter - so the smallest bubbles
    appear only at low funding and the largest only at high funding, and the size
    channel shows little the x position does not already show -> generate team size
    largely independently of funding (or widen the noise term well past +/-10) so
    both small and large teams occur across the whole funding range. Likely cause:
    the `team` formula inside the data-generation loop.'
  - 'VQ-01 (both): axis tick labels are set to 14 px, the floor of the 14-22 px band
    the D3 guide gives for a 3200 px canvas, and they are the first thing to go soft
    when the PNG is scaled to a ~400 px gallery thumbnail -> about 17-18 px (+3 to
    +4 px). Likely cause: `ax.selectAll("text").style("font-size", "14px")` in the
    axis-styling loop.'
  - 'LM-01 (code): the size legend is assembled with a `legendValues.forEach()` loop
    that appends each circle and each label one at a time, bypassing the data join
    the rest of the file uses for the bubbles -> `legend.selectAll("circle").data(legendValues).join("circle")`
    plus a second join for the value labels. Likely cause: the forEach block in the
    size-legend section.'
  - 'Suggestion: the legend card''s "10 / 50 / 100" value labels sit about 8 px above
    the card''s bottom edge; a slightly taller card would give them more breathing
    room.'
  - 'Suggestion: a D3-distinctive touch that stays inside the basic variant - unit-bearing
    tick formatters built with d3.format, or legend breakpoints driven from the radius
    scale''s own ticks - would lift LM-02 above generic scale-and-axis usage.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white matching #FAF8F1 - not pure white, not dark; 3200x1800 landscape.
      Chrome: Title "bubble-basic · javascript · d3 · anyplot.ai" in dark bold 22 px text, centred at the top and fully inside the canvas. Axis titles "Funding Raised ($M)" and "Revenue Growth Rate (%)" in dark ink at 16 px. Tick labels in softer dark grey at 14 px, printed as bare numbers (0, 20 ... 160 on x; -10, 0 ... 70 on y) with the units carried only by the axis titles. Grid is subtle in both directions and the L-shaped domain lines are softened to 55 % opacity. A rounded, elevated-grey size-legend card sits top-right, titled "Team Size (employees)" with three reference bubbles labelled 10 / 50 / 100.
      Data: ~120 bubbles in brand green #009E73 at 0.58 fill-opacity with a page-coloured outline whose width steps 1/2/3.5 px across team-size terciles; radii run 7-18 px from d3.scaleSqrt, so area rather than radius tracks team size. The single categorical series is #009E73. No colour scale, trend line, callout or bubble labels - x, y and size only.
      Legibility verdict: PASS - title, axis titles, every tick label and both legend text elements are clearly readable, with no light-on-light element and nothing clipped at a canvas edge.

    Dark render (plot-dark.png):
      Background: Warm near-black matching #1A1A17 - not pure black, not light.
      Chrome: Title, axis titles and tick labels all render in light/off-white tones and are clearly legible; no dark-on-dark failure anywhere. Gridlines stay subtle but visible, and the legend card flips to a dark elevated-grey fill with light text and a faint border.
      Data: The same #009E73 bubbles at identical positions, radii and opacity as the light render - only the chrome flipped. The translucent fill composites darker against #1A1A17, which is the expected effect of the transparency the spec requires, and the brand green stays plainly visible. Outlines flip to the dark page colour and keep overlapping bubbles in the $100-160M cluster distinguishable; the legend reference bubbles get the identical treatment.
      Legibility verdict: PASS - every text element is readable against the dark background; no dark-on-dark text, no clipping.
