      Data: All bubbles rendered in brand green (#009E73) at ~0.58 fill-opacity with a light stroke, clearly distinguishable from the cream background. Dashed trend line in the same green, with a callout card ("Growth slows as funding scales up") in a lighter elevated-bg card with a green accent bar.
      Legibility verdict: PASS — no light-on-light or illegible text found.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Title in light/white ink, clearly visible against the dark background. Axis labels and tick labels rendered in light gray/off-white tones, fully legible — no dark-on-dark failures observed. Gridlines are subtle light-gray on the dark surface, visible but unobtrusive. Legend box uses a dark elevated background with light border and light text, readable.
      Data: Bubbles use the identical #009E73 brand-green fill token as the light render (only the perceived blend differs slightly due to 0.58 alpha compositing over a dark vs. light background, which is expected and not a token change). Trend line and annotation card colors/positions match the light render exactly, only the chrome (card fill, border) flips to the dark elevated tokens.
      Legibility verdict: PASS — all text reads clearly against the dark surface, no dark-on-dark issues.
