      Data: ~120 green (#009E73) bubbles with ~0.58 fill opacity and a light stroke, sized by team size via an area-correct sqrt scale, showing funding (x) vs. growth rate (y). Overlap is handled reasonably well via alpha blending, though the densest cluster (funding 100-150) has some bubble stacking.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
