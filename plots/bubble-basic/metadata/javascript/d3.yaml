review:
  strengths:
  - 'All three spec dimensions present and correctly mapped: funding (x), growth rate
    (y), team size (size), with d3.scaleSqrt() correctly scaling bubble area (not
    radius) by value.'
  - Force-directed decluttering (d3-force collision) actively pulls overlapping bubbles
    apart while keeping rendered positions close to their true data coordinates, directly
    addressing the spec's overlap note beyond just relying on alpha.
  - Size legend clearly reproduces the real bubble treatment (same fill-opacity, same
    stroke-width-by-tercile scale) for three reference values (10/50/100), so the
    reference set is trustworthy.
  - Trend line + annotation card ('Growth slows as funding scales up') gives the chart
    a clear narrative focal point without cluttering the data field, with sensible
    z-ordering (line under bubbles, label/card on top).
  - 'Imprint palette correctly applied — first series is #009E73, identical between
    light/dark renders, and chrome (background/grid/ink) is fully theme-adaptive with
    no dark-on-dark or light-on-light failures.'
  - Deterministic LCG-seeded data generation matches the d3.js guidance for browser-side
    reproducibility (no seeded Math.random equivalent).
  weaknesses:
  - In the densest funding cluster (~100-160 $M), several bubbles still stack with
    heavy overlap despite the collision force — a touch more collision padding (or
    slightly reduced max radius, e.g. 21px to 18px) would improve individual legibility
    there.
  - Legend value labels ('10', '50', '100') are set at 14px, noticeably smaller relative
    to the legend title and canvas scale than the axis tick labels — bump to ~15-16px
    for better visual balance.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "bubble-basic · javascript · d3 · anyplot.ai" in dark bold text at top-center, clearly legible. Axis titles "Funding Raised ($M)" and "Revenue Growth Rate (%)" in dark ink, tick labels in a softer dark gray, both fully readable. Subtle horizontal/vertical gridlines visible but unobtrusive. Size legend box (top-right, "Team Size (employees)") has a light elevated-gray card with dark readable text.
      Data: ~120 green (#009E73) semi-transparent bubbles scaling by funding (x) and growth rate (y), with radius scaled by sqrt(team size). A dashed green trend line runs top-left to bottom-right, with a callout card ("Growth slows as funding scales up") anchored near it. First (and only) categorical series correctly uses #009E73.
      Legibility verdict: PASS — all text is clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Title, axis titles, and tick labels all rendered in light/off-white tones, clearly legible against the dark background. Gridlines are subtle but visible (slightly lighter than background). Legend card uses a dark elevated-gray fill with light text and border, readable.
      Data: Same green (#009E73) bubbles at the same positions, sizes, and opacity as the light render — data colors are identical between themes, only chrome (background, text, grid, legend card) flipped. Trend line and annotation card remain legible with light text on the dark elevated card.
      Legibility verdict: PASS — no dark-on-dark failures observed; all title/axis/tick text and the annotation card text are clearly visible.
