review:
  strengths:
  - Bubbles now sit exactly at their (funding, growth) data coordinates — the predecessor's
    d3-force collision simulation, which nudged marks away from their true positions,
    has been removed, satisfying the spec's C3 requirement
  - The disallowed trend line and annotation callout card are gone — the basic variant
    now encodes only x, y, and size, as the spec's C5 bullet requires
  - Max bubble radius reduced from 21px to 18px, directly addressing the prior review's
    flagged overlap issue in the densest funding cluster
  - Legend value label font size increased from 14px to 16px, improving visual balance
    against axis tick labels per the prior review's suggestion
  - Size legend reuses the identical fill-opacity, page-colored outline, and stroke-width-by-tercile
    treatment as the real bubbles, so the reference set is trustworthy in both themes
  - Deterministic seeded LCG data generation, area-correct d3.scaleSqrt() radius scale,
    and clean theme-adaptive chrome (grid, axis, legend) throughout
  weaknesses:
  - Densest funding cluster (~100-160 $M) still has substantial bubble overlap; this
    is largely expected per the spec's overlap permission, but the most crowded pocket
    could still use a touch more separation via a slightly lower fill-opacity (e.g.
    0.5) or marker size rather than any positional adjustment
  - Design Excellence is generic (single flat color, no additional visual hierarchy)
    — within the basic variant's constraints (no extra color/derived channels allowed),
    consider a more refined legend card treatment or subtler grid opacity to lift
    DE-01/DE-02
  - Library Mastery is generic (LM-02) — no D3-distinctive technique remains after
    removing the force simulation; a spec-safe distinctive touch (e.g. voronoi-based
    legend label placement, custom tick formatting) could raise this without violating
    the basic-variant constraints
