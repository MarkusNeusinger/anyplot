review:
  strengths:
  - Force-directed decluttering (d3-force with forceX/forceY/forceCollide) gently
    separates overlapping bubbles in the densest funding cluster while keeping rendered
    positions close to true data coordinates — a genuinely distinctive D3-only technique.
  - Least-squares trend line plus a custom annotation card call out the negative funding/growth
    correlation, giving the chart a clear narrative focal point rather than a flat
    scatter.
  - Size legend circles reuse the exact same fill-opacity (0.58) and per-tercile stroke-width
    scale as the real bubbles, so the reference set matches the data treatment instead
    of using a generic gray outline.
  - Bubble radius uses d3.scaleSqrt (area-based sizing, not linear radius) with alpha=0.58,
    matching the spec's explicit guidance on both points.
  - 'Both themes are fully theme-adaptive: identical brand-green data color (#009E73)
    in light and dark, chrome (title, axis, grid, legend box, annotation card) all
    correctly flip via ANYPLOT_TOKENS.'
  weaknesses:
  - The trend annotation card sits in the middle of the densest part of the scatter
    field; its opaque elevatedBg fill covers a small patch of bubbles behind it. Consider
    nudging it toward a sparser region or shrinking the card further.
  - The three legend stroke-widths (1, 1.6, 2.4 px) are visually very close at a distance
    and don't clearly reinforce the size story — widen the range slightly (e.g. 1
    / 2 / 3.5) so the tercile cue reads at a glance.
  - A handful of bubbles in the 130-150 funding range still overlap 2-3 deep despite
    the collision force; a slightly larger collision padding or lower relaxation-tick
    count trade-off could be tuned further for that specific cluster.
