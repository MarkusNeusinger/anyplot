review:
  strengths:
  - Bubble sizes scaled by area via d3.scaleSqrt, matching the spec's area-not-radius
    requirement, with a clear three-value size legend (10/50/100 employees)
  - 'Genuine data storytelling: a least-squares trend line plus an explicit annotation
    ("Growth slows as funding scales up") gives the viewer an immediate takeaway instead
    of a raw data dump'
  - Theme-adaptive bubble stroke (t.pageBg) separates overlapping circles cleanly
    in both light and dark renders
  - 'Clean, idiomatic D3: data joins, scales, and axes built directly with explicit
    font sizing throughout; no functions/classes beyond the small deterministic LCG
    seed generator'
  - Realistic, neutral startup-funding dataset (funding vs. growth vs. team size)
    with a full spread of density and correlation
  weaknesses:
  - Bubble fill-opacity (0.48) sits slightly below the 0.5-0.7 recommended for this
    density bucket (n=120 falls in the 100-300 point range) - the densest cluster
    around funding=120-150 has bubbles blending together heavily, making individual
    points hard to distinguish. Consider nudging opacity to ~0.55-0.6.
  - The trend annotation ("Growth slows as funding scales up") is small, italic, and
    sits in a visually busy area of the chart - it could be slightly more prominent
    (larger font or a subtle background) to fully anchor the story at a glance.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1-like), not pure white.
      Chrome: Bold dark title "bubble-basic · javascript · d3 · anyplot.ai" centered at top, fully visible with margin above (no clipping). Axis labels "Funding Raised ($M)" and "Revenue Growth Rate (%)" are dark, descriptive, with units. Tick labels dark and legible on both axes, similar size. Grid lines are light gray and subtle but visible. A size legend box ("Team Size (employees)" with 10/50/100 reference circles) sits top-right inside a rounded, bordered card, fully within canvas bounds.
      Data: ~120 bubbles in Imprint green (#009E73) at ~0.48 fill-opacity with light-colored strokes separating overlaps; a dashed gray regression line with an italic annotation ("Growth slows as funding scales up") calls out the negative funding/growth correlation.
      Legibility verdict: PASS - all text is clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17-like), not pure black.
      Chrome: Title and axis labels render in light/white text, clearly legible against the dark background. Tick labels light-colored. Grid lines are faint but visible gray. The size legend card uses a dark elevated surface with light text and light-stroked reference circles, fully legible.
      Data: Bubbles are the same #009E73 green as the light render (confirmed identical data color), now with dark-colored strokes (matching the dark page background) separating overlaps instead of light ones - a correct theme-adaptive touch. The dashed trend line and annotation remain legible in light gray against the dark background.
      Legibility verdict: PASS - no dark-on-dark failures observed; all text and data elements are clearly distinguishable from the near-black background.
