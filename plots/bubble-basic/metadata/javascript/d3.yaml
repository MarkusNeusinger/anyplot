review:
  strengths:
  - Force-directed decluttering (d3.forceSimulation + forceCollide) intelligently
    separates overlapping bubbles in dense funding clusters while keeping anchor strength
    high (0.85) so positions stay close to the true data — a distinctive D3-idiomatic
    technique.
  - 'Secondary redundant encoding: stroke-width steps with team-size tercile, reinforcing
    the size channel.'
  - Clear data storytelling via dashed trend line + annotated callout highlighting
    the negative funding/growth correlation.
  - Well-designed size legend with three reference bubbles (10/50/100) matching the
    real marker style.
  - Theme-adaptive chrome correctly implemented; identical green data color across
    light/dark; area-correct sqrt scale for bubble radius.
  weaknesses:
  - Force-simulation declutter shifts some bubbles away from their exact (funding,
    growth) coordinates in the densest region (funding 100-150) — a data-fidelity
    tradeoff; consider raising anchor strength further or reducing collision padding
    so rendered position tracks the true value even more tightly.
  - The trend-line annotation's background card fully occludes 1-2 bubbles directly
    behind it — minor unavoidable data occlusion from the callout.
  - Legend circle stroke uses t.palette[0] (green) while real bubbles use t.pageBg
    (cutout look) — the code comment claims they "echo the real bubble treatment"
    but the stroke color actually differs; align the legend stroke to the real bubble
    stroke treatment or fix the comment.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1, not pure white.
      Chrome: Dark-ink title "bubble-basic · javascript · d3 · anyplot.ai" centered, comfortably narrow. Dark axis titles "Funding Raised ($M)" / "Revenue Growth Rate (%)" and soft-ink tick labels all clearly legible. Subtle gridlines on both axes. Size legend box (top-right) with dark-ink header "Team Size (employees)" and reference bubbles labeled 10/50/100 — all readable.
      Data: ~120 semi-transparent brand-green (#009E73) bubbles, sized by team-size via an area-correct sqrt scale, with a background-colored cutout stroke separating overlapping bubbles. Dashed green trend line with an annotated callout card ("Growth slows as funding scales up") calling out the negative funding/growth correlation.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17, not pure black.
      Chrome: Title, axis titles, and tick labels flip to light ink and remain fully legible — no dark-on-dark failures. Grid lines, legend box, and callout card correctly use the elevated dark surface tokens (darker fills, light borders/text).
      Data: Bubble fill, trend-line color, and callout accent bar are identical brand green to the light render — only chrome (background, text, grid, box fills) changed, exactly as required.
      Legibility verdict: PASS
