review:
  strengths:
  - Bubble sizing uses d3.scaleSqrt correctly so area (not radius) scales with the
    team-size value, matching the spec's explicit requirement.
  - Alpha 0.58 fill plus a page-background stroke on every bubble keeps overlapping
    circles readable in the densest funding range (100-150).
  - The manually-built size legend (three reference circles at min/median/max) and
    the least-squares trend line with an annotated callout give the chart a clear
    point of view instead of a raw data dump.
  - 'First categorical series is the correct brand green #009E73, and all chrome (background,
    grid, axis text, legend box, trend line, annotation card) correctly flips between
    the FAF8F1 light and 1A1A17 dark tokens with identical data colors.'
  - 'Clean, idiomatic d3 patterns throughout: single data join with .join(''circle''),
    d3.axisBottom/Left generators, deterministic LCG-seeded data generation.'
  weaknesses:
  - In the densest cluster (funding ~100-150M), many bubbles stack 3-4 deep and individual
    circles become hard to distinguish even with alpha 0.58 — consider lowering fill-opacity
    slightly further (e.g. 0.45-0.5) or thickening the pageBg stroke to improve edge
    separation in that region.
  - 'Design Excellence is solid but not yet publication-grade: the trend line and
    legend are functional but plain (uniform gray dashes, unstyled outline circles)
    — consider a subtler grid opacity or a touch more visual hierarchy (e.g. slightly
    bolder stroke on the annotation card, or a lighter tone for the two smaller legend
    circles) to lift polish further.'
  - Library Mastery is correct but generic to any low-level charting library — no
    d3-specific feature (e.g. d3.quantize/d3.forceSimulation for decluttering the
    dense cluster, or a d3-specific interaction affordance surfaced in the HTML output)
    is demonstrated beyond scales/axes/joins.
  image_description: |-
