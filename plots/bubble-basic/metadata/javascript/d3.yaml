review:
  strengths:
  - Force-directed decluttering (d3-force collision) gently separates overlapping
    bubbles while an x/y pull keeps them anchored to their true (funding, growth)
    coordinates — a genuinely distinctive D3 technique for this problem
  - Least-squares trend line plus a styled annotation card ("Growth slows as funding
    scales up") gives the chart a clear focal point and explicit storytelling, not
    just raw points
  - Custom size legend with three reference values (10/50/100 employees) whose circles
    echo the real bubble treatment (brand-green tint, graduated stroke emphasis) rather
    than a generic gray reference set
  - 'Palette compliance is clean: brand green #009E73 identical between light and
    dark renders, only chrome (background, grid, ink, stroke-vs-background) adapts'
  - 'Idiomatic, KISS D3 code: selection.join, scaleSqrt for area-accurate bubble sizing,
    deterministic seeded LCG data generation'
  weaknesses:
  - The densest cluster (funding ~100-155) still has heavy bubble-on-bubble overlap
    that partially obscures individual points despite alpha=0.48 and background-colored
    stroke separation — consider trimming the max radius a few px or strengthening
    the collision padding so the cluster reads less like a solid mass
  - The small `lcg(seed)` helper is a minor deviation from a pure inline-script structure
    (acceptable given JS has no seeded RNG, but noted for CQ-01)
