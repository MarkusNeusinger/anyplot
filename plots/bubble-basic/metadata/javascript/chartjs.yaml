review:
  strengths:
  - Bubble radius is scaled by area (not radius), matching the spec's explicit accuracy
    requirement
  - Overlapping bubbles are handled with alpha (0.35-0.9) plus a largest-first draw
    order, improving individuation in dense clusters
  - Custom size-legend card explains the bubble-size encoding, satisfying the spec's
    'include a size legend' requirement
  - The 'Best value' glow + annotation gives the chart a genuine storytelling focal
    point beyond the raw x/y/size encoding
  - Data colors are identical between light and dark renders (#009E73 brand green);
    chrome (background, grid, text) is correctly theme-adaptive in both
  - Deterministic LCG-seeded data, correct title format, and descriptive axis labels
    with units ('Price ($)', 'Quality Rating (1-10)')
  weaknesses:
  - Several bubble clusters (~$85-105 and ~$150-220 price ranges) are dense enough
    that individual bubbles are hard to distinguish even with alpha blending - consider
    a slightly smaller R_MAX or more jitter/separation in the densest regions
  - The price-to-quality relationship is a fairly deterministic linear formula plus
    small noise, which makes the scatter look slightly synthetic rather than organically
    noisy
  - Design relies on a single hue throughout (brand green only) - beyond the one 'Best
    value' highlight there is no secondary visual encoding, keeping aesthetic sophistication
    just short of top-tier polish
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 - not pure white, not dark.
      Chrome: Title "bubble-basic · javascript · chartjs · anyplot.ai" in bold dark ink, clearly visible; axis titles "Price ($)" and "Quality Rating (1-10)" in dark ink; tick labels in a slightly softer dark gray; subtle light-gray gridlines on both axes; a callout-style size legend card ("Monthly sales (units)" with three reference bubbles labeled 13/56/99) sits top-left with a thin rule border. All text is clearly readable against the light background - no light-on-light issues.
      Data: ~70 semi-transparent brand-green (#009E73) bubbles scattered across price ($15-$220) vs quality (1-10), sized by area to represent monthly sales volume (10-100 units). Darker-ink strokes outline ordinary bubbles; the single "best value" bubble (lowest price, high quality-per-dollar) is rendered at higher opacity with a brand-green ring and a soft radial glow, connected to a "Best value" text callout by a thin leader line.
      Legibility verdict: PASS.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 - not pure black, not light.
      Chrome: Title, axis titles, and tick labels all render in light/off-white tones, clearly legible against the dark background; gridlines remain subtle (light, low-opacity); the size-legend card uses a dark elevated-surface fill (distinct from the page background) with light text and light-ring reference bubbles.
      Data: Bubble fill/stroke colors are identical to the light render (#009E73 brand green at the same alpha values) - only the chrome (background, text, grid, legend panel) has flipped to the dark theme. The "best value" bubble retains its highlighted ring/glow treatment and remains clearly distinguishable.
      Legibility verdict: PASS - no dark-on-dark text; all labels and ticks are rendered in light ink against the near-black surface.
