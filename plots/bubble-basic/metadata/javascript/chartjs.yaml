review:
  strengths:
  - Area-proportional bubble sizing implemented exactly as the spec requires (radius
    derived from sqrt of a linearly-interpolated area, not a naive radius-linear mapping)
  - Custom size legend rendered as an elevated callout card (rounded panel, thin rule
    border) with three representative bubble sizes and labels, correctly explaining
    the third data dimension per the spec's 'include a size legend' requirement
  - '''Best value'' annotation (highest quality-per-dollar product) highlighted with
    full opacity + brand-ring stroke and a pointer label — genuine data storytelling
    beyond the raw x/y/size encoding'
  - Correct Imprint palette usage (#009E73 first/only series) with fully theme-adaptive
    chrome — both renders pass the light/dark legibility checks with identical data
    color
  - Title, axis titles (with units/scale), and tick labels all use explicit font sizes
    and match the mandated 'bubble-basic · javascript · chartjs · anyplot.ai' format
  - Deterministic seeded LCG for reproducible data generation, matching the browser-only
    reproducibility constraint for JS entries
  weaknesses:
  - Regular-bubble alpha is 0.45, slightly below the spec's recommended 0.5-0.7 overlap-transparency
    range — nudge to ~0.55-0.6 for slightly better legibility of individual bubbles
    while keeping the best-value bubble at full opacity
  - The dense cluster around $80-140 price / quality 5-7 has many same-size overlapping
    bubbles that blend into indistinct blobs, making individual bubbles hard to separate
    visually in that region — consider a touch more edge-highlighting contrast (a
    slightly lighter/darker stroke per bubble) or minor size-range compression to
    improve separability without losing the area-encoding
  - Design excellence is solid (custom legend card, annotation) but the chart is still
    a single-hue green bubble scatter with no additional visual refinement beyond
    that — there's room for more aesthetic sophistication (e.g. subtle depth cue on
    the highlighted bubble, refined legend typography hierarchy) to lift it beyond
    'good default with two nice touches'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 (not pure white, not dark).
      Chrome: Title "bubble-basic · javascript · chartjs · anyplot.ai" in bold dark ink at top-center, clearly readable. X-axis title "Price ($)" and y-axis title "Quality Rating (1–10)" in dark ink, both readable. Tick labels ($0-$250, 2-8) in medium-gray ink, readable and balanced in size between axes. Subtle light-gray gridlines on both axes, visible but not competing with data. A top-left elevated callout card ("Monthly sales (units)") shows a three-bubble size legend (13/56/99) with dark labels, clearly readable and not overlapping any data bubble.
      Data: ~70 green (#009E73) bubbles at varying alpha (0.45 normal, 0.9 for the single highlighted "best value" bubble which also has a solid green ring). Bubble area scales with monthly sales; a dark-ink pointer line + bold "Best value" label call out the highest quality-per-dollar product near the bottom-left.
      Legibility verdict: PASS — all text (title, axis titles, ticks, legend, annotation) is clearly readable against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 (not pure black, not light).
      Chrome: Title, axis titles, and the annotation "Best value" text render in light/white ink, clearly readable. Tick labels render in a lighter gray, readable and still balanced between axes. Gridlines are faint light lines, subtle but visible. The size-legend callout card switches to a dark elevated panel (#242420-like) with light text and a light border rule — fully readable.
      Data: Same ~70 bubbles in identical #009E73 green at the same alpha values as the light render — data color is unchanged, only chrome flipped. The highlighted "best value" bubble keeps its brighter, fully-opaque green with a light-colored ring instead of the light render's ink-colored ring (adapted appropriately to remain visible on dark).
      Legibility verdict: PASS — no dark-on-dark failures observed; all title/axis/tick/legend/annotation text is clearly legible against the near-black background, and the brand green remains vivid on both surfaces.
