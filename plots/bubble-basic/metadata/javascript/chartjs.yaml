review:
  strengths:
  - Correct area-proportional bubble sizing (sqrt of a linearly-interpolated area)
    rather than naive radius scaling, exactly as the spec requires
  - Custom size-legend plugin drawn as an elevated card matching the style guide's
    callout-box role, with three representative size samples labeled in real units
  - '"Best value" annotation (highest quality-per-dollar product) creates a genuine
    storytelling focal point beyond the raw x/y/size encoding, with full-opacity +
    brand-ring highlighting via scriptable options'
  - Deterministic seeded LCG data generation; price/quality/sales values are realistic
    and appropriately scaled for a product-portfolio domain
  - Correct Imprint palette and theme-adaptive chrome in both renders; identical data
    color between light and dark, only chrome flips
  - 'Idiomatic Chart.js usage: native "bubble" type, scriptable per-point styling
    functions, and real plugin API (afterDraw) for the legend/annotation rather than
    any faked overlay'
  weaknesses:
  - 'Header comment already states "Quality: 93/100" instead of "Quality: pending"
    for a first-attempt, not-yet-reviewed implementation — cosmetic only (impl-review.yml''s
    header-rewrite overwrites it), but worth aligning with the skeleton convention'
  - The densest cluster (price ~$80-140) has heavy bubble overlap even with alpha
    0.55; individual points there are hard to isolate precisely — an inherent bubble-chart
    tradeoff, not a defect, but could be softened slightly further (alpha ~0.45) if
    this spec is regenerated
  - Size-legend caption ("Monthly sales (units)") sits at 15px against a 22px title
    — a touch small for the visual hierarchy; bumping to ~16-17px would balance it
    better
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "bubble-basic · javascript · chartjs · anyplot.ai" in bold dark ink, clearly legible; axis titles "Price ($)" and "Quality Rating (1-10)" in dark ink; tick labels in soft dark gray; gridlines are thin and subtle but visible. A top-left legend card ("Monthly sales (units)") with three sample bubbles and value labels (13/56/99) is fully legible against its elevated off-white panel. A "Best value" annotation with a thin leader line points to a highlighted, fully-opaque bubble near the bottom-left.
      Data: ~70 semi-transparent green bubbles (Imprint #009E73 at alpha ~0.55), sized by area to encode monthly sales volume, positioned by price (x) and quality rating (y); the highlighted "best value" bubble is rendered at full opacity with a solid brand-green ring.
      Legibility verdict: PASS — all text (title, axis titles, tick labels, legend text, annotation) is clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Title, axis titles, and tick labels have flipped to light/white tones and remain clearly legible; gridlines are subtle white-ish lines, visible but unobtrusive. The legend card now uses a dark elevated background with a thin border, and its text is white — no dark-on-dark failure. The "Best value" annotation text and leader line are rendered in light ink, clearly visible against the dark background.
      Data: Bubble fill and stroke colors are identical to the light render (Imprint #009E73 at the same alpha values) — confirmed only chrome (background, text, grid, legend/annotation ink) changed between themes, not the data-encoding colors.
      Legibility verdict: PASS — all chrome elements are clearly readable in the dark theme; no dark-on-dark or unreadable text found. Brand green reads clearly on the near-black surface.
