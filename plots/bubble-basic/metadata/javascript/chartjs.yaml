review:
  strengths:
  - Area-proportional bubble sizing (sqrt of interpolated area, not linear radius)
    — matches the spec's explicit accuracy requirement
  - Includes a genuine size legend (custom afterDraw plugin) that maps three reference
    values (min, mid, max) to bubble sizes with labels — satisfies the spec's 'include
    a size legend' note that many bubble implementations skip
  - Alpha 0.55 for overlap handling lands squarely in the spec-recommended 0.5-0.7
    range, and per-bubble stroke matches the page background so overlapping circles
    stay visually separable
  - Correct Imprint palette usage (#009E73 first/only series) with theme-correct chrome
    in both renders — background, title, axis, and tick colors all flip correctly
    between light and dark with identical data color
  - 'Clean mount-node contract compliance: single canvas appended once, animation
    disabled, no fixed width/height set on the canvas or container'
  - Deterministic in-memory data via a tiny seeded LCG (seed=42), no network/file
    access
  weaknesses:
  - Size-legend value labels ('13', '56', '99') are drawn at 13px CSS — at the ~400px
    mobile thumbnail this text is barely legible; bump the legend font a couple px
    or increase weight so it survives the mobile srcset downscale
  - 'No data-storytelling layer beyond the raw scatter-of-bubbles encoding: the price/quality/sales
    relationship is visible but nothing (e.g. a subtle trend cue, a highlighted standout
    bubble, or an annotation on the strongest outlier) helps the viewer land on the
    insight faster'
  - The dense top-right and mid-price clusters (roughly price 100-140 and 200-220)
    have 4-6 overlapping bubbles stacked on each other; with 70 points at similar
    sizes in those regions, individual products become hard to distinguish even with
    alpha — consider a touch more separation (jitter or slightly increased alpha contrast)
    in the densest bands
  - 'LM-02: the afterDraw legend plugin is a reasonable use of Chart.js''s plugin
    hook but is a fairly generic canvas-drawing technique achievable in most canvas-based
    libraries; a more Chart.js-distinctive touch (e.g. leveraging built-in scriptable
    options, custom tooltip callbacks visible in the HTML view, or the legend plugin
    registry) would push Library Mastery further'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1-consistent), not pure white.
      Chrome: Title "bubble-basic · javascript · chartjs · anyplot.ai" in dark ink, centered top, fully visible with no clipping. X-axis title "Price ($)" and Y-axis title "Quality Rating (1-10)" in dark ink with units. Tick labels in soft dark grey, subtle light grid lines. A custom size legend ("Monthly sales (units)" + three sample circles labeled 13/56/99) sits in the top-left of the plot area, in a region with no data, so it does not overlap any bubbles.
      Data: ~70 semi-transparent green (#009E73) bubbles with thin light-colored (page-background-colored) strokes, sized by area to represent monthly sales volume, positioned by price (x) and quality rating (y). A general upward price-quality trend is visible with noise.
      Legibility verdict: PASS (all title/axis/tick text and legend text are readable against the light background; legend numeric labels are small but legible at full resolution).

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17-consistent), not pure black.
      Chrome: Title, axis titles, and tick labels all rendered in light ink, fully readable against the dark background — no dark-on-dark text anywhere. Grid lines are subtle and visible. Size legend text is light-colored and readable in the same top-left position.
      Data: Bubbles are the same #009E73 green, same positions and sizes as the light render — data colors are identical between themes, only chrome (background/text/grid) flipped. Bubble strokes now match the dark page background, preserving the same separation effect as the light render.
      Legibility verdict: PASS (no dark-on-dark failures observed; all text elements clearly legible).
