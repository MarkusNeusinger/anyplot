review:
  strengths:
  - 'Uses Chart.js''s native `type: "bubble"` with `{x, y, r}` datapoints — the library''s
    own bubble primitive rather than a hand-rolled scatter with sized markers'
  - The size legend is drawn through the Chart.js plugin API (`afterDraw` on the canvas
    2D context), the idiomatic way to add a key the library ships no native widget
    for
  - Tooltip `label` callback reports price, quality and sales units per bubble in
    the interactive HTML output
  - 'Theme tokens are threaded through every chrome element (title, axis titles, ticks,
    grid, legend card fill and rule), so both renders are theme-correct while the
    #009E73 data color stays identical'
  - Bubbles are drawn largest-first with alpha 0.55 and a 1.5 px ink outline, so individual
    marks in the dense $80-140 cluster stay separable from each other and from the
    page
  - Deterministic fixed-seed LCG (seed 42), no network access — exactly the reproducibility
    pattern the Chart.js harness requires
  weaknesses:
  - 'SC-02 (both): bubble area is affine in the size value instead of proportional
    to it — 13 units maps to 36 px² of area and 26 units to about 297 px² (8×, not
    2×), so the spec''s "a value twice as large has twice the area" does not hold
    and the small bubbles are understated relative to the large ones → make area proportional
    to the value, e.g. `r = R_MAX * Math.sqrt(size / sizeMax)` with a floor only for
    the very smallest. Likely cause: `bubbleRadius()` interpolating area between `R_MIN
    * R_MIN` (36) and `R_MAX * R_MAX` (1764).'
  - 'VQ-03, SC-02 (both): the size legend''s reference bubbles are filled at alpha
    0.35 with a 1 px `inkSoft` outline while the data marks use alpha 0.55 with a
    1.5 px ink outline, so on the light render the legend circles read visibly paler
    than the bubbles they explain → draw them with the data marks'' fill alpha, stroke
    color and border width. Likely cause: `hexToRgba(t.palette[0], 0.35)` and `strokeStyle
    = t.inkSoft` inside the `sizeLegend` plugin.'
  - 'Suggestion: the x scale runs to $250 while the data stops near $220; a tighter
    `max` would give the bubbles more of the canvas.'
  - 'Suggestion: a few code comments still describe earlier revisions ("previously
    stacked in insert order", "now that the axis is pinned to 1-10") and could be
    rewritten to describe the current state.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white matching #FAF8F1 across both the mount and the plot area — not pure white, not dark.
      Chrome: Bold dark-ink title "bubble-basic · javascript · chartjs · anyplot.ai" centred at the top; x-axis title "Price ($)" and y-axis title "Quality Rating (1–10)" in dark ink; tick labels ($0–$250, 1–10) in a softer dark gray; hairline low-opacity gridlines on both axes. A rounded elevated card (#FFFDF6 fill, thin rule) sits top-left inside the plot area with the bold header "Monthly sales (units)" and three reference bubbles labeled 13 / 56 / 99. All text is clearly readable — no light-on-light anywhere.
      Data: ~70 translucent brand-green (#009E73 at alpha 0.55) bubbles with a thin dark ink outline, spread over price $15–$220 against quality 2–9.8, radius encoding monthly sales volume. First (and only) series is #009E73. No highlighted bubble, no callout, no trend line. The legend's reference circles are noticeably paler than the data bubbles (alpha 0.35 vs 0.55).
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black matching #1A1A17 — not pure black, not light.
      Chrome: Title, both axis titles and all tick labels render in light off-white ink and are clearly legible; no dark-on-dark text anywhere. Gridlines stay subtle light hairlines. The size-legend card switches to the dark elevated fill (#242420) with light text and light-stroked reference bubbles.
      Data: Identical bubble color and alpha to the light render (#009E73 at 0.55) — only the chrome flipped; over the near-black surface the same fill reads as a deeper green and the outlines are light instead of dark. Every bubble sits at the same (x, y) position as in the light render. Brand green is clearly visible against the dark surface.
      Legibility verdict: PASS
