review:
  strengths:
  - 'Custom Chart.js plugin system used well: a static size-legend card, a soft radial
    glow, and a "Best value" callout annotation add genuine data storytelling beyond
    the raw x/y/size encoding.'
  - Area-proportional bubble radius (sqrt of linearly-scaled area, not raw radius)
    correctly follows the spec's perceptual-accuracy requirement.
  - 'Z-order fix: bubbles are drawn largest-first so smaller bubbles stay visible
    on top in the dense $80-140 cluster, improving individuation.'
  - Theme tokens threaded correctly through title, axis ticks/labels, grid, legend
    card, and annotation text — both renders are fully legible with identical data
    colors.
  - 'First series correctly uses Imprint brand green #009E73; title format matches
    the mandated `bubble-basic · javascript · chartjs · anyplot.ai` pattern exactly.'
  weaknesses:
  - Base bubble opacity (0.48) sits just under the spec's recommended 0.5-0.7 alpha
    range for overlap handling — nudging it up slightly would improve separation in
    the dense $80-140/quality-5-6 cluster.
  - Several small helper functions (makeLcg, bubbleRadius, hexToRgba) add structure
    beyond a bare script; justified by the custom-plugin requirements but keeps CQ-01
    (KISS) from a perfect score.
  - 'LM-01: mostly idiomatic core Chart.js bubble-chart usage with scriptable per-point
    styling, but leans on manual canvas drawing for the legend/annotation rather than
    any Chart.js-native legend/tooltip mechanism — a reasonable choice for a static
    PNG, but not the most idiomatic path for every case.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "bubble-basic · javascript · chartjs · anyplot.ai" in bold dark ink, clearly visible; "Price ($)" and "Quality Rating (1–10)" axis titles in dark ink; tick labels ($0-$250, 1-10) in softer dark gray; subtle light-gray gridlines on both axes; a top-left elevated legend card ("Monthly sales (units)") with three reference bubbles (13/56/99) and value labels, all dark text on the light card fill; a "Best value" callout with a dark leader line and bold dark label.
      Data: ~70 semi-transparent green (#009E73) bubbles with darker ink strokes, sized by area for monthly sales, positioned by price (x) and quality rating (y); one bubble (best value) rendered at higher opacity with a brand-green ring and a soft radial glow halo.
      Legibility verdict: PASS — all text reads clearly against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title and axis titles now in light/white text; tick labels in a softer light gray; grid lines are subtle light strokes; the legend card flips to a dark elevated fill (#242420-like) with white text and light-stroked reference bubbles; the "Best value" callout line and label render in white.
      Data: the same set of green (#009E73) bubbles, now outlined with light/white strokes instead of dark ink so they read against the dark surface; the highlighted best-value bubble again shows the brand-green ring and glow. Data colors are identical to the light render — only the chrome (background, text, grid, strokes) flipped.
      Legibility verdict: PASS — all chrome text is light against the dark background; no dark-on-dark failures observed.
