review:
  strengths:
  - Bubble sizing is genuinely area-proportional (radius derived from sqrt of interpolated
    area) rather than the common radius-proportional mistake, exactly per the spec
    note
  - Custom canvas-drawn size legend clearly explains the bubble-area encoding with
    three reference sizes (min/mid/max), addressing the spec's explicit request for
    a size legend
  - Best-value product (highest quality/price ratio) is highlighted with full opacity,
    a brand-green ring, a soft radial glow, and a callout annotation -- a genuine
    data-storytelling focal point beyond raw x/y/size encoding
  - Largest-bubbles-drawn-first z-ordering plus alpha 0.58 (0.9 for the highlighted
    point) directly follows the spec's overlap-handling guidance and keeps the dense
    $80-140 cluster individuated
  - Theme tokens are threaded through every chrome element (title, axis ticks/titles,
    grid, legend card, annotation) and both PNGs render correctly on the warm off-white
    / warm near-black surfaces with no dark-on-dark or light-on-light failures
  - Deterministic LCG-seeded data generation with a plausible price/quality/sales-volume
    business scenario and realistic positive price-quality correlation with noise
  weaknesses:
  - In the densest cluster (roughly $80-140 price range), many similarly-sized bubbles
    still overlap heavily enough that individual points are hard to isolate visually
    -- a slightly lower max alpha or a touch more radius spread in that band would
    help
  - The implementation relies on several small canvas plugins (sizeLegend, bestValueGlow,
    standoutAnnotation) for customization -- justified by Chart.js's plugin idiom
    for a static PNG screenshot, but it moves away from a flat KISS script structure
  - Size legend text (15px value labels) is noticeably smaller than the axis tick
    labels (14px) sitting right next to bubbles of comparable visual weight -- could
    bump to 16px for better internal balance within the card
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 -- not pure white.
      Chrome: Title "bubble-basic · javascript · chartjs · anyplot.ai" in bold dark ink, centered top, clearly legible. X-axis title "Price ($)" and Y-axis title "Quality Rating (1-10)" in dark ink, tick labels in a slightly softer dark gray. Subtle light-gray gridlines on both axes. A callout-style size legend card ("Monthly sales (units)" with three reference bubbles labeled 13/56/99) sits top-left inside the plot area with a soft border, not floating isolated. A "Best value" annotation with a thin connector line points at one of the lowest-price bubbles.
      Data: ~70 bubbles in brand green (#009E73) with alpha transparency, sized by area, densest in the $60-150 price band trending toward higher quality ratings; the highlighted best-value bubble is rendered at full opacity with a darker green ring and a soft radial glow underneath it.
      Legibility verdict: PASS -- all text (title, axis titles, tick labels, legend card text, annotation) is clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 -- not pure black.
      Chrome: Same title, axis titles, and tick labels now rendered in light ink/off-white, clearly visible against the dark surface. Gridlines are a subtle light tone at low opacity. The size-legend card now uses a dark elevated panel fill with light text and light-colored reference bubble outlines. The "Best value" annotation line and text are rendered in light ink, fully legible.
      Data: The bubble fill color is the identical brand green (#009E73) as the light render -- confirmed unchanged data hue; only the chrome (background, text, grid, legend panel, annotation stroke) flipped to the dark-theme tokens. The best-value bubble's glow and ring remain visible and distinct against the dark background.
      Legibility verdict: PASS -- no dark-on-dark failures observed; every title/label/tick/legend/annotation element is clearly legible on the near-black surface.
