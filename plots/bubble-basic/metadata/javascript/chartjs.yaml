      Data: The bubbles are the identical #009E73 green at identical positions and sizes to the light render — only chrome (background, text, grid, bubble stroke color) flips, exactly as required.
      Legibility verdict: PASS — no dark-on-dark or light-on-light failures; brand green reads clearly against the near-black surface.
