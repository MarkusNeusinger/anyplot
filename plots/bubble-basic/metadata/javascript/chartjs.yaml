review:
  strengths:
  - Regular-bubble alpha raised to 0.58 (within the spec's 0.5-0.7 overlap-transparency
    range) while the best-value bubble stays near-opaque, fixing the prior attempt's
    under-transparency finding
  - Ordinary bubbles now use a higher-contrast ink-based stroke instead of a page-bg-matched
    one, meaningfully improving separability of overlapping bubbles in the dense $80-140
    cluster
  - New radial-gradient depth-cue glow drawn beneath the best-value bubble (beforeDatasetsDraw)
    adds genuine aesthetic sophistication and reinforces the data-storytelling focal
    point
  - Area-proportional bubble sizing implemented correctly (radius derived from sqrt
    of linearly-interpolated area, not naive radius-linear mapping)
  - Custom size-legend rendered as an elevated callout card (rounded panel, thin rule,
    theme-adaptive colors) explaining the third data dimension, exactly as the spec
    requires
  - Correct Imprint palette usage (#009E73 as the only series) with fully theme-adaptive
    chrome; both renders pass light/dark legibility checks with identical data color
  - Deterministic seeded LCG for reproducible data generation; title, axis titles
    (with units), and tick labels all use explicit font sizes and match the mandated
    title format
  weaknesses:
  - The dense cluster around $80-140 price / quality 5-7 still has meaningful bubble
    overlap; the new ink-stroke contrast helps but a few same-size bubbles in that
    region remain hard to fully individuate
  - Overall palette is still single-hue green; the glow depth-cue is a nice addition
    but further refinement (e.g. subtle legend typography hierarchy) could push Design
    Excellence higher
  - 'CQ-01: several small helper functions (makeLcg, bubbleRadius, hexToRgba) are
    used — justified by the size-encoding math, but keep an eye on creeping structure
    if future edits add more'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Bold dark title "bubble-basic · javascript · chartjs · anyplot.ai" centered at top, fully readable. X-axis "Price ($)" and y-axis "Quality Rating (1-10)" titles and tick labels in dark ink, balanced sizes. Subtle light-gray gridlines, visible but not dominant. Top-left elevated card gives a 3-bubble size legend (13/56/99 units) with dark text on a light panel.
      Data: ~70 green (#009E73) bubbles at ~0.58 alpha with darker ink-colored strokes for separability; one bubble near $20/4.5-quality is highlighted at near-full opacity with a brand-green ring, a soft radial glow beneath it, and a "Best value" pointer annotation in dark ink.
      Legibility verdict: PASS — all text (title, axis titles, ticks, legend text, annotation) is clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Title, axis titles, tick labels, size-legend text, and the "Best value" annotation all render in light/white ink and remain fully legible. The size-legend card correctly switches to a dark elevated panel with a light border rule.
      Data: Bubble fill colors and alpha values are identical to the light render (#009E73 green, ~0.58 / near-opaque highlight); the highlighted bubble's ring and glow stay clearly visible against the dark surface, and ordinary-bubble strokes remain visible without turning into dark-on-dark blobs.
      Legibility verdict: PASS — no dark-on-dark failures; all text reads clearly and the brand green stays vivid on both surfaces, confirming only chrome flipped between themes.
