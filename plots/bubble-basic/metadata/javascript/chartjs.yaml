review:
  strengths:
  - Correct area-based bubble sizing (sqrt(area) formula) matching the spec's requirement
    to scale bubbles by area rather than radius
  - Custom size legend explains the third dimension with concrete min/mid/max example
    bubbles, drawn as an elevated callout card matching the style guide
  - 'Genuine data storytelling: a ''Best value'' annotation with a soft radial glow
    highlights the highest quality-per-dollar product, not just a raw x/y/size encoding'
  - Draws largest bubbles first so smaller bubbles render on top, improving individuation
    in dense overlapping clusters
  - Theme-adaptive chrome is threaded through consistently (ink, inkSoft, grid, elevatedBg);
    both renders are fully readable and share identical data colors
  - Per-bubble tooltip callback exposes price/quality/sales detail in the interactive
    HTML view
  weaknesses:
  - Dense clusters (roughly $100-140 price range) have many overlapping bubbles where
    individual boundaries are hard to trace despite the ink-colored stroke — a slightly
    higher-contrast stroke or gentle positional jitter would ease this
  - The Y-axis auto-scales to the data range (~2-8) while the axis title states 'Quality
    Rating (1-10)' — the displayed scale doesn't match the stated range; set scales.y.min=1/max=10,
    or simplify the label to drop the numeric range
  - Relies on three custom Canvas plugins (glow, size legend, annotation) plus several
    helper functions — more code surface than a minimal KISS baseline, though it buys
    real storytelling value here
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Title "bubble-basic · javascript · chartjs · anyplot.ai" in bold dark ink, clearly visible and comfortably sized. Axis titles "Price ($)" and "Quality Rating (1–10)" in dark ink. Tick labels ($0-$250, 2-8) in softer gray-ink, all legible. Subtle light-gray gridlines on both axes, visible but not competing with data. Custom size-legend card top-left ("Monthly sales (units)" with 13/56/99 example bubbles) sits on an elevated cream card with a thin rule, fully readable.
      Data: All bubbles render in brand green (#009E73) at varying opacity — 0.58 for regular bubbles, 0.9 plus a brighter ring for the highlighted "Best value" bubble. Bubble area scales with monthly sales (10-100 units), giving visibly distinct small/medium/large bubbles. The "Best value" annotation (dark leader line + bold label) points clearly to the highlighted bubble in the low-price/mid-quality region.
      Legibility verdict: PASS — no light-on-light text, no clipped or obscured labels.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Title, axis titles, and tick labels all render in light ink/soft-ink tones, clearly visible against the dark surface. Gridlines are the same subtle style, now light-on-dark and still non-dominant. The size-legend card switches to the dark elevated background (#242420-equivalent) with light text and a light-toned example bubble outline — fully readable, no dark-on-dark failure anywhere.
      Data: Bubble colors and positions are pixel-identical to the light render — same green hue, same opacity levels, same "Best value" highlight and glow. Only the chrome (background, text, grid, legend card) flipped, as required.
      Legibility verdict: PASS — no dark-on-dark text, brand green reads clearly against the near-black background.
