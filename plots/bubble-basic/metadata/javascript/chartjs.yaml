review:
  strengths:
  - 'Fixed the attempt-1 legibility gap: the size-legend value labels ("13", "56",
    "99") now render at bold 15px instead of 13px, surviving the ~400px mobile thumbnail
    downscale'
  - 'Added a genuine data-storytelling layer: a computed "best value" product (highest
    quality-per-dollar) is highlighted with full opacity, a thicker brand-green stroke,
    and a connector-line annotation — resolves the attempt-1 DE-03 gap with a real
    insight, not decoration'
  - More idiomatic Chart.js usage via scriptable per-point options (backgroundColor/borderColor/borderWidth
    as functions of dataIndex) plus a formatted tooltip callback — moves LM-02 beyond
    generic canvas drawing
  - Area-proportional bubble sizing (sqrt of interpolated area, not linear radius)
    matches the spec's explicit accuracy requirement
  - Alpha 0.55 (0.9 for the highlighted bubble) lands in the spec-recommended 0.5-0.7
    overlap-handling range, with page-background-matched strokes keeping overlapping
    bubbles separable
  - Correct Imprint palette usage (#009E73) with theme-correct chrome in both renders;
    data colors identical between light and dark, only chrome flips
  - Deterministic in-memory data via a tiny seeded LCG (seed=42), no network/file
    access; clean mount-node contract with animation disabled
  weaknesses:
  - The size-legend header text ("Monthly sales (units)") is still drawn at 13px —
    only the numeric value labels were bumped to bold 15px; bump the header a couple
    px too for full mobile-thumbnail consistency
  - The mid-price cluster (~$100-140, quality 5.5-6.5) still has several bubbles stacked
    closely on top of each other; a touch more separation or a slightly stronger stroke
    contrast in the densest band would help individual bubbles read more distinctly
  - Visual refinement (DE-02) is still fairly close to a well-configured default look
    — no distinctive chrome/typography choices beyond the spec-required elements
  image_description: |-
