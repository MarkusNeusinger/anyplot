review:
  strengths:
  - Custom-rendered size legend and a focal-point callout add real data storytelling
    beyond a bare position+size encoding
  - Theme-adaptive tokens used consistently; brand green is identical between light
    and dark renders, only chrome flips
  - Deterministic LCG data generation produces plausible, independent x/y/size distributions
    with realistic ranges
  - Differentiated stroke treatment (page-bg edge on regular bubbles, amber ring on
    the focal one) keeps overlapping bubbles in dense clusters legible
  - All font sizes explicitly set across title, axis titles, ticks, legend, tooltip
    and callout
  weaknesses:
  - Amber (#DDCC77) is documented as the warning/caution semantic anchor, but here
    it highlights the top-performing 'standout' company — a positive callout, not
    a warning. This repurposes the anchor outside its reserved role; a green-toned
    or neutral ring would fit the semantics better.
  - Bubble fill alpha is 0.45, slightly below the spec note's recommended 0.5-0.7
    range for handling overlap; the densest cluster (~20-24% growth, $300-400M revenue)
    blends into a less distinct blob of circles.
  - Code relies on four custom helper functions (rand, radiusForShare, drawSizeLegend,
    highlightFocalPoint) rather than a flatter Imports→Data→Plot→Save structure. Largely
    justified by Highcharts' render-callback pattern and the lack of a browser RNG,
    but could be trimmed.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Bold dark title "bubble-basic · javascript · highcharts · anyplot.ai" centered at top; dark axis titles "Year-over-Year Growth Rate (%)" and "Annual Revenue ($M)"; soft-gray tick labels on both axes; subtle light-gray gridlines on both axes. A hand-drawn size legend ("Share of Own Market Segment (%)" with 10% / 55% / 100% reference circles) sits in the reserved right margin, attached to the plot rather than floating. A bordered callout box near the bottom-right reads "Standout: 28% growth, 95% segment share", pointing to one amber-ringed bubble. All text is clearly readable against the light background.
      Data: ~90 translucent green bubbles (brand green #009E73 at ~45% opacity) scattered across the growth/revenue plane, sized by segment-share (area-scaled). Most bubbles have a thin off-white edge to separate them where they overlap; the one focal/standout bubble has a thicker amber-colored ring.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title now in light/off-white text, axis titles and tick labels in light gray, gridlines faint and light-colored against the dark surface. The size legend and the "Standout" callout box both flip to dark-surface chrome (light text, dark box fill, amber border) and remain fully readable — no dark-on-dark text anywhere.
      Data: The bubbles are the same brand green (#009E73) at the same 45% opacity and same position/size mapping as the light render — data colors are identical between themes as required, only the surrounding chrome inverted.
      Legibility verdict: PASS
