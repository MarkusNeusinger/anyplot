review:
  strengths:
  - Bubble sizes are correctly area-scaled (sqrt of the normalized share) matching
    the spec's 'scale by area, not radius' requirement, with a clear manually-drawn
    3-point size legend (10%/55%/100%) compensating for the core bundle's missing
    bubbleLegend module
  - Alpha blending (0.6-0.75, inversely scaled with bubble size) plus page-bg-colored
    strokes keep overlapping bubbles visually separable, matching the spec's transparency
    guidance
  - A deliberate anti-overlap placement algorithm (up to 10 candidate retries, rejecting
    2+-way clumps) keeps a 70-point field navigable instead of degenerating into indistinguishable
    blobs
  - The focal 'Segment leader' annotation with a highlighted ink-colored stroke creates
    a clear visual hierarchy and focal point, directly addressing the prior review's
    data-storytelling feedback
  - 'Theme tokens are threaded correctly throughout: identical data colors between
    light/dark renders, page-bg-aware bubble strokes that flip with theme, ink/inkSoft
    chrome, and a transparent chart background'
  - Deterministic LCG-seeded data generation, descriptive axis labels with units,
    and an idiomatic core-bundle workaround (scatter series + per-point marker.radius)
    given the bubble series type isn't loaded
  weaknesses:
  - 'Near-total overlap of a bubble pair around growth ~23%, revenue ~$110-140M: the
    smaller bubble is almost fully hidden behind the larger one, leaving only a thin
    crescent plus edge stroke visible, making it hard to tell there are two distinct
    data points there. Tighten the anti-overlap threshold (e.g. raise the 0.9 factor
    in closeNeighborCount closer to 1.0, or reject on 1+ close neighbor instead of
    2+) so single-pair overlaps stay partial rather than near-total.'
  - The manually-drawn size legend and tooltip are functional but fairly basic; no
    other distinctive Highcharts technique is used beyond the minimum needed to work
    around the missing bubble series module.
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white, matches #FAF8F1 — not pure white, not dark.
      Chrome: bold dark title "bubble-basic · javascript · highcharts · anyplot.ai" centered at top; "Year-over-Year Growth Rate (%)" x-axis title and "Annual Revenue ($M)" y-axis title in medium-gray ink; tick labels ("-4%"..."28%", "$0"..."$550") in lighter gray; subtle horizontal/vertical gridlines; manual size-key legend on the right ("Share of Own Market Segment (%)" with 10%/55%/100% sample circles). All chrome text is clearly readable against the light background.
      Data: ~70 green (#009E73) semi-transparent bubbles scattered across the growth/revenue plane, sized by market-segment share (area-scaled). One bubble (~3% growth, ~$150M revenue) is outlined in dark ink and labeled "Segment leader / 100% share" above it. Overlapping bubbles are separated by a thin page-background-colored stroke. One pair near growth~23%, revenue~$110-140M overlaps almost completely (only a thin crescent of the smaller bubble visible).
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black, matches #1A1A17 — not pure black, not light.
      Chrome: same title now rendered in white/light text; axis titles and tick labels in light gray, clearly legible; gridlines subtle but visible; size-key legend text flips to light gray/white against the dark background.
      Data: identical green bubble colors and layout to the light render — same positions, same relative sizes, same overlap pattern. The focal bubble's highlight stroke flips from dark ink to white/light so it still reads clearly against the dark background.
      Legibility verdict: PASS — no dark-on-dark or light-on-light failures observed; brand green remains clearly visible on both surfaces.
