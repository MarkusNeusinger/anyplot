review:
  strengths:
  - Correct area-based bubble radius scaling (radius ∝ sqrt(value fraction)) matching
    the spec's explicit requirement to scale by area, not radius.
  - Clever custom size legend built with chart.renderer (text + circles) to work around
    the core Highcharts bundle's missing bubbleLegend from highcharts-more — shows
    min/mid/max reference bubbles with labels.
  - Alpha blending (0.6–0.75) combined with a page-background-colored marker stroke
    cleanly separates overlapping same-color bubbles in both themes instead of letting
    them merge into indistinguishable blobs.
  - 'Full theme-adaptive chrome: identical Imprint green data color across light/dark,
    backgrounds match #FAF8F1 / #1A1A17, all chrome text readable in both renders.'
  - Deterministic seeded LCG data generation, no external fetch, self-contained per
    the JS harness contract.
  weaknesses:
  - Several dense clusters of similarly-sized, overlapping bubbles (e.g. the trio
    near 7% growth / $275M revenue, and the cluster near 22-24% growth / $350-420M
    revenue) fuse into hard-to-parse blobs even with alpha blending — consider a touch
    more separation (jitter or slightly narrower radius range) in the densest regions.
  - 'Data storytelling is flat: the chart reads as a well-executed exploratory scatter
    but has no single focal point or emphasis (e.g. a highlighted outlier or annotated
    segment) to guide the viewer''s eye — DE-03.'
  - The legend metric "Share of Own Market Segment (%)" is a per-company, per-segment
    figure rather than a conventional shared market-share number; the code comment
    and tooltip clarify this, but a static PNG viewer without the tooltip could misread
    it as a global market-share metric.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white, not dark.
      Chrome: Title "bubble-basic · javascript · highcharts · anyplot.ai" in bold dark ink, comfortably sized (~33% of canvas width, well within bounds, no overflow). X-axis title "Year-over-Year Growth Rate (%)" and Y-axis title "Annual Revenue ($M)" in medium-gray ink, balanced in size. Tick labels ($0-$550, -4%-28%) in lighter gray, all clearly legible. Grid lines are thin and subtle, visible but not dominant. A manually-drawn size legend "Share of Own Market Segment (%)" sits in the reserved right margin with three reference bubbles (10%, 55%, 100%) and labels, fully visible, not clipped.
      Data: ~70 bubbles in Imprint brand green (#009E73), fill opacity varying 0.6-0.75 by size, with a subtle light-colored stroke separating overlapping bubbles. Bubble radius scales by area (sqrt of value), from a small ~9px minimum to a ~32px maximum, both clearly visible without overwhelming the chart. Some dense clusters of similarly-sized bubbles partially fuse together, but individual bubbles remain distinguishable via stroke and shading.
      Legibility verdict: PASS — all text clearly readable, no light-on-light issues, no clipped elements at any canvas edge.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black, not light.
      Chrome: Title, axis titles, and tick labels rendered in light ink/gray tones, clearly legible against the dark background. Grid lines are subtle but visible. The size legend text and reference bubbles in the right margin are fully legible in white/light-gray text.
      Data: Bubbles are the identical Imprint green (#009E73) at the same positions, sizes, and opacities as the light render — only the chrome (background, text, grid) flipped, confirming palette compliance (VQ-07).
      Legibility verdict: PASS — no dark-on-dark failures observed; all title/axis/tick text and legend text remain clearly visible against the dark surface.
