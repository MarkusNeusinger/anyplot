review:
  strengths:
  - Bubbles are correctly area-scaled (radius grows with sqrt of the normalized share),
    matching the spec's 'scale by area, not radius' requirement
  - The anti-overlap rejection-sampling threshold was tightened (0.9x combined radius
    / 2+ neighbors -> 1.0x / 1+ neighbor), and the previously near-fused bubble pair
    around growth ~23%, revenue ~$110-140M is now clearly separated in both renders
  - Alpha blending (0.6-0.75, inversely scaled with bubble size) plus page-bg-colored
    strokes keep overlapping bubbles distinguishable without moving any mark off its
    (x, y) value
  - A manually-drawn 3-point size legend (10%/55%/100%) with reference circles that
    match the data marks' fill, outline and translucency compensates cleanly for the
    core bundle's missing bubbleLegend module
  - The focal 'Segment leader' data label creates a clear visual hierarchy instead
    of a flat scatter of equals, without introducing a derived fourth-variable encoding
  - 'Theme tokens are threaded correctly: identical data colors between light/dark
    renders, page-bg-aware bubble strokes that flip with theme, ink/inkSoft chrome,
    transparent chart background'
  - Deterministic LCG-seeded data generation, descriptive axis labels with units,
    and an idiomatic core-bundle workaround (scatter series + per-point marker.radius)
    given the bubble series type isn't loaded
  weaknesses:
  - The manually-drawn size legend and tooltip pointFormatter are functional but still
    fairly generic Highcharts usage; no other library-distinctive technique is used
    beyond the minimum needed to work around the missing bubble series module
  - Several helper functions (radiusForShare, alphaForShare, closeNeighborCount, drawSizeLegend)
    go beyond a minimal Imports->Data->Plot->Save structure; each is justified by
    required behavior but the code is not KISS-minimal
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white, matches #FAF8F1 - not pure white, not dark.
      Chrome: bold dark title "bubble-basic · javascript · highcharts · anyplot.ai" centered at top; "Year-over-Year Growth Rate (%)" x-axis title and "Annual Revenue ($M)" y-axis title in medium-gray ink; tick labels ("-4%"..."28%", "$0"..."$550") in lighter gray; subtle horizontal/vertical gridlines; manual size-key legend on the right ("Share of Own Market Segment (%)" with 10%/55%/100% sample circles). All chrome text is clearly readable against the light background.
      Data: ~70 green (#009E73) semi-transparent bubbles scattered across the growth/revenue plane, sized by market-segment share (area-scaled, sqrt-mapped radius). One bubble (~3% growth, ~$150M revenue) is outlined in dark ink and labeled "Segment leader / 100% share" above it. Overlapping bubbles are separated by a thin page-background-colored stroke; a zoomed crop of the previously problematic growth ~19-24%, revenue ~$100-350M region confirms every bubble pair is now edge-touching or partially overlapping at most - no near-total fusion remains.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black, matches #1A1A17 - not pure black, not light.
      Chrome: same title now rendered in white/light text; axis titles and tick labels in light gray, clearly legible; gridlines subtle but visible; size-key legend text flips to light gray/white against the dark background.
      Data: identical green bubble colors and layout to the light render - same positions, same relative sizes, same overlap pattern. The focal bubble's highlight stroke flips from dark ink to white/light so it still reads clearly against the dark background.
      Legibility verdict: PASS - no dark-on-dark or light-on-light failures observed; brand green remains clearly visible on both surfaces.
