review:
  strengths:
  - Custom SVG-drawn size legend (10%/55%/100% circles) satisfies the spec's 'include
    a size legend' requirement, working around the core bundle lacking bubbleLegend.
  - Bubble radius is scaled by area (sqrt of the normalized value), correctly following
    the spec's explicit 'scale by area not radius' guidance.
  - Alpha blending plus a page-background stroke deliberately handle overlapping bubbles,
    matching the spec's transparency note.
  - Focal-point and secondary callouts add genuine data storytelling beyond a bare
    position+size encoding, guiding the viewer to two standout companies.
  - Theme-adaptive chrome is correct in both renders; bubble fill color is identical
    (Imprint brand green) between light and dark, only chrome flips.
  - Correctly implements a bubble series using core scatter + per-point marker.radius,
    honoring the highcharts-more restriction rather than importing a forbidden module.
  weaknesses:
  - 'Code is more elaborate than a ''basic'' bubble chart calls for: declutter-pass
    nudging, focal-point scoring, and secondary-candidate neighbor counting add several
    helper functions beyond the KISS structure expected for this spec variant.'
  - The dense cluster around 18-24% growth / $300-420M revenue still has several same-color
    bubbles nearly merging despite the declutter pass; a few individual points are
    hard to distinguish there.
  - The size-legend column leaves noticeable empty whitespace below the 100% circle
    in the right margin — could tighten the margin or add a fourth reference size
    to use the space better.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "bubble-basic · javascript · highcharts · anyplot.ai" is bold dark text, fully visible and not clipped. X-axis title "Year-over-Year Growth Rate (%)" and Y-axis title "Annual Revenue ($M)" are dark-gray, clearly readable. Tick labels ($0-$550, -4% to 28%) are all legible with subtle gridlines. The custom size legend ("Share of Own Market Segment (%)" with 10%/55%/100% reference circles) sits in the right margin, fully visible with dark title text and gray value labels.
      Data: All ~90 bubbles are Imprint brand green (#009E73-based) at varying opacity/radius (area-scaled by segment share). Two callout annotations — a bordered "Standout: 28% growth, 95% segment share" box and an italic "Also notable: 30% growth, 64% share" note with a dotted leader line — highlight two focal companies. No text overlaps data or other text.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Title, axis titles, and tick labels all render in light gray/white and are clearly legible against the dark background — no dark-on-dark failures observed. Gridlines are subtle but visible. The size legend title and circle labels are light-colored and fully readable.
      Data: Bubble fill color is identical brand green to the light render (only chrome flipped, as required); the callout boxes use a dark elevated-surface fill with light text, both readable.
      Legibility verdict: PASS
