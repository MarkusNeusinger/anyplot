review:
  strengths:
  - Area-correct bubble sizing (sqrt scaling of the min-max-normalized share) with
    radius+alpha both tuned by share, so small bubbles don't wash out against the
    background
  - Manual size legend built with SVGRenderer to compensate for the core-only bundle
    lacking highcharts-more's bubbleLegend — exactly the workaround the library rules
    call for, and it fulfills the spec's 'include a size legend' requirement
  - Focal-point callout (renderer.label with the native 'callout' shape) highlights
    the standout company on both growth and share, giving the viewer a guided insight
    instead of a bare position+size encoding
  - 'Careful data-realism note: labels the size metric ''Share of Own Market Segment''
    rather than a plain ''market share'', avoiding the common trap of bubble values
    that should sum to 100% but don''t'
  - pageBg-colored stroke on every non-focal marker cleanly separates overlapping
    same-color bubbles in the densest cluster
  - Deterministic LCG data generation, all font sizes explicitly set, correct Imprint
    green + theme-correct backgrounds in both renders
  weaknesses:
  - The ~19-24% growth / $300-450M revenue region has a dense bubble cluster where
    several similarly sized, similarly colored bubbles nearly fully overlap and read
    as a single merged blob despite the pageBg stroke — consider a touch more separation
    (jitter, or slightly higher stroke contrast) in that region so individual companies
    stay distinguishable.
  - Outside the single focal-point callout, the remaining 89 points read as an undifferentiated
    random scatter with no secondary visual hierarchy — a second, lighter-weight cue
    (e.g. a subtle note on another notable point, or grouping/banding by share tier)
    would strengthen the data storytelling beyond the one highlight.
  - Design polish is solid but stops short of 'clearly above defaults' territory —
    grid and axis chrome are close to Highcharts defaults; a bit more deliberate whitespace/typography
    tuning (e.g. lighter grid, more distinct hierarchy between title and axis titles)
    would push this further.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "bubble-basic · javascript · highcharts · anyplot.ai" in bold dark ink, centered top. X-axis title "Year-over-Year Growth Rate (%)" and Y-axis title "Annual Revenue ($M)" in medium-gray ink, both descriptive with units. Tick labels (-4% to 28%, $0 to $550) in a lighter gray, subtle light-gray gridlines on both axes. Top-right size legend "Share of Own Market Segment (%)" with three reference circles (10%, 55%, 100%) and percentage labels. A bordered callout box near the bottom-right reads "Standout: 28% growth, 95% segment share" with a leader line pointing at the highlighted bubble.
      Data: ~90 bubbles, all rendered in the Imprint brand green (#009E73) at varying opacity (small bubbles slightly more opaque to avoid washing out), with a pageBg-colored (light) stroke separating overlapping bubbles and a thicker brand-green stroke ring on the one focal bubble.
      Legibility verdict: PASS — all title/axis/tick/legend text is clearly readable against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title and axis titles now rendered in light/off-white ink, tick labels in light gray, gridlines subtle light-gray-on-dark. Size legend and callout box mirror the light render with dark elevated-surface fill and light text.
      Data: Same ~90 bubbles in the identical Imprint green (#009E73) at the same opacities — confirmed unchanged from the light render; only chrome (background, text, grid, box fills) flipped to the dark tokens. Non-focal bubble strokes now use the dark pageBg color, still visibly separating overlaps against the green fill.
      Legibility verdict: PASS — all text is clearly light-colored against the dark background; no dark-on-dark failures observed anywhere (title, axes, ticks, legend, callout).
