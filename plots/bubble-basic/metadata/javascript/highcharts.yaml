review:
  strengths:
  - Custom Highcharts SVGRenderer size legend built from scratch to compensate for
    the core bundle lacking bubbleLegend (highcharts-more), matching the Imprint palette
    and area-based scaling.
  - 'Focal-point storytelling: an amber-ringed standout bubble plus a native renderer
    "callout" label ("Standout: 28% growth, 95% segment share") gives the viewer a
    guided insight beyond a bare position+size encoding.'
  - Correct area-based bubble scaling (radiusForShare uses sqrt of the normalized
    share) and alpha 0.5 transparency to handle overlap, exactly per the spec's notes.
  - Deterministic LCG-seeded data generation; theme tokens threaded consistently through
    chrome (title, axes, grid, tooltip, legend) so light/dark chrome flips correctly
    while data colors stay identical.
  - 'Clean core-bundle-only implementation: no external imports, animation disabled
    on both chart and series, and a well-documented per-point marker.radius workaround
    since highcharts-more''s bubble series type is unavailable.'
  weaknesses:
  - Manual size-legend value labels (10%/55%/100%) and the legend title are rendered
    a touch small relative to the main chrome — worth double-checking legibility once
    scaled down to a ~400px mobile preview.
  - The manual legend + focal-highlight logic (drawSizeLegend, highlightFocalPoint,
    radiusForShare) adds three helper functions; understandable given the core-bundle
    constraint, but it moves away from the flattest possible KISS structure.
  - The densest bubble cluster (~18-26% growth, $300-500M revenue) has several overlapping
    circles that, even with alpha blending, are somewhat hard to parse as individual
    points at a glance.
  - The "revenue share of its own local segment" framing (each company drawn from
    a different segment) is explained in a code comment but could read to a casual
    viewer as a literal market-share metric that should sum to 100%.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "bubble-basic · javascript · highcharts · anyplot.ai" in bold dark ink, clearly visible. X-axis title "Year-over-Year Growth Rate (%)" and y-axis title "Annual Revenue ($M)" in medium-gray ink, both readable. Tick labels (percent/dollar formatted) in the same softer gray, legible against the light background. Grid lines are thin and subtle, visible but not distracting. The manually-drawn size legend ("Revenue Share of Segment (%)" with 10%/55%/100% reference circles) sits in the reserved right margin in dark bold title text and softer gray value labels — all legible. The amber-bordered callout box ("Standout: 28% growth, 95% segment share") uses dark text on a light elevated fill with an amber border — fully legible and not clipped.
      Data: ~90 semi-transparent teal/green bubbles (Imprint palette[0], ~#009E73 family) scaled by area to represent segment share; the focal bubble (bottom-right, highest combined growth+share) has a distinct amber ring instead of the default pale outline.
      Legibility verdict: PASS — no light-on-light issues found anywhere in the render.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Title in bold off-white/cream ink, clearly visible. Axis titles and tick labels render in a lighter soft-gray tone that contrasts well against the near-black background — no dark-on-dark failures observed. Grid lines remain subtle but visible. The size legend title and value labels flip to light text on the dark surface and stay fully legible; the callout box keeps a light elevated fill with dark text and the same amber border, still fully readable against the dark background.
      Data: The bubble colors are visually identical to the light render (same teal/green hue and alpha), confirming only chrome — not data color — changed between themes. The focal bubble's amber ring is equally visible against the dark backdrop.
      Legibility verdict: PASS — no dark-on-dark issues found; all text remains legible against the near-black surface.
