review:
  strengths:
  - 'Renders a true bubble chart from the core bundle alone: a `scatter` series with
    a per-point `marker.radius` stands in for the `highcharts-more` bubble type, which
    is not loaded, with no add-on module and no other library pulled in'
  - Radii are sqrt-mapped from the share value so bubble area - not radius - grows
    with the size variable, and the 9-32 CSS px range keeps the smallest bubbles clearly
    visible without the largest swallowing the plot
  - Per-point alpha (0.60-0.75, slightly higher for the smallest bubbles) plus a 3
    px page-background stroke keeps every overlapping pair individually distinguishable
    in both themes, without moving any mark off its (x, y) value
  - Overlap is thinned by rejection-sampling candidate positions while the data is
    being generated, so each bubble still sits exactly at the (x, y) it was generated
    with - the endorsed answer to overplotting rather than a post-hoc declutter pass
  - The size key is drawn with Highcharts' own `chart.renderer` SVG API in the reserved
    right margin (10% / 55% / 100% circles, area-scaled from the same function as
    the data marks, labelled in the size variable's units) - a clean substitute for
    the missing `bubbleLegend`
  - Theme tokens are threaded through every chrome element (transparent chart background
    over the page surface, `t.ink` title, `t.inkSoft` axis titles and ticks, `t.grid`
    gridlines, page-coloured bubble strokes) and the data colours are identical between
    the two renders
  - The `pointFormatter` tooltip reports growth, revenue and segment share per bubble,
    so the interactive HTML output exposes the third dimension numerically even though
    it cannot show in the static PNG
  weaknesses:
  - 'SC-02 (both): the size key''s reference circles are stroked in palette green
    at 1.2 px while every data bubble carries a 3 px page-background stroke, so the
    key does not match the marks it explains → stroke the legend circles with `t.pageBg`
    at 3 px like the data marks. Likely cause: `.attr({ fill: ..., stroke: t.palette[0],
    "stroke-width": 1.2 })` in `drawSizeLegend`.'
  - 'DQ-01 (both): growth rate, revenue and segment share are three independent uniform
    draws, so the cloud is a featureless rectangle and the size channel carries no
    pattern a viewer can read against x and y → derive revenue and share from growth
    with noise so the third dimension adds information. Likely cause: the three separate
    `rand()` calls in the generation loop.'
  - 'CQ-01 (code): five top-level helpers (`rand`, `radiusForShare`, `alphaForShare`,
    `closeNeighborCount`, `drawSizeLegend`) sit between the data and the chart where
    a linear script would do → inline the two one-line share mappings into the generation
    loop and keep only the helpers that are genuinely reused. Likely cause: the per-point
    radius and alpha mappings factored out as named functions.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white matching #FAF8F1 across the full 3200x1800 canvas - not pure white, not dark; the chart background is transparent so the page surface shows through.
      Chrome: bold dark title "bubble-basic · javascript · highcharts · anyplot.ai" centred at the top; x-axis title "Year-over-Year Growth Rate (%)" and y-axis title "Annual Revenue ($M)" in medium-grey ink; tick labels "-4%"..."28%" and "$0"..."$550" in the same softer ink; thin light gridlines on both axes with no tick marks; a hand-drawn size key in the reserved right margin titled "Share of Own Market Segment (%)" with 10% / 55% / 100% reference circles and their labels. Every chrome element is clearly readable against the light background; nothing is light-on-light.
      Data: ~70 translucent brand-green (#009E73, alpha 0.60-0.75) bubbles spread across the growth/revenue plane, radii sqrt-mapped from the share value (9-32 CSS px). Each bubble carries a 3 px page-background stroke, so the few touching pairs (around -3% / $110-145M and 9.8% / $163-195M) stay individually readable rather than merging. First and only series colour is the brand green. No callouts, labels, reference lines or highlighted bubbles anywhere in the field.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black matching #1A1A17 - not pure black, not light.
      Chrome: identical layout; the title now renders in near-white, axis titles and tick labels in light grey, gridlines a subtle lighter line. The size-key title and its 10% / 55% / 100% labels flip to light text and stay readable. No dark-on-dark text anywhere - every title, axis label and tick label is clearly legible.
      Data: bubble colours are identical to the light render (same brand green, same alphas, same positions and radii) - only the chrome flipped. The per-bubble stroke flips with the page token to the dark surface colour, still carving a visible edge between overlapping bubbles. The legend circles remain visible against the dark page. Brand green reads clearly on the near-black surface.
      Legibility verdict: PASS
