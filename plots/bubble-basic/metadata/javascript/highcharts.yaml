review:
  strengths:
  - Legitimate, well-documented workaround for the missing highcharts-more bubble
    series type - uses core scatter with area-scaled marker.radius, exactly matching
    the library's own guidance for the core-only bundle.
  - 'Clear data storytelling: an algorithmically-selected focal point (highest combined
    growth + segment-share company) is highlighted with a distinct stroke and a native
    Highcharts callout annotation.'
  - Page-bg-colored stroke on overlapping same-color bubbles gives visual separation
    in dense clusters without introducing a second data color.
  - Manual size-key legend is clearly labeled, positioned near the plot, and uses
    matching bubble styling - a thoughtful substitute for the unavailable bubbleLegend
    plugin.
  - 'Both renders are fully theme-correct: identical brand-green data color, correctly
    flipped chrome, no legibility failures in either theme.'
  weaknesses:
  - A handful of the smallest bubbles (near R_MIN) are only marginally visible at
    full resolution and could be lost entirely at mobile scale - consider raising
    R_MIN slightly or boosting alpha for the smallest segment-share bucket.
  - Code relies on several helper functions (radiusForShare, drawSizeLegend, highlightFocalPoint)
    rather than a flat top-to-bottom script; largely justified by the manual-legend/annotation
    requirements, but the CQ-01 KISS ideal is only partially met.
  - The overall composition outside the highlighted focal point is a fairly generic
    scatter cloud - additional aesthetic polish (e.g. more refined grid/typography
    contrast) could push Design Excellence further.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 - not pure white.
      Chrome: Title "bubble-basic · javascript · highcharts · anyplot.ai" in bold dark ink at top-center; X-axis "Year-over-Year Growth Rate (%)" and Y-axis "Annual Revenue ($M)" labeled with units; tick labels and manually drawn size-legend text ("10% / 55% / 100%") all in dark, readable ink; subtle grid on both axes.
      Data: 90 semi-transparent brand-green (#009E73, alpha ~0.6) bubbles sized by "Share of Own Market Segment (%)"; one bubble near bottom-right (28% growth, ~$0 revenue) is ringed with a thicker solid-green stroke and pointed to by a callout label "Standout: 28% growth, 95% segment share". First (only) series confirmed as #009E73.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 - not pure black.
      Chrome: Same layout as light render; title, axis titles, and tick labels switched to light-colored ink; grid lines subtle but visible; size-legend text and focal-point callout box (elevated dark-surface fill, green border) both readable. No dark-on-dark failures.
      Data: Bubble color identical to light render (#009E73, alpha ~0.6) - only chrome flipped.
      Legibility verdict: PASS
