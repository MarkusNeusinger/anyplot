review:
  strengths:
  - Correctly works around the missing highcharts-more module by implementing bubbles
    as core "scatter" points with per-point marker.radius, scaled by area (sqrt of
    the normalized share) rather than radius directly, per the spec's accuracy note
  - Manually built size legend using the Highcharts SVGRenderer API (chart.renderer.text/circle)
    — a genuinely library-distinctive technique, not trivially replicable in another
    library
  - Alpha-blended fill (0.6) combined with a page-background-colored marker stroke
    gives overlapping bubbles a visible separation ring instead of muddying into an
    undifferentiated blob
  - 'First series color is Imprint brand green #009E73, identical between light and
    dark renders; both plot backgrounds match the theme tokens exactly'
  - Deterministic, dependency-free LCG data generation (seed=42); axis titles are
    descriptive with units on both axes; title string matches the mandated format
    exactly
  weaknesses:
  - Dense bubble cluster around growth 21-24% / revenue $300-350M has 4-5 overlapping
    circles that blur into a single blob — individual bubbles are hard to distinguish
    there even with the stroke separator; consider slightly increasing the marker
    stroke width or nudging the alpha/contrast in high-density regions
  - 'Data storytelling is minimal (DE-03 default): the chart displays position + size
    but has no highlighted focal point or callout — e.g. no emphasis on a standout
    high-growth/high-share company — so the viewer has to find their own insight'
  - Sample size (55 points) sits at the very bottom of the spec's recommended 50-500
    range; a denser dataset would better fill the canvas and make the overlap-driven
    bubble interactions (the chart's core value-add) more apparent
  - Code relies on several helper functions (rand, radiusForShare, hexToRgba, drawSizeLegend)
    rather than a flatter top-to-bottom flow — understandable given the manual-legend
    workaround required by the missing highcharts-more bubbleLegend, but adds structural
    complexity versus a plain KISS scatter script
  - 'Visual refinement has some room left: gridlines and axis lines could be a touch
    lighter/subtler for a more polished, less "default chart" feel'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "bubble-basic · javascript · highcharts · anyplot.ai" in bold dark text at top center; x-axis titled "Year-over-Year Growth Rate (%)" and y-axis titled "Annual Revenue ($M)" in medium-gray, both with units; tick labels (percent and dollar-formatted) in a slightly lighter gray; subtle horizontal/vertical gridlines; a manually-drawn "Market Share (%)" size legend at top-right showing 10%/55%/100% reference circles.
      Data: ~55 green (#009E73) semi-transparent bubbles scattered across the growth-rate/revenue plane, sized by market share (area-scaled). Overlapping bubbles show a visible separation ring (page-background-colored stroke) instead of muddying together, though one dense cluster around 21-24% growth / $300-350M revenue is hard to parse into individual bubbles.
      Legibility verdict: PASS — all title, axis, tick, and legend text is clearly readable against the light background; no light-on-light text found.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same layout as the light render with all text flipped to light colors — title in white/near-white bold, axis titles and tick labels in light gray, gridlines subtle light-on-dark. The size legend text and circles remain fully legible.
      Data: Bubble fill color and position are pixel-identical to the light render (#009E73 data green, same alpha, same radii) — only the chrome (background, text, grid, legend) flipped, confirming palette consistency.
      Legibility verdict: PASS — no dark-on-dark failures observed; all title/axis/tick/legend text reads clearly against the dark background.
