review:
  strengths:
  - 'Clever, well-documented workaround for the unavailable highcharts-more bubble
    series: per-point marker.radius is scaled by sqrt(area fraction), matching the
    spec''s ''scale by area not radius'' requirement exactly.'
  - Custom manual size legend ('Market Share (%)') built with chart.renderer clearly
    explains the bubble scale with three reference sizes (10%, 55%, 100%), fulfilling
    the spec's size-legend requirement despite core-only Highcharts.
  - 'Deliberate data storytelling: the highest-ranked company (by growth + share)
    is highlighted with an amber-ringed marker and a native Highcharts SVGRenderer
    ''callout'' label pointing at it, giving the viewer an immediate insight instead
    of a bare position+size encoding.'
  - Alpha-blended bubble fill (0.6) correctly handles the expected overlap of ~90
    bubbles per the spec's transparency guidance.
  - Theme-correct chrome in both renders; the Imprint brand green (#009E73) data color
    is identical across light/dark; title, axis labels, ticks, tooltip, and callout
    box all read clearly in both themes.
  weaknesses:
  - 'DQ-03: The size dimension is labeled ''Market Share (%)'' but ~90 companies each
    independently draw a share between 10-100%, so dozens simultaneously show 50-100%
    share of the same implied market -- real-world market shares of competitors in
    one market must sum to <=100%, so this configuration is not factually plausible.
    Recommend relabeling the size metric to something that doesn''t imply summing
    to 100 (e.g. ''Company Size Index'' or ''Revenue Share of Segment (%)''), or scoping
    the size range down so it reads as a plausible single-market share distribution.'
  - 'VQ-05/DE-02: Only the y-axis has grid lines (xAxis.gridLineWidth is 0); the style
    guide recommends grid on both axes for scatter-type charts to aid precise reading
    of a dense point cloud -- consider a subtle x-axis grid to match.'
  - 'CQ-01: The implementation relies on several helper functions (radiusForShare,
    hexToRgba, drawSizeLegend, highlightFocalPoint) rather than a flat Imports ->
    Data -> Plot -> Save structure. This is largely justified by the manual size-legend/callout
    workaround needed since highcharts-more isn''t loaded, but it''s worth trimming
    (e.g. inlining hexToRgba) where possible.'
  - 'VQ-03: In the densest clusters (e.g. ~20-24% growth, $350-420M revenue) several
    overlapping bubbles blend into indistinct darker blobs, making individual bubble
    boundaries hard to trace -- a slightly lower fill alpha or a thin stroke on all
    markers (not just the focal one) would improve separability.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 -- not pure white, not dark.
      Chrome: Title "bubble-basic · javascript · highcharts · anyplot.ai" in bold dark ink, clearly visible near the top. X-axis title "Year-over-Year Growth Rate (%)" and y-axis title "Annual Revenue ($M)" in medium-gray, both legible. Tick labels (-4% to 28% on x, $0 to $550 on y) are dark/gray and readable. Subtle horizontal gridlines only (y-axis); no vertical gridlines. A manual size legend ("Market Share (%)" with 10%/55%/100% reference circles) sits in the right margin, fully inside the canvas. A callout label "Standout: 28% growth, 95% share" with an amber border points at one bubble near the bottom right.
      Data: ~90 green bubbles (Imprint brand green #009E73 at ~0.6 alpha) scattered across the growth/revenue plane, sizes varying with market share; the standout bubble has a thicker amber ring instead of the default thin ring. First (and only) series is confirmed brand green.
      Legibility verdict: PASS -- all text is clearly readable against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 -- not pure black, not light.
      Chrome: Title in bold off-white/cream, axis titles and tick labels in light gray, all clearly visible against the dark background. Gridlines are faint light horizontal lines (y-axis only), same layout as the light render. The size legend and callout box are re-colored for dark chrome (dark elevated-box fill, light text, amber border retained) and remain fully legible.
      Data: The same ~90 bubbles render in the identical brand green (#009E73) fill with the same alpha and positions as the light render -- only chrome (background, text, grid, legend/callout box) has flipped, data colors are unchanged. The amber-ringed standout bubble and its callout label are in the same position as in the light render.
      Legibility verdict: PASS -- no dark-on-dark failures; every title/label/tick/legend/callout text element is clearly visible against the near-black background.
