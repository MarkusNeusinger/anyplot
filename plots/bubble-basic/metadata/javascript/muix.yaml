review:
  strengths:
  - Bubble radius scales with sqrt(size / max), so area is proportional to the market-share
    index and the 10/52/94 size legend uses the same formula
  - Custom bubble layer composed inside ChartsContainer via useXScale/useYScale keeps
    every bubble exactly at its (x, y) values
  - Translucent fill (0.58) plus a 2 px page-colored outline keeps overlapping bubbles
    in the dense mid-market region distinguishable in both themes
  - 'Theme tokens threaded through every chrome element: ink title, inkSoft ticks
    and subtitle, grid token; both renders fully legible'
  - Optional segment color uses Imprint positions 1-3 in canonical order with brand
    green first
  weaknesses:
  - 'Suggestion: the category legend could use MUI X''s native ChartsLegend inside
    ChartsDataProvider instead of hand-built swatches, keeping the custom HTML only
    for the size legend.'
  - 'Suggestion: the custom circles have no tooltip; a ScatterChart-backed series
    or ChartsTooltip wiring would add hover detail in the HTML view.'
  - 'Suggestion: the ~60 px gap between the legend row and the plot top could be reduced
    to give the plot more height.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole canvas.
      Chrome: bold near-black title "bubble-basic · javascript · muix · anyplot.ai" centred at top, soft-ink subtitle "52 observations · Bubble area ∝ Market share index, 10–94", one legend row (Company segment: Growth leaders / Mid-market / Niche players; Market share index: 10 / 52 / 94 grey reference bubbles). Axis titles "Revenue growth rate (%)" and "Operating profit margin (%)", dark tick labels, subtle dashed grid. All readable.
      Data: 52 translucent bubbles with page-colored outlines; green #009E73 leaders top-right (large), lavender mid-market in the centre, blue niche players bottom-left (small). Overlap in the 10–12 % growth region stays distinguishable.
