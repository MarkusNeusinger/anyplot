review:
  strengths:
  - Bubbles are scaled by area (sqrt of the size ratio) over a physically sensible
    min/max radius range, matching the spec's 'scale by area, not radius' requirement.
  - A pairwise repulsion (declutter) pass spreads bubbles that would otherwise fuse
    together while preserving an organic cluster look, with a page-background stroke
    giving clean boundaries between touching bubbles.
  - Per-hue luma-scaled dark-theme opacity bump keeps all three archetype colors visually
    balanced across light/dark themes instead of applying one flat alpha bump - a
    non-trivial, well-reasoned accessibility/consistency touch.
  - Both a color legend (archetypes) and a size legend (three reference bubbles) are
    implemented, and the legend swatches reuse the exact same fill/opacity as the
    real data so they read as truthful previews rather than generic keys.
  - Correctly works around the community package's lack of a native bubble/z-size
    scatter mode by composing ChartContainer with useXScale/useYScale, which is exactly
    the documented idiomatic pattern for custom marks in MUI X.
  - Imprint palette used in canonical order (green/lavender/blue) with fully theme-correct
    chrome in both renders - background, text, and grid all flip correctly while data
    colors stay identical.
  weaknesses:
  - Code carries substantial custom machinery for a 'basic' bubble chart - a 40-iteration
    O(n^2) pairwise repulsion loop plus a per-hue luma-scaled opacity formula - which
    pushes well past the KISS ideal of imports -> data -> plot -> save; consider whether
    a simpler fixed jitter or wider archetype spread could reduce the algorithmic
    surface while keeping the declutter effect.
  - Title occupies only roughly a quarter of the canvas width at the current fontsize;
    even though 22px CSS matches the muix default, it reads small against the 3200px-wide
    canvas - nudging it up slightly (e.g. 24-26px) would improve presence and mobile-thumbnail
    legibility.
  - 'LM-02: the ChartContainer + scale-hooks workaround is the correct idiomatic pattern
    for the missing bubble mode, but the implementation doesn''t otherwise showcase
    MUI X-native interaction features (e.g. built-in highlight-on-hover via the chart''s
    series context) that would make the library choice feel more distinctive beyond
    the custom SVG layer.'
  - 'DE-03: the three-archetype color clustering creates a visible pattern, but there''s
    no explicit callout drawing attention to the most notable insight (e.g. the negative-margin
    niche-player outlier) - a light-touch annotation or emphasis would sharpen the
    story further.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1-like cream), not pure white.
      Chrome: Title "bubble-basic · javascript · muix · anyplot.ai" in dark ink, top-left. Axis titles "Revenue growth rate (%)" and "Profit margin (%)" in dark ink, both clearly visible. Tick labels along both axes are dark and legible. A subtle full grid (horizontal + vertical) sits behind the data at low opacity. A two-part legend on the right ("Company archetype" with 3 colored swatches, "Market share index" with 3 open reference circles at sizes 100/50/10) sits close to the chart.
      Data: ~50 bubbles in three colors - brand green ("Growth leaders"), lavender/purple ("Mid-market"), and slate blue-gray ("Niche players") - the first series is Imprint's #009E73 green as required. Bubbles vary in size by market share and use semi-transparent fills with a cream stroke to separate touching bubbles. Growth leaders cluster in a high-growth arc (~18-38% growth), mid-market clusters centrally, niche players scatter toward negative/low growth and margin.
      Legibility verdict: PASS - all text is clearly readable against the light background.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17-like), not pure black.
      Chrome: Title, axis titles, and tick labels all render in light (off-white) ink, clearly visible against the dark background. Grid lines are subtle but visible in light tone. Legend text is light-colored and readable.
      Data: The same three archetype colors (green/lavender/blue-gray) appear at identical hex values to the light render - only the chrome and the bubble stroke (matched to the page background) have flipped. The per-hue opacity bump is applied so the darker blue-gray series reads with slightly more body than in light mode, while the paler lavender stays close to its light-mode alpha - no washed-out or oversaturated series observed.
      Legibility verdict: PASS - no dark-on-dark text; all chrome and data remain clearly distinguishable.
