review:
  strengths:
  - 'Correct spec compliance: bubble radii are scaled by area (sqrt of value), alpha
    ~0.6 transparency is used to handle overlaps, and both a color legend and a size
    legend are present exactly as the spec notes require.'
  - 'Creative, well-documented technical solution: the community @mui/x-charts package
    has no bubble/z-size scatter mode, so the implementation builds bubbles as a custom
    SVG layer positioned via the useXScale/useYScale hooks inside ChartContainer —
    a legitimate workaround within the community surface, with the rationale explained
    in code comments.'
  - 'Correct Imprint palette usage: first series is brand green (#009E73), canonical
    position order used for the abstract archetype categories, and both renders show
    theme-correct backgrounds/chrome (#FAF8F1 light, #1A1A17 dark) with no dark-on-dark
    or light-on-light failures.'
  - Deterministic data generation (fixed-seed LCG) builds three plausible company
    archetypes (growth leaders / mid-market / niche players) with realistic, non-controversial
    clustering.
  - Both legends are clearly labeled, positioned in the reserved right margin without
    overlapping the plot data or each other.
  weaknesses:
  - Grid shows only horizontal (y-axis) lines via <ChartsGrid horizontal />; the style
    guide recommends grid on both axes for scatter-family charts (bubble extends scatter)
    — add vertical gridlines so x-position can be read off the grid too.
  - Several bubbles overlap tightly in the growth 18-22% / margin 16-20% region (5+
    circles stacking almost concentrically), which makes individual bubble boundaries
    hard to trace even with alpha 0.6 + background-color stroke — consider a lower
    alpha (~0.45-0.5) or slight positional jitter in that dense cluster to improve
    separability.
  - No callout/annotation highlights the visible growth-margin correlation across
    the three archetypes; a small text callout on the 'Growth leaders' cluster would
    raise the data storytelling from 'readable' to 'guided'.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Title "bubble-basic · javascript · muix · anyplot.ai" in dark ink, top-left. Axis labels "Revenue growth rate (%)" (x) and "Profit margin (%)" (y) in dark ink, tick labels in a slightly softer dark gray. Subtle horizontal-only gridlines. "Company archetype" color legend (3 swatches: green/lavender/blue) and "Market share index" size legend (3 reference rings: 100/50/10) sit in the right margin, both legend headers and labels dark/legible.
      Data: ~50 bubbles across 3 archetypes — green "Growth leaders" clustered upper-right (high growth, high-to-mid margin), lavender "Mid-market" clustered center-left, slate-blue "Niche players" scattered lower-left with some negative margins. First series (Growth leaders) is brand green #009E73. Bubbles use fillOpacity 0.6 with a background-color stroke for edge definition; larger bubbles correctly correspond to higher "Market share index" values (area-scaled, not radius-scaled).
      Legibility verdict: PASS — all text (title, axis labels, tick labels, legend text) is clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Same title and axis labels now in light ink (near-white/off-white), tick labels in a softer light gray. Gridlines remain subtle (horizontal only). Both legends (color + size) are rendered with light-colored text and are fully legible against the dark surface.
      Data: Same bubble positions and sizes as the light render. Data colors are identical to the light render (green/lavender/blue), confirming only chrome flips between themes — no unintended shift in the data palette.
      Legibility verdict: PASS — no dark-on-dark failures observed; all title, axis, tick, and legend text is clearly visible against the near-black background.
