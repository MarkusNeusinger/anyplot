review:
  strengths:
  - Custom SVG bubble layer composed on ChartContainer and positioned with the useXScale/useYScale
    context hooks — the community @mui/x-charts package has no z-size scatter mode,
    and this is the library's own documented escape hatch for custom marks rather
    than a foreign dependency
  - Bubbles scaled by area (sqrt of the normalised size ratio) with an explicit MIN_RADIUS/MAX_RADIUS
    envelope, so the smallest market-share values stay visible and the largest do
    not swallow the plot
  - 'Overlap handled exactly as the spec asks: fill-opacity in the 0.52-0.68 band
    plus a page-background stroke (thickened to 3 px for the densest green cluster),
    so bubbles in the crowded x≈18-21 region keep individual boundaries in both themes'
  - 'Per-hue, luma-scaled dark-theme opacity bump keeps the darker blue and the paler
    lavender equally legible on #1A1A17 instead of a flat bump over-saturating the
    pale hue'
  - Explicit font sizes throughout (title 26 px, axis titles 16 px, ticks and legend
    14 px) with balanced x/y axis-title and tick sizing, and an L-shaped frame with
    a subtle grid
  - Deterministic in-browser data generation via a fixed-seed LCG (seed 42) feeding
    a Box-Muller normal — reproducible without a seeded RNG, exactly as the library
    prompt requires
  - 'Correct harness contract: default-exported component, skipAnimation set, sized
    from window.ANYPLOT_SIZE, interactive self-contained HTML emitted alongside the
    PNG'
  weaknesses:
  - 'VQ-03, SC-02 (both): the size legend''s three reference circles are drawn with
    fill="none" and an inkSoft stroke, so they do not match the data marks they explain
    (translucent Imprint fill + page-background stroke) → fill them with the data
    fill and opacity and stroke them like the bubbles. Likely cause: the circle in
    SizeLegend uses fill="none" stroke={t.inkSoft} instead of the archetype fill and
    d.opacity.'
  - 'SC-01 (both): the subtitle "Growth leaders combine the strongest revenue growth
    and profit margin" is an interpretive callout the -basic spec''s scope excludes
    (its characteristic section allows x, y and size with an optional categorical
    colour and no callouts or other annotation layer) → remove the SUBTITLE line and
    keep the mandated title only. Likely cause: the SUBTITLE constant rendered in
    the title block.'
  - 'Suggestion: the right-hand legend column leaves a tall empty band below the size
    legend; a slightly narrower right margin would give the plot area more width.'
  - 'Suggestion: the smallest reference bubble (10) is drawn at the MIN_RADIUS floor,
    so the legend''s 10-to-50 step reads as a much larger area jump than the 50-to-100
    step.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white matching #FAF8F1 — not pure white, not dark. Grid lines are thin, low-opacity warm grey, visible but never competing with the bubbles.
      Chrome: Title "bubble-basic · javascript · muix · anyplot.ai" top-left in dark ink at ~26 px CSS, with a softer grey subtitle line beneath it ("Growth leaders combine the strongest revenue growth and profit margin"). X-axis title "Revenue growth rate (%)" centred below the axis, Y-axis title "Profit margin (%)" rotated at the left; tick labels −8…40 on x and −10…35 on y, all dark on cream. L-shaped axis frame (no top/right spines). Right-hand legend column: "Company archetype" (three filled dots + Growth leaders / Mid-market / Niche players) and "Market share index" (three nested-size reference circles + 100 / 50 / 10). All chrome text readable; no light-on-light anywhere.
      Data: 50 translucent bubbles in three Imprint hues — brand green #009E73 (Growth leaders, upper-right), lavender #C475FD (Mid-market, centre), blue #4467A3 (Niche players, lower-left). Each bubble carries a page-background-coloured stroke (2 px, 3 px for the green cluster) so overlapping circles stay individually readable. First categorical series is brand green, confirmed.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black matching #1A1A17 — not pure black. Grid lines flip to a faint light rule, still subtle and visible.
      Chrome: Title and subtitle now render in light ink / soft grey, fully legible. Both axis titles, all tick labels, both legend headings and every legend label are light-coloured against the near-black surface. No dark-on-dark text found anywhere — title, ticks, axis titles and legend text all flipped correctly.
      Data: Same three Imprint hex values as the light render (green / lavender / blue); only the chrome flipped. The bubbles composite slightly more saturated here because the implementation applies a per-hue, luma-scaled fill-opacity bump on dark (0.52 → up to 0.68), but the underlying palette hexes are unchanged and category identity is preserved. Brand green #009E73 remains clearly visible on the dark surface. The page-background stroke is now near-black, still separating overlapping bubbles cleanly.
      Legibility verdict: PASS
