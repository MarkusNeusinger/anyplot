review:
  strengths:
  - Custom SVG bubble layer built on ChartContainer's useXScale/useYScale hooks —
    a genuinely distinctive MUI X technique since the community package has no native
    z-size scatter mode
  - Per-hue luma-scaled dark-theme opacity bump keeps all three archetype colors equally
    legible on both surfaces instead of a flat alpha bump over-saturating the paler
    hue
  - Bubbles scaled by area (sqrt of value ratio), not radius, matching the spec's
    accuracy requirement
  - Two well-constructed legends (color archetype + size reference circles) explain
    both encodings, vertically centered against the chart to avoid wasted whitespace
  - Subtitle names the actual insight (growth/margin correlation across archetypes)
    rather than just displaying data
  - Explicit font sizes throughout (title 26px, axis labels 16px, tick/legend 14px)
    with balanced X/Y axis label and tick sizing
  - Deterministic seeded LCG data generation, three realistic company archetypes with
    sensible business-metric ranges
  weaknesses:
  - The densest cluster (growth leaders, x≈18-20) still has several bubbles fused
    into each other despite the thicker stroke — individual boundaries are discernible
    but the region reads as a blob at a glance
  - Grid could be pushed slightly more subtle relative to the data ink; currently
    on the higher end of the acceptable 15-25% opacity range
  - Legend uses fixed pixel offsets (top-20, +24 per row) rather than measured text
    height, which works here but is not resilient if archetype/legend label counts
    changed
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "bubble-basic · javascript · muix · anyplot.ai" in dark ink, subtitle "Growth leaders combine the strongest revenue growth and profit margin" in softer gray beneath it. X-axis "Revenue growth rate (%)" and Y-axis "Profit margin (%)" both dark, clearly readable, with light tick labels along both axes. Grid lines are thin and subtle, visible but not competing with data. Legend on the right ("Company archetype" with 3 colored dots + names, "Market share index" with 3 outlined reference circles + values) is fully readable.
      Data: ~50 bubbles in three colors — brand green (#009E73, "Growth leaders"), lavender (#C475FD, "Mid-market"), and slate blue (#4467A3, "Niche players") — matching Imprint canonical positions 1-3. Bubbles use semi-transparent fill with a page-background-colored stroke so overlapping bubbles remain distinguishable; sizes vary clearly with the market-share value, scaled by area.
      Legibility verdict: PASS — all title, subtitle, axis, tick, and legend text is clearly readable against the light background; no light-on-light text.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Title and subtitle now render in light ink/soft-gray, fully legible. Axis titles and tick labels are light-colored against the dark background. Grid lines remain subtle but visible. Legend text and dot/circle labels are light-colored and readable.
      Data: Same three colors as the light render (green, lavender, slate blue) — confirmed identical hex values, only the chrome (background, text, grid) flipped. The dark-theme opacity bump is visibly applied per-hue (the paler lavender bubbles look nearly the same as light-theme, while the darker blue and green bubbles read slightly more saturated) — data reads clearly on the dark surface without over-saturation.
      Legibility verdict: PASS — no dark-on-dark text found; all chrome elements are light-colored and legible on the near-black background; brand green remains clearly visible.
