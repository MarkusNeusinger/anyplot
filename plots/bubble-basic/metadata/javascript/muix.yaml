review:
  strengths:
  - Bubbles are correctly scaled by area (sqrt of value, radius 7-38px) rather than
    radius, so size differences read proportionally to the underlying market-share
    data
  - 'Per-hue dark-theme opacity compensation (relativeLuma-based bump) is a genuinely
    thoughtful fix for the fact that flat alpha composites differently over #1A1A17
    vs #FAF8F1 — darker hues get more bump, paler hues get almost none'
  - pageBg-colored strokes on every bubble cleanly separate overlapping circles in
    the dense clusters instead of letting them visually fuse
  - 'Both light and dark renders use identical archetype colors from the canonical
    Imprint order (#009E73 -> lavender -> blue), and backgrounds measure exactly #FAF8F1
    / #1A1A17'
  - Two-part legend (color + size) is vertically centered against the chart height,
    avoiding a dead whitespace gap, and fits cleanly within the right margin with
    no clipping
  - Uses useXScale/useYScale to draw a custom SVG bubble layer inside ChartContainer
    — the correct idiomatic workaround since community @mui/x-charts scatter only
    maps z to color, not size
  - Three loosely-separated archetype clusters (growth leaders, mid-market, niche)
    give the data real structure and a readable story instead of a formless cloud
  - Deterministic LCG with fixed seed (42) for full reproducibility; skipAnimation
    set for a clean static screenshot
  weaknesses:
  - The growth-leader cluster around x=18-32%/y=16-26% has several bubbles heavily
    overlapping (e.g. two large green bubbles near x=30 nearly fully overlap), making
    it hard to distinguish individual bubble boundaries even with stroke separation
    — consider a touch more stroke contrast or slightly lower opacity in the densest
    region
  - No explicit visual emphasis (e.g. a callout or annotation) draws the eye to the
    clearest insight (the three-archetype separation along the growth/margin diagonal)
    beyond color coding alone
  - Several small helper functions and three extra components (Bubbles, ColorLegend,
    SizeLegend) add structural complexity beyond a minimal KISS script — justified
    by the custom bubble-layer requirement, but worth keeping in mind if the pattern
    is reused elsewhere
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, measured (250,248,241) = #FAF8F1 exactly.
      Chrome: Title "bubble-basic · javascript · muix · anyplot.ai" in dark ink, top-left, fully visible. Axis titles "Revenue growth rate (%)" and "Profit margin (%)" in dark ink, clearly legible. Tick labels dark and readable. Grid lines are light gray, subtle but visible. Right-side legend ("Company archetype" with 3 color swatches + names, "Market share index" with 3 reference circles labeled 100/50/10) is fully within the canvas, no clipping.
      Data: ~50 bubbles across three color groups — green (#009E73, Growth leaders), lavender (#C475FD, Mid-market), blue-gray (#4467A3, Niche players) — each with a pageBg-colored stroke separating overlaps. Bubble sizes vary visibly by market-share value via sqrt-area scaling.
      Legibility verdict: PASS — all text readable, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, measured (26,26,23) = #1A1A17 exactly.
      Chrome: Title and axis titles/tick labels render in light ink, clearly legible against the dark surface. Grid lines are subtle dark-gray, visible without dominating. Legend text and swatches are fully legible, same position, no clipping.
      Data: Same three archetype colors as the light render (identical underlying hex values, confirmed by matching legend swatch hues); dark-theme fill opacity is intentionally bumped per-hue (more for the darker blue, almost none for the paler lavender) to compensate for how flat alpha composites more saturated over the near-black surface — the result is legible bubbles that don't look flatly identical to light but don't shift hue either.
      Legibility verdict: PASS — no dark-on-dark failures; all text and data elements are clearly distinguishable from the background.
