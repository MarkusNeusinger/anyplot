review:
  strengths:
  - Deliberate archetype-based color-coding using the Imprint palette in canonical
    order (positions 1-3), with a page-background stroke around each bubble to keep
    overlapping circles visually separable instead of fusing into a blob.
  - Correct area-based size scaling (radius interpolated via sqrt of the normalized
    size value) paired with both a color legend and a three-reference-circle size
    legend, matching the spec's explicit call for a size legend.
  - 'Sound technical workaround for the community @mui/x-charts package lacking a
    bubble/z-size scatter mode: reads the chart''s live scales via useXScale/useYScale
    hooks to draw a custom SVG bubble layer inside ChartContainer, staying entirely
    within the allowed community surface (no Pro/Premium reach).'
  - Fully theme-adaptive chrome with identical data colors across light and dark renders,
    confirmed by direct visual inspection of both PNGs — no dark-on-dark or light-on-light
    failures.
  weaknesses:
  - The 'Growth leaders' cluster around x=20-22, y=17-21 packs 4-5 bubbles so tightly
    that individual boundaries are hard to distinguish even with the pageBg stroke
    separation — consider a touch more jitter or margin in that archetype's generation
    parameters.
  - ChartsGrid is enabled on both horizontal and vertical axes; a subtler single-axis
    (horizontal-only) grid would reduce visual clutter and read as more refined against
    the house style's minimal-chrome preference.
  - Legend text (13px) is slightly smaller than the axis chrome (14-16px) — bumping
    legend fontSize to 14px would improve consistency and mobile legibility.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1-consistent), not pure white.
      Chrome: Title "bubble-basic · javascript · muix · anyplot.ai" in dark ink top-left; axis titles "Revenue growth rate (%)" and "Profit margin (%)" and tick labels in dark ink, clearly legible; subtle light-gray gridlines (horizontal + vertical); right-side legend panel ("Company archetype" with 3 colored swatches, "Market share index" with 3 outlined reference circles at 100/50/10) fully legible in dark ink.
      Data: ~50 bubbles in three hues — brand green (#009E73, "Growth leaders"), lavender (#C475FD, "Mid-market"), muted blue (#4467A3, "Niche players") — drawn at ~0.48 opacity with a light-background-colored stroke separating overlapping circles. First series is confirmed brand green per Imprint canonical order.
      Legibility verdict: PASS.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17-consistent), not pure black.
      Chrome: Same title and axis labels now in light ink, clearly legible against the dark background; gridlines subtle but visible; legend panel text renders in light ink, fully legible.
      Data: Same three hues (green/lavender/blue) at the same opacity — confirmed pixel-equivalent to the light render; only the chrome (background, text, grid, bubble separator stroke color) flipped to the dark-theme tokens.
      Legibility verdict: PASS — no dark-on-dark or light-on-light failures found; brand green remains clearly visible on the dark surface.
