review:
  strengths:
  - Bubble radius is correctly scaled by area (sqrt of the value ratio, clamped 7-52px),
    matching the spec's explicit instruction to avoid perceptual distortion from linear-radius
    scaling
  - Custom size legend with three reference bubbles (max/mid/min) clearly explains
    the size encoding and sits directly beside the plot
  - 'Genuinely community-only workaround for MUI X''s missing bubble/z-size scatter
    mode: bubbles are drawn as SVG circles positioned via the chart''s own useXScale/useYScale
    hooks, so they stay perfectly synced with the real axes, grid, and ticks instead
    of using a separate coordinate system'
  - Alpha-blended fills (0.6) with a theme-matched stroke keep overlapping bubbles
    distinguishable in both themes without relying on hue alone
  - Realistic, neutral business scenario (revenue growth vs. profit margin, bubble
    = market share index) with three underlying archetypes giving a natural spread
    across the full domain, including negative growth/margin values
  - All font sizes explicitly set; both light and dark renders are fully legible with
    theme-correct chrome and a compliant palette (#009E73 primary)
  weaknesses:
  - 'Design Excellence is largely default: ChartsGrid renders stock horizontal+vertical
    lines with no subtlety/color tuning, and there is no visual hierarchy (color,
    annotation, or highlight) calling out the three underlying archetype clusters
    -- a viewer has to discover the pattern unaided. Lighten or remove the grid, and
    consider a light second-hue or annotation cue for the archetype clusters so the
    story reads immediately.'
  - The densest cluster (growth ~20-30%, margin ~15-25%) has 5-6 overlapping bubbles
    that blur together despite the alpha/stroke treatment -- slightly reducing MAX_RADIUS
    or increasing stroke contrast would keep every bubble legible even in the crowded
    region.
  - ChartContainer is passed series=[] and never exercises MUI X's own series/marks
    API for the data (understandable, since the community package has no z-as-size
    scatter mode) -- this is a legitimate workaround but caps how 'idiomatic' the
    data-rendering path can be scored.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 -- not pure white, not dark.
      Chrome: Title "bubble-basic · javascript · muix · anyplot.ai" top-left in dark ink, fully readable. X-axis label "Revenue growth rate (%)" and Y-axis label "Profit margin (%)" both readable with units. Tick labels on both axes are dark and legible. Grid lines (horizontal + vertical) are light gray, subtle but visible. A "Market share index" size legend sits top-right with three reference circles (100, 50, 10) and readable value labels.
      Data: ~50 green (#009E73) bubbles with ~0.6 fill opacity and a thin light stroke, spread across positive and negative growth/margin values, sized by market share (small ~7px to large ~52px radius, scaled by area). Overlapping bubbles remain distinguishable thanks to alpha blending and the stroke outline.
      Legibility verdict: PASS -- no light-on-light text, no clipped elements.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 -- not pure black, not light.
      Chrome: Title, axis labels, and tick labels all render in light ink and are clearly readable against the dark background. Grid lines are subtle dark-gray, still visible. The size legend renders identically in position and content, with light text.
      Data: Same #009E73 green bubbles at the same positions and sizes as the light render -- colors are identical between themes, confirming only chrome (background, text, grid) flipped.
      Legibility verdict: PASS -- no dark-on-dark failures observed; all text and data elements are clearly visible.
