review:
  strengths:
  - New three-color archetype coding (Growth leaders / Mid-market / Niche players,
    palette[0]/[2]/[3]) directly answers the prior review's biggest weakness -- the
    three underlying clusters now read immediately from the color legend instead of
    requiring the viewer to discover the pattern unaided
  - MAX_RADIUS reduced from the prior 52px to 44px, visibly easing (though not fully
    eliminating) the crowding in the densest overlapping-bubble regions
  - ChartsGrid switched to horizontal-only, removing the vertical grid clutter the
    prior review flagged as unrefined default styling
  - Bubble radius still correctly scaled by area (sqrt of the value ratio) with a
    clear three-reference-bubble size legend beside the plot
  - 'Bubbles remain a genuine community-only workaround: SVG circles positioned via
    the chart''s own useXScale/useYScale hooks stay perfectly synced with the real
    axes/grid instead of using a separate coordinate system'
  - All font sizes explicitly set; both light and dark renders are fully legible with
    theme-correct chrome and a correct brand-green (#009E73) first series
  weaknesses:
  - Archetype colors use Imprint palette positions 1, 3, 4 (green, blue, ochre) and
    skip position 2 (lavender) -- the style guide's 'use positions 1->N in order,
    don't cherry-pick' rule applies since 'Growth leaders/Mid-market/Niche players'
    are abstract category labels with no strong real-world color association that
    would justify a semantic reassignment. Use palette[1] (lavender) for the second
    series instead of palette[2].
  - The densest clusters (e.g. growth ~24-30%, margin ~20-25%, all Growth leaders)
    still have 4-5 overlapping bubbles that blur together despite the smaller MAX_RADIUS
    and alpha/stroke treatment -- consider a further radius reduction or slightly
    higher stroke contrast for that region.
  - ChartContainer is still passed series=[] and never exercises MUI X's own series/marks
    API for the data (a legitimate workaround given the community package's lack of
    a z-as-size scatter mode, but it continues to cap how idiomatic the data-rendering
    path can be scored).
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 -- not pure white, not dark.
      Chrome: Title "bubble-basic · javascript · muix · anyplot.ai" top-left in dark ink, fully readable. X-axis label "Revenue growth rate (%)" and Y-axis label "Profit margin (%)" both readable with units. Tick labels on both axes are dark and legible. Only horizontal grid lines are shown, light gray and subtle. Two legends sit at top-right: "Company archetype" with three colored dot + label pairs (green "Growth leaders", blue "Mid-market", ochre "Niche players"), and below it "Market share index" with three reference circles (100, 50, 10) and readable value labels.
      Data: ~50 bubbles colored by archetype (green/blue/ochre) with ~0.6 fill opacity and a thin light stroke, spread across positive and negative growth/margin values, sized by market share (small ~7px to large ~44px radius, scaled by area). The color-coding makes the three underlying clusters (high-growth/high-margin green cluster top-right, blue mid-market band through the middle, scattered ochre niche players lower-left) immediately visible. Overlapping bubbles within a cluster remain mostly distinguishable thanks to alpha blending and the stroke outline, though the densest green cluster (top-right) still has several bubbles blurring together.
      Legibility verdict: PASS -- no light-on-light text, no clipped elements.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 -- not pure black, not light.
      Chrome: Title, axis labels, and tick labels all render in light ink and are clearly readable against the dark background. Grid lines are subtle dark-gray/light, still visible. Both legends render identically in position and content, with light text.
      Data: Same green/blue/ochre bubbles at the same positions and sizes as the light render -- colors are identical between themes, confirming only chrome (background, text, grid) flipped.
      Legibility verdict: PASS -- no dark-on-dark failures observed; all text and data elements are clearly visible.
