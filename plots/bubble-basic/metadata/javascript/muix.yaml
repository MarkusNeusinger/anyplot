review:
  strengths:
  - Custom pairwise collision-avoidance pass (30 iterations, approximated in pixel
    space) meaningfully declutters three overlapping archetype clusters while keeping
    the underlying data honest
  - 'Correct Imprint palette use: canonical order positions 1-3 (t.palette[0..2])
    for the abstract archetype categories, with alpha 0.48 fill + pageBg stroke to
    handle overlap exactly as the spec recommends'
  - Bubble radius is scaled by area (sqrt of the min-max normalized share value),
    matching the spec's explicit 'scale by area, not radius' requirement
  - Dual legend (color archetype legend + a 3-value outlined-circle size legend) clearly
    explains both encoded dimensions, satisfying the spec's 'include a size legend'
    requirement
  - 'Distinctive MUI X technique: since the community package has no bubble/z-size
    scatter mode, the implementation builds a custom SVG bubble layer inside ChartContainer
    via useXScale/useYScale context hooks instead of reaching for a Pro feature or
    another library'
  - Well-commented code documents design rationale (API limitation workaround, prior-review-driven
    spread tuning) which will help any future repair pass
  weaknesses:
  - Bubbles still overlap tightly in two local pockets (growth ~18-22% / margin ~15-21%,
    and growth ~4-6% / margin ~10-13%); alpha + pageBg stroke keeps boundaries technically
    legible but individual bubble counts are hard to disambiguate there
  - 'In the dark render, composited bubble colors read visibly darker/more saturated
    than in the light render (mint-green -> forest green, lavender -> violet, slate-blue
    -> navy) because the same semi-transparent fill (fillOpacity 0.48) composites
    differently over #1A1A17 vs #FAF8F1; the underlying t.palette hex values are correctly
    identical across themes, but the perceived hue shift is worth minimizing (e.g.
    slightly higher opacity, or a theme-aware opacity bump in dark mode) so the archetype
    colors read as closer to identical across renders'
  - The 30-iteration pairwise repulsion 'declutter' pass plus a manual pixel-space
    approximation of the chart's own scale (before the real xScale/yScale hooks are
    available) is a fair amount of extra machinery for a 'basic' bubble-chart variant
    -- justified by the comments, but pushes CQ-01/CQ-04 complexity higher than a
    minimal implementation would need
  - The 210px right margin hosting both legends leaves a visible strip of unused vertical
    whitespace beneath the size legend relative to the plot area
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 -- not pure white.
      Chrome: Title "bubble-basic · javascript · muix · anyplot.ai" top-left in dark ink, clearly readable. X-axis label "Revenue growth rate (%)" and Y-axis label "Profit margin (%)" both dark, similarly sized. Tick labels dark and legible. Horizontal-only gridlines, subtle gray, do not compete with data. Right-side legend block: "Company archetype" (3 color swatches + labels: Growth leaders, Mid-market, Niche players) above "Market share index" (3 outlined reference circles labeled with values), all dark text on the light background.
      Data: First archetype (Growth leaders) renders in Imprint position 1 green (#009E73), second (Mid-market) in position-2 lavender, third (Niche players) in position-3 blue -- all semi-transparent (fillOpacity 0.48) with a light (pageBg) stroke separating overlapping bubbles. Growth leaders cluster in the upper-right (high growth, high margin); niche players skew lower-left/negative margin; mid-market spans the middle -- a legible three-way structure.
      Legibility verdict: PASS -- no light-on-light text found anywhere.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 -- not pure black.
      Chrome: Title, both axis labels, and all tick labels render in light ink, clearly readable against the dark background. Gridlines are subtle light-on-dark. The right-side legend block (archetype + size) also renders in light text, fully legible, matching the light render's layout exactly.
      Data: The same three archetype colors are used (t.palette[0..2], unchanged hex values, no theme branching on data color) -- confirmed identical color assignment logic to the light render. Visually the composited bubbles read darker/more saturated here (green appears more forest-toned, lavender reads as a deeper violet, the blue reads more navy) because the semi-transparent fill (alpha 0.48) composites differently over the near-black page background than over the near-white one; this is an alpha-compositing side effect, not a change to the underlying Imprint hex values, and no dark-on-dark text failures were found.
      Legibility verdict: PASS -- title, axis labels, tick labels, and legend text are all clearly readable; no dark-on-dark issues.
