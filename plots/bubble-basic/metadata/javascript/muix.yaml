review:
  strengths:
  - 'Creative technical workaround for MUI X community''s lack of native bubble/z-encoding:
    a custom SVG layer positioned via the chart''s own useXScale/useYScale hooks —
    genuine, distinctive library usage rather than a generic scatter substitute.'
  - 'Data has real structure: three named business archetypes (Growth leaders / Mid-market
    / Niche players) instead of generic labels, producing an interpretable story (an
    arc-shaped growth-vs-margin relationship among growth leaders).'
  - Physically-motivated declutter pass (radius-aware repulsion over 40 iterations)
    keeps overlapping bubbles distinguishable without flattening the organic scatter
    shape.
  - Both the color legend and the size legend are custom-built, clearly labeled, and
    vertically centered against the chart rather than pinned to a fixed offset that
    leaves dead whitespace.
  - Correct Imprint palette in canonical order (green / lavender / blue), correct
    theme-adaptive chrome (title, axis text, grid) in both renders, and the exact
    mandated title format.
  weaknesses:
  - 'Semi-transparent bubble fills composite differently over the light vs. dark page
    backgrounds: the pale lavender Mid-market series (#C475FD) reads noticeably more
    saturated/magenta on the #1A1A17 dark surface than the identical hex does on the
    #FAF8F1 light surface. The theme-aware opacity bump (0.48 light -> 0.6 dark) only
    partially compensates — consider a per-swatch alpha tuned specifically for the
    paler palette positions, or a light ink stroke, to stabilize perceived hue across
    themes.'
  - ChartsGrid is horizontal-only; the style guide recommends gridlines on both axes
    for scatter/bubble-type charts so x-values are as easy to read off as y-values.
  - Light-theme bubble opacity (0.48) sits marginally below the specification's recommended
    0.5-0.7 alpha range for overlap handling — a very small deviation, not a functional
    problem.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "bubble-basic · javascript · muix · anyplot.ai" in dark ink, top-left, fully visible and not clipped. X-axis label "Revenue growth rate (%)" and Y-axis label "Profit margin (%)" both dark, descriptive, with units. Tick labels on both axes dark and legible. Subtle horizontal-only gridlines. Right-side legend block ("Company archetype" with 3 colored dots + labels; "Market share index" with 3 outlined reference circles + numeric labels) is dark-text, vertically centered against the chart, close to the plot (not isolated).
      Data: ~50 bubbles scaled by area (min radius 7px, max 38px) in three colors — brand green (#009E73, Growth leaders), pale lavender (#C475FD, Mid-market), and grayish blue (#4467A3, Niche players) — first categorical series is correctly brand green. Bubbles use a semi-transparent fill (~0.48 alpha) with a page-background-colored stroke that keeps touching/overlapping bubbles visually separated. The three archetypes occupy distinguishable regions of the growth/margin plane, with the green "Growth leaders" cluster forming a visible upward arc at high growth rates.
      Legibility verdict: PASS — all title, axis, tick, and legend text is clearly readable against the light background; no light-on-light text found.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Title, axis labels, tick labels, and both legend blocks all render in light ink, clearly visible against the dark surface. Gridlines are still present as subtle light horizontal lines. Legend circle outlines (size legend) correctly flip to a light stroke.
      Data: The same three data colors are used (identical hex values, palette positions 1-3), and the brand-green bubbles look essentially identical in both themes. However, the pale lavender Mid-market bubbles read distinctly more saturated/magenta on the dark background than the soft lilac seen on the light background — an expected but non-trivial consequence of compositing a semi-transparent fill (bumped to ~0.6 alpha here) over a much darker page color. Niche-player (blue) bubbles show a smaller, similar shift toward more saturation.
      Legibility verdict: PASS — no dark-on-dark text; all chrome elements are readable. The only discrepancy is the perceived hue shift of the semi-transparent data colors between themes (a palette-compliance nuance, not a legibility failure).
