review:
  strengths:
  - Bubble size is scaled by area (sqrt of the normalized value) with sensible min/max
    radius caps, so the size encoding reads correctly instead of exaggerating differences
  - Two well-crafted custom legends (archetype color legend + reference-bubble size
    legend with rounded, readable values) clearly explain both encodings
  - Alpha blending (0.48) combined with a pageBg-colored stroke on every bubble handles
    overlapping points exactly as the spec's notes recommend
  - Categories are abstract group labels assigned to the Imprint palette in canonical
    order (green, lavender, blue) rather than cherry-picked colors, with the brand
    green correctly reserved for the first series
  - Deterministic LCG-based synthetic data forms three plausible, clearly separated
    company archetypes (growth leaders / mid-market / niche) instead of a formless
    random cloud
  - 'Both renders are legible and theme-correct: identical data colors, chrome (title,
    axes, grid, legend text) flips correctly between the warm-cream and warm-black
    surfaces'
  weaknesses:
  - The cluster around x=18-22, y=15-19 has two 'Growth leaders' bubbles and one 'Mid-market'
    bubble overlapping so tightly that individual boundaries blur into a mixed blob
    despite the alpha blending and stroke separation - widen that pocket's spread
    slightly or nudge overlapping points apart the way the 'Growth leaders' archetype
    spread was already widened in a previous review round.
  - The bubbles are drawn as a fully custom SVG layer outside MUI X's own chart marks
    (only the axes and grid come from ChartContainer/ChartsGrid) - this is a reasonable
    workaround given the community package has no bubble/z-size scatter mode, but
    it means little of the actual data rendering showcases the library itself, which
    caps how much Library Mastery credit the implementation can earn.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 - not pure white, not dark.
      Chrome: Title "bubble-basic · javascript · muix · anyplot.ai" in dark ink, top-left. X-axis "Revenue growth rate (%)" and y-axis "Profit margin (%)" labels in dark ink, both legible. Tick labels (numeric, every 2-5 units) dark and clearly readable. Horizontal-only grid lines are thin and subtle, visible without competing with data. Right-side legend block: "Company archetype" (green/lavender/blue-gray swatches with archetype names) above "Market share index" (three unfilled reference circles labeled 100/50/10) - both legend titles bold and legible.
      Data: ~50 bubbles at fillOpacity 0.48 with a pageBg-colored stroke separating overlaps. First series ("Growth leaders") is Imprint brand green #009E73, "Mid-market" is lavender, "Niche players" is blue - all clearly distinguishable against the cream background. Three archetype clusters are visually separable (growth leaders skew high-x/high-y, niche players skew low-x/low-y, mid-market sits in between), with one dense overlap pocket around x=18-22, y=15-19.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 - not pure black, not light.
      Chrome: Title in light ink, clearly readable. Axis labels and tick labels rendered in light ink against the dark surface - no dark-on-dark issues found anywhere (titles, ticks, legend text all confirmed legible). Grid lines remain subtle but visible. Legend text ("Company archetype", "Market share index", archetype names, size values) all light-colored and legible.
      Data: Same three bubble colors as the light render (green/lavender/blue), confirming data colors are identical between themes - only the chrome (background, text, grid) flips. The brand green remains clearly visible on the dark surface. The same overlap pocket around x=18-22, y=15-19 is present, as expected since it's the identical dataset.
      Legibility verdict: PASS
