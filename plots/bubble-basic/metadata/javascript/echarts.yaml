review:
  strengths:
  - Standout bubble (best revenue-growth-per-R&D-dollar company) is drawn as a separate,
    fully-opaque, ink-outlined series with a direct label, giving the chart a clear
    focal point that was missing in attempt 1
  - Market-share field was reframed as a 'Relative Market Index' scored independently
    per company (0-100) and the code explicitly documents this is not a literal share
    of one shared 100% pie, fixing the aggregate-realism weakness from attempt 1
  - Bubble size scaled by sqrt(value) so on-screen AREA (not radius) is proportional
    to the index value, exactly matching the spec's explicit requirement
  - Transparency (opacity 0.6) plus a subtle pageBg/ink edge stroke handles the heavy
    overlap among 65 bubbles while keeping individual bubbles distinguishable
  - Custom size legend built from ECharts graphic elements (three reference bubbles
    labeled with min/mid/max index values) clearly explains the size encoding, satisfying
    the spec's legend requirement
  - 'Both renders are theme-correct: #FAF8F1 light / #1A1A17 dark backgrounds, theme-adaptive
    ink tokens throughout, first series is brand green #009E73, identical data colors
    across themes'
  - Deterministic fixed-seed LCG generates data in-memory, correct for the browser
    runtime with no filesystem/network access
  - Canvas gate passed (3200x1800), animation disabled, no explicit width/height/devicePixelRatio
    passed to echarts.init
  weaknesses:
  - Densest cluster (bottom-left, low R&D spend / low growth) merges into an indistinct
    green blob where individual bubble boundaries are hard to trace — a touch more
    opacity contrast or slight jitter would help element visibility there
  - Library mastery is solid but still fairly generic scatter + manual graphic legend;
    a more ECharts-distinctive technique (e.g. visualMap-driven sizing/legend) would
    push Library Mastery further
  - 'Design excellence is good but not yet publication-level: a bespoke color treatment
    (e.g. subtle color gradient tied to growth-per-R&D ratio) beyond the single standout
    label would elevate the aesthetic further'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "bubble-basic · javascript · echarts · anyplot.ai" centered at top in bold dark ink (~35% of plot width, well within the 50-70% guideline). Axis titles "R&D Investment ($M)" (x) and "Revenue Growth Rate (%)" (y) in dark ink, both clearly readable. Tick labels in medium-gray ink. Grid lines thin and subtle on both axes. A "Relative Market Index" size legend at the right edge shows three reference bubbles labeled 9, 54, 100, fully within canvas bounds. All chrome elements are dark-on-light and legible.
      Data: All ~65 data bubbles are brand-green (#009E73) at 60% opacity with a thin off-white edge stroke for definition where bubbles overlap; diameter scales with sqrt(value) so area is proportional to the index. One bubble (lowest R&D spend, positive growth) is drawn fully opaque with a thick dark-ink outline and a bold "Best growth per R&D $" label above it, creating a clear focal point.
      Legibility verdict: PASS — no light-on-light issues, all text readable.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Identical title/axis/legend layout, now rendered in light ink (near-white primary text, light-gray secondary/tick/legend text) — all clearly legible. No dark-on-dark failures observed anywhere (title, axis labels, tick labels, legend text, standout label all use theme-adaptive ink tokens).
      Data: Data bubbles use the identical brand-green hue as the light render (confirmed — only chrome flipped), now with a thin dark-ink edge stroke instead of off-white on regular bubbles, and a light-ink outline on the standout bubble. Bubble sizing and positions are pixel-identical to the light render.
      Legibility verdict: PASS — no dark-on-dark issues, all text and data clearly distinguishable from the background.
