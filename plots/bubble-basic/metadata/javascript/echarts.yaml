review:
  strengths:
  - 'Goes beyond the basic 3-variable bubble spec: x/y position, sqrt-scaled bubble
    area for size, and a derived 4th dimension (growth-per-R&D-dollar) mapped through
    a continuous Imprint sequential color scale'
  - Deliberate narrative outliers (legacy incumbent, agile startup, stagnant market
    leader) demonstrate exactly what a bubble chart reveals that a plain 2D scatter
    would hide
  - 'Clear focal point: the top efficiency performer is drawn as a separate, fully-opaque,
    ink-outlined series with a direct label, creating strong visual hierarchy'
  - Manually built size legend (three reference bubbles with correct sqrt-area scaling)
    via ECharts `graphic` elements, clearly labeled 'Relative Market Index'
  - Painter's-order fix (largest bubbles drawn first, smallest last) prevents small
    bubbles in the dense cluster from disappearing under large ones
  - Theme-adaptive chrome is correct in both renders; data colors are identical between
    light and dark
  - 'First/highlighted series matches brand green #009E73; continuous efficiency data
    correctly uses the Imprint sequential colormap, no forbidden colormaps used'
  weaknesses:
  - The continuous efficiency color scale barely differentiates most bubbles in the
    dense 55-95 R&D-spend range — nearly all render as similar dark blue, muting the
    intended 4th-dimension story except for the extracted standout and the low-spend/high-growth
    cluster on the left
  - Right-side whitespace around the size legend is slightly heavy relative to the
    plot area — margins could be tightened a touch for better canvas balance
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "bubble-basic · javascript · echarts · anyplot.ai" centered at top in bold dark ink; x-axis "R&D Investment ($M)" and y-axis "Revenue Growth Rate (%)" labels both descriptive with units; tick labels in soft dark gray; grid lines subtle light gray, visible but not dominant. A manual "Relative Market Index" size legend sits on the right with three gray reference bubbles (10, 55, 99). A vertical continuous color-scale legend ("High growth / R&D $" to "Low growth / R&D $") sits in the upper-left. All chrome is clearly readable against the light background.
      Data: ~65 bubbles scaled by sqrt(market index) for accurate area encoding, colored on a blue-to-green continuous scale (efficiency = growth per R&D dollar) with ~0.68 alpha and thin light borders to separate overlapping bubbles. One bubble (top-left, small x, high y) is drawn fully opaque in brand green #009E73 with a dark outline and the label "Best growth per R&D $", clearly acting as the chart's focal point.
      Legibility verdict: PASS — no light-on-light or unreadable text found.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title, axis labels, and tick labels now rendered in light/white ink against the dark background; grid lines are a subtle darker gray, still visible. Size legend and color-scale legend text render in light gray, fully legible against the dark surface.
      Data: Bubble colors and positions are identical to the light render — the blue-to-green efficiency scale and the brand-green standout bubble are unchanged, confirming only chrome flipped between themes.
      Legibility verdict: PASS — no dark-on-dark failures; all text (title, axis labels, ticks, both legends) remains clearly visible against the near-black background.
