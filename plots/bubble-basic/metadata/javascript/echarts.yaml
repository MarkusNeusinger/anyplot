review:
  strengths:
  - Bubble size is scaled by sqrt(value) so on-screen AREA (not radius) is proportional
    to market share, exactly matching the spec's explicit requirement
  - Transparency (opacity 0.6) is used to handle overlapping bubbles, within the spec-recommended
    0.5-0.7 range
  - Clear size legend built from ECharts `graphic` elements (three reference bubbles
    labeled with min/mid/max values) explains the bubble scale, satisfying the spec's
    legend requirement
  - 'Both renders are theme-correct: #FAF8F1 light / #1A1A17 dark backgrounds, theme-adaptive
    ink tokens for title/axis/ticks, first series is brand green #009E73'
  - Deterministic fixed-seed LCG generates the data in-memory (no filesystem/network
    access), correct for the browser runtime
  - Canvas gate passed (3200x1800), animation disabled, no explicit width/height/devicePixelRatio
    passed to echarts.init — follows the mount-node contract exactly
  weaknesses:
  - No additional visual-hierarchy technique (e.g. highlighting a standout company/outlier)
    is used to create a focal point beyond the raw scatter of bubbles — a missed opportunity
    for stronger data storytelling
  - Market share values are assigned independently to each of the 65 companies with
    several reaching close to 100% simultaneously, which isn't fully realistic as
    a literal market-share metric (shares can't collectively exceed 100% in one true
    market) — consider narrowing the range or reframing the field as a relative index
    for stronger DQ realism
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "bubble-basic · javascript · echarts · anyplot.ai" centered at top in bold dark ink, clearly legible. Axis titles "R&D Investment ($M)" (x) and "Revenue Growth Rate (%)" (y) in dark ink, both readable. Tick labels in medium-gray ink, clearly legible. Grid lines are thin, light gray, subtle but visible on both axes. "Market Share (%)" size-legend title and three labeled reference bubbles (9%, 54%, 100%) sit at the right edge, fully within the canvas with comfortable margin — no clipping.
      Data: All ~65 bubbles rendered in a single brand-green (#009E73) at 60% opacity with a thin off-white stroke for edge definition where bubbles overlap. Bubble diameter scales with sqrt(market share) so area is proportional to the underlying value, consistent with the size legend.
      Legibility verdict: PASS — all text (title, axis titles, tick labels, legend) is clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Same title, axis titles, and legend layout as the light render, now rendered in light ink (near-white for primary text, light gray for secondary/tick text and legend labels). Grid lines are thin, light, subtle. Legend bubbles and labels remain fully within canvas bounds.
      Data: Bubbles are the identical brand-green #009E73 hue as the light render (confirmed — only chrome flipped), now with a thin dark stroke around each bubble for edge separation instead of the light-render's off-white stroke. Bubble sizing and positions are pixel-identical to the light render.
      Legibility verdict: PASS — title, axis titles, tick labels, and legend text are all clearly visible against the dark background; no dark-on-dark failures observed.
