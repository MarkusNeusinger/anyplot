review:
  strengths:
  - Creative, idiomatic use of ECharts' continuous visualMap to encode a derived 4th
    dimension (growth-per-R&D-dollar) on top of position and size, adding real analytical
    value without cluttering the chart.
  - 'Clear data-storytelling focal point: the ''Best growth per R&D $'' bubble is
    drawn as a separate, fully-opaque, ink-outlined series with a label, giving the
    chart an obvious hero data point.'
  - Well-executed size legend (three reference bubbles with labeled index values,
    titled 'Relative Market Index') placed outside the plot area, satisfying the spec's
    size-legend requirement.
  - Correct area-based bubble scaling (diameter ∝ sqrt(value)), a painter's-order
    fix so small bubbles in the dense low-spend cluster render on top of large ones,
    and density-appropriate alpha blending per the spec notes.
  - 'Clean theme adaptation: identical data colors between light and dark renders,
    all chrome fully token-driven, no clipping or overflow in either render.'
  weaknesses:
  - The hard floor `growthRate = Math.max(1, ...)` clamps many low-R&D companies to
    nearly the same y=1 value, producing a visible pileup of concentric, near-identical
    bubbles ('bullseye' pattern) at bottom-left in both renders — reduces the realism
    of the market-analysis narrative. A softer floor (e.g. a small randomized offset
    instead of a hard clamp) would let points spread naturally near the origin.
  - marketIndex range (~8-100) slightly undershoots the spec's recommended 10-100
    minimum for the size variable; inconsequential but easy to tighten.
  - The visualMap gradient labels ('High growth / R&D $' / 'Low growth / R&D $') are
    set at 16px, noticeably smaller than the similarly-important size-legend text
    at 14px is fine but could be nudged up slightly for stronger parity with the axis-label
    hierarchy.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Bold dark title "bubble-basic · javascript · echarts · anyplot.ai" centered at top, clearly readable. Axis titles "R&D Investment ($M)" (x) and "Revenue Growth Rate (%)" (y) in dark ink, tick labels in softer gray, both fully legible. Subtle light-gray gridlines on both axes, visible but not competing with data. A vertical continuous color-scale legend ("High growth / R&D $" to "Low growth / R&D $") sits in the upper-left margin, and a labeled size legend ("Relative Market Index" with three reference bubbles: 9, 54, 99) sits in the right margin — neither collides with axis text.
      Data: ~65 semi-transparent bubbles (alpha ~0.68) with cream-colored borders for edge definition, colored on a continuous green→blue gradient (imprint_seq) driven by a derived "growth per R&D dollar" value. One bubble is drawn fully opaque with a dark ink outline and the label "Best growth per R&D $", clearly standing out as the focal point in brand green (#009E73, palette position 1). A dense cluster of overlapping, near-concentric bubbles is visible at the bottom-left (low R&D spend, near-zero growth).
      Legibility verdict: PASS — all text is clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Title, axis titles and tick labels have all flipped to light tones (white/light-gray) and remain fully legible against the dark surface. Gridlines are faint light lines, still visible but subtle. The color-scale legend and size legend both render with light text, matching the light-render layout and content exactly, no collisions.
      Data: Bubble colors and the standout green focal bubble are visually identical to the light render (same green→blue gradient, same brand-green highlight, same size legend values), confirming only chrome — not data color — changed between themes. The same bottom-left concentric-bubble cluster is present.
      Legibility verdict: PASS — no dark-on-dark failures observed; all text and data remain distinguishable from the near-black background.
