review:
  strengths:
  - Bubble diameter is scaled by sqrt(value) so on-screen AREA (not radius) is proportional
    to the market index, matching the spec's explicit requirement
  - Idiomatic use of ECharts' continuous visualMap to drive bubble color from a derived
    fourth dimension (growth per R&D dollar), which keeps individual bubbles distinguishable
    in the densest cluster beyond what alpha-blending alone could achieve
  - Hand-built graphic-based size legend (three reference bubbles with value labels)
    fulfils the spec's 'include a size legend' requirement with clean Imprint-compliant
    styling
  - 'Clear data-storytelling focal point: the single highest-efficiency company is
    drawn as a separate, fully-opaque, brand-green, labeled series (''Best growth
    per R&D $'') that reads immediately as the chart''s standout'
  - Painter's-order fix (largest bubbles drawn first, smallest last) prevents small
    bubbles in the dense low-spend cluster from disappearing under larger ones
  - Continuous color uses the Imprint imprint_seq stops correctly (brand green / blue),
    reversed consistently with the 'High'/'Low' text labels and the brand-green standout
    series
  - 'Both renders are theme-correct: warm off-white / near-black backgrounds, all
    chrome text readable, data colors identical across themes'
  - Title matches the mandated format exactly, axis labels are descriptive with units
    ($M, %)
  weaknesses:
  - Size-legend value labels (fontSize 18) are larger than the legend title (fontSize
    14, bold) and larger than the axis name text (fontSize 16), inverting the expected
    typographic hierarchy — reduce value-label fontSize to ~14-15 or bump the legend
    title to match
  - 'Default ECharts axisTick marks are left enabled on both axes; per the style guide''s
    decoration-removal checklist, consider axisTick: { show: false } while keeping
    axisLabel, for a cleaner L-shaped frame'
  - The R&D-investment vs. growth-rate relationship is a fairly tight, mostly linear
    trend with noise; a touch more variance/outliers would better showcase the bubble
    chart's ability to reveal patterns hidden in a plain 2D scatter (DQ-01)
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "bubble-basic · javascript · echarts · anyplot.ai" in bold dark ink, centered top. X-axis "R&D Investment ($M)" and Y-axis "Revenue Growth Rate (%)" labels in dark ink with units. Tick labels and grid lines in soft secondary ink, subtle and visible. A vertical continuous color-legend ("High growth / R&D $" / "Low growth / R&D $") sits top-left, and a size legend ("Relative Market Index" with sample bubbles at 9/54/100) sits top-right. All text is clearly readable against the light background.
      Data: ~64 bubbles form a blue-to-green continuous gradient (Imprint imprint_seq stops) sized by area for the market-strength index, with a single fully-opaque brand-green (#009E73) bubble outlined in dark ink and labeled "Best growth per R&D $" as the standout focal point. First-series brand green is reserved for this highlighted point since the main cloud uses a continuous (not categorical) color encoding.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title, axis labels, and tick labels now rendered in light ink (white/off-white) against the dark background — all clearly legible, no dark-on-dark failures observed. Grid lines remain subtle. Both legends (color and size) render with light-colored text.
      Data: Bubble colors and the brand-green standout bubble are visually identical to the light render — only the chrome (background, text, grid) flipped, confirming Imprint palette data-color constancy across themes.
      Legibility verdict: PASS
