review:
  strengths:
  - Correct area-based bubble scaling (diameter ∝ sqrt(value)) so visual area tracks
    the market-index column, exactly as the spec requires
  - Painter's-order fix draws large bubbles first so small bubbles in the dense low-spend
    cluster stay visible on top instead of disappearing
  - Deliberate outliers (legacy incumbent, agile startup, stagnant leader) break the
    x/y trend, giving the chart genuine data-storytelling value beyond a flat correlation
    cloud
  - Standout series (highest growth-per-R&D-dollar company) is drawn in brand green
    with an ink outline and direct label, creating a clear focal point
  - Idiomatic, distinctive use of ECharts' continuous visualMap to encode a derived
    efficiency-rank dimension, paired with a custom graphic-based size legend — both
    theme-adaptive and correctly labeled
  - 'Both renders are theme-correct: warm off-white/near-black backgrounds, fully
    legible text in both themes, identical data colors between light and dark'
  - Deterministic, self-contained data generation via a seeded LCG with clear in-code
    documentation of the modeling choices
  weaknesses:
  - In the densest cluster (R&D ≈ 60-95, growth ≈ 0-20%) many similarly-sized, similarly-colored
    bubbles overlap heavily; alpha and borders keep it technically readable but individual
    bubbles are hard to trace
  - Code goes beyond a flat 'data → plot' script (two helper functions plus rank computation,
    painter's-order sort, and a best-ratio scan) — justified by the lack of vectorized
    numpy-equivalents in browser JS, but more structure than a minimal KISS script
  - The color legend sits just inside the top-left corner of the plotting area rather
    than fully in the margin; it doesn't collide with any bubble, but it is a slightly
    unconventional placement
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matching #FAF8F1 — not pure white.
      Chrome: Title "bubble-basic · javascript · echarts · anyplot.ai" centered at top in bold dark ink. X-axis "R&D Investment ($M)" (0-100) and Y-axis "Revenue Growth Rate (%)" (0-50) labels and tick labels are dark/soft-ink and clearly legible. Subtle light-gray gridlines at 10/20-unit intervals. A vertical continuous color-scale legend ("High growth / R&D $" to "Low growth / R&D $") sits in the top-left, and a "Relative Market Index" size legend with three reference circles (10/55/99) sits on the right.
      Data: 65 semi-transparent bubbles positioned by R&D spend (x) and growth rate (y), sized by market index (area-proportional), colored on a green-to-blue continuous scale by growth-per-R&D-dollar rank. One bubble (top-left, x≈9, y≈46) is rendered fully opaque in brand green #009E73 with a dark outline and the label "Best growth per R&D $", clearly acting as the chart's focal point.
      Legibility verdict: PASS — all text is dark-on-light and clearly readable; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, matching #1A1A17 — not pure black.
      Chrome: Same title, axis labels, tick labels, gridlines, and legends as the light render, but all text and axis lines are rendered in light ink (near-white/soft-light gray) instead of dark ink. Gridlines are faint light lines instead of dark ones.
      Data: Bubble positions, sizes, and colors are visually identical to the light render — the same green-to-blue continuous scale, and the same standout bubble in brand green #009E73 with the same outline and label. No hue shift between themes.
      Legibility verdict: PASS — all text is light-on-dark and clearly readable; no dark-on-dark failures observed. Brand green remains vivid and legible against the dark background.
