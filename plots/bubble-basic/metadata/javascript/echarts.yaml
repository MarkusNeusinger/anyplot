review:
  strengths:
  - Bubble diameter is scaled by sqrt(value) so on-screen AREA is proportional to
    the market index, matching the spec's explicit requirement, and is backed by a
    clear 3-sample size legend (9 / 54 / 100) built from graphic elements.
  - Bubbles are drawn in descending-size painter's order so small bubbles in the dense
    low-spend cluster stay visible on top of large ones instead of disappearing underneath
    them.
  - Idiomatic use of a continuous visualMap on a derived 4th dimension (growth earned
    per R&D dollar) gives the dense bubble cloud a real color gradient instead of
    relying on alpha alone to separate overlapping bubbles — genuine ECharts mastery
    beyond default usage.
  - 'Clear data-storytelling focal point: the best growth-per-R&D-dollar company is
    drawn as a separate, fully-opaque, ink-outlined, labeled series in brand green,
    giving the chart a clear guided read.'
  - 'Theme-adaptive chrome is correct in both renders (background #FAF8F1 / #1A1A17,
    ink/inkSoft/grid tokens threaded through title, axes, legend text), and data colors
    (brand green standout, sequential gradient) are identical between light and dark.'
  - Canvas is exactly 3200×1800 with generous margins; no title, axis, or legend text
    is clipped at any edge in either render.
  - Deterministic in-memory data via a tiny fixed-seed LCG, appropriate 0.68 alpha
    for overlap handling per the spec's notes, and a minimal, class-free, single-purpose
    script.
  weaknesses:
  - The continuous color-legend's bottom label ('Low growth / R&D $') sits with very
    little vertical breathing room above the rotated y-axis title ('Revenue Growth
    Rate (%)') in the left margin — not overlapping in either render, but tight enough
    to warrant a few more px of gap (increase visualMap `top`/reduce `itemHeight`,
    or nudge the y-axis `nameGap`).
  - The size-legend value labels (16px) read noticeably smaller than the title (22px)
    at thumbnail scale — bumping to ~18px would balance the visual hierarchy slightly
    better without touching the layout.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "bubble-basic · javascript · echarts · anyplot.ai" centered at top in dark ink, clearly legible. X-axis "R&D Investment ($M)" and y-axis "Revenue Growth Rate (%)" titles and numeric tick labels are all dark/soft-ink on the light background and fully readable. A vertical continuous color-legend bar sits in the upper-left with "High growth / R&D $" / "Low growth / R&D $" labels in dark gray text — readable, though the bottom label sits close to (not overlapping) the rotated y-axis title below it. A "Relative Market Index" size legend with three reference circles (9 / 54 / 100) sits fully inside the right margin with no clipping.
      Data: ~65 bubbles form a rising diagonal cloud from bottom-left to top-right. The bulk of bubbles are colored on a blue→teal→green continuous gradient (sequential Imprint scale, reversed so green = high efficiency) with ~0.68 opacity and thin off-white borders that keep overlapping bubbles distinguishable. One bubble in the lower-left is drawn fully opaque with a heavy dark outline and the brand green (#009E73) fill, labeled "Best growth per R&D $" — a clear focal point in the same green as index 1 of the palette.
      Legibility verdict: PASS — no light-on-light or unreadable text found in this render.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Title, axis titles, and tick labels are rendered in light/off-white ink and are clearly legible against the dark background. The color-legend and size-legend text switch to light gray/white and remain fully readable; no dark-on-dark failures observed anywhere (title, axis labels, tick labels, legend text, and the "Best growth per R&D $" annotation are all light-colored on the dark surface).
      Data: The bubble cloud's blue→teal→green gradient and the standout bubble's brand-green fill are visually identical to the light render — only the chrome (background, ink, grid, borders) has flipped, confirming the categorical/continuous data colors are theme-invariant as required.
      Legibility verdict: PASS — all chrome text is light-on-dark and clearly readable; no dark-on-dark issues.
