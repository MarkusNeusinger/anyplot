review:
  strengths:
  - Bubble diameter is scaled by sqrt(value) so on-screen AREA (not radius) is proportional
    to the market index, exactly as the spec requires
  - Custom graphic-based size legend (three reference circles) plus a continuous visualMap
    colorbar are both present, theme-adaptive, and readable in both renders
  - Painter's-order sort (largest bubbles drawn first, smallest last) keeps small
    bubbles from disappearing under large ones in the dense low-spend cluster
  - A dedicated standout series highlights the best-performing company ("Best growth
    per R&D $"), giving the chart a clear focal point and visual hierarchy
  - Deterministic seeded LCG data generation, correct brand-green-first usage on the
    highlight series, imprint_seq used correctly for the continuous efficiency dimension,
    and fully theme-correct chrome in both light and dark renders
  weaknesses:
  - Small annotation text (visualMap labels and size-legend value labels at fontSize
    13) risks becoming illegible once the PNG is scaled down to the ~400px mobile
    width — bump these to ~15-16px CSS for safety margin
  - The bottom-left cluster around R&D spend 8-15 / growth 0-2 has several bubbles
    nearly fully overlapping into a solid blob, making individual data points hard
    to distinguish even with alpha 0.68 and painter's-order sorting
  - 'Color-semantics conflict: the visualMap colors LOW-efficiency bubbles brand green
    and HIGH-efficiency bubbles blue, but the single standout "Best growth per R&D
    $" bubble (the highest-efficiency point) is drawn in that same brand green — visually
    matching the gradient''s "low" end instead of its "high" end, which undercuts
    the story the color encoding is trying to tell. Either invert the imprint_seq
    direction (green=high) or give the standout a treatment that doesn''t reuse a
    color meaningfully used by the gradient'
  - Two small helper functions (rand(), diameterFor()) deviate from the strict KISS
    "no functions" baseline — acceptable here since a seeded LCG is unavoidable in
    the browser and diameterFor is driven by a data-driven symbolSize callback, but
    worth simplifying if a future pass has room
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "bubble-basic · javascript · echarts · anyplot.ai" in bold dark ink, centered top. Axis titles "R&D Investment ($M)" (x) and "Revenue Growth Rate (%)" (y) in dark ink, both with units. Tick labels in softer gray, subtle light-gray gridlines on both axes. A vertical continuous colorbar (visualMap) sits in the upper-left margin labeled "High growth / R&D $" (top, blue) / "Low growth / R&D $" (bottom, green). A custom size legend ("Relative Market Index" with three reference circles labeled 9 / 54 / 100) sits in the right margin.
      Data: ~64 semi-transparent bubbles (opacity ~0.68) colored on a green→blue continuous scale by growth-per-R&D-dollar, with white/page-colored strokes for separation, sized by sqrt(market index) so area is proportional. One additional fully-opaque, black-outlined brand-green (#009E73) bubble is labeled "Best growth per R&D $" as a standout focal point.
      Legibility verdict: PASS — all title/axis/tick/legend text is clearly readable against the light background; no light-on-light text found.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title, axis titles, and legend/colorbar text now rendered in light ink/gray tones, all clearly legible against the dark background. Gridlines are subtle and still visible. No dark-on-dark text was found anywhere (title, axis names, tick labels, colorbar text, size-legend numbers, and the standout annotation are all light-colored).
      Data: Bubble colors and positions are pixel-identical to the light render — same green→blue continuous mapping and same brand-green standout bubble — confirming only chrome (not data color) flips between themes.
      Legibility verdict: PASS — all text remains readable in the dark theme; no dark-on-dark failures observed.
