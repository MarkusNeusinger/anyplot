review:
  strengths:
  - Bubble diameter is scaled as sqrt(market index), so on-screen AREA rather than
    radius tracks the size column exactly as the spec requires — the smallest bubbles
    still read at about 29 CSS px and the largest at 92 CSS px does not swallow the
    plot
  - The graphic-based size legend draws its three reference circles with the identical
    fill (t.palette[0]), 0.68 opacity and 1.5 px page-coloured outline as the data
    marks, so the glyphs read as the same objects in both themes
  - Painter's-order sort (largest market index drawn first) keeps small bubbles in
    the dense low-spend cluster on top of large ones instead of vanishing beneath
    them, without moving any mark off its (x, y) values
  - Every chrome colour is threaded from window.ANYPLOT_TOKENS (ink, inkSoft, grid,
    pageBg), so both renders are theme-correct and the data colour is identical between
    light and dark
  - 'Idiomatic ECharts: one echarts.init on #container with no explicit size, a single
    setOption, symbolSize as a callback over the data row, graphic circle/text elements
    for the custom legend, and animation: false for the harness'
  - Deterministic fixed-seed LCG plus three deliberate outliers (heavy-spend incumbent,
    agile startup, stagnant leader) that break the R&D/growth trend, giving the size
    encoding something to reveal
  weaknesses:
  - 'VQ-05 (both): bubbles whose growth value sits near 0 spill below the x-axis line
    into the tick-label band — the one at x≈48 is bisected by the axis line and the
    one at x≈84 stops about 15 px above the "80" tick label → keep the marks inside
    the plot frame by starting the value axis a few points below 0 (about −4). Likely
    cause: yAxis has no min, so the axis floor sits exactly at growth = 0.'
  - 'DQ-01 (both): the growth values crowd into 0–30 % with a single point above 32
    %, so the top third of the plot area carries no data → widen the generated growth
    spread so the upper band is populated. Likely cause: rawGrowth = 3 + rdSpend *
    0.18 + noise tops out near 21 % before noise.'
  - 'Suggestion: an ECharts tooltip would let the HTML detail view report each company''s
    R&D spend, growth rate and market index on hover — pure interactivity, invisible
    in the PNG.'
  - 'Suggestion: the mandated title fills only about 30 % of the plot width; a slightly
    larger title would balance the 16 px axis titles.'
  - 'Suggestion: tightening the vertical gaps between the three size-legend reference
    bubbles would make them read as one group rather than three scattered circles.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white matching #FAF8F1 — not pure white. Plot area spans roughly x 120-1740 / y 130-1000 of the 2000-px preview, so the chart fills most of the canvas with balanced margins.
      Chrome: Title "bubble-basic · javascript · echarts · anyplot.ai" centred at the top in bold dark ink (22 CSS px). X-axis title "R&D Investment ($M)" below the axis and rotated Y-axis title "Revenue Growth Rate (%)" on the left, both 16 CSS px dark ink. Tick labels 0/20/40/60/80/100 and 0/10/20/30/40/50 in soft ink at 14 CSS px. Grid lines are pale warm grey — subtle but clearly visible. No axis ticks drawn. A size legend sits in the right margin: bold "Relative Market Index" heading with three reference circles labelled 10, 55 and 99. All text is dark-on-light and fully readable; no light-on-light anywhere.
      Data: 65 translucent bubbles, every one in brand green #009E73 at opacity 0.68 with a 1.5 px page-coloured outline, positioned by R&D spend (x) and growth rate (y) and sized by market index. Diameters run about 29 px (index 10) to 92 px (index 99) in CSS units, i.e. sqrt-scaled so area tracks the value. First (and only) series is #009E73 as required. The legend circles use the identical fill, opacity and outline.
      Legibility verdict: PASS — every chrome element is clearly readable against the off-white surface.

    Dark render (plot-dark.png):
      Background: Warm near-black matching #1A1A17 — not pure black.
      Chrome: Identical layout. Title, both axis titles, all tick labels and both legend texts flip to light ink (near-white title, soft light grey ticks and legend labels) and are clearly readable against the dark surface. Grid lines flip to faint light grey — still visible, still subtle. No dark-on-dark failure anywhere: no element kept a near-black colour.
      Data: Bubble positions, diameters and colour are visually identical to the light render — the same brand green #009E73 at the same 0.68 opacity, still vivid against the near-black page. Only the bubble outline flips with the page colour (dark instead of cream), which is exactly the permitted page-coloured outline. The three legend circles remain green and match the marks.
      Legibility verdict: PASS — all text is light-on-dark and clearly readable; brand green stays legible on the dark surface.
