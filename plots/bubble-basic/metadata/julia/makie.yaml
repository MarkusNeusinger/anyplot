review:
  strengths:
  - Correct area-based (not radius-based) bubble scaling via sqrt of the normalized
    size variable, exactly as the spec requires
  - Size range (10-100) and point count (65) land squarely within the spec's recommended
    ranges
  - Custom composite size+color legend built from MarkerElements - a sophisticated,
    distinctive Makie technique
  - Explicit data storytelling via the 'peak sales zone' shaded band and annotation,
    on top of dual size/color encoding of sales
  - Fully theme-adaptive chrome (title, axis, ticks, grid, legend box) verified correct
    in both light and dark renders; data colors identical across themes
  - Uses the current, non-deprecated Figure(size=...) API and correct canvas math
    (1600x900 @ px_per_unit=2 -> 3200x1800)
  weaknesses:
  - Alpha is set to 0.75, slightly above the spec's recommended ~0.5-0.7 range for
    overlapping-bubble transparency - consider nudging down for marginally better
    separation in the densest cluster (~$250, rating ~2.3-2.7)
  - Color and size both encode the same 'sales' variable (redundant dual-encoding);
    the spec allows color to optionally distinguish a separate category, which was
    not explored here
  - The 'peak sales zone' annotation text (12pt) is small relative to the rest of
    the type hierarchy for a callout meant to carry the plot's central narrative point
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Bold dark title "bubble-basic · julia · makie · anyplot.ai" centered at top; "Price (USD)" and "Customer Rating" axis labels in dark ink; dark-gray tick labels; subtle ~15%-opacity grid on both axes; "peak sales zone" annotation in soft dark gray over a faint shaded band ($150-280). All clearly readable against the light background.
      Data: Bubbles area-scaled by sqrt(sales), colored on a green(#009E73)->blue(#4467A3) continuous imprint_seq gradient encoding annual sales, alpha 0.75 with a thin dark stroke. Composite size+color legend ("Annual Sales": 10/40/70/100 units) to the right.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Title and axis labels flip to off-white/light text; tick labels and "peak sales zone" annotation flip to soft light-gray; legend box uses a slightly lighter dark elevated fill with a soft border. No dark-on-dark failures observed — all text clearly legible.
      Data: Bubble colors (green->blue gradient), alpha, and stroke are identical to the light render — only chrome flipped, confirming correct theme-adaptive implementation.
      Legibility verdict: PASS
