review:
  strengths:
  - 'Excellent theme-adaptive execution: the Imprint palette data colors (green/lavender/blue
    tiers) are pixel-identical between light and dark renders, and every chrome element
    (background, title, axis labels, ticks, grid, legend box) flips correctly with
    no dark-on-dark or light-on-light failures.'
  - Well-designed dual-legend layout that clearly separates the two encoded variables
    — 'Production Scale' (color) and 'Box Office Revenue' (size) — with bold group
    headers, generous spacing, and a colgap!-tuned gap between the plot and legend
    column.
  - 'Thoughtful data narrative: production budget, critic rating, and box-office revenue
    are generated with a genuine ''franchise sweet spot'' ROI relationship, and the
    vspan! + text! annotation calls that pattern out explicitly.'
  - Bubble sizing follows the spec's area-proportional requirement (sqrt-scaled),
    with a size-reference legend whose values ($30M-$300M) closely bracket the actual
    data range.
  - 'Clean, idiomatic, reproducible Makie code: flat script structure, explicit font
    sizes throughout, Random.seed!(42), and no unused imports.'
  weaknesses:
  - 'Pipeline consistency: the reviewed plot-light.png/plot-dark.png render the title
    as ''bubble-basic · julia · makie · anyplot.ai'', but the committed HEAD source
    (makie.jl:57) sets title_str = ''Film Portfolio Analysis · bubble-basic · julia
    · makie · anyplot.ai'' with titlesize=36 — the prefix does not appear in either
    render, even though the same commit''s removal of the inset avg-revenue Axis IS
    correctly reflected (both renders show no inset). The reviewed PNGs therefore
    mix an old title with the new no-inset layout, a state that doesn''t match any
    single commit. Recommend re-rendering both themes from the exact HEAD script before
    the next AI review. Extrapolating from the current ~45%-width, 41-character render,
    the real 67-character prefixed title at titlesize=36 should land around 70-85%
    width (in line with the style guide''s expectation for the full mandated title),
    so overflow is unlikely — but this must be visually confirmed rather than assumed.'
  - 'DE-03 storytelling is understated: the ''franchise sweet spot'' annotation uses
    small, low-contrast gray text over a very subtle shaded band, so the insight is
    easy to miss at a glance — a bolder callout (heavier weight, or a short leader
    line to the peak cluster) would make the story land immediately.'
  - Minor bubble crowding in the low-budget indie cluster (budget < $50M) makes some
    of the smaller bubbles hard to distinguish individually even at alpha=0.5 — slightly
    more transparency or horizontal jitter in that region would help.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Bold dark title "bubble-basic · julia · makie · anyplot.ai" centered at top; dark axis labels "Production Budget (USD Millions)" (x) and "Critic Rating (out of 10)" (y, rotated); soft gray tick labels on both axes; thin left/bottom spines only (top/right removed); subtle low-opacity gridlines; a light-gray shaded vertical band ("franchise sweet spot") with a small gray annotation label inside it. Legend panel on the right has an off-white elevated background with a thin border, bold section headers ("Production Scale", "Box Office Revenue"), and gray labels.
      Data: ~90 semi-transparent bubbles. First tier (Indie) is brand green #009E73, second tier (Studio) is lavender #C475FD, third tier (Blockbuster) is blue #4467A3 — matching Imprint palette positions 1-3 in canonical order. Bubble area scales with box-office revenue (sqrt-scaled), from small (~15px) to large (~100px) circles, each with a thin dark stroke for edge definition.
      Legibility verdict: PASS — all text is clearly readable against the light background, no light-on-light issues found.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same layout as the light render, but title, axis labels, and legend text render in light off-white/gray tones; tick labels and axis spines use a lighter soft-gray; gridlines are a faint light-on-dark overlay; the "franchise sweet spot" shaded band and its label use a lighter gray tone appropriate for the dark surface. Legend panel background is the dark elevated tone (#242420-equivalent) with a light border and light text.
      Data: Same three bubble colors (green/lavender/blue) and same sizes as the light render — confirmed pixel-identical data-color positions across themes, only chrome inverted.
      Legibility verdict: PASS — all text is clearly readable against the dark background; no dark-on-dark failures found (title, axis labels, tick labels, and legend text all use light tones with strong contrast against the near-black surface).
