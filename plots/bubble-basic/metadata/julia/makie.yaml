review:
  strengths:
  - Correct sqrt-based area scaling for bubble size tied to box-office revenue, matching
    the spec's 'scale by area, not radius' requirement
  - Dual, well-organized legend (Production Scale color legend + Box Office Revenue
    size legend) with real reference bubbles at sensible values
  - '''Franchise sweet spot'' shaded band plus bold annotation gives the chart a clear
    narrative focal point (DE-03) instead of a flat scatter of bubbles'
  - Theme-adaptive chrome correctly implemented — data colors are byte-identical across
    light/dark renders, only chrome (background, ink, grid) flips, no dark-on-dark
    or light-on-light failures
  - Uses current Makie API (Figure(size=...) rather than the deprecated resolution=
    keyword), spines removed on top/right, subtle theme-aware gridlines
  weaknesses:
  - Bubble alpha is set to 0.3, below the spec's recommended 0.5-0.7 range for handling
    overlap — raising it toward ~0.5 would make individual bubbles read more solidly
    without losing overlap legibility
  - Title fontsize (36 at fig size 1600x900/px_per_unit=2) pushes the title close
    to ~90% of the axis panel width — trimming titlesize toward ~28-30 would restore
    more breathing room next to the legend column
  - The 'Production Scale' color tier is a discretized version of the already-plotted
    X-axis (production budget) rather than a fully independent third dimension — it
    aids reading dense clusters but isn't orthogonal new information
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Bold dark title "Film Portfolio Analysis · bubble-basic · julia · makie · anyplot.ai" fully visible and not clipped at the top edge. Dark-ink axis titles ("Production Budget (USD Millions)", "Critic Rating (out of 10)") and softer-gray tick labels are all clearly readable. Grid lines are subtle but visible. The "franchise sweet spot" band renders as a light gray-tinted rectangle with bold dark annotation text sitting clearly above the bubbles in that region, fully legible.
      Data: Three tiers of semi-transparent bubbles — green (#009E73, Indie <$50M), lavender (#C475FD, Studio $50-150M), and blue (#4467A3, Blockbuster >$150M) — sized by sqrt(box office revenue). The legend panel on the right shows solid (non-alpha) color swatches for the three tiers plus neutral gray reference circles for the size scale ($30M/$110M/$200M/$300M), all legible.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Title renders in near-white bold text, fully visible and uncropped. Axis titles and tick labels flip to light ink and remain clearly readable against the dark background — no dark-on-dark failures observed anywhere (axis titles, ticks, legend text, annotation all use light ink). The sweet-spot band appears as a light-gray-tinted rectangle (white-ink tint at low alpha) with a bold light annotation, clearly visible against the near-black surface.
      Data: Same three underlying data colors as the light render (green/lavender/blue at the same alpha) — confirmed the base hues are identical; alpha-compositing against the darker background naturally deepens their apparent tone, which is expected and not a theme violation. Legend swatches and text are fully legible in the dark legend panel.
      Legibility verdict: PASS
