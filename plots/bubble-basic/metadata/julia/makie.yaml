review:
  strengths:
  - 'Correct bubble-chart semantics: marker area (not radius) scales with sales via
    sqrt(), matching the spec''s ''scale by area'' requirement'
  - Clear data storytelling — a shaded vspan + 'peak sales zone' annotation makes
    the mid-range sweet-spot narrative explicit rather than leaving it implicit in
    the scatter
  - 'Well-constructed dual legend: separate MarkerElement groups for ''Product Tier''
    (color) and ''Annual Sales'' (size), with neutral-colored reference bubbles so
    the size key doesn''t get confused with the tier colors'
  - Imprint palette used in canonical order (green/lavender/blue for Budget/Mid-range/Premium)
    and identical across both themes; only chrome tokens (INK, INK_SOFT, INK_MUTED,
    backgrounds) flip between light and dark
  - 'Clean, idiomatic Makie code: single top-level script, Random.seed!(42) for reproducibility,
    only imports that are actually used, correct 3200x1800 canvas via resolution=(1600,900)
    + px_per_unit=2'
  weaknesses:
  - Heavy bubble overlap in the lower-left (Budget) and lower-middle (Mid-range) clusters
    makes it hard to distinguish individual points even with alpha=0.65 — consider
    a touch more transparency or slightly smaller markers in the densest region
  - The smallest reference bubble (~10 units, visible near price=490/rating=3.6) is
    quite small relative to the rest of the size range and easy to miss at a glance
    — consider raising the size floor slightly so the smallest bubbles stay clearly
    legible
  - Distinctive Makie-specific features are used at a solid-but-not-exceptional level
    (custom Legend groups, vspan!, text!) — there is room to lean further into Makie's
    grammar (e.g. layout-aware annotations) for extra polish
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matching the required #FAF8F1 surface — not pure white.
      Chrome: Bold dark title "bubble-basic · julia · makie · anyplot.ai" centered at top, clearly readable. Axis titles "Price (USD)" (x) and "Customer Rating" (y) in dark ink, tick labels in a softer grey — all legible. Subtle light-grey gridlines at low opacity, not competing with data. A light grey vspan band (~$150-280) with the annotation "peak sales zone" in soft grey text sits behind the bubbles, fully readable and not overlapping any bubble.
      Data: 65 semi-transparent bubbles (alpha ~0.65) colored by product tier — green (#009E73, Budget), lavender (#C475FD, Mid-range), and blue (#4467A3, Premium), each with a thin darkened stroke for definition. Bubble area scales with annual sales. A boxed legend on the right lists "Product Tier" (3 color swatches with tier names + price ranges) and "Annual Sales" (4 neutral-grey reference bubbles with unit labels), both on an elevated off-white panel with a soft border.
      Legibility verdict: PASS — no light-on-light text, all chrome and data are clearly distinguishable from the background.

    Dark render (plot-dark.png):
      Background: Warm near-black, matching the required #1A1A17 surface — not pure black.
      Chrome: Title and axis titles render in light off-white ink, tick labels in a lighter grey — all clearly readable against the dark background. Gridlines are faint light lines at low opacity. The vspan band is a lighter charcoal overlay and the "peak sales zone" annotation renders in light grey, fully legible with no dark-on-dark issue.
      Data: The same three data colors (green/lavender/blue) and bubble sizes as the light render — confirmed identical, since only chrome (background, text, grid, legend panel) flipped. The legend panel now sits on the dark "elevated" tone (#242420) with light text and a soft border, matching the theme.
      Legibility verdict: PASS — no dark-on-dark failures; title, axis labels, tick labels, annotation, and legend text are all clearly visible against the near-black background.
