review:
  strengths:
  - Sweet-spot annotation (shaded vspan + bold text label at $80-150M) makes the DE-03
    data storytelling explicit instead of leaving the viewer to find the insight themselves
  - Two independent encodings (color = production tier, area = box-office revenue)
    each carry their own signal instead of duplicating one variable, exactly matching
    the spec's three-variable intent
  - Bubble area is correctly sqrt-scaled from the normalized value so visual area
    is proportional to data (not radius), per the spec's explicit requirement
  - Custom two-group Legend (Production Scale + Box Office Revenue) with grouped titles
    and matched patchsize is a distinctive, idiomatic Makie feature, cleanly explaining
    both encodings
  - 'Correct Imprint palette in canonical order (#009E73 first, then #C475FD, #4467A3),
    theme-adaptive chrome correctly threaded through Axis and Legend on both renders'
  - Clean KISS script structure with explicit font/marker sizing and a fixed seed
    for reproducibility
  weaknesses:
  - Several bubbles overlap almost perfectly in the low-budget indie cluster (~$10-20M)
    and the mid-budget studio cluster (~$90-115M), merging into blob-like shapes despite
    alpha=0.4 — nudge alpha down slightly further (~0.3) or add a touch of horizontal
    jitter to near-coincident points so individual bubbles stay distinguishable (VQ-02).
  - Legend text (labelsize=13) becomes quite small and hard to read once the PNG is
    scaled down to the ~400px mobile preview width — bump legend labelsize to ~15-16
    and/or patchsize slightly larger for better mobile legibility (VQ-01).
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "Film Portfolio Analysis · bubble-basic · julia · makie · anyplot.ai" is bold dark ink, clearly visible at ~78% of plot width. Axis labels ("Production Budget (USD Millions)", "Critic Rating (out of 10)") and tick labels are dark/soft-ink gray, all legible. A shaded "franchise sweet spot" band (x=80-150) carries a bold dark-ink annotation label that reads clearly against the light background. Grid lines are faint but visible.
      Data: Bubbles colored by production tier — green (Indie, <$50M), lavender/purple (Studio, $50-150M), blue (Blockbuster, >$150M) — matching Imprint palette positions 1-3, first series is #009E73 green. Bubble area scales with box-office revenue via a legend on the right showing both tier colors and reference bubble sizes ($30M-$300M). Alpha ~0.4 lets overlapping bubbles show through, though several near-coincident bubbles in the indie and studio clusters still visually merge.
      Legibility verdict: PASS (all title/axis/tick/annotation text reads clearly against the light background; legend text is present but small).

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Title flips to light/off-white ink, fully legible. Axis labels and tick labels flip to light gray tones, clearly readable against the dark background — no dark-on-dark failures observed. The sweet-spot band and its annotation text remain legible (light text on a slightly lighter-than-background gray band). Grid lines are faint but visible.
      Data: Same three data colors as the light render (green/purple/blue), confirming data colors are identical across themes — only chrome (background, text, grid, legend frame) flipped. Legend background box uses the elevated dark surface (#242420-equivalent) with light text, readable.
      Legibility verdict: PASS (no dark-on-dark or light-on-light failures found in either theme).
