review:
  strengths:
  - 'Pixel-verified Imprint palette + theme compliance: plot backgrounds sample to
    exact #FAF8F1 (light) and #1A1A17 (dark), and the three production-scale tiers
    use canonical palette positions 1-3 (#009E73/#C475FD/#4467A3) identically in both
    renders'
  - 'Dual-legend design is internally consistent: the size legend''s largest reference
    bubble (~75px diameter, labeled $300M) measures almost identically to the largest
    actual data bubble in the chart (~74px), so the size legend honestly represents
    the real data range rather than an arbitrary scale'
  - 'Genuine data storytelling: the shaded ''franchise sweet spot'' band plus annotation
    text gives the viewer an immediate, explicit insight (mid-budget ROI premium)
    without resorting to fake interactivity or chartjunk'
  - Bubble sizes are scaled by sqrt(value) so visual area (not radius) is proportional
    to box-office revenue, correctly implementing the spec's area-scaling requirement
  - Clean, idiomatic single-file Makie script (Figure/Axis/scatter!/vspan!/text!/Legend/MarkerElement/colgap!),
    KISS structure, reproducible via Random.seed!(42)
  weaknesses:
  - The densest low-budget (indie) cluster still overlaps heavily even at alpha=0.5
    - a touch more contrast or a thin white stroke variant in that region would help
    individual bubbles separate further
  - Tier-legend swatches (markersize=18, ~23px rendered) are visually much smaller
    than the size-legend reference circles (33-75px) - a slightly larger fixed swatch
    size would make the two legend groups feel more visually consistent
  - Design excellence is strong but could go further with more deliberate typographic
    weight variation between title/labels/ticks rather than a fairly uniform sans-serif
    treatment throughout
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, pixel-sampled to (250, 248, 241) = #FAF8F1 exactly.
      Chrome: Bold dark title "Film Portfolio Analysis · bubble-basic · julia · makie · anyplot.ai" spans ~64% of the plot-column width (measured 520-2241 px of a 2695 px plot column) - well within the expected range for a descriptive-prefixed mandated title. Axis labels ("Production Budget (USD Millions)", "Critic Rating (out of 10)") and tick labels render in dark/soft-dark ink, both clearly legible. Grid lines are faint (~15% opacity) and don't compete with data. The "franchise sweet spot" annotation and its shaded vertical band are clearly visible near the top of the plot with no overlap with any bubble.
      Data: Three bubble colors are present - brand green (#009E73, Indie <$50M), lavender (#C475FD, Studio $50-150M), and blue (#4467A3, Blockbuster >$150M) - matching the Imprint palette's canonical positions 1-3. Bubble sizes visibly scale with box-office revenue, from small ($30M-ish) to large ($300M-ish) bubbles, matching the size legend's reference circles almost exactly (measured diameters ~33px/52px/64px/75px in the legend vs. up to ~74px for the largest data bubble).
      Legibility verdict: PASS - all text is clearly readable against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, pixel-sampled to (26, 26, 23) = #1A1A17 exactly - not pure black.
      Chrome: Title, axis labels, and tick labels flip to light ink tones (confirmed visually - white/light-gray text throughout), fully legible against the dark surface. The legend box background flips to the dark "elevated" tone (#242420) with light text, and remains fully readable. Grid lines remain faint and appropriately inverted. No dark-on-dark failures were found anywhere in the chart.
      Data: All three bubble colors (green/lavender/blue) are pixel-identical to the light render - only the chrome (background, text, grid, legend frame) changed between themes, exactly as required.
      Legibility verdict: PASS - all text and data remain clearly readable against the dark background; no dark-on-dark defects.
