review:
  strengths:
  - Two LineCharts with identical y-axis bands and a hidden top x axis share one log10
    frequency axis, so every decade lines up across magnitude and phase
  - Gain and phase margins are interpolated at the crossovers and drawn in data coordinates
    through useXScale/useYScale inside the chart context; GM 15.7 dB at 5.30 Hz and
    PM 36.4° at 1.98 Hz match the transfer function
  - Native ChartsReferenceLine draws the 0 dB and −180° references dashed in inkSoft
    with end labels, distinct from the curves in both themes
  - Margin labels are placed on the side the curve leaves, so they never cross a curve
    or a reference line
  weaknesses:
  - 'Suggestion: phase ticks at multiples of 45° (0, −45, −90 … −270) would match
    Bode convention better than the 50° steps.'
  - 'Suggestion: an underdamped pole pair, as the spec''s Data example describes,
    would add a resonance peak and a steeper phase drop to the response.'
  - 'Suggestion: the subtitle''s point count and range repeat what the x axis shows;
    a line naming the system (e.g. its transfer function) would tell the reader more.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole canvas.
      Chrome: centered bold title "bode-basic · javascript · muix · anyplot.ai" with a grey subtitle "Open-loop frequency response · 250 log-spaced points from 0.01 to 100 Hz"; y-axis titles "Magnitude (dB)" (ticks 20 … −80) and "Phase (°)" (ticks 0 … −250), shared x-axis "Frequency (Hz)" with decade ticks 0.01, 0.1, 1, 10, 100 under the bottom panel; subtle horizontal and decade vertical grid lines aligned across both panels; all text dark and readable.
      Data: magnitude curve in #009E73 falling from ~26 dB to ~−82 dB; phase curve in #C475FD falling from ~−3° to ~−260°; dashed inkSoft reference lines at 0 dB ("0 dB") and −180° ("−180°") across the full range; near-black dot-capped markers "GM 15.7 dB at 5.30 Hz" (curve to 0 dB line) and "PM 36.4° at 1.98 Hz" (curve to −180° line), labels in bold ink.
