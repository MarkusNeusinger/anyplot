review:
  strengths:
  - Precise panel alignment between the main scatter and both marginal panels via
    ggplotGrob width/height matching — a technically well-executed composition technique.
  - 'Mandated title format is exact, Imprint palette is respected (brand green #009E73
    as the sole series), and light/dark backgrounds match the required hex values
    exactly with data color held constant across themes.'
  - Marginal panels combine a histogram and a KDE overlay, giving more distributional
    detail than either alone, matching the spec's suggestion directly.
  - Realistic, neutral agricultural dataset (rainfall vs. crop yield, n=400) with
    a plausible moderate positive correlation and sensible domain scale.
  - Point alpha (0.6) is exactly within the spec's recommended 0.6-0.7 range and successfully
    reveals density in the crowded core cluster.
  - 'Clean, reproducible code: set.seed(42), no unused imports, no fake interactivity,
    straightforward top-to-bottom structure despite the multi-panel composition.'
  weaknesses:
  - Marginal histogram/KDE use the same full-saturation brand green as the main scatter
    points (fill alpha=0.3 but density line at linewidth=0.9, alpha=1) — the spec
    calls for 'subtle colors for marginal distributions to not distract from the main
    scatter plot'; consider a dimmer/desaturated tint (e.g. lower line alpha, or a
    muted grey-green) for the marginal density curve to further de-emphasize it relative
    to the main panel.
  - panel.grid is fully blanked (panel.grid = element_blank()) in every sub-plot,
    leaving no reference gridlines anywhere in the composite; a very faint major-only
    gridline per the style guide's theme-adaptive chrome section would aid reading
    approximate values without adding clutter.
  - Main-panel tick label size (axis.text size=9) is on the small side for a composite
    this information-dense; a slightly larger size would improve legibility at typical
    catalog thumbnail scale.
  - gridExtra::arrangeGrob + manual grob width/height matching is a valid but slightly
    dated composition technique — fine for now, but note for future ggplot2 specs
    that patchwork-style approaches can achieve the same alignment more concisely
    if it ever becomes an approved dependency.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1), consistent across the full 2400x2400 square canvas including the empty top-right composite cell.
      Chrome: Title "scatter-marginal · r · ggplot2 · anyplot.ai" top-left in dark ink, fully legible. Axis titles "Annual Rainfall (mm)" (x) and "Crop Yield (t/ha)" (y) in dark ink, tick labels (500/750/1000, 2-6) in a softer grey-ink, all clearly legible against the light background. No grid lines are drawn (blanked by design). Marginal panels (top: rainfall histogram+KDE; right: crop-yield histogram+KDE, flipped) have no axis text of their own and align cleanly with the main panel's x/y ranges.
      Data: Main scatter uses a single green (#009E73, Imprint position 1) at alpha≈0.6, revealing a moderately dense, positively-correlated cloud of 400 points with visible density buildup in the mid-range. Marginal histograms are filled with the same green at low alpha (~0.3) with a solid green KDE line on top, both shapes reasonably unimodal and slightly right/left skewed respectively.
      Legibility verdict: PASS — no light-on-light or unreadable text; the layout has generous whitespace and no clipping.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17), consistent everywhere including the empty top-right cell.
      Chrome: Title and axis titles switch to light ink, tick labels to a lighter soft grey, both fully legible against the dark background — no dark-on-dark failures observed anywhere (main panel, top marginal, or right marginal).
      Data: Data colors are pixel-identical to the light render — same brand green scatter points at the same alpha, same histogram fill/KDE line colors in the marginals — only the chrome (background, text, axis line) flipped as required.
      Legibility verdict: PASS — all text reads clearly on the dark surface; brand green remains vivid and distinguishable from the near-black background.
