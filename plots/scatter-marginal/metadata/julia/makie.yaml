review:
  strengths:
  - 'Correct composite marginal layout: three linked Axis panels (main scatter + top/right
    histograms) built with idiomatic Makie mosaic (`fig[row,col]`) plus `linkxaxes!`/`linkyaxes!`,
    so marginals stay perfectly aligned with the main scatter axes.'
  - 'Theme-adaptive chrome is precise: PAGE_BG/INK/INK_SOFT flip cleanly between light
    (#FAF8F1) and dark (#1A1A17), while data colors (brand green) stay identical between
    renders.'
  - 'Marker/histogram alpha matches the spec notes exactly: scatter alpha 0.65 (spec
    recommends ~0.6-0.7) and subtler 0.35-alpha marginal histograms so they don''t
    compete with the main scatter.'
  - Realistic, neutral forestry dataset (trunk diameter vs. tree height) with a genuinely
    right-skewed diameter distribution that shows up correctly in the top histogram,
    matching the code comment's intent.
  - 'Clean canvas: correct 3200x1800 landscape output, descriptive axis labels with
    units, no clipped or overlapping text in either theme.'
  weaknesses:
  - Title is attached to top_ax (fig[1,1]) which only spans the main-plot/top-marginal
    column (~78% of canvas width) — since the right-marginal column (22%) has no title
    above it, the title text visibly sits left of the canvas's true center instead
    of being centered on the full figure. Move the title to a full-width element (e.g.
    a `Label(fig[0, 1:2], title_str; ...)` row spanning both columns, or `fig[1,1:2]`
    for the title axis) so it centers on the entire 3200px canvas.
  - With n=400 points and markersize=10, the densest diagonal band (trunk diameter
    ~25-32cm) shows heavy marker overlap even with alpha=0.65 — consider markersize
    ~8 or alpha ~0.55 there to better reveal the density gradient spec calls for.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white, not dark.
      Chrome: Title "scatter-marginal · julia · makie · anyplot.ai" in bold dark ink at top (readable, but visually offset left of true canvas center since it sits only above the main+top-marginal column). Axis titles "Trunk Diameter (cm)" / "Tree Height (m)" in dark ink, tick labels in softer grey — all clearly legible. Grid lines are faint horizontal/vertical guides, subtle but visible. Top and right marginal axes have no ticks/spines (correctly hidden).
      Data: Main scatter uses brand green (#009E73) at ~0.65 alpha, clearly distinguishable against the light background and revealing density in the crowded diagonal band. Top and right marginal histograms use the same green at a lighter ~0.35 alpha, subtle and non-distracting per the spec's guidance. First (only) series is the required brand green.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black, not light.
      Chrome: Title now rendered in light/white ink, fully legible against the dark background. Axis titles and tick labels also flipped to light tones and remain clearly readable — no dark-on-dark text anywhere. Grid lines are faint but visible light-on-dark guides.
      Data: Scatter and histogram colors are identical to the light render (same brand green, same alpha levels) — only the chrome (background, text, grid) changed, as required.
      Legibility verdict: PASS
