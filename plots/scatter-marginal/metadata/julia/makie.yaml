review:
  strengths:
  - Title now spans the full canvas via Label(fig[1, 1:2]) and reads correctly centered
    on the whole 3200px canvas, cleanly fixing the attempt-1 off-center title.
  - Marker size (10→8) and scatter alpha (0.65→0.55) were trimmed exactly as requested,
    visibly reducing overplotting in the dense diagonal band while keeping the density
    gradient readable.
  - 'Idiomatic Makie composite layout: three linked Axis panels built via fig[row,col]
    mosaic with linkxaxes!/linkyaxes!, plus hidedecorations!/hidespines! fully de-chroming
    the marginal axes.'
  - Theme-adaptive chrome is precise in both renders — PAGE_BG/INK/INK_SOFT flip correctly,
    and the brand green data color is pixel-identical between light and dark.
  - Realistic, neutral forestry dataset (trunk diameter vs. tree height) with a genuinely
    right-skewed diameter distribution visible in the top marginal histogram and a
    clear positive correlation in the main scatter.
  weaknesses:
  - The densest diagonal band (trunk diameter ~25-35cm) still shows moderate marker
    overlap even at markersize=8/alpha=0.55 — a further trim (e.g. markersize~6-7)
    would sharpen the density gradient in that region.
  - Design Excellence remains minimal (single hue at two alpha levels) — a subtle
    secondary touch such as a faint trend line in the main scatter or a KDE overlay
    on the marginal histograms would raise the storytelling above the current 'clear
    but plain' composition.
