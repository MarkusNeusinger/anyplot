review:
  strengths:
  - Classic joint-plot composition — main scatter lower-left with top/right marginal
    panels precisely axis-aligned — executed cleanly in raw D3
  - KDE curves computed via Silverman's-rule bandwidth + Epanechnikov kernel, overlaid
    on binned histograms in both marginals — a distinctive, non-trivial D3-level technique
  - 'Theme-adaptive chrome correctly threaded through axis text, ticks, domain lines,
    and title on both renders; brand green #009E73 is pixel-identical across light
    and dark'
  - Deterministic seeded PRNG (mulberry32 + Box-Muller) gives fully reproducible data
    with no external dependency
  - Realistic, neutral dataset (daily sunlight exposure vs. seedling growth) with
    a clear, honest positive correlation and natural scatter
  weaknesses:
  - With n=320 points, marker alpha 0.65 and radius 4px sit above/below the VQ-03
    density guidance for 300+ points (alpha 0.3-0.5, smaller radius) — the dense cluster
    around 5-7h sunlight shows mild overplotting; slightly lower alpha or radius would
    resolve it
  - Data storytelling relies on composition alone — no trendline or correlation callout
    — sufficient for the default tier but not yet 'excellent'
  - Seedling height range (20-120 cm after 30 days) reads on the high end for a generic
    'seedling'; narrowing the range or naming a fast-growing species would tighten
    factual plausibility
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white, matches #FAF8F1, not pure white.
      Chrome: dark title "scatter-marginal · javascript · d3 · anyplot.ai" centered at top; dark axis titles "Daily Sunlight Exposure (hours)" and "Seedling Height after 30 Days (cm)"; dark-gray tick labels on both axes; thin subtle gray gridlines in the main panel; thin gray frame rects around the top and right marginal panels.
      Data: main scatter of ~320 green (#009E73) points with moderate transparency showing a clear positive linear trend with natural scatter; top panel shows a gray histogram + darker-gray KDE curve of the x-distribution (unimodal, right-leaning tail); right panel shows a rotated gray histogram + KDE curve of the y-distribution (unimodal, slightly heavy near the center).
      Legibility verdict: PASS — all text (title, axis titles, tick labels) is clearly readable against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: warm near-black, matches #1A1A17, not pure black.
      Chrome: light/off-white title and axis titles; light-gray tick labels; subtle light-gray gridlines; the same panel-frame rects now in a light-gray stroke.
      Data: identical green (#009E73) scatter points and gray histogram/KDE marginals — data colors are pixel-identical to the light render, only the chrome (background, text, grid, frame) flipped to the dark palette.
      Legibility verdict: PASS — all text is light-colored against the dark background; no dark-on-dark failures observed; brand green remains clearly visible on the dark surface.
