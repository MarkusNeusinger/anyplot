review:
  strengths:
  - Custom Epanechnikov KDE overlaid on binned histograms for both marginals, precisely
    aligned with the main scatter's x/y scales via shared domains
  - 'Clear visual hierarchy: the Imprint teal (#009E73) main scatter reads as the
    focal point while grey (inkSoft) marginal panels stay subordinate and non-distracting,
    matching the spec''s guidance'
  - Moderate point transparency (fill-opacity 0.65) reveals density in the correlated
    cluster without turning it into a solid blob
  - Realistic, plausibly-scaled dataset (daily sunlight hours vs. seedling height
    in cm) with a believable noisy-linear relationship
  - Seeded mulberry32 PRNG gives deterministic reproducibility; snippet strictly follows
    the d3 mount-node contract (ANYPLOT_SIZE, ANYPLOT_TOKENS, single svg append, no
    animation)
  weaknesses:
  - Marginal panels have no bounding chrome (no axis line/border around the histogram+KDE
    area), so the panel's own edges are only implied by whitespace — acceptable but
    slightly less crisp than giving them a subtle baseline.
  - The KDE bandwidth/kernel choice is the standard textbook Epanechnikov example
    rather than a technique that showcases something distinctively d3 beyond what's
    in common tutorials — keeps LM-02 from scoring higher.
  - In the densest diagonal band (~x:5-7, ~y:60-80) many markers visually fuse into
    a blob despite alpha blending; slightly smaller radius (e.g. r=4) in that region
    would sharpen individual-point visibility without hurting the sparse tails.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "scatter-marginal · javascript · d3 · anyplot.ai" in bold dark ink, clearly readable and well spaced above the top marginal panel. X-axis label "Daily Sunlight Exposure (hours)" and Y-axis label "Seedling Height after 30 Days (cm)" are dark, legible, appropriately sized. Tick labels along both axes are dark grey and legible. Subtle light-grey gridlines are visible but not distracting.
      Data: Main scatter uses solid Imprint teal (#009E73) circles at moderate opacity, with a thin off-white stroke separating overlapping points. Top marginal shows a grey histogram of x (sunlight) with a dark grey KDE curve overlaid, aligned to the main x-axis. Right marginal shows a grey histogram of y (height) rotated to align with the main y-axis, with its own KDE curve. No clipping observed at any canvas edge; both marginal panels' curves stay comfortably inside their allotted width/height.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title, now in light/white text, clearly readable against the dark background. Axis labels and tick labels are light-colored and legible; no dark-on-dark failures observed anywhere (tick text, axis titles, and title all correctly flip to light ink). Gridlines are still subtly visible.
      Data: Scatter points remain the identical teal (#009E73) as the light render — only chrome (background, text, grid) flipped, confirming palette-compliant theme adaptation. Marginal histograms and KDE lines flip from dark-grey-on-light to light-grey/white-on-dark appropriately, staying legible.
      Legibility verdict: PASS
