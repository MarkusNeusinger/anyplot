review:
  strengths:
  - 'Correct Imprint palette and theme-adaptive chrome in both light and dark renders
    — brand green #009E73 is identical across themes, backgrounds/text/grid are all
    theme-correct with no dark-on-dark or light-on-light failures.'
  - Marginal histograms are properly axis-aligned with the main scatter via three
    linked ECharts grids sharing pixel-consistent value ranges, exactly matching the
    spec's alignment requirement.
  - Idiomatic, well-reasoned use of a custom renderItem (api.coord + clipRectByRect)
    to draw true value-axis-aligned histogram bars — the code comment correctly explains
    why ECharts' built-in bar series cannot orient bars this way, and the solution
    is the right escape hatch rather than a workaround.
  - Deterministic, realistic commute-distance-vs-time data with a plausible positive
    correlation and unimodal marginal distributions; no auto-reject issues, no edge
    clipping in either render.
  weaknesses:
  - Moderate overplotting in the densest scatter band (roughly x=10-15km, y=25-40min)
    — with N=420 points, symbolSize=12 + opacity=0.65 merges many points into darker
    blobs that lose individual point resolution. Reduce symbolSize to ~9-10 and/or
    opacity to ~0.5-0.55 per the >300-point density guidance.
  - Design Excellence currently reads as a well-configured, spec-compliant default
    rather than a bespoke design statement — consider a subtle white/ink edge stroke
    on the scatter markers (style guide 'Data Element Styling') for definition against
    overlapping points, or slightly stronger visual contrast between the primary scatter
    and the marginal histograms to push the composition from 'good' to 'polished'.
  - Marginal histograms are plainly unimodal — DQ-01 feature coverage would benefit
    from data with a touch more shape variation (e.g. mild skew asymmetry or a secondary
    bump) to more fully demonstrate what a marginal-distribution plot can reveal,
    though the current data is already realistic and not a hard defect.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "scatter-marginal · javascript · echarts · anyplot.ai" centered at top in dark ink text, clearly readable. Axis labels "Commute Distance (km)" (x) and "Commute Time (min)" (y) are dark and legible. Tick labels are soft gray and legible. Gridlines are subtle horizontal/vertical lines that don't compete with the data.
      Data: Main scatter (lower-left grid) shows brand-green (#009E73) semi-transparent points (alpha ~0.65) forming a clear positive correlation between commute distance (0-25 km) and commute time (0-60 min). Top marginal is a muted gray histogram of the x-distribution (roughly unimodal, peak near 10-12 km), right marginal is a muted gray histogram of the y-distribution rotated 90°, both properly aligned with the main plot's axis ranges.
      Legibility verdict: PASS — all text is dark-on-light and clearly readable, no overlap or clipping observed.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Title and axis labels render in light/white text, clearly visible against the dark background — no dark-on-dark failures. Tick labels are light gray and legible. Gridlines are subtle and light-colored.
      Data: Scatter marker color is identical brand green (#009E73) to the light render — confirmed unchanged, only chrome flipped. Marginal histograms remain the same muted gray tone, still clearly visible against the near-black background without competing with the green scatter.
      Legibility verdict: PASS — all text is light-on-dark and clearly readable, no dark-on-dark or clipping issues detected.
