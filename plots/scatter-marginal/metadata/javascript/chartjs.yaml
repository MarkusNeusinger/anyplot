review:
  strengths:
  - Correctly implements a jointplot-style composite (main scatter + top/right marginal
    histograms) as three synchronized Chart.js instances with pixel-perfect axis alignment
    via shared afterFit reserve widths
  - Deterministic LCG + Box-Muller bivariate-normal data generation produces a realistic
    negative correlation (engine displacement vs. fuel economy) with domain-appropriate
    skew visible in both marginal histograms
  - '''Nice number'' axis domain calculation (Heckbert''s algorithm) plus a custom
    boundary-tick pruning hook produce clean, non-crowded tick labels on the main
    scatter'
  - 'Theme-adaptive chrome and the Imprint palette are correctly threaded through
    all three chart instances in both light and dark renders — first series is #009E73
    in both, backgrounds are theme-correct'
  - Marginal histogram styling (translucent brand-tinted fill, thin border, hidden
    ticks/grids/borders) correctly subordinates the marginals to the main scatter,
    matching the spec's guidance
  weaknesses:
  - Scatter markers use a flat fill with no edge stroke — a subtle white/pageBg edge
    (per style guide 'Data Element Styling') would improve point definition in the
    densest cluster around 2.5-3.5L displacement
  - Data storytelling is implicit in the jointplot layout alone; no visual emphasis
    (e.g., a subtle trend indicator or annotation calling out the negative correlation)
    is added to guide the viewer to the insight
  - Title occupies only ~35% of canvas width at the current 26px size — well below
    the 50-70% guideline range; a slightly larger title would improve visual balance
    without risking overflow given the short spec-id
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "scatter-marginal · javascript · chartjs · anyplot.ai" in bold dark ink, clearly legible. X-axis label "Engine Displacement (L)" and Y-axis label "Fuel Economy (mpg)" both dark and legible, with matching font sizes. Tick labels (1-7 on X, 10-50 on Y) are readable, medium-gray. Grid lines are subtle and visible without competing with data.
      Data: ~400 scatter points in brand green (#009E73) with light borderColor, moderate alpha showing a clear negative correlation. Top marginal histogram (distribution of Engine Displacement) and right marginal histogram (distribution of Fuel Economy) use a translucent brand-green fill with a slightly darker green border — both are subtle and clearly distinct from the main scatter series.
      Legibility verdict: PASS — all text is clearly readable against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Title, axis labels, and tick labels have flipped to light/white tones and are clearly legible against the dark background. Grid lines remain subtle but visible.
      Data: Scatter points and both marginal histograms use the identical brand green (#009E73) and translucent variants as the light render — no color drift between themes.
      Legibility verdict: PASS — all text is clearly readable against the dark background; no dark-on-dark failures observed (tick labels, axis titles, and title are all light-colored and distinct from the near-black background).
