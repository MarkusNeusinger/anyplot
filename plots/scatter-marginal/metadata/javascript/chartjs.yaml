review:
  strengths:
  - CSS-grid mount layout aligns the main scatter and both marginal bar charts pixel-perfectly
    by sharing fixed axis reserves (Y_AXIS_RESERVE, X_AXIS_RESERVE) and identical
    domain min/max between scatter axes and histogram axes
  - Custom afterBuildTicks hook (pruneBoundaryTicks) removes crowded boundary ticks
    that Chart.js's linear scale would otherwise force at the exact min/max — a distinctive,
    library-aware refinement
  - Marker alpha (0.65) and marginal-bar alpha (0.4) follow the spec's guidance for
    moderate transparency to reveal density without distracting from the main scatter
  - Deterministic LCG + Box-Muller bivariate data generation with a realistic negative
    correlation (engine displacement vs. fuel economy) is a plausible, neutral, real-world
    dataset
  - Theme tokens are threaded correctly through both the main chart and the (otherwise
    chrome-less) marginal charts — background, ink, and grid colors flip correctly
    between light and dark while data colors stay identical
  - 'animation: false and single-canvas-per-cell mount contract are followed correctly
    for the browser render harness'
  weaknesses:
  - Main scatter axis bounds are inherited directly from the histogram bin domain
    (min - binWidth*0.5 / max + binWidth*0.5), producing non-round outer tick labels
    ('0.9', '6.4' on X, '48.9' on Y) that look accidental rather than intentional
    on a polished chart — consider rounding the outer domain to a 'nice' number while
    keeping the histogram bins aligned inside it.
  - Design excellence is mostly carried by technical alignment rather than visual
    sophistication — the marginal bars are a single flat translucent fill with no
    additional refinement (e.g. rounded corners, subtler outline) that would elevate
    them beyond a functional default.
  - No secondary visual cue (e.g. a light regression/trend indication or annotation)
    is used to reinforce the visible negative correlation, leaving the data storytelling
    at 'clear but unassisted'.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1-consistent) across the full mount, including the marginal chart cells.
      Chrome: Bold serif title "scatter-marginal · javascript · chartjs · anyplot.ai" centered at top in dark ink; X-axis title "Engine Displacement (L)" and Y-axis title "Fuel Economy (mpg)" both dark and clearly readable; tick labels (0.9-6.4 on X, 15-48.9 on Y) in a softer dark gray, legible; grid lines are faint gray, visible but unobtrusive.
      Data: Main scatter uses semi-transparent brand green (#009E73 at ~0.65 alpha) markers showing a clear negative correlation between displacement and fuel economy; top and right marginal histograms use a lighter, more transparent version of the same green, correctly aligned with the main plot's X and Y domains respectively.
      Legibility verdict: PASS — all text is clearly readable against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17-consistent) across the full mount, matching across scatter and marginal cells.
      Chrome: Same serif title now rendered in light/white ink, fully readable; axis titles and tick labels are switched to light tones (white title, softer light-gray ticks) and read clearly against the dark background; grid lines are faint light gray, subtle but visible.
      Data: Scatter markers and marginal histogram bars are the identical brand-green hue and alpha as the light render (the change in apparent tone against the dark backdrop is the expected effect of alpha blending against a different background, not a change to the underlying color) — confirms data colors are unchanged between themes.
      Legibility verdict: PASS — no dark-on-dark failures; all title, axis, and tick text is clearly visible against the near-black background.
