      Chrome: Title and all axis titles/tick labels render in light off-white/soft-gray tones, clearly legible against the dark background. No dark-on-dark text anywhere. Grid lines remain subtle but visible.
      Data: Scatter and histogram colors are identical to the light render (#009E73 family), confirming only chrome flipped between themes.
      Legibility verdict: PASS
