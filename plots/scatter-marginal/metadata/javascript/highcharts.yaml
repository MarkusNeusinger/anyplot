review:
  strengths:
  - Genuinely elegant seaborn-jointplot-style composition built from three independently-instantiated
    Highcharts charts, with pixel-perfect axis alignment achieved via carefully matched
    marginLeft/marginRight/marginTop/marginBottom values.
  - KDE overlay computed from scratch (Silverman bandwidth) and scaled to align visually
    with the histogram bar heights — a thoughtful touch beyond the spec's minimum
    bar.
  - Restrained, theme-correct monochrome palette that keeps the marginal panels subordinate
    to the main scatter, exactly matching the spec's design guidance.
  - Realistic, well-scaled agricultural dataset with genuine noise/outliers rather
    than an artificially clean synthetic distribution.
  weaknesses:
  - 'Duplicate/conflicting header comment block: lines 1-5 of the file are immediately
    followed by a second, different header block at lines 6-10 with self-contradictory
    metadata (Quality: 85/100 vs Quality: pending, differing Library: line, added
    License: line). Remove the stale first block and keep a single header with the
    //# anyplot-orientation: square directive as the very first line.'
  - Scatter alpha (0.6) is at the top of the spec's recommended 0.6-0.7 range but
    slightly above the general 300+ point / alpha<0.5 density heuristic — consider
    ~0.5 for clearer density reading in the densest cluster region.
  - The blank top-right corner where the top and right marginal panels don't meet
    is inherent to this layout style but could be tightened slightly for marginally
    better canvas utilization.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "scatter-marginal · javascript · highcharts · anyplot.ai" is dark, bold, centered above the composite. Axis titles ("Annual Rainfall (mm)", "Crop Yield (tons/hectare)") and tick labels are dark/soft-ink, all clearly readable. Subtle horizontal gridlines on scatter and histogram panels.
      Data: Scatter points are brand green (#009E73) at ~0.6 alpha; marginal histograms use a subtle pale-green fill with a solid-green KDE spline overlay. First series confirmed #009E73.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Title, axis titles, and tick labels have flipped to light/soft tones and remain clearly legible against the dark background. No dark-on-dark failures — every text element is visibly light-colored.
      Data: Scatter, histogram fill, and KDE line colors are identical to the light render (confirmed pixel-equivalent hues) — only chrome flipped.
      Legibility verdict: PASS
