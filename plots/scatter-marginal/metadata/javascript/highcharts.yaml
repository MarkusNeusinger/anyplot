review:
  strengths:
  - Precise pixel-perfect axis alignment across the three separate Highcharts instances
    (shared marginLeft/marginRight/marginTop/marginBottom) so the top histogram, main
    scatter, and right histogram line up correctly
  - 'Correct Imprint palette: brand green #009E73 for the scatter series, subtle desaturated
    green (0.4 opacity) for the marginal histograms as the spec recommends'
  - Point transparency (alpha 0.65) matches the spec's explicit 0.6-0.7 recommendation
    exactly
  - Theme-adaptive chrome is fully correct in both renders — no dark-on-dark or light-on-light
    failures, data colors identical between themes
  - Realistic, neutral agriculture dataset (rainfall vs. crop yield) with plausible
    ranges and a believable positive correlation plus natural scatter/outliers
  weaknesses:
  - Central cluster (~700-1100mm rainfall, 3-4.5 t/ha yield) shows noticeable overplotting
    with 400 points at radius 5 / alpha 0.65 — consider a slightly smaller marker
    radius (~4) or lower alpha to better reveal density in that region
  - Visual design is functionally correct but plain (single-hue green throughout,
    plain histogram bars) — consider a KDE overlay curve on the marginals or subtle
    emphasis on outlier points for more design sophistication
  - The three-linked-chart-instance layout is a practical workaround for Highcharts'
    lack of a native joint/marginal-plot type rather than a distinctive built-in library
    feature
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1), confirmed not pure white and not dark.
      Chrome: Title "scatter-marginal · javascript · highcharts · anyplot.ai" in bold dark ink, centered above the composite; axis titles "Annual Rainfall (mm)" and "Crop Yield (tons/hectare)" and all tick labels rendered in soft dark gray-brown, all clearly readable against the light background. Grid lines are thin and subtle.
      Data: Scatter markers and both marginal histogram bars render in brand green #009E73 (marginals at reduced opacity for subtlety), consistent with the Imprint palette. Top histogram (rainfall distribution) and right histogram (yield distribution) axes align pixel-for-pixel with the main scatter's x and y axes respectively.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
