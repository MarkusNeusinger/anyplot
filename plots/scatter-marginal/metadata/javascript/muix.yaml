review:
  strengths:
  - Three-panel composite (top histogram, main scatter, right histogram) shares exact
    axis domains and matched margins, achieving precise bin-to-axis alignment across
    three separate MUI X chart instances — a real engineering solution to the library's
    lack of native joint/marginal-plot support.
  - Alpha-blended brand-green scatter points (0.65) reveal density in the 400-point
    cloud, while marginal histograms use a subdued fill (0.32) that stays out of the
    main plot's way, matching the spec's transparency and 'subtle marginal colors'
    guidance closely.
  - Deterministic seeded LCG + Box-Muller data generation produces a realistic, plausible
    rainfall-vs-crop-yield relationship with a clear positive correlation and appropriate
    agronomic scale.
  - 'Theme handling is clean: identical data colors between light and dark renders,
    both fully legible with correct #FAF8F1 / #1A1A17 backgrounds and thin page-background-colored
    strokes separating overlapping marks/bars in both themes.'
  weaknesses:
  - X-axis tick labels are dense (every 50 mm, 19 labels) and become visually crowded/small
    at the ~400px mobile thumbnail size — consider thinning the tick interval or constraining
    tick count for small viewports.
  - Design excellence is solid but not exceptional — no additional storytelling element
    (e.g. a regression/trend line, correlation coefficient annotation, or highlighted
    outlier) that would elevate the composite from 'info-complete' to 'insight-forward'.
  - 'Minor header hygiene: the file''s leading comment block appears duplicated (two
    ''// anyplot.ai'' header stacks) with the ''//# anyplot-orientation: square''
    directive sandwiched between them instead of on its own line at the very top as
    the style guide specifies — functionally harmless (the harness''s regex is multiline)
    but worth cleaning up on the next touch.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1), consistent across the title band, the two marginal-histogram panels, and the main scatter panel.
      Chrome: Bold dark title "scatter-marginal · javascript · muix · anyplot.ai" centered at top, fully visible with no clipping. Axis titles "Annual Rainfall (mm)" (x) and "Crop Yield (t/ha)" (y) in dark ink, clearly readable. Tick labels in a slightly softer dark gray, readable; x-axis ticks (350–1,250 by 50s) are numerous and a bit small/dense at mobile thumbnail size but still legible at full resolution. Grid lines are thin and subtle, visible without dominating.
      Data: Main scatter uses semi-transparent brand-green (#009E73-derived) circles with a thin off-white stroke separating overlapping points, clearly showing a positive rainfall/yield correlation with realistic scatter. Top and right marginal panels show histograms in a lighter, more transparent green, correctly binned and aligned to the main plot's x/y domains, with no axis chrome (intentionally minimal).
      Legibility verdict: PASS — no light-on-light text; all chrome elements read clearly against the off-white background.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17), consistent across title band, marginal panels, and main scatter panel.
      Chrome: Title renders in white/light text, fully visible. Axis titles and tick labels render in light ink/soft-light tones, clearly legible against the dark background — no dark-on-dark failures observed. Grid lines are subtle light gray, visible but unobtrusive.
      Data: Scatter points and marginal histogram bars use the identical brand-green hue and alpha values as the light render (only chrome — background/text/grid — flipped, as required). Density pattern and correlation read identically to the light version.
      Legibility verdict: PASS — no dark-on-dark text; brand green remains vivid and clearly distinguishable from the near-black surface in both the scatter and the marginal bars.
