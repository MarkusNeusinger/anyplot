review:
  strengths:
  - Three community MUI X charts composed in a CSS grid whose marginals copy the scatter's
    margins plus axis bands, so the top histogram spans exactly the scatter's x range
    and the right histogram exactly its y range in both renders
  - One padded domain per variable drives both the scatter axis limits and the marginal
    bins, so every marginal peak sits directly above or beside the points that cause
    it
  - The right marginal uses BarChart layout="horizontal" with a reversed band axis,
    growing sideways away from the scatter from a zero baseline at its edge
  - Marginals at fillOpacity 0.34 in brand green with page-coloured bar separators
    read as the quieter tone the Notes suggest; points at 0.62 opacity with a page-coloured
    outline show the dense centre darker
  - Title plus a smaller subtitle (n, Pearson r = 0.70, bin count) gives a clear typographic
    hierarchy; realistic rainfall-vs-crop-yield field-trial data with a deterministic
    LCG
  - 'skipAnimation on every chart, hidden marginal axes via position: "none", v9 class
    selectors (.MuiScatterChart-marker, .MuiBarChart-element) and native tooltips
    in the HTML output'
  weaknesses:
  - 'Suggestion: the vertical grid at every 50 mm (17 lines) is denser than the horizontal
    one; a coarser x tick interval would quiet the scatter panel.'
  - 'Suggestion: the y-axis title sits about 70 px left of its tick labels; a narrower
    Y_AXIS_WIDTH would tighten it to the axis.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole 2400x2400 canvas.
      Chrome: bold dark title "scatter-marginal · javascript · muix · anyplot.ai" with a smaller ink-soft subtitle "n = 400 · Pearson r = 0.70 · marginal histograms with 22 bins"; axis titles "Annual rainfall (mm)" and "Crop yield (t/ha)"; ticks 400–1,200 and 2.5–8.0, all dark and readable; subtle grey grid in both directions.
      Data: 400 brand-green #009E73 points at ~0.62 opacity with thin page-coloured outline, rising positive trend; top histogram (22 bins) in pale translucent green spans exactly the scatter's x range, peaking ~830 mm; right histogram drawn sideways from the scatter's right edge spans exactly the y range, peaking ~5 t/ha, with an empty bin near 2.7 and a lone bottom bin matching the two low outliers. Empty top-right corner.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, subtitle, axis titles and tick labels in light ink, all readable; no dark-on-dark text; grid lines subtle grey but visible.
      Data: identical brand-green points and the same translucent green marginals (darker-looking on the dark surface, still clearly distinct from the background); same layout and alignment as the light render.
      Legibility verdict: PASS
