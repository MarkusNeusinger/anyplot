review:
  strengths:
  - Correctly builds a spec-compliant marginal-plot layout in MUI X (which has no
    native jointplot) via a CSS grid with margin-synced BarChart/ScatterChart instances,
    so the top and right histogram bins align pixel-for-pixel with the main scatter's
    axes.
  - Alpha values (0.65 main scatter, 0.32 marginals) directly follow the spec's own
    guidance ('moderate transparency alpha ~0.6-0.7' and 'subtle colors for marginal
    distributions') rather than generic defaults.
  - Theme-adaptive chrome is fully correct in both renders — identical brand-green
    data color, warm cream/near-black backgrounds, readable ink tokens for title/axis/tick
    text.
  - Deterministic data generation via a seeded LCG + Box-Muller Gaussian, producing
    a realistic positive rainfall-yield correlation with natural noise and a few outliers.
  - Title format, axis labels with units, and single-series legend omission all match
    spec exactly.
  weaknesses:
  - 'The densest central scatter cluster (~700-900mm rainfall, 4.5-6.5 t/ha yield)
    blends into a solid blob where individual points are hard to distinguish — add
    a subtle white/ink marker stroke (style guide: ''white edge for definition, especially
    with overlapping points'') while keeping alpha in the 0.6-0.7 range, or slightly
    reduce markerSize.'
  - Design Excellence is thoughtful but monochromatic and could push toward 'publication-ready'
    with one more refinement, e.g. a thin outline on the marginal histogram bars or
    a slightly more deliberate spacing/typography detail beyond the current alpha-only
    hierarchy.
  - 'LM-02: the margin-synced multi-chart composition is a genuine MUI X-specific
    technique, but leans on manual layout math rather than a built-in analytical feature
    (e.g. a valueFormatter or reference line marking the trend) that would showcase
    more of MUI X''s own API surface.'
  - 'CQ-01: several small helper functions (LCG RNG, Gaussian, domainPad, histogram,
    withAlpha) are justified by the composite layout''s needs, but add more structure
    than a minimal flat script — consider inlining the simplest ones (e.g. withAlpha)
    if it doesn''t hurt readability.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Title "scatter-marginal · javascript · muix · anyplot.ai" is bold dark ink, centered top, fully readable. Axis labels "Annual Rainfall (mm)" (x) and "Crop Yield (t/ha)" (y) are dark ink and readable. Tick labels on the main scatter (both axes) are medium-gray and readable. Marginal histogram panels (top, right) have their own tick/axis text hidden by design (sx hides MuiChartsAxis-root), relying on the main scatter's ticks for reference — no orphaned unreadable text. Subtle light-gray horizontal+vertical grid on the main scatter only.
      Data: Main scatter markers render in brand green (#009E73) at alpha ~0.65, clearly visible against the cream background; the densest central region (rainfall 700-900mm, yield 4.5-6.5 t/ha) forms a solid darker-green blob where individual points overlap heavily. Marginal histograms (top = rainfall distribution, right = yield distribution) render in the same green at a lower alpha (~0.32), correctly kept subtle relative to the main scatter.
      Legibility verdict: PASS — all text readable, no dark-on-light or light-on-light failures.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Title is light/cream colored, centered top, fully readable against the dark background. Axis labels and tick labels are light-gray/off-white and clearly legible. Grid lines on the main scatter are faint light lines, still visible but subtle. No dark-on-dark text anywhere — all chrome correctly flipped to light-on-dark.
      Data: Data colors are visually identical to the light render — same brand-green markers at the same alpha for both the main scatter and the two marginal histograms, confirming only chrome (not data color) changed between themes.
      Legibility verdict: PASS — no dark-on-dark failures; all text and data elements clearly visible.
