review:
  strengths:
  - 'Composes three community MUI X charts (ScatterChart plus a vertical and a layout="horizontal"
    BarChart with a reversed band axis) into a joint plot, with hidden marginal axes
    via position: "none"'
  - 'Scatter density is readable: 400 points at alpha 0.62 with a thin page-colored
    outline, so the dense core reads darker'
  - Marginals in the points' own color at a quieter 0.34 opacity rise from a zero
    baseline at the scatter edge; the right marginal grows away from the scatter
  - Plausible agronomy scenario (rainfall 390-1,230 mm vs. yield 2.5-8 t/ha) with
    r = 0.70; seeded LCG generator is deterministic
  - Theme chrome fully threaded through tokens; both renders readable
  weaknesses:
  - 'SC-02 (both): the marginal histograms are compressed relative to the scatter
    axes. The top histogram spans about CSS 140-939 px while the scatter''s x drawing
    area spans about 100-979 px (about 40 px short on each side, about 9 % narrower),
    and the right histogram is likewise about 37 px short at its top and bottom, so
    the edge bins sit up to half a bin away from the points that fill them → each
    marginal''s drawing area spans exactly the scatter''s axis range (0 px offset
    at both ends). Likely cause: the BarChart band axis does not share the scatter''s
    drawing area (hidden axes or band scale still reserve/pad space); draw the marginals
    on a linear axis with the same min/max as the scatter (e.g. a step-area LineChart)
    or zero out the hidden axes'' height/width.'
  - 'Suggestion: a KDE curve over the histograms would show the marginal shape more
    smoothly.'
  image_description: |-
