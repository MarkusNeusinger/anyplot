review:
  strengths:
  - Domain-based multi-axis layout anchors each marginal to the scatter's own axis,
    so histogram peaks sit exactly above and beside the points causing them
  - Marginals at opacity 0.45 in the brand color stay quieter than the 0.65-alpha
    points, keeping the scatter the main panel in both themes
  - Marginal axes are stripped of ticks, lines and zero lines, and panel gaps are
    kept narrow
  - Per-trace hovertemplates show point values and bin counts in the interactive HTML
  - Canvas exactly 3200x1800 with library reference font sizes; all chrome from theme
    tokens
  weaknesses:
  - 'Suggestion: plotly express offers the same composite natively via px.scatter(df,
    x=TEMPERATURE, y=HUMIDITY, marginal_x="histogram", marginal_y="histogram"), which
    would shorten the plot block.'
  - 'Suggestion: the band between the title and the top marginal is wide; a slightly
    smaller top margin would give the panels more room.'
