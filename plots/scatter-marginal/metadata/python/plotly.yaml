      Data: About 200 #009E73 points at alpha 0.65 with thin page-colored outlines, showing a moderate positive correlation; top histogram of temperature (peak near 20-21 °C) and sideways right histogram of humidity (peak near 49-50 %), both in a lighter translucent green, rising from zero baselines at the scatter's edges with narrow gaps; empty top-right corner
