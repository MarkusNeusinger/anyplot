review:
  strengths:
  - Shared axis limits derived from df keep both marginals aligned with the scatter,
    so histogram peaks sit above and beside the point clusters
  - coord_flip draws the right marginal sideways, growing away from the scatter
  - Composition with | and / plus & theme(figure_size=(16, 9)) yields the exact 3200x1800
    canvas
  - Theme tokens threaded through every element; both renders readable
  weaknesses:
  - 'VQ-05, SC-02 (both): the top marginal takes about half the figure height and
    the right marginal about half the width, so the scatter is no larger than the
    marginals and the gaps between panels are wide (C1, C3) → scatter at roughly 75-80
    % of width and height, marginals about 20 %. Likely cause: the composition uses
    equal default widths/heights; set plot_layout(widths=[4, 1], heights=[1, 4]) or
    equivalent.'
  - 'Suggestion: a quieter marginal tone (the scatter green at lower alpha) would
    keep the scatter the main panel.'
