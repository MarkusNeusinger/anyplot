review:
  strengths:
  - Marginals read their margins from the scatter's rendered plot box, so the histogram
    bars sit flush with the scatter's axes and peaks line up with the point clouds
    that cause them
  - Correct 3200x1800 canvas with a theme-correct composite in both renders
  - Concrete wind-turbine power-curve scenario with labelled units; right-skewed wind
    marginal and bimodal power marginal
  - Marginals in a quiet INK_MUTED tone so the green scatter stays the main panel
  - HTML output keeps pygal's native SVG tooltips for each observation
  weaknesses:
  - 'VQ-05 (both): the y-axis tick labels mix two sizes: the major ticks 0, 1000 and
    2000 render at 44 px while 200…2200 render at 56 px, so the round values read
    smaller than their neighbours → one size for all y ticks (major = 56 px, +12 px).
    Likely cause: Style label_font_size=56 with major_label_font_size=44.'
  - 'SC-02 (both): the scatter points render fully opaque #009E73 with no blending
    where they overlap around 4–6 m/s, so dense regions do not read darker as the
    Notes (alpha ~0.6–0.7) and the translucency bullet ask → fill opacity about 0.6.
    Likely cause: Style opacity=0.6 does not reach the dots in render_to_png; give
    the series an rgba color (rgba(0,158,115,0.6)) or set the dot fill-opacity through
    css.'
  - 'CQ-01 (code): four helper functions (nice_range, style, plot_box, font) split
    a linear script → plain statements: the bin limits computed inline, one Style
    per panel, the font loaded once. Likely cause: helpers kept from a refactor.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole 3200x1800 composite.
      Chrome: bold dark title 'Wind Turbine Output · scatter-marginal · python · pygal · anyplot.ai' centred at the top; axis titles 'Wind speed (m/s)' and 'Power output (kW)' and the tick labels in dark ink; dotted guides subtle; summary card (n = 220, r = 0.95, mean 789 kW) in the top-right corner on an elevated surface. The y ticks 0, 1000 and 2000 render smaller than the others.
      Data: 220 opaque #009E73 points rising along an S-shaped power curve from 2 to 18 m/s and 0 to ~2080 kW; gray top histogram (peak at ~5 m/s, long right tail) and a sideways right histogram (peaks near 0 kW and near 1800-2000 kW), both aligned with the scatter axes.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, axis titles and tick labels in light ink, all readable; guides subtle; summary card on #242420 with light text. No dark-on-dark text.
      Data: identical #009E73 points and the same layout; marginal bars in the dark INK_MUTED gray.
      Legibility verdict: PASS
