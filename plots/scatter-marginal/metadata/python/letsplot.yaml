review:
  strengths:
  - 'Both marginals share the scatter''s data-derived limits and line up with its
    axes: the x histogram peak at 10.5 sits over the densest column of points and
    the y tick 10 of the right marginal is level with the scatter''s'
  - Histogram plus density overlay computed by lets-plot itself (geom_histogram with
    the ..density.. variable, geom_density), the right marginal turned sideways with
    coord_flip
  - Theme tokens (PAGE_BG, INK, INK_SOFT) thread through every subplot and the empty
    corner panel, so all text is readable in both renders
  - 'Clean adaptable structure: column constants with role comments, a Data block
    that binds df, explicit imports, correct 3200x1800 canvas at ggsize(800, 450)
    and scale 4'
  weaknesses:
  - 'VQ-07 (both): a 24 px pure-white #FFFFFF frame runs around the whole canvas,
    glaring on the dark render, and in the light render the density layer''s default
    fill shows light grey (#E8E6E0) patches between bars and curve → page color #FAF8F1
    / #1A1A17 to the canvas edge and no untokenized fill. Likely cause: the ggbunch
    result keeps its default white plot background (no theme(plot_background=element_rect(fill=PAGE_BG,
    color=PAGE_BG)) on the bunch), and geom_density has no fill set.'
  - 'VQ-05 (both): the title is drawn between the top marginal and the scatter, opening
    a gap of about 100 px that separates the x distribution from its panel → title
    above the whole composite, top marginal directly on the scatter (a gap of a few
    px). Likely cause: labs(title=TITLE) on main_scatter inside ggbunch.'
  - 'SC-02 (both): C3 missed: the density curves are drawn in bright Imprint purple
    #C475FD at size 1.2, louder than the green points, so the marginals compete with
    the scatter → the points'' own green or a quieter tone. Likely cause: geom_density(color=ACCENT,
    size=1.2).'
  - 'VQ-06, DQ-02 (both): axis titles ''Measurement A'' / ''Measurement B'' name no
    real quantity and carry no units → two named, plausibly correlated quantities
    with units. Likely cause: the X_VALUE / Y_VALUE constants.'
  - 'DE-01, DE-02 (both): every panel is boxed on four sides and the grid is drawn
    in solid INK_SOFT → left and bottom spines only (or none) and a grid at 10-15
    % opacity. Likely cause: the panel border kept from the theme plus panel_grid_major=element_line(color=INK_SOFT).'
  - 'Suggestion: lets-plot''s native ggmarginal(''tr'', layer=geom_histogram(...))
    would build the aligned marginals and keep the title on top without the hand-tuned
    plot_margin offsets.'
  image_description: |-
