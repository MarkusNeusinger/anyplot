review:
  strengths:
  - Both marginals share the scatter's data-derived limits (x_lim, y_lim), so the
    x histogram peak near 10.5 sits over the densest column of points and the right
    marginal's y ticks line up with the scatter's
  - Histogram plus density overlay computed by lets-plot itself (geom_histogram with
    the ..density.. variable, geom_density), right marginal turned sideways with coord_flip
  - Marginals in the points' own green at lower weight (alpha 0.5 bars, thin curve),
    keeping the scatter the main panel
  - Theme tokens thread through every subplot, the corner panel and the ggbunch background,
    so the page color reaches the canvas edge and all text is readable in both renders
  weaknesses:
  - 'DE-02 (both): all three panels are boxed on four sides by a dark frame, short
    of the style guide''s spine rule → left and bottom axis lines only on the scatter
    (or none), no frame on the marginals. Likely cause: panel_background=element_rect(fill=PAGE_BG)
    without color=PAGE_BG keeps the default border despite panel_border=element_blank().'
  - 'Suggestion: lets-plot''s native ggmarginal(''tr'', layer=geom_histogram(...))
    would build the aligned marginals without the hand-tuned plot_margin offsets.'
  - 'Suggestion: hiding the right marginal''s repeated y tick labels would close the
    gap between it and the scatter.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 to the canvas edge, no white frame.
      Chrome: title 'scatter-marginal · python · letsplot · anyplot.ai' in dark ink at the top left above the whole composite; axis titles 'Drug dose (mg)' / 'Plasma response (mmol/L)' and ticks 4-16 in soft ink; top marginal shows density ticks 0 / 0.2; grid subtle at 15 % ink; each panel boxed by a dark four-sided frame. All text readable.
      Data: 200 #009E73 points at alpha 0.65 with a clear positive correlation and a few outliers; top marginal: green histogram (alpha 0.5, page-colored bar outlines) with a green density curve; right marginal the same turned sideways growing right; both aligned with the scatter's axes; empty top-right corner.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17 to the canvas edge.
      Chrome: title, axis titles and ticks in light ink, all readable; no dark-on-dark text; grid subtle; same four-sided grey panel frames.
      Data: identical #009E73 points and curves; histogram bars read as deeper green on the dark page.
      Legibility verdict: PASS
