review:
  strengths:
  - Uses seaborn's figure-level sns.jointplot with ratio=5 and space=0.15, so the
    scatter is the dominant lower-left panel and both marginals share their axes with
    it exactly; peaks in the top and right marginals sit directly above and beside
    the dense point cloud
  - Marginals layer a histogram and a KDE curve through marginal_kws (histplot kde=True),
    with the bars at alpha 0.45 as the quieter tone the Notes suggest and the KDE
    line in full brand green; the right marginal is drawn sideways and grows away
    from the scatter
  - 'Theme tokens are threaded through sns.set_theme rc and tick_params, so both renders
    are fully legible: dark text on #FAF8F1 and light text on #1A1A17, with the brand
    green #009E73 identical in both'
  - Points at alpha 0.65 and s=60 with a page-colored hairline edge keep 200 observations
    readable where they overlap, and the hairline bar edges separate the 25 histogram
    bins
  - Plausible, neutral scenario (daily study time vs exam score, positive correlation,
    scores capped below 100) with deterministic seed and the column constants doubling
    as reader-facing axis titles
  weaknesses:
  - 'Suggestion: the marginals'' own tick marks (long ''ticks''-style marks on the
    top marginal''s bottom spine and the right marginal''s left spine) repeat the
    joint''s ticks inside the narrow panel gap; shortening or hiding them would tidy
    the gap.'
  - 'Suggestion: the bivariate story could gain emphasis, e.g. a stronger hierarchy
    between the histogram bars and the KDE line in the dark render, where the bars
    read quite dim.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole 2400x2400 square canvas.
      Chrome: title "scatter-marginal · python · seaborn · anyplot.ai" centered at top (~65% width) in near-black; axis titles "Daily study time (min)" and "Exam score (points)" in dark ink; tick labels 10-90 and 20-100 in INK_SOFT grey; subtle grid on both axes; only left/bottom spines on the joint panel. All readable.
      Data: 200 translucent #009E73 circles with thin page-colored edges, positively correlated; top marginal: light-green histogram (25 bins) with a brand-green KDE line; right marginal: same, drawn sideways; small gap between panels; empty top-right corner.
      Legibility verdict: PASS

