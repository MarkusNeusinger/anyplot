  - Theme tokens threaded through every panel; both renders fully readable
  weaknesses:
  - 'VQ-05 (both): 1 px seam lines (clearest in dark) in a light color cross the whole
    canvas between the panels (a vertical line at x ~ 2595 px top to bottom and a
    horizontal line at y ~ 430 px across the full width, plus an outline at the top
    of the corner cell) → no lines between panels; every pixel of the canvas in PAGE_BG.
    Likely cause: sub-pixel gaps in the column/row layout expose the HTML page''s
    default white background; set the document/page background to PAGE_BG (for example
    a styles background on the layout or a gridplot with merged borders).'
  - 'CQ-01 (code): a style_axes() helper function (lines 58-70) in a script that should
    be flat, and the scatter''s y-axis styling is then repeated by hand (lines 87-91)
    → inline the styling per panel or loop over the axes without defining a function.
    Likely cause: the helper only accepts one axis.'
  - 'Suggestion: a light KDE outline over each histogram would show the distribution
    shape more smoothly.'
