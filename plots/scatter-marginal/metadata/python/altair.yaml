review:
  strengths:
  - Marginal histograms are computed in the encoding (bin=alt.Bin(maxbins=25), count())
    and share the scatter's scale domains, so peaks sit above and beside the points
    that cause them
  - vconcat/hconcat composition with 4 px spacing keeps the scatter the dominant lower-left
    panel with sideways right marginal
  - 'Correct theme threading: chrome flips via INK/INK_SOFT tokens while #009E73 data
    stays identical in both renders'
  - Exact 3200x1800 canvas via the pad-only step; HTML output carries typed tooltips
  weaknesses:
  - 'VQ-05 (both): histogram bars spill past their panels - the first top-marginal
    bin starts about 15 px left of the y-axis, and the right marginal''s first and
    last bars extend about 25 px above and 10 px below the scatter''s frame, because
    bin edges fall outside the padded domain → keep every bar inside its panel (0
    px overflow). Likely cause: bin=alt.Bin(maxbins=25) bins extend beyond scale domain
    [min-2, max+2] without clip=True on mark_bar (or bin extent set to the domain).'
  - 'VQ-06, DQ-02 (both): axis titles read ''X value (units)'' and ''Y value (units)'',
    placeholder names with a placeholder unit and no real-world context → name two
    real correlated measurements with their units (e.g. ''Height (cm)'' / ''Weight
    (kg)''). Likely cause: the X_VALUE / Y_VALUE constants.'
  - 'Suggestion: the 0.5-opacity histogram bars read muddy on the dark surface; a
    slightly higher opacity would keep them distinct from the background.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, canvas 3200x1800.
      Chrome: title 'scatter-marginal · python · altair · anyplot.ai' bold dark ink, centred; axis titles 'X value (units)' / 'Y value (units)' bold dark; tick labels 20-95 and 30-90 in dark soft ink; subtle 10% grid; thin frames around the three panels.
      Data: ~150 #009E73 points at 0.65 opacity in the large lower-left panel showing a positive correlation; top histogram (25 max bins) and sideways right histogram in #009E73 at 0.5 opacity, no axes, rising from the scatter's edges. The first top bin pokes left of the y-axis and the right marginal's end bars extend above/below the scatter frame.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, axis titles and tick labels in light ink, all readable; grid subtle; panel frames light grey. No dark-on-dark text.
      Data: identical #009E73 points and marginals as in the light render; the 0.5-opacity bars read as a darker green on the dark surface but remain visible. Same bar overflow at the panel edges.
      Legibility verdict: PASS
