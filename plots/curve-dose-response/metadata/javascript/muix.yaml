review:
  strengths:
  - 'All Notes features present and correct: log10 concentration axis, two 4PL fits
    with SEM error bars, EC50 drop-lines meeting the curve at the true half-maximal
    response (50 % for Osimertinib, 46 % halfway between 5 % and 86 % for Gefitinib),
    dashed top/bottom asymptotes at the fitted plateaus, and pointwise 95 % CI bands
    from a t-scaled delta-method covariance'
  - SI-prefixed concentration ticks (1 nM … 100 µM) derived from the column unit make
    the log axis read naturally for pharmacologists
  - 'Idiomatic MUI X v9 composition: ChartsContainer + ScatterPlot + ChartsGrid +
    ChartsXAxis/ChartsYAxis with a custom SVG layer driven by useXScale/useYScale/useDrawingArea,
    log scaleType with tickInterval and valueFormatter, axis bands sized with height/width,
    skipAnimation set'
  - 'Theme-adaptive chrome via ANYPLOT_TOKENS: ink/inkSoft text, dashed grid from
    the grid token, EC50 badges and hollow EC50 markers knocked out with pageBg so
    they read on both surfaces'
  - Asymptote lines drawn thin and translucent so they stay subordinate to the curves
    and points, with direct color-matched plateau labels
  - Legend entries carry each compound's fitted EC50, so potency comparison reads
    straight off the legend
  weaknesses:
  - 'VQ-03 (both): the 95 % CI bands are only about 2–6 px wide, roughly the curve''s
    3 px stroke, so the Osimertinib band is invisible and the Gefitinib band reads
    as a faint halo rather than a band enclosing the curve → a band clearly wider
    than the curve stroke on at least one compound (about 10 px or more across the
    slope). Likely cause: the example data sits almost exactly on the 4PL (tiny residuals
    give a tiny s²); generate responses with realistic residual scatter of a few percent
    around the fit.'
  - 'DQ-02 (both): the compounds carry real drug names, Osimertinib and Gefitinib,
    with invented EC50 values (100 nM, 782 nM) that readers may take as reference
    potencies → clearly fictional but specific compound codes (e.g. ''EGFR inhibitor
    KX-207'', ''KX-311''). Likely cause: the COMPOUND values in the data block.'
  - 'Suggestion: the subtitle is assembled from the raw column constants (''2 Compounds
    · Response (%) ± Response SEM (%)''); a phrase written for the reader would read
    more naturally.'
  - 'Suggestion: add <ChartsTooltip /> to the composition so the HTML view shows concentration
    and response on hover.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole canvas, no white plot panel.
      Chrome: bold title "curve-dose-response · javascript · muix · anyplot.ai" centered (~34 % of width), grey subtitle below; y-axis "Response (%)" with ticks -10…110, x-axis "Concentration (M)" with log ticks 1 nM, 10 nM, 100 nM, 1 µM, 10 µM, 100 µM; dashed horizontal grid subtle; all text dark on cream and readable.
      Data: Osimertinib in brand green #009E73 (first series), Gefitinib in Imprint purple; filled points with capped SEM error bars, smooth 4PL sigmoids, faint translucent CI bands (barely wider than the stroke), dashed top/bottom asymptotes at 98 %/3 % (green) and 86 %/5 % (purple) with color-matched labels, dashed EC50 drop-lines meeting the curves at hollow markers (100 nM at 50 %, 782 nM at 46 %) with "EC₅₀ (50%)" / "EC₅₀ (46%)" badges; HTML legend below with line+band+dot glyphs and EC50 values.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, subtitle, axis titles and tick labels in light ink, all readable; grid dashes subtle dark grey; no dark-on-dark text.
      Data: identical green and purple data colors, positions, bands and reference lines as the light render; only chrome flipped; EC50 badge knockouts use the dark page color. Brand green stays clearly visible.
      Legibility verdict: PASS
