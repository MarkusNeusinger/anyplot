review:
  strengths:
  - Composes the chart from ChartsContainer + ScatterPlot + ChartsXAxis/ChartsYAxis
    and draws the fitted curves, CI bands, asymptotes and EC50 drop-lines in a custom
    overlay that reads useXScale/useYScale/useDrawingArea, so every mark sits exactly
    in the axis coordinate system
  - Native log x axis (scaleType 'log') with tickInterval at every decade and a valueFormatter
    that writes 10⁻⁹…10⁻⁴ as true powers of ten
  - The 4PL fit falls out of the data (coordinate-descent least squares), and the
    pointwise 95% CI band comes from the Jacobian covariance with a t critical value,
    drawn for both compounds at fillOpacity 0.18 so curves, points and reference lines
    stay visible through it
  - EC50 drop-lines meet each curve at its own half-maximal response (50% for Osimertinib,
    46% for Gefitinib, halfway between each curve's fitted plateaus), marked with
    a hollow page-colored dot
  - Legend entries carry the fitted EC50 with an automatic SI prefix (100 nM vs 782
    nM), so the potency comparison reads straight from the legend; the glyph combines
    band, line and marker like the marks it explains
  - Asymptote lines are thin, dashed and at 55% opacity, subordinate to curves and
    points, with their Top/Bottom labels placed so the two compounds' labels never
    collide
  - Theme tokens drive all chrome; light and dark renders are both fully legible with
    identical data colors
  weaknesses:
  - 'VQ-01 (both): the x tick labels'' superscript exponents (⁻⁹ … ⁻⁴) render at roughly
    9 px, well below the 14 px tick font, and blur in the 400 px thumbnail → exponents
    at about 12–13 px (+3 to +4 px). Likely cause: Unicode superscript glyphs inside
    a 14 px tickLabelStyle; raise the x tickLabelStyle fontSize to about 18 px or
    format the ticks as ''1 nM'', ''10 nM'', … with the SI prefixes the code already
    has.'
  - 'Suggestion: use MUI X''s native ChartsLegend (inside ChartsDataProvider/ChartsWrapper)
    for the series legend instead of the hand-built HTML legend row; the scatter series
    already carry their labels.'
  - 'Suggestion: the subtitle repeats the raw column constants (''across 2 Compounds
    · Response (%) ± Response SEM (%)''); a phrasing such as ''Mean response ± SEM,
    4PL fit with 95% CI'' would read more naturally.'
  - 'Suggestion: the y axis padding runs to −10 %, a value no response reaches; clamping
    the lower limit nearer 0 would give the curves slightly more height.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white, matches #FAF8F1; no white panel.
      Chrome: bold title "curve-dose-response · javascript · muix · anyplot.ai" centered (~67% of width), soft-ink subtitle below; y axis "Response (%)" with ticks −10…110, x axis "Concentration (M)" on a log scale with ticks 10⁻⁹…10⁻⁴; subtle dashed horizontal grid; HTML legend row at the bottom. All text dark on light and readable; the superscript exponents of the x ticks are small.
      Data: Osimertinib in brand green #009E73, Gefitinib in lavender #C475FD. Each compound shows 10 points with SEM error bars and caps, a smooth fitted 4PL sigmoid, a thin translucent 95% CI band (most visible on Gefitinib's upper plateau), dashed top/bottom asymptote lines labelled "Top 98%", "Top 86%", "Bottom 5%", "Bottom 3%", and dashed EC50 horizontal + vertical drop-lines meeting the curve at a hollow dot (green at 10⁻⁷ / 50%, purple at ~7.8×10⁻⁷ / 46%) with "EC₅₀ (50%)" / "EC₅₀ (46%)" labels. Legend: "Osimertinib (EC₅₀ = 100 nM) · 95% CI", "Gefitinib (EC₅₀ = 782 nM) · 95% CI".
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black, matches #1A1A17.
      Chrome: title, subtitle, axis titles, tick labels and legend text flip to light ink and are clearly readable; grid dashed and subtle; axis lines light. No dark-on-dark text.
      Data: identical green #009E73 and lavender #C475FD marks, curves, bands, asymptotes and EC50 lines as in the light render; the CI bands read as a darker translucent halo; brand green stays clearly visible.
      Legibility verdict: PASS
