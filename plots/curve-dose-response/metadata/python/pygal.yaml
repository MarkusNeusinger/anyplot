review:
  strengths:
  - Genuine 4PL curve fitting via scipy.optimize.curve_fit with real EC50/Hill parameters
    surfaced directly in the legend
  - EC50 crosshair reference lines (dashed vertical + horizontal) correctly intersect
    both curves at their half-maximal response
  - 95% CI computed via covariance-based Monte Carlo sampling (multivariate_normal
    over the fit covariance) and rendered color-coded to Compound A
  - 'Correct Imprint palette usage: brand green first series, lavender second, fully
    identical data colors across light/dark renders'
  - Custom x_value_formatter converts log10 concentration to human-readable pM/nM/uM
    units for axis ticks and interactive tooltips
  - Error bars (SEM) with stems and end caps drawn for every data point across both
    compounds
  - All font sizes explicitly set via the Style object; both renders are cleanly legible
    with theme-correct chrome and no edge clipping
  weaknesses:
  - 95% CI is drawn as two dashed boundary lines rather than a filled translucent
    band; a filled area (pygal fill/rgba polygon) would read more immediately as a
    confidence band
  - Fitted-curve legend labels ('Compound A EC₅₀=1.0e-07 M, Hill=1.6') are long and
    dense across 3 legend columns; a shorter label with EC50/Hill as a small in-plot
    annotation would give the legend more breathing room
  - Asymptote lines are intentionally very subtle and share one generic 'Asymptotes'
    legend entry; a small in-plot 'Top/Bottom' tick label would make the two flanking
    values easier to read at a glance without hunting the legend
