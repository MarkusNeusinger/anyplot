review:
  strengths:
  - Fermion arrows follow the particle/antiparticle convention with unbroken flow
    through both fermion vertices
  - 'Line styles distinguish the particle types by shape alone: solid arrowed fermions,
    dashed boson, curly looped gluon'
  - Native lets-plot arrow() on geom_segment and geom_label with rounded, theme-matched
    elevated boxes for the italic particle symbols
  - layer_tooltips on vertices and fermion lines give hover detail in the HTML export
  - Theme tokens thread through all chrome; both renders fill the full canvas with
    the page color
  weaknesses:
  - 'VQ-02 (both): the gluon key swatch''s left end touches the top corner of the
    e⁻ label box → clear it by a few px. Likely cause: leg_x0=0.09 / leg_top - 3*leg_dy
    against the e⁻ label at y=v1y+ext+0.02.'
  - 'VQ-05 (both): particle labels at geom_label size 22 (≈ 62 pt) and key text at
    geom_text size 10 (≈ 28 pt) dwarf the 16 pt title → annotation sizes about 8 and
    5 (the library prompt''s 3–5 mm range for annotations). Likely cause: geom_label(size=22),
    geom_text(size=10).'
  - 'SC-01 (both): the Z* propagator is drawn at size 3.8 against the fermions'' 2.5
    as an emphasized key mediator, a highlighted line the basic variant excludes →
    same width as the other propagators (−1.3). Likely cause: geom_segment(data=boson_df,
    size=3.8).'
  - 'SC-04 (both): the line-style key lists Photon (γ) although no photon line appears
    in the diagram → key only the styles drawn. Likely cause: the leg_photon layer
    and its ''Photon (γ)'' leg_text entry.'
  - 'DQ-03 (both): Z*, a vector boson, is drawn in the dashed style the Notes reserve
    for scalar bosons → wavy line for the Z* propagator. Likely cause: boson_df drawn
    with linetype=''dashed''.'
  - 'Suggestion: a subtle frame or a little more spacing between the key rows would
    separate the key from the diagram.'
