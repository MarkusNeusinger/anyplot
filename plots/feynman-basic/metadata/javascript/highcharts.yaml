review:
  strengths:
  - 'Physics-accurate arrow conventions: the fermion arrowheads correctly flip for
    antiparticles (positron, antimuon) so the matter-flow arrow points opposite the
    geometric leg direction, matching the standard Feynman-diagram convention rather
    than just drawing a generic arrow.'
  - Idiomatic use of the Highcharts SVG renderer for a diagram type with no native
    series — parametric sine-wave path for the wavy photon propagator, custom arrowhead
    geometry, and axes repurposed purely as a hidden data-to-pixel coordinate system
    (per the library's own guidance for cases with no built-in series match).
  - 'Theme-adaptive chrome is fully correct in both renders: vertex dots use t.ink
    (black on light, white on dark), title/axis-title text uses ink/inkSoft tokens,
    background is transparent, and the first categorical color is the canonical Imprint
    green (#009E73) with positions used in canonical order.'
  - Clean, deterministic, single-purpose script with no unused imports, no fake interactivity,
    and a clever empty-data-series-for-legend trick to label the custom-drawn lines
    without duplicating real series data.
  weaknesses:
  - Missing 2 of the 4 mandated particle line styles. The specification's Notes explicitly
    require distinct styles for fermions (solid/straight + arrow), photons (wavy),
    gluons (curly/looped), and scalar bosons (dashed), but this implementation only
    draws fermion and photon lines — no gluon or scalar-boson propagator appears anywhere.
    Every sibling implementation of this exact spec-id (matplotlib.py, d3.js, echarts.js,
    chartjs.js) extends the diagram with a second vertex pair (e.g. two curly gluon
    lines feeding a vertex, then a dashed scalar-boson line to a second vertex, e.g.
    gg -> H -> b bbar) specifically to demonstrate all four line styles. Add an equivalent
    second vertex/propagator group here so all four particle types from the spec are
    represented.
  - The diagram sits at the low end of the spec's suggested size ('2-6 vertices, 3-10
    propagators') with only 2 vertices and 5 propagators, leaving a large amount of
    unused canvas to the right of the legend and above/below the diagram. Adding the
    missing gluon/boson vertex pair (previous point) would naturally fill that space
    and bring vertex/propagator counts into the middle of the suggested range.
  - Electron/positron and muon/antimuon are drawn in two different palette colors
    (green vs. blue) even though both are 'fermion' type — a reasonable generation-distinguishing
    choice, but it means palette[2] is already spent on a second fermion color, so
    once gluon and scalar-boson lines are added they will need their own distinct
    colors (e.g. palette[3]/[4]) rather than reusing palette[2].
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1-like), not pure white, not dark. Correct.
      Chrome: Title "feynman-basic · javascript · highcharts · anyplot.ai" is bold dark text, clearly visible at top-center. "time →" axis label is dark-gray/ink-soft text below the diagram, readable. Legend at right ("Electron / positron (fermion)", "Photon (γ, wavy)", "Muon / antimuon (fermion)") uses soft dark text on the light background, readable. Particle labels (e-, e+, γ, μ-, μ+) are bold and colored to match their line, all legible against the cream background.
      Data: First series (electron/positron fermion lines) is the canonical Imprint brand green (#009E73). Photon propagator is lavender (#C475FD), muon/antimuon fermion lines are blue (#4467A3) — canonical palette positions 1/2/3 in order. Vertex dots are solid black (ink token on light theme). Arrowheads on fermion lines are correctly oriented per Feynman-diagram convention (forward for particles, reversed for antiparticles).
      Legibility verdict: PASS — all text is clearly readable against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17-like), not pure black, not light. Correct.
      Chrome: Title, "time →" label, legend text, and particle labels all render in light/soft-light tones and remain clearly legible against the dark background — no dark-on-dark failures observed.
      Data: Data colors (green, lavender, blue) are visually identical to the light render — only the vertex dots flip from solid black to a light/near-white fill (ink token on dark theme), which is the expected chrome-only flip.
      Legibility verdict: PASS — all text and diagram elements are clearly readable against the dark background; no dark-on-dark or invisible-element issues.

    Both renders pass the theme-readability check. However, the diagram itself only demonstrates 2 of the 4 particle line styles required by the specification (fermion + photon; no gluon or scalar-boson propagator is drawn in either render) — see Weaknesses.
