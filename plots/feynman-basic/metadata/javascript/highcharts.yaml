review:
  strengths:
  - Custom SVG renderer used correctly to draw genuine wavy photon and curly gluon
    paths (parametric sine/cosine math via chart.renderer.path), going well beyond
    built-in Highcharts series types — the right escape hatch for a plot type with
    no native series.
  - 'Correct physics convention: fermion arrowheads encode particle-vs-antiparticle
    time-flow direction (forward/backward angle reversal), and all four required line
    styles (straight+arrow, wavy, curly, dashed) are present exactly as the spec''s
    Notes section requires.'
  - 'Imprint palette used in canonical order (positions 1-5), first series brand green
    #009E73; color is reinforced by distinct line style per particle type, giving
    CVD-safe redundant encoding.'
  - 'Theme-adaptive chrome throughout: vertex dots flip from black (t.ink light) to
    white (t.ink dark), title/legend/axis-title colors correctly threaded from tokens
    — both renders fully legible with no dark-on-dark or light-on-light failures.'
  - 'Clean, minimal composition: axes fully hidden (lineWidth 0, no ticks/gridlines),
    generous whitespace, legend cleanly grouped by particle family, no chartjunk.'
  weaknesses:
  - The two independent physics processes (e- e+ -> gamma -> mu- mu+, and g g -> H
    -> b b-bar) are juxtaposed on one canvas with no visual separator or sub-caption,
    which risks reading as a single continuous six-vertex diagram rather than two
    distinct textbook examples — consider a subtle vertical divider/rule or two small
    process captions to disambiguate.
  - Legend entry 'Electron / positron / b-quark (fermion)' groups three physically
    distinct particles under one green swatch; correct per the spec's type-based line-style
    convention, but a first-time viewer may not immediately connect green to the b-quark
    leg on the far right without reading the legend carefully.
  - Helper-function structure (toPx/straightPath/wavyPath/curlyPath/arrowPath) is
    heavier than the typical KISS single-block script, though justified here by the
    custom-curve math needed for photon/gluon geometry.
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white, consistent with #FAF8F1, not pure white.
      Chrome: title "feynman-basic · javascript · highcharts · anyplot.ai" in dark ink, bold, top-center, fully readable. Legend on the right lists five particle types with colored swatches, legend text in soft dark gray, fully readable. "time →" caption at bottom center in soft dark gray, fully readable. Vertex dots are solid black (theme ink).
      Data: two Feynman diagrams side by side. Left diagram: e- (top-left, green straight line with forward arrow) and e+ (bottom-left, green straight line with backward arrow) meet at a vertex, connect via a wavy purple/lavender photon (γ) line to a second vertex, which splits into mu- and mu+ (blue straight lines with arrows). Right diagram: two curly ochre/orange gluon (g) lines meet at a vertex, connect via a red dashed Higgs (H) line to a second vertex, which splits into b and b-bar (green straight lines with arrows, reusing the fermion color). First categorical series (fermion color) is #009E73 green, matching the Imprint palette rule.
      Legibility verdict: PASS — all title, legend, and inline particle-label text is clearly readable against the light background; no light-on-light text found.

    Dark render (plot-dark.png):
      Background: warm near-black, consistent with #1A1A17, not pure black.
      Chrome: title in light ink (near-white), fully readable. Legend text in light gray, fully readable. "time →" caption in light gray, fully readable. Vertex dots flip to solid white (theme ink), correctly theme-adaptive.
      Data: identical geometry and identical data colors to the light render — green fermion lines, lavender/purple photon, blue muon lines, ochre gluon lines, red dashed Higgs line. Only the chrome (background, vertex-dot fill, title/legend/caption ink) flips; the five categorical data colors are unchanged between renders, satisfying the Imprint palette identity rule.
      Legibility verdict: PASS — no dark-on-dark text found; all chrome elements correctly use the dark-theme ink tokens.
