review:
  strengths:
  - Genuinely custom, hand-drawn Feynman diagram (sine-wave photon path, coiled-bezier
    gluon path, auto-oriented SVG arrow markers) built on ChartContainer's useXScale/useYScale
    hooks — the documented community escape hatch for chart types MUI X has no built-in
    primitive for
  - 'Real, physically accurate QED process (e⁻ e⁺ annihilation → virtual photon →
    μ⁻ μ⁺ pair) with correct arrow conventions: particle flow forward in time, antiparticle
    flow backward'
  - Style key cleanly demonstrates all four spec line-style conventions (fermion,
    photon, gluon, scalar boson) even though the live process only needs two
  - Perfect Imprint palette compliance and theme-adaptive chrome — vertex dots use
    t.ink so they correctly flip black-on-cream (light) to white-on-near-black (dark),
    and all text/backgrounds are theme-correct in both renders
  - Clean, deterministic, explicitly-sized code with no fake interactivity and no
    wasted imports
  weaknesses:
  - Live propagators only exercise 2 of the 4 particle-line conventions (fermion,
    photon); gluon and scalar-boson styles are shown only in the static legend, not
    as an actual propagator in the depicted process
  - Vertical whitespace between the subtitle and the diagram's topmost elements is
    noticeably more generous than the spacing elsewhere in the layout — tightening
    it slightly would improve rhythm
  - Library usage leans almost entirely on the useXScale/useYScale scale hooks rather
    than any of MUI X's higher-level chart-composition surface (ChartsLegend, axis
    components, tooltip) — understandable for a diagram spec, but keeps distinctive-feature
    usage narrow
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Title "feynman-basic · javascript · muix · anyplot.ai" in bold dark ink, subtitle "Electron-positron annihilation -> virtual photon -> muon pair (QED)" in softer dark gray below it, both clearly readable. Vertex dots are solid black, correctly contrasting the light background. Bottom caption and style-key labels are legible soft-gray text.
      Data: Two fermion lines (e-, e+) in Imprint green (#009E73) enter vertex 1 from the left with mid-line arrowheads; a purple (#C475FD) wavy propagator (gamma*) connects vertex 1 to vertex 2; two more green fermion lines (mu-, mu+) exit vertex 2 to the right, also with arrowheads. First data series is confirmed #009E73. Style key at the bottom shows all four line conventions (fermion/photon/gluon/boson) in their respective Imprint colors.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Same title and subtitle now rendered in light/off-white ink, fully readable against the dark background. Vertex dots flip to white/near-white fill, correctly contrasting the dark background (no dark-on-dark). Style key and caption text are light gray, legible.
      Data: Fermion lines are still #009E73 green and the photon propagator is still #C475FD purple — identical to the light render, confirming only chrome (background, text, vertex-dot fill) flipped between themes.
      Legibility verdict: PASS
