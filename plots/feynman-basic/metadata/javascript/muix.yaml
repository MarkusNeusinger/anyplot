review:
  strengths:
  - 'Composes the diagram from MUI X building blocks the idiomatic way: an empty-series
    ChartsContainer supplies linear x/y scales, and useXScale/useYScale map the schematic
    vertex coordinates to pixels, so the custom SVG layer stays inside the MUI X composition
    API'
  - 'All particle conventions are correct: the e⁻ and μ⁻ arrows point forward in time
    and the e⁺ and μ⁺ arrows point backward, so the fermion flow runs unbroken through
    both vertices; the photon is a clean sinusoid that starts and ends exactly on
    the vertex dots'
  - Particle labels are bold and drawn in the color of their own line (e⁻/e⁺/μ⁻/μ⁺
    in brand green next to the outer line ends, γ* above the wave), which ties each
    symbol to its propagator at a glance
  - Symmetric s-channel layout of e⁺e⁻ → γ* → μ⁺μ⁻ with a labeled time arrow and a
    four-style key (solid arrowed, wavy, curly, dashed), all chrome threaded through
    the ink/inkSoft tokens so both themes read cleanly
  weaknesses:
  - 'Suggestion: the key spreads its four entries across the full canvas width, about
    475 px apart; grouping them closer together under the diagram would read more
    clearly as one key.'
  - 'Suggestion: the scalar-boson key swatch ends in a short dash fragment; a dash
    pattern that divides the 60 px swatch evenly would end it cleanly.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the full 3200x1800 canvas, no axes, ticks or grid (permitted for a schematic diagram).
      Chrome: bold dark title "feynman-basic · javascript · muix · anyplot.ai" centered at the top (~30% of width); a thin inkSoft time arrow running left to right under the diagram labeled "time"; a four-entry line-style key along the bottom (green arrowed solid "Fermion (e⁻, q, …)", purple wave "Photon (γ)", blue loops "Gluon (g)", ochre dashed "Scalar boson (H)"), all text dark and readable.
      Data: s-channel e⁺e⁻ → μ⁺μ⁻. Four green (#009E73) fermion lines with filled arrowheads at their midpoints: e⁻ (top left) points into the left vertex, e⁺ (bottom left) points away from it (antiparticle), μ⁻ (top right) points out, μ⁺ (bottom right) points back into the right vertex. A purple wavy photon line labeled γ* joins two near-black vertex dots. Bold particle labels in their line color sit at the outer line ends.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title in light ink, time arrow and its label and the key labels in light inkSoft; no dark-on-dark text anywhere.
      Data: line colors identical to the light render (green fermions, purple photon, blue and ochre key swatches); vertex dots flip to off-white ink and stay clearly visible; arrowheads and particle labels identical.
      Legibility verdict: PASS
