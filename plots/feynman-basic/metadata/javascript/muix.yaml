review:
  strengths:
  - Each propagator drawn in its particle's line style (straight arrowed fermions,
    wavy photon) with labels coloured to match their line type
  - 'Fermion arrows follow the convention: e- and mu- forward, e+ and mu+ backward,
    so the flow runs unbroken through both vertices'
  - Vertex dots use the ink token and flip correctly between themes; Imprint palette
    identical in both renders
  - 'Idiomatic MUI X composition: custom SVG inside ChartsContainer positioned via
    useXScale/useYScale with hidden axes'
  - Four-style line key (fermion, photon, gluon, scalar boson) drawn with true miniature
    swatches
  weaknesses:
  - 'SC-01 (both): the subtitle ''e⁻ + e⁺ → γ* → μ⁻ + μ⁺ · 2 interaction vertices,
    5 propagators'' (a reaction formula plus counts) and the footer note explaining
    the arrow convention are layers the -basic spec excludes (''no ... callouts, formulas'')
    → remove both. Likely cause: the subtitle and FOOTER_NOTE <text> elements.'
  - 'VQ-03 (both): fermion arrowheads are 11 CSS px on a 4.5 px stroke and barely
    stand out from the line, so the particle/antiparticle direction is hard to read,
    especially in the 400 px thumbnail → about 18-22 CSS px (+7 to +11 px). Likely
    cause: arrow-fermion marker markerWidth/markerHeight=11.'
  - 'Suggestion: tighten the empty band between the time arrow and the line-style
    key so the key reads as part of the diagram.'
