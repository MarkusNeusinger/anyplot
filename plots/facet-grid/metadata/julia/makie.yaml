review:
  strengths:
  - Idiomatic Makie GridLayout-based facet construction with Box+Label strip headers
    mimicking ggplot2's facet_grid style, plus linkxaxes!/linkyaxes! for correctly
    shared axis scales across all six facets
  - 'Theme-adaptive chrome verified pixel-exact: page background #1A1A17 (dark) /
    #FAF8F1 (light), elevated strip background #242420 correctly bounded to only the
    facet rows (no bleed into title/xlabel rows), brand green #009E73 identical across
    both themes'
  - 'Clean, realistic synthetic data: species x sex bill-measurement patterns mirror
    real Palmer Penguins sexual dimorphism, 150 points per facet (900 total) — well
    within the spec''s 100-5000 range'
  - No edge clipping in either render (verified programmatically), exact 3200x1800
    canvas, no text/element overlap across the 6-panel grid
  weaknesses:
  - All four spines (top/right/left/bottom) are drawn at the same INK_SOFT weight
    on every one of the 6 facets, producing a fairly heavy grid-of-boxes look — consider
    hiding top/right spines on interior facets (or lightening them) for a more refined,
    less cluttered ggplot2-style facet_grid appearance
  - Tick label size (12pt) across 6 dense subplots may become hard to read when the
    PNG is scaled down to the ~400px mobile thumbnail — consider bumping xticklabelsize/yticklabelsize
    slightly or thinning the tick count per facet
  - Visual hierarchy beyond the title + strip headers is minimal — consider a subtle
    emphasis cue (e.g. per-facet sample-size annotation, or a slightly bolder shared-trend
    highlight) to give the grid more of a storytelling focal point
  - Marker size (8px) at alpha=0.6 is workable for ~150 points/facet but slightly
    small given the layout's small subplot cells — a modest bump (e.g. 9-10px) would
    improve visibility without meaningfully worsening overplotting
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — confirmed not pure white.
      Chrome: Title "facet-grid · julia · makie · anyplot.ai" centered at top in dark ink, clearly
        readable. Column strip headers (Adelie / Chinstrap / Gentoo) sit in light "elevated"
        boxes above each column with dark, readable text. Row strip headers (Female / Male)
        appear as rotated text in light boxes along the right edge, also readable. Axis labels
        "Bill Length (mm)" (bottom, shared) and "Bill Depth (mm)" (left, shared, rotated) are
        dark and legible. Tick labels are a slightly softer ink tone, legible at full resolution.
      Data: All 6 facets show a scatter of penguin-like bill measurements in the anyplot brand
        green (#009E73), with alpha blending handling the ~150-point overlap per facet cleanly.
        Grid lines are faint but visible.
      Legibility verdict: PASS — no light-on-light text observed anywhere.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — confirmed via pixel sampling
        (RGB 26,26,23), not pure black.
      Chrome: Title, column-strip labels, and row-strip labels all render in light ink against
        dark "elevated" strip boxes (sampled at RGB 36,36,32, correctly bounded to only the
        facet-row band — no bleed into the title or xlabel rows). Axis labels and tick labels
        are clearly visible against the dark background. No dark-on-dark failures found.
      Data: Scatter points are the same brand green (#009E73) as the light render — confirmed
        identical data color across themes; only chrome (backgrounds, strip fills, text ink)
        flips between themes.
      Legibility verdict: PASS — no dark-on-dark text observed anywhere; edge-clipping check
        (top/bottom/left/right border pixel scan) found zero non-background pixels touching
        the canvas border in either render.
