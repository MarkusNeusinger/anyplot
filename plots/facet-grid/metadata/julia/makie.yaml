review:
  strengths:
  - Idiomatic Makie small-multiples via the grid layout system (fig[row, col]), with
    linkxaxes!/linkyaxes! sharing scales across all six facets as the spec requires
  - Custom facet strip labels (Box + Label) for both row (sex) and column (species)
    variables, giving a polished ggplot-style facet header/sidebar
  - Per-facet n= annotations placed with space=:relative, useful context without cluttering
    the plot
  - 'Correct theme-adaptive chrome: PAGE_BG/ELEVATED_BG/INK/INK_SOFT tokens flip correctly
    between light (#FAF8F1) and dark (#1A1A17), while the brand green #009E73 data
    color stays identical across both'
  - 'Sensible data-density handling: markersize=10 with alpha=0.6 for ~150 points
    per facet avoids overplotting without hiding the pattern (e.g. Gentoo''s visibly
    separate cluster, male vs. female offset)'
  - Redundant inner tick/axis decorations correctly hidden on non-edge facets (hideydecorations!/hidexdecorations!)
    keeping the grid clean
  weaknesses:
  - In a couple of facets (e.g. Chinstrap · Female) the topmost data points sit close
    to the "n=150" annotation in the corner — not overlapping, but tight enough to
    consider nudging the annotation position or reducing corner padding for extra
    breathing room
  - Design storytelling is mostly a byproduct of the shared-scale grid itself; a subtle
    guide (e.g. a faint reference line or annotation calling out the Gentoo species'
    distinct cluster) could sharpen the takeaway further
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 across the full canvas and all six facet panels.
      Chrome: Title "facet-grid · julia · makie · anyplot.ai" is dark, centered, and fully visible. Column strip labels (Adelie/Chinstrap/Gentoo) sit on a slightly elevated cream box above the top row. Row strip labels (Female/Male) sit on a matching elevated box rotated -90° on the right edge. Axis titles "Bill Length (mm)" / "Bill Depth (mm)" and tick labels are dark/soft-dark and clearly legible. Grid lines are faint but visible.
      Data: All markers are the brand green #009E73 with alpha blending for overplotting; consistent across all six facets. Per-facet "n=150" annotations are small and unobtrusive.
      Legibility verdict: PASS — every text element reads cleanly against the light background.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 across canvas and panels.
      Chrome: Title, strip labels, and axis text all render in light ink and are clearly visible against the dark background. Facet strip boxes use a subtly lighter elevated dark tone, giving just enough contrast to read as a distinct panel without looking like a bright interruption. Grid lines are faint but present.
      Data: Marker color is identical #009E73 green to the light render — confirms data colors are theme-invariant.
      Legibility verdict: PASS — no dark-on-dark failures; all text remains legible.
