review:
  strengths:
  - Idiomatic use of ECharts' low-level multi-grid API (grid/xAxis/yAxis arrays) to
    build a true 2x3 small-multiples layout, which is exactly how ECharts implements
    faceting since it has no native FacetGrid primitive.
  - Shared axis scales are enforced correctly (fixed X_MIN/X_MAX and Y_MIN/Y_MAX across
    all six panels) and redundant tick labels are suppressed on interior facets (axisLabel.show
    only on the bottom row / left column), matching the spec's 'subplots share the
    same axes scales' requirement.
  - Facet strip labels (species across columns, sex down rows via rotated text) and
    shared external axis titles are cleanly implemented via the `graphic` overlay
    with subtle badge backgrounds, avoiding per-facet label repetition.
  - Realistic, plausible synthetic data (Palmer-Penguins-style bill length vs. body
    mass, split by species and sex) with genuine between-facet variation in both location
    and spread — Gentoo penguins are visibly larger/heavier, satisfying DQ-01 feature
    coverage.
  - 'Correct Imprint palette usage (first series = #009E73) and correct theme-adaptive
    chrome — both renders pass the theme-readability check with no dark-on-dark or
    light-on-light failures.'
  - Marker size (9px) and opacity (0.75) are well tuned for ~60 points per facet,
    keeping overlapping points distinguishable without excessive occlusion.
  weaknesses:
  - The row facet labels ('Female'/'Male') sit close to the right canvas edge (~48
    CSS px of margin) — not clipped in this render, but a slightly larger right margin
    (e.g. gridRight=1520 instead of 1540) would give more safety margin against future
    tweaks.
  - Facet strip label badges (species/sex chips) are flat single-color backgrounds
    with no subtle border/shadow — a small refinement opportunity for extra visual
    polish, though not required.
  - No explicit visual emphasis (e.g., callout or highlight) draws attention to the
    most notable pattern (Gentoo's distinctly larger size) — the facet layout itself
    communicates it, but an intentional focal point would push data storytelling further.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "Penguin Measurements · facet-grid · javascript · echarts · anyplot.ai" is centered at top in dark ink, clearly legible. Column facet strip labels ("Adelie", "Chinstrap", "Gentoo") sit as small dark-text badges above each column; row facet labels ("Female", "Male") appear as rotated dark-text badges to the right of each row. Shared axis titles "Bill Length (mm)" (bottom, centered) and "Body Mass (g)" (left, rotated) are dark and readable. Tick labels are shown only on the bottom row (x-axis) and left column (y-axis) to avoid repetition, all in a soft dark-gray ink color against the light background. Grid lines are light gray, subtle but visible.
      Data: All six facets show green (#009E73) scatter points at consistent opacity/size. Adelie and Chinstrap clusters sit at lower body mass, Gentoo clusters visibly shift up and right (larger bill, heavier mass), and male facets sit slightly higher/right than female facets within each species — showing genuine cross-facet variation.
      Legibility verdict: PASS — all title, facet-strip, axis-title, and tick text is clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title, facet strip labels, and shared axis titles as the light render, now rendered in light/white text with dark badge backgrounds behind the strip labels for contrast. Tick labels and grid lines are light gray on the dark background, subtle but legible. No element appears washed out.
      Data: Scatter point color is identical #009E73 green in every facet, matching the light render exactly — confirms data colors are theme-invariant.
      Legibility verdict: PASS — all text (title, strip labels, axis titles, ticks) is clearly readable light-on-dark; no dark-on-dark failures observed anywhere in the six panels.
