review:
  strengths:
  - Shared x/y domains are computed once from all 270 records and passed to every
    panel's axis config, so a position means the same value in each of the six panels
  - Uses the MUI X v9 composition API (ChartsContainer + ScatterPlot + ChartsGrid
    + ChartsXAxis/ChartsYAxis) per panel, with valueFormatter blanking tick labels
    on inner panels while keeping tick marks aligned
  - Column strips (Species) on top and rotated row strips (Sex) on the right, on elevatedBg
    with theme-token borders, read cleanly in both themes
  - Markers in brand green at 80% alpha with a page-colored outline keep overlapping
    points distinguishable
  - Realistic penguin bill measurements with species and sex shifts that the shared
    scales make directly comparable
  weaknesses:
  - 'CQ-04 (code): lines 80-85 write out category de-duplication with a loop and Array.includes
    (6 lines) → `const colFacets = [...new Set(data.map((d) => d[SPECIES]))]` and
    the same for SEX (2 lines), as the library prompt prescribes. Likely cause: hand-rolled
    order-preserving unique.'
  - 'Suggestion: add <ChartsTooltip /> to each panel so the HTML view shows the exact
    bill length/depth on hover.'
  - 'Suggestion: the header still reads ''muix 7.29.1'' while the code targets the
    pinned v9 API; the review rewrite replaces it, but the template header from the
    library prompt would avoid the mismatch.'
