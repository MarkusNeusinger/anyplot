review:
  strengths:
  - 'Uses the MUI X v9 composition API idiomatically: one ChartsContainer per facet
    with ScatterPlot, ChartsGrid, ChartsXAxis and ChartsYAxis composed inside, and
    shared min/max on every panel''s axes so a position means the same value in all
    six panels'
  - Facet labels are styled strips (column headers for Species, rotated row headers
    for Sex) on the elevated surface token, readable in both themes, with outer-only
    tick labels via axis valueFormatter as the shared-scale convention allows
  - 'Marker fill #009E73 at CC alpha with a page-colored outline keeps the 45-point
    clusters legible without hiding overlapping points; identical data color in light
    and dark'
  - Realistic Palmer-Penguins-like data (270 points, species and sex means close to
    the real dataset) generated deterministically with a seeded LCG and Box-Muller;
    the shared domain is derived from the data rather than typed
  - A subtitle line names the variables, the facet dimensions and n, which gives a
    clear typographic hierarchy under the mandated title
  weaknesses:
  - 'CQ-03 (code): `import * as React from "react"` is never referenced; the harness
    bundles with esbuild `jsx: "automatic"`, so JSX needs no React binding → remove
    the import (−1 line). Likely cause: classic-runtime JSX habit.'
  - 'Suggestion: the top-row panels and the inner-column panels still reserve the
    34 px x-axis band and 44 px y-axis band for blank tick labels, which leaves an
    empty strip under the top row; shrinking the axis height/width for non-outer panels
    would tighten the grid.'
  - 'Suggestion: the mandated title at 22 px fills only about a third of the width;
    a slightly larger title would give the header more presence.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole 3200x1800 canvas; panels are framed by thin grid-colored rounded borders.
      Chrome: bold dark title "facet-grid · javascript · muix · anyplot.ai" centered at top with a soft-ink subtitle ("Bill length (mm) vs Bill depth (mm) · faceted by Species (3) × Sex (2), n = 270"). Column header strips "Species: Adelie / Chinstrap / Gentoo" and rotated row strips "Sex: Female / Sex: Male" on the slightly lighter elevated surface, dark bold text. Shared y-axis title "Bill depth (mm)" rotated at left, x-axis title "Bill length (mm)" centered at bottom. Tick labels (14–20 on y, 35–55 on x) only on the outer panels, dark gray and readable; subtle gray grid in every panel.
      Data: 2x3 grid of scatter panels, ~45 points each, all in brand green #009E73 with slight transparency and a page-colored outline. Clusters move right/up as expected: Adelie short bills, Chinstrap long/deep, Gentoo long/shallow; males shifted larger than females. All panels share identical x (≈33–59) and y (≈12–21.5) ranges.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17; panel borders and strips on a slightly lighter elevated dark surface.
      Chrome: title, subtitle, strip labels, axis titles and tick labels all flip to light ink and are clearly readable; no dark-on-dark text. Grid lines are subtle gray and visible.
      Data: identical #009E73 markers and positions to the light render; the outline now uses the dark page color. Brand green reads well on the dark surface.
      Legibility verdict: PASS
