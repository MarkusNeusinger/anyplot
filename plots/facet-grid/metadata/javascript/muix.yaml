review:
  strengths:
  - Custom facet-grid composition built manually via ChartContainer + ScatterPlot
    + selective axes, achieving a true 2x3 small-multiples grid that MUI X has no
    built-in component for — a genuinely distinctive engineering pattern.
  - Shared X/Y domain (X_DOMAIN/Y_DOMAIN) applied identically across all six panels
    for direct visual comparison, matching the spec's 'subplots share the same axes
    scales by default' requirement precisely.
  - Deterministic LCG + Box-Muller data generation (seed 42) is clean and reproducible;
    per-group bill length/depth stats plausibly mirror real Palmer Penguins species/sex
    clusters.
  - Theme-adaptive chrome (title, axis labels, tick labels, strip label backgrounds,
    grid stroke) all pull from window.ANYPLOT_TOKENS; both renders are fully legible
    with an identical brand-green data color.
  - Row/column strip labels with elevated background boxes clearly identify each facet's
    category, satisfying the spec's facet-labeling requirement.
  weaknesses:
  - Scatter markers render at full opacity with no edge stroke; in denser clusters
    (e.g. Adelie facet, Gentoo-male facet) overlapping points visually merge into
    solid blobs, obscuring individual data points. Per the style guide's data-density
    heuristic (30-100 pts/facet here), apply alpha ~0.75-0.85 and/or a subtle white/ink
    edge stroke on the scatter markers for definition.
  - Tick label fontSize is 12 (CSS px), slightly below the muix guideline's 14-16px
    target for axis text — a defensible tradeoff given 6 panels, but could be nudged
    up 1-2px if panel width still fits the digits.
  - Visual style beyond the grid layout itself is minimal — a single flat green hue
    with no alpha/emphasis variation — so Design Excellence reads as a well-configured
    default rather than distinctly polished.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1), consistent across the full canvas including the row/column facet-strip bands, which use a slightly lighter elevated tone to set them apart from the plot area.
      Chrome: Title "facet-grid · javascript · muix · anyplot.ai" in bold dark ink, centered, fully visible, not clipped. Column strip labels (Adelie, Chinstrap, Gentoo) and row strip labels (Female, Male, rotated 90°) render in dark ink, clearly legible. Axis titles "Bill Length (mm)" (bottom, shared) and "Bill Depth (mm)" (left, shared, rotated) are dark and readable. Per-panel tick labels are small but legible dark text. Grid lines are thin and subtle, visible without competing with data.
      Data: All six panels use the identical brand green (#009E73) for scatter points — no color variation, consistent with a single-series faceted plot. Markers are moderately sized dots; in denser clusters, points overlap and partially fuse due to full opacity and no edge stroke.
      Legibility verdict: PASS (all title/axis/tick/strip text is clearly readable against the light background; no light-on-light text found).

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17), consistent across the canvas and facet-strip bands (which use a slightly lighter dark elevated tone).
      Chrome: Title, column strip labels, row strip labels, and both axis titles render in light/near-white ink, fully legible against the dark background. Per-panel tick labels are light-colored and readable, matching the light render's contrast level. Grid lines are subtle, light-toned at low opacity.
      Data: Scatter points remain the identical brand green (#009E73) as the light render — confirmed same hue and clustering pattern in every facet, only the chrome inverted.
      Legibility verdict: PASS (no dark-on-dark text found; all title, axis, tick, and strip labels are clearly visible light-on-dark).
