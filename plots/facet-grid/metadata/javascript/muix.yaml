review:
  strengths:
  - Faithful facet_grid-style layout (column strip labels on top, row strip labels
    on right, axis ticks shown only on the left column / bottom row) despite MUI X
    having no native faceting component — built from composed ChartContainer instances.
  - Shared axis domain (X_DOMAIN / Y_DOMAIN computed across all facets) so every panel
    renders on the same scale, satisfying the spec's 'shared axes by default' requirement
    and enabling direct visual comparison.
  - Deterministic seeded LCG + Box-Muller transform generates reproducible Palmer-Penguins-like
    data entirely in-browser (no seeded Math.random available).
  - Correct Imprint brand green (#009E73) with alpha 0.8 and a thin page-background
    stroke on markers for definition in the denser clusters — identical data color
    across both themes.
  - Theme-adaptive chrome (ANYPLOT_TOKENS) threaded consistently through strip backgrounds,
    ink colors, and grid lines — both light and dark renders are fully readable and
    correctly themed.
  weaknesses:
  - In the densest facets (Adelie, Chinstrap, Gentoo-Male clusters) points overlap
    noticeably; slightly lower alpha (~0.65-0.7) or a smaller marker size would improve
    separation without sacrificing visibility.
  - At the ~400px mobile scale the six-panel grid's tick labels and rotated row-strip
    labels ('Female'/'Male') shrink close to the edge of comfortable legibility —
    consider marginally larger tick/strip font sizes.
  - KISS structure carries several helper functions (hexToRgba, makeLcg, gaussianSample,
    StripLabel) — reasonable given the React/faceting requirements, but slightly more
    structure than a minimal script.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1-like), not pure white — matches spec.
      Chrome: Title "facet-grid · javascript · muix · anyplot.ai" centered at top in bold dark ink, clearly readable. Column strip labels (Adelie, Chinstrap, Gentoo) sit in light elevated boxes above each column. Row strip labels (Female, Male) sit rotated 90deg in elevated boxes on the far right. Y-axis label "Bill Depth (mm)" rotated on the far left; x-axis label "Bill Length (mm)" centered at the bottom. Tick labels only appear on the left column (y-axis) and bottom row (x-axis) of the 2x3 grid, per faceted-grid convention. Subtle light grid lines are visible but unobtrusive in every panel.
      Data: All six facets use the same brand green (#009E73-family) scatter markers with a thin light stroke for separation in denser clusters. Point clusters differ visibly by facet (e.g., Gentoo panels sit at lower bill-depth values than Adelie/Chinstrap), showing real variation across facets.
      Legibility verdict: PASS — all text (title, strip labels, axis labels, tick labels) is clearly readable against the light background.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17-like), not pure black — matches spec.
      Chrome: Same layout as the light render. Title and axis labels render in light ink (near-white), strip label boxes use a slightly elevated dark gray fill with light text, tick labels are light gray and clearly visible against the dark background. Grid lines are subtle light-on-dark and still visible without competing with the data.
      Data: Scatter markers are the identical brand green as the light render — confirmed unchanged across themes; only the chrome (background, text, strip boxes, grid) flipped as expected.
      Legibility verdict: PASS — no dark-on-dark issues found; all title/label/tick text is clearly legible against the dark background, and the brand green remains highly visible on the dark surface.
