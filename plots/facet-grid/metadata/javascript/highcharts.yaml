review:
  strengths:
  - 'Idiomatic, distinctive Highcharts core technique: per-cell axis pairs positioned
    via percentage rects, mirroring the library''s own "small multiples" demo'
  - Shared axis scales across all cells with only the bottom row / left column showing
    ticks and lines — clean, uncluttered faceting
  - Realistic, neutral crop-yield dataset with clearly differentiated, factually plausible
    soil/fertilizer effects visible across all 6 facets
  - Theme-adaptive chrome and Imprint palette are both fully correct and identical
    in data color across light/dark renders
  weaknesses:
  - 'Marker symbols differ across facet cells purely due to unset marker.symbol (Highcharts''
    default per-series symbol cycling: circle -> diamond -> square -> triangle ->
    triangle-down -> circle) — since all cells represent the same variable/plot type,
    this shape variation carries no data meaning and looks unintentional. Set marker:
    { symbol: ''circle'', ... } explicitly on every series so all 6 cells render the
    same mark shape.'
  - Tick labels shrink to near-illegibility at the ~400px mobile thumbnail because
    6 cells share the 1600px mount width — consider a modest bump in facet tick-label
    fontsize (e.g. 13px to 14-15px) to buy a bit more mobile margin.
  - Design storytelling is currently limited to the raw scatter — consider a subtle
    shared regression/trend line per facet (in a muted tone) to make the rainfall-to-yield
    relationship pop as the focal insight rather than requiring the viewer to infer
    it.
  image_description: |-
