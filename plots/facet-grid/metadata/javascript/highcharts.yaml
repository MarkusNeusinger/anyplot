review:
  strengths:
  - Manually engineered facet-grid layout (percentage-positioned axis pairs + custom
    SVG-rendered strip labels) faithfully replicates ggplot2's facet_grid within Highcharts'
    core-only bundle constraint — a genuinely distinctive, hard-to-replicate technique.
  - All 6 facets share identical X/Y axis scales (global min/max), satisfying the
    spec's 'shared axes scales by default' requirement.
  - Per-facet least-squares trend line gives each panel a clear analytical focal point,
    turning six raw scatters into a visible rainfall-to-yield relationship comparison
    across soil x fertilizer combinations.
  - Realistic, neutral agricultural dataset (crop yield vs. rainfall by soil type
    and fertilizer) with sensible ranges and visibly different slopes/intercepts across
    facets.
  - Deterministic seeded PRNG (mulberry32 + Box-Muller) — fully reproducible.
  - Theme-adaptive chrome correctly threaded through every axis, label, and strip;
    brand green (#009E73) held identical across both light and dark renders.
  weaknesses:
  - 'Shared ''Rainfall (mm)'' x-axis title (drawn once via chart.renderer.text at
    the horizontal center of the whole grid) lands directly on top of the Organic
    x Sandy-Soil facet''s own axis line and tick marks in BOTH themes. Fix: increase
    the vertical offset (''chart.plotTop + chart.plotHeight + 55'' -> larger value,
    e.g. +75) so the shared title clears all bottom-row tick labels, or give each
    bottom-row facet its own xAxis.title instead of one shared renderer.text label.'
  - 'Header block is missing the mandatory ''// License: Highcharts — commercial license,
    free for non-commercial use (highcharts.com/license)'' line required by prompts/library/highcharts.md
    — restore it so the commercial-license notice ships with the snippet.'
  - Title 'facet-grid · javascript · highcharts · anyplot.ai' fills only ~30% of canvas
    width at the current fontsize, below the typical 50-70% target for a title this
    length — could grow slightly for stronger visual presence (minor, not a legibility
    fault).
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Title "facet-grid · javascript · highcharts · anyplot.ai" in bold dark ink, clearly visible top-center. Column strip labels ("No Fertilizer", "Organic", "Synthetic") sit above the top row in bold dark text; row strip labels ("Clay Soil", "Sandy Soil") are rotated -90° on the right edge, fully visible with comfortable margin (no clipping). Shared axis titles "Rainfall (mm)" (bottom-center) and "Yield (tons/hectare)" (left, rotated) are readable dark-ink text on the light background. Tick labels (0/2/4/6/8 on Y; 0/400/800/1200 on X, bottom row only) are legible medium-gray text. Horizontal gridlines are subtle.
      Data: 2x3 grid of scatter panels, all points in brand green (#009E73), each panel also has a dashed gray least-squares trend line. All 6 panels share the same X (0-1200mm) and Y (2-8 t/ha) scale, so slopes/intercepts are directly comparable across panels — yield clearly rises with rainfall in every facet, and rises further moving left-to-right (more fertilizer) and top-to-bottom (sandier soil, in this dataset).
      Legibility verdict: PASS overall, with one flagged defect — the shared "Rainfall (mm)" title text visually overlaps the axis line and tick marks of the middle-bottom (Organic x Sandy Soil) facet; the tick marks are partly hidden behind the title text, though all numeric tick labels below remain fully legible.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Title, strip labels, and axis titles are all rendered in light cream/off-white text, clearly readable against the dark background — no dark-on-dark failures observed. Tick labels are a lighter muted gray, still legible. Gridlines are subtle and appropriately dimmed.
      Data: Identical brand green (#009E73) scatter points and dashed trend lines as the light render — confirmed data colors are unchanged between themes; only chrome (background, text, grid) flips.
      Legibility verdict: PASS overall, with the same overlap defect as light — the shared "Rainfall (mm)" title crosses the Organic x Sandy-Soil facet's axis line/tick marks identically in this theme.
