review:
  strengths:
  - Shared x/y scales computed once from the full dataset and reused across every
    cell, so all six panels are directly comparable — the core requirement of a facet
    grid.
  - Both row (water level) and column (fertilizer) faceting implemented simultaneously,
    with theme-adaptive strip labels (t.elevatedBg / t.ink) identifying each facet.
  - Tick labels are decluttered to only the outer edges (bottom row, left column)
    while gridlines remain in every cell, keeping the grid clean without losing shared-scale
    context.
  - Deterministic in-memory data generation via a seeded LCG, with a plausible, neutral
    real-world scenario (plant leaf area vs. sunlight, split by water/fertilizer).
  - 'Correct Imprint token usage throughout (t.palette[0], t.ink, t.inkSoft, t.grid,
    t.elevatedBg, t.pageBg) — first series is #009E73 and identical between light/dark,
    only chrome flips.'
  weaknesses:
  - Tick label font-size is 13px, just under the D3 guide's recommended 14-22px floor
    for a 3200px-wide canvas — bump to 14px to match the axis-title sizing more consistently.
  - 'Design Excellence is at baseline: plain green markers with no additional visual-hierarchy
    device (e.g. a shared trend line, per-facet mean marker, or highlighted panel)
    to reinforce the sunlight-vs-leaf-area story beyond the grid layout itself.'
  - Panel borders are drawn on all four sides for every cell at low opacity; consider
    whether interior gridlines alone (removing the redundant per-cell box) would read
    cleaner given the shared axes already imply the boundaries.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (~#FAF8F1), consistent across the full canvas and each facet strip (slightly elevated tone) and panel interior.
      Chrome: Title "facet-grid · javascript · d3 · anyplot.ai" is bold dark text, clearly legible. Column facet strips ("No fertilizer", "Organic", "Synthetic") and row facet strips ("Low water", "High water", rotated) use bold dark text on a light-elevated strip background — fully readable. Axis titles ("Sunlight (hours / day)", "Leaf Area (cm²)") and tick labels (only on outer edges) are dark/soft-ink text, clearly visible against the light background. Gridlines are subtle light-gray, visible but not dominant.
      Data: All six panels use the same brand green (#009E73) circular markers at consistent size/opacity, with a clear positive trend of leaf area vs. sunlight hours visible in every cell.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black (~#1A1A17), consistent across canvas, strips, and panels.
      Chrome: Title is bold white/light text, clearly legible. Column and row facet strips use light text on a slightly-lighter-than-background elevated strip — no dark-on-dark issue. Axis titles and tick labels are light gray, clearly visible against the dark background. Gridlines are subtle dark-gray, visible but not dominant. No dark-on-dark or unreadable text detected anywhere.
      Data: Marker color is identical brand green (#009E73) to the light render — only the chrome (background, strip fill, text, gridlines) flipped, confirming theme-adaptive tokens were used correctly rather than hard-coded colors.
      Legibility verdict: PASS
