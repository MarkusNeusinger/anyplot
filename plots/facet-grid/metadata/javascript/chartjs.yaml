review:
  strengths:
  - Per-facet linear regression trend line adds genuine data storytelling — viewer
    can compare slope and scatter spread across facets at a glance
  - Elevated pill-style row/column facet headers (rounded corners, background fill)
    lift visual polish above a bare library-default look
  - Marker size increased (3.2px to 4-5px) with added ~70% alpha transparency, better
    tuned to the ~140-points-per-facet density
  - Custom per-facet tooltip callbacks (title shows Class · Drivetrain, formatted
    'X L to Y mpg' label) demonstrate genuine Chart.js mixed-dataset and tooltip-filter
    usage, visible in the interactive HTML view
  - Shared axis scales are computed once from the full dataset and applied identically
    to every cell, matching the spec's 'same axes scales by default' requirement
  - 'Both renders remain fully theme-correct: identical #009E73 data color and dashed
    trend line color in both themes, correctly flipped chrome, no clipping at any
    canvas edge'
  weaknesses:
  - Design Excellence still centers on a single accent color (green) plus a neutral
    gray trend line; no secondary hue or highlighted facet to create a stronger focal
    point
  - At mobile-thumbnail scale (~400px wide), the 13px tick labels are still quite
    small — bumping to ~14-15px would improve readability at reduced sizes
  - No legend or small caption explains what the dashed line represents — a 'Trend'
    legend entry or brief note would remove ambiguity for a first-time viewer
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1-like), each facet cell sits on a subtly lighter elevated tone with a thin light-gray border and rounded corners.
      Chrome: Title "facet-grid · javascript · chartjs · anyplot.ai" is bold dark text, centered, fully legible with comfortable margin above and below. Column headers ("Drivetrain: FWD/AWD/RWD") render as dark bold text inside rounded elevated pills. Row labels ("Class: Sedan"/"Class: SUV") are rotated, bold, dark, and fully visible with generous margin from the right canvas edge. Axis titles "Engine Size (L)" and "Fuel Economy (mpg)" are dark and legible; tick labels (dark gray) appear only on the bottom row / leftmost column, avoiding redundant repetition.
      Data: All six facets use brand-green (#009E73, ~70% alpha) scatter markers, plus a dashed neutral-gray linear-regression trend line per facet, showing a consistent negative correlation between engine size and fuel economy with visibly different spreads per facet.
      Legibility verdict: PASS — all text is readable against the light background, no clipping at any edge (checked title top, axis-label bottom, row-label right, y-axis-label left).

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17-like), same elevated-cell structure as the light render, thin dark-gray borders.
      Chrome: Title, column-header pills, row labels, axis titles, and tick labels all render in light/off-white color, clearly legible — no dark-on-dark text anywhere, confirmed at both the right-edge row labels and the bottom-edge axis label crop.
      Data: Marker color is identical #009E73 green (same alpha) to the light render; the trend line renders in a light gray dash, still readable against the dark cell background — only chrome flipped.
      Legibility verdict: PASS — all text readable against the dark background, no dark-on-dark or clipping issues found.
