review:
  strengths:
  - Correctly implements small multiples with one Chart instance per facet cell —
    a legitimate workaround since Chart.js has no native facet/subplot API
  - Shared axis scales (X_MIN/X_MAX, Y_MIN/Y_MAX) computed once across all facets
    and applied identically to every cell, matching the spec's 'same axes scales by
    default' requirement
  - 'Both row facet (Class: Sedan/SUV) and column facet (Drivetrain: FWD/AWD/RWD)
    are labeled clearly, satisfying the ''facet by row, column, or both'' requirement'
  - Tick labels are only shown on the bottom row and left column, avoiding redundant
    repetition across the 2x3 grid
  - Realistic, neutral automotive dataset (engine size vs. fuel economy) with plausible
    negative correlation and directionally correct drivetrain efficiency penalties
    (AWD/RWD less efficient than FWD)
  - Deterministic LCG-seeded data generation, animation disabled, theme tokens correctly
    threaded through every cell's background, border, ticks, and grid
  weaknesses:
  - 'Design Excellence is at library-default level: no custom color beyond the single
    Imprint green, minimal visual refinement beyond thin cell borders, and no storytelling
    device (e.g., a shared trend guide, highlighted facet, or annotation calling out
    the cross-facet pattern) to give the viewer a focal point'
  - Marker radius (3.2px) and per-facet border/spacing choices are plain library defaults
    rather than tuned for this specific 140-points-per-cell density — slightly larger
    radius or subtle alpha would improve clarity without hurting overlap
  - At the mobile-scaled 400px thumbnail, per-facet tick labels are very small (near-illegible)
    — consider hiding tick labels entirely below a size threshold isn't possible here,
    but a slightly larger base tick font (e.g. 13-14px) would help without breaking
    the grid's proportions
  - No use of Chart.js-distinctive features beyond a basic multi-instance scatter
    setup (e.g., no custom tooltip callback formatting for the interactive HTML view,
    no per-facet color/emphasis) — a more idiomatic showcase of Chart.js scatter/plugin
    capabilities would raise Library Mastery
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1-consistent) across the full canvas and each facet cell background is a subtly lighter elevated tone with a thin light-gray border separating cells.
      Chrome: Title "facet-grid · javascript · chartjs · anyplot.ai" is bold dark text, clearly legible. Column headers "Drivetrain: FWD/AWD/RWD" and row labels "Class: Sedan"/"Class: SUV" (rotated) are dark, bold, and readable. Axis titles "Engine Size (L)" and "Fuel Economy (mpg)" are dark and legible. Tick labels (0/2/4/6 on x, 7/20/40/45 on y) are dark gray and readable, shown only on the bottom row / leftmost column to avoid repetition. Gridlines are light gray, subtle but visible.
      Data: All six facets use the same brand-green (#009E73) scatter markers showing a consistent negative correlation between engine size and fuel economy, with visibly different point clouds per facet (Sedan vs SUV baseline, and per-drivetrain shift/penalty).
      Legibility verdict: PASS — all text is clearly readable against the light background in both facet and chrome elements.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17-consistent) canvas background with a slightly lighter elevated cell background and thin dark-gray border per cell, matching the light render's structure exactly.
      Chrome: Title, column headers, row labels, axis titles, and tick labels all render in light/off-white color, clearly legible against the dark background. No dark-on-dark text was found anywhere in the chrome. Gridlines are a muted dark gray, still visible but not dominant.
      Data: Marker color is identical #009E73 green in every facet, unchanged from the light render — only chrome (background, borders, text, grid) flipped.
      Legibility verdict: PASS — all text is clearly readable against the dark background; no dark-on-dark or light-on-light failures observed.
