review:
  strengths:
  - plt.subplots(sharex=True, sharey=True, squeeze=False) gives all 12 panels one
    shared temperature and energy scale, so positions compare directly across regions
    and seasons, with tick labels drawn only on the outer panels
  - fig.supxlabel / fig.supylabel set the shared axis titles once for the whole grid,
    while the season column headers and region row headers name every facet in semibold
    INK, readable in both themes
  - Region color is constant along each row and is explained once by the row headers,
    with no per-panel legend
  - Theme tokens are threaded through every chrome element (ticks, spines, grid, titles);
    the page-colored marker rings separate overlapping points on both surfaces
  - The canvas is exactly 3200x1800 with default bbox_inches, and the layout uses
    fig.subplots_adjust so nothing clips
  weaknesses:
  - 'VQ-01 (both): tick labels are set at 7 pt, below the style guide''s 8 pt tick
    reference, and read small next to the 10 pt facet headers and axis titles → 8
    pt (+1 pt). Likely cause: ax.tick_params(labelsize=7).'
  - 'Suggestion: the per-panel linear fits are almost flat because the generated energy
    is U-shaped around each panel''s own mean temperature; a demand curve centered
    on one comfort temperature (about 18 °C) would make heating and cooling demand
    differ visibly between the Winter and Summer columns, and the fits could then
    be dropped or replaced.'
  - 'Suggestion: the shared x-axis title sits about 100 px below the bottom tick labels;
    raising it (for example supxlabel y≈0.04 with bottom≈0.12) would tighten the lower
    margin.'
  - 'Suggestion: a slightly larger marker (s≈40) would give the 25 points per panel
    more presence in the small panels.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the figure and all 12 panels; not pure white.
      Chrome: title "facet-grid · python · matplotlib · anyplot.ai" centered at the top (about half the width); semibold column headers Spring / Summer / Fall / Winter and row headers North / South / East; shared "Temperature (°C)" x-title at the bottom and rotated "Energy Consumption (kWh)" y-title on the left; tick labels 0/20/40 and 100–180 in INK_SOFT on the outer panels only. All dark text is readable; grids are faint but visible.
      Data: a 3x4 grid of scatter panels, 25 points each; North in #009E73, South in #C475FD, East in #4467A3, with thin page-colored rings; a grey linear fit line per panel. Shared scales: x from about -10 to 43 °C, y from about 100 to 188 kWh; the panels shift right from Winter to Summer and from North to South.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17; not pure black.
      Chrome: title, facet headers and axis titles in light INK, ticks and spines in light INK_SOFT; no dark-on-dark text anywhere; grids subtle but visible.
      Data: the same three hues as the light render (#009E73, #C475FD, #4467A3); only the marker rings flip to the dark page color; fit lines in muted grey stay visible.
      Legibility verdict: PASS
