review:
  strengths:
  - 'Idiomatic FacetGrid with map_dataframe(regplot) and margin_titles=True: month
    headers across the top and product-line headers down the right margin'
  - Shared axis scales across all 12 panels with tick labels only on the outer panels,
    so positions compare directly
  - Tick density thinned with MaxNLocator for the small panels, keeping every panel
    uncluttered
  - 'Theme tokens threaded through the rc dict: both renders theme-correct with identical
    #009E73 data marks'
  - Exact 3200x1800 canvas via figure set_size_inches(8, 4.5) at dpi=400 without bbox_inches
  weaknesses:
  - 'VQ-01 (both): tick labels at 7 pt sit below the style guide''s 8 pt and read
    small beside the 9 pt axis titles → 8 pt (+1 pt). Likely cause: ax.tick_params(labelsize=7).'
  - 'DQ-03 (both): profit margins clipped at 40 % pile Food points on a flat ceiling
    at exactly 40 % (Jan, Feb, Apr panels) → generate margins that stay inside the
    range without clipping, e.g. a lower Food base or smaller noise. Likely cause:
    np.clip(..., 5, 40) on base_margin 35 ± 3 noise.'
  - 'Suggestion: a focal comparison (e.g. ordering or emphasis that makes the Food-vs-Electronics
    margin gap the first read) would give the grid a story beyond the data.'
