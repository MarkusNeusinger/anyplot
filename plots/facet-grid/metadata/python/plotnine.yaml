review:
  strengths:
  - Native facet_grid(rows=, cols=) with labeller='label_both' gives a clean 4x3 grid
    with column and row strips that name each category
  - Shared scales with tick labels only on outer panels make positions directly comparable
    across subjects and methods
  - 'Theme tokens threaded through every chrome element: text, strips and legend read
    correctly on both #FAF8F1 and #1A1A17'
  - 'Category order kept from the data via pd.Categorical and scale limits, so In-Person
    gets #009E73'
  weaknesses:
  - 'VQ-02 (both): the legend title ''Method'' sits flush against the left edge of
    the legend frame and the ''In-Person'' label runs into its right edge → keep at
    least ~4 px of padding inside the frame. Likely cause: legend_background frame
    with no legend_box_margin / legend padding set.'
  - 'VQ-05 (both): the row strips on the right are oversized empty boxes (about 290
    of 2000 px width, ~15 % of the canvas) for one-word labels, squeezing the 3 panel
    columns → a narrow strip, e.g. rotated row-strip text or shorter row labels, so
    the panels gain the width. Likely cause: strip_text_y rotation=0 with label_both,
    which sizes the strip to the horizontal ''Subject: Science'' text.'
  - 'DQ-03 (both): the score model 60 + 6·hours + effects reaches ~125 at 10 hours
    and is clipped, so a large share of points across all 12 panels sits on a flat
    line at exactly 100 and the relationship flattens into a ceiling → generate scores
    that stay mostly under 100 (e.g. a smaller slope or lower intercept, about −20
    points at the top). Likely cause: np.clip(score, 30, 100) on an uncapped linear
    model.'
  - 'Suggestion: color repeats the column facet; a variable not already shown by the
    layout (or a single color) would make the legend carry information.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across canvas and panels, 3200x1800.
      Chrome: centered title "facet-grid · python · plotnine · anyplot.ai" in dark ink; axis titles "Study Hours" / "Exam Score"; ticks 2–10 and 60–100 in INK_SOFT on outer panels only; column strips "Method: In-Person/Online/Hybrid" and wide row strips "Subject: Math/Science/Reading/Writing" in bold dark text on #FFFDF6 framed boxes; legend "Method" at right with framed elevated background. All readable; legend title and "In-Person" touch the legend frame.
      Data: 4x3 grid of scatter panels, 15 points each; In-Person #009E73, Online #C475FD, Hybrid #4467A3, alpha 0.75. Rising score with hours in every panel; many points pile up on the 100 ceiling.
