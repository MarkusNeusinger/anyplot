review:
  strengths:
  - Native facet_grid(x=Region, y=Category) gives shared scales, column and row strips
    and one figure-wide legend with no manual layout
  - 'Theme tokens thread through every chrome element: strips on the elevated surface,
    ink text, subtle 10 % grid, readable in both themes'
  - Linear fits come from geom_smooth's built-in lm stat rather than precomputed lines
  - Canvas follows the landscape contract exactly (ggsize(800, 450), scale=4 → 3200×1800)
  weaknesses:
  - 'Suggestion: color repeats the row facet (Category); mapping it to a variable
    the facets do not already show, or dropping the legend, would make the color channel
    carry information.'
  - 'Suggestion: ordering the region columns North, South, East, West (or by sales
    level) instead of alphabetically would give the columns a reading order.'
