review:
  strengths:
  - Uses plotly express facet_row/facet_col with category_orders, so the 3x4 grid
    keeps the data's own order of servers and periods
  - for_each_annotation rewrites the strips to the category only (Frankfurt, Night),
    readable in both themes
  - One figure-level y title replaces three repeated row titles, keeping the left
    margin clean
  - Shared axes across all 12 panels make the server and time-of-day offsets compare
    directly
  - Plausible, neutral latency scenario with real server regions and sensible ms/KB
    scales
  - Theme tokens thread through title, ticks, grid, lines and marker outline; data
    color identical in both renders
  - HTML output keeps plotly's native hover, zoom and pan per panel
  weaknesses:
  - 'Suggestion: a light ELEVATED_BG strip behind the facet headers would separate
    them from the panel area more clearly.'
  - 'Suggestion: per-panel slope differences could be read faster with a shared y
    range starting at the data minimum rather than near 0.'
