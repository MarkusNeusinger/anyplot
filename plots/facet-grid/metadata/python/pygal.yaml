review:
  strengths:
  - One shared y range (0 to 1.15 x max) computed from the data across all six panels,
    so heights compare directly and no point is clipped
  - Column headers via the top row's pygal titles and rotated row headers in the composed
    SVG label both facet dimensions clearly in both themes
  - Theme tokens threaded through the pygal Style and the composed SVG chrome; Imprint
    brand green on correct light and dark surfaces
  - Panels composed as nested vector SVG before rasterizing, so the HTML output keeps
    pygal's live per-point tooltips
  weaknesses:
  - 'VQ-01 (both): tick labels render at 28-32 px and axis titles at 44 px, below
    the pygal references of 44 px and 56 px, and read small beside the 64 px title
    → tick labels 44 px (+12 to +16 px), axis titles about 56 px (+12 px), shrinking
    the facet headers if needed. Likely cause: label_font_size=32, major_label_font_size=28,
    title_font_size=44 in the Style.'
  - 'VQ-05 (both): the first column''s plot frames are about 6 % narrower than those
    of the other two columns (y-axis title inside the equal-width cell), so panel
    frames do not line up across columns → equal plot-area widths in every column.
    Likely cause: y_title drawn only in column 0 inside a cell of the same width;
    give every panel the same left margin (e.g. draw the y-axis title once outside
    the cells).'
  - 'DQ-01 (code): 6 panels x 7 days = 42 points, below the spec''s Data size of 100-5000
    → at least 100 points, for example several plants per condition or more sampling
    days. Likely cause: sample_days of 7 values and one plant per facet.'
  - 'Suggestion: an XY chart with numeric Days would make the x axis a true numeric
    scale instead of category labels.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole 3200x1800 canvas.
