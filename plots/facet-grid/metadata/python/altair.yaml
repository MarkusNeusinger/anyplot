review:
  strengths:
  - Idiomatic Altair .facet(row=alt.Row, column=alt.Column) with alt.Header styled
    from theme tokens, readable headers in both themes
  - Shared scales across all nine panels (Vega-Lite default), so positions compare
    directly; one legend for the whole figure
  - 'Imprint palette in canonical order with Wheat on #009E73; data colors identical
    across light and dark'
  - Pad-only resize to the exact 3200x1800 canvas with panel sizes derived from the
    facet counts
  - Escaped-field tooltips with readable titles for all five columns in the HTML output
  weaknesses:
  - 'VQ-01 (both): axis tick labels at labelFontSize=9 and axis titles at titleFontSize=11
    sit below the library reference (10 pt / 12 pt) and read small beside the 3200
    px canvas → 10 pt ticks and 12 pt axis titles (+1 pt each). Likely cause: configure_axis(labelFontSize=9,
    titleFontSize=11).'
  - 'DQ-03 (both): water usage of 40-90 mm per growing season is about a tenth of
    real seasonal crop water use (roughly 400-900 mm) → scale the water values by
    about x10 (+360 to +810 mm), or relabel as a weekly figure. Likely cause: np.random.normal(50
    + crop_base * 5, 8, 20).'
  - 'Suggestion: a legend-bound point selection highlighting one crop across all panels
    would showcase Altair''s selections in the HTML view.'
  - 'Suggestion: the y-axis title repeats on every row and the x-axis title under
    every column; a single shared axis title per side would lighten the grid.'
