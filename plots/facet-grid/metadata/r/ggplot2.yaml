review:
  strengths:
  - Correct facet_grid(rows = vars(species), cols = vars(soil)) usage with shared
    axis scales across all nine panels, exactly matching the spec's row/column faceting
    requirement
  - 'Theme-adaptive chrome is fully correct: strip backgrounds, ink text, grid lines,
    and the geom_smooth trend line color all flip between light and dark, while the
    Imprint green (#009E73) data points stay identical across both renders'
  - Mandated title format matches exactly ("facet-grid · r · ggplot2 · anyplot.ai");
    axis labels are descriptive with units ("Light Exposure (hours/day)", "Growth
    (cm)")
  - 'Clean, reproducible, KISS-structured code: set.seed(42), no functions/classes,
    only used imports (ggplot2, dplyr, ragg)'
  - Data clearly shows the intended interaction effect — slopes visibly steepen from
    Sandy to Loamy soil, and intercepts differ by species — giving each facet a distinguishable
    story
  weaknesses:
  - 'Design Excellence is still close to a well-configured default: theme_minimal
    + panel.spacing tweaks read as tasteful but not distinctive. Consider a subtle
    facet-header accent (e.g. a thin colored rule under strip.text) or refined typography
    hierarchy between title/axis-title/tick sizes to push above ''configured default''.'
  - Data storytelling relies only on the per-facet trend line to convey the soil/species
    interaction; there is no explicit callout of the standout facet (e.g. Loamy shows
    the steepest growth response). A short annotate() label on the most extreme panel,
    or reordering columns by slope magnitude, would sharpen the insight.
  - The Fern × Sandy facet has a couple of points sitting at or just below Growth
    = 0 cm, which is not physically realistic for plant growth. Consider flooring
    the simulated growth values at a small positive number or reducing the noise sd
    for low-light_hours rows.
  - Points overlap noticeably in the denser, steeper facets (Clay, Loamy) where the
    regression line runs through a tight point cloud; a slightly lower alpha (~0.4)
    or smaller point size in those panels would reduce overplotting.
  - 'LM-02: facet_grid + geom_smooth is fairly standard ggplot2 usage for this spec;
    leveraging a more distinctive feature (e.g. stat_summary for per-facet means,
    or annotate() highlighting the fastest-growing combination) would raise library
    mastery beyond the baseline.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1), matching the required light-theme surface — not pure white.
      Chrome: Title "facet-grid · r · ggplot2 · anyplot.ai" top-left in dark ink; a 3x3 grid of panels with column strip labels "Sandy" / "Clay" / "Loamy" on a slightly elevated off-white strip background at top, and row strip labels "Fern" / "Basil" / "Clover" rotated on the right edge. Axis titles "Light Exposure (hours/day)" (bottom, shared) and "Growth (cm)" (left, shared) are dark and legible; tick labels are a softer dark gray. Grid lines are subtle mid-gray, visible but not dominant. All text is clearly readable against the light background.
      Data: Every panel shows green (#009E73) scattered points with alpha blending plus a solid black linear trend line. Slopes visibly increase from the Sandy column to the Loamy column, and baseline intercepts differ by species row (Basil/Clover start higher than Fern).
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17), matching the required dark-theme surface — not pure black.
      Chrome: Same layout as light — title, strip labels, axis titles/ticks — now rendered in light ink (near-white) against the dark background and dark-gray strip chips. Grid lines are light gray, still subtle. No dark-on-dark or light-on-light failures observed anywhere; every title, axis label, tick label, and strip label is clearly legible.
      Data: The green (#009E73) data points are visually identical in hue and saturation to the light render; only the trend line switched from black to white/light ink to stay visible against the dark background, which is the expected chrome-only flip — data colors are unchanged.
      Legibility verdict: PASS
