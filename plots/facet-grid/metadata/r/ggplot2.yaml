review:
  strengths:
  - Both-dimension faceting (rows AND columns) is used correctly and is the correct
    plot type for this spec — not degraded to a single facet_wrap.
  - Canvas, palette, and theme-adaptive chrome are all pixel-verified correct in both
    themes — no clipping, no dark-on-dark/light-on-light, backgrounds match Imprint
    tokens exactly.
  - Data generation gives each of the 9 species/soil combinations a distinct, realistic
    intercept/slope, so the grid actually demonstrates cross-facet comparison rather
    than 9 near-identical panels.
  weaknesses:
  - The geom_text callout ('Steepest growth response' in the Basil x Loamy panel)
    does not render at all in either theme — verified by cropping the exact target
    pixel coordinates at 3x zoom. Investigate why the annotation layer produces no
    visible pixels (drawn beneath other layers, dropped by facet matching, or a sizing/alpha
    issue not apparent from the code) and either fix it or remove the dead code.
  - The code sets strip.text = element_text(color = IMPRINT_PALETTE[1], ...) (brand
    green) but the rendered strip labels ('Sandy'/'Clay'/'Loamy'/'Fern'/'Basil'/'Clover')
    are pixel-confirmed to be plain INK color, not green, in both renders. Not a visual
    defect (INK is arguably more correct for a structural label), but a code/output
    mismatch worth confirming against the current script.
  - Design storytelling is generic once the callout is set aside — consider a redundant
    visual cue if the annotation route continues to fail to render.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, pixel-sampled at RGB(250,248,241) = #FAF8F1, matches spec exactly.
      Chrome: Title "facet-grid · r · ggplot2 · anyplot.ai" at top-left (~45% width, no clipping, verified via crop). Axis titles "Light Exposure (hours/day)" and "Growth (cm)" fully visible, no clipping at left/bottom edges. Column strip labels (Sandy/Clay/Loamy) and row strip labels (Fern/Basil/Clover) all legible dark-on-cream; row labels confirmed not clipped at the right canvas edge via pixel crop.
      Data: First/only series pixel-sampled and confirmed brand green #009E73 (sampled RGB [15,163,123], within tolerance of anti-aliasing). Regression line renders in dark INK color. Points use alpha=0.4, appropriately handling ~150 points/panel.
      Legibility verdict: PASS — all rendered text is legible; however, one intended annotation ("Steepest growth\nresponse" callout in the Basil x Loamy panel) is present in the source code but is completely absent from the rendered pixels — confirmed by computing its exact panel/data-coordinate pixel location (~x=1746, y=967 in the 2400x2400 canvas) and cropping a 3x-zoomed region: only grid lines and data points appear, no text of any kind.

    Dark render (plot-dark.png):
      Background: Warm near-black, pixel-sampled at RGB(26,26,23) = #1A1A17, matches spec exactly.
      Chrome: Title, axis titles, tick labels, and strip labels all render in light INK/INK_SOFT tones (confirmed via pixel sampling of strip text: RGB(240,239,232) = #F0EFE8) and are clearly readable against the dark background. No dark-on-dark failures found anywhere.
      Data: Confirmed pixel-identical brand green data points to the light render; regression line flips to light INK per theme-adaptive chrome, as expected.
      Legibility verdict: PASS — same missing-callout issue as the light render, confirmed absent at the identical facet/coordinate via the same pixel-crop method.
