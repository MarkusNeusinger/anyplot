review:
  strengths:
  - Edges are smooth quadratic curves pulled toward the center, thin (1.2 px) and
    translucent (opacity 0.3), so the three link bands stay traceable in both themes
  - The subtitle names the radial encoding ('Distance from the center = importance'),
    so the node positions are readable without a legend
  - One Imprint color scale drives axes, nodes and axis-group labels, which double
    as the legend; data colors are identical in both renders and only chrome flips
  - Idiomatic alt.layer composition with order/detail encodings drawing one path per
    edge, plus native tooltips on nodes and edges in the HTML output
  - Canvas padded (never cropped) to exactly 2400x2400
  weaknesses:
  - 'DQ-03 (code): the importance values are typed as even steps (Core 1.0/0.80/0.60/0.40/0.20,
    Utility 1.0/0.75/0.50/0.25) that do not follow from the drawn edges, although
    the subtitle names them a share of dependents (Database sits above Config with
    2 links against 3; FileIO, String and DateTime each have one outgoing link yet
    sit at 0.75/0.50/0.25) → compute the property from the edge table (e.g. degree
    or dependents per node normalized within the group) so the caption is true. Likely
    cause: the hand-written IMPORTANCE list.'
  - 'Suggestion: edge width by weight, which the Data allows, would add a second readable
    dimension to the link bands.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the full 2400x2400 canvas
      Chrome: bold dark title 'hive-basic · python · altair · anyplot.ai' with a soft-gray subtitle 'Distance from the center = importance (share of dependents)'; axis-group labels Core (green, upper right), Utility (purple, upper left), Interface (blue, bottom) in bold; dark bold node labels beside each node; all readable
      Data: three radial axes from a common center at 30°, 150° and 270°; 5 Core nodes in #009E73, 4 Utility nodes in #C475FD, 3 Interface nodes in #4467A3, each ringed in the page color; 18 thin translucent gray curved edges bowing toward the center between axes
      Legibility verdict: PASS

