review:
  strengths:
  - Square 2400x2400 canvas fits the symmetric three-axis hive; axes, nodes and labels
    use the space without collisions
  - 'Rule-based layout: nodes ranked by degree along their group axis, so the same
    network always draws the same way, and the subtitle names the property'
  - Translucent quadratic Bezier edges pulled toward the centre keep the cross-axis
    bands traceable
  - Imprint colours in canonical order with theme tokens threaded through title, labels
    and legend; both renders read cleanly
  - hovertemplate with customdata exposes module name and degree in the interactive
    HTML
  weaknesses:
  - 'SC-01 (both): node size also encodes degree, a channel the spec neither requires
    nor offers, on top of the degree-ranked radius → one uniform node size (about
    16 px). Likely cause: marker size=members[DEGREE] * 2 + 8.'
  - 'Suggestion: placing the radius by degree value instead of rank would let equal
    degrees share a position and make gaps between hubs visible.'
  - 'Suggestion: edge width by dependency weight, which the Data allows, would add
    a second readable dimension to the bands.'
