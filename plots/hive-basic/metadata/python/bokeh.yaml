review:
  strengths:
  - 'Hive layout follows deterministic rules: nodes sit by degree rank on their group''s
    axis, so the same network always draws the same way'
  - Edges are quadratic curves pulled toward the centre at alpha 0.4, thinner than
    the nodes and colored by source axis, so bands stay traceable
  - Theme tokens thread through every text element; both renders read cleanly with
    identical Imprint data colors
  - Data block uses tidy pandas tables and column constants, and axes are derived
    from the data rather than hard-coded
  weaknesses:
  - 'SC-02 (both): the render names node size = degree but nothing says the distance
    from the centre is the degree rank (C2 asks for a caption, legend or axis note
    naming the position property) → add a short note such as ''Distance from centre
    = degree rank''. Likely cause: only the size legend title carries the property.'
  - 'DQ-03 (code): the Degree column contradicts the edge list it labels: core_main
    is given 8 but has 5 edges (-3), core_init 7 vs 3 (-4), core_config 5 vs 2 (-3),
    api_web 6 vs 3 (-3), core_base 4 vs 1 (-3) → compute degree from the edge list
    (pd.concat of both edge columns, value_counts) so positions, sizes and the legend''s
    Low/High show real degrees. Likely cause: DEGREE values typed into the nodes table.'
  - 'CQ-04 (code): lines 166-178 evaluate the quadratic Bezier by hand on 30 samples
    and draw one p.line per edge → `p.quadratic(x0=..., y0=..., x1=..., y1=..., cx=...,
    cy=..., source=edge_source)` with the same control point (0.2 × endpoint sum),
    about 8 lines shorter. Likely cause: curve math carried over instead of bokeh''s
    quadratic glyph.'
  - 'DE-02 (dark): a thin full rectangular frame encloses the plot area in the dark
    render, a box the style guide''s no-decorative-border rule excludes → no frame.
    Likely cause: the plot outline or border not suppressed for the dark theme (check
    outline_line_color / the HTML body styling).'
  - 'Suggestion: drop the node-size encoding, which repeats the degree the position
    already shows, so the plot stays the plain basic variant.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, no frame.
