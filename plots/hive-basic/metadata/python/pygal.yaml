review:
  strengths:
  - 'Native pygal.XY build: per-series stroke_style for axes and edges, per-point
    label dicts drawn by print_labels for node and axis-group names, no SVG post-processing'
  - 'Theme tokens threaded through Style: #FAF8F1/#1A1A17 backgrounds, readable ink
    in both renders, Imprint colors identical across themes'
  - 'Hive structure follows the spec: three straight axes from one center, nodes ranked
    by degree with a caption naming the property, translucent Bezier edges bundled
    toward the center'
  - Compact, deterministic, function-free script on the canonical 2400x2400 canvas
  weaknesses:
  - 'VQ-02 (both): the Interface node labels ADMI, WEBS, PUBL and GRAP sit directly
    on the axis line and the incoming edge bundle, which strike through the letters
    → place them clear of the axis on the side away from the bundle, as on the Core
    axis (offset about +30 px perpendicular to the axis). Likely cause: pygal''s default
    print_labels offset, which falls onto a diagonal axis.'
  - 'VQ-03 (both): edges within a group (kernel-config, helpers-validators, rest_api-admin_ui
    …) are drawn as Beziers whose control point lies on the same axis, so they collapse
    onto the axis line and cannot be seen; the 1 px anchor dots of the axis-group
    labels float as stray specks → drop the within-group edges (the spec''s basic
    variant has no duplicated axes) and give the axis-label series no visible dot.
    Likely cause: pull = 0.75 for same-group edges and dots_size=1 on the label series.'
  - 'VQ-05 (both): the caption ''Distance from center = degree, highest nearest''
    renders at roughly the title''s size and dominates the bottom of the canvas for
    a secondary note → about 34 px, the node-label size (about −25 px). Likely cause:
    x_title inherits a large title font size from Style.'
  - 'DQ-03 (code): the ''Degree (dependencies)'' column does not match the edge list
    (kernel 8 vs 6 edges, events 5 vs 2, rest_api 6 vs 7), so the captioned degree
    ordering is not the network''s degree → compute degree from the edges (value counts
    of source and target). Likely cause: hand-typed degree values.'
  - 'Suggestion: full module names instead of four-letter abbreviations would read
    better in the HTML view.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, square 2400x2400.
      Chrome: title 'hive-basic · python · pygal · anyplot.ai' in dark ink at the top; group labels Core, Utility, Interface at the outer axis ends; four-letter node labels (KERN, DATA, ... COMP) in dark ink; large caption 'Distance from center = degree, highest nearest' and a bottom legend (Core, Utility, Interface). All readable; Interface labels ADMI/WEBS/PUBL/GRAP are crossed by the axis line.
      Data: three straight gray axes from a common center (Core down, Utility upper right, Interface upper left); 7 green #009E73 Core nodes, 7 lilac #C475FD Utility nodes, 6 blue #4467A3 Interface nodes; thin translucent Bezier edges colored by source group bundle toward the center.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, node labels, group labels, caption and legend in light ink; no dark-on-dark text.
      Data: node and edge colors identical to the light render; only chrome flipped; brand green clearly visible.
      Legibility verdict: PASS
