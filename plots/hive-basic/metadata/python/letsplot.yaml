review:
  strengths:
  - Degree is computed from the edge list and the caption names the placement rule
    (rank by connections within each axis), so the layout is reproducible
  - Theme tokens threaded through title, group labels, legend boxes, caption and node
    outlines; both renders read cleanly with identical Imprint data colors
  - Single-ink translucent quadratic Bezier edges pulled toward the center keep the
    between-axis bands traceable
  - Native lets-plot HTML export alongside the PNG gives hover inspection in the detail
    view
  weaknesses:
  - 'VQ-03 (both): 9 of the 23 edges (within-group links: 5 Core, 3 Utility, 1 Interface)
    are drawn as straight segments along their own axis line and cannot be told apart
    from the axis → draw only edges between nodes on different axes. Likely cause:
    the Bezier loop draws every row of df, and with source and target on one angle
    the control point lies on the axis.'
  - 'VQ-05 (both): the hive spans x≈-0.6..1.25 but coord_fixed uses a symmetric ±1.35
    window, so the drawing fills only about half the canvas width with a broad blank
    band on the left and a gap above the legends → fit xlim/ylim to the drawn extent
    including the group labels. Likely cause: reach = 1.35 for both limits.'
  - 'SC-01 (both): node size maps degree a second time although position already encodes
    it and the basic variant asks only for axes, nodes and curved edges → one fixed
    node size and no size legend. Likely cause: size=''degree'' in the geom_point
    aes with scale_size.'
  - 'Suggestion: align the caption with the legend block (it sits offset to the right
    under the Module type box).'
  - 'Suggestion: lay the size legend out in one row so 1–6 read in order rather than
    column-major.'
  image_description: |-
