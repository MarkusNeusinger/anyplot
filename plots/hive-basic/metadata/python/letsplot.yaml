review:
  strengths:
  - Node distance from the center is computed from degree and the size legend says
    so ('Connections (distance from center)'), so the layout is rule-based and reproducible
  - Theme tokens threaded through title, group labels, legend boxes and node outlines;
    both renders read cleanly with identical Imprint data colors
  - Quadratic Bezier edges pulled toward the center at alpha 0.5 keep the between-axis
    bands traceable
  - Native lets-plot HTML export alongside the PNG gives hover inspection in the detail
    view
  weaknesses:
  - 'SC-01, VQ-03 (both): edges are colored by a derived ''Edge type'' channel (Within
    Core / Within Utility / Within Interface / Between axes) the spec does not ask
    for, and the three within-group colors are invisible because those edges run along
    the axis lines under the nodes → draw all edges in one ink color and drop the
    edge legend. Likely cause: color=''Edge type'' in the edge geom_path aes and the
    edge_colors scale_color_manual.'
  - 'VQ-03 (both): the size-legend circles are drawn white-filled while every node
    is filled with its group color → fill the size glyphs with a neutral ink like
    the node outline. Likely cause: scale_size legend without guide override (guides(size=guide_legend(override_aes={''fill'':
    INK_SOFT}))).'
  - 'VQ-05 (both): the page background covers only x≈307-2894 of the 3200 px canvas,
    leaving transparent strips (~19 % of the width) at both sides → background over
    the full canvas. Likely cause: coord_fixed(ratio=1) letterboxing the plot inside
    ggsize(800, 450).'
  - 'DQ-03 (code): the ''Connections'' values that set node radius are typed in module_info
    and disagree with the edge list (core_main 8 vs 6 edges, util_encode 7 vs 2, api_rest
    7 vs 4, util_compress 2 vs 1) → compute degree from the edges (value_counts over
    Source and Target). Likely cause: hard-coded degree in module_info.'
  - 'Suggestion: a slightly larger node size range would give the 15 nodes more presence
    against the long legend column.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 over x≈307-2894 of the 3200x1800 canvas; the outer side strips are transparent.
      Chrome: bold title 'hive-basic · python · letsplot · anyplot.ai' top-left of center, bold dark group labels Utility / Core / Interface at the axis tips, three elevated legend boxes on the right (Edge type, Connections (distance from center), Module type) with dark titles and INK_SOFT entries; all readable.
      Data: three straight grey axes at 0°/120°/240°; Core nodes in #009E73, Utility in #C475FD, Interface in #4467A3, sized and placed by degree with dark outlines; between-axis edges as translucent grey Bezier curves bending toward the center.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17 over the same span, same transparent side strips.
      Chrome: title and group labels light #F0EFE8, legend boxes #242420 with light text; no dark-on-dark text.
      Data: node and edge colors identical to the light render; node outlines and between-axis edges flip to light grey; brand green stays vivid.
      Legibility verdict: PASS
