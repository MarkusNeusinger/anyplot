review:
  strengths:
  - 'Rule-based placement: axis angle fixed by group order, radius by within-axis
    degree rank, named in a caption, so the same network always draws the same way'
  - Only between-axis edges are drawn as translucent quadratic curves, thin and light
    beneath outlined nodes
  - Theme tokens threaded through title, group labels, legend and caption; both renders
    fully legible
  - Coordinate limits fitted to the drawn extent and the legend placed below, so the
    fixed-aspect hive fills the square canvas
  weaknesses:
  - 'SC-02 (both): edges reach their end axis almost tangentially and run over the
    inner nodes of that axis (most visibly the Utility→Core and Interface→Core curves
    sliding along the Core axis), so which node an edge ends on cannot be read and
    C3''s traceable bands are only partly met → curves that arrive at an angle to
    the axis. Likely cause: the Bezier control point (sx+tx, sy+ty)*CURVE_PULL=0.15
    sits near the center, so each curve approaches its endpoint from the center along
    the axis direction.'
  - 'DQ-03 (both): the network has 15 nodes, below the spec''s 20-100 range → at least
    20 modules (+5 or more), keeping the axes balanced. Likely cause: module_info
    lists 5 Core, 6 Utility and 4 Interface modules.'
  - 'Suggestion: align the caption under the Module type legend block instead of offset
    to its right.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 over the whole 2400x2400 canvas
      Chrome: bold dark title 'hive-basic · python · letsplot · anyplot.ai' at top; bold dark group labels Utility (upper left), Core (right), Interface (lower left); 'Module type' legend in an elevated box below; grey caption 'Distance from the center: rank by connections within each axis' under it; all readable
      Data: three grey radial axis lines; 5 green #009E73 Core, 6 purple #C475FD Utility and 4 blue #4467A3 Interface nodes of equal size with dark outline; thin translucent grey curved edges between axes, converging onto the outer Core nodes
      Legibility verdict: PASS

