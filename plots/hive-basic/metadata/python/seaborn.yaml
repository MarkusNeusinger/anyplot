review:
  strengths:
  - Colored bold axis labels match their node group, so axis, nodes and legend read
    as one system in both themes
  - Legend title names the radial encoding ('Distance from center = degree (connections)')
  - sns.lineplot with units= and estimator=None draws all Bezier edges from one tidy
    frame
  - Per-group degree scaling via groupby().transform keeps positions rule-based and
    reproducible
  - Exact 2400x2400 canvas with theme-correct chrome in both renders
  weaknesses:
  - 'DQ-03 (code): the radial property is labeled ''Degree (connections)'' but its
    values are random integers 1-14 from rng.integers, while each node has only 1-4
    edges in df (M0 shows 4) → compute degree from the edge list so a node''s distance
    matches its drawn connections. Likely cause: DEGREE column filled with rng.integers(1,
    15, 30) instead of counting SOURCE/TARGET occurrences.'
  - 'Suggestion: the four within-group edges (M0–M1, M2–M3, M10–M11, M20–M21) run
    along their axis and are indistinguishable from it; dropping them or noting them
    would keep the plot to between-axis links.'
  - 'Suggestion: a slightly larger legend font (9–10 pt) would balance the 12 pt axis
    labels on the square canvas.'
  image_description: |-
