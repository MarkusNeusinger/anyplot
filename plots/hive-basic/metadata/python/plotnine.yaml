review:
  strengths:
  - Three straight radial axes from a common center, each labeled in bold in its own
    Imprint color
  - Nodes placed on their group axis by a stated rule with a caption naming the property,
    so the same data always draws the same way
  - Edges drawn as vectorized quadratic Bezier curves pulled toward the center, translucent
    and thinner than the nodes, so the core–utility and interface–core bands stay
    traceable
  - Node labels alternate sides of each axis and step outward in pairs, keeping most
    neighbours apart
  - Theme tokens threaded through title, caption, labels and background; both renders
    read cleanly
  - Idiomatic layered ggplot with per-layer data, scale_color_manual(limits=groups)
    preserving data order and coord_fixed
  weaknesses:
  - 'DQ-03 (both): the caption says distance from the center is the number of connections,
    but the hand-typed Degree column disagrees with the 30 drawn edges: core 9 vs
    3 edges (-6), engine 6 vs 1 (-5), kernel 5 vs 1 (-4), queue 4 vs 0 (-4), api 6
    vs 3 (-3), validator 5 vs 2 (-3) → compute the degree from the edges (count each
    module in Source and Target) so the radius matches the drawn network. Likely cause:
    the DEGREE list typed by hand in the nodes table (line 77).'
  - 'VQ-02 (both): the ''validator'' label runs into ''queue'' below it on the utility
    axis, and ''auth'', ''kernel'' and ''db'' sit against their own markers → clear
    each label from neighbouring labels and markers by a few px. Likely cause: label_offset
    0.05 is smaller than the largest marker radius and the 0.09 outward step lands
    validator and queue on one line.'
  - 'VQ-01 (both): node labels at geom_text size=5.5 come out about 6 pt (≈25 px tall
    at 2400 px) and shrink to about 4 px in the 400 px thumbnail, small against the
    10 pt caption → about size 7 (+1.5). Likely cause: geom_text(size=5.5).'
  - 'Suggestion: within-group edges (kernel–runtime, cache–logger, core–db) collapse
    onto their axis and almost disappear behind it; a lower alpha on the axis line
    would let them show.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, theme_void with no axes chrome.
      Chrome: bold near-black title 'hive-basic · python · plotnine · anyplot.ai' at the top; bold colored axis labels CORE (top), UTILITY (lower left), INTERFACE (lower right); grey caption 'Distance from the center = module degree (number of connections)' at the bottom; small dark node labels beside each node. All readable; node labels are small.
      Data: three straight axes at 90/210/330 degrees in #009E73, #C475FD, #4467A3; 21 nodes sized and placed by degree (core nodes spread along the upper axis, utility and interface nodes crowded at 0.4-0.7 radius); 30 translucent Bezier edges colored by source group, green bands core→utility, blue bands interface→core and interface→utility. 'validator' label touches 'queue'.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title in light #F0EFE8, caption in light grey, node labels light; axis labels keep their data colors. No dark-on-dark text.
      Data: identical axis, node and edge colors to the light render; edges read dimmer on the dark surface but remain visible.
      Legibility verdict: PASS
