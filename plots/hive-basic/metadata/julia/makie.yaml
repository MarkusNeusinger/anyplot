review:
  strengths:
  - Correct 3-axis hive-plot layout with reproducible position encoding via degree
    ranking, directly addressing the spec's 'solves the hairball problem' goal
  - Imprint palette correctly applied (green Core, lavender Utility, blue Interface),
    identical data colors across both themes
  - Clean minimal chrome (hidden spines/decorations, subtle structural axis reference
    lines) with correct theme-adaptive PAGE_BG/INK/INK_SOFT tokens in both renders
  - 'Idiomatic modern Makie API usage: `size` argument (not deprecated `resolution`),
    `DataAspect()` for a true radial layout, `axislegend`'
  weaknesses:
  - Radial position encodes node degree (low near center, high at tip) but nothing
    in the plot communicates this to the viewer — no tick marks, sub-label, or caption
    near the axes; add a small caption like 'position ∝ degree (center=low, tip=high)'
    or minor axis ticks
  - Edge density creates visual clutter in the base region between the Utility and
    Interface axes, where dozens of overlapping bezier curves converge — despite alpha=0.3
    transparency individual connections are hard to trace; consider lowering edge-inclusion
    probabilities slightly or adding curve offset/bundling to reduce crossing density
  - Edge weight, mentioned as an optional data field in the spec, is not visualized
    (e.g. via line width or opacity variation) — all edges use the same linewidth/alpha
    regardless of connection strength
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Bold dark title "hive-basic · julia · makie · anyplot.ai" centered at top, ~55-60% of plot width, fully readable. Legend top-left with three color swatches (Core/Utility/Interface) in dark ink text — readable. Axis tip labels ("Core", "Utility", "Interface") in dark ink, clearly legible against the light background. No axis ticks/decorations (intentionally hidden per hive-plot convention).
      Data: Three radial arms at 90°/210°/330° with 12 nodes each, colored by category — Core=brand green #009E73, Utility=lavender, Interface=blue — matching the Imprint palette with green as the first series. Nodes have a light stroke matching the page background, making them pop from the muted gray bezier-curve edges connecting cross-axis node pairs. Edge density is fairly high near the triangle's base (Utility–Interface), causing visual clutter there, but transparency (alpha=0.3) keeps it from becoming opaque.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Title, legend text, and axis tip labels all rendered in light ink (near-white), clearly legible against the dark background — no dark-on-dark issues observed. Legend swatches keep the same three colors as the light render.
      Data: Node and edge colors are visually identical to the light render (green/lavender/blue nodes, muted gray edges) — only the chrome (background, text ink) flipped, confirming theme-adaptive tokens were applied correctly. Brand green remains clearly visible on the dark surface.
      Legibility verdict: PASS
