review:
  strengths:
  - 'Correct, from-scratch hive-plot geometry: three balanced radial axes with degree-ordered
    node placement, solving the reproducibility problem the spec calls out'
  - Edge bundling via quadratic bezier curves toward the shared center, with appropriate
    alpha for density
  - Theme handling is flawless — data colors identical across light/dark, chrome correctly
    adapted, no legibility failures in either render
  - Deterministic fixed-seed LCG for reproducible synthetic data, no Math.random()
  weaknesses:
  - Excess empty space in roughly the top third of the square canvas before the triangle
    begins — consider raising cy / shrinking the top margin so the layout fills the
    canvas more evenly
  - Edges bundled toward the shared center create a moderately busy crossing zone;
    consider a slightly lower stroke-opacity or thinner stroke-width to keep the 'no
    hairball' value proposition crisp
  - No visual legend/scale for what node radius maps to (subtitle states it in words
    only) — a small size-legend would reinforce SC-02/DE-03
