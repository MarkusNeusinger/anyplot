review:
  strengths:
  - Genuine custom hive-plot geometry implemented via a Chart.js scatter chart plus
    a custom canvas plugin (quadratic bezier edges, manually computed radial axes)
    — real engineering rather than a templated chart type, faithful to the spec's
    reproducible/non-hairball requirement via a deterministic LCG.
  - Axis colors correctly follow the Imprint palette order (green/purple/blue), consistent
    between light and dark; all chrome (background, axis lines, labels, legend) is
    properly theme-adaptive with no dark-on-dark or light-on-light failures.
  - 'Node degree is encoded twice, reinforcing the key metric: rank-based position
    along each axis (avoids raw-value stacking collisions) and marker radius.'
  - Edge transparency (alpha=0.3) plus axis-colored curves keep ~85 cross-axis edges
    legible instead of collapsing into a hairball.
  - Deterministic LCG-seeded data generation gives full reproducibility, matching
    the spec's core motivation for choosing a hive plot over force-directed layouts.
  weaknesses:
  - 'The scatter scales are symmetric (x: -16..16, y: -16..16) but the hive geometry
    only spans y ≈ -6.9 to +13.8 (axis angles 90/210/330, R_MAX=11.5, LABEL_R=13.8),
    leaving roughly a third of the square canvas as dead blank margin below the Utility/Interface
    axis tips, before the legend. Rescale the y-domain asymmetrically (e.g. min ≈
    -9, max ≈ 15) or shift the axis-angle origin so the triangle is vertically centered
    and the canvas is used efficiently.'
  - 'Cross-axis edge color is taken only from the lower-index endpoint''s axis color
    (`color: a.axisColor`) rather than a symmetric treatment, a minor inconsistency
    in an otherwise well-handled density-of-edges treatment.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matching #FAF8F1 — not pure white.
      Chrome: Title "hive-basic · javascript · chartjs · anyplot.ai" in bold dark ink at top, clearly readable. Three bold axis labels ("Core" top, "Utility" bottom-left, "Interface" bottom-right) in dark ink, clearly legible. Thin gray radial axis lines from center to each label. Bottom legend with three swatches ("Core modules", "Utility modules", "Interface modules") in dark text, readable.
      Data: 12 nodes per axis, colored by axis (green #009E73 for Core, purple for Utility, blue for Interface — first series correctly uses the brand green). Node radius grows from small (near center, low degree) to large (near axis tip, high degree). Semi-transparent curved (bezier) edges connect nodes across different axes only, colored by the source node's axis color, forming a converging braid toward the plot center without becoming an unreadable hairball.
      Legibility verdict: PASS — all text (title, axis labels, legend) is clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, matching #1A1A17 — not pure black.
      Chrome: Same title, now in light/white ink, clearly readable. Axis labels ("Core", "Utility", "Interface") in light ink, legible. Axis lines rendered in a lighter gray appropriate for the dark surface. Legend text in light ink, readable.
      Data: Identical node and edge colors to the light render (same green/purple/blue palette, same edge curvature and node sizing) — only chrome (background, text, axis-line gray) flipped, confirming theme-adaptive tokens were threaded through correctly.
      Legibility verdict: PASS — no dark-on-dark failures; all title/axis-label/legend text remains clearly visible against the near-black background.
