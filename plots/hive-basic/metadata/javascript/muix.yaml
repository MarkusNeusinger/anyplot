review:
  strengths:
  - Genuine deterministic hive-plot layout with degree-based radial node ordering
    (not force-directed), matching the spec's core reproducibility requirement
  - Correct Imprint palette order (brand green / lavender / blue for Core / Utility
    / Interface) with theme-adaptive chrome that stays legible in both light and dark
    renders
  - Creative, correct use of MUI X's community useXScale/useYScale hooks to build
    a custom SVG overlay (axis spokes + bezier edge curves) precisely aligned with
    the ScatterPlot markers -- a chart type MUI X has no native support for
  - 'Clean, minimal code: seeded LCG for reproducibility, no unused imports, no fake
    interactivity, correct harness contract (default export, skipAnimation, sized
    to window.ANYPLOT_SIZE)'
  weaknesses:
  - Significant unused vertical whitespace above the Core axis and below the Utility/Interface
    baseline -- the triangular layout only fills roughly 65-70% of the square canvas
    height; increase OUTER_R or tighten the Y-domain padding (LABEL_R multiplier /
    HALF_SPAN factor) so the triangle fills more of the frame
  - Edge weight, mentioned as optional in the spec's edges field, isn't encoded --
    all curves render at the same stroke width and opacity regardless of connection
    frequency; varying stroke width/opacity by weight would add a data dimension
  - Visual hierarchy is fairly flat -- degree-based node ordering is present but not
    visually reinforced (e.g. scaling marker size by degree, or emphasizing the most-connected
    nodes) to strengthen the data storytelling
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1-consistent), not pure white, not dark.
      Chrome: Title "hive-basic · javascript · muix · anyplot.ai" centered at top in dark ink, clearly legible. Three bold axis category labels ("Core", "Utility", "Interface") in dark ink at the tip of each spoke, all legible against the light background. No tick labels or grid lines are present (axes are hidden by design; only the hand-drawn spokes and labels show), so there is nothing else to check for legibility.
      Data: Three node axes fan out from a shared hub: Core (top, brand green #009E73 markers), Utility (bottom-left, lavender/purple markers), Interface (bottom-right, blue markers) -- matching the canonical Imprint categorical order (green, lavender, blue). Gray bezier-curved edges connect nodes across axes with partial transparency, bundled densely near the hub and fanning out toward the rims, readable as a network without one continuous solid mass. Markers are circular, uniform size, clearly distinguishable from the curved gray edges beneath them.
      Legibility verdict: PASS -- all title/axis-label text is dark-on-light and clearly readable; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17-consistent), not pure black, not light.
      Chrome: Same title and axis labels, now rendered in light/white ink, clearly legible against the dark background. No dark-on-dark text anywhere -- ink correctly flipped for the theme.
      Data: Node and edge colors are identical to the light render (brand green Core, lavender Utility, blue Interface, gray edges) -- only the chrome (background, text, edge-line brightness) adapted to the dark surface, confirming data-color consistency across themes as required.
      Legibility verdict: PASS -- all text is light-on-dark and clearly readable; no dark-on-dark failures observed.
