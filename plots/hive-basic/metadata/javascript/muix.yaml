review:
  strengths:
  - 'Faithful hive plot: three straight axes from a common hub, each labelled with
    its group, node count and degree range, with a caption naming degree as the radial
    property'
  - Edges are quadratic curves routed through the hub between axis pairs, thin and
    translucent with width and opacity graded by dependency weight, so the bands between
    axes stay traceable
  - 'v9 composition idiom: ChartsContainer + ScatterPlot for the nodes plus a custom
    SVG layer that reads useXScale/useYScale, keeping native scatter tooltips and
    highlighting in the HTML'
  - 'Theme tokens threaded through every element: chrome flips cleanly while Core
    #009E73 and the other Imprint colors stay identical in both renders'
  - Deterministic layout from a fixed-seed LCG and a degree-ordered placement rule,
    so the same network always draws the same way
  weaknesses:
  - 'DQ-03 (both): the caption reads ''radial distance encodes node degree (2 → 8)'',
    but nodes are spaced evenly by degree rank, so equal degrees sit at different
    radii and Utility''s 2→6 spans the same length as Core''s 2→8 → either place nodes
    at a radius linear in degree, or say ''degree rank'' in the caption and axis notes.
    Likely cause: r = INNER_R + (i / (ordered.length - 1)) * (OUTER_R - INNER_R) on
    the sorted index (lines 167-176).'
  - 'CQ-04 (code): HiveNode.weightSum (lines 118, 131, 145, 149) and AXES[].index
    (line 105) are computed but never read → delete both. Likely cause: leftovers
    from an earlier sizing approach.'
  - 'Suggestion: render the header legend with the community <ChartsLegend /> instead
    of hand-built HTML dots, to showcase MUI X''s own legend.'
  - 'Suggestion: give the scatter series a valueFormatter so the HTML tooltip shows
    the module id and degree instead of raw x/y layout coordinates.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, not pure white.
      Chrome: dark bold title "hive-basic · javascript · muix · anyplot.ai" centered at top; monospace caption "32 nodes across 3 axes (Layer) · 72 edges · radial distance encodes node degree (2 → 8)" in ink-soft; a centered legend Core / Utility / Interface with colored dots. Axis labels "Core (12) / degree 2→8" at top, "Utility (10) / degree 2→6" bottom-left, "Interface (10) / degree 2→8" bottom-right, all dark and readable.
      Data: three dark-grey axis spokes at 90°, 210°, 330° with an open hub; 12 green #009E73 Core nodes, 10 purple Utility nodes, 10 blue Interface nodes evenly spaced along their axes; 72 grey translucent quadratic-curve edges between all three axis pairs, width/opacity graded by weight, drawn under the nodes.
      Legibility verdict: PASS

