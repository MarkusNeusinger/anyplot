review:
  strengths:
  - Reproducible, deterministic radial layout (fixed-seed LCG) with node position
    along each axis meaningfully encoding degree, exactly matching the spec's requirement
    that a hive plot always render the same network identically
  - Doubled degree encoding (radial position + halo glow radius) gives an at-a-glance
    read of network centrality
  - Bezier-curved cross-axis edges (bowing through a bisecting control angle) read
    as gentle strands rather than straight hairball chords
  - Correct Imprint palette order and fully theme-adaptive chrome, verified legible
    at both desktop and mobile (400px) scale, in both light and dark
  - Idiomatic, advanced MUI X pattern (useXScale/useYScale custom overlay) - the officially
    recommended technique for building visuals beyond the library's stock chart types
  weaknesses:
  - Edge weight (an optional data field the spec calls out) isn't visualized - every
    edge shares the same stroke width/opacity regardless of connection strength; encoding
    it (e.g. via stroke width or opacity) would add another readable data dimension
  - The Utility<->Interface edge weave crowds noticeably near the hub, making individual
    connections a bit harder to trace than the Core-facing strands - a slightly larger
    CONTROL_R or lower max opacity would ease this
  - Several small geometry helper functions push past a minimal flat script, though
    this is reasonably justified by the custom radial-layout math a hive plot requires
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 target.
      Chrome: Title "hive-basic · javascript · muix · anyplot.ai" centered at top in dark ink; "Core"/"Utility"/"Interface" axis-spoke labels in dark bold text at the tip of each spoke. All clearly readable, including at a 400px mobile-scale render.
      Data: 3-axis hive plot. Core spoke (up) has 12 green (#009E73) nodes, Utility spoke (down-left) has 10 lavender (#C475FD) nodes, Interface spoke (down-right) has 10 blue (#4467A3) nodes. Nodes ordered along each spoke by degree (low near hub, high at rim), each with a degree-proportional soft halo. Thin semi-transparent curved edges connect nodes across axis pairs only, bowing through bisecting control points.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 target.
      Chrome: Same title and axis-spoke labels now rendered in light ink; fully legible against the dark background, no dark-on-dark failures anywhere (including halo glows, which remain visible).
      Data: Node colors, halo sizing, ordering and edge structure are pixel-identical to the light render - only chrome (background/text/spoke lines) flipped as required.
      Legibility verdict: PASS
