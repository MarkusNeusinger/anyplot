review:
  strengths:
  - 'Composes MUI X v9 idiomatically: a ChartsContainer with a native ScatterPlot
    for the nodes and a custom SVG layer (HiveGeometry) that reads useXScale/useYScale,
    so edges and spokes share the chart''s coordinate system and the HTML keeps MUI''s
    native scatter tooltips for every node'
  - 'True hive-plot geometry: three straight spokes from a common center at 90/210/330
    degrees, nodes on the axis of their layer ranked outward by degree, and quadratic
    Bezier edges whose control point sits near the hub on the bisector of the two
    axes, so connection bands stay traceable'
  - Edge stroke width and opacity scale with dependency weight (1.1-2.2 px, 0.25-0.47
    alpha) in the theme's inkSoft, thinner and lighter than the saturated nodes in
    both themes
  - 'Clear typographic hierarchy: bold axis titles with node counts, a monospace per-axis
    caption naming the encoding and its range (ranked by degree 2-8), and a monospace
    summary line under the mandated title'
  - Aspect-preserving domain fit computes margins from the content extents so the
    radial shape is not distorted on the square canvas
  - 'Imprint palette in canonical order (Core #009E73, Utility #C475FD, Interface
    #4467A3), identical across themes, with theme tokens on all chrome'
  weaknesses:
  - 'DQ-02 (code): the module ids are generic placeholders ''Core-1'' ... ''Core-12'',
    ''Utility-1'' ... ''Interface-10'', which the HTML tooltips show for every node
    → real-sounding module names per layer (e.g. ''scheduler'', ''cache'', ''logger'',
    ''rest-api'', ''cli''). Likely cause: the `${layer.label}-${i + 1}` id template
    in the node-generation loop.'
  - 'Suggestion: the header legend repeats what the bold axis titles already say;
    MUI''s own ChartsLegend could replace the hand-built HTML legend, or it could
    be dropped.'
  - 'Suggestion: placing nodes at their degree value rather than their degree rank
    would let tied-degree nodes share a radius and show the degree spread directly.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, square 2400x2400.
      Chrome: centered bold title "hive-basic · javascript · muix · anyplot.ai" (~35% of width), monospace subtitle "32 nodes across 3 axes (Layer) · 72 edges · nodes spaced outward by degree rank (degree 2 → 8)", a three-entry dot legend (Core, Utility, Interface). Axis titles "Core (12)", "Utility (10)", "Interface (10)" in bold dark ink with monospace captions "ranked by degree 2→8 / 2→6 / 2→8". All text dark and readable; nothing clipped (Utility caption sits ~50 px from the left edge, fully visible).
      Data: three dark-gray spokes from a common center (Core up, Utility lower-left, Interface lower-right); 12 green #009E73 Core nodes, 10 purple #C475FD Utility nodes, 10 blue #4467A3 Interface nodes evenly spaced along their spokes; 72 gray translucent quadratic-curve edges, width/opacity by weight, bowing toward the hub; dense fans at the outer (high-degree) nodes.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, legend labels and axis titles in light ink, captions in light-gray inkSoft; spokes light gray. No dark-on-dark text; all readable.
      Data: node colors identical to the light render (#009E73, #C475FD, #4467A3); edges in the light inkSoft token at the same translucency, clearly visible but subordinate to the nodes.
      Legibility verdict: PASS
