review:
  strengths:
  - 'Correct hive-plot geometry: axis reach and center are derived from the actual
    axis angles (topFactor/bottomFactor/leftFactor/rightFactor), not an assumed symmetric
    circle, so margins stay even for the up + down-left/down-right triangle layout.'
  - Rank-based (not raw-degree) radial placement guarantees even node spacing along
    each axis regardless of the underlying degree distribution, avoiding marker overlap.
  - Edges are bezier-bundled toward the hub with both opacity and stroke width driven
    by edge weight, and node radius is driven by degree — two extra data dimensions
    encoded without adding chart junk.
  - Correct Imprint palette (green/lavender/blue matches canonical order 1/2/3), correct
    theme-adaptive chrome in both renders, and the square orientation directive matches
    the actual 2400x2400 output.
  - Dashed halo ring around the highest-degree node on each axis gives the plot a
    clear analytical focal point (the axis's 'hub' module).
  weaknesses:
  - The bundle of green Core-axis edges converges densely near the apex, partly obscuring
    individual low-weight edges — sorting edge draw order or endpoint angle offsets
    by target could reduce visual crossing in that zone.
  - Several small helper functions (circularMean, nodeRadius, toXY) sit alongside
    the renderItem callbacks required by echarts' custom-series API — most are necessary
    for the geometry, but circularMean/nodeRadius could be inlined to shrink the KISS
    surface slightly.
  - The hub-highlight dashed ring is subtle at normal zoom (thin 1.5px dashed stroke)
    — a slightly heavier stroke or brighter accent would sharpen the storytelling
    focal point.
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white, matches #FAF8F1, not pure white.
      Chrome: title "hive-basic · javascript · echarts · anyplot.ai" is bold dark text, clearly readable near the top; the three axis labels "Core" (top), "Interface" (bottom-left), "Utility" (bottom-right) are dark, bold, and legible; the bottom legend ("Core modules" / "Utility modules" / "Interface modules") uses medium-gray text with color swatches, clearly readable against the light background.
      Data: three radial axes form an inverted triangle. Along "Core" (top) sit 14 green (#009E73) nodes evenly spaced by rank; along "Interface" (bottom-left) sit 14 dark-blue (#4467A3) nodes; along "Utility" (bottom-right) sit 14 lavender/purple (#C475FD) nodes. Curved bezier edges connect nodes across axes, bowed toward the center hub, with opacity and thickness scaling by edge weight. Each axis's highest-degree node (at the outer tip) has a thin dashed halo ring in its own axis color. First categorical series (Core) is confirmed #009E73.
      Legibility verdict: PASS — all text (title, axis labels, legend) is clearly readable against the light surface; no light-on-light text.

    Dark render (plot-dark.png):
      Background: warm near-black, matches #1A1A17, not pure black.
      Chrome: title is light/off-white text, clearly readable; axis labels "Core", "Interface", "Utility" are light-colored and legible; legend text at the bottom uses a lighter gray, readable against the dark background.
      Data: identical geometry and node/edge colors to the light render — green Core nodes, dark-blue Interface nodes, lavender Utility nodes, same bezier edge bundling and hub halo rings. Data colors are unchanged between renders; only chrome (background, text, grid lines) flipped to the dark theme.
      Legibility verdict: PASS — no dark-on-dark failures; all title, axis-label, and legend text is clearly visible against the near-black surface.
