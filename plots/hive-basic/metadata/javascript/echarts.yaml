review:
  strengths:
  - 'Correct hive-plot construction: 3 balanced radial axes (14 nodes each), node
    radius scaled by degree, and radial rank position encoding degree — reproducible
    and structurally meaningful, matching the spec''s intent precisely (vs. a hairball
    force-directed layout).'
  - Bezier-curved edges bowed toward the shared center, with weight-driven line width
    and opacity — a proper hive-plot edge convention that keeps dense connections
    legible.
  - Correct Imprint palette (green/purple/blue for the 3 axis categories), consistent
    and theme-correct between light and dark renders, including tooltip and axis-line
    chrome.
  - Deterministic, seeded, realistic software-dependency-network data with balanced
    category sizes, matching the spec's data guidance.
  - Correct title format, functioning legend, and no edge clipping in either render.
  weaknesses:
  - 'Axis category labels ("Core", "Utility", "Interface") are set to fontSize: 22
    with fontWeight: 600, the same size as the title — this makes them visually compete
    with, and at a glance outweigh, the title''s hierarchy. Reduce to roughly 16-18px
    to keep the title as the clear visual anchor.'
  - 'Design Excellence has room to grow: consider a subtle rank/degree guide (thin
    concentric tick marks along each axis) or a highlight on the highest-degree "hub"
    node per axis to sharpen the data storytelling.'
  - Several helper functions (toXY, circularMean, addEdge) add structure beyond the
    strict KISS ideal — understandable given ECharts' custom-series requirements,
    but worth keeping in mind if further simplification is possible.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 (not pure white, not dark).
      Chrome: Bold black title "hive-basic · javascript · echarts · anyplot.ai" centered at top; bold axis category labels ("Core", "Utility", "Interface") near each axis tip; three-item legend ("Core modules", "Utility modules", "Interface modules") at the bottom. All chrome text is dark and clearly readable against the light background.
      Data: Nodes colored by axis category — green (#009E73) for Core, purple/lavender (#C475FD) for Utility, blue (#4467A3) for Interface — first categorical series is confirmed brand green. Node circle size scales with degree; bezier-curved edges bowed toward the shared center are colored by source axis with weight-driven width/opacity.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 (not pure black, not light).
      Chrome: Same title, axis labels, and legend, all flipped to light-colored text against the dark background. No dark-on-dark failures observed for title, axis labels, or legend.
      Data: Node and edge colors (green/purple/blue) are pixel-identical to the light render — only the chrome (text, axis lines, tooltip styling) flips. Confirms only chrome, not data colors, is theme-adaptive.
      Legibility verdict: PASS
