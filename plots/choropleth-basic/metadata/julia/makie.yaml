review:
  strengths:
  - Well-engineered, clearly documented tile-grid workaround for CairoMakie's lack
    of native geographic-projection support — a legitimate technique (NPR-style state
    tile-grid map), not a fake/simulated fallback
  - 'Correct imprint_seq sequential colormap (#009E73 → #4467A3) for single-polarity
    continuous data, unchanged between themes'
  - Explicit missing-data handling (MT, SD, WY) exactly as the spec requests, rendered
    as distinct gray tiles
  - Clean minimalist chrome (hidedecorations!, hidespines!), generous tile gaps, well-labeled
    colorbar with units
  - Correct canvas size (3200×1800), correct title format, reproducible via Random.seed!(42)
  weaknesses:
  - 'Dark-theme tile-label contrast bug: text_color for data tiles uses the theme-adaptive
    ELEVATED token, which flips to a near-black #242420 in dark mode. Since data tiles
    keep the same green/blue fill in both themes, this produces dark text on colored
    tiles across nearly all ~47 data tiles in the dark render, with measured contrast
    as low as ~2.8:1 (well below WCAG AA''s 4.5:1, and below even the 3:1 large-text
    minimum on the darkest blue tile). Fix: use a fixed, theme-invariant light ink
    for the non-missing-data text branch instead of ELEVATED.'
  - 'Data storytelling is weak: renewable-energy share is assigned uniformly at random
    per state with no geographic clustering, so the map doesn''t communicate a real
    regional pattern — consider adding mild spatial correlation for a more meaningful
    visual story.'
  - Values are plausible in range but assigned randomly per state, so they don't track
    real-world facts (e.g. a coal-heavy state can randomly land in the high-share
    range) — consider a light disclaimer or mild real-world-informed bias.
  - Choropleth uses a schematic tile-grid layout rather than true geographic polygon
    boundaries / map projection (Robinson, Albers) that the spec's Notes suggest —
    a legitimate, documented substitute given CairoMakie's lack of GeoMakie/shapefile
    support in this runtime, but it misses the geographic-boundary variant.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1.
      Chrome: Title "choropleth-basic · julia · makie · anyplot.ai" in bold dark ink, clearly readable. Colorbar label "Renewable Energy Share (%)" and tick labels (20-80) in dark/soft-dark ink, clearly readable.
      Data: Schematic US state tile-grid map. Tiles filled via imprint_seq gradient (#009E73 green -> #4467A3 blue) mapped to renewable-energy-share values. Three "no data" states (MT, WY, SD) rendered as muted gray tiles with dark ink labels. State-abbreviation labels on data tiles use light/cream ink, clearly legible against the colored fills.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17.
      Chrome: Title and colorbar label/ticks are light-colored and clearly readable against the dark background.
      Data: Same tile-grid layout; data colors (green->blue gradient) are identical to the light render, confirming color consistency across themes. The three "no data" gray tiles correctly use dark ink on their light-gray fill and remain legible.
      Legibility verdict: FAIL - the ~47 data-tile state-abbreviation labels render in dark near-black ink (#242420, from the theme-flipped ELEVATED token) on top of the colored (teal/blue/green) tiles instead of switching to light ink. Measured WCAG contrast ratios: ~2.8:1 on the darkest blue tile (VT), ~3.7:1 on mid-teal tiles (WA) - both below the 4.5:1 AA body-text threshold, the blue tile even fails the 3:1 large-text minimum. This is a genuine dark-theme-only legibility defect affecting nearly every state label in the dark render.
