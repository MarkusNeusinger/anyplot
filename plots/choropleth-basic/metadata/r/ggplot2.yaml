review:
  strengths:
  - 'Correct imprint_seq gradient (#009E73 → #4467A3) for the sequential renewable-share
    data, identical data colors across both themes'
  - Missing data (Guyana) is handled gracefully with a distinct gray tile plus an
    explicit caption, exactly matching the spec's 'handle missing data gracefully'
    note
  - Exact canvas compliance (2400×2400 verified) and correct theme-adaptive chrome
    (background, ink, legend frame) in both renders
  - Clever schematic unit-tile mosaic preserves real relative country adjacency using
    only native geom_tile(), staying within ggplot2's documented no-sf/no-ggmap constraint
    instead of faking a workaround via another library
  - 'Realistic, domain-plausible data: Paraguay ~100% and Uruguay ~94% renewable electricity
    (both are real near-100% hydro-dominant grids), Brazil 85% is directionally accurate'
  - Clean, idiomatic ggplot2 code with correct ragg-based save contract and no unused
    imports
  weaknesses:
  - The plot reads as an abstract grid mosaic of same-size squares rather than a recognizable
    map — no coastline/border silhouette or projection, so a reader unfamiliar with
    the ISO codes may not immediately parse it as 'South America'. This is close to
    ggplot2's practical ceiling given the no-sf/no-ggmap rule, but a subtle outline
    or caption cue reinforcing the map reading would help
  - 'Design Excellence is only moderate: uniform tile sizes, single font weight, and
    no additional visual hierarchy beyond the color gradient itself — limits DE-01/DE-02'
  - 'Library Mastery is generic: geom_tile + scale_fill_gradient are common patterns;
    nothing showcases a more distinctive ggplot2-specific feature beyond the workaround
    itself'
  - Only 12 regions shown, which is valid but sits at the low end of the spec's 10–200
    range; a larger region set would better demonstrate DQ-01 feature coverage
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Title "choropleth-basic · r · ggplot2 · anyplot.ai" in dark ink, top-left, clearly legible. No axis titles/ticks (appropriate for a map). Bold black country-code labels (VE, GY, SR, CO, EC, PE, BR, BO, PY, UY, CL, AR) sit on top of each colored tile and are readable against every fill color, including the light-green and gray tiles. Legend box (top-right, off-white/near-white elevated background with a soft ink border) titled "Renewable share of electricity" with tick labels 40%/60%/80%/100% in dark/soft-ink text. A muted gray caption below the mosaic reads "Gray tile: data unavailable (Guyana)".
      Data: A grid mosaic of squares shaped to preserve South America's country adjacency (Venezuela/Guyana/Suriname along the top, Brazil as the large central-east mass, the Andean chain down the west side, Argentina/Chile at the bottom). Fill colors run from green (~30-40%) through teal/blue (~60-85%) to indigo-blue (~94-100%) per the imprint_seq gradient; Guyana is a flat gray tile marking missing data.
      Legibility verdict: PASS — all text (title, country codes, legend, caption) is clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Same title now in light/off-white ink, fully legible. Country-code labels are now white/light bold text on each tile, still clearly readable against every fill color including the gray Guyana tile. Legend box now uses the dark elevated background (~#242420) with a soft border, legend title/tick text rendered in light ink — fully readable. Caption text is a muted light-gray, readable against the dark background.
      Data: Identical mosaic layout and identical fill colors to the light render — the green-to-blue imprint_seq gradient and the gray missing-data tile are unchanged; only the chrome (background, text, legend frame) flipped to the dark tokens.
      Legibility verdict: PASS — no dark-on-dark failures; every label, the title, the legend, and the caption remain clearly visible against the near-black background.
