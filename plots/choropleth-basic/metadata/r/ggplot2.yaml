review:
  strengths:
  - 'Creative, honest solution to ggplot2''s lack of native geographic support: a
    schematic unit-tile mosaic built purely with geom_tile() that preserves real relative
    adjacency, transparently labeled as ''schematic ... not to scale'' rather than
    faking real boundaries'
  - 'Sequential imprint_seq gradient (#009E73 -> #4467A3) correctly chosen for the
    single-polarity renewable-share metric, with theme-adaptive chrome (background,
    ink, legend box) verified identical data colors across both light and dark renders'
  - Missing data (Guyana) handled gracefully with a distinct muted gray tile plus
    an explicit caption callout, matching the spec's 'handle missing data gracefully'
    requirement
  - 'Realistic, well-researched data: renewable electricity shares per South American
    country (Paraguay ~100% hydro, Uruguay ~94%, Argentina ~30% gas-heavy, etc.) align
    closely with real-world figures'
  - Clean theme-adaptive implementation with explicit font sizes throughout (title
    formula, subtitle, caption, legend, tile labels) and no clipping or overlap issues
    in either theme
  weaknesses:
  - 'Not a true geographic choropleth: no real region boundaries or map projection
    (e.g. Robinson/Albers) as suggested in the spec notes — the schematic tile-mosaic
    is a reasonable native-ggplot2 substitute but caps Spec Compliance (Plot Type)'
  - A few centroid labels (notably VE, CO) land on the boundary between two tiles
    rather than centered within a single tile, since country cells span an odd number
    of rows/columns — purely cosmetic, doesn't break legibility given the similar
    tile colors
  - Legend cluster leaves a visible empty margin on the canvas's right edge relative
    to the irregular map shape on the left — minor canvas-balance opportunity, not
    a defect
  - Anonymous lambda inside lapply() for cell_list -> tibble conversion adds a touch
    more structural complexity than the pure Imports -> Data -> Plot -> Save ideal,
    though it's justified by the tile-mosaic technique
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Title "choropleth-basic · r · ggplot2 · anyplot.ai" in dark ink, centered, ~60% of canvas width. Subtitle in medium-gray ink below it explains the schematic nature. Caption at the bottom (also medium/muted gray) calls out highest/lowest countries and the gray-tile convention. Legend box on the right has a light elevated background with a dark border, dark title "Renewable share of electricity", and gray tick labels (100%/80%/60%/40%). All text is clearly readable against the light background — no light-on-light issues.
      Data: Country tiles form a schematic mosaic shaped like South America, colored on a green (#009E73, low value) to blue (#4467A3, high value) sequential gradient. Guyana is a distinct flat gray tile (missing data). Bold dark country-code labels (VE, CO, EC, PE, BR, BO, PY, CL, AR, UY, SR) sit on their tiles and are legible against the medium-toned fills.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Same title/subtitle/caption/legend layout, all now rendered in light ink (#F0EFE8 primary, lighter grays for subtitle/caption/legend text) against the dark background. Legend box uses the dark elevated background (#242420) with a light-gray border. No dark-on-dark issues detected anywhere.
      Data: Identical green-to-blue gradient tile colors and gray Guyana tile as the light render — confirmed the same underlying data hues, only the chrome (background, text, legend box, borders) flipped. Country-code labels are now light/white and remain legible on the same-toned tiles.
      Legibility verdict: PASS
