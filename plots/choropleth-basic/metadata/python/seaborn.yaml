review:
  strengths:
  - Continuous values use the imprint_seq ramp with a matching colorbar (0–5 %), and
    the fills are identical in both themes while only the chrome flips
  - Missing regions (DC, PR) are drawn in a muted gray with /// hatching and explained
    by a 'No data' legend entry, clearly distinct from every color of the scale in
    both renders
  - Region boundaries come from sns.heatmap's linewidths/linecolor=PAGE_BG gutters,
    thin and quiet, so neighbours of similar shade stay separate in both themes
  - 'Theme tokens are threaded through every text element: title, colorbar ticks and
    label, legend and caption are all readable on #FAF8F1 and #1A1A17'
  weaknesses:
  - 'SC-01, SC-02 (both): the regions are equal-size squares on a tile grid, not filled
    areas with their real outlines in a map projection (the spec''s first ''A good
    version shows:'' bullet and the Notes'' projection bullet) → draw the real state
    polygons (e.g. a bundled US states GeoJSON/shapefile plotted with matplotlib patches
    or geopandas on the seaborn-themed axes) in an Albers Equal Area projection. Likely
    cause: sns.heatmap on a row/column pivot used as a stand-in for a map.'
  - 'SC-01 (both): every tile carries a value label (''3.2%'') and the axes carry
    a caption line (''GDP growth rate (%) by state · tile grid map …''); the basic
    variant allows plain region name labels only → keep the state codes, drop the
    value text and the caption. Likely cause: the second ax.text in the label loop
    and the ax.text at y=-0.04.'
  - 'DQ-02 (both): real US state names carry invented GDP growth rates (e.g. UT 4.5
    %, WV 0.5 %) → use a fictional or clearly synthetic region set, or published values
    for the real states. Likely cause: the hand-typed states list.'
  - 'VQ-01 (both): the 6 pt per-tile value labels shrink to about 4 px in the 400
    px thumbnail and cannot be read there → remove them (see SC-01 line) or, if kept,
    at least 8 pt (+2 pt). Likely cause: fontsize=6 on the value ax.text.'
  - 'VQ-05 (both): the map fills only the middle ~65 % of the canvas height, leaving
    about 15 % empty above the title and 10 % below the caption → let the map grow
    to fill the vertical space. Likely cause: square=True on a 6×14 grid caps the
    axes height inside subplots_adjust(top=0.9, bottom=0.08).'
  - 'CQ-04 (code): IMPRINT_PALETTE is defined but never used, and cbar.set_label repeats
    the label already passed in cbar_kws → delete the unused constant and pass the
    label once. Likely cause: leftover template lines.'
  - 'Suggestion: a colorbar spanning the data range (0.4–4.5) rather than rounded
    0–5 would use more of the ramp.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the full canvas.
      Chrome: title "choropleth-basic · python · seaborn · anyplot.ai" dark ink at top centre; vertical colorbar on the right labelled "GDP growth rate (%)" with ticks 0–5 in soft dark gray; "No data" legend box with hatched gray swatch at lower right; caption "GDP growth rate (%) by state · tile grid map, one equal-size tile per region" below the map. All readable.
      Data: 52 equal-size square tiles arranged in an approximate US layout (AK, HI bottom-left), filled on the imprint_seq ramp from #009E73 green (low, e.g. AK 0.4 %, WV 0.5 %) to #4467A3 blue (high, UT 4.5 %); page-colored gutters between tiles; each tile shows a bold white state code and a 6 pt white value; DC and PR hatched gray with dark "n/a".
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, colorbar label and caption flip to light ink; colorbar ticks light gray; legend frame light gray on dark elevated fill. No dark-on-dark text.
      Data: tile fills identical to the light render; gutters now near-black; no-data tiles darker gray hatching with light "n/a" text.
      Legibility verdict: PASS
