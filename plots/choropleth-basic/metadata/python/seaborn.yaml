review:
  strengths:
  - Real 2020 US Census population densities for all 50 states and DC, with Puerto
    Rico in the outlines but not in the table, so the no-data style shows up in a
    real case
  - 'Composite Albers Equal Area projection: the lower 48 on standard parallels 29.5/45.5,
    with Alaska, Hawaii and Puerto Rico each projected on their own parameters and
    moved into place (Aleutians across the antimeridian handled)'
  - LogNorm on imprint_seq lets a variable spanning four orders of magnitude read
    as a West (green) to Northeast corridor (blue) gradient instead of one dark DC
    and a flat rest
  - Region boundaries are drawn as 0.4 pt page-colored gaps, so neighbors stay separate
    in both themes without competing with the fills
  - No-data regions are hatched muted gray with their own legend entry, distinct from
    every color of the green-blue ramp
  - State codes placed at the interior point farthest from the outline, and only on
    parts large enough to hold them, so no code crosses a border
  - Colorbar without an outline, with zero-length ticks and thousand-separated labels
    (10 to 10,000), labelled with the variable and its unit
  weaknesses:
  - 'CQ-01 (code): the projection is a helper function `albers(...)` (about 10 lines)
    when the rubric asks for a flat Imports → Data → Plot → Save script → inline the
    projection math in the ring loop (or as a module-level expression applied to each
    ring) and remove the `def`. Likely cause: the `def albers(lon, lat, lon0, lat0,
    p1, p2, scale, shift)` block.'
  - 'Suggestion: DC (11,280 per sq mi) sets the top of the log scale but is too small
    to see, so the visible states use only about the lower three quarters of the ramp.
    Capping the colorbar near the highest visible state, with an extend arrow, would
    spread the ramp across the states a reader can actually see.'
  - 'Suggestion: the ''No data'' legend sits in the lower-right corner, far from Puerto
    Rico. Placing it closer to the Puerto Rico inset would tie the swatch to the region
    it explains.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, not pure white.
      Chrome: the title "choropleth-basic · python · seaborn · anyplot.ai" is dark ink, centered at the top and about 50 % of the width. On the right is a vertical colorbar (log scale, ticks 10 / 100 / 1,000 / 10,000 in INK_SOFT) labelled "Population density (people per sq mi)". A framed "No data" legend with a hatched gray swatch sits in the lower right. No axes, by design. All text is readable.
      Data: a US Albers Equal Area map of the lower 48 with Alaska and Hawaii insets at the lower left and Puerto Rico at the lower right. Fills run on imprint_seq from brand green #009E73 (AK, WY, MT, ND, SD) to blue #4467A3 (NJ, RI, MA, CT, MD). Boundaries are thin off-white lines. Puerto Rico is hatched gray (no data). Bold white state codes sit inside the larger states. The small Northeast states are unlabelled.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17, not pure black.
      Chrome: the title, the colorbar label and the legend text flip to light ink (#F0EFE8), and the tick labels to light gray INK_SOFT. The legend frame is light gray on the dark elevated surface. There is no dark-on-dark text anywhere.
      Data: the fills are the same green-to-blue ramp as in the light render, unchanged. Boundaries are now thin near-black page-colored gaps, still clearly separating neighbors. The Puerto Rico hatch is a dimmer gray but distinct from the ramp. White state codes read well on the fills.
      Legibility verdict: PASS
