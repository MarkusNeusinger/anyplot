review:
  strengths:
  - LogColorMapper with nan_color feeds a log-scaled ColorBar, so the three-decade
    density range reads on one bar and DC's gray is explained by the map itself
  - 'Theme tokens threaded through title, color-bar title, ticks and backgrounds:
    both renders are readable'
  - Label ink chosen per tile from the fill's luminance, so every state code stays
    legible
  - Real US state population densities with DC left out on purpose to show the no-data
    style
  - imprint_seq ramp built as the library prompt prescribes; correct 3200x1800 canvas
    with the Selenium + CDP save pattern
  weaknesses:
  - 'SC-01, SC-02 (both): the states are drawn as equal squares on a tile grid (a
    tile cartogram), not as filled areas with their real outlines in a projection
    suited to the US such as Albers Equal Area, which the spec''s first characteristic
    bullet and its projection Note ask for → draw the state boundary polygons (patches/multi_polygons
    from a GeoJSON source, projected) shaded by value. Likely cause: the rect glyph
    on (Tile column, Tile row) positions instead of p.patches/p.multi_polygons on
    projected state geometries.'
  - 'Suggestion: the dark render shows a faint gray frame around the plot area that
    the light render does not; setting the frame line explicitly to the page color
    would keep both themes identical.'
  - 'Suggestion: a HoverTool showing state and density would make the HTML view more
    useful; the source already carries the value column.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole 3200x1800 canvas.
      Chrome: centered bold title 'choropleth-basic · python · bokeh · anyplot.ai' in dark ink; no axes or grid; vertical color bar on the right with italic title 'Population density (people per sq mile)' and log ticks 10^0..10^3 in soft dark ink, all readable.
      Data: 51 US states as equal squares on a geographic tile grid (AK top-left, HI bottom-left, New England right), filled from the imprint_seq ramp: low-density states (AK, WY, MT) in brand green #009E73, dense states (NJ, RI, MA, MD) in blue toward #4467A3. Bold dark two-letter codes in every tile. DC is a gray no-data tile. Thin page-colored gaps separate neighbours.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, color-bar title and ticks flip to light ink and read clearly; a faint gray frame outlines the plot area. No dark-on-dark text: the state codes stay dark on the mid-tone tiles.
      Data: tile fills identical to the light render; DC no-data gray darker (#6E6D66) but still distinct from the ramp.
      Legibility verdict: PASS
