review:
  strengths:
  - 'Imprint sequential ramp (#009E73 -> #4467A3) on a continuous rate, with identical
    data colors in both themes and correct #FAF8F1 / #1A1A17 chrome'
  - 'Idiomatic Altair geodata: topo_feature counties joined to the rate table with
    transform_lookup and projected with albersUsa'
  - Missing rates handled with alt.condition(isValid(...)) to a neutral gray, distinct
    from every color of the ramp
  - Page-colored hairline county boundaries stay quieter than the fills and keep similar
    neighbors apart in both themes
  - Tooltips with county id and formatted rate in the HTML output
  weaknesses:
  - 'SC-02 (both): the color bar labels 10%, 20% and 30% but leaves its lower end
    unlabeled, so the legend does not show where the value range starts (C2) → a labelled
    lower bound, for example by letting the scale include zero so a 0% tick is drawn.
    Likely cause: alt.Scale(range=IMPRINT_SEQ) without zero=True or nice bounds, so
    the minimum (~1%) gets no tick.'
  - 'Suggestion: the ramp''s narrow lightness range leaves most counties in similar
    mid teals; a larger gradientLength and legend tick count would make reading individual
    values easier.'
