review:
  strengths:
  - Real Natural Earth country outlines projected to Robinson, with the projection's
    curved frame drawn as an elevated ocean surface, fit for a world extent in both
    themes
  - A single PolyCollection driven by array/cmap/norm with a masked array and imprint_seq.with_extremes(bad=NO_DATA)
    renders missing countries (Greenland, Western Sahara, Somaliland, Falklands) in
    a neutral gray that never reads as a low value, explained by a 'No data' swatch
  - Country boundaries drawn in the page color at 0.25 pt separate similar neighbours
    (Europe, West Africa) in both themes without overpowering the fills
  - 'Realistic, plausible life-expectancy values for about 170 countries: the sub-Saharan
    low (Nigeria, CAR around 54) against the high of Japan, Spain and Italy (84) reads
    directly from the fills'
  - The colour bar carries a descriptive label with units and theme-correct ticks
    and outline; the data colours are identical in light and dark
  weaknesses:
  - 'VQ-05 (both): the map fills only about 64 % of the canvas height, with roughly
    12 % empty band above the title and about 15 % empty below the map frame, so the
    world reads small for a 3200×1800 canvas → enlarge the map axes to about 0.92
    of the figure height (+0.08) and move the title up to keep a normal gap. Likely
    cause: fig.add_axes([0.01, 0.05, 0.86, 0.84]) with the ylim padding and suptitle
    y=0.875.'
  - 'Suggestion: in the dark render the no-data gray #3A3A35 sits close to the elevated
    ocean #242420; a slightly lighter no-data tone would make Greenland stand out
    more.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 page; the Robinson-shaped map frame is filled with the elevated #FFFDF6 surface and outlined in INK_SOFT.
      Chrome: title "World Life Expectancy · choropleth-basic · python · matplotlib · anyplot.ai" in dark ink, about 70 % of the width; vertical colour bar at right labelled "Life expectancy at birth (years)" with ticks 55–80 in dark gray; "No data" swatch and label at lower left of the frame. All readable.
      Data: countries filled with imprint_seq from #009E73 (low, sub-Saharan Africa) to #4467A3 (high, Western Europe, Japan, Australia, Canada); thin page-coloured boundaries; Greenland, Western Sahara, Somaliland and the Falklands in gray #D9D6CC; Antarctica omitted.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17 page; map frame filled with #242420 and outlined in light gray.
      Chrome: title in light ink, colour bar label in light ink, ticks and "No data" label in light gray #B8B7B0; no dark-on-dark text.
      Data: identical fills to the light render; boundaries now drawn in the dark page colour; no-data regions in #3A3A35, visible but low-contrast against the frame.
      Legibility verdict: PASS
