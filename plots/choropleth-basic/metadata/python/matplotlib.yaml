review:
  strengths:
  - Theme tokens (PAGE_BG, INK, INK_SOFT) threaded through background, title, colorbar
    label and ticks; both renders have correct warm backgrounds and readable chrome
  - Colorbar with a descriptive label and units (Life Expectancy (years)) and explicit
    normalization over the data range
  - 'Plausible, neutral data: life expectancy for 36 countries across all continents
    with realistic values (54–84 years)'
  weaknesses:
  - 'VQ-05 (both): Canvas dimensions drifted from required target. Actual: 4697×1990.
    Closest valid target: 3200×1800 (±16 px tolerance). Signed delta: +1497 × +190
    — width is 1497 px over; height is 190 px over. Most likely cause: `bbox_inches=''tight''`
    on `savefig` — remove it (default `bbox_inches=None`). Re-render at exactly 3200×1800;
    the post-render gate enforces this.'
  - 'SC-01, SC-02, DQ-01 (both): this is not a choropleth: each country is a hexagon
    marker at its centroid on an empty page, with no region outlines, no filled areas,
    no map projection and no region boundaries; marker size additionally encodes life
    expectancy, a second channel the -basic spec does not ask for → draw every country
    as a filled polygon with its real outline (Natural Earth geometry, e.g. geopandas/shapely
    or cartopy shapes) in a world projection such as Robinson, shaded by its own value,
    with thin boundaries, and drop the size encoding. Likely cause: ax.scatter(...,
    marker="H", s=80 + (le - 54) * 8) used in place of geographic polygons.'
  - 'VQ-07 (both): continuous values use the RdYlGn colormap, which the style guide
    does not allow → imprint_seq (or imprint_div with a stated center). Likely cause:
    cmap = plt.cm.RdYlGn.'
  - 'VQ-04 (both): the red-yellow-green ramp makes red against green the main signal,
    which red-green colour-blind readers cannot separate → an Imprint ramp that varies
    in lightness. Likely cause: cmap = plt.cm.RdYlGn.'
  - 'VQ-01 (both): country labels at 9 pt are wider than their hexagons and blur at
    the 400 px thumbnail; dark INK text on the darkest green hexes (ICE, ITA, JAP)
    in the light render and grey INK_SOFT text on pale yellow hexes (PAK, IND, KEN,
    SOU) in the dark render have low contrast → labels of about 11–12 pt in a colour
    chosen against the fill they sit on (+2 to +3 pt). Likely cause: fontsize=9 and
    text_color = INK_SOFT if le < 70 else INK.'
  - 'VQ-02 (both): labels spill past their markers and collide: ISR overlaps EGY,
    NIG covers its own tiny marker, SOU (South Korea) touches JAP → labels that fit
    inside their regions once regions are real areas, or fewer labels. Likely cause:
    fixed-size text over small scatter markers.'
  - 'VQ-03 (both): the markers cover a tiny share of a mostly empty world canvas,
    and Nigeria''s marker at s=80 is barely visible under its label → filled region
    areas (the choropleth fix above). Likely cause: size = 80 + (le - 54) * 8.'
  - 'VQ-06 (both): labels are the first three letters of the name, which are ambiguous
    (UNI for both United States and United Kingdom, SOU for South Africa and South
    Korea, IND for India and Indonesia) → ISO alpha-3 codes or full names. Likely
    cause: country[:3].upper().'
  - 'DE-01 (both): the plot occupies the canvas as scattered markers in an empty field
    with no land shapes, so the composition reads unfinished → a map that fills the
    canvas with the world''s landmasses. Likely cause: no geographic geometry drawn.'
  - 'CQ-03, CQ-04 (code): numpy is imported only for size_scale = np.linspace(0.4,
    1.2, 4), which is never used, and its comment no longer describes the code → delete
    the line and the import. Likely cause: a leftover sizing approach.'
  - 'LM-01 (code): scatter markers stand in for geographic patches; matplotlib''s
    idiom for regions is a PatchCollection/PolyCollection of polygons (or GeoDataFrame.plot(column=...,
    cmap=...)) with a colorbar from the collection → draw polygons and pass the collection
    to fig.colorbar. Likely cause: ax.scatter loop with a manually built ScalarMappable.'
  - 'SC-04 (both): the title ''World Life Expectancy · choropleth-basic · matplotlib
    · anyplot.ai'' lacks the language segment → ''World Life Expectancy · choropleth-basic
    · python · matplotlib · anyplot.ai''. Likely cause: the title string.'
  - 'Suggestion: use ax.set_title instead of a positioned ax.text for the title.'
  image_description: |-
