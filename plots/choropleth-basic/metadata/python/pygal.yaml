review:
  strengths:
  - Correct theme surfaces and light/dark chrome in both renders
  - Single-layer choropleth with class legend at the bottom, using pygal_maps_world's
    World map with native tooltips
  - Neutral economic indicator in sensible bins
  weaknesses:
  - 'VQ-05 (both): canvas is 4800x2700, not a canonical size → 3200x1800 (−1600 ×
    −900). Likely cause: World(width=4800, height=2700).'
  - 'VQ-07 (both): regions use a viridis colormap (#440154 → #fde724) → steps of imprint_seq
    #009E73 → #4467A3. Likely cause: the VIRIDIS_COLORS list.'
  - 'VQ-01 (both): the title at about 28 px and the legend labels at about 16 px read
    tiny on the 4800x2700 canvas → title about 66 px, legend about 44 px. Likely cause:
    title_font_size=28, legend_font_size=16.'
  - 'VQ-03, SC-02 (both): pygal shades each country by an inline fill-opacity within
    its series, so the US and Canada in the same class show different yellows and
    no fill matches its legend swatch (C2) → one flat fill per class. Likely cause:
    pygal''s default per-value fill-opacity left in the SVG.'
  - 'SC-02 (both): countries without data are drawn unfilled in the page color instead
    of gray, so they read as background (C4) → a gray no-data fill. Likely cause:
    the no_data option does not set the country fill.'
  - 'SC-04 (both): the title ''choropleth-basic · pygal · anyplot.ai'' lacks the language
    segment → ''choropleth-basic · python · pygal · anyplot.ai''. Likely cause: the
    title string.'
  - 'DQ-02 (code): real country names carry random GDP numbers from np.random.uniform
    → real or close-to-real values per country. Likely cause: the gdp_data generation
    loop.'
  - 'Suggestion: a descriptive title prefix would state the mapped variable more prominently
    than the legend alone.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, correct.
      Chrome: title 'choropleth-basic · pygal · anyplot.ai' in dark ink but very small at the top; four legend entries ('GDP < $10k' … 'GDP > $50k') in tiny dark text at the bottom.
      Data: 34 countries shaded in viridis (purple, blue, green, yellow) with varying opacity inside each class, so countries in one class differ in shade (US pale yellow, Canada bright yellow); countries without data unfilled in page color with gray outlines.
      Legibility verdict: PASS, though the title and legend read tiny.

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17, correct.
      Chrome: title and legend in light text, readable but tiny; no dark-on-dark text.
      Data: same viridis classes; the opacity blending against the dark page shifts shades (US olive, Colombia near-black purple); no-data countries unfilled with light outlines.
      Legibility verdict: PASS, though the title and legend read tiny.
