review:
  strengths:
  - 'Imprint sequential ramp (#009E73 -> #4467A3) via scale_fill_gradient with an
    auto-derived color bar showing the value range'
  - Missing data (Czechia) drawn in a theme-adaptive gray as its own layer, distinct
    from every color of the scale
  - Thin INK_SOFT boundaries keep neighbours of similar shade separate in both themes
    without competing with the fills
  - Theme tokens threaded through title, legend and labels; label color chosen for
    legibility on the fills in both themes
  - 'Real, neutral scenario: 2023-2024 life expectancy for 16 European countries with
    plausible values'
  weaknesses:
  - 'SC-02, DQ-01 (both): regions are hand-typed hexagons, not their real outlines,
    several overlap each other (Czechia covers parts of Germany and Poland, Portugal
    cuts into Spain, the UK into the Netherlands) and coord_fixed on raw coordinates
    is no map projection, missing the spec''s first ''A good version shows'' bullet
    → real country boundaries (e.g. Natural Earth admin-0 geometry from geopandas)
    drawn in an equal-area or Robinson-like projection, without overlaps. Likely cause:
    the invented `countries` coordinate dict.'
  - 'VQ-01 (both): country name labels render at about 4 pt, half the 8 pt tick/legend
    reference, and read small for the map''s main labels → about 7-8 pt (+3 to +4
    pt). Likely cause: geom_text(size=4).'
  - 'VQ-02 (both): the Poland label straddles the gray Czechia polygon and the Belgium
    label sits on the Belgium/France boundary, so both read partly over a neighbour''s
    fill → each label inside its own region. Likely cause: the overlapping polygon
    geometry and the label anchor offsets for Belgium.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, no panel border, axes, ticks or grid (appropriate for a map).
      Chrome: title "choropleth-basic · python · plotnine · anyplot.ai" in dark ink at the top centre (~50 % width); legend box on the right on #FFFDF6 with a dark border, title "Life expectancy (years)" and ticks 78-84 in INK_SOFT — all readable.
      Data: 16 hexagon-like European country polygons filled along the Imprint sequential ramp, Poland (78.0) in #009E73 green, Norway/Sweden/Switzerland in #4467A3 blue, the rest in teal-blue mid-steps; Czechia in gray #A9A9A9 for missing data with a dark label; thin #4A4A44 boundaries; small light-ink country names on the fills. Some polygons overlap (Czechia over Germany/Poland, Portugal into Spain).
      Legibility verdict: PASS (country labels small at ~4 pt but readable)

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title in light ink; legend box #242420 with a light border, light title and #B8B7B0 tick labels — all readable, no dark-on-dark text.
      Data: fill colors identical to the light render (same ramp, same mapping); missing Czechia in darker gray #696969 with a light label; boundaries flip to #B8B7B0; country labels stay light ink and remain readable on every fill.
      Legibility verdict: PASS
