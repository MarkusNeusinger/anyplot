review:
  strengths:
  - Uses plotly's built-in geo scope='africa' with the natural earth projection, so
    the extent fits the data without hand-made bounds
  - Missing countries (Eritrea, South Sudan, Somalia, Western Sahara) are drawn by
    geo landcolor in a theme-tuned gray that never reads as a scale value
  - Page-colored 0.8 px boundaries keep neighbouring countries of similar shade apart
    in both themes without competing with the fills
  - imprint_seq continuous scale with range_color taken from the data; colorbar title
    carries the unit
  - Clean six-zone structure with column constants and fully theme-adaptive chrome;
    HTML output keeps native hover
  weaknesses:
  - 'VQ-05 (both): the map fills only about the middle 55 % of the 2400 px height,
    leaving an empty band of about 320 px (display) between the title and the top
    of Africa and about 250 px below it → let the map fill the plot area (about +25
    % map height). Likely cause: the default africa scope bounds inside a square geo
    domain; fig.update_geos(fitbounds="locations") or a tighter lataxis/lonaxis range.'
  - 'Suggestion: shorten the colorbar to the map''s height so legend and map share
    a top and bottom line.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, no ocean fill or frame.
      Chrome: title 'choropleth-basic · python · plotly · anyplot.ai' in dark INK centered at the top (~65 % width); colorbar title 'Adult literacy rate (%)' in INK, ticks 30-90 in INK_SOFT; all readable.
      Data: 49 African countries shaded with imprint_seq from #009E73 (low literacy: Chad, Mali, Niger) to #4467A3 (high: South Africa, Libya, Equatorial Guinea); Eritrea, South Sudan, Somalia and Western Sahara in light gray no-data; page-colored hairline boundaries. Map sits in the middle of the square canvas with wide empty bands above and below.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title and colorbar title in light INK, ticks in light INK_SOFT; no dark-on-dark text.
      Data: fills identical to the light render; no-data countries in dark gray #3A3A35, distinct from the scale; boundaries in the page color stay visible as thin dark lines between fills.
      Legibility verdict: PASS
