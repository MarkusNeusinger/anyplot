review:
  strengths:
  - Creative, honestly-documented tile-grid cartogram substitute for the missing offline
    US GeoJSON boundaries, keeping every state (including small ones like RI/DE) equally
    legible
  - Correct sequential Imprint colormap (t.seq, green→blue) used for the single-polarity
    renewable-share data, with a continuous visualMap legend showing accurate min/max
    labels
  - Missing-data states (RI, DE, WV) are rendered in the theme-adaptive muted anchor,
    exactly matching the spec's 'handle missing data gracefully' requirement
  - Deterministic fixed-seed LCG for reproducible data; idiomatic ECharts pattern
    via echarts.registerMap + continuous visualMap + map series
  - Both themes fully theme-correct — background, title, legend text, and tile gutters
    all adapt, while the 8 data-driven tile colors stay pixel-identical between light
    and dark
  weaknesses:
  - No real geographic boundaries or map projection are used — the spec explicitly
    asks for 'an appropriate map projection (e.g. Albers Equal Area for US)'; the
    uniform square-tile grid, while a legitimate cartogram variant, is a real departure
    from a choropleth's shape-encoded regions
  - 'Data storytelling is weak: the south/west ''renewable potential'' boost in the
    underlying data (southwestBoost) is small relative to the 38-point random range,
    so the resulting color pattern reads as near-random rather than showing a clear
    geographic trend'
  - Canvas utilization is moderate — the tile grid + legend fill noticeably less than
    half of the landscape canvas; the tiles could be scaled up to use more of the
    available width/height
  - 'LM-02 (distinctive features): registerMap + continuous visualMap is solid idiomatic
    usage but not a deeply distinctive echarts-only capability — the static PNG doesn''t
    showcase anything an equivalent d3/highcharts map implementation couldn''t also
    produce'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 - not pure white.
      Chrome: Title "choropleth-basic · javascript · echarts · anyplot.ai" centered at top in dark ink text, clearly legible. Continuous horizontal colorbar legend at bottom-center labeled "17%" (green end) and "55.7%" (blue end) in soft ink gray, fully readable.
      Data: Tile-grid cartogram of the 50 US states + DC, each a colored square (green-to-blue sequential Imprint ramp representing renewable-electricity-share %), with bold white state-abbreviation labels centered on every tile. Three tiles (RI, DE, WV) render as solid muted gray to indicate missing data. Off-white gutter borders separate tiles.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 - not pure black.
      Chrome: Same title, now in light ink text, clearly legible against the dark background. Same colorbar legend, labels now in light soft-ink gray, fully readable. No dark-on-dark or light-on-light failures observed.
      Data: Same tile grid; the sequential green-to-blue data colors are visually identical to the light render (confirmed tile-by-tile) - only the gutter border color and the muted no-data gray shifted to their theme-adaptive values. State abbreviation labels remain bold white and legible on every tile.
      Legibility verdict: PASS
