review:
  strengths:
  - Correct Imprint sequential colormap (imprint_seq, green → blue) for the continuous
    renewable-share data, with identical data colors between light and dark renders
  - 'Excellent ''missing data'' handling: Antarctica rendered as a dashed muted-gray
    region with an in-place ''No data'' label and a matching swatch in the legend,
    exactly matching the spec''s requirement'
  - Clever theme-adaptive text coloring — the 'No data' label color is bound to t.pageBg
    so it always contrasts against the muted swatch fill in both themes
  - Title matches the mandated '{spec-id} · {language} · {library} · anyplot.ai' format
    exactly, with a clear, neutral descriptive subtitle for context
  - Genuine (non-fake) hover tooltips via Highcharts pointFormatter over invisible
    per-region hit markers — real interactivity, not a simulated static effect
  - Realistic, well-reasoned regional data ordering (hydro-heavy South America highest,
    oil/gas-exporting Middle East lowest) for a neutral, non-controversial topic
  weaknesses:
  - 'Unbalanced canvas margins: the map content (North America through Oceania) only
    spans roughly the left 87% of the plot width, leaving a noticeably larger empty
    margin on the right than on the left — tighten LON_MIN/LON_MAX or re-center the
    regions so left/right whitespace is balanced'
  - Region silhouettes are quite coarse/blocky (hand-authored polygons), and adjacent
    regions like Central Asia and East Asia visually crowd against each other at their
    shared boundary — refining vertex placement would raise the perceived polish
  - Code relies on six custom helper functions (hexToRgb, lerpColor, colorForValue,
    bounds, drawChoropleth, drawLegend) for a fairly elaborate manual-choropleth-on-scatter
    workaround; some of this is inherent to working around the missing highmaps module,
    but consolidating where possible would simplify the structure
  - No strong visual emphasis/callout on the highest or lowest region (e.g., South
    America at 55% vs. Middle East at 5%) — optional, since the spec doesn't explicitly
    request annotations, but would strengthen the data storytelling
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "choropleth-basic · javascript · highcharts · anyplot.ai" in bold dark ink, top-left; subtitle "Renewable share of electricity generation by world region — illustrative data" in a softer dark gray beneath it. Both fully readable against the light background. A manual gradient legend bar (green → blue) sits bottom-left with "0%", "30%", "60%+" tick labels and a "Renewable electricity generation share" caption above it, plus a dashed gray "No data" swatch to its right — all text clearly legible.
      Data: 13 hand-drawn world-region polygons filled with a green-to-blue sequential gradient (Imprint imprint_seq) based on each region's renewable-electricity-share value — South America and the Middle East-adjacent hexagon read at the color extremes, matching their assigned values. Antarctica is rendered as a dashed, muted dark-gray shape with a light "No data" label inside it, legible against the darker swatch. Region boundaries are outlined with thin page-background-colored strokes for separation without visual noise.
      Legibility verdict: PASS — all title, subtitle, legend, and annotation text is clearly readable against the light background; no light-on-light issues found.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title and subtitle, now rendered in light ink/soft-light gray, fully legible against the dark background. The same gradient legend bar and labels appear bottom-left in light-colored text, with the "No data" swatch now shown as a lighter muted-gray dashed shape.
      Data: The region fill colors are identical to the light render (same green-to-blue gradient positions per region) — only the chrome (background, text, region-boundary stroke color which uses the page background) flipped. Antarctica's "No data" swatch/region is now a lighter gray with a dark "No data" label, which remains legible because the label color is bound to the (now dark) page background, correctly contrasting with the lighter muted swatch. No dark-on-dark text failures were found.
      Legibility verdict: PASS — all text is clearly readable against the dark background, including the theme-adaptively colored "No data" label.
