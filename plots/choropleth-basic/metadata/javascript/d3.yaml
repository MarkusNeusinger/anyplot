review:
  strengths:
  - Deterministic seeded LCG generates plausible synthetic per-state renewable-share
    values (no network fetch needed for the offline harness)
  - Correct sequential Imprint color scale (d3.scaleSequential + d3.interpolateRgbBasis
    over tokens.seq) — right polarity choice for magnitude data with no natural midpoint
  - 'Thoughtful missing-data handling: two states rendered as gray tiles plus a dedicated
    ''No data'' legend swatch, matching the spec''s missing-data requirement'
  - Adaptive per-tile label ink computed from each fill's own luminance keeps state
    abbreviations legible regardless of theme or color, a nice accessibility touch
  - Title, legend text, and chrome are correctly theme-adaptive and data colors are
    identical between light and dark renders
  weaknesses:
  - Uses an equal-area tile-grid cartogram instead of an actual geographic projection;
    the spec's Notes suggest 'an appropriate map projection (e.g. Albers Equal Area
    for US)' — the tile-grid choice is a reasonable, well-documented workaround for
    the offline/no-topojson-network constraint, but it departs from a literal geographic
    choropleth shape
  - Large unused negative space in the lower-left/middle of the 3200x1800 canvas,
    inherent to the US tile-grid's outline — the composition feels imbalanced; consider
    centering the grid within the canvas or trimming margins so the visual mass fills
    the frame better
  - Title occupies only ~42% of canvas width, below the style guide's ~50-70% comfort
    range for a title this length — a modest fontsize increase would give it more
    visual weight
  - No additional annotation calling out the highest/lowest state or a notable pattern,
    so Data Storytelling is solid but not sharpened beyond the color encoding itself
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1, not pure white.
      Chrome: Title "Renewable Electricity Share · choropleth-basic · javascript · d3 · anyplot.ai" in bold dark ink at top-center, clearly readable. Legend at top-right with "Renewable electricity share (%)" label, a horizontal gradient bar from green to blue labeled "9%" / "92%", plus a gray "No data" swatch with label — all readable secondary-ink text.
      Data: A US state tile-grid cartogram — one rounded rectangle per state, arranged in an equal-area grid approximating US geography, each labeled with its 2-letter abbreviation. Fill color runs along a green-to-blue sequential ramp (first stop is Imprint brand green #009E73) mapped to each state's value; two states (WY, SC) are filled solid gray to indicate missing data. Per-tile label ink switches between dark and light based on the fill's own luminance, so every abbreviation stays legible against its own tile.
      Legibility verdict: PASS — all title, legend, and tile-label text is clearly readable against the light background; no light-on-light text found.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17, not pure black.
      Chrome: Same title now in light ink, clearly readable. Same legend layout with light secondary-ink text for value labels and "No data" caption; the no-data swatch is now a lighter warm gray so it still reads against the dark page background.
      Data: Identical tile-grid layout and identical green-to-blue data colors as the light render — only chrome (background, title/legend ink, tile borders, no-data swatch tone) flipped for the dark surface. Per-tile label ink again auto-selects dark or light per tile so every abbreviation stays legible.
      Legibility verdict: PASS — no dark-on-dark text found; all chrome and tile labels are clearly visible against the near-black background, and the brand green tiles still read well.
