review:
  strengths:
  - 'Excellent theme-adaptive rendering: data tile colors are pixel-identical between
    light and dark renders, while chrome (background #FAF8F1/#1A1A17, title, legend
    text) correctly flips with no dark-on-dark or light-on-light failures'
  - Highly realistic, factually accurate renewable-electricity-share data for 32 countries
    spanning every continent (Norway 98%, Brazil 84%, Saudi Arabia 1%, South Korea
    9%) that closely matches real-world figures
  - 'Honest, well-documented handling of Chart.js''s lack of native geo/polygon support:
    no chartjs-chart-geo plugin, no fake interactivity, code comments transparently
    explain the tile-map substitution'
  - 'Missing-data handling implemented exactly per spec: two countries render as muted
    gray ''No data'' tiles with a dedicated legend entry'
  - Per-tile text color is chosen via a luminance check so every 2-letter country
    code stays legible regardless of the underlying sequential fill color
  - Clean, deterministic, near-KISS code; correct mandated title format; legend labels
    precisely match the five value bins plus the no-data category
  weaknesses:
  - 'SC-01/SC-02: This is not a true choropleth - there are no shaded region polygons/boundaries
    and no map projection or basemap. It reads as a scatter/tile grid of colored squares
    positioned by longitude/latitude rather than a geographic map. Chart.js core genuinely
    cannot fill geographic polygons without the disallowed chartjs-chart-geo plugin,
    so a literal choropleth may be infeasible - but the repair loop should get closer:
    draw a simple continent-outline basemap as additional line datasets (an array
    of [lon, lat] points per landmass stroked with t.grid) so the tiles read as sitting
    on Earth instead of floating in blank space.'
  - 'Sequential color direction is semantically backward: the worst bin (''< 10% renewable'')
    is rendered in brand green #009E73 while the best bin (''>= 65% renewable'') is
    blue - most readers associate green with high renewable share, so mapping green
    to the lowest performers undercuts the story. Reverse the imprint_seq interpolation
    (seqRgb should go from t.seq[1] toward t.seq[0] as the bin value increases, or
    otherwise re-map which bin gets which end of the scale) so high-renewable countries
    read as more green.'
  - 'DE-01/DE-02: currently looks like a plain scatter grid rather than a polished
    map - no basemap texture or land/ocean distinction, and the visible Cartesian
    gridlines read as chart gridlines rather than a map graticule. A subtle basemap
    outline (see above) and toning down or removing the x/y grid would raise aesthetic
    sophistication and visual refinement.'
  - 'VQ-05: canvas utilization is uneven with large empty stretches (e.g., northern
    and far-southeastern regions) because the linear axis bounds (-170..179 / -58..82)
    are wider than the actual data''s bounding box - tightening the min/max to the
    real data extent would reduce wasted whitespace and better fill the canvas.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches the required #FAF8F1 surface (not pure white, not dark).
      Chrome: Title "Renewable Electricity Share · choropleth-basic · javascript · chartjs · anyplot.ai" in dark ink, centered top, clearly legible. Bottom legend has six horizontal swatches ("< 10% renewable" ... "No data") with dark-ink labels, fully readable. Faint Cartesian gridlines cross the canvas (a chart-style grid, not a map graticule).
      Data: 32 country tiles (squares with rounded rect point style) positioned by longitude/latitude, filled with the Imprint sequential scale (green -> blue) binned into 5 buckets, plus 2 muted-gray "No data" tiles (NG, ID). Each tile carries a 2-letter country code in a contrast-appropriate text color (light or dark depending on tile luminance). No landmass outlines, ocean/land distinction, or region boundaries are present - the layout reads as a scatter/tile map rather than a shaded-polygon choropleth.
      Legibility verdict: PASS - all title, legend, and in-tile text is clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches the required #1A1A17 surface (not pure black, not light).
      Chrome: Title and legend text render in light ink, clearly visible against the dark background. Gridlines are the same faint style, still subtle and non-competing.
      Data: Tile fill colors are pixel-identical to the light render (confirmed - only chrome flipped, not data). In-tile country-code text colors are still legible per-tile thanks to the luminance-based text-color logic; no dark-on-dark failures observed on any tile, including the muted-gray "No data" tiles.
      Legibility verdict: PASS - all text remains readable in the dark theme; theme adaptation is correctly implemented throughout.
