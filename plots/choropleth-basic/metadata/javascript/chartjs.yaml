review:
  strengths:
  - 'All three attempt-1 weaknesses were addressed directly: continent-outline basemap
    adds geographic context, sequential color direction now runs green-for-high, and
    axis bounds are tightened to the real data extent'
  - 'Excellent theme-adaptive rendering: data tile colors are pixel-identical between
    light and dark renders, while chrome correctly flips with no dark-on-dark or light-on-light
    failures'
  - Highly realistic, factually accurate renewable-electricity-share data for 32 countries
    spanning every continent
  - Honest, well-documented handling of Chart.js's lack of native geo/polygon support
    - no chartjs-chart-geo plugin, no fake interactivity
  - 'Missing-data handling implemented exactly per spec: two countries render as muted
    gray No data tiles with a dedicated legend entry'
  - Per-tile text color chosen via luminance check so every country code stays legible
    regardless of the underlying fill color
  weaknesses:
  - 'SC-01/SC-02: Still not a literal choropleth - no filled region polygons or map
    projection, though this is a genuine Chart.js core limitation and the basemap
    is the right compensating move'
  - 'CQ-01: The half-dozen small helper functions (hexToRgb, lerp, seqRgb, toCss,
    luminance, binIndex) push slightly past pure KISS, though each is justified by
    the binned-continuous-scale requirement'
  - Continent outlines are stylized/approximate rather than accurate coastlines -
    acceptable given the constraints, but worth noting as a simplification
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1, not pure white.
      Chrome: Title "Renewable Electricity Share · choropleth-basic · javascript · chartjs · anyplot.ai" in dark ink, centered top, clearly legible. Bottom legend with six horizontal swatches and dark-ink labels, all readable. A lightweight continent-outline graticule (thin gray strokes, no fill) sits behind the tiles for geographic context.
      Data: 32 country tiles (square markers) positioned by longitude/latitude, filled with the Imprint sequential scale (imprint_seq) binned into 5 buckets. Direction is correct: high-renewable countries (Norway, Brazil, Colombia, Kenya, New Zealand) render brand green #009E73; low-renewable countries (Saudi Arabia, South Africa, South Korea) render blue. 2 muted-gray "No data" tiles (NG, ID) with a dedicated legend entry. Each tile carries a legible 2-letter country code.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17, not pure black.
      Chrome: Title and legend render in light ink, clearly visible. Continent outlines remain visible (stroked in the theme's grid color) against the dark background.
      Data: Tile fill colors are pixel-identical to the light render - confirmed, only chrome flipped. In-tile country-code text colors remain legible per-tile via luminance-based logic; no dark-on-dark failures on any tile, including the muted-gray "No data" tiles.
      Legibility verdict: PASS
