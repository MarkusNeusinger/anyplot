review:
  strengths:
  - 'Contiguous bars via the band axis''s categoryGapRatio: 0 and borderRadius={0},
    with a 1.5 px page-colored stroke (.MuiBarChart-element) that keeps every bin
    edge distinguishable in both themes without opening gaps'
  - Equal-width bins from a 1-2-2.5-5 nice-step rule give 15 five-year bins whose
    range labels (15–20 … 85–90) read directly as value ranges; the outline shows
    the right skew, the sparse tail and empty 75–85 bins honestly
  - 'Y axis pinned at min: 0 with a subtle theme-token grid; all chrome (title, subtitle,
    axis titles, ticks) uses ink/inkSoft tokens and reads cleanly on #FAF8F1 and #1A1A17'
  - Plausible, neutral scenario (ages of 600 streaming subscribers, log-normal with
    a long older tail) generated with a fixed-seed LCG, so both renders are deterministic
  - Title/subtitle header band in MUI Typography gives a clear hierarchy, and the
    subtitle states n and the bin width so the reader can interpret bar heights; native
    MUI X tooltips add per-bin counts in the HTML view
  weaknesses:
  - 'Suggestion: a numeric x axis with ticks at the bin edges (e.g. a ChartsContainer
    with a linear x scale) instead of range strings would read more like a classic
    histogram axis.'
  - 'Suggestion: the clamp at 16 years folds the lower log-normal tail into the 15–20
    bin; drawing from a distribution whose lower bound is natural would avoid the
    hidden pile-up.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the full canvas (3200x1800).
      Chrome: bold dark title "histogram-basic · javascript · muix · anyplot.ai" centered at top, a soft-ink subtitle "n = 600 · bin width 5 years", y-axis title "Frequency (count per bin)" (rotated), ticks 0–130 in steps of 10, x-axis title "Subscriber Age (years)", bin range labels 15–20 … 85–90. Subtle light-gray horizontal grid. All text dark and readable.
      Data: 15 contiguous brand-green #009E73 bars separated by thin cream strokes; peak 124 at 25–30, 117 at 30–35, long right tail down to 1 at 65–75, empty 75–85, 1 at 85–90. Bars rise from zero.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, subtitle, axis titles and tick labels in light ink, all clearly readable; grid lines subtle dark gray; no dark-on-dark text.
      Data: identical #009E73 bars and counts as the light render; bin separators now drawn in the dark page color and still distinguishable.
      Legibility verdict: PASS
