review:
  strengths:
  - Clean, correctly-themed histogram with identical data colors across light/dark
    and fully legible chrome in both
  - Bin-edge separation achieved elegantly by matching borderColor to the page background
    — satisfies the spec's 'thin visible edges, no gaps' requirement without extra
    complexity
  - Realistic, right-skewed transaction-amount data with a natural thinning tail,
    generated deterministically via a seeded LCG as required for browser-side reproducibility
  - Y-axis correctly starts at zero; currency-formatted axis labels and a bin-range
    tooltip add useful polish
  weaknesses:
  - 'Design Excellence is generic: no visual-hierarchy device (e.g. a subtle reference
    line or callout marking the mode/median) to actively guide the viewer to the distribution''s
    peak'
  - Library Mastery is fairly baseline — the implementation doesn't lean on any Highcharts-distinctive
    feature beyond a custom tooltip formatter and axis formatting
