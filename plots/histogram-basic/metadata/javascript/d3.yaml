review:
  strengths:
  - Idiomatic use of d3.bin() + scaleLinear() + axisBottom/axisLeft with a proper
    data-join (.data(bins).join("rect")) — satisfies AR-05 cleanly
  - 'First (and only) series is exactly Imprint #009E73, byte-identical between plot-light.png
    and plot-dark.png; only chrome (background, text, grid) flips between themes'
  - Bin edges are contiguous with thin pageBg-colored strokes between bars (no gaps),
    matching the spec's 'thin visible edges between bins' requirement
  - Y-axis starts at zero via scaleLinear().domain([0, max]).nice() as required by
    the spec
  - Realistic, neutral QC scenario (bolt shear-strength measurements) with a deliberate
    right-skew bump for over-torqued fasteners, giving the distribution real shape
    instead of a plain symmetric bell
  - Deterministic reproducibility via a fixed-seed LCG + Box-Muller gaussian() — no
    external RNG dependency needed in the browser runtime
  - 'Clean theme-adaptive chrome: axis text/lines use t.inkSoft, y-axis-only gridlines
    use t.grid, minimal L-shaped frame (tick marks removed, only domain line kept)'
  weaknesses:
  - 'Design Excellence reads as a well-configured default rather than a distinctive
    piece: no visual emphasis calls out the over-torqued tail bump the data/comments
    describe, no reference line (e.g. mean or spec threshold), and typography weight/size
    hierarchy is minimal beyond bold title vs regular axis text — add a deliberate
    focal point or refined detail to lift DE-01/DE-02/DE-03 above ''default''.'
  - Library Mastery is generic idiomatic d3.bin() usage that could be replicated with
    near-identical code in most binning-capable libraries — lean into a more distinctive
    D3 capability (e.g. hover tooltips via mouse events since d3 is an interactive
    library and tooltips aren't penalized in the static PNG, or a data-driven bin-width
    rule instead of a fixed thresholds(24)) to demonstrate d3-specific strength.
  - Two small helper functions (lcg, gaussian) break strict KISS linear flow (Imports
    → Data → Plot → Save) — acceptable since the browser has no built-in normal-distribution
    RNG, but keep an eye on this in future d3 implementations that don't need a Gaussian.
  - Title occupies only ~29% of canvas width at the current 22px size — well under
    the 50-70% guideline for a mandated title this short; not a hard violation (no
    clipping/overflow), but a touch more size or weight would improve visual balance
    against the wide 3200px canvas.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Bold dark title "histogram-basic · javascript · d3 · anyplot.ai" centered at top, clearly readable. X-axis label "Shear Strength (N)" and rotated Y-axis label "Number of Fasteners" both in dark ink, legible. Tick labels (700-950 on X, 0-40 on Y) in a slightly softer dark gray, all readable. Subtle horizontal gridlines at each Y tick, faint but visible. Only bottom + left axis domain lines are drawn (L-shaped frame); tick marks themselves are removed.
      Data: A single series of ~29 vertical bars in brand green (#009E73) with thin off-white strokes separating adjacent bins (no gaps). Distribution rises from near zero at the left (~680N), builds through the 750-800N range, has a broad plateau around 800-840N, spikes to a clear peak (~41 count) near 845N, then decays with a longer right tail out past 950N — visibly right-skewed as intended.
      Legibility verdict: PASS — all text is clearly readable against the light background, no overlap, no clipping.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Title, axis labels, and tick labels have all flipped to light ink tones and remain clearly legible against the dark background. Gridlines are faint light horizontal lines at each Y tick, still subtle but visible. Same L-shaped axis frame as the light render.
      Data: Bars are the identical brand green (#009E73) as the light render — confirmed same hue, same shape, same bin boundaries and stroke separators. No dark-on-dark or light-on-light failures anywhere.
      Legibility verdict: PASS — all text is clearly readable against the dark background; no dark-on-dark issues found.
