review:
  strengths:
  - Idiomatic d3.bin() + scaleLinear() + axisBottom/axisLeft with a proper .data(bins).join("rect")
    data-join
  - 'First series is exactly Imprint #009E73, identical between light and dark renders;
    over-torque tail correctly uses the amber semantic anchor (#DDCC77) rather than
    an arbitrary color'
  - New dashed threshold reference line plus a manually built legend ("Over-torque
    risk (>895 N)") gives the chart a clear focal point and directly addresses the
    prior review's storytelling feedback
  - Bin edges are contiguous with thin pageBg-colored strokes between bars (no gaps),
    per spec; y-axis starts at zero
  - Realistic, neutral QC scenario (bolt shear-strength measurements) with a deliberate,
    data-derived right-skew tail (threshold computed from mean + 1.5*stddev, not hard-coded)
  - Deterministic reproducibility via a fixed-seed LCG + Box-Muller gaussian()
  - Hover tooltips built with d3.pointer/getBBox for dynamic sizing add genuine, library-distinctive
    interactivity that is invisible-but-harmless in the static PNG
  - 'Clean theme-adaptive chrome: y-axis-only gridlines, minimal L-shaped frame, all
    text legible in both themes'
  weaknesses:
  - Title occupies only ~29% of canvas width (short spec-id + language combination)
    — not a violation given no clipping and full readability, but a touch more size/weight
    would improve visual balance
  - Two small helper functions (lcg, gaussian) slightly break strict KISS linear flow
    — acceptable given the browser has no built-in normal-distribution RNG
  - Distribution shows a right skew with one secondary bump near the peak rather than
    a clearly multimodal shape — adequate for the spec's 'slight skew' requirement
    but not maximal feature coverage
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Bold dark title "histogram-basic · javascript · d3 · anyplot.ai" centered at top, clearly readable. X-axis label "Shear Strength (N)" and rotated Y-axis label "Number of Fasteners" in dark ink, legible; tick labels (700-950 on X, 0-40 on Y) in softer gray, all readable. Subtle horizontal gridlines at each Y tick. Only bottom+left axis lines drawn (L-shaped frame), tick marks removed. A small legend swatch top-right reads "Over-torque risk (>895 N)" in soft ink next to an amber square.
      Data: A single distribution of green (#009E73) bars rising from near zero at ~680N, plateauing/bumping 800-840N, peaking (~41) near 845N, then decaying into a right tail. Bins beyond ~895N (mean + 1.5 std) are recolored amber (#DDCC77), the Imprint warning anchor, with a dashed vertical reference line marking the threshold exactly at the color transition. Thin off-white strokes separate every bar (no gaps between bins).
      Legibility verdict: PASS — all text, including the new legend and threshold annotation, is clearly readable against the light background.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Title, axis labels, tick labels, gridlines, legend text, and the dashed reference line have all flipped to light/soft tones and remain clearly legible. Same L-shaped axis frame and legend layout as the light render.
      Data: Identical bar shape, bin boundaries, and colors as the light render — green (#009E73) for the main distribution, amber (#DDCC77) for the over-torque tail, both unchanged from light. Only chrome (background, text, grid, dashed line color) adapted to the dark theme.
      Legibility verdict: PASS — no dark-on-dark or light-on-light failures; amber and green both remain clearly visible against the near-black surface.
