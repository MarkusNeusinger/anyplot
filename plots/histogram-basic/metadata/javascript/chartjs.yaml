review:
  strengths:
  - 'Correct zero-gap histogram encoding (categoryPercentage: 1.0, barPercentage:
    1.0) with thin pageBg-colored borders between bins, exactly matching the spec''s
    "clear bin edges, no gaps, thin visible edges" note.'
  - 'Y-axis begins at zero (beginAtZero: true), satisfying the spec''s accurate-comparison
    requirement.'
  - Deterministic, realistic exam-score data (mixture of two normals via a fixed-seed
    LCG) producing a plausible right-skewed distribution.
  - Correct Imprint palette (#009E73 first/only series), theme-correct chrome, all
    font sizes explicitly set and legible in both themes and at mobile (~400px) scale.
  - Title format exactly matches convention; legend correctly omitted for a single
    series.
  weaknesses:
  - 'Design Excellence is minimal: a single flat green fill with no visual hierarchy,
    highlight of the modal bin, or emphasis beyond raw data display - reads as a functional
    default rather than a polished visualization.'
  - The underlying two-group mixture (85% high performers, 15% struggling group) is
    only barely visible as a subtle bump around the low 40s-50s - increase separation/weight
    between the two normal components so the multimodal structure is clearly legible,
    per the spec's "slight skew or natural clustering preferred."
  - Axis labels lack units/qualifiers (e.g. "Frequency (Students)" would be more descriptive
    than bare "Frequency").
  - 'Library Mastery is generic: the zero-gap bar-as-histogram technique, while correct
    and idiomatic, doesn''t use any chartjs-distinctive feature (custom plugin, gradient,
    reference-line annotation) to elevate the implementation.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 - not pure white, not dark.
      Chrome: Title "histogram-basic · javascript · chartjs · anyplot.ai" bold, dark ink, top-centered, fully visible with no clipping. X-axis title "Exam Score" and Y-axis title "Frequency" in dark ink, both legible. Tick labels (18-92 stepped on X, 0-70 on Y) in softer gray, all readable. Subtle horizontal gridlines only, no vertical gridlines.
      Data: 20 contiguous green (#009E73) bars with thin cream-colored borders separating each bin, no gaps between bars. Distribution mass concentrated at scores 63-88 with a long tail toward low scores 18-59 (right-skewed / long left tail).
      Legibility verdict: PASS - all text clearly readable against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 - not pure black, not light.
      Chrome: Title, axis titles, and tick labels rendered in light/off-white ink, fully legible against the dark background. Gridlines remain subtle.
      Data: Same 20 bars in identical #009E73 green (confirming only chrome flipped), now with thin near-black borders matching pageBg instead of cream ones.
      Legibility verdict: PASS - no dark-on-dark failures; all title, axis, and tick text is clearly visible against the near-black background.
