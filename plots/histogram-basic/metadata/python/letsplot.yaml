review:
  strengths:
  - 'Exactly the basic variant: one distribution in Imprint green #009E73, no reference
    lines, curves or callouts'
  - Thin page-colored bar edges (color=PAGE_BG) keep bins distinguishable in both
    themes without opening gaps
  - 30 bins on 250 observations show the main mode, the right skew and the sparse
    48–58 cm large-specimen tail
  - Theme tokens threaded through title, axis titles and ticks; y-only subtle rgba
    grid; y-axis from zero
  - layer_tooltips() with formatted count and bin value gives a clean hover in the
    HTML export
  weaknesses:
  - 'DE-02 (both): a four-sided panel frame encloses the plot area where nothing requires
    one, against the style guide''s L-shaped or no-spine rule → no frame, at most
    left and bottom axis lines in INK_SOFT. Likely cause: theme_minimal() base without
    panel_border=element_blank() in the theme() override.'
  - 'Suggestion: x tick labels every 2 cm are dense; a 5 cm step would read more calmly.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, correct.
      Chrome: bold near-black title 'histogram-basic · python · letsplot · anyplot.ai' top-left (~56% of width); x-axis title 'Trunk diameter (cm)', y-axis title 'Frequency' in dark ink; tick labels 28–58 (step 2) and 0–30 (step 5) in INK_SOFT; subtle horizontal grid only; a thin dark four-sided frame around the panel.
      Data: 30 contiguous bars in #009E73 at alpha 0.9 with thin off-white edges; peak of 31 at 35–36 cm, right skew, an empty 46–48 cm gap and a low tail to 58 cm; bars rise from 0.
      Legibility verdict: PASS

