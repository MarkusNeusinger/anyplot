review:
  strengths:
  - Native pygal.Histogram fed (count, start, end) triples straight from np.histogram,
    so the 20 bars are contiguous and equal-width from a zero baseline
  - pygal's css inline hook strokes each bar in the page color, keeping bin edges
    visible in both themes without opening gaps
  - 'opacity=1 on the Style draws the bars in exact #009E73 on both surfaces, so only
    the chrome flips between themes'
  - Clean one-distribution, one-color basic variant with a realistic left-skewed exam-score
    sample
  - 'Adaptable layout: column constants, a Data block ending in df, and output only
    through pygal (PNG + interactive HTML with fancy tooltips)'
  weaknesses:
  - 'VQ-01 (both): the y-axis end ticks ''0'' and ''50'' render at about 44 px while
    the 10-40 ticks and the x ticks render at about 56 px, so the axis reads with
    two tick sizes → one tick size on both axes (about +12 px on the end ticks). Likely
    cause: Style major_label_font_size=44 vs label_font_size=56; pygal draws the y
    min/max as major labels.'
  - 'Suggestion: a slightly heavier stroke on the dark render''s bin edges would separate
    the bins as clearly as the light render''s off-white edges do.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white, sampled #FAF8F1 (250,248,241); not pure white
      Chrome: title "histogram-basic · python · pygal · anyplot.ai" centered in dark ink; y-axis title "Number of students", x-axis title "Exam score (points)"; y ticks 0-50 by 10 (0 and 50 noticeably smaller than 10-40), x ticks 50-90 by 10; dotted horizontal guides in muted ink, subtle but visible; all text readable
      Data: 20 contiguous brand-green bars (sampled #009E73) from ~45 to ~94 points with thin off-white edges between bins; left-skewed shape rising from 1 student in the lowest bin to a 50-count peak near 80, with neighbors 49/49 and a drop to 25 in the last bin; no legend, no annotations
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black, sampled #1A1A17 (26,26,23); not pure black
