review:
  strengths:
  - geom_histogram(binwidth = 5000, boundary = 0) puts every bin edge on a round $5k
    salary, so bin ranges read straight off the $50k ticks
  - Bin edges in translucent ink (alpha(INK, 0.55)) stay visible between bars in both
    themes without opening gaps
  - 45 bins for 400 observations show the right skew, the secondary clusters near
    $105k and $165k and the sparse tail
  - Y axis anchored at zero with expansion(mult = c(0, 0.08)); x ticks via scales::label_dollar(scale
    = 1e-3, suffix = 'k')
  - Theme tokens thread through every chrome element; both renders are theme-correct
  weaknesses:
  - 'Suggestion: a $10k binwidth would smooth the single-count spikes in the $180k-$250k
    tail while keeping the bin edges on round salaries.'
