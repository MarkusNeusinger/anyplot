  strengths:
  - Bin edges in translucent ink (alpha(INK, 0.55)) stay visible between bars in both
    themes without opening gaps
  - 35 bins for 400 observations show the right skew, the secondary clusters near
    $105k and $175k and the sparse tail
  - Y axis anchored at zero with expansion(mult = c(0, 0.08)); x ticks every $50k
    via scales::label_dollar(scale = 1e-3, suffix = 'k')
  - Theme tokens thread through every chrome element; both renders are theme-correct
  weaknesses:
  - 'CQ-05 (code): geom_histogram(bins = 35) sets no boundary, so the bin edges depend
    on the ggplot2 version and land on non-round salaries → add boundary (for example
    binwidth = 5000, boundary = 0, or bins = 35 with boundary = 0). Likely cause:
    the geom_histogram call without boundary, against the library prompt''s ggplot2
    4.0 note.'
  - 'Suggestion: a binwidth on round salary steps (for example $5k) would let readers
    read bin ranges off the $50k ticks.'
