review:
  strengths:
  - geom_smooth(method='loess', span=0.4, se=True) computes the LOWESS curve and its
    semi-transparent band natively in one layer, inside the spec's 0.3-0.5 bandwidth
  - Curve follows the cloud's rise, peak near 15 °C, plateau and decline, and ends
    exactly at the outermost points
  - Imprint positions 1 and 2 give a clear point/curve contrast, identical in both
    themes, with correct theme-adaptive chrome
  - 'Adaptable structure: column constants with role comments and a Data block that
    ends in df'
  - Exact 3200x1800 canvas with the library prompt's text sizes
  weaknesses:
  - 'DE-02 (both): the major and minor grid are drawn in opaque full ink (INK at size
    0.3/0.2) and a frame closes all four sides of the panel, so the grid reads high-contrast
    and competes with the points, short of the style guide''s subtle 15-25 % grid
    with top and right spines removed → grid in INK at about 15 % opacity (or minor
    grid removed) and no top/right border. Likely cause: panel_grid_major/minor=element_line(color=INK)
    without transparency, and the panel border from the theme.'
  - 'Suggestion: a lighter, sparser grid (major lines only) would let the curve carry
    the chart more clearly.'
  - 'Suggestion: lets-plot tooltips (layer_tooltips) on the points could show exact
    temperature and growth values in the HTML view.'
