review:
  strengths:
  - 'Theme tokens threaded through pygal''s Style: both renders theme-correct, data
    colors identical'
  - LOWESS from statsmodels (frac 0.3) follows the plateau and the steep end-of-discharge
    knee and ends at the outermost points
  - Battery discharge scenario gives a curvature that changes along x, the case LOWESS
    is meant for
  - truncate_legend=-1 keeps the full legend labels, including the bandwidth
  - 'Adaptable layout: column constants and a Data block ending in df'
  weaknesses:
  - 'VQ-01 (both): y-axis tick labels mix sizes: the integer ticks 4, 3 and 2 render
    at 44 px while 3.8, 3.6 … render at 56 px, so ''3'' reads small beside ''3.2''
    → one tick size on both axes (major ticks at 56 px, +12 px). Likely cause: major_label_font_size=44
    vs label_font_size=56 in Style.'
  - 'VQ-05 (both): axis titles ''Discharge time (h)'' and ''Cell voltage (V)'' render
    at about 45 px, smaller than the 56 px tick labels they title → axis titles at
    about 56 px (+11 px), at least the tick size. Likely cause: pygal draws axis titles
    at title_font_size, which the long-title shrink sets to 45.'
  - 'Suggestion: the initial-sag term lowers the first hour''s voltage instead of
    dropping it from a higher open-circuit value; a decay from about 4.2 V would match
    a Li-ion discharge more closely.'
  - 'Suggestion: a semi-transparent confidence band around the curve, which the Notes
    allow, would show where the fit is less certain at the knee.'
  image_description: |-
