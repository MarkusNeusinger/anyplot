review:
  strengths:
  - Imprint positions 1 and 2 give green translucent points and a solid violet LOWESS
    curve that read clearly in both themes
  - statsmodels lowess with frac=0.35 and it=3 (robust iterations) as the Notes ask,
    curve spanning exactly the data's x range
  - Column constants and a separated data block make the script adaptable to a user's
    table, with dropna before smoothing
  - Theme tokens threaded through title, axes, ticks, grid and legend; no dark-on-dark
    text
  - Interactive HTML export keeps hover inspection of every measurement
  weaknesses:
  - 'SC-02 (both): the title is only the mandated ''scatter-regression-lowess · python
    · plotly · anyplot.ai'' and does not mention LOWESS smoothing, which the Notes
    and the spec''s title bullet require → prefix a descriptive title that names it,
    e.g. ''Enzyme Kinetics with LOWESS Smoothing · ''. Likely cause: title string
    built from the mandated segment only.'
  - 'SC-02 (both): the LOWESS curve starts at about 15 at x=0.1 while the points between
    x=0 and x=2 sit at about 3-16, so the curve cuts across the steep initial bend
    instead of following its local center (spec bullet: follows the local center through
    its bends) → a curve that starts near the lowest points, e.g. frac about 0.3 or
    denser early sampling (np.geomspace for substrate). Likely cause: frac=0.35 on
    evenly spaced x with very few points on the steep rise.'
  - 'DQ-03 (both): the y values run from about 2 to 92 while the axis names them as
    the ratio V/V_max, which lies between 0 and 1 → either scale the data to 0-1 or
    label it as a percentage. Likely cause: activity generated as 100·S/(Km+S) with
    a ratio label.'
  - 'VQ-06 (both): the y-axis title renders the raw notation ''Enzyme Activity (V/V_max)''
    with a literal underscore → reader text such as ''Enzyme activity (% of Vmax)''.
    Likely cause: the ACTIVITY column constant.'
  - 'Suggestion: the optional confidence band the Notes allow would show where the
    fit is least certain at the steep start.'
