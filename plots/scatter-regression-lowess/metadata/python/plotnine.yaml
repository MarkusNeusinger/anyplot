review:
  strengths:
  - geom_smooth(method='lowess', span=0.4) lets plotnine compute the fit inside the
    layer, matching the spec's 0.3-0.5 bandwidth
  - Sigmoid dose-response data with noise peaking mid-curve gives LOWESS bends and
    changing spread to adapt to; the curve tracks the floor, rise and plateau and
    ends at the outermost points
  - 'Theme tokens thread through every chrome element: both renders readable, data
    colors identical'
  - Clean Imports → Data → Plot → Save structure with column constants and a seeded
    generator
  weaknesses:
  - 'Suggestion: an optional semi-transparent confidence band (the Notes allow one)
    would show where the fit is less certain in the noisy mid-curve.'
