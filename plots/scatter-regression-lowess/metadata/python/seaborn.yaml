review:
  strengths:
  - sns.regplot(data=df, lowess=True) draws points and the LOWESS curve in one call,
    reading the tidy df through the column constants
  - 'Theme tokens threaded through set_theme rc, labels, ticks and spines: both renders
    theme-correct with identical data colors'
  - Exact 3200×1800 canvas from figsize × dpi with no bbox trimming
  weaknesses:
  - 'SC-02 (both): the LOWESS curve is drawn with seaborn''s fixed default bandwidth
    (frac 2/3, outside the Notes'' 0.3–0.5) and flattens into a near-straight line:
    it cuts straight across the sharp dip at x≈5–6 (points fall to y≈2–3 while the
    curve stays near 6) and starts at y≈1.9 where the points at x=0 sit near 0.3 →
    a curve that follows the local center through the dip, with frac 0.3–0.5. Likely
    cause: sns.regplot(lowess=True) exposes no frac; compute the curve with statsmodels
    lowess(frac≈0.3) and draw it with sns.lineplot over sns.scatterplot.'
  - 'SC-02 (both): the title does not mention LOWESS smoothing, which the Notes and
    the spec''s good-version bullet ask for → prefix the mandated title with a descriptive
    one such as ''LOWESS Smoothing of a Non-linear Response · ''. Likely cause: the
    set_title string carries only the mandated segments.'
  - 'VQ-06, DQ-02 (both): the axes read ''Input variable (x)'' and ''Response variable
    (y)'', abstract placeholders with no quantity or unit → a real-world variable
    pair with units (e.g. ''Dose (mg/kg)'' / ''Response (%)''). Likely cause: the
    INPUT and RESPONSE constants.'
  - 'Suggestion: the optional confidence band the Notes allow could be added (e.g.
    bootstrap a statsmodels lowess) as a semi-transparent ribbon.'
  image_description: |-
