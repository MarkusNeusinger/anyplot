      Data: 200 green #009E73 points at alpha 0.6 with a thin page-colored edge; a solid purple #C475FD LOWESS curve rising from y≈1.9 at x=0 to a plateau near 5.8 and up to 8 at x=10. The curve passes straight over the dip at x≈5–6 where the points drop to y≈2–3.
