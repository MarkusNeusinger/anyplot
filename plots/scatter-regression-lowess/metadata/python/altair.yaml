review:
  strengths:
  - 'Points are drawn in Imprint #009E73 at 60 % opacity and size 55, with the LOWESS
    curve as one solid 3 px line in the second Imprint position #C475FD, so the curve
    stands clearly apart from the cloud in both themes'
  - LOWESS at frac=0.3 follows both bends of the sine-plus-trend cloud (peak near
    x=2.7, trough near x=5.4) without wiggling from point to point, and the curve
    spans exactly the data's x range from 0 to 10 with nothing extrapolated
  - Theme tokens are threaded through every chrome element (axis domain, ticks, labels,
    titles, grid at 10 % ink opacity, view fill, title color), so both renders are
    fully legible
  - 'Library-native interactivity: per-point tooltips with formatted values and .interactive()
    zoom/pan in the HTML output'
  weaknesses:
  - 'VQ-06, DQ-02 (both): the axes read "Independent Variable (meters)" and "Dependent
    Variable (kg)", generic role names that tell the reader nothing about what is
    measured, and the pairing of a distance with a mass has no story → name a concrete,
    neutral scenario with real quantities and units (for example "Daily Temperature
    (°C)" against "Electricity Demand (GW)", or "Dose (mg)" against "Response (%)").
    Likely cause: the DISTANCE and MASS column constants.'
  - 'DQ-03 (both): the y axis is labelled in kg, yet several points sit below zero
    (lowest about −0.7 kg at x≈5.5), a negative mass the domain cannot have → generate
    y so that it stays within the quantity''s plausible range (shift the baseline
    or pick a quantity that can be negative). Likely cause: y = 2*sin(0.8x) + 0.5x
    + N(0, 0.8) with no offset.'
  - 'Suggestion: Altair''s native transform_loess(bandwidth=0.3) could compute the
    curve inside the chart spec instead of the statsmodels pre-computation, keeping
    the smoothing visible in the Vega-Lite spec.'
  - 'Suggestion: the optional confidence band the Notes allow could be added as a
    semi-transparent mark_area behind the curve.'
