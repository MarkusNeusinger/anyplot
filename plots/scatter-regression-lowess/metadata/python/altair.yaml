review:
  strengths:
  - 'Real LOWESS via statsmodels lowess(frac=0.3) with return_sorted=True: the purple
    curve follows the U-shaped centre of the cloud, bends at the cold and hot ends,
    ignores the 31 GW outlier at 16 °C and ends exactly at the outermost points (-4.8
    °C and 34.5 °C) with no extrapolation'
  - 'A realistic, neutral scenario: daily electricity demand against mean temperature,
    with a heating load, a flat comfort zone and a steeper cooling load, all in plausible
    GW values'
  - 200 points at size 55 and opacity 0.6 show where the data is dense while the 3
    px curve drawn on top stays clearly distinct in both themes
  - 'Theme tokens reach every chrome element: the warm backgrounds, INK titles, INK_SOFT
    ticks and the 10 % grid all read well on both surfaces, and the data colors are
    identical between the two renders'
  - Layered Altair composition (scatter + line) with formatted tooltips and .interactive()
    zoom/pan gives the HTML view real inspection value
  weaknesses:
  - 'Suggestion: Altair''s native transform_loess(bandwidth=0.3) could compute the
    curve inside the chart spec instead of a precomputed statsmodels frame, keeping
    the fit attached to df in the interactive HTML (note that it has no robustness
    iterations, so the curve would differ slightly).'
  - 'Suggestion: an x-axis tick every 5 °C instead of every 2 °C would thin the 20
    vertical gridlines and calm the background behind the cloud.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the full 3200x1800 canvas; no view frame.
      Chrome: centered bold title "LOWESS Smoothing · scatter-regression-lowess · python · altair · anyplot.ai" at about 63 % of the width; axis titles "Daily Mean Temperature (°C)" and "Electricity Demand (GW)" in dark INK; tick labels -4 to 34 (step 2) and 30 to 60 (step 5) in INK_SOFT; subtle grid at 10 % opacity. Everything is readable.
      Data: about 200 translucent #009E73 circles forming a U-shaped cloud (55 GW at -5 °C, lowest about 38 GW near 17 °C, rising to 54-60 GW at 34 °C); one thick solid purple #C475FD LOWESS curve on top that follows the centre, spans the data's x range and ends at the outermost points.
      Legibility verdict: PASS

