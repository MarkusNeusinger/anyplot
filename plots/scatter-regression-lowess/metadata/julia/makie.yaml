review:
  strengths:
  - LOWESS math is implemented correctly by hand (tricube-weighted local linear regression)
    and produces a smooth, non-oscillating curve that tracks the photosynthesis light-response
    saturation curve faithfully
  - 'Realistic, neutral, domain-plausible data: a plant physiology light-response
    curve (PAR vs. net CO2 assimilation) with correct units and physiologically sensible
    magnitudes'
  - 'Theme-adaptive chrome is correctly threaded through every element (background,
    ink, soft ink, spines, grid) and both renders are legible with identical data
    colors (#009E73 scatter, #4467A3 curve)'
  - 'Clean idiomatic Makie structure: explicit Axis kwargs, spines/gridlines styled
    per the style guide, canvas exactly 3200x1800, no functions/classes, single seeded
    RNG'
  weaknesses:
  - 'The 95% CI confidence band is computed and passed to band!(), and a third legend
    entry (''95% CI'' via PolyElement) is built for it, but neither renders: pixel-sampling
    the saved PNG along the flat middle of the curve (e.g. x=1800) shows the exact
    background color #FAF8F1 immediately above/below the line with zero blue tint
    at any offset, and the rendered legend box only ever shows 2 rows (''Observations'',
    ''LOWESS fit'') -- the ''95% CI'' swatch+label never appears at all. Either the
    band_lo/band_hi values collapse to near-zero width (check the SE formula -- effective_n
    = sw^2/sum(w.^2) with k=70 of 200 points likely overestimates effective sample
    size, making the band too thin to see) or band!() is being drawn in a z-order/units
    combination that makes it invisible; the legend truncation to 2 of 3 entries needs
    separate debugging (verify legend_elements/legend_labels stay length-3 and that
    axislegend isn''t silently dropping the PolyElement row). Fix by either making
    the band visibly wide enough to read (e.g. verify SE isn''t near-zero, or swap
    to a less optimistic effective-N estimate) and confirming all 3 legend rows render,
    or removing the band/legend entry entirely since it is optional per the spec and
    currently ships as dead code that promises a feature it doesn''t deliver.'
  - 'Design Excellence is solid but not exceptional: the confidence band would have
    been the main visual-storytelling differentiator (showing where the LOWESS fit
    is less certain, e.g. at the sparse tails of the light-intensity range) and its
    absence flattens the visual hierarchy back to a fairly standard scatter+line composition.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 -- not pure white, not dark.
      Chrome: Title "scatter-regression-lowess · julia · makie · anyplot.ai" in bold dark ink at top center, ~35% of plot width, fully visible with no clipping. X-axis label "Light Intensity (μmol photons m⁻² s⁻¹)" and y-axis label "Net Photosynthesis (μmol CO₂ m⁻² s⁻¹)" both in dark ink, similarly sized and balanced. Tick labels in a softer gray-ink tone, clearly legible. Grid lines are faint horizontal/vertical off-black at low alpha, subtle but visible. Top and right spines removed; left/bottom spines in soft ink.
      Data: ~200 semi-transparent teal-green (#009E73) scatter points showing a saturating light-response curve (steep rise from ~0 to ~700 μmol, then a broad plateau, slight late decline), overlaid with a solid blue-gray (#4467A3) LOWESS line that tracks the shape smoothly with no visible oscillation. A 95% CI band was computed and given a legend entry in code, but pixel-sampling shows no blue tint anywhere around the line and the legend only shows 2 rows ("Observations", "LOWESS fit") -- the confidence band does not actually render (see weaknesses).
      Legibility verdict: PASS (all rendered chrome and data are readable; the only issue is a non-rendering optional feature, not a legibility failure).

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 -- not pure black, not light.
      Chrome: Same title, axis labels, and tick labels now in light ink (#F0EFE8) / soft light-gray, both clearly legible against the dark surface. Grid lines remain faint and visible without dominating. No dark-on-dark text anywhere.
      Data: Same #009E73 scatter and #4467A3 LOWESS line as the light render -- data colors are identical between themes, only chrome flipped, per the Imprint palette rule. Same missing-band issue as the light render (no visible band, legend still only 2 rows).
      Legibility verdict: PASS (fully readable in dark mode; same non-rendering-band caveat as above, not a legibility defect).
