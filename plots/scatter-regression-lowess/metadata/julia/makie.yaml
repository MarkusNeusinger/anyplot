review:
  strengths:
  - 'Realistic, domain-appropriate data: a photosynthesis light-response (P-I) curve
    is a textbook LOWESS use case, with a genuinely non-linear saturating-then-declining
    shape that benefits from local smoothing.'
  - 'LOWESS parameters match spec guidance: frac=0.35 (within the 0.3-0.5 range),
    tricube weighting, scatter alpha=0.55 (within the 0.5-0.7 range) -- the dense
    mid-range overplotting flagged in the prior review is visibly improved.'
  - 'Clean theme-adaptive chrome: title/labels/ticks/grid correctly flip between light
    and dark via INK/INK_SOFT tokens, backgrounds match #FAF8F1/#1A1A17 exactly, and
    Imprint data colors (brand green points, position-3 blue curve) are pixel-identical
    across both renders.'
  - Correct 3200x1800 canvas, correct output filename convention, single seeded script
    driving both themes, top/right spines removed, frameless elevated-surface legend.
  weaknesses:
  - 'The newly-added 95% CI confidence band is effectively invisible in both renders:
    pixel sampling across the full width of both plot-light.png and plot-dark.png
    finds no perceptible shaded region around the LOWESS curve, even near x=0 where
    the band should be widest. At color=(CURVE_COLOR, 0.18) the fill is too faint
    and, given the tight local weighted-regression standard errors from n=200 points,
    the band is only a few pixels tall in most places -- raise the fill alpha to roughly
    0.3-0.4 and/or verify the polygon is actually being drawn (not just computed)
    so the CI reads as an intentional design element rather than not existing.'
  - 'The band''s legend entry is broken: `band!(...; label="95% CI")` never produces
    a third legend row -- both plot-light.png and plot-dark.png show only two entries
    ("Observations", "LOWESS fit"), confirmed by direct crop inspection of the legend
    region in both themes. Makie''s automatic axislegend does not appear to pick up
    a label from the `band!`/`Band` recipe the way it does for `scatter!`/`lines!`.
    Either add an explicit legend entry (e.g. a `PolyElement` passed to `axislegend(ax,
    [scatter_elem, line_elem, PolyElement(color=(CURVE_COLOR,0.18))], [...])`) or
    drop the ineffective `label` kwarg so the code doesn''t imply a legend row that
    never renders.'
  - 'Library Mastery stays at the default floor: beyond the (currently non-functional)
    confidence band, no Makie-specific idiom sets this apart from a generic Axis/scatter!/lines!/axislegend
    combo.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 -- not pure white, not dark.
      Chrome: Title "scatter-regression-lowess · julia · makie · anyplot.ai" in bold dark ink, centered top, fully within canvas bounds (no clipping). X-axis label "Light Intensity (μmol photons m⁻² s⁻¹)" and Y-axis label "Net Photosynthesis (μmol CO₂ m⁻² s⁻¹)" both dark ink, clearly readable. Tick labels in a softer grey-brown, legible. Grid lines faint on both axes. Top/right spines removed (L-shaped frame). Legend top-left, frameless, on a slightly elevated cream box, reads "Observations" and "LOWESS fit" only -- no third "95% CI" row despite the code labeling the confidence band.
      Data: Scatter points in brand green (#009E73) with a theme-matched stroke, alpha ~0.55, showing a clear saturating light-response shape (steep rise 0-500, plateau ~750-1500, slight decline after 1500 -- photoinhibition). LOWESS fit line in Imprint blue (#4467A3), smooth, tracks the point cloud's central tendency without oscillating. Pixel sampling around the curve (including near x=0, where the CI should be widest) finds no perceptible shaded confidence band anywhere in the image.
      Legibility verdict: PASS -- all rendered text is clearly readable against the light background; no light-on-light issues. (The CI band is a missing/invisible-element issue, not a legibility issue.)

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 -- not pure black, not light.
      Chrome: Same title, axis labels, and tick labels now rendered in light ink/soft-grey tones, fully legible against the dark surface. Grid lines are faint light lines. Legend box uses the dark elevated surface with light text, frameless, matching the light-theme layout -- again only two entries, no "95% CI" row.
      Data: Scatter (brand green) and LOWESS curve (Imprint blue) are pixel-identical in hue/saturation to the light render -- only chrome (background, text, grid, legend box) flipped as expected. As in the light render, no confidence band is visible anywhere along the curve.
      Legibility verdict: PASS -- no dark-on-dark failures; every rendered text element (title, axis labels, ticks, legend) is clearly visible against the near-black background.
