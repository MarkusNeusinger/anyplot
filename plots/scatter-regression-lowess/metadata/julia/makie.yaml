review:
  strengths:
  - 'Realistic, domain-appropriate data: a photosynthesis light-response (P-I) curve
    is a textbook LOWESS use case — the saturating, non-linear shape genuinely benefits
    from local smoothing rather than a parametric fit.'
  - 'LOWESS parameters match spec guidance exactly: frac=0.35 (within 0.3-0.5), tricube
    weighting, point alpha=0.65 (within 0.5-0.7 range).'
  - 'Clean theme-adaptive chrome: title/labels/ticks/grid all correctly flip between
    light and dark via INK/INK_SOFT tokens, backgrounds match #FAF8F1/#1A1A17 exactly,
    and Imprint data colors (brand green for points, position-3 blue for the curve)
    stay identical across both renders.'
  - Scatter markers use a theme-matched stroke (strokecolor=PAGE_BG) instead of a
    flat white edge, which reads cleanly on both the cream and near-black surfaces.
  - Legend is frameless (framevisible=false) with an elevated-surface background,
    consistent with the 'remove box frames around legends' guidance.
  - Correct 3200x1800 canvas, correct output filename convention, single seeded script
    driving both themes.
  weaknesses:
  - No distinctive Makie-specific feature is used beyond the standard Axis/scatter!/lines!/axislegend
    combo — the LOWESS math itself is generic Julia, not a Makie idiom, so Library
    Mastery (LM-02) stays at the default floor.
  - Design Excellence is competent but largely limited to following the mandated style-guide
    defaults (theme tokens, spine removal, subtle grid) rather than adding an extra
    layer of intentional polish (e.g. no confidence band, no annotation calling out
    the saturation plateau, no secondary visual emphasis beyond the curve itself).
  - In the dense mid-range (x 700-2000) scatter overplotting is moderate; a touch
    more transparency or slightly smaller markers there would let the LOWESS curve
    read even more clearly against the point cloud.
  - Optional confidence band around the LOWESS curve (explicitly allowed by the spec)
    was skipped, which would have added a genuine differentiator for Design Excellence
    / Library Mastery.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white, not dark.
      Chrome: Title "scatter-regression-lowess · julia · makie · anyplot.ai" in bold dark ink, centered top, fully within canvas bounds (no clipping). X-axis label "Light Intensity (μmol photons m⁻² s⁻¹)" and Y-axis label "Net Photosynthesis (μmol CO₂ m⁻² s⁻¹)" both dark ink, clearly readable. Tick labels in a softer grey-brown, legible. Grid lines faint, both axes, do not compete with data. Top/right spines removed (L-shaped frame). Legend top-left, frameless, on a slightly elevated cream box, reads "Observations" and "LOWESS fit".
      Data: Scatter points in brand green (#009E73) with subtle theme-matched stroke, alpha ~0.65, showing a clear saturating light-response shape (steep rise from 0-500, plateau ~750-1500, slight decline after 1500 — photoinhibition). LOWESS fit line in Imprint blue (#4467A3), smooth, tracks the point cloud's central tendency without oscillating or overfitting noise.
      Legibility verdict: PASS — all text is clearly readable against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black, not light.
      Chrome: Same title, axis labels, and tick labels now rendered in light ink/soft-grey tones, fully legible against the dark surface. Grid lines are faint light lines, appropriately subtle. Legend box uses the dark elevated surface with light text, frameless, matching the light-theme layout.
      Data: Scatter (brand green) and LOWESS curve (Imprint blue) are pixel-identical in hue/saturation to the light render — only the chrome (background, text, grid, legend box) flipped as expected.
      Legibility verdict: PASS — no dark-on-dark failures; every text element (title, axis labels, ticks, legend) is clearly visible against the near-black background.
