review:
  strengths:
  - Composes the chart from MUI X building blocks (ChartsDataProvider, ChartsSurface,
    ScatterPlot, LinePlot, ChartsXAxis/YAxis) and draws the residual band as a custom
    SVG layer through the useXScale/useYScale hooks, so the band sits in the same
    coordinate system as the data
  - 'LOWESS is a short tricube-weighted local linear fit with frac = 0.4 (68 of 170
    points per window), evaluated on 120 grid x positions from the minimum to the
    maximum observed speed: the curve follows the inverted-U through its bend and
    ends at the outermost points without extrapolating'
  - Points at their exact values in Imprint green at 0.6 opacity, curve in solid purple
    (palette position 2) at 3.5 px drawn on top, band in the theme-adaptive inkSoft
    tone at 0.16 opacity with every point inside still visible
  - 'Title and subtitle hierarchy: the subtitle states n, the span and what the shaded
    band means, so the reader gets the method parameters without an annotation on
    the data'
  - Plausible, neutral scenario (test-drive fuel efficiency against vehicle speed,
    peaking near 75–80 km/h) with a seeded LCG, so the output is deterministic
  - Theme chrome is threaded through the tokens (ink, inkSoft, pageBg) and the item
    tooltip adds per-point inspection in the HTML view
  weaknesses:
  - 'Suggestion: the curve shows small corners near 73 km/h and 108 km/h where the
    nearest-neighbour window changes. A finer grid or a robustness iteration would
    make it read smoother.'
  - 'Suggestion: the y-axis title sits about 50 px from its tick labels. A slightly
    narrower y-axis band would tighten the left edge.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole canvas.
      Chrome: bold dark title "LOWESS Smoothing · scatter-regression-lowess · javascript · muix · anyplot.ai" (about 52 % of the width), grey subtitle with n = 170, span frac = 0.4 (68 nearest points), and a note that the band is ±1 SD of the local residuals; legend at top right ("Observations", "LOWESS fit (frac = 0.4)"); axis titles "Vehicle speed (km/h)" and "Fuel efficiency (km/L)"; ticks 20–140 and 8–22; subtle grid on both axes. All text is dark and readable.
      Data: 170 translucent #009E73 points forming an inverted-U, a solid purple LOWESS curve rising from about 12 at 23 km/h to a peak of about 18.7 near 75 km/h and falling to about 10.9 at 139 km/h, and a light grey ±1 SD band around it. The points inside the band are still visible.
      Legibility verdict: PASS

