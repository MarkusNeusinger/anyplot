review:
  strengths:
  - 'Palette order violation from attempt 1 is fixed: the LOWESS line now uses t.palette[1]
    (#C475FD lavender) per the canonical Imprint order, instead of the previously
    cherry-picked palette[2] blue'
  - New ±1 SD confidence band around the LOWESS curve, computed as the weighted RMS
    residual per local window and rendered as a translucent path via the community
    useXScale/useYScale hooks — a genuinely advanced, library-idiomatic technique,
    not a canned feature
  - Band is drawn and z-ordered before ScatterPlot/LinePlot so it sits behind the
    data and fit line rather than competing with them for attention, strengthening
    the data storytelling around fit uncertainty
  - LOWESS curve remains a genuine locally-weighted regression (tricube kernel, weighted
    normal equations) over a 120-point grid, tracing the non-monotonic speed/efficiency
    relationship cleanly without oscillation
  - Scatter alpha (0.6) and marker size (8px) remain well matched to the 170-point
    density per the spec's alpha ~0.5-0.7 guidance
  - 'Both renders remain fully theme-correct: correct page backgrounds, all chrome
    text readable, identical data colors between light and dark, canvas at 3200x1800'
  weaknesses:
  - 'Design Excellence is still close to baseline: grid renders both horizontal and
    vertical lines at default MUI X styling with no subtler grid treatment or spine/legend
    framing refinement beyond the two series colors and the new band — consider a
    lighter/y-axis-only grid or added emphasis around the fit-line region to lift
    DE-01/DE-02.'
  - Legend swatches render as solid squares rather than reflecting the scatter series'
    actual 0.6 alpha — a very minor mismatch between legend and rendered marker appearance.
  - Title occupies a noticeably narrower share of the plot width (~35%) than the 50-70%
    (up to ~70-85% for the mandated long title) proportional guideline — not a defect
    since it's fully legible with no overflow, but a slightly conservative use of
    the title's visual weight.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1, not pure white.
      Chrome: Title "scatter-regression-lowess · javascript · muix · anyplot.ai" in dark ink, top-left, fully visible and not clipped. X-axis label "Vehicle Speed (km/h)" and Y-axis label "Fuel Efficiency (km/L)" both dark, clearly readable with units. Tick labels on both axes are dark and legible. Legend ("Vehicles (observed)", "LOWESS fit") sits top-right in dark text with colored swatches, no overlap with data or title. Grid lines (horizontal + vertical) are thin and subtle, don't compete with data.
      Data: Scatter points are brand green (#009E73) at ~0.6 alpha, moderately dense but individually distinguishable (170 points, size 8px). The LOWESS fit is a solid lavender (#C475FD) line, 3.5px, tracing a smooth rise-peak-fall arc matching the non-monotonic speed/efficiency relationship, with a new translucent gray ±1 SD confidence band drawn behind it — band sits cleanly behind the scatter/line, doesn't obscure either.
      Legibility verdict: PASS — no light-on-light text found anywhere.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17, not pure black.
      Chrome: Same title, axis labels, tick labels, legend and grid all re-rendered in light ink (theme-adaptive) — fully legible against the dark surface. No dark-on-dark text anywhere; grid lines are faint but visible.
      Data: Scatter points and LOWESS line use the identical #009E73 / #C475FD hex values as the light render — only the chrome (text, grid, legend, band tint) flipped tone, confirming the Imprint theme-adaptive contract is respected for data colors. The confidence band remains legible as a subtle darker-gray region against the near-black background without washing out the fit line.
      Legibility verdict: PASS — all chrome text reads clearly against the dark background; no dark-on-dark failures observed.
