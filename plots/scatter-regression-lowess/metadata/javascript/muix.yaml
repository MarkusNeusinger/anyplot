review:
  strengths:
  - LOWESS curve is a genuine locally-weighted regression (tricube kernel, weighted
    normal equations) computed over a 120-point grid, not a canned smoother — it traces
    the non-monotonic speed/efficiency relationship cleanly without oscillation or
    overfitting
  - Correct use of the MUI X composition API (ChartContainer + ScatterPlot + LinePlot
    + separate axis/grid/legend/tooltip components) to combine two series types that
    the high-level ScatterChart wrapper can't mix directly
  - Scatter alpha (0.6) and marker size (8px) are well matched to the 170-point density,
    per the spec's alpha ~0.5-0.7 guidance
  - Deterministic data generation via a fixed-seed LCG (seed 42) with a plausible,
    non-controversial domain (vehicle speed vs. fuel efficiency) that motivates the
    non-linear pattern LOWESS is meant to reveal
  - 'Both renders are fully theme-correct: correct page backgrounds, all chrome text
    readable, identical data colors between light and dark, canvas gate passed at
    3200×1800'
  - Title, axis labels (with units), and legend text all match spec requirements with
    no clipping or overflow
  weaknesses:
  - 'Palette order violation (VQ-07): the LOWESS line uses t.palette[2] (#4467A3 blue)
    but per the Imprint canonical-order rule the second series should use t.palette[1]
    (#C475FD lavender) — ''use positions 1→N in order, don''t cherry-pick for aesthetic
    reasons.'' There''s no documented semantic exception here (a fit line isn''t a
    real-world blue object), so change series[1].color to t.palette[1].'
  - No confidence band around the LOWESS curve — spec lists this as optional, but
    adding a shaded band (e.g. using the muted anchor or a low-alpha fill) would strengthen
    Data Storytelling (DE-03) and Feature Coverage (DQ-01).
  - 'Design Excellence is at/near baseline defaults: axis, grid, and legend styling
    are mostly MUI X composition defaults with limited additional custom refinement
    (spine/legend framing, deliberate visual hierarchy beyond the two series colors)
    — consider a subtler grid or added emphasis on the fit line region to lift DE-01/DE-02.'
  - Legend swatches render as solid squares rather than reflecting the scatter series'
    actual 0.6 alpha, which is a very minor mismatch between legend and rendered marker
    appearance.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1, not pure white.
      Chrome: Title "scatter-regression-lowess · javascript · muix · anyplot.ai" in dark ink, top-left, fully visible and not clipped. X-axis label "Vehicle Speed (km/h)" and Y-axis label "Fuel Efficiency (km/L)" both dark, clearly readable with units. Tick labels on both axes are dark and legible. Legend ("Vehicles (observed)", "LOWESS fit") sits top-right in dark text with colored swatches, no overlap with data or title. Grid lines (horizontal + vertical) are thin and subtle, don't compete with data.
      Data: Scatter points are brand green (#009E73) at ~0.6 alpha, moderately dense but individually distinguishable (170 points, size 8px). The LOWESS fit is a solid blue (#4467A3) line, 3.5px, tracing a smooth rise-peak-fall arc that matches the described non-monotonic speed/efficiency relationship — no jaggedness or overfitting to noise.
      Legibility verdict: PASS — no light-on-light text found anywhere.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17, not pure black.
      Chrome: Same title, axis labels, tick labels, legend and grid all re-rendered in light ink (theme-adaptive) — fully legible against the dark surface. No dark-on-dark text anywhere; grid lines are faint but visible.
      Data: Scatter points and LOWESS line use the identical #009E73 / #4467A3 hex values as the light render — only the chrome (text, grid, legend) flipped tone, confirming the Imprint theme-adaptive contract is respected for data colors.
      Legibility verdict: PASS — all chrome text reads clearly against the dark background; no dark-on-dark failures observed.
