review:
  strengths:
  - Hand-implemented Cleveland LOWESS (tricube weights + bisquare robustness iterations)
    rather than a naive smoother — genuine statistical rigor in vanilla JS with no
    stats library available
  - 'Correct Imprint palette usage: brand green (#009E73) for scatter points, lavender
    (#C475FD) for the regression curve, canonical order, identical data colors across
    both themes'
  - Adaptive title font-sizing formula keeps the long mandated title plus descriptive
    prefix comfortably within canvas bounds in both renders
  - Moderate marker alpha (0.6) with a page-background border creates clean separation
    between overlapping points while preserving density perception
  - Descriptive, unit-labeled axes ('Weekly Ad Spend ($1,000s)', 'Conversion Rate
    (%)') and a title that explicitly names the LOWESS technique
  - Deterministic seeded (LCG) synthetic data with a plausible non-linear ad-spend/conversion
    narrative, including an 'ad fatigue' dip that the fitted curve visibly captures
    without oscillation
  weaknesses:
  - 'Legend renders the LOWESS line series with a circular point-style swatch (global
    usePointStyle: true) instead of a line-segment swatch, slightly undercommunicating
    that it''s a curve rather than a point series'
  - The from-scratch LOWESS implementation needs several helper functions (makeRng,
    gaussian, lowess, withAlpha) — unavoidable given the browser has no stats library,
    but it deviates from the ideal 'no functions' KISS baseline
  - Optional confidence band around the LOWESS curve (explicitly optional in the spec)
    was not implemented — would have added extra statistical communication value
