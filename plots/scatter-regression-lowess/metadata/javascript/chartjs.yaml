      Data: First series (scatter, "Weekly campaigns") is brand green (#009E73) with a light-background-colored border ring, alpha ~0.6 — density and the underlying curve remain visible through the points. Second series (LOWESS fit) is a solid lavender/purple line, clearly distinct in both hue and weight from the scatter points, tracing a smooth rise-plateau-slight-dip curve through the noisy cloud.
