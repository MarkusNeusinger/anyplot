review:
  strengths:
  - 'Directly and precisely addressed every attempt-1 weakness: removed default axis
    lines, added a saturation marker + ad-fatigue plot band, color-coded the trend
    line''s decline segment via zones, and increased marker radius/opacity for better
    visibility'
  - 'Correct Imprint palette usage: first series is #009E73, identical between light
    and dark renders; amber accent consistent across themes'
  - Theme-adaptive chrome correctly implemented — background, title, subtitle, axis
    text, grid, and the LOWESS trend line color all flip appropriately with no dark-on-dark
    or light-on-light failures
  - LOWESS trend implemented as a genuine tricube-weighted local linear regression
    evaluated on a dense grid, not a canned smoother, with frac=0.35 in the recommended
    0.3-0.5 range
  - Deterministic, reproducible data generation via a seeded LCG + Box-Muller gaussian
  - Title format matches the mandated pattern exactly; axis labels are descriptive
    and carry units
  - Realistic, neutral business scenario with a genuinely non-monotonic saturation-then-fatigue
    shape that showcases why LOWESS is useful
  weaknesses:
  - The legend only labels 'Weekly observations' and 'LOWESS smoothed trend' — it
    doesn't visually distinguish the amber decline segment, so a viewer relying solely
    on the legend (not the plot-band label) could miss that the dashed portion means
    something different
  - Overall color palette is still limited to green/ink/amber; a touch more restrained
    typographic hierarchy would push Aesthetic Sophistication further
  - Confidence band around the LOWESS curve was not added (explicitly optional in
    the spec, so not a deduction, but would be a nice next-level touch)
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1
      Chrome: Title, subtitle, axis titles, and tick labels are dark and clearly readable. Axis lines/ticks removed (no default spines). Grid lines subtle. Legend centered below plot, readable.
      Data: ~200 semi-transparent green (#009E73) scatter points; solid black LOWESS curve up to saturation point (~$71k) then dashed amber decline segment; dashed vertical guide line + "Saturation ~$71k" label; shaded "Ad-fatigue region" plot band with italic label.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17
      Chrome: Title, subtitle, axis titles, and tick labels are white/light-gray and clearly readable against the dark background. No dark-on-dark failures. Grid lines subtle.
      Data: Same #009E73 green scatter points and amber decline/plot-band color as light render (confirmed identical). LOWESS trend line correctly flips from black to white via the ink token, preserving contrast.
      Legibility verdict: PASS
