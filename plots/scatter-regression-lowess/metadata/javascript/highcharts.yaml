review:
  strengths:
  - 'Correct Imprint palette usage: first series is #009E73, identical between light
    and dark renders'
  - Theme-adaptive chrome correctly implemented — background, title, subtitle, axis
    text, grid, and the LOWESS trend line color all flip appropriately with no dark-on-dark
    or light-on-light failures
  - LOWESS trend implemented as a genuine tricube-weighted local linear regression
    evaluated on a dense grid, not a canned smoother — solid mathematical grounding
    for the spec's core requirement
  - Deterministic, reproducible data generation via a seeded LCG + Box-Muller gaussian,
    no external RNG dependency
  - Title format matches the mandated pattern exactly; axis labels are descriptive
    and carry units ($1,000s / units)
  - Realistic, neutral business scenario (ad spend vs. weekly sales) with a genuinely
    non-monotonic saturation-then-fatigue shape that showcases why LOWESS is useful
    over a simple linear fit
  weaknesses:
  - 'Design Excellence is generic: a single green scatter series plus a black/white
    trend line with default Highcharts axis lines reads as a well-configured default
    rather than a publication-ready design — consider removing the axis lines entirely
    (spineless look) or adding subtle refinements to lift it above the default look.'
  - 'No data storytelling beyond the raw curve: the LOWESS line reveals a clear saturation
    point and mild ad-fatigue decline past ~$65k spend, but nothing calls this out
    — a light annotation or callout near the peak/decline would turn ''shows data''
    into ''tells a story''.'
  - 'Library Mastery is generic: besides Highcharts.color().setOpacity() for marker
    alpha, nothing here is distinctive to Highcharts — consider using a feature like
    axis plotBands/zones to shade the saturation vs. fatigue regions, or series.zones
    on the trend line to color-code the decline segment.'
  - Scatter markers (radius 5, alpha 0.6) are on the small/light side for 200 points
    spread across a wide value range — a slightly larger radius or higher fill opacity
    would improve element visibility without hurting overplotting readability.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Bold dark title "scatter-regression-lowess · javascript · highcharts · anyplot.ai" at top center, gray subtitle "LOWESS trend, bandwidth frac = 0.35" beneath it. Dark-gray axis titles "Advertising Spend ($1,000s)" (x) and "Weekly Sales (units)" (y), gray tick labels on both axes, subtle light-gray gridlines on both axes. Legend centered below the plot with two entries: a green dot for "Weekly observations" and a black line swatch for "LOWESS smoothed trend." All chrome text is clearly legible against the light background.
      Data: ~200 semi-transparent green (#009E73) scatter points showing a steep rise from low spend, flattening into a plateau, with a slight downward bend at high spend (ad-fatigue). A solid black LOWESS curve threads through the point cloud, clearly distinct in color and weight from the scatter cloud.
      Legibility verdict: PASS — no dark-on-light or light-on-light issues, no clipped text at any canvas edge.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title/subtitle/axis-label/legend layout, now rendered in white/light-gray text, fully legible against the dark background. Gridlines are subtle light lines at low opacity. No dark-on-dark text anywhere.
      Data: The scatter points are the same #009E73 green as the light render (confirmed identical), and the LOWESS trend line has flipped from black to white (following the theme-adaptive ink token), preserving contrast against the dark background while keeping the data color constant.
      Legibility verdict: PASS — all chrome text reads clearly, data colors match the light render exactly, no dark-on-dark failures.
