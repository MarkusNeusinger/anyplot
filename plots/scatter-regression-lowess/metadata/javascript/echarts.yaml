review:
  strengths:
  - Confidence band around the LOWESS curve is now implemented via a stacked-area
    trick (invisible lower base + shaded upper band from local weighted-residual RMS),
    directly addressing the spec's optional nice-to-have and last review's weakness.
  - 'Distinctive ECharts features added since last review: markLine calls out the
    optimum temperature with a dashed vertical rule and label, markPoint marks the
    exact peak, and shadowBlur/shadowColor give the LOWESS curve a subtle glow — meaningfully
    raising design sophistication beyond token wiring.'
  - 'LOWESS math is correct and reproducible: single-pass tricube-weighted local linear
    regression with frac=0.35 (within the spec''s 0.3-0.5 guidance), smooth non-oscillating
    curve, fixed-seed LCG for deterministic data.'
  - Theme-adaptive chrome and Imprint palette are wired correctly end-to-end in both
    renders — brand green first series, identical data colors across themes, only
    chrome (background/text/grid) flips.
  - Data tells a compelling non-monotonic story (enzyme reaction rate rising to an
    optimum near 38°C then collapsing past denaturation) that plays directly to LOWESS's
    strength versus a single polynomial fit.
  weaknesses:
  - 'Legend/line color mismatch (confirmed in both plot-light.png and plot-dark.png):
    the ''LOWESS fit'' legend swatch renders as a lavender/purple circle (palette[1]),
    but the actual curve in the chart is blue (palette[2], set via lineStyle.color).
    Cause: the ''LOWESS fit'' series sets lineStyle.color but never itemStyle.color,
    so ECharts falls back to the auto-assigned series color (from the top-level color
    array, by series index) for the legend icon instead of matching the explicit line
    color. Fix: add itemStyle: { color: t.palette[2] } to the ''LOWESS fit'' series
    so the legend swatch matches the rendered curve.'
  - Chart chrome (grid split lines, axis lines/ticks) still uses plain default styling
    with no extra refinement beyond the curve-specific glow and confidence band —
    there's room for more polish (e.g. subtler split-line opacity, refined tick styling)
    to push Design Excellence further.
  - Markers cluster and overlap noticeably in the dense peak region (~35-42°C, rate
    80-95); alpha=0.6 helps but individual points are hard to distinguish there —
    a touch more transparency or smaller symbolSize in that zone would improve readability
    without hurting the sparse tails.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1), not pure white or dark - PASS
      Chrome: Title "scatter-regression-lowess · javascript · echarts · anyplot.ai" centered at the top, fully readable in dark ink at ~58% of plot width. Legend below the title ("Reaction rate", "LOWESS fit", "Confidence band") is readable, though the "LOWESS fit" swatch is rendered as a lavender/purple hollow circle even though the actual curve is blue (color mismatch, see Weaknesses). X-axis "Temperature (°C)" and y-axis "Reaction Rate (µmol/min)" labels are readable with units, tick labels legible, dashed split-lines subtle.
      Data: Green scatter points (Imprint #009E73) at alpha~0.6 trace a rise-peak-fall pattern from ~5°C to ~50°C. A solid blue LOWESS curve (palette[2]) with a subtle glow sits clearly above the point cloud, smooth without oscillation, tracking the peak near 38°C. A faint shaded confidence band surrounds the curve. A dashed vertical marker line labeled "Optimum ≈ 38°C" and a small blue peak-point circle sit cleanly in open space above the data cluster, not overlapping any text or points.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17), not pure black - PASS
      Chrome: Same title, legend, and axis labels rendered in light ink/inkSoft tones, fully readable against the dark background; grid lines subtle but visible; no dark-on-dark text found. The same "LOWESS fit" legend color mismatch (lavender swatch vs. blue curve) is present here too, confirming it is a color-mapping bug rather than a light-theme rendering artifact.
      Data: Scatter point color and LOWESS curve color are identical to the light render (only chrome flipped, as required). The blue curve with its glow remains clearly distinguishable from the green points and dark background; confidence band and optimum annotation are equally legible.
      Legibility verdict: PASS

    Both renders pass the theme-readability checklist. Data colors are identical between themes; only background, text, and grid chrome adapt per theme. No canvas dimension gate file present (canvas gate passed, 3200x1800). No edge clipping observed on any title, axis label, or legend text in either render.
