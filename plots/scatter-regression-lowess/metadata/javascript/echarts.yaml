review:
  strengths:
  - 'Correct LOWESS implementation: single-pass tricube-weighted local linear regression
    with frac=0.35, matching the spec''s recommended 0.3-0.5 bandwidth range, and
    the curve is smooth without visible overfitting or oscillation.'
  - Data tells a compelling non-monotonic story (enzyme reaction rate rising to an
    optimum near 38C then collapsing past denaturation), matching the spec's suggested
    biological dose-response application.
  - 'Theme-adaptive chrome is wired correctly end-to-end via window.ANYPLOT_TOKENS:
    first series is Imprint brand green (#009E73), the LOWESS curve uses a clearly
    contrasting color, and z:10 keeps the curve visibly above the point cloud in both
    renders.'
  - Points use alpha=0.6 (within the spec's 0.5-0.7 guidance) to show density under
    n=160 points, and the mount-node contract is followed exactly (no explicit width/height,
    no devicePixelRatio, animation:false).
  weaknesses:
  - 'Library Mastery is generic: no ECharts-distinctive features are used (e.g. markLine/markArea
    to flag the optimum temperature, a tooltip formatter, or an area-based confidence
    band) that would showcase what this library specifically offers beyond a basic
    scatter+line combo.'
  - 'Design excellence stops at token wiring: axis lines and split lines use plain
    default styling with no extra refinement (no subtle glow/shadow on the curve,
    no callout on the peak) beyond correct color mapping.'
  - The optional confidence band around the LOWESS curve (mentioned in the spec as
    a nice-to-have) is not implemented, which would strengthen the data storytelling
    further.
