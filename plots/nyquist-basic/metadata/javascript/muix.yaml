review:
  strengths:
  - Composes the chart from ChartsDataProvider, ChartsWrapper and ChartsSurface, and
    draws the direction arrows in a custom SVG layer positioned with the useXScale/useYScale
    hooks, so every arrowhead sits on the curve and is rotated to the local tangent
    in screen space
  - 'Gain and phase crossovers are found from the data (interpolated between the straddling
    rows, frequency on its log scale) rather than typed in; the values check out against
    G(s)=1/(s(1+s)(1+0.5s)): phase crossover at omega = sqrt(2) = 1.41 rad/s on Re
    = -1/3 (gain margin 9.5 dB), gain crossover at 0.75 rad/s'
  - The unit circle is drawn as a parametric line on a hidden second x axis that shares
    the visible scale, and the square window uses one span on both axes, so the circle
    is a true circle at 1:1
  - 'Clear visual hierarchy: a 3 px brand-green response curve over a thin dashed
    theme-ink unit circle, the critical point in the Imprint matte-red anchor and
    the crossovers in lavender, all distinct in both themes'
  - The legend glyph of the unit circle is styled dashed to match its line, and the
    computed phase and gain margins are read out in the subtitle
  - Theme tokens threaded through title, subtitle, axis labels, ticks, grid, origin
    axes and annotation text; both renders fully legible
  weaknesses:
  - 'Suggestion: the legend lists the entries alphabetically rather than in drawing
    order; ordering them curve, unit circle, critical point, crossovers would read
    more naturally.'
  - 'Suggestion: the faint negative-frequency mirror the spec permits would show the
    closed Nyquist contour around the critical point.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, square 2400x2400 canvas.
      Chrome: bold title "nyquist-basic · javascript · muix · anyplot.ai" centered at top, softer subtitle "600 frequencies from 0.40 to 25.0 rad/s · phase margin 32.6° · gain margin 9.5 dB", horizontal legend (Crossover frequencies, Critical point (-1, 0), Open-loop response G(jω), Unit circle). Axis titles "Real" and "Imaginary", ticks -1.6..1.4 and -2.0..1.0 in steps of 0.2, subtle grid on both axes, thin axes through the origin. All dark text, all readable.
      Data: thick brand-green #009E73 Nyquist curve rising from (-1.25, -1.9) toward the origin, crossing the dashed unit circle at the lavender gain-crossover dot (-0.84, -0.54, labeled ω = 0.75 rad/s) and the negative real axis at the lavender phase-crossover dot (-0.33, 0, labeled ω = 1.41 rad/s), then curling just above the axis into the origin. Three green arrowheads along the curve point toward increasing frequency. Matte-red filled circle at (-1, 0) on the unit circle. Dashed unit circle in ink-soft, round at 1:1.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
