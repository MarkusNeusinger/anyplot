review:
  strengths:
  - Whole 2400x2400 canvas in the theme page color via the gggrid wrapper, so both
    renders are theme-clean edge to edge
  - Gain and phase margins computed from the response (phase and gain crossover detection)
    rather than hard-coded
  - layer_tooltips() exposes Re, Im and omega on the curve in the HTML output
  - Theme-adaptive PM label color keeps it readable on the dark label fill
  weaknesses:
  - 'SC-01 (both): a dotted red gain-margin segment runs from (-1, 0) to the phase
    crossover, a reference line the basic variant excludes (GM may be read as a label
    only) → remove the segment and keep the GM label at the crossover. Likely cause:
    the geom_segment in gm_layers.'
  - 'SC-02 (both): frequency labels sit at fixed 0/16/40/70 % index positions (w=0.01,
    0.04, 0.39, 6.27), offset from the curve with no anchor mark, while the gain crossover
    (w~1.29) and phase crossover (w~4.1) carry no frequency value → label the crossover
    frequencies at their points. Likely cause: label_at = fractions of n instead of
    the crossover indices k and crossings[0].'
  - 'VQ-02 (both): the ''PM = 80.9°'' label box covers about 60 px of the green response
    curve below the gain crossover → place it clear of the curve. Likely cause: df_pm_label
    offset (+0.09*span, -0.10*span) lands on the curve.'
  - 'Suggestion: drop the origin ''+'' marker, which crowds the w=6.27 label and the
    high-frequency end of the curve.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the full 2400x2400 canvas.
      Chrome: title 'nyquist-basic · python · letsplot · anyplot.ai' and subtitle with G(s) and the stability verdict in dark ink; axis titles 'Real' and 'Imaginary'; ticks -1..2 and -1.4..1.4 readable; subtle grid, no panel border.
      Data: thick #009E73 Nyquist curve from (2,0) spiralling clockwise to the origin, three green arrowheads; faint dashed blue mirror; dashed gray unit circle; large red X at (-1,0) with '(−1, 0)' label; dotted red GM segment to the crossover with 'GM = 15.9 dB'; blue ring at the gain crossover with 'PM = 80.9°' label partly over the curve; four ω labels; gray '+' at origin.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
