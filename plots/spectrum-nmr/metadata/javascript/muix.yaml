review:
  strengths:
  - 'Realistic first-order splitting: the CH3 triplet reads 1:2:1 (≈36/70/36) and
    the CH2 quartet 1:3:3:1 (≈13/35/35/13), lines evenly spaced and resolved at full-spectrum
    scale, Lorentzian line shapes on a flat low-noise baseline'
  - 'X axis reversed natively via the axis config `reverse: true` with data-derived
    limits (−0.5 to 4.6 ppm), TMS singlet sharp at 0.00 ppm near the right end'
  - Peak labels are derived from the data (local-maximum detection plus multiplet
    grouping) and drawn in chart coordinates with MUI X's `useXScale`/`useYScale`
    hooks as a composed SVG child of LineChart, each giving δ and multiplicity (3.70
    q, 2.60 s, 1.20 t, 0.00 s)
  - 'Theme tokens threaded through every element: ink/inkSoft text, t.grid horizontal
    grid, brand green #009E73 trace identical in both renders; reserved y headroom
    (LABEL_HEADROOM_SHARE) keeps the tallest label clear of the title'
  - Deterministic LCG seed, 6,000 points within the spec's 1000–8000 range, ethanol
    shifts and ~7 Hz couplings plausible, CH3:CH2:OH areas scaled 3:2:1
  weaknesses:
  - 'Suggestion: the y axis ticks every 5 units (16 gridlines) could be thinned to
    every 10 for a calmer field behind the spectrum.'
  - 'Suggestion: an integration trace or proton-count annotation per multiplet would
    deepen the chemistry story in the interactive view.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole canvas, 3200x1800.
      Chrome: bold dark title "spectrum-nmr · javascript · muix · anyplot.ai" centered at top (~29% width) with a soft-grey subtitle "6,000 points from −0.5 to 4.6 ppm · 4 signals, 9 resolved lines · labels give δ and multiplicity"; x axis "Chemical shift δ (ppm)" reversed from 4.6 on the left to −0.4 on the right in 0.2 steps; y axis "Intensity (a.u.)" 0–75 in steps of 5; subtle horizontal grid lines; left and bottom axis lines only. All text dark on light and readable.
      Data: one continuous #009E73 trace on a flat baseline near 0.3; CH2 quartet at 3.70 ppm (outer ≈13, inner ≈35), broader OH singlet at 2.60 (≈15), CH3 triplet at 1.20 (≈36/70/36), TMS singlet at 0.00 (≈24). Bold labels "3.70 q", "2.60 s", "1.20 t", "0.00 s" sit just above each signal, no collisions.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
