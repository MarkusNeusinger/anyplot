review:
  strengths:
  - Correct reversed x-axis matching NMR convention, with a realistic chemical-shift
    range (4.6 to -0.5 ppm)
  - Realistic synthetic ethanol 1H NMR spectrum built from Lorentzian peaks with a
    clean, low-noise baseline and a TMS reference peak at 0 ppm
  - Clean, deterministic, well-structured code (seeded LCG, small addLorentzian/addMultiplet
    helpers, no unnecessary abstraction)
  - Reference-line peak labels correctly identify functional groups (TMS, CH3, OH,
    CH2), adding real analytical storytelling value
  - Theme-adaptive chrome correctly implemented — data green identical across light/dark,
    no dark-on-dark or light-on-light legibility failures
  - Correct title format, and legend appropriately hidden for the single series
  weaknesses:
  - Splitting patterns (CH3 triplet at 1.20 ppm, CH2 quartet at 3.70 ppm) are only
    partially resolved into a dominant peak plus a subtle shoulder rather than distinct
    1:2:1 / 1:3:3:1 multiplet lines — widen the splitting-to-halfWidth ratio (e.g.
    increase `splitting` relative to `halfWidth` in addMultiplet) so each line in
    the triplet/quartet is individually visible, matching the spec's 'well-resolved'
    requirement.
  - The tallest peak (CH3 at 1.20 ppm, apex ≈79.3) sits right at the yAxis autoscale
    max of 80, leaving almost no headroom above the peak and making it look like it
    grazes the top plot boundary — set an explicit yAxis `max` (e.g. ~90-95) so the
    tallest peak has clear headroom.
  - OH (1H) is rendered as the tallest peak (unitHeight=52) while CH3 (3H) and CH2
    (2H) are shorter, inverting the proton-count-driven prominence a reader would
    expect from a real ethanol spectrum — consider peak heights that better reflect
    a plausible relative ordering.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1-ish), not pure white — matches the required light surface.
      Chrome: Title "spectrum-nmr · javascript · muix · anyplot.ai" is dark, bold-weight, centered, and fully readable. Axis titles "Chemical Shift (δ, ppm)" and "Intensity (a.u.)" are dark and legible. Tick labels along both axes are dark grey and legible. Horizontal grid lines are subtle, light grey, non-competing. Four vertical dashed reference lines (dark grey) mark 3.70, 2.60, 1.20, and 0.00 ppm, each with a small dark-grey text label ("3.70 (CH2)", "2.60 (OH)", "1.20 (CH3)", "0.00 (TMS)") placed just right of the dashed line at mid-plot height, with no overlap with other text or data.
      Data: Single brand-green (#009E73) line tracing a low, slightly noisy baseline with four sharp Lorentzian-shaped peaks rising from it — a tall peak near 3.70 ppm (~74), a shorter peak near 2.60 ppm (~52), a taller peak near 1.20 ppm that reaches almost to the very top of the axis (~79, close to the axis max of 80), and a smaller peak at 0.00 ppm (~25, the TMS reference). The 1.20 ppm and 3.70 ppm peaks each show a faint shoulder hinting at multiplet splitting, but the individual lines of the triplet/quartet are not crisply separated.
      Legibility verdict: PASS — all text is clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17-ish), not pure black — matches the required dark surface.
      Chrome: Title and axis titles render in light/white text, clearly legible against the dark background. Tick labels are light grey and legible. Horizontal grid lines are faint light grey, subtle but visible. The four vertical dashed reference lines switch to white/light dashed strokes, with their peak-identification labels rendered in a light grey tone that reads clearly against the near-black background — no dark-on-dark failure anywhere.
      Data: The same brand-green (#009E73) line and peak shapes as the light render — heights, positions, and peak shapes are identical, confirming only the chrome (background, text, grid, reference-line color) flipped between themes and the data color stayed constant.
      Legibility verdict: PASS — all text and data are clearly readable against the dark background; no dark-on-dark issues detected.
