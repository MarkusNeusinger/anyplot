review:
  strengths:
  - Multiplet splitting patterns (CH3 triplet 1:2:1 at 1.20 ppm, CH2 quartet 1:3:3:1
    at 3.70 ppm) are now clearly resolved into distinct sub-lines with visible saddle
    points between them, matching the spec's well-resolved-multiplet requirement
  - Explicit yAxis max=90 gives the tallest peak (CH3, apex ~69.5) comfortable headroom
    instead of touching the axis boundary
  - Relative peak heights now follow a chemically sensible order (CH3 > CH2 > OH >
    TMS), correcting the prior inversion where the single-proton OH peak was tallest
  - Correct reversed x-axis matching NMR convention, with a realistic chemical-shift
    range
  - Clean, deterministic, well-structured code (seeded LCG, small addLorentzian/addMultiplet
    helpers, no unnecessary abstraction)
  - Reference-line peak labels correctly identify functional groups (TMS, CH3, OH,
    CH2), adding real analytical storytelling value
  - Theme-adaptive chrome correctly implemented — data green identical across light/dark,
    no dark-on-dark or light-on-light legibility failures
  - Correct title format, and legend appropriately hidden for the single series
  weaknesses:
  - Design Excellence still reads as a solid but fairly standard MUI X LineChart composition
    — a bespoke touch (e.g. subtle peak-area fill, varied reference-line emphasis
    for the strongest peak) would push Aesthetic Sophistication and Visual Refinement
    further
  - The two central lines of the CH2 quartet (offset ±0.012 ppm) sit close enough
    that their Lorentzian tails only partially return to baseline between them — a
    slightly larger splitting-to-halfWidth ratio there would make all four quartet
    lines equally crisp
  - Library Mastery is still fairly generic LineChart usage beyond the ChartsReferenceLine
    composition; leveraging another MUI X-distinctive feature (e.g. custom axis tick
    formatting, chart interaction zones) would strengthen LM-02
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "spectrum-nmr · javascript · muix · anyplot.ai" is dark, centered, fully readable with comfortable margin above and below. Axis titles ("Chemical Shift (δ, ppm)", "Intensity (a.u.)") and tick labels are dark and legible. Subtle horizontal-only grid lines. Four dark-grey dashed vertical reference lines mark 3.70, 2.60, 1.20, and 0.00 ppm, each with a small dark-grey text label (CH2, OH, CH3, TMS) positioned mid-plot without overlapping data or other text.
      Data: Single brand-green (#009E73) line traces a clean, low baseline with sharp peaks at all four labeled positions. Pixel-level inspection confirms the CH3 peak (1.20 ppm) resolves as a small–tall–small 1:2:1 triplet and the CH2 peak (3.70 ppm) resolves as a small–tall–tall–small 1:3:3:1 quartet, both with visible saddle points between sub-lines — the splitting patterns are genuinely resolved, not a single blob. Tallest peak (CH3, ~69.5) sits well below the yAxis max of 90, giving clear headroom.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Title, axis titles, and tick labels render in light/white text, clearly legible against the dark background. Reference lines and their labels switch to light tones with no dark-on-dark failures.
      Data: Data line color, peak positions, peak heights, and multiplet fine structure are pixel-identical to the light render — confirming only chrome (background, text, grid, reference-line color) flipped between themes while the data color and shape stayed constant.
      Legibility verdict: PASS
