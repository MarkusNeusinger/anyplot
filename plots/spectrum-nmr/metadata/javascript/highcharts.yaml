review:
  strengths:
  - 'Correct NMR domain conventions: reversed ppm axis (high shift on the left), TMS
    reference singlet at 0 ppm, and realistic multiplet splitting (1:2:1 triplet for
    CH3, 1:3:3:1 quartet for CH2) synthesized via summed Lorentzian line shapes'
  - Peak assignment labels (δ shift + multiplicity notation, e.g. "CH3 1.20 (t)")
    turn a raw spectrum into a clear structural story without cluttering the baseline
  - Y-axis intentionally hides tick values (arbitrary-unit convention for spectra)
    while keeping the axis title with units — a thoughtful, domain-aware design choice
    rather than a generic default
  - 'Clean theme-adaptive chrome: identical Imprint green (#009E73) data color in
    both renders, correct FAF8F1/1A1A17 backgrounds, all text legible in both themes'
  - Deterministic data generation via a fixed-seed LCG for baseline noise, appropriate
    for the browser runtime with no seeded RNG available
  - 'Correct Highcharts mount-node contract: no explicit width/height, animation disabled
    on chart and series, credits disabled'
  weaknesses:
  - Doublet splitting pattern is not represented among the four labeled peaks (spec
    lists singlet/doublet/triplet/quartet as example patterns) — the current triplet+quartet+two
    singlets covers the ethanol example well but a doublet would round out feature
    coverage
  - lorentzian/nextNoise/apexNear helper functions go beyond a strict linear Imports->Data->Plot
    flow — justified here for spectral synthesis, but keep in mind for KISS scoring
  - The peak-callout technique (secondary scatter series with enableMouseTracking:false
    + dataLabels) is a solid pattern but not distinctive to Highcharts specifically
    — could be paired with a Highcharts-only feature (e.g. plotLines/plotBands for
    the reference peak) for stronger Library Mastery credit
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1), matches spec.
      Chrome: Title "Ethanol · spectrum-nmr · javascript · highcharts · anyplot.ai" in bold dark ink, subtitle "Synthetic 1H NMR spectrum (400 MHz, CDCl3)" in soft ink below it, both clearly readable. X-axis title "Chemical Shift (delta, ppm)" and Y-axis title "Intensity (a.u.)" in soft ink, also readable. X-axis tick labels run 12 down to 0 left-to-right (reversed axis, correct NMR convention), all legible. Y-axis has no tick values (arbitrary-unit convention), only the axis line and title.
      Data: Green (#009E73) filled area/line spectrum with a flat, lightly noisy baseline and four labeled peak clusters rising from it: TMS singlet near 0 ppm, a triplet near 1.2 ppm (CH3), a broad singlet near 2.6 ppm (OH), and a quartet near 3.7 ppm (CH2). Each labeled peak's dataLabel sits above the peak apex without overlapping the peak or neighboring labels.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17), matches spec.
      Chrome: Same title and subtitle now rendered in light/soft-light text, fully readable against the dark background — no dark-on-dark issues. Axis titles and tick labels are light-colored and legible. Axis lines remain visible in soft ink tone.
      Data: Same green (#009E73) fill/line spectrum with identical peak shapes, positions, and labels as the light render — confirms data colors are unchanged between themes; only chrome (background/text) flipped.
      Legibility verdict: PASS
