review:
  strengths:
  - Evenly stepped, zero-symmetric levels (14 bands from ±max|z|) give a true banded
    filled contour with the diverging midpoint exactly at 0
  - imprint_div built with scale_fill_gradient2 and a theme-adaptive page-colored
    midpoint; chrome flips cleanly between the two themes
  - guide_colorbar(nbin=N_LEVELS) and breaks on the level boundaries make the colorbar
    show the same steps as the field
  - scale expand=(0, 0) lets the bands fill the panel edge to edge with no empty margin
  - 'Clean adaptable-code layout: column constants with role comments, one Data block,
    plot reads only df'
  weaknesses:
  - 'SC-02 (both): C2 missed: band boundaries are stair-stepped, every band edge follows
    the 100x100 tile grid in visible square steps (clearest around the peaks at (±5,
    0) and (±1, ±3)) → smooth band edges. Likely cause: geom_tile on the raw grid;
    interpolate the field to a finer grid (e.g. 300x300) before digitizing, or draw
    the bands as polygons.'
  - 'CQ-04 (code): IMPRINT_PALETTE on line 35 is defined and never used → delete it.
    Likely cause: copied token block; only the three DIV_* colors are used.'
  - 'Suggestion: thin contour lines along the band boundaries (the Notes allow them)
    would make the level edges easier to read in the dark render, where the near-zero
    bands are close to the background.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 page and panel; 3200x1800.
      Chrome: title 'Interference field · contour-filled · python · plotnine · anyplot.ai' in dark ink, centered, ~80% width; axis titles 'X coordinate' / 'Y coordinate' and ticks -6, -3, 0, 3, 6 in dark soft ink; colorbar 'Field value' with labels -1.6 … 1.6 in an elevated light box; all readable.
      Data: 14 evenly stepped bands of a sine/cosine interference field on a 100x100 grid, red (#AE3030) for negative, blue (#4467A3) for positive, near-page pinkish/bluish greys around zero; 4x5 grid of alternating red and blue closed lobes; band edges stair-stepped along the tile grid. No categorical series (continuous ramp).
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17 page and panel.
      Chrome: title, axis titles in light ink, ticks and colorbar labels in light soft ink, colorbar box in #242420; no dark-on-dark text.
      Data: same red and blue poles as the light render; the diverging midpoint follows the page color, so near-zero bands are dark reddish/bluish greys, still distinguishable from each other; same lobe layout and stair-stepped edges.
      Legibility verdict: PASS
