review:
  strengths:
  - imprint_div diverging ramp with an even band count, so zero is a band boundary
    and the theme-adaptive midpoint sits exactly on the field's sign change
  - contourf and contour share one level array, so the hairline contour lines run
    exactly along the band boundaries; matplotlib's dashed negative levels double-encode
    the sign
  - Plausible water-ripple scenario with units on every axis and on the color bar,
    built from a tidy df through column constants
  - Exact 3200x1800 canvas with library-prompt font sizes and theme tokens threaded
    through title, ticks, color bar and spines
  weaknesses:
  - 'Suggestion: set ax.set_aspect(''equal'') so the circular ripple keeps its true
    shape when the grid extent changes'
  - 'Suggestion: label a few contour levels with ax.clabel in INK_SOFT so heights
    can be read on the rings without the color bar'
