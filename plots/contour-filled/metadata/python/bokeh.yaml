      Data: ten flat color bands stepping from brand green #009E73 (low) to blue #4467A3 (high); two peaks (around (-1.5,-0.5) and (1,1)), a smaller one near (0.4,-1.5) and a basin near (-0.7,1.7); smooth curved band boundaries, no holes, no contour lines.
