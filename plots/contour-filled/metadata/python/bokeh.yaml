review:
  strengths:
  - Ten evenly stepped bands on round 200 m levels, and the color bar's FixedTicker
    ticks sit exactly on the band boundaries
  - imprint_seq applied as discrete per-band steps through LinearColorMapper, identical
    in both themes with fully theme-adaptive chrome
  - 'Adaptable data zone: column constants feed axis titles and the color-bar title,
    data read through a tidy df'
  weaknesses:
  - 'CQ-04 (code): the filled bands are built by upsampling the grid with scipy.ndimage.zoom
    and painting it with p.image through a stepped color mapper (lines ''fine = zoom(...)''
    and ''p.image(...)'') → draw them with bokeh''s native figure.contour(xs, ys,
    z, levels, fill_color=band_colors), which computes the band polygons and drops
    the scipy import. Likely cause: image-based stand-in for the contour renderer.'
  - 'Suggestion: thin INK_SOFT contour lines along the band boundaries (the Notes
    suggest them) would make the low-contrast mid-range steps between 600 and 1200
    m easier to tell apart.'
  - 'Suggestion: a HoverTool reporting elevation would add value to the HTML view.'
  - 'Suggestion: a square canvas would keep the km-by-km map at a true aspect instead
    of stretching it horizontally.'
  image_description: |-
