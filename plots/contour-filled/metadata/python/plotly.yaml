review:
  strengths:
  - 'Uses the Imprint diverging ramp with the theme-adaptive midpoint; chrome flips
    cleanly between #FAF8F1 and #1A1A17 while the data colors stay the same'
  - Native go.Contour coloring='fill' with explicit start/end/size gives 16 evenly
    stepped bands with smooth boundaries on a 100x100 grid
  - Thin INK_SOFT contour lines run along every band boundary and stay visible in
    both themes without competing with the fills
  - hovertemplate exposes x, y and the surface value in the HTML view
  weaknesses:
  - 'SC-02, SC-03 (both): the diverging ramp is centered near +0.5 instead of zero:
    the colorscale spans the contour range -0.94 to 2.0, so the near-white midpoint
    falls on the 0.4-0.6 bands and the near-zero outer region (and the 0 to 0.4 bands)
    is drawn red/pink as if negative, while the colorbar axis runs -2 to 2 with a
    flat red block below -0.94 → map the midpoint color to z = 0 so values near zero
    read neutral (signed delta about -0.5 on the midpoint). Likely cause: contours
    start/end = data min/max drive the fill colors, so zmin/zmax=±bound does not center
    the scale; set start/end/size symmetrically around zero or pass zmid=0 with levels
    that bracket zero.'
  - 'Suggestion: round the colorbar ticks (1.8, 0.886, -0.028 …) to the level step,
    for example by stepping the levels at a round 0.2 so ticks land on readable values.'
  - 'Suggestion: drop the unused GRID token and the six unused Imprint categorical
    colors to keep the theme block lean.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 page and plot background, 3200x1800.
      Chrome: bold title "contour-filled · python · plotly · anyplot.ai" centered at the top in dark ink; "X position" and "Y position" axis titles and -3..3 ticks in dark ink/ink-soft; a boxed colorbar "Surface value" on the right with ticks 1.8, 0.886, -0.028, -0.943, -1.857. All text readable.
      Data: 16 filled bands of the Imprint diverging ramp (#AE3030 red - off-white - #4467A3 blue) over a 6x6 domain: a deep blue peak at (1, 1), a lighter blue peak at (-1, -1), a red basin at (1, -1) and a pale shoulder at (-1.5, 1.5). Thin dark-grey contour lines run along every band boundary; boundaries are smooth. The near-white midpoint sits on the 0.4-0.6 bands, and the near-zero outer region is pink.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17 page and plot background.
      Chrome: title, axis titles, ticks and colorbar labels in light ink (#F0EFE8 / #B8B7B0); colorbar box in the elevated dark surface with a light border. No dark-on-dark text.
      Data: same bands and level geometry; the red and blue poles are identical to the light render, and the midpoint flips to the dark page color as the style guide asks, so the mid bands are near-black and the outer near-zero region dark red. Contour lines are light grey and visible on every band.
      Legibility verdict: PASS
