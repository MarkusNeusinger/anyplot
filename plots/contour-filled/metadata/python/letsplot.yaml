review:
  strengths:
  - Uses imprint_seq correctly via scale_fill_gradient(low='#009E73', high='#4467A3')
    on a single-signed elevation field, with identical data colors in both themes
  - 'Native lets-plot layering: geom_contourf(aes(fill=''..level..''), bins=15) under
    a matching geom_contour(bins=15) so the thin translucent lines run exactly along
    the band boundaries'
  - Smooth band boundaries from a 60x60 grid; two peaks, a saddle, a ridge and a basin
    show narrow bands on steep slopes and broad bands on flat areas
  - 'Theme tokens threaded through every chrome element; all text readable on #FAF8F1
    and #1A1A17'
  - Column constants with role comments and a clean Data block, so the code adapts
    to a user's own table
  weaknesses:
  - 'DE-02 (both): the panel is enclosed by a full four-sided INK_SOFT frame that
    sits away from the data extent, leaving an empty page-colored gutter between the
    bands and the frame on all sides → an L-shaped frame (or none) hugging the data,
    per the style guide''s spine rule. Likely cause: theme_minimal() panel border
    left on plus default axis expansion; set panel_border=element_blank() and scale_x/y_continuous(expand=[0,
    0]).'
  - 'SC-02 (both): the color bar is a continuous gradient with round-number ticks,
    so it does not show the 15 band levels the fills use (C4) → a stepped color bar
    with one swatch per level. Likely cause: the continuous scale_fill_gradient guide
    on ..level.. rather than a binned guide (e.g. scale_fill_gradient(..., breaks=levels)
    with guide_colorbar(nbin=15) or a binned scale).'
  - 'Suggestion: a slightly darker or ink-colored contour line in the light theme
    would separate the low-contrast green bands of the 500-1,500 m range more clearly.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, correct; legend box on the elevated #FFFDF6 surface with a thin INK_SOFT outline.
      Chrome: title "contour-filled · python · letsplot · anyplot.ai" in dark INK at 18 pt (~53 % of the width), axis titles "Longitude (km)" / "Latitude (km)" at 14 pt, tick labels 0–50 at 12 pt in INK_SOFT; full four-sided frame around the panel with a gutter between data and frame; no grid. All readable.
      Data: 15 filled bands on a 60x60 grid from brand green #009E73 (basin at ~25,8) to Imprint blue #4467A3 (main peak at 15,20, secondary peak at 35,35), thin white contour lines at alpha 0.5 along every band boundary; continuous color bar "Elevation (m)" ticked 500–3,500. Smooth curves, no holes.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17, correct; legend box on #242420.
      Chrome: title and axis titles in light INK #F0EFE8, ticks in INK_SOFT #B8B7B0, frame in INK_SOFT; no dark-on-dark text anywhere.
      Data: band colors and contour lines identical to the light render; brand green stays vivid.
      Legibility verdict: PASS
