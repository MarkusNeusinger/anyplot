review:
  strengths:
  - Correct imprint_seq ramp for a single-signed temperature field, with fill colors
    identical in both themes
  - Thin INK_SOFT isolines (0.4 px, alpha 0.5) trace every band boundary in both themes
    while the fills stay the main signal
  - 'Full theme-token threading: title, labels, ticks, colorbar outline and ticks
    all adapt; no dark-on-dark text'
  - 'Adaptable-code structure: column constants with role comments, a tidy df pivoted
    to a grid, levels computed from the data'
  - Exact 3200x1800 canvas without bbox_inches='tight'
  weaknesses:
  - 'VQ-05 (both): with ax.set_aspect(''equal'') the 2:1 lon/lat axes only fill about
    57 % of the canvas height (axes y ≈ 390–1425 px of 1800), leaving about 22 % empty
    above the title and 12 % below the x-axis title → axes spanning about 75 % of
    the height (+≈18 %). Likely cause: default subplot margins plus the colorbar steal
    width, so the equal-aspect axes are width-limited; tighten with fig.subplots_adjust(left=…,
    right=…) or a narrower colorbar (fraction/pad).'
  - 'DQ-02 (both): the field is framed as global temperature but both poles sit at
    the same 10 °C baseline as the mid-latitudes, with one 4 °C trough near 65 °N
    → a baseline that falls with |latitude| (e.g. 10 + 15·cos(lat)). Likely cause:
    the constant `+ 10` baseline in the Data block.'
  - 'Suggestion: round level values (e.g. 0–33 °C in steps of 2.5 °C) would give the
    colorbar readable ticks instead of 1.05, 5.56, 10.08 ….'
  - 'Suggestion: the unused IMPRINT_PALETTE constant could be dropped for a continuous-only
    plot.'
