review:
  strengths:
  - Theme tokens applied to all injected text and frame elements
  - Deterministic Gaussian-peaks field with peaks, a basin and a saddle neck
  weaknesses:
  - 'VQ-05 (both): canvas is 4800x2700, not a canonical size → 3200x1800 (−1600 ×
    −900). Likely cause: pygal.XY(width=4800, height=2700).'
  - 'VQ-01 (both): title at 28 px and ticks at 36 px on the 4800-wide canvas read
    far below the style guide''s 66 px title / 44 px ticks at 3200 → style-guide sizes
    on a 3200x1800 canvas. Likely cause: title_font_size=28 and the 36 px tick font.'
  - 'SC-04 (both): title ''contour-filled · pygal · anyplot.ai'' lacks the language
    segment → ''contour-filled · python · pygal · anyplot.ai''. Likely cause: the
    title string.'
  - 'VQ-07 (both): continuous ramp is custom RdBu-style hexes (#08306b … #67001f),
    not imprint_div → #AE3030 ↔ page-colored midpoint ↔ #4467A3. Likely cause: the
    colormap list.'
  - 'SC-01, SC-02 (both): the field is drawn as 80x80 flat-colored cells in a continuous
    gradient, so there are no level bands and the boundaries stair-step (C1, C2, C3)
    → filled polygons between evenly stepped levels. Likely cause: one <rect> per
    cell colored by the cell mean.'
  - 'SC-02 (both): the diverging ramp''s white midpoint sits near 0.26 instead of
    the field''s zero, and the color bar is a continuous gradient that shows no levels
    (C4) → levels symmetric about 0 and a discrete color bar of the fill''s levels.
    Likely cause: linspace(z_min, z_max) normalisation.'
  - 'VQ-03, SC-02 (both): contour lines render as disjoint short dashes instead of
    continuous curves (C5) → joined segments along every band boundary. Likely cause:
    marching-squares segments drawn as separate <line> elements with gaps at cell
    edges.'
  - 'VQ-02 (both): color-bar title ''Intensity'' runs into the plot frame; in the
    dark render its ''I'' sits over the light-blue field and vanishes → clear it of
    the frame. Likely cause: cb_x only 60 px right of the plot with a centred title.'
  - 'CQ-01 (code): line 27 opens the Data block with no column-0 # Plot marker after
    it → one block between # Data and # Plot markers that ends by binding df. Likely
    cause: the plot code is not separated from the data generation.'
  - 'CQ-01 (code): no column constant for the required roles x, y, z → one string
    constant per role above the Data block with a # role: comment. Likely cause: column
    names typed where they are used.'
  - 'CQ-04 (code): lines 116–128 and 262–274 write out the same color interpolation
    twice → one matplotlib.colors.LinearSegmentedColormap called in both places. Likely
    cause: copy-pasted inline interpolation.'
