review:
  strengths:
  - Smooth band boundaries from a bilinear resample to a 480x480 grid, with rect runs
    merged per row to keep the spec light
  - Contour lines derived from the same band grid, so they run exactly along band
    boundaries and adapt to the theme via INK
  - Correct imprint_seq ramp and theme tokens throughout; both renders fully readable
  - Rect seams hidden by encoding stroke with the same color scale — a clean Altair
    idiom
  - Adaptable data block with column constants and ESCAPE translation for Vega-Lite
    field names
  weaknesses:
  - 'SC-02 (both): the Intensity legend labels its 12 swatches with the band centers
    (-0.26 … 1.31) instead of the 13 level boundaries the bands are cut at, so the
    reader cannot read a band''s value range → label the swatches with their ranges
    (e.g. ''-0.33 – -0.19'') or show the boundary values. Likely cause: legend values=[float(c)
    for c in centers], format=''.2f''.'
  - 'VQ-05 (both): the chart block fills only about 75 % of the 2400 px canvas width
    and 80 % of its height, leaving ~300 px empty bands above the title and below
    the x-axis title → use the library prompt''s square view of about 500x460 (+120
    px width, +60 px height). Likely cause: .properties(width=380, height=400).'
  - 'Suggestion: neighbouring mid-range bands (0.03 / 0.17 / 0.31) are close in hue;
    slightly fewer levels would make each band read on its own without the contour
    lines.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 on a 2400x2400 canvas.
      Chrome: title "contour-filled · python · altair · anyplot.ai" bold dark, centered; "X coordinate" / "Y coordinate" axis titles dark; ticks -3..3 in INK_SOFT; "Intensity" legend with 12 square swatches labelled -0.26 … 1.31 on an elevated light frame. All text readable.
      Data: square field fully covered by 12 smooth imprint_seq bands, green (#009E73) for low values to blue (#4467A3) at the two peaks near (1, 0.8) and (-1, -0.6); thin dark contour lines along every band boundary; ripple bands in the corners.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
