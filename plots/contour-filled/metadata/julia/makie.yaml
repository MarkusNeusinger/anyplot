review:
  strengths:
  - Correct use of the theme-adaptive imprint_div diverging colormap (matte red ↔
    theme-adaptive midpoint ↔ blue) for the signed pressure-anomaly data — polarity
    choice matches the data's diverging nature
  - Layers contourf! (filled bands) with a subtle contour! isoline overlay for precise
    level identification, exactly matching the spec's suggestion, plus a linked Colorbar
    with extendlow/extendhigh triangle markers
  - All chrome (title, axis labels, tick labels, spines, colorbar) correctly threads
    theme tokens through both renders — fully legible in both light and dark with
    no dark-on-dark or light-on-light failures
  - Realistic, neutral synthetic dataset (sea-level pressure anomaly with asymmetric
    ridge/trough magnitudes plus background wave perturbation) avoids a too-symmetric,
    generic-looking field
  - Clean KISS script structure with explicit font sizes throughout and a deterministic
    (non-random) data generator
  weaknesses:
  - Title occupies only ~25-30% of the plot width — noticeably narrower than the 50-70%
    guideline for a short, unprefixed mandated title; consider a slightly larger titlesize
    or an optional descriptive prefix to better use the top margin
  - 'Design Excellence is solid but not exceptional: the diverging palette and layout
    follow the mandated style guide closely without an additional distinctive layout
    or annotation touch (e.g. labeling the ridge/trough centers) that would push it
    into publication-tier territory'
  - contourf!/contour!/Colorbar is a fairly generic pattern that would look nearly
    identical translated to matplotlib or plotly — a more Makie-distinctive layout
    or recipe feature would raise Library Mastery further
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1), matches the required light-theme surface.
      Chrome: Title "contour-filled · julia · makie · anyplot.ai" in bold dark ink, clearly legible. X-axis label "Longitude offset (°)" and Y-axis label "Latitude offset (°)" both dark and readable. Tick labels on both axes and the colorbar are a softer gray-ink tone, clearly legible against the light background. Colorbar label "Pressure anomaly (hPa)" is legible with clear extend-triangle markers at both ends.
      Data: Two well-separated features — a red trough (cool matte-red center) on the left/west side and a blue ridge (cool blue center) on the right/east side, connected by a pale near-neutral band where the anomaly crosses zero. First/primary hue direction uses the Imprint diverging colormap (matte red ↔ neutral ↔ blue), consistent with the diverging polarity of a signed pressure anomaly. Thin subtle isolines overlay the filled bands for precise level identification.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17), matches the required dark-theme surface.
      Chrome: Title, axis labels, and tick labels have all flipped to light ink tones and remain clearly legible against the dark background — no dark-on-dark text found anywhere (title, axis labels, tick labels, colorbar label/ticks all confirmed light-colored). Spines and grid are theme-adaptive (soft ink at low opacity).
      Data: Same red trough and blue ridge, in the identical matte-red / blue hues as the light render — only the near-zero midpoint band has shifted to align with the dark background, exactly as expected for a theme-adaptive diverging midpoint. Contour data colors are visually identical to the light render.
      Legibility verdict: PASS
