review:
  strengths:
  - Correctly identifies Chart.js's lack of a native contour/isoband chart type and
    builds a fully custom raster + marching-squares renderer via the native afterDraw
    plugin hook -- exactly the sanctioned workaround from the library rules, not a
    forbidden community plugin or sibling library.
  - 'Data colors are pixel-identical between light and dark renders (only chrome flips);
    imprint_seq (green to blue) is applied correctly for this single-polarity precipitation
    field, with the first/lowest color matching brand green #009E73.'
  - 'All spec-required features are present: filled color bands, isolines overlaid
    at every band boundary for precise level identification, and a labeled mm/hr colorbar
    -- with 14 levels and a 60x60 grid, both within the spec''s recommended ranges.'
  - Two storm cells with different amplitude and extent create a real saddle between
    them, giving the field genuine shape instead of a single symmetric blob.
  - Title fontsize scaling formula correctly shrinks the longer descriptive+mandated
    title to avoid overflow; both renders stay legible with theme-adaptive ink/inkSoft
    tokens threaded through title, axis labels, ticks, and the custom colorbar text.
  weaknesses:
  - The colorbar renders as a smooth 2-stop linear gradient, but the main plot is
    quantized into 14 discrete color bands (visible as banding/isolines) -- the colorbar
    should show the same stepped/banded look (or mark tick lines at each level boundary)
    so it accurately represents what the fill is doing.
  - 'Colorbar tick labels mix precision inconsistently: the top/mid ticks use toFixed(0)
    (''45'', ''23'') while the bottom tick uses toFixed(1) (''1.4'') -- pick one consistent
    decimal precision for all three.'
  - Only two Gaussian storm cells plus a flat ambient background is a fairly minimal
    feature set for 'showing all aspects' of a filled-contour surface -- consider
    adding subtle asymmetry, a third smaller feature, or a shallow valley for more
    textured feature coverage (DQ-01).
  - The afterDraw body carries several inline helper responsibilities (bilinear sampling,
    marching-squares edge interpolation, raster draw, colorbar draw) -- pulling the
    edge-interpolation math into its own small named helper would shorten the plugin
    body without losing the necessary complexity.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 -- not pure white.
      Chrome: Title "Storm System Precipitation · contour-filled · javascript · chartjs · anyplot.ai" in dark bold text, clearly readable. Axis titles "Distance east (km)" and "Distance north (km)" in dark ink, tick labels in a softer dark grey. Colorbar labeled "mm/hr" at top with tick labels 45 / 23 / 1.4 down the right side, all legible against the light background.
      Data: Two elliptical storm cells (a larger one centered near x=42,y=48 and a smaller one near x=88,y=22) rendered as smooth green-to-blue color bands with thin dark isolines at each of the 14 level boundaries, over a uniform green "ambient drizzle" background. The lowest band is brand green (#009E73-ish) and the highest band is Imprint blue (#4467A3-ish), matching imprint_seq.
      Legibility verdict: PASS -- no dark-on-light or unreadable text; no clipping observed at any canvas edge.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 -- not pure black.
      Chrome: Same title, axis titles, and tick labels now rendered in light/white tones (title and axis titles brighter white, tick labels softer light grey), fully readable against the dark background. Isolines and colorbar tick text also flip to light tones. Colorbar "mm/hr" label and tick values (45/23/1.4) remain legible.
      Data: Identical two-storm-cell field with the same green-to-blue band colors and same band boundaries as the light render -- confirms data colors are unchanged between themes, only chrome (background, text, isoline color) flipped.
      Legibility verdict: PASS -- no dark-on-dark failures observed; all text and isolines are clearly visible against the dark surface.
