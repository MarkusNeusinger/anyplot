review:
  strengths:
  - 'All three weaknesses from the previous review are fixed: the colorbar now renders
    as 14 stepped bands with boundary tick lines matching the quantized fill exactly
    (not a smooth 2-stop gradient), all three tick labels use consistent toFixed(1)
    precision (45.3 / 23.4 / 1.4), and a third smaller storm cell (centered near x=18,
    y=18) was added for richer feature coverage.'
  - Correctly identifies Chart.js's lack of a native contour/isoband chart type and
    builds a from-scratch raster + marching-squares renderer via the native afterDraw
    plugin hook -- the sanctioned workaround, not a forbidden community plugin or
    sibling library.
  - 'Data colors are pixel-identical between light and dark renders (only chrome flips);
    imprint_seq (green to blue) is applied correctly for this single-polarity precipitation
    field, with the lowest band matching brand green #009E73.'
  - Three storm cells of different size, intensity, and extent (large primary cell,
    mid-size secondary cell, small tertiary cell) create genuine textured topology
    with a visible saddle and a small nested closed contour around the tertiary peak.
  - Title fontsize scaling formula correctly shrinks the longer descriptive+mandated
    title to avoid overflow; both renders stay legible with theme-adaptive ink/inkSoft
    tokens threaded through title, axis labels, ticks, and the custom colorbar text.
  - No clipping, overlap, or theme-readability failures in either render; canvas dimensions
    pass the landscape 3200x1800 gate.
  weaknesses:
  - The afterDraw body still bundles several responsibilities inline (raster blit,
    marching-squares isoline loop with its edgePx closure, and colorbar drawing) in
    one ~110-line function -- pulling the edge-interpolation math and the colorbar
    draw into their own small named helpers would shorten the plugin body without
    losing necessary complexity (CQ-01).
  - The colorbar shows only 3 tick labels (max/mid/min) for 14 discrete bands -- a
    few more tick marks at intermediate band boundaries would make it easier to read
    off intermediate values precisely, though this is a nice-to-have, not a spec requirement.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 -- not pure white, not dark.
      Chrome: Title "Storm System Precipitation · contour-filled · javascript · chartjs · anyplot.ai" in dark bold text, clearly readable and not overflowing the canvas. Axis titles "Distance east (km)" and "Distance north (km)" in dark ink; tick labels in a softer dark grey. Colorbar labeled "mm/hr" at top with three tick labels (45.3 / 23.4 / 1.4, consistent one-decimal precision) down the right side, all legible against the light background.
      Data: Three elliptical storm cells -- a large primary cell centered near x=42,y=48, a mid-size secondary cell near x=88,y=22, and a small tertiary cell near x=18,y=18 (visible as a small nested pentagon-shaped closed contour around its own local peak) -- rendered as smooth green-to-blue color bands with thin dark isolines at each of the 14 level boundaries, over a uniform green "ambient drizzle" background. The lowest band is brand green (#009E73-ish) and the highest band is Imprint blue (#4467A3-ish), matching imprint_seq. The colorbar itself is now rendered as 14 discrete stepped bands with boundary lines, matching the fill's quantization (fixed from the previous smooth-gradient colorbar).
      Legibility verdict: PASS -- no dark-on-light or unreadable text; no clipping observed at any canvas edge (verified top-left, bottom-left, top-right corners at full resolution).

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 -- not pure black, not light.
      Chrome: Same title, axis titles, and tick labels now rendered in light/white tones (title and axis titles brighter white, tick labels softer light grey), fully readable against the dark background. Isolines and colorbar tick text also flip to light tones. Colorbar "mm/hr" label and the three tick values (45.3/23.4/1.4) remain legible.
      Data: Identical three-storm-cell field with the same green-to-blue band colors, the same stepped colorbar, and the same band boundaries as the light render -- confirms data colors are unchanged between themes, only chrome (background, text, isoline color) flipped.
      Legibility verdict: PASS -- no dark-on-dark failures observed; all text and isolines are clearly visible against the dark surface.
