review:
  strengths:
  - 'Idiomatic, advanced D3 pipeline: d3.contours() + d3.geoTransform/d3.geoPath renders
    true smooth isoline-bounded bands instead of a naive rectangle grid, and the polygon
    boundaries double as precise level isolines per the spec''s suggestion'
  - Correct diverging Imprint colormap (imprint_div via t.div + interpolateRgbBasis)
    for signed anomaly data, with a physically meaningful zero-centered domain ([-maxAbs,
    maxAbs])
  - 'Theme-adaptive chrome is fully correct in both renders: warm off-white/near-black
    backgrounds, readable ink/inkSoft text, identical data colors between light and
    dark'
  - Clean colorbar legend with axis, units label ('Anomaly (hPa)'), and gradient direction
    consistent with the actual band colors
  - Correct mandated title format with a sensible descriptive prefix ('Pressure Anomaly
    · contour-filled · javascript · d3 · anyplot.ai')
  - Deterministic, in-memory data generation (ridge + trough + ripple) on a 64x40
    grid — within spec range and smooth enough to avoid jagged boundaries
  - No canvas clipping, no overlap, generous margins, L-shaped spine convention respected
  weaknesses:
  - 14 contour bands with a subtle 0.12-opacity boundary stroke means adjacent bands
    are distinguished mostly through the colorbar rather than strong visual band separation
    — a slightly higher stroke opacity (e.g. 0.2-0.25) would sharpen level readability
    without adding clutter
  - Three small helper functions (pressureAnomaly, lonAt, latAt) add minor structure
    beyond a flat script; acceptable for 2D grid generation but slightly more than
    the KISS ideal
  - d3.contours()+d3.geoPath is the standard/expected recipe for a d3 filled-contour
    spec rather than a novel technique choice, so library-mastery distinctiveness
    is good but not exceptional
  - No overlaid discrete contour-line pass beyond the band boundaries themselves —
    the spec's 'consider overlaying contour lines for precise level identification'
    is only partially addressed via boundary strokes rather than a dedicated isoline
    layer
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (~#FAF8F1), not pure white — matches the light theme surface.
      Chrome: Title "Pressure Anomaly · contour-filled · javascript · d3 · anyplot.ai" is bold dark ink, clearly readable and centered. Axis labels "Longitude offset (°E)" and "Latitude offset (°N)" are dark and legible. Tick labels (0°-16° on x, 0°-10° on y) are soft dark gray, legible against the cream background. Colorbar to the right is titled "Anomaly (hPa)" with tick labels 10.0/5.0/0.0/-5.0/-10.0, all legible.
      Data: Diverging red-to-blue filled contour bands. A blue high-anomaly lobe (ridge) sits in the upper-left (~lon 2-8°, lat 6-9°), a red low-anomaly lobe (trough) sits in the lower-right (~lon 8-16°, lat 0-4°), with a muted neutral-toned transition zone between them. Colorbar orientation (blue=high, red=low) matches the plotted bands.
      Legibility verdict: PASS — all text is dark-on-light and clearly readable, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black (~#1A1A17), not pure black — matches the dark theme surface.
      Chrome: Title is bold near-white/cream and clearly readable. Axis labels and tick labels are light gray/off-white and legible against the dark background. Colorbar title and tick labels are light-colored and legible; no chrome element is unreadable.
      Data: Same blue ridge (upper-left) and red trough (lower-right) bands as the light render — the data-color hues are visually identical between the two renders (only the chrome — background, text, gridline colors — has flipped), consistent with the Imprint palette rule that categorical/continuous data colors do not change between themes.
      Legibility verdict: PASS — no dark-on-dark failures; all title/axis/tick/colorbar text is clearly visible against the near-black background.
