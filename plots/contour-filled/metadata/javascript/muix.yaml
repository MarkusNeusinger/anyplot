review:
  strengths:
  - 'Correct plot type: filled contour bands built from a hand-rolled marching-triangles
    algorithm with a sound painter''s-algorithm layering, avoiding the marching-squares
    saddle ambiguity'
  - Diverging Imprint colormap (imprint_div, red↔neutral↔blue) is the right polarity
    choice for a signed temperature-anomaly field, and data colors are identical between
    light and dark renders
  - Two clearly separated warm/cool Gaussian patches give good feature coverage (both
    polarities, nested super-level-set bands) and a plausible, neutral scientific
    scenario
  - Title format is correct ("{Descriptive Title} · contour-filled · javascript ·
    muix · anyplot.ai") and legible in both themes
  - Axis labels are descriptive with units (°) and theme-adaptive chrome (ink/inkSoft
    tokens) is applied correctly elsewhere in the chart
  weaknesses:
  - 'AR-09 EDGE CLIPPING (auto-reject): the ContinuousColorLegend''s max/min tick
    labels ("1.996" at top, "-1.996" at bottom) have their final digit''s closing
    curve chopped off at the right canvas edge in BOTH plot-light.png and plot-dark.png
    — pixel analysis confirms non-background content touches column 3199 (the literal
    last column of the 3200px-wide canvas) at both the top label (y≈379-396) and bottom
    label (y≈1404-1423) rows, and a zoomed crop shows the "6" glyph''s right arc is
    visibly truncated, not merely close to the edge. Fix: increase MARGIN.right beyond
    200px, or move the ContinuousColorLegend further left / reduce its `thickness`/label
    offset, so the widest tick label ("-1.996", 6 characters) fits fully inside SIZE.width
    with margin to spare. Also consider formatting the legend value with fewer decimals
    (e.g. toFixed(1) instead of the library default 3 decimals) to shorten the label
    and reduce collision risk.'
  - The vertical axis-title text "Temperature anomaly (°C)" is placed at x = SIZE.width
    - 26, i.e. only 26px from the canvas edge — combine this with the legend fix above
    so the whole right-side cluster (legend bar + its tick labels + the rotated axis
    title) has consistent breathing room and doesn't re-clip after the margin is widened.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1.
      Chrome: Title "Sea-Surface Temperature Anomaly · contour-filled · javascript · muix · anyplot.ai" is centered and readable in dark ink. X-axis "Zonal offset (°)" and Y-axis "Meridional offset (°)" labels and tick labels are dark and legible against the light background. A vertical legend title "Temperature anomaly (°C)" sits at the far right.
      Data: Two elliptical Gaussian patches — a warm (red) cluster around (1.3, 0.9) and a cool (blue) cluster around (-1.4, -1.0) — rendered as nested filled contour bands using the Imprint diverging colormap (red↔near-white↔blue), with thin isoline strokes at each band boundary. A vertical ContinuousColorLegend colorbar sits to the right of the plot, labeled with max/min values "1.996" / "-1.996".
      Legibility verdict: FAIL — the colorbar's top tick label "1.996" and bottom tick label "-1.996" both have their final "6" digit's closing curve clipped off at the right edge of the 3200px canvas (confirmed via pixel analysis: non-background pixels touch the literal last column, and a zoomed crop shows only ~2/3 of the "6" glyph rendered before the canvas boundary). This is an AR-09 edge-clipping violation.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17.
      Chrome: Same title, axis labels, and legend title, all rendered in light ink (confirmed readable — no dark-on-dark failures). Data colors are identical to the light render (red patch, blue patch, colorbar gradient) — only the chrome (background, text) flipped, as required.
      Data: Identical geometry and colors to the light render, confirming light/dark data-color consistency.
      Legibility verdict: FAIL — same AR-09 issue as the light render: the colorbar's "1.996" and "-1.996" tick labels are clipped at the right canvas edge, final digit truncated.
