review:
  strengths:
  - 'Correct diverging-colormap math: t.div stops reversed so position 0 lands on
    blue (cool/low) and position 1 on red (warm/high), with a theme-adaptive pageBg
    midpoint'
  - Creative, functioning custom filled-contour renderer (marching-triangles + painter's
    algorithm) built via ChartContainer's composition API (useXScale/useYScale) since
    MUI X has no native contour chart type -- an idiomatic use of the library's advanced
    composition pattern
  - Correct title format, descriptive axis labels with units, and a ContinuousColorLegend
    plus rotated axis title for the value scale
  - 'Both themes render correctly: identical data colors between light/dark, theme-adaptive
    chrome, no dark-on-dark or light-on-light legibility failures'
  - Isolines overlaid on top of the filled bands per the spec's suggestion, aiding
    precise level identification
  - Deterministic, reproducible data (fixed analytic formula, no RNG)
  weaknesses:
  - Visible jagged/stair-step artifacts along filled-contour boundaries, most noticeable
    on the diagonal zero-crossing boundary in the low-gradient region between the
    two Gaussian patches, in BOTH light and dark renders. The spec explicitly calls
    for 'grid resolution sufficient to avoid jagged color boundaries' and a smooth
    gradient visualization. Root cause is likely the 4-triangles-around-centroid cell
    split in buildTriangles(), which introduces spurious zig-zag kinks along low-gradient
    level curves independent of grid density -- try increasing GRID and/or replacing
    the centroid-quad split with a standard 2-triangle-per-cell (fixed-diagonal) split
    for smoother boundaries.
  - Title occupies only ~40-47% of the plot width at the current auto-scaled font
    size (TITLE_FONT_SIZE formula), a bit small/lost relative to the 50-70% guideline
    -- consider a slightly larger multiplier or minimum size.
  - The file leans on many small helper functions (hexToRgb, lerpChannel, imprintDivInterpolator,
    buildTriangles, triangleFill, polysToPath, segmentsToPath) -- justified by the
    custom contour engine but on the higher end of complexity for a KISS baseline;
    consider consolidating the color-interpolation helpers.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1) -- matches the required light-theme surface, not pure white.
      Chrome: Title "Sea-Surface Temperature Anomaly · contour-filled · javascript · muix · anyplot.ai" centered at top in dark ink; "Zonal offset (°)" / "Meridional offset (°)" axis titles and numeric tick labels (-3.0..3.0) in dark/soft-dark ink; a vertical ContinuousColorLegend on the right with "-2.0"/"2.0" endpoint labels and a rotated "Temperature anomaly (°C)" label. All text is clearly legible against the light background.
      Data: A filled contour field with a warm red blob (peak near x=1.3, y=0.9) and a cool blue blob (trough near x=-1.4, y=-1.0), each rendered as 4-5 nested elliptical color bands with thin semi-transparent isolines tracing each level boundary; the surrounding low-gradient area is a very pale pinkish-grey (upper right, mildly positive) vs. pale bluish-grey (lower left, mildly negative), split by a diagonal zero-crossing boundary. Colors run blue (low) -> near-neutral (zero) -> red (high), matching the Imprint diverging palette.
      Legibility verdict: PASS.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17) -- matches the required dark-theme surface, not pure black.
      Chrome: Same title, axis titles, tick labels, and colorbar layout as the light render, all rendered in light ink/off-white text, clearly readable against the dark background. No dark-on-dark text found.
      Data: Same red/blue blob positions and same band colors as the light render (data colors are identical between themes; only the neutral background hue shifted from pale grey/beige to a dark warm-grey), confirming chrome-only theme adaptation.
      Legibility verdict: PASS.

    Shared observation (both renders): the filled-contour band boundaries show a visible jagged/stair-step texture, most noticeable along the diagonal zero-crossing line in the low-gradient area between the two peaks -- flagged as a weakness below.
