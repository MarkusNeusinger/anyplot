review:
  strengths:
  - Marching-triangles pass on a 90x90 grid (with cell-centre subdivision) gives smooth,
    gap-free band boundaries across the whole extent in both themes
  - imprint_div built from t.div with the theme-adaptive midpoint, centred on 0 and
    oriented warm=red / cool=blue, matching the temperature-anomaly semantics
  - Discrete stepped colorbar with the same 10 levels as the bands, outlined and titled
    with the quantity and unit
  - Custom SVG layer composed into ChartsContainer via useXScale/useYScale/useDrawingArea,
    so bands, isolines and colorbar share MUI X's scales and axes
  - Thin isolines at 0.28 opacity in the ink token mark every band boundary while
    the fills stay the main signal
  weaknesses:
  - 'CQ-04 (code): `levels` (line 74) recomputes the same values as `levelEdges` (lines
    75-78) without the last edge → derive one from the other, e.g. `const levels =
    levelEdges.slice(0, -1)` (−3 lines). Likely cause: two separate Array.from level
    generators.'
  - 'Suggestion: use the typographic minus (−) in the colorbar tick labels to match
    the axis ticks, which MUI X renders with U+2212.'
  - 'Suggestion: an equal x/y aspect for the plot area would keep the isotropic Gaussian
    features circular instead of stretched into ellipses.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 page; the plot area is fully covered by contour bands.
      Chrome: bold dark title "contour-filled · javascript · muix · anyplot.ai" centred top, grey subtitle "Temperature anomaly (°C) across 90×90 grid · 10 filled contour bands"; left and bottom axis lines with dark tick labels (−3.0 … 3.0 every 0.5) and axis titles "Zonal offset (°)" and "Meridional offset (°)"; vertical discrete colorbar on the right, -2.0 to +2.0 labelled every other edge, rotated title "Temperature anomaly (°C)". All text readable.
      Data: imprint_div bands — deep matte red closed ellipses around a warm peak near (1.3, 0.9), blue closed ellipses around a cool basin near (−1.4, −1.0), near-neutral grey and pale-pink bands either side of the zero line running diagonally from the top-left to the bottom-centre. Thin semi-transparent ink isolines along every band boundary. Boundaries smooth, no holes. (Continuous data: no categorical first series.)
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17 page.
      Chrome: title, subtitle, tick labels, axis titles and colorbar labels in light ink; axis lines light grey. No dark-on-dark text.
      Data: the same red and blue poles and band geometry as the light render; the diverging midpoint flips to the dark page colour as the style guide prescribes, so the near-zero bands are dark grey-blue and dark maroon. Isolines render light and stay visible on every band.
      Legibility verdict: PASS
