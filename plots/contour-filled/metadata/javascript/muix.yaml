review:
  strengths:
  - Custom marching-triangles filled-contour geometry is a sophisticated, correct
    solution to MUI X community having no native contour/isoband chart type -- the
    4-triangle centroid split correctly avoids the marching-squares saddle ambiguity,
    and bands are painted low-to-high so nested super-level sets composite correctly.
  - Subtle isoline overlay (28% opacity strokes) implements the spec's 'consider overlaying
    contour lines for precise level identification' without competing with the fill
    bands.
  - ContinuousColorLegend colorbar is present, labeled with units ('Temperature anomaly
    (°C)'), and uses the correct Imprint diverging hex stops with a theme-adaptive
    midpoint in both renders.
  - Data generation is fully deterministic (closed-form Gaussian bumps, no RNG) and
    the grid (36x36) and band count (10) both sit within the spec's required ranges.
  - Title exactly matches the SC-04 format, and the font size auto-scales down for
    the longer descriptive-prefixed title so it doesn't overflow.
  weaknesses:
  - 'Data-to-color mapping is inverted: the positive/warm bump (''warmPatch'', peak
    ≈ +2.0°C at x=1.3, y=0.9) renders in the BLUE end of the diverging scale (t.div[2]),
    while the negative/cool bump (''coolPatch'', peak ≈ -1.6°C at x=-1.4, y=-1.0)
    renders in the RED end (t.div[0]). This is backwards from the near-universal warm=red
    / cool=blue convention for temperature-anomaly data, and inverted relative to
    how the sibling muix heatmap-stripes-climate implementation maps the same kind
    of data (HOT->div[0]/red, COLD->div[2]/blue). Fix: reverse the position fed to
    divColor() (or swap which end of t.div the low/high thresholds pull from) so positive/warm
    z maps to t.div[0] (red) and negative/cool z maps to t.div[2] (blue) -- and keep
    the zAxis colorMap.color function used by ContinuousColorLegend consistent with
    that flip.'
  - 'The y-axis label ''Meridional offset (°)'' visually overlaps the ''0.5'' and
    ''0.0'' y-axis tick labels in BOTH the light and dark renders (confirmed by pixel
    crop around x=0-220, y=600-1200 of plot-light.png and plot-dark.png) -- the rotated
    label glyphs collide with the tick digits. Fix: increase the gap between the y-axis
    label and tick labels (larger MARGIN.left, or axis label/tickLabel offset via
    slotProps) so they no longer sit on top of each other.'
  - 'Minor: at close zoom the filled-contour band boundaries show visible polygonal
    faceting from the 36x36 triangulation (spec asks for a grid resolution that avoids
    jagged color boundaries). Not objectionable at full-plot viewing scale, but bumping
    GRID to ~50 would sharpen the boundaries further.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1), consistent across the whole canvas.
      Chrome: Title "Sea-Surface Temperature Anomaly · contour-filled · javascript · muix · anyplot.ai" centered at top, dark ink, clearly readable, doesn't overflow. X-axis "Zonal offset (°)" with 0.2-step tick labels from -3.0 to 3.0, all legible with no overlap. Y-axis "Meridional offset (°)" with 0.5-step tick labels from -3.0 to 3.0 -- BUT the rotated axis-label text visually collides with the "0.5" and "0.0" tick labels (glyphs overlap). Colorbar on the right, labeled "Temperature anomaly (°C)", with endpoint labels "1.996" (top) and "-1.996" (bottom), both fully visible with no edge clipping.
      Data: Two nested-ellipse blob structures on a neutral gray background band (the near-zero region). The blob near (1.3, 0.9) — the mathematically positive/warm bump — is colored BLUE (deep blue at its core). The blob near (-1.4, -1.0) — the mathematically negative/cool bump — is colored RED (deep red at its core). Isoline strokes trace each band boundary at low opacity, giving discrete level detail.
      Legibility verdict: FAIL (y-axis label overlaps "0.5"/"0.0" tick labels; also, first-series/data-color semantics are inverted relative to the "warm"/"cool" naming, though the pixels themselves are legible — the color-to-value direction is wrong, see Weaknesses).

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17), consistent across the canvas.
      Chrome: Same title, axis labels, tick labels and colorbar layout as the light render, all rendered in light ink/inkSoft tones that read clearly against the dark background — no dark-on-dark failures. The SAME y-axis label/tick-label overlap present in the light render recurs here (confirmed via matching pixel crop), so it is a layout defect independent of theme, not a light-mode-only issue.
      Data: Colors are identical to the light render — same deep blue blob at (1.3, 0.9) (the warm bump) and same deep red blob at (-1.4, -1.0) (the cool bump); only the chrome (background/text) flipped as expected.
      Legibility verdict: FAIL (same y-axis label/tick overlap as light render; same color-mapping inversion carried over, confirming it's a data/color-scale bug rather than a theme-specific rendering glitch).
