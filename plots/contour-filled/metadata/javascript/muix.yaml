review:
  strengths:
  - 'Builds a filled-contour layer inside MUI X''s composition API: ChartsContainer
    with useXScale/useYScale/useDrawingArea hooks maps the band polygons into the
    chart''s own coordinate system, so the native ChartsXAxis/ChartsYAxis line up
    exactly with the field'
  - Imprint diverging ramp (t.div) centered on 0 °C with symmetric levels (±2.0, 10
    evenly stepped bands); the theme-adaptive midpoint reads as near-page neutral
    in both renders while the red/blue poles stay identical
  - 'Whole grid covered with no holes or seams: a base fill of the lowest band plus
    fill-matching 0.75 px strokes on each band path removes anti-aliasing slivers
    between triangles'
  - Thin isolines (ink at 0.28 opacity, 1 px) run exactly along the band boundaries
    and stay visible on both backgrounds without competing with the fills
  - Discrete stepped colorbar shows the same 10 levels as the map, framed, with level
    ticks and a rotated title naming the quantity and unit
  - Plausible, neutral scenario (temperature anomaly with a warm and a cool center
    over zonal/meridional offsets) that shows a peak, a basin, steep rings and a broad
    near-zero area
  weaknesses:
  - 'SC-02 (both): the 0 °C boundary (neutral grey ↔ pale-red band) running diagonally
    from the top-left corner to the bottom edge near x = 1.5 is visibly stair-stepped,
    and the inner peak/basin rings show polygonal facets, which violates the spec''s
    ''smooth curves, never jagged'' property → a smooth boundary. Likely cause: the
    36×36 sample grid (sampleGrid = 36) with linear marching-triangle interpolation;
    a finer grid (e.g. 80–100 per side, still inside the spec''s 30–100 range) removes
    the steps.'
  - 'VQ-05 (both): the x axis carries 31 tick labels at 0.2° steps that form a crowded,
    nearly continuous row, while the y axis over the same 6° span uses 13 labels at
    0.5° steps → matching density of about 13 x ticks at 0.5° (−18 labels). Likely
    cause: no tickInterval/tickNumber on the x-axis config, so MUI X picks its default
    count for the wide axis.'
  - 'Suggestion: the field is defined on a square 6°×6° domain but drawn on a 1610×860
    px area, so the round warm and cool centers read as wide ellipses; a square orientation
    would keep the spatial proportions.'
  - 'Suggestion: the colorbar labels use a hyphen (''-1.2'') while the axes use the
    typographic minus (''−1.2''); one minus sign would make the two scales read as
    one system.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 page; the plot area is fully covered by contour bands.
      Chrome: bold title "contour-filled · javascript · muix · anyplot.ai" centered at top, grey subtitle "Temperature anomaly (°C) across 36×36 grid · 10 filled contour bands"; axis titles "Zonal offset (°)" and "Meridional offset (°)" in dark ink; tick labels −3.0…3.0 (x every 0.2, y every 0.5) in soft dark grey; right-side stepped colorbar from −2.0 (blue) to +2.0 (red) with ticks every other level and the rotated title "Temperature anomaly (°C)". All text is readable.
      Data: Imprint diverging ramp — a red peak centered near (1.3, 0.9) with four nested red bands, a blue basin near (−1.4, −1.0) with three blue bands, a light grey (−0.4..0) region and a pale-pink (0..0.4) region separated by a diagonal 0 °C boundary that is visibly stair-stepped. Thin grey isolines trace every band edge. No holes or gaps.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17 page.
      Chrome: title, subtitle, axis titles, tick labels, colorbar ticks and colorbar title all in light ink — no dark-on-dark text. Axis lines and tick marks light grey.
      Data: same red and blue poles as the light render; only the theme-adaptive diverging midpoint flips to near-black, so the near-zero bands read as dark grey-blue and dark maroon, still distinguishable from each other and from the page. Isolines render as light thin lines, visible on all bands. Same stair-stepped 0 °C boundary.
      Legibility verdict: PASS
