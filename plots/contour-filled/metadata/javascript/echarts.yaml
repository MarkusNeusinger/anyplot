review:
  strengths:
  - 'Repair fixed the core issue from attempt 1: the two storm cells (centers now
    (-25,-18) and (25,20), tighter sigma 11/13) read as two clearly distinct concentric
    lobes in both renders, not a merged blob.'
  - Piecewise visualMap banding (9 levels, 5 mm/hr steps) now shows sharp, perceptible
    color-band boundaries — the plot genuinely reads as a filled-contour with discrete
    levels rather than a smooth gradient.
  - Colorbar is fully labeled per band ("0–45 mm/hr" in 5-unit steps) so intermediate
    values can be read precisely, fixing the under-labeling from attempt 1.
  - Sequential Imprint colormap (t.seq) is correctly applied and identical between
    light/dark renders; only chrome (background, title, axis, colorbar text) flips
    theme.
  - Deterministic, realistic rainfall-intensity scenario with no RNG; canvas is exactly
    2400×2400 as declared; theme chrome fully legible in both renders with no dark-on-dark
    or light-on-light failures.
  weaknesses:
  - No contour-line overlay marking precise level boundaries — the spec lists this
    as a nice-to-have ('consider overlaying contour lines for precise level identification')
    that would push the 'contour' identity further beyond a banded heatmap.
  - Colorbar swatch labels are fairly small (fontSize 12) relative to the rest of
    the chrome — still legible but could be bumped slightly for better mobile readability.
  - Still a heatmap-as-contour approximation (grid cells rather than true isoline-derived
    polygons), which is the accepted ECharts workaround given no echarts-gl/contour
    series, but caps SC-01/LM-02 slightly below a native contour implementation.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 (not pure white, not dark).
      Chrome: Bold dark-ink title "Storm Rainfall Intensity · contour-filled · javascript · echarts · anyplot.ai" centered at top, comfortably within plot width. Axis titles "Distance East-West (km)" and "Distance North-South (km)" in dark ink; tick labels in soft-dark ink at regular intervals. A vertical piecewise colorbar sits to the right with 9 fully labeled swatches ("0-5 mm/hr" through "40-45 mm/hr").
      Data: A square field fills most of the plot area, banded in the Imprint sequential palette from brand green (#009E73) at the periphery/background through teal to darker blue-green at the two storm cores. Two clearly separate concentric-ring lobes are visible: a larger, more intense one in the lower-left quadrant (peak ~45 mm/hr) and a smaller one in the upper-right quadrant (peak ~30 mm/hr, visibly less saturated blue than the first). Band boundaries are sharp and perceptible, not a smooth gradient.
      Legibility verdict: PASS — all text is clearly readable against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 (not pure black, not light).
      Chrome: Same title, axis titles, and tick labels now rendered in light ink, fully legible against the dark background. Colorbar labels are light-colored and readable.
      Data: The banded field and colorbar swatch colors are pixel-identical to the light render — only the chrome (background, text) flipped theme, as required. The two storm lobes remain clearly distinguishable.
      Legibility verdict: PASS — no dark-on-dark failures; all chrome text reads clearly against the near-black background.
