review:
  strengths:
  - Exact marching-triangles band polygons and isolines, painted through a custom
    series whose fill comes from a piecewise visualMap via api.visual('color'), so
    the color bar and the bands share one level definition (0–45 mm/hr in 5 mm/hr
    steps)
  - Whole 100 x 100 grid covered with smooth, seam-free band boundaries; thin ink-token
    isolines at 0.4 opacity sit exactly on the band edges and stay visible in both
    themes without competing with the fills
  - 'Imprint sequential ramp (t.seq, #009E73 to blue) for a single-signed rainfall
    field, with a stepped color bar split by hairline gaps and a two-line quantity
    title with units'
  - 'Two storm cells of different peak and spread show the plot type''s range: tightly
    packed narrow bands on the steep 45 mm/hr cell, broader bands on the weaker 30
    mm/hr cell, one broad flat band elsewhere'
  - Plausible, neutral meteorological scenario with realistic intensities and km-scaled
    axes
  weaknesses:
  - 'Suggestion: the outermost ring of each storm shows faint polygon facets at the
    1 km grid spacing; a slightly finer grid or a smoothed path would round them further.'
  - 'Suggestion: the 0–5 / 5–10 / 10–15 swatches are close in tone; a few more levels
    (e.g. a 2.5 mm/hr step) would add detail in the light-rain fringe.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 page; square plot area with no frame, axis lines or ticks.
      Chrome: bold dark title "Storm Rainfall Intensity · contour-filled · javascript · echarts · anyplot.ai" (~55% width), axis titles "Distance East–West (km)" / "Distance North–South (km)", ticks -50..50 step 25 in soft ink, color-bar title "Rainfall intensity (mm/hr)" on two lines — all readable.
      Data: filled bands from brand green #009E73 (0–5) to blue (40–45) over the whole grid; two concentric storm cells (lower-left peaking 40–45 with tight rings, upper-right peaking 25–30 with broader rings); thin dark isolines at 40% opacity along every boundary; 9-swatch stepped color bar on the right.
      Legibility verdict: PASS

