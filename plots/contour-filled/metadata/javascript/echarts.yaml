review:
  strengths:
  - 'Correct workaround for ECharts'' lack of a native contour series: category-axis
    heatmap + piecewise visualMap approximates filled-contour bands without shelling
    out to another library or echarts-gl.'
  - Sequential colormap is built from the mandated Imprint tokens (t.seq) with brand
    green at the low end and blue at the high end, identical between light and dark
    renders.
  - Theme chrome (title, axis labels, ticks, colorbar text) is fully readable in both
    light and dark renders with no dark-on-dark or light-on-light failures.
  - Data is deterministic (two fixed Gaussian storm cells, no RNG) and the rainfall-intensity
    scenario (0-49 mm/hr) is realistic and neutral.
  - Canvas is exactly 2400x2400 as declared by the square orientation directive; grid/spines
    are cleanly hidden (splitLine off, axisTick off) for a minimal-chrome look.
  weaknesses:
  - The 14-piece visualMap banding is barely perceptible in the render — adjacent
    bands blend into what reads as a smooth gradient rather than the distinct color
    bands a 'filled contour' should show. Widen the perceptual contrast between pieces
    (fewer, higher-contrast bands, e.g. 8-10 levels spanning more of the seq range)
    so the level structure is visible at a glance.
  - The two storm cells (centers at (-15,-10) and (22,16), sigma 18/22, peaks 45/30)
    merge into a single indistinguishable blob — no two separate local maxima are
    visible in either render. This undercuts the 'combined field from two storm cells'
    data story; increase the center separation or shrink sigma so both peaks read
    as distinct lobes.
  - The piecewise colorbar only labels the two extremes ('0 mm/hr' / '49 mm/hr') across
    its 14 swatches, so a viewer cannot read off intermediate level values precisely
    — label more pieces (e.g. every other swatch) or switch to a continuous visualMap
    with tick labels.
  - No contour/isolines are overlaid to mark precise level boundaries, which the spec
    calls out as a nice-to-have for a filled contour plot — a thin line series tracing
    a few key levels would strengthen the 'contour' identity beyond a plain heatmap
    look.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "Storm Rainfall Intensity · contour-filled · javascript · echarts · anyplot.ai" in bold dark ink, centered top. X-axis label "Distance East-West (km)" and Y-axis label "Distance North-South (km)" both dark ink, legible. Tick labels (-50 to 41 in steps) in a softer dark gray, evenly spaced and readable. Piecewise colorbar on the right with 14 small swatches, labeled "49 mm/hr" at top and "0 mm/hr" at bottom in soft gray text.
      Data: A single square heatmap field filling most of the plot area. Color runs from brand green (#009E73-ish) at the low-value periphery through teal to a darker blue-violet in a blob roughly centered left-of-middle. No hard band edges are visible — the color transition reads as a smooth gradient rather than distinct contour levels, and the two underlying storm cells are not separately distinguishable as two peaks.
      Legibility verdict: PASS (all text clearly readable against the light background).

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title, axis labels, and tick labels now rendered in light/white text, all clearly legible against the dark background. Colorbar text also light-colored and legible.
      Data: Identical color field and colors to the light render (green-to-blue gradient, same blob position and shape) — confirms data colors are theme-invariant as required. Same banding/two-peak weakness as noted for light render.
      Legibility verdict: PASS (no dark-on-dark text found; all chrome elements are clearly visible).
