review:
  strengths:
  - 'Clever, well-documented workaround for the missing colorAxis/heatmap module:
    a hand-rolled marching-squares/Sutherland-Hodgman isoband extraction cleanly reproduces
    genuine filled-contour semantics from the core Highcharts bundle.'
  - Correct Imprint imprint_seq sequential colormap (brand green to blue) for single-polarity
    elevation data, with identical data colors between the light and dark renders
    and theme-correct chrome (backgrounds, text, borders) in both.
  - Discrete colorbar with clear min/mid/max value labels plus overlaid isolines at
    each level boundary, matching the spec's suggestions for a colorbar and 'consider
    overlaying contour lines for precise level identification'.
  - 'Real Highcharts interactivity (not faked): an invisible scatter overlay drives
    a native tooltip reporting exact elevation at sampled grid points, without affecting
    the static PNG.'
  - Title font size scales with title length via an explicit formula, keeping the
    long mandated title comfortably within canvas bounds in both renders.
  weaknesses:
  - 'Isoline contrast is inconsistent between themes: the boundary lines use t.ink
    at 25% opacity, which reads as faint on the light render''s mid-tone bands but
    noticeably brighter/more prominent on the dark render''s bands — pick a stroke
    treatment (e.g. a fixed neutral tone or opacity tuned per theme) that reads with
    similar visual weight in both.'
  - 'Design Excellence is still at ''good default'' level rather than exceptional:
    the plot is a clean two-hue gradient with no additional depth cues (e.g. selectively
    labeling a few isolines with their elevation value) that would elevate the storytelling
    beyond ''color intensity shows where peaks are''.'
  - Library Mastery is necessarily generic here (hand-drawn SVG paths via chart.renderer)
    because the required heatmap/colorAxis module isn't loaded — acceptable given
    the constraint, but the repair loop should look for any additional Highcharts-native
    touches (e.g. leveraging renderer clipping, marker states, or built-in colorAxis-style
    legend formatting) that would demonstrate more idiomatic mastery of the SVGRenderer
    API.
  - Colorbar tick values (1191 / 595 / 0) are raw computed min/mid/max rather than
    round, human-friendly numbers — consider rounding to a cleaner scale (e.g. nearest
    50 or 100 m) for a more polished feel.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "Synthetic Mountain Range Elevation · contour-filled · javascript · highcharts · anyplot.ai" in bold dark ink, subtitle in softer gray directly beneath it, both fully visible and not clipped. Axis titles "X (km)" / "Y (km)" and tick labels (-10..10) in soft dark gray, clearly legible against the light background. Colorbar on the right labeled "Elevation (m)" with value labels 1191/595/0 in soft gray.
      Data: Smooth filled isobands transitioning from brand green (#009E73, low elevation) through teal to blue (high elevation), with three overlapping Gaussian peaks visible as darker blue lobes around (2,2), (-4,-3), and a smaller one near (1,-5.5). Thin darker isolines subdivide the bands but are fairly subtle against the mid-tone teal/blue fill.
      Legibility verdict: PASS — all text reads clearly against the light background, no dark-on-light or washed-out elements.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title and subtitle, now in light/off-white text, fully visible and not clipped. Axis titles and tick labels in light gray, clearly legible against the dark background. Colorbar and its value labels also rendered in light gray, legible.
      Data: Identical green-to-blue gradient and peak positions as the light render — confirming data colors are unchanged across themes. Isolines are noticeably more visible here than in the light render (lighter stroke color pops more against the darker-toned bands), which is a minor cross-theme consistency issue but not a legibility failure.
      Legibility verdict: PASS — no dark-on-dark text; all chrome elements are clearly readable, though the isoline prominence differs from the light render.
