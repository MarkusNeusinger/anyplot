review:
  strengths:
  - 'Both attempt-1 weaknesses are directly and correctly fixed: isoline stroke is
    now a fixed neutral color instead of theme-derived, giving identical visual weight
    in both renders; colorbar ticks are rounded to clean values (0/600/1200) instead
    of raw decimals.'
  - New direct elevation callouts on three isolines ("350 m", "600 m", "950 m") add
    concrete storytelling value without cluttering the render.
  - Correct imprint_seq sequential colormap (brand green to blue) for single-polarity
    elevation data, identical across themes with theme-correct chrome.
  - 'Real (not faked) interactivity: an invisible scatter overlay drives a native
    Highcharts tooltip with exact elevation at sampled points.'
  - Title fontsize scales with title length via an explicit formula, keeping the long
    mandated title comfortably within bounds in both renders.
  weaknesses:
  - Library Mastery remains capped by the missing heatmap/colorAxis module in the
    core bundle -- the hand-drawn SVG-path approach is the correct workaround per
    the library rules, but it is inherently less "idiomatic Highcharts" than a native
    series type.
  - Design Excellence, while improved, is still shy of exceptional -- the cartographic
    labeling is a nice touch but the overall composition doesn't yet have a truly
    distinctive focal-point treatment beyond the color gradient itself.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 (not pure white, not dark).
      Chrome: Title "Synthetic Mountain Range Elevation · contour-filled · javascript · highcharts · anyplot.ai" in bold dark ink; subtitle in soft gray; axis titles "X (km)"/"Y (km)" and tick labels (-10..10) in soft dark gray. All fully legible against the light background.
      Data: Filled isobands sweep from brand green (#009E73, low elevation ~0m) through teal to blue (high elevation ~1200m) across three overlapping Gaussian peaks. Thin dark isolines subdivide bands with consistent, moderate contrast. Three isolines carry direct elevation callouts ("350 m", "600 m", "950 m") in white label boxes with dark text. Discrete colorbar on the right shows clean rounded ticks (0 / 600 / 1200).
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 (not pure black, not light).
      Chrome: Title/subtitle in light/off-white text; axis titles and tick labels in light gray. All fully legible against the dark background. No dark-on-dark failures.
      Data: Green-to-blue gradient and peak positions are pixel-identical to the light render, confirming data colors are unchanged across themes. Isoline stroke is now a fixed neutral tone (rgba(26,26,23,0.45)) rather than theme-derived, so it reads with the same visual weight as in the light render -- resolves the attempt-1 cross-theme inconsistency. The three labeled isoline callouts use the same light box/dark text styling and stay legible against the dark bands.
      Legibility verdict: PASS
