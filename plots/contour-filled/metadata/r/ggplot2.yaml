review:
  strengths:
  - Correct diverging palette (matte-red -> theme-adaptive midpoint -> blue) chosen
    because the surface has a genuine zero midpoint (valley vs. peak)
  - 'Theme-adaptive chrome is fully correct in both renders: no dark-on-dark or light-on-light
    failures'
  - Peak/Valley annotations give the chart a clear narrative focal point instead of
    an unlabeled generic surface
  - Overlaid thin contour lines add precise level boundaries on top of the filled
    bands, per the spec's notes
  - Title format, axis labels with units, and canvas size are all exactly correct
  weaknesses:
  - Peak/Valley point markers (geom_point(size = 2.2, stroke = 0.6)) are small at
    full resolution and will likely shrink to near-invisible at the 400px mobile srcset
    - increase marker size (~3-3.5) and stroke (~1)
  - Library mastery is solid but generic for ggplot2's contour ecosystem - consider
    inline contour-level labels (e.g. via metR::geom_text_contour or directlabels)
    to more clearly distinguish the level bands without relying solely on the legend
