review:
  strengths:
  - Correct, idiomatic use of geom_contour_filled() with a geom_contour() line overlay
    for precise level identification, exactly matching the spec's suggestion
  - 'Excellent imprint_div implementation: diverging red -> theme-adaptive midpoint
    -> blue, correctly chosen because the ''peaks'' surface has a meaningful zero
    midpoint (valley vs. peak)'
  - Theme-adaptive chrome (background, text, legend, panel border) is threaded through
    correctly - both renders are fully legible with no dark-on-dark or light-on-light
    failures
  - 'Good data coverage: the classic ''peaks'' function shows two positive lobes,
    a deep valley, and smaller secondary extrema in one deterministic, reproducible
    surface'
  - Correct 2400x2400 square canvas via coord_fixed(ratio = 1), appropriate for this
    symmetric plot type
  weaknesses:
  - library(tidyr) and library(scales) are imported but never used anywhere in the
    script - remove both for CQ-03 compliance
  - Axis titles ('X Coordinate', 'Y Coordinate') and the legend title ('Elevation')
    carry no units - consider adding units or a short parenthetical to lift VQ-06/DQ-03
  - 'Design Excellence is solid but stays close to a well-configured default: the
    full four-sided panel border and legend styling could use more refinement (e.g.,
    tighter legend key spacing, softer/thinner panel border) to push DE-01/DE-02 higher'
  - No added storytelling element beyond the inherent color gradient (e.g., a light
    annotation marking the primary peak or valley) - optional, but would strengthen
    DE-03
