review:
  strengths:
  - Correct dB-scaled Imprint sequential colormap (green -> blue, imprint_seq) for
    the continuous power data, with identical data colors between the light and dark
    renders.
  - 'Clean core-only Highcharts substitute for the missing heatmap module: chart.renderer.rect()
    + axis.toPixels() produces a pixel-exact mel grid, plus a hand-built colorbar
    labeled in dB.'
  - Theme-adaptive chrome (title, axis titles, tick labels, frame) is correctly threaded
    through window.ANYPLOT_TOKENS in both renders, with a transparent chart background
    over the page surface.
  - Mel-to-Hz frequency-edge mapping is implemented correctly and labeled with real
    Hz values on the y-axis, matching the spec's 'mel-scaled frequency with Hz labels
    at key mel band edges' requirement.
  - Deterministic, reproducible synthetic audio generated in-browser via a seeded
    LCG (no Math.random()), with no network/fetch calls.
  weaknesses:
  - The pluck-like envelope (exp(-22 * timeInNote)) decays each 0.3s note to near-silence
    within roughly its first 100-150ms, so most of every note's duration reads as
    background noise floor. The result is a mostly uniform green field with thin vertical
    onset transients rather than sustained horizontal pitch bands tracing the rising-then-falling
    melody -- the mel-spectrogram's core storytelling feature (visible harmonic/pitch
    structure over time) is largely absent. Slow the decay rate (or lengthen the note)
    so each note's fundamental band stays visible for a larger fraction of its 0.3s
    duration.
  - Because sustained tone energy is barely visible, there is no clear visual hierarchy
    or focal point guiding the viewer to the melodic contour -- a slower envelope
    decay or higher sustained loudness relative to the -90 dB floor would let the
    melody's shape read clearly at a glance.
  - n_mels=48 is below the spec's typical guidance of 64-128 mel bands; not a hard
    requirement, but more bands would show finer frequency granularity.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (~#FAF8F1), not pure white -- matches the required light surface.
      Chrome: Title "spectrogram-mel · javascript · highcharts · anyplot.ai" in bold dark ink, subtitle "Synthetic melody · 2.4 s at 16 kHz · 48 mel bands" in softer gray, both fully readable. X-axis "Time (s)" (0.0-2.0+ s) and y-axis "Frequency (Hz, mel-scaled)" (80 Hz-850 Hz) labels and tick labels are dark and legible against the light background. The colorbar on the right is labeled "Power (dB)" with tick labels "0 dB", "-45 dB", "-90 dB", all clearly readable.
      Data: The mel-power grid is rendered as a continuous green-to-blue gradient (imprint_seq: #009E73 -> blue), with the grid mostly a uniform green (low power / near noise floor) punctuated by several vertical blue streaks around note onsets (roughly every ~0.3s, matching the melody's note duration). No red/orange hues present -- consistent with the sequential (non-diverging) colormap mandated for this single-polarity data.
      Legibility verdict: PASS -- all text is clearly readable against the light background, no light-on-light issues found.

    Dark render (plot-dark.png):
      Background: Warm near-black (~#1A1A17), not pure black -- matches the required dark surface.
      Chrome: Title, subtitle, axis titles, tick labels, and colorbar labels ("Power (dB)", "0 dB", "-45 dB", "-90 dB") all render in light gray/off-white and are clearly legible against the dark background. No dark-on-dark failures observed anywhere (title, axes, colorbar all confirmed).
      Data: The green-to-blue gradient in the mel-power grid is visually identical to the light render (same #009E73 start hue and same vertical streak positions/intensities) -- only the chrome (background, text, frame stroke) flipped between themes, as required.
      Legibility verdict: PASS -- all text is clearly readable against the dark background, no dark-on-dark issues found.
