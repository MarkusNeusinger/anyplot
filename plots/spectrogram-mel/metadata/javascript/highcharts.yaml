review:
  strengths:
  - 'Correct Imprint sequential colormap (#009E73 -> #4467A3) built directly from
    ANYPLOT_TOKENS.seq, applied consistently to both cell fills and the manual colorbar'
  - Y-axis shows real Hz labels at mel-warped tick positions (1600/1055/639/322/80
    Hz), matching the spec's explicit 'mel-scaled frequency with Hz labels' requirement
  - Colorbar is present and labeled in dB with clear tick values (0 / -40 / -80 dB),
    matching the spec's colorbar requirement
  - Deterministic, seeded synthetic audio (LCG) and per-mel-bin Goertzel power estimation
    avoid any external audio file dependency while staying reproducible
  - 'Theme-correct chrome in both renders: warm off-white background with dark ink
    text in light mode, warm near-black background with light text in dark mode, no
    dark-on-dark or light-on-light failures'
  - Manual chart.renderer.rect() + axis.toPixels() grid is the documented idiomatic
    substitute for the unavailable heatmap module, correctly following the highcharts.md
    guidance for this exact scenario
  weaknesses:
  - The mel grid reads as a fairly uniform, noisy texture across the full frequency
    range rather than showing crisp, well-separated harmonic bands per note; with
    3 additive harmonics per note and 8 overlapping notes the visual result is busy
    and doesn't clearly show the melody's fundamental+overtone structure or quiet
    gaps between note onsets — consider reducing harmonic count, widening the DB_FLOOR
    dynamic range, or normalizing per-frame instead of against a single global peak
    so the note structure reads more legibly (impacts DQ-01, VQ-03)
  - 'Design Excellence is solid but not yet publication-tier: the colorbar and frame
    are functional but could use tighter visual integration with the plot area (e.g.
    consistent stroke weight between the plot frame and colorbar border) to lift DE-01/DE-02
    further'
  - Library Mastery relies entirely on manual SVG rect drawing (chart.renderer.rect)
    for the actual data — correct given the missing heatmap module, but if any other
    core Highcharts feature (e.g. plotBands, crosshairs) could reinforce the mel-band
    structure without conflicting with the manual grid, it would strengthen LM-01/LM-02
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1-like cream), not pure white, not dark.
      Chrome: Title "spectrogram-mel · javascript · highcharts · anyplot.ai" in bold dark ink at top; subtitle "Synthetic melody · 2.4 s at 16 kHz · 48 mel bands" in soft gray beneath. Axis titles "Time (s)" and "Frequency (Hz, mel-scaled)" and all tick labels (0.0-2.0s on x; 80/322/639/1055/1600 Hz on y) render in dark ink, clearly legible. Colorbar on the right labeled "Power (dB)" with "0 dB" / "-40 dB" / "-80 dB" tick labels, all legible.
      Data: Densely packed mel-power grid spanning ~0-2.3s x 80-1600Hz, colored with the Imprint sequential green-to-blue gradient (frac 0 = #009E73 green at -80dB floor, frac 1 = #4467A3 blue at 0dB peak). No large unfilled canvas regions; grid area occupies the majority of the plot bounds.
      Legibility verdict: PASS - all text is clearly readable against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17-like), not pure black, not light.
      Chrome: Same title/subtitle/axis titles/tick labels/colorbar layout, now rendered in light ink (white/light gray) against the dark background. No dark-on-dark failures observed - every text element (title, subtitle, axis titles, tick labels, colorbar labels) is clearly legible.
      Data: Identical green-to-blue gradient and data pattern as the light render, confirming the data colors do not change between themes - only chrome (background, text color) flips as required.
      Legibility verdict: PASS - all text is clearly readable against the dark background, no dark-on-dark failures.
