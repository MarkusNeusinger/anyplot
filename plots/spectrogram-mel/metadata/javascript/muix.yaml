review:
  strengths:
  - 'Advanced idiomatic use of the MUI X escape hatch: bare ChartContainer plus useXScale/useYScale/useDrawingArea
    hooks to draw a true heatmap layer, since no MUI X community chart type natively
    supports a spectrogram.'
  - Custom-built colorbar (gradient + 0 dB / -80 dB / rotated Power (dB) label) is
    positioned correctly from useDrawingArea() and never clips against the canvas
    edge in either theme.
  - 'Correct mel-scale warping: HTK mel formula, Slaney-style triangular filterbank
    area normalization, and y-axis ticks placed at even mel-band edges but labeled
    with their actual Hz value (e.g. "614 Hz", "1.1k Hz") — matches the spec''s "Hz
    labels at key mel band edges" requirement precisely.'
  - Deterministic, in-browser DSP pipeline (seeded LCG, hand-written radix-2 FFT,
    Hann window, dB-with-floor conversion) produces a plausible sung four-note melody
    with harmonics, vibrato, and a breathy onset transient.
  - skipAnimation now set on ChartContainer, closing the CQ-05/LM-01 gap from attempt
    1.
  - The gamma-corrected color mapping (frac^0.6, gamma < 1) now reads correctly in
    both the heatmap cells AND the colorbar gradient (5 gamma-matched stops instead
    of a flat 2-stop gradient) — quiet early note onsets are visibly distinguishable
    from the background instead of blending into a flat mid-tone field.
  - Imprint sequential colormap (t.seq[0] to t.seq[1]) used correctly for the continuous
    power data, identical between light/dark renders, with theme-correct backgrounds
    and chrome.
  - No AR-09 edge clipping anywhere — checked all four canvas edges at full resolution
    in both themes.
  weaknesses:
  - n_fft=1024 / hop_length=400 / n_mels=64 diverge from the spec's 'typical parameters'
    (n_fft=2048, hop_length=512, n_mels=128) — a defensible browser-performance tradeoff
    given the SVG-rect-per-cell rendering approach, but coarser time/frequency resolution
    than the spec's suggested defaults.
  - Design excellence is solid but not distinctive — the heatmap + colorbar composition
    is clean and correct but doesn't go much further than the functional minimum (no
    annotation calling out the melodic phrase, no additional emphasis technique).
  - X-axis carries 24 densely packed tick labels (0.0s-2.3s at 0.1s steps); still
    readable in both renders but tight, and a sparser tick interval would give more
    breathing room.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white, not dark.
      Chrome: Centered dark-ink title "spectrogram-mel · javascript · muix · anyplot.ai" fully visible at the top. X-axis "Time (s)" with dense 0.0s-2.3s tick labels; Y-axis "Frequency (mel-scaled)" with Hz tick labels at mel-even intervals (0 Hz through 8k Hz). Colorbar on the right with "0 dB" / "-80 dB" endpoints and a rotated "Power (dB)" label. All text is dark-on-light and clearly readable, no clipping at any edge.
      Data: Continuous heatmap from teal-green (#009E73, low power) to indigo-blue (t.seq[1], high power). A dense low-frequency band (below ~1.1k Hz) runs throughout, with harmonic "arch" structures tracing a four-note rising melody, most prominent from ~1.2s onward but now visibly present from early frames too thanks to the gamma-corrected color mapping.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black, not light.
      Chrome: Identical title, axes, and colorbar as the light render, now rendered in light ink against the dark background — all clearly legible. No dark-on-dark failures; no black text on the dark surface anywhere.
      Data: Heatmap data colors are visually identical to the light render (same teal-green-to-blue gradient at the same positions), confirming only chrome flipped between themes as required.
      Legibility verdict: PASS
