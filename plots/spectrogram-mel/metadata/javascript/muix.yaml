review:
  strengths:
  - 'Advanced idiomatic use of the MUI X escape hatch: bare ChartContainer plus useXScale/useYScale/useDrawingArea
    hooks to draw a true heatmap layer, since no MUI X community chart type natively
    supports a spectrogram — this is exactly the intended "community surface, full
    richness" pattern.'
  - Custom-built colorbar (gradient + 0 dB / -80 dB / rotated "Power (dB)" label)
    is positioned correctly from useDrawingArea() and never clips against the canvas
    edge in either theme.
  - 'Correct mel-scale warping: HTK mel formula, Slaney-style triangular filterbank
    area normalization, and y-axis ticks placed at even mel-band edges but labeled
    with their actual Hz value (e.g. "614 Hz", "1.1k Hz") — matches the spec''s ''Hz
    labels at key mel band edges'' requirement precisely.'
  - Deterministic, in-browser DSP pipeline (seeded LCG, hand-written radix-2 FFT,
    Hann window, dB-with-floor conversion) produces a plausible sung four-note melody
    with harmonics, vibrato, and a breathy onset transient — realistic and neutral
    content with no external audio file dependency.
  - Imprint sequential colormap (t.seq[0] to t.seq[1]) is used correctly for the continuous
    power data, identical between light/dark renders, with theme-correct backgrounds
    and fully legible chrome in both themes.
  - No AR-09 edge clipping anywhere (title, axis labels, tick labels, colorbar, colorbar
    labels all fully inside the 3200x1800 canvas with comfortable margins).
  weaknesses:
  - '`skipAnimation` is never set on `<ChartContainer>`, contradicting the muix library
    rule (''Always set both belts — set skipAnimation on every chart component'').
    It happens not to matter visually here because the spectrogram is drawn as raw
    SVG rects outside MUI X''s animated series system, but it''s a one-line fix (`<ChartContainer
    skipAnimation ...>`) that should be added for correctness and to match the mandatory
    rule.'
  - n_fft=1024 / hop_length=400 / n_mels=64 diverge from the spec's 'typical parameters'
    (n_fft=2048, hop_length=512, n_mels=128). This is a defensible engineering choice
    for a 2.4s/16kHz clip computed live in the browser, but the resulting time-frequency
    resolution is coarser than the spec's suggested defaults — consider n_fft=2048/hop=512
    if performance allows, or note the deviation is intentional.
  - 'Visual storytelling is modest: most of the canvas is a fairly uniform mid-tone
    field, with the melodic/harmonic structure only becoming visually prominent in
    the back half (1.8s-2.4s). A touch more dynamic-range stretching or contrast could
    make the earlier notes read more clearly against the background.'
  - Design excellence is solid but not distinctive — the heatmap + colorbar composition
    is clean and correct but doesn't go much further than the functional minimum (e.g.
    no reference lines, no annotation of note boundaries, no secondary visual emphasis).
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1), consistent with the Imprint light-theme surface — not pure white.
      Chrome: Title "spectrogram-mel · javascript · muix · anyplot.ai" is centered at the top in dark ink, fully visible with clear margin above it. X-axis "Time (s)" labeled 0.0s-2.3s in ~0.1s steps. Y-axis "Frequency (mel-scaled)" with Hz tick labels at mel-even intervals (0 Hz, 259 Hz, 614 Hz, 1.1k Hz, 1.8k Hz, 2.7k Hz, 3.9k Hz, 5.6k Hz, 8k Hz). Colorbar on the right with "0 dB" above and "-80 dB" below the gradient bar, plus a rotated "Power (dB)" label to its right. All text is dark-on-light and clearly readable; no clipping at any edge.
      Data: Continuous heatmap cells from teal-green (#009E73, low power/-80 dB) to indigo-blue (~#4467A3, high power/0 dB, the Imprint sequential pair). A dense low-frequency band (below ~600 Hz) runs throughout, with harmonic "arch" structures rising into the ~1-2 kHz range that grow more prominent after ~1.2s, consistent with a four-note melody with harmonics and vibrato.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17), consistent with the Imprint dark-theme surface — not pure black.
      Chrome: Same title, axis labels, tick labels, and colorbar as the light render, now rendered in light ink/white text against the dark background. All text is clearly legible; no dark-on-dark failures observed (title, axis ticks, colorbar labels all light-colored and crisp).
      Data: Identical teal-green-to-indigo-blue heatmap coloring and spatial pattern as the light render — confirms data colors are unchanged between themes, only chrome flipped.
      Legibility verdict: PASS
