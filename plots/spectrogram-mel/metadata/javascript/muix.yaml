review:
  strengths:
  - Mel filterbank computed from first principles (HTK mel edges, Slaney area normalisation,
    Hann-windowed DFT, dB re peak with a 70 dB floor); note fundamentals and harmonics
    land at the expected Hz
  - Y ticks sit exactly on mel band edges and are formatted back to Hz, so the axis
    itself shows the mel warping (14 → 273 → 627 → … → 7,833)
  - 'Idiomatic v9 composition: ChartsContainer with linear axes plus custom SVG layers
    drawn through useXScale / useYScale / useDrawingArea, staying in community @mui/x-charts'
  - Colour scale built from the t.seq Imprint stops, all chrome threaded through theme
    tokens, skipAnimation set
  weaknesses:
  - 'VQ-01 (both): tick labels at 15 px and axis titles at 16 px on the 2000 px-wide
    CSS canvas shrink to about 3 px in the 400 px thumbnail → tick labels about 18
    px (+3 px), axis titles about 20 px (+4 px). Likely cause: tickLabelStyle.fontSize:
    15 / labelStyle.fontSize: 16 on both axes and fontSize={14} on the colour-bar
    ticks.'
  - 'Suggestion: the header says muix 7.29.1 while the harness pins @mui/x-charts
    9.16; align it.'
  - 'Suggestion: v9''s ContinuousColorLegend with a colorMap could replace the hand-drawn
    gradient colour bar.'
