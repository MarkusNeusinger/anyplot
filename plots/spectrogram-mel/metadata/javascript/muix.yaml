review:
  strengths:
  - 'Builds the mel-spectrogram from first principles in the browser: Hann-windowed
    STFT, HTK mel filterbank with Slaney area normalisation and dB relative to the
    peak, all derived from the sample records (sample rate is computed from the time
    column, not typed)'
  - 'Idiomatic MUI X v9 composition: ChartsContainer with custom SVG children that
    read useXScale/useYScale/useDrawingArea, so the mel cells and the colorbar share
    the chart''s own scales and drawing area'
  - The y axis is linear in mel with tickInterval at every eighth band edge and a
    valueFormatter that converts mel back to Hz, so the labels (14, 273, 627 … 7,833
    Hz) bunch toward the top exactly as a mel axis should
  - 'Colorbar is a hand-placed Imprint seq gradient (#009E73 to #4467A3) aligned exactly
    to the plot height, labelled ''Power (dB re peak)'' with true minus signs; data
    colors are identical in both themes and all chrome uses ink/inkSoft tokens'
  - A sung C-major arpeggio with three harmonics, vibrato and a breathy onset gives
    a readable rising staircase of fundamentals and overtones (261/523/785 Hz, then
    E4, G4, C5) against a quiet noise floor
  - Subtitle states sample count, sample rate, band count, FFT size and hop — a clear
    secondary hierarchy under the mandated title
  weaknesses:
  - 'Suggestion: a higher noise-floor clamp (e.g. a 60 dB range) would push more of
    the quiet background to the green end and let the weaker third harmonics separate
    further from it.'
  - 'Suggestion: MUI X''s ChartsTooltip or a hover readout of time, band frequency
    and dB per cell would add value in the interactive HTML.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 page around the plot; the plot area is fully tiled by mel cells.
      Chrome: bold title "spectrogram-mel · javascript · muix · anyplot.ai" centred at top with an inkSoft subtitle (38,400 samples at 16,000 Hz · 64 mel bands up to 8,000 Hz · FFT 1024, hop 400 (25 ms per frame)); x axis "Time (s)" with ticks 0.2–2.2; y axis "Frequency (Hz, mel-scaled)" with Hz labels 14, 273, 627, 1,110, 1,768, 2,665, 3,889, 5,558, 7,833 at mel band edges (spacing compresses toward the top); right-side colorbar 0 to −70 labelled "Power (dB re peak)". All text dark and readable, no clipping.
      Data: Imprint seq ramp — quiet noise floor in brand green #009E73, energy toward blue #4467A3. Four notes at 0–0.6, 0.6–1.2, 1.2–1.8, 1.8–2.4 s each show a fundamental plus two harmonics as horizontal blue bands, stepping upward (C4, E4, G4, C5); a faint darker left edge marks the breathy onset. Cells tile contiguously.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17 page.
      Chrome: title, subtitle, tick labels, axis titles and colorbar labels in light ink/inkSoft — all readable, no dark-on-dark text; axis lines light.
      Data: mel cells and colorbar gradient identical to the light render (same green → blue ramp); only the chrome flipped. Brand green clearly visible.
      Legibility verdict: PASS
