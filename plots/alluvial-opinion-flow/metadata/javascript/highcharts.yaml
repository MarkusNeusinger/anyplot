review:
  strengths:
  - Fixed the theme-inconsistent "Neutral" color — now anchored to t.palette[2] blue,
    pixel-identical hex in both light and dark renders.
  - 'Explicit "Net drift Q1 → Q4: extremes +Npp · Neutral Mpp" callout now names the
    polarization trend directly, satisfying SC-02 and lifting DE-03.'
  - Cross-category ("changer") flow opacity raised 0.32→0.42 plus a thin same-color
    stroke, making the thinnest ribbons distinguishable from the busy crisscrossing
    field in both themes.
  - Hand-built alluvial/Sankey via Highcharts' native chart.renderer is the documented,
    correct workaround since the core bundle has no sankey module.
  - Deterministic Gaussian-kernel transition model with exact respondent-total reconciliation
    (all waves sum to 1,000).
  - Category legend dynamically measured and centered via getBBox() rather than hard-coded
    offsets.
  weaknesses:
  - 'In-block "n = ###" labels at 13px are on the smaller side relative to the chart''s
    overall scale — could be nudged up slightly for mobile-width legibility.'
  - LM-02 remains moderate — the manual SVG-renderer technique, while a legitimate
    and well-executed workaround, doesn't showcase a feature unique to Highcharts
    beyond what any SVG-capable library could replicate.
  - Helper functions (gaussian, buildTransition, subdivide, luminance/contrastText)
    keep CQ-01 below max — justified by the manual-alluvial math but still adds structural
    complexity beyond a "no functions" ideal.
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white, matches #FAF8F1 — not pure white, not dark.
      Chrome: bold dark title "alluvial-opinion-flow · javascript · highcharts · anyplot.ai", soft-gray subtitle, italic net-drift callout ("Net drift Q1 → Q4: extremes +20pp · Neutral -13pp"), bold column headers (Q1 2026–Q4 2026) — all clearly readable dark-on-light.
      Data: 5 category node blocks (green #009E73 "Very Satisfied", lavender "Satisfied", blue #4467A3 "Neutral", ochre "Dissatisfied", red "Very Dissatisfied") connected by proportionally-sized curved ribbons; stable-respondent ribbons at higher opacity than cross-category "changer" ribbons (which now also carry a thin same-color stroke). Each node has a white "n = ###" label, legible against every block color. First series confirmed #009E73.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black, matches #1A1A17 — not pure black, not light.
      Chrome: title, subtitle, net-drift callout, and column headers all render light-on-dark and are fully legible — no dark-on-dark failures.
      Data: all 5 category colors (including "Neutral," fixed to #4467A3) are pixel-identical to the light render — the attempt-1 theme-consistency defect is resolved. Node n= labels remain legible on every block.
      Legibility verdict: PASS
