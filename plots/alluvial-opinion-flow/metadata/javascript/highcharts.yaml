review:
  strengths:
  - Deterministic Gaussian-kernel transition model produces a coherent polarization
    narrative across 4 quarterly waves — extremes (Very Satisfied / Very Dissatisfied)
    grow while Neutral shrinks, visible in both renders.
  - Hand-built alluvial/Sankey rendering via Highcharts' native chart.renderer (correct
    workaround since the core bundle has no sankey module), including a luminance-based
    contrast function so 'n=' node labels stay readable on every colored block in
    both themes.
  - Category legend is dynamically measured and centered with getBBox() rather than
    hard-coded offsets.
  - 'Theme-adaptive chrome is otherwise clean: transparent chart background, correct
    ink/inkSoft usage for title, subtitle, and column headers, no pure white/black
    canvas.'
  - All node totals reconcile exactly to 1,000 respondents per wave — internally consistent
    flow data.
  weaknesses:
  - 'VQ-07: The ''Neutral'' category color uses t.inkSoft (a theme-adaptive chrome
    token: #4A4A44 in light, #B8B7B0 in dark) instead of a fixed Imprint palette member.
    Its node blocks and flow ribbons render dark charcoal in plot-light.png but light
    gray/near-white in plot-dark.png — the same category visibly changes identity
    between themes, violating the rule that categorical data colors (positions 1-8)
    must stay identical across light and dark. Fix: use t.palette[2] (#4467A3 blue,
    the canonical position-3 slot that was skipped) for ''Neutral'' instead of inkSoft,
    so all 5 category colors are fixed hexes in both themes.'
  - 'SC-02: The spec asks to ''highlight net flows between categories to reveal polarization
    trends.'' The only signal for this is the opacity split between stable (0.6) and
    changing (0.32) flows plus the growing node sizes at the extremes — there''s no
    explicit visual emphasis (e.g. a subtle callout or accent) that calls out the
    net-drift-toward-extremes trend itself.'
  - 'DQ-01/VQ-03: Several thin single-cell flows (small transition counts) are hard
    to distinguish at 0.32 opacity against the busy crisscrossing ribbon field, especially
    in plot-dark.png — the smallest flows nearly disappear into the background noise
    of overlapping ribbons.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "alluvial-opinion-flow · javascript · highcharts · anyplot.ai" in bold dark ink, subtitle "Quarterly product-satisfaction survey · n = 1,000 respondents per wave" in soft gray beneath it. Four bold column headers (Q1 2026 - Q4 2026) sit above the node columns. A centered legend with 5 swatches (Very Satisfied, Satisfied, Neutral, Dissatisfied, Very Dissatisfied) sits below the plot. All chrome text is dark-on-light and clearly legible.
      Data: Five stacked node blocks per wave column (green, lavender/purple, charcoal-gray, ochre, red, top to bottom) connected by curved ribbon flows whose width is proportional to respondent counts. First series is Imprint brand green (#009E73); "Very Dissatisfied" uses the semantic red anchor. Each node shows a white/black "n = ###" label sized to contrast with its own block color (dark text on light ochre/lavender, light text on the dark charcoal Neutral and green blocks). Ribbon flows use two opacity tiers: ~0.6 for same-category (stable) flows and ~0.32 for cross-category (changing) flows.
      Legibility verdict: PASS — all title, subtitle, header, node-label, and legend text is clearly readable against the light background.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title/subtitle/column-header/legend layout, now rendered in light ink (white/near-white) against the dark background. All chrome text reads clearly with no dark-on-dark failures.
      Data: The green, lavender, ochre, and red node blocks and ribbons are visually identical in hue to the light render, confirming those four categories are theme-stable. However, the "Neutral" node blocks and their flows are NOT identical — in this render they appear as a light gray/near-white block (using the theme-adaptive t.inkSoft token, #B8B7B0 in dark mode) instead of the dark charcoal seen in the light render (#4A4A44 in light mode). This is a real palette-compliance defect: a categorical data series must keep the same color identity in both themes, and Neutral does not.
      Legibility verdict: PASS for text; FAIL for data-color consistency — "Neutral" changes color identity between the two renders because it is driven by a theme-adaptive chrome token instead of a fixed Imprint palette hex.
