review:
  strengths:
  - Correctly builds a custom Sankey/alluvial layout from data joins and manual cubic-bezier
    ribbon paths since d3-sankey isn't in the pinned bundle -- the idiomatic choice
    given the library's constraints
  - 'Data integrity is verified-correct: each wave''s row-stochastic transition matrix
    conserves the 1000-respondent total exactly, and the ''Strongly Agree + Strongly
    Disagree: 25% -> 40%'' callout matches the visible node totals (150+100=250/1000=25%;
    195+209=404/1000~=40%)'
  - 'Directly addresses attempt-1 review feedback: mid-wave (Q2/Q3) nodes now carry
    compact ''SA/A/N/D/SD'' category-abbreviation tags, and ribbons are z-ordered
    (changed-category drawn first, stable drawn on top) to cut down the crossing clutter
    around the Neutral band'
  - Theme-correct chrome in both light and dark renders; Imprint palette used in canonical
    order with brand green (#009E73) on the first category, and identical data colors
    across themes
  - Correct mandated title format, clean bottom-centered legend explaining the stable/changed
    opacity encoding, no edge clipping in either render
  weaknesses:
  - 'Design Excellence is solid but not exceptional: typography relies on plain size/weight
    variation without a more distinctive hierarchy, and the layout is functionally
    correct rather than showing an extra layer of intentional polish (e.g. visually
    emphasizing the extreme-category growth beyond the callout text)'
  - Library Mastery usage is correct and idiomatic but fairly generic for D3 -- the
    manual Sankey/ribbon construction is the necessary approach given no d3-sankey,
    but doesn't showcase a more distinctive D3-only capability beyond basic selection/scale/path
    idioms
  - The dense crossing of low-opacity 'changed category' ribbons around the Neutral
    band is improved by the new z-ordering but is still somewhat busy; consider slightly
    reducing ribbon curvature or widening the column gap to further cut crossing density
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 -- not pure white.
      Chrome: Title "alluvial-opinion-flow · javascript · d3 · anyplot.ai" in bold dark ink, clearly readable. "Q1 2025"..."Q4 2025" wave headers in bold dark ink above each column. Category name labels ("Strongly Agree" ... "Strongly Disagree") in medium-gray ink to the left of the Q1 column and right of the Q4 column. New compact "SA/A/N/D/SD" abbreviation tags sit above each interior (Q2, Q3) node, in the same soft-ink tone, so mid-wave nodes are no longer identifiable by color/position alone. A callout box ("Polarization trend / Strongly Agree + Strongly Disagree: 25% -> 40% of respondents") sits top-right with a subtle border and off-white-elevated fill, text fully legible. Bottom-center legend ("Stable (same category)" / "Changed category") with gray swatches at two opacity levels.
      Data: Five stacked node blocks per wave column colored via the Imprint palette in canonical order (green Strongly Agree, purple Agree, blue Neutral, ochre Disagree, red Strongly Disagree). Ribbons connect same-category flows at high opacity (0.55) and cross-category flows at low opacity (0.2); changed-category ribbons are now drawn first so the stable ribbons layer cleanly on top, reducing crossing clutter versus the prior attempt. Near-white respondent-count labels sit centered on each node block, contrasting cleanly against the saturated fills. First categorical series renders as #009E73 green as required.
      Legibility verdict: PASS -- all title, header, callout, legend, interior tag, and node-count text is clearly readable against the light background; no light-on-light issues observed.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 -- not pure black.
      Chrome: Title, wave headers, category labels, and the new interior abbreviation tags flip to light-colored text (off-white / light gray), fully readable against the dark background. The callout box uses a dark-elevated fill with a subtle border, its heading and body text rendered in light tones. The bottom legend swatches and labels are also light-toned and legible.
      Data: The five node colors and ribbon colors are visually identical to the light render (same green/purple/blue/ochre/red hues at the same opacity levels for stable vs. changed flows) -- only the chrome (background, text, legend/callout box fill) flips, as required. Node respondent-count labels use near-black fill against the saturated node colors in this theme, which still reads with good contrast since the node fills are medium-bright, not dark.
      Legibility verdict: PASS -- no dark-on-dark failures observed; all chrome text is clearly visible against the near-black background, and node/callout text remains legible over the saturated data colors.
