review:
  strengths:
  - Faithfully realizes an alluvial/Sankey diagram entirely from MUI X's composable
    API (ChartContainer + useXScale/useYScale) even though the community package has
    no native Sankey component, without reaching into any Pro/Premium surface.
  - 'Excellent spec compliance: explicit per-wave node totals as labels, stable-vs-changer
    opacity distinction (0.55 solid vs 0.16 faint ribbons), net-change delta annotations
    vs Q1 with color-coded up/down arrows, and clear chronological wave column headers.'
  - Thoughtful semantic color mapping (brand green -> lime -> muted -> amber -> matte
    red, a sentiment gradient built entirely from Imprint palette slots + the amber/muted
    anchors) that reads intuitively and reduces reliance on a separate legend.
  - 'Deterministic, internally-consistent data: every wave''s populations sum to exactly
    1,000 and every transition matrix''s row/column sums exactly match the adjacent
    wave populations (no rounding drift).'
  - Consistent theme-adaptive chrome (t.ink / t.inkSoft for text) with identical data
    colors between light and dark renders; both backgrounds match the Imprint light/dark
    spec exactly.
  weaknesses:
  - 'VQ-04: ''Very Satisfied'' (teal-green #009E73) and ''Satisfied'' (lime #99B314)
    are both green-family hues; under red-green CVD they may read as closer together
    than the amber/red bands lower in the scale. A thin ink-color stroke on the ribbons/nodes
    (per the style guide''s optional outline pattern) would fully separate them for
    CVD readers even though direct text labels already prevent color-only misreading.'
  - 'LM-01: Because @mui/x-charts community has no native Sankey/alluvial chart, the
    implementation necessarily drops to the low-level ChartContainer + useXScale/useYScale
    overlay pattern instead of a high-level chart component -- the correct choice
    given the constraint, but it means less of MUI X''s idiomatic declarative surface
    is exercised than in a typical bar/line/pie implementation.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1), matches the Imprint light-theme surface exactly.
      Chrome: Dark title "alluvial-opinion-flow · javascript · muix · anyplot.ai" and subtitle/legend-note text are fully legible against the cream background; wave column headers ("Q1 2025" .. "Q4 2025") are bold dark gray and clearly readable; node labels (category name + count, and delta arrows on the last wave) sit directly on top of the colored ribbons and remain legible because of sufficient contrast.
      Data: Five ordinal sentiment bands rendered top-to-bottom as Very Satisfied (teal-green), Satisfied (lime), Neutral (gray), Dissatisfied (amber/tan), Very Dissatisfied (matte red) -- first series is the brand green #009E73 as required. Ribbon opacity clearly differentiates stable respondents (bold/solid) from changers (faint), and the polarization trend (top and bottom bands widening left to right) is immediately visible.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17), matches the Imprint dark-theme surface exactly.
      Chrome: Title and subtitle render in light ink against the dark background with strong contrast; wave headers and node labels (category name, count, delta arrows) are light-colored and clearly readable on top of the ribbons; no dark-on-dark or light-on-light failures observed anywhere in the frame.
      Data: Same five category colors as the light render (teal-green, lime, gray, amber, matte red) -- confirmed identical hex values, only the chrome (background/text) flipped as required. Ribbon opacity distinction (stable vs changed) and the polarization story read just as clearly as in the light render.
      Legibility verdict: PASS
