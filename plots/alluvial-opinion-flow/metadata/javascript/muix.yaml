review:
  strengths:
  - 'Flow conservation is exact: every wave''s node totals equal both the incoming
    and outgoing flow sums (e.g. Q2 Very Satisfied 200 in = 160+30+10 out), all four
    waves sum to 1,000 respondents, and the Q4 deltas (+170, -150, -180, +40, +120
    vs Q1) follow from the data'
  - Stable respondents (fillOpacity 0.58) are clearly set apart from changers (0.18),
    and each node's outgoing ribbons are stacked in target order, so stable flows
    run nearly level across the four waves
  - 'Ordered satisfaction ramp from brand green #009E73 (Very Satisfied) through the
    muted anchor (Neutral) to matte red #AE3030 (Very Dissatisfied), in the categories''
    natural order and kept in the header legend'
  - Node labels carry the per-wave totals on page-colored pills that stay readable
    over the ribbons in both themes; the last column's labels sit outside the blocks
    with a colored ▲/▼ net-shift line that makes the polarization (both poles grow,
    Neutral shrinks) readable at a glance
  - 'Idiomatic MUI X composition: ChartsContainer with a point-scale top x axis as
    wave headers and a custom SVG layer drawn through useXScale/useYScale, with skipAnimation
    and the ANYPLOT_SIZE mount contract'
  weaknesses:
  - 'VQ-05 (both): an empty band of about 60 CSS px separates the legend row (ends
    near y≈85) from the wave headers (y≈145), so the header block floats above the
    diagram → about 20 px (−40 px). Likely cause: HEADER_H = 104 plus the x axis band
    height 44 and margin top 10 stacked on top of each other.'
  - 'Suggestion: the changer ribbons at fillOpacity 0.18 read as near-black bands
    on the dark page where their source hue is hard to identify; a slightly higher
    changer opacity in dark (about 0.25) would keep the hue legible while staying
    well below the 0.58 of stable flows.'
  - 'Suggestion: adding a tooltip (count and source → target) on each ribbon in the
    HTML output would let readers inspect the hair-thin transitions.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, not pure white.
      Chrome: centered bold title "alluvial-opinion-flow · javascript · muix · anyplot.ai" (~33% width), subtitle "Respondents: 1,000 · Survey wave: Q1 2025–Q4 2025", one-row legend with five rounded swatches (Very Satisfied … Very Dissatisfied) plus the key "Bold ribbon = stable · Faint ribbon = changed · ▲▼ = net shift". Column headers Q1 2025 … Q4 2025 in bold soft ink above four node columns. All text dark on light, fully readable.
      Data: four columns of five stacked blocks each — Very Satisfied #009E73, Satisfied dark teal, Neutral muted grey #6B6A63, Dissatisfied brownish red, Very Dissatisfied #AE3030. Stable ribbons are bold tinted bands running level; changer ribbons are faint, many hair-thin crossing curves. Node labels "Category (n)" on page-colored pills; the Q4 column has labels to the right with ▲ +170 / ▼ −150 / ▼ −180 / ▲ +40 / ▲ +120 vs Q1 2025. An empty band of about 60 CSS px sits between the legend row and the wave headers.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17, not pure black.
      Chrome: title, subtitle, legend and wave headers in light ink; no dark-on-dark text. Label pills switch to the dark page color with light text, readable.
      Data: Very Satisfied #009E73 and Very Dissatisfied #AE3030 identical to light; Neutral takes the dark muted anchor #A8A79F and the intermediate ramp steps lighten accordingly (theme-adaptive ramp steps, as allowed for ordered categories). Stable ribbons stay clearly visible; changer ribbons at low opacity read as dark tinted bands, distinguishable from each other and the page but with weak hue.
      Legibility verdict: PASS
