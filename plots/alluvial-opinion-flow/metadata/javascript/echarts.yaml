quality_score: 86
review:
  strengths:
  - 'Data integrity is airtight: every wave''s category totals are the exact row/column
    sums of the transition matrices, and all four waves sum to 1000 respondents.'
  - Opacity-based stable-vs-changer distinction (0.55 vs 0.16) directly satisfies
    the spec's 'visually distinguish stable respondents from changers' requirement.
  - Consistent per-category coloring across all four waves, using the documented Imprint
    semantic-exception order (green=agree family, red=disagree family, muted gray=neutral)
    while keeping the brand green as the first series.
  - Both light and dark renders are fully legible with correctly flipped chrome and
    identical data colors.
  - 'Idiomatic, distinctive ECharts usage: graphic overlay for column headers, emphasis.focus
    ''adjacency'' for hover highlighting, and a two-line label formatter.'
  weaknesses:
  - The mid-chart region is visually noisy with many overlapping thin cross-category
    ribbons; consider lowering the changer opacity further (e.g. ~0.08-0.10) or reducing
    curveness slightly to make the dominant stable flows stand out more.
  - '''Highlight net flows between categories to reveal polarization trends'' is only
    satisfied implicitly through the changing per-node totals; there''s no explicit
    visual emphasis calling out the Strongly Agree/Strongly Disagree growth and Neutral
    shrinkage across waves.'
  - At mobile/thumbnail scale (~400px), the dense stack of 13px two-line node labels
    across 5 rows x 4 columns may become hard to read; consider bumping node label
    fontSize slightly or shortening the label text.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "alluvial-opinion-flow · javascript · echarts · anyplot.ai" in dark text, top-center. Column headers "Q1 2024" through "Q4 2024" in bold dark text above each wave. Node labels (category name + respondent total) in a softer dark-gray tone, readable against every band color.
      Data: Five category bands — Strongly Agree (#009E73 teal), Agree (olive-green), Neutral (gray), Disagree (tan/amber), Strongly Disagree (crimson). Thick saturated ribbons = stable respondents; thin pale ribbons = category changers. First series confirmed as #009E73.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Title and column headers render in light/white text, clearly visible. Node labels use a light-gray tone that stays legible against all five band colors, including the crimson and olive bands — no dark-on-dark failures found.
      Data: Same five category colors as the light render (teal, olive, gray, tan, crimson) — confirms data colors are identical across themes; only chrome (background/text) flipped.
      Legibility verdict: PASS
