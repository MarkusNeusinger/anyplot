review:
  strengths:
  - 'The Review 1 weaknesses were addressed directly: changer-flow opacity dropped
    from 0.16 to 0.09 (cutting mid-chart visual noise) and a computed polarization-trend
    subtitle now makes the spec''s ''reveal polarization'' requirement explicit'
  - The polarization callout is derived from the same totals array driving the diagram,
    not a separately hard-coded claim
  - 'Data integrity is airtight: every wave''s category totals are the exact row/column
    sums of the transition matrices, and all four waves sum to 1000 respondents'
  - Consistent per-category coloring across all four waves using the Imprint semantic-exception
    order, with brand green reserved for the first series
  - Both light and dark renders are fully legible with correctly flipped chrome and
    identical data colors
  weaknesses:
  - Node labels remain at 13px across 5 stacked rows x 4 columns of two-line 'Category
    / N' text - still dense enough to be a mobile-scale (~400px) legibility risk
  - LM-02 and DE-01 remain just short of top marks - a distinctive Sankey-only feature
    (e.g. custom tooltip formatter, draggable node reordering) would push library
    mastery further, though this is a minor enhancement
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1.
      Chrome: Title, subtitle (new polarization-trend callout), column headers (Q1-Q4 2024), and node labels are all dark and clearly readable against the light background.
      Data: Five category bands - Strongly Agree (#009E73 brand teal), Agree (#99B314 lime), Neutral (muted gray), Disagree (#BD8233 ochre), Strongly Disagree (#AE3030 matte red). Stable-respondent ribbons are thick/saturated (opacity 0.55); cross-category ribbons are faint (opacity 0.09), reducing mid-chart visual noise versus attempt 1.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17.
      Chrome: Title and headers render in white/light text; subtitle and node labels use a softer light-gray (inkSoft) tone. All clearly readable against every band color, including the darker red and ochre bands. No dark-on-dark failures.
      Data: All five band colors are identical to the light render (teal, lime, gray, ochre, red) - confirms data-color consistency across themes; only chrome flipped.
      Legibility verdict: PASS
