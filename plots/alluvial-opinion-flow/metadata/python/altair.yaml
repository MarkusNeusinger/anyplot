review:
  strengths:
  - 'The five Likert levels take ordered steps of the imprint_div marks ramp with
    the theme''s stops (#009E73 green pole for Strongly Agree, the grey midpoint #6B6A63
    light / #686762 dark for Neutral, #AE3030 for Strongly Disagree), computed from
    the data''s category order, so order reads at a glance in both themes'
  - Stable flows (opacity 0.6) are set apart from changers (0.3), and the same category
    order in every wave keeps stable bands running level
  - Count text color chosen per block from its luminance, so every node count reads
    on its fill in both themes
  - Right-hand labels give each category's Q4 total and net change since Q1, and a
    note computed from the data quantifies polarization (extremes 33% to 44%)
  - 'Idiomatic Altair layering: transform_filter splits stable vs changer flows, filled
    mark_line polygons with detail/order, scale=None for per-row text colors, and
    a selection_point hover with alt.condition opacity plus per-flow tooltips in the
    HTML'
  weaknesses:
  - 'Suggestion: repeat the category name in the right-hand labels (for example ''Strongly
    Disagree 273 (+123)'') so the Q4 column reads without tracing back to the left
    side.'
  - 'Suggestion: the Agree step (#36846B on light) sits close in hue to Strongly Agree
    (#009E73); a little more lightness spread between the two green steps would separate
    those blocks faster.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the full 3200x1800 canvas.
      Chrome: bold dark title 'alluvial-opinion-flow · python · altair · anyplot.ai' with a muted subtitle centred at the top; bold quarter headers Q1-Q4 2025 above faint rounded grey column bands; left labels 'Strongly Agree (180)' … 'Strongly Disagree (150)' and right labels '(165) -15' … '(273) +123' in soft ink; italic muted note at the bottom ('Strongly Agree + Strongly Disagree: 33% of respondents in Q1 2025, 44% in Q4 2025'). All readable.
      Data: five outlined rounded blocks per wave, top to bottom Strongly Agree #009E73, Agree a darker blue-green step, Neutral grey #6B6A63, Disagree a brown-red step, Strongly Disagree #AE3030: ordered steps of one ramp. Flows colored by source; stable flows denser than changers. Counts in white inside every block.
      Legibility verdict: PASS

