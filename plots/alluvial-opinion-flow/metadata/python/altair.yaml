review:
  strengths:
  - Count text color chosen per block from its luminance — dark ink on the lime and
    dark-theme neutral blocks, white on green, ochre-dark and red — so every node
    count reads on its fill in both themes
  - Stable flows (0.6) set apart from changers (0.3) by opacity, with the stable bands
    running level because the category order is the same in every wave
  - Right-hand labels show each category's Q4 total and net change since Q1, and a
    computed note quantifies polarization (extremes 33% to 44%)
  - Library-native fit sizing (autosize fit, padding 10) fills the 3200x1800 canvas
    with balanced margins
  - 'Idiomatic Altair layering: transform_filter splits stable vs changer flows, filled
    mark_line polygons with detail/order, selection_point hover with alt.condition
    opacity and per-flow tooltips in the HTML'
  weaknesses:
  - 'VQ-07 (both): the five Likert levels are colored with categorical hues — Agree
    lime #99B314, Disagree ochre #BD8233 — and Neutral uses INK_MUTED (#A8A79F on
    dark) instead of ordered steps of the imprint_div marks ramp → steps of one ramp
    from #009E73 (Strongly Agree) through the grey midpoint #6B6A63 light / #686762
    dark to #AE3030 (Strongly Disagree), with the theme''s stops. Likely cause: the
    SEMANTIC dict picking IMPRINT_PALETTE[7] and [3] and INK_MUTED.'
  - 'Suggestion: compute the category order and colors from the data''s ordered levels
    instead of the sample labels hoisted into # Constants (the static checker''s advisory
    on line 25), so renamed Likert levels keep their ramp.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the full 3200x1800 canvas.
      Chrome: bold dark title 'alluvial-opinion-flow · python · altair · anyplot.ai' and muted subtitle centred at top; bold quarter headers Q1-Q4 2025 above faint rounded grey column bands; left labels 'Strongly Agree (180)' … 'Strongly Disagree (150)' and right labels '(165) -15' … '(273) +123' in INK_SOFT; italic muted trend note at the bottom ('Strongly Agree + Strongly Disagree: 33% … Q1 2025, 44% in Q4 2025'). All readable.
      Data: five outlined, rounded blocks per wave, top to bottom Strongly Agree #009E73, Agree lime #99B314, Neutral grey #6B6A63, Disagree ochre #BD8233, Strongly Disagree red #AE3030; flows colored by source, stable flows denser than changer flows; counts inside every block, white on green/grey/red, dark on lime/ochre.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, headers and side labels in light ink; subtitle and trend note in light muted grey; column bands a faint lighter grey. No dark-on-dark text.
      Data: green, lime, ochre and red identical to the light render; Neutral flips to the light grey #A8A79F with dark count text; other counts as in light. Flows remain distinguishable, the stable bands brighter than changers.
      Legibility verdict: PASS
