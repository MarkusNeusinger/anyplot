review:
  strengths:
  - Hand-builds the alluvial/Sankey diagram from Makie primitives (band!, poly!, text!)
    with smoothstep-eased flow curves — idiomatic use of the low-level API since Makie
    has no native alluvial recipe.
  - Alpha-based distinction (0.8 stable vs 0.3 changers) directly implements the spec's
    'distinguish stable respondents from changers using opacity' requirement.
  - Consistent Imprint categorical color mapping per opinion category across all 4
    waves, canonical order with brand green first.
  - Both themes render correctly — background, ink, and grid tokens flip; data colors
    are pixel-identical between light and dark renders.
  - Exact canonical canvas size (3200x1800 verified), no clipped elements at any edge,
    clean margins.
  - Realistic, neutral survey data (1000 respondents, diagonal-heavy transition matrix)
    closely matching the spec's example scenario.
  weaknesses:
  - Spec note 'highlight net flows between categories to reveal polarization trends'
    is only partially addressed — the stable/changer opacity split (0.8 vs 0.3) shows
    individual-flow stability but doesn't aggregate or visually flag which category
    pairs have the largest net drift (e.g. a distinct stroke, arrow, or delta annotation
    on the dominant net-flow bands).
  - Node respondent-count labels (fontsize=12, INK_SOFT color) are a bit small and
    soft relative to the 3200x1800 canvas for data that carries real information —
    bump to ~14-16pt or use the stronger INK token for better contrast.
  - Category name labels at fontsize=13 are noticeably smaller than the column headers
    (fontsize=16) despite both being primary identifying labels — consider bringing
    them closer in size for visual balance.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1), correct light-theme surface.
      Chrome: Title "Political Opinion Survey · alluvial-opinion-flow · julia · makie · anyplot.ai" in dark ink, clearly legible, comfortably within canvas bounds (no overflow/clipping). Four bold column headers (Q1 2025 - Q4 2025) in dark ink, clearly readable. Category labels ("Strongly Agree" ... "Strongly Disagree") on both far-left and far-right in dark ink, legible. Small respondent-count labels above each node in a soft gray — readable but low-contrast relative to other chrome.
      Data: Five Imprint-palette colored node/flow columns (green, lavender, blue, ochre, red) in canonical order, first series is #009E73 (Strongly Agree). Flow ribbons use two opacity levels — solid/opaque for respondents staying in the same category, translucent for those changing — clearly distinguishing stability from change. No overlapping text, no elements clipped at any canvas edge.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17), correct dark-theme surface.
      Chrome: Title, column headers, and category labels rendered in light ink (#F0EFE8), clearly legible against the dark background — no dark-on-dark issues. Respondent-count labels in soft light gray (INK_SOFT), readable, same low-contrast characteristic as the light render but not a failure.
      Data: Same five Imprint-palette colors as the light render — confirmed pixel-identical hues for nodes and flows; only the background/text chrome changed between themes, per the Imprint spec. Stable-vs-changer opacity distinction still clearly visible on the dark surface.
      Legibility verdict: PASS
