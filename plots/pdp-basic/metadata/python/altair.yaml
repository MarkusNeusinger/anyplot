review:
  strengths:
  - 'Clear layer hierarchy: lighter 95 % bootstrap band behind a prominent PD line,
    rug ticks along the x axis'
  - Theme tokens threaded through view, axis and title config; both renders read cleanly
  - One tidy DataFrame with transform_filter per layer and escaped column constants,
    as the library prompt describes
  - PD line tooltips in the HTML output for exact values
  weaknesses:
  - 'DE-02 (both): the view keeps a four-sided frame and draws vertical grid lines
    on a line chart, against the style guide''s L-shaped spines and y-only grid for
    line charts → drop the top/right frame and the x grid. Likely cause: configure_view(stroke=INK_SOFT)
    and configure_axis grid applied to both axes.'
  - 'DQ-02 (both): the predicted quantity is only labelled ''Partial dependence (predicted
    outcome)'' of a synthetic make_regression target, so the scenario reads generic
    → name the modelled outcome (e.g. ''Partial dependence (predicted energy demand,
    kWh)''). Likely cause: the y column constant and the untitled make_regression
    target.'
  - 'CQ-04 (code): ELEVATED_BG is defined and RUG is escaped but neither is used in
    the chart → delete both. Likely cause: leftovers from the template''s legend config
    and the rug filter that uses IS_RUG directly.'
  - 'Suggestion: limit the x domain to the rug''s extent with a little padding so
    less of the plot width sits empty left of the curve''s 5th-percentile start.'
