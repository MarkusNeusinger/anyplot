review:
  strengths:
  - Correct 3200x1800 canvas with style-guide text sizes; every element readable on
    both surfaces
  - 'The PDP line is the strongest mark: a 1.0 green line over a 0.15-alpha ribbon
    from the ICE spread, rug clear of the curve below the band'
  - Axis titles come straight from descriptive column names, as plotnine's aes() column
    mapping allows
  - 'Fully deterministic: random_state on data and GradientBoostingRegressor, one
    partial_dependence call feeding both line and band'
  weaknesses:
  - 'DE-02 (both): all four spines are drawn as a full panel box where the plot type
    needs none → keep only the left and bottom spines (L-shaped frame) or none. Likely
    cause: panel_border=element_rect(color=INK_SOFT, ...) on top of axis_line.'
  - 'DQ-02 (both): the model''s predicted quantity is never named, so ''Partial Dependence
    (avg. prediction)'' of a make_regression target over ''Room Size'' reads as generic
    → name the predicted quantity with its unit in the column name (for example a
    predicted energy use in kWh). Likely cause: the PD column name and make_regression
    data with no target label.'
  - 'CQ-04 (code): the rug is hand-built from geom_segment with a computed rug_height
    / rug_floor frame (lines 63–65, 75–81) although plotnine computes it with geom_rug
    → geom_rug(data=..., mapping=aes(x=OBSERVED), sides=''b''). Likely cause: the
    segment-based rug block.'
  - 'Suggestion: a rug over all 500 training rows instead of the first 80 would show
    the full data distribution.'
  image_description: |-
