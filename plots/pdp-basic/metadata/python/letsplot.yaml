review:
  strengths:
  - The partial dependence line is computed from the ICE curves at all 80 grid values
    and drawn unsmoothed, showing the gradient-boosting steps honestly
  - 'The 10-90th percentile ICE band in Imprint #C475FD at alpha 0.3 stays lighter
    than and behind the #009E73 line in both themes'
  - The rug sits as short ticks along the bottom at the observed feature values, clear
    of the band and the curve
  - 'Theme tokens thread through every chrome element; both renders read cleanly on
    #FAF8F1 and #1A1A17'
  - Tidy data block with column constants, so the plot reads only df; lets-plot HTML
    export adds hover inspection
  weaknesses:
  - 'VQ-03 (both): the band''s legend swatch is an opaque #C475FD square with an ink
    outline, while the band is #C475FD at alpha 0.3 without outline, so the swatch
    does not match its mark → swatch at the band''s alpha 0.3 without outline. Likely
    cause: geom_ribbon legend key; set guides(fill=guide_legend(override_aes={''alpha'':
    0.3})) and drop the key outline.'
  - 'DE-02 (both): all four panel spines are drawn (a grey frame on top and right
    too), where the style guide keeps only left and bottom → remove the top and right
    spines (or all). Likely cause: the default panel_border is not set to element_blank().'
  - 'DQ-02 (both): the y quantity is an unnamed ''predicted outcome'' in raw make_regression
    units (about -170 to 165) → name the predicted quantity (for example ''Predicted
    energy demand (kWh)'') with values in its range. Likely cause: the ICE column
    label and make_regression''s raw target.'
  - 'Suggestion: the legend keys behind the line glyphs sit on a slightly different
    fill than the legend box (visible in the light render); setting legend_key to
    the legend fill would unify the box.'
