review:
  strengths:
  - Uses one sklearn partial_dependence(kind='both') call and draws the 10th–90th
    percentile ICE spread as a light band behind a 2.5 pt average line, so the partial
    dependence stays the strongest mark in both themes
  - Energy demand against temperature gives a clear U-shape with a flat comfort plateau
    and tree-model steps, on axes that carry units
  - 'Follows the adaptable-code layout: column constants with roles, one # Data block
    ending in df, and sns.rugplot(data=df, x=TEMPERATURE) reading the table directly'
  - 'Theme tokens threaded through sns.set_theme rc, so chrome flips cleanly while
    the #009E73 data colors stay identical'
  weaknesses:
  - 'Suggestion: partial_dependence(..., percentiles=(0, 1)) would let the curve span
    the full −8 to 38 °C range the rug covers.'
