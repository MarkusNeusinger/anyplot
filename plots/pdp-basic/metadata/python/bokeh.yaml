review:
  strengths:
  - Computes the PDP and ICE curves with sklearn's partial_dependence(kind='both')
    on a fitted GradientBoostingRegressor, so the line and band are real model output
    on a 100-point grid
  - 'The 10th–90th percentile ICE band is drawn with varea at alpha 0.25 behind an
    8 px #009E73 line, so the average stays the strongest mark in both themes'
  - Zero-centered curve with a dashed zero line and a y-axis title that says 'centered,
    predicted units'
  - Rug of all 500 training values as vertical ticks below the band, clear of the
    curve
  - Correct 3200×1800 canvas with theme tokens threaded through title, axes, grid
    and legend; readable in both renders
  weaknesses:
  - 'VQ-02 (both): the 90 % opaque legend box in the top-left corner covers the upper
    edge of the 80 % band between x ≈ 0.28 and 0.48, where the band reaches 5 to 6.3
    → place the legend where it covers no data, for example the empty lower-right
    region below the band and above the rug, or outside the plot area. Likely cause:
    p.legend.location = "top_left".'
  - 'VQ-03 (both): the rug''s legend sample is a short, faint horizontal dash about
    10 px wide, while the rug marks are 40 px vertical ticks → a sample with the ticks''
    orientation, size and alpha. Likely cause: marker="dash" with angle=π/2 and size=40
    is drawn unrotated and shrunk into the 50×40 px legend glyph box.'
  - 'DQ-02 (both): the feature is labelled ''Feature X₀ value'' and the prediction
    has no named quantity, the abstract column names of Friedman #1 → name the feature
    and the predicted outcome after a real domain quantity (with units). Likely cause:
    the FEATURE / TARGET constants and the make_friedman1 data block.'
  - 'Suggestion: a HoverTool on the partial dependence line showing the feature value,
    the average and the band bounds would add value in the HTML view.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 on a 3200x1800 canvas, thin INK_SOFT plot outline.
      Chrome: bold dark title 'pdp-basic · python · bokeh · anyplot.ai' top-left (~44 % of width); italic axis titles 'Feature X₀ value' and 'Partial dependence (centered, predicted units)'; grey tick labels 0–1 and −10–5; faint dashed grid; framed legend top-left with three entries. All text readable.
      Data: light-green (#009E73, alpha 0.25) 10th–90th percentile ICE band widening to the right, a thick #009E73 stepped PD line rising from about −4.4 to +1.7, a dashed grey zero line, and a lavender (#C475FD) rug of vertical ticks along the bottom below −10. The legend box overlaps the band's top edge around x 0.28–0.48; the rug's legend sample is a tiny faint dash.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title and axis titles in light ink #F0EFE8, ticks in #B8B7B0, legend on #242420 with light text; no dark-on-dark text.
      Data: same #009E73 line and band (band reads as dark green at alpha 0.25), same #C475FD rug and dashed zero line — data colors identical to the light render; only chrome flips.
      Legibility verdict: PASS
