review:
  strengths:
  - Uses sklearn's partial_dependence(kind='both') so the PD line and ICE curves come
    straight from the fitted model
  - Rug shows the full distribution of the observed feature values
  - 'Theme tokens threaded through all chrome: both renders readable, data colors
    identical'
  - PD line is clearly the strongest mark, band and ICE lines lighter and behind it
  weaknesses:
  - 'VQ-05 (both): canvas is 4766x2670 instead of 3200x1800 (+1566 × +870 px), and
    the PD curve fills only the middle half of the x axis between wide empty sides
    → figsize=(8, 4.5), dpi=400 and no bbox_inches=''tight''. Likely cause: figsize=(16,
    9), savefig(dpi=300, bbox_inches=''tight'').'
  - 'SC-04 (both): title ''pdp-basic · matplotlib · anyplot.ai'' lacks the language
    segment → ''pdp-basic · python · matplotlib · anyplot.ai''. Likely cause: the
    title string.'
  - 'VQ-07 (both): the rug is drawn in #AE3030, the semantic red anchor, which has
    no bad/loss/error role here → a non-semantic Imprint position or INK_SOFT. Likely
    cause: ACCENT = ''#AE3030''.'
  - 'VQ-03 (both): ICE lines at alpha 0.08 almost vanish inside the 0.2-alpha band,
    worst on dark, and the rug legend glyph is barely visible on dark → ICE alpha
    about 0.15–0.2 and a more opaque rug legend handle. Likely cause: alpha=0.08 in
    the ICE loop.'
  - 'VQ-02 (both): the legend box sits over the upper ICE outlier line (y ≈ 280–300,
    x -1.57 to -0.8) and hides that part of it → a legend position clear of data.
    Likely cause: loc=''upper left''.'
  - 'DQ-02 (both): make_regression with the axis label ''Feature Value'' and no domain
    reads as an abstract example → a named feature and target from a plausible model.
    Likely cause: synthetic data with generic labels.'
