review:
  strengths:
  - Partial dependence and ICE spread both come from sklearn.inspection.partial_dependence
    on a fitted GradientBoostingRegressor, so the stepped tree-model curve is the
    real model output on a 100-point grid
  - Text sized at the pygal 3200x1800 references (title 66, ticks 44) and readable
    in both themes; theme tokens threaded through one Style object
  - 'Clear weight hierarchy: 8 px solid green PD line over 3 px dashed interval bounds'
  - Per-series show_dots/stroke_style overrides keep the rug as dots-only and the
    lines dot-free in one pygal.XY chart; interactive HTML tooltips in the detail
    view
  weaknesses:
  - 'SC-02 (both): the 95% interval is drawn as two separate dashed lines in two hues
    (purple upper, blue lower) with two legend entries, so it reads as two series
    rather than one uncertainty band lighter than the PD line → draw both bounds in
    one lighter colour as one interval element (or a filled band) with a single legend
    entry. Likely cause: separate chart.add calls for CI upper and CI lower taking
    palette positions 2 and 3.'
  - 'SC-02 (both): the rug is drawn as round dots at a fixed y below the curves, not
    as short ticks along the x axis → short vertical tick marks at the observed values.
    Likely cause: the rug series uses dots (dots_size=7) instead of a tick-shaped
    marker.'
  - 'DQ-02 (both): the scenario is an abstract make_regression model with the x axis
    ''Feature value (standardized)'' and an unitless ''Partial dependence'', which
    reads as generic → a named model and feature with real units (e.g. predicted house
    price vs. living area in m²). Likely cause: make_regression data and generic column
    labels.'
  - 'Suggestion: a lighter, finer grid on the x axis would let the stepped curve stand
    out more.'
