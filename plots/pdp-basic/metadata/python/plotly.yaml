review:
  strengths:
  - The ±1 std band of the ICE curves is centered on the partial dependence line,
    drawn behind it at 15% alpha, so the brand-green average stays the strongest mark
    in both themes
  - The rug sits below the band along the x axis as native line-ns markers, clear
    of the curve, showing where the training BMI values thin out past 0.09
  - Real sklearn diabetes data with a GradientBoostingRegressor and sklearn.inspection.partial_dependence
    computes the curve and the ICE spread; the y axis reads 'Partial dependence (centered)'
  - 'Theme tokens threaded through title, axes, ticks, grid and legend box; both renders
    readable on the correct #FAF8F1 / #1A1A17 surfaces'
  - Plotly-native HTML export with hover on the line while the band and rug skip hover
  weaknesses:
  - 'SC-01 (both): plotly''s default x-axis zeroline draws a heavy vertical rule at
    BMI = 0 through the band and the curve, a reference line the basic variant excludes
    (only the horizontal zero line of the centered plot is allowed) → no vertical
    line at x = 0. Likely cause: xaxis zeroline left at its default; set zeroline=False
    on xaxis.'
  - 'VQ-03 (dark): the rug ticks and the ''Data Distribution'' legend glyph, INK_SOFT
    at opacity 0.5 and line width 1, almost vanish on #1A1A17 → opacity about 0.8
    or line width 1.5–2 (+0.3 opacity). Likely cause: rug marker opacity=0.5, line=dict(width=1).'
  - 'Suggestion: the dashed add_hline at y = 0 is hidden under the solid y-axis zeroline;
    keep only one of the two.'
  - 'Suggestion: name the predicted quantity on the y axis, e.g. ''Partial dependence
    of disease progression (centered)''.'
  image_description: |-
