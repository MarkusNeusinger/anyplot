review:
  strengths:
  - Explicitly centers the partial dependence curve at zero (partial_dependence -
    mean(raw_effect)) with a dashed reference line at $0k, directly following the
    spec's centering recommendation and making the relative effect immediately readable.
  - 'Confidence band (geom_ribbon) is data-density-aware: it narrows where training
    data is dense (~2,100 sq ft) and widens at the sparse tails, correctly reflecting
    how PDP uncertainty behaves in practice.'
  - Rug plot along the x-axis (geom_rug, sides='b') shows the training-data distribution
    as recommended in the spec notes, rendered subtly (alpha=0.5, thin linewidth)
    so it doesn't compete with the main curve.
  - 'Theme-adaptive chrome is correctly implemented: identical brand-green (#009E73)
    curve/ribbon in both renders, correct #FAF8F1/#1A1A17 backgrounds, and all text
    high-contrast and legible in both themes, including at the 400px mobile thumbnail.'
  - Canvas is exactly 3200x1800 (landscape), title follows the mandated 'pdp-basic
    · r · ggplot2 · anyplot.ai' format, and axis labels include units ('Living Area
    (sq ft)', 'Partial Dependence on Sale Price').
  weaknesses:
  - Design is competent but fairly conservative for the full DE-01 score — a single
    curve + ribbon + rug + zero-line is solid but doesn't push further (e.g. an ICE-line
    overlay or an annotated callout at the zero-crossing point) that would elevate
    it from 'well-executed' to 'distinctive'.
  - LM-02 usage is idiomatic ggplot2 layering but not maximally distinctive to the
    library — could showcase ggplot2-specific strengths further (e.g. annotate() marking
    the break-even living area, or a secondary stat layer).
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white, not dark.
      Chrome: Title "pdp-basic · r · ggplot2 · anyplot.ai" in dark ink top-left; axis titles "Living Area (sq ft)" (x) and "Partial Dependence on Sale Price" (y, rotated) in dark ink; tick labels ("1,000".."4,000", "-$100k", "$0k") in soft grey-ink. All clearly legible against the light background. Only a faint horizontal major-y gridline and a light solid reference line at -$100k plus a dashed reference line at $0k are visible; no vertical gridlines; axis line is a thin soft-ink line on the left/bottom.
      Data: Brand-green (#009E73) line rising from about -$140k at 500 sq ft to about +$50k at 4,000 sq ft, crossing zero near ~1,850 sq ft. A translucent light-green confidence ribbon (same hue, alpha≈0.15) surrounds the line, narrow near ~2,100 sq ft (where the rug shows the densest cluster of ticks) and wide at both tails. A dense rug of vertical dark tick marks sits along the bottom of the plot area showing the distribution of training living-area values, concentrated between ~1,300 and ~2,800 sq ft.
      Legibility verdict: PASS — every text element (title, both axis titles, all tick labels) is dark-on-light and unambiguous; confirmed also readable at the 400px mobile thumbnail.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black, not light.
      Chrome: Same title and axis titles now rendered in light ink (near-white/cream), tick labels in a lighter soft grey-ink tone. Gridlines/reference lines use the same faint grey tones adapted for dark chrome (dashed $0k line and solid -$100k line both clearly visible, not too bright/dominant).
      Data: The curve and ribbon use the identical brand-green (#009E73) as the light render — hue and alpha unchanged, confirming only chrome (not data color) flips between themes. The rug marks are rendered in a lighter grey-ink appropriate for dark surfaces.
      Legibility verdict: PASS — no dark-on-dark issues found; title, axis titles, and all tick labels are clearly legible light-ink-on-dark-background, and the green data curve/ribbon stand out well against the near-black surface. Also confirmed legible at the 400px mobile thumbnail.
