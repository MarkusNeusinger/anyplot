review:
  strengths:
  - 'Correct, idiomatic Chart.js multi-dataset technique for the confidence band (fill:
    "-1" between adjacent datasets) with brand-green alpha fill, and cleanly hides
    the internal "Upper bound" helper dataset from the legend via a filter function'
  - 'Full feature coverage of the spec''s optional elements: continuous PD curve,
    a 95% confidence band that widens away from the bulk of the training data, and
    a rug plot (via a hidden secondary linear axis + rotated scatter point-line trick)
    showing the training-data distribution'
  - Deterministic, reproducible data generation (fixed-seed LCG for the rug sample,
    log-shaped diminishing-returns curve explicitly centered at the median per the
    spec's centering recommendation)
  - 'Theme-adaptive chrome and explicit font sizing throughout; Imprint palette correctly
    applied (first series #009E73), data colors identical across light/dark themes,
    both renders fully legible with no dark-on-dark or light-on-light failures'
  - 'Correct mandated title format with descriptive prefix, units on both axis labels,
    clean KISS code structure, and animation: false set correctly for the harness'
  weaknesses:
  - Design Excellence is competent but not exceptional -- the plot reads as a well-executed
    but fairly standard PDP chart; to push toward publication quality, add a stronger
    visual focal point (e.g. a subtle marker/annotation at the zero-crossing or a
    reference callout) and a bolder title weight to sharpen the typography hierarchy
  - Title occupies only roughly 40-45% of the plot width, smaller than the ~70-85%
    range typical for this mandated title length -- nudging the title fontsize up
    slightly (e.g. 19 to 21) would still avoid overflow while giving the title more
    visual prominence as 'the first thing readers see'
  - Visual refinement sits at a good-but-default level -- consider enabling grid on
    the Y-axis only (style-guide default for line charts) instead of the current X-axis-only
    grid, and add a touch more breathing room around the legend row
  - Data storytelling could be strengthened -- a small annotation labeling the median
    reference point (x=1500 sq ft, where partial dependence = 0) would make the 'centered
    at zero' design choice legible to the viewer instead of only inferable from context
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 -- not pure white.
      Chrome: Title "House Price vs. Square Footage · pdp-basic · javascript · chartjs · anyplot.ai" in dark ink at top, clearly readable. Legend row below title with two swatches, "95% confidence band" (pale green) and "Partial dependence" (solid brand green), both readable. X-axis title "Living Area (sq ft)" and Y-axis title "Partial Dependence ($k, centered)" in dark ink, both legible with units. Tick labels in a softer dark gray, legible. Subtle light vertical gridlines at each X tick.
      Data: A solid #009E73 brand-green line rises in a log-shaped diminishing-returns curve from about -70 at 500 sq ft, crosses zero near 1500 sq ft (the median), and flattens out toward +60 near 4000 sq ft. A pale green confidence band surrounds the line, narrow near the median and widening toward both tails. A dense row of thin vertical rug ticks sits along the bottom of the plot area, clustered most densely between ~1000-2500 sq ft with a sparser long tail to the right, showing the training-data distribution.
      Legibility verdict: PASS -- all text is clearly readable against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 -- not pure black.
      Chrome: Same title, legend, and axis titles now rendered in light ink/off-white, clearly readable against the dark background. Tick labels in a softer light gray, legible. Subtle light-toned vertical gridlines at each X tick, faint but visible.
      Data: The partial-dependence line is the identical #009E73 brand green as the light render -- confirmed unchanged. The confidence band renders as a darker desaturated green fill (same brand-green alpha-blended over the dark background, so it reads correctly darker without being a different hue). Rug ticks are light gray/white, same distribution and density as the light render.
      Legibility verdict: PASS -- all text is clearly readable against the dark background; no dark-on-dark failures observed for title, axis labels, ticks, or legend text.
