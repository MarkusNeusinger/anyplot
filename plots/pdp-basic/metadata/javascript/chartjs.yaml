    same weight
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (~#FAF8F1), not pure white.
      Chrome: Title "House Price vs. Square Footage · pdp-basic · javascript · chartjs · anyplot.ai" in bold dark ink (measured x-extent 823-2336px of 3200px, ~47% width), clearly readable. Axis titles "Living Area (sq ft)" and "Partial Dependence ($k, centered)" in dark ink with units; tick labels in softer dark gray. Legend below title shows "95% confidence band" (pale-green swatch) and "Partial dependence" (brand-green swatch) — helper datasets ("Upper bound", "Training data (rug)") correctly filtered out of the legend. Y-axis grid only (horizontal lines), subtle. A dashed vertical reference line at x=1500 sq ft with a brand-green dot and bold label "Median: 1,500 sq ft → $0" marks the zero-crossing.
      Data: Solid #009E73 line traces a log-shaped diminishing-returns curve from about -70 at 500 sq ft, crossing zero near the 1500 sq ft median, flattening toward +60 near 4000 sq ft, surrounded by a pale-green alpha-blended confidence band widening toward both tails. A dense row of thin vertical rug ticks along the bottom shows the training-data distribution, clustered between ~1000-2500 sq ft.
      Legibility verdict: PASS — all text readable against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black (~#1A1A17), not pure black.
      Chrome: Same title, legend, axis titles, and the zero-crossing callout now rendered in light ink/off-white, clearly readable; tick labels in a softer light gray. Y-axis grid only, subtle white-on-dark lines.
      Data: The partial-dependence line and callout dot use the identical #009E73 brand green — confirmed unchanged from the light render. The confidence band is the same brand-green alpha-blended fill, appearing darker/desaturated against the dark background (same hue, not a different color). Rug ticks are light gray/white with the same distribution and density.
      Legibility verdict: PASS — all text readable against the dark background, no dark-on-dark failures on title, axis labels, ticks, legend, or the callout label.

    Both renders confirmed: data colors identical, only chrome (background/text/grid) flips between themes. Canvas verified at exact 3200x1800 landscape target for both PNGs.
