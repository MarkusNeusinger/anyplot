review:
  strengths:
  - 'Implements every optional spec feature at once: confidence-interval band, a training-data
    rug plot, and centering the curve at zero — not just the minimal x/y line'
  - Confidence band uses the 'muted' semantic anchor (INK_MUTED-equivalent) exactly
    as the style guide's own example prescribes for confidence-band fill, rather than
    a random gray
  - Clever use of ECharts' stacked-area trick (invisible base + visible band series)
    to fake a native confidence band, which ECharts has no first-class primitive for
  - Rug plot implemented via a second stacked grid + secondary x/y axis pair sharing
    the same value-axis range as the main plot, a genuinely idiomatic multi-grid ECharts
    pattern
  - Title fontsize correctly auto-scales via the documented linear formula for titles
    over 67 chars, and both palette + theme tokens are threaded through every chrome
    element in both renders
  - Deterministic, seeded LCG/Box-Muller data generation with no external dependencies,
    fully reproducible
  weaknesses:
  - Y-axis bounds are computed from raw data extrema (Math.floor/ceil to 1 decimal)
    rather than snapped to the same round step as the interior gridlines, so the axis
    shows non-round boundary ticks '+2.3' and '-2.8' alongside the round '-2.0/-1.0/0.0/1.0/2.0'
    gridlines — looks slightly unpolished. Round the axis min/max to the nearest 0.5
    or add a fixed margin and let echarts pick 'nice' ticks instead of hand-rounding
    the data bounds.
  - The 'Confidence interval' legend entry renders as a plain filled dot (no line,
    no swatch) because lineStyle.opacity=0 and symbol='none' leave only the default
    circle icon, which doesn't visually communicate 'this is a shaded band' the way
    the actual area does — consider setting legend.data icon override to 'roundRect'
    for that entry, or a legend.selected icon that matches the area fill.
  - The dual-grid rug plot's own x-axis (grid 1) duplicates the main plot's implicit
    x-range but its rect markers rely on symbolSize [2,24] with no jitter; at the
    densest cluster (~700-850mm) many rug ticks visually merge into solid blocks in
    both themes, losing individual-sample information there.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1, not pure white.
      Chrome: Title "Crop Yield vs. Rainfall · pdp-basic · javascript · echarts · anyplot.ai" in dark ink, centered, clearly readable and not overflowing. Legend below title ("Partial dependence", "Confidence interval", "Training data (rug)") in dark ink, readable. X-axis title "Rainfall (mm)" and Y-axis title "Δ Predicted Yield (t/ha)" both dark and legible. Tick labels in a softer dark gray, legible against the light background. Horizontal gridlines are faint gray, subtle but visible. A dashed horizontal reference line at y=0 is present.
      Data: First (and only) data series is the brand green (#009E73) partial-dependence curve, sigmoid-shaped, crossing zero near x=650mm and flattening near +0.85 for high rainfall. A light-gray confidence band surrounds the curve, wider at both tails. A row of thin gray rug ticks along the bottom shows the training-data distribution of rainfall, denser between ~650-900mm.
      Legibility verdict: PASS — all text is clearly readable against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17, not pure black.
      Chrome: Same title, legend, and axis titles now rendered in light/off-white text, clearly visible against the dark background. Tick labels in a lighter secondary gray, legible. Gridlines are faint light-gray, subtle but visible. The y=0 dashed reference line is visible in a light dashed style.
      Data: The partial-dependence curve is the identical brand green (#009E73) as the light render — confirmed unchanged. The confidence band is now a darker gray fill appropriate for the dark surface (same 'muted' semantic anchor, theme-adapted), still clearly distinguishable from the pure-black background. Rug ticks remain visible as light-gray marks against black.
      Legibility verdict: PASS — no dark-on-dark failures; all title/axis/tick text is clearly visible against the near-black background, and the data curve color matches the light render exactly.
