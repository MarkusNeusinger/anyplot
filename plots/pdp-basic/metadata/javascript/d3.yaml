review:
  strengths:
  - Partial dependence correctly centered at zero with a dashed reference line marking
    "no effect vs. average", exactly as the spec suggests
  - Confidence band uses a direct end-of-line label instead of a legend, correctly
    following the style guide's single-series rule
  - Rug plot along the x-axis shows the training data distribution, satisfying the
    spec's optional feature
  - 'Idiomatic, mature D3: d3.area + d3.line with curveMonotoneX, .join() pattern
    for rug ticks, deterministic mulberry32 PRNG'
  - Theme-adaptive chrome is correct in both renders — no dark-on-dark issues, Imprint
    brand green identical across themes
  - 'Title formatted exactly as required: "pdp-basic · javascript · d3 · anyplot.ai"'
  weaknesses:
  - Rug ticks in the dense middle region (~2000-2600 sq ft) visually merge into a
    solid blob, losing per-point distinction — lower opacity further or thin the density
    there
  - No ICE (individual conditional expectation) lines; the spec allows CI band OR
    ICE lines and the band alone is sufficient, but a few faint ICE lines would deepen
    feature coverage
  - The "90% prediction interval" label implies a computed quantile, but the band
    width is a heuristic distance-based scaling rather than an actual 90% interval
    — consider a more generic label like "prediction interval" unless backed by a
    real quantile calculation
