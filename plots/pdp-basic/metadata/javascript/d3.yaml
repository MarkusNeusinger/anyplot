review:
  strengths:
  - 'Fully satisfies every optional Note in the spec: confidence band AND ICE lines
    for uncertainty, a rug plot for the training distribution, and the curve centered
    at zero'
  - Zero-reference dashed line makes the centered partial dependence immediately interpretable
    as 'effect vs. average'
  - Rug plot is thinned per-bin with d3.bin() so dense clusters read as texture instead
    of a solid smear -- a genuinely D3-idiomatic touch
  - Direct label ('prediction interval') replaces a redundant single-series legend,
    keeping the composition minimal
  - Theme-adaptive chrome correctly implemented in both renders; the brand green data
    color is pixel-identical between light and dark
  - Deterministic mulberry32 PRNG with fixed seed and clear comments explaining the
    saturating log-response, CI widening, and ICE offset/scale logic
  weaknesses:
  - ICE spaghetti lines are very faint (stroke-opacity 0.15) -- a slightly higher
    opacity (~0.2-0.25) would give them a touch more presence without competing with
    the main curve
  - Data storytelling relies entirely on layout/hierarchy; a small annotation calling
    out the diminishing-returns flattening past ~3000 sq ft would push it from 'good'
    to 'excellent'
  - The 'prediction interval' label sits close to the confidence band's upper edge
    at the rightmost point -- a few more px of clearance would reduce the risk of
    it feeling cramped against the curve
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 -- not pure white.
      Chrome: Bold dark title "pdp-basic · javascript · d3 · anyplot.ai" centered at top; dark rotated y-axis title "Partial Dependence (Δ Predicted Price, $k)"; dark x-axis title "Living Area (sq ft)"; grey tick labels on both axes (signed values on y: -200 to +150, comma-formatted values on x: 1,000 to 4,000). A dashed grey zero-reference line crosses the plot horizontally. All chrome text is clearly legible against the light background.
      Data: A single brand-green (#009E73) curve runs from about -170 (at 800 sq ft) up to about +100 (at 4000 sq ft), with a semi-transparent green confidence band around it and ~8 faint green ICE lines fanning around the main curve, especially visible near the tails. A small grey rug plot beneath the x-axis shows the density of the training feature values, thinned in the densest region (~1800-2500 sq ft). A small "prediction interval" text label sits near the top-right of the band.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 -- not pure black.
      Chrome: Title, both axis titles, and tick labels all render in light/white tones, fully legible against the dark background. The dashed zero-reference line remains visible as a light-grey dash. No dark-on-dark text anywhere.
      Data: Same brand-green (#009E73) curve, band, and ICE lines as the light render -- colors are pixel-identical, only the chrome (background, text, grid) flipped to the dark theme. The rug plot ticks remain visible in a muted grey against the dark background.
      Legibility verdict: PASS
