review:
  strengths:
  - 'Clear hierarchy that the spec asks for: the 3.5 px brand-green partial dependence
    line sits on top of eight 1.25 px ICE curves at 30 % opacity and a neutral 20
    %-opacity 95 % CI band, so the average stays the strongest mark in both themes'
  - Confidence band built idiomatically from two stacked MUI X area series (an invisible
    lower bound plus the band width), styled per series through sx data-series selectors
  - Zero-centring is applied and stated on the y-axis label ('…, centred') and in
    the subtitle (centre value 349 units sold/week); the dashed zero line from ChartsReferenceLine
    is the one reference line the spec allows on a centred plot
  - Custom legend glyphs reuse the PD_STROKE / ICE_STROKE / opacity constants, so
    each key entry matches its mark exactly
  - Deterministic data from a fixed-seed LCG; the CI is a proper t-interval over the
    ICE curves, and linear curves keep the PD at the grid values with no spline overshoot
  - Tooltips in the HTML view format the band as ± half-width in units sold/week
  weaknesses:
  - 'Suggestion: in the dark render the 30 %-opacity ICE curves and their legend sample
    are quite faint against #1A1A17; a slightly higher ICE opacity in dark mode would
    make the individual curves easier to follow.'
  - 'Suggestion: a short rug of tick marks along the x axis at the observed store
    spend values (which the Notes allow) would show where the model has training data.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole canvas.
      Chrome: the bold title "pdp-basic · javascript · muix · anyplot.ai" is centred on top, with a soft-ink subtitle "61-point feature grid · curves centred on the mean partial dependence of 349 units sold/week" below it and a horizontal HTML legend (PD line, ICE line, CI swatch) under that. The y axis is "Partial dependence (units sold/week), centred" from -400 to 400, and the x axis is "Weekly marketing spend ($1,000s)" from 5 to 65. Subtle horizontal grid lines, a dashed zero line labelled "mean partial dependence" at the right end. All dark text is readable.
      Data: a thick #009E73 sigmoid PD line from about -330 up to about +290, eight thin translucent green ICE curves (one outlier store lags well below), and a grey translucent 95 % CI band behind the PD that widens toward high spend.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: the title, subtitle, legend text, axis titles and ticks all switch to light ink and are clearly readable. There is no dark-on-dark text. The grid and the dashed zero line are subtle but visible.
      Data: identical #009E73 PD line and green ICE curves (fainter against the dark page but visible). The CI band uses the light soft-ink at the same opacity and reads as a lighter grey band. Data colours are the same as in the light render.
      Legibility verdict: PASS
