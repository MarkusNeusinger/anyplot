review:
  strengths:
  - 'Builds the 95% confidence band via a stacked-area workaround (ci-lower + ci-band
    with stack: "ci") since MUI X community has no native area-between-two-lines primitive
    — a genuinely idiomatic solution within the community surface''s constraints.'
  - 'Correct Imprint semantics: brand green (t.palette[0]) for the Partial dependence
    series, and the theme-adaptive `muted` anchor for the confidence-band fill — exactly
    the anchor''s documented role ("confidence-band fill").'
  - The y=0 ChartsReferenceLine labeled "average prediction" directly implements the
    spec's suggestion to center the PDP at zero, giving readers an explicit interpretive
    baseline rather than an arbitrary absolute scale.
  - 'Both renders are clean at native resolution: no edge clipping on title, y-axis
    label, or the rightmost x-tick ("$66k"), correct warm off-white/near-black backgrounds,
    and fully readable text in both themes.'
  - Deterministic, realistic synthetic data — a logistic/saturating marketing-spend
    response with seeded LCG noise plausibly mimics sklearn's PartialDependenceDisplay
    output for a GradientBoostingRegressor.
  weaknesses:
  - No ICE (individual conditional expectation) lines or rug plot along the x-axis
    — both are explicitly optional in the spec ("can show"/"consider"), but either
    would have added the extra layer of uncertainty/data-distribution context the
    spec highlights as valuable.
  - showMark is false on the pdp series (no point markers) — with only 61 grid points
    (sparse-to-medium density) a few subtle markers at intervals could reinforce that
    this is sampled grid data, not a continuous analytic function, without hurting
    the clean line read.
  - Legend swatch order (confidence interval first, then the main Partial dependence
    series) inverts the visual z-order of importance — putting the primary green series
    first would match how a reader scans the chart.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1-range), not pure white — matches the required light-theme surface.
      Chrome: Title "pdp-basic · javascript · muix · anyplot.ai" top-left in dark ink, fully visible, not clipped. Rotated y-axis label "Partial dependence (Δ units sold/week)" on the far left, clear of the tick numbers. X-axis label "Weekly marketing spend ($1,000s)" below tick labels formatted as "$4k"..."$66k", rightmost tick "$66k" fully visible with no edge clipping. Legend centered above the plot area with two swatches: gray "95% confidence interval" and green "Partial dependence". Horizontal gridlines only, subtle. A dashed muted reference line at y=0 labeled "average prediction" on the right.
      Data: First/main series is the Imprint brand green (#009E73) for "Partial dependence"; the confidence band is filled in the theme-adaptive muted gray. All text is legible — dark ink on the light cream background, no light-on-light issues.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17-range), not pure black — matches the required dark-theme surface.
      Chrome: Same title, axis labels, tick labels, and legend as the light render, all rendered in light ink (near-white/light-gray) against the dark background. No dark-on-dark failures observed — title, axis labels, tick labels, legend text, and the "average prediction" annotation are all clearly readable.
      Data: The green Partial dependence line and gray confidence band are visually identical in hue/shape to the light render — confirming only chrome (background, text, grid) flips between themes while data colors stay constant, as required.
      Legibility verdict: PASS
