review:
  strengths:
  - Confidence band uses a genuine area+"erase" compositing technique (upper area
    fill vs. a page-bg-colored lower area) producing a clean translucent ring instead
    of a block filled down to the axis floor.
  - Rug plot lives on a hidden secondary y-axis in its own bottom panel and visually
    correlates with CI width (narrower band where training data is denser, wider band
    at sparse edges) -- genuine data storytelling, not decoration.
  - Deterministic seeded PRNG (mulberry32, seed=42) matches the library guide's browser-reproducibility
    requirement; no fetch/network/imports.
  - 'Both renders are clean: identical brand-green hue for line and band, all title/subtitle/axis/tick
    text legible against both #FAF8F1 and #1A1A17, no dark-on-dark or light-on-light
    failures, no edge clipping.'
  - Title format matches exactly (`pdp-basic · javascript · highcharts · anyplot.ai`);
    subtitle adds useful methodological context (model, feature, CI meaning) without
    cluttering the chart.
  weaknesses:
  - Legend swatch for "Training data distribution" renders as a circle even though
    the underlying series is a column/bar type -- minor visual mismatch between symbol
    and series shape.
  - Y-axis upper bound ($320,000, from the ceil-to-10k rounding) leaves a sizeable
    empty band above the highest CI point (~$305,000) -- could tighten yMax rounding
    for less top whitespace.
  - Spec's optional suggestion to center the partial dependence at zero for easier
    relative-effect reading was not explored (not required, but would add an alternative
    framing).
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white, matches #FAF8F1 -- not pure white.
      Chrome: title "pdp-basic · javascript · highcharts · anyplot.ai" in bold dark ink at top center; subtitle in soft gray below it; y-axis title "Predicted Sale Price ($)" rotated on the left; x-axis title "Living Area (sq ft)" below the axis; y-axis tick labels formatted as "$160,000"..."$320,000"; x-axis tick labels "600"..."4000"; bottom legend with three entries ("90% confidence interval", "Training data distribution", "Partial dependence"). All chrome text is dark and clearly readable against the light background; confirmed via zoomed crops of the left axis and right edge -- no clipping.
      Data: a green (#009E73) spline rises from ~$210k at 500 sq ft, decelerates smoothly, and flattens near ~$270k above ~3000 sq ft (diminishing-returns curve). A translucent light-green confidence band surrounds the line, narrow (~$12k tall) near the median living area (~2000-2600 sq ft) and wide (~$70k tall) at both sparse edges. Below the main panel, thin gray vertical rug marks (in their own bottom strip, secondary hidden y-axis) show the training data's feature distribution, denser in the 1500-2600 sq ft range -- which matches where the CI band is narrowest.
      Legibility verdict: PASS.

    Dark render (plot-dark.png):
      Background: warm near-black, matches #1A1A17 -- not pure black.
      Chrome: same title/subtitle/axis titles/tick labels, now rendered in light ink/gray tones. Confirmed via zoomed crops of the left axis -- fully legible, no dark-on-dark failures on any title, axis label, or tick label.
      Data: same brand-green (#009E73) line and band shape/values as the light render -- data colors are identical between themes, only chrome (background, text, grid) flipped. Rug marks remain a neutral gray, visible against the dark background.
      Legibility verdict: PASS.
