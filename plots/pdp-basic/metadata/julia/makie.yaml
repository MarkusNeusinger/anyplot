review:
  strengths:
  - 'All spec features implemented in one composition: the PDP curve, a shaded confidence-interval
    band, a dashed zero-reference line for centered interpretation, and a rug plot
    showing training-data density along the x-axis'
  - Data is centered at zero per PDP convention and the CI band correctly narrows
    near the densest training region (~1,800 sqft) and widens toward the sparse extremes,
    matching how bootstrap variance actually behaves
  - Theme tokens (PAGE_BG, INK, INK_SOFT) are threaded consistently through title,
    axis labels, ticks, spines, and grid; both renders are fully readable with identical
    brand-green data color across themes
  - 'Clean idiomatic CairoMakie usage: explicit font sizes throughout, top/right spines
    removed, subtle single-axis grid, and a hand-built rug via linesegments! that
    adds real analytical value without faking interactivity'
  - Realistic, neutral housing-price scenario with plausible scale (500-4000 sqft,
    log-shaped diminishing-returns effect) and full code reproducibility via Random.seed!(42)
  weaknesses:
  - Title occupies only ~25% of the plot width — well under the ~50-70% guideline
    for a shorter custom title; still fully legible, but the title area reads a little
    small relative to the 3200px canvas. Consider bumping titlesize from 23 toward
    ~26-28.
  - The rug plot's tick marks blend together into a dense smear in the 1500-2500 sqft
    range where training data clusters most heavily, making individual density variation
    harder to read at that specific range; a slightly lower alpha or thinner linewidth
    could preserve more granularity there.
  - 'LM-02 usage is solid but not maximal: band! and linesegments! are used well,
    but no Makie-distinctive layout feature (e.g. rangebars!, a secondary linked Axis,
    or Makie''s Legend/Colorbar composition) is showcased beyond what a determined
    matplotlib port could approximate.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Bold dark title "pdp-basic · julia · makie · anyplot.ai" centered at top, clearly readable. Y-axis label "Partial Dependence on Price ($K)" and x-axis label "Square Footage" in dark ink. Tick labels in a softer gray, legible against the cream background. Subtle horizontal gridlines at 15-20% opacity. Top and right spines removed; left/bottom spines in soft gray.
      Data: Brand-green (#009E73) line tracing a log-shaped, diminishing-returns curve from about -130 at 500 sqft up to +65 at 4000 sqft. A light-green shaded confidence band surrounds the line, narrowest near ~1800 sqft and widest at the extremes. A dashed gray horizontal reference line marks zero. A rug of thin gray vertical ticks below the plot shows the training data's square-footage distribution, denser in the 1200-2500 sqft range and sparse beyond ~2800 sqft.
      Legibility verdict: PASS — all text is clearly readable against the light background, no dark-on-light or washed-out elements.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Same title now rendered in light/white text, clearly visible against the dark surface. Axis labels in light ink, tick labels in a lighter warm gray. Gridlines and spines flipped to light-on-dark equivalents at matching low opacity. Spines and grid treatment mirror the light render's structure.
      Data: Identical brand-green (#009E73) line and light-green confidence band — data colors match the light render exactly, only the surrounding chrome inverted. Dashed zero-reference line now in light gray. Rug ticks remain visible as light-gray marks against the black background, same density pattern as the light render.
      Legibility verdict: PASS — no dark-on-dark failures; all title, axis, and tick text is clearly legible against the near-black background, and the data curve/band remain fully distinguishable.
