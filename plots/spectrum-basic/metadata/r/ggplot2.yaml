      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "spectrum-basic · r · ggplot2 · anyplot.ai" top-left in dark ink, fully legible. Y-axis title "Amplitude (dB)" and x-axis title "Frequency (Hz)" in dark ink, both readable. Tick labels (0, -25, -50, -75 on y; 20, 50, 100, 200, 500, 1,000, 2,000, 4,000 on x, comma-formatted) in soft dark gray, all legible. Horizontal gridlines at each y break are thin and subtle against the light background; x has no gridlines (removed), which is a deliberate, clean choice. Axis lines are soft gray, ticks removed.
      Data: Single-series green (#009E73) line tracing the FFT magnitude spectrum in dB, with a semi-transparent green ribbon shading the area between the trace and a dashed noise-floor reference line. Four peaks (440, 880, 1320, 2150 Hz) are marked with green dots and dark-ink text labels sitting just above each dot, none overlapping each other or the trace.
      Legibility verdict: PASS — no light-on-light or illegible text found.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
