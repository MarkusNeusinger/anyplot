review:
  strengths:
  - Correct logarithmic frequency axis with clean comma-formatted breaks (20 Hz -
    4 kHz), matching the spec's recommendation for wide frequency ranges
  - 'Clean, refined theme: ticks removed, only horizontal reference gridlines kept,
    axis line retained for orientation'
  - Imprint brand green (#009E73) data color is correctly identical between light
    and dark renders; only chrome (background, grid, text) flips
  - Realistic, physically plausible synthetic signal (440 Hz fundamental + two decaying
    harmonics + higher resonance + noise floor) faithfully recovered via FFT, giving
    good coverage of dominant-tone, harmonic, and noise-floor features
  - 'Both themes use exact background tokens (#FAF8F1 / #1A1A17); title, axis titles,
    and tick labels are legible with no dark-on-dark or light-on-light issues'
  weaknesses:
  - The four dominant peak frequencies (440/880/1320/2150 Hz) are not annotated or
    highlighted, despite the spec explicitly suggesting to 'consider highlighting
    peak frequencies or annotating dominant components' - a light annotate()/geom_text()
    callout on the fundamental would strengthen data storytelling
  - geom_area() uses the default baseline of 0, so at every frequency the shaded region
    spans from the line up to 0 dB - since amplitude is negative everywhere, this
    produces a near-uniform green wash across most of the plot height rather than
    emphasizing the peaks locally; a lower alpha or a baseline nearer the noise floor
    would sharpen the visual hierarchy
  - Implementation relies on standard geoms (area + line) without showcasing more
    distinctive ggplot2 features (e.g. annotate() for peak labels or a geom_hline()
    noise-floor reference)
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 - not pure white, not dark.
      Chrome: Title "spectrum-basic · r · ggplot2 · anyplot.ai" in dark ink top-left; axis titles "Frequency (Hz)" and "Amplitude (dB)" in dark ink; tick labels ("20", "50", "100", ..., "4,000" on x; "0", "-25", "-50", "-75" on y) in soft gray ink. Four subtle horizontal reference gridlines only (no vertical gridlines), consistent with the theme spec. All chrome elements are clearly legible against the light background.
      Data: Single-series brand green (#009E73) line with a semi-transparent green area fill beneath it (baseline 0). Four sharp peaks are visible around 440, 880, 1320, and 2150 Hz standing well above the noisy broadband floor, correctly reflecting the fundamental tone plus harmonics buried in noise.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 - not pure black, not light.
      Chrome: Same title and axis titles now rendered in light ink (near-white), tick labels in light gray - all clearly readable against the dark background. Gridlines remain subtle but visible as light horizontal lines.
      Data: Same brand green (#009E73) line and area fill as the light render - data colors are confirmed identical between themes, only the surrounding chrome (background, text, grid) has flipped polarity.
      Legibility verdict: PASS - no dark-on-dark issues observed; all text and data elements are clearly distinguishable from the near-black background.
