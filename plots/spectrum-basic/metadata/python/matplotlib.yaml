    value; the fill is anchored to the axis floor so it reads as amplitude
  - Peak labels are found from the data (largest local maxima) and sit at their peaks,
    kept to the three dominant components
  - All chrome threaded through theme tokens, including annotation boxes on the elevated
    surface token; both renders read cleanly
  - Exact 3200x1800 canvas from figsize (8, 4.5) at 400 dpi with style-guide text
    sizes
  weaknesses:
  - 'SC-03 (both): the x axis stops at about 299 Hz, hiding the 300-499 Hz bins, 40
    % of the computed spectrum → show the full 0-500 Hz range (+200 Hz). Likely cause:
    ax.set_xlim(0, np.nanmax(x) * 0.6).'
  - 'CQ-04 (code): lines 41-46 compute the two-sided np.fft.fft and fftfreq and then
    mask the positive half, and lines 53-55 write out a local-maximum search → np.fft.rfft
    / np.fft.rfftfreq and scipy.signal.find_peaks. Likely cause: hand-rolled steps
    an available call computes.'
  - 'Suggestion: matplotlib''s own ax.magnitude_spectrum(signal, Fs=sample_rate, scale=''dB'')
    would show a distinctive library feature.'
  - 'Suggestion: peak labels at 7 pt could go to 8 pt to match the tick labels.'
