review:
  strengths:
  - 'Log frequency axis built idiomatically: log10 positions on pygal.XY with x_value_formatter
    turning them back into 1-2-5 Hz ticks derived from the data range'
  - 'Plausible motor-vibration spectrum: 30 Hz shaft with 2x/3x harmonics, 600 Hz
    gear mesh with ±30 Hz sidebands and a 1200 Hz 2x mesh line above a jagged floor'
  - Amplitude in dB re 1 µg with values that fall out of the computation (0.8 g shaft
    line at ~118 dB)
  - Translucent fill under a crisp outline keeps the narrow high-frequency lines readable
    in both themes
  - HTML export gives native pygal hover tooltips for each bin
  weaknesses:
  - 'VQ-07 (dark): the dotted x and y guides are drawn near-black (about #141412)
    on the #1A1A17 page and practically vanish, while the light render shows them
    → guides in a muted ink that reads on the dark page (INK_MUTED-based). Likely
    cause: pygal Style guide_stroke_color / major_guide_stroke_color left at their
    black default.'
  - 'VQ-01 (both): the y tick labels 50 and 100 render at 44 px while the other y
    ticks are 56 px, so two ticks read visibly smaller → one size for all ticks (+12
    px on the majors). Likely cause: major_label_font_size=44 below label_font_size=56;
    pygal promotes some y labels to major labels.'
  - 'Suggestion: annotate the 30 Hz shaft line and the 600 Hz gear mesh with their
    frequencies, as the Notes allow.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, 3200x1800
      Chrome: title "spectrum-basic · python · pygal · anyplot.ai" centered at top; x axis "Frequency (Hz), log scale" with 1-2-5 ticks 10, 20, 50, 100, 200, 500, 1000, 2000; y axis "Amplitude (dB re 1 µg)" 10-120 in steps of 10; dotted grey grid; all dark text readable. The y ticks 50 and 100 are drawn smaller than the others.
      Data: one brand-green #009E73 filled line (translucent fill, solid outline): broad-looking peaks at 30 Hz (~118 dB), 60 Hz (~111), 90 Hz (~103), narrow lines at 570/600/630 Hz (104/114/104) and 1200 Hz (~107) above a jagged floor at ~45-65 dB that crowds toward the high end.
