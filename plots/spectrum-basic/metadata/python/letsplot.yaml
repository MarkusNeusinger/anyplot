review:
  strengths:
  - The FFT of a seeded synthetic signal gives three narrow peaks (50, 120, 200 Hz)
    that stand well clear of a jagged noise floor, on an amplitude range that shows
    both
  - 'Theme tokens are threaded through every chrome element; both renders are readable,
    with correct #FAF8F1/#1A1A17 backgrounds'
  - The column constants (FREQUENCY, AMPLITUDE) double as axis titles with units,
    so no separate labs for the axes is needed
  - The HTML export gives native lets-plot hover inspection of every bin
  weaknesses:
  - 'VQ-07 (both): the visible spectrum line renders grey (#474747) over the green
    line instead of brand green #009E73, so the first series is not drawn in the brand
    color → the line in #009E73. Likely cause: geom_area(fill=IMPRINT_PALETTE[0])
    is drawn after geom_line and keeps lets-plot''s default grey outline; set geom_area(color=IMPRINT_PALETTE[0])
    or color=None/size=0, or draw geom_line after geom_area.'
  - 'VQ-03 (dark): the grey outline on the #1A1A17 page makes the spectrum line, including
    the noise floor, read with low contrast; the green is only visible as a thin fringe
    → a clearly visible #009E73 line. Likely cause: the same default geom_area outline
    that covers geom_line.'
  - 'Suggestion: label the three dominant peaks with their frequency (the Notes allow
    this), placed at each peak.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 (sampled 250,248,241) on a 3200x1800 canvas
