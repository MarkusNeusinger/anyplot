review:
  strengths:
  - The dB values come straight from the computed FFT. The 1.0, 0.5, 0.25 and 0.15
    sines appear as peaks at 0, −6, −12 and −16.5 dB at 50/100/150/500 Hz, and the
    noise floor sits near −50 dB, which matches 0.1·2/√4096.
  - Uses scale_x_log10 with annotation_logticks for the wide 10–1000 Hz span. It blanks
    the minor grid and lets the log ticks carry the decade structure, so the only
    grid is a quiet major grid.
  - 'The machinery-vibration scenario is realistic: a 50 Hz motor fundamental, two
    harmonics and a 500 Hz bearing tone. The four peaks stand far above the floor
    on one amplitude range.'
  - Axis titles come from the tidy df column names ('Frequency (Hz)', 'Amplitude (dB)'),
    so labs() only sets the title, which is idiomatic plotnine.
  - Theme tokens are threaded through every chrome element, so both renders are correct
    and readable.
  weaknesses:
  - 'Suggestion: the four dominant peaks (50, 100, 150, 500 Hz) could carry small
    frequency labels at their tips, which the spec''s Notes allow.'
  - 'Suggestion: the y-axis title could name the dB reference (for example ''Amplitude
    (dB re 1 unit)'') for vibration readers.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the plot and panel, not pure white.
      Chrome: bold near-black title "spectrum-basic · python · plotnine · anyplot.ai" centered at the top, about 55 % of the width. Axis titles "Frequency (Hz)" and "Amplitude (dB)" are dark ink. Tick labels (10, 100, 1000; 0 to −80 dB) are dark grey. A subtle major grid is visible, and log-tick marks run along the bottom. All text is readable.
      Data: a single thin #009E73 line spectrum on a log x axis from 10 to 1000 Hz. A jagged noise floor sits around −50 to −60 dB. Narrow peaks rise to 0 dB (50 Hz), about −6 dB (100 Hz), about −12 dB (150 Hz) and about −16 dB (500 Hz). The bins crowd toward the high end into a dense band, which the spec permits.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17, not pure black.
      Chrome: the title and axis titles are light #F0EFE8 and the tick labels light grey #B8B7B0. The grid is subtle but visible, and the log ticks are light grey. There is no dark-on-dark text.
      Data: the same #009E73 line with identical peaks; only the chrome flipped. Brand green reads well on the dark surface.
      Legibility verdict: PASS
