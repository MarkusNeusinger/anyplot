review:
  strengths:
  - 'Correct spectrum form: rfft magnitude in dB as a filled seaborn line, every bin
    from 1 to 500 Hz at its own value on a logarithmic frequency axis with 1-2-5 tick
    labels'
  - Dominant components picked from the data (tallest local maxima) and labelled with
    their frequency right at each peak
  - Fill runs down to a computed floor, so the noise floor and the peaks read together
    on one amplitude range
  - Theme tokens threaded through set_theme rc; both renders fully legible with identical
    data colours
  - Tidy df with column constants passed to sns.lineplot/scatterplot, canvas exactly
    3200x1800
  weaknesses:
  - 'CQ-04 (code): lines 49-50 detect local maxima by hand with np.r_ neighbour comparisons
    → scipy.signal.find_peaks(amp) returns the same indices. Likely cause: peak detection
    written out instead of calling SciPy.'
  - 'Suggestion: the major tick labels 10 and 100 sit a few pixels lower than the
    minor labels 2, 5, 20, 50; matching the major and minor tick pad would align the
    row.'
