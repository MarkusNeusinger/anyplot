review:
  strengths:
  - Peaks are detected from the spectrum with a vectorised local-maximum test, so
    highlights always sit exactly on their bins and the legend names their computed
    frequencies
  - Logarithmic frequency axis via x_axis_type='log' with the DC bin dropped, and
    a y range derived from the data that shows the -6 dB fundamental and the ~-60
    dB floor together
  - 'Clean Bokeh idioms: ColumnDataSource(df) with column-name constants, varea fill
    under the line, HoverTool with formatted brace-escaped fields'
  - Theme tokens threaded through every chrome element; both renders are readable
    and the data colors are identical
  weaknesses:
  - 'VQ-03 (both): the legend glyphs are about 4-6 px dots and a short dash beside
    30pt labels, so the peak colors are hard to match to their markers → glyphs of
    roughly 40-50 px (+35 px). Likely cause: p.legend.glyph_width/glyph_height left
    at Bokeh''s 20 px default on a 3200x1800 canvas.'
  - 'Suggestion: tick labels on the log axis could read 1, 10, 100 Hz instead of 10^0,
    10^1, 10^2 (e.g. a NumeralTickFormatter or LogTickFormatter setting).'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, 3200x1800.
      Chrome: bold near-black title 'spectrum-basic · python · bokeh · anyplot.ai' top-left; italic axis titles 'Frequency (Hz)' and 'Amplitude (dB)'; grey tick labels 10^0/10^1/10^2 on the log x axis and 0 to -80 on y; subtle grid; legend top-right on an elevated panel. All readable.
      Data: spectrum as a #009E73 line with a 15% green fill down to the axis floor; jagged noise floor around -60 dB, three narrow peaks at 50 Hz (~-6 dB), 150 Hz (~-12 dB) and 400 Hz (~-16.5 dB) topped by markers in #C475FD, #4467A3, #BD8233 with a soft ink outline; legend lists Spectrum and each peak frequency, though its glyphs are tiny.
