review:
  strengths:
  - The three components land at their exact expected levels (1.0 → 0 dB, 0.5 → −6.0
    dB, 0.25 → −12.0 dB) because the dB values fall out of the rfft magnitude scaling,
    and the noise floor sits near the predicted −45 dB
  - Narrow peaks rise 30–45 dB above a jagged floor on a data-derived y domain that
    shows the peaks and the floor together
  - 'Theme tokens threaded through title, axis titles, tick labels, domain lines and
    grid; both renders are readable and the line stays #009E73 in both'
  - Field names escaped with str.translate and given explicit type= and title=, so
    the column constants read as clean axis titles
  - Formatted alt.Tooltip on frequency and amplitude (.1f) for bin-level inspection
    in the HTML output
  weaknesses:
  - 'Suggestion: labelling the 50, 120 and 200 Hz peaks with their frequency, as the
    Notes allow, would name the dominant components directly.'
  - 'Suggestion: adding .interactive() would let HTML viewers zoom into the narrow
    peaks.'
