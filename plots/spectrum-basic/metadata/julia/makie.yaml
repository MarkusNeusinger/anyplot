review:
  strengths:
  - Correctly implements a logarithmic frequency axis (xscale = log10) matching the
    spec's guidance for wide frequency ranges
  - Manual DFT via a vectorized cos/sin matrix-vector product is a well-executed workaround
    for the missing FFTW package in this runtime, staying true to the 'no workarounds
    outside Makie' rule instead of falling back to another library
  - Realistic, neutral vibration-analysis scenario with three physically meaningful
    harmonics (42 Hz shaft, 126 Hz gear-mesh, 310 Hz bearing fault) sitting above
    a plausible noise floor
  - 'Theme-adaptive chrome is correctly threaded through: identical brand-green data
    line in both renders, correct #FAF8F1/#1A1A17 backgrounds, all text legible in
    both themes'
  - Canvas lands exactly on the 3200x1800 target with no clipped or overlapping elements
  weaknesses:
  - No peak highlighting or annotation of the three dominant frequency components
    — the spec explicitly suggests this ('Consider highlighting peak frequencies or
    annotating dominant components') and the data has an obvious, meaningful story
    (shaft/gear-mesh/bearing harmonics) that goes untold. Add text!() labels or scatter
    markers at 42/126/310 Hz to turn a flat line into a guided read.
  - Styling is competent but generic beyond style-guide compliance — no distinguishing
    visual choice (e.g. subtle fill-under-curve, or peak markers) that would elevate
    it past a default rendering.
  - Only uses baseline Axis/lines! API — no Makie-distinctive feature (e.g. text!/scatter!
    annotation layer, custom tick formatting for the log axis) is demonstrated.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "spectrum-basic · julia · makie · anyplot.ai" in dark ink, clearly legible; "Frequency (Hz)" and "Amplitude (dB)" axis labels in dark ink; tick labels (10^0, 10^1, 10^2, 10^3 on x; -25/-50/-75 on y) in soft grey, all readable; subtle horizontal gridlines only, top/right spines removed.
      Data: Single line series in Imprint brand green (#009E73), plotted on a log10 x-axis. Three sharp, tall peaks are clearly visible around 42 Hz, 126 Hz, and 310 Hz rising well above a jagged noise floor that gets denser toward higher frequencies (expected FFT bin-count behavior on a log axis).
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Title and axis labels rendered in light ink (near-white), clearly legible against the dark background; tick labels in a lighter soft grey, readable; gridlines subtle and visible; no dark-on-dark issues detected anywhere.
      Data: Same brand-green (#009E73) line, identical shape and peak positions to the light render — confirms data colors are unchanged between themes, only chrome flipped.
      Legibility verdict: PASS
