review:
  strengths:
  - Correct logarithmic x-axis scale spanning the full audible range (20 Hz–20 kHz),
    matching the spec's guidance for wide frequency ranges
  - 'Realistic, neutral audio-engineering dataset: synthetic FFT spectrum of a plucked
    A4 (440 Hz) note with 7 harmonics decaying plausibly (0 dB → -34 dB) atop a log-sloped,
    randomized noise floor'
  - 'Theme-adaptive chrome is fully correct: identical brand-green (#009E73) data
    color in both renders, correct off-white/near-black backgrounds, all text readable
    in both themes'
  - Custom tick-formatter callback thins crowded log-scale minor ticks (only 1-2-5
    decade steps shown) — a thoughtful readability touch beyond Chart.js defaults
  - Single-series legend correctly omitted per style guide; deterministic fixed-seed
    LCG for full reproducibility
  weaknesses:
  - 'Area fill (fill: true) fills upward toward the y-axis maximum (0 dB) instead
    of downward toward the y-axis minimum/baseline, so quiet noise-floor regions render
    as a large solid green mass while the loud harmonic peaks appear as thin notches
    — this inverts the expected visual hierarchy where the loud/peak content should
    read as the dominant visual mass. Set an explicit y-scale min (e.g. -90) and fill
    toward that minimum (or toward a defined baseline dataset) so peaks read as prominent
    green mountains rising from the floor.'
  - Spec explicitly suggests "Consider highlighting peak frequencies or annotating
    dominant components" — none of the 7 harmonic peaks are labeled (e.g. a callout
    for the 440 Hz fundamental). A small annotation would strengthen data storytelling.
  - Data generation defines three small helper functions (rand, noiseFloorDb, harmonicPeakDb)
    rather than a flatter Imports→Data→Plot structure; the LCG rand() is expected
    per the chartjs library guide (no seeded Math.random in-browser), but the two
    dB-formula helpers add structural complexity that could be simplified/inlined.
  - Library Mastery is fairly generic — beyond the logarithmic x-scale and custom
    tick-formatting callback, no other Chart.js-distinctive features (custom plugins,
    gradient fills, interaction modes) are used.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 - not pure white.
      Chrome: Bold dark title "spectrum-basic · javascript · chartjs · anyplot.ai" at top, fully readable. Left y-axis "Amplitude (dB)" label rotated, dark tick labels (0 to -90 in steps of 10) clearly legible. Bottom x-axis "Frequency (Hz)" label with log-scale tick labels (20, 50, 100, 200, 500, 1k, 2k, 5k, 10k), all readable. Subtle horizontal y-axis grid lines only; x-axis grid intentionally hidden.
      Data: Single brand-green (#009E73) line tracing a fundamental peak near 440 Hz reaching close to 0 dB, six decaying harmonics up to ~3 kHz, and a randomized noise floor around -65 to -85 dB elsewhere. Area under the line is filled with translucent green extending UP toward the 0 dB axis maximum, creating a dominant green wash across most of the canvas except near the peaks (see weaknesses - fill direction is inverted from the expected reading).
      Legibility verdict: PASS - all text is dark-on-light and clearly legible, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 - not pure black.
      Chrome: Same title now rendered in light/white text, fully readable against the dark background. Axis tick labels rendered in light grey, clearly legible. Grid lines subtle and visible.
      Data: Data line and fill use the identical brand green (#009E73) as the light render; fill area renders as a darker semi-transparent green against the near-black background. No dark-on-dark issues - all text and data are clearly distinguishable.
      Legibility verdict: PASS - no dark-on-dark failures found; data colors confirmed identical to the light render (only chrome flipped).
