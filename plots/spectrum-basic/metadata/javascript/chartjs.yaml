review:
  strengths:
  - 'Fill direction fixed: fill: "start" combined with an explicit y.min = -90 now
    fills from the line down to the axis floor, so the loud harmonic peaks read as
    tall dominant green mountains and the quiet noise floor reads as a thin band —
    correct visual hierarchy, resolving the attempt-1 rejection reason'
  - New custom Chart.js plugin (annotateFundamental, afterDatasetsDraw) draws a dashed
    reference line and "440 Hz — A4 fundamental" label directly on the canvas — a
    genuine library-distinctive feature (the plugin system) that directly answers
    the spec's suggestion to annotate dominant components
  - Correct logarithmic x-axis scale spanning the full audible range (20 Hz–20 kHz),
    matching the spec's guidance for wide frequency ranges
  - 'Realistic, neutral audio-engineering dataset: synthetic FFT spectrum of a plucked
    A4 (440 Hz) note with 7 harmonics decaying plausibly (0 dB → -34 dB) atop a log-sloped,
    randomized noise floor'
  - 'Theme-adaptive chrome is fully correct: identical brand-green (#009E73) data
    color and annotation line/text in both renders, correct off-white/near-black backgrounds,
    all text readable in both themes'
  - Custom tick-formatter callback thins crowded log-scale minor ticks (only 1-2-5
    decade steps shown) — a thoughtful readability touch beyond Chart.js defaults
  weaknesses:
  - Data generation still defines three small helper functions (rand, noiseFloorDb,
    harmonicPeakDb) rather than a flatter Imports→Data→Plot structure; the LCG rand()
    is expected per the chartjs library guide (no seeded Math.random in-browser),
    but the two dB-formula helpers add structural complexity beyond strict KISS
  - Beyond the logarithmic x-scale, tick-formatting callback, and the new annotation
    plugin, no other Chart.js-distinctive features (gradient fills, custom interaction
    modes, multiple datasets) are used
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 - not pure white.
      Chrome: Bold dark title "spectrum-basic · javascript · chartjs · anyplot.ai" at top, fully readable. Left y-axis "Amplitude (dB)" label rotated, dark tick labels (10 down to -90 in steps of 10) clearly legible. Bottom x-axis "Frequency (Hz)" label with log-scale tick labels (20, 50, 100, 200, 500, 1k, 2k, 5k, 10k), all readable. Subtle horizontal y-axis grid lines only; x-axis grid intentionally hidden.
      Data: Single brand-green (#009E73) line tracing a fundamental peak near 440 Hz reaching close to 0 dB, six decaying harmonics up to ~3 kHz, and a randomized noise floor around -65 to -85 dB elsewhere. The area fill now correctly extends DOWN from the line to the -90 dB floor, so the harmonic peaks render as tall dominant green mountains and the noise floor is a thin band — correct visual hierarchy (fixed from attempt 1). A dashed vertical reference line at 440 Hz with the label "440 Hz — A4 fundamental" sits above the fundamental peak, clear of all other elements.
      Legibility verdict: PASS - all text is dark-on-light and clearly legible, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 - not pure black.
      Chrome: Same title now rendered in light/white text, fully readable against the dark background. Axis tick labels rendered in light grey, clearly legible. Grid lines subtle and visible.
      Data: Data line, fill, dashed reference line, and annotation text use the identical brand green / ink tokens as the light render, only the chrome (background, text color) flips. Fill area renders as a darker semi-transparent green mountain against the near-black background, consistent with the light render's hierarchy. No dark-on-dark issues - all text and data are clearly distinguishable.
      Legibility verdict: PASS - no dark-on-dark failures found; data colors confirmed identical to the light render (only chrome flipped).
