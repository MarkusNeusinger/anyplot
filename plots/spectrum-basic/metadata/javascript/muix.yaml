review:
  strengths:
  - Realistic guitar-string harmonic spectrum with a proper log-frequency axis and
    dB amplitude scale, matching real audio-engineering conventions
  - Correct Imprint brand-green line color, deterministic LCG-seeded data, clean single-series
    design with horizontal-only grid and a thicker stroke for legibility
  - Theme-adaptive chrome verified correct in both light and dark renders, with identical
    data color across themes and no dark-on-dark or light-on-light issues
  weaknesses:
  - No peak/harmonic annotations despite the spec's suggestion to 'consider highlighting
    peak frequencies or annotating dominant components' — a label or marker at the
    fundamental (82.4 Hz) and its harmonics would strengthen data storytelling
  - 'Design Excellence is fairly generic: beyond the horizontal-only grid and thicker
    stroke there''s little bespoke visual treatment — no emphasis/highlight on the
    dominant fundamental peak to create a clear focal point'
  - Library mastery is basic idiomatic LineChart usage — no distinctive MUI X feature
    beyond a log axis and valueFormatter (e.g. an area fill under the curve or a reference
    line at the noise floor) to showcase the library further
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "spectrum-basic · javascript · muix · anyplot.ai" top-left in dark ink; "Frequency (Hz)" x-axis title and "Amplitude (dB)" y-axis title (rotated) both clearly legible; log-scale x tick labels (10, 20, 30 ... 1k ... 10k) and y tick labels (-5 to -75 by 5) all dark and crisp; subtle light-gray horizontal gridlines only.
      Data: Single brand-green (#009E73) line — a noisy pink-noise floor from 20-55 Hz, a tall fundamental peak near 82 Hz (~-6 dB), then four progressively smaller harmonic peaks with dips between them, decaying into a noisy floor above ~700 Hz out to 8 kHz.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Same title, axis titles and tick labels, now rendered in light/off-white ink against the dark background — all clearly legible, no dark-on-dark text anywhere; gridlines are a subtle darker gray, still visible.
      Data: Same brand-green line, identical shape and color to the light render — confirms only chrome (not data color) flips between themes.
      Legibility verdict: PASS
