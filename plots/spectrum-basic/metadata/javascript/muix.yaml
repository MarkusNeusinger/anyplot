review:
  strengths:
  - Fundamental frequency clearly annotated with a dashed amber ChartsReferenceLine
    and label, directly answering the spec's suggestion to highlight peak frequencies
  - Four harmonics plus a realistic pink-noise-like floor are all visible with correct
    decreasing amplitude per harmonic — comprehensive feature coverage for a guitar-string
    spectrum
  - All font sizes explicitly set (title 22px, axis labels 16px, tick labels 14px)
    and legible on both cream and near-black backgrounds
  - Log-scale frequency axis with a custom k-suffix valueFormatter, per the spec's
    guidance for wide frequency ranges
  - 'Palette fully compliant and pixel-verified: brand green #009E73 identical across
    themes, backgrounds exactly #FAF8F1 (light) / #1A1A17 (dark), amber anchor used
    correctly for the semantic reference-line role'
  - Single-series legend correctly omitted as redundant
  - Deterministic synthetic data via a seeded LCG
  weaknesses:
  - 'Dead prop: yAxis config sets `tickFontSize: 26`, which is not a real MUI X Axis
    option and has no effect — the actual tick size comes from `tickLabelStyle: {
    fontSize: 14 }`. Remove the unused prop for code cleanliness.'
  - Area fill shades the region between the curve and the 0 dB top reference rather
    than toward the noise floor — a valid design choice for an EQ-style read, but
    the more conventional spectrum-analyzer convention shades down toward the floor;
    consider as a future refinement, not a defect.
  - Only a horizontal grid is drawn; a couple of faint vertical guides at decade marks
    (100 Hz, 1 kHz) could further aid reading the log-frequency axis, though this
    is optional polish.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, pixel-verified at (250,248,241) = #FAF8F1, matches spec exactly.
      Chrome: Title "spectrum-basic · javascript · muix · anyplot.ai" in dark ink, top-left, fully visible and not clipped. X-axis "Frequency (Hz)" (log scale, 10–10k) and y-axis "Amplitude (dB)" (0 to -75) both dark, readable, with units. Tick labels dark and legible against the cream background. Subtle horizontal grid lines only.
      Data: Single series in brand green (#009E73), line + light mint area fill (fillOpacity 0.12) shading the region between the curve and the 0 dB top. Shows the fundamental peak at 82.4 Hz (marked with a dashed amber ChartsReferenceLine and "Fundamental · 82.4 Hz" label), four decaying harmonic bumps, and a jagged noise floor beyond ~700 Hz. Area fill was pixel-checked and stops cleanly at the last data point (~8 kHz), does not bleed to the canvas edge.
      Legibility verdict: PASS — all text clearly readable, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, pixel-verified at (26,26,23) = #1A1A17, matches spec exactly.
      Chrome: Same title, axis labels, and tick labels now rendered in light/off-white ink, fully legible against the dark background. No dark-on-dark text anywhere. Grid lines still subtle but visible.
      Data: Same brand green (#009E73) line and area fill — pixel-identical hue to the light render, confirming only chrome flipped. Amber dashed reference line and label remain clearly visible and readable on the dark surface.
      Legibility verdict: PASS — no dark-on-dark failures, amber and green both read well on the near-black surface.
