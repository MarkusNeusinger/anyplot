review:
  strengths:
  - Composes the chart from ChartsContainer with AreaPlot, LinePlot, ChartsGrid and
    both axes, and draws the peak markers in a custom SVG layer positioned through
    the useXScale/useYScale hooks, so every marker sits exactly at its bin
  - 'Log frequency axis (scaleType: ''log'') with a 1-2-5 tickInterval computed from
    the data range and ''k'' formatting gives readable decade ticks from 20 Hz to
    8 kHz'
  - 'Realistic scenario: a plucked low-E guitar string (82.4 Hz) with four harmonics
    decaying 8 dB each over a sloping, jagged noise floor on 1024 log-spaced bins;
    peaks narrow and clearly above the floor'
  - Peak labels are detected from the data (local maxima at least 15 dB above the
    median), limited to the five dominant components and name each frequency directly
    above its peak
  - 'Theme tokens threaded through all chrome (ink, inkSoft, grid, pageBg ring on
    markers); identical #009E73 data color in both renders'
  - Title/subtitle hierarchy (22 px semibold title, 15 px inkSoft subtitle summarising
    bins and peak criterion) and a faint 0.12 area fill give the spectrum weight without
    hiding the grid
  weaknesses:
  - 'Suggestion: the ''Amplitude (dB)'' header could state a reference (e.g. dBFS)
    so the absolute level reads unambiguously.'
  - 'Suggestion: a slightly smaller y range headroom above the 0 dB tick would give
    the peaks a little more vertical room.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole canvas, no white plot panel.
      Chrome: centred semibold title "spectrum-basic · javascript · muix · anyplot.ai" with a soft-grey subtitle "1,024 bins from 20 to 8,000 Hz · 5 peaks at least 15 dB above the median level"; y axis "Amplitude (dB)" with ticks 0 to −75 in steps of 5; log x axis "Frequency (Hz)" with ticks 20, 50, 100, 200, 500, 1k, 2k, 5k; subtle grey horizontal and vertical grid. All text dark and readable.
      Data: a single #009E73 line with a faint green area fill down to the axis floor; five narrow peaks at 82.5, 165, 247, 329 and 413 Hz descending from −6 to −38 dB, each with a green dot (page-coloured ring) and a bold dark frequency label above it; jagged noise floor sloping from about −55 dB at 20 Hz to about −72 dB at 8 kHz.
