review:
  strengths:
  - 'Theme-adaptive chrome is correctly threaded through every element via window.ANYPLOT_TOKENS
    — both renders are fully legible, backgrounds match #FAF8F1/#1A1A17, and the data
    color (#009E73) is identical between light and dark.'
  - Log-scale frequency axis uses sensible, hand-picked tick values (20, 50, 100,
    200, 500, 1k, 2k, 5k, 10k, 20k) with a custom k-suffix formatter instead of noisy
    default log ticks.
  - Peak markers on the six harmonics create a clear focal point and directly satisfy
    the spec's 'highlight peak frequencies' note.
  - 'Deterministic seeded data (mulberry32) builds a realistic synthetic audio spectrum:
    a 440 Hz fundamental with decaying harmonics over a pink-noise-shaped floor with
    plausible ripple.'
  - Title format is correct and the legend is appropriately omitted for a single-series
    plot.
  weaknesses:
  - 'Library Mastery is generic: log-scale axis + area/line fill + circle markers
    could be replicated in any charting library with minor syntax changes. Consider
    a more D3-distinctive touch, e.g. a custom path/marker generator, a subtle band
    annotation, or direct numeric labels on the harmonic peaks (e.g. ''440 Hz'') to
    leverage D3''s low-level control.'
  - Aesthetic sophistication sits at a well-configured-default level (single flat-green
    area+line). A subtle secondary visual cue — e.g. a faint reference band for the
    noise floor, or varying marker size with peak prominence — would push this from
    'clean' to 'distinctive'.
  - Title occupies only ~30% of the plot width — not a violation (no overflow, fully
    readable), but there is room to grow it slightly for stronger visual hierarchy
    given the short spec-id/library name combination.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 - not pure white.
      Chrome: Bold dark title "spectrum-basic · javascript · d3 · anyplot.ai" centered at top, clearly readable. Dark axis labels "Frequency (Hz)" (x) and "Amplitude (dB)" (y, rotated). Dark tick labels on both axes (log-scale x: 20 to 20k; linear y: 0 to -100 in 20 dB steps). Subtle horizontal gridlines only, matching y-axis tick positions.
      Data: Single teal-green (#009E73) filled area with matching line on top, curveMonotoneX interpolation. A gently sloping pink-noise floor from ~-70 dB at 20 Hz down to ~-95 dB at 20 kHz, with six sharp harmonic peaks (440 Hz fundamental and 5 harmonics) each marked with a green-filled circle outlined in the page background color for definition.
      Legibility verdict: PASS - all text is clearly readable against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 - not pure black.
      Chrome: Same title and axis labels now rendered in light/off-white text, clearly readable. Tick labels and axis lines also light-colored. Gridlines are the same subtle horizontal style, visible against the dark background without competing with the data.
      Data: Identical teal-green (#009E73) area/line/markers as the light render, confirming data colors do not shift between themes; only the chrome (background, text, grid) flips.
      Legibility verdict: PASS - all text is clearly readable against the dark background; no dark-on-dark failures observed (title, axis labels, and tick labels all use light ink tokens).
