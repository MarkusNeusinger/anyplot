review:
  strengths:
  - 'Directly resolves the prior review''s key weakness: the 440 Hz fundamental now
    carries a dataLabel (''Fundamental (440 Hz)'') plus a highlighted per-point marker,
    so the viewer no longer has to infer which peak is the fundamental from position
    alone'
  - Added noise-floor plotLine with an inline label gives an explicit signal-vs-noise
    reference, strengthening data storytelling per the spec's Notes section
  - 'Correct plot type: single-series area/line spectrum with logarithmic frequency
    axis spanning the full audible range (20 Hz-20 kHz)'
  - 'Realistic, neutral dataset: synthetic FFT magnitude spectrum of a sustained A4
    (440 Hz) note with five decaying harmonics riding on a plausible -70 dB noise
    floor, deterministic via a fixed-seed LCG'
  - 'Clean theme-adaptive chrome throughout (title, axis titles, tick labels, plotLine
    label, dataLabel) with identical Imprint brand green #009E73 data color in both
    renders'
  - Both axis titles descriptive with units ('Frequency (Hz)', 'Amplitude (dB)');
    legend correctly omitted for a single-series chart; animation disabled and credits
    removed per the mount-node contract
  weaknesses:
  - The new 'Noise floor' plotLine label sits directly on top of the noisy data line
    in both themes -- the green trace crosses through the 'i', 'l', 'o', 'o', 'r'
    letters, a genuine text/data overlap (visible around the 8k-20k Hz region). Reposition
    the label to a clear stretch of the noise floor (e.g. anchor it near the left
    edge around 20-30 Hz, or add a small opaque background/halo behind the label text)
    so it never collides with the wiggling trace.
  - Aesthetic is a well-executed but still fairly conventional area-chart treatment;
    beyond the fundamental dataLabel and noise-floor plotLine, there is no further
    distinctive Highcharts feature (e.g. plotBands shading the harmonic octave regions)
    that would push it past a competent default look.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 - not pure white, not dark.
      Chrome: Bold dark title "spectrum-basic · javascript · highcharts · anyplot.ai" centered at top, clearly readable. Dark-gray "Amplitude (dB)" y-axis title (rotated) and "Frequency (Hz)" x-axis title, both descriptive with units. Tick labels (0 to -75 on Y in steps of 5; logarithmic 20/40/60/80/100/200/400/600/800/1k/2k/4k/6k/8k/10k/20k on X) all legible dark-gray text against the light background. Subtle horizontal-only gridlines. A dashed "Noise floor" plotLine crosses the plot near -70 dB with an inline label near the right side, but the label text visually overlaps the noisy data trace beneath it (letters partially crossed by the green line, though still decipherable).
      Data: Single Imprint brand-green (#009E73) line with a light semi-transparent green area fill beneath it, tracing a noisy floor around -70 dB with five sharp decaying peaks (fundamental near 440 Hz reaching about -5 dB, four harmonics of decreasing height up to ~2.2 kHz). The fundamental peak now carries a highlighted marker and a "Fundamental (440 Hz)" dataLabel above it.
      Legibility verdict: PASS - all chrome text is readable against the light background; the "Noise floor" label is legible despite overlapping the data line (an overlap/refinement issue, not a legibility failure).

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 - not pure black, not light.
      Chrome: Same title, axis titles, and tick labels now rendered in light/white text, clearly legible against the dark background. Same subtle horizontal gridlines, adapted to a light, low-opacity tone. Same dashed "Noise floor" plotLine and label, same overlap with the data trace as in the light render.
      Data: The line, area fill, marker, and dataLabel use the identical Imprint brand-green (#009E73) as the light render - same hue, same peak shapes and positions, same "Fundamental (440 Hz)" annotation - confirming only chrome (background, text, grid) flipped between themes.
      Legibility verdict: PASS - no dark-on-dark failures; all title, axis, tick, and annotation text is clearly visible against the near-black background; the "Noise floor" label has the same data-line overlap noted in the light render but remains readable.
