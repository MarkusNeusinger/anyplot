review:
  strengths:
  - 'Correct plot type: single-series area/line spectrum with a proper logarithmic
    frequency axis spanning the full audible range (20 Hz - 20 kHz), matching the
    spec''s guidance for wide frequency ranges'
  - 'Realistic, neutral dataset: a synthetic FFT magnitude spectrum of a sustained
    A4 (440 Hz) note with five decaying harmonics riding on a plausible -70 dB noise
    floor - shows peak sharpness, harmonic decay, and noise floor in one plot'
  - Deterministic data via a fixed-seed LCG (seed = 42), fully reproducible
  - 'Clean theme-adaptive chrome: explicit font sizes (22px title, 16px axis titles,
    14px tick labels) via window.ANYPLOT_TOKENS, first (only) series correctly uses
    Imprint brand green #009E73, identical between light and dark renders'
  - Y-axis-only grid (Highcharts' default xAxis.gridLineWidth=0 keeps vertical gridlines
    off) matches the style guide's grid guidance for line/area charts without extra
    code
  - Legend correctly omitted for a single-series chart
  - Both axis titles are descriptive with units ('Frequency (Hz)', 'Amplitude (dB)')
  - Animation disabled on both chart and series per the Highcharts contract; credits
    disabled; backgroundColor transparent
  weaknesses:
  - The spec's Notes section suggests 'highlighting peak frequencies or annotating
    dominant components' - no dataLabels/annotation marks the 440 Hz fundamental or
    its harmonics, so the viewer has to infer which peak is the fundamental from position
    alone. Adding a small dataLabel or Highcharts annotation on the 440 Hz peak (e.g.
    'Fundamental (A4)') would strengthen data storytelling without needing any add-on
    module.
  - Design is a competent, well-configured default area chart (single hue fill + line)
    but doesn't go beyond the standard treatment - no distinctive Highcharts-specific
    feature (e.g. plotLines/plotBands to mark octave bands, or a data label on the
    fundamental) that would set it apart from a generic area chart in another library.
  - Visual hierarchy relies entirely on the natural amplitude decay of the harmonics;
    a deliberate emphasis technique (e.g. a subtle plotLine at the noise floor, or
    a callout on the fundamental) would make the 'signal vs. noise floor' story more
    immediate.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 - not pure white, not dark.
      Chrome: Bold dark title "spectrum-basic · javascript · highcharts · anyplot.ai" centered at top, clearly readable. Dark-gray "Amplitude (dB)" y-axis title (rotated) and "Frequency (Hz)" x-axis title, both descriptive with units. Tick labels (0 to -75 on Y in steps of 5; logarithmic 20/40/60/80/100/200/400/600/800/1k/2k/4k/6k/8k/10k/20k on X) are all legible dark-gray text against the light background. Subtle horizontal-only gridlines, faint and non-competing with the data.
      Data: Single Imprint brand-green (#009E73) line with a light semi-transparent green area fill beneath it, tracing a noisy floor around -70 dB with five sharp decaying peaks (fundamental near 440 Hz reaching about -5 dB, four harmonics of decreasing height up to ~2.2 kHz).
      Legibility verdict: PASS - all text is clearly readable against the light background, no dark-on-light or light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 - not pure black, not light.
      Chrome: Same title, axis titles, and tick labels now rendered in light/white text, clearly legible against the dark background. Same subtle horizontal gridlines, adapted to a light, low-opacity tone.
      Data: The line and area fill use the identical Imprint brand-green (#009E73) as the light render - same hue, same peak shapes and positions - confirming only chrome (background, text, grid) flipped between themes.
      Legibility verdict: PASS - no dark-on-dark failures; all title, axis, and tick text is clearly visible against the near-black background, and the green data line has strong contrast against the dark surface.
