review:
  strengths:
  - 'Primary series correctly uses Imprint brand green #009E73 with fully theme-correct
    chrome in both light and dark renders — no dark-on-dark or light-on-light failures.'
  - Log-frequency x-axis and dB-scale y-axis with unit-labeled axes directly follow
    the spec's guidance for wide frequency ranges and power spectral density.
  - 'Realistic, well-covered machinery-vibration dataset: three distinctly-sized peaks
    (running speed, gear mesh, bearing fault) over a 1/f-shaped noise floor with jitter,
    plus dominant-peak highlighting per the spec''s suggestion.'
  - Deterministic, KISS-structured code — fixed-seed LCG, no functions/classes, no
    fake interactivity.
  weaknesses:
  - Second series (peak markers) uses palette[4] (#AE3030, matte red) instead of the
    canonical next position (#C475FD lavender) — red is the semantic anchor for bad/error/fault,
    but only one of the three highlighted peaks (850 Hz) is actually a fault; the
    other two (60 Hz running speed, 240 Hz gear mesh) are normal operating frequencies,
    so the color choice reads as cherry-picked rather than semantically justified.
    Use the canonical lavender for a generic 'dominant peak' highlight, or reserve
    red only for the true fault frequency.
  - No legend is rendered even though two named series exist ('Power spectrum', 'Dominant
    frequencies') — add a theme-tokenized `legend` block so viewers can identify what
    the ringed markers represent without guessing.
  - The three highlighted peaks aren't labeled with their frequency/role (running
    speed / gear mesh / bearing fault) — a few small text callouts would fulfill the
    spec's 'annotating dominant components' note more fully and strengthen the data
    storytelling.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "Machinery Vibration Spectrum · spectrum-basic · javascript · echarts · anyplot.ai" in dark ink, centered top. X-axis "Frequency (Hz)" (log scale, ticks 4/10/100/1,000/2,048) and Y-axis "Power (dB)" (ticks -35 to 5) both in dark/soft-dark text. Subtle light-gray gridlines, a solid horizontal reference line at 0 dB. No legend is rendered.
      Data: Green (#009E73) line with a light-green translucent area fill tracing a 1/f-shaped noise floor from ~-15 dB at 4 Hz down to a ~-30 dB floor, with three sharp upward peaks. Each of the three peaks is ringed by an open red-outlined circle marker (matte red, palette[4]) marking the dominant frequencies (~60 Hz, ~240 Hz, ~850 Hz).
      Legibility verdict: PASS — all title, axis, and tick text is clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Same title, now in light/white text, centered top. Axis labels and tick labels in light gray/white. Gridlines are subtle and lighter-toned against the dark background. 0 dB reference line still visible in a muted light tone. No legend is rendered (same as light render).
      Data: Same green (#009E73) line and area fill, and the same red-ringed peak markers — colors are identical to the light render; only the background/chrome flipped.
      Legibility verdict: PASS — all title, axis, and tick text is clearly readable against the dark background; no dark-on-dark failures observed anywhere (title, axis names, tick labels all use light ink).
