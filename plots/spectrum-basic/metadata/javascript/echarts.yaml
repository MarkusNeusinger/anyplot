      Data: A green (#009E73) line with a light green translucent area fill traces a 1/f-shaped noise floor with three sharp peaks. Each peak is ringed by an open lavender (#C475FD) circle marker, labeled directly above it: "60 Hz — running speed", "240 Hz — gear mesh", "850 Hz — bearing fault". First series is correctly Imprint brand green; second series is the canonical position-2 lavender.
