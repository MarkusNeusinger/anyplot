review:
  strengths:
  - Clean coord_polar wind-rose implementation with correctly ordered 16-point compass
    and a clear, realistic prevailing-wind (SW) focal point
  - Clever, well-commented workaround for the known ggplot2 coord_polar label-placement
    quirk (manual geom_text compass labels instead of default axis.text.x colliding
    with the boundary circle)
  - 'Correct Imprint palette usage (brand green #009E73 for the single series) and
    fully theme-adaptive chrome — both renders pass the light/dark legibility check'
  - Title format exactly matches the mandated spec, KISS code structure, reproducible
    via set.seed(42), no fake interactivity
  weaknesses:
  - Wind frequency values sum to ~115% across the 16 compass directions (before noise)
    — a distribution explicitly labeled 'Wind frequency (%)' must sum to ≤100% since
    it represents share of occurrences across all directions. Normalize wind_frequency
    (e.g. divide the pre-noise base_frequency vector by its total and multiply by
    100, or rescale by a smaller peak amplitude) so the values form a true percentage
    distribution.
  - panel.grid.major.y uses full-strength INK color (effectively 100% opacity) for
    the concentric radial gridlines instead of a faint tint — the style guide calls
    for 'very subtle, opacity 15-25%' grid lines. Wrap the grid color in scales::alpha(INK,
    0.15) (or similar) so the circles recede behind the data instead of competing
    with it.
  - Data shows a single smooth, unimodal falloff around the prevailing SW direction
    — realistic but doesn't showcase a secondary pattern (e.g. a light land-breeze
    counter-peak) that would demonstrate more of the wind-rose plot type's feature
    range.
  - The manual compass-direction labels (~9.1pt via geom_text size=3.2) sit close
    in size to the y-axis title (10pt), slightly blurring the type hierarchy between
    primary and tick-level text — consider shrinking by 1-2pt for a cleaner hierarchy.
