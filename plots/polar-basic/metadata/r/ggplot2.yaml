review:
  strengths:
  - 'Both flagged issues from Attempt 1 are correctly fixed: wind_frequency is now
    normalized (base_frequency / sum(base_frequency) * 100) so the 16 compass directions
    sum to ~100%, and the radial gridlines now use scales::alpha(INK, 0.2) instead
    of full-strength ink'
  - Verified via pixel-level analysis (ray-casting from the true polar origin through
    each compass label) that all 16 wedges render at the correct angle for their label
    and with radii proportional to the underlying data — the SW prevailing-wind peak
    and the new, subtler NE land-breeze counter-bump both read correctly
  - Clean coord_polar + geom_col wind-rose implementation with a well-commented workaround
    for the ggplot2 quirk where default theta-axis text collides with the polar boundary
    circle (manual geom_text compass labels at a radius just inside grid_max)
  - 'Fully theme-adaptive chrome verified in both renders: identical #009E73 data
    color, warm off-white / near-black backgrounds, all text readable, no dark-on-dark
    or light-on-light failures'
  - KISS code structure, set.seed(42) reproducibility, correct title format, clean
    imports, no fake interactivity
  weaknesses:
  - The new land_breeze_bump (secondary NE counter-peak) is data-model-correct but
    visually imperceptible — in the rendered wedge radii, NE (~4.5%) is barely distinguishable
    from its neighbors N/NNE/ENE (~3.7-4.3%) and is actually smaller than SE (~4.5%)
    on the unrelated far side of the SW peak, so the intended 'dominant onshore wind
    + secondary land-breeze' story does not read as two distinct peaks to a viewer
  - Single hue throughout (brand green only) with no secondary emphasis technique
    (e.g. a subtly different fill/outline on the peak SW wedge) — Design Excellence
    is solid but still short of publication-level polish
  - Compass labels (~8pt) and the y-axis title 'Wind frequency (%)' (10pt) remain
    fairly close in visual weight; a slightly larger gap in the type scale would sharpen
    the hierarchy further
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "polar-basic · r · ggplot2 · anyplot.ai" centered at top in dark ink, comfortably sized (no overflow/clipping). A circular polar grid fills most of the square canvas with concentric radial gridlines at 5/10/15 plus an outer boundary at 20, all rendered as a faint ~20%-opacity ink tint (fixed from Attempt 1's full-strength lines). Radial tick labels (0/5/10/15) and the rotated axis title "Wind frequency (%)" sit outside the circle on the left in dark ink. 16 compass-direction labels (N, NNE, NE, ... NNW) ring the circle at even 22.5° intervals, placed just inside the outer boundary via manual geom_text (avoiding the known coord_polar label/boundary-circle collision).
      Data: Green (#009E73) wedges radiate from the true polar center. Verified via pixel ray-casting through each label's exact angle (not an assumed geometric center) that every one of the 16 wedges renders at the correct compass position: the tallest wedges cluster around S/SSW/SW/WSW (prevailing onshore wind), tapering smoothly to a low, fairly uniform band across N/NNE/NE/ENE/E/ESE, with a very slight (barely perceptible) uptick at NE from the new land-breeze term.
      Legibility verdict: PASS — all text is clearly dark-on-light and readable; no overlaps between labels, title, or data.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Identical layout to the light render. Title, gridlines (same faint alpha treatment), tick numbers, axis title, and all 16 compass labels are rendered in light ink (consistent with INK/INK_SOFT tokens flipped for the dark theme) and are clearly legible against the dark background. No dark-on-dark failures anywhere.
      Data: Confirmed pixel-identical #009E73 wedge colors and shape to the light render (only chrome flipped, as required) — same wedge radii verified via the same ray-cast method.
      Legibility verdict: PASS — no dark-on-dark or light-on-light issues; brand green reads clearly on the dark surface.
