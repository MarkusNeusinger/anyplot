      Data: Green (#009E73) wedges radiate from the center — tallest toward SW/WSW/SSW (bottom-left), shrinking to near-zero toward NE/ENE (right side), clearly showing a single prevailing wind direction. Single series, correct brand green.
      Legibility verdict: PASS — no light-on-light or unreadable text found.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
