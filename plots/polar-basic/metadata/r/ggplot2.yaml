      Data: Green wedges are pixel-identical in hue to the light render (#009E73) — only the chrome (background, text, gridlines) flipped, confirming theme-adaptive tokens were threaded through correctly.
      Legibility verdict: PASS — no dark-on-dark failures; all text and gridlines stand out clearly against the near-black surface.
