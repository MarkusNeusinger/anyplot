    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Bold dark title "polar-basic · javascript · highcharts · anyplot.ai" centered at top, lighter grey subtitle "Average hourly visits over a 24-hour cycle" beneath it. Eight bold dark hour labels (12 AM, 3 AM, 6 AM, 9 AM, 12 PM, 3 PM, 6 PM, 9 PM) ring the outside of the polar plot at 45° intervals — now rendered via real dataLabels on a hidden-marker series instead of raw renderer.text. Four subtle grey concentric rings mark the radial scale, with grey numeric labels (1,000 / 2,000 / 3,000 / 4,000) along the top (12 AM) spoke, plus a new small italic "Visits" unit label just past the outermost ring — the VQ-06 fix from the previous review. Bold "Peak · 3,950" and "Trough · 350" call-outs sit next to the corresponding data points (new this attempt). All chrome text is clearly readable against the light background.
      Data: A single closed green (#009E73) curve with a translucent green fill traces 24 hourly data points (small green-filled circular markers with light stroke) around the circle — low near 12 AM–6 AM (trough ~350–850 visits), rising through the day to a broad peak around 6 PM–9 PM (~3,600–3,950 visits), then falling back toward midnight. First (and only) series correctly uses the Imprint brand green. On close inspection, the markers for the lowest-value hours (roughly 2 AM–6 AM) cluster tightly enough near the center that a few circles touch/overlap slightly.
