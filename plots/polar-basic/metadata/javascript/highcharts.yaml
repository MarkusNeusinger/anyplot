review:
  strengths:
  - Correctly reconstructs a genuine polar coordinate system (angle = hour-of-day,
    radius = visits) despite the core Highcharts bundle lacking highcharts-more, matching
    the spec's core requirement instead of returning NOT_FEASIBLE
  - Hour 0 placed at top with clockwise progression (per spec note 'consider starting
    angle at top for time-based data'), with clean 8-point compass-style hour labels
    (12 AM/3 AM/6 AM/.../9 PM)
  - Radial gridlines at 1,000/2,000/3,000/4,000 are clearly visible but not overwhelming,
    and the scale starts at 0 so the diurnal curve isn't compressed near the center
  - 'First (only) data series correctly uses Imprint brand green #009E73, identical
    in both light and dark renders; theme-adaptive chrome (title, subtitle, hour labels,
    grid, ring labels) is correctly readable in both themes with no dark-on-dark or
    light-on-light failures'
  - Adds a real, data-bound Highcharts scatter series (hidden markers, genuine tooltip
    formatter reporting hour + visit count) layered under the custom-drawn overlay,
    so the interactive HTML actually hovers/tooltips correctly instead of faking it
  - 'Realistic, neutral dataset (hourly website traffic) with a believable diurnal
    shape: overnight trough (~350 visits) and evening peak (~3,950 visits)'
  - Title fontsize scaling formula correctly keeps the mandated title from overflowing
  weaknesses:
  - 'Library Mastery is weak: nearly the entire visual (grid rings, spokes, hour labels,
    ring-scale labels, the data curve and its markers) is drawn manually via chart.renderer
    primitives (circle/path/text) rather than any native Highcharts series or axis
    API — the only real series is a hidden-marker scatter series added purely to back
    the tooltip. This is a clever workaround for the missing highcharts-more polar
    chart, but it scores low on idiomatic usage of the library''s high-level API.'
  - 'VQ-06: the radial scale numbers (1,000/2,000/3,000/4,000) have no attached unit/quantity
    label (e.g. ''Visits'') directly on the chart — the viewer must infer the meaning
    from the subtitle alone. Add a small axis label near the radial scale or top of
    the rings.'
  - DE-03/data storytelling is only 'good' rather than 'excellent' — the diurnal shape
    itself creates hierarchy, but there is no explicit emphasis (e.g. highlighting/annotating
    the ~9 PM peak or the overnight trough) to sharpen the takeaway.
  - Single series only — spec's optional 'category' grouping is unused, so feature
    coverage (DQ-01) shows one clean cycle without demonstrating variation across
    groups/categories.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Bold dark title "polar-basic · javascript · highcharts · anyplot.ai" centered at top, lighter grey subtitle "Average hourly visits over a 24-hour cycle" beneath it. Eight bold dark hour labels (12 AM, 3 AM, 6 AM, 9 AM, 12 PM, 3 PM, 6 PM, 9 PM) ring the outside of the polar plot at 45° intervals. Four subtle grey concentric rings mark the radial scale, with small grey numeric labels (1,000 / 2,000 / 3,000 / 4,000) placed along the top (12 AM) spoke. All chrome text is clearly readable against the light background.
      Data: A single closed green (#009E73) curve with a translucent green fill traces 24 hourly data points (small green-filled circular markers with light stroke) around the circle — low near 12 AM–6 AM (trough ~350–850 visits), rising through the day to a broad peak around 6 PM–9 PM (~3,600–3,950 visits), then falling back toward midnight. First (and only) series correctly uses the Imprint brand green.
      Legibility verdict: PASS — all text is dark-on-light and clearly legible, no overlap between labels, ring-scale numbers, or the data curve.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same layout as the light render — title and subtitle now rendered in white/light-grey, the eight hour labels in white bold text, and the four radial-scale numbers in light grey. Grid rings are faint light-grey circles, still visible but subtle against the dark background.
      Data: The green curve, translucent fill, and markers are visually identical in hue and shape to the light render — same #009E73 brand green, same 24-point diurnal shape (trough near midnight, peak in the evening).
      Legibility verdict: PASS — all text is light-on-dark and clearly legible; no dark-on-dark failures found (title, subtitle, hour labels, and ring-scale numbers are all correctly using light theme tokens).
