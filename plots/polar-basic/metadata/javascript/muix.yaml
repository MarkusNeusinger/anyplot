review:
  strengths:
  - Correctly hand-built a polar chart from ChartContainer + useDrawingArea since
    MUI X community has no native polar component — respects the 'no Pro/Premium,
    no other library' rule instead of faking it
  - 'Theme-correct chrome in both renders — identical #009E73 data color, warm off-white
    / near-black backgrounds, all text legible on both surfaces'
  - Realistic, neutral 24-hour smart-home electricity dataset with a genuine bimodal
    pattern (morning commute + evening peak) that the circular layout is well-suited
    to reveal
  - Radial tick labels get an opaque page-background backing chip so they stay legible
    even where the data polygon crosses underneath them — a thoughtful detail
  - Explicit font sizing throughout (title 28px, angular labels 18px bold, radial
    labels 15px) with a well-utilized square canvas and balanced margins
  - Correct title format and follows the spec's suggested top-start, clockwise time
    convention (12 AM at top, 6 AM right, 12 PM bottom, 6 PM left)
  weaknesses:
  - Data storytelling is implicit only — the two peak clusters (~7-9h morning, ~18-20h
    evening) are visible in the polygon's shape but nothing calls them out; a subtle
    label/annotation or accent on the peak segments would push this from 'shows the
    data' to 'tells the story'
  - 'Library Mastery is limited beyond the initial workaround: once ChartContainer/useDrawingArea
    provide the sized SVG + theme, the polar rendering itself is fully custom SVG
    with no further MUI X-specific capability used (e.g. ChartsTooltip, interaction/highlight
    context) — nothing distinguishes it further from a plain hand-rolled SVG polar
    chart'
  - Hourly markers (r=5 CSS px) are visible but slightly conservative for a sparse
    24-point series — bumping to r≈6-7 would give them a touch more presence against
    the connecting line
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Bold dark title "polar-basic · javascript · muix · anyplot.ai" centered at top; four bold angular labels at cardinal positions (12 AM top, 6 AM right, 12 PM bottom, 6 PM left); five concentric radial gridline rings labeled "1 kWh" through "5 kWh" in a lighter gray, each with an opaque backing chip so the label stays legible where the data polygon crosses it. All chrome renders in dark ink against the light background and is clearly readable.
      Data: A single closed polygon in the Imprint brand green (#009E73) with a light green translucent fill, 3px stroke, and small green-filled circular markers (with light-background stroke) at each of the 24 hourly points. The polygon shows a small, low, mostly-round overnight/midday base with two clear outward bulges — one toward the lower-right (6 AM–12 PM sector, the morning commute peak around hour 7–9) and a larger one toward the upper-left (6 PM–12 AM sector, the evening peak around hour 18–20), correctly reflecting the 24-hour kWh dataset in the code.
      Legibility verdict: PASS — all text (title, angular labels, radial tick labels) is clearly readable against the light background.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title and angular labels, now rendered in light/white ink, clearly visible against the dark background. Radial gridline rings are a dim gray, visible but subtle; the "N kWh" tick labels use a softer light-gray tone with dark backing chips (matching the dark page background) so they remain legible over the data fill.
      Data: The polygon shape, fill, stroke, and marker colors are pixel-identical in hue to the light render — same Imprint green #009E73, same translucent fill and markers — only the chrome (background, grid, text) has flipped for the dark theme, as required.
      Legibility verdict: PASS — no dark-on-dark or light-on-light failures observed; all title, angular, and radial-tick text is clearly visible against the near-black background.
