review:
  strengths:
  - 'Composes a true polar coordinate system inside MUI X''s ChartsContainer: a custom
    PolarLayer reads useXScale/useYScale so rings, spokes and the polygon share the
    exact scales the native ScatterPlot markers use, keeping every one of the 24 points
    at its own angle and radius'
  - 'Clock convention fits the time-based data: midnight at the top, clockwise travel,
    labels every 3 h (12 AM, 3 AM, 6 AM, ...), so the morning (8 AM) and evening (7
    PM) peaks are easy to read in the correct directions'
  - Radial scale starts at 0 with a computed round ring step (1 kWh up to 5 kWh),
    so the 0.8-4.9 kWh range uses the full radius and the night-time low isn't crushed
    into the center
  - 'Clear chrome hierarchy: quarter-turn labels bold in ink and 3-hour labels lighter
    in inkSoft, quarter spokes slightly stronger, outer ring heavier; ring labels
    sit on page-colored pills so they stay readable over the fill'
  - 'Theme tokens are threaded through every hand-drawn element (grid, ink, inkSoft,
    pageBg marker halos), so the light and dark renders are equally legible with identical
    #009E73 data color'
  - skipAnimation and a default-exported component meet the harness contract; the
    HTML keeps the native scatter tooltip
  weaknesses:
  - 'VQ-06 (both): the radial values carry only a unit (''1 kWh'' ... ''5 kWh'') and
    the measured quantity ''Electricity Draw'' (the KWH column name) appears nowhere
    in the render, so a reader cannot tell what is being plotted → name the quantity
    on the chart, e.g. a radial-axis caption from KWH or the optional descriptive
    title prefix. Likely cause: the series label is used only for the hidden legend
    and tooltip, and the ring labels reuse just the unit parsed from KWH.'
  - 'Suggestion: the ''1 kWh'' pill''s page-colored box cuts a small rectangle out
    of the green fill near the 11 PM–1 AM edge; placing the ring labels along an empty
    spoke (for example toward 3 AM, where the data stays near the center) would keep
    the fill uninterrupted.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the full 2400x2400 square canvas.
      Chrome: bold dark title "polar-basic · javascript · muix · anyplot.ai" centered at the top (~36% of width). Clock labels around the circle every 3 h: 12 AM (top), 6 AM (right), 12 PM (bottom), 6 PM (left) in bold dark ink; 3 AM, 9 AM, 3 PM, 9 PM in lighter grey. Five concentric rings labeled 1-5 kWh along the 12 AM spoke on small page-colored pills; light-grey rings and spokes, outer 5 kWh ring a bit heavier. All text readable.
      Data: 24 hourly points as #009E73 circles with thin page-colored halos, joined in a closed straight-edged polygon with a translucent green fill. Lobes reach toward 7-8 AM (~3.4-3.8 kWh) and 6-7 PM (~4.6-4.9 kWh); the night minimum (~0.8-1.0 kWh) is near the center around 2-4 AM.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title and quarter labels in near-white, 3-hour labels and ring labels in light grey; rings and spokes in subtle dark grey that is still visible; ring-label pills in the dark page color. No dark-on-dark text.
      Data: identical #009E73 points, line and translucent fill (darker-looking on the dark page); marker halos switch to the dark page color. Only the chrome flips.
      Legibility verdict: PASS
