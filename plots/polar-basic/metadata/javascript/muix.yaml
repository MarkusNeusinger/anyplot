review:
  strengths:
  - Correctly identifies that @mui/x-charts 7.29.1 (community) has no polar/radial
    component (RadarChart landed in v8) and composes a genuine, non-decorative polar
    layer via ChartContainer + useDrawingArea, backed by a real scatter series on
    a matched linear xAxis/yAxis so ChartsTooltip/hover work on the actual data, not
    faked chrome.
  - Explicit 'Morning peak' / 'Evening peak' callouts with dashed leader lines create
    real data storytelling and a clear focal point beyond the raw polygon shape.
  - 'Both renders pass the theme-readability check: warm off-white/near-black backgrounds,
    all text uses theme-adaptive INK/INK_SOFT tokens, brand green #009E73 identical
    and clearly visible on both surfaces, no dark-on-dark or light-on-light failures.'
  - Radius tick labels get an opaque backing chip and are drawn last so they stay
    legible where the data polygon crosses the axis spoke - a subtle correctness detail
    for a continuous (non-fixed-max) polar chart.
  - Deterministic, realistic 24-hour smart-home electricity draw data with a plausible
    bimodal (commute + evening) shape; angular labels at the four standard clock positions
    per the spec's notes; title format matches SC-04 exactly.
  weaknesses:
  - Secondary text (radius ring labels at 15px CSS, peak-callout italic labels at
    14px CSS) is noticeably smaller than the title/hour labels and risks becoming
    hard to read once scaled down to a ~400px-wide mobile thumbnail - consider nudging
    both up 2-3px.
  - No legend or explicit units are printed near the title (only inferred from the
    'kWh' ring labels) - a one-line axis/units caption would remove any residual ambiguity
    for a reader unfamiliar with the ring convention.
  - Only a single series is demonstrated (category dimension from the spec is left
    unused) - acceptable since it's marked optional in the spec, but a light secondary
    series (e.g. a prior-week comparison) would have shown off more of the plot type's
    feature space.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 - not pure white.
      Chrome: Title "polar-basic · javascript · muix · anyplot.ai" in bold dark ink at top-center; clock-position angular labels (12 AM top, 6 AM right, 12 PM bottom, 6 PM left); concentric ring labels "1 kWh" through "5 kWh" along the top spoke with an opaque backing chip; dashed leader lines with italic "Morning peak" / "Evening peak" callouts. All chrome renders in dark ink and is clearly legible against the light background.
      Data: A single brand-green (#009E73) closed polygon with ~22% fill opacity tracing the 24 hourly kWh readings, real scatter markers at each hour (green fill, subtle halo ring), thicker halo accents on the two peak hours. Two visible bulges (morning ~8 AM, evening ~7 PM) read clearly as the story the polar layout is meant to reveal.
      Legibility verdict: PASS - no light-on-light text, all labels readable.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 - not pure black.
      Chrome: Same title, angular labels, ring labels, and peak callouts, now rendered in light ink/off-white, fully legible against the dark background. Grid rings and spokes are still subtle but visible.
      Data: Same brand-green #009E73 polygon, markers, and halo treatment - colors are pixel-identical to the light render; only the chrome (background, text, grid) has flipped.
      Legibility verdict: PASS - no dark-on-dark text found; brand green remains clearly visible against the near-black surface.
