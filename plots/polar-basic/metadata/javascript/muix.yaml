review:
  strengths:
  - Every hour sits exactly at its angle and radius (checked 00h 1.2, 06h 2.1, 12h
    2.3, 18h 4.6 kWh against the rings), clockwise with midnight at the top
  - 'Clock-face label hierarchy: bold ink quarter turns (12 AM, 6 AM, 12 PM, 6 PM)
    over softer 3-hour labels'
  - 'Graded grid: light rings and spokes with a heavier outer ring, readable yet behind
    the data in both themes'
  - Ring tick labels carry the kWh unit on page-colored pills, so they stay legible
    over grid and fill
  - 'Idiomatic MUI X v9 composition: ChartsContainer with hidden linear axes, useXScale/useYScale
    for the custom polar layer, native ScatterPlot marks'
  - Theme tokens threaded through every custom SVG element; data color identical in
    both renders
  weaknesses:
  - 'Suggestion: the default scatter tooltip in the HTML shows the internal Cartesian
    x/y coordinates; a valueFormatter that reports the hour and kWh would make the
    hover readable.'
  - 'Suggestion: the 1 kWh tick pill covers a patch of the area fill near the 12 AM
    spoke; a lower pill opacity or a placement on the outer side of the spoke would
    keep the fill continuous.'
