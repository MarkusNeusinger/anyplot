review:
  strengths:
  - 'Idiomatic ECharts polar setup: category angleAxis with startAngle=90/clockwise=true
    correctly renders a compass-style wind rose (N at top, directions increasing clockwise)
    rather than the mathematical default.'
  - 16-point compass wind-rose data (Gaussian falloff peaking at SW) gives an immediate
    visual focal point and tells a clear directional story without needing annotations.
  - barCategoryGap creates a clean 'flower' silhouette with visible gaps between petals,
    a nice refinement over touching bars.
  - Theme tokens correctly threaded through title, angleAxis/radiusAxis labels, axis
    lines, and split lines; both renders are fully legible with identical brand-green
    data color and correct chrome flip.
  - Deterministic, dependency-free data generation; clean KISS script structure with
    no fake interactivity.
  weaknesses:
  - radiusAxis has no name/unit label — the numeric ticks (10/20/30) never state what
    they represent; add radiusAxis.name (e.g. 'Frequency (%)') styled with t.inkSoft
    so the radial scale is self-explanatory.
  - The comment/data claims frequencies are 'percentage of observations' per direction,
    but the 16 generated values sum to ~254% instead of ~100% — for a wind-rose frequency
    distribution the per-direction percentages should sum to roughly 100%; normalize
    the Gaussian output (e.g. divide by its sum and scale to 100) so the radial values
    are factually consistent with the stated units.
  - Design is clean but fairly close to a well-configured default (single flat green
    fill, no secondary refinement like a subtly varied opacity or outline) — could
    push Design Excellence further with a touch more polish (e.g. per-bar opacity
    ramp or a light outline stroke) without breaking the Imprint single-series rule.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "polar-basic · javascript · echarts · anyplot.ai" is bold dark text, centered top, fully visible and not clipped. 16 compass-direction labels (N, NNE, NE, ... NNW) ring the circle in dark-gray secondary text, all readable and non-overlapping. Radial tick labels (10/20/30, partially near center) are smaller gray text, legible. Grid: faint concentric circles at radial intervals, subtle and not competing with the data.
      Data: Single-series green (#009E73) polar bar/wind-rose, 16 wedges with visible gaps between them, forming an asymmetric "flower" with the longest petals toward SW/SSW/WSW (prevailing wind direction) and shortest toward NE/ENE.
      Legibility verdict: PASS — all text clearly readable against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Title renders in light/off-white text, fully visible. Compass labels and radial tick labels render in light-gray tones, all legible against the dark background. Grid circles are faint light gray, subtle.
      Data: Same green (#009E73) petals, identical shape and magnitude to the light render — confirms data colors are unchanged between themes; only chrome (background/text/grid) flipped.
      Legibility verdict: PASS — all text is clearly readable, no dark-on-dark failures observed anywhere (title, compass labels, and tick labels all have sufficient contrast against the near-black surface).
