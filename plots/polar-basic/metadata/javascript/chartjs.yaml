review:
  strengths:
  - 'Imprint categorical palette used in exact canonical order across all 8 compass-direction
    wedges, with the first series correctly rendered in brand green #009E73'
  - 'Plot backgrounds verified pixel-exact against the style guide: #FAF8F1 in light,
    #1A1A17 in dark; data colors identical between themes'
  - Clean, idiomatic Chart.js polarArea implementation — theme tokens correctly threaded
    into title, pointLabels, ticks, grid, and angleLines
  - No text overlap and no edge clipping in either render; wedge radii accurately
    reflect the underlying wind-speed values
  - Realistic, neutral data scenario (average wind speed by compass direction) with
    plausible values and a believable prevailing-wind pattern (SW/W dominant)
  - 'animation: false set correctly and exactly one canvas mounted into #container
    per the harness contract'
  weaknesses:
  - Radial scale has no descriptive label or unit — the ticks show bare numbers (10,
    12, 14, 16) with nothing indicating they represent wind speed or its unit (e.g.
    'Wind Speed (km/h)'); a viewer cannot tell what the radius encodes from the image
    alone
  - 'Design Excellence is only at the well-configured-default level: the wedge borderColor:
    t.pageBg separation is a nice touch, but there is no additional visual hierarchy,
    emphasis, or storytelling device (e.g. calling out the prevailing SW/W wind direction)
    beyond the raw data display'
  - Radial scale max (16) sits well above the largest data value (14.2), leaving a
    visibly empty outer ring on 6 of 8 wedges and slightly weakening data-ink ratio
    — consider a tighter `suggestedMax` (e.g. ~15) so the outer gridline is closer
    to the data
  - Only basic radial-scale customization is used (pointLabels, ticks, grid, angleLines
    colors); no additional Chart.js-distinctive feature (e.g. custom tooltip formatting
    surfaced in the HTML view, or scale-level distance/angle customization) is showcased
    beyond what any polarArea config would set
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, pixel-verified at RGB(250,248,241) = #FAF8F1 — matches the style guide exactly, not pure white.
      Chrome: Title "polar-basic · javascript · chartjs · anyplot.ai" in dark ink, clearly visible at the top with generous margin (no clipping). Compass point labels (N, NE, E, SE, S, SW, W, NW) and radial tick numbers (10, 12, 14, 16) are dark/muted gray, both fully legible against the light background. Radial gridlines are thin and subtle, not competing with the data.
      Data: 8 polarArea wedges, one per compass direction, colored in the Imprint palette canonical order (N=#009E73 green, NE=lavender, E=blue, SE=ochre, S=matte red, SW=cyan, W=rose, NW=lime). Each wedge has a thin border in the page background color for separation. Wedge radii correctly track the wind-speed values (SW largest at 14.2, E smallest at 5.1).
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, pixel-verified at RGB(26,26,23) = #1A1A17 — matches the style guide exactly, not pure black.
      Chrome: Title and compass/tick labels render in light off-white/gray tones, clearly readable against the dark background — no dark-on-dark failures observed. Radial gridlines remain subtle but visible.
      Data: Same 8 wedge colors as the light render, byte-identical Imprint hues (green/lavender/blue/ochre/red/cyan/rose/lime) — only the chrome (background, text, grid) flipped between themes as required.
      Legibility verdict: PASS
