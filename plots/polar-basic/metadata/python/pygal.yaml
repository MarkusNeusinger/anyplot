review:
  strengths:
  - 'Correct chart type: pygal.Radar maps theta (hour-of-day) to angle and radius
    to temperature, exactly matching the polar-basic spec.'
  - Angular labels restricted to cardinal hours (00:00/06:00/12:00/18:00) per the
    spec note, avoiding a cluttered 24-label ring while still drawing all 24 spokes/vertices.
  - inner_radius=0.1 avoids compressing data near the center, directly satisfying
    the spec's 'appropriate radial scale' requirement.
  - Font sizes (title_font_size=66, label_font_size=56, major_label_font_size=44,
    legend_font_size=44, value_font_size=36) match the pygal library doc's canonical
    Native-pixel values exactly.
  - Theme tokens (PAGE_BG/INK/INK_MUTED) are correctly threaded through the Style
    object; data color (#009E73) is identical between light and dark renders, only
    chrome flips.
  - Deterministic data generation via np.random.seed(42).
  - Correct 2400x2400 square canvas, an appropriate choice for a symmetric radial
    chart.
  - Output files follow the plot-{THEME}.png / plot-{THEME}.html convention with no
    bare plot.png.
  weaknesses:
  - dots_size=6 is on the small side for a sparse 24-point series on a 2400px canvas
    — bump to ~8-10 for more prominent markers per the data-density heuristic.
  - Side axis labels (06:00, 18:00) are rendered rotated 90 degrees, requiring a head-tilt
    to read; still fully legible but a minor ergonomics ding.
  - Design is a fairly standard filled radar with no additional visual emphasis (e.g.
    no callout/annotation on the noon peak or midnight trough) to strengthen the data-storytelling.
  - Only leverages one distinctive pygal Radar feature (inner_radius); other library-specific
    radar options (e.g. range/box shaping, per-point value labels) are unused.
