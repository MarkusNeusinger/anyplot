      Data: single series in brand green #009E73: translucent area fill from the center, a 2.5-pt connecting line closing the loop, 24 round markers with page-colored edges. Overnight values (9 PM–5 AM) cluster near the center; a morning bulge peaks around 8 AM (~65) and the lunch peak around 1 PM (~100).
