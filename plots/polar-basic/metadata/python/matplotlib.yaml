review:
  strengths:
  - 'Idiomatic matplotlib polar setup: projection=''polar'', set_theta_zero_location(''N'')
    with set_theta_direction(-1) puts midnight at the top and runs the 24-hour cycle
    clockwise like a clock face'
  - Radial tick labels moved to 67.5° with set_rlabel_position so they sit in the
    empty early-morning quadrant, clear of the data
  - Double-peak café footfall (8 AM morning rush, 1 PM lunch peak) gives the polar
    form a clear, readable cyclical shape and follows the change request
  - Layered fill_between + line + markers with page-colored marker edges keeps every
    hourly reading distinct in both themes
  - 'Adaptable code: tidy df with column constants, radial limit and angular ticks
    derived from the data and constants, exact 2400×2400 canvas without bbox_inches=''tight'''
  weaknesses:
  - 'VQ-05 (both): the radial axis title ''Visitors per hour'' sits rotated at the
    far left canvas edge, about 800 px away from the radial tick values it explains
    (upper right, at 67.5°) → place it next to the radial tick labels or drop it into
    the title, so the axis title and its values read together. Likely cause: ax.set_ylabel(...,
    labelpad=30) on polar axes, which anchors the label to the left side of the bounding
    box.'
  - 'DQ-03 (both): a café shows about 3–10 visitors per hour between 12 AM and 5 AM
    → near-zero (closed) overnight values, about −5 visitors per hour. Likely cause:
    the 6-visitor baseline plus normal noise applies to every hour of the day.'
  - 'Suggestion: the angular hour labels (10 pt) are noticeably larger than the radial
    value labels (8 pt); bringing them closer would balance the two scales.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, not pure white; 2400×2400 square canvas.
