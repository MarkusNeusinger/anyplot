    compass ordering, and explicit angular direction/rotation settings
  - Title matches the mandated '{spec-id} · python · plotly · anyplot.ai' format exactly
  weaknesses:
  - Radial axis title 'Frequency' is rendered along the same N-direction (angle=90)
    line as the radial tick labels, crowding/overlapping the '10%'/'15%' tick text
    in both renders — move the radial axis to an angle that doesn't collide with the
    title (e.g. offset polar.radialaxis.angle away from a tick-label-dense region,
    or increase title standoff) so the title and tick values no longer compete for
    the same space
  - Visual refinement is close to library defaults beyond the palette and gap-based
    wedge separation — consider a lighter outer polar boundary line or slightly more
    restrained radial gridlines to raise the design polish further
  - About half the compass sectors (roughly N through ESE/SE) collapse to near-invisible
    slivers since wind is heavily WSW-prevailing; this is realistic data, not a bug,
    but a data label or subtle callout on the dominant WSW/SW/SSW sectors would sharpen
    the storytelling further
