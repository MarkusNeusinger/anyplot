review:
  strengths:
  - coord_polar(theta='x', start=0, direction=1) puts 00:00 at the top and runs clockwise,
    the clock convention for time-of-day data, with HH:00 labels every 3 hours
  - Donut-style radial limits derived from the data (min − 0.4·span) keep the coldest
    hours clear of the converging spokes, so the inner values are not squeezed into
    the center
  - 'The one-panel gggrid with the page color paints the whole square canvas in both
    themes; chrome tokens (INK, INK_SOFT, translucent grid) read cleanly on #FAF8F1
    and #1A1A17'
  - layer_tooltips() gives an hour/temperature readout on hover in the HTML output
  weaknesses:
  - 'SC-02 (both): the translucent area has a page-colored disk cut out at the 00:00
    reading''s radius (about 5 °C), and the disk''s edge reads as a reference ring
    the spec''s C5 excludes; the fill does not reach the radial floor → fill from
    the scale''s lower limit up to the curve, with no inner hole. Likely cause: geom_polygon
    over df_path, whose closing row (hour 24 back to hour 0) traces a full circle
    at the first reading''s radius that the polygon fill punches out; a geom_ribbon(ymin=lower
    limit, ymax=temperature) over df_path or dropping the fill removes it.'
  - 'DQ-02 (both): neighbouring hourly readings jump by about 4-5 °C (20:00 ≈ 13 °C
    → 21:00 ≈ 7.5 °C; 22:00 ≈ 6.5 °C → 23:00 ≈ 2.5 °C), which real hourly air temperature
    does not do → hour-to-hour noise of about 0.5 °C (sd 2 → ~0.5, −1.5). Likely cause:
    np.random.randn(len(hours)) * 2.'
  - 'Suggestion: the diurnal maximum sits at 12:00 and the minimum at 00:00; shifting
    the phase so the peak falls mid-afternoon and the low before dawn would read more
    like a real station.'
  - 'Suggestion: the radial tick labels (0, 10, 20) sit at the far left canvas edge,
    detached from their rings; breaks every 5 °C would make radii easier to read.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 edge to edge across the whole 2400x2400 canvas.
      Chrome: title 'polar-basic · python · letsplot · anyplot.ai' top-left in dark ink; angular labels 00:00 (top) clockwise through 21:00 every 3 hours in INK_SOFT; radial labels 0/10/20 at the left edge with the rotated 'Temperature (°C)' axis title; thin translucent concentric rings and 8 spokes; dark outer circle. All readable.
      Data: one #009E73 closed path with 24 points and a light green translucent fill; the fill has a page-colored disk at the center whose edge (about the 00:00 reading's radius) reads like an extra ring. Warm lobe toward 12:00, cold dip toward 23:00.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17 edge to edge.
      Chrome: title in light ink, angular and radial labels in light grey INK_SOFT, rings and spokes subtle light-grey, outer circle mid-grey; no dark-on-dark text.
      Data: identical #009E73 path, points and translucent fill (dark green tint) as the light render; same inner disk artifact.
      Legibility verdict: PASS
