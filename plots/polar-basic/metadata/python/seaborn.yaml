review:
  strengths:
  - 'Polar geometry correctly follows the spec notes: theta offset to top (12 o''clock)
    with clockwise direction, matching the recommended time-based convention'
  - Continuous traffic magnitude is encoded with the Imprint sequential colormap (imprint_seq,
    green->blue) on the scatter hue, while the connecting line and area fill use the
    brand green consistently across light and dark renders
  - Angular and radial tick labels are deliberately decluttered (every-2-hours ticks,
    radial label parked in the low-traffic 14:00-16:00 wedge) to avoid collisions
    - the in-code comment shows this was iterated on to fix a prior overlap
  - Theme-adaptive chrome is correctly threaded through (backgrounds, ink tokens,
    grid, colorbar face/edge colors) and the canvas gate passes at the exact 2400x2400
    square target
  - Realistic, neutral synthetic dataset (24-hour website traffic with plausible morning/evening
    peaks) with a fixed random seed for reproducibility
  weaknesses:
  - 'Title is missing the mandated language segment: fig.suptitle reads ''Website
    Traffic by Hour · polar-basic · seaborn · anyplot.ai'' but the required format
    is ''{Descriptive Title} · {spec-id} · {language} · {library} · anyplot.ai'' -
    ''python'' must appear between ''polar-basic'' and ''seaborn''.'
  - Design storytelling is solid but stops short of a strong focal point - consider
    annotating the evening-peak value directly (e.g. a small text callout on the brightest/highest
    point) to sharpen DE-03.
  - Library usage is idiomatic but not especially distinctive - the continuous-hue
    scatterplot + colorbar workaround is a reasonable seaborn pattern but doesn't
    showcase a seaborn-specific feature beyond scatterplot/lineplot on a matplotlib
    polar axes.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 - not pure white, not dark.
      Chrome: Title "Website Traffic by Hour · polar-basic · seaborn · anyplot.ai" in dark ink at the top, spanning ~82% of canvas width, fully visible with margin above (not clipped). Angular tick labels (00:00 through 22:00, every 2 hours, clockwise from top) are dark-gray and clearly legible. Radial tick labels (50/100/150/200) sit in the lower-left wedge in dark-gray, with the "Visitors/hr" radial-axis label placed just outside the plot circle along the same wedge, not colliding with any angular tick. Colorbar on the right ("Traffic Volume", ticks 100-200+) uses dark-gray tick text on the light background.
      Data: 24 scatter points connected by a closed line and filled polygon. The line/fill use the brand green (#009E73); the scatter markers are colored by a continuous green-to-blue gradient (imprint_seq) keyed to traffic volume, with light-background-colored marker edges for separation. Morning and evening traffic peaks (around 08:00-10:00 and 18:00-20:00) are visibly the largest-radius, bluest points.
      Legibility verdict: PASS - all title, tick, and colorbar text is clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 - not pure black, not light.
      Chrome: Same title text now rendered in light ink, fully legible and identically positioned/sized. Angular and radial tick labels switch to light-gray and remain clearly legible against the dark background. The "Visitors/hr" label and colorbar tick labels are also light-colored and readable. No dark-on-dark text was found anywhere in the render.
      Data: Same 24-point scatter/line/fill combination with identical green-to-blue gradient and brand-green line/fill as the light render - only the chrome (background, grid, text, spine, colorbar face) flips; the data colors are pixel-identical to the light render.
      Legibility verdict: PASS - all chrome elements are clearly visible against the dark background; no dark-on-dark failures observed.
