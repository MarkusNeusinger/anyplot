review:
  strengths:
  - Correctly builds a polar chart from Cartesian primitives (geom_path/geom_segment/geom_point/geom_text)
    since plotnine has no coord_polar — a legitimate, well-documented workaround rather
    than a matplotlib fallback
  - Radial grid scale is now data-driven (grid_max derived from activity.max() with
    15% headroom) so the shape fills most of the polar area instead of being compressed
    near the center
  - 'Title includes the mandated language segment and matches the exact required format:
    ''Hourly Activity Levels · polar-basic · python · plotnine · anyplot.ai'''
  - Radial axis now carries a descriptive 'Activity Level' title, positioned off-axis
    (114°) to avoid the 06:00/18:00 valleys and clear of the enlarged peak marker
  - Theme-adaptive chrome is threaded through correctly — all text and gridlines are
    legible in both light and dark renders with no dark-on-dark or light-on-light
    failures, and the brand-green data color is identical across themes
  - Peak-hour marker is enlarged for a clear visual focal point, and hour labels sit
    at standard 3-hour intervals around the circle
  - Reproducible (np.random.seed(42)), clean imports, no fake interactivity, saves
    plot-{THEME}.png as required
  weaknesses:
  - The activity formula (20 + 40*sin((hour-6)*pi/12)^2) has a period of 12 hours,
    producing two nearly-equal peaks at 00:00 and 12:00 with troughs at 06:00 and
    18:00 — an unusual real-world pattern for 'hourly activity levels' (most human/traffic/energy
    activity profiles have one daytime peak and one nighttime trough, not two equal
    peaks). Consider a single-period sin (period 24h) for a more realistic diurnal
    curve.
  - Several consecutive hourly points in the low-activity trough regions (e.g. around
    hours 4-5 and 16-17) sit close enough together that the connecting geom_path segment
    between them all but disappears under the marker circles, leaving a barely-visible
    sliver of green — increase spacing or slightly reduce marker size relative to
    line length in dense regions.
  - Hour=0 is placed at the bottom of the chart (270°) rather than the top; the spec's
    Notes suggest starting time-based data at the top (90°) — not a hard rule, but
    worth aligning with the convention since nothing else in the design depends on
    the current orientation.
  - '''Activity Level'' radial axis label states the metric but not its scale/units
    — a brief unit hint (e.g. ''0-100 scale'') would remove any ambiguity about what
    the number represents.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white, not dark.
      Chrome: Title "Hourly Activity Levels · polar-basic · python · plotnine · anyplot.ai" renders in dark ink at the top, fully visible with ~1% margin above (no clipping). Hour labels (00:00, 03:00, 06:00, ... 21:00) are medium-gray and legible around the circle at 3-hour intervals. Radial value labels (20/40/60/80) and the bold "Activity Level" axis title are lighter gray, positioned along the 12:00-15:00 diagonal, clear of data and other labels. Dashed circular gridlines and straight radial spokes are subtle gray at low alpha.
      Data: A single brand-green (#009E73) closed polygon connects 24 hourly points via geom_path, with matching green-filled/off-white-stroked point markers; the peak hour (~12:00) is emphasized with a visibly larger marker. The shape now reaches close to the outermost grid ring, using the radial scale well (no more inner-only compression from earlier attempts).
      Legibility verdict: PASS — all text is clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black, not light.
      Chrome: Same title, hour labels, and "Activity Level" radial title, now rendered in light ink / light gray tones, fully legible. Gridlines and spokes remain subtle. Layout, margins, and label positions are pixel-identical to the light render except for the chrome color flip.
      Data: The brand-green polygon, point markers, and enlarged peak marker are visually identical in hue, size, and position to the light render — confirming only chrome (background/text/grid) changed between themes, not the data colors.
      Legibility verdict: PASS — all text is clearly readable against the dark background; no dark-on-dark failures (title, hour labels, and radial labels all use light ink tokens, not the dark ink token).
