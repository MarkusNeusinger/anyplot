review:
  strengths:
  - 'Clever, honest workaround for plotnine''s missing coord_polar: the circular grid,
    radial spokes, and hour labels are hand-built from geom_path/geom_segment/geom_point/geom_text
    with coord_fixed(ratio=1), producing a genuine polar chart without any fake/simulated
    interactivity.'
  - 'Theme-adaptive chrome is correctly threaded through: PAGE_BG/INK/INK_SOFT/INK_MUTED
    all read cleanly in both the FAF8F1 light and 1A1A17 dark renders, with identical
    brand-green data color across both.'
  - The peak activity hour is emphasized with a larger marker, giving the chart a
    clear focal point and light data storytelling.
  - Correct Imprint brand green (#009E73) as the sole series color, single-series
    legend correctly omitted.
  - Clean KISS script structure, seeded reproducible data (np.random.seed(42)), no
    unused imports, saved correctly as plot-{THEME}.png at the square 2400×2400 canvas.
  weaknesses:
  - 'Radial scale wastes most of the chart area: activity values only reach ~65-70
    (base_activity maxes at 60, +8 noise), yet the grid rings extend to 100 and scale_x/y_continuous
    limits go to ±145 — the data polygon is compressed into roughly the inner quarter
    of the polar area, leaving a large unused outer annulus. This directly conflicts
    with the spec note ''use an appropriate radial scale that doesn''t compress data
    near the center.'' Tighten the grid_rows radii / axis limits to fit the actual
    data range so the shape fills more of the circle.'
  - The radial axis has no descriptive label — only bare numbers (25/50/75/100) appear
    near the 06:00 spoke with no 'Activity Level' (or similar) label indicating what
    they measure; a reader must infer this solely from the title.
  - 'Title is missing the mandated language segment: current title is ''Hourly Activity
    Levels · polar-basic · plotnine · anyplot.ai'' but the required format is ''{Descriptive
    Title} · {spec-id} · {language} · {library} · anyplot.ai'' — insert ''· python''
    between ''polar-basic'' and ''plotnine''.'
  - The radius value labels (25/50/75/100) sit very close to / slightly crowd the
    low-activity data points clustered near the center along the 04:00-06:00 arc —
    increase the label x-offset or reduce label size slightly to avoid the crowding.
  - There is a noticeably large empty gap between the title and the top of the polar
    circle (roughly 10% of canvas height) that is not mirrored elsewhere, giving slightly
    unbalanced margins — reduce the gap or add balancing bottom margin.
  - Code comment says '0 hours = top, clockwise' but the actual geometry places hour
    0 at the bottom with hours increasing counter-clockwise (12:00 at top, 06:00 at
    right) — the comment is misleading relative to the real mapping; doesn't affect
    the rendered output but should be corrected for maintainability.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "Hourly Activity Levels · polar-basic · plotnine · anyplot.ai" is dark ink text, clearly legible at the top. Hour labels (00:00, 03:00, 06:00, 09:00, 12:00, 15:00, 18:00, 21:00) are medium-gray, all clearly legible around the circle. Radial value labels (25, 50, 75, 100) are lighter gray, legible but positioned close to nearby low-activity data points near the center-right. Dashed circular gridlines and straight radial spokes are subtle light-gray, visible but unobtrusive.
      Data: A single brand-green (#009E73) closed polygon connects 24 hourly points with a dashed-adjacent solid path; regular points are green-filled circles with a light stroke, and one point (the daily peak, near 12:00) is rendered noticeably larger for emphasis. The shape occupies only the inner portion of the drawn grid (activity values top out well below the 100 ring), leaving a large unused outer band of grid.
      Legibility verdict: PASS (all text is clearly readable against the light background; no light-on-light issues).

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Title, hour labels, and radial value labels all render in light ink/gray tones (matching the light render's chrome mapped to the dark tokens) and remain clearly legible against the dark surface. Gridlines/spokes are still subtle light-gray at low alpha, visible but not competing with data.
      Data: The same brand-green (#009E73) polygon and points, identical in color, size, and layout to the light render — confirming only chrome flipped between themes, not data color. The same radial-scale underutilization (shape confined to inner ~quarter of the grid) is present here too.
      Legibility verdict: PASS (all text is clearly readable against the dark background; no dark-on-dark failures — tick/hour labels and title all use light INK/INK_SOFT/INK_MUTED tokens, not black-on-black).
