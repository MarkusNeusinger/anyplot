review:
  strengths:
  - Manually reconstructs a true polar coordinate system in Altair (which has no native
    theta/radius encoding) via a clean theta->x/y trig conversion, with concentric
    dashed radial gridlines and angular spokes that read as a proper polar grid
  - 'Continuous color encoding correctly uses the imprint_seq gradient (#009E73 ->
    #4467A3) matching the library''s mandated single-polarity colormap, identical
    across both light and dark renders'
  - Radial scale-reference labels (e.g. '9°C', '21°C') are deliberately placed at
    angles where the data path is far from that ring, avoiding crossing the line -
    a thoughtful, non-obvious layout decision
  - Marker size (200, sparse 24-point data) and line weight follow the data-density
    heuristic well; white/cream point strokes give clean definition against both theme
    backgrounds
  - 'Correctly follows the altair canvas contract: sized the inner view to 500x460,
    then pad-only (never crop) to the canonical 2400x2400 square, matching prompts/library/altair.md
    exactly'
  - Adds genuine hover interactivity (selection_point + size/tooltip encoding) for
    the HTML export without faking anything in the static PNG
  weaknesses:
  - Legend title 'Temp (°C)' visually overlaps the legend's own frame border on both
    the left and right sides, in both light and dark renders - the 'T' and ')' glyphs
    cross the drawn box outline. Not canvas-edge clipping (AR-09), but a real, reproducible
    overlap defect. Fix by widening the legend (larger gradientLength/legend width)
    or trimming titleFontSize/titleLimit so the title fits inside its frame.
  - 'Title omits the required {language} token: current SC-04 format is ''{spec-id}
    · {language} · {library} · anyplot.ai'' but the rendered title is ''polar-basic
    · altair · anyplot.ai'' - should read ''polar-basic · python · altair · anyplot.ai''.'
  - Diurnal temperature curve is a pure sinusoid with its minimum at 00:00 and maximum
    at 12:00; real-world diurnal cycles trough near dawn (~05:00-06:00) and peak in
    the mid-afternoon (~15:00-16:00) due to thermal lag. Shifting the phase (e.g.
    using (hours - 15) instead of (hours - 6)) would make the hourly pattern more
    factually realistic.
  - The legend sits quite close to the right canvas edge (~49px / ~2% margin) - comfortably
    inside the canvas and not clipped, but tighter than the generous whitespace called
    for elsewhere; a little more right-side padding would balance the composition.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 - not pure white.
      Chrome: Bold dark title "polar-basic · altair · anyplot.ai" centered at top; 8 bold dark clock labels (00:00, 03:00, ... 21:00) around the perimeter at 3-hour intervals; dashed light-gray concentric radial gridlines and straight angular spokes at low opacity; two italic gray radial scale-reference labels ("21°C", "9°C") placed off the data path; legend "Temp (°C)" top-right with a vertical green-to-blue gradient bar and tick labels 5/10/15/20/25. All chrome text is dark-on-light and clearly readable, EXCEPT the legend title glyphs ("T" and the closing ")") visibly cross the legend's own frame border line - a minor overlap defect, not an illegibility issue.
      Data: A closed 24-point loop (one point per hour) connecting via a green line, each point filled with a green-to-blue continuous color scale (imprint_seq: #009E73 low temp -> #4467A3 high temp) and a light stroke edge. The loop is tightest (smallest radius, greenest) near the top (00:00, coolest hours) and widest (largest radius, bluest) near the bottom (12:00, warmest hour), correctly reflecting the hourly temperature cycle. First/only data series correctly starts from the Imprint brand green.
      Legibility verdict: PASS (all text readable; the legend-title/frame overlap is a visual polish issue, not a readability failure).

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 - not pure black.
      Chrome: Same title, clock labels, radial/angular gridlines and ring-reference labels, all correctly re-colored to light-on-dark (off-white title/labels, light-gray gridlines and ring labels). Legend box re-themed with light text/border on dark fill. No dark-on-dark failures found - all chrome text is clearly legible against the near-black background. Same legend-title/frame-border overlap defect reproduces here as in the light render.
      Data: Identical green-to-blue point colors and identical loop shape/positions as the light render - only the chrome (background, gridlines, text, legend fill/border) flipped theme, confirming palette consistency across themes.
      Legibility verdict: PASS (all text readable in both themes; no dark-on-dark or light-on-light failures observed).
