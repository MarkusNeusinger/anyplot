review:
  strengths:
  - 'Correct theme-adaptive chrome: background, ink, ink_soft, and grid colors are
    pixel-exact (#FAF8F1 light / #1A1A17 dark) and fully readable in both themes.'
  - 'Imprint palette compliance: first (only) series is exactly #009E73, identical
    across both renders.'
  - Thoughtful clock-face orientation (theta_0 = -pi/2, direction = -1) matching the
    real-world time-of-day convention, with a deliberate rtickangle offset to avoid
    radial-tick/data clash.
  - 'Clean layered composition: translucent band fill + line + white-stroked markers
    gives visual depth without clutter.'
  - Realistic, well-scaled household energy consumption data with a clear bimodal
    morning/evening pattern and plausible noise.
  - Idiomatic, KISS-structured Makie code using PolarAxis, band!, lines!, scatter!
    with explicit reproducibility (Random.seed!(42)).
  weaknesses:
  - Title occupies only ~27% of the canvas width, notably below the ~50-70% guideline
    for a custom-length title — a slightly larger titlesize (e.g. 24) would improve
    visual balance without risking overflow.
  - The outer polar spine (full circle frame) stays fully visible at default weight;
    softening it further or trimming tick marks would push Visual Refinement higher.
  - No direct annotation calls out the morning/evening peaks — the story relies entirely
    on the bimodal silhouette, which reads clearly but a small peak label would strengthen
    the storytelling.
  - Single-series only (the spec's optional 'category' field is unused) — a second
    labeled series (e.g. weekday vs weekend) would round out feature coverage for
    a 'basic' polar chart.
  - PolarAxis usage is solid but generic beyond the tick/orientation customization
    — leaning further into distinctive PolarAxis features (e.g. rlimits, a reference
    band) would raise Library Mastery.
