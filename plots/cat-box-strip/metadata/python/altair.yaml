review:
  strengths:
  - Composite mark_boxplot styled part by part (translucent box fill, solid stroke,
    INK median, INK_SOFT whiskers) keeps box, median and whiskers readable under 168
    points in both themes
  - Jitter is seeded and bounded via xOffset with a fixed band-unit scale, so every
    point stays inside its own department band and the light and dark renders match
    exactly
  - Data covers tight, wide-with-outliers and bimodal distributions, so the strip
    reveals shapes the boxes alone hide
  - Canvas lands on 3200x1800 with the documented 620x320 view and pad-never-crop
    step
  - Native tooltips with escaped fields and readable titles in the HTML output
  weaknesses:
  - 'Suggestion: the y domain reaches 110 on a score capped at 100; ending the axis
    at 100 would keep the frame inside the possible range'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole 3200x1800 canvas.
      Chrome: bold dark title 'cat-box-strip · python · altair · anyplot.ai' centred at top; y axis 'Quality Score' 30-110 with subtle grid; x axis 'Department' with Engineering, Marketing, Sales, Support. All text dark and readable.
      Data: four #009E73 boxes with translucent fill and solid green stroke, dark INK median lines, dark-grey whiskers; 168 translucent green points jittered inside each band. Engineering tight high, Marketing wide with low outliers, Sales low with outliers at 35 and 92-95, Support bimodal.
