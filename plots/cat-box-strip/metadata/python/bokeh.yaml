review:
  strengths:
  - Uses bokeh's native Whisker annotation with a vbar box and a dodge()-positioned
    median segment, so the box, its median line and its 1.5 IQR whiskers are built
    from bokeh models rather than hand-drawn shapes
  - Strip overlay uses bokeh.transform.jitter(width=0.3, range=p.x_range) on the categorical
    axis, keeping every point at its value and inside its own category band
  - Translucent points (fill_alpha 0.55, size 20) leave the box edges, the heavy median
    line and the whiskers readable through and between them in both themes
  - 'Theme tokens are threaded through every chrome element: warm off-white and near-black
    backgrounds, INK title and axis labels, INK_SOFT ticks and box outlines; the median
    flips to INK so it stays the strongest line in both renders'
  - Realistic, neutral scenario (plant growth in cm by soil type) with unequal group
    sizes and a few genuine outliers beyond the whiskers, on a shared y-axis that
    is not forced to zero
  - Whisker ends computed from the data as the furthest observations inside 1.5 IQR,
    so points beyond them read correctly as outliers
  weaknesses:
  - 'Suggestion: bokeh''s jitter transform draws its offsets in the browser without
    a seed, so the light and dark renders place the same points at different sideways
    positions; precomputing the offsets with numpy from the seeded generator would
    make the two renders identical.'
  - 'Suggestion: the 0.18-alpha green box fill turns into a very dark green in the
    dark render; a slightly higher fill alpha there would set the box apart from the
    background a little more.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the plot area and border, no pure white.
      Chrome: bold dark title "cat-box-strip · python · bokeh · anyplot.ai" at top left (about 47 % of the width), italic axis titles "Soil Type" and "Plant Growth (cm)" in dark ink, tick labels in INK_SOFT gray (10–60 on y; Sandy, Clay, Loamy, Silty on x), faint horizontal grid only, left and bottom axis lines only. All text clearly readable.
      Data: four boxes with a light #009E73 tint, gray outlines, a heavy near-black median line and gray whiskers with caps; about 160 translucent #009E73 points jittered across each box, with outliers above Clay (58) and Loamy (54) and below Silty (12) beyond the whiskers. The first series is #009E73.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17, no pure black.
      Chrome: title and axis titles in light ink #F0EFE8, tick labels in light gray INK_SOFT, subtle grid; no dark-on-dark text anywhere.
      Data: same #009E73 points and box tint (which reads as dark green on the dark surface), light gray box outlines and whiskers, and a light median line. Data colors are identical to the light render; only chrome flips. Jitter offsets differ between renders (client-side random), values are the same.
      Legibility verdict: PASS
