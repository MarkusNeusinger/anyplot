review:
  strengths:
  - Axes-level sns.boxplot and sns.stripplot share one categorical axis
  - fliersize=0 hands the outliers to the strip layer, so no point is drawn twice
  - Translucent Imprint-violet points with page-colored rims over opaque green boxes
    keep the overlap readable
  - The data varies center, spread and sample size across the batches, and Batch C
    has clear outliers
  weaknesses:
  - 'VQ-03 (dark): the box outlines, medians, whiskers and caps keep seaborn''s default
    dark gray and nearly vanish on the #1A1A17 background → light INK_SOFT (#B8B7B0)
    lines. Likely cause: sns.boxplot without linecolor=INK_SOFT.'
  - 'VQ-05 (both): the canvas is 4748x2653, not a canonical size → 3200x1800 (-1548
    x -853). Likely cause: figsize=(16, 9) at dpi=300 with bbox_inches=''tight''.'
  - 'SC-04 (both): the title ''cat-box-strip · seaborn · anyplot.ai'' lacks the language
    segment → ''cat-box-strip · python · seaborn · anyplot.ai''. Likely cause: the
    ax.set_title string.'
  - 'DQ-02 (both): the unit ''Quality Score (points)'' is an abstract score with no
    measurable quantity → a concrete measured quantity with its unit (for example
    ''Tensile Strength (MPa)''). Likely cause: the y column name and ylabel.'
  - 'Suggestion: a short subtitle naming the comparison to make would give the chart
    a focal point.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1; the canvas is 4748x2653, tight-cropped rather than 3200x1800.
      Chrome: title 'cat-box-strip · seaborn · anyplot.ai' in dark ink, axis titles 'Manufacturing Batch' and 'Quality Score (points)' at the same size, ticks Batch A–D and 40–100 in INK_SOFT, subtle y-grid, top and right spines removed. All text is readable.
      Data: four #009E73 boxes with near-black outlines, medians and whiskers; translucent #C475FD jittered strip points with page-colored rims. Batch C has outliers beyond its whiskers.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
