review:
  strengths:
  - A single go.Box trace with boxpoints='all', jitter=0.5 and pointpos=0 draws the
    strip directly over each box, so plotly computes the quartiles and keeps jitter
    inside each category band
  - 'Both renders theme-correct: #FAF8F1 / #1A1A17 surfaces, INK/INK_SOFT chrome,
    identical #009E73 data in both'
  - Example data shows tight, wide, outlier-bearing and bimodal groups of different
    sizes on a shared value axis that is not forced to zero
  - HTML export keeps plotly's native hover with per-point values and box statistics
  weaknesses:
  - 'DQ-02 (both): the four study methods are labelled ''Method A''–''Method D'',
    which reads as abstract placeholders → named methods such as ''Flashcards'', ''Practice
    Tests'', ''Re-reading'', ''Group Study''. Likely cause: the keys of the groups
    dict.'
  - 'Suggestion: the gap between the title and the plot area (about 120 px at full
    size) could be tightened by lowering margin t or setting title y, giving the boxes
    more height.'
