review:
  strengths:
  - Box plot and strip overlay share one data-driven value axis (padded min/max),
    so boxes and point clouds compare directly without a forced zero
  - 'Theme tokens threaded through every chrome element: title, labels, ticks, spines,
    grid and box outlines flip cleanly between #FAF8F1 and #1A1A17'
  - Translucent small points with a page-colored edge keep the boxes, red median lines
    and whiskers readable through the strip in both themes
  - Example data shows different centres, spreads, sample sizes and two-sided outliers
    in Treatment B
  weaknesses:
  - 'SC-03 (both): every outlier appears twice, once as a boxplot flier at the category
    centre (dark-edged marks at 15, 35, 80 and 82 in Treatment B) and once as a jittered
    strip point, so those observations are over-counted → each observation drawn once.
    Likely cause: ax.boxplot with flierprops while the strip scatter already draws
    all values; pass showfliers=False.'
  - 'DQ-02 (both): the groups are labelled ''Control'', ''Treatment A''–''Treatment
    C'' and the measure ''Response value (score)'', which read as generic placeholders
    → name the treatments and the measured outcome (for example a pain score on a
    0–100 scale under named dosing regimens). Likely cause: the GROUP/RESPONSE constants
    and the label list.'
  - 'Suggestion: MEDIAN_COLOR could reference IMPRINT_PALETTE[4] instead of repeating
    the hex.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, 3200x1800.
      Chrome: title 'cat-box-strip · python · matplotlib · anyplot.ai' in dark ink at top; x-axis 'Treatment group' with Control, Treatment A, B, C; y-axis 'Response value (score)' with ticks 20-80; subtle horizontal grid; left/bottom spines in ink-soft. All text readable.
      Data: four translucent #009E73 boxes with ink-soft outlines, whiskers and caps, #AE3030 median lines; ~150 small translucent green points jittered within each band; y range ~11-88 from the data. Treatment B outliers at 15, 35, 80, 82 appear twice (flier at centre plus jittered point).
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, axis titles and ticks in light ink, whiskers/caps/spines in light grey, grid faint but visible; no dark-on-dark text.
      Data: identical #009E73 points and box fill (darker-looking over the dark page at alpha 0.4) and #AE3030 medians; layout identical to light.
      Legibility verdict: PASS
