review:
  strengths:
  - Canvas, fonts and title all on the pygal reference values (3200x1800, 66/56/44,
    full mandated title)
  - Value axis 44-100 is not forced to zero, so the boxes and point clouds compare
    directly (C4)
  - Points jittered only sideways within each box's band, with per-group seeds for
    reproducibility
  - 'Clean adaptable layout: column constants with roles, a Data block that binds
    df, plot code reading only df'
  - Native pygal HTML output keeps per-point tooltips in the interactive view
  weaknesses:
  - 'VQ-03, SC-02 (both): the median line (and the whiskers) are drawn as thin strokes
    in the box''s own hue, so the median at e.g. ~65 in High School and ~87 in PhD
    almost disappears inside the 0.7-opacity fill, against C1/C3 → a clearly visible
    median, e.g. drawn in the INK token at about 6-8 px. Likely cause: the median
    series takes its color from color_sequence (same hue as the box fill) and the
    stroke_style width does not separate it from the fill.'
  - 'VQ-03 (both): every box shows a stray vertical line from its lower-left corner
    (x = center - 0.25) down to the x-axis, which reads like an extra whisker → no
    mark below Q1 other than the whisker. Likely cause: fill=True on the quartile_box
    series makes pygal close the filled area to the axis baseline; draw the box without
    area fill to the baseline (e.g. fill only the closed polygon, or stroke-only box).'
  - 'SC-02 (both): the strip points render fully opaque (solid dots inside the boxes,
    most visible in the dark render), while the Notes and C3 ask for translucent points
    → points at about 0.5-0.7 opacity. Likely cause: Style(opacity=0.7) applies to
    fills only; the dots get no opacity setting.'
  - 'Suggestion: dropping the vertical x-guides that run through every box center
    would leave the whiskers as the only vertical lines.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, correct.
      Chrome: title 'cat-box-strip · python · pygal · anyplot.ai' in dark ink at the top; axis titles 'Education Level' and 'Test Score' and ticks (50-100, the four category names) dark and clearly readable; dashed guides on both axes subtle.
      Data: four boxes in #009E73 (High School), #C475FD (Bachelor's), #4467A3 (Master's), #BD8233 (PhD) at 0.7 fill opacity with jittered solid dots of the same hue on top; whiskers and caps thin same-hue lines; median lines barely visible inside the boxes; a thin vertical line drops from each box's lower-left corner to the x-axis.
      Legibility verdict: PASS

