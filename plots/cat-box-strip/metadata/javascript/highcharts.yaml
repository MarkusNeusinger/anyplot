review:
  strengths:
  - 'Correctly works around the missing highcharts-more/boxplot module: box, whiskers,
    and median are drawn from primitive SVG shapes (renderer.path/rect) anchored to
    real axis pixel coordinates via toPixels(), driven by actual computed quartile/IQR
    statistics — exactly the pattern the library prompt recommends.'
  - 'Full spec feature coverage: median, Q1/Q3 box, IQR-fenced whiskers, jittered
    semi-transparent strip points, deliberately varying sample sizes across groups
    (80/65/50/35 — ''sample size awareness''), and genuine outliers (bus delays at
    91/95) rendered beyond the whisker for outlier-with-context.'
  - Imprint palette applied in canonical order (green/lavender/blue/ochre) and kept
    identical between light and dark renders; all chrome (ink, inkSoft, grid) is theme-adaptive
    via window.ANYPLOT_TOKENS.
  - Each series keeps Highcharts' default per-index marker symbol (circle/diamond/square/triangle),
    giving free redundant shape encoding across the four categories.
  weaknesses:
  - 'Strip/scatter markers are drawn with lineWidth: 0 (no edge stroke). The style
    guide calls for a white/background-colored edge on scatter markers for definition,
    especially with overlapping points — add e.g. lineColor: t.pageBg (or white),
    lineWidth: 1 to the marker config so points stay distinct from each other and
    from the box border in denser clusters (Car: 80 pts, Bus: 65 pts).'
  - In the densest groups (Car, Bus) jittered points still clump visibly near the
    median line — widen the jitter spread slightly (e.g. ±0.32 instead of ±0.275 of
    category width) or trim marker radius to ~3.5-4px to reduce overplotting without
    hurting legibility.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "cat-box-strip · javascript · highcharts · anyplot.ai" is bold dark ink, clearly legible; x-axis title "Transportation Mode" and y-axis title "Commute Time (minutes)" are dark-gray (inkSoft) and legible; tick labels (0-100 on y, category names on x) are legible; horizontal gridlines are subtle/light and don't compete with data.
      Data: Four groups — Car (green #009E73 box + jittered dots), Bus (lavender box + diamonds, includes two outlier points near 91/95 above the whisker), Bike (blue box + squares), Walk (ochre box + triangles). First categorical series is confirmed brand green. Box shows median line, Q1/Q3 edges, whiskers extend to IQR fence; strip points are semi-transparent and jittered around each category's x position.
      Legibility verdict: PASS.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Title, axis titles, and tick labels all switch to light/off-white ink and remain clearly readable against the dark surface; no dark-on-dark text found. Gridlines remain subtle (light, low-opacity).
      Data: Identical box/strip layout and colors to the light render (green/lavender/blue/ochre, same outlier points visible for Bus) — confirms only chrome flips between themes, data colors are constant.
      Legibility verdict: PASS.
