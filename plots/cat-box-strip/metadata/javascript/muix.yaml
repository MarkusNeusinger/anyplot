review:
  strengths:
  - 'Composes the chart from community MUI X v9 primitives: ChartsContainer with a
    band x-axis and a linear y-axis, ChartsGrid, and a custom SVG layer that reads
    useXScale/useYScale. Every box, whisker and point sits on MUI''s own scales, so
    the axes and the marks cannot drift apart.'
  - Box statistics (linear-interpolated quartiles, Tukey 1.5×IQR whiskers) are computed
    from the records. Points beyond the whiskers stay visible as part of the strip,
    which is what the spec's permission allows.
  - Points use a 0.5 fill opacity and a thin page-colored outline. The jitter is confined
    to 28 % of each band, so every point stays in its own category and at its exact
    value.
  - The median is drawn in the ink token (near-black on light, near-white on dark)
    over boxes tinted with their category color. The median reads at once in both
    themes.
  - A realistic commute-time scenario with a seeded RNG. A 12 % traffic-jam tail on
    Car gives that group a long right skew and points beyond the whiskers, while the
    other modes stay compact.
  - The y-axis domain comes from the data with 8 % padding and is not typed by hand,
    so all five categories share one value axis.
  weaknesses:
  - 'Suggestion: the 22 px mandated title fills only about a third of the width. A
    slightly larger title (about 26 px) would give the header more presence over the
    large plot area.'
  - 'Suggestion: the mulberry32 step appears twice, once for the data uniforms (lines
    38–43) and once for the jitter (lines 90–93). Drawing the jitter uniforms from
    the existing uniform stream would remove the second copy.'
  - 'Suggestion: about 70 px of empty space separates the y-axis title from its tick
    labels. A narrower y-axis band (width about 64) would tighten the left edge.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white, consistent with #FAF8F1. Not pure white.
      Chrome: bold title "cat-box-strip · javascript · muix · anyplot.ai" centered at the top, about 34 % of the width. Below it, a muted subtitle: "Box: median, Q1–Q3, whiskers to 1.5×IQR · Dots: 225 jittered observations · 5 groups (Transport mode)". The y-axis title "Commute time (minutes)" is rotated, with ticks 0–80 every 10. The x-axis title "Transport mode" sits under the category ticks Bike, Walk, Train, Bus, Car. A dashed, faint horizontal grid. All text is dark ink and readable.
      Data: five box-and-whisker glyphs in Imprint order: Bike #009E73 (brand green, first), Walk #C475FD lavender, Train #4467A3 blue, Bus #BD8233 ochre, Car #AE3030 matte red. Each box is tinted at about 18 % and has a solid outline, whisker caps, and a thick near-black median line. 45 jittered translucent points per group sit over each box with thin page-colored outlines and stay inside their own band. Car shows a long upper tail with points beyond the whisker at about 59–75 min. Boxes, medians and whiskers stay readable through the points.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black, consistent with #1A1A17. Not pure black.
      Chrome: the title, subtitle, axis titles and tick labels all flip to light ink and are clearly readable. The grid is faint and dashed. The axis lines are light. No dark-on-dark text anywhere.
      Data: the same five palette colors as the light render (green, lavender, blue, ochre, red). Only the median lines flip to near-white (ink token), which keeps them prominent on the tinted boxes. The point outlines take the dark page color. Translucent points read slightly deeper on the dark surface but remain distinct. Brand green is clearly visible.
      Legibility verdict: PASS
