review:
  strengths:
  - Elegant single-hue box + strip composition built via useXScale/useYScale — exactly
    the documented fallback pattern for a chart type MUI X community has no native
    series for
  - 'Deterministic seeded PRNG (mulberry32) produces realistic, differentiated distribution
    shapes per category: tight Bike/Walk, wider Bus, right-skewed Car with traffic-jam
    outliers'
  - Theme-adaptive median line and chrome via window.ANYPLOT_TOKENS — Imprint brand
    green (#009E73) is pixel-identical between light and dark renders, only chrome
    flips
  - Descriptive subtitle explains the box+strip semantics and sample size (n=45 per
    mode), aiding first-time readers
  - Y-axis domain padded and rounded to clean 5-minute intervals rather than raw min/max
  weaknesses:
  - Missing `skipAnimation` prop on `<ChartContainer>` — the muix library rules mandate
    it on every chart component as a hard rule; harmless here since `series={[]}`,
    but should still be set for correctness/future-proofing
  - Design Excellence is monochrome-only (single green hue with alpha layering) —
    could gain polish by using the `neutral`/`muted` semantic anchors for secondary
    structural elements
  - No callout/annotation flags the two clear Car outliers (~72-75 min) that visually
    break the whisker pattern — a small text callout would elevate data storytelling
    from 'visual hierarchy present' to 'clear guided insight'
  - Title occupies well under 50% of canvas width at the auto-scaled font size — could
    grow slightly toward the 50-70% guideline for stronger visual weight without risking
    overflow
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white, not dark.
      Chrome: Bold dark title "Commute Time by Transport Mode · cat-box-strip · javascript · muix · anyplot.ai" centered at top; italic gray subtitle below explaining box/strip semantics and n=45; dark "Transport Mode" x-axis label and dark "Commute Time (minutes)" y-axis label; gray tick labels on both axes; subtle horizontal gridlines. All chrome elements are clearly legible against the light background.
      Data: Five box-and-strip groups (Bike, Walk, Train, Bus, Car) in brand green (#009E73) — light-green translucent box fill, solid green border, black median line, and semi-transparent green jittered dots with faint light-colored edge strokes overlaying each box. Distribution shapes differ meaningfully: Bike/Walk are tight and low, Train is fairly consistent, Bus is wider, and Car is widest with two clear high outliers (~72-75 min) above its whisker cap.
      Legibility verdict: PASS — no text is light-on-light; every chrome element reads clearly.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black, not light.
      Chrome: Title and axis labels render in light/white text, subtitle and tick labels in light gray — all clearly visible against the dark background. Gridlines are faint but visible. No dark-on-dark failures observed anywhere (title, subtitle, axis labels, tick labels all flip correctly).
      Data: Same five groups in the identical brand green (#009E73) box fills/borders and jittered dots as the light render — confirmed pixel-identical data coloring. The median line correctly flips from black (light theme) to white (dark theme) via the theme-adaptive `ink` token, remaining visible against the green box fill in both themes.
      Legibility verdict: PASS — no text is dark-on-dark; median line is visible in both themes.
