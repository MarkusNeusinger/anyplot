review:
  strengths:
  - Correct box+strip combo built from Chart.js floating-bar ranges (whisker line
    + IQR box + median highlight bar) overlaid with a jittered scatter strip — a legitimate,
    idiomatic workaround for Chart.js's lack of a native box-plot type, since box-plot
    support only exists in an unpinned community plugin that is out of scope.
  - 'Imprint palette applied correctly and consistently: first category (Low Light)
    is exactly #009E73, the remaining three categories follow canonical palette positions
    2-4 (#C475FD, #4467A3, #BD8233), and the data colors are pixel-identical between
    the light and dark renders.'
  - 'Theme-adaptive chrome is fully correct in both renders: title/axis-label/tick
    colors, grid color, and even the median bar (driven by t.ink) flip appropriately
    between light and dark with no dark-on-dark or light-on-light failures.'
  - Realistic, neutral dataset (plant height in cm vs. light exposure condition) with
    increasing spread across groups (sd 3→6) and visible outliers beyond the whisker
    fences in the Low Light and Medium Light groups, satisfying the feature-coverage
    and data-quality bar.
  - Deterministic LCG + Box-Muller RNG with a fixed seed (42) and a hand-rolled quantile
    function give full reproducibility without needing any external dependency.
  weaknesses:
  - Whiskers are drawn as a plain thin bar from whiskerMin to whiskerMax with no end
    caps, so at a glance the range reads as a generic floating bar rather than an
    unambiguous box-plot whisker — add short horizontal cap markers (e.g. a tiny extra
    bar/point dataset) at each whiskerMin/whiskerMax.
  - The strip overlay in the densest / widest-spread group (Full Sun, mean 41 sd 6,
    n=80) shows visible point pile-up near the top of the box where jittered dots
    overlap heavily — reduce pointRadius slightly (e.g. to ~3.5) or lower alpha (e.g.
    to ~0.45), or widen the jitter range a touch, to reduce clutter in that region.
  - Design Excellence is solid but still fairly generic — consider adding a subtle
    white edge/stroke on the strip points per the style guide's overlapping-marker
    guidance for extra definition, and/or a light callout on the clear ascending trend
    (more light → taller plants) to push the storytelling beyond just showing the
    data.
  - The median bar is thin and reads a little faint against the box fill in the light
    render — a small increase in its relative thickness or a subtle end-cap would
    make it pop more clearly as 'the median line' rather than just a darker stripe
    inside the box.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white surface, consistent with #FAF8F1 — not pure white.
      Chrome: Bold black title "cat-box-strip · javascript · chartjs · anyplot.ai" centered at top; black "Plant Height (cm)" y-axis title and black "Light Condition" x-axis title; dark-gray tick labels on both axes; subtle horizontal gridlines only (no vertical gridlines). All chrome text is clearly legible against the light background.
      Data: Four groups on the x-axis (Low Light, Medium Light, High Light, Full Sun), each built from a semi-transparent color-filled IQR box with a matching-color border, a thin vertical whisker line through the box, a dark horizontal median bar inside the box, and a jittered cloud of ~80 semi-transparent dots per group scattered around the box. Colors run Low Light = brand green (#009E73), Medium Light = lavender, High Light = blue, Full Sun = ochre — exactly the canonical Imprint order. Distributions widen and shift upward left-to-right (more light → taller, more variable plants), with a couple of visible low outliers in the Low Light and Medium Light groups.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black surface, consistent with #1A1A17 — not pure black.
      Chrome: Title, axis titles, and tick labels have all flipped to light/off-white tones and remain clearly legible; gridlines are still subtle and visible against the dark background. No dark-on-dark text anywhere.
      Data: Same four groups, same box/whisker/median/strip structure. The categorical fill and border colors (green, lavender, blue, ochre) are visually identical to the light render — only the median bar's inner color and the surrounding chrome adapted (median bar reads as a light stripe against the box on dark, versus a dark stripe on light, both correctly using the theme-adaptive ink token). Data colors otherwise unchanged, confirming palette identity across themes.
      Legibility verdict: PASS
