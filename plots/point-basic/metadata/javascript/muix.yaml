review:
  strengths:
  - Custom error-bar overlay built with useXScale/useYScale hooks correctly fills
    a gap in MUI X community (no built-in error-bar series) while staying strictly
    within the community package
  - Error bars have proper end caps, rounded line joins, and a white/pageBg-stroked
    point marker that reads as a clean halo against both themes
  - Dashed zero-reference line with 'No effect' label directly follows the spec's
    suggestion for a reference line
  - Backgrounds, ink, and the single-series brand green (#009E73) are correctly theme-adaptive
    and identical in hue between light and dark renders
  - Realistic, neutral dataset (Cohen's d effect sizes for a tutoring program across
    8 pilot sites) with plausible confidence intervals
  weaknesses:
  - 'SC-03/DE-03: The category (site) order actually rendered on the y-axis is Boston,
    Chicago, Denver, Atlanta, Seattle, Miami, Austin, Portland (top-to-bottom) in
    both renders — this matches neither the `sites` array''s declared order (Denver,
    Portland, Boston, Austin, Chicago, Seattle, Atlanta, Miami) nor its reverse, nor
    alphabetical order, nor any sort by estimate. The code comment explicitly states
    the data is ''Sorted descending by estimate so the visual hierarchy reads top-to-bottom'',
    but the shipped chart does not reflect that intent (values top-to-bottom are 0.42,
    0.31, 0.55, 0.12, 0.28, -0.05, 0.38, 0.45 — non-monotonic). Each point/CI is still
    paired with the correct label, so this is not a data-corruption bug, but the promised
    visual hierarchy is broken. Investigate why the yAxis band scale (`scaleType:
    ''band'', data: sites.map(row => row.site)`) is not preserving the given array
    order — it may need an explicit ordering safeguard rather than relying on implicit
    band-scale domain order.'
  - 'Duplicate/malformed file header: lines 1-10 contain two stacked header blocks
    (an old one with a stale ''Quality: 89/100 | Created: 2026-09-05'' line, followed
    by a second ''anyplot.ai'' header), with the `//# anyplot-orientation: landscape`
    directive sandwiched in between instead of sitting on its own line at the very
    top of the file as the muix header convention requires. Clean this up to a single
    header block with the orientation directive as the first line.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Title "point-basic · javascript · muix · anyplot.ai" bold dark text top-left; x-axis title "Effect Size (Cohen's d)" with tick labels every 0.05 from -0.40 to 1.00; y-axis shows 8 site name labels (Boston, Chicago, Denver, Atlanta, Seattle, Miami, Austin, Portland from top to bottom) with no y tick marks; subtle vertical gridlines only; dashed vertical reference line at x=0 labeled "No effect" in soft ink. All text is clearly readable — dark ink on the light background.
      Data: Each row shows a horizontal green (#009E73) whisker between the lower and upper CI bound, with vertical caps at both ends and a filled green circle (white-stroked) at the point estimate. All 8 sites are shown with plausible, distinct interval widths.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Same layout as the light render — title, axis labels, tick labels, and the "No effect" reference-line label are all rendered in light ink and clearly legible against the dark background. Gridlines are subtle but visible.
      Data: Whiskers, caps, and point markers are the identical brand green (#009E73) as the light render — only the marker's outer stroke color flips to match the dark page background (halo effect), confirming chrome-only theme adaptation.
      Legibility verdict: PASS (no dark-on-dark text found)

    Cross-render note: the y-axis category order (Boston, Chicago, Denver, Atlanta, Seattle, Miami, Austin, Portland) is identical between both renders, but does not match the descending-by-estimate order the implementation's own code comment claims — see weaknesses.
