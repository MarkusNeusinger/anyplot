review:
  strengths:
  - Composes the chart from ChartsContainer + ChartsXAxis/ChartsYAxis/ChartsGrid and
    draws the intervals, caps and markers through the useXScale/useYScale hooks, so
    every mark sits exactly at its data value on MUI X's own scales
  - Categories sorted by estimate (Denver 0.55 down to Miami -0.05), giving a clear
    ranked reading as the spec asks
  - Markers (r=10) carry a page-colored halo (stroke = pageBg) so they stay distinct
    on top of their 3 px interval lines in both themes; caps drawn at both ends of
    every interval
  - Single dashed 'No effect' reference line at d = 0 via native ChartsReferenceLine
    in the inkSoft token, the one reference line the Notes allow
  - Value-axis domain computed from the bounds plus the null value with 10% padding,
    so every interval and the reference line are fully shown
  - 'Theme tokens threaded through all chrome (ink for title and category labels,
    inkSoft for ticks); data color #009E73 identical in both renders; skipAnimation
    set'
  weaknesses:
  - 'VQ-06 (both): the category (y) axis has no title, although the code defines SITE
    = "Pilot Site" → label the y axis with the SITE constant ("Pilot Site") and widen
    its band if needed. Likely cause: yAxis config without label.'
  - 'Suggestion: the 0.05 tick step yields 26 crowded x tick labels and vertical grid
    lines; a coarser step (e.g. 0.1 via tickInterval or tickNumber) would calm the
    axis.'
  - 'Suggestion: the mandated title fills only about 28% of the width at 22 px; a
    slightly larger title would balance the canvas.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, not pure white.
      Chrome: title "point-basic · javascript · muix · anyplot.ai" top-left in bold dark ink; x-axis title "Effect Size (Cohen's d)" centered below; x ticks -0.35 to 0.90 in steps of 0.05 in muted dark ink; eight city names (Denver, Portland, Boston, Austin, Chicago, Seattle, Atlanta, Miami) as y tick labels in dark ink; y axis has no title. Subtle light-gray vertical grid lines; left and bottom axis lines only. Dashed dark-gray vertical reference line at 0 with "No effect" label at its foot. All text readable.
      Data: eight horizontal intervals in #009E73 with vertical caps at both ends and a filled #009E73 circle (white-ish halo) at each estimate, sorted top-to-bottom by estimate (Denver 0.55 ... Miami -0.05). Atlanta and Miami intervals cross zero.
      Legibility verdict: PASS

