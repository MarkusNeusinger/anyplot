review:
  strengths:
  - 'Correct point-estimate-with-CI chart type: circular markers on a horizontal band
    axis, capped whisker error bars, matching the spec''s category/estimate/lower/upper
    data model exactly.'
  - 'Genuine engineering within the community-only constraint: since @mui/x-charts
    has no built-in error-bar series, the custom overlay is drawn against the real
    cartesian scales via the public useXScale/useYScale hooks rather than reaching
    for a Pro chart type or another library.'
  - Zero-reference line labeled 'No effect' adds interpretive context, and the data
    intentionally includes one site (Miami) whose CI crosses zero alongside sites
    that don't — good feature coverage of both a significant and a non-significant
    result.
  - 'Palette and theme chrome are fully compliant: brand green #009E73 for the only
    data series, identical between renders, correct #FAF8F1/#1A1A17 backgrounds, and
    all chrome (title, ticks, axis label, reference-line label) legible and theme-adaptive
    in both renders.'
  - 'Clean, deterministic, KISS code: hard-coded realistic data, explicit font sizes
    throughout (title/axis label/tick label/reference-line label), single default-exported
    component, skipAnimation set.'
  weaknesses:
  - 'X-axis is over-ticked: 29 ticks at 0.05 increments from -0.40 to 1.00 create
    visual clutter and become nearly illegible at the ~400px mobile thumbnail size
    — space ticks at 0.1 or 0.2 increments (e.g. via xAxis tickNumber/tickInterval)
    for a cleaner, more mobile-legible axis.'
  - Sites are listed in their original input order rather than sorted by estimate
    magnitude — sorting (e.g. descending by estimate) would strengthen the visual
    hierarchy so the reader immediately sees which sites have the strongest/weakest
    effects without having to scan every row.
  - Small tick marks between each category row on the y-axis add minor visual noise;
    per the style guide's decoration-removal guidance, consider hiding tick marks
    on the categorical axis while keeping the labels.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Bold dark title top-left ("point-basic · javascript · muix · anyplot.ai"), dark y-axis category labels (Boston, Chicago, Denver, Atlanta, Seattle, Miami, Austin, Portland), dark x-axis tick labels (-0.40 to 1.00 in 0.05 steps) and x-axis label "Effect Size (Cohen's d)" below. A dashed vertical reference line at x=0 with a small "No effect" label near the bottom. Subtle light-gray vertical gridlines. All chrome text is clearly readable against the light background.
      Data: 8 horizontal rows, each with a brand-green (#009E73) circular marker at the estimate, a green horizontal line spanning [lower, upper], and green vertical caps at both ends. Miami's interval visibly straddles the zero reference line (non-significant), the others sit fully to the right of it (significant, positive effect).
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Same layout as the light render, but title, axis labels, tick labels, and the "No effect" reference-line label are all rendered in light/off-white tones, clearly readable against the dark background. No dark-on-dark text was found anywhere (title, ticks, axis label, reference-line label all checked).
      Data: Identical brand-green (#009E73) markers, whiskers, and caps as the light render — same hue, same values, same layout; only the chrome (background, text, gridlines) flipped to the dark theme.
      Legibility verdict: PASS
