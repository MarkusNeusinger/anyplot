review:
  strengths:
  - 'Uses the MUI X v9 composition API idiomatically: ChartsContainer with id-keyed
    linear and band axes, and a custom SVG layer that reads positions through the
    useXScale/useYScale hooks, so every marker, interval and cap sits exactly at its
    data value.'
  - Native ChartsReferenceLine draws the null line at d = 0 with an inline 'No effect'
    label in the theme's soft ink, the single reference line the Notes allow.
  - Markers (r = 10) carry a page-coloured halo that lifts them off their interval
    lines in both themes; caps at both ends are clearly visible.
  - Sites sorted by estimate, horizontal layout with every category named on its own
    row; the value axis spans every interval plus padding.
  - 'All chrome threads theme tokens (ink, inkSoft, pageBg); data colour is brand
    green #009E73, identical in both renders.'
  - Data is a plausible, neutral multi-site programme evaluation with Cohen's d effects,
    including one interval that crosses zero and one negative estimate.
  weaknesses:
  - 'VQ-01 (both): the x axis carries 26 tick labels at a 0.05 step in 14 px type;
    in the 400 px thumbnail they shrink to an illegible row of digits → a 0.1 step
    (about 13 labels) at about 16 px (+2 px). Likely cause: the linear x axis left
    at its automatic tick density (no tickInterval / tickNumber) with tickLabelStyle
    fontSize 14.'
  - 'Suggestion: the 22 px mandated title fills only about 29 % of the width; a slightly
    larger title would anchor the layout better.'
  - 'Suggestion: the custom SVG marks have no tooltip in the HTML view; a ChartsTooltip-driven
    or title-element hover showing estimate and bounds would use the interactive output.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white, matches #FAF8F1.
      Chrome: bold dark title "point-basic · javascript · muix · anyplot.ai" top-left; y-axis title "Pilot Site" (rotated) and site tick labels in dark ink; x-axis title "Effect Size (Cohen's d)" and tick labels -0.35 … 0.90 in soft ink; subtle vertical grid lines; left and bottom axis lines only. Dashed soft-ink reference line at 0.00 with "No effect" label near its foot. All text readable.
      Data: eight horizontal intervals in brand green #009E73 with caps at both ends and a filled green marker (page-coloured halo) at each estimate; sites sorted by estimate from Denver (0.55) at the top to Miami (-0.05) at the bottom; Atlanta and Miami intervals cross the zero line.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black, matches #1A1A17.
      Chrome: title, axis titles and site labels in light ink, x tick labels in light soft ink, grid lines subtle light-on-dark, dashed reference line and "No effect" label in light soft ink. No dark-on-dark text.
      Data: identical #009E73 intervals, caps and markers to the light render; marker halo switches to the dark page colour. Only chrome flipped.
      Legibility verdict: PASS
