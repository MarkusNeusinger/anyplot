review:
  strengths:
  - Custom renderItem implementation delivers proper capped error bars — a technique
    echarts has no native series for
  - Dashed zero-reference line usefully signals which confidence intervals cross zero
    (e.g. Online Modules)
  - 'Clean theme-adaptive chrome: identical green data markers, correctly swapped
    backgrounds/text/grid between light and dark'
  - 'Spec compliance is complete: category/estimate/bounds, horizontal orientation,
    capped error bars, and correct title format'
  weaknesses:
  - Categories are left in arbitrary input order rather than sorted by estimate value,
    missing an easy data-storytelling win common to forest/point-estimate plots
  - Visual styling stays close to library defaults (axis lines fully drawn, no highlighted
    focal category) — could push Design Excellence further with a subtler axis treatment
    or emphasis on the highest/lowest estimate
