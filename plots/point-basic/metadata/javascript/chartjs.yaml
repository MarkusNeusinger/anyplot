review:
  strengths:
  - 'Idiomatic mixed bar+line Chart.js config: a floating ''bar'' dataset renders
    the true 95% CI extent while a hidden-line dataset draws just the point-estimate
    marker — a clean workaround for a chart type (forest/point plot) Chart.js has
    no first-class support for.'
  - Custom errorCapsPlugin derives cap positions from the actual rendered bar geometry
    (chart.getDatasetMeta) rather than hardcoded pixel offsets, so caps stay correct
    at any window size.
  - 'Theme-adaptive marker halo (pointBorderColor: t.pageBg) makes the point-estimate
    markers pop against the CI bar in both themes without introducing any new colors.'
  - Dashed reference line at x=0 (drawn with t.inkSoft via a custom plugin) gives
    immediate visual context for which predictors have a significant positive/negative
    effect — genuine data storytelling.
  - Categories sorted by effect size (documented in a comment) mirrors standard forest-plot
    reading order, adding intentional visual hierarchy.
  weaknesses:
  - 'Title plugin uses font.weight: "medium", which is not a standard CSS font-weight
    keyword (valid values are ''normal'', ''bold'', ''bolder'', ''lighter'', or a
    number) — use "bold" or a numeric weight like 600 for reliable cross-browser rendering.'
  - Title occupies only ~30% of the plot width even after the length-based fontsize
    scaling formula, leaving it visually recessive relative to the ~50-70% guideline
    target — a slightly larger base fontsize (e.g. 22 to 24) would compensate for
    the longer descriptive-prefixed title without overflowing.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1-range), not pure white — matches the required light surface.
      Chrome: Title "House Price Model Coefficients · point-basic · javascript · chartjs · anyplot.ai" in dark ink, centered at top, fully visible with no clipping. X-axis title "Standardized Coefficient (95% CI)" in bold dark ink below the tick labels. Y-axis category labels (Square Footage, Renovated, Bathrooms, Garage Spaces, Lot Size, Age of Home, Distance to Downtown) in soft dark gray, all fully legible. X-axis tick labels (-0.4 to 0.5) in soft dark gray. Subtle vertical gridlines at each x tick, no horizontal gridlines. A black dashed vertical reference line at x=0.
      Data: All 7 point estimates rendered as solid brand-green (#009E73) circular markers with a light halo border matching the page background, each with a lighter semi-transparent green horizontal bar spanning its 95% CI, capped with solid green vertical ticks at both endpoints. First (and only) series is correctly the brand green.
      Legibility verdict: PASS — every title, axis label, and tick label reads clearly against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17-range), not pure black — matches the required dark surface.
      Chrome: Same title, now rendered in light/off-white ink, fully visible with no clipping. X-axis title in light ink. Y-axis category labels and x-axis tick labels in a lighter soft gray, all clearly legible against the dark background. Subtle vertical gridlines (light, low-opacity) at each x tick. The x=0 reference line is now a white/light dashed line, correctly flipped for contrast on the dark surface.
      Data: Same 7 point estimates in the identical brand-green (#009E73) markers and CI bars/caps as the light render — data colors are unchanged between themes, only chrome flipped, as required. Marker halo border now matches the dark page background instead of the light one.
      Legibility verdict: PASS — no dark-on-dark failures observed; all text and data elements are clearly distinguishable from the near-black background.
