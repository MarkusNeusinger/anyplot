review:
  strengths:
  - Custom SVGRenderer-based CI whiskers with proper end caps compensate cleanly for
    the missing highcharts-more errorbar module -- a correct, well-executed workaround
    keyed to the axis pixel space via toPixels(), not a lazy shortcut.
  - 'Dashed zero-reference plotLine adds genuine interpretive value: the viewer can
    instantly see which intervals cross zero (Peer Review, Sleep Coaching) versus
    which are clearly significant (Tutoring, Practice Tests).'
  - 'Correct Imprint palette application -- first series is #009E73, identical across
    light/dark renders -- with theme-correct backgrounds (#FAF8F1 / #1A1A17) and readable
    text in both themes.'
  - Realistic, neutral educational-intervention dataset with a good spread of positive
    and negative effects and varying CI widths -- satisfies DQ-01 feature coverage
    well.
  - Single-series legend correctly omitted per style guide (a legend would be redundant
    with only one series).
  weaknesses:
  - 'yAxis (the horizontal value axis after chart.inverted) has no explicit lineColor/tickColor
    -- only xAxis sets t.inkSoft. The value-axis line therefore falls back to Highcharts''
    default grey, which is not theme-tokenized like every other chrome element. Fix:
    add `lineColor: t.inkSoft, tickColor: t.inkSoft` to the yAxis config to match
    xAxis.'
  - Categories are ordered alphabetically/arbitrarily (Tutoring, Study Group, Practice
    Tests, Flashcards, Online Course, Peer Review, Sleep Coaching) rather than sorted
    by estimate magnitude. Sorting descending by estimate would sharpen the data story
    -- the viewer could scan top-to-bottom from strongest to weakest effect instead
    of hunting for it.
  - Design excellence is largely baseline token-mapping (correct but not elevated)
    -- consider a subtle semantic cue for intervals that cross zero (e.g. slightly
    muted marker/whisker color) to visually separate 'significant' from 'not significant'
    results and deepen the storytelling beyond the reference line alone.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 -- not pure white.
      Chrome: Title "point-basic · javascript · highcharts · anyplot.ai" in bold dark ink, clearly readable at top center. Y-axis (inverted, so vertical) shows 7 category labels (Tutoring, Study Group, Practice Tests, Flashcards, Online Course, Peer Review, Sleep Coaching) in soft dark grey, evenly spaced with generous whitespace between rows. X-axis (value axis) shows "Effect on Exam Score (points)" title below tick labels -3 through 9, in soft dark grey. Vertical grid lines are subtle and light. A dashed vertical reference line marks x=0.
      Data: All 7 points rendered in Imprint brand green (#009E73), circular markers ~radius 8, with horizontal CI whiskers in a lighter semi-transparent green and small vertical end caps. Point positions and interval widths vary sensibly across categories (Tutoring highest ~6.8 with tight-ish interval, Sleep Coaching lowest at ~-0.6 crossing zero).
      Legibility verdict: PASS -- all title, axis title, tick labels, and category labels are clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 -- not pure black.
      Chrome: Title now rendered in light/off-white ink, still bold and centered. Category labels and axis tick labels flip to a light grey (readable against dark background). Grid lines remain subtle, now light-toned at low opacity. Dashed zero-reference line renders in light grey/dashed white, clearly visible.
      Data: Data markers and CI whiskers are the identical Imprint green (#009E73) as the light render -- confirmed unchanged, only the chrome (background, text, grid) flipped as required. No dark-on-dark failures observed anywhere -- every tick label, category label, and title character is legible against the near-black surface.
      Legibility verdict: PASS -- no dark-on-dark or light-on-light failures in either render. Data colors are identical between the two themes.
