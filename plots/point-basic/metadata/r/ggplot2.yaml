review:
  strengths:
  - 'Correct point-estimate/forest-plot pattern: geom_point + geom_errorbarh with
    visible caps, horizontal orientation matches the spec''s recommendation for reading
    category labels'
  - Data sorted by estimate value creates a natural visual hierarchy (largest effect
    at top, smallest at bottom) that aids interpretation without needing extra annotation
  - Dashed zero reference line included per the spec's suggestion, making it easy
    to see which sites' intervals cross the null value
  - 'Imprint brand green (#009E73) is identical across both themes; all chrome (background,
    title, axis text, grid) correctly flips between #FAF8F1/#1A1A17 with no dark-on-dark
    or light-on-light failures'
  - 'Clean minimalist theme: y-axis grid and tick marks removed, only subtle x-axis
    grid kept, generous margins, no clutter'
  - Realistic simulated multi-site clinical-trial data with varying sample sizes (30-200)
    that naturally produces varying CI widths rather than hand-picked values
  - Explicit font sizing throughout (title 12pt, axis titles 10pt, tick text 8pt)
    matching style-guide defaults; text stays legible when scaled down to ~400px mobile
    width
  - 'Clean, reproducible, KISS-structured R code: set.seed(42), tidy imports, no over-engineering
    or fake functionality'
  weaknesses:
  - Uses the superseded geom_errorbarh() instead of the current recommended geom_errorbar(orientation
    = "y") — ggplot2's own lifecycle guidance (since 3.3.0) points to the orientation-based
    geom_errorbar() as the forward-looking API, and the project's own ggplot2.md geom
    list only mentions geom_errorbar(), not geom_errorbarh()
  - 'Design Excellence is still at ''strong default'' level rather than publication-grade:
    the plot relies on a single accent color with no additional visual device (e.g.,
    a subtle muted-color/alpha treatment or shaded band for intervals that cross zero)
    to separate ''significant'' from ''non-significant'' sites, which would meaningfully
    deepen the data storytelling beyond the reference line alone'
  - Vertical grid lines use the full INK color at linewidth 0.2 rather than an alpha-reduced
    tint — consider softening further (e.g., a lighter rgba-style tint) to match the
    style guide's 'very subtle, 15-25% opacity' grid guidance more closely
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1-consistent), not pure white, not dark.
      Chrome: Title "point-basic · r · ggplot2 · anyplot.ai" top-left in dark ink, clearly legible. Y-axis shows 10 "Site NN" category labels (dark-gray, INK_SOFT), sorted by descending estimate from top to bottom. X-axis "Standardized Effect Size (95% CI)" label and 0.0/0.2/0.4/0.6/0.8 tick labels in dark-gray, clearly legible. Subtle vertical grid lines at each major tick. A dashed reference line at x=0 in a muted gray.
      Data: Ten green (#009E73) point markers with horizontal error bars (with end caps) of varying width reflecting different per-site sample sizes; several intervals cross the x=0 reference line (Site 06, 09, 10), several do not.
      Legibility verdict: PASS — all text (title, axis labels, tick labels, category labels) is clearly readable against the light background at both full resolution and when scaled to ~400px mobile width.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17-consistent), not pure black, not light.
      Chrome: Same title, axis labels, and category labels now rendered in light ink (#F0EFE8) / soft light-gray (#B8B7B0) tones, both clearly visible against the dark background. Vertical grid lines and the dashed zero-reference line are rendered in light tones, visible but subtle. No dark-on-dark text anywhere.
      Data: The ten green (#009E73) point markers and error bars are pixel-identical in color and position to the light render — only the chrome (background, text, grid) flipped, confirming correct theme-adaptive implementation.
      Legibility verdict: PASS — all text is clearly readable against the dark background; no dark-on-dark or contrast failures observed.
