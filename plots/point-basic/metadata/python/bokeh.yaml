review:
  strengths:
  - Bokeh's native Whisker annotation with TeeHead heads draws capped intervals at
    both ends of every row straight from ColumnDataSource(df)
  - x_range computed with Range1d from the bounds and the null value, so every interval
    and cap fits inside the plot area
  - 'Theme tokens threaded through every chrome element; #009E73 data identical in
    both renders, page-colored marker outline keeps points distinct on their lines'
  - Faint value-axis grid only, with the categorical-axis grid dropped
  - 'Clean adaptable-code layout: column-name constants drive the axis titles and
    every glyph'
  weaknesses:
  - 'DQ-02 (both): the arms are labelled Treatment A–E with a generic ''Effect Size'',
    which reads as abstract → named interventions (for example drug or therapy names).
    Likely cause: the TREATMENT values in the data block.'
  - 'Suggestion: ordering the treatments by estimate would make the ranking easier
    to read, with Control kept at the bottom.'
