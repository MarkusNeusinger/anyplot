review:
  strengths:
  - Horizontal point-estimate layout with natural A–E row order, markers drawn on
    top of capped interval lines, and a single zero reference line as the Notes allow
  - Theme tokens threaded through every chrome element; both renders legible with
    identical data colors
  - Native pygal XY chart with dict y_labels for category names and an interactive
    HTML export for hover inspection
  weaknesses:
  - 'VQ-01 (both): the ''Sensor A'' row label renders at the 44 px major-label size
    while Sensor B–E render at 56 px, so one category label reads visibly smaller
    → all row labels at one size (+12 px for Sensor A). Likely cause: pygal treats
    the first y_label as major and applies major_label_font_size=44; set y_labels_major
    to every row or make major_label_font_size equal to label_font_size.'
  - 'VQ-03 (both): interval lines and caps are ~3 px strokes, and the #4467A3 blue
    reads dim against #1A1A17 in the dark render → thicker intervals (about 6–8 px,
    +3 to +5 px). Likely cause: the per-interval stroke_width=5 is not reaching the
    rendered path; set it via stroke_style={''width'': …} on each interval series.'
  - 'VQ-07 (both): brand green #009E73 is spent on the zero reference line while the
    point estimates, the data, are #C475FD → estimates in #009E73 and the reference
    line in the theme-adaptive neutral anchor (INK). Likely cause: series_colors puts
    IMPRINT_PALETTE[0] on the reference series.'
  - 'DQ-02 (both): the rows are labelled generically ''Sensor A''–''Sensor E'' → concrete
    sensor names (e.g. thermocouple channel or instrument model names). Likely cause:
    the SENSOR label list.'
  - 'Suggestion: the gray pygal zero axis line runs the full plot height behind the
    green reference line, doubling it at the top and bottom; ending both at the same
    span would tidy the vertical.'
  image_description: |-
