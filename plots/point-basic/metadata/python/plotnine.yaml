    the labs(title=...) string.'
  - 'CQ-01 (code): no column constant for the roles category, estimate, lower_bound,
    upper_bound, and aes() types ''estimate'', ''category'', ''lower'', ''upper''
    below the Data block → one string constant per role above the Data block with
    a # role: comment, used in aes(). Likely cause: column names typed where they
    are used.'
  - 'Suggestion: a reader-facing y-axis title such as ''Survey dimension'' would say
    more than ''Category''.'
