review:
  strengths:
  - Capped geom_errorbar intervals with hollow shape-21 markers filled with the page
    colour keep every estimate distinct on its interval line in both themes
  - Horizontal coord_flip layout names every category on its own row, with one dashed
    reference line at the null value
  - 'Theme tokens thread through every chrome element; text is readable on both #FAF8F1
    and #1A1A17'
  - Column constants and a replaceable data block make the script directly adaptable
    to a user's table
  weaknesses:
  - 'DE-02 (both): the panel is drawn with all four spines (a full frame) → only the
    left and bottom axis lines, per the style guide''s L-shaped default. Likely cause:
    lets-plot''s default panel border is kept; set panel_border=element_blank() and
    keep axis_line.'
  - 'DQ-02 (both): the groups are labelled ''Treatment A'', ''Treatment B'', ''Treatment
    C'', which read as placeholders → name concrete interventions (e.g. drug or dose
    names). Likely cause: the GROUP label list in the data block.'
  - 'Suggestion: ordering the treatment rows by estimate would let the eye rank them
    faster.'
