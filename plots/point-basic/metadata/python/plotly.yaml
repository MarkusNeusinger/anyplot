review:
  strengths:
  - Native plotly error_x with asymmetric array/arrayminus driven straight from the
    lower/upper columns gives capped 95 % intervals in one trace
  - fig.add_vline with a positioned 'Null' annotation marks the null effect with the
    library's own reference-line API
  - 'Theme tokens threaded through every chrome element; both renders read cleanly
    with identical #009E73 data marks'
  - Canonical 3200x1800 canvas with the full mandated title and library-prompt font
    sizes
  weaknesses:
  - 'VQ-03 (both): Treatment C''s lower bound is exactly 0.0, so its left cap sits
    under the dashed null line and is masked by it → a lower bound that does not coincide
    with the null value (e.g. half-width 1.4 instead of 1.5) so both caps show. Likely
    cause: half_widths[3] = 1.5 with estimate 1.5.'
  - 'DQ-02 (both): the groups are labelled ''Treatment A''–''Treatment E'' and the
    axis unit is the placeholder ''(units)'' → named interventions and a real effect
    unit (e.g. blood-pressure reduction in mmHg). Likely cause: the GROUP labels list
    and the ESTIMATE column name.'
  - 'CQ-04 (code): the legend dict in update_layout (lines 99–108) styles a legend
    that never renders, since a single trace has no legend by default → delete the
    block. Likely cause: a legend kept from an earlier version.'
  - 'Suggestion: ordering the treatments by estimate would let the reader rank the
    effects at a glance.'
