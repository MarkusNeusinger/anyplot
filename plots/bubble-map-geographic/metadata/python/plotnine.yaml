review:
  strengths:
  - 'Quiet basemap: ocean in the page color with thin INK_SOFT coastline strokes,
    so the bubbles dominate in both themes'
  - Bubbles sorted largest-first with thin outlines and alpha 0.7, so small cities
    stay visible inside the dense East-Asian cluster
  - guides() with guide_legend(order=, override_aes=) gives a neutral size legend
    and a color legend with readable swatches, both visible on light and dark
  - 'Region colors follow the data order via limits taken from df, so the first region
    gets #009E73 in canonical Imprint order'
  - Exact 3200x1800 canvas and a graticule at 30°/60° with expand=(0,0) aligned to
    the ±180° panel edges
  weaknesses:
  - 'SC-02 (both): the hand-drawn Europe, Asia and Africa polygons overlap, so their
    coastline strokes cross each other between about 25-60°E and 30-70°N (a line runs
    through the Black Sea/Caspian area and across Turkey) and the C1 basemap reads
    as tangled lines rather than coastlines → non-overlapping outlines that share
    an edge at the Urals/Bosporus and Suez. Likely cause: the Europe vertex list running
    east to 60°E and the Asia list running west to 25°E in the continents dict.'
  - 'VQ-05 (both): the coord_fixed map panel fills only the middle ~55% of the canvas
    height, leaving empty bands of about 230 px above the title and 260 px below the
    x-axis title while the legend stack reaches higher than the title → a panel that
    uses more of the 1800 px height (about +20%). Likely cause: the 360:140 aspect
    of coord_fixed sharing the width with a right-side legend; legend_position="bottom"
    (or a horizontal legend box) lets the map widen and grow.'
  - 'Suggestion: size-legend breaks at round values (5, 15, 25, 35 M) would read more
    easily than 4, 13, 26, 37.'
  - 'Suggestion: scale_size_area(max_size=14) would keep area exactly proportional
    to population; the current range floor shows Dubai (3.4 M) at about a fifth of
    Singapore''s (5.9 M) area.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 (sampled 250,248,241) across canvas and panel; 3200x1800.
      Chrome: bold title "World City Populations · bubble-map-geographic · python · plotnine · anyplot.ai" in dark ink, fully inside the canvas; axis titles "Longitude (°)" / "Latitude (°)" and ticks (-180..180 by 60, -60..60 by 30) in dark/soft ink; faint graticule; left and bottom axis lines. Right legend on an elevated off-white box: "Population (millions)" with grey reference circles 4/13/26/37, then "Region" swatches. All readable.
      Basemap: simplified continent outlines as thin grey strokes, no land fill; the Europe/Asia/Africa outlines cross each other around 25-60°E.
      Data: 30 translucent city bubbles with thin outlines — Asia #009E73 (first), S. America #C475FD, N. America #4467A3, Africa #BD8233, Europe #AE3030, Oceania #2ABCCD. Tokyo/Delhi/Shanghai largest; Dubai smallest but visible; smaller bubbles drawn over larger ones in East Asia.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17 (sampled 26,26,23); same layout.
