review:
  strengths:
  - Size legend built from proxy ax.scatter handles with the same scaling, alpha and
    outline as the data bubbles
  - Theme-adaptive ocean/land colors keep the basemap quieter than the brand-green
    bubbles in both renders
  - Exact 3200×1800 canvas via figsize=(8, 4.5), dpi=400 and subplots_adjust instead
    of bbox_inches='tight'
  - Page-colored bubble outlines keep overlapping East-Asian bubbles distinguishable
  weaknesses:
  - 'SC-02, SC-03 (both): bubble area is an affine min-max rescale, not proportional
    to GDP: the $250B legend bubble is about 25 pt² and the $1.5T one about 175 pt²
    (area ratio 7.0 for a value ratio of 6.0), and Delhi ($220B, about 21 pt²) against
    Mumbai ($400B, about 43 pt²) shows a 2.0× area for a 1.8× value → area = value
    × k (e.g. s = df[GDP] * MAX_SIZE / df[GDP].max(), legend sizes from the same k),
    so twice the value is twice the area. Likely cause: sizes = MIN_SIZE + (GDP −
    min) / span × (MAX_SIZE − MIN_SIZE).'
  - 'SC-02 (both): the hand-drawn basemap omits Great Britain, Indonesia and the Philippines,
    so the London and Jakarta bubbles sit in open sea, and it draws stray spikes (Alaska''s
    outline running out to −168°/52°, a loose segment at 88–92° E / 22° N) → coastlines
    that include these landmasses and closed outlines without spikes. Likely cause:
    the continents polygon list.'
  - 'Suggestion: name the two or three largest cities with small labels placed clear
    of the East-Asian cluster.'
  - 'Suggestion: drop np.random.seed(42) — nothing in the script is random.'
