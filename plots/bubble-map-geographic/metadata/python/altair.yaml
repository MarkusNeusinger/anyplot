review:
  strengths:
  - 'Idiomatic Altair geographic stack: alt.topo_feature basemap via mark_geoshape
    layered with mark_circle on Longitude/Latitude channels under one shared projection'
  - Fully theme-adaptive basemap (LAND_FILL / LAND_STROKE tokens) and elevated rounded
    legend panels; both renders read cleanly
  - Bubbles sorted largest-first so small events stay on top, with a thin page-colored
    outline and 0.65 opacity where Japan and Chile overlap
  - Real, neutral USGS earthquake data with region categories in the canonical Imprint
    order and reader-friendly legend titles with the unit (Mw)
  - Native tooltips with location, magnitude, region and coordinates in the HTML output
  - Correct 3200x1800 canvas via pad-only post-processing
  weaknesses:
  - 'VQ-02 (both): the Christchurch, NZ bubble (M6.3 at 172.7°E, 43.6°S) lies entirely
    under the Tectonic region legend box in the bottom-right corner and cannot be
    seen → no data mark covered by a legend; place the color legend outside the map
    view (for example orient="right" or "bottom"). Likely cause: color legend orient="bottom-right"
    with offset=6 inside the view.'
  - 'SC-02, SC-03 (both): bubble area is linear in magnitude above an offset floor
    (size domain [6.0, 9.5] → range [12, 420], zero=False), so the size legend draws
    M9.5, 1.46× M6.5, with about 7× its area → area proportional to the value (a value
    twice as large gets twice the area), keeping a range minimum for the smallest
    values. Likely cause: alt.Scale(domain=[df[MAGNITUDE].min() - 0.1, df[MAGNITUDE].max()],
    zero=False) on the size channel.'
  - 'Suggestion: a slightly larger map view (within the library''s ±20 px tuning band)
    would trim the empty bands above the title and below the legends.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the 3200x1800 canvas; the equirectangular world map sits centered with even margins.
      Chrome: bold dark title "Major Earthquakes · bubble-map-geographic · python · altair · anyplot.ai" centered above the map (~65% of width). Size legend "Magnitude (Mw)" bottom-left (6.5/7.5/8.5/9.5 green reference circles) and color legend "Tectonic region" bottom-right, both in rounded #FFFDF6 panels with dark titles and soft-ink labels. All text readable.
      Data: 30 translucent bubbles on a quiet taupe land fill with hairline borders: East & SE Asia #009E73 (Japan cluster, Sumatra, Java, Solomons, Tonga at the far left), Americas #C475FD (Alaska, Mexico, Central America, Andes, two large Chile bubbles), Middle East & C. Asia #4467A3 (Turkey, Iran), South Asia #BD8233 (Pakistan, India, Nepal, China). Small bubbles drawn above large ones with a thin page-colored outline. The Christchurch, NZ bubble falls under the Tectonic region legend box and is not visible.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17; land fill dark gray #2C2C28 with subtle borders, quieter than the bubbles.
