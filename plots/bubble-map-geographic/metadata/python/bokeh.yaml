review:
  strengths:
  - Theme-matched Esri Canvas light/dark gray tile basemap via WMTSTileSource keeps
    the geography quieter than the bubbles
  - Bubble diameter scales with sqrt(value), so area is proportional to population,
    and the size legend uses the same formula
  - Size legend bubbles drawn exactly like the data marks (fill, alpha, outline) and
    labeled in millions
  - Per-region ColumnDataSource(df) with larger bubbles drawn first so smaller ones
    stay on top
  - HoverTool tooltips with city, population, region and coordinates in the HTML output
  - Imprint palette in canonical order with Asia on brand green; chrome correct in
    both themes
  weaknesses:
  - 'Suggestion: the region legend''s swatches are small next to their 26 pt labels;
    larger legend glyphs would read more easily.'
  - 'Suggestion: a slightly larger MAX_SIZE would give the size contrast more presence
    on the 3200 px canvas.'
