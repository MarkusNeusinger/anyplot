review:
  strengths:
  - Bubble area is proportional to population through seaborn's own size mapping (sizes=(0,
    MAX_BUBBLE_AREA), size_norm=(0, value_max)), and the size-legend reference bubbles
    use the same area formula, so the legend is exact
  - Bubbles are sorted largest first so the smaller ones sit on top; with alpha 0.6
    and a thin page-colored outline every city in the dense South and East Asia cluster
    stays distinguishable
  - 'The basemap is quieter than the data in both themes: a translucent MUTED land
    fill with a thin outline'
  - The size-legend glyphs match the data marks (same alpha and outline) and are visible
    on both legend surfaces
  - Theme tokens are threaded through sns.set_theme(rc=...), so the chrome flips cleanly
    while the Imprint data colors stay identical
  weaknesses:
  - 'VQ-02 (both): the size-legend title ''Population (millions)'' touches the top
    of the largest (30) reference bubble with no visible gap → clear it by at least
    4 px. Likely cause: handleheight=3.6 is too small for the 600 pt² reference bubble;
    raise handleheight or labelspacing.'
  - 'DE-02 (both): all four spines frame the map although nothing in the plot type
    requires an enclosed frame (style guide ''Spines'') → remove the top and right
    spines (sns.despine(ax=ax)) or all four. Likely cause: style=''ticks'' keeps the
    full box and no despine call follows.'
  - 'Suggestion: align the top edges of the two legend boxes, which currently start
    at slightly different heights.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1; ocean is the page color, land a quiet translucent grey-beige fill with thin muted outline; subtle dashed grid.
      Chrome: title "bubble-map-geographic · python · seaborn · anyplot.ai", axis titles "Longitude (°)" / "Latitude (°)", ticks and two legends (Continent, Population (millions)) all in dark ink and readable.
      Data: 27 city bubbles, area proportional to population, colored by continent in Imprint order (Asia #009E73 first, South America #C475FD, North America #4467A3, Africa #BD8233, Europe #AE3030, Oceania #2ABCCD), alpha 0.6, thin page-colored outline, smaller bubbles above larger ones.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17; land dark grey translucent fill; grid subtle but visible.
      Chrome: title, axis titles, ticks and legend text in light ink; legend boxes on #242420 with light frames; no dark-on-dark text.
      Data: bubble colors identical to the light render; only the outlines switch to the dark page color. Brand green reads clearly.
      Legibility verdict: PASS
