review:
  strengths:
  - 'Bubble area is exactly proportional to population: sns.scatterplot maps size
    with sizes=(0, MAX_BUBBLE_AREA) and size_norm=(0, value_max), and the size-legend
    circles use the same s = MAX_BUBBLE_AREA * v / value_max formula, so the reference
    bubbles match the data marks'
  - Rows are sorted by descending population before plotting, so smaller bubbles are
    drawn above larger ones; combined with alpha 0.6 and a page-colored outline, no
    small city is hidden in the dense East and South Asia cluster
  - Two separate legends placed outside the map (continent hue legend and a size legend
    with MaxNLocator-chosen nice values 10/20/30 in the value's units), with labelspacing
    tuned so the reference circles do not collide
  - Theme tokens threaded through sns.set_theme rc (text, ticks, spines, grid, legend
    frame and fill); both renders are fully readable and the Imprint data colors are
    identical across themes
  - Basemap drawn as translucent MUTED polygons that stay quieter than the bubbles
    in both themes; real city coordinates and plausible metro populations
  weaknesses:
  - 'SC-02 (both): the hand-drawn continent polygons are so coarse that several bubbles
    sit in open sea or off the land outline — Tokyo, Osaka, Seoul and Manila fall
    off the Asia polygon (Japan, Korea''s coast and the Philippines are missing),
    Mumbai and Karachi sit west of the India outline, and the Mediterranean and British
    Isles are absent — so the basemap gives misleading geographic context → refine
    the polygons with more vertices along the coasts where the cities lie (Japan,
    the Indian west coast, Korea, the Philippines, Great Britain, the Mediterranean).
    Likely cause: WORLD_COASTLINES has only 10–23 vertices per continent.'
  - 'VQ-05 (both): the equal-aspect map occupies only the middle ~55 % of the canvas
    height, leaving empty bands of roughly 18 % above the title and 12 % below the
    x-axis title → let the map fill more of the height (e.g. a tighter latitude range
    such as -60 to 80, or fig.subplots_adjust with the legends kept at the right)
    so the vertical whitespace shrinks by about half. Likely cause: ax.set_aspect(''equal'')
    with a 360° × 155° extent in an 8 × 4.5 in figure plus tight_layout.'
  - 'Suggestion: the size legend could add a 5 reference bubble so the smallest city
    (Sydney, 5.4 M) has a matching reference circle.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole canvas; legend boxes in the slightly lighter elevated fill with a soft dark frame.
      Chrome: title "bubble-map-geographic · python · seaborn · anyplot.ai" in dark ink, ~57 % of the width; axis titles "Longitude (°)" and "Latitude (°)" and tick labels (-150…150, -60…80) in dark grey; dashed graticule subtle but visible; all four spines frame the map. Everything readable.
      Data: 27 world cities as translucent bubbles (alpha 0.6, page-colored outline) over light-grey simplified continent polygons. Asia #009E73 (largest cluster, Tokyo the biggest bubble), South America #C475FD, North America #4467A3, Africa #BD8233, Europe #AE3030, Oceania #2ABCCD. Right side: "Continent" legend and a "Population (millions)" size legend with grey reference circles 10/20/30. Basemap is crude — Japan, the Philippines and the British Isles are missing, so Tokyo, Osaka, Manila sit off the land. Large empty bands above the title and below the x-axis title.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17; legend boxes in the elevated dark fill with a light grey frame.
      Chrome: title, axis titles and tick labels in light ink/soft grey, clearly readable; no dark-on-dark text; graticule subtle; spines light grey.
      Data: identical Imprint colors and positions as the light render; bubble outlines flip to the dark page color; continent polygons a quiet dark grey that stays behind the bubbles; brand green clearly visible.
      Legibility verdict: PASS
