review:
  strengths:
  - Bubble area scales with population via dots_size ∝ sqrt(value), so area, not radius,
    carries the value
  - 'pygal.XY with per-series dots_size and labelled tooltips (''Tokyo: 37.4M'') gives
    exact values in the interactive HTML'
  - Real world cities with plausible metro populations and correct coordinates across
    all inhabited continents
  - 'Full theme threading through one Style object: chrome flips cleanly while the
    #009E73 bubbles stay identical'
  weaknesses:
  - 'SC-02, VQ-03 (both): the size legend''s reference bubbles in the south Pacific
    (lon −158°) carry no value labels, and the bottom legend shows four equal-size
    squares instead of bubbles, so the size scale is read only by matching order and
    the reference bubbles look like data → label each reference bubble with its value
    next to it (e.g. a print_values / formatter label ''5M'', ''15M'' …) or drop the
    square swatches. Likely cause: chart.add(f''{lpop}M pop'', …) relying on pygal''s
    square legend boxes with print_values=False.'
  - 'SC-02 (both): the hand-drawn coastline polygons misplace land so badly that Tokyo,
    Seoul, Jakarta, Bangkok and Sydney sit in open ocean and Japan is a single line
    → coastline vertices that enclose those cities (more points for East Asia, the
    Malay archipelago and Australia''s east coast). Likely cause: the 4–8-vertex polygons
    in the coastlines list.'
  - 'VQ-07 (both): the plot area is filled with off-palette ocean blues #C8DDF0 (light)
    / #0D2535 (dark) instead of the theme surface → plot_background=PAGE_BG (#FAF8F1
    / #1A1A17), with land conveyed by the INK_MUTED coastlines. Likely cause: Style(plot_background=OCEAN_BG).'
  - 'VQ-05 (both): an empty band of about 8 % of the canvas height sits below the
    one-row legend → reclaim it (about −140 px of bottom margin) so the map gets the
    height. Likely cause: pygal''s legend_at_bottom space reserved for more rows than
    the 4 entries need.'
  - 'Suggestion: the heavy zero-meridian axis line (dark in light, near-white in dark)
    is the strongest line on the map; a muted or hidden zero line would keep the basemap
    quieter.'
