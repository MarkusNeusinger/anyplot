review:
  strengths:
  - 'Rich lets-plot layer_tooltips(): city name as tooltip title plus formatted population
    and region lines in the HTML output'
  - Bubbles sorted largest-first so small cities (Osaka over Tokyo, Rio next to Sao
    Paulo) stay visible on top, with alpha 0.65 handling the overlap
  - 'Two separate, framed legends via guides(override_aes=...): a neutral INK_SOFT
    size legend and a region color legend at a fixed glyph size'
  - 'Basemap fill and outline come from theme tokens and stay quieter than the bubbles
    in both renders; Imprint palette in canonical order starting with #009E73'
  weaknesses:
  - 'SC-02, SC-03 (both): bubble area is not proportional to the value — scale_size(range=[2,
    14]) rescales sqrt(value) onto 2–14, so Tokyo (37.4 M) has about 47x the area
    of Berlin (3.6 M) for a 10.4x value ratio, and the 30 M legend bubble about 4.7x
    the area of the 10 M one → area proportional to value (ratio 10.4x / 3x). Likely
    cause: scale_size(range=...) instead of scale_size_area(max_size=14).'
  - 'SC-02 (both): the hand-drawn continent outlines are too coarse to serve as coastlines
    — Lima, Toronto and New York sit outside the land polygons, Europe and Asia overlap
    in crossing outlines, and North America is a thin ribbon without Canada or Alaska
    → outlines with enough vertices that every city falls on its landmass. Likely
    cause: CONTINENT_OUTLINES with ~13–20 vertices per continent.'
  - 'VQ-06 (both): axis titles ''Longitude'' and ''Latitude'' carry no unit → ''Longitude
    (°)'' / ''Latitude (°)''. Likely cause: LONGITUDE/LATITUDE constants used as axis
    titles without units.'
  - 'Suggestion: the empty band between −60° and −40° latitude could be trimmed (ylim)
    to give the populated latitudes more height.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across canvas and panel; continents filled #E8E5DA with thin grey #B8B4A6 outlines, subtle grid.
      Chrome: title 'bubble-map-geographic · python · letsplot · anyplot.ai' top-left in dark ink (~58% width); axis titles 'Longitude'/'Latitude', ticks -150..150 and -60..60 in INK_SOFT; two framed legends right ('Population (M)' with grey 10/20/30 circles, 'Region' with six colored dots). All readable.
      Data: 30 city bubbles, alpha 0.65, colored by region — Asia #009E73 (first series), S. America #C475FD, N. America #4467A3, Africa #BD8233, Europe #AE3030, Oceania #2ABCCD. Tokyo largest; Osaka drawn on top of Tokyo. Crude continent polygons; Lima, Toronto, New York fall outside the land shapes.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17; continents #2A2A26 with #4E4D47 outlines, grid subtle but visible.
      Chrome: title, axis titles and ticks in light ink; legend frames elevated #242420 with light text; no dark-on-dark text.
      Data: same hex colors as the light render (they read deeper through alpha over the dark surface); size-legend glyphs light grey and visible; brand green clearly visible.
      Legibility verdict: PASS
