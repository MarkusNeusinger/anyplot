review:
  strengths:
  - scale_size_area(max_size=17) maps population to bubble area with zero at zero,
    so Tokyo (37.4 M) reads as about twice the area of Mexico City (21.8 M), as the
    Notes ask
  - 'Bubbles are sorted largest-first so smaller cities sit on top: Osaka stays visible
    inside Tokyo''s bubble and Rio stays distinct next to Sao Paulo, with alpha 0.65
    translucency'
  - The basemap is drawn from theme tokens (LAND, COAST, inland seas in PAGE_BG),
    so it is clearly quieter than the bubbles in both themes
  - Separate size and Region legends, with override_aes giving neutral INK_SOFT reference
    circles at the data alpha and uniform color swatches
  - Native layer_tooltips with the city name as title plus population and region lines
    in the HTML output
  - coord_fixed(ratio=1.55) gives the map a sensible mid-latitude aspect that fills
    the 16:9 canvas
  weaknesses:
  - 'Suggestion: the smallest bubbles (Dubai 3.5 M, Berlin 3.6 M) shrink to dots of
    a few pixels in the 400 px thumbnail; a slightly larger max_size would keep them
    more present without breaking area proportionality.'
  - 'Suggestion: a thin page-colored outline on the bubbles (shape=21 with a fill
    mapping) would separate the Tokyo/Osaka and Sao Paulo/Rio overlaps more crisply.'
  - 'Suggestion: the hand-traced coastlines are coarse (the Arabian Peninsula and
    the Mediterranean are blocky); a finer outline set would make the basemap read
    more like a map.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 page and panel; land in a slightly darker beige (#E8E5DA) with thin grey-taupe coastlines; Black and Caspian Seas cut out in the page color.
      Chrome: title "bubble-map-geographic · python · letsplot · anyplot.ai" top-left in dark ink, about 54 % of the width; axis titles "Longitude (°)" / "Latitude (°)" and ticks (-150..150, -60..60) in dark/soft ink; faint grid lines; two framed legends on the right on an elevated background: "Population (M)" with grey reference circles 10/20/30, and "Region" with six colored dots. All text readable.
      Data: 30 world cities as translucent bubbles (alpha 0.65), area by population; Asia #009E73 (first series), S. America #C475FD, N. America #4467A3, Africa #BD8233, Europe #AE3030, Oceania #2ABCCD. Largest bubble Tokyo, with Osaka drawn on top; dense cluster over South and East Asia. Smallest bubbles (Dubai, Berlin) are small dots but visible.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17; land in #2A2A26 with muted coastlines, still quieter than the bubbles.
      Chrome: title, axis titles, ticks and legend text in light ink (#F0EFE8 / #B8B7B0), all clearly readable; no dark-on-dark text; legends framed on #242420.
      Data: the same six palette colors at the same alpha as the light render; only the chrome and basemap flip. Brand green Asia bubbles stand out well; the Europe red and the N. America blue are darker against the dark land but clearly distinguishable.
      Legibility verdict: PASS
