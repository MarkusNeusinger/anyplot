review:
  strengths:
  - Theme-paired basemap tokens (land, ocean, coastline, country lines) keep the basemap
    quieter than the bubbles in both themes
  - One Scattergeo trace per region with Imprint colors in canonical order, 0.65 opacity
    and white outlines keep overlapping East Asian bubbles distinguishable
  - Hover tooltips with city and exact population via hovertemplate in the HTML output
  - Real, neutral world-city data with accurate coordinates and a 5-37M range
  weaknesses:
  - 'VQ-05 (both): canvas is 4800x2700 instead of 3200x1800 (+1600 x +900) → width=800,
    height=450, scale=4. Likely cause: write_image(width=1600, height=900, scale=3).'
  - 'VQ-07 (both): lakes render in pure #FFFFFF, glaring white patches on the dark
    land and bright spots on the light map → hide lakes or color them with the ocean
    token. Likely cause: showlakes left at its default with the default white lakecolor.'
  - 'VQ-01 (both): size-legend title and labels at 15 px on the 1600-px layout (about
    7.5 pt at the 800-px reference, below the 10 pt tick reference) read small beside
    the 18-20 px Region legend → about 18 px on this layout (+3 px). Likely cause:
    font size 15 on the size-legend annotations.'
  - 'VQ-02 (both): the Region legend box covers about 40% of the Mexico City bubble,
    and the 5M glyph and label touch the ''Population scale'' title → place the legend
    over empty ocean that holds no bubble and leave a gap below the title. Likely
    cause: legend x=0.02, y=0.40 and y_centers starting at 0.220 under a title at
    0.252.'
  - 'VQ-03 (both): size-legend reference glyphs are ellipses while the data marks
    are circles → equal pixel radii on both axes. Likely cause: rx and ry divided
    by FIG_W and FIG_H instead of the plot-area width and height.'
  - 'SC-02 (both): diameter = 15 + 55*sqrt((v - vmin)/(vmax - vmin)) makes area not
    proportional to the value (5M → 15 px, 10.6M → about 38 px) → diameter proportional
    to sqrt(value). Likely cause: the min-max normalization in the marker_size line.'
  - 'CQ-04 (code): line 38 np.random.seed(42) seeds nothing and line 26 calls the
    Imprint colors ''Okabe-Ito'' → remove the seed and fix the comment. Likely cause:
    leftovers from an older template.'
  - 'Suggestion: derive the geo lataxis/lonaxis ranges from the data instead of typed
    numbers.'
