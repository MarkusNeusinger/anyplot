review:
  strengths:
  - Africa, Europe, and Asia basemap coastlines were substantially refined since Attempt
    1 — the India peninsula, Horn of Africa, Cape, Gulf of Guinea bulge, and Scandinavia/Iberia
    are all now correctly shaped and positioned
  - Axis labels now carry proper degree-symbol units (Longitude (°) / Latitude (°))
  - Removed the unused Random import/seed that had no effect on the fully hardcoded
    data
  - Correct area-proportional bubble sizing via sqrt(population) so visual area (not
    radius) tracks the data value, exactly as the spec requires
  - Dual legend (region color key + population size key) built with GridLayout and
    MarkerElement, cleanly separated in its own column, frameless, with no edge clipping
  - Imprint palette applied in canonical order across 6 world regions, identical data
    colors between light and dark renders, theme-correct chrome in both
  - Real, plausible major-city population data across all 6 populated continents with
    accurate lat/lon coordinates and realistic metro population figures
  weaknesses:
  - North America's basemap polygon is still geographically distorted (elongated,
    moose-antler-like shape rather than a recognizable continent outline) — refine
    its coordinate list the same way Africa/Europe/Asia were refined this round
  - South America's polygon is a coarse simplification too, though less visually jarring
    than North America's
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "World's Largest Cities by Population · bubble-map-geographic · julia · makie · anyplot.ai" is dark and fully visible, not clipped. "Longitude (°)" and "Latitude (°)" axis labels (with degree-symbol units) and tick labels render in dark/soft-dark ink, clearly readable. Region and size legends are frameless, positioned in a right-hand column with no edge clipping.
      Data: Bubbles colored by continent — Asia #009E73 (brand green), Africa lavender, Europe blue, North America ochre, South America matte red, Oceania cyan — sized by sqrt(population) so area tracks the data value. Alpha ~0.65 with light strokes for definition in dense clusters. Basemap now shows a recognizable India peninsula, Horn of Africa, Cape, Gulf of Guinea bulge, and Scandinavia/Iberia coastlines (refined this attempt); North America's outline remains a coarse, distorted shape.
