review:
  strengths:
  - Correct area-proportional bubble sizing via sqrt(population) so visual area (not
    radius) tracks the data value, exactly as the spec requires
  - Custom hand-built continent basemap with graticule gives real geographic context
    despite CairoMakie having no built-in map projections
  - Dual legend (region color key + population size key) built with GridLayout and
    MarkerElement, cleanly separated in its own column, framevisible=false
  - Imprint palette applied in canonical order across 6 world regions, identical data
    colors between light and dark renders, theme-correct chrome in both
  - Alpha=0.65 with theme-matched stroke color correctly implements the spec's guidance
    to handle overlapping bubbles in dense regions (e.g. East Asia, South America
    clusters)
  - Title fontsize correctly scaled down via the length-proportional formula for the
    long mandated + descriptive title, avoiding overflow
  - Real, plausible major-city population data across all 6 populated continents with
    accurate lat/lon coordinates and realistic metro population figures
  weaknesses:
  - Hand-drawn continent basemap is geographically crude/distorted (Africa's coastline
    is inaccurate, India's peninsula is missing from the Asia polygon, Europe is undersized
    and misshapen) — refine the coordinate lists for more recognizable, accurate coastlines
    to lift both DE-01 and DQ-03
  - Axis labels 'Longitude' and 'Latitude' have no units — append the degree symbol,
    e.g. 'Longitude (°)' / 'Latitude (°)', for full VQ-06 credit
  - '`using Random` and `Random.seed!(42)` are imported/called but never consumed
    — all data is hardcoded tuples with no `rand()`/`randn()` call, so the import
    has no effect on output; either remove it or note the seed as vestigial boilerplate'
  - Basemap polygons currently give the plot area a slightly busy, low-fidelity look
    in the 40-60% width band — a more refined coastline (e.g. simplified Natural Earth-derived
    points instead of hand-guessed vertices) would push Design Excellence further
    above 'well-configured default'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "World's Largest Cities by Population · bubble-map-geographic · julia · makie · anyplot.ai" is dark, centered, fully visible, not clipped or overflowing. "Longitude"/"Latitude" axis labels and tick labels render in dark/soft-dark ink, clearly legible. Faint graticule gridlines at 30°/60° intervals are subtle and do not compete with data. Region-color legend and population-size legend sit in a right-hand column with no frame, clearly separated from the plot.
      Data: Bubbles colored by continent — Asia teal-green (#009E73, matches the mandated brand-green first series), Africa lavender, Europe blue, North America ochre, South America matte red, Oceania cyan. Bubble area scales with population (Tokyo/Shanghai/Delhi largest in the Asia cluster, small Pacific cities like Auckland rendered as small but still visible dots). Semi-transparent fills (alpha ~0.65) with light-colored strokes keep overlapping bubbles (e.g. dense East Asia and South America clusters) distinguishable.
      Legibility verdict: PASS — all text is clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Title, axis labels, and tick labels flip to light/off-white ink and remain fully legible against the dark background — no dark-on-dark failures observed. Continent basemap fill and graticule flip to a darker, higher-contrast gray-on-black scheme appropriate for the theme. Legend text is light-colored and legible.
      Data: Bubble colors are pixel-identical to the light render (same Imprint hues for all 6 regions) — only the chrome (background, continent fill, text, gridlines) changed, as required. Semi-transparent bubbles remain distinguishable against the dark basemap.
      Legibility verdict: PASS — all text is clearly readable against the dark background; brand green and other categorical hues remain vivid and consistent with the light render.
