review:
  strengths:
  - scale_size_area() makes bubble area proportional to population, and the four-break
    size legend (6M, 10M, 20M, 37M) reads in the value's units
  - A hand-traced landmass basemap with themed ocean and land tints sits clearly quieter
    than the bubbles in both themes
  - Bubbles are sorted largest first and drawn with shape 21, alpha 0.70 and a page-colored
    outline, so small cities stay visible inside the dense South and East Asia cluster
  - Per-guide override.aes keeps the size legend neutral grey and the continent swatches
    legible in both themes
  - All chrome threads theme tokens; the dark render has no dark-on-dark text
  weaknesses:
  - 'SC-01 (both): continent name labels (NORTH AMERICA, SOUTH AMERICA, EUROPE, AFRICA,
    ASIA, AUSTRALIA) are an annotation layer the spec does not ask for, and London
    and São Paulo bubbles sit on EUROPE and SOUTH AMERICA → remove the layer; the
    basemap already gives the geographic context. Likely cause: the region_labels
    geom_text layer.'
  - 'Suggestion: Europe takes slot 5, the matte red #AE3030 that the style guide keeps
    as a semantic loss anchor; slot 6 or 7 would keep red free.'
  - 'Suggestion: the size legend circles could take the data marks'' outline so they
    read even more like the bubbles they explain.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 page; map panel in a pale blue ocean tint with cream landmasses outlined in a muted grey ink.
      Chrome: bold title 'World’s Largest Cities · bubble-map-geographic · r · ggplot2 · anyplot.ai' (about 78% of the width), grey subtitle, Longitude/Latitude axis titles, degree ticks 150°W–150°E and 60°S–60°N, two framed legend cards on the right (Population 6M/10M/20M/37M grey circles; Continent swatches). Muted bold continent labels on the landmasses. All text dark on light and readable.
      Data: 40 translucent bubbles with thin page-colored outlines; Asia #009E73 (largest cluster, Tokyo biggest), Africa #C475FD, N. America #4467A3, S. America #BD8233, Europe #AE3030, Oceania #2ABCCD. London and São Paulo bubbles partly cover the EUROPE and SOUTH AMERICA labels.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17 page; ocean panel in dark navy, landmasses in dark grey with light grey outlines.
      Chrome: title, subtitle, axis titles and ticks in light ink, legend cards on the elevated dark surface with light text; size-legend circles mid grey and clearly visible. No dark-on-dark text.
      Data: same bubble colors and positions as the light render; only chrome flips; outlines switch to the dark page color.
      Legibility verdict: PASS
