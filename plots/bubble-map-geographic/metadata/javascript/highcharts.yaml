review:
  strengths:
  - Correct area-proportional bubble sizing (sqrt of normalized magnitude to radius),
    exactly matching the spec's 'scale bubble area, not radius' requirement
  - 'Smart, well-executed workaround for the core-only Highcharts bundle: manual scatter+marker
    bubbles and a hand-drawn chart.renderer basemap + size legend, since highcharts-more/highmaps
    aren''t loaded'
  - Correct Imprint palette usage - brand green first, canonical order for the remaining
    categories, byte-identical data colors between light and dark, fully theme-adaptive
    chrome
  - Real, historically accurate earthquake dataset with sensible magnitude range and
    plausible tectonic-boundary labels - good neutral, factual data quality
  - Transparency (0.62) and minimum radius correctly implement the spec's guidance
    for handling overlapping bubbles in dense regions
  weaknesses:
  - Coastline polygons are visibly coarse/blocky under close inspection (Africa, Australia,
    South America) - add more vertices or a slightly smoothed path for a more polished
    basemap
  - The Transform-boundary cluster near the US/Mexico border (4-5 overlapping bubbles)
    reads close to a single blob at normal zoom despite alpha blending - consider
    a small deterministic jitter offset for near-coincident points, or a subtly thicker/lighter
    stroke to help separate overlapping circles
  - Data storytelling is implicit only - consider a subtitle or light annotation calling
    out the Pacific Ring of Fire clustering pattern the data already shows, to actively
    guide the viewer rather than leaving the pattern to be discovered
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white page background (~#FAF8F1) with light blue ocean fill and beige landmass fill inside the plot area.
      Chrome: Title "bubble-map-geographic · javascript · highcharts · anyplot.ai" and subtitle in dark ink, fully legible; axis titles "Longitude (°)" / "Latitude (°)" and tick labels dark and readable; boundary-type legend (Convergent/Transform/Divergent) at bottom clearly legible; custom "Magnitude" size-legend box (M9.0/M7.5/M6.0) readable with dark text on a light elevated-bg box.
      Data: 33 earthquake bubbles at real lat/lon positions, sized by magnitude (area-proportional), colored by boundary type - Convergent = #009E73 (brand green, first series), Transform = #C475FD (lavender), Divergent = #4467A3 (blue) - matching Imprint palette positions 1/2/3 in canonical order. Alpha ~0.62 with light-colored marker strokes.
      Legibility verdict: PASS - no light-on-light text found anywhere.

    Dark render (plot-dark.png):
      Background: Warm near-black page background (~#1A1A17) with deep navy ocean fill and dark olive-brown landmass fill.
      Chrome: All text (title, subtitle, axis titles, tick labels, both legends) flips to light-colored text, clearly legible against the dark background; no dark-on-dark failures observed anywhere.
      Data: Bubble colors are pixel-identical to the light render (green/lavender/blue) - confirms only chrome (basemap fill, page bg, text) flips per theme, data colors stay fixed. Marker strokes flip to a dark ring consistent with t.pageBg for contrast.
      Legibility verdict: PASS - no dark-on-dark failures; brand green reads clearly on the dark surface too.
