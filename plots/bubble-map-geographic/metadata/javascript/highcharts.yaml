review:
  strengths:
  - 'Genuine geographic bubble map on core-only Highcharts: hand-built basemap via
    chart.renderer paths with Chaikin corner-cutting to smooth the low-vertex coastline
    source data into readable continent shapes.'
  - Bubble area scales with magnitude via sqrt-normalized radius with an explicit
    MIN_R floor, matching the spec's 'scale area not radius' and 'minimum bubble size'
    notes.
  - Real historical earthquake dataset (33 events, M5.0-M9.5) colored by tectonic
    boundary type, with a subtitle that calls out the Ring of Fire clustering pattern
    as a storytelling hook.
  - Hand-built magnitude size legend (core Highcharts has no bubble legend) is deliberately
    offset to clear the Samoa Islands bubble near the antimeridian, and alpha=0.62
    fill handles the dense California/Chile clusters well.
  - Deterministic render-only jitter for the overlapping California/Baja cluster is
    clearly separated from and documented apart from the true historical lat/lon values.
  - Theme chrome (title, axis, grid, land/ocean fill) correctly flips between light
    and dark while all data colors (green/purple/blue-gray) stay identical.
  weaknesses:
  - Simplified coastline polygons merge Europe, Africa, and Asia into one connected
    blob with no strait/sea gaps (Gibraltar, Suez, Mediterranean) — reduces geographic
    recognizability versus a real basemap; consider adding a couple of narrow sea
    cuts.
  - Dense clusters (California/Baja transform cluster, Chile convergent pair) still
    show meaningful bubble-on-bubble occlusion even after jitter and alpha blending
    — smaller bubbles in those clusters partially disappear under larger overlapping
    ones.
  - Size-legend circles are rendered in a flat neutral gray (t.inkSoft) rather than
    referencing any data color, which is a reasonable choice for a magnitude-only
    legend but could be mistaken for a fourth category at a glance; consider a one-line
    legend caption clarifying it encodes magnitude only, independent of color.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1) canvas around a light-blue ocean fill (#CFE3EF) with tan/beige continent shapes (#E4E0D2) outlined in a soft brown edge — matches the required light theme.
      Chrome: Title "bubble-map-geographic · javascript · highcharts · anyplot.ai" in bold dark text is fully visible and unclipped at the top; the subtitle below it is legible gray-brown text; axis titles "Longitude (°)" / "Latitude (°)" and tick labels are dark and clearly readable against the light background; gridlines are subtle light-gray lines that don't compete with data; the bottom legend ("Convergent boundary" / "Transform boundary" / "Divergent boundary") is legible dark text with matching colored swatches.
      Data: First/majority series (Convergent boundary) renders in Imprint green (#009E73, palette[0]), Transform boundary in a light purple, Divergent boundary in a muted blue-gray — all three are clearly distinguishable by hue, not just red/green. Bubbles are semi-transparent (alpha ~0.62) with a thin light-colored stroke, sized from ~6px (M5.0, Iceland) up to ~30px (M9.5, Valdivia). The hand-drawn "Magnitude" size legend (three reference circles M6.0/M7.5/M9.0 in neutral gray) sits in a bordered box in the lower-left, clear of any data bubble.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black canvas (#1A1A17) around a dark navy ocean fill (#16222E) with dark olive-brown continent shapes (#33332C) — matches the required dark theme, not pure black.
      Chrome: Title and subtitle render in light/off-white text, fully visible and unclipped at the top; axis titles and tick labels are light gray, clearly readable against the dark background — no dark-on-dark failures observed; gridlines are subtle and visible without dominating; the legend at the bottom uses light text with the same colored swatches as the light render.
      Data: Bubble colors are visually identical to the light render (green/purple/blue-gray, same hues and same series-to-boundary mapping) — only the chrome (background, land/ocean fill, text, gridlines) flips between themes, as required. The size-legend box uses the dark elevated-surface fill with light border/text, staying legible.
      Legibility verdict: PASS
