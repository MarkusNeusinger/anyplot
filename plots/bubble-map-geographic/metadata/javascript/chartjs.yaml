review:
  strengths:
  - 'All spec-required features present: bubble-area size legend, alpha (0.6) blending
    for overlapping bubbles, geographic basemap context, minimum bubble radius floor,
    and hover tooltips with exact values'
  - Realistic, factually accurate data — real US cities with plausible population
    figures and correct latitude/longitude coordinates, grouped into sensible regional
    categories
  - Custom Chart.js plugins (beforeDatasetsDraw basemap outline, afterDraw size-legend)
    go beyond basic chart configuration and demonstrate genuine library mastery of
    the plugin architecture
  - 'Full Imprint palette compliance: first categorical series (Northeast) is brand
    green #009E73, remaining regions use canonical palette order, theme-correct chrome
    (background, text, grid) in both light and dark renders'
  - Clean, deterministic, single-file implementation with no fake UI elements and
    explicit font sizing throughout
  weaknesses:
  - In the dense Northeast cluster, the New York and Philadelphia bubbles overlap
    heavily and their shared border strokes blend together, making the two circles
    slightly harder to tell apart at a glance — a marginally higher border contrast
    or z-ordering by size would help
  - The size-legend reference labels (500K/3M/8M, ~13px) are noticeably smaller than
    the rest of the chrome (axis ticks are 14px, legend 16px) — bump to ~14-15px for
    visual consistency
  - The basemap outline is a deliberately rough approximation (per code comment) rather
    than an accurate coastline — acceptable for context but a more detailed outline
    would raise aesthetic polish further
  - No annotation or emphasis calls out the standout data point (New York, largest
    bubble by a wide margin) — a subtle callout would strengthen the data storytelling
    beyond size/color encoding alone
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1-consistent), not pure white.
      Chrome: Title "bubble-map-geographic · javascript · chartjs · anyplot.ai" in bold dark ink, top legend with four circular swatches (Northeast/South/Midwest/West), axis titles "Longitude" and "Latitude" with degree-formatted tick labels (e.g. "120°W", "40°N"), subtle 10-degree gridlines, and a bottom-left "Population" size-legend with three reference circles (500K/3M/8M). All text is dark on the light surface and clearly legible.
      Data: A simplified, lightly-filled continental-US outline sits behind the bubbles. Bubbles are sized by population (area-proportional) and colored by region: green (Northeast) clustered tightly in the mid-Atlantic/New England, lavender (South) across Texas/Southeast, blue (Midwest) around the Great Lakes, ochre (West) along the Pacific coast and interior. The first series (Northeast) correctly renders in brand green #009E73. Overlapping bubbles (e.g. NYC/Philadelphia) show alpha-blended fill.
      Legibility verdict: PASS — no text is unreadable, no clipping at canvas edges (verified via zoomed crops of all four borders).

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17-consistent), not pure black.
      Chrome: Same title, legend, axis titles and tick labels now rendered in light ink against the dark surface, fully legible with no dark-on-dark text. Gridlines are faint but visible. The basemap outline and size-legend circles use light-toned strokes appropriate for the dark surface.
      Data: Bubble colors are pixel-identical to the light render (green/lavender/blue/ochre) — only chrome (background, text, grid, outline strokes) flipped, confirming theme-adaptive tokens were used correctly for all non-data elements.
      Legibility verdict: PASS — all text reads clearly against the dark background; no dark-on-dark or light-on-light failures found.
