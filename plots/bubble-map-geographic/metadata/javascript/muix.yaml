review:
  strengths:
  - Title exactly matches the mandated `bubble-map-geographic · javascript · muix
    · anyplot.ai` format.
  - Well-engineered dual custom legend (population-size reference circles + region
    color swatches) clearly documents both the size and color encodings.
  - Area-accurate bubble sizing (sqrt scaling of population to radius) with a sensible
    MIN_RADIUS floor keeps small cities visible, matching the spec's explicit minimum-bubble-size
    guidance.
  - Alpha transparency (~0.62) combined with largest-first draw order keeps overlapping
    bubbles in dense regions (Europe cluster, Asia-Pacific cluster) legible.
  - Clean, deterministic, single-file dataset with plausible real-world 2023 metro
    population figures across 20 cities spanning 4 world regions — neutral, real-world
    scenario.
  - Theme-adaptive chrome (title, subtitle, axis labels, tick labels, legend text)
    is fully readable in both light and dark renders with no dark-on-dark or light-on-light
    failures.
  weaknesses:
  - 'Missing basemap/geographic context: the spec explicitly asks for ''country boundaries
    or coastlines as basemap''. The implementation substitutes a lon/lat graticule
    grid only — a reasonable workaround given MUI X community''s lack of any geo primitive,
    but it still leaves a required spec feature unmet. If feasible within the community
    surface (e.g. lightweight continent-outline SVG paths added as chart children),
    add faint boundary context; otherwise this is a hard library ceiling worth calling
    out explicitly rather than only in a code comment.'
  - 'Palette identity shifts between themes: the 8-digit alpha hex (`${palette}9E`)
    is composited over different page backgrounds, so e.g. the Africa ''blue'' reads
    as a muted slate-blue on the cream light background but a noticeably richer navy
    on the near-black dark background. The Imprint contract requires data colors to
    look identical across themes (only chrome should flip) — reduce/remove the alpha-driven
    hue drift, e.g. by using a lower fixed alpha with an added stroke for definition
    instead of relying on background compositing.'
  - Axis title and tick label styling relies on MUI X theme defaults (no explicit
    tickLabelStyle/slotProps font sizing) rather than the style guide's 2-3x-larger-than-default
    guidance — currently readable at full resolution but unverified at mobile scale
    (~400px). Set explicit font sizes for the Longitude/Latitude axis labels and tick
    labels to guarantee legibility.
  - Jakarta's population (11.2M) is inconsistent with the 'metro-area' definition
    used for every other city — Jakarta's Jabodetabek metro area is one of the world's
    largest urban agglomerations, commonly cited well above 30M, not 11.2M (which
    corresponds to city-proper boundaries). Correct the figure so all cities use a
    consistent metro-area definition.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Bold dark title "bubble-map-geographic · javascript · muix · anyplot.ai" centered at top, a smaller dark-gray subtitle explaining the size/color encoding beneath it. Longitude (x, °W/°E) and Latitude (y, °N/°S) axis titles and degree-formatted tick labels are dark and clearly legible against the light background. A faint lon/lat graticule (grid) runs across the plot area. Below the plot, two custom legends: a "Population (millions)" size-reference legend (5M/15M/35M open circles) and a 4-swatch region color legend (Asia-Pacific, Europe, Africa, Americas).
      Data: 20 translucent bubbles positioned at city longitude/latitude, sized by population (sqrt-area scaling) and colored by world region — Asia-Pacific green (close to #009E73), Europe lavender/purple, Africa blue, Americas ochre/tan. All bubbles are clearly distinguishable from the background and from each other; overlapping clusters (e.g. Europe near 0-40°E, the Asia-Pacific pair near 120-140°E) stay legible thanks to alpha transparency.
      Legibility verdict: PASS — all text is readable, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title/subtitle now rendered in light/off-white text, fully legible against the dark background. Axis titles and degree-formatted tick labels are light-colored and clearly readable; the graticule grid is faint but visible. Both legends (size-reference circles and region color swatches) retain light-colored labels and are fully legible.
      Data: Same 20 bubbles at identical positions and sizes as the light render, confirming the geometry and size encoding did not change. Colors are recognizably the same hues (green, purple, blue, ochre) as the light render, but not pixel-identical: because each bubble uses an alpha-blended fill composited over the page background, the Africa "blue" in particular reads visibly richer/more saturated navy in the dark render than the muted slate-blue seen in the light render — a real hue shift caused by the alpha compositing against different backgrounds, not just a chrome change.
      Legibility verdict: PASS on text readability — no dark-on-dark failures — but FLAG the alpha-driven data-color shift as a palette-identity issue (see Weaknesses / VQ-07).
