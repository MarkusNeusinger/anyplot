review:
  strengths:
  - Bubble area scales with the value via MUI X's native zAxis continuous sizeMap
    (radius = 46·√share, 9 px floor), shared by the data marks and the size legend
    so the 3/10/30 reference circles match the bubbles exactly
  - Custom Basemap layer built from MUI X's useXScale/useYScale/useDrawingArea hooks
    inside a composed ChartsDataProvider/ChartsSurface, so the coastline polygons
    share the chart's own scales and every bubble sits on its city's coordinates
  - Basemap is quieter than the bubbles in both themes (grid-token land fill, 0.55-opacity
    inkSoft coastlines), and bubbles at 0.6 opacity with a page-colored outline keep
    overlapping cities (London/Paris, Istanbul/Cairo) distinguishable
  - Within each region larger bubbles draw first so smaller ones stay on top
  - Region color legend at the top is separate from the size legend column on the
    right, labeled in the value's units (Metro population (millions))
  - Item-triggered ChartsTooltip with a valueFormatter shows city name and population
    in the HTML output
  - Degree-formatted ticks (°N/°S, °E/°W) and an aspect-corrected equirectangular
    extent computed from the data's mean latitude
  weaknesses:
  - 'Suggestion: the file header still reads ''muix 7.29.1'' while the harness pins
    @mui/x-charts 9.16; the header could state the pinned version.'
  - 'Suggestion: tighten the southern latitude extent (the map runs to about 65°S
    with no data below 35°S) to give the data region more of the drawing area.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, not pure white.
      Chrome: centered bold title "bubble-map-geographic · javascript · muix · anyplot.ai" (~35% width), a gray subtitle "20 cities · bubble area proportional to metro population (millions) · color by world region", a horizontal region legend (Asia-Pacific, Europe, Africa, Americas) below it; axis titles "Longitude"/"Latitude" in dark ink, ticks 120°W–160°E and 60°S–80°N in inkSoft; subtle gray grid every 20°. All text readable dark-on-light.
      Data: simplified world coastline polygons in a light gray fill with thin darker outlines; 20 translucent city bubbles (alpha 0.6, thin page-colored outline) — Asia-Pacific #009E73 (Tokyo, Delhi, Jakarta, Shanghai largest, Sydney small), Europe lavender #C475FD, Africa blue #4467A3, Americas ochre #BD8233. Overlaps (London/Paris, Istanbul/Cairo) remain distinguishable. Right column: size legend titled "Metro population (millions)" with gray reference circles 3, 10, 30 drawn like the data marks.
