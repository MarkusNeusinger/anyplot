review:
  strengths:
  - 'Fixed the attempt-1 palette-identity issue: bubble fills now use solid (non-alpha)
    colors, so data colors are pixel-identical between light and dark renders — confirmed
    by direct crop comparison.'
  - 'Fixed the attempt-1 data-quality issue: Jakarta''s population now uses the same
    metro-area (Jabodetabek) scale as every other city (33.4M).'
  - Explicit tickLabelStyle/labelStyle font sizes now lock in legibility at the CSS
    mount resolution instead of relying on unverified theme defaults.
  - Area-accurate bubble sizing (sqrt scaling) with a MIN_RADIUS floor keeps small
    cities visible, matching the spec's minimum-bubble-size guidance.
  - Well-engineered dual custom legend (population-size reference circles + region
    color swatches) clearly documents both encodings, with no clipping or overflow
    at the canvas edges.
  - Clean, deterministic dataset with plausible real-world 2023 metro populations
    across 20 cities in 4 regions — neutral, real-world scenario.
  - Canonical Imprint palette order used correctly (Asia-Pacific = brand green first),
    and both renders use theme-correct backgrounds/chrome.
  weaknesses:
  - The rotated 'Latitude' axis label overlaps the '20°N' tick label in both renders
    (confirmed via pixel crop) — the axis title sits directly through the tick text
    instead of clearing it. Add left margin / shift the y-axis label position (or
    its offset) so it doesn't collide with whichever tick happens to land near the
    axis-label's vertical center.
  - Same-color overlapping bubbles (e.g. Tokyo/Shanghai, Delhi/Jakarta — both Asia-Pacific
    green) have no stroke/edge to distinguish them; they merge into a single blob
    shape with only the outer contour hinting at two circles. Add a subtle stroke
    (e.g. page-background-colored or theme-ink 1px edge) per the style guide's 'white
    edge for definition, especially with overlapping points' guidance.
  - 'Missing basemap/geographic context: the spec explicitly asks for ''country boundaries
    or coastlines as basemap.'' A lon/lat graticule substitutes — a reasonable workaround
    for MUI X community''s lack of any geo primitive, but the requirement is still
    unmet. This is a known library ceiling (documented in-code) rather than an oversight.'
  - No transparency/alpha is applied to bubble fills (spec suggests alpha ~0.5-0.7
    for overlapping bubbles); the largest-first draw order alone doesn't fully compensate
    for same-color overlap readability (see weakness above).
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Bold dark title "bubble-map-geographic · javascript · muix · anyplot.ai" centered at top, with a dark-gray subtitle beneath it. Longitude (°W/°E) and Latitude (°N/°S) axis titles and degree-formatted tick labels are dark and legible against the light background. A subtle lon/lat graticule (grid) runs across the plot area. Below the plot: a "Population (millions)" size-reference legend (5M/15M/35M open circles) and a 4-swatch region color legend (Asia-Pacific, Europe, Africa, Americas), both cleanly spaced with no clipping at any canvas edge.
      Data: 20 solid-fill bubbles positioned at city longitude/latitude, sized by population (sqrt-area scaling, MIN_RADIUS floor for small cities) and colored by world region — Asia-Pacific = brand green (#009E73, first Imprint slot), Europe = lavender, Africa = blue, Americas = ochre, in canonical Imprint order.
      Legibility verdict: FAIL (localized) — the rotated "Latitude" axis-title text overlaps the "20°N" tick label (confirmed via pixel crop: the "e" of "Latitude" sits directly on top of the "2" of "20°N"). All other text (title, subtitle, other tick labels, both legends) is clearly readable.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Same title/subtitle now rendered in light/off-white text, fully legible. Axis titles, tick labels, and both legends retain light-colored text with no dark-on-dark failures anywhere else on the canvas.
      Data: Bubble fill colors are pixel-identical to the light render (confirmed via crop comparison) — the attempt-1 alpha-compositing hue-shift issue (Africa "blue" reading differently per theme) is fixed by switching to solid fills. Only chrome (background, text, grid) flips between themes, as required.
      Legibility verdict: FAIL (localized) — the same "Latitude"/"20°N" text collision reproduces identically in the dark render (confirmed via pixel crop). All other text is legible with no other dark-on-dark issues.

    Additional check: no AR-09 edge clipping found — title, bottom legends, and left/right axis all sit safely within the canvas with margin to spare in both renders.
