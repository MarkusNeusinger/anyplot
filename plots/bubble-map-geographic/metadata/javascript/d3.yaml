review:
  strengths:
  - 'Idiomatic, advanced use of d3-geo: geoEqualEarth projection, geoPath, and a geoArea-based
    ring-orientation fix that correctly handles antimeridian clipping for hand-authored
    coastlines — a genuinely distinctive D3 technique.'
  - Bubble AREA (not radius) is correctly scaled via d3.scaleSqrt, and fill-opacity
    0.6 alpha-blending handles overlap well in dense clusters (South/East Asia, Nile
    delta).
  - 'Well-constructed size legend: concentric reference circles anchored to a shared
    baseline with tick lines to value labels — clearly communicates the size encoding.'
  - Real hover tooltips (name, population, coordinates) with a genuine mouseenter/mousemove/mouseleave
    interaction — no faked interactivity.
  - Title format, theme-adaptive chrome, and Imprint palette compliance are all correct
    and identical data color across both light and dark renders.
  - Realistic, neutral, factually plausible metro-population data with broad geographic
    spread and a range from 37.4M down to 9.5M.
  weaknesses:
  - 'The size-legend inset panel (bottom-right, `legendX = mapX1 - legendW - 20`,
    `legendY = mapY1 - legendH - 20`) is placed at a fixed map corner without checking
    basemap content underneath — it visually overlaps and hides part of the Australia
    landmass in both renders (confirmed by pixel-diffing plot-light.png/plot-dark.png:
    the Australia land-color blob at x:2486-2789, y:1195-1432 is clipped by the legend
    box at x:2910-3120, y:1570-1730... the legend''s rounded rect corner cuts directly
    across Australia''s southeast coastline). Reposition the legend to open ocean
    (e.g. shift further into the empty bottom-right, or move to a corner with no landmass
    in this projection/fitExtent), or verify against the projected land bounding boxes
    before placing it.'
  - Hand-simplified coastline rings (EURASIA, AFRICA in particular) are visibly low-vertex/blocky
    — the Sahara-to-Arabia stretch and the Horn of Africa read as faceted polygons
    rather than smooth coastlines, which caps the aesthetic sophistication below publication-ready.
    Adding a modest number of intermediate points along the straightest/most angular
    segments would read as noticeably more polished at this canvas size.
  - The legend's largest reference circle is labeled 35M, but the largest actual bubble
    (Tokyo, 37.4M) is slightly bigger than that reference circle — round the top legend
    value up to (or past) the true data max so the legend never under-represents the
    largest bubble on the map.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Bold dark title "World Megacities by Population · bubble-map-geographic · javascript · d3 · anyplot.ai" and a lighter gray subtitle "Bubble area ∝ metro-area population · fewer, larger markers avoid overplotting" are both centered and fully readable against the light background. The size-legend box ("Population (millions)", bottom-right) has a dark bold header and gray value labels (35M/20M/10M), all legible on its off-white elevated panel.
      Data: Continents are rendered as neutral warm-gray filled polygons (coastline basemap, no country borders) with a thin, subtle stroke. 24 city bubbles are filled in the brand green (#009E73) at ~60% opacity with a thin light stroke for definition, sized by population (Tokyo largest, London smallest). Overlapping clusters (Delhi/Mumbai/Kolkata, Cairo/Istanbul, Lagos/Kinshasa, São Paulo/Rio, Mexico City/New York, Tokyo/Osaka) are distinguishable thanks to alpha blending and outlines. The size legend's bottom-right panel overlaps part of the Australia landmass, clipping its southeast coastline behind the panel.
      Legibility verdict: PASS (all text readable; the Australia-overlap is a layout/content issue, not a text-legibility failure).

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Title and subtitle render in light ink/soft-ink tones, fully readable against the dark background — no dark-on-dark failures. The legend panel is a dark elevated surface (#242420-equivalent) with light text, readable.
      Data: Continents render as a slightly lighter neutral gray than the background, land bubbles remain identical brand green (#009E73) to the light render — confirmed data colors are unchanged between themes, only chrome (background, land fill, text, legend box) flips. Same Australia/legend overlap is present here as well.
      Legibility verdict: PASS (all text readable in both themes; no dark-on-dark or light-on-light failures found).
