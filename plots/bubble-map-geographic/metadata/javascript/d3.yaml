review:
  strengths:
  - 'Legend/basemap overlap from the previous review is fixed: the size-legend inset
    panel was moved to the empty Pacific strip left of North America (mapX0+20), verified
    clear of every landmass and bubble in both renders — no more clipped Australia
    coastline.'
  - The legend's largest reference value was raised from 35M to 40M, so it now correctly
    exceeds the largest actual bubble (Tokyo, 37.4M) instead of under-representing
    it.
  - Coastline blockiness was directly addressed with a new densify() helper that inserts
    deterministic perpendicular-bulge vertices along long straight ring edges, giving
    the hand-authored coastlines a noticeably more organic, less faceted read at this
    canvas size.
  - Idiomatic, advanced d3-geo usage (geoEqualEarth, geoPath, fitExtent) plus a geoArea-based
    ring-winding correction that correctly handles antimeridian clipping for hand-authored
    coastlines — a genuinely distinctive D3 technique.
  - Bubble AREA (not radius) is correctly scaled via d3.scaleSqrt, and fill-opacity
    0.6 alpha-blending handles overlap well in dense clusters (South/East Asia, Nile
    delta) exactly as the spec recommends.
  - Real hover tooltips (name, population, coordinates) driven by genuine mouseenter/mousemove/mouseleave
    handlers — no faked interactivity — plus theme-adaptive chrome that is correct
    and identical in data color across both renders.
  - Realistic, neutral, factually plausible metro-population data (37.4M down to 9.5M)
    tracking real UN World Urbanization Prospects estimates.
  weaknesses:
  - Hand-simplified coastline rings (EURASIA, AFRICA especially) are improved by densify()
    but still read as somewhat low-vertex/blocky on close inspection — a fully publication-ready
    basemap would need still more intermediate points along the Sahara-to-Arabia stretch
    and the Horn of Africa.
  - Element sizing (bubble radius range 6-34px for 24 points) is visible and readable
    but not re-tuned from the prior attempt — still relies on the same range that
    the prior review scored as good-but-not-optimal.
  - Data storytelling remains purely encoding-driven (size + z-order sort) with no
    annotation or callout highlighting a specific insight (e.g. the S/E Asia population
    cluster) — acceptable since the spec doesn't require annotations, but a missed
    opportunity for a stronger focal point.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white, not dark.
      Chrome: Bold dark title "World Megacities by Population · bubble-map-geographic · javascript · d3 · anyplot.ai" and a lighter gray subtitle "Bubble area ∝ metro-area population · fewer, larger markers avoid overplotting" are both centered above the map and fully readable against the light background. The size-legend box ("Population (millions)", bottom-left this time, over open Pacific ocean) has a dark bold header and gray value labels (40M/20M/10M) with baseline-aligned reference circles, all legible on its off-white elevated panel, and — unlike the previous attempt — does not overlap any landmass.
      Data: Continents render as neutral warm-gray filled polygons (coastline basemap, no country borders) with a thin, subtle stroke; edges look a bit more organic than a raw polygon thanks to the added densify() bulge vertices, though still simplified. 24 city bubbles are filled in brand green (#009E73) at ~60% opacity with a thin light stroke for definition, sized by population (Tokyo largest, London smallest). Overlapping clusters (Delhi/Mumbai/Kolkata/Dhaka/Karachi, Cairo/Istanbul, Lagos/Kinshasa, São Paulo/Rio, Tokyo/Osaka) are distinguishable thanks to alpha blending and outlines.
      Legibility verdict: PASS — all text readable, no dark-on-dark/light-on-light issues, and the legend no longer clips any basemap content.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black, not light.
      Chrome: Title and subtitle render in light ink / soft-ink tones, fully readable against the dark background — no dark-on-dark failures. The legend panel is a dark elevated surface (#242420-equivalent) with light text, readable, same bottom-left ocean placement, still clear of any landmass.
      Data: Continents render as a slightly lighter neutral gray than the background; bubbles remain identical brand green (#009E73) to the light render — data colors are unchanged between themes, only chrome (background, land fill, text, legend box) flips as expected.
      Legibility verdict: PASS — all text readable in both themes; no dark-on-dark or light-on-light failures found; no legend/landmass overlap in this theme either.
