review:
  strengths:
  - 'Directly addresses attempt 1''s core weakness: a hand-traced continent basemap
    (5 custom `renderItem` polygon series projected via `api.coord`) now sits beneath
    the bubbles, so the chart reads as a recognizable world map instead of an abstract
    lon/lat scatter -- mirrors the precedent technique from hexbin-map-geographic.'
  - Bubble diameter still scales via sqrt(value) so bubble AREA is proportional to
    population; SIZE_MIN was raised from 16 to 24 CSS px, making the smallest bubbles
    (Sydney/Melbourne ~5.2-5.3M) clearly visible against the sparse 23-point dataset.
  - 'New per-bubble border (`borderColor: t.pageBg`) helps separate overlapping circles
    in the dense Asia cluster without relying on the PNG-invisible tooltip.'
  - First categorical series is Imprint brand green (#009E73), remaining five continents
    follow canonical palette order; data colors are pixel-identical between renders
    and only chrome (background, text, grid, basemap fill) flips theme-correctly (FAF8F1/1A1A17).
  - Custom size-key legend (37M/15M/5M reference circles sized via the same bubbleSize()
    function) accurately documents the size-to-value mapping.
  - Realistic, neutral, roughly factually-correct metro population figures spanning
    a wide range of city sizes across all six inhabited continents.
  - 'Title format and legend labels correct; deterministic in-memory data; follows
    the mount-node contract (no explicit width/height, animation: false).'
  weaknesses:
  - The 8-city Asia cluster (Tokyo, Delhi, Shanghai, Dhaka, Beijing, Mumbai, Osaka,
    Karachi) still packs into a tight region where large bubbles heavily overlap;
    the new page-background border helps separate them but several city pairs (Tokyo/Osaka,
    Delhi/Mumbai, Shanghai/Beijing) still blend into a partially indistinct cluster
    in the static PNG -- consider a touch more opacity contrast or slight positional
    nudging to keep individual cities distinguishable.
  - The chart grid (1300x560 CSS px within a 1600x900 mount) leaves a sizeable blank
    band below the map (~20% of canvas height, roughly from the southern edge of the
    plotted latitude range to the canvas bottom) -- likely a deliberate longitude/latitude
    aspect-ratio trade-off, but tightening the y-axis domain further or centering
    the grid vertically would reduce the wasted whitespace.
  - No echarts geo component or visualMap is used; the basemap is a clever custom-series
    workaround but doesn't yet showcase echarts' native geographic tooling -- fine
    given no external map JSON is available, but worth noting for library-mastery
    ceiling.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (~#FAF8F1), matches the required light-theme surface.
      Chrome: Title "World City Populations · bubble-map-geographic · javascript · echarts · anyplot.ai" centered at top in dark ink; a 6-entry horizontal legend (Asia, Africa, Europe, N. America, S. America, Oceania) below it; "Longitude" axis name centered under the x-axis with tick labels every 30 degrees suffixed W/E; "Latitude" axis name at the top-left of the y-axis with tick labels every 30 degrees suffixed N/S; a right-side "Population (M)" size-key legend with 37M/15M/5M reference circles. A light-grey continent basemap (rough hand-traced outlines for North America, South America, Africa, Eurasia, and Australia) now sits beneath the bubbles, giving clear geographic context. All text renders in dark ink/soft-ink tones and is clearly legible against the light background; no clipping at any canvas edge.
      Data: 23 bubbles positioned by real longitude/latitude on top of their correct continents, colored by continent (Asia = Imprint brand green #009E73, Africa = lavender, Europe = blue, N. America = ochre, S. America = matte red, Oceania = cyan), sized by sqrt(population) with ~0.58 fill opacity and a thin page-background-colored border separating overlapping circles. The Asia cluster (8 cities) still overlaps somewhat but individual bubble edges remain distinguishable thanks to the border.
      Legibility verdict: PASS (all text readable, no dark-on-dark/light-on-light issues, no edge clipping).

    Dark render (plot-dark.png):
      Background: Warm near-black (~#1A1A17), matches the required dark-theme surface.
      Chrome: Identical layout to the light render -- title, legend, axis names/ticks, and size-key legend all re-rendered in light ink/soft-ink tones (white/light-gray text) against the dark background. The continent basemap fill/stroke also flips to a darker, still-visible grey tone appropriate for the dark surface. No dark-on-dark or light-on-light failures observed; every label is clearly legible; no edge clipping.
      Data: Same 23 bubbles at the same lon/lat positions with identical fill colors and sizes as the light render (confirmed pixel-for-pixel color match across themes) -- only the chrome (background, text, grid, basemap fill) flipped tone.
      Legibility verdict: PASS (all text readable, no dark-on-dark failures, brand green #009E73 reads clearly on the dark surface).
