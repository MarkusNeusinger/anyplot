review:
  strengths:
  - Bubble diameter is scaled via sqrt(value) so bubble AREA (not radius) is proportional
    to population, exactly matching the spec's perception rule.
  - Custom size-key legend (37M/15M/5M reference circles with radii computed via the
    same bubbleSize() function) accurately documents the size-to-value mapping.
  - First categorical series is the Imprint brand green (#009E73) and the remaining
    five continents follow canonical palette order; both renders keep data colors
    identical and flip only chrome correctly (confirmed FAF8F1/1A1A17 backgrounds,
    ink/inkSoft text).
  - Realistic, neutral, roughly factually-correct metro population figures (Tokyo
    37.4M, Delhi 32.9M, etc.) spanning a meaningful range of city sizes.
  - Title format and legend labels are correct; tooltip formatter surfaces exact city
    name and population for the interactive HTML view.
  - 'Deterministic, in-memory data with no external fetches, following the mount-node
    contract (no explicit width/height, animation: false).'
  weaknesses:
  - 'Spec explicitly requires ''geographic context with country boundaries or coastlines
    as basemap'', but the implementation renders lon/lat purely as generic numeric
    value axes with no landmass, coastline, or country outline at all -- it reads
    as an abstract scatter chart rather than a world bubble map. This repo already
    has a working precedent for exactly this problem: plots/hexbin-map-geographic/implementations/javascript/echarts.js
    hand-codes a coastline polyline plus an ocean-tint custom series drawn in the
    same cartesian2d coordinate system used here (no echarts-gl, no registerMap, no
    network fetch needed) -- apply the same technique at world scale: add a simplified
    continent-outline polyline/polygon series (rough coordinates are fine, e.g. a
    low-vertex hand-traced world outline) rendered with type: ''line''/''custom''
    beneath the bubble series, so the chart is visually recognizable as a world map
    at a glance.'
  - 'The Asia cluster (8 overlapping cities: Tokyo, Delhi, Shanghai, Dhaka, Beijing,
    Mumbai, Osaka, Karachi) packs into a tight region where large, heavily-overlapping
    bubbles blend into an indistinct blob in the static PNG -- consider slightly reducing
    max bubble size or increasing opacity contrast so individual cities stay distinguishable
    without relying on the (PNG-invisible) tooltip.'
  - Smallest bubbles (Sydney/Melbourne at ~5.2-5.3M, SIZE_MIN=16 CSS px diameter)
    are quite small relative to the 1600-css-px-wide mount for only 23 total data
    points -- per the data-density heuristic, sparse datasets (<50 points) should
    use larger, more prominent markers; raise SIZE_MIN so low-value cities stay clearly
    visible at both desktop and mobile widths.
  - Y-axis domain (-60 to 85) leaves a large empty band above ~55N and below ~-38
    (no data there), wasting roughly a third of the vertical plot area -- tightening
    the latitude range (or adding a visible basemap that naturally justifies the extra
    frame) would improve canvas utilization.
  - Design is a well-configured, sound scatter chart but lacks a strong distinctive-to-echarts
    feature (no geo component, no visualMap, no custom renderItem) -- once a basemap
    layer is added, consider drawing it as an echarts custom series (as hexbin-map-geographic
    does) to also lift Library Mastery.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (~#FAF8F1), matches the required light-theme surface.
      Chrome: Title "World City Populations · bubble-map-geographic · javascript · echarts · anyplot.ai" centered at top in dark ink; a 6-entry horizontal legend (Asia, Africa, Europe, N. America, S. America, Oceania) below it; "Longitude" axis name centered under the x-axis with tick labels every 30° suffixed W/E; "Latitude" axis name at the top-left of the y-axis with tick labels every 30° suffixed N/S; a right-side "Population (M)" size-key legend with 37M/15M/5M reference circles. All text renders in dark ink/soft-ink tones and is clearly legible against the light background.
      Data: 23 bubbles positioned by real longitude/latitude, colored by continent (Asia = Imprint brand green #009E73, Africa = lavender, Europe = blue, N. America = ochre, S. America = matte red, Oceania = cyan), sized by sqrt(population) with ~0.62 fill opacity. No basemap, coastline, or country outline is present -- only a plain gridded value-axis plane with faint dashed reference lines at the equator and prime meridian, so the chart reads as an abstract lon/lat scatter plot rather than a recognizable world map.
      Legibility verdict: PASS (all text readable, no dark-on-dark/light-on-light issues).

    Dark render (plot-dark.png):
      Background: Warm near-black (~#1A1A17), matches the required dark-theme surface.
      Chrome: Identical layout to the light render -- title, legend, axis names/ticks, and size-key legend all re-rendered in light ink/soft-ink tones (white/light-gray text) against the dark background. No dark-on-dark or light-on-light failures observed; every label is clearly legible.
      Data: Same 23 bubbles at the same lon/lat positions with identical fill colors and sizes as the light render (confirmed pixel-for-pixel color match across themes) -- only the chrome (background, text, grid, dashed reference lines) flipped tone. Same absence of any basemap/coastline/country-outline layer.
      Legibility verdict: PASS (all text readable, no dark-on-dark failures).
