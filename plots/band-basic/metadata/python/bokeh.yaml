review:
  strengths:
  - Bokeh's native varea glyph draws the band straight from DataFrame columns via
    ColumnDataSource, with legend_label on each glyph
  - Theme-adaptive band alpha (0.25 light / 0.38 dark) keeps the fill distinct from
    both page colors while gridlines stay visible through it
  - 'Data tells a physical story: the interval is tight at clear-sky midday and widens
    in the convective afternoon'
  - Dark render is clean to the canvas edge because the page is painted in the theme
    color before the screenshot
  weaknesses:
  - 'Suggestion: a HoverTool showing hour, mean and bounds would add Bokeh''s interactivity
    to the HTML artifact.'
  - 'Suggestion: the title prefix could name the uncertainty source (for example ''95%
    interval, convective afternoon''), as the Notes invite.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across canvas and plot area.
