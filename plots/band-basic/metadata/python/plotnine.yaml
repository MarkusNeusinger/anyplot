  strengths:
  - 'Single geom_ribbon at alpha 0.35 in Imprint #009E73 with a contrasting central
    line on top in both themes'
  - Linear segments through every value, no smoothing; y ticks at round 15/20/25 °C
  - Theme-adaptive chrome threaded through every text and line element
  weaknesses:
  - 'SC-01 (both): a dashed vertical separator at day 15 and the ''Calibration Phase''
    / ''Extrapolation'' callouts are layers the basic band spec excludes → remove
    both, one band and its central line only. Likely cause: the annotate(''segment'')
    and two annotate(''text'') calls.'
  - 'VQ-01 (both): the zone labels at annotate size 3.5 render at about 3.5 pt, below
    the 8 pt tick reference, and read small beside the other text → at least 8 pt
    (+4.5 pt), moot once the callouts are removed. Likely cause: annotate(''text'',
    size=3.5).'
  - 'Suggestion: a library feature beyond geom_ribbon, such as a stat that computes
    the band, would show more of plotnine.'
