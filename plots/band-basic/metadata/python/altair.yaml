review:
  strengths:
  - Brand-green central line drawn on top with monotone interpolation through every
    value
  - Native Altair nearest-point selection (selection_point with alt.condition) drives
    a hover point, guide rule and tooltips in the HTML
  - Theme tokens correctly flip all chrome in both renders
  weaknesses:
  - 'SC-01 (both): a second, nested 50% band is drawn inside the 95% band, which the
    basic variant excludes (C5) → one band only. Likely cause: the band_inner layer
    and the y_inner_lower/y_inner_upper columns.'
  - 'SC-01 (both): a dashed red vertical rule with the bold label ''95% CI: +-3.7
    mV'' at t about 9.1 is a callout the basic variant excludes (C5) → remove it.
    Likely cause: the ann_rule and ann_text layers.'
  - 'SC-02 (both): the outer band is drawn at opacity 0.15, below the Notes'' 0.2-0.4,
    and nearly merges with the dark page → 0.2-0.4 (+0.05 at least). Likely cause:
    mark_area(opacity=0.15).'
  - 'VQ-05 (both): the chart is rendered at a 620x320 view and padded to 3200x1800,
    leaving an empty page-colored frame around it → fill the canvas with width=800,
    height=450 and autosize fit. Likely cause: the PIL padding block instead of autosize=alt.AutoSizeParams(type=''fit'',
    contains=''padding'').'
  - 'CQ-04 (code): the PIL Image padding block (about 15 lines) hand-builds what autosize
    fit computes, and ELEVATED_BG plus np.random.seed(42) are unused → autosize fit
    and delete the dead lines. Likely cause: the older canvas recipe.'
  - 'Suggestion: the y axis title could say what the band represents, since the band
    has no key.'
