review:
  strengths:
  - 'Clean ggplot grammar: geom_ribbon for the band and geom_line for the center line,
    reading the tidy df via column constants'
  - Theme-adaptive band alpha (0.25 light, 0.4 dark) inside the spec's 0.2-0.4 range
    keeps the band distinct on both pages
  - Axis limits derived from the data with small pads instead of typed numbers
  - Plausible battery-fade scenario with a widening, heteroscedastic tolerance band
  weaknesses:
  - 'DE-02 (both): a full four-sided panel frame encloses the plot in both renders
    where nothing requires it → keep only the bottom axis line (L-shape or none),
    drop the top, right and left frame lines. Likely cause: a panel border inherited
    by the PNG export; set panel_border=element_blank() in anyplot_theme.'
  - 'Suggestion: use the style guide''s 15 % INK grid token (rgba) instead of solid
    INK_MUTED for a quieter grid.'
  image_description: |-
    Light render (plot-light.png):
