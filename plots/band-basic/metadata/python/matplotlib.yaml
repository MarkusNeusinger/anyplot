review:
  strengths:
  - Gradient fill of the required band via pcolormesh with gouraud shading and an
    alpha-ramped custom colormap kept within the Notes' 0.2-0.4, a matplotlib-native
    technique
  - Center line drawn on top in contrasting Imprint lavender with a patheffects glow;
    boundaries and center pass through every data value with straight segments
  - Complete theme-adaptive chrome; both renders readable with no dark-on-dark text
  - Asymmetric, widening 95% CI gives a realistic extended-range forecast
  weaknesses:
  - 'Suggestion: the gouraud mesh shows a faint dotted texture in the light render;
    a finer mesh or antialiasing could smooth it.'
  - 'Suggestion: vectorise the per-column loop that fills Y and C (np.linspace with
    array endpoints) for a shorter mesh block.'
