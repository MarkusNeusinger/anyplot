review:
  strengths:
  - Band drawn as one closed XY polygon with fill=True and 0.25 opacity, so the dashed
    y grid stays visible through it in both themes
  - Uniform tick labels with unit formatters ('0h'…'48h', '16.0%'…'44.0%') on a 4
    % grid make values readable
  - Theme tokens threaded through Style, including guide_stroke_color, so grid and
    chrome adapt correctly in dark
  - Column-name constants and a pandas DataFrame make the data block easy to swap
    for a real table
  weaknesses:
  - 'VQ-03 (both): the central line renders at about 3 px instead of the requested
    10 px, and in the dark render the blue #4467A3 barely separates from the dark-green
    fill in the dark render → a clearly heavier line (about 6-8 px). Likely cause:
    stroke_style width is overridden by Style stroke_width=2.5 / the series stroke
    width is not applied in the PNG render.'
  - 'SC-02 (both): a vertical stroke at x=0 runs from the band''s left edge (~38 %)
    down to the axis floor (~14.5 %), drawing outside the two boundaries → nothing
    drawn below the lower boundary. Likely cause: pygal''s fill=True closes the series
    path down to the baseline at the first point; the band stroke (stroke_style width)
    traces that closing segment.'
  - 'Suggestion: put the two legend entries side by side at the left instead of spreading
    them over two half-width columns.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across canvas and plot area.
      Chrome: title 'band-basic · python · pygal · anyplot.ai' centered in dark ink; y title 'Soil Moisture (%)', x title 'Time (hours)'; y ticks 16.0%-44.0% every 4 %, x ticks 0h-48h every 6 h, all one size and readable; dashed muted gridlines; legend at bottom with two entries.
      Data: semi-transparent #009E73 band from about 38-41 % at 0 h narrowing/widening through a dip near 18 h and a drop to 19-26 % at 48 h; blue #4467A3 central line inside the band, thin (about 3 px); a stray thin green vertical stroke at x=0 runs from the band down to the axis floor.
      Legibility verdict: PASS

