review:
  strengths:
  - Band drawn as one closed XY polygon (upper boundary forward, lower reversed) with
    fill=True and 0.25 opacity, following both boundaries at every x
  - 'An inline: rule in pygal''s css config zeroes the band series'' stroke, removing
    the baseline-closing stroke pygal adds to filled series'
  - Uniform tick labels with unit formatters ('0h'…'48h', '16.0%'…'44.0%') on a 4
    % grid
  - Theme tokens threaded through Style, including guide_stroke_color, so chrome adapts
    correctly in dark
  - value_formatter / x_value_formatter give readable values in the HTML tooltips
  weaknesses:
  - 'SC-02 (both): the dashed y gridlines disappear wherever they cross the band (e.g.
    28 % and 32 % lines between 18 h and 36 h), so the fill does not let gridlines
    show through as C2 asks → gridlines visible through the band in both themes. Likely
    cause: the guide lines are hidden behind the band layer in the cairosvg PNG render;
    the band''s fill needs a lower effective opacity over the guides or the guides
    need to be drawn above the series (pygal''s css config).'
  - 'Suggestion: put the two legend entries side by side at the left instead of spreading
    them over two half-width columns.'
