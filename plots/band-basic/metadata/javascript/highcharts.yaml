review:
  strengths:
  - 'Clever core-bundle-only workaround: builds the band from two stacked areaspline
    series (invisible base + visible band height) plus a spline center line, since
    arearange lives in highcharts-more which isn''t loaded — a genuinely idiomatic
    solution to a real Highcharts constraint'
  - Band width correctly widens with the forecast horizon (halfWidth = 8 + 0.5*t),
    visually demonstrating the core 'growing uncertainty' feature a band plot exists
    to show
  - 'Data colors are theme-invariant and chrome is fully theme-adaptive in both renders
    — first series is Imprint brand green #009E73 as required'
  - Realistic, neutral scientific scenario (sea-level-rise projection) with a starting
    value (~228mm since 1900) that matches real-world observational data
  - Clean, deterministic, KISS-structured code with an explanatory comment on the
    non-obvious stacking-order trick
  weaknesses:
  - yAxis is forced to start at 0 by the stacking technique (the invisible spacer
    series stacks from 0), leaving roughly the bottom 40% of the plot area as dead
    whitespace since data never goes below ~220mm. Set yAxis.min (e.g. ~150-200) to
    crop that unused range — the invisible spacer series is transparent so cropping
    it doesn't break the stacking math, it just tightens the visible viewport and
    gives the band/line much more vertical presence.
  - Band fill and center line both use the exact same hue (palette[0]) distinguished
    only by opacity/line-width — acceptable for a band-around-a-trend convention,
    but combined with the wasted vertical space above, the chart reads as visually
    flat/under-designed rather than polished (no additional refinement like annotating
    the current-decade value or emphasizing the widening band with a subtle end-of-line
    data label).
  - Title is noticeably narrow relative to the canvas (~30% of plot width) since spec-id
    'band-basic' is short — not a violation of any rule, but there's room to grow
    the title/subtitle font slightly or add a short descriptive prefix for better
    visual balance without risking overflow.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "band-basic · javascript · highcharts · anyplot.ai" in bold dark ink, clearly visible; subtitle "Projected sea level rise, moderate-emissions scenario · 95% prediction interval" in softer dark gray, readable. X-axis "Year" (2030-2070, step 10) and Y-axis "Sea Level Rise Since 1900 (mm)" (0-600, step 50) tick labels and axis titles are dark and legible against the light background. Subtle horizontal gridlines only, no vertical gridlines. Legend at bottom center: "95% prediction interval" (light green swatch) and "Projected mean" (green line swatch), both readable.
      Data: Semi-transparent light-green band (Imprint brand green #009E73 at ~0.25 opacity) widening steadily from left to right; a solid, more saturated green spline (also #009E73, full opacity, lineWidth 3) runs through the center of the band, clearly rising from ~230mm (2025) to ~520mm (2075). First/only categorical hue used is the mandated brand green.
      Legibility verdict: PASS — all text is clearly readable against the light background, no dark-on-light or light-on-light failures.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title and subtitle text now rendered in light/off-white ink, clearly legible against the dark background. Axis titles and tick labels are rendered in a soft light gray, fully legible. Gridlines are faint light horizontal lines, subtle but visible. Legend text is light-colored and readable.
      Data: The band fill and center line use the identical #009E73 hue as the light render (confirmed — same brand green, same relative opacity), only appearing visually brighter/more saturated due to contrast with the dark background, which is expected and not a hue change. No dark-on-dark or unreadable text anywhere.
      Legibility verdict: PASS — no dark-on-dark failures; all chrome elements are correctly theme-adapted.
