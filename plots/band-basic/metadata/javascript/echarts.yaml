review:
  strengths:
  - 'Idiomatic ECharts stacked-area technique for the confidence band (hidden lower-bound
    line + non-negative span series stacked with stack: "confidence-band") — the correct
    native ECharts recipe for a range/band chart'
  - 'Realistic, neutral weather-forecast scenario that tells a clear story: uncertainty
    widens with lead time (classic forecast-skill decay), diurnal cycle plus mild
    warming drift on the central trend'
  - 'Theme-correct chrome in both renders — background, ink, inkSoft, and grid all
    sourced from ANYPLOT_TOKENS; brand green #009E73 identical across light and dark'
  - Custom tooltip formatter computes the live 90% range per hour, adding real value
    in the interactive HTML detail view
  - Deterministic in-memory data via a seeded LCG (seed=42), no fetch/network calls,
    reproducible across runs
  weaknesses:
  - 'Band boundary series ("Lower bound", "90% confidence band") don''t set smooth,
    while the center line uses smooth: 0.3 — a minor inconsistency between the smoothed
    trend line and the linearly-interpolated band edges; not very visible at 48pt
    density but worth aligning for polish'
  - 'Center-line markers (symbolSize: 6) are modest for a ~48-point series; per the
    style guide''s density heuristic, slightly larger markers (8-10) would be more
    prominent without crowding'
  - x-axis max is pinned to HOURS-1 (47), producing an uneven last tick interval (40
    to 47) versus the even 10-unit steps before it — minor tick-spacing imbalance
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white, not dark.
      Chrome: Title "band-basic · javascript · echarts · anyplot.ai" centered at top in dark ink, clearly legible. Legend ("90% confidence band", "Forecast temperature") sits just below the title with dark text and green swatches. X-axis "Hours Since Forecast Issued" and Y-axis "Temperature (°C)" are dark, readable, well-balanced in size. Tick labels are legible gray-ink. Subtle horizontal gridlines only (y-axis), no vertical gridlines.
      Data: Brand green (#009E73) used for both the center forecast line (with circular markers, smooth curve) and the semi-transparent confidence band (~0.22 alpha fill) beneath/around it. Band widens visibly from hour 0 toward hour 47, and narrows again mid-forecast — matches the forecast-skill-decay pattern from the spec.
      Legibility verdict: PASS — all text is clearly readable against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black, not light.
      Chrome: Title, legend, and axis text all render in light ink/gray tones, fully legible against the dark surface. Gridlines remain subtle. No dark-on-dark failures observed — every text element (title, legend, axis names, tick labels) is clearly visible.
      Data: Data colors are identical to the light render — the forecast line and confidence band both use the same brand green #009E73, only the chrome (background/text/grid) flipped to the dark theme tokens, as required.
      Legibility verdict: PASS — all text is clearly readable against the dark background; no dark-on-dark failures found.
