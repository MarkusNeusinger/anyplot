review:
  strengths:
  - 'Correct ECharts idiom: two stacked line series (invisible lower bound + span)
    with transparent line/opacity area is the well-known ECharts technique for building
    a range band, rather than a workaround.'
  - 'Central forecast line renders in brand green #009E73 with visible markers, clearly
    contrasting against the translucent 22%-opacity band fill.'
  - 'Deterministic LCG-seeded data models a realistic, neutral weather-forecast scenario:
    diurnal temperature cycle plus a 90% confidence band that widens with lead time,
    matching real forecast-skill decay.'
  - Custom tooltip formatter surfaces the forecast value and the confidence range
    together in the interactive HTML view.
  - Both light and dark renders correctly theme-adapt background, text, and grid;
    the data colors stay visually identical across themes with only chrome flipping.
  weaknesses:
  - 'Legend swatch for "90% confidence band" renders in ECharts'' built-in default
    color (a yellowish-green, roughly #91cc75) instead of the Imprint brand green
    used for the actual band fill, because the series never sets itemStyle.color and
    no top-level color: t.palette array is set. Fix: add itemStyle: { color: t.palette[0]
    } to the "90% confidence band" series (or set the top-level color: t.palette array)
    so the legend swatch matches the rendered band exactly.'
  - 'Y-axis auto-includes zero (no min or scale: true), wasting roughly a quarter
    of the vertical plot area below the lowest band value (~8.8°C) down to 0. Setting
    scale: true or an explicit min would let the band/line fill more of the canvas
    and read as more intentional.'
  - The confidence band only widens monotonically with lead time; a touch more variation
    (e.g. temporary narrowing) would better demonstrate how the band responds to changing
    uncertainty, though this is a minor nice-to-have.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "band-basic · javascript · echarts · anyplot.ai" in dark ink, centered top. Legend below title with two entries ("90% confidence band", "Forecast temperature"). Y-axis label "Temperature (°C)" (rotated), x-axis label "Hours Since Forecast Issued". Tick labels on both axes in soft gray-ink. Subtle horizontal gridlines only (y-axis), no vertical gridlines. All chrome text is clearly legible against the light background.
      Data: A translucent green band (90% confidence interval) spans roughly 8-29°C over hours 0-47, following a double diurnal hump and widening steadily with lead time. A solid brand-green (#009E73) line with small circular markers tracks the central forecast through the middle of the band. First (and only real) data series correctly uses #009E73.
      Legibility verdict: PASS — however the legend swatch for "90% confidence band" is a yellow-green dot that does NOT match the actual teal-green band fill color (see weaknesses — likely ECharts' default itemStyle color, not Imprint).

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title, legend, and axis labels now rendered in light ink/off-white, clearly readable against the dark background. Gridlines are subtle and still visible. No dark-on-dark text found anywhere.
      Data: Band and center line colors are visually identical to the light render (band area teal-green with lower opacity against the dark backdrop, forecast line the same brand green #009E73) — confirms data colors are theme-independent as required.
      Legibility verdict: PASS — same legend-swatch color mismatch as the light render (cosmetic legend icon only, not the actual data fill).
