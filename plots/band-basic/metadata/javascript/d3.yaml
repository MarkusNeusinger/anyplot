review:
  strengths:
  - 'Band + center-line combination is fully correct: d3.area() draws the fill between
    yLower/yUpper, d3.line() draws the trend, both using curveMonotoneX for smooth
    interpolation as the spec requests'
  - Fill opacity 0.28 sits squarely inside the spec's 0.2-0.4 range, and the band
    stays clearly legible on both the light and dark surfaces
  - Deterministic LCG (seed=42) generates the streamflow series in-memory with no
    fetch/CSV/JSON load, matching the D3 reproducibility rule
  - Forecast uncertainty growing with lead time (spread = 3 + 0.35*day) is a physically
    sensible touch for a prediction-interval band, not just decorative width
  - 'Theme-adaptive chrome is threaded correctly throughout: axis text, ticks, domain
    lines, grid, title, and subtitle all pull from window.ANYPLOT_TOKENS, and the
    first (only) series is the mandated #009E73'
  - 'Title format is exactly right: ''Streamflow Forecast · band-basic · javascript
    · d3 · anyplot.ai'', with a subtitle that explains what the band represents (serves
    as an implicit legend for the two visual elements)'
  - 'Clean KISS structure: flat top-to-bottom script with explicit font sizes (14/15/16/22px),
    y-axis-only subtle grid, and an L-shaped (left+bottom only) spine frame'
  weaknesses:
  - Design Excellence is capped by a flat, single-opacity fill on the band — a native
    SVG <linearGradient> (e.g. fading opacity slightly from the center line outward,
    or top-to-bottom) would add real polish without breaking the Imprint color rule
    (still built only from t.palette[0])
  - No visual emphasis calls out the actual insight (uncertainty roughly doubling
    from day 1 to day 60) — a small text annotation or thin guide line near the widest
    part of the band would give the reader an immediate takeaway per DE-03
  - 'Library Mastery is generic: area()+line()+scaleLinear()+axisBottom/Left is idiomatic
    D3 but easily replicated in any charting library. Since D3 is an interactive library
    and the harness ships an HTML detail view, consider adding a genuine (non-fake)
    mousemove handler that shows a guide line + the day/lower/center/upper values
    at the cursor — this is real interactivity (not AR-08 fake tooltips) and would
    make the implementation distinctively D3'
  - Title occupies roughly 45-50% of the plot width at 22px, on the low end for a
    custom-prefixed mandated title — a modest fontsize bump would give it more visual
    presence without risking overflow
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Bold dark title "Streamflow Forecast · band-basic · javascript · d3 · anyplot.ai" is clearly readable, centered near the top; a lighter gray subtitle below it explains the band. Axis titles "Forecast Day" (x) and "River Streamflow (m³/s)" (y) are dark ink and fully legible. Y tick labels ("10 m³/s" .. "90 m³/s") and x tick labels ("Day 5" .. "Day 60") are legible gray text with no overlap. Horizontal grid lines are subtle light-gray, y-axis only, not competing with the data. Only left and bottom spines are drawn (L-shaped frame).
      Data: A semi-transparent green band (first Imprint series, #009E73 at ~0.28 opacity) widens steadily from day 1 to day 60, with a solid, thicker #009E73 line tracing the fluctuating center trend through the middle of the band.
      Legibility verdict: PASS — all text is clearly readable against the light background, no dark-on-light or light-on-light failures.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Title and axis titles render in light/white text, fully readable against the dark surface. Tick labels are light gray and legible. Grid lines are faint light-gray, still visible but subtle. Only left and bottom spines are drawn, matching the light render.
      Data: The band and center line use the identical #009E73 green as the light render — the fill reads as a dark teal-green against the near-black background, still clearly distinguishable from the page background, and the center line remains bright and prominent.
      Legibility verdict: PASS — no dark-on-dark failures; every text element (title, subtitle, axis labels, ticks) is clearly visible, and the data colors match the light render exactly (only chrome flipped).
