      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Bold dark title "band-basic · javascript · chartjs · anyplot.ai" centered at top; legend directly below showing a translucent green swatch labeled "95% Confidence Interval" and a solid green swatch labeled "Forecast". X-axis title "Day" (1-45, every integer labeled) and Y-axis title "Revenue ($K)" (100-280) both in dark ink, with lighter dark tick labels. Only horizontal (Y-axis) gridlines are shown, subtle gray, no vertical gridlines, no visible chart border/spines. A dark "±$42K CI" callout with a short dashed vertical guide sits near day 45, cleanly inside the plot area with no clipping or overlap. All chrome elements and the callout are clearly visible against the light background.
      Legibility verdict: PASS — no text is light-on-light, all title/axis/tick/legend/callout text reads clearly against the cream background.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Same layout as light — title, legend, axis titles, and tick labels all rendered in light/white text, clearly readable against the dark background. The "±$42K CI" callout renders in light ink and remains clearly legible; the dashed guide line is visible. Horizontal gridlines remain visible as subtle light-gray lines at low opacity. No dark-on-dark text detected anywhere.
      Data: The confidence band (now with a top-edge stroke and a two-stop vertical gradient fill) and forecast line use the identical underlying hex values as the light render (t.palette[0] = #009E73) — only the composited appearance differs because the same translucent gradient fill blends with a dark background instead of a light one (band reads as a darker teal-green here vs. pale mint in light), which is expected alpha-blending behavior, not a palette violation. The solid forecast line is the same bright brand green in both renders.
      Legibility verdict: PASS — all text is legible, no dark-on-dark failures; brand green line and callout are clearly visible against the near-black surface.

    Both renders confirm the mandated title format, correct theme-adaptive chrome, and correct Imprint palette usage (first/only series = #009E73) throughout. The attempt-2 additions (band gradient/edge stroke, CI callout) are present and correctly theme-adaptive in both renders.
