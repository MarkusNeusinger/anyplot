review:
  strengths:
  - 'Idiomatic Chart.js area-between-datasets pattern (fill: ''-1'') correctly builds
    the confidence band from the upper/lower datasets, with the center trend line
    as a separate solid series.'
  - 'Legend correctly filters out the empty-label lower-bound helper dataset via `filter:
    (item) => item.text`, so only "95% Confidence Interval" and "Forecast" are shown.'
  - 'Theme-correct chrome and Imprint palette compliance in both renders: first series
    is brand green #009E73, backgrounds match #FAF8F1 (light) / #1A1A17 (dark), all
    text and grid colors flip correctly.'
  - Deterministic LCG-seeded data generation produces a realistic widening fan-chart
    shape (uncertainty compounding over the 45-day forecast horizon), matching the
    spec's suggested example.
  - Clean KISS structure, no fake interactivity, animation disabled per the harness
    mount-node contract.
  weaknesses:
  - 'Design Excellence is ''well-configured default'' territory: the band is a single
    flat translucent fill with no additional refinement. Add a subtle top-edge stroke
    on the confidence band (e.g. a hairline borderWidth/borderColor at low alpha)
    and/or a vertical canvas gradient fill to lift the band beyond a flat default
    look.'
  - Data storytelling relies entirely on the widening band shape for its insight;
    there's no callout or annotation pointing at the story (e.g. label the CI width
    at day 45, or annotate the day ~28 inflection where growth visibly accelerates)
    to give the chart a clearer focal point.
  - 'Library Mastery is generic-plus: `fill: ''-1''` is the correct idiomatic pattern
    but is the baseline way to draw a band in Chart.js. Consider a more distinctive
    touch such as a `createLinearGradient` fill for the band or per-point styling
    that showcases a feature not trivially replicated in a config-only library.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Bold dark title "band-basic · javascript · chartjs · anyplot.ai" centered at top; legend directly below showing a translucent green swatch labeled "95% Confidence Interval" and a solid green swatch labeled "Forecast". X-axis title "Day" (1-45, every integer labeled) and Y-axis title "Revenue ($K)" (100-280) both in dark ink, with lighter dark tick labels. Only horizontal (Y-axis) gridlines are shown, subtle gray, no vertical gridlines, no visible chart border/spines. All chrome elements are clearly visible against the light background.
      Data: Confidence band rendered as a light, semi-transparent green fill widening from a narrow ~10-unit spread near day 1 to roughly a 75-unit spread near day 45 (classic fan-chart shape). The center "Forecast" trend line is a solid, darker, more saturated green (#009E73), clearly distinguishable from the lighter translucent band by both opacity and stroke vs. fill.
      Legibility verdict: PASS — no text is light-on-light, all title/axis/tick/legend text reads clearly against the cream background.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Same layout as light — title, legend, axis titles, and tick labels all rendered in light/white text, clearly readable against the dark background. Horizontal gridlines remain visible as subtle light-gray lines at low opacity. No dark-on-dark text detected anywhere.
      Data: The confidence band and forecast line use the identical underlying hex values as the light render (t.palette[0] = #009E73, band fill = same hex at 20% alpha) — only their *composited* appearance differs because the same translucent fill blends with a dark background instead of a light one (band reads as a darker teal-green here vs. pale mint in light), which is the expected/correct behavior for an alpha-blended fill, not a palette violation. The solid forecast line is the same bright brand green in both renders.
      Legibility verdict: PASS — all text is legible, no dark-on-dark failures; brand green line is clearly visible against the near-black surface.

    Both renders confirm the mandated title format, correct theme-adaptive chrome, and correct Imprint palette usage (first/only series = #009E73) throughout.
