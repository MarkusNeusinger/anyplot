review:
  strengths:
  - 'The band is built the native MUI X way: an invisible series at the lower bound
    stacked under an area series carrying the band width (stack: "band"), so the fill
    spans exactly lower to upper at every x and nothing is filled outside the two
    boundaries'
  - monotoneX interpolation on all three series passes through every data value without
    overshoot, matching the spec's 'straight or monotone-interpolated, no fitted smoothing'
    requirement
  - The band fill at fillOpacity 0.28 keeps the horizontal gridlines visible through
    it in both themes while staying clearly distinct from the page; the 3 px central
    line sits on top at its values
  - Data-driven subtitle (point count, day range, band name and its computed width
    range 1.7–9.4 °C) states the uncertainty source as the Notes suggest and adds
    a clear title/subtitle hierarchy
  - Realistic 30-day temperature forecast whose interval widens with lead time, with
    slightly asymmetric, wiggling bounds — exactly the behaviour the spec permits
  - Per-series v9 CSS selectors ([data-series=...]) hide the helper lines and style
    the area; skipAnimation is set; a valueFormatter gives the HTML tooltip the 'lower
    – upper' range per day
  weaknesses:
  - 'VQ-07 (both): the central line, the chart''s second series, is drawn in Imprint
    position 3 blue #4467A3, skipping position 2 lavender #C475FD for an aesthetic
    reason (code comment: ''a second hue, so the central line contrasts'') → the next
    canonical position, t.palette[1]. Likely cause: CENTER_COLOR = t.palette[2].'
  - 'Suggestion: drop the label on the helper ''lower'' series and use the native
    MUI X legend (hideLegend off, slotProps.legend) instead of the hand-built Box
    legend.'
  - 'Suggestion: the 15 px tick labels could go to 16 px to read more firmly in the
    400 px thumbnail.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white cream (#FAF8F1), not pure white.
      Chrome: bold dark title "band-basic · javascript · muix · anyplot.ai" top-left (~30% of width), soft-ink subtitle "30 points, forecast day 1–30 · shaded: 90% confidence band, width 1.7–9.4 °C". Y-axis label "Forecast temperature (°C)" with ticks 15–27, x-axis label "Forecast day" with ticks 1–30; subtle horizontal gridlines; left and bottom axis lines in soft ink. Custom legend centered at the bottom: green swatch "90% confidence band" and blue line "Forecast temperature (°C)". All text dark and readable.
      Data: a semi-transparent brand-green (#009E73, ~28% opacity) band from lower to upper bound, narrow at day 1 (~16–17.6 °C) and widening to ~16–25.4 °C by day 30, with wiggling, slightly asymmetric edges; gridlines visible through the band. A 3 px blue (#4467A3) central forecast line rises from 16.6 °C to a ~23 °C plateau around days 18–20 and eases to ~20.7 °C; monotone segments, no overshoot. No clipping at any edge.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black (#1A1A17), not pure black.
      Chrome: title in light ink, subtitle, tick labels and axis titles in light soft ink, all clearly readable; no dark-on-dark text. Gridlines subtle but visible; axis lines light.
      Data: same brand-green band at the same opacity (reads as deep teal on the dark page, distinct from the background, gridlines visible through it) and the same blue #4467A3 central line — data colors identical to the light render, only chrome flipped. Legend swatches visible.
      Legibility verdict: PASS
