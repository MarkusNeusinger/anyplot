review:
  strengths:
  - 'The band is built the MUI X way: an invisible lower series stacked under a filled
    width series (`stack: "band"`, `area: true`), so the fill spans exactly lower
    to upper at every x and nothing is filled outside the boundaries.'
  - 'Edges and the central line use `curve: "monotoneX"`, so every segment passes
    through the data values without spline overshoot, as the Notes ask.'
  - Semi-transparent fill (fillOpacity 0.28) keeps the horizontal gridlines visible
    through the band in both themes, while the band stays clearly distinct from the
    page.
  - The central line in Imprint purple (palette position 2) at strokeWidth 3 sits
    on top of the brand-green band and contrasts clearly with it in both renders.
  - Series-targeted v9 CSS selectors (`.MuiLineChart-line[data-series=...]`) hide
    the helper strokes cleanly, and the band series' `valueFormatter` with `dataIndex`
    turns the tooltip into a lower–upper range readout in the HTML view.
  - The subtitle names the uncertainty source and the computed band width range (1.7–9.4
    °C), derived from the data rather than typed in, which points the viewer to the
    widening forecast uncertainty.
  weaknesses:
  - 'Suggestion: the subtitle''s ''30 points, forecast day 1–30'' repeats what the
    x axis already shows; shortening it to the band description would tighten the
    header.'
  - 'Suggestion: the hand-built HTML legend could be replaced by the native `ChartsLegend`
    if the hidden lower-edge series can be kept out of it.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white, consistent with #FAF8F1, not pure white.
      Chrome: bold title "band-basic · javascript · muix · anyplot.ai" top left with a soft-ink subtitle "30 points, forecast day 1–30 · shaded: 90% confidence band, width 1.7–9.4 °C"; y axis "Forecast temperature (°C)" with ticks 15–27, x axis "Forecast day" with ticks 1–30; subtle horizontal gridlines; HTML legend centred at the bottom (green swatch "90% confidence band", purple line "Forecast temperature (°C)"). All text dark on light and readable.
      Data: brand-green #009E73 band at ~0.28 opacity widening from ~1.7 °C at day 1 to ~9.4 °C at day 30; purple central line (Imprint position 2) rising from 16.6 to ~23 °C, plateauing and falling to 20.7 °C, drawn on top of the band. Monotone segments, no overshoot; gridlines visible through the band.
      Legibility verdict: PASS

