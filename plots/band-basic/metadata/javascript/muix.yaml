quality_score: 91
review:
  strengths:
  - Clever stacked-area technique (invisible offset series + width-only band series)
    correctly renders a true lower/upper band even though MUI X LineChart has no native
    range-area primitive — a genuine library-mastery move
  - Band width visibly narrows/widens across the 30-day forecast, telling a clear
    'growing uncertainty' story that matches the spec's data-generation intent
  - Semi-transparent green fill (fillOpacity 0.28) sits inside the spec's 0.2-0.4
    alpha guidance and keeps the contrasting navy center line fully legible on top
  - Natural curve interpolation gives smooth boundaries and center line as required
    by the spec
  - 'Both renders are fully theme-correct: cream/near-black backgrounds, readable
    ink in both themes, identical data colors, hand-rolled legend avoids the built-in
    ChartsLegend clipping bug called out in the code comments'
  - Deterministic LCG-seeded data generation, clean single-import code, current MUI
    X API (skipAnimation, stack, area, curve)
  weaknesses:
  - Title occupies only ~40-45% of plot width — well under the 50-70% target range;
    a touch more fontsize headroom would balance the composition better without risking
    overflow
  - Design flourishes are limited to the band+line itself — no additional annotation
    or emphasis (e.g. marking a specific forecast day) to sharpen the focal point
    beyond the natural widening-band story
  - The invisible 'lower' stacking series is exposed as its own entry in the interactive
    HTML tooltip/series list, which could read oddly if a user hovers near the lower
    boundary — not visible in the static PNG so not scored, but worth a follow-up
    polish pass
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "Forecast Uncertainty · band-basic · javascript · muix · anyplot.ai" in dark ink, top-left; hand-rolled legend below it with a green swatch ("90% confidence band") and a navy line swatch ("Forecast temperature"); axis titles "Forecast Day" (x) and "Temperature (°C)" (y); tick labels 1-30 on x, 15-27 on y; subtle horizontal gridlines only. All chrome is clearly legible against the light background.
      Data: Semi-transparent green (#009E73-family, palette[0]) band spans the 90% confidence range and visibly narrows near day 1 and widens toward days 18-30; a solid navy/steel-blue (palette[2]) center line runs through the middle of the band with natural smoothing. First series is the brand green band as required.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title now rendered in light/white ink, legend swatches and labels flip to light text, axis titles and tick labels are light-colored and clearly readable, gridlines remain subtly visible.
      Data: Band fill and center line use the identical green/navy hues from the light render — only the chrome (background, text, gridlines) flips. No dark-on-dark or light-on-light failures observed anywhere in either render.
      Legibility verdict: PASS
