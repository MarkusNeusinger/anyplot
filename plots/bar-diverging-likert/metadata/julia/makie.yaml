review:
  strengths:
  - Neutral segment split evenly across one shared 0 % midline in every row, with
    disagreement stacking left and agreement right via barplot! direction=:x and stack
    groups
  - Likert levels coloured as ordered steps of the imprint_div marks ramp with red/green
    semantic poles and the theme's grey midpoint, identical across both renders except
    the midpoint stop
  - Rows sorted by net agreement, from Team Collaboration at the top to Compensation
    & Benefits at the bottom
  - Directional x-axis title and an absolute-percentage tick formatter make the two
    sides read as shares
  - 'Complete theme adaptation: no dark-on-dark or light-on-light text in either render'
  weaknesses:
  - 'VQ-01 (both): x tick labels at 11 and the x-axis title at 13 sit below the Makie
    references (tick labels 12, axis titles 14) and read small beside the 12-pt question
    labels → xticklabelsize 12 (+1), xlabelsize 14 (+1). Likely cause: xticklabelsize
    = 11, xlabelsize = 13.'
  - 'SC-02 (both): the neutral segments (12–25 %) carry no percentage label although
    they have room, so C5 is met only for the side segments → one label for the whole
    neutral share centred on the 0 % line in a fill-readable ink. Likely cause: the
    label loop iterates over SD, D, A, SA only.'
  - 'SC-03 (both): the x axis carries only three ticks (50 %, 0 %, 50 %) over a range
    of about −55 to +91, too sparse to read a bar end off → ticks every 20 or 25 points.
    Likely cause: Makie''s default xticks with no explicit tick positions.'
  - 'Suggestion: a slightly heavier weight on the 10-pt in-segment labels would lift
    them on the mid-tone Disagree and Agree steps.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, correct.
      Chrome: title 'Employee Engagement Survey · bar-diverging-likert · julia · makie · anyplot.ai' in dark INK, bold; question labels on the y axis in INK_SOFT; x ticks 50%/0%/50% and directional x-axis title '← Disagree  Response Share (%)  Agree →' in dark ink; only the bottom spine remains; faint vertical grid. All readable.
      Data: ten horizontal bars, each split around a solid 0 % midline; colours are ordered ramp steps: Strongly Disagree #AE3030 red, Disagree a muted red-grey, Neutral grey #6B6A63, Agree a muted green-grey, Strongly Agree brand green #009E73. White percentage labels in segments of 8 % or more; neutral segments unlabeled. Rows sorted by net agreement, Team Collaboration top, Compensation & Benefits bottom. Frameless horizontal legend below in scale order.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17, correct.
      Chrome: title in light INK #F0EFE8, question and tick labels in INK_SOFT #B8B7B0, axis title light; midline in light INK_SOFT; no dark-on-dark text.
      Data: red, the two side steps and brand green identical to the light render; the neutral step uses the dark midpoint #686762, level with the poles. Labels and legend swatches readable.
      Legibility verdict: PASS
