review:
  strengths:
  - Neutral segment split evenly across one shared 0 % midline in every row, built
    with barplot! direction=:x and stack groups for each side
  - Likert levels coloured as ordered steps of one cgrad ramp with red/green semantic
    poles and the theme's grey midpoint, identical across both renders except the
    midpoint stop
  - Rows sorted by net agreement, from Team Collaboration at the top to Compensation
    & Benefits at the bottom
  - Percentage labels in every segment of 8 % or more, including one label for each
    neutral share, white on fill and readable in both themes
  - X ticks every 20 points with an absolute-percentage formatter and a directional
    axis title make both sides read as shares
  - 'Complete theme adaptation: no dark-on-dark or light-on-light text in either render'
  weaknesses:
  - 'Suggestion: the neutral label sits in the right half of the neutral segment;
    a reader could take it for the right half only, so a label centred just above
    or below the 0 % line inside the segment would read as the whole share.'
  - 'Suggestion: a slightly heavier weight on the 10-pt in-segment labels would lift
    them on the mid-tone Disagree and Agree steps.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, correct.
      Chrome: bold title 'Employee Engagement Survey · bar-diverging-likert · julia · makie · anyplot.ai' in dark INK; question labels in INK_SOFT on the left without tick marks; x ticks 40% 20% 0% 20% 40% 60% 80% and directional axis title '← Disagree  Response Share (%)  Agree →'; only the bottom spine; faint vertical grid; dark 0 % midline. All readable.
      Data: ten horizontal bars sorted by net agreement (Team Collaboration top, Compensation & Benefits bottom), neutral split across 0 %; steps Strongly Disagree #AE3030 red, Disagree muted red-grey, Neutral grey #6B6A63, Agree muted green-grey, Strongly Agree brand green #009E73. White percentage labels in segments of 8 % or more and one label per neutral share in its right half. Frameless horizontal legend below in scale order.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17, correct.
      Chrome: title in light INK, question and tick labels in light INK_SOFT, light midline and axis title; no dark-on-dark text.
      Data: red pole, side steps and brand green identical to the light render; neutral uses the dark midpoint #686762. Segment labels and legend readable.
      Legibility verdict: PASS
