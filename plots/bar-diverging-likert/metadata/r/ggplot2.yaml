review:
  strengths:
  - Sorted by net agreement from Health insurance (top) to Annual bonus (bottom),
    so the ranking reads at a glance
  - scale_fill_manual(breaks, labels) folds the two neutral halves into a single legend
    entry in scale order
  - Bold light percentage labels centered with position_stack(vjust = 0.5) stay readable
    on every fill in both themes; narrow segments are left unlabeled
  - 'Theme tokens threaded through all chrome: both renders theme-correct with no
    dark-on-dark text'
  - Realistic employee-benefits data, every row summing to 100%
  weaknesses:
  - 'SC-02 (both): on the disagree side the stack runs in reverse — Strongly Disagree
    (red) sits next to the 0% line and the left neutral half sits at the far left
    end, so no bar is centered on its neutral segment (C2) and the scale order is
    not strongly disagree at the left end (C1); only the agree side is ordered correctly
    → stack the left side neutral half, then Disagree, then Strongly Disagree outward
    from 0. Likely cause: the response factor levels c("neutral_neg", "disagree",
    "strongly_disagree", ...) — position_stack puts the later level nearest 0 for
    negatives too, so the negative levels must be c("strongly_disagree", "disagree",
    "neutral_neg").'
  - 'VQ-07 (dark): the neutral step uses the light marks midpoint #6B6A63 in the dark
    render instead of the dark imprint_div marks midpoint #686762 (the other theme''s
    stop) → pick the midpoint from THEME. Likely cause: colorRampPalette(c("#AE3030",
    "#6B6A63", "#4467A3")) hard-codes the light midpoint.'
  - 'Suggestion: a slightly lighter neutral label weight would let the agree/disagree
    numbers lead.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, correct.
      Chrome: title 'Employee Benefits · bar-diverging-likert · r · ggplot2 · anyplot.ai' in dark ink, centered, ~66% width; x title 'Percentage of Respondents', ticks 50% / 0% / 50% in INK_SOFT; ten question labels in dark ink; boxed horizontal legend at the bottom (Strongly Disagree, Disagree, Neutral, Agree, Strongly Agree). All readable.
      Data: ten horizontal stacked bars sorted by net agreement (Health insurance top, Annual bonus bottom). Agree side: neutral half (grey #6B6A63) at 0, then Agree (grey-blue step), then Strongly Agree (#4467A3) outward — correct. Disagree side: Strongly Disagree (#AE3030) sits next to 0, then Disagree (brown-red step), then the other neutral half at the far left end — reversed, so the bars are not centered on neutral. Bold light percentage labels (~7.7 pt) in segments of 8% and more; a dark 0% center rule.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17, correct.
      Chrome: title, axis title, question labels in light ink; ticks and legend text in INK_SOFT; legend box on elevated #242420; light 0% center rule; no dark-on-dark text.
      Data: identical fills to the light render, including the light midpoint #6B6A63 for neutral (the dark marks midpoint is #686762); same reversed disagree-side order. Labels readable on every fill.
      Legibility verdict: PASS
