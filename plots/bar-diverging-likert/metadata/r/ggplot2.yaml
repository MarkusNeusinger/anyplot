review:
  strengths:
  - Segments run in scale order from Strongly Disagree at the left end to Strongly
    Agree at the right, every bar centered on its split neutral segment at the 0%
    line
  - Sorted by net agreement from Health insurance (top) to Annual bonus (bottom),
    so the ranking reads at a glance
  - scale_fill_manual(breaks, labels) folds the two neutral halves into a single legend
    entry in scale order
  - 'Five steps of the imprint_div marks ramp with the theme''s own midpoint (#6B6A63
    light, #686762 dark)'
  - Bold light percentage labels centered with position_stack(vjust = 0.5) stay readable
    on every fill in both themes; narrow segments left unlabeled
  - Realistic employee-benefits data, every row summing to 100%
  weaknesses:
  - 'Suggestion: label each neutral half with the full neutral share (or label it
    once) — today an 18% neutral reads as two 9% labels.'
  - 'Suggestion: a slightly lighter neutral label weight would let the agree/disagree
    numbers lead.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, correct.
      Chrome: title 'Employee Benefits · bar-diverging-likert · r · ggplot2 · anyplot.ai' in dark ink, centered, ~66% width; x title 'Percentage of Respondents', ticks 50% / 0% / 50% in INK_SOFT; ten question labels in dark ink; boxed horizontal legend at the bottom (Strongly Disagree, Disagree, Neutral, Agree, Strongly Agree). All readable.
      Data: ten horizontal stacked bars sorted by net agreement (Health insurance top, Annual bonus bottom). Left of 0: neutral half (grey #6B6A63), Disagree (brown-red step), Strongly Disagree (#AE3030) at the outer end; right of 0: neutral half, Agree (grey-blue step), Strongly Agree (#4467A3) outward. Every bar is centered on its neutral segment. Bold light percentage labels in segments of 8% and more; a dark 0% center rule.
