review:
  strengths:
  - 'Correct diverging-Likert construction: the neutral category is split evenly across
    the zero midpoint with a subtle center markLine anchoring the divergence point,
    exactly per spec.'
  - 'Well-reasoned semantic color choice: matte red (palette[4]) for disagreement
    and blue (palette[2]) for agreement, explicitly documented as avoiding a red-green
    pairing that is ambiguous for deuteranopia/protanopia readers, and matches the
    spec''s own suggested ''red-to-blue'' scheme.'
  - Opacity-graded intensity hierarchy (full opacity for the 'Strongly' categories,
    0.55 opacity for the moderate categories) creates a clear visual weight gradient
    that reinforces Likert intensity without introducing extra colors.
  - Rows are sorted by net agreement (agree+strongly_agree minus disagree+strongly_disagree),
    producing an easy best-to-worst scan exactly as the spec requests.
  - 'Clean, idiomatic ECharts usage: stacked bar series on an inverted category axis,
    a per-point label formatter that hides labels below a 6% threshold to avoid clutter,
    and dynamic title fontsize scaling for the long mandated title string.'
  weaknesses:
  - 'Large layout/proportional issue: the x-axis min/max is symmetric around a single
    maxExtent (86.5%, from the top row''s strongly_agree+agree+half-neutral), but
    the largest disagree-side total across all rows is only ~42%. This leaves roughly
    a quarter of the total canvas width (about -87% to -42%) completely blank for
    every single row - a visible, systemic dead zone on the left half of the chart.
    Either choose survey data with a genuinely divergent (some net-negative) question
    so both sides use more of the axis, or size the axis more tightly instead of mirroring
    the single global one-sided max.'
  - Non-round axis tick values (87%, 60%, 30%, 0%, 30%, 60%, 87%) - the tick intervals
    are uneven (27-unit gap near the ends vs 30-unit gaps elsewhere) because min/max
    is set to the exact computed maxExtent (86.5 rounded to 87) rather than a round
    number. Round the axis bounds (e.g. to 90 or 100) for cleaner, evenly-spaced ticks.
  - All 10 questions are net-positive (net agreement ranges from +16 to +73); none
    diverges to net-negative. For a chart whose entire premise is 'diverging' comparison,
    having zero rows where disagreement wins undersells the visualization's purpose
    and directly contributes to the whitespace problem above - one or two more critical/negative
    questions would be both more realistic for a real engagement survey and would
    make better use of the left half of the canvas.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1), consistent across the whole canvas.
      Chrome: Title "Employee Engagement Survey · bar-diverging-likert · javascript · echarts · anyplot.ai" is centered at top in dark ink, fully legible. Legend below the title lists Strongly Disagree, Disagree, Neutral, Agree, Strongly Agree with matching color swatches, dark-ink text, all readable. X-axis tick labels (87%, 60%, 30%, 0%, 30%, 60%, 87%) and y-axis question labels are dark-ink/soft-ink text, clearly legible against the light background. Vertical gridlines are subtle light gray, visible but not dominant. A thin center line marks the zero midpoint.
      Data: 10 horizontal diverging stacked bars, one per survey question, sorted by descending net agreement (top = most positive). Strongly Disagree segments are saturated matte red, Disagree segments are a lighter red (reduced opacity) with dark-ink percentage labels, Neutral segments are a dark muted charcoal centered on the zero line with a light label, Agree segments are a lighter blue (reduced opacity) with dark-ink labels, Strongly Agree segments are saturated blue. First categorical brand green is intentionally not used because the spec's own diverging red-to-blue sentiment scheme is used instead (documented in-code). Percentage labels appear inside segments ≥6% and are legible in all cases observed. A large blank region exists on the left of the chart (roughly from -87% to -42%) across every row, since the axis is symmetric to the single largest one-sided total but no row's disagree-side total comes close to that value.
      Legibility verdict: PASS (all title/legend/axis/data-label text is clearly readable against the light background; no light-on-light issues).

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17), consistent across the whole canvas.
      Chrome: Title and legend text switch to light/off-white ink, still centered and fully legible against the dark background. X-axis and y-axis tick labels are light soft-ink text, clearly readable. Vertical gridlines are subtle and visible without dominating. The center zero-line is visible.
      Data: Same 10 rows, same sort order. Strongly Disagree/Disagree/Agree/Strongly Agree segment hues are visually identical in saturation/hue to the light render (red and blue positions unchanged), confirming the categorical data colors did not shift between themes. The Neutral segment flips from dark charcoal (light theme) to a light tan/gray (dark theme) because it is built from the theme-adaptive `inkSoft` token, standing in for the harness's undocumented "muted" anchor color, which per the style guide is explicitly allowed to be theme-adaptive (unlike the 8 fixed categorical palette positions). All percentage labels remain legible with no dark-on-dark instances found. The same left-side whitespace gap observed in the light render is present here too.
      Legibility verdict: PASS (no dark-on-dark or light-on-light failures found; all text and data segments are clearly distinguishable from the near-black background).
