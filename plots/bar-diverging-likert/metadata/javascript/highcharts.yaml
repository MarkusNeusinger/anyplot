review:
  strengths:
  - 'Correct diverging-Likert semantics: the Neutral category is split into paired
    "neutral-left"/"neutral-right" series so it straddles the zero line evenly, exactly
    matching the spec''s centering requirement.'
  - Thoughtful legendIndex reordering compensates for Highcharts' innermost-stacks-last
    behavior, presenting the legend in the natural Strongly Disagree -> Disagree ->
    Neutral -> Agree -> Strongly Agree reading order.
  - Rows are sorted by net agreement (agree + strongly agree - disagree - strongly
    disagree), giving the chart genuine visual hierarchy and making cross-question
    comparison effortless as the spec requests.
  - Percentage data labels are conditionally suppressed on narrow segments (abs(y)
    >= 6, neutral pct >= 8), avoiding label collisions instead of always forcing text
    into tiny segments.
  - Shared tooltip formatter compiles all five series values for a question into one
    readable block.
  - Realistic, neutral employee-engagement-survey data that sums to exactly 100% per
    row across a plausible range of outcomes.
  - Explicit font sizing throughout (title 22px, subtitle 14px, axis title 16px, ticks/legend
    14px, data labels 13px) with correct theme-adaptive ink/inkSoft/grid token usage.
  weaknesses:
  - 'VQ-07 violation: "Disagree" and "Agree" segments are filled with alpha-transparent
    rgba colors (rgba(174,48,48,0.55) and rgba(68,103,163,0.55)) that composite against
    the page background. Since the light bg (#FAF8F1) and dark bg (#1A1A17) are very
    different, these two segments render as a pale salmon / powder-blue tint in the
    light render but a dark maroon / navy tint in the dark render -- the data colors
    are not identical across themes as required. Fix: replace RED_SOFT/BLUE_SOFT with
    solid, theme-independent hex tints (precompute a lighter/desaturated version of
    #AE3030 and #4467A3 as a plain opaque hex) instead of alpha-blending over the
    mount background.'
  - 'DQ-01: all ten survey items follow a similar smooth agree-to-disagree gradient
    as net agreement decreases; none of them is a genuinely polarized/bimodal item
    (high Strongly Disagree AND high Strongly Agree with low Neutral), which would
    better demonstrate the chart''s ability to surface consensus vs. controversy.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 -- not pure white.
      Chrome: Title "bar-diverging-likert · javascript · highcharts · anyplot.ai" and subtitle "Employee engagement survey · sorted by net agreement" render in dark ink, clearly legible. Y-axis title "Share of responses", percentage tick labels (0/25/50/75/100%), and the 10 question category labels on the left all render in dark/medium ink and are fully readable. A dark vertical plot line marks the zero/neutral center. Legend below the plot reads "Strongly Disagree, Disagree, Neutral, Agree, Strongly Agree" in dark text.
      Data: Ten horizontal diverging stacked bars. Strongly Disagree = solid brick red (#AE3030), Disagree = a pale salmon/pink tint, Neutral = dark gray, Agree = a light powder-blue tint, Strongly Agree = solid blue (#4467A3). White percentage labels with a contrast outline sit inside segments wide enough to hold them. First data series matches the spec's own suggested red-to-blue diverging scheme (a documented semantic exception to the "series 1 = brand green" rule, since the spec explicitly calls for a red-to-blue or orange-to-teal diverging scale).
      Legibility verdict: PASS (all title/axis/tick/legend text is clearly readable against the light background).

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 -- not pure black.
      Chrome: Title, subtitle, axis title, percentage tick labels, question labels, and legend all render in light ink/off-white and are clearly legible against the dark background -- no dark-on-dark failures observed. The center plot line is a light stroke, correctly flipped from the light render's dark stroke.
      Data: Strongly Disagree and Strongly Agree render as the same solid brick red (#AE3030) and blue (#4467A3) as the light render -- correct, unchanged. However Disagree and Agree render as a noticeably darker maroon-red and darker navy-blue tint than their light-render counterparts, because the code fills them with semi-transparent rgba colors that blend with the (very different) page background in each theme. This breaks the "data colors identical across themes" rule for those two segments.
      Legibility verdict: PASS for text (no dark-on-dark issues); FAIL for cross-theme data-color identity on the Disagree/Agree segments (see VQ-07 note above).
