review:
  strengths:
  - 'True diverging stack: neutral is split into two half-series (neutral-left / neutral-right,
    share 0.5) stacked on opposite signs of one ''likert'' stack, so every bar straddles
    the shared zero midline exactly as the spec asks; segment lengths match the data
    (all eight rows sum to 100)'
  - 'Ordered-category coloring follows the style guide: steps of the imprint_div ramp
    built from t.div (red pole for disagree, blue pole for agree, mild levels mixed
    toward the theme-adaptive midpoint) with neutral in the muted anchor; strong levels
    read clearly stronger than mild ones in both themes'
  - Questions sorted by computed net agreement (+78 to -5), with the net range stated
    in the subtitle
  - Percentage labels via the native barLabel callback, suppressed when ctx.bar.width
    < 38 px, with per-level label ink chosen by WCAG contrast against each fill, so
    every label is readable on its own segment in both themes
  - Custom NeutralLabels child component composed into BarChart using useXScale/useYScale
    hooks draws the neutral share once, centered on the midline, with a halo in the
    segment fill that breaks the reference line behind the text
  - Native ChartsReferenceLine marks the zero midline; tick valueFormatter shows absolute
    values on both sides; tooltip valueFormatter reports the true level percentage
    (not the halved neutral) in the interactive HTML
  - Explicit axis bands (y width 290, x height 64) keep long question labels untruncated;
    skipAnimation set; theme tokens threaded through all chrome
  weaknesses:
  - 'Suggestion: the symmetric ±90 x-domain leaves the left half largely empty (the
    longest disagree reach is about 52); a domain fitted per side, or a tighter symmetric
    limit, would give the bars more width.'
  - 'Suggestion: the hand-built HTML legend works around the duplicated neutral half-series;
    a native ChartsLegend fed from the five levels would show more MUI X idiom.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the full 3200x1800 canvas.
      Chrome: bold title "bar-diverging-likert · javascript · muix · anyplot.ai" top left, soft-ink subtitle "8 questions, sorted by net agreement (+78 to -5 points) · neutral split across the midline"; eight question labels in dark ink on the left; x ticks 90…0…90 (absolute values) and x label "Share of responses (%)"; subtle vertical grid; dark 2 px midline at 0; HTML legend at the bottom (Strongly disagree, Disagree, Neutral, Agree, Strongly agree). All text readable.
      Data: eight horizontal stacked bars, sorted from "I understand my role's impact" (top) to "My workload is manageable" (bottom); matte red #AE3030 strongly disagree, light red disagree, muted gray #6B6A63 neutral centered on the midline, light blue agree, blue #4467A3 strongly agree. Percentage labels inside segments with dark or light ink by contrast; narrow 2–5% strongly-disagree segments are unlabeled (permitted). Ordered categories, so no #009E73 first series (style-guide exception).
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, subtitle, question labels, ticks, axis label and legend all in light ink; grid subtle; midline drawn in light ink. No dark-on-dark text.
      Data: same layout and values; poles identical (#AE3030 red, #4467A3 blue); the mild levels are mixed toward the dark ramp midpoint (dark red, dark navy) and neutral uses the dark muted anchor #A8A79F, as the theme-adaptive imprint_div midpoint prescribes. Labels switch ink per fill (dark ink on the light-gray neutral, light ink elsewhere); all readable.
      Legibility verdict: PASS
