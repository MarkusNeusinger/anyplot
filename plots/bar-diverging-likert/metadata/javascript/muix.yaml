review:
  strengths:
  - Correct diverging-stack construction — neutral is split evenly across the zero
    midpoint and documented in code, matching the spec's 'center on neutral' requirement
    exactly
  - Questions sorted by net agreement (agree + strongly_agree − disagree − strongly_disagree),
    giving genuine data storytelling and easy cross-question comparison as the spec
    requests
  - Diverging red↔muted↔blue color scheme avoids the classic red-green colorblind
    confusion pair while still reading as a clear negative-neutral-positive gradient
    — a thoughtful, spec-sanctioned ('red-to-blue') CVD-safe choice
  - ChartsReferenceLine at x=0 anchors the diverging halves and adapts correctly between
    themes (dark ink on light bg, light ink on dark bg)
  - Custom barLabel logic correctly suppresses labels on segments narrower than 30px
    and shows the true unsplit neutral value once instead of the halved value twice
  weaknesses:
  - 'Bar-segment percentage labels always use a single fixed ink color regardless
    of background lightness — on the darker segments (Strongly Disagree #AE3030, Disagree
    #954477, Strongly Agree #4467A3) the contrast ratio drops to roughly 3.7:1, borderline
    against WCAG AA''s 4.5:1 for normal text; labels stay legible but read noticeably
    worse than on the lighter cyan/muted segments'
  - No explicit x-axis title (e.g. '% of Responses') — the axis relies solely on the
    '%' suffix baked into each tick label, which is less self-describing than a labeled
    axis
  - Brand green (#009E73) never appears anywhere in the chart; the red-to-blue diverging
    scheme is spec-sanctioned and CVD-safer than red-green, but no element nods to
    the brand's signature hue
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Centered title "bar-diverging-likert · javascript · muix · anyplot.ai" in dark ink, clearly readable. Eight question labels on the y-axis (dark text) are fully visible with no clipping or overlap. X-axis runs 100%→0%→100% on both sides of a black zero reference line. A custom five-item legend (Strongly Disagree, Disagree, Neutral, Agree, Strongly Agree) sits centered below the chart with color swatches matching the bars.
      Data: Five-segment diverging stacked bars per question — matte red (Strongly Disagree) and rose (Disagree) extend left, muted gray (Neutral) straddles the center, cyan (Agree) and blue (Strongly Agree) extend right. Percentage labels sit inside segments wide enough to hold them; labels are dark ink, clearly legible on the lighter cyan/gray segments and legible-but-lower-contrast on the darker red/rose/blue segments. Rows are sorted top-to-bottom by descending net agreement.
      Legibility verdict: PASS (with a minor contrast weakness noted on the darker segment labels — not a failure).

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Same title, now in light ink, clearly readable against the dark surface. Y-axis question labels are light-colored and fully legible. The zero reference line is rendered in light ink (correctly flipped from black in the light render) rather than a color that would vanish on dark. Legend text is light and readable; swatches are unchanged.
      Data: Identical five data colors to the light render (matte red, rose, muted gray, cyan, blue) — confirmed only chrome flipped, not data colors. Percentage labels use light-colored text; legible on all segments, including the darker red/rose/blue segments (better contrast than the dark-mode-inverse would suggest, since the label color itself flips per theme even though it doesn't adapt per-segment).
      Legibility verdict: PASS. No dark-on-dark or light-on-light failures observed in either render.
