review:
  strengths:
  - 'Excellent, spec-faithful diverging design: the neutral response is split evenly
    around a bold zero-reference line, exactly matching "center the chart on the neutral
    response category, splitting it evenly across the midpoint".'
  - 'Thoughtful color engineering: uses the fixed Imprint `div` anchors (red/blue)
    for the outer, theme-independent Likert extremes, blends them 15% for the milder
    Disagree/Agree categories, and reserves the theme-adaptive `muted` semantic anchor
    specifically for "Neutral" — a well-justified reading of the palette''s Semantic
    Exception / anchor rules rather than an arbitrary custom palette, and directly
    satisfies the spec''s "diverging color scheme ... with a muted tone for neutral"
    note.'
  - Per-segment WCAG-luminance-based text color selection (`relativeLuminance` / `textColorFor`)
    ensures every inline percentage label stays legible regardless of which segment
    color it sits on, in both themes.
  - Clean theme handling throughout — zero-line, grid, ticks, title, and legend all
    correctly branch on light/dark tokens; data colors are verified identical between
    light and dark renders aside from the intentionally adaptive Neutral segment.
  - Sorted by net agreement (agree + strongly_agree − disagree − strongly_disagree)
    exactly as the spec requests, producing an immediately scannable "most positive
    → most negative" row ordering.
  - 'Careful legend engineering: two datasets share the "Neutral" label (split halves)
    but a custom `generateLabels()` collapses them into a single, correctly colored
    legend entry instead of leaking a duplicate.'
  weaknesses:
  - 'Tooltip is fully disabled (`tooltip: { enabled: false }`) and inline labels are
    suppressed below LABEL_MIN_PCT=6%, so small segments (e.g. the 3% "Strongly Disagree"
    in the top row) have no way for a viewer to discover their exact value — neither
    an inline label nor a hover tooltip. Re-enable a lightweight tooltip (or lower
    the label threshold) so no data point is fully inaccessible in the interactive
    HTML view.'
  - Several utility helpers (hexToRgb, mix, relativeLuminance, textColorFor, wrapLabel)
    push the script past a bare-minimum KISS structure; all are individually justified
    by the luminance-based contrast and label-wrapping needs, but a more compact version
    (e.g. precomputing label colors once) would tighten code quality.
  - Beyond the custom segmentLabels draw plugin (a genuine distinctive-feature win),
    the rest of the configuration is fairly standard stacked-bar usage — consider
    showcasing one more Chart.js-specific capability (e.g. a scriptable hoverBackgroundColor,
    or a plugin-driven zero-line annotation) to further differentiate from a generic
    stacked-bar implementation.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "bar-diverging-likert · javascript · chartjs · anyplot.ai" in dark ink, centered top. X-axis title "Share of Respondents" and symmetric ±90%/80%/.../0% tick labels in a softer dark gray. Y-axis shows 8 wrapped, two-line question labels in dark gray. Legend (Strongly Disagree / Disagree / Neutral / Agree / Strongly Agree) sits centered below the x-axis title with colored square swatches. A bold black vertical rule marks the 0% zero point; a subtle light-gray grid marks the other tick positions.
      Data: Bars diverge left (red family: Strongly Disagree = matte red, Disagree = lighter red-blend) and right (blue family: Agree = blue-blend, Strongly Agree = matte blue) from a central gray "Neutral" band. Percentage labels are drawn inside every segment ≥6% in white or dark text depending on the segment's luminance; small segments (<6%, e.g. the top row's 3% Strongly Disagree) show no inline label. Rows are sorted top-to-bottom by descending net agreement.
      Legibility verdict: PASS — all title, axis, tick, and legend text is clearly readable against the light background; no light-on-light text found.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Same title, axis titles, and legend now rendered in light ink/off-white text against the dark background. Tick labels use a lighter soft-gray. The zero-reference rule is now a bold white/near-white vertical line (correctly flipped from black in the light render) and gridlines are a subtle light-on-dark tint.
      Data: Same red-family (Strongly Disagree/Disagree) and blue-family (Agree/Strongly Agree) segment colors as the light render — confirmed identical RGB values. The Neutral segment uses a lighter muted gray in dark mode versus a darker muted gray in light mode, which is the intentional theme-adaptive "muted" semantic anchor, not a data-color drift. Inline percentage labels remain legible via the same luminance-based text-color logic.
      Legibility verdict: PASS — all title, axis, tick, and legend text is clearly readable against the dark background; no dark-on-dark failures found, and the zero-line/grid correctly re-colored for the dark surface.
