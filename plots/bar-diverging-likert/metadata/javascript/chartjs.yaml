review:
  strengths:
  - Diverging stack is correctly centered on the neutral category, split evenly across
    the zero midpoint, with a bold zero-reference line that flips ink color per theme
  - Colors are drawn directly from the fixed Imprint imprint_div anchors (t.div[0]/t.div[2])
    as the spec explicitly requests a diverging red-to-blue scheme for Likert data,
    with the theme-adaptive muted anchor used for Neutral — documented in code comments
    as the semantic-exception role (neutral/disabled → muted)
  - Custom afterDatasetsDraw plugin computes per-segment text color from relative
    luminance so in-bar percentage labels stay readable against every fill color in
    both themes, and small segments (<6%) correctly suppress their label to avoid
    clutter
  - Questions are sorted by net agreement (agree + strongly agree − disagree + strongly
    disagree) as required, giving the chart a clear top-to-bottom story from most
    to least favorable
  - Data is realistic and internally consistent — all 8 rows sum to exactly 100%,
    plausible neutral HR-survey scenario
  - The attempt-2 fix replaced the disabled tooltip with a themed, styled tooltip
    using ANYPLOT_TOKENS, correctly leveraging Chart.js interactivity for the HTML
    detail view instead of leaving it off
  - All font sizes are explicitly set (title, axis title, ticks, legend, in-bar labels)
    and legible in both renders; title fontsize scaling formula is present for longer
    titles even though not triggered here
  weaknesses:
  - The mild segments (Disagree, Agree) are only a 15% mix toward the opposite anchor,
    so they sit visually close to their 'strongly' counterpart — widening the mix
    amount or adding a thin ink-color stroke on segment boundaries would sharpen distinguishability,
    especially under CVD simulation
  - The custom label-drawing plugin and scriptable grid coloring are nice touches
    but are conceptually replicable with similar canvas/annotation code in most other
    JS or Python plotting libraries — leaning further into a Chart.js-only capability
    (e.g. plugin-level animation-free draw hooks, dataset-level scriptable radius)
    would push Library Mastery higher
  - Legend swatches and bottom padding are functional but not maximally refined —
    slightly more breathing room between the last row of bars and the legend block
    would read as more deliberate polish
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 - not pure white.
      Chrome: Title "bar-diverging-likert · javascript · chartjs · anyplot.ai" in dark ink, clearly visible. X-axis title "Share of Respondents" in dark ink. Tick labels (percentages on both sides of the diverging axis) in a softer dark gray, all readable. Y-axis category labels (survey questions, word-wrapped to two lines each) in dark ink, no overlap between rows. Legend at the bottom with 5 swatches (Strongly Disagree, Disagree, Neutral, Agree, Strongly Agree) in dark ink text, positioned close under the plot.
      Data: 8 horizontal diverging bars, sorted top-to-bottom by descending net agreement. Left side (disagree family) uses a red family, right side (agree family) uses a blue family, with a muted gray Neutral segment straddling a bold black zero-reference line. In-segment white percentage labels are legible against every fill color. Colors read as pulled from the Imprint diverging anchors (matte red / blue), not arbitrary hues.
      Legibility verdict: PASS - all text is readable against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 - not pure black.
      Chrome: Title, axis title, tick labels, category labels, and legend text all render in light ink (off-white/light gray), clearly visible against the dark surface. The zero-reference line flips to white/light ink so it still reads as a strong center marker. No dark-on-dark text anywhere.
      Data: The five Likert segment colors (both reds, both blues) are pixel-identical to the light render, confirming the diverging Imprint anchors are theme-independent. Only the Neutral segment's gray shifts to a lighter tone appropriate for the dark background (the documented theme-adaptive "muted" anchor), and this is an intentional, spec-compliant exception, not a data-color drift. In-segment percentage labels remain legible via the same luminance-based contrast logic.
      Legibility verdict: PASS - all text is readable against the dark background, no dark-on-dark failures found.
