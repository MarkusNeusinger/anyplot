review:
  strengths:
  - 'Diverging math is correct: neutral splits evenly across the center baseline exactly
    as the spec requires, with the other four segments offset from that split.'
  - Rows sorted by descending net agreement gives an immediate at-a-glance ranking
    across questions.
  - Segment percentage labels are gated on rendered width and use a computed-luminance
    text color, so labels stay legible without hardcoding per-segment colors.
  - Legend is measured and centered programmatically via getBBox() — a nice DOM-level
    technique.
  - Theme-adaptive chrome and identical cross-theme data colors are handled correctly
    throughout.
  weaknesses:
  - All 8 survey questions have net-positive agreement (agree + strongly_agree > disagree
    + strongly_disagree in every row) — swap in one or two questions with net-negative
    sentiment so the chart demonstrates items diverging in both directions, which
    is the core value proposition of a diverging bar chart.
  - The Disagree/Agree segment colors are ad hoc d3.interpolateRgb blends between
    a palette anchor and the muted anchor rather than literal Imprint palette/anchor
    members or the documented imprint_div 3-stop gradient — consider building the
    ramp from imprint_div's stops, or comment the rationale for using muted as the
    blend target instead of the page-background midpoint.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1.
      Chrome: Title, axis ticks, axis label ("Share of Respondents"), question labels, and legend all render in dark ink — all clearly readable against the light background.
      Data: Five-segment diverging bars per question — Strongly Disagree (matte red #AE3030), Disagree (red-muted blend), Neutral (muted gray), Agree (blue-muted blend), Strongly Agree (Imprint blue #4467A3). Rows sorted by descending net agreement. Percentage labels inside segments wide enough to hold them, text color adapted per segment luminance.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17.
      Chrome: Title, axis ticks, axis label, question labels, and legend all render in light ink — all clearly readable against the dark background. No dark-on-dark failures found.
      Data: Confirmed identical to light render — same red/blue-anchored diverging ramp (matte red -> red-muted blend -> gray -> blue-muted blend -> Imprint blue); only chrome (background, text, gridlines, center baseline) flipped to light-on-dark.
      Legibility verdict: PASS
