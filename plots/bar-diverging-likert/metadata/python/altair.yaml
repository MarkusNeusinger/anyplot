review:
  strengths:
  - Correct diverging Likert layout with x/x2 range bars and the neutral segment split
    evenly across zero
  - Questions sorted by net agreement
  - 'Poles in Imprint red #AE3030 and blue #4467A3 with red on the disagree side'
  - In-bar % labels limited to segments ≥10 %
  - Theme-adaptive chrome in both renders
  - Native tooltips in the HTML output
  weaknesses:
  - 'VQ-02 (both): the zero rule is drawn above the bars and strikes through the neutral
    % label in every row → keep the line clear of the labels (draw it beneath the
    labels or only in the row gaps). Likely cause: zero_line added last in bars +
    labels_white + labels_dark + zero_line.'
  - 'VQ-01 (dark): the Disagree, Neutral and Agree labels turn near-white (#F0EFE8)
    on the light tints #C87070, #9C9B94, #7A93B8, about 2.5–3:1 → a label color that
    follows its fill (dark ink on light tints) or darker ramp steps with white labels.
    Likely cause: labels_dark uses color=INK, which flips with the theme while the
    fills do not.'
  - 'VQ-07 (both): Disagree, Neutral and Agree are custom tints (#C87070, #9C9B94,
    #7A93B8) not on the Imprint diverging marks ramp, and the midpoint is not the
    marks grey (#6B6A63 light / #686762 dark) → five equal steps of DIV_MARKS for
    the theme. Likely cause: hard-coded LIKERT_COLORS list.'
  - 'VQ-05 (both): the legend frame has no padding and "Strongly Agree" runs up to
    its right border → a few px of padding inside the frame. Likely cause: configure_legend
    without padding.'
  - 'SC-03 (both): the x-axis titled "Percentage (%)" labels the disagree side −10
    … −60, percentages that cannot be negative → absolute tick labels. Likely cause:
    alt.Axis without labelExpr="abs(datum.value)".'
  - 'Suggestion: a borderless legend panel would sit more quietly under the chart.'
  - 'Suggestion: a single text layer with a conditional color would replace the two
    label layers.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1; no pure white.
      Chrome: title "bar-diverging-likert · python · altair · anyplot.ai" bold dark ink centred over the plot; question labels and ticks −60 … 100 in INK_SOFT, axis title "Percentage (%)"; subtle vertical grid; framed legend at the bottom with five entries, "Strongly Agree" touching the right frame.
      Data: ten horizontal diverging bars sorted by net agreement (compensation top, tools bottom), neutral centred on 0. Colors #AE3030, #C87070, #9C9B94, #7A93B8, #4467A3 with white strokes. White labels on the strong segments, dark ink on the three light tints. A dark zero rule drawn on top crosses every neutral label.
      Legibility verdict: PASS (the struck neutral labels stay readable)

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17; no pure black.
      Chrome: title and axis title light ink, ticks and question labels #B8B7B0, legend on #242420 with a light frame.
      Data: same five fills as light (the grey midpoint does not take the dark stop); white strokes. Labels on Disagree, Neutral and Agree turn near-white and read faint on those light tints; the light zero rule crosses every neutral label.
      Legibility verdict: PASS with reduced contrast on the light-tint labels
