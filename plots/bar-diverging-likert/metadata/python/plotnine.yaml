review:
  strengths:
  - Exact neutral-centring math (offset SD + D + N/2) gives one shared midpoint for
    every bar
  - Five Likert steps from matte red through a muted grey to Imprint blue, in scale
    order in bars and legend
  - 'Label ink chosen per fill and theme: white on the dark fills, near-black on the
    lighter dark-theme mid fills'
  - Questions sorted by net agreement, Compensation & benefits at the bottom as the
    only net-negative row
  - 'Idiomatic plotnine: melt to long form, geom_rect on cumsum extents, paired scale_fill_manual/scale_color_manual'
  weaknesses:
  - 'VQ-01 (both): the in-bar percentage labels render at about 2.8 pt, far below
    the 8 pt tick labels, and read small inside the bars → about 7 pt (+4 pt). Likely
    cause: geom_text(size=2.8) is taken as points by plotnine, not mm.'
  - 'VQ-07 (dark): the neutral step and the two mid steps are built from #A8A79F,
    which outshines the poles → the imprint_div marks midpoint #686762 on dark (DIV_MID_MARKS).
    Likely cause: NEUTRAL_MID = ''#A8A79F'' in the dark branch.'
  - 'Suggestion: the ''← Disagree    Agree →'' cue is crossed by the centre line and
    set at 3.5 pt; splitting it either side of the line would read cleaner.'
  - 'Suggestion: drop the heavy INK_SOFT frame around the legend.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, not pure white.
      Chrome: title 'bar-diverging-likert · python · plotnine · anyplot.ai' centred in dark ink; ten question labels in INK_SOFT; x ticks '50% 0% 50%' and axis title 'Percentage of Responses'; a tiny italic '← Disagree    Agree →' cue centred on x=0 above the top bar, crossed by the centre line; horizontal legend 'Response' at the bottom with a heavy INK_SOFT frame. All readable; the in-bar percentage labels are very small (~2.8 pt).
      Data: ten horizontal diverging bars centred on a dark-grey vline at 0. Strongly Disagree #AE3030, Disagree #8C4D4A, Neutral #6B6A63, Agree #586983, Strongly Agree #4467A3. Rows sorted by net agreement, Team collaboration at top, Compensation & benefits at bottom. White labels in segments >=10%.
      Legibility verdict: PASS (labels small but legible)

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17, not pure black.
      Chrome: title, axis title in light ink; question and tick labels light grey; legend on #242420 with a light-grey frame. No dark-on-dark text.
      Data: same layout; poles identical to light, mid steps built from the #A8A79F midpoint (Neutral #A8A79F), brighter than the poles. Labels white on the poles, near-black on the mid fills.
      Legibility verdict: PASS (labels small but legible)
