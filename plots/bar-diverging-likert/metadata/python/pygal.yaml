review:
  strengths:
  - 'Correct diverging construction with HorizontalStackedBar and negative stacks:
    neutral split evenly across one shared midpoint in every row'
  - Neutral percentage printed once as its full value through a per-series formatter,
    while narrow segments below 8 % stay unlabeled
  - Legend re-flowed into scale order SD | D | N | A | SA with 36 px swatches that
    clearly key each level in both themes
  - 'Theme chrome fully threaded through the pygal Style: both renders readable, guides
    removed except the thin centre line'
  - Rows sorted by net agreement, realistic employee engagement data that sums to
    100 % per row
  weaknesses:
  - 'VQ-07 (both): the five Likert steps are not even steps of the imprint_div marks
    ramp — Disagree sits 35 % of the way from #AE3030 to the grey midpoint while Agree
    sits 50 % of the way from the midpoint to #4467A3, and the dark render uses the
    light midpoint #6B6A63 instead of its own #686762 → symmetric steps at ramp positions
    0, 0.25, 0.5, 0.75, 1 with the theme''s midpoint. Likely cause: lerp_hex(SD_COLOR,
    NEUTRAL_GREY, 0.35) and the theme-invariant NEUTRAL_GREY.'
  - 'Suggestion: a ''0%'' tick under the centre line would anchor the two scales.'
  - 'Suggestion: centre the neutral label on the whole neutral segment instead of
    its right half.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1.
      Chrome: title "Employee Engagement Survey · bar-diverging-likert · python · pygal · anyplot.ai" (~84 % width), eight question labels on the left, x ticks 60% … 10% | 10% … 80% (no 0 at the centre), axis title "Response Percentage (%)", legend Strongly Disagree | Disagree | Neutral | Agree | Strongly Agree with 36 px swatches — all dark ink, readable, no collisions.
      Data: 8 horizontal diverging bars at full opacity: #AE3030 strongly disagree, a red-grey blend for disagree, grey #6B6A63 neutral split across a thin centre line, a grey-blue agree, #4467A3 strongly agree. Light percentage labels inside segments >= 8 %; the neutral full value is printed once on its right half (10%, 15%, 16%, 22% …). Sorted by net agreement: Team collaboration on top, fair compensation at the bottom. First-series green does not apply (ordered categories).
