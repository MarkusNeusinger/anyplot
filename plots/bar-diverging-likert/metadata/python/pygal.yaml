review:
  strengths:
  - 'Ordered Likert levels coloured as five steps of the imprint_div marks ramp (#AE3030
    → grey midpoint → #4467A3) in natural order, identical in both themes'
  - Neutral split evenly across one shared midpoint with negative stacks, so disagreement
    runs left and agreement right in every row
  - Questions sorted by net agreement from a tidy DataFrame with column constants
  - Full-opacity fills with light value labels at 36 px read cleanly on every fill
    in both themes; narrow segments under 8 % left unlabeled
  - Legend re-flowed into scale order SD | D | N | A | SA with spacing derived from
    label length; the second neutral half kept out of the legend via an untitled series
  - HTML export keeps pygal's native hover tooltips
  weaknesses:
  - 'SC-03 (both): each neutral half is labelled with the half value, so a 15 % neutral
    reads ''8%'' + ''8%'' and a 22 % neutral ''11%'' + ''11%'' → show the neutral''s
    full percentage once (e.g. on the right half) or label neither half with a half
    value. Likely cause: value_formatter applied to the ±neutral/2 series.'
  - 'VQ-03 (both): legend swatches are about 12 px squares beside 44 px legend text
    and barely register as colour keys → swatches about the legend text height (+20
    to +30 px). Likely cause: pygal''s default legend_box_size.'
  - 'Suggestion: a light ''0%'' or ''Neutral midpoint'' tick under the centre line
    would anchor the two scales.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1.
      Chrome: title "Employee Engagement Survey · bar-diverging-likert · python · pygal · anyplot.ai" (~84 % width), question labels, uniform x-tick labels (60% … 10% | 10% … 80%), axis title "Response Percentage (%)" and legend SD | D | N | A | SA — all dark ink, all readable, no collisions.
      Data: 8 horizontal diverging bars at full opacity: #AE3030 strongly disagree, blended muted red disagree, grey #6B6A63 neutral split across a thin centre line, grey-blue agree, #4467A3 strongly agree. Light 36 px percentage labels inside segments ≥ 8 %. Sorted by net agreement: Team collaboration on top, Fair compensation at the bottom. Neutral halves labelled with half values (8% 8% for 15 %).
      Legibility verdict: PASS

