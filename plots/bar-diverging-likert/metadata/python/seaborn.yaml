review:
  strengths:
  - Ordered Likert levels in five steps of the imprint_div marks ramp, red disagree
    pole, grey neutral per theme, green agree pole
  - Vectorised diverging geometry (cumsum around half the neutral) feeding an overlay
    of axes-level sns.barplot layers
  - Readable white percentage labels inside every segment >=10% in both themes; narrow
    segments left unlabeled
  - Theme tokens threaded through sns.set_theme rc; both renders theme-correct
  - Bold extreme question labels and subtle row banding give the sorted rows a clear
    hierarchy
  weaknesses:
  - 'VQ-02 (both): the 0% midline runs through every neutral percentage label (e.g.
    ''1|2%'') → keep the line behind the bars so the neutral labels sit on an unbroken
    fill. Likely cause: axvline zorder=0.9 still drawn above the seaborn bar patches;
    set the bars'' zorder above it or draw the line before the bars with a lower zorder
    than the patches.'
  - 'VQ-03 (both): the legend swatches are the full-saturation ramp colors while the
    bars are visibly duller (e.g. Strongly Disagree swatch #AE3030 vs bar about #9C3D3D)
    → the swatches must match the marks. Likely cause: sns.barplot default saturation=0.75;
    pass saturation=1.'
  - 'Suggestion: compute the net-agreement sort order once and reuse it for table
    and net (lines 86-87).'
  - 'Suggestion: the net-agreement column is a nice summary; consider lighter weight
    so it does not compete with the bars.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 with alternating faint row bands.
      Chrome: title 'Employee Engagement Survey · bar-diverging-likert · python · seaborn · anyplot.ai' in dark ink, x-axis 'Share of responses (%)' with absolute % ticks 60%..100%, eight question labels on the y axis (top 'Team collaboration' and bottom 'Compensation & benefits' bold), one-row frameless legend below. All readable.
      Data: 8 horizontal diverging bars sorted by net agreement (+68 top to -13 bottom), centered on the split neutral segment at a dark 0% line; colors step from matte red (Strongly Disagree) through a muted red-grey, grey neutral, a muted green-grey to brand green (Strongly Agree). White % labels in segments >=10%. Right column 'net +68%' .. 'net -13%' in green/grey/red bold. The 0% line crosses the neutral labels; bars are slightly duller than the legend swatches.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17 with faint row bands.
