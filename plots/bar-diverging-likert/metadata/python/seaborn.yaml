review:
  strengths:
  - Ordered Likert levels in five steps of the imprint_div marks ramp, red disagree
    pole, grey neutral per theme, green agree pole; swatches match the bars
  - Vectorised diverging geometry (cumsum around half the neutral) feeding an overlay
    of axes-level sns.barplot layers
  - Readable white percentage labels inside every segment >=10% in both themes; narrow
    segments left unlabeled
  - Theme tokens threaded through sns.set_theme rc; both renders theme-correct
  - Bold extreme question labels and subtle row banding give the sorted rows a clear
    hierarchy
  weaknesses:
  - 'VQ-02 (both): the 0% midline is still drawn over the neutral segments and runs
    through every neutral percentage label (e.g. ''1|2%'') → the line must sit behind
    the bar patches so the labels sit on an unbroken fill. Likely cause: the zorder=2
    passed to sns.barplot does not end up on the patches above the axvline''s zorder=1.5;
    set it on the patches after plotting (for p in ax.patches: p.set_zorder(2)) or
    give the axvline a zorder below the patches'' actual value.'
  - 'Suggestion: compute the net-agreement sort order once and reuse it for table
    and net (lines 86-87).'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 with faint alternating row bands.
      Chrome: title 'Employee Engagement Survey · bar-diverging-likert · python · seaborn · anyplot.ai' in dark ink, x-axis 'Share of responses (%)' with absolute ticks 60%..100%, eight question labels (top 'Team collaboration' and bottom 'Compensation & benefits' bold), frameless one-row legend below. All readable.
      Data: 8 horizontal diverging bars sorted by net agreement (+68 top to -13 bottom), centered on the split neutral at a dark 0% line; full-saturation ramp from matte red #AE3030 through muted red-grey, grey neutral, muted green-grey to brand green #009E73, matching the legend swatches. White % labels in segments >=10%. Right column 'net +68%'..'net -13%' in green/grey/red bold. The 0% line still crosses every neutral label.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17 with faint row bands.
      Chrome: title and legend in light ink, ticks and question labels in light grey; no dark-on-dark text.
      Data: identical ramp colors to light, neutral step on the dark-theme grey; white segment labels readable on every fill; 0% line in light ink crossing the neutral labels; net badges readable.
      Legibility verdict: PASS
