      Data: 8 horizontal Likert bars centered on 0 with page-colored segment edges; red #AE3030, muted red, grey #6B6A63, muted blue, blue #4467A3; white bold labels in segments >= 8%; light blue band + 'Net +66%' on the top row, light pink band + 'Net +2%' on the bottom row; center line under the bars.
