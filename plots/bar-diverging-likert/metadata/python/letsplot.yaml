      Data: 8 horizontal Likert bars centered on 0 with page-colored segment edges; steps red #AE3030, #8D4D4A, grey #6B6A63, #58697F, blue #4467A3 (ordered categories, so no #009E73 first series); white bold labels in segments >= 8%; light blue band + blue 'Net +66%' on the top row, light pink band + red 'Net +2%' on the bottom row; center line under the bars.
