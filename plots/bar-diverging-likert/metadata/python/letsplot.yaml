review:
  strengths:
  - 'All five characteristic properties shown: scale-ordered segments, neutral split
    evenly on one shared 0 line, imprint_div steps with red on the disagree side,
    rows sorted by net agreement, labels inside segments >= 8%'
  - Center line drawn under the bars and segments separated by page-colored edges,
    so every neutral label stays clean
  - Per-segment label ink via scale_color_identity (dark ink on the light neutral
    step in the dark theme)
  - Native lets-plot layer_tooltips() give question, level and percentage in the HTML
  - Theme tokens threaded through all chrome; both renders theme-correct
  weaknesses:
  - 'VQ-07 (dark): the neutral midpoint and the two blended steps are built from INK_MUTED
    #A8A79F, so Neutral renders as a bright grey that outshines both poles → the dark
    marks midpoint of imprint_div #686762 (Disagree/Agree steps then ≈ #8B4C49 / #566782).
    Likely cause: LEVEL_COLORS blends against INK_MUTED instead of the imprint_div
    marks midpoint.'
  - 'VQ-01 (dark): the near-white bold percentage labels sit at about 3.2:1 on the
    Agree step (#7687A1) and 3.6:1 on the Disagree step (#AB6C68) → at least 4.5:1,
    which the #686762-based steps give (≈ 5.0:1 / 5.6:1). Likely cause: the lightened
    steps from the VQ-07 defect under a fixed ON_BAR label color.'
  - 'DE-02 (both): a full dark frame still encloses the panel on all four sides, against
    the style guide''s no-top/right-spine rule → no frame. Likely cause: panel_border=element_blank()
    does not remove the frame lets-plot draws here; override it explicitly (e.g. panel_border=element_rect(color=PAGE_BG)
    or the frame''s own theme key).'
  - 'Suggestion: fold the two highlight-band geom_rect layers into one layer with
    a fill column and scale_fill_identity-style mapping to shorten the code.'
  - 'Suggestion: drop the unused IMPRINT_PALETTE reference or comment why it stays.'
