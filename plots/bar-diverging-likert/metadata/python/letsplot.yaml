review:
  strengths:
  - 'All five characteristic properties shown: scale-ordered segments, neutral split
    evenly on one shared 0 line, imprint_div marks steps with red on the disagree
    side, rows sorted by net agreement, labels inside segments >= 8%'
  - 'Ordered-category steps built on the imprint_div marks midpoint (#6B6A63 light
    / #686762 dark), so the neutral grey stays level with the poles and white labels
    read on every step in both themes'
  - Center line drawn under the bars and segments separated by page-colored edges,
    so every label stays clean
  - Native lets-plot layer_tooltips() give question, level and percentage in the HTML
  - Theme tokens threaded through all chrome; no panel frame; both renders theme-correct
  weaknesses:
  - 'VQ-01 (dark): the ''Net +66%'' (#4467A3) and ''Net +2%'' (#AE3030) callouts sit
    at roughly 2.9:1 and 2.4:1 on their dark tinted bands, below the 4.5:1 text contrast
    → the theme''s INK text (or a lighter tint of each pole) for the callouts in dark.
    Likely cause: notes[''color''] uses the pole hexes in both themes.'
  - 'Suggestion: fold the two highlight-band geom_rect layers into one layer with
    a fill column and scale_fill_identity to shorten the code.'
  - 'Suggestion: drop the unused IMPRINT_PALETTE constant.'
