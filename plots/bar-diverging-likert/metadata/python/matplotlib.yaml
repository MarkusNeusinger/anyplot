  strengths:
  - Neutral split evenly across one shared zero line, disagreement left and agreement
    right in every row
  - Ordered Likert levels colored with five steps of imprint_div marks, using the
    theme's grey midpoint stop
  - Rows sorted by net agreement with the most agreed question at the top
  - Bold white percentage labels inside segments of 7% or more, readable on every
    fill in both themes
  - Signed percent tick formatter (FuncFormatter) and MaxNLocator make the axis read
    as distance from the midpoint
  - Layout logic driven by a LEVELS list, so the diverging stack works for any odd-length
    scale
