review:
  strengths:
  - Diverging positions built from go.Bar base= offsets in overlay mode with the neutral
    split evenly across a shared zero midpoint
  - Theme-aware per-segment text colors keep every percentage label readable on its
    fill in both themes
  - Net-score callouts in the pole colors and a subtitle naming the extremes give
    the chart its own focal points
  - Legend placed well clear of the axis title on an elevated surface with a hairline
    border
  - Data rows sum to 100 % and the sort by net agreement is computed, not typed
  - Per-segment hovertemplate via customdata in the HTML export
  weaknesses:
  - 'VQ-07, VQ-04 (dark): the Agree step #4A6898 is nearly the same blue as the Strongly
    Agree pole #4467A3, so the two agree levels and their legend swatches cannot be
    told apart and the ''stronger for the strong responses'' property (C3) is lost
    → an Agree step about halfway between #4467A3 and the dark grey midpoint #686762
    (around #56677F), clearly lighter or greyer than the pole. Likely cause: the dark
    branch of LIKERT_COLORS[3].'
  - 'Suggestion: the band between the x-axis title and the legend is wide; a legend
    y nearer -0.3 would tighten the lower third.'
  - 'Suggestion: the net callouts could be added to the hovertemplate so the HTML
    shows each row''s net score.'
