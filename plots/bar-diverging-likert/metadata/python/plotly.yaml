review:
  strengths:
  - Diverging positions built from go.Bar base= offsets in overlay mode, the neutral
    split evenly across one shared zero midpoint
  - Per-segment text colors chosen against each fill keep every percentage label readable
    in both themes
  - Net-score callouts in the pole colors and a subtitle naming the extremes give
    the chart its own focal points
  - Legend on the elevated surface with a hairline border, five levels in scale order
  - Rows sum to 100 % and the sort by net agreement is computed, not typed
  - Per-segment hovertemplate via customdata in the HTML export
  weaknesses:
  - 'VQ-07 (both): the intermediate steps are tints off the imprint_div marks ramp
    — light Disagree #CC807D and Agree #8DA1C2 and dark Disagree #B06060 are lighter
    than the grey midpoint instead of lying between pole and midpoint → the ramp''s
    halfway steps, about #8C4D49 / #576883 on light and #8B4B49 on dark (keep dark
    Agree #56677F), with the segment text ink re-chosen for the darker fills. Likely
    cause: the hand-picked hex values in LIKERT_COLORS[1] and [3].'
  - 'Suggestion: the band between the x-axis title and the legend is wide; a legend
    y nearer -0.3 would tighten the lower third.'
  - 'Suggestion: the net score could be added to the hovertemplate so the HTML shows
    each row''s net agreement.'
