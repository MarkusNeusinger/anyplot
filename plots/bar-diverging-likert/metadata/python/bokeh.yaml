review:
  strengths:
  - Neutral segment split evenly across one shared zero line, with segment edges computed
    once in vectorised left/right arrays
  - Ordered Likert levels sampled as five steps of the imprint_div marks ramp per
    theme, red pole for disagree and brand green for agree
  - Rows sorted by net agreement, with a signed green/red net-agreement column as
    a focal read-out
  - In-segment percentage labels at 30pt with fill-dependent ink, readable on the
    neutral fill in both themes
  - 'Bokeh-native interactivity: per-renderer HoverTool tooltips and a click-to-hide
    legend in the HTML'
  - Theme tokens threaded through title, ticks, grid and legend; both renders theme-correct
  weaknesses:
  - 'VQ-01 (both): the dark #1A1A17 percentage labels on the Disagree fill (about
    #8D4D4A) read at about 2.7:1 contrast → light ink #F0EFE8 there (about 5.5:1).
    Likely cause: label_ink computes luminance from gamma-encoded sRGB channels without
    linearizing them, so the 0.3 threshold picks dark ink for that mid-tone fill.'
  - 'SC-03 (both): the x ticks −60, −40, −20 label disagree shares as negative percentages,
    which no response has → absolute tick labels (60, 40, 20, 0, 20, …). Likely cause:
    the default tick formatter on the signed segment edges; a CustomJSTickFormatter
    returning Math.abs(tick) fixes it.'
  - 'Suggestion: the net-agreement column at 24pt could match the 30pt in-segment
    labels so the two numeric layers read as one hierarchy.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, not pure white.
      Chrome: bold dark title 'bar-diverging-likert · python · bokeh · anyplot.ai' at top; ten question labels in INK_SOFT on the left; x ticks −60…100 and the directional axis title '← Disagree  Percentage of responses  Agree →' in dark ink; horizontal legend on an elevated box below. All readable.
      Data: ten horizontal bars sorted by net agreement (top 'I understand company goals' +66%, bottom 'Meetings are productive' −14%); five ramp steps red #AE3030, muted red-grey, grey #6B6A63, muted green-grey, green #009E73; neutral split across a zero line in the underlay; bold 30pt percentage labels in segments ≥10% (light ink on strong red, dark elsewhere; dark on the Disagree fill is weak); signed net values in green/red at the right.
      Legibility verdict: PASS (Disagree-segment labels low contrast, see weaknesses)

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17, not pure black.
      Chrome: title, question labels, ticks, axis title and legend labels in light ink; no dark-on-dark text.
      Data: poles red #AE3030 and green #009E73 identical to light; the ordered steps take the dark midpoint #686762, so intermediate steps are slightly darker; dark percentage labels on neutral, agree and strong-agree fills read clearly, Disagree fill labels weaker. Brand green clearly visible.
      Legibility verdict: PASS
