review:
  strengths:
  - Neutral segment split evenly across a shared zero line, computed once in vectorised
    left/right arrays
  - Rows sorted by net agreement, with a signed, green/red net-agreement column as
    a focal read-out
  - 'Fill-dependent label ink: dark text on the light cyan Agree fill, light text
    on the darker fills'
  - Zero line placed in the underlay so it never crosses a label; page-colored segment
    separators
  - 'Bokeh-native interactivity: per-renderer HoverTool tooltips and a click-to-hide
    legend in the HTML'
  - Theme tokens threaded through title, ticks, grid and legend; both renders theme-correct
  weaknesses:
  - 'VQ-01, SC-02 (dark): the light #F0EFE8 percentage labels on the dark-theme neutral
    fill #A8A79F have low contrast (about 2:1) and read faint → dark ink #1A1A17 on
    that fill, or the ramp midpoint #686762 as neutral fill. Likely cause: LEVEL_INK
    fixed to light ink for the neutral level while INK_MUTED flips to a light grey
    in dark.'
  - 'VQ-01 (both): in-segment percentage labels at 22pt read small beside the 34pt
    question labels (reference 34pt for text without its own row) → about 28-30pt
    (+6 to +8pt). Likely cause: LabelSet text_font_size=''22pt''.'
  - 'VQ-07 (both): the five ordered Likert levels use categorical palette members
    (#BD8233 ochre, #2ABCCD cyan) between the red and green poles instead of steps
    of the imprint_div marks ramp, and the dark neutral is #A8A79F instead of the
    ramp midpoint #686762 → sample the ordered steps from the red→grey midpoint→green
    marks ramp per theme. Likely cause: LEVEL_COLORS hard-coded from the categorical
    palette and INK_MUTED.'
  - 'Suggestion: tick labels on the disagree side could read as positive shares (60,
    40, 20) with a custom tick formatter so no negative percentages appear.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, not pure white.
      Chrome: bold dark title 'bar-diverging-likert · python · bokeh · anyplot.ai' at top; ten question labels in INK_SOFT on the left; x ticks -60…100 and the directional axis title '← Disagree  Percentage of responses  Agree →' in dark ink; horizontal legend on an elevated box below. All readable.
      Data: ten horizontal bars sorted by net agreement (top +66% 'I understand company goals', bottom -14% 'Meetings are productive'); segments red #AE3030, ochre #BD8233, grey #6B6A63, cyan #2ABCCD, green #009E73, neutral split across a thin zero line drawn under the bars; bold percentage labels inside segments >=10% (dark on cyan, light elsewhere); signed net values in green/red at the right.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17, not pure black.
      Chrome: title, question labels, ticks, axis title and legend labels in light ink; no dark-on-dark text.
      Data: red, ochre, cyan and green identical to the light render; the neutral fill flips to a light grey #A8A79F, on which the light percentage labels read faint (low contrast). Brand green clearly visible.
      Legibility verdict: PASS (neutral-segment labels weak, see weaknesses)
