review:
  strengths:
  - Percentage labels are placed inside each segment via geom_text with position_fill(vjust
    = 0.5), aligned exactly to the stacked positions — a nontrivial ggplot2 technique
    executed correctly
  - Per-category label ink (label_ink lookup, LABEL_DARK vs LABEL_LIGHT) is chosen
    by each fill color's own luminance, keeping text legible on the light lavender/ochre
    segments as well as the darker green/blue ones, in both page themes
  - Labels are suppressed below a 5% share threshold, avoiding cramped or overlapping
    text on the thinnest slices instead of forcing tiny numbers into segments too
    small to hold them
  - Correct Imprint palette in canonical order with brand green (#009E73) as the first
    series, identical data colors across light and dark renders, and theme-correct
    chrome (background, ink, grid-free minimal frame) in both
  - Bar edges stroked in the page background color create clean separation between
    stacked segments without adding a competing outline color
  - Title format, axis mapping, and legend labels all match the specification exactly;
    data tells a coherent 'Compute share growing over FY2021-FY2025' story that shows
    through the green segment's visual dominance
  weaknesses:
  - Support & Security segments in FY2023/FY2024 shrink to roughly 2-3% share, becoming
    a barely-visible sliver with no label — consider a small floor/synthetic adjustment
    to the data so every bar keeps at least one clearly legible slice per component
    for visual consistency
  - No gridlines at all (panel.grid = element_blank()) means readers must trace bars
    against the far-left axis ticks with no in-plot reference lines to gauge intermediate
    percentages precisely — acceptable for this category count but a very faint y-axis-only
    grid would aid precision without adding clutter
  - Design Excellence is solid (contrast-aware label ink, PAGE_BG bar-edge separation)
    but stops short of an explicit focal-point device (e.g. a callout or emphasis
    on the FY2021→FY2025 Compute share shift) that would push the storytelling from
    good to excellent
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Title "Cloud Infrastructure Spend Mix · bar-stacked-percent · r · ggplot2 · anyplot.ai" in dark ink at top-left, clearly visible; x-axis "Fiscal Year" and y-axis "Share of Annual Cloud Spend" labels in dark ink; percent-formatted y tick labels (0%, 25%, 50%, 75%, 100%) in soft dark-gray ink; legend "Spend Category" with four swatches (Compute, Storage, Networking, Support & Security) on the right, dark text on the light background.
      Data: Five fiscal-year bars (FY2021-FY2025), each stacked to 100% and split into four segments: Compute (brand green #009E73, largest and growing from ~49% to ~65% across the years), Storage (lavender), Networking (blue), Support & Security (ochre, thin in the two middle years). Bold percentage labels sit inside each segment large enough to read (dark labels on green/lavender/ochre, white label on the blue Networking segment for contrast). Thin bar-edge strokes in the page background color separate segments cleanly.
      Legibility verdict: PASS — all title, axis, tick, legend, and in-segment text is clearly readable against the light background; no light-on-light text found.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Same title, axis labels, tick labels, and legend text now rendered in light ink (#F0EFE8 primary / #B8B7B0 secondary), clearly legible against the dark background.
      Data: Identical segment colors and identical percentage values to the light render — Compute green, Storage lavender, Networking blue, Support & Security ochre are unchanged; only the chrome (background, axis/tick/title/legend ink) flipped to the dark-theme tokens. In-segment percentage labels use the same per-category contrast-aware ink (dark labels on green/lavender/ochre segments, white label on the blue Networking segment) and remain fully legible against both the segment fill and the dark page background — no dark-on-dark failures observed.
      Legibility verdict: PASS — no unreadable text in either render; brand green reads clearly on the dark surface.
