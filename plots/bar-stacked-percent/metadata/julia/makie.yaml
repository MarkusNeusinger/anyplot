review:
  strengths:
  - Uses Makie's native `barplot!(... ; stack = ...)` for true 100%-stacked bars instead
    of manually cumsum-ing offsets — idiomatic and correctly normalizes each bar to
    exactly 100%
  - Theme tokens (PAGE_BG, INK, INK_SOFT) are threaded consistently through Figure,
    Axis, and Legend so both light and dark renders are fully legible with no dark-on-dark
    or light-on-light failures
  - 'Clean layout: top/right spines removed, subtle y-only gridlines, borderless legend,
    generous whitespace, and a correctly formatted title'
  - Data is a plausible, neutral, real-world illustrative scenario (electricity generation
    mix 2010-2025) with a clear compositional trend (coal declining, renewables rising)
    and sensible 6 categories x 4 components within the spec's recommended range
  - Segment percentage labels are shown for every segment (all shares exceed the 6%
    skip threshold) with a per-series dark/light text color plan for contrast
  weaknesses:
  - 'Broken/dead ''semantic exception'' color remap: the code computes `source_colors
    = IMPRINT_PALETTE[[4, 3, 2, 1]]` and a matching comment block explicitly claims
    Renewables gets brand green (#009E73) and Coal gets ochre — but BOTH rendered
    PNGs (light and dark) show the opposite: Coal is green (#009E73), Natural Gas
    is lavender, Nuclear is blue, and Renewables is ochre (#BD8233), i.e. the untouched
    canonical palette order. The remap has zero visible effect. Verify whether the
    per-point `color` vector actually lines up with the `stack` segments when passed
    to `barplot!`, or re-render from the current script if the PNGs are stale — either
    way the shipped image must match the code''s documented intent.'
  - The 'Renewables overtake Coal' crossover callout (the `lines!` + `text!` pair
    drawn at y=100-106 after `ylims!(ax, 0, 124)`) is completely absent from both
    renders — the axis top is flush with the 100% bar tops with no headroom above
    it, meaning the explicit `ylims!(ax, 0, 124)` is not taking effect (likely reset
    by autolimits triggered by the later plot/text calls or the Legend). This was
    meant to be the chart's storytelling focal point and instead is silently dropped;
    move `ylims!` to run last (immediately before `save`), or otherwise lock the y-axis
    range so it survives all subsequent plotting calls.
  - White percentage-label text on the ochre/orange Renewables (or, per current render,
    Coal-adjacent-position) segment has comparatively low contrast versus the white-on-green/blue/lavender
    segments — worth rechecking against the code's own `label_colors` dark/light assignment
    once the color-remap bug above is fixed, since the label color plan is indexed
    to the intended segments, not the ones that actually rendered.
  - No `Random.seed!` call even though the library skeleton recommends one for reproducibility
    conventions — harmless here since the data is a fixed literal matrix (fully deterministic
    already), but worth adding for consistency with other Makie implementations in
    the catalog.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — correct, not pure white.
      Chrome: Title "bar-stacked-percent · julia · makie · anyplot.ai" is bold dark text, clearly readable. X-axis "Year" and y-axis "Share of Electricity Generation (%)" labels are dark and legible. Tick labels (years, 0-100% by 20%) are soft dark gray and legible. Subtle horizontal gridlines only, no top/right spines.
      Data: Six years (2010-2025) of 100%-stacked bars with four components. Bottom-to-top segment order in every bar is Coal (green #009E73), Natural Gas (lavender #C475FD), Nuclear (blue #4467A3), Renewables (ochre #BD8233) — this is the canonical palette order (first series green), NOT the semantic-exception order the code's comments claim to compute (Renewables=green, Coal=ochre). Percentage labels are printed in white inside every segment; legible on green/blue/lavender, borderline-but-still-legible on the ochre segment. No crossover annotation/callout is visible anywhere above the bars despite being present in the source code.
      Legibility verdict: PASS (all chrome text is readable; the color-remap and callout issues are correctness/fidelity bugs, not legibility failures).

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — correct, not pure black.
      Chrome: Title, axis labels, and tick labels all render in light off-white/soft-gray tones, clearly legible against the dark background — no dark-on-dark failures. Gridlines subtle and visible.
      Data: Identical segment colors and identical bottom-to-top ordering to the light render (Coal=green, Natural Gas=lavender, Nuclear=blue, Renewables=ochre) — confirms data colors are held constant across themes, which is correct. Same missing crossover callout as the light render (reproducible, not a one-off rendering glitch).
      Legibility verdict: PASS (chrome and data both fully legible; same underlying color-remap/callout bugs as the light render, not a legibility issue).
