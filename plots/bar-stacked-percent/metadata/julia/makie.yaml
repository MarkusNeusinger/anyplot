review:
  strengths:
  - 'Semantic-exception color remap now renders correctly: Renewables=#009E73 (brand
    green), Coal=#BD8233 (ochre), Natural Gas=#4467A3 (blue), Nuclear=#C475FD (lavender)
    — confirmed identical in both light and dark PNGs, resolving the attempt-2 dead-code
    defect'
  - Crossover callout ("Renewables overtake Coal" at 2022) now renders visibly above
    the bars with correct headroom from ylims!(ax, 0, 124) called last, right before
    save — no clipping, no overlap with the legend or bars
  - Per-segment label color is matched to each segment's actual background lightness
    (dark ink on ochre/lavender, white on blue/green), giving good contrast on every
    segment in both themes — fixes the attempt-1 low-contrast complaint
  - Uses Makie's native barplot!(...; stack = ...) for true 100%-stacked bars — idiomatic
    and normalizes every bar to exactly 100%
  - Theme tokens threaded consistently through Figure, Axis, and Legend; both renders
    are fully legible with no dark-on-dark or light-on-light failures, and canvas
    is exactly 3200×1800
  - 'Clean visual design: spines removed, subtle single-axis gridlines, borderless
    theme-matched legend, generous whitespace, percentage labels skipped below 6%
    share to avoid clutter'
  - Plausible, neutral real-world data (illustrative electricity generation mix 2010-2025)
    spanning the spec's recommended 3-12 categories / 2-6 components range
  - Code matches rendered output exactly — no fake or dead functionality; deterministic
    hardcoded data matrix needs no RNG seed
  weaknesses:
  - Segment percentage labels (fontsize=12) and tick labels will shrink to only a
    few px when the 3200px canvas is scaled down to the ~400px mobile preview — consider
    a slightly larger fontsize floor for the smallest text elements if mobile legibility
    feedback comes back negative
  - 'Aesthetic sophistication is solid but not maximal: a single callout and per-segment
    adaptive label color are the only distinctive storytelling devices — an additional
    touch (e.g. end-of-series value labels, or subtle emphasis on the Renewables band)
    could push Design Excellence further'
  - Library Mastery is good but not exhaustive — no use of more advanced Makie-specific
    recipes/features beyond native stack= barplot and manual PolyElement legend
