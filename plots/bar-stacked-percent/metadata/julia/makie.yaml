    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Bold dark title "bar-stacked-percent · julia · makie · anyplot.ai" centered at top; dark y-axis label "Share of Electricity Generation (%)" and x-axis label "Year"; soft dark-gray tick labels (0-100% by 20s on Y; 2010/2013/2016/2019/2022/2025 on X); only bottom+left spines shown; subtle horizontal gridlines at each 20% mark. All chrome text is clearly dark-on-cream and readable.
      Data: Six bars, each stacked into 4 segments summing exactly to 100%. Bottom-to-top order in every bar: Coal (ochre #BD8233, 49%→22%), Natural Gas (blue #4467A3, 27%→22%), Nuclear (lavender #C475FD, 15%→9%), Renewables (green #009E73, 9%→47%) — first categorical/brand color is correctly reassigned to Renewables per the documented semantic-exception rule. Percentage labels are printed inside every segment with contrast-matched text color (dark ink on ochre/lavender, white on blue/green) — all legible. A callout "Renewables overtake Coal" with a short connector line sits above the 2022 bar, inside the extended y-range headroom, with no clipping or overlap with the legend. Frameless legend at right lists all 4 components in swatch+label form, background matched to the plot.
