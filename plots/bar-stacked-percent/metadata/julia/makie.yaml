review:
  strengths:
  - Correct 100% stacked bar chart — every bar is normalized to sum exactly to 100%
    via `row_totals`/`shares`
  - Inline percentage labels are only drawn when a segment is >= 6% wide, avoiding
    clutter/overlap in thin segments
  - 'Imprint palette used correctly: Coal (first series) is #009E73, remaining components
    follow canonical order 2-4'
  - Both themes are correctly implemented — identical data colors, chrome (background,
    title/axis/tick color, spines) flips correctly between light and dark
  - Clean L-shaped spine (top/right removed), no fake interactivity, no edge clipping,
    canvas is exactly 3200x1800
  - 'Idiomatic Makie usage: native `stack` keyword on `barplot!` instead of manually
    computing cumulative offsets, custom `Legend` built from `PolyElement`s for the
    stacked series'
  - Deterministic hardcoded data (no RNG needed), clean imports, KISS top-to-bottom
    script structure
  weaknesses:
  - 'Segment percentage labels use plain white text on the lighter Imprint hues (lavender
    #C475FD ''Natural Gas'', ochre #BD8233 ''Renewables''), giving roughly 2.5-3:1
    contrast versus ~7:1+ on the green/blue segments — noticeably harder to read on
    those two bands in both themes. Add a thin dark stroke/shadow behind the label
    text (or switch label color to INK on the lighter fills only) to normalize contrast
    across all four segments.'
  - 'Design Excellence is still close to ''well-configured default'': no callout/annotation
    marks the chart''s clearest insight (e.g. renewables overtaking coal around 2022),
    and there is zero grid to help readers compare segment heights precisely across
    bars. A very subtle y-axis gridline (10-15% opacity) or a direct end-of-series
    annotation would raise both DE-01 and DE-02.'
  - 'Color assignment follows canonical Imprint order (Coal=brand green, Renewables=ochre),
    which risks a semantic mismatch — readers commonly expect green to signal renewable/clean
    energy, not coal. Consider the semantic-exception path in the style guide (assign
    #009E73 to Renewables, reflow the remaining 3 colors across Coal/Natural Gas/Nuclear)
    to strengthen the data story; this is a judgment call, not a hard rule violation.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Bold dark title "bar-stacked-percent · julia · makie · anyplot.ai" centered at top; dark "Share of Electricity Generation (%)" y-axis label and "Year" x-axis label; soft dark-gray tick labels (0-100% in 20% steps on Y, years 2010/2013/2016/2019/2022/2025 on X); only bottom+left spines visible (L-shaped frame); legend at right with 4 color swatches (Coal, Natural Gas, Nuclear, Renewables), no frame border.
      Data: Six bars, each stacked into 4 segments summing to 100%. Coal (green #009E73) shrinks from 49% (2010) to 22% (2025); Natural Gas (lavender #C475FD) stays roughly flat (27%→22%); Nuclear (blue #4467A3) mildly declines (15%→9%); Renewables (ochre #BD8233) grows from 9% to 47%. White percentage labels are centered in each segment when the segment is >=6%.
      Legibility verdict: PASS overall — all title/axis/tick text is clearly dark-on-cream and readable. Minor exception: the white percentage labels on the lighter lavender and ochre segments have noticeably lower contrast than on the green/blue segments, though still legible.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same layout as light — title, axis labels, and tick labels are rendered in light tones (white/light-gray) against the dark background; spines are light-gray; legend text is light-colored, still framed only by its swatches.
      Data: Identical segment colors and identical percentage values to the light render (Coal green, Natural Gas lavender, Nuclear blue, Renewables ochre) — only the chrome flipped, confirming theme-adaptive tokens are threaded through correctly. No dark-on-dark failures found; all chrome text is clearly visible against the near-black surface.
      Legibility verdict: PASS overall — same minor lavender/ochre percentage-label contrast caveat as the light render, but no theme-adaptation defects (no black text on dark background, no white text lost against pale chrome).
