review:
  strengths:
  - 'Correct Imprint palette in canonical order (green/lavender/blue/ochre), first
    series is brand green #009E73, data colors identical between light and dark renders,
    and all chrome (title, legend, ticks, grid) correctly flips per theme.'
  - Smart conditional percentage-label rendering (label only shown when a segment's
    share is >=6%) avoids clutter and text collisions in thin segments, directly implementing
    the spec's optional 'percentage labels within segments when space permits' note.
  - In-segment percentage labels use white text with a matching-background textBorderColor/textBorderWidth
    stroke, keeping them legible against every palette color (including the lighter
    lavender segment) in both themes.
  - 'Clean, minimal chrome: y-axis line and both axes'' tick marks are hidden, only
    a single subtle horizontal gridline set remains, and margins are generous — no
    chartjunk.'
  - 'Correctly follows the ECharts mount-node contract: no explicit width/height or
    devicePixelRatio passed to echarts.init, animation disabled, single chart on #container.'
  - Deterministic, realistic dataset (urban commute mode share 2019-2024) that tells
    a clear story — declining car share, growing transit/bike share — even as total
    commuter volume drifts, which is exactly the scenario a 100%-stacked view is meant
    to isolate.
  weaknesses:
  - 'Bar-to-gap ratio is quite wide (barWidth: ''55%''), leaving noticeably large
    empty space between only 6 categories on the full 3200px canvas; increasing barWidth
    to ~65-70% (or tightening categoryGap) would give a denser, more polished data-to-ink
    ratio.'
  - 'Per-segment percentage labels are rounded independently, so one bar''s visible
    labels sum to 101% (2023: 52+26+16+7) instead of 100% — a cosmetic rounding-display
    artifact, not a data error, but worth a rounding-aware formatter (e.g. largest-remainder
    rounding) if revisited.'
  - Neither axis has an explicit axis title (relies on self-evident year tick labels
    and %-suffixed y-axis ticks) — acceptable per the style guide's redundant-label
    rule, but a subtle y-axis label like 'Share of Commuters' would add clarity at
    a glance.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "Urban Commute Mode Share · bar-stacked-percent · javascript · echarts · anyplot.ai" is dark ink text, clearly readable, centered at the top. Legend (Car / Public Transit / Bicycle / Walking) sits below the title with matching swatch colors, readable. X-axis year tick labels (2019-2024) and y-axis percentage tick labels (0%-100%, step 20%) are dark-gray and legible. A single set of subtle horizontal gridlines is visible without competing with the data.
      Data: Six stacked bars, each summing to ~100%. First series (Car) is brand green #009E73, second (Public Transit) is lavender/purple, third (Bicycle) is blue, fourth (Walking) is ochre/amber — matches the Imprint canonical categorical order. In-segment percentage labels are white text with a dark contrasting stroke, readable against every segment color.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Title, legend text, and axis tick labels have all flipped to light/off-white ink and remain clearly readable against the dark background. Gridlines are subtle and still visible. No dark-on-dark or light-on-light failures observed.
      Data: Same four data colors as the light render (green, lavender, blue, ochre) — confirms data colors are identical between themes, only chrome flipped. In-segment percentage labels (white text with stroke) remain legible on every segment in the dark theme as well.
      Legibility verdict: PASS
