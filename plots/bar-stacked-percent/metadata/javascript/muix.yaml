review:
  strengths:
  - 'Correct 100% stacked-bar semantics: series use stack: "total" with values pre-normalized
    to percentages, and the y-axis is fixed to 0-100% with a % formatter.'
  - Bars are now sorted descending by renewables share (Norway -> Brazil -> Germany
    -> China -> France -> USA), creating a clear visual gradient that reinforces the
    subtitle's narrative -- directly addresses the attempt-1 weakness about arbitrary
    bar order.
  - Axis line and grid strokes now use the softer t.grid token instead of MUI X's
    default full-ink stroke (via sx targeting .MuiChartsAxis-line / .MuiChartsGrid-line),
    producing a more refined chrome treatment -- directly addresses the attempt-1
    DE-02 weakness.
  - Thoughtful per-segment label contrast (LABEL_ON_LIGHT_FILL / LABEL_ON_DARK_FILL
    chosen per series fill, not per page theme) keeps every in-bar percentage legible
    on both themes.
  - Threshold-based label suppression (barLabel only renders when value >= 6%) avoids
    cramming unreadable text into narrow slivers, e.g. Brazil's ~2% nuclear sliver
    and France's ~1% coal sliver.
  - Canonical Imprint palette order (green, lavender, blue, ochre) with data colors
    pixel-identical between light and dark renders; only chrome (background, text,
    gridlines) flips.
  - 'Idiomatic, rich use of the community BarChart API: xAxis/yAxis valueFormatter,
    categoryGapRatio, slotProps for legend and barLabel styling, disableTicks, and
    a documented tickFontSize trick to offset the y-axis label from the ''100%'' tick
    text.'
  weaknesses:
  - A visible gap remains between the last bar (USA) and the legend column on the
    right -- tightened relative to attempt 1 but could be trimmed further for balance.
  - Sorting by renewables share slightly dilutes the subtitle's Norway-vs-China anchor,
    since China now sits mid-pack rather than at a visual extreme (USA and France
    have even lower renewables shares) -- the coal-specific claim still holds (China's
    58% is the highest coal share of any bar), but a reader skimming bar position
    alone may not immediately connect it to 'leans on coal'.
  - Design excellence is solid but not exceptional -- beyond the new axis-line refinement
    and existing label-contrast logic, there are no further distinctive touches (e.g.
    no accent/callout on the Norway or China bar to underline the subtitle's claim).
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 -- not pure white, not dark.
      Chrome: Title "bar-stacked-percent · javascript · muix · anyplot.ai" in dark ink, top-left; a dark-gray subtitle below it ("Norway's grid runs almost entirely on renewables, while China still leans on coal"); y-axis "Share (%)" and x-axis "Country" labels in dark ink; tick labels (0%-100%, country names) in a softer gray; subtle horizontal gridlines and a now-lighter (grid-weight) axis line; vertical legend on the right listing Renewables/Nuclear/Natural Gas/Coal with color swatches. All text is clearly readable against the light background -- no light-on-light issues.
      Data: Six vertical bars, now sorted descending by renewables share (Norway 100%, Brazil 86%, Germany 54%, China 34%, France 25%, USA 22%), each stacked to 100% with up to four components. First series (Renewables) is brand green #009E73, followed by lavender (Nuclear), blue (Natural Gas), and ochre (Coal) -- matching canonical Imprint order. In-bar percentage labels use dark text on the green/lavender/ochre segments and light text on the blue segment, all legible against their respective fills. Tiny segments (e.g. Brazil's ~2% nuclear sliver, France's ~1% coal sliver) correctly omit a label to avoid clutter.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 -- not pure black, not light.
      Chrome: Same title and subtitle now in light ink/soft light-gray, axis labels and tick labels flipped to light tones, gridlines and axis line still subtle but visible against the dark surface, legend text light gray. No dark-on-dark failures observed -- all chrome text is clearly visible against the near-black background.
      Data: Segment colors (green, lavender, blue, ochre) are pixel-identical to the light render -- only the chrome (background, text, gridlines, axis line) flipped. In-bar percentage label colors are unchanged (still chosen per-segment fill, not per page background) and remain legible on both themes since they sit on the colored bar fills rather than the page background.
      Legibility verdict: PASS
