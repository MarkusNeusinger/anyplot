review:
  strengths:
  - 'Proportions are computed from raw records per category and stacked with MUI X''s
    native `stack: "share"` series grouping on a fixed 0–100 % axis, so every bar
    spans the whole and components keep the same order and Imprint color in every
    bar'
  - Per-series `barLabel` callback reads `ctx.bar.height` to label only segments of
    at least 30 px, leaving thin slivers (Norway gas/coal, Brazil nuclear) clean as
    the spec permits
  - Segment label ink is chosen per fill by WCAG contrast (dark ink on green/purple/ochre,
    light ink on blue), so every percentage label reads against its own fill in both
    themes
  - Bars are sorted by renewables share (Norway 99.6 % to USA 22.0 %), and a data-derived
    inkSoft subtitle states the ordering — a clear reading path built beyond the spec's
    Notes
  - Theme tokens drive all chrome (ink title, inkSoft subtitle/ticks, elevatedBg segment
    seams), and the tooltip valueFormatter adds one-decimal shares in the interactive
    HTML
  weaknesses:
  - 'Suggestion: the 64 px x-axis band leaves a wide empty gap between the country
    tick labels and the ''Country'' axis title; a tighter band (about 48 px) would
    tie them together.'
  - 'Suggestion: a lighter weight or slightly smaller size for in-segment percentage
    labels would let the fills carry more of the visual weight.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, no pure white.
      Chrome: bold dark title "Electricity Generation Mix · bar-stacked-percent · javascript · muix · anyplot.ai" top-left (~55 % width), soft-ink subtitle "6 grids, each normalized to its own total · sorted by renewables share: Norway 99.6% to USA 22.0%"; centered horizontal legend (Renewables, Nuclear, Natural gas, Coal); y-axis "Share of country total (%)" with 0%–100% ticks every 10 %; x-axis "Country" with Norway, Brazil, Germany, China, France, USA. No grid, left and bottom axis lines only. All text readable.
      Data: six full-height 100 % bars, segments Renewables #009E73 (bottom), Nuclear #C475FD, Natural gas #4467A3, Coal #BD8233 (top), separated by thin light seams. Percentage labels in bold inside segments ≥ 30 px (dark ink on green/purple/ochre, light ink on blue); slivers unlabeled. First series is brand green.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, axis titles, legend text in light ink; subtitle and tick labels in light soft ink; axis lines light. No dark-on-dark text anywhere.
      Data: segment colors identical to the light render; seams flip to the dark elevated surface; in-segment label inks are identical to light (fill-driven), all readable on their fills.
      Legibility verdict: PASS
