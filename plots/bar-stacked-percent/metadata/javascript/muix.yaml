review:
  strengths:
  - 'Correct 100% stacked-bar semantics: series use stack: "total", values are pre-normalized
    to percentages, and the y-axis is fixed to 0-100% with a % formatter.'
  - 'Thoughtful per-segment label contrast: LABEL_ON_LIGHT_FILL / LABEL_ON_DARK_FILL
    are chosen per series fill (dark ink on green/lavender/ochre, light ink on the
    darker blue segment) so every in-bar percentage stays legible.'
  - Threshold-based label suppression (barLabel only renders when value >= 6) avoids
    cramming unreadable text into narrow slivers (e.g. Brazil's ~2% nuclear segment).
  - Canonical Imprint palette order is respected (green -> lavender -> blue -> ochre)
    and data colors are identical between light and dark renders; only chrome (background,
    axis lines, text) flips theme.
  - 'Idiomatic, rich use of the community BarChart API: xAxis/yAxis valueFormatter,
    categoryGapRatio, slotProps for legend and barLabel styling, disableTicks, and
    a documented tickFontSize trick to offset the y-axis label from the ''100%'' tick
    text.'
  - Descriptive subtitle frames a clear narrative (Norway's all-renewable grid vs.
    China's coal reliance), giving the chart a focal point.
  - Realistic, plausible dataset (illustrative electricity generation mix, TWh) within
    the spec's recommended 3-12 categories / 2-6 components range, deterministic and
    in-memory.
  weaknesses:
  - Bars are ordered by an arbitrary country list rather than sorted by renewables
    share (or another metric) — sorting descending would visually reinforce the subtitle's
    Norway-vs-China contrast and add a clearer data-storytelling gradient.
  - 'Visual refinement is solid but not distinctive: default MUI X axis lines, no
    additional refinement beyond the mandated grid/margin tuning — consider a slightly
    more minimal chrome treatment (e.g. lighter axis line) to lift Design Excellence
    further.'
  - Sizable empty whitespace between the last bar (Norway) and the legend column —
    could tighten the right margin slightly for better balance without harming legibility.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "bar-stacked-percent · javascript · muix · anyplot.ai" in dark ink, top-left; a dark-gray subtitle below it ("Norway's grid runs almost entirely on renewables, while China still leans on coal"); y-axis "Share (%)" and x-axis "Country" labels in dark ink; tick labels (0%-100%, country names) in a softer gray; subtle horizontal gridlines; vertical legend on the right listing Renewables/Nuclear/Natural Gas/Coal with color swatches. All text is clearly readable against the light background — no light-on-light issues.
      Data: Six vertical bars (China, USA, Germany, France, Brazil, Norway), each stacked to 100% with four components. First series (Renewables) is brand green #009E73, followed by lavender (Nuclear), blue (Natural Gas), and ochre (Coal) — matching canonical Imprint order. In-bar percentage labels use dark text on the green/lavender/ochre segments and light text on the blue segment, all legible against their respective fills. Tiny segments (e.g. Brazil's ~2% nuclear sliver) correctly omit a label to avoid clutter.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title and subtitle now in light ink/soft light-gray, axis labels and tick labels flipped to light tones, gridlines still subtle but visible against the dark surface, legend text light gray. No dark-on-dark failures observed — all chrome text is clearly visible against the near-black background.
      Data: Segment colors (green, lavender, blue, ochre) are pixel-identical to the light render — only the chrome (background, text, gridlines, axis lines) flipped. In-bar percentage label colors are unchanged (still chosen per-segment fill, not per page background), and remain legible on both themes since they sit on the colored bar fills rather than the page background.
      Legibility verdict: PASS
