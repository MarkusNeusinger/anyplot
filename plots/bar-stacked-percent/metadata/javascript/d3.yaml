review:
  strengths:
  - Semantic sentiment color mapping (brand green -> lime -> muted gray -> amber ->
    matte red) reinforces the good-to-bad Likert narrative, going beyond mechanical
    canonical-order palette assignment while staying fully inside the Imprint palette
    + anchors
  - Percentage labels are conditionally rendered only for segments >= 6% of the stack
    height, avoiding cramped/overlapping text on thin slices while still labeling
    every meaningful segment
  - Idiomatic d3.stack().offset(d3.stackOffsetExpand) usage with proper data-join
    patterns (.data().join()); all five category stacks correctly normalize to exactly
    100%
  - 'Both renders are theme-correct: identical data colors between light/dark, and
    the theme-adaptive Neutral segment correctly swaps both its fill and its label
    text color together so contrast holds in both themes'
  - Deterministic, realistic in-memory dataset (customer satisfaction survey) with
    plausible, varied distributions across categories -- no controversial content
  weaknesses:
  - No explicit y-axis title (e.g. 'Share of Responses') -- the '.0%' tick format
    implies the unit but an explicit axis label would fully satisfy descriptive-axis
    expectations
  - The percent-normalized-stack technique, while correctly idiomatic for D3, is also
    available as a built-in option in other charting libraries (e.g. Plotly barnorm='percent',
    ECharts stack percent) -- a more D3-distinctive flourish (e.g. custom label curvature,
    fine-grained per-segment interaction affordances noted for the HTML view) would
    lift Library Mastery further
  - Bar padding (0.35) leaves fairly generous dead space between the five bars; tightening
    slightly would slightly improve canvas utilization without hurting readability
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1), not pure white -- matches the required light-theme surface.
      Chrome: Title "bar-stacked-percent · javascript · d3 · anyplot.ai" in bold dark ink, fully visible near the top with no clipping. Legend (5 swatches: Very Satisfied, Satisfied, Neutral, Dissatisfied, Very Dissatisfied) centered below the title, dark secondary-text labels, clearly readable. X-axis category labels (Product Quality, Customer Support, Pricing, Ease of Use, Delivery Speed) and y-axis percent ticks (0%-100%) are dark and legible against the light background. Subtle horizontal gridlines only.
      Data: Five 100%-stacked bars, each summing to 100%. First series (Very Satisfied) renders in the brand green #009E73; remaining segments use lime-green, muted gray, amber/tan, and matte red in a sentiment gradient from positive to negative. In-segment white/dark percentage labels (e.g. "38%", "34%", "14%") are placed with contrast chosen per segment background and are all readable; the smallest segment (Product Quality's 5% "Very Dissatisfied") is correctly omitted to avoid clutter.
      Legibility verdict: PASS -- all text is clearly readable against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17), not pure black -- matches the required dark-theme surface.
      Chrome: Same title, now in light/near-white ink, fully visible with no clipping. Legend swatches identical positions/colors, label text now light-colored and legible against the dark background. Axis category labels and percent ticks are rendered in light text, clearly visible against the dark surface. Gridlines remain subtle.
      Data: All five data colors are identical to the light render (green, lime, gray, amber, red) -- confirming only chrome flipped, not data colors. The Neutral segment's fill swaps to a lighter gray in dark mode and its label text correctly swaps to dark ink to stay legible on the lighter fill -- no dark-on-dark failure anywhere. All other segment labels (fixed light/dark per background luminance) remain readable.
      Legibility verdict: PASS -- all text is clearly readable against the dark background; no dark-on-dark or light-on-light failures detected.
