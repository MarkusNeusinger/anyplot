review:
  strengths:
  - Correct 100% stacked bar normalization — every quarter's segments sum to exactly
    100%, confirmed by cross-checking the raw revenue values against rendered segment
    widths
  - 'Full Imprint palette compliance: AWS is #009E73 (position 1), Azure/Google Cloud/Alibaba
    Cloud follow canonical positions 2-4, and ''Other'' correctly uses the theme-adaptive
    muted anchor instead of consuming a categorical slot for a non-semantic ''rest''
    bucket'
  - Theme-adaptive chrome is flawless in both renders — title, axis titles, tick labels,
    and legend text are all clearly legible on both the warm off-white and warm near-black
    backgrounds, with no dark-on-dark or light-on-light failures
  - categoryPercentage/barPercentage tuned for generous, intentional whitespace between
    bars rather than the cramped Chart.js default, giving the chart visual breathing
    room
  - Realistic, neutral, business-appropriate dataset (public cloud market share by
    provider/quarter) with proportions that plausibly track real-world cloud infrastructure
    market shares
  - 'Clean, idiomatic Chart.js usage: stacked scales configured correctly, tooltip
    callback formats percentages, deterministic in-memory data, animation disabled
    per harness contract'
  weaknesses:
  - Design Excellence is only 'well-configured default' territory — the spec explicitly
    suggests 'consider adding percentage labels within segments when space permits';
    adding value labels to the larger segments (e.g. AWS, Azure) would meaningfully
    raise both DE-01 (polish) and DE-03 (storytelling) without touching the data model
  - No visual hierarchy or emphasis beyond color — the chart displays the data but
    doesn't guide the viewer to an insight (e.g. AWS's persistent lead, Alibaba's
    shrinking share); a subtle annotation, callout, or emphasized stroke on one series
    would elevate DE-03 storytelling
  - LM-02 (distinctive features) is generic — categoryPercentage/barPercentage bar-gap
    tuning exists in most bar-chart libraries under different names; leaning on a
    more Chart.js-specific capability (e.g. borderRadius on bar segments, or a customized
    tooltip title callback showing the quarter's total) would better showcase library
    mastery
  - 'Bar segments use borderWidth: 0 — a subtle 1px edge in the surface color between
    stacked segments (per the style guide''s ''Bar edges'' guidance) would add a touch
    more definition and refinement, though the current color contrast is already sufficient
    for legibility'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "bar-stacked-percent · javascript · chartjs · anyplot.ai" in dark ink, centered top, fully legible. X-axis title "Quarter" and Y-axis title "Share of Cloud Infrastructure Revenue" both in dark ink, clearly readable. Tick labels (0%-100% in 20% steps on Y, six quarter labels Q1 2023-Q2 2024 on X) are soft dark gray and legible. Legend sits below the plot with five swatches (AWS, Azure, Google Cloud, Alibaba Cloud, Other), all readable against the light background. Subtle horizontal gridlines only (no vertical gridlines), matching the style guide's "Y-axis grid only for bar charts" rule.
      Data: Six stacked bars, each normalized to 100%. Bottom-to-top segment order is consistent across all bars: AWS (brand green #009E73), Azure (lavender), Google Cloud (blue), Alibaba Cloud (ochre), Other (dark muted gray). AWS is confirmed as the first/bottom series in the mandated brand green.
      Legibility verdict: PASS — no light-on-light or illegible text anywhere.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Title, both axis titles, and all tick labels render in light ink/off-white and are clearly legible against the dark background. Legend text is white and fully readable. Gridlines are still present but subtle (light, low-opacity horizontal lines only).
      Data: Segment colors are pixel-identical to the light render for AWS (green), Azure (lavender), Google Cloud (blue), and Alibaba Cloud (ochre) — confirming the categorical data colors do not shift between themes. The "Other" segment correctly flips from dark muted gray (light theme) to light muted gray (dark theme), which is expected and compliant since "muted" is one of the three theme-adaptive semantic anchors (not a fixed categorical color).
      Legibility verdict: PASS — no dark-on-dark failures observed; every text element is clearly readable against the near-black surface.

    Both renders viewed and compared directly. Canvas dimensions confirmed at exactly 3200x1800 for plot-light.png (landscape target, no drift) — the canvas dimension gate file was absent, confirming the automated pre-check passed.
