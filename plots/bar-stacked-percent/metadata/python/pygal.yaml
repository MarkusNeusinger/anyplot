review:
  strengths:
  - 'Correct 100% stacked bar implementation: raw Likert response counts are normalized
    to percentages per topic (summing to 100%) with chart.range fixed to (0, 100),
    matching the spec''s core requirement.'
  - 'Well-reasoned semantic-exception color ordering for the Likert scale (green ->
    lime -> muted gray -> amber -> red), documented directly in a code comment, with
    #009E73 correctly anchored to the first series (''Strongly Agree'').'
  - 'Strong data storytelling: topics are sorted descending by favorable response
    share (Agree + Strongly Agree), turning the chart into a ranked narrative from
    the organization''s strongest area to its weakest.'
  - 'Distinctive pygal features used well: print_values with a custom value_formatter
    ("{x:.0f}%"), legend_at_bottom, x_label_rotation, and truncate_label combine for
    a clean, information-dense read.'
  - Theme tokens (PAGE_BG, INK, INK_MUTED) are threaded consistently through the Style
    object so light/dark chrome flips correctly while data colors stay identical between
    renders.
  - Clean, deterministic, KISS-structured script with no unused imports and no fake
    interactivity.
  weaknesses:
  - 'Value labels overflow their segment bands on thin slices: the ''Strongly Disagree''
    band in the first four bars (2%, 4%, 5%, 6%) and similarly thin ''Neutral''/''Disagree''
    bands are visually too short for value_font_size=36 text, so the printed percentage
    spills above/below the colored band into the adjacent whitespace or neighboring
    segment rather than sitting cleanly inside its own color. Fix: either shrink value_font_size,
    suppress print_values for segments below a small percentage threshold (e.g. <7%),
    or move small-segment labels outside the bar with a leader line.'
  - 'Visual refinement stays close to a solid-but-standard bar treatment: beyond the
    semantic color choice and sort order, there is no additional polish (e.g. a subtle
    max-value callout, alternating row shading, or refined legend swatch styling)
    that would push this into top-tier design territory.'
  - 'Library mastery is good but not maximal: pygal also supports secondary_range,
    tooltips-in-title customization, and per-value CSS classes that could further
    differentiate thin-vs-thick segment label rendering — none are used to address
    the overflow issue above.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "bar-stacked-percent · python · pygal · anyplot.ai" is centered at top in dark ink, fully visible and not clipped. X-axis title "Survey Topic" and y-axis title "Respondents (%)" are dark and readable. Y-axis tick labels (0%-100% in 10% steps) are dark and legible against the light background. X-axis category labels (Team Collaboration, Management Support, Communication, Recognition, Career Growth, Work-Life Balance, Job Security, Compensation) are rotated ~25° in dark ink, fully visible and not cut off at the canvas edges. Dashed horizontal y-guides are subtle gray, visible but not dominant. Legend sits below the x-axis title with five square swatches + labels (Strongly Agree, Agree, Neutral, Disagree, Strongly Disagree), all dark text, clearly readable.
      Data: Eight vertical 100%-stacked bars, one per survey topic, each divided into five colored segments (teal #009E73 "Strongly Agree" at the bottom, olive/lime "Agree", gray "Neutral", tan/khaki "Disagree", red "Strongly Disagree" at the top). Black percentage value labels are printed inside each segment; labels in adequately sized segments sit cleanly centered, but labels in the thinnest segments (e.g. the 2%, 4%, 5%, 6% "Strongly Disagree" bands on the first four bars) visually overflow the height of their own colored band into the whitespace/border above.
      Legibility verdict: PASS (all chrome text is readable; the segment-label overflow is a layout/overlap quality issue, not a legibility failure — text itself stays black-on-visible-background throughout).

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Title, axis titles, tick labels, x-axis category labels, and legend text all render in light/white ink and are clearly legible against the dark background — no dark-on-dark failures observed. Dashed y-guides remain subtly visible.
      Data: Same five segment colors as the light render (teal #009E73, olive/lime, gray, tan, red) in the same stacking order — confirmed identical to the light render; only chrome (background + text color) flips between themes. The brand green #009E73 "Strongly Agree" segment reads clearly on the dark surface. The same thin-segment value-label overflow observed in the light render (2%, 4%, 5%, 6% bands) is also present here, with black label text sitting mostly on its colored band but slightly spilling above it into the dark canvas background at the top of the bar — text remains fully readable, but this reinforces the segment-height/font-size mismatch found in the light render.
      Legibility verdict: PASS (all chrome and data-region text is readable in this theme; no dark-on-dark or light-on-light collisions found).
