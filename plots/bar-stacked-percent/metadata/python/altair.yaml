    Fuels/Nuclear/Renewables/Hydro bottom-to-top) now matches the legend''s top-to-bottom
    order exactly, and in-segment white percentage labels were added for every segment
    ≥10%.'
  - 'Idiomatic Altair/Vega-Lite grammar: stack="normalize" for the 100% stack, a layered
    mark_bar + mark_text composition with a precomputed segment-midpoint column for
    label centering, and alt.Order tied to an explicit SourceOrder rank so stack position
    is deterministic.'
  - Correct Imprint categorical palette in canonical order (Fossil Fuels=#009E73 brand
    green, Nuclear=#C475FD, Renewables=#4467A3, Hydro=#BD8233), identical hues in
    both light and dark renders — only chrome flips.
  - 'Both renders are fully theme-correct: backgrounds match #FAF8F1/#1A1A17 exactly,
    and title/axis/tick/legend/grid tokens are threaded through configure_view/configure_axis/configure_legend
    with no dark-on-dark or light-on-light failures.'
  - Realistic, neutral energy-mix dataset by country where every 4-value group sums
    exactly to 100 (verified for USA, China, Germany, Brazil, India).
  - 'Clean KISS script: no functions/classes, deterministic (no randomness), only
    used imports (altair, pandas, PIL for the mandatory canvas pad), and the canonical
    landscape canvas gate (3200×1800) passes.'
  weaknesses:
  - Legend still shows a visible box border (configure_legend strokeColor=INK_SOFT)
    — the style guide's Decoration Removal Checklist recommends dropping box frames
    around legends for a cleaner look; consider strokeColor=None or matching the plot
    background.
  - Composition is still a fairly standard 100%-stacked-bar layout — DE-01/DE-03 have
    room to go further with a stronger focal point (e.g. highlighting one country,
    or an annotation calling out the biggest hydro/fossil share) beyond the now-fixed
    ordering and percentage labels.
  - In-segment percentage label fontSize=9 is on the smaller side relative to the
    10pt tick labels; still legible at full resolution and the current 4.0 scale_factor
    renders it crisply, but it's worth keeping an eye on at the 400px mobile srcset.
