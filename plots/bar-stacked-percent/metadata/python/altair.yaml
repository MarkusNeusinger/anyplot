review:
  strengths:
  - Idiomatic use of Vega-Lite's stack="normalize" — the canonical, declarative Altair
    approach to a 100% stacked bar chart, plus a %-formatted y-axis.
  - Correct Imprint palette in canonical order (Fossil Fuels=#009E73 brand green,
    Nuclear=#C475FD, Renewables=#4467A3, Hydro=#BD8233); identical hues across light
    and dark renders.
  - 'Both renders are theme-correct: backgrounds match #FAF8F1/#1A1A17 exactly, chrome
    tokens (title/axis/tick/legend/grid) are threaded through configure_view/configure_axis/configure_legend
    with no dark-on-dark or light-on-light failures.'
  - 'Realistic, neutral energy-mix dataset per country where each group of 4 values
    sums exactly to 100 (verified: USA, China, Germany, Brazil, India all total 100).'
  - 'Clean KISS script: no functions/classes, deterministic (no randomness), only
    used imports (altair, pandas, PIL for the mandatory canvas pad), canvas padding
    block present and correctly triggers no-op since the render already lands within
    target.'
  - 'Restrained, refined chrome: white 1px bar-segment strokes for definition, spineless
    configure_view, subtle 15%-opacity gridlines.'
  weaknesses:
  - 'Title is missing the mandated language segment: it renders as "bar-stacked-percent
    · altair · anyplot.ai" but the required format is "{spec-id} · {language} · {library}
    · anyplot.ai" — fix to "bar-stacked-percent · python · altair · anyplot.ai" (SC-04).
    This also makes the title noticeably shorter than the ~67-char mandated string,
    so it undershoots the expected ~50-70% width proportion for no good reason.'
  - 'Stack segment order doesn''t match legend order: the legend lists Fossil Fuels,
    Nuclear, Renewables, Hydro top-to-bottom, but the bars stack bottom-to-top as
    Renewables, Nuclear, Hydro, Fossil Fuels — the two middle entries (Nuclear/Hydro)
    are swapped relative to the legend, making it harder to trace a legend swatch
    to its bar segment at a glance. Align alt.Order with the legend''s domain order
    (or reverse the legend) so stack position and legend position agree.'
  - No in-segment percentage labels even though most segments are wide enough (e.g.
    Germany's Renewables at 38%, Fossil Fuels blocks at 40-72%) — the spec's optional
    'consider adding percentage labels within segments when space permits' would strengthen
    data storytelling for the larger segments (mark_text with stack="normalize" ordering)
    while still omitting labels on the narrow Nuclear slivers.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white, not dark.
      Chrome: Bold black title "bar-stacked-percent · altair · anyplot.ai" centered at top; y-axis title "Share of Energy Mix (%)" with 0-100% ticks in 10% steps; x-axis title "Country" with 5 category ticks (Brazil, China, Germany, India, USA); light vertical gridlines separating bar groups; legend box top-right titled "Energy Source" with 4 swatches (Fossil Fuels, Nuclear, Renewables, Hydro) in a light-frame box. All chrome text renders in dark ink and is clearly legible against the cream background.
      Data: Five bars, each normalized to fill 0-100%, segmented bottom-to-top as Renewables (blue #4467A3), Nuclear (purple #C475FD), Hydro (ochre #BD8233), Fossil Fuels (green #009E73), each segment separated by a thin white stroke. Proportions vary sensibly by country (e.g. Brazil dominated by Hydro, Germany by Renewables+Fossil, India/China by Fossil Fuels).
      Legibility verdict: PASS — no light-on-light text, all labels and ticks readable.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black, not light.
      Chrome: Same title, axis titles, tick labels and legend layout, all rendered in light cream/gray ink (title bright white-cream, tick/legend text a softer light gray) against the dark surface. Gridlines are faint light lines at low opacity. Legend box uses a dark elevated fill (#242420-like) with light text and border, clearly separated from the plot background.
      Data: Identical four data colors and identical bar segment proportions/order as the light render (Renewables blue, Nuclear purple, Hydro ochre, Fossil Fuels green) — confirms Imprint categorical hues are held constant across themes; only chrome flipped.
      Legibility verdict: PASS — no dark-on-dark text; all title/axis/tick/legend text is clearly visible against the near-black background.
