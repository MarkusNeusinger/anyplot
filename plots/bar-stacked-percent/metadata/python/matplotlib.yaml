review:
  strengths:
  - Text sizes explicitly set at every level (title 12pt, axis labels 10pt, ticks
    8pt, in-bar percentage labels 9pt bold) and remain well-proportioned with no overflow
    or overlap in either theme
  - Thoughtful use of theme-adaptive PAGE_BG-colored bar-segment borders to visually
    separate adjacent stack segments, which also neutralizes any low-contrast color-pair
    concerns (VQ-04)
  - 'Correct Imprint palette in canonical order with first series #009E73, and a sensible
    semantic read for later slots (ochre for coal, matte-red for the residual ''Other''
    bucket)'
  - In-segment percentage labels (suppressed below an 8% threshold to avoid clutter)
    add real data storytelling value beyond a bare stacked bar
  - 'Data deliberately includes a realistic edge case: Italy and Poland both have
    0% nuclear share, exercising the zero-segment rendering path'
  - Clean KISS structure, deterministic hardcoded data (no seed needed), and correct
    plot-{THEME}.png output naming
  weaknesses:
  - 'Title omits the required language token: code renders "bar-stacked-percent ·
    matplotlib · anyplot.ai" but the mandated format is "{spec-id} · {language} ·
    {library} · anyplot.ai" — fix to "bar-stacked-percent · python · matplotlib ·
    anyplot.ai".'
  - Percentage labels are placed manually with a per-segment ax.text() loop and a
    hand-rolled 8% visibility threshold; matplotlib's native ax.bar_label() (available
    since 3.4) is the more idiomatic high-level API for this exact stacked-bar-labeling
    use case and would reduce custom logic.
  - 'Design Excellence is solid but not exceptional: the plot reads as a well-executed
    but fairly conventional stacked bar — no explicit visual emphasis (e.g. highlighting
    Poland''s 68% coal dependency or France''s 66% nuclear share) beyond what the
    raw labels already convey; consider a subtle callout or color/weight emphasis
    on the most notable data point to sharpen the storytelling.'
  - Germany's nuclear share (13%) reflects an earlier point in time — Germany completed
    its nuclear phase-out in April 2023, so a current-year dataset would show ~0%
    nuclear for Germany; either date the data explicitly or update the value for factual
    consistency with the other rows.
