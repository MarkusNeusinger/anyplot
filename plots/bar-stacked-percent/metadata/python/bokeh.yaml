review:
  strengths:
  - Distinctive flow-ribbon technique (low-alpha bokeh patches spanning the gaps between
    bars) turns the 100% stacked bar into a continuity visualization, immediately
    surfacing quarter-over-quarter share trends without any extra annotation text
  - Theme-adaptive per-segment label coloring (white text on the brand-green Apple
    segment, INK-token text on the lighter segments) keeps every percentage label
    legible in both light and dark renders
  - 'Correct canonical Imprint palette order (#009E73, #C475FD, #4467A3, #BD8233)
    with identical data colors and theme-correct chrome across both renders'
  - Legend relocated to a dedicated right-hand column via add_layout, avoiding collision
    with the rightmost Q1 2025 bar that an in-frame top_right legend would have caused
  - Realistic, seasonally-plausible smartphone market-share data — Apple's share peaks
    in Q4 2024, consistent with real-world holiday iPhone sales cycles
  weaknesses:
  - Title omits the required 'python' language token — reads 'bar-stacked-percent
    · bokeh · anyplot.ai' instead of 'bar-stacked-percent · python · bokeh · anyplot.ai'
  - Legend retains a visible border box (p.legend.border_line_color set) — the style
    guide's decoration-removal checklist calls for removing box frames around legends
  - Y-axis grid alpha (0.10) sits slightly below the style guide's recommended 15-25%
    subtle-grid range; not a legibility problem but worth nudging up for consistency
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Bold dark title "bar-stacked-percent · bokeh · anyplot.ai" top-left, italic dark axis labels ("Quarter", "Market Share (%)"), dark-gray tick labels on both axes, subtle near-invisible y-axis gridlines. All fully visible, nothing clipped at any canvas edge.
      Data: Five quarterly bars (Q1 2024 - Q1 2025), each stacked to 100% with four segments — Apple (brand green #009E73, bottom), Samsung (lavender #C475FD), Xiaomi (blue #4467A3), Others (ochre #BD8233, top) — matching Imprint canonical order 1-4. White percentage labels on the green segment, dark labels on the lighter segments. Faint low-alpha "flow ribbons" bridge each component's segment boundary across the gaps between adjacent bars, visually tracing the share trend over time. Legend sits in a dedicated column to the right of the plot, clear of all bars.
      Legibility verdict: PASS — every title, axis, tick, legend, and data-label element reads clearly against the light surface.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Title and axis labels render in light off-white ink, tick labels in a lighter soft gray, gridlines are barely visible dark-on-dark just as intended (subtle, not absent). No dark-on-dark text failures — everything that was dark text in the light render correctly flipped to light text here.
      Data: Identical data colors to the light render — Apple green, Samsung lavender, Xiaomi blue, Others ochre are pixel-identical hues. Percentage labels use the same per-segment white/INK logic, and since INK flips to a light tone in dark mode, the previously dark labels (Samsung/Xiaomi/Others) are now light-colored and still legible against their mid-tone fills, exactly like the always-white Apple label.
      Legibility verdict: PASS — no dark-on-dark or light-on-light failures in either render; only the chrome tokens flipped, all data colors held constant.
