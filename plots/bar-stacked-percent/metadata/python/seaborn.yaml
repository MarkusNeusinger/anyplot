review:
  strengths:
  - Correct percent-stacking via seaborn's objects interface (so.Plot/so.Bar/so.Stack)
    with data properly normalized to sum to exactly 100% per year
  - Segment percentage labels use luminance-derived text color per Imprint hue, keeping
    contrast solid against every segment color in both themes
  - Data-driven footnote narrates a real compositional insight (Engineering + R&D
    share rising from 48% to 70%) instead of a generic caption — genuine data storytelling
  - 'Full Imprint palette compliance: first series is #009E73, canonical color order
    preserved, and chrome (background/text/grid) flips correctly between #FAF8F1 light
    and #1A1A17 dark while data colors stay identical'
  - Custom legend built with Patch handles in left-to-right order that mirrors the
    bottom-to-top stack order, making the chart easy to scan
  - Idiomatic modern seaborn usage — the objects interface's so.Stack() transform
    is the correct high-level API for this chart type rather than a manual matplotlib
    stack
  weaknesses:
  - Aesthetic sophistication is already strong but stops at labels + footnote; a subtle
    additional touch (e.g. a thin connector marking one department's trend, or a highlighted
    focal year) could push Design Excellence further — not required for approval
  - Bar width (0.65) leaves fairly wide gaps between the 6 yearly bars; a slightly
    wider bar (~0.72-0.75) would tighten the layout marginally without crowding
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white, not dark.
      Chrome: Title "bar-stacked-percent · python · seaborn · anyplot.ai" centered at top in dark ink, clearly legible; "Fiscal Year" x-axis label and "Budget Share (%)" y-axis label both dark and readable; tick labels (2019-2024, 0-100) in soft dark gray, legible; frameless legend above the plot area (Engineering/Marketing/Operations/R&D swatches) fully readable.
      Data: 6 fully-stacked bars (one per fiscal year 2019-2024), each summing to 100%. Bottom-to-top segment order is Engineering (#009E73 green), Marketing (#C475FD purple), Operations (#4467A3 blue), R&D (#BD8233 amber) — matches canonical Imprint order with green first. Each segment has a bold percentage label whose color (dark or light) is chosen per-segment for contrast, and all labels are clearly readable. Italic footnote beneath the x-axis is fully visible and legible.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black, not light.
      Chrome: Same title now rendered in light ink, clearly visible against the dark background; axis labels and tick labels are light/soft-light and legible; legend swatches and text fully readable; footnote text (light gray italic) legible at the bottom.
      Data: Segment colors are pixel-identical to the light render (#009E73, #C475FD, #4467A3, #BD8233) — only chrome flipped, as required. Percentage labels retain the same per-segment adaptive text color as the light render (since that choice is based on the fixed data color's luminance, not the page theme), and every label remains clearly readable against its segment — no dark-on-dark or light-on-light failures found anywhere in the chart.
      Legibility verdict: PASS
