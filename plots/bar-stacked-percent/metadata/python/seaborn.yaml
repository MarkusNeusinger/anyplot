review:
  strengths:
  - Correct percent-stacking via seaborn's objects interface (so.Plot + so.Bar + so.Stack())
    — idiomatic use of the modern seaborn API rather than manually normalizing and
    hstacking
  - Imprint palette applied in canonical order with the mandated brand green first
    (Engineering=#009E73, Marketing=#C475FD, Operations=#4467A3, R&D=#BD8233), identical
    across both themes
  - Per-segment percentage labels pick black-vs-white text by computing the luminance
    of each segment's own fixed hex, so contrast holds correctly on both the light
    and dark backgrounds
  - Thin PAGE_BG-colored edges between stacked segments (edgewidth=1.5) give clean
    visual separation without adding a competing color
  - All font sizes explicitly set (title 12pt, axis labels 10pt, ticks 8pt, legend
    8pt, data labels 11pt bold) and canvas lands exactly on 3200x1800
  - Custom legend order (Patch handles built manually) mirrors the bottom-to-top stacking
    order for easy visual tracing
  - Realistic, neutral business scenario (departmental budget allocation, 2019-2024)
    with genuine variation — Engineering/R&D share rising while Marketing/Operations
    share falls
  weaknesses:
  - Legend uses a boxed frame (frameon=True, facecolor/edgecolor set) — the style
    guide's Decoration Removal Checklist recommends removing box frames around legends
    for a cleaner look; consider frameon=False or a borderless legend to lift Visual
    Refinement
  - No visual hierarchy or emphasis calls out the underlying story (e.g., Engineering+R&D
    share rising from 47% to 71% of budget while Marketing+Operations falls) — data
    is displayed but not interpreted; a subtle annotation or emphasized trend line
    for one department would push Data Storytelling further
  - np.random.seed(42) is set but never used — all values are hardcoded, so the seed
    call is dead code; harmless but slightly untidy
