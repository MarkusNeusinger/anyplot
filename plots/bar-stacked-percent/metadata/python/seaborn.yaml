      Data: Six bars (2019-2024), each stacked to 100%. Bottom-to-top: Engineering (brand green #009E73), Marketing (lavender #C475FD), Operations (blue #4467A3), R&D (ochre #BD8233). Each segment carries a bold percentage label whose color (white or near-black) is chosen per-segment for contrast, and all labels are readable.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17), correctly not pure black.
      Chrome: Title, axis labels, and tick labels flip to light ink/off-white and remain fully legible against the dark background. Legend box uses the dark elevated surface with light text and light swatches border — no dark-on-dark or light-on-light failures observed. Grid lines are faint and visible without dominating.
      Data: Same four segment colors as the light render (Engineering green, Marketing lavender, Operations blue, R&D ochre) — confirmed identical across themes, only the chrome (background, text, legend box) flips. Percentage labels retain the same per-segment black/white choice as the light render (colors are fixed to segment hue, not page theme), and all remain legible.
