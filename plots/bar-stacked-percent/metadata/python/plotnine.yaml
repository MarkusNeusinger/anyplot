review:
  strengths:
  - Correct idiomatic 100% stacked bar via geom_bar(stat='identity', position=position_fill())
    with mizani's percent_format() on the y-axis
  - 'Thoughtful semantic color mapping: Apple/Samsung/Xiaomi get canonical Imprint
    positions 1-3 (brand green always first), while ''Others'' correctly uses the
    theme-adaptive `muted` semantic anchor instead of a 4th arbitrary categorical
    color, matching the anchor''s defined ''other/rest'' role'
  - Both renders are clean with no clipping, no overlap, and consistent component
    ordering across all six quarters for easy visual tracking
  - 'Clean, reproducible, minimal code: no randomness, no unused imports, correct
    3200x1800 landscape canvas via figure_size=(8, 4.5) at dpi=400'
  weaknesses:
  - No visual hierarchy or data storytelling beyond the base composition view (DE-03)
    — no annotation or highlighted trend, and the spec's Notes explicitly suggest
    percentage labels within segments 'when space permits'; the Apple/Samsung/Xiaomi
    bands are each roughly 20% tall, which is enough room for a geom_text label layer
  - Beyond the required position_fill mechanism, no additional distinctive plotnine
    feature is showcased (LM-02) — e.g. no guide/legend reordering, no coord_flip
    consideration, no direct segment labeling
  - Aesthetic polish is solid but fairly restrained beyond the palette choice (DE-01/DE-02)
    — no additional refinement flourishes (e.g. subtle bar edge stroke, custom legend
    key styling) beyond the standard theme_minimal + token overrides
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1), correctly not pure white and not dark.
      Chrome: Title "bar-stacked-percent · python · plotnine · anyplot.ai" in dark ink, centered, ~60% of plot width. Axis titles "Quarter" (x) and "Market Share" (y) in dark ink, tick labels ("Q1 2023"..."Q2 2024", "0%"-"100%") in softer dark gray. Subtle horizontal gridlines at low alpha. Legend box top-right with bordered fill, title "Company", 4 entries (Others, Xiaomi, Samsung, Apple).
      Data: Six bars, each stacked bottom-to-top as Apple (brand green #009E73) / Samsung (lavender #C475FD) / Xiaomi (blue #4467A3) / Others (dark taupe-gray muted anchor). All bars sum to 100%, consistent ordering across quarters.
      Legibility verdict: PASS — all text is clearly readable against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17), correctly not pure black and not light.
      Chrome: Title and axis titles in light off-white ink, tick labels in a softer light gray. Gridlines subtle and visible. Legend box uses the elevated dark fill with a light border, same 4 entries.
      Data: Same stacking order and same green/lavender/blue hues as the light render — Apple/Samsung/Xiaomi colors are pixel-identical to the light render, confirming positions 1-3 of the Imprint palette are theme-independent. "Others" appropriately switches to the lighter warm-gray `muted` anchor value (by design — the muted/neutral semantic anchors are explicitly theme-adaptive per the style guide, unlike the 8 categorical positions).
      Legibility verdict: PASS — no dark-on-dark text; all title, axis, and tick text is clearly visible against the dark background. Brand green reads well on the dark surface.
