review:
  strengths:
  - In-segment percentage labels now correctly match their own bar segment in every
    quarter, both themes -- verified via zoomed crops of Q1 2023 and Q1/Q2 2024 --
    fully resolving the attempt-2 misalignment bug via the precomputed LabelY/StackRank
    approach.
  - WCAG-contrast-aware in-segment label coloring (_relative_luminance/_contrast_ratio/_label_color)
    driven through scale_color_identity() is a genuinely sophisticated, distinctive
    plotnine touch.
  - 'Imprint palette used correctly: Apple (first categorical series) = #009E73; Samsung/Xiaomi
    take canonical positions 2-3; "Others" correctly uses the theme-adaptive muted
    semantic anchor rather than a 4th arbitrary categorical color.'
  - Theme-adaptive chrome correctly threaded through both renders -- correct backgrounds,
    fully legible text, subtle y-only gridlines, no dark-on-dark or light-on-light
    failures.
  - Clean, realistic, neutral smartphone-market-share data with genuine quarter-over-quarter
    variation (Apple gently declining, Xiaomi growing) that gives DQ-01/DQ-03 real
    substance; canvas is correct (3200x1800), title format matches the mandated pattern,
    legend order mirrors the visual stacking order.
  weaknesses:
  - Design Excellence beyond the palette/label choices is fairly restrained -- no
    additional refinement flourish (e.g. subtle bar-edge stroke, custom legend key
    styling) beyond theme_minimal() + token overrides.
  - LM-01 idiomatic usage is solid but not exhaustive -- e.g. no guides()-based legend
    reordering or other plotnine-specific flourish beyond the required position_fill()
    mechanism and the label-color trick.
  - Y-axis title "Market Share" has no explicit unit suffix (e.g. "Market Share (%)")
    -- the percent-formatted tick labels make the unit self-evident, but an explicit
    unit would be marginally clearer.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 -- not pure white.
      Chrome: Title "bar-stacked-percent · python · plotnine · anyplot.ai", axis titles ("Quarter", "Market Share"), tick labels, and the bordered "Company" legend (top-right) all render in dark ink and are clearly legible against the light background.
      Data: Six 100%-stacked bars (Q1 2023-Q2 2024), each summing to 100%, stacked bottom-to-top as Apple (#009E73 brand green) / Samsung (lavender) / Xiaomi (blue) / Others (muted dark taupe-gray). In-segment percentage labels are correctly positioned: verified Q1 2023 shows Apple 23%, Samsung 22%, Xiaomi 12%, Others 43% (sums to 100, matches source data exactly), each label centered in its own correctly-colored segment with dark-ink text on the lighter purple/blue segments and light-ink text on the darker gray "Others" segment.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 -- not pure black.
      Chrome: Title, axis titles, tick labels, and legend flip to light off-white / soft light-gray ink and remain fully legible -- no dark-on-dark failures anywhere.
      Data: Apple/Samsung/Xiaomi fill colors are pixel-identical to the light render (Imprint categorical positions held constant across themes, as required). "Others" correctly switches to the lighter warm-gray value of the theme-adaptive muted anchor. Verified Q1 2024 shows Apple 21%, Samsung 20%, Xiaomi 15%, Others 44% (sums to 100, matches source data), and Q2 2024 shows Apple 20%, Samsung 19%, Xiaomi 16%, Others 45% -- one correctly-valued label per segment, zero doubling/blank segments (the exact defect that caused the attempt-2 rejection is gone).
