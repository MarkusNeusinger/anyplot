review:
  strengths:
  - Correct 100% stacked bar structure via geom_bar(stat="identity", position=position_fill());
    every bar sums to 100% as required.
  - WCAG-contrast-aware in-segment label coloring (_relative_luminance/_contrast_ratio/_label_color)
    is a genuinely sophisticated touch, picking whichever ink extreme has higher contrast
    against each segment's own fill.
  - 'Imprint palette used correctly: Apple (first categorical series) is bound to
    #009E73; "Others" uses the muted semantic-anchor gray with a documented rationale
    (aggregate rest-of-market bucket, not a distinct company).'
  - 'Theme-adaptive chrome correctly threaded through both renders: light background
    #FAF8F1 and dark background #1A1A17 both read correctly, axis/tick/legend text
    is legible against each background, y-only gridlines are subtle.'
  - Canvas size correct (3200x1800 landscape, matches figure_size=(8,4.5) target),
    title format matches the mandated `bar-stacked-percent · python · plotnine · anyplot.ai`
    pattern, legend order (Others/Xiaomi/Samsung/Apple top-to-bottom) mirrors the
    visual stacking order.
  weaknesses:
  - 'CRITICAL: In-segment percentage labels (geom_text + position_fill(vjust=0.5))
    are not reliably aligned with their own bar segment. Verified by cropping and
    zooming into individual bars in both renders across Q1/Q3/Q4 2023. In the LIGHT
    render, several bars show TWO labels crammed into one colored segment while the
    adjacent segment has none at all -- e.g. Q1 2023''s gray "Others" segment shows
    both "22%" and "23%" (Samsung''s and Apple''s real values) while the blue "Xiaomi"
    segment is completely unlabeled; Q3 2023''s gray segment shows "20%" twice; Q4
    2023''s gray segment shows "19%" and "22%" together. In the DARK render every
    segment gets exactly one label, but the bottom three segments (Apple/Samsung/Xiaomi)
    are cyclically shifted by one position relative to their true value -- e.g. Q4
    2023 dark: green "Apple" segment shows "14%" (Xiaomi''s real value, Apple''s real
    value is 22%), purple "Samsung" segment shows "22%" (Apple''s real value), blue
    "Xiaomi" segment shows "19%" (Samsung''s real value); only the top "Others" segment
    shows its own correct value. This is systemic (every bar, both themes) and actively
    misrepresents the data to the viewer.'
  - 'Likely root cause: geom_bar''s and geom_text''s independent position_fill() computations
    are producing different per-group cumulative offsets because the dataframe rows
    are grouped by company (all-Apple rows, then all-Samsung, then all-Xiaomi, then
    all-Others) rather than interleaved/sorted to match the stacking order used for
    the bars. Fix by forcing both layers onto identical offsets -- e.g. precompute
    the cumulative fill midpoint per (Quarter, Company) as an explicit numeric `y`
    column (matching the same fill/stack order geom_bar uses) and pass it directly
    to geom_text(aes(y=label_y), position=''identity'') instead of relying on geom_text''s
    own position_fill. Verify by re-cropping every bar in both themes and confirming
    exactly one label lands centered in its own correctly colored segment before resubmitting.'
  - Because labels show numbers under the wrong segment, the chart currently gives
    an incorrect visual takeaway (e.g. a viewer reading '14%' from the green Apple
    segment when Apple's real Q4 2023 share is 22%) -- this undermines the data storytelling
    and the 'percentage labels within segments' feature the spec suggests, even though
    the feature is coded, it does not function correctly on-canvas.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (~#FAF8F1), correct light theme surface.
      Chrome: Title "bar-stacked-percent · python · plotnine · anyplot.ai" is dark, centered, fully legible. Axis titles "Quarter"/"Market Share" and tick labels are dark/soft-dark and clearly legible. Legend box ("Company": Others/Xiaomi/Samsung/Apple) is clearly readable with a bordered background. Y-axis-only gridlines are subtle.
      Data: 6 quarterly 100%-stacked bars (Q1 2023 - Q2 2024), 4 components each (Apple green #009E73, Samsung purple, Xiaomi blue, Others muted gray), each bar sums to 100%. BUG: in-segment percentage labels are misplaced -- on multiple bars (Q1, Q3, Q4 2023 confirmed via zoomed crops) two labels land inside a single segment (e.g. Q1's gray "Others" segment shows both "22%" and "23%") while an adjacent segment (blue "Xiaomi") has no label at all. Label text itself is legible/readable (good contrast against each fill), but the values are attached to the wrong segment.
      Legibility verdict: PASS for chrome text; FAIL for data-label correctness/placement (see weaknesses).

    Dark render (plot-dark.png):
      Background: Warm near-black (~#1A1A17), correct dark theme surface.
      Chrome: Title, axis titles, and tick labels render in light ink, clearly legible against the dark background -- no dark-on-dark failures observed. Legend box uses an elevated dark background with light text, fully readable.
      Data: Same 6 quarters/4 components; data fill colors are identical to the light render (Apple #009E73 green, Samsung purple, Xiaomi blue, Others muted gray) -- confirms the Imprint palette is theme-invariant as required. BUG: every segment gets exactly one label (no doubling/blanks like the light render), but zoomed crops of Q1/Q3/Q4 2023 show the bottom three segments (Apple/Samsung/Xiaomi) are cyclically shifted by one position relative to their true share value -- e.g. Q4 2023: green "Apple" shows "14%" (actually Xiaomi's value; Apple's real share is 22%). Only the top "Others" segment consistently shows its own correct value.
      Legibility verdict: PASS for chrome text (no dark-on-dark); FAIL for data-label correctness/placement (see weaknesses).
