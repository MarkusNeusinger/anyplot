review:
  strengths:
  - 'Both attempt-1 weaknesses were cleanly fixed: percentages are now computed from
    raw per-region shipment counts (raw_shipments -> v / sum(values) * 100), and the
    legend''s bordered box frame is gone (borderwidth=0)'
  - Adaptive contrast_text_color() helper picks white or ink label text based on segment-background
    luminance, keeping inside-bar percentage labels legible on green/lavender/muted
    fills in both themes
  - Percentage labels are suppressed below a 6% threshold, avoiding cramped or overlapping
    text in the thin 'Other' segment
  - Categories are sorted ascending by iOS share and paired with a descriptive, factually-accurate
    subtitle, giving the chart a clear left-to-right narrative
  - '''Other'' correctly uses the theme-adaptive Imprint muted anchor as a semantic
    remainder bucket instead of consuming another ordinal palette slot'
  - Theme-adaptive chrome (backgrounds, gridlines, ink tokens, font sizes) matches
    the style guide's Visual Sizing Defaults and Theme-adaptive Chrome tables exactly
  weaknesses:
  - Distinctive plotly-specific features remain modest (mostly go.Bar + barmode='stack'
    + hovertemplate); could lean further into library-unique capabilities (e.g., pattern
    fills, custom shapes, animation frames) for extra Library Mastery credit
  - Overall composition is still a fairly conventional 100%-stacked-bar layout; further
    visual-hierarchy or emphasis techniques (e.g., highlighting one region) could
    push Design Excellence higher
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1), not pure white — matches the spec.
      Chrome: Title "bar-stacked-percent · python · plotly · anyplot.ai" in dark ink, centered, with a lighter-gray narrative subtitle below it. X-axis "Region" and Y-axis "Market Share (%)" labels are dark and clearly readable; tick labels (0-100% by 20%, region names) are medium-gray and legible. A subtle horizontal gridline sits at each 20% tick. Legend is a horizontal strip below the x-axis title with swatches for Other (gray), Android (lavender), iOS (green) — now without a bordered box frame (borderwidth=0), fixing the attempt-1 weakness.
      Data: Five bars (Africa, Asia, South America, Europe, North America), each stacked to 100%: green iOS segment at bottom (8-25%), lavender Android segment in the middle (72-88%), thin gray "Other" segment on top (2-4%). First series iOS is Imprint brand green #009E73; Android uses Imprint slot 2 (lavender); "Other" uses the muted semantic anchor. Percentage labels are printed inside the iOS and Android segments in high-contrast text; the Other segment (below the 6% label threshold) has no label, avoiding clutter. Percentages are now computed from raw per-region shipment counts rather than hardcoded, fixing the other attempt-1 weakness.
      Legibility verdict: PASS — all title, axis, tick, and legend text reads clearly against the light surface; no light-on-light text found.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17), not pure black — matches the spec.
      Chrome: Same title and subtitle now rendered in off-white / light-gray ink against the dark surface. Axis titles are light and axis tick labels are a lighter gray, both clearly visible. Gridlines are faint light lines at 15% opacity. Legend is border-free here too, swatches and text legible against the dark surface.
      Data: Colors are identical to the light render — iOS is the same brand green #009E73, Android the same lavender, confirming only chrome (not data hues) flips between themes. The muted "Other" swatch itself is intentionally theme-adaptive per the style guide's semantic-anchor rule (it's not one of the 8 fixed categorical positions), so its slightly different tone between renders is expected, not a defect.
      Legibility verdict: PASS — no dark-on-dark failures observed; all text (title, subtitle, axis labels, tick labels, legend, in-bar percentage labels) remains clearly readable against the near-black surface.
