review:
  strengths:
  - Idiomatic lets-plot 100% stacked bar via geom_bar(stat="identity", position="fill")
    with categorical factor levels ordered consistently across all six bars
  - Per-segment label ink chosen with scale_color_identity for verified WCAG-AA contrast
    against every Imprint fill color, correct in both light and dark renders
  - Countries sorted by descending renewable share, creating a clear visual narrative
    gradient from Spain (most renewable) to Poland (most coal-dependent)
  - Data values are realistic and roughly track real-world European energy-mix figures
    (France's high nuclear share, Poland's high coal share, Spain's high renewables
    share)
  - Theme-adaptive chrome correctly threaded through both renders — identical data
    colors, only background/text/grid flip between light and dark
  - Small slivers (<5%) have labels suppressed to avoid clutter, keeping every visible
    label readable
  weaknesses:
  - 'Semantic color mismatch: the Imprint scale is applied in canonical order (Coal=#009E73
    brand green, Renewables=#BD8233 ochre), which inverts the near-universal reader
    expectation that green = renewable/clean energy and ochre/brown = fossil fuel.
    Per the style guide''s semantic-exception rule, reassign the fill mapping so Renewables
    gets #009E73 and Coal gets a non-green Imprint hue.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Bold dark title "bar-stacked-percent · python · letsplot · anyplot.ai" at top-left, spans ~65% of plot width. Y-axis title "Share of Energy Mix" and x-axis title "Country" in dark ink. Tick labels (0%-100% on y, six country names on x) in softer dark-gray ink. Legend titled "Energy Source" sits to the right with 5 color swatches (Coal, Natural Gas, Nuclear, Renewables, Other) on an elevated off-white box. Subtle horizontal gridlines only.
      Data: Six vertical bars (Spain, Germany, Italy, UK, France, Poland), each stacked to 100% with five colored segments (green, lavender, blue, ochre, red in canonical Imprint order). In-segment "%" labels appear on segments ≥5%, in either black or white ink chosen per-segment for contrast; slivers <5% (e.g. 0% Nuclear in Italy/Poland, 3% Coal in Spain) are unlabeled. First categorical series (Coal) uses #009E73.
      Legibility verdict: PASS — all title, axis, tick, legend, and in-segment text is clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title, axis titles, and tick labels now rendered in light/off-white ink, fully legible against the dark surface. Legend box uses the elevated dark surface (#242420) with light text. Gridlines remain subtle.
      Data: Identical five-segment stacked bars with the same five Imprint hues (green, lavender, blue, ochre, red) as the light render — confirmed colors did not shift between themes. In-segment percentage labels retain the same fixed per-color ink (black on green/lavender/ochre, white on blue/red), which is correct because those labels sit on data segments whose fill does not change with theme.
      Legibility verdict: PASS — no dark-on-dark failures; every title, axis, tick, legend, and in-segment label is clearly visible against the dark background.
