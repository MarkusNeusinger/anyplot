review:
  strengths:
  - Correct 100% stacked bar implementation via geom_bar(stat="identity", position="fill")
    with scale_y_continuous(format=".0%") — the canonical lets-plot idiom for this
    plot type
  - Categories ordered by descending renewable share (Spain to Poland), giving the
    chart an intentional narrative reading left-to-right instead of arbitrary/alphabetical
    ordering
  - Data is fully deterministic (hardcoded, no randomness) and each country's five
    components sum to exactly 100, with values that plausibly match real-world energy
    mixes (e.g. France ~68% nuclear, Poland ~68% coal)
  - Explicit theme-adaptive tokens (PAGE_BG/INK/INK_SOFT/GRID_COLOR) correctly threaded
    through plot_background, panel_background, axis_text, axis_title, legend colors
    for both renders
  - Y-axis-only grid (panel_grid_major_x = element_blank()) matches the style guide's
    bar-chart grid guidance
  - Canvas exported at exactly 3200x1800 via ggsize(800, 450) + scale=4, matching
    the landscape target
  - Title format matches the mandated `bar-stacked-percent · python · letsplot · anyplot.ai`
    pattern exactly, and legend labels match the source data values
  weaknesses:
  - A full rectangular panel border (top, right, left, bottom lines) frames the chart
    area in both renders — the style guide's default is to remove top/right spines
    (L-shaped frame) or all spines for a cleaner minimalist look; this reads as an
    un-refined theme_minimal() default rather than an intentional choice.
  - The legend has a visible box border (legend_background=element_rect(..., color=INK_SOFT))
    — the Decoration Removal Checklist recommends removing box frames around legends;
    a borderless or very subtle background would look more polished.
  - 'Design Excellence is only moderate: beyond the nice renewable-share ordering,
    there''s no additional visual hierarchy or emphasis (e.g. no callout on the leading/trailing
    country, no bolder treatment of a focal segment) to push the storytelling further.'
  - 'Library Mastery is generic: position="fill" + scale_fill_manual + labs is the
    same recipe any grammar-of-graphics library (ggplot2, plotnine) would use — nothing
    here is distinctive to lets-plot specifically (e.g. no tooltip customization via
    `tooltips=`, no `geom_text` percentage labels within segments as the spec suggests
    considering, no `as_discrete`/`arrange` idioms unique to the library).'
  - Spec's optional suggestion to add percentage labels within segments ("when space
    permits") was not attempted — segments are wide enough here that labels would
    likely fit and would strengthen readability/data quality further.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Bold dark title "bar-stacked-percent · python · letsplot · anyplot.ai" at top-left, ~78% of canvas width, fully visible with no clipping. X-axis title "Country" and Y-axis title "Share of Energy Mix" in dark ink, tick labels ("0%"-"100%", country names) in a lighter soft-gray tone. A thin horizontal grid line runs behind each 10% tick; no vertical gridlines. A full rectangular border frames the plot panel (all four sides visible). Legend "Energy Source" sits to the right inside a bordered off-white box with 5 swatches (Coal, Natural Gas, Nuclear, Renewables, Other).
      Data: Six vertical 100%-stacked bars (Spain, Germany, Italy, UK, France, Poland), each segmented into 5 colors with thin white separators between segments: green (#009E73, Coal), lavender-purple (#C475FD, Natural Gas), blue (#4467A3, Nuclear), ochre (#BD8233, Renewables), red (#AE3030, Other). First series (Coal) correctly renders in brand green per the hard palette rule.
      Legibility verdict: PASS — all title, axis, tick, and legend text is clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Title, axis titles, and axis tick labels have flipped to light/off-white and soft light-gray tones, fully legible against the dark surface. Grid lines are still subtle (low-opacity light lines). The same rectangular panel border and bordered legend box are present, now in dark tones with light text.
      Data: The five segment colors (green, purple, blue, ochre, red) are pixel-identical to the light render — only the chrome (background, text, grid, legend box, borders) flipped. Brand green (#009E73) remains clearly visible against the dark background.
