review:
  strengths:
  - 'Full 3D contour reading: translucent surface sheet, nine level curves lifted
    to their exact heights every 5 % yield, and the same rings projected flat on the
    base plane directly below them'
  - Composes the community ChartsDataProvider/ChartsWrapper/ChartsSurface stack with
    useDrawingArea for a custom projected layer, so the chart stays inside MUI X instead
    of a raw SVG
  - One zAxis continuous colorMap (imprint_seq) feeds both useZColorScale for the
    curves and ContinuousColorLegend, so the color bar and marks cannot drift apart
  - Axis titles rotate along their 3D edges and tick labels anchor on each edge's
    outward normal, giving clean axes at the oblique 40°/30° view
  - 'Library-native interactivity: dragging turns and tilts the view (elevation clamped
    8–75°) in the HTML output'
  - Theme tokens threaded through every element; both renders fully readable with
    identical data colors
  weaknesses:
  - 'Suggestion: the color bar labels only 50 and 90; ticks at each 10 % level would
    let the reader read intermediate rings off the bar.'
  - 'Suggestion: the ''Maximum 91.14'' callout sits over the bunched far-side curves
    at the summit; it is not requested by the spec, so dropping it (with its drop
    line) would declutter the summit.'
  - 'Suggestion: the gap between the box''s right edge and the color bar is wide;
    pulling the color bar closer would tighten the composition.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 page; base plane and two back walls in the slightly lighter elevated tone with subtle grey grid lines at the ticks.
      Chrome: title "contour-3d · javascript · muix · anyplot.ai" bold centred with a grey subtitle (34 × 34 grid, 9 level curves every 5 from 50 to 90); bold axis titles Temperature (°C) and Pressure (bar) rotated along the front floor edges, Yield (%) vertical at the left z axis; tick labels 160–240, 10–50, 40–90 all dark and readable; color bar titled Yield (%) on the right, labelled 50 and 90.
      Data: translucent dome-shaped surface with a fine grey mesh and dark rim; nine thick lifted level curves from green (#009E73, 50) to blue (#4467A3, 90) forming tilted ellipses up to a small ring at the summit; matching thinner rings projected on the floor, partly seen faded through the sheet; dashed drop line from a dark "Maximum 91.14" dot to the floor. Seen at an oblique angle with all three axes drawn.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17 page; floor and walls in a slightly raised dark tone with subtle grid lines.
      Chrome: title, subtitle, axis titles and tick labels all in light ink and clearly readable; no dark-on-dark text; color bar labels light.
      Data: identical green-to-blue curve colors and geometry as the light render; light grey mesh and rim on the sheet; brand green visible on the low-level curves; peak dot white with light label.
      Legibility verdict: PASS
