review:
  strengths:
  - 'Theme handling is flawless: identical elevation-band colors between light and
    dark renders, only chrome (title, axis labels, tick labels, contour-line stroke
    color) flips; no dark-on-dark or light-on-light failures.'
  - Genuine, non-trivial @mui/x-charts integration this round (ChartContainer, useXScale/useYScale
    hooks, PiecewiseColorLegend bound to a real zAxis piecewise colorMap, ChartsXAxis/ChartsYAxis)
    -- a real step up from attempts 1 and 2, which had zero library imports and were
    auto-rejected for it.
  - Correct Imprint sequential colormap (green to blue) for the single-polarity yield
    data, with a properly band-labeled legend serving as the requested colorbar.
  - Deterministic, realistic response-surface data (chemical-process yield vs. temperature/pressure)
    with a well-chosen saddle/critical-point shape matching the spec's optimization-landscape
    example.
  - No edge clipping, no text overlap, clean canvas usage at the correct 3200x1800
    resolution.
  weaknesses:
  - 'Core spec miss: the render is a flat, straight-overhead 2D filled-contour plot.
    No 3D projection, tilt, or elevation transform exists anywhere in the code --
    x/y coordinates pass straight through xScale/yScale, and z only drives fill color.
    The spec explicitly requires a 3D contour plot to ''preserve the surface geometry''
    unlike a 2D contour plot that ''flattens the visualization'' -- this implementation
    performs exactly the flattening the spec says to avoid.'
  - The 'project contours onto the base plane' spec note is implemented as a 14px
    diagonal SVG offset with no depth cue, so in the rendered PNG it reads as a faint
    near-duplicate of the solid on-surface contour lines rather than a legible base-plane
    reference distinct from the surface.
  - Spec note 'enable rotation for interactive libraries to explore the 3D structure'
    is unaddressed -- there is no 3D structure in the HTML output to rotate; it is
    a static, flat SVG scene.
  - series={[]} is passed to ChartContainer -- no @mui/x-charts series/plot component
    (LinePlot, ScatterPlot, BarPlot, etc.) ever renders the actual data. The library's
    role is reduced to scale/legend/axis scaffolding around a 100% hand-rolled marching-triangles
    SVG renderer for the bands and isolines, which is the same fundamental approach
    (a custom geometry algorithm drawing the entire visual payload) that was auto-rejected
    in attempts 1 and 2 for not using the library -- now wrapped in more library plumbing
    but still with no library-rendered data marks. The prior review's explicit suggested
    fix (rebuild using a genuine data-driven component, e.g. ScatterChart with color-mapped
    points) was not adopted.
  - Given community @mui/x-charts has no contour/heatmap/surface mark type (confirmed
    across two prior AR-05 rejections and the library guide's own 'When MUI X can't
    express the spec' section), NOT_FEASIBLE remains the most honest outcome for this
    spec/library pairing rather than a hand-built geometry engine wrapped in library
    scaffolding.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 -- not pure white, not dark.
      Chrome: Title "contour-3d · javascript · muix · anyplot.ai" centered top in dark ink; "Temperature (°C)" / "Pressure (bar)" axis labels and numeric tick labels in dark/soft-dark ink; a "Yield (%)" label and a vertical PiecewiseColorLegend with 8 band swatches and range labels (e.g. "< 52" ... "> 86") on the right. All chrome text is clearly legible against the light background.
      Data: An elliptical set of 8 filled elevation bands running from green (~#009E73, low yield, edges of the domain) through teal/blue to a deep blue core (~#4467A3, high yield, center around 200°C/28 bar), with solid dark contour lines tracing each band boundary and faint gray dashed lines offset slightly diagonally (the "base-plane projection," barely distinguishable from the solid lines at normal viewing scale). The plot is rendered as a flat top-down view -- there is no visible 3D tilt, perspective, or elevation offset; only color communicates the z-value.
      Legibility verdict: PASS (all text readable; no light-on-light issues).

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 -- not pure black, not light.
      Chrome: Same title/axis-label/tick-label/legend layout, now rendered in light ink (#F0EFE8-ish) and legend text in soft light gray, fully legible against the dark background. Contour-line strokes flip from dark ink to light gray/white so they remain visible against the darker band colors. No dark-on-dark failures observed anywhere (title, axis, ticks, legend, contour strokes all readable).
      Data: Identical band colors and identical band boundaries/isoline geometry to the light render -- only chrome (background, text, contour-line stroke color) flipped, as required. Same flat top-down framing with no 3D depth cue, same faint offset "projected" dashed lines.
      Legibility verdict: PASS (all text readable; no dark-on-dark issues).
