review:
  strengths:
  - 'Genuine data-driven contour geometry: every grid point is a real (x, y, z) scatter
    datum feeding the ScatterChart''s own zAxis piecewise colorMap, and the filled
    bands/isolines are computed with a proper marching-triangles algorithm rather
    than being faked or hard-coded.'
  - Colors are correctly built from the Imprint sequential ramp (t.seq, green -> blue)
    and are identical between light and dark; both renders are theme-correct chrome-wise
    with no legibility failures.
  - A genuine computed critical point (global yield optimum) is located from the grid
    and annotated on the surface, giving the plot a clear focal point that matches
    the spec's 'optimization landscape with critical points' application.
  - 'Clean, uncluttered layout: title, axis labels (with units), and the piecewise
    legend with custom band labels are all legible with generous margins and no clipping
    at the canvas edges in either theme.'
  - Realistic, neutral synthetic dataset (chemical-process yield vs. temperature/pressure)
    with sensible domain ranges and a deterministic closed-form response-surface formula
    -- fully reproducible with no RNG needed.
  weaknesses:
  - 'Core spec gap (SC-01/SC-02): despite the title ''3D contour plot'', the render
    is strictly top-down -- z only drives fill color, never screen position, so there
    is no elevation/perspective at all. The ''projected onto base plane'' layer is
    just the same isoline paths copied with a constant diagonal pixel offset (30,
    30 in screen space), not an actual base-plane projection under a tilted surface.
    Since the whole render already goes through a custom `slots.scatter` SVG renderer
    with full access to each point''s (x, y, z), an isometric/oblique skew applied
    only to the surface layer (e.g. screenX = xScale(x) - z*k*cos(theta), screenY
    = yScale(y) - z*k*sin(theta)), while leaving the isolines at the literal, untransformed
    base, would give a genuine tilted-surface-with-shadow look and satisfy the spec''s
    ''preserve the surface geometry'' requirement.'
  - Spec Notes item 'Enable rotation for interactive libraries to explore the 3D structure'
    is not implemented -- there is no rotation control, and none is meaningful until
    the render actually has a 3D/tilted transform to rotate.
  - Sample-point markers (r=4, band-colored fill with theme-background stroke) are
    subtle against same-colored bands -- a fixed contrasting stroke (e.g. t.ink at
    higher width) or slightly larger radius would make the 'real data' overlay read
    more clearly as data points rather than blending into the fill.
  - Considerable custom low-level geometry code (marching-triangles fill/cut logic,
    polygon and segment path builders) is present for a criterion that rewards simple,
    function-free scripts (CQ-01) -- understandable given the library workaround,
    but still a real deduction under that rubric.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 -- not pure white, not dark.
      Chrome: Title "contour-3d · javascript · muix · anyplot.ai" centered at top in dark ink, clearly readable. X-axis "Temperature (°C)" and Y-axis "Pressure (bar)" labels present with units, dark tick labels on both axes, all legible against the light background. Piecewise legend ("Yield (%)" title + 8 swatches labeled "< 52" through "> 86") sits at the right with comfortable margin from the canvas edge -- confirmed via a pixel crop, no clipping.
      Data: Filled elevation bands run from Imprint sequential green (low yield, edges of the domain) through teal/blue to the darkest blue (high yield, center) -- first/lowest band uses the brand-green end of t.seq as required for sequential data. Solid dark isolines trace the level curves on the surface; a second, offset+dashed grey isoline layer represents the base-plane projection. A sparse ~9x9 grid of small white-ringed circles overlays real sample points, colored via the chart's own colorGetter. A ringed dot with "Optimum 91.1%" label marks the computed global maximum near the domain center.
      Legibility verdict: PASS -- no light-on-light text anywhere.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 -- not pure black, not light.
      Chrome: Same title, axis labels/ticks, and legend, all rendered in light ink/inkSoft tokens against the dark background -- clearly readable, no dark-on-dark failures observed. Legend swatch colors and labels remain crisp.
      Data: Band and isoline colors are pixel-identical to the light render (confirmed by side-by-side band hues and legend swatch colors) -- only chrome (background, text, sample-point stroke, isoline ink) flipped for the theme, as required. Optimum marker/label and sample points remain visible and legible.
      Legibility verdict: PASS -- no dark-on-dark text anywhere; brand-adjacent sequential palette (green -> blue) still reads clearly on the dark surface.
