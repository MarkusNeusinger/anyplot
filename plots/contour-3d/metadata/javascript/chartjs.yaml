review:
  strengths:
  - Builds a full hand-rolled 3D pipeline (elevation/azimuth camera, right/up/forward
    basis, perspective divide) entirely inside a Chart.js plugin, since Chart.js has
    no native 3D chart type — an idiomatic use of the plugin escape hatch rather than
    reaching for another library.
  - Implements marching squares from scratch to compute isolines at 11 regular thresholds,
    drawn both on the tilted surface and projected flat onto the base plane, directly
    satisfying the spec's 'project contours onto the base plane' note.
  - Painter's-algorithm depth sorting (drawItems sorted back-to-front by average projected
    depth) produces a convincing, artifact-free occluded 3D surface purely on a 2D
    canvas.
  - Axis box is placed at the projected-farthest cube corner so it sits behind the
    mesh rather than cutting through it, with ticks and axis titles (X/Y/Z) correctly
    billboarded outward from the box.
  - Sequential Imprint colormap (t.seq) is used correctly for the continuous height
    data, with an explicit f(x,y) colorbar/gradient key; data colors are pixel-identical
    between light and dark renders — only chrome flips.
  - Data tells a clear, neutral story (two local maxima joined by a saddle ridge)
    matching the spec's own 'optimization landscape' application example.
  - Deterministic, in-memory data generation with no RNG; clean scatter-chart host
    with animation disabled per the mount-node contract.
  weaknesses:
  - No interactive rotation of the 3D structure — the camera (elev=30, azim=-52) is
    fixed in both the PNG and the HTML detail view, so the spec's 'enable rotation
    for interactive libraries' note is not met. This is a real Chart.js core limitation
    (no orbit-controls primitive) rather than an oversight, but it is worth exploring
    a minimal drag-to-rotate handler in the HTML view (updating azim/elev and re-running
    the existing project() pipeline on pointermove) since the math to do so is already
    in the file.
  - Axis tick labels and the diagonal X/Y axis lines cross directly over the mesh
    and floor near the plot's back corner where 'Y', 'Z' labels, and the '4' / '0.17'
    / '-4' ticks cluster within a small area — legible but visually tight; a touch
    more offset (perpX/perpY multiplier) would give it breathing room.
  - The projection/marching-squares/depth-sort machinery is a lot of helper functions
    and math for a KISS-scored entry (bump, heightFn, project, edgeXY, etc.) — justified
    by the problem's inherent complexity (no 3D primitive in Chart.js), but it's dense
    compared to a typical single-dataset Chart.js snippet.
  - At small (~400px) thumbnail scale the 13px axis tick labels and thin dashed isolines
    will likely become hard to distinguish; consider whether a slightly heavier line
    weight or fewer displayed z-ticks would hold up better at gallery-thumbnail size.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1), matches the required light-theme surface.
      Chrome: Title "contour-3d · javascript · chartjs · anyplot.ai" in bold dark ink, fully visible and not clipped. X/Y/Z axis lines, ticks, and axis-letter labels render in a soft warm-brown ink tone against the light background; all readable. Bottom-left colorbar ("f(x, y)" with 0.17 / 1.55 / 2.93 tick labels) fully within canvas bounds.
      Data: A two-peaked landscape (saddle ridge between them) rendered as a depth-sorted, contour-banded 3D surface shaded from Imprint green (#009E73, low values) to blue (#4467A3-ish, high values), with thin dark isolines both on the tilted surface and projected flat onto the base plane as a reference contour map.
      Legibility verdict: PASS — all text is dark-on-light and readable; no light-on-light failures. Minor crowding of "Y" / tick labels near the back axis-box corner, but nothing unreadable.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17), matches the required dark-theme surface.
      Chrome: Same title, now in light/white ink, fully visible. Axis lines and tick labels render in a light warm-gray tone against the dark background — no dark-on-dark failure anywhere (axis text, title, and colorbar labels all clearly legible).
      Data: Identical green-to-blue sequential surface colors and isoline geometry as the light render — only the chrome (background, ink, axis-line tint) flipped, confirming color-token discipline.
      Legibility verdict: PASS — no dark-on-dark or light-on-light issues found in either render.
