review:
  strengths:
  - Manual marching-squares isoline extraction is applied both on the terrain surface
    and re-projected onto a floor plane, directly matching the spec's request to reference
    contours on the base plane as well as the surface
  - Custom oblique projection with a bounding-box fit (including LABEL_MARGIN) so
    axis titles and ticks land inside the canvas instead of clipping
  - Filled elevation bands use the Imprint sequential ramp (imprint_seq) sampled at
    each band midpoint, discrete and correctly identical between light/dark renders
  - Careful camera-facing corner selection for the X/Y/Z axis frames so ticks trail
    behind the terrain instead of crossing it
  - Piecewise visualMap legend clearly communicates the six elevation bands with real
    units (m)
  weaknesses:
  - No dynamic rotation of the 3D scene — the spec's Notes explicitly ask to 'Enable
    rotation for interactive libraries to explore the 3D structure', but this custom-canvas
    projection is entirely static (fixed ELEVATION/AZIMUTH, no drag-to-orbit). Since
    echarts-gl is not installed, true grid3D rotation isn't available; if feasible,
    wire a mousedown/mousemove handler that updates ELEVATION/AZIMUTH and calls chart.setOption
    again to re-project, otherwise this is an acceptable library-constraint tradeoff
    but still a spec gap worth closing if possible.
  - 'CQ-01 KISS: the implementation carries 15+ helper functions (projection math,
    marching squares, axis/tick/label builders) — far more structure than the median
    plot. Understandable given the lack of echarts-gl support for true 3D surfaces,
    but consider consolidating the axis-drawing helpers (axisLine/tickMark/tickLabel/axisTitle)
    since they are only used for three near-identical axis frames.'
  - The per-cell quad mesh (36x36 grid, ~1225 polygons with only fill and no stroke)
    creates a faint but visible diamond/crosshatch seam pattern across the whole terrain
    surface in both renders — likely an antialiasing artifact between adjacent same-color
    quads rather than an intentional wireframe. Consider giving quads a stroke matching
    their own fill color to blend seams, or reducing GRID_N slightly.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1, not pure white.
      Chrome: Title "Terrain Elevation · contour-3d · javascript · echarts · anyplot.ai" in dark ink, centered top. Axis titles "Northing (km)", "Easting (km)", "Elevation (m)" in bold dark ink; tick labels (-5..5, 140/450/770) in soft grey-ink. Piecewise legend at top-right lists six elevation bands (e.g. "663-767 m") with matching color swatches, text in soft ink.
      Data: A single terrain surface built from three overlapping Gaussian hills, filled in six discrete bands sampled from the Imprint sequential ramp — green at the base (142-247 m) transitioning to blue at the peak (663-767 m). Darker isolines mark each band boundary on the surface, and the same isolines (dashed, lighter) are re-projected onto a floor plane below the terrain for reference.
      Legibility verdict: PASS — all title, axis, tick, and legend text is clearly readable against the light background; no light-on-light text.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17, not pure black.
      Chrome: Same title and axis titles now in light ink, tick labels in lighter soft-ink grey, all clearly legible. Legend swatches and text unchanged in position, text color flipped to light ink. Floor plane background flips to a dark elevated surface with light-grey dashed isolines.
      Data: Terrain surface colors (green-to-blue band ramp) are pixel-identical to the light render — only the chrome (background, text, floor plane, axis lines) adapts to the dark theme, as required.
      Legibility verdict: PASS — no dark-on-dark failures observed; all text and isolines remain visible against the near-black background.
