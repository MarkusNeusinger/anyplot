review:
  strengths:
  - 'Genuinely creative, distinctive D3 usage: a hand-rolled orthographic 3D projection
    (elevation/azimuth camera, painter''s-algorithm depth sort) combined with d3.contours()
    marching squares to produce a true 3D surface with draped isolines plus a flattened
    topographic contour map on the base plane, matching the spec''s optimization-landscape
    framing.'
  - Correct Imprint diverging colormap (imprint_div, matte-red to blue) for the signed
    objective-value data, with identical data colors and correctly flipped theme-adaptive
    chrome (background, ink, grid) between light and dark renders.
  - Deterministic, self-contained data generation (two Gaussian extrema, no RNG) and
    clean idiomatic d3 code with no imports beyond the d3 global.
  - Includes a proper discrete colorbar legend for the value scale, satisfying the
    spec's colorbar requirement, plus manually built axis frame/ticks that stay legible
    in both themes.
  weaknesses:
  - Spec explicitly requests 'Enable rotation for interactive libraries to explore
    the 3D structure' for this plot type, but the implementation is fully static —
    no drag/mousemove handler updates AZIMUTH/ELEVATION and re-projects the scene.
    Since d3.js outputs an interactive HTML view, add a pointer-drag handler that
    recomputes camDir/right/up and redraws on interaction.
  - Axis labels are generic single words ('X', 'Y', 'Value') with no descriptive context
    or units — consider slightly more descriptive labels (e.g. 'Parameter X', 'Parameter
    Y', 'Objective Value') to raise above the generic x/y baseline.
  - Data storytelling is currently limited to color/contour encoding of the two extrema;
    a small direct label or marker at the peak and trough (e.g. 'Maximum', 'Minimum')
    would sharpen the focal point without requiring annotations the spec doesn't ask
    for.
  - The axis frame, ticks, and labels are always drawn on top of the surface in SVG
    paint order regardless of true 3D depth (no z-buffering) — currently harmless
    at this camera angle, but worth double-checking that the axis never visually cuts
    across the mesh in a way that looks physically inconsistent.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "Optimization Landscape · contour-3d · javascript · d3 · anyplot.ai" in dark ink at top, fully visible and readable. Axis labels "X", "Y", "Value" and numeric tick labels (-2, 0, 2, 4 on X/Y; -2.0, 0.0, 2.0 on the Z/value axis; colorbar ticks -3.0..3.0) render in dark ink/soft-ink and are all clearly legible against the light background. No overlap between text elements.
      Data: A 3D surface with one blue (positive) Gaussian peak toward the upper-left and one matte-red (negative) Gaussian trough toward the right, shaded with the Imprint diverging colormap (blue↔near-neutral↔red). White isolines are draped on the surface at regular value intervals, and the same contour bands are flattened onto a translucent base/floor plane beneath the surface as a topographic reference map. A discrete colorbar legend on the right shows the value scale from -3.0 to 3.0.
      Legibility verdict: PASS — all text is readable, no dark-on-light or light-on-light failures.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: The same title and axis/tick/colorbar text now render in light ink (white/near-white), fully legible against the dark background. Axis lines and tick marks flip to a light stroke. No dark-on-dark text was found.
      Data: The surface and floor bands use the identical blue/red diverging colors as the light render — confirmed unchanged data colors. The isolines drawn with stroke=t.pageBg correctly invert from light strokes (light render) to near-black strokes (dark render); they remain clearly visible against the saturated blue/red surface in both themes.
      Legibility verdict: PASS — all text and data elements remain clearly readable in the dark theme.
