review:
  strengths:
  - Genuine hand-rolled 3D camera projection (elevation/azimuth, painter's-algorithm
    depth sort) with real drag-to-orbit interaction — fulfills the spec's rotation
    requirement authentically rather than faking it
  - Correct diverging Imprint colormap (red ↔ neutral ↔ blue) applied to the signed
    objective surface, with data colors identical between light and dark renders
  - 'Implements both spec asks simultaneously: contour bands projected onto the floor
    AND isolines draped directly on the true 3D surface geometry'
  - Maximum/Minimum critical points are directly labeled with halo-stroked text for
    legibility, sharpening the data story beyond color/contour alone
  - 'Idiomatic, correct d3 usage: d3.contours() marching squares, d3.scaleSequential
    + interpolateRgbBasis, d3.drag() — no forbidden color schemes'
  weaknesses:
  - Canvas utilization is borderline (~45-50% of the 3200x1800 canvas) with noticeable
    empty whitespace in the top-right (between title and colorbar) and bottom-right
    quadrants — enlarge the 3D scene or tighten margins to use more of the canvas
  - Axis labels 'Parameter X' / 'Parameter Y' / 'Objective Value' are descriptive
    but carry no units — consider adding a unit or a one-word domain qualifier if
    the objective function has a natural interpretation
  - The surface isolines create some visual clutter near the two peaks where many
    thin white contour rings overlap densely — consider slightly fewer bands or a
    thinner stroke there for extra polish
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 (not pure white, not dark).
      Chrome: Title "Optimization Landscape · contour-3d · javascript · d3 · anyplot.ai" is dark, bold, centered at top, fully readable. "Parameter X", "Parameter Y", and "Objective Value" axis labels are dark bold text, clearly legible against the light background. Tick labels (numeric, e.g. "2.0", "0", "-2", "4") are medium-gray, subtle but readable. The right-side colorbar has a dark bold "Objective Value" title and gray tick labels, all legible.
      Data: A 3D surface with one blue peak (labeled "Maximum") and one red valley (labeled "Minimum"), shaded with a diverging red-neutral-blue continuous colormap. White isolines are draped on the true surface at each contour level, and the same contour bands are also projected flat onto a floor plane beneath the surface for reference. The colorbar confirms the mapping: blue = positive values (top, +3.0), red = negative values (bottom, -3.0).
      Legibility verdict: PASS.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 (not pure black, not light).
      Chrome: Title is light/near-white, bold, centered at top, fully readable. Axis labels ("Parameter X", "Parameter Y", "Objective Value") are light-colored and clearly legible against the dark background. Tick labels are light gray, subtle but readable. Colorbar title and tick labels are light-colored, all legible. No dark-on-dark text was found anywhere.
      Data: Confirmed identical to the light render — same blue peak (Maximum) / red valley (Minimum) surface, same diverging colormap stops, same floor-projected contour bands and surface isolines. Only the chrome (background, axis/tick/title text color, isoline halo color) flips between themes; the data-color mapping itself is unchanged.
      Legibility verdict: PASS.
