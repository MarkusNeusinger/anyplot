review:
  strengths:
  - 'Genuinely creative workaround for Highcharts core''s missing 3D/colorAxis modules:
    hand-rolled orthographic projection, marching-triangles isoline extraction, and
    a manual colorbar legend, all well-commented explaining the constraint.'
  - Correct title format, correct grid size (33x33, within the 30-50 spec range),
    and isolines drawn both on the surface and projected onto the base plane as required
    by the spec.
  - Deterministic, seed-free data generation (the classic 'peaks' response surface)
    -- fully reproducible.
  - No fake interactivity is simulated; page background and text chrome correctly
    adapt between light and dark themes.
  weaknesses:
  - 'CRITICAL: Isoline and legend-swatch colors are not theme-invariant. colorAt()
    blends each level''s color toward `t.ink` (the theme''s text-ink token) as the
    diverging midpoint, so the SAME elevation level renders as dark navy/maroon in
    light mode but light periwinkle/salmon in dark mode (compare the top two isolines
    and the legend swatches between plot-light.png and plot-dark.png). The style guide
    requires data colors to be pixel-identical across themes -- only chrome may flip.
    Fix: blend toward a fixed, theme-invariant neutral (e.g. a constant mid-gray,
    or the imprint_div midpoint stop color itself) instead of `t.ink`, so isoline/legend
    colors match exactly between renders.'
  - The spec's Notes explicitly require 'Enable rotation for interactive libraries
    to explore the 3D structure.' The current implementation is a fixed, static orthographic
    projection with no interactivity at all -- there is no rotation control. Since
    Highcharts core lacks highcharts-3d, consider a lightweight custom drag-to-rotate
    (recompute AZIM/ELEV and reproject every series on pointer move/drag) to satisfy
    this requirement in the HTML output.
  - The dense mesh wireframe overlapping the colored isolines creates significant
    visual clutter -- many crossing lines make it hard to trace individual isoline
    loops (e.g. the small disconnected arc near the saddle around X=0 and the lone
    diagonal segment near the right-hand dip read as stray marks rather than clear
    contour rings). Consider increasing MESH_STRIDE to thin the wireframe further,
    lowering its opacity, or making the isolines visually pop more (thicker stroke
    / higher contrast) above the mesh.
  - The Z-axis title 'Elevation' has no units -- consider 'Elevation (m)' or similar
    so the scale is unambiguous.
  - 'Minor: the chart-level `colors: t.palette` option is set but never consumed --
    every series sets an explicit `color`, so this line is dead configuration.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 -- correct light chrome.
      Chrome: Title "contour-3d · javascript · highcharts · anyplot.ai" and subtitle are dark, clearly legible against the light background. Axis labels "X", "Y", "Elevation", the -3/0/3 tick labels, the 8.0/0.0/-6.5 elevation tick labels, and the "Elevation levels" legend text are all dark-on-light and readable, though the elevation tick numbers sit close to dense wireframe lines which slightly reduces clarity.
      Data: A gray wireframe mesh (the "peaks" surface) fills the plot with six colored isoline rings/arcs threaded through it -- the two highest levels (5.7, 3.4) render as dark navy-blue, the mid levels are faint/small near the saddle, and the two lowest levels (-3.4, -5.7) render as dark maroon/brick red, with fainter dotted projections of the same isolines onto the base plane. Legend swatches on the right show six colors from a lighter slate-blue (5.7) down through very dark navy (1.1) to medium red (-5.7).
      Legibility verdict: PASS (all text is readable; no dark-on-light failures).

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 -- correct dark chrome.
      Chrome: Title, subtitle, axis titles, tick labels, and legend text are all light-on-dark and clearly legible; no dark-on-dark failures observed.
      Data: The same wireframe/isoline layout as the light render, BUT the isoline and legend-swatch colors are visibly different in tone from the light render -- the top two isolines are now a lighter periwinkle-blue (rather than dark navy) and the valley isolines are a lighter salmon-pink (rather than dark maroon). The legend swatches show the same lightening shift.
      Legibility verdict: PASS for text/chrome, but FAIL for data-color consistency -- the isoline/legend colors are NOT identical to the light render, which violates the "data colors must be identical between themes, only chrome flips" rule. This is caused by colorAt() blending each level's color toward the theme-dependent `t.ink` token instead of a fixed neutral midpoint.
