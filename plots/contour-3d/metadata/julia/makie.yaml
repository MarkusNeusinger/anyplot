review:
  strengths:
  - 'Correct use of the Imprint sequential colormap (#009E73 to #4467A3) for elevation,
    appropriate since elevation above sea level is single-polarity data'
  - Theme-adaptive chrome correctly applied to background, title, axis labels/ticks,
    grid lines, and colorbar via PAGE_BG/INK/INK_SOFT tokens
  - contour3d! traces isolines directly on the surface at true elevation, combined
    with surface! for a clear terrain-map narrative with a strong focal point (the
    tallest peak)
  - Canvas dimensions match the required landscape target (3200x1800) with correct
    Figure resolution / px_per_unit pairing
  - Title format complies with the spec ('contour-3d · julia · makie · anyplot.ai'),
    and the colorbar is clearly labeled with units ('Elevation (m)')
  - Realistic, neutral synthetic terrain data (three peaks of differing heights) at
    a plausible geographic and elevation scale
  weaknesses:
  - 'A stray black vertical line with an arrowhead shoots straight up from the mountain
    peak to the top of the canvas in BOTH the light and dark renders (identical black
    color in both themes — proof it is not using the INK/INK_SOFT theme tokens). This
    is almost certainly the z-axis spine/tick rendering on the untamed side of Axis3:
    the code only sets xspinecolor_1/yspinecolor_1/zspinecolor_1 (and matching tickcolor
    variants), but at azimuth=1.28*pi the visible z-axis edge appears to be the ''_2''
    side, which falls back to Makie''s default (unthemed, black) color and happens
    to project through the center of the plot rather than a corner. Fix by also setting
    the ''_2'' variants (zspinecolor_2, ztickcolor_2, xspinecolor_2, yspinecolor_2,
    and their tick counterparts) to INK_SOFT, or by choosing an azimuth/elevation
    combination where the themed ''_1'' spines are the ones actually rendered — verify
    by rendering and confirming no unstyled black line survives in the dark theme.'
  - A translucent, disconnected circular disc/patch floats just above the second (smaller)
    peak in both renders, not aligned with the surface mesh underneath it — a clear
    rendering artifact rather than intentional geometry. Likely a z-fighting/interpolation
    issue between contour3d! isolines and the surface! mesh at that location. Try
    increasing the (easting, northing) grid resolution beyond 45x45 for smoother isoline-to-surface
    alignment, or reduce/adjust the contour levels near that peak, and re-render to
    confirm the artifact is gone.
  - Optional spec suggestion 'project contours onto the base plane as well as the
    surface' was not implemented — would add reference value but is not required.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1), matches the light-theme target.
      Chrome: Title "contour-3d · julia · makie · anyplot.ai" is bold, dark, and clearly readable. Axis labels (Easting (km), Northing (km), Elevation (m)) and tick labels are dark/soft-grey and legible against the light background. Grid lines are subtle light-grey, visible but not dominant. Colorbar on the right is labeled "Elevation (m)" with legible tick labels.
      Data: A 3D terrain surface using the Imprint sequential colormap (green at low elevation -> blue at high elevation), with black contour isolines traced on the surface. First/low-elevation color is the anyplot brand green (#009E73). BUG: a black vertical line with an arrowhead pierces straight up from the tallest peak to the top of the canvas — an unstyled/default axis element overlapping the data. BUG: a translucent blue disc artifact floats disconnected above the smaller second peak.
      Legibility verdict: PASS for text; FAIL for visual cleanliness due to the two rendering artifacts described above (not a text-legibility issue, but a significant visual-quality defect).

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17), matches the dark-theme target.
      Chrome: Title, axis labels, and tick labels correctly flip to light ink colors and remain clearly readable — no dark-on-dark failures on the themed chrome. Contour isolines correctly flip from black to white. Grid lines remain subtle.
      Data: Colors are identical to the light render (green-to-blue sequential surface) — only chrome flipped, as required. BUG: the same vertical line artifact from the light render is present here too, but it stays BLACK instead of flipping to a light ink color — this is a genuine dark-on-dark-adjacent theme violation (an unstyled default-colored axis element that ignores the theme tokens entirely) and is visible mainly because it's still dark-ish against the near-black background, but it is clearly not using INK/INK_SOFT. BUG: the same translucent disc artifact above the second peak is present, identical position/shape.
      Legibility verdict: PASS for themed chrome text; the two rendering-artifact bugs persist unchanged and are the dominant defects in this render as well.
