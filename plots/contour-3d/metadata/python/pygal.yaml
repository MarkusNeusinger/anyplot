review:
  strengths:
  - Lifts each level curve to its own z height in a hand-built oblique projection,
    with thin faded base-plane contours lying directly below at the same levels
  - 'imprint_seq ramp (#009E73 -> #4467A3) tied to height, repeated in a banded colorbar
    titled Height z, identical in both themes'
  - Uses pygal's inline CSS injection to set per-series stroke width and opacity,
    giving lifted curves clear weight over the base projection
  - 'Chrome threaded through theme tokens: all text readable on #FAF8F1 and #1A1A17'
  weaknesses:
  - 'VQ-02 (both): the z-axis line runs through the ''1.1'' tick label at the top
    of the z axis → clear the label from the axis by at least 10 px to the left. Likely
    cause: the z tick label anchor offset of -0.075 in project units.'
  - 'VQ-05 (both): the colorbar tick labels sit about 160 px right of the bar, detached
    from it, and the x and y axes carry only one tick each (''-3'', ''3'') whose axis
    is ambiguous → labels within about 30 px of the bar, and both ends ticked on each
    axis. Likely cause: the bar_u + 0.1 label offset and the single far-end tick per
    axis.'
  - 'DQ-02 (both): the surface is an abstract function with labels ''X coordinate'',
    ''Y coordinate'', ''Height z'' → a named domain such as terrain elevation in metres
    over east/north distance in km. Likely cause: the column-name constants X, Y,
    Z.'
  - 'CQ-01 (code): four helper functions (lerp_hex, project, trace, pts) break the
    flat Imports → Data → Plot → Save structure → inline pts as a list comprehension
    and the colour ramp as one expression. Likely cause: helper defs at lines 55,
    69, 78, 118.'
  - 'Suggestion: a translucent marker or label on the summit ring would give the view
    a focal point.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1
      Chrome: title 'contour-3d · python · pygal · anyplot.ai' top centre in dark ink; oblique x-y box drawn in muted grey with axis titles 'X coordinate', 'Y coordinate', z axis at the left corner titled 'Height z' with ticks -0.29 and 1.1; x/y ticks '-3' and '3'; banded colorbar on the right titled 'Height z' with labels -0.11 ... 0.96. All readable; the '1.1' label is crossed by the z-axis line
