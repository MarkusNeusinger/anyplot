review:
  strengths:
  - 'True oblique 3D view built in Altair: level curves lifted to their heights, repeated
    on the base plane, with x, y and z axes drawn'
  - imprint_seq height ramp shared by lifted curves, base contours and a colorbar
    titled 'Elevation (m)' covering the level range
  - Clear three-weight stroke hierarchy separates lifted curves, base contours and
    the faint wireframe surface in both themes
  - Idiomatic path drawing with alt.Detail and alt.Order over one tidy frame, with
    shared scales across layered charts
  weaknesses:
  - 'VQ-02 (both): the z-axis tick label ''110'' runs into the vertical z rule at
    the top of the axis → clear it by a few px. Likely cause: mark_text centred at
    u - 0.16 instead of align=''right'' with a dx offset.'
  - 'VQ-05 (both): the 3D box fills only about 45 % of the canvas width and leaves
    a ~300 px empty band before the legend plus wide top and bottom margins → let
    the drawing fill more of the view. Likely cause: VIEW_W, VIEW_H = 520, 300 and
    the 1.04 domain padding with the legend placed far right.'
  - 'VQ-06 (both): axis titles ''X coordinate'' and ''Y coordinate'' carry no unit
    next to ''Elevation (m)'' → titles with units, e.g. ''Easting (km)''. Likely cause:
    X_COORD / Y_COORD constants.'
  - 'SC-02 (code): the Notes ask to enable rotation for interactive libraries; the
    HTML is a static projection with no rotation or other interaction → bind AZIMUTH/ELEVATION
    to an Altair param or add native interaction. Likely cause: projection computed
    in pandas before charting.'
  - 'CQ-01 (code): a `def project` helper (lines 65-71) and a `nice` lambda kept with
    `# noqa: E731` (line 132) → inline the projection as vectorised expressions and
    replace the lambda with a plain np.linspace expression. Likely cause: helper-style
    structure.'
  - 'Suggestion: the hand-written marching squares (lines 91-117) could come from
    a contour utility such as skimage/contourpy if one is installed.'
  - 'Suggestion: tooltips on the lifted curves (level value) would add native interactivity
    to the HTML.'
