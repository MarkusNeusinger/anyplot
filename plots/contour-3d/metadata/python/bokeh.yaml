review:
  strengths:
  - Projects the surface, its level curves and a base-plane projection with a hand-built
    orthographic view and depth-sliced painter's order, so nearer relief correctly
    hides what is behind it
  - 'Theme-correct in both renders: imprint_seq green-to-blue ramp identical in light
    and dark, contours switch from near-black ink to light ink and stay distinct from
    the surface'
  - Colorbar ticked exactly at the ten contour levels via FixedTicker and titled with
    the quantity and unit
  - Batches thousands of quads and segments into vectorized p.patches / p.multi_line
    calls per depth slice; 3D axes drawn with native Arrow + VeeHead annotations
  weaknesses:
  - 'SC-02 (both): the Notes ask interactive libraries to enable rotation, and the
    HTML offers a fixed view only → expose the azimuth/elevation via a bokeh Slider
    with a CustomJS callback that re-projects the ColumnDataSource. Likely cause:
    VIEW_AZIMUTH and VIEW_ELEVATION baked into Python-side projection.'
  - 'VQ-06 (both): the x and y axis titles are bare letters ''x'' and ''y'' with no
    unit or scale, so the base plane has no readable extent → name the quantities
    with units (for example ''Distance east (km)''). Likely cause: X = "x", Y = "y"
    column constants.'
  - 'DQ-02 (both): the field is an abstract ''Amplitude (a.u.)'' over unnamed x/y
    coordinates, which reads as a generic test function → rename to a concrete quantity
    such as terrain elevation or field strength with real units. Likely cause: the
    AMPLITUDE / X / Y constants and the two-Gaussian data block.'
  - 'CQ-04 (code): lines 85-101 hand-write marching squares (level_segments) although
    contourpy, a bokeh dependency, computes the same lines → contourpy.contour_generator(xs,
    ys, zgrid).lines(level). Likely cause: the custom level_segments loop.'
  - 'CQ-01 (code): four helper functions (lerp_hex, project, ramp_color, level_segments)
    break the flat-script structure → inline the gradient via np.linspace over RGB,
    drop level_segments with contourpy, keep projection as inline array math. Likely
    cause: the helper definitions at lines 31-101.'
  - 'Suggestion: the dark render shows a thin grey frame around the plot area that
    the light render does not; setting the frame to the page color would make both
    themes match.'
  - 'Suggestion: a HoverTool on the surface quads showing x, y and amplitude would
    add value to the HTML view.'
