review:
  strengths:
  - imprint_div built with scale_fill_gradient2(midpoint=0) and a theme-adaptive midpoint
    fits the signed heights, with identical poles in both themes
  - Native geom_contour(bins=12) gives regular-interval isolines in ink that stays
    readable over the fill in both themes
  - Correct 3200x1800 canvas via ggsize(800, 450) + scale=4, panel flush to the data
    with expand=[0,0]
  - 'Clean structure: column constants, a single Data block, explicit imports'
  weaknesses:
  - 'SC-01, SC-02 (both): the plot is a flat 2D heatmap with isolines seen from straight
    above, so the field does not read as relief (C1) and the Notes'' rotation is missing
    → draw the level curves lifted to their z heights in a 3D oblique view with all
    three axes, lets-plot has no native 3D geom, so project the contour paths (stat
    from geom_contour or computed levels) and the three axis lines through an oblique
    view transform into screen x/y and draw them with geom_path. Likely cause: geom_tile
    + geom_contour on the x-y plane.'
  - 'DQ-02 (both): the axes are labelled ''X coordinate'', ''Y coordinate'' and ''Height
    (z)'', which reads as a generic test function → a concrete scenario such as terrain
    (''Easting (km)'', ''Northing (km)'', ''Elevation (m)''). Likely cause: the column
    constants.'
  - 'Suggestion: project the contours onto a base plane under the lifted level curves,
    as the Notes suggest.'
