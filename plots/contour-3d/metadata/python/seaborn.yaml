review:
  strengths:
  - 'Correct theme-adaptive chrome in both renders — no dark-on-dark or light-on-light
    legibility failures, backgrounds match #FAF8F1/#1A1A17 exactly'
  - Diverging Imprint colormap (imprint_div, red↔midpoint↔blue) is the right choice
    since displacement has a meaningful zero midpoint (equilibrium), and TwoSlopeNorm
    centers it correctly
  - Base-plane contour projection (ax.contour with zdir='z', offset) directly satisfies
    the spec's 'project contours onto the base plane as well as the surface' note,
    and is clearly visible in both renders
  - Peak annotation with a clean callout box creates a clear focal point / data-storytelling
    element
  - Title exactly matches the mandated 'contour-3d · python · seaborn · anyplot.ai'
    format
  - Realistic, neutral physical-science scenario (plate vibration displacement) with
    sensible units and scale (cm / μm)
  - 'Clean KISS code: no functions/classes, deterministic (no randomness needed for
    an analytic surface), no unused imports, correct plot-{theme}.png save call'
  weaknesses:
  - Significant unused whitespace on the left ~35-40% of the landscape canvas — the
    3D axes box renders centered/right, leaving the left side nearly empty apart from
    the vertical z-axis label. Widen the effective plot footprint (adjust ax position/box
    aspect, tighten subplots_adjust margins further, or reconsider whether a square
    2400x2400 canvas suits this cube-shaped 3D plot better than 16:9) so the data
    fills more of the canvas.
  - The on-surface contour lines (ax.contour(..., levels=12, colors=INK, alpha=0.6)
    drawn directly on the 3D surface) are barely visible against the diverging surface
    fill in both renders — the spec explicitly asks for 'contour lines at regular
    intervals to show level curves on the surface', and right now only the base-plane
    projection reads clearly, not the on-surface lines. Increase linewidth and/or
    alpha, or use a higher-contrast line color, so the surface-level contours are
    legibly distinguishable from the fill.
  - The 3D axes grid/pane edges render as bold, high-contrast dark lines rather than
    the subtle ~15% alpha intended by the theme rc settings (mplot3d does not fully
    respect ax.grid(alpha=...) for pane borders) — this looks heavier/less refined
    than the rest of the theme, especially in the light render. Reduce the pane edge
    linewidth or manually restyle ax.xaxis._axinfo['grid'] (and y/z) to bring the
    box lines down to the intended subtlety.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white, not dark.
      Chrome: Title "contour-3d · python · seaborn · anyplot.ai" in dark ink, clearly visible at top-center. Axis labels "x Position (cm)", "y Position (cm)", "Displacement (μm)" (vertical, left side) and colorbar label "Displacement (μm)" all in dark/soft-dark ink, legible. Tick labels on all three 3D axes and the colorbar are legible soft-dark gray. The 3D box/grid edges render as fairly bold dark lines, more prominent than the intended subtle 15% grid alpha.
      Data: Diverging red-white-blue (imprint_div) surface with a blue peak (~6.9 μm) and a red trough, a "Peak: 6.9 μm" annotation box near the summit, and projected contour rings in matching red/blue on the base plane. On-surface contour lines are present in code but barely discernible against the surface fill at this zoom level.
      Legibility verdict: PASS — all text is readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black, not light.
      Chrome: Title, axis labels, and tick labels all render in light ink (#F0EFE8) / soft light gray (#B8B7B0), clearly visible against the dark background. Grid/box edges render as bold near-white lines — visible and readable, though again heavier than the intended subtle alpha. The "Peak: 6.9 μm" callout box uses a dark elevated fill with light text/edge, reads clearly.
      Data: Same diverging red-white-blue surface and base-plane contour projection as the light render — colors are identical (only chrome flipped), confirming the Imprint palette data colors are theme-independent.
      Legibility verdict: PASS — no dark-on-dark failures; all text is readable against the dark background.
