review:
  strengths:
  - Repair fixed the previous canvas imbalance — switching to a square 2400×2400 canvas
    gives the 3D box a well-balanced, nearly-filled composition instead of the landscape
    format's ~35-40% wasted left margin
  - On-surface contour lines are now clearly visible (opaque INK color, linewidth
    2.5, lifted a hair above the surface to avoid z-fighting) — directly satisfies
    the spec's 'contour lines... on the surface' requirement, which was too faint
    in the previous attempt
  - 3D pane/grid lines were manually restyled via _axinfo['grid'] to the intended
    ~15% alpha, replacing the previous bold high-contrast box edges — noticeably cleaner,
    more refined chrome in both themes
  - Diverging Imprint colormap (imprint_div, red↔neutral↔blue) built with sns.blend_palette
    and centered via TwoSlopeNorm is the correct choice for signed displacement data
    with a meaningful zero midpoint; colors are identical across light/dark renders
  - Peak annotation creates a clear focal point / data-storytelling element without
    simulating fake interactivity
  - Base-plane contour projection (zdir='z', offset) satisfies the spec's 'project
    contours onto the base plane as well as the surface' note
  - Realistic, neutral physical-science scenario (plate vibration displacement, cm/μm
    units) with plausible values and scale
  - 'Clean KISS code: deterministic (no randomness needed for an analytic surface),
    correct imports, correct plot-{theme}.png save call without bbox_inches=''tight'''
  weaknesses:
  - Near the surface's summit, the two highest-level on-surface contour rings collapse
    into small blob-like dots rather than clean thin loops — the 2.5pt linewidth is
    disproportionately thick for rings only a few grid cells wide at the sharp peak.
    Thin the on-surface contour linewidth (e.g. ~1.5-1.8) or slightly reduce `levels`
    so fewer rings crowd the summit.
  - LM-02 (Distinctive Features) is generic — sns.blend_palette for the diverging
    colormap is the only clearly seaborn-specific touch; the rest of the 3D rendering
    is plain matplotlib mplot3d (expected, since seaborn has no native 3D API, but
    there may be room for another seaborn-native touch, e.g. sns.despine-style spine
    cleanup or a seaborn palette-derived accent).
  - 'Minor: the vertical z-axis label (''Displacement (μm)'') duplicates the colorbar
    label — consider whether both are necessary, though this is a design choice rather
    than an error.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 exactly — not pure white, not dark.
      Chrome: Title "contour-3d · python · seaborn · anyplot.ai" in dark ink, clearly visible at top-center, comfortably sized (~60% of canvas width). Axis labels "x Position (cm)", "y Position (cm)", "Displacement (μm)" and the colorbar label "Displacement (μm)" all render in dark/soft-dark ink, legible. Tick labels on all three 3D axes and the colorbar are legible soft-dark gray. The 3D box pane grid lines are now subtle (restyled via _axinfo), a clear improvement over the previous bold box edges — only the axis spines themselves remain a firmer soft-dark tone, which is expected chrome, not a grid line.
      Data: Diverging red-white-blue (imprint_div) surface with a blue peak (~6.9 μm) and a red trough, a "Peak: 6.9 μm" annotation callout near the summit, matching red/blue contour rings projected onto the base plane, and on-surface contour lines now visible in solid ink color across the surface (though the top 1-2 rings near the very peak render as small blob-like dots rather than clean thin loops due to their tiny radius at that linewidth).
      Legibility verdict: PASS — all text is readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 exactly — not pure black, not light.
      Chrome: Title, axis labels, and tick labels all render in light ink (#F0EFE8) / soft light gray (#B8B7B0), clearly visible against the dark background. Pane grid lines are subtle light gray, matching the intended ~15% alpha — a clear improvement over the previous bold near-white box edges. The "Peak: 6.9 μm" callout box uses a dark elevated fill with light text/edge, reads clearly.
      Data: Same diverging red-white-blue surface, base-plane contour projection, and on-surface contour lines as the light render — colors are identical (only chrome flipped), confirming the Imprint palette data colors are theme-independent. The same peak-summit blob artifact is visible here (as small white dots instead of black).
      Legibility verdict: PASS — no dark-on-dark failures; all text is readable against the dark background.
