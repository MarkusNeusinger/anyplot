review:
  strengths:
  - 'Creative, correct workaround for ggplot2''s lack of 3D grammar: hand-rolled orthographic
    camera (view/right/up basis vectors), painter''s-algorithm depth sorting of surface
    quads, and bilinear interpolation to lift contour isolines onto the surface —
    a genuinely distinctive technique, not a generic fallback'
  - 'Satisfies every spec Notes bullet: sequential fill for contour bands, isolines
    drawn both on the surface and projected onto the base plane (dashed), and a colorbar
    for the value scale'
  - Realistic, neutral data context (point-charge electric field intensity, plausible
    kV/m and meter scales) on a 40x40 grid, within the spec's 30x50 size range
  - 'Theme-adaptive chrome is correctly threaded through: PAGE_BG/INK/INK_SOFT tokens
    flip correctly, data colors (green-to-blue sequential fill) are identical between
    light and dark renders'
  - Clean axis box (three edges from the front-bottom-left corner) with descriptive,
    unit-bearing axis labels (x (m), y (m), E (kV/m)) and a title in the exact mandated
    format
  - Canvas is exactly 3200x1800, code is reproducible (set.seed), imports are all
    used, and the file saves via ragg::agg_png with the correct plot-{THEME}.png pattern
  weaknesses:
  - 'Tick-label / surface collision (both themes, identical): the negative-side x-tick
    (''-4'') and y-tick (''-2'') labels project to screen positions that fall INSIDE
    the visual footprint of the tall surface peak, so they render on top of the mesh/contour
    lines near the crossing of the two axis lines rather than beside the axis like
    the other ticks. This reads as confusing duplicate labels sitting on the data
    itself. Root cause: `tick_gap <- 0.3 * (x_max - x_min)` is a single scalar offset
    in data space, but after the perspective-like projection with `Z_LIFT = 1.3` the
    negative-side ticks (near the tall part of the surface) end up projected closer
    to the peak''s screen silhouette than the positive-side ticks. Fix: either increase
    `tick_gap` enough that even the negative-side ticks clear the peak''s projected
    silhouette, or compute per-tick offsets based on the local surface height at that
    tick''s (x, y) rather than a single flat-plane gap, or draw the tick-label layer
    with a small halo/background rect so any residual overlap stays legible against
    the mesh.'
  - 'Minor: the two projection/interpolation helper functions (`project_x`/`project_y`,
    `interp_z`) are a departure from the usual ''no functions'' KISS baseline — reasonable
    and well-commented given the constraint that ggplot2 has no native 3D grammar,
    but worth flagging under CQ-01.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1), matches spec.
      Chrome: Title "contour-3d · r · ggplot2 · anyplot.ai" in dark ink, centered, fully visible, correctly sized. Axis box with three edges (x, y, z) in soft ink-gray, meeting at the front-bottom-left corner. Axis labels "x (m)", "y (m)", "E (kV/m)" in bold dark ink, clearly placed away from the mesh. Tick labels (0, 2, 4 on x/y; 0, 1, 2, 3 on z; negative ticks -2, -4) in soft ink-gray. Legend "E (kV/m)" with stepped color swatches (0.5 through 3.0) to the right, fully inside the canvas. Legibility verdict: mostly PASS, but the "-4" (x-tick) and "-2" (y-tick) labels are rendered directly on top of the blue/green mesh surface near the axis crossing, overlapping data (see Weaknesses) — text itself stays legible (dark-on-surface has enough contrast) but the placement is confusing.
      Data: A single smooth hill (electric-field-intensity peak) rendered as a projected wireframe/quad mesh, sequential fill from #009E73 (green, low) to #4467A3 (blue, high). Black contour isolines wrap the surface at regular intervals, and matching dashed isolines are projected onto the flat base plane below the surface for reference — matches the spec's "project contours onto the base plane" note.
      Legibility verdict: PASS overall, with the noted tick/mesh overlap being a placement defect rather than a contrast/readability failure.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17), matches spec.
      Chrome: Same title, now in light ink (#F0EFE8), clearly readable. Axis lines and tick labels flip to light ink-soft gray, axis titles bold light ink — no dark-on-dark anywhere. Legend text/title flip to light ink as expected.
      Data: Identical green-to-blue sequential fill and mesh geometry as the light render — confirms data colors are held constant across themes, only chrome flipped.
      Legibility verdict: PASS for all chrome; same "-4"/"-2" tick-on-mesh overlap issue reproduces identically here (text remains legible against the surface, but placement duplicates/collides with the data region) — this is a placement bug independent of theme, not a dark-on-dark contrast failure.
