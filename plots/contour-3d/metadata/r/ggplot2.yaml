review:
  strengths:
  - 'Attempt-1 weakness fully resolved: the ''-4'' x-tick and ''-2'' y-tick labels,
    which previously projected onto the mesh interior, now land cleanly in the open
    background in both renders — verified by pixel-level crops around the axis crossing
    and the left tick columns'
  - 'Creative, correct workaround for ggplot2''s lack of 3D grammar: hand-rolled orthographic
    camera (view/right/up basis vectors), painter''s-algorithm depth sorting of surface
    quads, and bilinear interpolation to lift contour isolines onto the surface —
    a genuinely distinctive technique, not a generic fallback'
  - 'Satisfies every spec Notes bullet: sequential fill for contour bands, isolines
    drawn both on the surface and projected onto the base plane (dashed), and a colorbar
    for the value scale'
  - Realistic, neutral data context (point-charge electric field intensity, plausible
    kV/m and meter scales) on a 40x40 grid, within the spec's 30-50 size range
  - 'Theme-adaptive chrome correctly threaded through: PAGE_BG/INK/INK_SOFT tokens
    flip correctly, data colors (green-to-blue sequential fill) identical between
    light and dark renders'
  - Canvas is exactly 3200x1800, code is reproducible (set.seed), imports are all
    used, saves via ragg::agg_png with the correct plot-{THEME}.png pattern
  weaknesses:
  - 'Minor: the projection/interpolation helper functions (project_x/project_y, interp_z,
    field_intensity) depart from the strict ''no functions'' KISS baseline — reasonable
    and well-commented given ggplot2 has no native 3D grammar, but still worth a small
    CQ-01 deduction'
  - The stepped sequential legend (scale_fill_steps, n.breaks=7) renders with fairly
    subtle band boundaries at this data range — consider slightly higher contrast
    between steps if a future iteration wants the discrete contour-band read to be
    more immediately obvious at a glance
