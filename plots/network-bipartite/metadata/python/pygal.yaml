review:
  strengths:
  - 'All five characteristic properties are met: two columns, set colors with named
    headings, node size by degree, muted straight edges, labels on the outer side
    of each column'
  - 'Per-point node dicts ({''node'': {''r'': ...}}) size each dot by degree, a native
    pygal idiom'
  - Edges drawn as one None-separated XY series, grey at 0.55 opacity, visible but
    subordinate in both themes
  - Theme tokens thread through Style; both renders are readable with identical data
    colors
  - Degree counts in the labels make the hubs readable at a glance
  - Interactive HTML export with pygal tooltips
  weaknesses:
  - 'VQ-05 (both): the drawing sits right of centre: about 15 % of the width is empty
    left of the author labels while the PAPERS heading ends about 3 % from the right
    edge → balance the margins (shift the view about 0.1 data units left). Likely
    cause: xrange=(-0.55, 1.4) against label carriers at -0.33 and 1.05.'
  - 'DQ-02 (both): papers are labelled P01–P10, which reads as placeholder ids → short
    real-looking paper titles or keywords. Likely cause: the paper ids in the edge
    list.'
  - 'CQ-01 (code): four helper functions (column, radius, node_points, label_points)
    wrap one-line expressions → inline them as comprehensions in the Plot zone. Likely
    cause: helpers kept from a draft.'
  - 'Suggestion: the ''Labels'' series could set tooltips off so the invisible label
    carriers do not show hover boxes in the HTML.'
