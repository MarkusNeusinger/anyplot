review:
  strengths:
  - Two clearly separated columns with airline labels on the outer left and airport
    labels on the outer right, every label colored by its set and clear of the edges
    in both themes
  - Node size maps degree through scale_size_continuous with a range of 3–9, so JFK
    and LAX stand out as hubs while the single-route DFW and DXB stay visible
  - 'The size legend uses guides(size=guide_legend(override_aes={''color'': INK_SOFT})),
    so its circles read on both backgrounds'
  - Edges are thin INK_SOFT segments at alpha 0.35, lighter than the nodes and still
    visible on the dark surface
  - 'Set order comes from df via limits=node_sets, so the first set gets #009E73 and
    the second #C475FD'
  - Real, neutral airline–airport route data (Delta/ATL, United/ORD, Lufthansa/FRA,
    Emirates/DXB) in the spec's size range
  weaknesses:
  - 'VQ-05 (both): the legend box has almost no inner padding: the ''Node set'' title
    sits on the left frame line and ''Airport'' runs to the right frame line → give
    the legend about 4–6 pt of inner margin. Likely cause: no legend_box_margin /
    legend_margin in theme() around the ELEVATED_BG frame.'
  - 'SC-02 (both): a horizontal axis line runs across the full plot width under the
    columns, though the spec''s first characteristic bullet asks for no axes → drop
    the line and keep the bold set names as column headings. Likely cause: axis_line_x=element_line(color=INK_SOFT,
    size=0.5).'
  - 'DQ-03 (both): the airline set has 8 nodes, below the spec''s 10–50 nodes per
    set (12 airports is inside) → at least 10 airlines (+2), for example Air Canada
    and British Airways with their routes. Likely cause: the routes dict has 8 keys.'
  - 'Suggestion: placing the set names as headings above each column (geom_text at
    y slightly above 1) would tie them closer to their nodes than the bottom axis
    does.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, not pure white.
      Chrome: title "network-bipartite · python · plotnine · anyplot.ai" in dark ink at top, about 50 % of the width. Bold column names "Airline" and "Airport" under a thin INK_SOFT axis line at the bottom. Legend box on the right (elevated off-white with a dark frame) with "Node set" (Airline, Airport) and "Routes" (1–6 dark circles). All text is readable; the legend's title and entries sit tight against the frame.
      Data: 8 airline nodes in #009E73 on the left (Delta to Emirates), labels to the left in the same green; 12 airport nodes in #C475FD on the right (ATL to DXB), labels to the right. Node size grows with degree (JFK and LAX largest, DFW and DXB smallest but visible). 36 straight grey edges at low alpha, only between the columns.
      Legibility verdict: PASS

