review:
  strengths:
  - 'Nodes drawn with one sns.scatterplot over a tidy node table: hue= maps set membership,
    size= with sizes=(90, 420) maps degree, so hubs (Peat bog, Snow leopard, Natterjack
    toad) stand out and single-link nodes stay visible'
  - 'Set-colored bold column headings (Species in #009E73, Habitat in #C475FD) name
    each column and double as the color key'
  - Labels sit on the outer side of each column, clear of all edges, and the edges
    are one thin LineCollection at alpha 0.35 that stays visible in both themes
  - Correct 3200x1800 canvas and theme-correct chrome in both renders; data colors
    identical across themes
  weaknesses:
  - 'CQ-01 (code): lines 87–90 define a helper function `column_positions` for the
    node coordinates → inline it, e.g. one dict comprehension per set over `np.linspace(1,
    0, len(order))`. Likely cause: the position logic was wrapped in a def instead
    of written as a top-level statement.'
  - 'DQ-02 (both): the random habitat draw links Snow leopard to Peat bog and Wetland,
    gives Black stork Rocky scree as its only habitat, and places the Central Asian
    Snow leopard among otherwise European fauna → an edge list of real habitat associations
    for a single region (e.g. Otter–River bank, Capercaillie–Boreal forest, Black
    stork–Wetland). Likely cause: `rng.choice(len(habitat_names), …)` assigns habitats
    at random.'
  - 'Suggestion: ordering each column by degree (or by a barycentric sort) would reduce
    crossings and let the hubs read top-down.'
