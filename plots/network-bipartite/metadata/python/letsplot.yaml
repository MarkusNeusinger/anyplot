review:
  strengths:
  - 'Clean two-column bipartite layout: students left, courses right, vertically centered,
    every edge crossing between the sets'
  - Node size from degree computed with value_counts makes Machine Learning and Statistics
    read as hubs while the 2-connection nodes stay visible in both themes
  - Labels on the outer side of each column (hjust=1 / hjust=0) keep them clear of
    the edges
  - 'Theme tokens threaded through title, labels, legend and backgrounds; Imprint
    #009E73 / #C475FD identical in both renders'
  - Adaptable data block with SOURCE/TARGET constants and an edge-list DataFrame
  weaknesses:
  - 'VQ-03 (light): the Connections size-legend circles are drawn white and nearly
    vanish on the #FFFDF6 legend background; in both renders they do not match the
    colored node marks → fill them with a visible ink color (e.g. INK_SOFT) like a
    neutral node. Likely cause: scale_size legend without guide_legend(override_aes={''fill'':
    INK_SOFT, ''color'': PAGE_BG, ''shape'': 21}).'
  - 'SC-04 (both): the Connections legend lists 2, 2.5, 3, 3.5, 4, 4.5, 5 for an integer
    degree, so three entries are values no node can have → integer breaks 2, 3, 4,
    5. Likely cause: scale_size(range=[3, 8]) without breaks=[2, 3, 4, 5].'
  - 'DE-02 (both): a full four-sided panel frame encloses the network although it
    has no axes, short of the style guide''s spine rule (none or L-shaped) → no panel
    border. Likely cause: default theme panel border not set to element_blank() (panel_border=element_blank()).'
  - 'Suggestion: theme_void() as the base would drop the frame and axes in one call.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, 3200x1800; panel enclosed by a thin dark four-sided frame
