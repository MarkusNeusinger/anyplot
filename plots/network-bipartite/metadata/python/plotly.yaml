review:
  strengths:
  - Clean two-column bipartite layout with labels on the outer side of each column,
    so no label touches an edge in either theme
  - Column headings typeset in their set's Imprint color tie the heading, legend and
    nodes into one encoding
  - Edge width by sets played and node size by degree both read at a glance; theme-tuned
    edge alpha keeps the bundle lighter than the nodes in both renders
  - 'Idiomatic plotly: None-separated segments give one go.Scatter trace per weight
    class, and hovertemplate with customdata exposes each node''s degree in the HTML
    view'
  weaknesses:
  - 'CQ-01 (code): a helper function node_sizes() at lines 79–81 breaks the flat Imports
    → Data → Plot → Save structure → compute the two size lists inline (e.g. one list
    expression per column) and drop the def. Likely cause: the size scaling factored
    into a function to reuse it for both sets.'
  - 'Suggestion: the nodes render translucent, so the edge ends show as dark stubs
    inside every node circle; an explicit marker opacity of 1 would give solid nodes.'
  - 'Suggestion: the legend repeats what the colored column headings already say;
    dropping it would free the bottom band.'
