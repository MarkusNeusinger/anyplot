review:
  strengths:
  - 'Palette fixed to canonical Imprint order: Students = position 1 (#009E73 green),
    Courses = position 2 (#C475FD lavender), with no unjustified skip to position
    3'
  - Edges now rendered with geom_curve (curvature = 0.25) instead of straight segments,
    visibly reducing the crossing 'hairball' in the plot center while keeping the
    two-column bipartite structure obvious
  - Node size correctly encodes degree and edge alpha correctly encodes attendance-rate
    weight, giving the layout a built-in visual hierarchy (hub students/courses read
    larger at a glance)
  - theme_void with generous plot.margin and coord_cartesian(clip = 'off') keeps all
    16 student labels and 10 course labels fully legible with no clipping or overlap
  - Title now occupies a larger, better-balanced share of the plot width than the
    prior attempt, adding visual weight to match the rest of the composition
  - Theme-adaptive chrome (background, ink, legend, caption) flips correctly between
    light and dark renders while data colors (green/lavender) stay identical
  - 'Deterministic, KISS-structured code: single seed, no functions/classes, clear
    imports -> data -> plot -> save flow'
  weaknesses:
  - 'VQ-03/DE-03: even with curved edges, the middle of the plot still has a moderately
    dense crossing region for the ~48-80 student-course edges, making a handful of
    specific connections slightly harder to trace at a glance — acceptable but not
    fully resolved.'
  - 'DQ-01: student degree variation is fairly narrow because every student samples
    3-5 courses uniformly; a slightly wider sampling range (e.g. 2-6) would make the
    hub-vs-peripheral node-size contrast more pronounced on the student side.'
  - 'LM-02: usage is now more distinctive than the previous straight-segment version
    thanks to geom_curve, but the overall approach (curve + point + text layers) is
    still a fairly standard layered-geom composition rather than a technique unique
    to ggplot2.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "network-bipartite · r · ggplot2 · anyplot.ai" is bold, centered near the top in dark ink, spanning a comfortable share of the plot width, fully legible. A top-centered legend shows "Courses" (lavender swatch, Imprint position 2) and "Students" (green swatch, Imprint position 1). Bottom caption "Node size encodes number of connections; edge opacity encodes attendance rate" renders in muted gray, fully legible. Sixteen "Student NN" labels run down the left column in dark ink; ten course-name labels (Cell Biology, Organic Chemistry, Calculus I, Linear Algebra, Physics I, Statistics, Macroeconomics, Art History, Data Structures, World History) run down the right column in dark ink. All chrome text is clearly readable against the light background, no light-on-light issues, no clipped labels at the canvas edges.
      Data: Green nodes (#009E73) represent students, lavender nodes (#C475FD, Imprint position 2) represent courses — canonical palette order, no skipped positions. Node size scales with degree: Student 07/14/02/03/05/06 and Cell Biology/Organic Chemistry render visibly larger as hubs; World History is the smallest course node. Gently curved gray edges connect only across the two sets (never within a set), with opacity varying by attendance-rate weight (faint to darker gray). The curvature noticeably reduces the straight-line crossing clutter seen in the prior attempt, though the middle of the plot is still moderately dense. No red-green-only encoding; size, color, and opacity all carry redundant information.
      Legibility verdict: PASS — no light-on-light text observed, no clipped labels, no overlap between text/nodes/edges.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Same title, legend, caption, and node-label layout as the light render, rendered in light ink (near-white/off-white) against the dark background. Legend swatches and text remain fully legible. Caption text at the bottom is a lighter muted gray, still clearly readable.
      Data: The same green (#009E73) student nodes and lavender (#C475FD) course nodes appear, confirming the data-color palette is identical to the light render — only the chrome (background, text, edge gray) flips tone. Curved edge lines are a light gray, still distinguishable against the dark background across the full opacity range.
      Legibility verdict: PASS — no dark-on-dark text observed; all titles, labels, legend text, and caption are clearly readable against the near-black surface.
