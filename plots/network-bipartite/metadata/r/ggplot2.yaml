review:
  strengths:
  - Clean, readable two-column bipartite layout with clear left/right set separation
    (Students vs. Courses)
  - Nodes ordered by descending degree within each column so hubs cluster near the
    top, giving the layout a built-in visual hierarchy
  - Node size correctly encodes degree and edge alpha correctly encodes attendance-rate
    weight, exactly as the spec requests
  - theme_void with generous plot.margin and coord_cartesian(clip = "off") keeps labels
    from clipping while avoiding any spines or grid clutter
  - Theme-adaptive chrome (background, ink, legend) correctly flips between light
    and dark renders while data colors stay identical
  - 'Deterministic, KISS-structured code: single seed, no functions/classes, clear
    imports -> data -> plot -> save flow'
  weaknesses:
  - 'VQ-07: scale_color_manual assigns Courses = IMPRINT_PALETTE[3] (blue), skipping
    position 2 (lavender #C475FD) with no semantic justification for the skip — use
    canonical order (Students = position 1 green, Courses = position 2 lavender) unless
    a real semantic-color case applies.'
  - 'VQ-03/DE-03: with ~60-70 edges rendered as thin straight segments (linewidth
    = 0.4) between 16 students and 10 courses, the middle of the plot becomes a dense
    crossing ''hairball'' that makes individual connections hard to trace — consider
    slightly curved edges (geom_curve / bezier via a custom path), thinner alpha range
    at the low end, or bundling to reduce visual noise.'
  - 'LM-02: the implementation is solid but fairly generic ggplot2 usage (geom_segment
    + geom_point + geom_text) — consider a more distinctive touch such as highlighting
    one hub node/edge-set with a stronger color or curved edges to leverage ggplot2''s
    layered grammar more distinctively.'
  - 'DE-01/DE-02: design is clean but still close to a well-configured default — e.g.,
    the title occupies only ~44% of the plot width, leaving it visually light relative
    to the rest of the composition; slightly larger title or added visual weight on
    the legend/caption area would elevate polish further.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "network-bipartite · r · ggplot2 · anyplot.ai" centered at top in dark ink, fully legible. A top-centered legend shows "Courses" (blue swatch) and "Students" (green swatch). Bottom caption "Node size encodes number of connections; edge opacity encodes attendance rate" is rendered in muted gray, fully legible. Sixteen "Student NN" labels run down the left column in dark ink; ten course-name labels run down the right column in dark ink. All chrome text is clearly readable against the light background.
      Data: Green nodes (#009E73) represent students, blue nodes (blue palette position 3) represent courses; node size scales with degree (larger for hub students/courses, e.g. "Student 07", "Cell Biology"). Gray edges connect only across the two sets, with edge opacity varying by attendance-rate weight (faint to dark gray). No red-green-only encoding; size and color both carry information.
      Legibility verdict: PASS — no light-on-light text observed, no clipped labels.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title, legend, caption and node-label layout as the light render, but rendered in light ink (near-white/off-white) against the dark background. Legend swatches and text remain fully legible. Caption text at the bottom is a lighter muted gray, still clearly readable.
      Data: The same green (#009E73) student nodes and blue course nodes appear, confirming the data-color palette is identical to the light render — only the chrome (background, text, edge gray) flipped tone. Edge lines are a light gray, still distinguishable against the dark background at all opacity levels.
      Legibility verdict: PASS — no dark-on-dark text observed; all titles, labels, legend text and caption are clearly readable against the near-black surface.
