review:
  strengths:
  - 'Correct bipartite structure: genes and diseases arranged in two clearly separated
    columns with color coding by set membership (brand green for genes, blue for diseases)'
  - Node size encodes degree (highlights hub genes/diseases like Huntington's Disease,
    Type 1 Diabetes, Muscular Dystrophy) and edge width + opacity encode association
    strength, covering all spec-required encodings
  - 'Clean minimalist chrome: no spines, no ticks, no gridlines, unobtrusive horizontal
    top-center legend'
  - 'Theme handling is correct in both renders: data colors identical, backgrounds/text/legend
    correctly flip between light (#FAF8F1) and dark (#1A1A17)'
  - Node stroke color matches the page background, creating a halo effect that cleanly
    separates markers from overlapping edges
  weaknesses:
  - 'Noticeable unused canvas space: the two node columns and their labels occupy
    only a narrow, centered band of the 3200x1800 canvas, leaving disproportionate
    empty margins above/below the graph and to the right of the disease labels — tighten
    max_y / xlims or scale up node size, font size, and spacing to use the canvas
    more fully.'
  - With 24 total labeled nodes, label legibility gets tight at small preview sizes
    (e.g. the 400px thumbnail) — consider a modest fontsize bump for gene/disease
    labels to hold up better at reduced scale.
  - 'Library mastery is solid but generic: relies only on scatter!/lines!/text!/axislegend
    without leveraging more distinctive Makie capabilities — e.g. a single vectorized
    `linesegments!` call (with per-segment color/linewidth vectors) instead of a per-edge
    `lines!` loop would be both more idiomatic and more performant.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white, not dark.
      Chrome: Title "network-bipartite · julia · makie · anyplot.ai" centered at top in dark ink, clearly readable. Horizontal legend ("Genes" green dot, "Diseases" blue dot) directly below the title, no frame, unobtrusive. No axis ticks/labels/gridlines (appropriate for a network diagram). Gene labels (APOE, TP53, BRCA1, ...) sit to the left of the green node column; disease labels (Alzheimer's Disease, Breast Cancer, ...) sit to the right of the blue node column.
      Data: First series (genes) is anyplot brand green #009E73; second series (diseases) is Imprint blue. Edges are dark ink lines with varying opacity/width encoding association strength — faint thin lines for weak links, darker thicker lines for strong links. Node size varies with degree — larger nodes (e.g. Huntington's Disease, Type 1 Diabetes, Cystic Fibrosis, Muscular Dystrophy) are visibly hub diseases.
      Legibility verdict: PASS — all title, legend, and node-label text is clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black, not light.
      Chrome: Same title and legend layout, now rendered in light ink (#F0EFE8) against the dark background — fully legible. Legend swatches and text likewise readable. No dark-on-dark text observed anywhere (title, legend, gene labels, disease labels all clearly visible).
      Data: Node colors are pixel-identical to the light render (green genes, blue diseases) — confirms data colors are theme-invariant. Edge lines are now light-gray with the same alpha/width-based weight encoding, remaining visible against the dark canvas without looking harsh.
      Legibility verdict: PASS — all text is clearly legible in the dark theme; no dark-on-dark failures.
