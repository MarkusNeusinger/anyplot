review:
  strengths:
  - 'Correctly navigates the Highcharts core-bundle constraint: since networkgraph
    lives in an unloaded add-on module, the implementation builds the bipartite graph
    from scatter nodes plus one 2-point line series per edge — a legitimate, idiomatic
    workaround rather than a forbidden module import.'
  - Node radius encodes degree and edge opacity/lineWidth jointly encode weight, exactly
    matching the spec's hub-highlighting and weight-encoding notes.
  - 'Clean two-column left/right layout with outward-aligned data labels (align: right/left
    with offsets) keeps labels legible and clear of the dense edge tangle.'
  - Deterministic tiny LCG generates the purchase data in-browser without relying
    on a seeded RNG, satisfying reproducibility.
  - 'Theme handling is correct: identical data colors (green Users / violet Products)
    across renders, chrome (title, subtitle, labels, legend) flips correctly, backgrounds
    are the correct warm off-white / near-black.'
  weaknesses:
  - Edge density (47 edges across 22 nodes) creates a fairly busy crossing pattern
    in the middle of the chart; slight curvature or opacity tuning on the lowest-weight
    edges could reduce clutter further.
  - Design excellence is solid but not pushed to a strong focal point — no single
    hub node or edge is visually emphasized beyond size/opacity encoding (e.g., a
    highlighted top connector or annotation) to actively guide the eye.
  - Library mastery is functional rather than distinctive — the scatter+line composition
    is a sound workaround for the missing networkgraph module but doesn't showcase
    a Highcharts-unique capability beyond that.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "network-bipartite · javascript · highcharts · anyplot.ai" and subtitle in dark ink, clearly legible; 12 green diamond node labels (Users) on the left in dark bold text, 10 violet square node labels (Products) on the right in dark bold text; legend at the bottom ("Users" diamond, "Products" square) in soft dark grey. All text reads clearly against the light background.
      Data: Left column nodes are diamonds in brand green (#009E73), sized by degree (e.g., Sørensen, E. and Nakamura, Y. are visibly larger — higher degree; Novak, P. is smaller). Right column nodes are squares in the second Imprint palette hue (violet, #C475FD), also sized by degree (Webcam is smallest, Headset and Mech. Keyboard are larger). Grey edge lines of varying opacity/width connect users to products, encoding purchase weight.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title/subtitle now rendered in light ink (near-white) against the dark background, node labels in light bold text, legend text in light soft grey — all clearly legible with no dark-on-dark issues.
      Data: Node colors are identical to the light render — green diamonds (#009E73) and violet squares (#C475FD) at the same relative sizes; edge lines use the same grey tone (theme-adaptive ink-soft) at the same opacity/width pattern. No data-color drift between themes.
      Legibility verdict: PASS
