review:
  strengths:
  - 'Correct Imprint palette: authors in brand green #009E73, papers in lavender #C475FD
    (palette position 2), with theme-correct #FAF8F1/#1A1A17 backgrounds and adaptive
    chrome in both renders.'
  - Degree-encoded node sizing effectively surfaces hub authors/papers (Costa, Silva,
    Chen, Novak, Tanaka; Paper 3, Paper 7) and exposes an isolated node (Ahmed) with
    zero edges.
  - Edge weight is encoded through both line width and opacity simultaneously, a genuinely
    idiomatic per-edge visual encoding.
  - Uses Chart.js's native plugin hooks (beforeDatasetsDraw / afterDatasetsDraw) tied
    to the chart's own scale coordinate system to draw edges and labels, instead of
    reaching for an external network-layout library — a clean, idiomatic solution
    to a chart type Chart.js has no core support for.
  - 'Clean minimal chrome: axes/grid fully hidden, unboxed top legend using usePointStyle
    swatches that match the node shape.'
  - Deterministic fixed-seed LCG for reproducible data generation; concise KISS-structured
    single-file script.
  weaknesses:
  - High edge-crossing density produces a visually cluttered 'hairball' — node ordering
    on both sides is arbitrary (alphabetical/insertion order) rather than sorted to
    minimize crossings, undercutting the spec's 'keep the layout clean ... reduce
    visual clutter' requirement.
  - Node/paper name labels (14px CSS text in the 1600px mount) become very hard to
    read once the PNG is downscaled to the ~400px mobile thumbnail — increase label
    font size slightly or shorten labels for small-screen legibility.
  - Faint low-weight edges (alpha as low as ~0.195) from low-degree authors (Diaz,
    Kumar, Petrov, Ahmed) are difficult to trace individually against the dense crossing
    pattern from hub nodes.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "network-bipartite · javascript · chartjs · anyplot.ai" in bold dark ink, top-center legend "Authors" (green dot) / "Papers" (purple dot), all clearly visible against the light background. Author names (Chen, Diaz, Kumar, ...) are right-aligned left of the left column; paper names (Paper 1..16) are left-aligned right of the right column. All chrome text reads in dark ink on the cream background.
      Data: Left column = author nodes in brand green #009E73, sized by degree (Costa, Silva, Chen, Novak, Tanaka, Osei visibly larger hubs; Ahmed a tiny isolated node with no edges). Right column = paper nodes in lavender #C475FD, also degree-sized. Edges are gray lines of varying width/opacity encoding weight, connecting only across the two columns (never within a column), producing a busy but readable bipartite crossing pattern.
      Legibility verdict: PASS (all title/legend/label text is clearly readable against the light background; individual line-tracing in the densest crossing region is harder but that is a density/clutter issue, not a legibility failure).

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title and legend now rendered in light ink/white text, clearly visible against the dark background. Axis-less layout unchanged. No dark-on-dark text anywhere — labels, title, and legend text are all light-colored and legible.
      Data: Author (green #009E73) and paper (lavender #C475FD) node colors are identical to the light render — only the background and text/chrome flipped, confirming palette-position colors are theme-independent. Edge colors/opacities (drawn from t.inkSoft) correctly flipped to a light-gray tone visible against the dark background.
      Legibility verdict: PASS (no dark-on-dark or light-on-light failures found; data colors match the light render exactly).
