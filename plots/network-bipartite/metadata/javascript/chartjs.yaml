review:
  strengths:
  - Native Chart.js plugin architecture (beforeDatasetsDraw/afterDatasetsDraw) draws
    edges behind the node datasets and labels above them, so the bipartite structure
    is built entirely from core Chart.js hooks with no unpinned network-chart plugin.
  - 'All spec-required encodings are present: node color = set membership, node radius
    (scriptable pointRadius) = degree, and edge width + opacity jointly encode weight.'
  - Deterministic fixed-seed LCG generates the author-paper affiliation data in-memory
    with no external RNG dependency, satisfying CQ-02 cleanly.
  - 'Theme-adaptive chrome is correct: first series is brand green #009E73, second
    is Imprint lavender #C475FD in canonical order, identical across light/dark; edge
    and label colors derive from the theme-adaptive inkSoft token.'
  - Per-column degree-based sorting (crossing-reduction heuristic) clusters hub nodes
    near the top on both sides, turning raw insertion order into a noticeably more
    readable layout.
  weaknesses:
  - Edge crossings still form a fairly dense hairball despite the per-column degree
    sort — that heuristic only orders each side independently and doesn't minimize
    cross-column crossings; a barycenter/median-heuristic pass (even one iteration,
    alternating sides) would visibly declutter the middle of the chart.
  - There is no visual key for the weight encoding — line width and opacity vary with
    edge weight, but nothing in the chart (subtitle, small legend note, or annotation)
    tells the viewer what the thickness/opacity gradient means, so the encoding is
    only inferable from the spec, not the plot itself.
  - No node is visually called out as the focal point — with hub sizing already computed,
    a subtle stroke or bolder label on the top 1-2 hub nodes per side would give the
    chart a clearer narrative focus for DE-03.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Title "network-bipartite · javascript · chartjs · anyplot.ai" in bold dark ink, clearly legible. Legend ("Authors" green dot, "Papers" lavender dot) below the title, also dark and legible. Twelve author names (Silva, Tanaka, Costa, Chen, Novak, Osei, Petrov, Brooks, Diaz, Kumar, Duran, Ahmed) run down the left in dark gray text; sixteen paper labels (Paper 1-16, reordered by degree) run down the right, also dark gray and legible against the cream background.
      Data: Left-column nodes are brand green (#009E73), right-column nodes are Imprint lavender (#C475FD) — correct canonical palette order. Node radius visibly scales with degree (Costa, Chen, Silva, Tanaka are noticeably larger than Ahmed/Duran). Gray edges of varying width and opacity connect the two columns, brighter/thicker lines for higher-weight edges, in a dense but non-overlapping crossing pattern.
      Legibility verdict: PASS — title, legend, and all node labels are clearly readable against the light background; no light-on-light text.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Same title and legend, now rendered in light/white text, clearly legible against the dark background. Author and paper labels are light gray, fully readable with no dark-on-dark issues anywhere.
      Data: Node colors are identical to the light render — same brand green and lavender hexes, confirming positions 1-8 of the Imprint palette stay constant across themes. Edge lines are a lighter gray (derived from the theme-adaptive inkSoft token) so they remain visible against the dark background at the same relative width/opacity as the light render.
      Legibility verdict: PASS — all text and edges are clearly distinguishable from the near-black background; brand green and lavender nodes stand out well on dark.
