review:
  strengths:
  - Barycenter crossing-minimization (8 alternating sweeps) dramatically cleans up
    the edge field compared to attempt 1's fixed-order 'hairball' — the bipartite
    structure is now easy to trace.
  - Opacity floor for low-weight edges raised from ~0.29 to 0.35, so even the weakest
    connections stay legible on both backgrounds.
  - Max-weight edges are highlighted in amber with a thicker stroke, giving the chart
    a clear focal point without touching the correct Imprint categorical colors used
    for nodes.
  - 'emphasis.focus: ''adjacency'' with blur states on non-adjacent elements, plus
    an edge-weight label on hover, add genuinely distinctive echarts graph-series
    capabilities for the interactive HTML view.'
  - Degree-weighted node sizing, correct Imprint palette order (green Researchers,
    lavender Papers), and fully theme-adaptive chrome are preserved from attempt 1.
  weaknesses:
  - Amber is used to flag max-weight edges, but the style guide reserves amber for
    the warning/caution semantic role — here it functions as an unlabeled 'strongest
    connection' highlight with no legend entry explaining it, which is a minor semantic
    misuse of the anchor color.
  - Visual hierarchy communicates 'these are the strongest links' but doesn't otherwise
    interpret the network (e.g. no callout naming the most-connected hub) — DE-03
    storytelling is good but not yet at the 'excellent, immediate insight' tier.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Title "network-bipartite · javascript · echarts · anyplot.ai" centered top in dark ink; two-item legend ("Researchers" green swatch / "Papers" lavender swatch) below it; ten researcher node labels on the left, fourteen paper node labels on the right, all in dark/soft-dark text. All chrome text is clearly readable against the light background.
      Data: Researcher nodes are brand green (#009E73), paper nodes are lavender (#C475FD) — correct Imprint canonical order (position 1, position 2). Node size scales with degree (A. Chen and D. Nakamura are visibly the largest hubs). Edges are muted gray with width/opacity scaled by weight; the small subset of maximum-weight edges (weight=4) are highlighted in amber/gold, standing out clearly against the gray field. Compared to the prior attempt, the barycenter-ordered columns produce a much cleaner, more traceable edge field with far fewer crossings.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Same title, legend, and node labels now rendered in light/off-white and soft-light text against the dark surface. No dark-on-dark failures — every label, the title, and the legend text are clearly legible.
      Data: Node colors are identical to the light render (#009E73 green, #C475FD lavender) — confirms only chrome flipped. Muted edge gray brightens appropriately for dark-theme contrast; amber highlight edges remain identically colored and equally prominent as in the light render.
      Legibility verdict: PASS
