review:
  strengths:
  - Degree-weighted node sizing makes hub researchers/papers immediately visible.
  - Edge width and opacity both encode weight, giving a redundant, easy-to-scan signal
    for connection strength.
  - Node labels are positioned away from the incoming-edge side (left labels for the
    left column, right labels for the right column), cleanly avoiding edge/label overlap.
  - Correct Imprint palette usage and fully theme-adaptive chrome — both renders pass
    the light/dark readability check with identical data colors.
  weaknesses:
  - The two-column layout uses a fixed top-to-bottom node order with no crossing-minimization
    (e.g. barycenter/median heuristic reordering), producing a dense, hard-to-trace
    field of crossing edges in the middle of the chart — reorder nodes within each
    column to reduce total edge crossings.
  - Low-weight edges (opacity ~0.29 at weight=1) are quite faint against the light
    background — raise the opacity floor (e.g. to ~0.35-0.4) so even the weakest connections
    stay legible.
  - Edge styling is uniformly flat gray regardless of weight tier — consider a subtle
    color or emphasis treatment for the highest-weight edges to reinforce the storytelling.
  - 'Could leverage more distinctive echarts graph-series capabilities (e.g. emphasis.focus:
    ''adjacency'' for the interactive HTML view, or edge labels for weight values)
    to raise Library Mastery.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1, not pure white.
      Chrome: Title "network-bipartite · javascript · echarts · anyplot.ai" in dark ink, centered top; legend ("Researchers"/"Papers") below title; node labels in dark/soft-dark text on both columns. All clearly readable.
      Data: First series (Researchers) = #009E73 green, second series (Papers) = #C475FD lavender — canonical Imprint order. Node size scales with degree (hubs like A. Chen, C. Kowalski, D. Nakamura, F. Petrova, H. Singh, J. Volkov visibly larger). Edges are muted gray, width/opacity scaled by weight.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
