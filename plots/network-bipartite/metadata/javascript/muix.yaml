review:
  strengths:
  - Correct bipartite layout with clearly separated student/course columns, sorted
    by descending degree so hub nodes cluster near the top of each column
  - Node size encodes degree and edge width+opacity jointly encode weight, with a
    legend that explicitly documents both encodings, including a literal hour scale
    (2h/4h/6h)
  - Correct Imprint palette (brand green for set A, canonical position-2 lavender
    for set B), fully theme-adaptive chrome, exact mandated title format, no edge
    clipping in either render
  - Deterministic, realistic student-course enrollment dataset sized within the spec's
    10-50 nodes / 20-200 edges guidance
  - Real (non-faked) hover tooltips for the interactive HTML export, implemented via
    a wider invisible hit-path on the thin edge lines, without simulating anything
    in the static PNG
  weaknesses:
  - Every visual mark (nodes, edges, tooltip, legend) is hand-drawn raw SVG built
    only on ChartContainer's useXScale/useYScale/useDrawingArea coordinate hooks -
    no MUI X series/plot component (ScatterPlot) or built-in ChartsTooltip/ChartsLegend
    is used anywhere, so the implementation doesn't showcase any feature distinctive
    to MUI X beyond its scale-hook escape hatch
  - No isolated (zero-degree) node is included even though the spec explicitly calls
    out 'isolated nodes' as a pattern this layout should be able to reveal - add at
    least one student or course with no edges
  - With 24 node labels and 39 crossing edges, text and thin edge strokes shrink to
    only a few effective pixels once the PNG is scaled to a 400px mobile thumbnail
    - consider a slightly larger label font or a crossing-minimization ordering pass
    (rather than pure degree-sort) to keep the diagram legible at small sizes and
    honor the spec's 'keep the layout clean' note
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white, matches #FAF8F1, not pure white.
      Chrome: Bold black title "network-bipartite · javascript · muix · anyplot.ai" centered at top, clearly readable. 14 student names in dark ink on the left, 10 course names in dark ink on the right, all legible against the light background. Bottom legend explains "Students (set A) · size = enrolled courses" and "Courses (set B) · size = enrolled students" plus an edge-weight scale (2h/4h/6h) in soft grey text - all readable.
      Data: Student nodes are brand green (#009E73), course nodes are lavender/purple (matches Imprint palette position 2, #C475FD). Nodes vary in radius by degree (e.g. "Statistics" course node is visibly the largest, reflecting its high enrollment). Edges are thin grey lines with width and opacity scaled by weekly contact hours, connecting only student-to-course pairs (never within a set), fanning out across the canvas. No text overlaps another text element or a data mark; no title/label/legend is clipped at any canvas edge.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black, matches #1A1A17, not pure black.
      Chrome: Title and all student/course name labels render in light ink, clearly visible against the dark background - no dark-on-dark failures observed. Legend text at the bottom uses a lighter soft-grey tone, still legible on the dark surface.
      Data: Data colors are identical to the light render - student nodes remain the same brand green, course nodes remain the same lavender - confirming only chrome (not data colors) flipped between themes. Edge line color/opacity also reads correctly on the dark surface without disappearing or overpowering the nodes.
      Legibility verdict: PASS
