review:
  strengths:
  - 'Clean two-column bipartite layout: students on the left, courses on the right,
    every edge crossing between the sets and node labels set on the outer side of
    each column, so no label touches an edge in either render'
  - Barycentric ordering (degree first, then mean neighbour rank) keeps the hubs at
    the top and reduces edge crossings without moving any mark off a data value
  - Edge width and opacity both encode weekly contact hours, with a three-sample edge-width
    key (2h / 4h / 6h) in the bottom legend; node radius encodes degree so Statistics
    (degree 7) reads as the hub
  - Column headings carry a set-colored dot glyph in bold, a clear hierarchy above
    the regular-weight node labels; nodes get a page-colored rim so they separate
    from converging edges
  - 'Uses the MUI X v9 composition API correctly: ChartsContainer with hidden linear
    axes plus useXScale/useYScale/useDrawingArea to draw custom SVG in chart coordinates,
    skipAnimation set, theme tokens threaded through all chrome'
  - Hover tooltips on nodes (degree) and edges (hours) add inspection value in the
    interactive HTML
  weaknesses:
  - 'VQ-03, SC-02 (dark): the isolated node Talia Novak is drawn in #009E73 at fillOpacity
    0.4 with a dashed #1A1A17 rim, which leaves an ~8 px dark-green smudge that nearly
    disappears on the dark background (the spec asks that the least connected nodes
    stay visible in both themes) → full fill opacity, or a solid set-colored outline
    instead of the page-colored dashed rim. Likely cause: fillOpacity={degree ===
    0 ? 0.4 : 1} with stroke={t.pageBg} and strokeDasharray on the isolated-node circles.'
  - 'VQ-03, SC-02 (dark): the faintest edges (2 h, e.g. Diego Silva → Statistics)
    render at 1.6 px with 0.25 opacity of inkSoft and are barely distinguishable from
    the #1A1A17 background (the spec asks that the faintest edge stays visible in
    both themes) → minimum opacity about 0.4 (+0.15). Likely cause: strokeOp = 0.25
    + hRatio * 0.45.'
  - 'Suggestion: the student and course node blocks (circles + labels + tooltips)
    and the studentRadii/courseRadii and order computations are near-duplicates; mapping
    over a two-entry sets array would halve them.'
  - 'Suggestion: the bottom legend repeats the column headings'' set names; the size-encoding
    note could sit next to the headings and the bottom band keep only the edge-width
    key.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, square 2400x2400 canvas.
      Chrome: bold dark title "network-bipartite · javascript · muix · anyplot.ai" centered at the top (~50% width); bold column headings "● Student (Set A)" (green dot) and "● Course (Set B)" (purple dot); node labels in dark ink on the outer side of each column; two-line bottom legend (set swatches with "node size = degree", edge-width key 2h/4h/6h, dashed-outline note). All text readable.
      Data: 15 green (#009E73) student nodes on the left, 13 purple course nodes on the right; Statistics is the largest hub. 39 grey edges vary in width and opacity by weekly contact hours; isolated nodes Talia Novak and Advanced Robotics appear as faded dashed circles at the bottom. No axes, no grid.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, headings, node labels and legend text all flip to light ink and are clearly readable; no dark-on-dark text.
      Data: node colors identical to the light render (#009E73 green, same purple); edges flip to a light grey and remain visible except the faintest 2 h edges, which are dim. The isolated node Talia Novak (0.4-opacity green with a dashed page-colored rim) is nearly invisible on the dark surface.
      Legibility verdict: PASS (text); the faint isolated node and faintest edges are an element-visibility issue, not a text one
