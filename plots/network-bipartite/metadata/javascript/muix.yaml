review:
  strengths:
  - 'Clean two-column bipartite layout: students on the left, courses on the right,
    every edge runs between the columns and none within a set; no axes or grid, as
    the characteristic section asks'
  - 'Node size encodes degree (radius 12-26 CSS px): Statistics, the 7-student hub,
    stands out clearly while the degree-2 nodes stay well visible in both themes'
  - Edge width and opacity both encode weekly contact hours (2-6 h) with a three-sample
    edge-width legend; the faintest 2 h edges remain visible on both backgrounds
  - Labels sit on the outer side of each column (right-aligned left of students, left-aligned
    right of courses), so no label touches an edge
  - Node order is chosen by degree with a barycentre tie-break against the other column,
    which places hubs at the top and keeps edge bundles readable
  - Page-coloured halos around nodes separate the converging edge ends from the node
    fill; isolated nodes are drawn as hollow rings and explained in the legend
  - Composes the chart with ChartsContainer and the useDrawingArea/useXScale/useYScale
    hooks, a community MUI X composition idiom, with skipAnimation and theme tokens
    throughout
  - Real hover tooltips in the HTML output on both nodes (degree) and edges (student
    → course, hours) via wide transparent hit lines
  weaknesses:
  - 'Suggestion: the bottom legend repeats the two coloured column headings ("Student
    (Set A)", "Course (Set B)"); a single line explaining node size = degree, edge
    width = hours and the hollow ring would carry the same information with less repetition.'
  - 'Suggestion: student and course blocks are computed twice side by side (order,
    radii, render loops, lines 128-182 and 270-342); folding them into one per-set
    array would shorten the file without changing the render.'
  - 'Suggestion: drawing the nodes as a native ScatterChart series inside the ChartsContainer
    would show more of MUI X''s own series API than hand-placed SVG circles.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, no axes, no grid.
      Chrome: title "network-bipartite · javascript · muix · anyplot.ai" bold dark ink centred at top (~50% width); bold column headings "● Student (Set A)" (green bullet) and "● Course (Set B)" (lavender bullet); 15 student and 12 course labels in dark ink on the outer sides of the columns; two-line bottom legend (set swatches with "node size = degree", edge-width samples 2h/4h/6h, "Hollow ring = isolated node"). All text readable.
      Data: left column of 15 brand-green #009E73 nodes, right column of 12 lavender #C475FD nodes, sized by degree (Statistics clearly the largest hub). ~45 grey straight edges whose width and opacity grow with weekly hours; crossings in the middle band as expected. Talia Novak and Advanced Robotics drawn as hollow rings at the bottom of each column.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, headings, node labels in light ink; legend text in light soft ink. No dark-on-dark text anywhere.
      Data: node colours identical to the light render (green #009E73, lavender #C475FD); edges switch to the light soft-ink tone, still thinner and lighter than the nodes, faintest 2 h edges visible; hollow rings visible.
      Legibility verdict: PASS
