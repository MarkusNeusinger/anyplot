review:
  strengths:
  - 'Correct Imprint palette usage: Close Price uses brand green #009E73 (position
    1), EMA (12-day) and EMA (26-day) use canonical positions 2 and 3 (lavender, blue),
    and the crossover markers use the semantic exception well (green for the bullish
    Golden cross, matte red for the bearish Death cross).'
  - 'Idiomatic MUI X usage: ChartsReferenceLine used for crossover annotations, per-series
    sx targeting differentiates line weights (close price 3.5px vs EMA 2px), matching
    the spec''s ''EMA lines should be slightly thinner'' requirement.'
  - Deterministic LCG-seeded random walk produces a realistic 120-day price series;
    crossover detection caps the highlighted signals to 4 with a MIN_GAP_DAYS spacing
    rule so labels never collide with each other.
  - Theme-adaptive chrome and backgrounds are correct and identical in structure between
    light (#FAF8F1) and dark (#1A1A17) renders; data colors are identical across themes.
  weaknesses:
  - 'CRITICAL (both renders): the rotated Y-axis title ''Price (USD)'' directly overlaps
    the ''$158'' tick label — verified by cropping both plot-light.png and plot-dark.png
    around that gridline. The axis-label glyphs visually cross through the ''1'' and
    ''5'' of ''158'', making both the axis title and that tick value illegible at
    that point. Root cause: the LineChart''s left padding (padding.left = 44 in the
    outer Box) does not reserve enough horizontal room for the rotated axis label
    lane once it sits directly adjacent to 4-character dollar-formatted tick labels
    ($160, $158, etc.). Fix: increase the left margin reserved for the y-axis (e.g.
    raise padding.left and/or pass an explicit `margin` prop to `<LineChart>` with
    a larger `left` value, or add spacing via the yAxis label offset) so the rotated
    ''Price (USD)'' title clears the tick-label column entirely in both themes.'
  - This is the kind of overlap that costs points twice — it is both a legibility
    failure (a tick value becomes unreadable) and a layout/margin miscalculation,
    not just a cosmetic proximity issue.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — correct, not pure white.
      Chrome: Title "indicator-ema · javascript · muix · anyplot.ai" in bold dark ink, top-left, clearly readable. X-axis "Trading Date" and Y-axis "Price (USD)" labels present with units. Horizontal-only grid lines, subtle gray, non-competing with data. Legend row (Close Price / EMA 12-day / EMA 26-day) at top, all readable with correct color swatches.
      Data: Close Price line in brand green (#009E73), EMA (12-day) in lavender (#C475FD), EMA (26-day) in blue (#4467A3) — thick green close line, thinner EMA lines as required by spec. Two dashed vertical reference lines labeled "Death cross" (red) and "Golden cross" (green) mark EMA crossovers, correctly colored per bearish/bullish semantics.
      CRITICAL ISSUE FOUND: cropping the region around the "$158" y-axis gridline shows the rotated "Price (USD)" axis title text directly overlapping and crossing through the "$158" tick label — both texts become illegible at that intersection point. This is a genuine overlap, not a proximity effect (confirmed via 3x-zoomed crop).
      Legibility verdict: FAIL (axis-label/tick-label overlap at "$158")

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — correct, not pure black.
      Chrome: Title in light ink (near-white), fully readable against the dark background. Axis labels and tick labels rendered in light ink, all legible elsewhere. Grid lines subtle light gray. Legend text legible with same color swatches as light render.
      Data: Confirmed identical data colors to the light render (brand green, lavender, blue) — only chrome flipped as required. Crossover reference lines and labels also correctly colored and positioned identically to the light render.
      CRITICAL ISSUE FOUND: the same "Price (USD)" / "$158" overlap reproduces identically in the dark render (confirmed via 3x-zoomed crop) — same root cause, same severity.
      Legibility verdict: FAIL (axis-label/tick-label overlap at "$158", same as light render)
