review:
  strengths:
  - 'The CRITICAL y-axis title / tick-label overlap flagged in the previous review
    is fully fixed: a dedicated column now renders the rotated "Price (USD)" title
    well clear of the $-formatted tick labels, verified via zoomed crops of both the
    light and dark renders around the former collision point ($158).'
  - 'Correct Imprint palette usage: Close Price uses brand green #009E73 (position
    1), EMA (12-day) and EMA (26-day) use canonical positions 2 and 3 (lavender, blue),
    and the crossover reference lines correctly apply the semantic exception (green
    for bullish "Golden cross", matte red for bearish "Death cross"), each reinforced
    with a text label so meaning isn''t color-alone.'
  - Idiomatic use of ChartsReferenceLine for crossover annotations with a sensible
    cap (max 4 highlighted crossovers) and a minimum day-gap rule so neighboring crossover
    labels never collide with each other.
  - Deterministic LCG-seeded random-walk price series plus a correctly implemented
    recursive EMA produce a realistic, feature-complete technical-indicator dataset
    showing both a bearish (death cross) and bullish (golden cross) signal.
  - 'Line-weight hierarchy matches the spec: Close Price at 3.5px is visually prominent
    while both EMA lines are thinner at 2px.'
  weaknesses:
  - The y-axis title is rendered via a hand-rolled column outside <LineChart> rather
    than MUI X's built-in yAxis label prop — a functional and well-reasoned workaround
    for the library's fixed label-offset behavior, but non-idiomatic; also the y-axis
    uses 20 one-dollar gridlines over a $19 range, which is denser than needed — coarser
    $2 ticks would read cleaner.
  - 'Design polish is solid but stays close to a well-configured default: grid/spine
    treatment and typography don''t go much beyond the baseline. More visual hierarchy
    (e.g. a subtle shaded band around the EMA pair, or de-emphasizing the noisiest
    early stretch) would strengthen Design Excellence further.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 - correct, not pure white.
      Chrome: Title "indicator-ema · javascript · muix · anyplot.ai" in bold dark ink, top-left, clearly readable, occupying well under half the canvas width. X-axis "Trading Date" and Y-axis "Price (USD)" labels present with units; the y-axis title now sits in its own column, fully clear of the $-formatted tick labels (verified via a zoomed crop around the former $158 collision point - no overlap). Horizontal-only grid lines, subtle gray, non-competing with data. Legend row (Close Price / EMA 12-day / EMA 26-day) at top with correct color swatches, followed by "Death cross" (red) and "Golden cross" (green) labels tied to dashed vertical reference lines - no collision between legend and crossover labels.
      Data: Close Price line in brand green (#009E73, thick 3.5px), EMA (12-day) in lavender (#C475FD, 2px), EMA (26-day) in blue (#4467A3, 2px) - thickness hierarchy matches the spec's "EMA lines should be slightly thinner" requirement. Crossover reference lines correctly colored per bearish/bullish semantics.
      Legibility verdict: PASS (previous critical overlap is resolved; all text readable)

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 - correct, not pure black.
      Chrome: Title in light ink (near-white), fully readable. Axis labels and tick labels rendered in light ink, all legible; the y-axis title/tick-label separation holds identically to the light render - re-verified via the same zoomed crop, no dark-on-dark or overlap issues. Grid lines subtle light gray. Legend and crossover labels legible with the same layout as the light render.
      Data: Confirmed identical data colors to the light render (brand green, lavender, blue) - only chrome flipped as required. Crossover lines and labels correctly colored and positioned identically to the light render.
      Legibility verdict: PASS (all text readable, no dark-on-dark failures)
