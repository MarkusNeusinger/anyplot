  strengths:
  - 'Price line clearly dominates (3.5 px vs 2 px EMAs) and the EMAs behave like their
    periods: the 12-day turns quickly, the 26-day is smoother and lags'
  - Crossover triangles sit exactly where the EMAs meet (segment intersection computed,
    not snapped to a day), small and outlined in the page colour so the lines stay
    visible
  - Idiomatic MUI X v9 composition (ChartsDataProvider/ChartsWrapper/ChartsSurface)
    with a custom marker layer drawn through useXScale/useYScale, plus ChartsAxisHighlight
    and an axis tooltip for the interactive HTML
  - Theme tokens threaded through every chrome element; data colours identical in
    both renders
  weaknesses:
  - 'Suggestion: the y-axis title "Close (USD)" also carries the two EMAs; a "Price
    (USD)" title would describe the whole axis.'
  - 'Suggestion: a stock ticker or company context in the subtitle would make the
    scenario more concrete.'
