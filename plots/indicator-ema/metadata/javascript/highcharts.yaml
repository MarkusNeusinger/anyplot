review:
  strengths:
  - Correct Imprint palette application with proper semantic-exception use of matte
    red for the bearish death-cross marker and brand green reused for the bullish
    golden-cross marker, matching the finance convention (profit/up → green, loss/down
    → red)
  - Crossover highlighting (golden cross / death cross triangle markers) directly
    fulfills the spec's optional 'highlighting crossover points' recommendation and
    gives the chart a clear focal point / data story
  - Line-width hierarchy (close price lineWidth 3 vs EMA lines lineWidth 2) matches
    the spec's explicit guidance that EMA lines should be slightly thinner than the
    price line
  - Deterministic, piecewise-drift synthetic price series (downtrend → uptrend → rollover)
    produces a realistic, non-trivial pattern with genuine EMA crossovers rather than
    a flat random walk
  - Theme-adaptive chrome correctly threaded through title, axes, grid, and legend
    on both light and dark renders — no illegible or wrong-theme elements
  - All font sizes explicitly set (title 22px, axis title 16px, ticks/legend 14px)
    with a well-proportioned, uncluttered canvas layout
  weaknesses:
  - 'Tooltip is fully disabled (tooltip: { enabled: false }) — this has no effect
    on the static PNG (tooltips never render in a headless screenshot) but strips
    a valuable feature from the interactive plot-{theme}.html output; a financial
    indicator chart benefits from hover detail showing date/close/EMA values. Enable
    the tooltip (with a formatter for currency + date) so the HTML view stays useful.'
  - The death-cross marker color is hardcoded as the literal string "#AE3030" instead
    of referencing t.palette[4] — same visual result today, but bypasses the token
    system and could drift silently if the palette is ever revised.
  - Tick marks are left at Highcharts defaults on both axes rather than trimmed per
    the style guide's decoration-removal checklist (keep tick labels, remove the small
    tick marks themselves) — a minor polish gap in visual refinement.
  - Grid/spine treatment is standard Highcharts styling (single horizontal grid, default
    axis lines) rather than an especially refined custom look — there's room to push
    Design Excellence further with more deliberate chrome styling.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "indicator-ema · javascript · highcharts · anyplot.ai" in bold dark ink at top-center, clearly readable. Y-axis title "Price (USD)" rotated on the left in muted dark gray. Dollar-formatted y tick labels ($134-$164) and date x tick labels (Jan 1 - Apr 29) are dark and fully legible against the light background. Subtle horizontal gridlines only. Legend sits directly below the plot with 5 entries (Close price, EMA 12, EMA 26, Golden cross, Death cross), all readable.
      Data: Close price line in brand green (#009E73, thicker), EMA 12 in lavender/purple (#C475FD), EMA 26 in blue (#4467A3) — matches Imprint canonical order with the brand green correctly first. One green upward triangle marks the golden cross (~Feb 11) and one red downward triangle marks the death cross (~Apr 15), using the matte-red semantic anchor for the bearish signal.
      Legibility verdict: PASS — all text is dark-on-light and clearly readable, no overlaps.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Title, y-axis title, and all tick/legend labels have flipped to light ink tones (off-white/light gray) and remain fully readable against the dark background. Gridlines are still subtle but visible.
      Data: Close price (green), EMA 12 (lavender), EMA 26 (blue), golden-cross (green triangle), death-cross (red triangle) are pixel-identical in hue to the light render — only the chrome (background, text, grid) flipped.
      Legibility verdict: PASS — no dark-on-dark failures; every label is clearly visible against the near-black surface, and the brand green / matte red data marks read well on the dark surface.
