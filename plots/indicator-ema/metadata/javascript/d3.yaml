review:
  strengths:
  - 'Correct semantic color use: the close price is rendered as a neutral reference
    line (theme-adaptive ink, 0.5 opacity) while the two EMA signal lines use the
    Imprint palette, first-series green (#009E73) for EMA 12 and lavender (#C475FD)
    for EMA 26 — exactly the ''baseline/reference line'' semantic-anchor pattern from
    the style guide.'
  - Crossover markers (amber-stroke circles) highlight golden-cross/death-cross events,
    directly answering the spec's suggestion to highlight crossover points and adding
    real analytical value.
  - EMA lines are correctly thinner (2.5px) than the price line (3.5px), matching
    the spec's explicit guidance to avoid visual clutter.
  - 'Clean, minimal chrome: y-axis-only subtle gridlines, ink-soft L-shaped axis,
    generous margins, and a dynamically-measured legend (via getBBox) that avoids
    item overlap regardless of label length.'
  - 'Fully deterministic and reproducible: seeded LCG random walk plus the standard
    recursive EMA formula, no external data.'
  - Title fontsize scales via the linear baseline-char formula, keeping the long mandated
    title readable without overflow.
  - 'Both themes are correctly rendered: data colors (green/lavender/ink) are identical
    across light and dark, only chrome (background, text, grid) flips, with no dark-on-dark
    or light-on-light failures.'
  weaknesses:
  - 'Design storytelling is good but not exceptional: the crossover circles mark golden/death-cross
    events but carry no label — a small annotation (e.g. ''Bullish cross'') on one
    or two crossovers would let a viewer grasp the significance immediately instead
    of needing outside domain knowledge.'
  - Title occupies only ~40-45% of canvas width at the current fontsize; not an overflow/clipping
    problem, but a slightly larger title would use the generous top-margin whitespace
    more effectively and land closer to the guide's ~50-70% target for a custom-prefixed
    title.
  - Library mastery is solid (data joins, curveMonotoneX, tickSize gridline trick,
    dynamic getBBox legend) but stays within standard idiomatic D3 usage rather than
    a technique that is hard to replicate in a declarative charting library — e.g.
    a custom crossover glyph with a leader line would push this further.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1), matches spec — not pure white.
      Chrome: Title "NovaTech Inc. (NVTC) · indicator-ema · javascript · d3 · anyplot.ai" in bold dark ink, clearly visible. Axis labels ("Trading date", "Closing price (USD)") and tick labels in soft ink, all readable against the light background. Legend row above the chart with three swatches (gray line, lavender line, green line) and labels, all legible. Subtle horizontal gridlines only.
      Data: Close price drawn as a semi-transparent gray line (0.5 opacity), EMA 26 (long) in lavender (#C475FD), EMA 12 (short) in brand green (#009E73) — first series is correctly #009E73. Three amber-stroke circles mark short/long EMA crossover points.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17), matches spec — not pure black.
      Chrome: Title, axis labels, and tick labels are rendered in light ink tones, clearly legible against the dark background — no dark-on-dark failures observed. Gridlines remain subtle. Legend text is light and readable.
      Data: Identical colors to the light render — gray reference line, lavender EMA 26, green EMA 12 (#009E73), amber crossover circles. Confirms the Imprint data colors do not shift between themes, only the chrome (background/text/grid) flips.
      Legibility verdict: PASS
