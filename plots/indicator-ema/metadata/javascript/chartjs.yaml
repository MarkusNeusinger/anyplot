review:
  strengths:
  - Correctly overlays two EMA periods (12, 26) on the close price, with EMA lines
    visibly thinner (2.2px) than the price line (3px), matching the spec's guidance
    to avoid visual clutter
  - Highlights golden-cross/death-cross points with distinct green/matte-red markers
    with a page-background stroke for definition — a genuine data-storytelling touch
    that draws the eye to the actionable trading signal instead of leaving it a flat
    triple-line chart
  - 'Deterministic fixed-seed LCG data generation, clean mount-node contract usage
    (single canvas append, animation: false), and idiomatic use of Chart.js dataset
    `order` to control both z-index layering and legend grouping'
  - Both light and dark renders are fully legible with correctly themed chrome (title/axis/tick
    colors from tokens); data colors (ink price line, green/blue EMAs) are identical
    across themes as required
  - Y-axis tick callback formats values as currency ($165) and axis titles are descriptive
    with units (Price (USD), Trading Date)
  weaknesses:
  - The two EMA series use palette[0] (green, short) and palette[2] (blue, long),
    skipping palette[1] (lavender) — deviates from the Imprint canonical 'positions
    1→N in order' default for categorical series. Either use palette[0]/palette[1]
    in canonical order, or keep the blue-for-slower-EMA convention but note it's an
    intentional finance-convention exception
  - The death-cross marker color is hardcoded as the literal string "#AE3030" instead
    of referencing `t.palette[4]`, which already holds that exact matte-red value
    — the token should be the single source of truth so the hex can't drift out of
    sync with the palette
  - Legend order renders as 'EMA 12, EMA 26, Close' (reversed from a reader's expected
    primary-first order) because the `order` field used for z-index also reorders
    the legend — consider setting `order` only via a dedicated legend `labels.sort`
    or accepting the current order is a minor readability nit, not a defect
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "indicator-ema · javascript · chartjs · anyplot.ai" in bold dark ink, centered top, comfortably under ~50% of plot width. Legend top-right reads "EMA 12 — EMA 26 — Close" in dark ink with line-style swatches. X-axis labeled "Trading Date" with tick labels ("Jan 2", "Jan 18", ... "May 31") in medium-gray, horizontal, no rotation. Y-axis labeled "Price (USD)" with dollar-formatted ticks ($145–$170) in medium-gray. Subtle horizontal gridlines only. All chrome text is clearly legible against the light background.
      Data: Close price is a bold black/ink line (thickest, most prominent, ~120 points, Jan–Jun). EMA 26 (long) is a blue line (#4467A3, palette[2]). EMA 12 (short) is a green line (#009E73, palette[0]), both visibly thinner than the price line. A green dot marks an early golden cross (short crosses above long) near the start of the series; a red/matte-red dot marks a death cross (short crosses below long) around mid-May, both with a light page-background stroke for definition.
      Legibility verdict: PASS — all text is dark-on-light and clearly readable, no overlaps.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title and legend, now in light/off-white text (#F0EFE8-ish), clearly visible against the dark background. Axis labels, tick labels, and gridlines flip to light-gray tones as expected. Layout is otherwise identical to the light render.
      Data: Close price line flips to white/off-white (ink token, theme-adaptive) while EMA 26 (blue) and EMA 12 (green) retain the exact same hex values as the light render — correct Imprint-palette behavior (only chrome flips, data colors stay constant). The same golden-cross (green) and death-cross (red) markers appear at the same positions, now stroked with the dark page background.
      Legibility verdict: PASS — no dark-on-dark failures; all title/axis/tick text is light-on-dark and clearly readable, data lines remain distinguishable from the near-black background.
