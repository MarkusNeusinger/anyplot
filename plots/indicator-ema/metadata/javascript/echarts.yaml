review:
  strengths:
  - Correctly implements 12/26-period EMAs with a proper SMA-seeded warm-up and exponential
    recursion formula
  - Distinct blue (#4467A3) short EMA and ochre (#BD8233) long EMA colors directly
    follow the spec's explicit color guidance, with the price line kept in brand green
  - EMA lines are rendered thinner (1.75px) than the price line (3.5px), exactly matching
    the spec's requested visual hierarchy
  - Golden-cross/death-cross detection with semantically colored, orientation-differentiated
    triangle markers (lime up / matte-red down) directly fulfills the spec's 'consider
    highlighting crossover points' suggestion and is CVD-safe via redundant shape
    encoding
  - Clean theme-adaptive chrome in both renders — all text legible, backgrounds correctly
    warm off-white / near-black, data colors identical across themes
  - Deterministic LCG-seeded synthetic data with three drift regimes naturally produces
    both a bullish and a bearish crossover
  weaknesses:
  - EMA line colors skip Imprint palette position 2 (lavender) in favor of blue/ochre
    for a finance-convention semantic match — defensible given the spec's explicit
    suggestion, but worth confirming this reading holds up in future reviews
  - Crossover markers reuse a green-family hue (lime, palette position 8) close to
    the already-used brand green of the Close line; distinguishable here only because
    it's a single point marker, but keep an eye on this if more green-family series
    are added later
