      Data: close price as a thick #009E73 line, EMA 12 thinner #4467A3 blue, EMA 26 thinner #BD8233 ochre; six hollow ring crossover markers (page-colored fill, dark outline) at the EMA intersections. A sharp ~15 % one-day drop in late April and a jump in late May are visible.
