  strengths:
  - Price line at line_width 6 against EMA lines at 3.5 keeps Close price the dominant
    series, with EMA 12 (#C475FD) and EMA 26 (#4467A3) clearly told apart in both
    themes
  - EMAs computed with pandas ewm(span=..., adjust=False); EMA 12 hugs the price and
