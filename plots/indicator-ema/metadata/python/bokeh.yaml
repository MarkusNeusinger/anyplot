review:
  strengths:
  - 'The close price line (width 6, #009E73) dominates, and the two EMAs at width
    3.5 in #4467A3 and #BD8233 can be told apart in both themes, as the Notes ask'
  - The EMAs are computed with pandas ewm(span=12/26, adjust=False); EMA 12 follows
    the price closely and turns first, EMA 26 is smoother and lags, both stay at the
    level of recent prices
  - Crossover markers sit at the exact linear intersection of the two EMA segments
    (lines 57-64), drawn as small hollow rings in the page color so the lines beneath
    stay visible
  - An explicit bokeh Legend model placed outside the plot area on an elevated background
    keeps the data region clear; every EMA is labelled with its period
  - 'Chrome is fully theme-tokenised: titles, ticks, axes, grid and legend all flip
    cleanly between #FAF8F1 and #1A1A17 while the data colors stay identical'
  weaknesses:
  - 'VQ-07 (both): the two EMAs use Imprint positions 3 and 4 (#4467A3, #BD8233) and
    skip position 2 (#C475FD); EMA labels imply no real-world color, so the semantic
    exception does not apply → canonical order: price #009E73, EMA 12 #C475FD, EMA
    26 #4467A3. Likely cause: IMPRINT_PALETTE[2] / IMPRINT_PALETTE[3] indices on lines
    86-87.'
  - 'VQ-02 (both): the legend''s line glyphs run right up to their labels (the ''Close
    price'' line touches the ''C'') with no visible gap → about 15-20 px between glyph
    and label (+10 to +15 px). Likely cause: default label_standoff with glyph_width=60;
    set p.legend.label_standoff.'
  - 'DQ-02 (both): the synthetic series shows a one-day ~15 % cliff in late April
    and a ~8 % one-day jump in late May that come from the piecewise multipliers ending
    abruptly, which reads as a generation artifact rather than a plausible stock →
    generate the trends as drifts in the returns so the series stays continuous. Likely
    cause: price[40:80] *= linspace(1, 1.15) and price[80:100] *= linspace(1, 0.92)
    on lines 44-45.'
  - 'Suggestion: a HoverTool showing date, close and both EMA values would add value
    in the HTML view.'
