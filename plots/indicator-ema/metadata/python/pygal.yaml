review:
  strengths:
  - Price drawn as the dominant solid green line with thinner EMAs on the same price
    axis; the 12-day EMA dashed blue, the 26-day solid ochre, and the legend names
    each period
  - EMAs computed with pandas ewm(span, adjust=False) and crossovers found with a
    vectorized sign change of the EMA gap
  - A range-bound crude-oil market with a late breakout shows both the repeated crossovers
    of a sideways stretch and the EMAs fanning out in a trend
  - Theme tokens threaded through Style including guide_stroke_color, so grid and
    text read in both themes
  - 'Idiomatic pygal: per-series stroke_style dasharray, a dot-only series via stroke=False,
    x_labels_major, native HTML tooltips'
  weaknesses:
  - 'SC-02 (both): the crossover dots are drawn at the close price of the crossing
    day (e.g. about 77.2 on Jan 05 while the EMAs cross near 78.0), not where the
    short EMA crosses the long one (C5) → place each dot on the EMA value at the crossing
    (the 26-day EMA or the midpoint of the two EMAs on that day). Likely cause: crossovers
    = df[CLOSE].where(crossed).'
  - 'Suggestion: the y range floored to 70 leaves an empty band below the lowest close
    of about 72.7; a floor of 72 would use the canvas more fully.'
  - 'Suggestion: the four-entry bottom legend spreads over the full width; tighter
    columns would keep the entries together.'
