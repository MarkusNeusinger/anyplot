review:
  strengths:
  - 'The price line (size 1.0, #009E73) is clearly dominant over the two thinner EMA
    lines (size 0.6, #C475FD and #4467A3), so the hierarchy the spec asks for reads
    at a glance in both themes'
  - 'EMAs are computed with pandas ewm(span, adjust=False), and they behave like their
    periods: EMA-12 hugs and turns with the price, EMA-26 is smoother and turns later,
    and both stay at the level of recent prices'
  - 'Idiomatic grammar-of-graphics construction: wide-to-long melt, one geom_line
    mapped to color and size by series, scale_color_manual/scale_size_manual with
    limits from the data so the price gets #009E73, and guides(size=None) to merge
    the line legend'
  - 'Crossover markers in Imprint #BD8233 with a page-colored outline stay small enough
    that the lines beneath stay visible, and sit on the short EMA at the crossing
    dates'
  - 'Theme tokens are threaded through every chrome element; both renders are fully
    readable with correct #FAF8F1 / #1A1A17 surfaces and identical data colors'
  - scale_x_datetime(date_breaks='1 month', date_labels='%b %Y') gives clean monthly
    ticks for the 120 business days
  weaknesses:
  - 'SC-02 (both): a crossover marker is drawn on 3 Jan 2024 (index 1), where the
    two EMAs only leave their shared starting value (sign of EMA-12 − EMA-26 goes
    0 → −) rather than cross; it overlaps the genuine crossover dot on 4 Jan → highlight
    only real sign flips between −1 and +1 (one spurious marker fewer). Likely cause:
    np.diff(np.sign(...)) != 0 counts the change from the zero at index 0 as a crossover;
    drop zero signs (e.g. compare signs from index 1 on, or require sign[i-1] * sign[i]
    < 0).'
  - 'Suggestion: the ''Series'' legend title is generic; a title such as ''Line''
    or dropping it would read slightly cleaner.'
  - 'Suggestion: the vertical spacing between legend keys is generous; tightening
    legend_key_spacing_y would make the legend more compact next to the panel.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across plot and panel; legend box on the elevated #FFFDF6 surface with a thin INK_SOFT frame.
      Chrome: bold near-black title "indicator-ema · python · plotnine · anyplot.ai" (~53% of the width), axis titles "Date" and "Close price (USD)" in dark ink, monthly x ticks Jan 2024–Jun 2024 and y ticks 130–160 in dark gray, subtle major grid, left and bottom axis lines only. All text readable.
      Data: thick #009E73 close-price line falling from ~163 to ~125 then recovering to ~137; thinner #C475FD EMA-12 and #4467A3 EMA-26 overlaid; a faint blue ribbon between the two EMAs; six #BD8233 crossover dots with page-colored outlines (two overlapping at the very start, then late Jan, early Apr, mid May, mid Jun). Legend "Series" (Close price (USD), EMA-12, EMA-26) and "Signal" (EMA crossover).
      Legibility verdict: PASS

