review:
  strengths:
  - Tidy melt into one long frame with color and size both mapped to the series, so
    scale_size_manual makes the price line (1.0) visibly thicker than both EMAs (0.6)
    and guides(size=None) keeps a single combined legend — idiomatic grammar-of-graphics
    layering
  - 'EMAs come straight from pandas ewm(span=…, adjust=False): EMA-12 hugs the price
    and turns early, EMA-26 is smoother and lags, neither drifts from the price level,
    exactly the behavior the spec''s characteristic section asks for'
  - 'Imprint palette in canonical order (price #009E73, EMA-12 #C475FD, EMA-26 #4467A3)
    with identical data colors in both renders; every chrome element (title, axis
    titles, ticks, grid, legend box) threads the theme tokens, so both themes read
    cleanly'
  - Crossover markers in Imprint ochre with a thin page-colored outline are small
    and sit on the short EMA at each crossing, leaving the lines beneath visible
  - scale_x_datetime with monthly breaks and '%b %Y' labels gives an uncluttered,
    readable date axis
  weaknesses:
  - 'SC-04 (both): the legend explains the three lines but not the ochre crossover
    dots, so the reader has to guess what the six amber markers mean → give the dots
    a legend entry such as "EMA crossover" (for example by mapping a constant label
    to fill on the geom_point layer with scale_fill_manual). Likely cause: geom_point(crossovers,
    …) sets fill as a fixed parameter outside aes(), so no guide is built for it.'
  - 'CQ-04 (code): lines 75–83 write out an 8-line Python loop with two compound conditions
    to find sign changes of ema_short − ema_long → `np.flatnonzero(np.diff(np.sign(wide[short_label]
    - wide[long_label])) != 0) + 1` (numpy), one line with the same indices. Likely
    cause: the crossover detection was written element by element instead of vectorized.'
  - 'Suggestion: the two crossover dots at the very first dates come from both EMAs
    starting at the same first price and sit almost on top of each other; skipping
    the warm-up stretch for crossover detection would leave only the meaningful crossings.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across canvas and panel, not pure white.
      Chrome: bold dark title "indicator-ema · python · plotnine · anyplot.ai" centered (~53% of width); axis titles "Date" and "Close price (USD)" in dark ink; monthly tick labels Jan 2024–Jun 2024 and y ticks 130–160 in soft ink; subtle grid; left and bottom axis lines only; legend "Series" on the right in an elevated box with a thin border. All text readable, no clipping.
      Data: thick green #009E73 close-price line (120 business days, ~165 down to ~125, recovering to ~137), thinner lavender EMA-12 and blue EMA-26 lines, a faint blue-grey ribbon filling the gap between the two EMAs, and six small ochre crossover dots with page-colored outlines (two at the very start, one late January, early April, mid May, mid June).
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17, not pure black.
      Chrome: title in near-white, axis titles light, tick labels light grey, grid subtle but visible, legend box on a slightly elevated dark fill with light text. No dark-on-dark text anywhere.
      Data: identical colors to the light render — green price, lavender EMA-12, blue EMA-26 (lower contrast than on light but clearly visible), the ribbon now a dark blue-grey, ochre crossover dots. Brand green reads well.
      Legibility verdict: PASS
