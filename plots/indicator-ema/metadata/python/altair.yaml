review:
  strengths:
  - Tidy long-format data via df.melt feeding one mark_line layer whose color and
    strokeWidth are both scale-encoded by series, so the price line (1.6) stays visibly
    heavier than the two EMAs (1.0) in idiomatic declarative Altair
  - 'EMAs computed with pandas ewm(span=12/26, adjust=False): EMA 12 hugs the price
    and turns early, EMA 26 is smoother and turns later, both stay at the level of
    recent prices'
  - Crossover diamonds are computed from the sign change of EMA12 - EMA26 and drawn
    small (size 60) in Imprint position 4, so the lines beneath stay visible
  - 'Theme tokens threaded through axis, title, legend and view: both renders are
    fully legible on #FAF8F1 and #1A1A17 with identical data colors'
  - Formatted tooltips (date, series, $ value; crossover date) add real inspection
    value in the HTML output
  - Column constants escaped once with a translate table and every encoding given
    type= and title=, as the library prompt asks
  weaknesses:
  - 'VQ-05 (both): the plot area fills only about 65 % of the 3200 px canvas width,
    leaving wide empty bands left and right of the chart and legend → the landscape
    inner view of the library prompt, width=620 (+100). Likely cause: .properties(width=520).'
  - 'SC-04 (both): the brown crossover diamonds have no legend entry, so the static
    render never says what they mark → add an ''EMA crossover'' entry (for example
    a shape or color legend on the marker layer). Likely cause: crossover_markers
    uses a fixed color= instead of an encoded field with a legend.'
  - 'Suggestion: label the three closely spaced late-April crossovers less densely,
    for example by showing only the crossovers that persist for more than a day.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole 3200x1800 canvas (padding in PAGE_BG), no pure white.
      Chrome: centered bold title "indicator-ema · python · altair · anyplot.ai" in dark ink; axis titles "Date" and "Price (USD)" in dark ink, tick labels (monthly "Jan 2024" ... "Jun 2024", 75-110 in steps of 5) in soft ink, all readable; subtle grid; no view frame; legend "Series" at right in an elevated box with a soft outline.
      Data: Close Price in #009E73 as the heaviest line, EMA 12 in #C475FD and EMA 26 in #4467A3 thinner; eight small brown (#BD8233) diamonds at the EMA crossovers (early Jan, late Jan, early Apr, a cluster of three around 1 May, mid May, mid June).
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17, no pure black.
      Chrome: title, axis titles and tick labels in light ink, all readable; no dark-on-dark text; grid subtle; legend box in the dark elevated fill with light labels.
      Data: identical colors to the light render (#009E73 price, #C475FD EMA 12, #4467A3 EMA 26, #BD8233 diamonds); brand green reads well.
      Legibility verdict: PASS
