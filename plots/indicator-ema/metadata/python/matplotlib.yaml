review:
  strengths:
  - 'Price drawn in INK at 2.5 lw stays the dominant series while the 2 lw EMAs in
    #009E73 and #C475FD are clearly told apart in both themes'
  - Crossover detection skips the zero-sign first bar, so every golden/death triangle
    marks a real crossing of the 12 and 26 EMAs
  - EMAs computed with pandas ewm(span, adjust=False); the short one hugs the price
    and the long one lags as expected
  - fill_between(where=, interpolate=True) regime shading and annotate callouts with
    signal-colored boxes are native matplotlib idioms
  - Theme tokens threaded through title, subtitle, ticks, spines, legend frame and
    callout boxes; both renders fully readable on the 3200x1800 canvas
  weaknesses:
  - 'Suggestion: the 7 pt subtitle could go to 8 pt to match the tick labels.'
  - 'Suggestion: the Golden Cross callout could point at the April crossover instead
    of the warm-up crossing on the second bar, which reads as a start-up artefact.'
