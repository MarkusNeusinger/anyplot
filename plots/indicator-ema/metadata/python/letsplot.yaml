review:
  strengths:
  - Theme tokens threaded through every chrome element; both renders read cleanly
    with identical Imprint data colors
  - 'Clear line hierarchy: price at size 1.2 dominates, EMAs at 0.8 in distinct Imprint
    hues, legend labels each EMA with its period'
  - Crossovers found vectorised from the sign of the EMA gap and drawn as faint dashed
    vlines in semantic green (bullish) and red (bearish), explained in the subtitle
  - 'Idiomatic lets-plot: tidy melt, named-dict scale_color_manual, scale_x_datetime
    on real dates, layer_tooltips() for the HTML hover view'
  weaknesses:
  - 'SC-02 (both): a red bearish dashed line on Jan 03 marks a crossover that never
    happens: both EMAs start equal at the first close and the short one only moves
    below → no marker where the gap merely leaves zero on the first bars (C5). Likely
    cause: np.sign(gap) is 0 on row 0, so np.diff counts the 0→-1 step as a flip;
    ignore zero-sign rows when looking for flips.'
  - 'DE-02 (both): the panel is framed on all four sides → left and bottom axis lines
    only (style-guide Spines: L-shaped by default). Likely cause: the panel border
    from theme_minimal() is not set to element_blank() (panel_border=element_blank()).'
  - 'Suggestion: the legend title ''Series'' tells the reader nothing; the legend
    could drop it.'
