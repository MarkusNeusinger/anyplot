review:
  strengths:
  - Correct EMA math (standard alpha = 2/(n+1) recursion) for both 12- and 50-period
    lines, matching the spec's example periods
  - Crossover points computed from sign changes of (ema_short - ema_long) and marked
    with a distinct stroke-outlined marker that adapts correctly to theme
  - 'Clean theme-adaptive chrome: L-shaped spines, subtle Y-only grid via RGBAf alpha,
    transparent frameless legend, all text tokens correctly flipped between light
    and dark'
  - Line weights follow the spec's guidance (close price 3.0pt, EMA lines 2.0pt thinner)
    and Imprint palette order is correct (green close price, then lavender/blue EMAs)
  - Legend clearly labels each EMA by its period ('EMA (12)', 'EMA (50)') plus a dedicated
    Crossover entry
  weaknesses:
  - Title fontsize (20) renders quite small relative to canvas (~23% of plot width)
    for the mandated title string, undercutting the 'largest, first-thing-readers-see'
    typography hierarchy the style guide calls for — nudge titlesize up a few points
    for stronger visual prominence, staying well under the overflow ceiling
  - 'Crossover markers are generic and undifferentiated: all four dots use the same
    neutral ink color, so the viewer cannot tell a golden-cross (bullish, short EMA
    crosses above long EMA) from a death-cross (bearish) at a glance — the spec explicitly
    calls out golden/death cross signals as the core application; color- or shape-coding
    the crossover direction (e.g. green up-marker vs matte-red down-marker) would
    add real data storytelling per DE-03'
  - 'Design excellence is solid but not yet distinctive: no annotation or callout
    highlights *why* a crossover matters, and the crossover markers don''t leverage
    any Makie-specific feature beyond scatter+stroke (LM-02) — consider text!() labels
    on the most significant crossover or a light band!() shading between EMA lines
    to show trend regime'
  - Three crossover dots cluster tightly in the first ~10 trading days (choppy early
    data), reading as visual noise before the story develops — minor, but worth a
    glance in repair
  - Data context is fully anonymous ('Closing Price (USD)' with no named instrument)
    — still plausible and neutral, but a touch more concrete framing (e.g. implied
    sector) would strengthen DQ-02 realism
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "indicator-ema · julia · makie · anyplot.ai" in bold dark ink, centered top, fully visible and not clipped. X-axis "Trading Date" and Y-axis "Closing Price (USD)" labels in dark ink, clearly legible. Tick labels (dates on X, price values 140/150/160 on Y) in a softer grey, all readable. Subtle horizontal gridlines at ~15% opacity. Legend (top-left, frameless, transparent background) lists Close price / EMA (12) / EMA (50) / Crossover in dark ink text, fully readable and not overlapping the data lines.
      Data: Close price line in brand green (#009E73), EMA (12) in lavender/purple, EMA (50) in blue — matches Imprint palette order 1/2/3. Four black-filled, light-stroked circular markers flag EMA crossover points along the series. Line weights differentiate the price line (thicker) from the two EMA overlays (thinner), per spec.
      Legibility verdict: PASS — no text is light-on-light; all chrome is clearly readable against the cream background.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Title, axis labels, and tick labels have all flipped to light/off-white and soft-grey tokens respectively; identical layout and content to the light render. Gridlines remain subtle at low opacity in a light tint. Legend frame stays transparent with light-colored text, fully legible against the dark surface.
      Data: Close price (green), EMA (12) (lavender), EMA (50) (blue) are pixel-identical to the light render — only chrome flipped, as required. Crossover markers flip to light-filled/dark-stroked circles (INK token flips: dark fill with light stroke in light theme, light fill with dark stroke in dark theme), remaining visible against the near-black background.
      Legibility verdict: PASS — no dark-on-dark failures observed; every title/label/tick is clearly visible against the near-black surface, and brand green reads well on both surfaces.
