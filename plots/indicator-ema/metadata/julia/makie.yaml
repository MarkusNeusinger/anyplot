    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1.
      Chrome: Title "indicator-ema · julia · makie · anyplot.ai" centered top, dark ink, readable. Axis labels "Trading Date" / "Closing Price (USD)" readable. Tick labels (dates, prices) legible in soft ink. Legend top-left with 4 entries: "Close price" (green line), "EMA (12)" (lavender line), "EMA (50)" (blue line), "Crossover" (single black circle marker).
      Data: Green close-price line, lavender EMA(12), blue EMA(50), plain black circular "Crossover" markers at sign-change points. No shaded band between the EMA lines.
      Legibility verdict: PASS (all text readable against the light background).

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17.
      Chrome: Same title/axis/tick structure, now in light ink (#F0EFE8 / #B8B7B0), all readable. Legend "Crossover" marker rendered as a white/off-white circle (INK token flipped correctly for dark theme).
      Data: Same green/lavender/blue data colors as the light render (identical, as required) — only chrome and the neutral crossover-marker color flipped.
      Legibility verdict: PASS (no dark-on-dark or light-on-light failures observed).

    CRITICAL CAVEAT — these renders do NOT correspond to the current implementation source:
      The current plots/indicator-ema/implementations/julia/makie.jl (post-fix commit afa14657f, "address review feedback for indicator-ema") sets titlesize=24, adds a `band!()` trend-regime shading layer between the two EMA lines, and replaces the single black ":circle" "Crossover" scatter with two separate series — a green ":utriangle" "Golden cross" (IMPRINT_PALETTE[1]) and a red ":dtriangle" "Death cross" (IMPRINT_PALETTE[5]).
      None of that appears in plot-light.png / plot-dark.png: no band shading is visible anywhere between the EMA lines, the legend still shows a single generic "Crossover" entry with a plain black/white circle, and the title reads as the smaller pre-fix size.
      A byte-for-byte comparison confirms the rendered images match the PRIOR commit caf95cf9a (the original, pre-review-feedback implementation) exactly — same titlesize=20, same `color = INK, markersize = 14, marker = :circle, label = "Crossover"` scatter call — not the current committed source.
      This means the render step that produced these PNGs ran against a stale/incorrect checkout of the script. This is a pipeline artifact-generation bug, not a defect in the current implementation code. Scoring Visual Quality / Design Excellence against these images would evaluate the wrong version of the chart and risks approving/merging a preview image that doesn't match the code in the repository.
