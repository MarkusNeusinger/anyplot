review:
  strengths:
  - 'Source code (post-fix commit afa14657f) implements a semantically sound golden-cross
    / death-cross visualization: bullish crossovers get a green up-triangle from IMPRINT_PALETTE[1],
    bearish get a red down-triangle from IMPRINT_PALETTE[5] — a well-justified semantic-exception
    use of the palette per the finance convention (profit/up=green, loss/down=red).'
  - Trend-regime shading via band!() between the two EMA lines, tinted by prevailing
    bullish/bearish direction at 10% alpha, adds real data storytelling beyond the
    spec's minimum ask.
  - EMA math is correct (alpha = 2/(period+1), recursive formula) and price line is
    deliberately drawn thicker (3.0) than the EMA overlays (2.0), matching the spec's
    explicit guidance.
  - Full theme-adaptive chrome (INK/INK_SOFT/PAGE_BG), L-shaped spines, subtle y-only
    gridlines, transparent frameless legend — clean, idiomatic Makie styling.
  - Clean KISS script structure, Random.seed!(42), only used imports, correct save
    pattern (plot-$(THEME).png, px_per_unit=2 on a 1600x900 Figure => exact 3200x1800
    canvas).
  weaknesses:
  - 'CRITICAL — PIPELINE FAILURE, not a code defect: plot-light.png and plot-dark.png
    are byte-for-byte consistent with the PRIOR commit caf95cf9a (titlesize=20, a
    single black `:circle` scatter labeled "Crossover"), not the current committed
    source afa14657f (titlesize=24, band!() trend-regime shading, split green `:utriangle`
    "Golden cross" / red `:dtriangle` "Death cross" markers). No band shading appears
    anywhere in either render, and the legend still shows one generic "Crossover"
    entry. The render step must be re-run against the current makie.jl before this
    can be scored on its actual visual output — do not edit the .jl source in response
    to this finding, it already contains the fix.'
  - 'SC-04 / VQ-07 cannot be fully certified this round: legend-label correctness
    ("Golden cross" / "Death cross") and palette compliance for the crossover markers
    depend on the stale artifact and must be re-verified once a correct render is
    available.'
  - 'Minor, independent of the stale-render issue: consider whether 140 evenly-index-spaced
    ''trading days'' mapped to irregular calendar dates (1.4 days apart) versus true
    weekday-only trading dates would read as slightly more realistic on the x-axis,
    though this is not a spec requirement.'
