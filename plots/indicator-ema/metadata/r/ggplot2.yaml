review:
  strengths:
  - EMA recursion computed inline with Reduce(accumulate = TRUE) using the 2/(n+1)
    factor
  - Long-form data with factor-ordered series lets one geom_line carry price and both
    EMAs, with linewidth and alpha mapped through manual scales
  - 'Theme tokens threaded through every chrome element: no dark-on-dark text, ELEVATED_BG
    legend box in both themes'
  weaknesses:
  - 'VQ-07 (both): grid lines drawn in solid INK_SOFT (#4A4A44 / #B8B7B0) at 0.3 mm
    read as high-contrast rules that compete with the price line → the style guide''s
    grid token, ink at about 15 % opacity (for example #1A1A17 at alpha 0.15 blended
    onto the page, or a lighter mix such as #DCDAD2 light / #3A3A35 dark). Likely
    cause: panel.grid.major.y = element_line(color = INK_SOFT).'
  - 'SC-02 (both): the first crossover marker and dashed line at day 2 is not a crossing
    — both EMAs start at the first close, so their difference goes from 0 to non-zero
    (C5) → mark only real sign changes, 5 markers instead of 6 (−1). Likely cause:
    diff(sign(diff_ema)) != 0 counts the 0 → ±1 step at the start.'
  - 'Suggestion: lighter dashed crossover verticals, or dropping them in favor of
    the circles alone, would quiet the panel.'
