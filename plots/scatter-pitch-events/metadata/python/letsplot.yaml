review:
  strengths:
  - 'Accurate FIFA pitch geometry derived from named constants: penalty and goal areas,
    9.15 m centre circle, penalty arcs clipped at the box, 1 m corner arcs curving
    into the pitch, goal posts'
  - Outcome double-encoded through white fill and 0.42 alpha, keeping unsuccessful
    events visible on the green pitch
  - Four Imprint colours in canonical order paired with four distinct shapes; arrows
    with open arrowheads for passes and shots, faded for unsuccessful ones
  - Idiomatic identity scales with coord_fixed and theme_void, and layer_tooltips
    for event inspection in the HTML output
  weaknesses:
  - 'VQ-05 (both): the pitch and its below-pitch legend occupy only about half of
    the canvas width, leaving roughly 500 px (of 2000 displayed) of empty page on
    each side → let the drawing use more of the 16:9 canvas, e.g. move the event and
    outcome keys to the right of the pitch so the fixed-aspect panel widens. Likely
    cause: ylim(-20, W + 8) reserves space below the pitch, so coord_fixed narrows
    the panel to about 117:96.'
  - 'CQ-04 (code): four near-identical geom_path layers draw the corner arcs (lines
    231-234) → one geom_path over the concatenated arcs with aes(group=...). Likely
    cause: one layer per corner_arcs entry.'
  - 'Suggestion: draw the outcome key with real markers (a filled and a white-filled,
    semi-transparent circle) instead of the text glyphs ● and ○, so the key matches
    the marks exactly.'
  - 'Suggestion: a star shape for shots, as the Notes'' example names, would separate
    shots from interceptions further.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole 3200x1800 canvas (verified at the edges).
      Chrome: bold dark title 'scatter-pitch-events · python · letsplot · anyplot.ai' and grey subtitle '100 match events — ...' readable; event key (Pass, Shot, Tackle, Interception) in bold INK_SOFT and outcome key in INK_MUTED below the pitch, all readable. No axes (theme_void).
      Data: dark forest-green pitch with white markings (outline, halfway line, centre circle, penalty and goal areas, penalty arcs, spots, corner arcs, light-grey goal posts), darker defensive third and lighter attacking third with italic white labels. Passes #009E73 circles, shots #C475FD larger diamonds, tackles #4467A3 triangles, interceptions #BD8233 squares; successful filled, unsuccessful white-filled at reduced opacity; arrows with open heads for passes and shots, shots fanning into the right goal. Pitch occupies about the middle half of the canvas width.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17 across the whole canvas.
