review:
  strengths:
  - 'Accurate FIFA pitch geometry from named constants: penalty and goal areas, 9.15
    m centre circle, penalty arcs clipped at the box, 1 m corner arcs curving into
    the pitch, goal posts'
  - Outcome double-encoded through white fill and 0.42 alpha, keeping unsuccessful
    events visible on the green pitch; arrows fade with them
  - Four Imprint colours in canonical order paired with four distinct shapes; open
    arrowheads give the direction of every pass and shot
  - Event and outcome key placed right of the pitch so the fixed-aspect panel uses
    the 16:9 canvas
  - Idiomatic identity scales with coord_fixed and theme_void, and layer_tooltips
    for event inspection in the HTML output
  weaknesses:
  - 'VQ-03 (both): the outcome key draws its symbols as grey text glyphs ''●'' and
    ''○'' in INK_MUTED, which match neither the colored filled markers nor the white-filled,
    semi-transparent markers with colored outlines they explain → draw the key with
    real markers (one filled, one white-filled at alpha 0.42 with a colored outline).
    Likely cause: df_outcome_text labels carry the glyphs instead of a geom_point
    key layer.'
  - 'Suggestion: a star shape for shots, as the Notes'' example names, would separate
    shots from interceptions further.'
  - 'Suggestion: tie the size of the shot markers into the key, since shots are drawn
    larger than the other events.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the full 3200x1800 canvas.
      Chrome: bold dark title 'scatter-pitch-events · python · letsplot · anyplot.ai' and grey subtitle '100 match events — passes, shots, tackles & interceptions with outcome encoding' centred and readable; custom key right of the pitch (Pass, Shot, Tackle, Interception in bold INK_SOFT with matching markers, then the outcome key in INK_MUTED), all readable. No axes (theme_void).
      Data: dark forest-green pitch with a darker surround band and white markings (outline, halfway line, centre circle, penalty and goal areas, penalty arcs, spots, corner arcs, light-grey goal posts); darker defensive third and lighter attacking third with italic white labels. Passes #009E73 circles, shots #C475FD larger diamonds, tackles #4467A3 triangles, interceptions #BD8233 squares; successful filled, unsuccessful white-filled at reduced opacity; open-headed arrows for passes and shots, shots fanning into the right goal. Pitch plus key spans about 80 % of the canvas width.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
