review:
  strengths:
  - 'Accurate FIFA geometry from named metre constants: 40.32 × 16.5 m penalty areas,
    18.32 × 5.5 m goal areas, 9.15 m centre circle, penalty spots and arcs computed
    from the circle/box intersection, 1 m corner arcs curving into the pitch, and
    7.32 m goals drawn behind each goal line'
  - Equal px-per-metre scaling (areaHeight/areaWidth derived from the 111:74 domain)
    keeps the centre circle round and the pitch at 105:68 in the 3200×1800 canvas
  - Four distinct shape + Imprint color pairs (green circle pass, lavender star shot,
    blue triangle tackle, ochre diamond interception) in canonical palette order,
    every marker at its generated coordinates
  - 'Outcome double-encoded: unsuccessful events are hollow markers and their pass/shot
    arrows are thinner, dashed and lower-opacity, so failures stay visible but recede
    behind successful actions'
  - Per-type SVG <marker> arrowheads in userSpaceOnUse units give every pass and shot
    a visible direction while staying fine enough not to hide the markers
  - 'Idiomatic MUI X composition: ChartsDataProvider + ChartsSurface with useXScale/useYScale/useDrawingArea
    hooks drive custom SVG layers, with skipAnimation set and axes hidden via position:
    none'
  weaknesses:
  - 'VQ-07 (dark): the run-off band around the pitch is a light grey (#FFFDF6 under
    a 15 % #4A4A44 wash, about #E4E1DA) on the #1A1A17 page, so a light-theme frame
    covers roughly 70 % of the dark canvas → keep the white pitch the spec allows,
    but draw the run-off frame from the theme tokens (e.g. t.pageBg or the dark elevated
    #242420 with the rule tint) so only the pitch itself stays light. Likely cause:
    PITCH_SURFACE and PITCH_INK are fixed light-theme hexes used for the full drawing-area
    rects in PitchMarkings.'
  - 'Suggestion: tackles and interceptions are drawn uniformly over the pitch; concentrating
    them in the defending team''s half would make the defensive-action zones read
    more like a real match segment.'
  - 'Suggestion: the unsuccessful shot arrows (dashed lavender at 0.55 opacity) are
    the faintest marks on the white pitch; a slightly higher stroke opacity would
    keep them as legible as the hollow stars they start from.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white page (#FAF8F1); the drawing area is a light grey run-off band framing an elevated off-white (#FFFDF6) pitch with dark grey (#4A4A44) markings.
      Chrome: bold title "scatter-pitch-events · javascript · muix · anyplot.ai" (~33 % of width) and a soft-ink subtitle "98 events · 105 m × 68 m pitch · arrows run to the end position of pass and shot events" centred on top; a one-row HTML legend at the bottom (Pass, Shot, Tackle, Interception | Successful, Unsuccessful). No axes, as permitted. All text dark on light and readable.
      Data: full 105:68 pitch with penalty areas, goal areas, penalty spots and arcs, round centre circle, halfway line, 1 m corner arcs and both goals drawn outside the goal lines. Passes are #009E73 circles with green arrows across the pitch, shots are #C475FD stars fanning into the right goal mouth, tackles #4467A3 triangles, interceptions #BD8233 diamonds. Unsuccessful events are hollow markers with dashed, fainter arrows. No text overlaps; markers crowd near the right goal as the spec permits.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black page (#1A1A17); the pitch and its light grey run-off frame stay light as a deliberate white pitch.
      Chrome: title, subtitle and legend text flip to light ink and read clearly on the dark page; no dark-on-dark text. The outcome legend's filled circle turns light grey. The light run-off frame does not flip with the theme.
      Data: event colors, shapes, arrows and pitch markings identical to the light render; brand green #009E73 clearly visible.
      Legibility verdict: PASS (VQ-07 deduction for the non-adaptive light run-off frame)
