review:
  strengths:
  - Pitch geometry is built from named FIFA constants (16.5 m / 40.32 m penalty area,
    5.5 m / 18.32 m goal area, 9.15 m centre circle, 11 m spot, 7.32 m goals); the
    penalty arc is computed as the part of the 9.15 m circle outside the box, and
    corner arcs curve into the pitch
  - Equal px per metre on both axes (areaHeight/areaWidth from the domain ratio) keeps
    the 105:68 pitch and a round centre circle in both renders
  - Four distinct shape+color pairs (green circle passes, purple star shots, blue
    triangle tackles, ochre diamond interceptions) in Imprint order, identical across
    themes
  - 'Outcome is double-encoded: filled vs hollow markers and solid vs dashed, lower-opacity
    arrows, so unsuccessful events stay visible on the white pitch'
  - Per-type SVG arrowhead markers anchored at the event position and pointing to
    the end position; shots fan into the goal mouth as expected
  - Composes the chart from community ChartsDataProvider + ChartsSurface with useXScale/useYScale/useDrawingArea,
    so every custom mark sits in MUI X's own coordinate system
  - 'Theme-adaptive chrome: title, subtitle and legend use t.ink/t.inkSoft, and a
    translucent ink wash sets the run-off apart from the pitch on both pages'
  weaknesses:
  - 'Suggestion: attach MUI X tooltips or a hover highlight to the events so the HTML
    view reports each event''s type, outcome and coordinates.'
  - 'Suggestion: unsuccessful shot arrows at 0.55 opacity in light lilac read faint
    against the white pitch in the 400 px thumbnail; a slightly higher opacity would
    keep the dashed distinction while adding presence.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white page (#FAF8F1); the plot area has a light grey ink-wash run-off around a near-white (#FFFDF6) pitch.
      Chrome: bold title "scatter-pitch-events · javascript · muix · anyplot.ai" and a soft-ink subtitle ("98 events · 105 m × 68 m pitch · arrows run to the end position of pass and shot events") centred above; bottom legend: Pass (green circle), Shot (purple star), Tackle (blue triangle), Interception (ochre diamond), a separator, Successful (filled) and Unsuccessful (hollow). All text dark and readable. No axes, as the spec permits.
      Data: pitch markings in dark grey: outline, halfway line, centre circle and spot, both penalty areas with spots and arcs, goal areas, goals behind the goal lines, small corner arcs. 48 passes in brand green #009E73 with arrows; 10 shots as purple stars, arrows fanning into the right goal mouth; tackles as blue triangles; interceptions as ochre diamonds. Unsuccessful events are hollow with dashed, lighter arrows.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black page (#1A1A17); run-off is a dark grey wash; the pitch stays near-white by design (spec allows a white pitch with contrasting lines).
      Chrome: title, subtitle and legend text in light ink, all readable; no dark-on-dark text. Outcome legend glyphs switch to light ink.
      Data: identical positions and colors to the light render (green, purple, blue, ochre); markings keep the same dark-grey ink on the white pitch, goals visible against the dark run-off.
      Legibility verdict: PASS
