review:
  strengths:
  - Implements the spec's min/max envelope downsampling technique exactly as prescribed
    (900 buckets over 44,100 raw samples) to avoid aliasing at the rendered zoom level
  - Symmetric mirrored area fill around a zero baseline with semi-transparent fill
    (fillOpacity 0.55) and an explicit ChartsReferenceLine at y=0, matching every
    'Notes' requirement in the spec
  - 'Realistic synthetic speech-utterance data: fundamental + two harmonics shaped
    by six overlapping Gaussian syllable envelopes plus low-level breath noise, giving
    a plausible amplitude envelope shape rather than a flat repeating tone'
  - 'Nice storytelling touch: locates and annotates the loudest syllable with a highlighted
    mark and a dashed ChartsReferenceLine + label, creating a clear focal point without
    faking interactivity'
  - Explicit font sizing throughout (tickLabelStyle, labelStyle, title) and theme-correct
    Imprint palette/backgrounds identical data color across both renders
  - 'Clean single-purpose file: deterministic LCG-seeded data generation, only the
    two needed imports, current MUI X community API (LineChart area series + ChartsReferenceLine),
    skipAnimation set'
  weaknesses:
  - 'Design Excellence is still close to library-default: the extreme horizontal/vertical
    gridlines coincide with the axis extents and read as a boxed frame rather than
    an intentionally refined chrome — consider disabling the outermost grid lines
    or lightening them further, and trimming spines-equivalent chrome for a more polished
    look'
  - The envelope never dips toward true silence between syllables (troughs bottom
    out around 0.5-0.6 rather than near-zero), so the 'silence' dynamic the spec's
    Description calls out (alongside dynamics/clipping/transients) isn't really demonstrated
  - LM-02 usage is solid but not maximally distinctive — leans on standard area-series
    + ChartsReferenceLine; a more MUI X-specific flourish (e.g. custom axis formatting,
    richer showMark logic, or a second reference band) would push Library Mastery
    higher
  - The 'Loudest syllable' annotation text (fontSize 12) is the smallest element on
    the canvas — still legible at full resolution, but among the first things to disappear
    when the PNG is scaled down for mobile thumbnails
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "Speech Utterance · waveform-audio · javascript · muix · anyplot.ai" in dark ink, top-left, clearly legible. X-axis "Time (s)" labeled 0.00s-2.00s in 0.20s steps, Y-axis "Amplitude" labeled -1.0 to 1.0 in 0.1 steps. Grid lines (horizontal + lighter vertical) are subtle but visible. A gray horizontal zero-reference line and a gray dashed vertical "Loudest syllable" reference line with small label are both present and readable.
      Data: Single filled waveform in brand green (#009E73-looking), mirrored symmetrically above/below the zero baseline, semi-transparent so overlapping strokes stay visible. A single highlighted green dot marks the loudest syllable peak (~1.53s, ~0.82 amplitude). Six visible amplitude "bumps" trace the six syllable envelopes described in the code.
      Legibility verdict: PASS — all text (title, axis labels, ticks, annotation) is clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title now rendered in light/white ink, fully legible. Axis labels and tick labels are light-colored and readable. Grid lines are subtle light lines against the dark background. Zero-reference line and dashed "Loudest syllable" reference line remain visible in a muted light gray.
      Data: Waveform fill and peak marker are the identical brand green as the light render — only the chrome (background, text, grid) flipped to the dark theme, exactly as required.
      Legibility verdict: PASS — no dark-on-dark failures; every title/axis/tick/annotation element is clearly legible against the near-black background.
