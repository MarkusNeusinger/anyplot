review:
  strengths:
  - Min/max envelope downsampling (900 buckets) is the correct DAW technique for rendering
    88,200 samples without aliasing — a genuine display-engineering choice, not a
    shortcut
  - The syllable envelope shape (6 overlapping Gaussian bumps) reads clearly as speech
    dynamics — visible silence dips (~0.4s, ~1.4s) and amplitude variation tell a
    real story at a glance
  - Font sizes explicitly set (title 22px, axis label 16px, tick label 14px) rather
    than left to MUI X defaults
  - Correct Imprint brand green (#009E73) identical in both light and dark renders;
    theme chrome (background, grid, zero-line) flips correctly with no dark-on-dark
    or light-on-light failures
  - Clean, deterministic LCG-seeded data generation with no external dependencies
    beyond @mui/x-charts
  - Zero-line reference via ChartsReferenceLine gives the amplitude symmetry a clear
    visual anchor, matching the spec's explicit request
  weaknesses:
  - X-axis tick labels are very densely packed (41 ticks at 0.05s intervals across
    the full 2s range) — every label is still legible but there's minimal breathing
    room between them; reduce to ~0.1s or 0.2s intervals (or let MUI X auto-tick)
    for cleaner spacing
  - 'Design Excellence is solid but generic-plus: the fill+reference-line combination
    is tasteful but doesn''t push further into distinctive polish (e.g. a subtle color/alpha
    shift to call out the loudest syllable, or a lighter secondary grid) that would
    separate it from a well-configured default'
  - Library Mastery leans on fairly standard MUI X features (area series + ChartsReferenceLine);
    a more distinctive MUI X-only capability (e.g. zoom slider, custom marks, or multi-axis
    composition) isn't leveraged here
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white, not dark.
      Chrome: Title "Speech Utterance · waveform-audio · javascript · muix · anyplot.ai" in dark ink, clearly readable. X-axis label "Time (s)" and Y-axis label "Amplitude" both dark and legible. Tick labels (0.00s–2.00s at 0.05s steps, -1.0 to 1.0 on Y) are small but readable, packed tightly together. Horizontal gridlines are subtle. A dark horizontal zero-reference line cuts through the waveform at Amplitude=0.
      Data: Waveform rendered as a mirrored filled area in brand green (#009E73) at reduced opacity, symmetric above/below zero. Six overlapping syllable envelopes are visible as amplitude bulges with clear troughs (near-silence) between them, e.g. around 0.35–0.4s and 1.35–1.4s.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black, not light.
      Chrome: Same title text now in light/cream ink, clearly readable against the dark surface. Axis labels and tick labels are light-colored and legible; no dark-on-dark text anywhere. Gridlines are faint light lines, subtle but visible. The zero-reference line now renders as a light horizontal line, still visible against the waveform fill.
      Data: Waveform fill is the identical brand green (#009E73) as the light render — confirmed unchanged data color, only chrome flipped. Same syllable envelope shape and silence gaps as the light render.
      Legibility verdict: PASS
