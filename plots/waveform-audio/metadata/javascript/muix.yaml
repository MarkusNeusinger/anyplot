review:
  strengths:
  - Min/max envelope over 300 buckets keeps every bucket's true peak and trough, so
    the outline follows the speech-like syllable dynamics with no moiré or dropped
    peaks
  - Two native area series (upper and lower) at fillOpacity 0.5 give the mirrored
    semi-transparent waveform the spec asks for, with a thin same-color outline tracing
    the peaks
  - The zero line is a native ChartsReferenceLine in the ink token and reads clearly
    through the densest fill in both themes
  - Y axis fixed at -1.0 to +1.0 full scale, so headroom to full scale reads directly
    off the axis
  - Title and soft-ink subtitle (sample count, duration, envelope bucket count) form
    a clear typographic hierarchy built from the theme tokens
  - 'Deterministic LCG-seeded synthetic utterance at 22.05 kHz with a 180 Hz fundamental
    and two harmonics: realistic and neutral'
  - skipAnimation set, sized to window.ANYPLOT_SIZE, axis bands sized explicitly so
    no tick label truncates; native hover tooltips in the HTML output
  weaknesses:
  - 'Suggestion: the x-axis title ''Time (s)'' sits about 60 px below its tick labels;
    a smaller x-axis band would tie it closer to the axis.'
  - 'Suggestion: the ''Largest excursion -0.82'' marker picks out a peak barely larger
    than the ~0.81 peaks of the other syllables; a focal point would only carry weight
    if the data had a clearly dominant transient.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the full canvas; 3200x1800.
      Chrome: bold dark title "waveform-audio · javascript · muix · anyplot.ai" top-left, soft-ink subtitle "44,100 samples over 2.00 s · drawn as a min/max envelope of 300 buckets"; y-axis "Amplitude (normalized)" with ticks -1.0 to 1.0 in steps of 0.2; x-axis "Time (s)" with ticks 0.00 to 1.80; subtle grey horizontal and vertical grid. All text readable.
      Data: mirrored filled waveform in brand green #009E73 at 50% opacity with a thin green outline; six overlapping syllable envelopes peaking near ±0.8 with dips near 0.68 s and 1.3 s; dark zero line through the center; a dashed vertical marker at ~1.53 s with a dot at -0.82 and the label "Largest excursion -0.82" near the bottom axis.
