review:
  strengths:
  - Implements min/max envelope downsampling exactly as the spec notes require, avoiding
    aliasing artifacts from the 12,000-sample carrier at this zoom level
  - 'Both renders are theme-correct: warm off-white (#FAF8F1) / near-black (#1A1A17)
    backgrounds, identical Imprint green (#009E73) waveform in both themes, clearly
    visible zero-line reference'
  - Synthetic speech-like signal (syllable amplitude envelope x multi-harmonic voice
    carrier with fixed-seed jitter) is realistic, neutral, and gives the waveform
    a natural visual narrative with four distinct amplitude peaks
  - Fully deterministic via a fixed-seed LCG, generated in-memory, no fetch/import/network
    dependency
  - Title format matches the mandated 'waveform-audio · javascript · highcharts ·
    anyplot.ai' pattern exactly; legend correctly omitted for a single series
  - Canvas dimension gate passed (3200x1800 landscape, no clipping or overflow observed
    in either render)
  weaknesses:
  - Y-axis title is just 'Amplitude' but the spec explicitly calls this 'normalized
    amplitude' -- relabel to 'Amplitude (normalized)' so the -1..1 scale is self-explanatory
    without reading the axis bounds
  - 'tooltip: { enabled: false } switches off Highcharts'' native hover interactivity
    entirely, even though this is the interactive/HTML output for this library --
    a lightweight tooltip showing exact time (s) and amplitude on hover would add
    real value in the HTML detail view without affecting the static PNG'
  - 'Design excellence is generic/default: a single flat-opacity green fill with no
    additional refinement (e.g. a slightly darker stroke outlining the envelope crest,
    or subtle amplitude-based emphasis on the loudest syllable) to elevate it beyond
    a functional rendering'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 -- not pure white, not dark.
      Chrome: Title "waveform-audio · javascript · highcharts · anyplot.ai" is bold dark text, clearly legible at the top. X-axis "Time (s)" ticks from 0.0-1.5 in 0.1 increments; Y-axis "Amplitude" ticks at -1, -0.5, 0, 0.5, 1. All axis titles and tick labels render in dark ink against the light background and are fully readable. Horizontal grid lines at 0.5 intervals are subtle but visible; a slightly bolder horizontal line marks the zero baseline.
      Data: Single-series green (#009E73) waveform, filled with ~0.55 opacity, symmetric above/below zero. Four syllable-shaped amplitude envelopes are visible (peaks around t=0.2, 0.55, 0.9, 1.25s), separated by near-silent gaps -- matches the "syllable amplitude envelope" data-generation approach in the code.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 -- not pure black, not light.
      Chrome: Same title, axis titles, and tick labels now render in light/off-white text against the dark background, clearly legible with no dark-on-dark issues. Grid lines and the zero-baseline reference line remain visible at reduced but sufficient contrast.
      Data: Same green (#009E73) waveform shape and amplitude envelope as the light render -- confirmed identical data color; only the chrome (background, text, grid) flipped between themes.
      Legibility verdict: PASS
