review:
  strengths:
  - 'Both repair-loop fixes are correctly applied: Y-axis title now reads "Amplitude
    (normalized)" per the spec''s data notes, and the tooltip is re-enabled with a
    `t=…s, a=…` formatter instead of being fully disabled'
  - Implements min/max envelope downsampling exactly as the spec requires (900 buckets
    from 12,000 raw samples), avoiding aliasing artifacts while keeping the dense
    waveform crisp
  - 'Both renders are theme-correct: warm off-white/near-black backgrounds, identical
    Imprint green (#009E73) waveform fill in both themes, visible zero-line reference'
  - New darker-green crest stroke (#00694A, lineWidth 1.5) outlining the semi-transparent
    fill (fillOpacity 0.55) adds a layered, more polished look versus the flat single-tone
    fill from attempt 1
  - Synthetic speech-like signal (syllable amplitude envelope × multi-harmonic voice
    carrier with fixed-seed jitter) is realistic, neutral, and creates four distinct
    amplitude peaks with a natural visual rhythm
  - Fully deterministic via a fixed-seed LCG, generated in-memory, no fetch/import/network
    dependency
  - Title format matches the mandated pattern exactly; legend correctly omitted for
    a single series; canvas gate passed with no clipping or overflow
  weaknesses:
  - 'Design excellence is still moderate: the crest stroke is a nice touch, but there
    is no explicit emphasis distinguishing the loudest syllable (peak near t=0.9s)
    from the others — a viewer must infer the story themselves rather than have it
    pointed out'
  - CQ-01 KISS structure uses two small helper functions (lcgRandom, syllableEnvelope)
    rather than flat inline code — reasonably justified for audio synthesis but a
    minor deviation from the pure Imports→Data→Plot→Save shape
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1), not pure white.
      Chrome: Title "waveform-audio · javascript · highcharts · anyplot.ai" renders bold and dark, clearly legible. X-axis title "Time (s)" with ticks 0.0-1.5 in 0.1 increments; Y-axis title "Amplitude (normalized)" with ticks at -1, -0.5, 0, 0.5, 1 — all dark ink, fully readable. Subtle horizontal grid lines with a slightly bolder zero-baseline reference line.
      Data: Single-series waveform filled in Imprint green (#009E73, fillOpacity 0.55) with a darker green crest stroke (#00694A), symmetric above/below zero, showing four syllable-shaped amplitude envelopes (peaks near t=0.2, 0.55, 0.9, 1.25s) separated by near-silent gaps. First (and only) series correctly uses palette position 1.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17), not pure black.
      Chrome: Same title, axis titles, and tick labels now render in light/off-white text against the dark background — clearly legible, no dark-on-dark issues. Grid lines and the zero-baseline remain visible at reduced but sufficient contrast.
      Data: Waveform is the identical green fill (#009E73) and crest stroke (#00694A) shape/amplitude as the light render — confirmed only chrome (background, text, grid) flips between themes; data colors are unchanged.
      Legibility verdict: PASS
