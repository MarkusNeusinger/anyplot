review:
  strengths:
  - Uses Bokeh's native bokeh.util.hex.hexbin aggregation with the hex_tile glyph
    on axial q/r coordinates and a transform()-driven LinearColorMapper
  - 'Color ramp is imprint_seq with each theme''s fields stops, sampled at 256 steps:
    light runs pale mint → green → deep blue → violet, dark runs olive → green → pale
    blue, so dense cores stand out in both themes'
  - Hex size derived from the data range (about 42 across) so the 11,000 readings
    read as a continuous density surface with clear cluster gradients
  - Page painted in the theme color before the screenshot, so the dark render has
    no light edge line
  - Neutral IoT sensor monitoring scenario with five overlapping plumes of different
    spread
  weaknesses:
  - 'Suggestion: a HoverTool showing the count per hexagon would add inspection value
    to the HTML artifact.'
  - 'Suggestion: the unused IMPRINT_PALETTE constant could be dropped, since this
    plot uses only the sequential ramp.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole canvas.
      Chrome: bold dark title "hexbin-basic · python · bokeh · anyplot.ai" top left (~45% width), italic axis titles "Distance East (km)" / "Distance North (km)", soft-dark tick labels -6..6 and -4..6, color bar on the right titled "Count" with ticks 0–140; no grid, axis lines or ticks. All readable.
      Data: regular hexagons tiling five overlapping clusters; imprint_seq fields ramp from pale mint (sparse fringe) through brand green #009E73 to deep blue and dark violet at the densest cores near (-3,-1) and (-0.5,3). Sparse hexes stand out from the page.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17, no light edge or frame line.
      Chrome: title, axis titles, tick labels and color bar labels in light ink; no dark-on-dark text.
      Data: same hex layout; continuous ramp uses the dark fields stops, dark olive (sparse) → brand green → pale blue (densest cores), so cores glow against the page. Sparsest olive hexes are dim but distinct from the background.
      Legibility verdict: PASS
