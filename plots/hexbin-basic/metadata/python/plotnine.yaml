review:
  strengths:
  - Hexagonal binning computed vectorized with numpy/pandas and drawn through geom_polygon
    with a group aesthetic, the grammar-native route since plotnine has no hexbin
    geom
  - 'Imprint sequential field ramp (SEQ_FIELDS) with per-theme stops through scale_fill_gradientn(values=...):
    dense cores read as deep navy in light and pale periwinkle in dark, the sparsest
    cells still stand out'
  - Thin page-colored hexagon outlines give crisp cell separation in both themes
  - 'Pure basic variant: hexagons and the color bar only'
  - coord_fixed keeps longitude and latitude in proportion for the geographic data
  - Flat notebook structure with column constants and a replaceable Data block
  weaknesses:
  - 'Suggestion: the latitude-then-column rounding is an approximate hex assignment;
    a nearest-of-two-lattices assignment would bin points near cell corners exactly.'
  - 'Suggestion: the near-square 8°×7° extent under coord_fixed leaves empty bands
    left and right of the panel; a square 2400×2400 canvas would let the hexagons
    grow.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, L-shaped INK_SOFT axis frame, no grid.
      Chrome: title 'Seismic Event Density · hexbin-basic · python · plotnine · anyplot.ai' in dark INK, axis titles 'Longitude (°E)' / 'Latitude (°N)', ticks 32–38 and 35–39 in INK_SOFT, colorbar 'Event count' 10–40 on an elevated legend panel. All readable.
      Data: about 400 small pointy-top hexagons tiling the cloud with thin page-colored outlines; Imprint sequential field ramp from mint #66E2B2 (sparse fringe) through #009E73 to deep navy/aubergine at the two dense cores (~35.5 °E 37 °N and ~37.5 °E 38.6 °N) and a third smaller core near 33.5 °E 36.5 °N. A few isolated outlier hexagons.
