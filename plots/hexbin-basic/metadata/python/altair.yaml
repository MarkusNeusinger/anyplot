review:
  strengths:
  - Regular hexagons binned in screen space so every cell stays regular on the 800x450
    fit layout, tiling the occupied area edge to edge
  - Uses the imprint_seq fields stops per theme with a symlog scale whose domain values
    are placed at the ramp's stop positions in log space
  - autosize type fit with contains padding makes the chart fill exactly 3200x1800
    with no padding frame
  - Custom SVG hexagon path on mark_point is the idiomatic Altair way to draw hexagons
    without a native hexbin transform
  - Tooltips with coordinates and count add inspection in the HTML output
  - Fully theme-adaptive chrome; all text readable in both renders
  weaknesses:
  - 'SC-03 (both): the log color bar is labelled only at its ends, 1 and 115, so no
    value can be read off the colors in between → labelled round ticks through the
    range, e.g. 1, 3, 10, 30, 100. Likely cause: alt.Legend without values=, so Vega-Lite
    labels only the domain ends of the symlog gradient.'
  - 'Suggestion: the stale comment above hex_area (''... (calibrated by render)'')
    could state the actual sizing rule.'
