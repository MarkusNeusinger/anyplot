review:
  strengths:
  - Hexagonal binning done in pixel space with cube rounding, so hexagons are regular
    on screen and tile the occupied area edge to edge with a hairline gap
  - Viewport fitted to the data extent and padded by one cell in a two-pass probe
    render, so every occupied hexagon sits whole inside the axes
  - Continuous gradient color bar on a log count scale with 1-2-5 ticks and a 'Points
    per bin (log scale)' title, drawn into pygal's right margin
  - imprint_seq field stops per theme, with the ramp started above its pale end so
    the sparsest hexagons stand off both pages
  - 'Theme tokens threaded through Style and the injected color-bar SVG: all chrome
    readable on #FAF8F1 and #1A1A17'
  - Native pygal tooltips label every hexagon with its count ('N readings') in the
    HTML output
  weaknesses:
  - 'Suggestion: a thin muted outline around the color bar would anchor its lightest
    stop against the light page.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across canvas and plot area.
      Chrome: title "hexbin-basic · python · pygal · anyplot.ai" centred top in dark ink; axis titles "Sensor grid X (km)" and "Sensor grid Y (km)"; evenly stepped ticks, x -6 to 6 every 2 km, y -6 to 7 every 1 km; color bar at right titled "Points per bin" with muted "(log scale)", ticks 1, 2, 5, 10, 20, 50, 100, 200. All text readable.
      Data: regular pointy-top hexagons with hairline gaps, all whole inside the axes, colored along imprint_seq light field stops from mint (1 point) through #009E73 green and blue to deep plum (~400). Densest urban core upper centre, broad industrial zone lower left, elongated highway corridor at right, a few isolated sparse cells (one outlier near y -5.7). A few interior empty cells stay blank.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, axis titles, tick labels and color-bar text in light cream ink, "(log scale)" in muted grey; no dark-on-dark.
      Data: identical hexagon layout with imprint_seq dark field stops — olive (sparse) through #009E73 to pale periwinkle #CDD9FF (densest); the continuous ramp correctly uses the dark stops, sparsest olive cells visible against the page.
      Legibility verdict: PASS
