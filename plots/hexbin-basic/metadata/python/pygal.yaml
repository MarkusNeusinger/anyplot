review:
  strengths:
  - Hexagonal binning done in pixel space with cube rounding, so the hexagons are
    regular on screen and tile the occupied area edge to edge with a hairline gap
  - Continuous gradient color bar on a log count scale with 1-2-5 ticks and a 'Points
    per bin (log scale)' title, drawn into pygal's right margin
  - imprint_seq field stops per theme, with the ramp started above its pale end so
    the sparsest hexagons stand off both pages
  - 'Theme tokens threaded through Style and the injected color-bar SVG: all chrome
    readable on #FAF8F1 and #1A1A17'
  - Native pygal tooltips label every hexagon with its count ('N readings') in the
    HTML output
  - Plausible urban air-quality sensor scenario with three hotspots of different spread
  weaknesses:
  - 'SC-03 (both): the viewport is cut at the 2nd/98th percentile ± 0.4 km, so the
    top and bottom hexagon rows are sliced flat at the plot edge and the occupied
    cells beyond it (the urban core above about 4.8 km, the industrial zone below
    about -2.9 km) are clipped away → fit the x and y ranges to the occupied hexagon
    extent (min and max cell centre ± one cell radius) so every filled hexagon is
    whole inside the axes. Likely cause: x_lo/x_hi/y_lo/y_hi from df.quantile(0.02/0.98)
    ± 0.4 combined with the hex-clip clipPath.'
  - 'SC-03 (both): the tick sets step irregularly — x reads -4, -3, -1, 1, 3, 5 and
    y reads 4, 2, 1, 0, -1, -2 — so the labelled interval changes along each axis
    → evenly stepped ticks (for example every 2 km on x, every 1 km on y). Likely
    cause: x_labels_major_count=6 / y_labels_major_count=6 choosing majors from pygal''s
    auto labels; pass explicit x_labels and y_labels.'
  - 'Suggestion: a thin muted outline around the color bar would anchor its lightest
    stop against the light page.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across canvas and plot area.
      Chrome: title "hexbin-basic · python · pygal · anyplot.ai" centred top in dark ink; axis titles "Sensor grid X (km)" and "Sensor grid Y (km)" dark, readable; tick labels x -4, -3, -1, 1, 3, 5 and y 4, 2, 1, 0, -1, -2 (irregular steps); color bar at right titled "Points per bin" with muted "(log scale)", ticks 1, 2, 5, 10, 20, 50, 100, 200.
      Data: regular pointy-top hexagons tile the occupied area with hairline gaps, colored along imprint_seq light field stops from mint (1 point) through #009E73 green and blue to deep plum (~200). Dense urban core upper centre, broad industrial cluster lower left, elongated highway corridor at right, sparse background cells scattered. Top and bottom hexagon rows sliced flat at the plot edge by the percentile viewport.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, axis titles, tick labels and color-bar text in light cream ink, "(log scale)" in muted grey; all readable, no dark-on-dark.
      Data: same hexagon layout with imprint_seq dark field stops — olive (sparse) through #009E73 green to pale periwinkle #CDD9FF (densest). Continuous ramp correctly uses the dark stops; sparsest olive cells remain visible against the page; brand green visible.
      Legibility verdict: PASS
