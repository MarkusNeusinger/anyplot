review:
  strengths:
  - ax.hexbin with mincnt=1, LogNorm and page-colored 0.2 pt edges gives a clean tiled
    density surface where dense cores and sparse fringes read at once
  - 'imprint_seq built with the canonical fields stops per theme: light runs mint
    -> violet, dark runs olive -> pale blue, so high counts stand out in both renders'
  - 'Basic variant respected: hexagons and the colorbar only, labelled as a log count'
  - Theme tokens threaded through title, labels, ticks, spines and colorbar outline;
    both renders fully legible
  - Linear script with column constants and a tidy df, seeded data, all imports used
  weaknesses:
  - 'SC-03 (both): the log colorbar labels only 10^0 and 10^1 while bin counts reach
    about 60-70, so the upper third of the ramp has no readable value → labelled round
    ticks across the range, e.g. 1, 2, 5, 10, 20, 50. Likely cause: default LogLocator
    with LogFormatterSciNotation labelling decades only; use cbar.ax.yaxis.set_major_locator(LogLocator(subs=(1,
    2, 5))) with a ScalarFormatter.'
  - 'Suggestion: ''Longitude (km)'' / ''Latitude (km)'' mixes an angular name with
    a distance unit; ''Easting (km)'' / ''Northing (km)'' would read more precisely.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white #FAF8F1, not pure white.
      Chrome: Title 'hexbin-basic · python · matplotlib · anyplot.ai' in dark ink; 'Longitude (km)' and 'Latitude (km)' axis labels and 8 pt ticks in INK / INK_SOFT; colorbar labelled 'Sensor readings per hexagon (log count)' with ticks 10^0 and 10^1 only. Top/right spines removed. All readable.
      Data: ~30-column hexbin of a three-cluster cloud; imprint_seq fields ramp from pale mint (1) through brand green #009E73 to deep blue and dark violet at the cores (around (2,2) and (-2,-1)); thin page-colored hex edges; empty bins blank.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black #1A1A17, not pure black.
