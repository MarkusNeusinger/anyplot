      Data: same hexagon layout with the dark fields stops: sparse cells dark olive #404C02 (still distinct from the page), mid brand green, cores pale blue #CDD9FF (transit hub brightest); edges in the page colour. Continuous ramp correctly uses the dark stops.
      Legibility verdict: PASS
