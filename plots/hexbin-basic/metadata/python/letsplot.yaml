review:
  strengths:
  - Correct imprint_seq fields ramp per theme, sampled at 256 steps with ramp_color
    into scale_fill_gradientn — dense cores go navy on light and pale blue on dark
    while sparse fringes recede
  - geom_hex computes the binning natively (bins=[35, 35]) with a sqrt-transformed
    fill scale whose colour bar ticks read as real counts
  - One-panel gggrid wrap paints the full canvas in the page colour despite coord_fixed
  - Hex edges in the page colour separate the cells cleanly in both themes
  - layer_tooltips exposes the computed count and density per hexagon in the HTML
    output
  - Realistic, neutral GPS-ping scenario with three distinct clusters and a sparse
    residential fringe
  weaknesses:
  - 'DE-02 (both): the panel is framed on all four sides (a top and a right line around
    the plot area) where a hexbin requires no enclosure → left and bottom axis lines
    only, or none. Likely cause: theme_minimal + axis_line=element_line(...) combined
    with coord_fixed draws a panel border; set panel_border=element_blank() and keep
    only the axis lines.'
  - 'Suggestion: a subtitle naming what the reader sees (the three hotspots) rather
    than the colormap would guide the eye more than the technical note.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the full canvas (no side strips).
      Chrome: bold dark title 'hexbin-basic · python · letsplot · anyplot.ai' at ~48% width, soft-ink subtitle 'GPS ping density — sqrt-scaled Imprint sequential colormap', axis titles 'East–West (km from center)' / 'North–South (km from center)', grey tick labels -8..12 and -6..8; the panel has a thin frame on all four sides. Colour bar 'Ping Count' on an elevated #FFFDF6 box with ticks 4/16/36/64/100/144.
      Data: ~35x35 hexagons with page-coloured edges; sparse fringe in pale mint #66E2B2, mid densities brand green #009E73, cores in blue #4467A3 to navy #002850 — campus cluster at (-3, 1), downtown corridor at (4, 3), tight transit hub at (0.5, -3.5) darkest. Isolated outlying cells at the fringe.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17 across the full canvas.
      Chrome: title and axis titles in light ink #F0EFE8, ticks and subtitle in #B8B7B0, colour bar on #242420; no dark-on-dark text.
      Data: same hexagon layout with the dark fields stops — sparse cells deep green #00573D, mid brand green, cores pale blue #CDD9FF (transit hub brightest); edges in the page colour. Continuous ramp correctly uses the dark stops.
      Legibility verdict: PASS
