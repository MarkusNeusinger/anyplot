review:
  strengths:
  - 'Uses imprint_seq with the theme''s fields stops, so the sparsest hexagons stay
    visible on both #FAF8F1 and #1A1A17 while dense cores reach the dark (light) /
    bright (dark) end'
  - LogNorm with mincnt=1 lets both the ~500-count cores and single-count fringes
    read on one scale, and the color bar is labeled 'Point count (log scale)'
  - 'Strict basic variant: hexagons and color bar only, on a landscape canvas filled
    via plt.tight_layout'
  - 'Clean adaptable structure: column constants with role comments, a Data block
    ending in a tidy df, and plotting that reads only df'
  weaknesses:
  - 'Suggestion: an equal-aspect or latitude-corrected axis would keep the hexagons
    regular on the map and the geography undistorted.'
  - 'Suggestion: labeling the color bar''s upper end (e.g. 500) would show the peak
    count directly.'
