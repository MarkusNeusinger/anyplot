review:
  strengths:
  - Uses the imprint_seq field ramp with the theme's own stops, so low counts recede
    and dense cores stand out in both renders
  - Log color mapping with colorbar tickvals/ticktext showing raw counts (1, 3, 10
    … 901) keeps the wide density range readable
  - Binning in plot-area pixel space keeps hexagons regular on screen regardless of
    axis units
  - customdata hovertemplate gives the raw reading count per hexagon in the HTML view
  - Factory spindle sensor scenario with three correlated operating modes is realistic
    and neutral
  weaknesses:
  - 'SC-02 (both): hexagons do not tile edge to edge (C1) — flat-top ''hexagon2''
    markers sit on a pointy-top lattice (centers sqrt(3)·R apart horizontally, 1.5·R
    vertically), so neighbours overlap sideways and small page-colored triangles show
    between rows → use the pointy-top symbol ''hexagon'' sized to the lattice so cells
    meet edge to edge. Likely cause: marker symbol ''hexagon2'' with the axial pointy-top
    binning math.'
  - 'Suggestion: a slightly smaller gridsize step (e.g. 32 across) would resolve the
    gradient inside the overload cluster a little finer.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, no pure white.
      Chrome: title 'hexbin-basic · python · plotly · anyplot.ai' centered in dark ink; axis titles 'Bearing temperature (°C)' and 'Vibration (mm/s)' in dark ink; ticks in soft ink; vertical colorbar 'Readings per hexagon (log scale)' with ticks 1, 3, 10, 30, 100, 300, 901. No grid, left and bottom axis lines only. All readable.
      Data: ~28-across hexagons covering three operating-mode clusters rising diagonally (idle ~42 °C/1.2 mm/s, normal ~68 °C/3.4 mm/s, overload ~86 °C/7 mm/s); imprint_seq light field stops pale mint → #009E73 → deep blue → dark violet for the densest cells (901). Close inspection shows small page-colored notches between hexagon rows (flat-top markers on a pointy-top lattice).
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17, no pure black.
      Chrome: title, axis titles in light ink, ticks in soft light ink, colorbar title and ticks light. No dark-on-dark text.
      Data: same hexagon layout; continuous ramp correctly uses the dark field stops dark olive #404C02 → #009E73 → pale blue #CDD9FF, so sparse fringes are olive (still distinct from the page) and dense cores bright. Brand green visible.
      Legibility verdict: PASS
