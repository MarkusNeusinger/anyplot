review:
  strengths:
  - Uses the Imprint sequential field ramp with its theme stops through scale_fill_gradientn(values
    = ...), so sparse fringes and dense cores separate clearly in both themes
  - 'Keeps to the basic variant: hexagons and the colorbar only, no callouts or overlays'
  - Regular pointy-top hexagons of one size tile the cloud edge to edge at a resolution
    (35 across) that resolves three clusters as a continuous density surface
  - Column constants and a replaceable Data block make the script adaptable; flat,
    reproducible with set.seed(42)
  - 'Theme-adaptive chrome throughout: all text readable on #FAF8F1 and #1A1A17'
  weaknesses:
  - 'Suggestion: a log10 count scale (scale_fill_gradientn(transform = "log10")),
    which the Notes suggest considering, would spread the tones of the sparse fringe;
    the colorbar would then be titled as a log count.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, not pure white.
      Chrome: bold dark title 'hexbin-basic · r · ggplot2 · anyplot.ai' at about 43 % of the width; axis titles 'Easting (km from city center)' / 'Northing (km from city center)' in dark ink; tick labels in INK_SOFT; subtle major grid; left and bottom axis lines; colorbar 'Count' (40-120 ticks) on an elevated panel. All readable.
      Data: about 600 pointy-top hexagons tile three clusters (dense core near (-2.7, 2.3), a broad core near (0.5, 0.3), a third near (3, -1.6)); fill runs along the Imprint sequential field ramp from mint #66E2B2 (sparse fringe) through #009E73 and blue #024582 to aubergine #351E45 at the densest cell. Sparse hexagons stand out from the page.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17, not pure black.
      Chrome: title, axis titles and ticks in light ink tokens; grid subtle; colorbar panel #242420 with light labels. No dark-on-dark text.
      Data: same hexagon layout; the continuous ramp takes the dark stops, olive #404C02 (sparse) through #009E73 to pale blue #CDD9FF at the densest cell, so the cores glow against the dark page; olive fringe hexagons remain distinguishable from the background.
      Legibility verdict: PASS
