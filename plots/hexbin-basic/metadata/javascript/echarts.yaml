review:
  strengths:
  - ECharts has no built-in hexbin series, so the implementation hand-rolls hexagonal
    binning and a custom renderItem — exactly the idiomatic approach the echarts library
    rules call for (a native capability, not a workaround)
  - Uses the Imprint sequential colormap (green -> blue, tokens.seq) via visualMap
    for the continuous density encoding, with matching 'High density'/'Low density'
    text labels
  - 'Both renders pass the theme-readability check: warm off-white / near-black backgrounds,
    all text legible, data colors identical between light and dark'
  - Minimal, refined chrome — axis ticks and split lines removed, thin axis line only,
    generous balanced whitespace, hexagon strokes matched to the page background for
    a clean 'floating' look
  - Deterministic data generation via a fixed-seed LCG, with a realistic three-regime
    industrial-sensor scenario (temperature vs. vibration) plus background noise that
    produces genuine density variation
  - No edge clipping anywhere — title, axis labels, tick labels, and the colorbar/legend
    all sit comfortably inside the 3200x1800 canvas with room to spare
  weaknesses:
  - 'Data storytelling is only partial: only the ''normal operation'' cluster (low
    temperature/vibration) reads as a clear dark-blue hotspot — the ''elevated load''
    and ''thermal-stress'' regimes described in the code comments blend into the same
    background green and aren''t visually distinguishable as separate regimes in the
    final render'
  - The hexbin resolution (HEX_COLUMNS = 24) is on the coarse side for ~4,500 points,
    which flattens some of the finer density structure between the three regimes into
    a single broad green field
  - Code needs several helper functions (LCG, normal sampler, hex binning, custom
    renderItem) to work around ECharts' lack of a native hexbin series, so it doesn't
    follow a strict flat Imports -> Data -> Plot -> Save structure — understandable
    given the required custom rendering, but still a deviation from the KISS ideal
  - Vibration amplitude values reach ~60 mm/s in the 'thermal-stress' cluster, which
    is high relative to typical industrial vibration-severity scales (ISO 10816-style
    unacceptable thresholds are often well below that) — plausible for a stress-test
    scenario but worth a sanity check
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "hexbin-basic · javascript · echarts · anyplot.ai" centered at top in dark ink, clearly readable. X-axis "Operating Temperature (°C)" and Y-axis "Vibration Amplitude (mm/s)" labels both descriptive with units and fully legible. Tick labels (0-100 on x, 0-60 on y) are dark gray and readable. Vertical colorbar on the right with "High density"/"Low density" text labels, both readable against the light background. No gridlines (removed by design), thin single axis line only.
      Data: A dense field of regular hexagons tiling the plot area, colored on an Imprint sequential green (#009E73-ish, low count) to blue (~#4467A3, high count) gradient. The darkest/bluest hexagons cluster around x≈25-35, y≈10-20 (the "normal operation" regime), with the rest of the field a fairly uniform green — some hexagon-shaped gaps appear where no points fell (real sparse-data gaps in the tail, not overlap or rendering errors). Hexagon edges are separated by a thin stroke matching the page background, giving a clean "floating" appearance.
      Legibility verdict: PASS.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Same title, now in white/light text, fully legible against the dark background. Axis names and tick labels rendered in light gray, clearly readable — no dark-on-dark failures observed. Colorbar text labels also light-colored and legible.
      Data: Same hexagon field with identical green-to-blue data colors as the light render — only the chrome (background, text) has flipped to the dark theme, confirming color identity is preserved between themes.
      Legibility verdict: PASS.
