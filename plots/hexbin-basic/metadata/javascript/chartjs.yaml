review:
  strengths:
  - Builds a full hexbin implementation from scratch via Chart.js's afterDatasetsDraw/afterDraw
    plugin hooks, since no core Chart.js type supports it — this is the idiomatic
    way to extend the library beyond its eight built-in chart types.
  - Custom-drawn colorbar with correctly log-scaled tick values communicates the density
    scale clearly, filling the gap left by Chart.js having no built-in colorbar.
  - Correctly uses the Imprint imprint_seq colormap (#009E73 to blue) for the single-polarity
    density data instead of the spec's literal 'e.g. viridis' suggestion — good judgment
    applying house style over a stale spec example.
  - Deterministic LCG + Box-Muller RNG (seed 42) produces reproducible multi-cluster
    GPS data without relying on a seeded Math.random, which the browser doesn't provide.
  - Theme tokens are correctly threaded through title, axis labels, grid, and the
    custom colorbar — both light and dark renders are fully readable with no dark-on-dark
    or light-on-light failures.
  - Realistic, neutral scenario (GPS pings clustered by land use around a city center)
    with plausible km-scale distances and point counts.
  weaknesses:
  - 'Hexagons are not regular — they render visibly stretched horizontally because
    hexSize is computed purely from the x-domain (domain.xMax - domain.xMin) / GRIDSIZE
    / sqrt(3) and then the resulting axial-grid vertices are pushed through scales.x.getPixelForValue
    / scales.y.getPixelForValue independently, without accounting for the mismatch
    between the data x:y range ratio (~1.29) and the actual chart plot-area pixel
    aspect ratio (~1.87). This directly undermines the isotropy that the specification
    calls out as hexbin''s defining advantage over square binning (''equal distance
    to neighboring cells in all directions''). Fix: compute each hexagon''s vertices
    directly in pixel space (convert the bin center to pixels first, then add a fixed
    pixel-radius hexagon offset) so every hexagon is geometrically regular on screen
    regardless of the axes'' per-unit pixel scale, instead of transforming data-space
    hex vertices through two independently-scaled axes.'
  - 'CQ-01 KISS structure is stretched by necessity (7 top-level helper functions:
    makeRng, gaussian, pointToHex, hexRound, hexToPoint, hexToRgb, densityColor) —
    understandable given the hex-grid math, but a couple of these (e.g. hexToRgb,
    densityColor) could be inlined or simplified to tighten the script back toward
    the Imports -> Data -> Plot -> Save shape.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1-range), not pure white, not dark.
      Chrome: Title "hexbin-basic · javascript · chartjs · anyplot.ai" in dark ink, clearly readable at ~75% plot width. Axis titles "Distance East of Downtown (km)" and "Distance North of Downtown (km)" in dark ink, both readable with units. Tick labels in soft dark gray, readable. Grid lines subtle light gray, visible but not dominant. Colorbar on the right labeled "Points per bin" with log-scaled tick values (0, 2, 10, 33, 110), all readable.
      Data: Hexagonal bins form a blob-shaped density map — sparse teal-green hexagons (low count) at the periphery transitioning to blue hexagons (high count) in the dense core, matching the imprint_seq gradient (#009E73 -> blue). On close zoom, individual hexagons are visibly stretched horizontally rather than regular, because the data x:y domain ratio doesn't match the chart's pixel aspect ratio.
      Legibility verdict: PASS (all text readable; the hexagon-shape distortion is a geometry/design issue, not a legibility issue).

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17-range), not pure black, not light.
      Chrome: Title, axis titles, tick labels, and colorbar labels all rendered in light/white text, clearly readable against the dark background. Grid lines subtle, visible without dominating. No dark-on-dark failures found — every text element correctly flipped to light ink.
      Data: Hex bin colors are identical to the light render (teal-green -> blue gradient), confirming the data colors held constant across themes and only chrome flipped. Same horizontal hexagon-stretch geometry issue is present here too (theme-independent, a canvas-math issue rather than a theming issue).
      Legibility verdict: PASS (all text readable in both themes; brand green/blue density gradient still clearly visible on the dark surface).
