review:
  strengths:
  - Genuine hexagonal-binning geometry (axial-coordinate rounding, pointy-top hex
    tiling) — not a faked/simulated aggregation.
  - Continuous density encoding uses imprint_seq (brand green → blue) exclusively,
    plus a hand-built gradient colorbar labeled "Pings / bin" with min/max value annotations
    — fully Imprint-compliant.
  - log1p-scaled color mapping directly addresses the spec's note about wide density
    variance.
  - Theme-adaptive chrome is clean and correct; data colors are identical between
    light and dark renders; title matches the mandated format exactly; axis titles
    are descriptive with units (km).
  - Deterministic seeded LCG (seed 42) for reproducible data generation.
  - No AR-08/AR-09 violations — no clipped text at any edge, no simulated interactivity.
  weaknesses:
  - Dataset scale (~3,400 points) is modest relative to the spec's own framing ("1,000-1,000,000+
    points... where traditional scatter plots would show overlapping points") — at
    3.4k points a scatter plot would likely still be legible, understating hexbin's
    core value proposition. Consider tens of thousands of points to make the density-aggregation
    payoff unambiguous.
  - Implementation relies on a lower-level SVGRenderer workaround (manual path drawing
    + an invisible boundary series to force axis layout) instead of a built-in series
    type, because colorAxis lives in an unloaded module — well-commented and functional,
    but a departure from idiomatic Highcharts usage (LM-01).
  - Heavy use of custom helper functions for the axial hex-grid math runs against
    strict KISS "no functions" expectations, though the complexity is justified by
    the binning algorithm itself.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "hexbin-basic · javascript · highcharts · anyplot.ai" in bold dark ink at top center, fully visible and not clipped. X-axis title "Longitude offset from city center (km)" and Y-axis title "Latitude offset from city center (km)" in medium-gray ink, both readable. Tick labels (0-110 on x, 0-80 on y) in soft dark gray, clearly legible. Subtle light gridlines visible but not competing with data. Manual colorbar on the right labeled "Pings / bin" with max value "29" at top and min value "1" at bottom, both readable.
      Data: Hexagonal bins tile three overlapping density clusters (three GPS hotspots). Color ramps from brand green (#009E73, sparse bins) to blue (#4467A3, dense bins) — confirms sequential imprint_seq usage, not viridis or any forbidden colormap.
      Legibility verdict: PASS — all text is dark-on-light and clearly readable, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title, axis titles, and tick labels now rendered in light ink/off-white and soft light gray respectively, fully legible against the dark background. No dark-on-dark failures observed — every text element (title, axis titles, tick labels, colorbar labels "Pings / bin", "29", "1") is clearly visible.
      Data: Hex bins use the identical green-to-blue gradient as the light render — confirms only chrome (background, text, grid) flips between themes while data colors stay constant, as required.
      Legibility verdict: PASS — no dark-on-dark or light-on-light failures in either theme.
