review:
  strengths:
  - Square plot area (margins tuned so 1 m spans the same pixels on both axes) keeps
    every hexagon regular; the binning uses the standard pointy-top nearest-centre
    assignment and tiles the domain edge to edge
  - imprint_seq green-to-blue ramp applied on a log1p scale through a zAxis continuous
    colorMap, so the dense plaza/transit/waterfront cores and the sparse fringes both
    read; the colour bar is captioned 'Ping count per bin (log scale)'
  - 'Idiomatic MUI X customisation: the ScatterChart''s scatter slot is replaced by
    a HexCell renderer that reads the chart''s own xScale/yScale/colorGetter, and
    the ContinuousColorLegend slot is bound to the same z axis, so marks and colour
    bar share one colour mapping'
  - 1 px page-coloured seams between hexagons give a clean mosaic in both themes;
    empty cells are a faint tint (light) / near-black tint (dark) that stays distinct
    from the lowest filled colour
  - Plausible, neutral scenario (30,000 pedestrian GPS pings around a plaza with three
    foot-traffic hotspots), deterministic via a seeded LCG; skipAnimation and disableHitArea
    set
  weaknesses:
  - 'SC-02 (both): the hexagons are too coarse for 30,000 points — about 16 columns
    across the ±60 m domain, so each hotspot core spans only 2–3 hexagons and the
    gradients around them step in large tiles rather than resolving the cluster shapes
    (spec: ''small enough to resolve clusters and gradients'') → about 28–32 columns
    (radius share about 0.04, roughly −0.035). Likely cause: HEX_RADIUS_SHARE = 0.075.'
  - 'Suggestion: the log-scale colour bar carries only its endpoint labels (1 and
    1,244); intermediate ticks such as 10 and 100 would let a reader decode the log
    mapping.'
  - 'Suggestion: the colour-bar caption sits about 40 px below the bar''s labels;
    tightening the caption band would tie it visually to the bar.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, square 2400x2400 canvas, square plot area.
      Chrome: bold dark title "hexbin-basic · javascript · muix · anyplot.ai" centred at top (~44 % width); y-axis "Distance north of plaza (m)" and x-axis "Distance east of plaza (m)" in dark ink; ticks −60…60 every 5 in soft ink, all readable; horizontal colour bar centred below the x label with endpoint labels 1 and 1,244 and caption "Ping count per bin (log scale)". No clipping.
      Data: ~16-column pointy-top hex grid with 1 px page-coloured seams; colours run from brand green #009E73 (sparse) to blue #4467A3 (dense) on a log scale; three blue hotspots (centre ~0,5; transit ~32,−27; waterfront ~−30,22); empty cells near the edges in a pale mint tint; edge hexes clipped at the plot frame.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, axis labels and colour-bar caption in light ink; tick labels and endpoint labels in light soft ink — all readable, no dark-on-dark text.
      Data: identical green-to-blue hexagon colours to the light render; seams now dark page colour; empty cells a dark green-black tint, still distinct from the green sparse cells. Brand green clearly visible.
      Legibility verdict: PASS
