review:
  strengths:
  - Hexagons are drawn through a custom `scatter` slot on ScatterChart. Each slot
    uses the chart's own xScale/yScale and colorGetter, so the bins sit at their true
    data centres and take their colour from the zAxis colorMap. This is an idiomatic
    MUI X way to add a mark type the community package lacks.
  - A log-scaled imprint_seq colorMap (green → blue), applied through zAxis and shown
    by a native ContinuousColorLegend, separates the three hotspots (plaza core, transit
    hub, waterfront promenade) clearly from the ambient fringe. The colour bar caption
    'Ping count per bin (log scale)' states the scale.
  - 'A realistic, specific scenario: 30,000 pedestrian GPS pings in metres from a
    plaza, from a seeded LCG, so the data is fully deterministic.'
  - 'Theme handling is clean: data colours are identical in both renders. Hex outlines
    use the page colour, empty cells are a faint seq[0] tint, and all chrome uses
    ink/inkSoft tokens, so every text element is readable on #FAF8F1 and #1A1A17.'
  weaknesses:
  - 'SC-02 (both): the hexagons are not regular on screen. The equal ±60 m ranges
    map to a plot area of about 1793 × 1901 px, so each hexagon is about 6 % taller
    than wide → equal pixel extent per metre on both axes (plot width = plot height,
    about +108 px of plot width or −108 px of height). Likely cause: the asymmetric
    margin (right 134 / left 80) and y-axis band width 88 leave the drawing area wider-than-tall
    mismatched against height − titleHeight − captionHeight − x-axis band 68.'
  - 'CQ-01 (code): the binning, the full-grid construction and the colour mixing are
    wrapped in single-use helper functions (`hexBin` lines 79–117, `fullHexGrid` lines
    146–163, `mixHex` lines 127–136) → inline them at module level as straight-line
    Data → Plot code. Keep only the `HexCell` slot component and the `logSequentialColor`
    callback that MUI X requires. Likely cause: generator habit of factoring each
    step into a function.'
  - 'Suggestion: the colour bar shows only its end values (1 and 1,244). Intermediate
    log-spaced ticks (10, 100, 1,000) would let a reader read mid-density bins.'
  - 'Suggestion: a slightly smaller hexagon radius (for example HEX_RADIUS_SHARE ≈
    0.055) would resolve the cluster gradients more finely with 30,000 points while
    still reading as a continuous surface.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white, about #FAF8F1, square 2400×2400 canvas.
      Chrome: bold dark title "hexbin-basic · javascript · muix · anyplot.ai" centred at the top. Dark axis titles "Distance east of plaza (m)" / "Distance north of plaza (m)" and dark-grey tick labels −60…60 in steps of 5 on both axes. A horizontal colour bar at the bottom with end labels "1" and "1,244" and the caption "Ping count per bin (log scale)". All text is readable.
      Data: about 15 × 18 pointy-top hexagons tile the whole ±60 m square, outlined in the page colour. Colour runs from brand green #009E73 (sparse fringe) through teal to blue #4467A3 (dense cores). Three dense hotspots are visible: centre (0, 5), lower right (34, −25) and an elongated upper-left one (−30, 21). Empty cells are a faint green tint. The hexagons are slightly taller than wide.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black, about #1A1A17.
      Chrome: title and axis titles in light ink, tick labels and colour bar labels in light grey, axis lines light. No dark-on-dark text.
      Data: hex colours are identical to the light render (green → blue log scale). Outlines switch to the dark page colour and empty cells show as a very dark green tint. Brand green stays clearly visible.
      Legibility verdict: PASS
