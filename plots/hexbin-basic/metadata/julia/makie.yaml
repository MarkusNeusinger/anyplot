review:
  strengths:
  - Uses the theme's imprint_seq fields stops (ANYPLOT_SEQ_FIELDS), so the ramp runs
    light→dark on the cream page and dark→bright on the dark page with every count
    level distinguishable
  - Native hexbin! with colorscale=log10 and a matching LogTicks colorbar labelled
    'Point count (log scale)' makes all four cores and their fringes read at once
  - Theme tokens threaded through every axis and colorbar element; no dark-on-dark
    text in the dark render
  - Flat, reproducible script (Random.seed!(42)) with only used imports and the native
    binning recipe
  weaknesses:
  - 'SC-02 (both): hexagons render as wide flat cells (about 55 × 22 px in the 2000-px
    view, roughly 2.5:1) instead of regular hexagons, because bins=50 is applied to
    x and y ranges of different length on a non-equal-aspect axis → regular hexagons
    on screen (width:height near 2:√3). Likely cause: hexbin! bins=50 with no scalar
    cellsize and the Axis without aspect = DataAspect().'
  - 'Suggestion: a 1000-count tick is dropped because the data peaks near 250; ticks
    at 1, 3, 10, 30, 100, 300 would give the log colorbar finer reading points.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, correct.
      Chrome: bold title "hexbin-basic · julia · makie · anyplot.ai" centered at the top in dark ink; axis titles "Longitude (relative km)" and "Latitude (relative km)" in dark ink, tick labels (-2.5, 0.0, 2.5) in INK_SOFT; top and right spines removed, subtle grid. Colorbar on the right labelled "Point count (log scale)" with ticks 10^0, 10^1, 10^2. All readable.
      Data: about 50-bin hexagons tiling four clusters (centre at 0,0 darkest violet, NW at -2,2.2, E at 2.4,0.6, S at 0.4,-2.5) colored on the light fields ramp mint #66E2B2 → green #009E73 → deep blue → dark violet; sparse fringe cells in pale mint still stand out from the page. Hexagons appear as wide flat cells rather than regular hexagons.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17, correct.
      Chrome: title, axis titles and colorbar label in light ink, ticks in light-soft grey; no dark-on-dark text. Same layout as light.
      Data: same hexagon layout on the dark fields ramp olive #404C02 → green #009E73 → pale blue #CDD9FF, so dense cores glow bright and sparse fringes recede in olive while still visible against the page. The continuous ramp correctly uses the dark stops.
      Legibility verdict: PASS
