  - 'SC-03 (both): the density axis is padded below zero, so the 0.00 baseline floats
    above the x spine → start the y axis at 0. Likely cause: no ylims!(ax, 0, nothing).'
  - 'Suggestion: a slightly brighter dark-mode fill for the second curve would read
    more vividly against #1A1A17.'
