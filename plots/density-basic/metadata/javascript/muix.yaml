review:
  strengths:
  - 'Theme-adaptive chrome is correct in both renders: identical #009E73 data color,
    warm #FAF8F1 / #1A1A17 backgrounds, fully legible dark/light text with no dark-on-dark
    or light-on-light failures'
  - Font sizes are explicitly set throughout (title 22px, axis labels 16px, tick labels
    14px) and remain balanced and legible in both themes
  - 'Correct KDE technique: custom Gaussian kernel with Silverman''s rule-of-thumb
    bandwidth, deterministic LCG-seeded data (reproducible without a seeded Math.random())'
  - Realistic, neutral domain data (marathon finish times) with a sensible right skew
    and a plausible median (~230 min)
  - Single-series legend correctly suppressed (slotProps.legend.hidden) and grid restricted
    to horizontal-only, matching the style guide's line-chart grid guidance
  - Title format exactly matches the mandated `density-basic · javascript · muix ·
    anyplot.ai` convention
  weaknesses:
  - 'Design Excellence sits close to library defaults: a single green area+line with
    no accent styling, annotation, or emphasis beyond the fill — nothing elevates
    it past ''correct but generic'' (e.g. mark/label the peak or median finish time,
    or shade a percentile band).'
  - The KDE curve shows a small secondary wiggle/bump around 420-440 minutes that
    reads as estimation noise rather than a genuine distribution feature — widen the
    bandwidth slightly (e.g. bump the Silverman multiplier above 1.06, or trim the
    sparse right tail before computing bandwidth) so the curve settles smoothly to
    zero without the artifact.
  - No visual hierarchy or focal point beyond the fill/curve itself (DE-03) — a subtle
    peak marker, median line, or short annotation would give the chart a clearer story.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Title "density-basic · javascript · muix · anyplot.ai" in dark ink, top-left, clearly readable. X-axis label "Marathon Finish Time (minutes)" and Y-axis label "Density (×10⁻3)" both dark ink, similar size, fully legible. Tick labels (100-470 on x, 0.0-10.0 on y) are dark, small but crisp. Horizontal grid lines are subtle, light gray, non-competing with the data.
      Data: Single right-skewed KDE curve in brand green (#009E73), 3px stroke, with a semi-transparent green fill (~35% opacity) under the curve. Peak density ~9.8x10^-3 around x=225-230 minutes. Long right tail flattening toward zero past x=340, with a very small secondary wiggle around x=420-440.
      Legibility verdict: PASS - all text is clearly readable against the light background, no overlap, no clipping at any canvas edge.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Title, axis labels, and tick labels are all rendered in light ink (off-white), clearly readable against the dark background. No dark-on-dark text anywhere. Horizontal grid lines are subtle light gray at low opacity, visible but not dominant.
      Data: Same brand green (#009E73) curve and fill as the light render — colors are identical between themes, only chrome (background, text, grid) flipped as expected. Same peak, same skew, same minor tail wiggle.
      Legibility verdict: PASS - all text is clearly readable against the dark background, no dark-on-dark or light-on-light failures observed.
