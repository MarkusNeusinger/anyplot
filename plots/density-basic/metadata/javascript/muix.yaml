review:
  strengths:
  - Correct Gaussian KDE written out in a few lines (Silverman bandwidth 12.9 min),
    as the muix Computation line allows; the curve integrates to 1 on a y axis that
    starts at 0 and falls back to zero at both ends
  - 'Realistic, neutral scenario: 400 right-skewed marathon finish times around a
    230-minute median, so the skew and the thin slow-runner tail are visible without
    spiky noise'
  - 'Native MUI X v9 idioms: LineChart with area: true and curve: monotoneX (no spline
    overshoot on a 240-point grid), axis bands sized via height/width, per-chart classes
    .MuiLineChart-area/.MuiLineChart-line styled through sx, skipAnimation, hideLegend
    for the single series'
  - 'Theme tokens threaded through every chrome element (ink, inkSoft, grid); brand
    green #009E73 identical in both renders with a 0.3 fill opacity that keeps the
    outline distinct'
  - 'Two-level typographic header: bold mandated title over a softer inkSoft subtitle
    that states n and the bandwidth, plus horizontal-only gridlines and an x domain
    fitted exactly to the KDE support'
  weaknesses:
  - 'Suggestion: an optional rug of the 400 observations along the x axis (the Notes
    allow it) would show where the isolated ~430-minute bump comes from.'
  - 'Suggestion: the header still reads ''Library: muix 7.29.1'' although the harness
    pins MUI X 9; the workflow rewrites the header, but the source comment could name
    the right major.'
  image_description: |-
