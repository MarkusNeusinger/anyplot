review:
  strengths:
  - 'Implements the spec''s required smooth Gaussian KDE curve AND both optional notes:
    transparent fill under the curve and a rug plot of individual observations'
  - Right-skewed, gamma-like reaction-time distribution clearly demonstrates skewness,
    matching the spec's stated purpose of revealing distribution shape
  - Explicit, well-proportioned typography (title 22px, axis titles 16px, ticks 14px);
    both renders fully legible with no overlap or clipping
  - 'Correct Imprint palette application: brand green #009E73 identical across light/dark,
    backgrounds correctly theme-adaptive (#FAF8F1 / #1A1A17)'
  - 'Deterministic, realistic data generation: seeded LCG plus a baseline + sum-of-exponentials
    model that plausibly mimics cognitive-test reaction times'
  - Title format matches the mandated convention exactly; credits watermark disabled,
    animation disabled on chart and series
  weaknesses:
  - 'DE-01: Single-hue green fill/line reads as a well-configured library default
    rather than a distinctive design choice — consider a subtler gradient fill (opacity
    fading toward the tails) or an accent element to lift polish'
  - 'DE-02: X/Y axis lines and tick marks remain visible in inkSoft; removing the
    axis lines (keep only the y-axis grid) would give a more refined, chart-junk-free
    look'
  - 'DE-03: No annotation or reference line marks the peak/mode (~310ms) or mean —
    a small callout would sharpen the story beyond just showing the shape'
  - 'LM-02: Uses areaspline''s built-in cubic-spline smoothing (a genuine Highcharts
    strength) but doesn''t otherwise showcase library-distinctive features like plotLines/plotBands
    for statistical markers or dataLabels'
  - Y-axis is extended into negative territory (down to about -0.0005) purely to host
    the rug-plot strip; a common convention for rug plots, but consider a subtle visual
    separator or note so it doesn't read as a negative-density axis
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "density-basic · javascript · highcharts · anyplot.ai" in bold dark ink at top center; x-axis title "Reaction Time (ms)" and y-axis title "Probability Density" in medium-gray ink; tick labels along both axes in the same soft gray; subtle horizontal gridlines only. All chrome elements are clearly legible against the light background.
      Data: A single smooth, right-skewed areaspline curve rendered in Imprint brand green (#009E73) with ~30% opacity fill beneath it, peaking around x≈310ms and tailing off gradually past x≈600ms with a small secondary bump near 700-750ms (reflecting sparse real outlier points). Below the x-axis, a dense strip of small semi-transparent green rug-plot dots (one per observation) shows the raw distribution of ~400 reaction-time values, concentrated where the curve peaks.
      Legibility verdict: PASS — no dark-on-light or hard-to-read text found.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Same title, axis titles, and tick labels now rendered in light/off-white ink, clearly readable against the dark background; gridlines are faint but visible.
      Data: The density curve, fill, and rug-plot dots use the identical Imprint green (#009E73) as the light render — same shape, same peak position, same secondary tail bump — confirming data colors did not shift between themes; only the chrome (background/text/grid) flipped.
      Legibility verdict: PASS — no dark-on-dark failures observed; all text and data elements are clearly distinguishable from the near-black background.
