review:
  strengths:
  - Correct Gaussian KDE implementation from scratch (Silverman's rule bandwidth),
    not a fake/simulated curve
  - Adds an optional rug plot below the baseline via a clever scatter+rotated-line-pointStyle
    technique, giving the reader a secondary view of raw observation density
  - Deterministic mulberry32 PRNG with fixed seed produces a realistic right-skewed
    commute-time distribution
  - 'Clean theme-adaptive chrome: correct Imprint backgrounds and text colors in both
    light and dark renders, identical data colors across themes'
  - Grid decluttered (x-axis grid off, y-axis grid subtle) for a less cluttered read
  - Explicit font sizing throughout, well-proportioned title and axis labels, no overflow
    or clipping
  weaknesses:
  - Design Excellence is at the 'well-configured default' tier — the single mandated
    brand-green fill/line is compliant but not visually distinctive; consider a subtle
    secondary accent (e.g. a dashed mean/median marker) to lift DE-01
  - No explicit annotation or emphasis calling out the distribution's peak or skew
    — visual hierarchy relies entirely on the curve shape itself; a light annotation
    could strengthen the storytelling (DE-03)
  - Rug plot ticks are dense/overlapping near the peak (expected for 400 points concentrated
    in a narrow range) — acceptable, but a slightly lower alpha there would reduce
    the 'solid block' look
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Title "density-basic · javascript · chartjs · anyplot.ai" in dark ink, centered, fully visible and not clipped. Axis titles "Commute Time (minutes)" (x) and "Density" (y) are dark and clearly legible. Tick labels are a softer gray-ink and readable. Horizontal gridlines are subtle; vertical gridlines are intentionally disabled for a cleaner look.
      Data: Single KDE curve in Imprint brand green (#009E73), 3.5px stroke, with a light green area fill (alpha ~0.25) under the curve. A rug plot of individual observations (thin vertical green ticks, alpha ~0.45) sits along the baseline. Distribution is right-skewed, peaking around x≈19 minutes with a long tail out to ~70 minutes.
      Legibility verdict: PASS — all text is clearly readable against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Same title and axis titles now rendered in light/white text, clearly legible. Tick labels are a lighter soft gray, readable. Gridlines match the light render's subtlety (horizontal only).
      Data: The KDE curve stroke and rug ticks use the identical #009E73 green as the light render — confirmed unchanged. The area fill reads as a dark teal (green at low alpha over a near-black background), which is expected alpha-compositing behavior, not a color-token substitution; it remains clearly distinguishable from the pure black canvas.
      Legibility verdict: PASS — all text is clearly readable against the dark background; no dark-on-dark failures found (tick labels, axis titles, and title all render in visibly light color).
