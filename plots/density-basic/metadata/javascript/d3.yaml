review:
  strengths:
  - Correct Gaussian-kernel KDE with Silverman's rule-of-thumb bandwidth, computed
    manually and rendered with a d3-shape area + line pair
  - Optional rug plot included (per spec Notes), implemented as a proper D3 data join
    along the baseline
  - Realistic bimodal marathon finish-time data (competitive vs. recreational runners)
    with plausible bounds (clamped at 120 min, tail out to ~380 min)
  - 'Theme-adaptive chrome is correct in both renders: Imprint brand green #009E73
    identical across themes, warm off-white/near-black backgrounds, all text legible'
  - 'Idiomatic D3: proper data joins (`.data(finishTimes).join("line")` for the rug),
    d3-shape generators for area/line, d3-array (`d3.mean`, `d3.deviation`, `d3.range`)
    for stats'
  - Title format exactly matches the mandated `{spec-id} · {language} · {library}
    · anyplot.ai` pattern; single-series legend correctly omitted
  weaknesses:
  - 'Design Excellence is generic: a single flat green fill+line+rug with no distinguishing
    color harmony or typographic hierarchy beyond the brand default — looks like a
    competent standard implementation rather than a publication-ready one (DE-01)'
  - 'No data storytelling: the curve is genuinely bimodal (competitive vs. recreational
    runner populations per the code comment) but nothing in the visual calls this
    out — consider a subtle peak annotation or label on the two modes so the viewer
    immediately sees the insight instead of having to find it themselves (DE-03)'
  - Rug plot ticks (600 observations, 1px stroke width, 0.35 opacity) read faint at
    full canvas size — a touch more opacity or slightly thicker strokes would make
    the raw-observation layer easier to notice without adding clutter (VQ-03)
  - Visual refinement is solid (L-shaped spines, subtle y-grid) but stops at a well-executed
    default rather than pushing further — e.g. no white edge/definition treatment
    on the rug marks, no secondary color or fill gradient to differentiate the two
    modes (DE-02)
  image_description: |-
