review:
  strengths:
  - 'Clean basic-variant density: one geom_density curve with transparent fill and
    a geom_rug, no extra layers'
  - Bandwidth chosen deliberately (bw = 'sj'), keeping both modes and the right-component
    shoulder visible without spiky noise
  - Theme-specific fill alpha (0.22 light / 0.35 dark) keeps the fill silhouette and
    the curve outline distinct on both surfaces
  - Grid uses the style guide's alpha(INK, 0.15) token, y-only, so it stays subtle
    in both themes
  - Density axis starts exactly at zero via expansion(mult = c(0, 0.05)); tails end
    near the data range
  weaknesses:
  - 'Suggestion: the unused ELEVATED_BG, INK_MUTED and palette positions 2-8 could
    be dropped from the token block to shorten the file.'
