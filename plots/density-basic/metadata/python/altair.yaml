review:
  strengths:
  - Altair-native transform_density computes the KDE in Vega-Lite, reused as one base
    chart for the area, the hover points and the hover dot
  - The curve falls back to zero at both ends because the density extent and the x
    domain are both derived from the data range plus three bandwidths
  - autosize fit fills the 3200x1800 canvas exactly; title, axes and rug use the space
    well in both themes
  - 'Native Vega-Lite interactivity in the HTML: nearest-point selection on pointerover
    with a conditional-opacity hover dot and formatted tooltips'
  - Theme tokens threaded through axis, title and subtitle; both renders fully legible,
    Imprint green identical across themes
  - Bandwidth 4 keeps both modes and the asymmetric right tail visible without noise
  weaknesses:
  - 'Suggestion: the extent of three bandwidths (about 8 to 112) draws flat tails
    past the 0-100 score scale; two bandwidths, or capping the upper extent at the
    maximum possible score, would end the curve closer to the data'
  - 'Suggestion: a slightly heavier rug opacity in the dark render would make the
    individual observations read as clearly as on the light surface'
  image_description: |-
