      Data: one Imprint #009E73 KDE curve (2.5 px outline, 40% fill) with peaks at ~38 (0.030) and ~73 (0.019) and a dip at ~55; curve falls to zero at both ends (about 8 and 112); green rug ticks at 30% opacity along the baseline. Chart fills the canvas.
