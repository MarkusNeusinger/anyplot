review:
  strengths:
  - 'Theme-adaptive chrome works in both renders: #FAF8F1 / #1A1A17 backgrounds, title,
    axis titles, ticks and legend flip via Style tokens and inline CSS'
  - Single smooth Scott-bandwidth KDE in Imprint green with a 0.45 translucent fill
    and a distinct outline, on a density axis fixed to start at zero via range=
  - Rug of all 260 observations in the second Imprint color shows where the right-skewed
    rents actually fall, including the sparse expensive tail
  - Realistic apartment-rent scenario (lognormal, right-skewed) with a column constant
    and a tidy df, so the data block is replaceable
  - pygal's css config used to strip spines and tune the grid; value formatters feed
    the HTML hover tooltips
  weaknesses:
  - 'CQ-04 (code): lines 43-46 write the Gaussian KDE out (bandwidth, broadcasted
    kernel sum, normalisation; about 4 lines) → `kde = scipy.stats.gaussian_kde(rents,
    bw_method="scott")` and `density = kde(x_grid)`, with `bandwidth = kde.factor
    * rents.std(ddof=1)` for the grid padding (scipy). Likely cause: the KDE computed
    by hand instead of with the installed SciPy call.'
  - 'Suggestion: tick labels on the y-axis mix 0.001 and 0.0011; a fixed four-decimal
    axis format would read more evenly.'
