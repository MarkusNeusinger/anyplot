  - Gradient fill of the density area via imshow clipped to a PathPatch, a matplotlib-specific
    technique
  - EventCollection rug in a band below the curve
  - Theme tokens on all text; both renders readable
  - Realistic cache-hit vs database-query response-time scenario
  weaknesses:
  - 'SC-03 (both): the density axis is labelled down to ''-0.002'', a negative density
    value under the rug band → no tick labels below 0 on the density axis. Likely
    cause: the FuncFormatter that should blank negative ticks is not applied to the
    rendered axis; ax.set_ylim(bottom=-0.0020) exposes the tick.'
  - 'SC-01 (code): the source annotates both peaks with ''Cache hit ~45 ms'' / ''DB
    query ~140 ms'' callouts with arrows, which the basic variant excludes → remove
    the two ax.annotate calls and the argrelextrema peak search. Likely cause: the
    annotation block at the end of the script.'
  - 'Suggestion: give the curve a little headroom so the main peak does not touch
    the top of the axes.'
