review:
  strengths:
  - Native geom_density with kernel, adjust=0.85 and trim=True keeps the curve inside
    the data range and shows the skew and shoulders
  - Translucent rug shows the 500 observations without hiding the fill
  - layer_tooltips() exposes the density value on hover in the HTML output
  - Theme-adaptive chrome is correct in both renders
  weaknesses:
  - 'SC-01 (both): three dashed reference lines at 200/240/300 min and three text
    callouts (Elite, Main Pack, Casual) are layers a -basic density spec excludes
    → remove the geom_vline and geom_text layers and peaks_df. Likely cause: geom_vline(data=peaks_df)
    and geom_text(data=peaks_df).'
  - 'DE-02 (both): the y grid is drawn in solid INK_SOFT and reads as a high-contrast
    grid → the style guide''s GRID token rgba(26,26,23,0.15) / rgba(240,239,232,0.15).
    Likely cause: panel_grid_major_y=element_line(color=INK_SOFT).'
  - 'DE-02 (both): a four-sided frame encloses the panel, so the top and right spines
    are drawn where nothing requires them → an L-shaped frame or none. Likely cause:
    the panel frame survives theme_minimal() + panel_border=element_blank().'
  - 'SC-03 (both): the density axis is expanded about 2 % below zero and has no 0
    tick (lowest tick 2×10⁻³) → start the axis at exactly 0 with a 0 tick. Likely
    cause: expand=[0.02, 0, 0.15, 0] and breaks starting at 0.002.'
  - 'Suggestion: a slightly larger tick font would balance the 12 pt axis titles.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1.
      Chrome: title 'density-basic · python · letsplot · anyplot.ai' top-left in dark INK, x title 'Finish Time (minutes)', y title 'Density (×10⁻³)', ticks 150-350 and 2-10 in INK_SOFT, all readable. Solid dark-grey horizontal grid lines, a four-sided frame around the panel.
      Data: #009E73 KDE curve with alpha fill, green rug at the bottom, three dashed grey reference lines at 200/240/300 with small text callouts 'Elite ~3:20', 'Main Pack ~4:00', 'Casual ~5:00'.
