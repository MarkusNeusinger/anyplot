review:
  strengths:
  - Layers geom_area and geom_line on the same stat='density' with after_stat('density')
  - Fill at alpha 0.3 keeps the gridlines and rug visible, with a distinct outline
    in both themes
  - Bimodal exam-score sample shows the KDE's ability to reveal shape; tails end at
    the data range
  - Theme tokens thread through all chrome; both renders readable
  weaknesses:
  - 'SC-01 (both): dashed reference lines at 72 and 88 with ''Main Group (μ ≈ 72)''
    and ''High Achievers (μ ≈ 88)'' callouts are layers the basic variant excludes
    (C5) → remove both lines and both callouts. Likely cause: geom_vline and annotate(''text'')
    calls.'
  - 'SC-02 (both): the curve stops abruptly at the data limits, at about 0.003 density
    at 100 and 0.001 at 46, instead of falling back toward zero (C1) → let the density
    run a little past the data so both ends approach zero. Likely cause: stat=''density''
    evaluated only over the data range (no expanded x limits).'
  - 'CQ-04 (code): sys.path manipulation with noqa comments, a title-size formula
    that always yields 12 for this title, an unused ELEVATED_BG token and a legend_text
    setting with no legend add about 15 lines without effect → delete them. Likely
    cause: boilerplate carried over from a template.'
  - 'Suggestion: the callout text could be larger, though removing the callouts (the
    defect above) makes this moot.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1.
      Chrome: mandated title centered in dark ink; axis titles 'Test Score (points)' and 'Probability Density'; tick labels 45-95 by 10 and 0.00-0.04; subtle y grid; L-shaped axis line. All readable.
      Data: #009E73 density curve with translucent fill and a grey rug; the curve starts at about 0.001 at 46 and stops abruptly at about 0.003 at 100. Two dashed grey vertical reference lines at 72 and 88 with tiny callouts 'Main Group (μ ≈ 72)' and 'High Achievers (μ ≈ 88)'; the 88 line runs through its callout.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: light title, axis titles and ticks; subtle grid; no dark-on-dark text.
      Data: same #009E73 curve and fill as the light render, light-grey rug, light dashed reference lines and light callout text.
      Legibility verdict: PASS
