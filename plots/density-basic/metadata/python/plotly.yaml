review:
  strengths:
  - 'The basic variant kept clean: one KDE curve from scipy.stats.gaussian_kde with
    a translucent fill=''tozeroy'' area and the optional rug, with no callouts, reference
    lines or extra encodings'
  - The evaluation grid is derived from the data range with a 10 % pad, so the tails
    fall back toward zero just past the smallest and largest observations and every
    rug tick sits under the curve
  - Bimodal SAT Math scenario (main group around 540, a high-achiever group around
    680) shows both modes and the right-hand skew at Scott's bandwidth
  - The hovertemplate is written for the values the chart shows (score and density),
    and dotted x spike lines with hovermode='x' give a read-out in the HTML view
  - 'Theme tokens threaded through title, axis titles, ticks, grid and axis lines:
    both renders are fully legible'
  weaknesses:
  - 'VQ-03 (dark): the rug ticks are drawn in INK_SOFT #B8B7B0 at opacity 0.5 over
    the dark green fill and read as a faint grey haze, so single observations are
    hard to pick out → raise the rug''s contrast in the dark render (opacity about
    0.7–0.8, +0.2 to +0.3). Likely cause: marker opacity 0.5 shared by both themes.'
  - 'Suggestion: lighten the fill alpha slightly in the dark render so the rug and
    gridlines read through it as clearly as in the light render.'
  - 'Suggestion: a slightly heavier curve (about 3 px) would give the outline a little
    more presence against the fill.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, not pure white.
      Chrome: centered title "density-basic · python · plotly · anyplot.ai" in dark ink at 16 px; x-axis title "SAT Math Score (points)" and y-axis title "Density" at 12 px; tick labels 350–800 and 0–0.004 in INK_SOFT at 10 px; subtle horizontal gridlines only; thin left and bottom axis lines. All readable.
      Data: one smooth brand-green #009E73 KDE curve with a translucent green fill to zero, bimodal (main peak near 540, a second near 675, valley near 620), tails falling toward zero at about 350 and 810; 500 dark-grey rug ticks along the baseline, clearly visible through the fill. No callouts or reference lines.
