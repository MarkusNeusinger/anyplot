review:
  strengths:
  - 'Single density curve in Imprint #009E73 with a translucent fill (alpha 0.18)
    and a rug at alpha 0.4: gridlines and rug ticks stay visible through the fill
    and the outline stays distinct in both themes'
  - Silverman bandwidth keeps both modes (about 150 ms and 280 ms) and the right skew
    visible, without spiky noise
  - Density axis starts at zero with Range1d(0, top * 1.1), and the rug sits on the
    baseline at 5 % of the peak height, so no negative density region is shown
  - x_range is fitted to the KDE grid (three bandwidths past the data), so the tails
    fall to zero at the frame edges with no blank margin
  - 'Theme tokens reach every chrome element: title, axis titles, ticks, axis lines
    and grid flip correctly between #FAF8F1 and #1A1A17'
  - A HoverTool in vline mode with line_policy='nearest', tied to the curve renderer,
    gives readable value and density inspection in the HTML output
  - Column constant plus tidy df with ColumnDataSource follows the adaptable-code
    zones; the axis label and tooltip come from the constant
  weaknesses:
  - 'CQ-04 (code): lines 53–59 hand-write a Gaussian KDE (broadcast exp sum and normalisation,
    about 4 lines) that an available call computes the same way → `scipy.stats.gaussian_kde(values,
    bw_method=bandwidth / values.std(ddof=1))(x_grid)` (scipy). Likely cause: the
    manual density formula.'
  - 'Suggestion: a slightly lighter y-tick format such as 0.000 would make the density
    ticks quicker to read.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole canvas, no white edge.
      Chrome: title "density-basic · python · bokeh · anyplot.ai" in dark ink, bold, top left, about 40 % of the width; italic axis titles "Response time (ms)" and "Density" in dark ink; tick labels 100–400 and 0.0000–0.0080 in INK_SOFT; subtle horizontal grid only; no frame; left and bottom axis lines. All readable.
      Data: one bimodal KDE curve in #009E73 (line width 5) with a light green fill; major mode at about 150 ms (density about 0.0088), minor mode at about 280 ms (about 0.0025), dip near 225 ms; the curve falls to zero at both frame edges (about 10 and 420 ms). 400 rug ticks along the zero baseline at alpha 0.4, visible through the fill. Density axis starts at 0.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
