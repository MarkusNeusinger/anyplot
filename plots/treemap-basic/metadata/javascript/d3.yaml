review:
  strengths:
  - Imprint categorical palette applied in exact canonical order across the 5 divisions
    (green → lavender → blue → ochre → matte red), with brand green correctly on the
    first series (Software Engineering)
  - Rank-based shading (d3.color(...).darker(rank * 0.32)) of leaf tiles within each
    division communicates sub-hierarchy magnitude beyond raw area alone
  - WCAG relative-luminance calculation picks dark or white label text per-tile, guaranteeing
    contrast regardless of shade depth — a genuinely accessible approach rather than
    a hardcoded assumption
  - d3.treemapResquarify + paddingOuter/paddingTop/paddingInner produces a clean two-level
    nested layout with visible parent/child boundaries and division header bands
  - 'Both renders are theme-correct: chrome (backgrounds, title, division header text)
    flips between light/dark while leaf/division fill colors are pixel-identical,
    exactly as required'
  - Title format is spec-compliant (`treemap-basic · javascript · d3 · anyplot.ai`)
    with a clear, unit-labeled subtitle ("R&D Budget Allocation by Division and Project
    ($ thousands)")
  - Realistic, neutral R&D budget dataset with 5 divisions and 2-4 projects each (15
    leaves), well within the 5-50 item spec range
  weaknesses:
  - Leaf name/value labels (13px/12px) are on the small side for a 3200px-wide canvas
    and will read very small at the ~400px mobile-thumbnail scale used on the site;
    bump project-name labels to ~14px minimum per the d3.md guidance range
  - relativeLuminance/labelColorFor helper functions deviate slightly from the strict
    'Imports → Data → Plot → Save, no functions' KISS structure — justified here by
    the accessible-contrast use case, but could be inlined as a single expression
    to fully match the pattern
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "treemap-basic · javascript · d3 · anyplot.ai" in bold dark text, subtitle "R&D Budget Allocation by Division and Project ($ thousands)" in softer gray beneath it — both clearly readable. Division header bands (Software Engineering, Hardware Engineering, Data Science, Product Design, Quality Assurance) show dark text on lightly-tinted colored backgrounds with matching colored 1.5px borders — fully legible.
      Data: Five divisions colored with the Imprint categorical palette in canonical order — Software Engineering (brand green #009E73), Hardware Engineering (lavender/purple), Data Science (blue), Product Design (ochre), Quality Assurance (matte red). Leaf tiles within each division are shaded progressively darker by rank, with white or near-black text automatically chosen per tile for contrast. Thin light borders separate all tiles cleanly. Every visible tile shows a bold name label and (where tall enough) a "$Xk" value label.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Title and subtitle render in white/light-gray text, clearly legible against the dark background. Division header bands now show white text on darkly-tinted colored backgrounds (same hues at low opacity over the dark surface) with the same colored borders — no dark-on-dark issues found.
      Data: Leaf tile fill colors are pixel-identical to the light render (same green/lavender/blue/ochre/red family and per-tile shading) — confirms chrome-only theme adaptation as required. Leaf borders (stroke = page background) render as thin dark separators instead of light ones, correctly following the theme token. Label text color remains automatically contrast-correct per tile since it is computed from the tile's own luminance, independent of theme.
      Legibility verdict: PASS
