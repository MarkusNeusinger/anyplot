review:
  strengths:
  - 'Correct 2-level treemap hierarchy (division → project) with rectangle area proportional
    to value; canonical Imprint palette order verified pixel-by-pixel (#009E73, #C475FD,
    #4467A3, #BD8233, #AE3030 in that order after ECharts'' default value-descending
    sort)'
  - Idiomatic, distinctive use of ECharts treemap `levels[]` config — per-depth `upperLabel`
    header bars, `colorSaturation`/`borderColorSaturation` for hierarchy shading,
    theme-matched borders (`t.pageBg`) between top-level groups
  - 'Clean, deterministic, minimal code — no unused imports, correct mount-node contract
    (`animation: false`, no explicit size/devicePixelRatio)'
  - Realistic, neutral R&D-budget dataset (19 nodes, $280k–$1850k range), well within
    the 5–50 item spec range
  - 'Title format matches spec exactly; both renders are theme-correct (backgrounds
    #FAF8F1/#1A1A17, chrome flips, data colors identical between themes)'
  - No clipping at any canvas edge — title and every tile label confirmed fully inside
    the 3200×1800 canvas
  weaknesses:
  - 'Fixed cream TILE_LABEL (#FAF8F1) text is used on every tile regardless of fill
    brightness. Measured WCAG contrast ratios (text vs. sampled fill pixel, identical
    in both renders): Core Services (the single LARGEST tile in the whole chart, fill
    ≈ rgb(26,255,193)) = 1.23:1; Developer Tools = 1.64:1; Infrastructure = 1.87:1;
    Reliability = 2.54:1; Threat Detection = 2.44:1 — all far below the 4.5:1 WCAG
    AA minimum for normal text. Fix: darken the label color on bright fills (e.g.
    switch to `t.ink`/near-black when the tile''s own value-based lightness pushes
    it above a luminance threshold), or constrain the level-2 `colorSaturation`/lightness
    range so no child tile gets this washed-out bright, so every label clears ≥4.5:1
    contrast.'
  - 'Minor robustness note: because ECharts treemap sorts children by value by default
    before assigning `color` by index, the top-level division colors land in Imprint
    canonical order only because Platform Engineering happens to have the largest
    total value. Consider setting `itemStyle.color` explicitly per division (looked
    up from `t.palette` by the division''s position in the original, unsorted `divisions`
    array) so the canonical-order guarantee doesn''t depend on the data''s value ordering.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1) plot background, confirmed via pixel sample (250,248,241).
      Chrome: Title "treemap-basic · javascript · echarts · anyplot.ai" centered at top in dark ink, fully visible, not clipped. Five division header bars ("Platform Engineering", "Data & AI", "Product Design", "Security", "QA & Support") in bold cream-on-dark-hue text, all clearly legible. Thin cream borders (matching page background) separate the five top-level division blocks; slightly darker borders separate project tiles within each division.
      Data: 5 divisions arranged by the treemap's default value-descending sort (Platform Engineering largest → QA & Support smallest), each subdivided into project tiles whose area is proportional to $-value. Division colors verified against the Imprint palette in canonical order: Platform Engineering=#009E73 (green, position 1), Data & AI=#C475FD family (lavender, position 2), Product Design=#4467A3 family (blue, position 3), Security=#BD8233 family (ochre, position 4), QA & Support=#AE3030 family (red, position 5). Project tiles within each division are lighter/darker shades of the parent hue, scaled by each project's relative value (larger project = brighter/lighter tile).
      Legibility verdict: PARTIAL FAIL — most labels are readable, but on the brightest tiles (all four Platform Engineering children, plus Threat Detection) the fixed cream label text has measured WCAG contrast ratios between 1.23:1 and 2.54:1 against the fill — far below the 4.5:1 AA minimum. The text is still visually parseable up close (hue difference helps) but is genuinely low-contrast, and it happens on the single largest, most prominent tile in the entire chart ("Core Services", 1.23:1).

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17) plot background — page chrome (title, division header text, tick-free layout) all switch to light/cream text and are clearly readable against the dark surface. No dark-on-dark failures observed on any chrome element.
      Chrome: Title and all five division headers render in light cream text on the dark page background, fully legible. Border color between top-level divisions is now the dark page background (matches `t.pageBg` token), correctly threaded through the theme.
      Data: Tile fill colors are pixel-identical to the light render (confirmed via direct sampling) — only the page chrome (title ink, borders between top-level blocks) flips between themes, exactly as required.
      Legibility verdict: PARTIAL FAIL for the same reason as the light render — the low-contrast label-vs-fill issue on Core Services/Developer Tools/Infrastructure/Reliability/Threat Detection is a property of the tile fill vs. the fixed cream TILE_LABEL, so it reproduces identically in the dark render (tile fills don't change between themes). No additional dark-specific failures found.
