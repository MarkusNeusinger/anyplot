review:
  strengths:
  - Correctly implements a squarified treemap (Bruls-Huizing-van Wijk algorithm) via
    MUI X's ChartContainer/useDrawingArea composition primitives -- a legitimate use
    of the community package's low-level layout system since MUI X community has no
    native Treemap chart type.
  - Adaptive label visibility (fitsLabel/showSub helpers) hides labels that would
    not fit their tile, preventing any overlap or illegible micro-text across all
    26 rectangles.
  - Contrast-aware text color via a relative-luminance calculation guarantees readable
    text on every tile fill, in both themes, without hardcoding light/dark exceptions.
  - Canonical Imprint palette order used exactly (green first, then purple/blue/ochre/red/cyan);
    department colors are pixel-identical between light and dark renders, only chrome
    flips.
  - Cost-center tiles are tinted progressively lighter within each department by relative
    size, directly satisfying the spec's 'show hierarchy through nesting depth or
    color shading intensity' note.
  - Explicit data-story annotation ('Engineering leads at $1,880K -- 30% of total
    budget') gives the viewer an immediate, stated takeaway rather than leaving them
    to find it.
  - Deterministic, realistic company-expense dataset (6 departments, 20 cost centers,
    $110K-$820K range) covers the full range of hierarchy sizes the treemap layout
    needs to demonstrate.
  weaknesses:
  - No native MUI X chart component renders the actual marks (ChartContainer is passed
    series=[]); the treemap tiles are 100% hand-drawn SVG rects/text. Using ChartContainer/useDrawingArea
    for the surface and margin system is idiomatic, but it caps Library Mastery since
    no MUI X series/marks API is exercised for the data itself.
  - The large-department header path (flat <rect>+<text>) and the small-department
    fallback path (TreemapRect helper) draw tile borders slightly differently, giving
    a minor visual inconsistency in how department separators render across size thresholds.
  - 'The squarify/color-math helpers (7 pure functions: worstRatio, layoutRow, squarify,
    hexToRgb, rgbToHsl, hueToRgb, hslToRgb, tintRgb, relLuminanceRgb, textColorForRgb)
    add real code volume -- justified by the missing library primitive, but it departs
    from the flat-script KISS ideal expected of simpler chart types.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1-like), not pure white, not dark -- correct light-theme page tone.
      Chrome: Title "treemap-basic · javascript · muix · anyplot.ai" in bold dark text, centered, ~45% of canvas width. Subtitle "Company expense breakdown by department and cost center · values in $K, area ∝ budget" in gray beneath it. Italic insight line "Engineering leads at $1,880K — 30% of total budget" colored in Engineering's brand-green. All three lines are clearly legible against the light background.
      Data: 6 department bands (Engineering, Sales, Marketing, R&D, Operations, Customer Success) squarified into rectangles sized by budget, each in a distinct Imprint hue (green, purple, blue, ochre, red, cyan respectively -- Engineering is #009E73 brand green, confirming VQ-07 first-series compliance). Within each department, cost-center tiles are progressively lighter tints of the department hue, largest tile = base hue. Every tile has a header/label ("Name" + "$XXXK") whose text color (dark navy or cream) is computed per-tile for contrast, so all labels are legible regardless of tile lightness. Thin off-white gutters separate all tiles.
      Legibility verdict: PASS -- no light-on-light text, no clipped labels, small tiles (e.g. "Training $110K", "Patents & Compliance $140K") remain fully readable (verified via pixel crops).

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17-like), not pure black, not light -- correct dark-theme page tone.
      Chrome: Same title/subtitle now rendered in light/cream text, clearly legible against the dark background. The insight line keeps the same brand-green color, which reads well on the dark surface too.
      Data: All department and cost-center tile colors are pixel-identical to the light render (verified via crop comparison of the R&D "Patents & Compliance" and Customer Success "Training" tiles) -- only the page chrome flipped, exactly as required. Per-tile text color is computed from each tile's own fill luminance (independent of page theme), so it is identical to the light render and remains legible on every tile.
      Legibility verdict: PASS -- no dark-on-dark failures; every title/label/tick-equivalent element is clearly visible in both themes.
