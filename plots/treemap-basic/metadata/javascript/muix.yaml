review:
  strengths:
  - Squarified layout (Bruls, Huizing & van Wijk) gives compact, near-square tiles
    that tile the full plot area, with each area proportional to its budget value
  - 'Two-level hierarchy is shown both ways the Notes allow: each department sits
    in one block under a header band in the full Imprint hue that carries its total,
    and its cost-center tiles use a lighter shade of the same hue'
  - 'Hierarchy boundaries come out clearly: 3 px page-colored gutters between departments
    and 2 px page-colored strokes between cost centers, and both stay visible as subtle
    borders in both themes'
  - Label ink follows each fill's luminance, so every header and tile label reads
    clearly against its fill in both themes, and the fit checks drop labels only where
    they would not fit
  - Imprint palette applied in canonical order, with slot 5 (the matte-red semantic
    anchor) skipped for ordinary categories as the style guide asks; data colors are
    identical across themes
  - 'Idiomatic MUI X v9 composition: a custom SVG layer inside ChartsContainer draws
    through useXScale/useYScale px-unit scales, with skipAnimation and native <title>
    tooltips for the HTML view'
  weaknesses:
  - 'Suggestion: show each tile''s share of the total (for example ''820 · 13%'')
    next to its value to make the part-to-whole reading even faster.'
  - 'Suggestion: at the 400 px thumbnail the 14-15 px tile labels become very small;
    slightly larger labels on the biggest tiles would hold up better at thumbnail
    size.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the full 3200x1800 canvas.
      Chrome: dark title "treemap-basic · javascript · muix · anyplot.ai" at top-left, with a soft-ink subtitle below it ("20 cost center tiles in 6 department blocks · area ∝ Budget (USD thousand), 6,230 in total"). No axes or grid. All text is readable.
      Data: six department blocks: Engineering in brand green #009E73 (largest, left), Sales in purple, R&D in ochre, Marketing in blue, Operations in cyan, and Customer Success in rose. Each block has a full-hue header band with "Name · total" and lighter-shade cost-center tiles with name and value labels. Page-colored gutters and strokes separate the blocks and tiles. All 20 tiles are labeled.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title in light ink and subtitle in light soft ink, both clearly readable. No dark-on-dark text anywhere.
      Data: fills identical to the light render. Borders and gutters now take the dark page color and read as subtle dark separators. Tile labels keep fill-contrast ink (dark on the light shades; white on the darker blue and rose headers), all readable.
      Legibility verdict: PASS
