review:
  strengths:
  - Squarified layout (Bruls, Huizing & van Wijk) written out for both levels keeps
    every tile compact; the largest tile (Platform Infra) and the smallest (Training)
    both read as blocks rather than slivers
  - 'Two-level hierarchy told apart through nesting depth and shading: each department
    gets a full-strength Imprint header band carrying its name and total, and its
    cost-center tiles take a 30 % lighter tint of the same hue'
  - Label ink is chosen per fill by relative luminance, so dark text on lavender/ochre/cyan
    and light text on the blue and red header bands stay readable in both themes
  - Borders are drawn in the page color with a wider 3 px gutter between departments
    than the 2 px seam between cost centers, so the hierarchy boundaries flip correctly
    with the theme
  - Composes a custom SVG layer inside ChartsContainer through the useXScale/useYScale
    hooks, the community-package route to a chart type MUI X does not ship; native
    <title> tooltips add exact value and share in the HTML output
  weaknesses:
  - 'VQ-07 (both): Operations, an ordinary department, takes matte red #AE3030 by
    ordinal position 5, the slot the style guide reserves for bad/loss/error roles
    → skip slot 5 for a non-semantic sixth category and use cyan #2ABCCD for Operations
    and rose #954477 for Customer Success. Likely cause: shades built from t.palette[i]
    with i running straight through 0..5.'
  - 'Suggestion: the cost-center labels at 15 px blur in the 400 px thumbnail; a 16–17
    px label would hold up better on mobile.'
  - 'Suggestion: the subtitle could show each department''s share of the total rather
    than only the grand total.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, no pure white.
      Chrome: bold title "treemap-basic · javascript · muix · anyplot.ai" top left in dark ink, a soft-ink subtitle "20 cost center tiles in 6 department blocks · area ∝ Budget (USD thousand), 6,230 in total". No axes or grid, as the spec requires. All text readable.
      Data: six department blocks tile the area: Engineering (#009E73 header, 1,880) as a tall left column, Sales (lavender, 1,180) and Marketing (blue, 960) stacked in the middle, R&D (ochre, 880) top right, Operations (matte red, 740) and Customer Success (cyan, 590) bottom right. Each block has a full-strength header band with name and total, and its cost-center tiles below in a lighter tint, each labelled with name and value (all 20 tiles labelled). Page-colored borders separate tiles, with wider gutters between departments.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17, not pure black.
      Chrome: title in light ink, subtitle in soft light ink, both clearly readable; no dark-on-dark text.
      Data: identical fills and layout to the light render; only the borders/gutters flip to the dark page color, which reads as clean dark seams. Tile label ink is luminance-chosen per fill and identical to light; header text on blue and red bands is light, on the others dark; all readable. Brand green header clearly visible.
      Legibility verdict: PASS
