review:
  strengths:
  - Hand-builds a correct squarified treemap (Bruls, Huizing & van Wijk algorithm)
    since community @mui/x-charts has no Treemap component -- properly justified with
    a comment and precedent reference instead of reaching for x-charts-pro
  - 'First categorical series is exactly #009E73 and the remaining 5 department colors
    follow the canonical Imprint order (#C475FD, #4467A3, #BD8233, #AE3030, #2ABCCD)
    -- verified identical between light and dark renders'
  - Cost-center tiles within each department are progressively tinted via a real HSL-lightening
    function (not alpha) proportional to relative size, giving a genuine nesting-depth
    cue as the spec's Notes request
  - Text color per tile is chosen via WCAG relative-luminance contrast against the
    actual fill (light or dark text as needed), so every label stays legible instead
    of using a single hardcoded ink color
  - Labels are conditionally hidden per-tile via a fitsLabel() measurement so small
    rectangles never show overflowing/clipped text -- no overlap in either render
  - Native SVG <title> tooltips on every rectangle add real hover detail without faking
    any interactivity
  - Fully deterministic hard-coded data, clean single import (ChartContainer only),
    skipAnimation set correctly
  - Canvas correctly sized to 3200x1800 with balanced margins; plot fills the vast
    majority of the canvas in both themes
  weaknesses:
  - 'LM-02 is weak: the ChartContainer is used only for its ThemeProvider/ChartsSurface
    context (series=[] is never populated) -- none of MUI X''s distinctive charting
    machinery (its tooltip system, useDrawingArea, interaction layer) is actually
    exercised, so the implementation reads as generic hand-rolled SVG wrapped in a
    MUI X shell rather than a showcase of the library'
  - 'Design Excellence is solid but not yet exceptional: typography is a single weight/size
    hierarchy across all tiles, and there''s no additional polish (e.g. a subtle total-budget
    annotation, refined header typography) that would push this toward publication
    quality'
  - 'DEPT_COLORS is built by indexing the ORIGINAL DEPARTMENTS array order, but colors
    are then applied by indexing into squarify()''s output, which is sorted by VALUE
    descending -- these two orders only coincide right now because DEPARTMENTS happens
    to already be listed in descending budget order. This is fragile: reorder or rebalance
    the input data and colors silently reassign to different departments than the
    array position implies. Key colors by department name instead of by array position
    to make the mapping robust.'
  - Title renders at only ~30% of canvas width -- well under the guide's 50-70% band
    for a short custom title; a slightly larger title fontsize would improve visual
    balance without risking overflow given how much headroom exists
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 -- not pure white.
      Chrome: Centered dark title "treemap-basic · javascript · muix · anyplot.ai" and a smaller dark-gray subtitle ("Company expense breakdown by department and cost center · values in $K, area ∝ budget") both clearly legible against the light background. No axes/ticks -- appropriate for a treemap.
      Data: Six department blocks (Engineering, Sales, Marketing, R&D, Operations, Customer Success) as colored header bars with nested cost-center rectangles inside, sized by squarified area proportional to budget value. First/largest department (Engineering) is #009E73 green; the remaining departments follow the Imprint palette in canonical order (purple, steel blue, ochre, red, teal). Cost-center tiles within each department are lighter tints of the parent hue, with darker tints for larger tiles. Labels and $K values are printed inside tiles large enough to fit them; smaller tiles correctly omit labels. Text color flips between dark and light per-tile based on background luminance, so every label is readable.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 -- not pure black.
      Chrome: Same title/subtitle text, now rendered in light ink, clearly legible against the dark background. No dark-on-dark or light-on-light failures observed anywhere, including on the darker department header bars and on the lightest cost-center tints.
      Data: Identical data colors to the light render (green Engineering, purple Sales, steel-blue Marketing, ochre R&D, red Operations, teal Customer Success) -- confirmed only the page background and outer chrome flipped, the categorical/tint colors did not change.
      Legibility verdict: PASS
