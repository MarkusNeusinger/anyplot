review:
  strengths:
  - Implements a proper squarified treemap layout (Bruls-Huizing-van Wijk), not a
    naive grid, producing well-proportioned, aspect-balanced rectangles
  - Contrast-aware label ink (per-tile relative-luminance check) keeps every label
    legible regardless of the underlying tile's saturation or tint, in both themes
  - Category label 'chips' backed by the elevated-bg token create a clean two-level
    hierarchy (category totals + subcategory name/value) without needing a separate
    legend
  - 'Correct Imprint palette canonical ordering by category rank (green -> purple
    -> blue -> ochre -> red), first series is brand green #009E73'
  - Clean theme-adaptive chrome (backgrounds, borders, chip fills) and a realistic,
    neutral cloud-storage dataset with sensible TB values
  weaknesses:
  - 'VQ-07: The intra-category tint `weighted_color_mean(tint, PAGE_BG, base)` blends
    toward the theme-dependent PAGE_BG, so every subcategory tile except the largest
    one in each group renders a different hue between light and dark mode (e.g. ''ML
    Model Store'' is a pastel mint in light mode but a muted dark green in dark mode).
    The style guide requires the Imprint data colors to be pixel-identical across
    themes -- only chrome may flip. Fix: blend toward a fixed neutral (e.g. white/black
    at a fixed ratio, or adjust the HSL/LCH lightness channel directly) instead of
    PAGE_BG, so the tint direction is the same in both renders.'
  - 'DQ-01: All five categories have 2-3 subcategories; showing at least one category
    with a single subcategory (or none) would better exercise the ''optional sub-category''
    edge case the spec calls out.'
  - 'LM-02: The overall technique (manual polygon rectangles + luminance-based text
    color) is not distinctly Makie -- it could be replicated in matplotlib patches
    with similar effort. Consider leaning further into Makie-specific strengths (e.g.
    Colors.jl colorspace-aware blending in Lab/LCH for perceptually uniform tints)
    to raise distinctiveness.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white, matches #FAF8F1 -- not pure white, not dark.
      Chrome: Title "Cloud Storage Usage by Team · treemap-basic · julia · makie · anyplot.ai" in dark ink, centered at top, comfortably sized, not clipped. Category label chips use a cream elevated-bg fill with a soft border, bold dark text. Subtle off-white hairlines separate adjacent tiles; darker soft-ink outlines separate the five category groups.
      Data: Five category groups (Data & Analytics 202TB green, Engineering 175TB purple, Marketing 55TB blue, Product Design 45TB ochre, Customer Support 43TB red) tiled via a squarified treemap, each split into 2-3 labeled subcategory leaves with area proportional to value (e.g. Data Warehouse 96TB, CI/CD Artifacts 82TB). Leaf tiles use a lightness tint of the category's base color to indicate rank within the category; label text color flips between dark and light per-tile based on the tile's own luminance, and stays readable everywhere observed.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black, matches #1A1A17 -- not pure black, not light.
      Chrome: Title renders in light ink, clearly visible. Category chips flip to the dark elevated-bg (#242420) fill with light bold text, fully legible. Hairlines and group outlines flip to their dark-theme soft-ink tone.
      Data: Same five category groups in the same positions with the same base hues (green/purple/blue/ochre/red) as the light render -- the top-level category colors are identical across themes as required. However, the intra-category tint blends each non-primary subcategory tile toward the theme's PAGE_BG rather than a fixed neutral, so several leaf tiles (e.g. "ML Model Store", "Log Archive", "Container Registry") show a visibly different hue/tone between the light and dark renders instead of being pixel-identical -- this is a real palette-compliance gap (see VQ-07 in Weaknesses), even though no text is dark-on-dark or otherwise unreadable.
      Legibility verdict: PASS (all text reads clearly in dark mode; the issue found is a data-color theme-consistency defect, not a legibility failure)
