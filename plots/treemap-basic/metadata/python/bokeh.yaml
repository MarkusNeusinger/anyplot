review:
  strengths:
  - Implements a real squarify algorithm for proportional-area treemap layout since
    bokeh has no native treemap glyph — a genuine, non-trivial engineering effort
    rather than a shortcut
  - Category-to-color mapping follows canonical Imprint order exactly (Engineering=#009E73
    first, then Sales/Marketing/HR/Finance in appearance order), matching legend order
    1:1
  - Theme tokens (PAGE_BG/INK/INK_SOFT) correctly threaded through background, title,
    labels, legend, and rectangle borders — both renders are fully readable with identical
    data colors and only chrome flipping
  - HoverTool provides genuinely useful detail (department, project, budget, share%)
    for the HTML view without faking any interactivity in the static PNG
  - Custom Legend built from invisible dummy renderers is cleanly anchored in the
    right gutter outside the 0-100 data range, so it never collides with a rectangle
  - Title matches the required '{spec-id} · {language} · {library} · anyplot.ai' format
    exactly, canvas is the correct 3200x1800 landscape size with no clipping
  weaknesses:
  - All 12 leaf rectangles are squarified as one flat set sorted by value, with hierarchy
    conveyed only through color — there is no visual grouping/nesting of subcategories
    within their parent category's region (e.g. thicker borders around each category
    cluster), so category adjacency in the layout is coincidental (Frontend/Enterprise/Backend
    stack together despite being two different categories)
  - Design is functional but plain — uniform thin borders everywhere regardless of
    whether the boundary is between categories or within one, missing an opportunity
    for a stronger visual hierarchy cue
  - The squarify() helper is a ~80-line general-purpose layout algorithm; necessary
    given bokeh's lack of a native treemap glyph, but it pushes past the typical KISS
    bar for this catalog's plots
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1), matches spec.
      Chrome: Bold centered title "treemap-basic · bokeh · anyplot.ai" in dark ink, clearly legible. No axes shown (intentional, appropriate for a treemap). Legend anchored in the right gutter on an elevated cream card with a soft border, listing Engineering/Sales/Marketing/HR/Finance with small colored square swatches matching each category's fill color.
      Data: 12 rectangles laid out via a squarify algorithm, area proportional to budget value. Colors follow the Imprint palette in canonical order — Engineering=#009E73 (green, first series, correct), Sales=purple, Marketing=blue, HR=amber, Finance=red. Each rectangle has a centered two-line label (subcategory name + "$XXXK") in dark ink, clearly readable against every fill color. Thin light-colored borders separate adjacent rectangles.
      Legibility verdict: PASS — all text (title, labels, legend) is clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17), matches spec.
      Chrome: Same title, now in light ink, clearly legible against the dark background. Legend card uses a dark elevated background with light text, still clearly readable. Outline border of the plot area is faintly visible.
      Data: Identical rectangle layout and identical fill colors to the light render (Engineering green #009E73 first, then purple/blue/amber/red) — confirms data colors are theme-invariant. Rectangle labels now render in light ink and remain clearly legible on every fill color; no dark-on-dark failures. Borders between rectangles are now dark, consistent with the theme-adaptive PAGE_BG border color.
      Legibility verdict: PASS — all text is clearly readable against the dark background; brand green data color is still vivid and distinguishable.
