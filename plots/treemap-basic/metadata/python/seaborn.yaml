review:
  strengths:
  - 'Correct Imprint palette usage: first main category (SSD-1) is #009E73, remaining
    categories follow canonical order (#C475FD, #4467A3, #BD8233, #AE3030), identical
    across both renders'
  - 'Genuine hierarchy technique: sns.light_palette() tints each subcategory within
    a category from saturated (largest item) to pale (smallest item), giving a real
    color-shading hierarchy as requested by the spec'
  - 'Deliberate focal point: the single largest rectangle (Videos, 410GB) gets a bolder
    ink-colored outline than the rest, guiding the eye to the dominant value first'
  - 'Clean, realistic dataset: disk usage across 5 devices (2 SSDs, 2 HDDs, Cloud)
    with 11 subcategories, plausible GB values and sensible category/device relationships'
  - 'Title and legend format fully compliant: ''{Descriptive Title} · treemap-basic
    · python · seaborn · anyplot.ai'', legend labels match the 5 top-level categories
    exactly'
  - Clean KISS script structure (imports → data → plot → save), squarify used correctly
    for the treemap layout algorithm, seed set, no fake/simulated interactive elements
  weaknesses:
  - 'Cell-label text-color bug in dark theme: the per-cell contrast decision at line
    ~108 uses `text_color = INK if luminance > 0.5 else "#FFFFFF"`. INK is a theme-adaptive
    token (near-black #1A1A17 in light theme, near-white #F0EFE8 in dark theme), but
    the branch condition (rectangle luminance > 0.5, i.e. a pale/light-tinted cell)
    is computed purely from the theme-invariant shade color and never changes between
    renders. In the light render this coincidentally looks correct (INK resolves to
    near-black, giving dark text on light cells). In the dark render the exact same
    pale cells (Cache, System, Applications, Backups, Photos, Versioning, Videos —
    i.e. every cell whose sns.light_palette shade has luminance > 0.5) get near-white
    (#F0EFE8) text instead of a fixed dark color, producing low-contrast near-white-on-pale-tint
    labels. Fix: replace `INK` in that branch with a fixed literal dark ink (e.g.
    ''#1A1A17'') that does NOT flip with ANYPLOT_THEME, since the rectangle fill colors
    themselves are theme-invariant and only need a dark/light label chosen once per
    cell, not re-evaluated per theme.'
  - 'Minor: labels are shown on every rectangle (area threshold of 150 is well below
    the smallest item''s ~293 unit area), so the spec''s optional ''smaller ones may
    omit labels for clarity'' guidance was never actually exercised — not a violation
    but a missed opportunity to demonstrate the omission behavior on an even more
    crowded dataset.'
  - 'Minor: legend swatches show the fully-saturated base category color, while the
    rendered treemap cells mostly show lighter tinted shades of that color — a small
    (and common/acceptable) mismatch between legend chip color and the majority of
    on-canvas cell colors that could be tightened by using a representative mid-tint
    in the legend.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Title "Disk Usage by Device · treemap-basic · python · seaborn · anyplot.ai" in dark ink, clearly visible above the treemap. Legend (SSD-1 green, SSD-2 lavender, HDD-1 blue, HDD-2 ochre, Cloud red) sits below the treemap in a light legend box with dark labels, clearly readable. No axis ticks (axis is off, as expected for a treemap).
      Data: 11 nested rectangles sized by GB value (squarify layout). Each top-level category (SSD-1, SSD-2, HDD-1, HDD-2, Cloud) uses its own Imprint hue; subcategories within a category are rendered in a tint gradient from saturated (largest item) to pale (smallest item) via sns.light_palette. The single largest rectangle (Videos, 410GB) has a bold dark outline that anchors the visual hierarchy. Every cell carries a bold "{subcategory}\n{value}GB" label; text color is chosen per-cell (black or white) based on the cell's luminance. All labels are legible against their fill color in this render.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Title and legend text switch to light cream, clearly legible against the dark background. Legend box uses the dark elevated surface with light text/borders — theme-correct.
      Data: Same 11 rectangles, same fill colors as the light render (Imprint hues + light_palette tints) — confirmed identical data colors across themes, only chrome flipped, as required.
      Legibility verdict: FAIL for a subset of cell labels — the per-cell text-color logic (`text_color = INK if luminance > 0.5 else "#FFFFFF"`) uses the theme-adaptive INK token for the "light cell" branch. INK resolves to near-white (#F0EFE8) in the dark theme, so every pale-tinted cell (Cache, System, Applications, Backups, Photos, Versioning, and the large Videos cell) renders near-white text on a pale/light-tinted fill — a low-contrast, borderline "light-on-light" condition inside the chart's primary content labels. Only the darker/base-shaded cells (Documents, Media, Archives, Sync), which always use the '#FFFFFF' branch regardless of theme, remain solidly legible in both renders.
