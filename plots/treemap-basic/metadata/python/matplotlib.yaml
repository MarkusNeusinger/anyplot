review:
  strengths:
  - Correct squarified treemap algorithm implemented from scratch (matplotlib has
    no native treemap primitive) producing accurate area-proportional rectangles
  - 'Excellent spec-compliant hierarchy signaling: value-driven color-shading intensity
    within each category directly satisfies the spec''s ''nesting depth OR color shading
    intensity'' requirement'
  - 'Clean theme-adaptive chrome: title, legend, and label tokens correctly branch
    on ANYPLOT_THEME; both renders are fully readable with no dark-on-dark or light-on-light
    failures'
  - Focal-point highlight (bold ink outline on the single largest rectangle, Product
    Dev $45M) adds clear visual hierarchy and a storytelling cue beyond area/shading
    alone
  - Deterministic, realistic company-budget dataset that explicitly covers the 'no
    subcategory' edge case (Operations renders as one unsubdivided rectangle), demonstrating
    the optional-hierarchy behavior
  - Clean KISS script structure, correct current matplotlib API usage, canonical plot-{THEME}.png
    output naming, no bbox_inches='tight' pitfall
  weaknesses:
  - Rectangle fills use lightness-tinted derivatives of the Imprint hues (for value
    shading) rather than the canonical hex itself — legend swatches correctly use
    the canonical hex. This is a deliberate, spec-sanctioned technique for encoding
    magnitude, but strictly it introduces custom hex values outside the 8-position
    + 3-anchor palette, costing a partial VQ-07 point.
  - Library Mastery leans on generic Rectangle/Patch drawing; could push further into
    matplotlib-distinctive capabilities (e.g. PatchCollection, blended transforms,
    or a colorbar-driven shading legend) to raise LM-02 beyond 'uses some library-specific
    features'.
  - Label font sizes across differently-sized rectangles look fairly uniform rather
    than clearly scaling with area (fontsize formula is clamped to a narrow 6-9pt
    band) — a slightly wider spread would sharpen the size hierarchy further.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "treemap-basic · python · matplotlib · anyplot.ai" in dark ink (#1A1A17), centered at top, fully readable and not clipped. Legend below the treemap with 5 swatches (Engineering, Sales, Marketing, Operations, HR) in a light elevated box with dark ink text — fully legible.
      Data: 11 rectangles sized proportionally to their dollar values via a squarified layout. First category (Engineering, alphabetically/canonically first in the legend) renders in Imprint brand green #009E73 for its full-strength cell (Product Dev); other categories use lavender, blue, ochre, and matte red in canonical Imprint order. Smaller items within a category are rendered as lighter tints of the same hue (value-driven shading). The single largest rectangle (Product Dev, $45M) has a bold dark-ink outline as a focal-point callout; all other rectangles have thin page-background-colored dividers. Labels (category/subcategory + dollar value) are dark ink text centered in each rectangle, clearly readable against every fill color.
      Legibility verdict: PASS — no light-on-light text anywhere, all labels and chrome text read clearly against the light background.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title text now in light ink (#F0EFE8), fully readable and not clipped. Legend box uses the dark elevated fill (#242420) with light secondary-ink text (#B8B7B0) — fully legible.
      Data: Identical rectangle layout and identical Imprint hues/tints to the light render — confirms the palette data colors did not shift between themes. The focal rectangle's outline switches to the light ink token so it still reads as a bold callout against the dark background. Rectangle divider lines switch to the dark page-background color as expected.
      Legibility verdict: PASS — no dark-on-dark text; all title, label, and legend text is light-colored and clearly legible against the near-black surface.
