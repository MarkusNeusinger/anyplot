review:
  strengths:
  - Hand-rolled squarify algorithm correctly implements the treemap layout with no
    external dependency, entirely with Axes-level Rectangle patches
  - 'Magnitude is double-encoded: rectangle area AND within-category lightness shading
    (largest item keeps full-strength hue, smaller items lighten) — a genuine data-storytelling
    touch that goes beyond a generic treemap'
  - 'Imprint palette applied in canonical order with Engineering correctly mapped
    to #009E73 (brand green), verified identical across both renders'
  - 'Theme-adaptive chrome is fully correct: PAGE_BG, INK, INK_SOFT, ELEVATED_BG all
    branch on ANYPLOT_THEME and render correctly in both plot-light.png and plot-dark.png'
  - Text is explicitly sized per-rectangle via an area-driven formula and stays legible
    (bold weight, good contrast) down to the smallest tile ("Training $8M")
  - Subtle PAGE_BG-colored borders between cells cleanly delineate hierarchy without
    adding visual noise
  - Title and legend fully match the spec-mandated format; canvas is exactly 3200x1800
  weaknesses:
  - Squarify strip-layout logic is nearly duplicated between the vertical-strip and
    horizontal-strip branches of the while-loop (aspect-ratio comparison code repeated
    almost verbatim) — condense the shared comparison logic to reduce redundancy without
    introducing a function/class
  - Data always uses the full category+subcategory hierarchy; the spec notes subcategory
    is optional — showing at least one category rendered as a single unsubdivided
    rectangle would demonstrate that the implementation handles the optional-nesting
    case too
  - Legend swatches show the canonical unshaded hue per category, while the actual
    tiles are lightness-tinted by subcategory value — most tiles will never visually
    match their legend swatch exactly (only the max-value tile per category does);
    consider a short caption or slightly less aggressive tint range so the legend
    stays representative
  - Aesthetic sophistication is strong but stops short of publication-grade — e.g.
    no additional visual emphasis (like a bolder outline or callout) on the single
    largest rectangle ("Product Dev") to make the focal point unmistakable at a glance
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Title "treemap-basic · python · matplotlib · anyplot.ai" is dark, centered, comfortably sized, fully visible with no clipping. Legend below the treemap lists Engineering/Sales/Marketing/Operations/HR with color swatches, dark secondary-toned text, and an elevated-cream legend box with a soft border.
      Data: 12 rectangles tiled via a squarify treemap, sized proportionally to their $ value. Engineering = full-strength Imprint green (#009E73) on its largest tile ("Product Dev $45M"), with "Infrastructure" and "QA" progressively lighter tints of the same green as their values shrink. Sales = lavender/purple, Marketing = blue, Operations = ochre, HR = matte red — all first-series-green-first canonical Imprint order. Every rectangle carries a bold two-line label (subcategory name + value) in dark ink, clearly legible against every tile shade, including the smallest ("Training $8M"). Thin cream-colored borders separate all cells cleanly.
      Legibility verdict: PASS — all title, legend, and in-cell text is clearly readable against the light background; no light-on-light issues found.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Title and legend text both flip to light ink (near-white/soft-light-gray) against the dark background; legend box uses the darker elevated fill (#242420) with a soft light border. Fully readable, no dark-on-dark issues.
      Data: Identical rectangle layout, sizes, and hues to the light render — confirmed the Imprint data colors (green/lavender/blue/ochre/red) are pixel-identical between themes; only chrome (background, borders, text) flipped. In-cell labels flipped to light/near-white text and remain clearly legible against every tile, including the darker "Product Dev" green tile and the red HR tiles.
      Legibility verdict: PASS — all text is readable in the dark theme; no dark-on-dark or light-on-dark contrast failures found.
