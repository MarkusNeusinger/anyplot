review:
  strengths:
  - 'Squarified two-level layout: each department is one compact block tiled with
    its cost centers, areas proportional to budget and no thin slivers (C1, C2)'
  - 'Hierarchy shown through nesting depth: thick page-colored seams (size 2.2) between
    department blocks, thin seams (0.5) between cost centers, readable in both themes'
  - 'Label ink chosen per fill from WCAG relative luminance: dark text on green, cyan,
    amber and purple, white on blue and red, so every label reads against its rectangle'
  - 'Department order follows the data, so Engineering takes #009E73 and the remaining
    departments follow the Imprint order; the legend uses guide_legend(override_aes)
    to give the swatches page-colored edges matching the tiles'
  - 'Grammar-of-graphics layering: two geom_rect layers with their own data frames
    plus geom_text with scale_color_identity, on theme_void with coord_fixed and zero
    expansion'
  weaknesses:
  - 'CQ-01 (code): a `def squarify(...)` helper function breaks the Imports → Data
    → Plot → Save structure the rubric asks for → inline the layout as one loop over
    a work list of (values, box) tiling jobs (the department level, then each department''s
    cost centers). Likely cause: lines 70–100 define the squarified layout as a function
    called once per level.'
  - 'Suggestion: the legend text at 8 pt is the smallest text on the canvas; 9 pt
    would match the legend title more closely.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, legend on an elevated #FFFDF6 box with a thin INK_SOFT frame.
      Chrome: bold centered title "treemap-basic · python · plotnine · anyplot.ai" in dark ink (~53% of width); legend title "Department" and entries Engineering, Marketing, Sales, Operations, HR, Finance clearly readable. No axes or grid.
      Data: 12 cost-center rectangles in 6 department blocks tiling a 175×100 area: Engineering (#009E73: R&D $450K, Infrastructure $280K, QA $120K) on the left, Sales (#4467A3: Direct, Channel, Support) in the middle, HR (#AE3030 Recruiting), Operations (#BD8233 Facilities, Logistics), Finance (#2ABCCD Accounting) and Marketing (#C475FD Digital, Events) on the right. Thick page-colored gaps separate departments, thin ones separate cost centers. Every rectangle carries a bold two-line label (name + $value) — dark on light fills, white on blue/red.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17, legend on #242420 with a light frame.
