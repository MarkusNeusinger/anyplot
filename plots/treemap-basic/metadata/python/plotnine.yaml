review:
  strengths:
  - 'Squarified two-level layout: each department is one compact block and its cost
    centers tile inside it, so all twelve rectangles stay close to square with areas
    proportional to budget'
  - Hierarchy boundaries are drawn as a second geom_rect layer of department outlines
    at 2.2 width over 0.5-width cost-center seams, both in the page color, so the
    two levels read apart in both themes
  - Per-rectangle label ink is computed from the fill luminance and passed through
    scale_color_identity, giving white text on blue and red and near-black text on
    green, ochre, lavender and cyan in both renders
  - 'Departments take Imprint positions 1-6 in data order with Engineering on #009E73,
    limits taken from the data, and the legend glyphs keep their fill through guide_legend(override_aes)'
  - theme_void plus expand=(0, 0) and coord_fixed remove axes and grid entirely, as
    a layout-positioned chart should
  weaknesses:
  - 'CQ-01 (code): two def helpers (squarify, lines 68-96, and label_ink, lines 128-134)
    break the no-functions structure; squarify is called twice and has no installed
    replacement, but label_ink is a one-shot color lookup → replace label_ink with
    an inline dict comprehension over fill_of (luminance per fill) so only the layout
    helper remains. Likely cause: label_ink written as a reusable function.'
  - 'Suggestion: department names only appear in the legend; a small department name
    at the top-left of each block would let the reader skip the legend lookup.'
  - 'Suggestion: the treemap''s fixed 175:100 aspect leaves a band of empty page above
    and below the tiles; a slightly taller layout area would use the canvas more fully.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across canvas and panel.
      Chrome: bold near-black title "treemap-basic · python · plotnine · anyplot.ai" centered over the treemap (~53% width); no axes or grid; legend at right on an elevated #FFFDF6 panel with a thin INK_SOFT frame, title "Department" in dark ink and entries in dark grey — all readable.
      Data: squarified treemap of 12 cost centers in 6 department blocks — Engineering #009E73 (R&D $450K, Infrastructure $280K, QA $120K), Sales #4467A3 (Direct $350K, Channel $180K, Support $90K), HR #AE3030 (Recruiting $130K), Operations #BD8233 (Logistics $150K, Facilities $100K), Finance #2ABCCD (Accounting $170K), Marketing #C475FD (Digital $200K, Events $80K). Thin off-white seams between cost centers, thicker off-white gaps between departments. Every rectangle carries a bold two-line label (name, $value K) — white on blue/red, near-black on the others — all inside their rectangles.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17 across canvas and panel.
      Chrome: title in light #F0EFE8 ink, legend on an elevated #242420 panel with light grey frame, title and entries in light ink — no dark-on-dark text anywhere.
      Data: fills identical to the light render; seams and department gaps flip to the near-black page color and remain visible as hierarchy boundaries; label ink identical to light (it depends on the fill only) and readable on every fill. Brand green clearly visible.
      Legibility verdict: PASS
