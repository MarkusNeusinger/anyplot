review:
  strengths:
  - Implements a proper squarified treemap layout (Bruls, Huizing & van Wijk algorithm)
    instead of a plain strip layout, producing near-square cells that read far better
    than elongated slivers for the smaller subcategories
  - 'Correct Imprint palette application: first series is #009E73, remaining sectors
    follow canonical palette order ranked by category total, and hues are pixel-identical
    between the light and dark renders'
  - 'Genuinely Altair-distinctive interactivity: alt.selection_point(on=''pointerover'')
    drives conditional stroke/strokeWidth encoding plus a tooltip, which is a declarative
    pattern that can''t be trivially replicated in a static library'
  - 'Directly answers the spec''s hierarchy note (''nesting depth or color shading
    intensity'') with two techniques at once: a heavier semi-opaque group outline
    around each sector, and a share-of-category opacity shading overlay within cells'
  - Realistic, neutral business data (well-known companies' market caps across 5 sectors,
    $200B-$2800B) with good size variety, and the canvas lands exactly on the 3200x1800
    target after the pad-only step
  weaknesses:
  - 'Legend text clipping: the descender of the ''y'' in the ''Technology'' entry
    is chopped off by the legend''s own frame border in BOTH light and dark renders
    (legend box was not sized to fit its longest label). Widen the legend (e.g. increase
    alt.Legend labelLimit/legend padding, or trim labelFontSize slightly) so ''Technology''
    renders fully inside its own box.'
  - 'Title is missing the required language token: current title text is ''treemap-basic
    · altair · anyplot.ai'' but the mandated format is ''{spec-id} · {language} ·
    {library} · anyplot.ai'' -> should read ''treemap-basic · python · altair · anyplot.ai'''
  - 'CQ-01 KISS: the squarify layout math is factored into three helper functions
    (squarify, _worst_ratio, normalize) rather than a flat top-to-bottom script; understandable
    given the algorithm''s complexity, but still a deviation from the no-functions
    convention other libraries in this same spec-id (e.g. matplotlib) achieved with
    an inline loop'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1, not pure white.
      Chrome: Title "treemap-basic · altair · anyplot.ai" in dark ink, centered, clearly readable. "Sector" legend title and its 5 entries (Technology, Consumer, Healthcare, Finance, Energy) in dark ink on a slightly elevated off-white legend box with a dark border. All chrome text is dark-on-light and readable EXCEPT one defect: the descender of the "y" in "Technology" is clipped by the legend box's own right border (confirmed via pixel-level zoom).
      Data: Nested rectangles colored by sector using the Imprint palette — Technology=#009E73 (green, largest group: Apple/Microsoft/Google/NVIDIA), Consumer=violet (#C475FD), Healthcare=blue (#4467A3), Finance=ochre (#BD8233), Energy=red (#AE3030). Bold company names + "$XXXB" value labels sit inside larger cells; the two smallest cells (Pfizer, Wells Fargo) omit labels per the spec's own guidance for small rectangles. Heavier grey group outlines separate sectors from each other; thin near-white gutters separate items within a sector.
      Legibility verdict: FAIL (isolated) — everything is readable except the clipped "y" in the legend's "Technology" label described above.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17, not pure black.
      Chrome: Title and all axis/legend text render in light ink (#F0EFE8 title, softer grey legend labels), clearly legible against the dark background — no dark-on-dark failures anywhere. Legend box uses the dark elevated surface with a light border, consistent with the theme tokens. Same clipping defect reproduces here: the "y" descender in "Technology" is chopped by the legend border, identical to the light render.
      Data: Same five sector colors as the light render, confirmed pixel-identical (Technology green, Consumer violet, Healthcare blue, Finance ochre, Energy red) — only the chrome (background, borders, text ink) flipped for the theme, exactly as required.
      Legibility verdict: FAIL (isolated) — same single clipped legend descender as the light render; all other text fully legible on the dark surface.
