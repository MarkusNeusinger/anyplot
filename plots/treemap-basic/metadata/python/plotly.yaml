review:
  strengths:
  - Canonical Imprint order across all 5 departments with brand green (#009E73) correctly
    first, and identical data colors verified between light and dark renders.
  - Dual encoding of magnitude (rectangle area via branchvalues="total" AND color-shade
    intensity within each department) directly implements the spec's explicit request
    to "show hierarchy through nesting depth or color shading intensity."
  - 'Depth-aware typography hierarchy: bold 24pt department headers vs. 16pt subcategory
    labels creates a clear reading order.'
  - 'Thoughtful, documented workaround: per-department roots (parent "") instead of
    one synthetic root avoid kaleido''s forced breadcrumb bar in static export.'
  - 'Theme-adaptive chrome correctly implemented: page background, title/font color,
    and tile border color (set to PAGE_BG) all flip correctly between renders.'
  - Rounded corners (cornerradius=6) and generous inter-tile padding give a polished,
    non-default appearance.
  - Realistic, neutral corporate budget dataset with plausible relative scale across
    departments and cost centers.
  - Deterministic, clean, well-commented code; correct current API usage (write_image
    + write_html) and file naming.
  weaknesses:
  - 'Dark-render contrast failure on subcategory tiles: the lighten() helper always
    blends each department''s base hue toward white (amount 0.15–0.55 by value share)
    to encode magnitude, but textfont.color stays fixed at INK for every node. In
    light theme INK is near-black, so contrast stays excellent. In dark theme INK
    is #F0EFE8 (near-white) — as tiles get paler for smaller-value subcategories,
    the same near-white text nearly disappears into them. Computed WCAG contrast for
    #F0EFE8 text on the lightened tiles: Product Dev ~1.3:1, Research ~1.1:1, QA ~1.1:1,
    Content ~1.6:1, Events ~1.4:1, Support ~1.7:1, Facilities ~1.4:1, Training ~2.0:1,
    Partnerships ~2.0:1 — all far below the 3:1 WCAG minimum for large text (most
    under 2:1). Only the largest-share tile per department (e.g. Infrastructure, Direct
    Sales) stays close to the base hue and is comparatively closer to passing (still
    under 4.5:1). Text remains just barely parseable on close inspection but is a
    genuine washed-out, near-white-on-near-white legibility failure specific to the
    dark render. Fix: for dark theme, either drive the tint toward PAGE_BG (near-black)
    instead of always toward white so smaller-value tiles darken rather than lighten,
    or pick each node''s text color from computed background luminance instead of
    a single fixed INK value, or cap the lighten amount much lower in dark theme.'
  - 'CQ-01 (KISS structure): the lighten() helper function is a reasonable, well-justified
    addition for the shading technique, but it is a deviation from the plain imports→data→plot→save
    structure requested by the guideline.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1.
      Chrome: Title "treemap-basic · python · plotly · anyplot.ai" centered at top in near-black ink, clearly legible. All department headers (bold, larger) and subcategory labels (smaller, with "$XXXK" values) render in near-black ink and are clearly readable against every tile color, including the lightest tinted tiles. Thin off-white borders cleanly separate all rectangles.
      Data: Five department roots sized by total budget (Engineering largest, HR smallest) — Engineering=green #009E73, Marketing=lavender #C475FD, Sales=blue #4467A3, Operations=ochre #BD8233, HR=red #AE3030, matching canonical Imprint order with brand green first. Each department's subcategories are shaded lighter as their value share within the department shrinks, layering a second magnitude cue on top of rectangle area.
      Legibility verdict: PASS — all text reads cleanly against both the saturated base colors and the lightened tint colors.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17.
      Chrome: Title and department headers use light cream text (#F0EFE8), clearly readable against the dark page background. Tile borders are near-black (matching PAGE_BG), giving a clean separation look consistent with the design intent.
      Data: Data colors are confirmed identical to the light render (Engineering green, Marketing lavender, Sales blue, Operations ochre, HR red — unchanged hexes). However, the same cream (#F0EFE8) text is used on the lightened subcategory tiles, which in dark mode are tinted toward white for smaller-value items. This produces a severe contrast drop on roughly half the subcategory tiles — e.g. "Product Dev", "Research", "QA" (Engineering), "Content", "Events" (Marketing), "Support" (Sales), "Facilities" (Operations), "Training" (HR) — with computed WCAG contrast ratios between ~1.1:1 and ~2.0:1, all well under the 3:1 minimum for large text. The text is still just barely parseable up close but is visibly washed out compared to the crisp department headers, which sit on the full-saturation base color and read fine.
      Legibility verdict: FAIL for the lightened subcategory tiles (near-white text on near-white-tinted backgrounds); PASS for department headers and all other chrome.
