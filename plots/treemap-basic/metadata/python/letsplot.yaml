review:
  strengths:
  - Correct Imprint canonical palette order with brand green (#009E73) first for Engineering,
    applied identically across light and dark renders
  - 'Correct theme-adaptive chrome throughout: background, title, legend box, and
    rectangle borders all flip correctly between #FAF8F1/light-ink and #1A1A17/light-ink'
  - Adaptive label density (category+subcategory+% for large rects, subcategory+%
    for medium, subcategory only for small, blank for tiniest) keeps small rectangles
    uncluttered while giving large ones full context
  - Deterministic, realistic budget-allocation data with a genuine two-level hierarchy
    (6 departments, 10 cost centers) and sensible value spread
  - Correct canvas size (3200x1800, passes the canvas gate) and proper dual PNG+HTML
    output via ggsave
  weaknesses:
  - 'The custom squarify() layout algorithm leaves a large unfilled rectangular gap
    (roughly a quarter of the treemap''s bounding box) in the upper-right area, visible
    as plain page background between the Engineering/Marketing column and the Sales/Operations/HR/Finance
    row, before the legend. Root cause: the column-partition branch computes col_height
    from the fixed global `total`/`height` parameters instead of the remaining sub-total
    and remaining_h at that point in the recursion, so consumed height is smaller
    than it should be and the rectangles stop short of tiling the full container.
    This directly contradicts the spec''s ''efficiently use screen space'' requirement
    and the core treemap guarantee that area is fully partitioned. Fix by tracking
    a running remaining-total (subtract consumed values from a local total, not the
    global one) or recursing with local width/height/total per branch so the tiling
    invariant (remaining_w * remaining_h == remaining_value_sum/total * width * height)
    holds at every step.'
  - 'Title omits the required language segment: reads ''Budget Breakdown · treemap-basic
    · letsplot · anyplot.ai'' but should be ''Budget Breakdown · treemap-basic · python
    · letsplot · anyplot.ai''.'
  - Label text color is fixed near-black/near-white (INK) regardless of the rectangle's
    background hue. On the red 'Recruiting' rectangle (#AE3030) in the light render,
    black text contrast is only about 2.9:1 (below WCAG AA's 3:1 floor for bold/large
    text), noticeably weaker than the ~5.4:1 contrast on the green rectangle. Consider
    per-swatch text color selection or a subtle 1px outline for consistent legibility
    across the whole palette.
  - 'Dead/no-op ternary: `TEXT_COLOR = INK if THEME == "light" else INK` always evaluates
    to INK regardless of branch (INK is already theme-conditional) — simplify to `TEXT_COLOR
    = INK`.'
  - Hierarchy is communicated only via category-level color plus a subcategory text
    label; nesting depth or shading-intensity variation between subcategories of the
    same department (suggested in the spec) is not used.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "Budget Breakdown · treemap-basic · letsplot · anyplot.ai" in dark ink, centered, fully readable. Legend titled "Department" sits at the right with 6 color swatches (Engineering, Marketing, Sales, Operations, HR, Finance), all readable. Thin gray-ink borders separate every rectangle.
      Data: Nested rectangles colored by department using the Imprint palette in canonical order (Engineering=#009E73 green, Marketing=#C475FD lavender, Sales=#4467A3 blue, Operations=#BD8233 ochre, HR=#AE3030 red, Finance=#2ABCCD cyan). Bold near-black labels show category/subcategory/percentage inside larger rectangles and just subcategory in smaller ones. A clearly visible rectangular gap of plain background sits in the upper-right portion of the treemap's bounding box (between the Engineering/Marketing column and the lower-right row of rectangles) — the tiling does not fully fill the intended treemap area.
      Legibility verdict: PASS overall, with one flagged weak spot — black text on the red "Recruiting" rectangle has borderline-low contrast (~2.9:1) compared to the other rectangles (~5:1+).

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Title in light ink (#F0EFE8), fully readable against the dark background. Legend box uses the dark elevated surface (#242420) with light borders and text, fully readable. Rectangle borders are light gray, visible against both the dark background and the saturated fills.
      Data: Identical department colors to the light render (Engineering green, Marketing lavender, Sales blue, Operations ochre, HR red, Finance cyan) — confirms data colors are constant across themes. Labels are the same bold text, rendered in light ink (#F0EFE8) instead of dark ink, giving strong contrast against every rectangle color including the red one. The same rectangular unfilled gap in the upper-right of the treemap bounding box is present here too.
      Legibility verdict: PASS — no dark-on-dark or light-on-light failures; text reads clearly against every rectangle color and the background in this theme.
