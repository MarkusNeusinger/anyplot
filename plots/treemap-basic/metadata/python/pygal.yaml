review:
  strengths:
  - Correct Imprint palette order (green, lavender, blue, ochre) with identical data
    colors across themes; theme-adaptive chrome (background, title, legend text) is
    spot-on in both renders with no dark-on-dark or light-on-light failures
  - Faithful two-level hierarchy (sector -> company) matching the spec's category/subcategory
    requirement, with subtle strokes delineating rectangle boundaries
  - Realistic, well-scaled real-world market-cap data across four neutral business
    sectors; area-proportional sizing communicates the story immediately (Technology
    dominance) without needing annotations
  - Excellent canvas utilization - the treemap fills the vast majority of the 3200x1800
    canvas with a clean, uncluttered layout and no edge clipping
  - Clean, KISS-structured code with deterministic data and idiomatic pygal Treemap
    API usage (list-of-dict per-sector items, value_formatter, legend_at_bottom_columns)
  weaknesses:
  - Per-cell company-name captions (e.g. 'Apple', 'Microsoft') render far smaller
    than the dollar-value labels despite label_font_size=56 being set larger than
    value_font_size=36 in the Style config - pygal's Treemap per-cell label does not
    appear to honor label_font_size the way expected, so these captions risk becoming
    illegible when the PNG is scaled to ~400px mobile width. Try folding the label
    into the value_formatter string (e.g. embed the company name alongside the $ value)
    or find the style token that actually controls Treemap per-cell label size so
    both texts render at a consistent, legible scale.
  - 'Design Excellence is solid but still reads as a well-configured default rather
    than publication-ready: consider a stronger hierarchy cue such as value-proportional
    shading/tint within each sector''s sub-cells (the spec explicitly suggests ''nesting
    depth or color shading intensity''), which would push both aesthetic sophistication
    and visual refinement further above baseline.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 - not pure white.
      Chrome: Title "Market Capitalization by Sector · treemap-basic · pygal · anyplot.ai" renders in dark ink, clearly readable and comfortably within canvas bounds (~85% width, not overflowing/clipped). Bottom legend ("Technology", "Financials", "Healthcare", "Energy") uses dark text with matching colored square swatches, fully legible.
      Data: Nested rectangles sized by market-cap value. Technology sector is brand green (#009E73) and occupies the left ~45% of the canvas as three sub-rectangles (Apple $3400B, Microsoft $3100B, Nvidia $2900B) with dark value/label text printed inside each cell. Financials (lavender #C475FD), Healthcare (blue #4467A3), and Energy (ochre #BD8233) occupy three stacked rows on the right, each split into three company sub-cells with dollar values. Small company-name captions above each dollar value are noticeably smaller/finer than the value text.
      Legibility verdict: PASS (dollar values, title, and legend are all clearly readable; the small company-name captions are readable at full resolution but disproportionately small relative to the value labels - flagged as a weakness, not a legibility failure at native resolution).

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 - not pure black.
      Chrome: Title renders in light/off-white ink, clearly readable against the dark background. Legend text is light-colored and fully legible; swatch colors match the light render exactly.
      Data: Same rectangle layout and identical categorical colors as the light render (green/lavender/blue/ochre unchanged) - only the page background and text ink flipped, as required. Value and label text inside the colored cells remains dark, which stays legible because the four category colors (green/lavender/blue/ochre) are medium-toned and provide sufficient contrast against dark text regardless of theme; no dark-on-dark failures observed for any chrome element (title/legend/ticks).
      Legibility verdict: PASS (all chrome text is theme-correct and readable; same minor company-name caption sizing concern as the light render carries over identically).
