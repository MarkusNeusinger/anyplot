review:
  strengths:
  - Custom squarified treemap algorithm (Bruls, Huizing & van Wijk, 1999) implemented
    from scratch since ggplot2 has no native treemap geom — category header bands
    sit above squarified children, correctly nesting the hierarchy.
  - WCAG relative-luminance-based ink selection picks readable label text against
    both fixed header colors and alpha-blended tile fills, correctly re-evaluated
    per theme.
  - 'Clear visual hierarchy: bold colored header bands show category totals, alpha-shaded
    children (darker-to-lighter by rank within category) communicate both grouping
    and relative magnitude at a glance.'
  - 'Palette fully compliant — Compute (largest total) renders in Imprint #009E73,
    remaining categories follow canonical palette order by descending total; data
    colors are identical across light/dark renders, background/chrome is theme-correct
    in both.'
  - Adaptive label suppression (show_name/show_value gated by tile width/height vs.
    text length) prevents overflow — small tiles cleanly omit text instead of clipping.
  - Title fontsize scales with title length to avoid overflow for the long mandated
    title string.
  weaknesses:
  - 'CQ-01 KISS Structure: the implementation relies on 5 custom helper functions
    (relative_luminance, blend_hex, squarify plus nested worst_ratio/place_row) rather
    than a flat Imports->Data->Plot->Save script. Some complexity is inherent to implementing
    a treemap layout ggplot2 doesn''t natively support, but the algorithm could be
    trimmed or better isolated to reduce custom code surface.'
  - Sub-tile resource labels (geom_text size=2.7/2.3mm, roughly 43/36 source-px) are
    noticeably smaller than the category header text; at ~400px mobile scale these
    shrink to roughly 5px, right at the edge of legibility — consider a slightly larger
    minimum size for small-but-labeled tiles.
  - Category identity relies entirely on the header bands with no separate legend;
    not an issue with this dataset but worth noting as a layout edge case if a future
    data change ever produces a category whose header band becomes too small to render
    its label.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Bold dark title "Cloud Infrastructure Spend · treemap-basic · r · ggplot2 · anyplot.ai" centered at top, clearly readable dark-on-light. Category header bands (Compute/Storage/Database/Networking/Security) show bold white text on their saturated fill colors with total spend ($965K, $525K, $470K, $340K, $120K). Child tile labels (resource name + $ value) render in dark or light ink chosen per-tile based on the blended tile shade, all legible. Thin off-white borders separate every tile.
      Data: Five categories in Imprint palette canonical order by descending total — Compute=#009E73 (brand green, first/largest), Database=lavender, Storage=blue, Networking=ochre, Security=matte red. Within each category, children are shaded from more saturated (largest) to lighter (smallest) via alpha blending against the page background, encoding rank.
      Legibility verdict: PASS — all header and tile text readable, no overlap, no clipping at canvas edges.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Title renders in light ink, clearly visible against the dark background. Header bands keep the same fill colors as light mode with white bold text. Child tile labels re-evaluate their ink color against the theme's background before alpha-blending, so no dark-on-dark or light-on-light failures are visible — every label remains legible.
      Data: Confirmed identical to the light render — same five categorical hues (#009E73 green first, then lavender/blue/ochre/red), only the chrome (background, borders, title) flips to the dark tokens.
      Legibility verdict: PASS — no dark-on-dark text found; all header and tile labels remain readable against the near-black surface.
