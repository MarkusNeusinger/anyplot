review:
  strengths:
  - Normalization is left to geom_area(position='fill') so the shares are computed
    by the library and the top edge is exactly 100% at every year
  - Page-colored layer outlines (color=PAGE_BG) separate the layers cleanly in both
    themes
  - Percent and year formatting through lets-plot format strings ('.0%', 'd')
  - Theme tokens threaded through every chrome element; text readable in both renders
  - Adaptable data block with role-tagged column constants and the full eight-position
    Imprint palette
  - Interactive HTML export with native tooltips
  weaknesses:
  - 'VQ-07 (both): the fills carry alpha=0.85 on non-overlapping areas, so the page
    shows through and the rendered colors differ between themes (Company D reads about
    #24AB88 on light and #058A68 on dark) → opaque fills, alpha 1.0 (+0.15). Likely
    cause: geom_area(alpha=0.85).'
  - 'DE-02 (both): the panel is enclosed by a four-sided frame against the style guide''s
    L-shaped spine rule → keep only the left and bottom axis lines. Likely cause:
    theme_minimal() plus axis_line/panel border drawing a full rectangle; set panel_border=element_blank().'
  - 'DQ-02 (both): the companies are labelled Company A, Company B, Company C, Company
    D, which reads as generic → plausible product or brand names for the market (e.g.
    named streaming services or smartphone makers that are fictional). Likely cause:
    the keys of the revenue dict.'
  - 'Suggestion: reverse the legend (guides(fill=guide_legend(reverse=True))) so its
    top-to-bottom order matches the stack, Company A on top.'
  - 'Suggestion: scale_y_continuous(expand=[0, 0]) would drop the empty strip between
    100% and the panel top.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, 3200x1800.
