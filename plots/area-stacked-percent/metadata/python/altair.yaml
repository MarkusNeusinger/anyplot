review:
  strengths:
  - Uses Vega-Lite's stack='normalize' so the 100% shares are computed by the library,
    with alt.Order fixing a stable bottom-to-top layer order
  - 'Theme tokens threaded through axis, title, legend and view: all text readable
    in both renders on #FAF8F1 and #1A1A17'
  - 'Imprint palette in canonical order with #009E73 for the first layer; legend at
    the bottom names every layer'
  - Canvas padded (never cropped) to exactly 3200x1800
  - Native tooltips with formatted share values in the HTML view
  weaknesses:
  - 'VQ-02 (both): the legend title ''Energy source'' and the ''Renewables'' label
    touch the legend frame''s left and right edges, and the Coal swatch sits on the
    left frame line → at least 6-8 px padding inside the frame. Likely cause: configure_legend
    without padding (set padding≈8).'
  - 'VQ-05 (both): the ordinal x scale leaves an empty strip inside the plot frame
    left of 2015 and right of 2024 (about 5% of the width on each side) → areas span
    the frame edge to edge. Likely cause: x type=''ordinal'' with default band padding;
    use type=''quantitative'' (or temporal) with a 2015-2024 domain and integer tick
    format, or scale paddingOuter=0.'
  - 'VQ-07 (both): mark_area opacity=0.85 lets the page show through, so the Imprint
    fills render visibly different between themes (Natural Gas lighter lilac on light,
    darker purple on dark) → opaque fills (opacity 1). Likely cause: mark_area(opacity=0.85).'
  - 'Suggestion: direct labels at the right end of each layer could replace the legend
    lookup.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 canvas and view, 3200x1800.
      Chrome: title 'area-stacked-percent · python · altair · anyplot.ai' centered in dark ink; y-axis 'Share of total (%)' 0%-100% in 10% steps, x-axis 'Year' 2015-2024; subtle grid; bottom-left framed legend 'Energy source' (title and Renewables label touch the frame). All readable.
      Data: four stacked areas bottom to top Coal #009E73 (45%->16%), Natural Gas #C475FD, Nuclear #4467A3, Renewables #BD8233 (18%->44%), flat top at 100%; small empty strips inside the frame left of 2015 and right of 2024.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
