review:
  strengths:
  - 'Correct 100% stack: shares computed per year with groupby().transform, the top
    edge sits flat at 100% and expand=(0,0) makes the stack fill the panel exactly'
  - Theme tokens threaded through every chrome element; full-opacity Imprint fills
    are identical in both renders and all text reads in both themes
  - Thin page-colored seams separate neighboring layers cleanly on both backgrounds
  - 'Legend colors follow the data order via scale_fill_manual(limits=...), so Smartphones
    takes #009E73'
  - Realistic, neutral consumer-device scenario with clearly shifting shares
  weaknesses:
  - 'Suggestion: the stack runs Laptops, Smartphones, Tablets, Wearables from top
    to bottom (plotnine''s alphabetical factor order) while the legend lists Smartphones,
    Tablets, Wearables, Laptops; making PRODUCT a pd.Categorical in data order would
    let the legend read in the stack''s order.'
  - 'Suggestion: plotnine''s geom_area(position=''fill'') normalizes to 100% natively
    and could replace the groupby share column.'
