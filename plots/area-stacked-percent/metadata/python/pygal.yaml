review:
  strengths:
  - Uses pygal's native StackedLine(fill=True, stack_from_top=False) for the stacked
    areas, with the shares computed from the raw values by pivot_table and a row-wise
    div, so every time point sums to exactly 100 % and the top edge is flat in both
    renders
  - Value axis is pinned to range=(0, 100) with explicit 20 % y_labels and a value_formatter
    that prints shares as whole percentages, both on the axis and in the native HTML
    tooltips
  - 'Theme tokens flow through one Style object: background, text, and guide colors
    flip correctly between #FAF8F1 and #1A1A17, while the five Imprint fills stay
    identical'
  - Bottom legend with legend_at_bottom_columns equal to the category count lays the
    five entries out in one row in stacking order, with x guides turned off so only
    the horizontal percentage grid remains
  weaknesses:
  - 'DQ-03 (both): the shares imply that laptops sell at two thirds of the smartphone
    volume (28 % vs 42 % in 2018, 588 M vs 882 M units). In the real device market,
    smartphones outsell laptops by roughly 6 to 8 times (about 1.4 B vs 0.2 B units)
    → keep laptops at about 8–10 % and smartphones at about 55–60 % of the total (laptops
    about −18 percentage points). Likely cause: the share_percent dict in the Data
    block.'
  - 'Suggestion: Accessories is fixed at exactly 4 % every year, so its band is a
    ruler-straight strip; a small year-to-year drift would read as observed data.'
  - 'Suggestion: the legend swatches sit flush against their labels; a few pixels
    of gap would make the entries easier to read.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white, matching #FAF8F1, across the canvas and the plot area.
      Chrome: the title "area-stacked-percent · python · pygal · anyplot.ai" is centred at the top in dark ink at about 62 % of the width. The y-axis title "Share of total (%)" is rotated on the left, and the x-axis title "Year" is centred below the year ticks. The y ticks run 0%–100% in 20 % steps and the x ticks run 2018–2024, all in dark ink and readable. Faint horizontal grid lines sit at each 20 % step, and there are no vertical guides. A one-row legend at the bottom reads Smartphones, Laptops, Tablets, Wearables, Accessories.
      Data: five opaque stacked bands from bottom to top: Smartphones in brand green #009E73 (42 % → 32 %), Laptops in lavender #C475FD, Tablets in blue #4467A3, Wearables in ochre #BD8233 (growing from 8 % to 20 %), and Accessories in matte red #AE3030 as a thin constant 4 % strip at the top. The stack fills 0–100 % at every year with a flat top edge. Small dots mark each layer boundary at each year.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black, matching #1A1A17.
      Chrome: the title, axis titles, tick labels and legend text are all light (#F0EFE8 / #B8B7B0) and readable. There is no dark-on-dark text. The grid lines are faint light lines, still visible.
      Data: the band colors are identical to the light render (green, lavender, blue, ochre, red), and the brand green reads well on the dark surface.
      Legibility verdict: PASS
