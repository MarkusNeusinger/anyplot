review:
  strengths:
  - pygal.StackedLine with fill=True and stack_from_top=False is the native pygal
    route to a stacked area chart; layers stack bottom-up in legend order with a flat
    100% top edge in both renders
  - Normalisation is done once from the raw units with pivot_table + div(sum(axis=1)),
    so each layer's thickness is computed from the data rather than typed in, and
    every year sums to exactly 100%
  - value_formatter renders shares as whole percentages in the native HTML tooltips,
    and the fixed y_labels 0-100% axis is never truncated
  - 'Theme tokens threaded through a single Style object: warm #FAF8F1 / #1A1A17 backgrounds,
    readable INK text in both themes, Imprint colors identical across renders'
  - Plausible device-market scenario (smartphones losing share to wearables) with
    readable labels and units
  weaknesses:
  - 'VQ-02 (both): in the bottom legend each 40 px color swatch touches the first
    letter of its label (Wearables, Accessories, Smartphones), gap about 0 px → leave
    about 10-12 px between swatch and text (+10 px). Likely cause: legend_box_size=40
    exceeds the fixed text offset pygal leaves for its default box size; reduce legend_box_size
    toward the legend font size or raise the spacing.'
  - 'Suggestion: the ''Year'' x-axis title sits far below the tick labels; a tighter
    gap would read as one block with the axis.'
  - 'Suggestion: the small dots at every layer boundary add little at seven time points;
    dots_size could be dropped for a cleaner area surface while keeping the HTML tooltips.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across canvas and plot area.
      Chrome: title "area-stacked-percent · python · pygal · anyplot.ai" centred at top, dark ink; y-axis title "Share of total (%)" and ticks 0%-100% in 20% steps; x-axis title "Year" with ticks 2018-2024; subtle horizontal guides only; single-row legend at the bottom (Smartphones, Laptops, Tablets, Wearables, Accessories). All text readable.
      Data: five filled layers stacked from the bottom: Smartphones #009E73 (60% -> 53%), Laptops #C475FD, Tablets #4467A3, Wearables #BD8233 (widening from 10% to 19%), Accessories #AE3030 (constant 6%) at the top; stack top flat at 100% at every year; small dots at each boundary point. Legend swatches touch their label text.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, axis titles, tick labels and legend text in light ink, all clearly readable; no dark-on-dark text; guides subtle.
      Data: identical layer colors and geometry to the light render; brand green bottom layer reads well.
