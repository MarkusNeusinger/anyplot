review:
  strengths:
  - 'Normalization is done natively by plotly: `stackgroup="share"` with `groupnorm="percent"`
    turns each year''s raw TWh values into shares, so the data stays in raw units
    and the stack fills exactly 0–100 % with a flat top at every year in both renders'
  - Layer seams are drawn in the page color (`line=dict(width=1.5, color=PAGE_BG)`),
    giving clean off-white seams on the light render and near-black seams on the dark
    one, so neighboring layers separate cleanly in both themes
  - The legend uses `traceorder="reversed"`, so its entries run top to bottom in the
    same order as the stacked layers (Hydro at the top, Coal at the base)
  - The declining Coal series sits on the flat zero baseline, where its fall from
    about 40 % to 23 % reads directly off the axis, while Solar and Wind visibly widen
    above it
  - Realistic electricity-mix scenario (Coal, Natural Gas, Wind, Solar, Hydro, 2015–2024,
    TWh) with plausible proportions and a reproducible seed
  - '`hovermode="x unified"` gives one combined hover label per year with every source''s
    share in the HTML output'
  - All chrome is threaded through theme tokens; text is readable in both renders
    and the Imprint data colors are identical across themes
  weaknesses:
  - 'Suggestion: Hydro takes the fifth Imprint slot, matte red #AE3030, the semantic
    anchor for bad or loss; the semantic exception (water→blue, ice→cyan) would favor
    cyan #2ABCCD for Hydro, which leaves red unspent.'
  - 'Suggestion: y-axis tick labels could carry a % suffix (`ticksuffix="%"`), so
    each tick reads as a share without looking back at the axis title.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white, consistent with #FAF8F1, on both paper and plot area; not pure white.
      Chrome: centered title "area-stacked-percent · python · plotly · anyplot.ai" in dark ink, about 43 % of the width; y-axis title "Share of total (%)", x-axis title "Year", dark-grey tick labels 0–100 (step 20) and 2016–2024 (step 2); left and bottom axis lines only, no grid; legend on the right on an elevated off-white box with a thin grey border, title "Energy source", entries Hydro, Solar, Wind, Natural Gas, Coal (top to bottom, matching the stack). All text is readable; nothing clipped.
      Data: five stacked filled layers from 2015 to 2024 that fill exactly 0–100 % with a flat top edge: Coal #009E73 at the base (about 40 % → 23 %), Natural Gas #C475FD (about 29–31 %), Wind #4467A3 (about 13 % → 20 %), Solar #BD8233 (about 7 % → 18 %), Hydro #AE3030 at the top (about 10 % → 7 %). The layers are separated by off-white seams in the page color. First series is #009E73.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black, consistent with #1A1A17; not pure black.
