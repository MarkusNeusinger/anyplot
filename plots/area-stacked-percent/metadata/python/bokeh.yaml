review:
  strengths:
  - Shares computed from the raw values with pandas pivot_table/div/cumsum, so the
    stack reaches exactly 100 at every year
  - Page-colored 3 px boundary lines between layers keep neighbouring layers distinct
    in both themes
  - Legend order reversed to match the stack top-down, with a 'Product' legend title
    outside the plot area
  - x range fixed to the first and last year and y range to 0-100, so the stack fills
    the whole plot with no empty stretch
  - Theme tokens threaded through every chrome element; both renders read cleanly
  weaknesses:
  - 'VQ-07 (both): fill_alpha=0.9 blends every layer with the page, so the data colors
    differ between themes (Product A reads about #1AA882 on light and #039070 on dark
    instead of #009E73 in both) → opaque fills (fill_alpha=1.0); the layers never
    overlap, so the alpha has no job. Likely cause: p.varea(..., fill_alpha=0.9).'
  - 'DQ-02 (both): the categories are labelled Product A, Product B, Product C, Product
    D, which read as placeholders → real product-line names (for example Laptops,
    Tablets, Phones, Accessories). Likely cause: the _start dict keys.'
  - 'Suggestion: p.varea_stack(stackers=..., x=..., source=...) on one wide ColumnDataSource
    is Bokeh''s native stacker and would replace the manual cumsum/lower/upper columns.'
  - 'Suggestion: a HoverTool showing each layer''s share per year would add value
    in the HTML view.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 on canvas and plot area.
      Chrome: bold title 'area-stacked-percent · python · bokeh · anyplot.ai' top-left in dark ink (~50% width); italic axis titles 'Year' and 'Share of total sales (%)'; ticks 2015-2024 and 0-100 in INK_SOFT; no grid; legend right of the plot with title 'Product' and entries D, C, B, A top-down on an elevated off-white box. All readable.
      Data: four stacked varea layers filling 0-100 from 2015 to 2024: Product A green #009E73 (bottom, growing from ~35% to ~53%), B purple, C blue, D ochre on top; thin page-colored boundary lines between layers. Fills at alpha 0.9 read slightly lighter than the pure palette.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title and axis titles in light ink, ticks in light grey, legend on #242420 with light text; no dark-on-dark text.
      Data: same layers, order and palette positions as the light render; boundary lines now dark; because of alpha 0.9 the fills read slightly darker than in the light render.
      Legibility verdict: PASS
