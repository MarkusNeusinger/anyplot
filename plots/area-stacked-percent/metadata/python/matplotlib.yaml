review:
  strengths:
  - Native ax.stackplot fed by pivot_table and a per-year normalization, so every
    layer starts where the one below ends and the stack is flat at 100%
  - PercentFormatter on a 0-100% axis reads as share of the total
  - Legend reversed via get_legend_handles_labels so its rows run top-to-bottom in
    stack order, with a 'Source' title
  - 'Theme tokens threaded through title, ticks, spines, grid and legend: both renders
    read cleanly'
  - Exact 3200x1800 canvas through figsize x dpi with subplots_adjust instead of bbox_inches='tight'
  weaknesses:
  - 'Suggestion: direct labels at the right edge of the thicker layers could replace
    the legend lookup'
