review:
  strengths:
  - sns.histplot with weights, discrete=True, element='poly' and multiple='fill' normalizes
    each year to 100 % natively, no hand-built stacking
  - Legend order reversed via hue_order so it matches the stack top-to-bottom, placed
    outside the plot with sns.move_legend
  - Page-colored separators between layers keep boundaries crisp in both themes
  - Correct 3200x1800 canvas, style-guide text sizes and full theme adaptation in
    both renders
  weaknesses:
  - 'DQ-02 (both): real browser names carry invented shares — Chrome at about 39 %
    in 2010 and no Internet Explorer, while IE held roughly half the market then →
    rename the categories to a generic but concrete set or keep the names with shares
    near the real ones (Chrome about 15 % in 2010, an Internet Explorer layer). Likely
    cause: the users dict in the Data block.'
  - 'Suggestion: direct labels at the right end of each thick layer could replace
    the legend lookup.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, 3200x1800.
      Chrome: title 'area-stacked-percent · python · seaborn · anyplot.ai' in dark ink; axis titles 'Year' and 'Share of users (%)'; ticks 0-100 every 20 and 2010-2024 every 2 years in INK_SOFT; top/right spines removed; legend 'Browser' (Other, Firefox, Edge, Safari, Chrome) outside right on an elevated frame. All readable.
      Data: five stacked areas filling 0-100 at every year: Chrome #009E73 at the bottom (39 % -> about 64 %), Safari #C475FD, Edge #4467A3 (thin, widens after 2020), Firefox #BD8233, Other #AE3030 on top (32 % -> about 2 %); thin page-colored separators.
