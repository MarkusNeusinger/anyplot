review:
  strengths:
  - 'Perfect Imprint palette compliance: first series (Subscription) is #009E73 and
    the remaining four categories follow the canonical order (lavender, blue, ochre,
    matte red) exactly, identical between light and dark renders'
  - 'Full theme-adaptive chrome: background, title, axis labels, tick labels, and
    legend all flip correctly between #FAF8F1/#1A1A17 and their ink tokens, with no
    dark-on-dark or light-on-light failures'
  - Correct 100%-stacked-area technique via band!() with cumulative percentage bounds,
    plus thin PAGE_BG-colored separator lines between bands for a clean, professional
    look
  - 'Clear data storytelling: the mix visibly shifts from License/Hardware dominance
    in 2021 to Subscription/Support dominance by 2024, an insight readable at a glance
    without annotations'
  - Y-axis tick labels formatted as percentages (0%-100%), spines reduced to L-shape,
    subtle single-axis grid, legend cleanly docked next to the plot via GridLayout
    colsize! rather than floating
  - Realistic, neutral business scenario (SaaS vendor revenue mix) with plausible
    per-category trends and correct 100% normalization
  weaknesses:
  - Title occupies only ~30-35% of the plot width at titlesize=22 — comfortably readable
    and not a violation, but there is headroom to grow it slightly for stronger visual
    hierarchy on very large displays
  - Legend title 'Product Line' is a reasonable generic label; tying it more directly
    to the 'category' semantics from the spec is an optional polish item, not a compliance
    gap
  - No callout/annotation marks the Subscription-overtakes-License crossover point
    — not required by the spec, but would push the storytelling even further in a
    future iteration
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1, not pure white.
      Chrome: Bold dark title "area-stacked-percent · julia · makie · anyplot.ai" centered above the plot, fully visible with margin above and below. "Quarter" (x-axis) and "Share of Revenue" (y-axis) labels in dark ink, both readable and similarly sized. Tick labels (quarter labels rotated ~30°, percentage y-ticks 0%-100%) rendered in a softer gray-brown ink, clearly legible. Legend "Product Line" sits to the right of the plot with 5 swatches and labels, frameless, background matches page.
      Data: Five stacked bands from bottom to top — Subscription (#009E73 brand green), Support (lavender), Services (blue), Hardware (ochre), License (matte red) — separated by thin light-colored dividing lines. Bands sum to 100% at every quarter. Subscription grows from ~17% to ~46% while License shrinks from ~33% to ~11%, a clear compositional shift over time.
      Legibility verdict: PASS — all text is clearly readable against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17, not pure black.
      Chrome: Same title, now in light/white text, fully visible. Axis labels and tick labels rendered in light ink tones (primary text near-white, secondary tick/legend text a lighter gray), both clearly legible against the dark background. Legend renders identically in position and styling, text now light-colored, background matching the dark page.
      Data: Identical five-band color sequence and identical proportions/trend as the light render — Subscription still #009E73 at the bottom, License still matte red at the top, confirming data colors are unchanged between themes. No dark-on-dark text found anywhere (title, axis labels, tick labels, and legend text are all light and readable).
      Legibility verdict: PASS — all text is clearly readable against the dark background, no dark-on-dark failures.
