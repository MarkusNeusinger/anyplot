review:
  strengths:
  - 'Idiomatic use of Highcharts'' plotOptions.area.stacking: "percent" for a correct,
    native 100% stacked area chart with all 5 categories summing to 100% at every
    quarter.'
  - 'Full Imprint palette compliance: Equities renders in brand green (#009E73), the
    remaining four series follow canonical palette order, and both light and dark
    renders use theme-correct backgrounds, text, and grid colors.'
  - Clean, legible typography with explicit font sizes (22px title, 16px axis title,
    14px ticks/legend) that stay readable in both themes with no overlap, overflow,
    or edge clipping.
  - Realistic quarterly portfolio-allocation dataset across 5 asset classes with genuinely
    different trend shapes (equities rising, bonds and cash declining, commodities
    rise-then-fall) that exercises the plot type well.
  weaknesses:
  - Design Excellence sits at library-default level — palette and font sizing are
    correctly themed, but there is no distinctive visual treatment (e.g., no zone
    highlighting, no emphasis on the equities trend, no end-of-series data label)
    beyond the base stacked-area rendering.
  - No deliberate visual hierarchy beyond the stacking itself — consider a subtle
    end label or callout on the final quarter to make the equities-share growth an
    explicit, guided insight rather than something the viewer has to infer from the
    shapes alone.
  - Library Mastery is generic — the implementation doesn't lean on any Highcharts-distinctive
    capability (e.g., dataLabels on the last point, zone-based coloring, or the accessibility
    module) that would set it apart from a same-looking stacked-area chart built in
    another library.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "area-stacked-percent · javascript · highcharts · anyplot.ai" in bold dark ink, fully visible with generous margin above and no clipping. Y-axis title "Share of portfolio (%)" and tick labels (0%–100%) in medium-gray ink, clearly legible. X-axis quarter labels (2022 Q1 … 2024 Q4) evenly spaced with no overlap. Legend centered below the plot with 5 readable swatches/labels. Horizontal gridlines are subtle and do not compete with the data.
      Data: Five stacked areas from bottom to top — Cash (matte red), Commodities (ochre), Real estate (blue), Bonds (lavender), Equities (brand green #009E73) — separated by thin page-background-colored strokes for definition. First series (Equities) is the Imprint brand green as required; the other four follow canonical Imprint order.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Title, axis title, tick labels, and legend all render in light/off-white ink, clearly legible against the dark surface. Gridlines remain subtle. No dark-on-dark text anywhere.
      Data: Same five stacked areas in the identical hues as the light render — Equities is still #009E73 brand green, and the other four categories match their light-render colors exactly. Only the chrome (background, text, grid) flipped, as required.
      Legibility verdict: PASS
