review:
  strengths:
  - Correct, idiomatic 100%-stacked-area implementation (manual normalization + stack
    + areaStyle) with data summing to exactly 100% at every time point.
  - Canonical Imprint palette order preserved and pixel-identical between light and
    dark renders; only chrome (background, text, grid) flips.
  - 'Thoughtful detail: lineStyle.color set to t.pageBg creates a clean thin separator
    between bands instead of a distracting border.'
  - Minimal, uncluttered chrome — hidden axis ticks/lines/splitlines where they'd
    add no information, subtle y-axis gridlines only.
  - Realistic, neutral dataset (fictional cloud providers) sized well within spec
    range, with a clearly readable narrative (Cascade Cloud's share growing over the
    period).
  - Both renders pass the theme-readability and edge-clipping checks cleanly.
  weaknesses:
  - Design excellence is competent but not distinctive — no custom gradient fills,
    annotations, or emphasis to elevate the storytelling beyond the default stacked-area
    read.
  - 'No ECharts-specific distinctive feature exercised (e.g. emphasis.focus: ''series''
    for interactive-hover isolation, or a gradient areaStyle.color) — a missed opportunity
    for Library Mastery credit that wouldn''t compromise the static PNG.'
  - Legend markers render as hollow rings (ECharts' default line-series icon) rather
    than solid color swatches — purely cosmetic, but slightly less polished than a
    filled roundRect/circle icon would look.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "Cloud Spend Share · area-stacked-percent · javascript · echarts · anyplot.ai" centered at top in dark text; horizontal legend with 5 entries below it; x-axis quarter labels rotated ~30°; y-axis 0-100% in 20% increments with "%" suffix. All fully readable.
      Data: Five stacked bands bottom-to-top: Cascade Cloud (#009E73 brand green), Meridian Cloud (lavender), Nimbus Systems (blue), Anchorpoint (ochre), Other providers (matte red) — matches canonical Imprint order. Thin off-white separator lines between bands (lineStyle.color = t.pageBg).
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Same title, legend, and axis labels rendered in light grey/white text against the dark background. Fully readable, no dark-on-dark issues.
      Data: Identical band colors and stacking order to the light render (green/lavender/blue/ochre/red) — only chrome (background, text, separator-line color) flipped, confirming data-color consistency across themes.
      Legibility verdict: PASS
