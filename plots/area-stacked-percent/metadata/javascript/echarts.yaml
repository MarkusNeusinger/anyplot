review:
  strengths:
  - Correct, idiomatic 100%-stacked-area implementation (manual normalization + stack
    + areaStyle) with data summing to exactly 100% at every time point.
  - 'Directly addressed the attempt-1 review feedback: added a per-band vertical LinearGradient
    areaStyle (echarts.graphic.LinearGradient) for subtle depth, and swapped the hollow-ring
    legend icon for a solid roundRect swatch.'
  - Canonical Imprint palette order preserved and pixel-identical between light and
    dark renders; only chrome (background, text, grid) flips.
  - 'Thoughtful detail: lineStyle.color set to t.pageBg creates a clean thin separator
    between bands instead of a distracting border.'
  - Font sizes are now consistent across x-axis and y-axis tick labels (14px both),
    fixing the prior minor VQ-01 mismatch.
  - Minimal, uncluttered chrome — hidden axis ticks/lines/splitlines where they'd
    add no information, subtle y-axis gridlines only.
  - Realistic, neutral dataset (fictional cloud providers) sized well within spec
    range, with a clearly readable narrative (Cascade Cloud's share growing over the
    period).
  - Both renders pass the theme-readability and edge-clipping checks cleanly.
  weaknesses:
  - Design storytelling is still generic — the gradient adds polish but no explicit
    visual hierarchy or focal point highlights the actual insight (e.g. Cascade Cloud's
    share overtaking the rest); a callout or emphasized final-period label would push
    this further.
  - The gradient fill is a tasteful touch but functions as decoration rather than
    data encoding (per the style guide's 'no gradient fills for style' minimalism
    note) — acceptable here since it was explicitly requested by the prior review
    to gain Library Mastery credit, but should not be over-used elsewhere.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "Cloud Spend Share · area-stacked-percent · javascript · echarts · anyplot.ai" centered at top in dark text; horizontal legend with 5 solid roundRect swatches below it; x-axis quarter labels (2022 Q1 … 2024 Q4) rotated ~30°; y-axis 0-100% in 20% increments with "%" suffix. All text fully readable, sizes consistent (title 20px, legend/axis labels 14px throughout).
      Data: Five stacked bands bottom-to-top: Cascade Cloud (#009E73 brand green), Meridian Cloud (lavender #C475FD), Nimbus Systems (blue #4467A3), Anchorpoint (ochre #BD8233), Other providers (matte red #AE3030) — matches canonical Imprint order. Each band now uses a subtle vertical gradient (richer near its own top edge, softer toward its bottom edge) for a light 3D-depth effect, plus thin off-white separator lines (lineStyle.color = t.pageBg) between bands.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Same title, legend, and axis labels rendered in light grey/white text against the dark background. Fully readable, no dark-on-dark issues.
      Data: Identical band colors, stacking order, and gradient treatment as the light render (green/lavender/blue/ochre/red) — only chrome (background, text, separator-line color) flipped, confirming data-color consistency across themes.
      Legibility verdict: PASS
