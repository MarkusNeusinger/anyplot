review:
  strengths:
  - 'Correct 100% stacked-area implementation via stack + stackOffset: "expand", producing
    exact percent normalization with min/max axis locked to 0-1 and formatted as %'
  - Imprint palette used in canonical order across all 5 series (Solar=#009E73 brand
    green through Fossil), identical data colors in both light and dark renders
  - Custom valueFormatter surfaces both the percentage share AND the raw TWh value
    in tooltips, a genuinely useful interactive enhancement for the HTML detail view
  - 'Deterministic, realistic data tells a clear energy-transition story: quadratic
    growth for solar/wind, flat hydro/nuclear, linear fossil decline'
  - Thoughtful custom y-axis-label layout (separate rotated Typography column) documented
    with a comment explaining why MUI X's built-in label offset was avoided
  - Clean theme-adaptive chrome, dashed subtle gridlines, and area edge strokes for
    definition — no wasted default styling
  - skipAnimation set, no fetch/CDN calls, title format exactly matches the mandated
    `area-stacked-percent · javascript · muix · anyplot.ai`
  weaknesses:
  - X-axis has no explicit axis label (e.g. 'Year') — only tick values are shown;
    add a short axis title for full VQ-06 credit even though years are largely self-evident
  - 'Area boundary/line stroke (strokeWidth: 1.5) is on the thin side for a sparse
    15-point time series — the data-density heuristic calls for thicker lines/more
    prominent boundaries when there are under 50 points'
  - 'Design Excellence is solid but not exceptional: no explicit visual emphasis (e.g.
    highlighting the year renewables overtake fossil, or a light annotation/callout)
    to sharpen the data-storytelling beyond the inherent shape of the areas'
  - Grid and opacity tuning show refinement, but overall aesthetic still reads as
    a well-configured default rather than a distinctive, art-directed composition
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Bold dark title top-left ("area-stacked-percent · javascript · muix · anyplot.ai"), rotated "Share of generation" y-axis label in dark ink, year tick labels 2010-2024 along the bottom in dark gray, percentage tick labels (0%-100%) along the left in dark gray, horizontal dashed gridlines subtle and unobtrusive, horizontal legend centered below the plot with 5 color swatches (Solar/Wind/Hydro/Nuclear/Fossil). All chrome text is dark-on-light and clearly legible.
      Data: Five stacked areas summing to 100% at every year. Bottom-to-top order: Solar (brand green #009E73), Wind (lavender), Hydro (blue), Nuclear (ochre), Fossil (matte red) — exactly Imprint palette positions 1-5 in canonical order. Solar+Wind visibly grow from a thin sliver in 2010 to roughly 37% by 2024; Fossil visibly shrinks from ~61% to ~31%. No overlapping or unreadable text.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Same title, axis labels, tick labels, gridlines, and legend, all re-rendered in light ink/off-white text (title/axis labels bright, tick/legend text slightly softer gray) — fully legible against the dark surface, no dark-on-dark failures anywhere.
      Data: Identical five area colors and identical stacking/shape as the light render — confirms only chrome flipped, not data colors. Brand green is still clearly visible and vivid against the dark background.
      Legibility verdict: PASS
