review:
  strengths:
  - X-axis now carries an explicit "Year" axis label (labelStyle fontSize 14, matching
    the y-axis label size) — closes the VQ-06 gap from attempt 1
  - Area boundary strokeWidth raised from 1.5 to 2.25, giving the sparse 15-point
    series more prominent, readable band edges
  - New ChartsReferenceLine at the 2017 milestone ("fossil share drops below 50%")
    gives the chart an explicit focal point and sharpens the data storytelling beyond
    the shape of the areas alone
  - 'Correct 100% stacked-area implementation via stack + stackOffset: "expand", with
    y-axis locked to 0-1 and formatted as a percentage'
  - Imprint palette used in canonical order across all 5 series (Solar=#009E73 brand
    green through Fossil=matte red), with Hydro landing on blue — a nice semantic
    bonus (water -> blue) on top of canonical compliance
  - Custom valueFormatter surfaces both percentage share and raw TWh in tooltips,
    a genuine interactive enhancement for the HTML detail view
  - Deterministic, realistic data tells a clear energy-transition story (quadratic
    solar/wind growth, flat hydro/nuclear, linear fossil decline)
  - Clean theme-adaptive chrome; title format exactly matches the mandated `area-stacked-percent
    · javascript · muix · anyplot.ai`; skipAnimation set, no fetch/CDN calls
  weaknesses:
  - 'The `grid={{ horizontal: true }}` + dashed `.MuiChartsGrid-line` styling is effectively
    invisible in both renders — the stacked areas are ~0.9-opacity fills that cover
    the full 0-100% height at every x position, so any horizontal gridline drawn beneath
    them is fully occluded. Either drop the dead grid config or reduce area fillOpacity
    slightly so the dashed reference grid actually shows through.'
  - Data comment/label calls this a "global electricity generation mix," but the totals
    (~1,100 TWh in 2010, ~1,050 TWh in 2024) are off by roughly 20x from real global
    generation (~21,000+ TWh in 2010) — fine as illustrative data, but reword the
    comment to avoid implying literal global totals since the raw TWh values surface
    in tooltips
  - Design excellence is strong but still short of a fully art-directed composition
    — the milestone reference line is the one explicit emphasis; a secondary touch
    (e.g. a subtle callout on the point where solar+wind overtake hydro+nuclear) would
    push this further
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white, not dark.
      Chrome: Bold dark title top-left ("area-stacked-percent · javascript · muix · anyplot.ai"), rotated "Share of generation" y-axis label in dark ink on its own column, "Year" x-axis label now present at bottom-center, year tick labels 2010-2024 along the bottom in dark gray, percentage tick labels (0%-100%) along the left in dark gray, dashed milestone reference line at 2017 with label "2017: fossil share drops below 50%" in bold dark text, horizontal legend centered below the plot with 5 color swatches (Solar/Wind/Hydro/Nuclear/Fossil). All chrome text is dark-on-light and clearly legible; no light-on-light failures.
      Data: Five stacked areas summing to 100% at every year, bottom-to-top: Solar (brand green #009E73), Wind (lavender/purple), Hydro (blue), Nuclear (ochre), Fossil (matte red) — Imprint palette positions 1-5 in canonical order, with Hydro=blue also matching the real-world water association. Solar+Wind grow from a thin sliver in 2010 to roughly 37% by 2024; Fossil shrinks from ~61% to ~31%. Area boundary strokes are now clearly visible (strokeWidth 2.25). No overlapping or unreadable text; no clipped elements at any edge.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black, not light.
      Chrome: Identical title, axis labels (including the new "Year" label), tick labels, legend, and reference-line annotation, all re-rendered in light ink/off-white text — title and axis labels bright, tick/legend text slightly softer gray, milestone reference-line label in bold light ink against the red fill. Fully legible against the dark surface; no dark-on-dark failures anywhere (tick labels, axis titles, and the reference-line annotation all read clearly).
      Data: Identical five area colors and identical stacking/shape as the light render — confirms only chrome flipped, not data colors. Brand green (#009E73) remains clearly visible and vivid against the dark background; the dashed white reference line reads clearly against the red Fossil band.
      Legibility verdict: PASS
