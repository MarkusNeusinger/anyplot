review:
  strengths:
  - 'Uses the native stackOffset: "expand" on stacked area series, so MUI X normalizes
    each year to 100% itself; the stack fills 0–100% with a flat top and no gap at
    every year'
  - Y axis pinned to 0–1 with a percent valueFormatter, so the value axis reads as
    share of the total, from zero to the whole, never truncated
  - 'Composes a custom SVG layer into the LineChart through the useXScale and useDrawingArea
    hooks: a dashed 2017 marker with the label ''Fossil falls below 50% of the total'',
    computed from the data (49.8% in 2017 vs 52.1% in 2016) and not typed in'
  - Realistic, neutral electricity-mix scenario (solar and wind growing, hydro and
    nuclear flat, fossil declining) with the Imprint palette in canonical order; Fossil
    lands on the matte red anchor and Hydro on blue, both of which suit the categories
  - Tooltip valueFormatter shows both the share and the absolute TWh per layer in
    the HTML view; theme tokens are used for every chrome element, so both renders
    read cleanly
  - A title and subtitle hierarchy (22 px semibold title, 15 px inkSoft subtitle that
    gives the year span, the category count and the note 'each year's total = 100%')
  weaknesses:
  - 'Suggestion: direct labels at the right end of each layer would let the reader
    skip the trip to the bottom legend.'
  - 'Suggestion: the empty band of about 60 px between the subtitle and the milestone
    label could be tightened so the plot sits higher on the canvas.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, not pure white.
      Chrome: the bold dark title "area-stacked-percent · javascript · muix · anyplot.ai" sits top-left with a soft-grey subtitle "15 years, 2010–2024 · 5 categories · each year's total = 100%". The y axis is "Share of total (%)" with ticks from 0% to 100% in 10% steps. The x axis is "Year" with ticks from 2010 to 2024. A centered bottom legend has square swatches: Solar, Wind, Hydro, Nuclear, Fossil. A dashed dark vertical line at 2017 carries a bold label above the plot, "2017: Fossil falls below 50% of the total". All text is dark and readable.
      Data: five stacked filled layers, bottom to top: Solar #009E73 (about 0.4% to 23%), Wind #C475FD lavender (about 1.5% to 14%), Hydro #4467A3 blue, Nuclear #BD8233 ochre, and Fossil #AE3030 red on top (about 61% to 31%). The stack fills 0–100% at every year with a flat top edge. The layer order is the same at every year, and the boundaries are smooth with no overshoot.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17, not pure black.
      Chrome: the title, the subtitle, the axis titles, the tick labels and the legend text are light (ink and inkSoft tokens) and fully readable; there is no dark-on-dark text. The dashed 2017 marker and its label flip to light ink.
      Data: the same five Imprint colors in the same order as the light render. The 0.9 fill opacity lets the dark page show through slightly, so the fills read a touch deeper, but the hues are identical. Brand green stays clearly visible.
      Legibility verdict: PASS
