review:
  strengths:
  - Correct d3.stack().offset(d3.stackOffsetExpand) implementation with curveMonotoneX
    gives a genuine, smooth 100%-normalized stacked area chart
  - 'Imprint palette applied correctly: Chrome is the brand green #009E73 as the first
    series, Safari/Edge/Firefox follow canonical palette order, and ''Other'' is deliberately
    mapped to the theme-adaptive muted anchor rather than consuming a categorical
    slot'
  - In-browser legend construction measures label widths via getBBox() and centers
    the legend precisely — a distinctly D3-native technique not easily replicated
    in other libraries
  - Clean, idiomatic KISS-structured code with only the d3 global, deterministic in-memory
    data, and real data-join rendering (selection.data().join()) satisfying AR-05
  - 'Both renders are theme-correct: warm off-white/near-black backgrounds, ink/inkSoft
    tokens correctly threaded through axes, title, and legend'
  weaknesses:
  - 'DQ-03: The ''illustrative'' browser market-share values deviate substantially
    from well-known real-world proportions for this exact, easily fact-checked domain
    — desktop Safari is shown at ~20-21%, roughly double its real-world ~9-10% desktop
    share, while Edge is understated versus its real ~11% share. Tune values closer
    to known real-world proportions (e.g., Safari ~8-10%, Edge ~5-11%) while preserving
    the directional story (Chrome rising, IE/Edge declining).'
  - 'VQ-06: The y-axis label ''Share of Total'' has no explicit unit suffix (e.g.,
    ''Share of Total (%)''), and there is no x-axis title (e.g., ''Year'') — add both,
    even though tick labels already show ''%'' and years.'
  - 'DE-02: The y-axis gridlines (y.ticks(4)) are drawn but rendered underneath the
    fully opaque stacked areas (which always sum to 100%), so they have zero visual
    effect in the final output — this is dead code; either drop it or draw it above
    the areas at low opacity so it''s actually visible.'
  - 'DE-03: Visual hierarchy (Chrome anchored largest at the bottom) tells part of
    the story, but there''s no callout marking the notable crossover moments (e.g.,
    Safari overtaking Edge around 2018-2019, or the steep 2015-2019 Edge/IE decline)
    that would push this from ''readable'' to ''immediately insightful''.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "area-stacked-percent · javascript · d3 · anyplot.ai" is dark, bold, centered at top and fully readable. Legend row (Chrome, Safari, Edge / IE, Firefox, Other) sits centered below the title with color swatches and dark secondary-text labels, all legible. X-axis shows years 2015-2024 in dark tick text; y-axis shows 0%-100% in 20% increments with a rotated "Share of Total" label. All chrome text is clearly readable against the light background.
      Data: Five stacked bands filling the full plot height at every x position (sums to 100%): Chrome (brand green #009E73) anchored at the bottom and largest, Safari (lavender), Edge/IE (blue), Firefox (ochre), and Other (muted grey-brown) on top, separated by thin light-colored stroke lines. First series is confirmed #009E73.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Title, legend text, and axis tick labels all render in light/white tones and are clearly legible against the dark background — no dark-on-dark issues observed. The "Other" band appears as a light warm-grey (the dark-theme muted token), and thin stroke lines between bands are now dark, matching the dark page background.
      Data: The same five bands in the same order and identical data colors as the light render (Chrome #009E73 at bottom, then Safari, Edge/IE, Firefox, Other) — confirmed only the chrome (background, text, separator-stroke color) flipped between themes, not the data-series colors.
      Legibility verdict: PASS
