review:
  strengths:
  - Title font size (17px) matches the exact linear-scaling formula (round(22 × 67/len(title)))
    for the long descriptive-prefixed title, so it fits without overflow or clipping
    in either theme
  - 'Correct idiomatic Chart.js pattern for percent-stacked area: type ''line'' +
    y.stacked + fill:''origin''/''-1'' chain, with filler.propagate:false explicitly
    set to avoid the common stacked-fill rendering bug'
  - Data normalization is verified correct — the five bands sum to exactly 100% at
    every year, visually confirmed in both renders
  - Imprint palette used in canonical order with the brand green (#009E73) as the
    dominant, first-drawn series; data colors are pixel-identical between light and
    dark renders
  - Theme-adaptive chrome fully correct in both renders — warm off-white (#FAF8F1)
    / warm near-black (#1A1A17) backgrounds, all text uses ink/inkSoft tokens, y-axis-only
    subtle grid
  - Realistic, neutral domain data (smartphone OS market share 2015-2024) with historically
    plausible declines for Windows Phone and BlackBerry around their real discontinuation
    dates
  weaknesses:
  - 'tension: 0.3 spline smoothing on a 100%-stacked area chart is a latent risk —
    Catmull-Rom interpolation between only 10 points is not guaranteed to stay monotonic/within-bounds;
    consider tension: 0 (straight segments) for percent-stacked charts to guarantee
    the visual stack never overshoots, especially since pointRadius: 0 leaves no markers
    to anchor the eye at the real data points'
  - Composition is static for 6 of the 10 years (2019-2024 bands are visually flat/unchanging)
    — DQ-01 feature coverage would be stronger with continued gradual drift in the
    later years rather than a long flat plateau
  - Android's 82% share is on the high end vs. commonly cited real-world smartphone
    OS split (~70-72% Android / ~27-28% iOS in most global stats) — still plausible
    but pushes past the typical figures cited for this domain
  - Design Excellence is solid-default territory (alpha-blended fills with a solid
    border stroke, subtle single-axis grid) rather than a distinctive, highly polished
    composition — no visual hierarchy or focal-point technique beyond the natural
    area-size dominance of Android's band
  - No feature is used that is truly unique to Chart.js beyond the standard line/fill/stack
    idiom — the filler propagate tweak is good practice but a fairly standard fix,
    not a showcase of a library-distinctive capability
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white, not dark.
      Chrome: Title "Smartphone OS Market Share · area-stacked-percent · javascript · chartjs · anyplot.ai" in dark ink centered at top, fully visible with no clipping. X-axis title "Year" and Y-axis title "Market Share (%)" in dark ink. Tick labels (2015-2024 on x, 0%-100% in 20% steps on y) in a softer gray-ink tone. Bottom-aligned horizontal legend with 5 color swatches (Android, iOS, Windows Phone, BlackBerry, Other), all dark text, all fully readable. A single set of subtle horizontal gridlines aligns with the y-axis ticks; no x-axis gridlines.
      Data: Five stacked, semi-transparent (alpha ~0.75) filled bands with solid 2px borders, summing to exactly 100% at every year. Bottom-to-top order: Android (brand green #009E73, largest band, ~75% in 2015 growing to ~82% by 2018 and holding flat), iOS (lavender #C475FD, second-largest, ~14% growing to ~17-18%), Windows Phone (blue #4467A3, shrinking from ~7% to 0% by ~2019), BlackBerry (ochre #BD8233, shrinking from ~3% to 0% by ~2018), Other (matte red #AE3030, thin sliver shrinking to near-0%). First series is confirmed brand green.
      Legibility verdict: PASS — all text clearly readable against the light background, no dark-on-light legibility issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black, not light.
      Chrome: Same title, axis titles, and tick labels now rendered in light ink (near-white for primary text, light gray for tick labels), fully legible against the dark background. Legend swatches and text likewise flipped to light-on-dark and fully readable. Gridlines remain subtle, now a faint light tone against the dark surface.
      Data: The five stacked bands use the identical Imprint hex values as the light render (brand green Android band at bottom, lavender iOS, blue Windows Phone, ochre BlackBerry, red Other at top) — confirmed pixel-identical data colors between the two themes; only chrome (background, text, grid) flipped.
      Legibility verdict: PASS — no dark-on-dark failures observed; every title, axis label, and tick label is clearly visible against the near-black background.
