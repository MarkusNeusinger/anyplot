review:
  strengths:
  - 'tension: 0 fix removes the prior Catmull-Rom overshoot risk — bands now interpolate
    with straight segments, guaranteeing the 100%-stacked layers never dip below 0
    or over 100 between the 10 sampled years'
  - Android's share now peaks at ~72.5% (2020) before easing to ~71% by 2024, replacing
    the previous flat 82% plateau and landing squarely in the commonly cited real-world
    range (~70-72%)
  - Composition now changes continuously through all 10 years — iOS keeps growing
    every year (14% to 27.6%), Other keeps gently declining — resolving the prior
    6-year flat-plateau weakness
  - 'New explicit visual-hierarchy device: the dominant Android series gets a heavier
    3px border vs 1.5px for the rest, an intentional focal-point technique documented
    in a code comment'
  - 'Correct idiomatic Chart.js percent-stacked pattern retained: type ''line'' +
    y.stacked + fill:''origin''/''-1'' chaining with filler.propagate:false explicitly
    set'
  - Imprint palette in canonical order with brand green (#009E73) as the first, dominant
    series; data colors are pixel-identical between light and dark renders
  - Theme-adaptive chrome fully correct in both renders — warm off-white (#FAF8F1)
    / warm near-black (#1A1A17) backgrounds, all text uses ink/inkSoft tokens, y-axis-only
    subtle dashed grid
  weaknesses:
  - Design Excellence remains solid-default territory — alpha-blended fills with solid
    border strokes are tasteful but stop short of a distinctive, highly polished composition
  - No feature is truly unique to Chart.js beyond the standard line/fill/stack idiom;
    the filler.propagate tweak and border-width emphasis are good practice but not
    a showcase of a library-distinctive capability
  - Windows Phone and BlackBerry both reach exactly 0% by 2020 in lockstep — real-world
    discontinuation timing differed slightly between the two platforms, a minor realism
    nit
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white, not dark.
      Chrome: Title "Smartphone OS Market Share · area-stacked-percent · javascript · chartjs · anyplot.ai" in dark ink, centered at top, fully visible with no clipping; italic subtitle "Annual global shipment share across five platforms, 2015-2024" beneath it in a softer ink tone. X-axis title "Year" and Y-axis title "Market Share (%)" in dark ink. Tick labels (2015-2024 on x; 0%-100% in 20% steps on y, suffixed with "%") in a softer gray-ink tone. Bottom-aligned horizontal legend with 5 color swatches (Android, iOS, Windows Phone, BlackBerry, Other), all dark text, all fully readable. Subtle dashed horizontal gridlines align with the y-axis ticks; no x-axis gridlines.
      Data: Five stacked, semi-transparent (alpha ~0.75) filled bands with solid borders (Android's border noticeably heavier than the rest), summing to exactly 100% at every year with clean straight-segment transitions (no spline overshoot). Bottom-to-top order: Android (brand green #009E73, largest band, rising from ~62% in 2015 to a ~72.5% peak around 2019-2020 then easing to ~71% by 2024), iOS (lavender/purple, second-largest, continuously growing from ~14% to ~27.6%), Windows Phone (blue, shrinking from ~14% to 0% by ~2020), BlackBerry (ochre, shrinking from ~7% to 0% by ~2020), Other (matte red, thin sliver shrinking from ~3% to ~1.4%). First series is confirmed brand green.
      Legibility verdict: PASS — all text clearly readable against the light background, no dark-on-light legibility issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black, not light.
      Chrome: Same title, subtitle, axis titles, and tick labels, now rendered in light ink (near-white for primary text, light gray for tick labels and subtitle), fully legible against the dark background. Legend swatches and text likewise flipped to light-on-dark and fully readable. Gridlines remain subtle, now a faint light tone against the dark surface.
      Data: The five stacked bands use identical Imprint hex values to the light render (brand green Android at bottom, lavender/purple iOS, blue Windows Phone, ochre BlackBerry, red Other at top) — data colors are pixel-identical between the two themes; only chrome (background, text, grid) flipped.
      Legibility verdict: PASS — no dark-on-dark failures observed; every title, subtitle, axis label, and tick label is clearly visible against the near-black background.
