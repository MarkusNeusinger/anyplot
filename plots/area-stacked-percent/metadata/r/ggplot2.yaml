  strengths:
  - Correct 100% stacked-area implementation via geom_area(position = "fill") — precisely
    matches the spec's normalized-to-100% requirement
  - 'Full theme-adaptive chrome implemented correctly: both light and dark renders
    pass every legibility check, no dark-on-dark or light-on-light failures'
  - Imprint palette applied in canonical order (positions 1-5) and identical across
    both themes
  - Title fontsize dynamically scaled down for the long mandated title string, avoiding
    overflow or clipping
  - 'Subtle design touch: area border color matches the page background exactly, giving
    clean layer separation instead of default gray outlines'
  - Realistic, well-scaled market-share dataset showing a meaningful long-term compositional
    shift (consolidation trend) across 5 vendors
  - Clean KISS code structure, fully reproducible via set.seed(42)
  weaknesses:
  - Unused library(tidyr) import — no tidyr function (pivot_longer, gather, spread,
    complete, etc.) is called anywhere in the script; remove the import
  - Design Excellence sits at 'well-configured default' tier — push further with a
    more distinctive typographic/legend treatment or a direct end-of-line label reinforcing
    the market-consolidation story, rather than relying on theme_minimal + the mandated
    palette alone
  - 'LM-02 is generic: geom_area(position = "fill") is idiomatic but not distinctive
    to ggplot2 — consider leveraging a ggplot2-specific feature (e.g. direct end labels
    via geom_text/annotate instead of a side legend, or refined date breaks) to showcase
    library mastery'
  - Y-axis title 'Market Share' relies on the tick labels' '%' suffix for units rather
    than stating them explicitly (e.g. 'Market Share (%)') — minor, optional polish
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "Cloud Market Share · area-stacked-percent · r · ggplot2 · anyplot.ai" in dark ink at the top-left, fully visible with no clipping. "Quarter" (x-axis) and "Market Share" (y-axis, 0%-100%) labels in dark ink, tick labels in slightly softer dark gray. Subtle horizontal gridlines at 25% intervals. Legend titled "Vendor" sits to the right of the plot with 5 color swatches (Vendor A-E), dark readable text on the cream background.
      Data: Five stacked bands filling the full height at every quarter from 2020 to late 2024. Bottom-to-top order is Vendor E (matte red), Vendor D (ochre), Vendor C (blue), Vendor B (lavender), Vendor A (brand green) — matching the Imprint canonical palette order, with Vendor A (green, #009E73) as the first/top series. White boundary lines cleanly separate each band. The chart shows Vendor A's share growing from ~33% to ~55% while Vendor D and Vendor E shrink to near-zero, and Vendor B grows moderately — a clear market-consolidation trend.
      Legibility verdict: PASS — all text is clearly readable against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Same title, axis labels, and tick labels now rendered in light ink (off-white), clearly legible against the dark background. Gridlines are faint light lines at 25% intervals, subtle but visible. Legend text and title are light-colored and fully readable.
      Data: Identical five-band composition and identical hex colors to the light render (brand green Vendor A on top, red Vendor E at bottom) — confirming data colors do not shift between themes. Boundary lines between bands are now dark (matching the page background), producing the same clean separation effect as the light render's white lines.
      Legibility verdict: PASS — all text is clearly readable against the dark background; no dark-on-dark failures observed anywhere (title, axis labels, tick labels, and legend all use the light ink token).
