      Data: a single-colour Imprint green (#009E73) dendrogram drawn with right-angle links and small green leaf dots on the zero baseline. Setosa cluster merges below 1.1 on the left, versicolor/virginica merge at 2.7, root merge at 5.53. No crossings, no cut line.
