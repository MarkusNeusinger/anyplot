review:
  strengths:
  - 'Correct dendrogram geometry: complete-linkage clustering on Euclidean distances,
    every crossbar at its exact merge height (S-01/S-04 at 0.14 and Ve-01/Ve-03 at
    0.26 match the computed distances), leaf order from a depth-first tree walk so
    no branches cross'
  - 'Idiomatic MUI X v9 composition: ChartsContainer with ChartsGrid, ChartsXAxis/ChartsYAxis
    and a custom SVG layer that reads the axis scales through useXScale/useYScale,
    so the branches share the axis coordinate system'
  - Height axis titled 'Euclidean distance (complete linkage)' names both the metric
    and the linkage method; x ticks are placed per leaf via tickInterval + valueFormatter
  - 'Theme-correct chrome in both renders: warm page backgrounds, ink/inkSoft text,
    a subtle dashed horizontal grid, identical Imprint green branches'
  - Real iris measurements give three natural groups with the expected setosa separation
    (root merge at 5.53) and the familiar versicolor/virginica overlap
  weaknesses:
  - 'Suggestion: the leaf ids S-, Ve- and Vi- are cryptic and inconsistently abbreviated;
    spelling the species prefix out (Setosa-01, Versicolor-01, Virginica-01) would
    let a reader see the species grouping without prior knowledge.'
  - 'Suggestion: the leaf scatter tooltip shows the numeric x position and y = 0;
    a valueFormatter on the series showing the sample id would make the HTML hover
    useful.'
  image_description: |-
    Light render (plot-light.png):
