review:
  strengths:
  - Correct EAN-13 construction from L/G/R code tables and first-digit parity, with
    start 101, center 01010 and end 101 guards and 9-module quiet zones
  - 'Solid, sharp-edged bars: adjacent modules fuse into whole 1-4 module bars because
    the rects carry the bar color as outline with size=0'
  - Valid real German EAN (4006381333931) with the human-readable digits in monospace,
    the leading 4 outside the left guard
  - layer_tooltips() exposes each module's section and index in the interactive HTML
    output
  - Theme tokens threaded through bars, digits and title; readable in both themes
  weaknesses:
  - 'SC-02 (both): guard bars extend upward 10 units above the digit bars (ymax raised)
    instead of reaching down between the groups of digits as C4 describes → keep the
    guard tops level with the digit bars and extend the guard bars'' ymin downward
    by about 10 units into the digit row. Likely cause: guard_y_max = bar_y_max +
    10 applied to YMAX instead of lowering YMIN for guard positions.'
  - 'Suggestion: the 12-digit check-digit computation is unused for the 13-digit input;
    it could validate the given check digit instead.'
