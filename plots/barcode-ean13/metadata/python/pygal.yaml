review:
  strengths:
  - 'Correct EAN-13 encoding: start guard, LGLLGG parity for first digit 4, center
    guard, R-code right half, end guard — 95 modules with 9-module quiet zones'
  - Guard patterns hang below the baseline via a signed second StackedBar series,
    so they stand out from the digit bars
  - Human-readable digits below the symbol, first digit in the left quiet zone, the
    others centered under their 7-module groups
  - Solid ink bars at full opacity in strong contrast with the page in both themes
  - Parity caption explains how the first digit selects the left-half encoding
  - Interactive HTML output alongside the PNG
  weaknesses:
  - 'SC-02 (both): adjacent dark modules are drawn as separate one-module columns
    with a hairline gap between them, so 2-, 3- and 4-module bars (e.g. the runs in
    the left half under digits 0 and 6) read as clusters of thin bars instead of solid
    wide bars → each run of dark modules one solid bar of 2–4 module widths with no
    internal gap. Likely cause: pygal''s per-bar margin between StackedBar columns;
    merge consecutive dark modules or remove the bar spacing.'
  - 'SC-02 (both): guard tails extend only 0.9 of 6 units below the baseline and stop
    above the digit row, so they do not reach down between the digit groups as C4
    describes → lengthen the guards (and raise the digit labels) so the tails reach
    into the digit row between the groups. Likely cause: guard value -0.9 with the
    digit labels placed as x labels below range=(-1, 6).'
  - 'Suggestion: hide the thin y-axis rule at the left edge of the plot area, which
    reads as a stray artifact in the bare barcode composition.'
