    spaces and the edges are not sharp (C2, C5) → fill only, no stroke. Likely cause:
    geom_rect(..., color=INK) with the default outline width.'
  - 'Suggestion: shorten the gap between the digit bars and the digit row so the number
    reads as part of the symbol.'
