review:
  strengths:
  - 'Complete EAN-13 encoding from the standard tables: L/G parity selected by the
    first digit, R codes on the right, check digit computed for 12-digit input'
  - One rectangle per run of 1-modules (itertools.groupby) gives solid, sharp-edged
    bars of 1-4 modules
  - Guard bars drawn longer than the digit bars, with the first digit set in the left
    quiet zone
  - Theme-adaptive INK/INK_SOFT tokens invert the symbol cleanly in dark mode
  - Monospace human-readable digits centred under each 7-module digit pattern
  - HTML output keeps plotly's zoom for close inspection of module widths
  weaknesses:
  - 'Suggestion: the Country/Manufacturer/Product/Check segment labels are an annotation
    layer the spec does not request; the symbol reads fully without them.'
  - 'Suggestion: starting the human-readable digits a little higher, so the longer
    guard bars reach down between the digit groups rather than ending above them,
    would match the printed EAN-13 convention more closely.'
