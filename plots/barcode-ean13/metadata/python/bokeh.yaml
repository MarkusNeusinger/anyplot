review:
  strengths:
  - 'Fully correct EAN-13 encoding: L/G/R tables and the first-digit parity pattern
    match the standard, and the check digit (1) is computed from the 12-digit code'
  - Guard bars drawn longer than the digit bars, with 11-module quiet zones and the
    first digit placed outside the left guard
  - 'Theme tokens threaded through every element: INK bars and digits, INK_SOFT secondary
    text, correct page backgrounds in both renders'
  - Monospace human-readable digits and explicit font sizes give a clear, legible
    type hierarchy
  - 'Idiomatic Bokeh: one ColumnDataSource drives a vectorized p.quad, and a HoverTool
    bound to it reports which digit or guard each bar encodes in the HTML'
  - 'Code follows the adaptable zones: # Constants for the encoding tables, a # Data
    block with the replaceable code, everything else derived below # Plot'
  weaknesses:
  - 'SC-02 (both): the guard bars end at y=150, at the top edge of the human-readable
    digit row (digits drawn from y=80 upward), so they do not reach down between the
    digit groups as C4 asks, and the digit bars stop about 130 data units above the
    digits, leaving a loose band → extend the guard bars down to the digit baseline
    (bottom about 80, -70) and let the digit bars end just above the digit tops (bottom
    about 170, -110). Likely cause: bar_bottoms 150 / 280 against text_y_pos=80 with
    text_baseline=''bottom''.'
  - 'Suggestion: spread each six-digit group across the width of its half (one Label
    per digit at its module position) instead of a tight centered string, as on a
    printed EAN-13 label.'
  - 'Suggestion: a light tile behind the symbol in the dark theme (permitted by the
    spec) would keep the bars dark-on-light and scannable.'
  image_description: |-
