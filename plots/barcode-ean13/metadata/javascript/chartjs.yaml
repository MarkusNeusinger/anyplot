review:
  strengths:
  - Deterministic, byte-correct EAN-13 encoding — the L/G/R code tables, parity table,
    and check-digit calculation are textbook-correct, verified against the well-known
    4006381333931 checksum (payload 400638133393 → check digit 1).
  - 'Every spec requirement is present: 9-module quiet zones on both sides, distinct
    start/center/end guard patterns, correct 1–4 module bar widths from the real encoding
    tables, and human-readable digits with the first digit sitting outside the left
    guard.'
  - Uses a real, neutral German retail EAN-13 prefix (400) for an authentic, scannable-looking
    example rather than an abstract placeholder.
  - 'Creative, idiomatic Chart.js technique: a floating/range bar dataset for the
    module bars plus a custom afterDraw plugin that reads chart.scales.x/y.getPixelForValue()
    to place digit labels precisely — a genuinely distinctive use of Chart.js''s plugin
    architecture.'
  - 'Well-reasoned, explicitly documented exception to the brand-green rule: bars
    render in theme-adaptive ink because a barcode''s contrast is functional (scannability),
    not categorical data — consistent across both themes.'
  - Title fontsize correctly follows the style guide's proportional-scaling formula
    (round(22 × 67/len(title))) for the longer descriptive-prefixed title, avoiding
    overflow.
  - Canvas is well utilized with balanced left/right quiet-zone margins; the barcode
    and digits stay clearly legible even scaled down to the 400px mobile thumbnail.
  weaknesses:
  - 'Bottom margin (layout.padding.bottom: 20) is noticeably tighter than the top
    margin (title + padding.top) in both renders — nothing is clipped, but the vertical
    whitespace is slightly unbalanced; add a touch more bottom padding or trim the
    y-scale max for symmetry.'
  - Design Excellence is inherently capped by the plot type — a monochrome barcode
    has no color harmony to showcase; a subtle secondary touch (e.g., a faint quiet-zone
    frame or a small caption noting the digit groups) could add polish without compromising
    scannability.
  - No visual hierarchy or storytelling beyond faithful encoding — expected for a
    barcode, but it keeps Data Storytelling (DE-03) at the default score; no fix required
    beyond general polish.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Title "German Retail Product · barcode-ean13 · javascript · chartjs · anyplot.ai" in dark ink, centered top, clearly readable. No axis labels/ticks (intentionally hidden — a barcode has no cartesian axes). Human-readable digits ("4 0 0 6 3 8 1 3 3 3 9 3 1") sit below the bars in dark ink, evenly spaced, first digit "4" placed outside the left guard bars per spec.
      Data: Vertical bars render in solid dark ink (theme-adaptive, not brand green) against the cream background — correct choice since a barcode's bars are a functional scannable mark, not a categorical data series. Bar widths visibly vary between 1 and 4 modules, matching real EAN-13 module encoding. Start, center, and end guard bars are visibly taller, extending down through the digit-label gap, exactly as on a real printed barcode. 9-module quiet zones are visible as blank margins on both left and right edges.
      Legibility verdict: PASS — title and all 13 digits are crisp and unambiguous; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Title and digit labels render in light ink (theme-flipped), fully legible against the dark background. Layout is otherwise identical to the light render.
      Data: Bars flip from dark ink to light ink (theme-adaptive chrome, not a data color) while retaining identical widths/positions to the light render — correct, since these are functional marks, not the Imprint categorical palette. Guard-bar heights and quiet-zone margins are unchanged from light.
      Legibility verdict: PASS — no dark-on-dark or light-on-light failures; all digits and the title are clearly visible.
