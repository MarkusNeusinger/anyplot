review:
  strengths:
  - Deterministic, byte-correct EAN-13 encoding — the L/G/R code tables, parity table,
    and check-digit calculation are textbook-correct, verified against the well-known
    4006381333931 checksum (payload 400638133393 → check digit 1).
  - 'Every spec requirement is present: 9-module quiet zones on both sides, distinct
    start/center/end guard patterns, correct 1–4 module bar widths from the real encoding
    tables, and human-readable digits with the first digit sitting outside the left
    guard.'
  - Uses a real, neutral German retail EAN-13 prefix (400) for an authentic, scannable-looking
    example rather than an abstract placeholder.
  - 'Creative, idiomatic Chart.js technique: a floating/range bar dataset for the
    module bars plus a custom afterDraw plugin that reads chart.scales.x/y.getPixelForValue()
    to place digit labels precisely.'
  - 'Well-reasoned, explicitly documented exception to the brand-green rule: bars
    render in theme-adaptive ink because a barcode''s contrast is functional (scannability),
    not categorical data.'
  - 'Repair attempt directly addressed both prior weaknesses: layout.padding.bottom
    raised from 20 to 64 to rebalance the vertical margins, and a new faint quiet-zone
    strokeRect (drawn in the grid token) was added around the bars as the requested
    subtle refinement touch — confirmed present in the rendered PNG as a hairline
    frame from y≈127 to y≈1316.'
  weaknesses:
  - Bottom margin is now larger than the top margin (measured ~66px top vs ~128px
    bottom on the 1800px-tall canvas) — the padding fix overcorrected slightly in
    the opposite direction. Nothing is clipped and the imbalance is much milder than
    before, but a small trim of layout.padding.bottom (e.g. 64 -> ~40) would center
    it more precisely.
  - Design Excellence remains inherently limited by the plot type — a monochrome barcode
    has little room for color harmony, and the new quiet-zone frame is a refinement
    touch rather than a storytelling device, so Data Storytelling stays at the default
    score.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white, not dark.
      Chrome: Title "German Retail Product · barcode-ean13 · javascript · chartjs · anyplot.ai" renders in dark ink, centered at the top, clearly readable. No cartesian axes/ticks (correctly hidden — a barcode has no meaningful X/Y axes). A new faint hairline frame (grid-token color) traces the full quiet-zone + bar region, confirmed present via pixel inspection (y≈127 top edge, y≈1316 bottom edge, x≈13-15 left edge) — subtle enough to never compete with the bars' scannable contrast.
      Data: Vertical bars in solid dark ink represent the encoded modules, with widths visibly varying between 1 and 4 modules, matching real EAN-13 encoding. Start, center, and end guard bars are visibly taller, extending through the human-readable digit strip, exactly as on a real printed barcode. 9-module quiet zones are visible as blank margins on both edges. All 13 digits ("4 0 0 6 3 8 1 3 3 3 9 3 1") sit below the bars, evenly spaced, first digit "4" correctly placed outside the left guard.
      Legibility verdict: PASS — title and all digits are crisp and unambiguous against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black, not light.
      Chrome: Title and digit labels flip to light ink, fully legible against the dark surface. The hairline quiet-zone frame is present in the same position, flipped to the theme-adaptive grid color.
      Data: Bars flip from dark ink to light ink (theme-adaptive chrome, not a data color) while retaining identical widths and positions to the light render — correct, since these bars function as a scannable mark rather than Imprint categorical data. Guard-bar heights, digit positions, and quiet-zone margins are unchanged from the light render.
      Legibility verdict: PASS — no dark-on-dark or light-on-light failures; all digits and the title are clearly visible.

    Both renders confirm the padding rebalance (top≈66px, bottom≈128px measured on the 3200x1800 canvas) is a clear improvement over the prior attempt's more extreme asymmetry, and the requested quiet-zone frame refinement is genuinely present, not just claimed.
