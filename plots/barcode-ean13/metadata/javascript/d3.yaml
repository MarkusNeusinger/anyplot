review:
  strengths:
  - 'Technically correct EAN-13 encoding: checksum, L/G/R code tables, and leading-digit
    parity pattern are all implemented per the standard'
  - Quiet zones (9 modules each side), start/center/end guard patterns, and human-readable
    digit placement (leading digit outside the left guard) all match the spec
  - Clean, deterministic, single-pass KISS code with no fake interactivity
  - Correct mandated title format
  - 'Realistic, neutral data: ''590...'' is a real GS1 country-code prefix (Poland),
    giving a plausible retail product code'
  weaknesses:
  - Bars are filled with the theme-adaptive t.ink token, so in the dark render the
    barcode itself inverts to light bars on the dark card — a real barcode must stay
    dark-ink-on-light-background regardless of page theme to remain scannable by physical
    scanners; only the surrounding chrome should flip with theme, not the code's own
    bars/label-card colors
  - 'No idiomatic D3 data-join or scale usage: bars are drawn with a manual for-loop
    of svg.append(''rect'') calls and hand-computed pixel x-positions instead of selection.data(bars).join(''rect'')
    with a d3.scaleLinear/scaleBand for the module-to-pixel mapping'
  - Card/barcode area covers only ~42% of the canvas with fairly generous empty space
    above the title and below the card — below the 50-80% target for ideal canvas
    utilization
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white, consistent with #FAF8F1.
      Chrome: centered bold title "barcode-ean13 · javascript · d3 · anyplot.ai" in dark ink at the top; an elevated, rounded-corner card (light cream fill, subtle grid-colored border) holds the barcode. No axes/grid — appropriate for this plot type.
      Data: barcode bars render as solid near-black bars on the light card; three digit groups below the bars ("5", "901234", "123457") in a monospace font, also dark ink. First categorical-style element (the bars) is dark ink, which is the correct real-world barcode convention (dark bars on light background).
      Legibility verdict: PASS — title and digit labels are clearly readable against the light card/page.

    Dark render (plot-dark.png):
      Background: warm near-black, consistent with #1A1A17.
      Chrome: same centered title, now in light ink; the card is a slightly-elevated dark fill with a faint border — correctly theme-flipped chrome.
      Data: the barcode bars themselves flip to light/cream-colored bars on the dark card (mirroring the light render's bar shapes exactly), and the digit text is light-colored. The bar shapes/widths are identical to the light render, but their COLOR is inverted — this breaks the real-world requirement that a barcode is always dark bars on a light background to be scannable; the theme should only flip the surrounding chrome, not the code itself.
      Legibility verdict: PASS for text readability (all chrome and digits are clearly visible against the dark background), but FAIL for barcode fidelity — the inverted bar colors make this render not a physically valid/scannable barcode.
