review:
  strengths:
  - 'Correct EAN-13 construction from the encoded digits: L/G/R code tables (R as
    the bitwise complement of L, G as R reversed), the leading-digit parity table,
    and a check digit computed with the 1-3 weights (590123412345 → 7, giving the
    valid 5901234123457).'
  - Each module is one band of a zero-gap band x-scale, so adjacent bar modules merge
    into whole-module bars 1–4 modules wide; whole-pixel module width (Math.floor)
    keeps every bar edge sharp in the PNG.
  - Guard bars run on to the bottom between the digit groups while digit bars stop
    at 0.9 of the height, achieved with two stacked bar series — the conventional
    EAN-13 look.
  - Human-readable digits in a monospace face, the leading digit centred in the left
    quiet zone and every other digit centred under its own 7-module pattern; 9-module
    quiet zones on both sides.
  - 'Idiomatic MUI X v9 composition: ChartsContainer + BarPlot with hidden axes, and
    a custom SVG layer that reads the chart''s own scales through useXScale/useYScale.'
  - The symbol keeps dark bars on a light label tile in both themes, while title and
    caption take ink/inkSoft tokens, so it stays scannable and the chrome stays theme-correct.
  weaknesses:
  - 'Suggestion: the caption at 16 px shrinks to about 4 px in the 400 px thumbnail;
    a slightly larger caption or a shorter one (number and check digit only) would
    carry further.'
  - 'Suggestion: an OCR-B-like digit face (or a slightly heavier monospace weight)
    would bring the human-readable line closer to printed retail labels.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white page (#FAF8F1) with a slightly bordered, rounded label tile of the same cream colour around the symbol.
      Chrome: bold title "barcode-ean13 · javascript · muix · anyplot.ai" centred above the tile in dark ink; a soft-grey caption below ("EAN-13 5901234123457 · check digit 7 · left-half parity LGGLLG set by leading digit 5 · 113 modules incl. 9-module quiet zones"). All readable. No axes, ticks, grid or legend (expected for this type).
      Data: near-black (#1A1A17) solid, sharp-edged bars of 1–4 module widths; start, centre and end guards extend down past the digit bars to the digit baseline; digits "5" (in the left quiet zone), "901234" under the left half and "123457" under the right half in a monospace face. Blank quiet zones on both sides.
      Legibility verdict: PASS

