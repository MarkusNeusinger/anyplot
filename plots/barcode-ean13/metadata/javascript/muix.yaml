review:
  strengths:
  - Mobile-legibility fix from attempt 1 verified directly against plot-light_400.png
    / plot-dark_400.png -- digit labels are now clearly readable at 400px in both
    themes
  - 'Correct from-scratch EAN-13 encoding: canonical L-code table, derived R/G codes,
    correct parity table selection by the first digit, and a correctly computed check
    digit ("590123412345" -> check digit 7 -> "5901234123457", matching the spec''s
    own Polish-product example)'
  - 'All required structural elements present: 9-module quiet zones, start/center/end
    guard patterns, and correct variable module-width bars (1-4 modules) via zero-gap
    adjacent band bars'
  - Human-readable digits correctly centered under each digit's 7-module block, with
    the first digit correctly placed outside the left guard in the quiet zone
  - Clean, minimal chrome; correct theme-adaptive ink color in both renders
  - Creative, idiomatic use of MUI X's band-scale BarChart (tickLabelInterval + valueFormatter
    + zero-gap bars) to repurpose a bar-chart primitive into a correctly-encoded barcode
  - Canvas size, skipAnimation, default export, and harness contract all correctly
    followed; deterministic data
  weaknesses:
  - 'Bars use t.ink instead of Imprint brand green #009E73 for the chart''s only data
    series -- defensible as a real-world-fidelity call for barcode authenticity (documented
    in a code comment), but still a deviation from the hard ''first categorical series
    is always green'' rule'
  - DE-03 storytelling remains minimal -- no visual hierarchy or narrative device
    beyond the correct encoding itself; a barcode's nature limits how much can be
    done here without compromising function
  image_description: |-
