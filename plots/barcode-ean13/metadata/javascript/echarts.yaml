review:
  strengths:
  - 'Correct, from-scratch EAN-13 encoding: check-digit calculation, L/G/R code tables,
    and first-digit parity all verified against the spec''s own example code (5901234123457
    → same visible digit sequence).'
  - Thoughtful 'product label' aesthetic — rounded card, subtle drop shadow, off-white
    paper background, monospace digit font — elevates a technical diagram into a polished
    visual without adding fake UI.
  - Correctly implements guard-bar height differentiation (start/center/end guards
    taller than digit bars) and the real-world convention of placing the first digit
    alone in the left quiet zone.
  - Theme-adaptive chrome (title uses t.ink) while intentionally keeping the barcode
    itself fixed black-on-paper in both themes — correctly reasoned in a code comment
    (a scanner reads contrast, not brand chrome) and confirmed identical across both
    renders.
  - Deterministic, dependency-free, in-memory data; clean code with no unused imports.
  weaknesses:
  - Design Excellence (data storytelling) is inherently capped by the plot type —
    this is a faithful reproduction of a real-world artifact rather than a data narrative,
    so DE-03 stays at the default; not an execution flaw, just an acknowledged ceiling.
  - LM-02 (distinctive features) credits the graphic-API composition, but rect/text
    primitives are the generic canvas escape hatch any charting library exposes rather
    than an ECharts-specific capability — a future revision could lean harder on an
    ECharts-only touch (e.g. subtle shadow via graphic z-layering, or a hover state
    in the HTML output) to earn full marks there.
