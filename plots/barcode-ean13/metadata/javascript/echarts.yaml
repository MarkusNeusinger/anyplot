      Data: The barcode itself renders as solid black bars on a near-white paper card (#FDFCF5), with clearly taller guard bars at the start, center, and end positions. Human-readable digits "5 9 0 1 2 3 4" and "1 2 3 4 5 7" sit below the bars in a monospace font, with the leading "5" isolated in the left quiet zone per the EAN-13 convention. All text and bars are sharply legible against the card and page.
