review:
  strengths:
  - 'Technically correct EAN-13 encoding: proper L/G/R parity tables keyed by leading
    digit, a recomputed and verified check digit, and correctly structured start/center/end
    guard patterns with quiet zones ≥ 9 modules per spec.'
  - 'Clever ''printed label'' design: the barcode ink, card backdrop, and digit/segment-caption
    text are intentionally fixed colors in both themes (a real barcode can''t invert
    without breaking scannability), while the title/subtitle stay theme-adaptive —
    both are correctly readable in light and dark.'
  - Color-coded structural segments (Country / Manufacturer / Product / Check) in
    canonical Imprint order, with the semantic-red anchor correctly reserved for the
    check digit, turn an otherwise opaque barcode into a small educational diagram
    — the segment boundaries line up almost exactly with the spec's digit-grouping
    description.
  - Clean, minimal chrome (no ticks, no grid, no spines) appropriate for a barcode
    that has no real axes; typographic hierarchy (bold title, muted subtitle) is well
    judged.
  weaknesses:
  - Noticeable unused cream margin (~15-17% of canvas height) below the 'Country/Manufacturer/Product/Check'
    captions in both renders — tightening the y-limits or growing the card slightly
    would use the 3200×1800 canvas more fully.
  - Subtitle (13pt) reads small next to the very large 24pt digit labels; at ~400px
    mobile width it may feel thin — consider nudging it up 1-2pt.
  - Library mastery leans on generic primitives (poly!/text!/Rect2f) rather than a
    more distinctive Makie feature (e.g. a custom @recipe) — reasonable since no barcode
    recipe exists, but worth exploring for a future revision.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white page background matching #FAF8F1, holding a near-identical (slightly warmer/lighter, ~#FBF9F2) "label card" rectangle behind the barcode that reads as a single seamless surface in this theme.
      Chrome: Bold dark title "barcode-ean13 · julia · makie · anyplot.ai" and a muted gray subtitle "EAN-13 · 4006381333931 · Germany · retail product identification" both sit clearly on the page background. Below the barcode, black human-readable digits (4 0 0 6 3 8 1 [gap] 3 3 3 9 3 1) are crisp against the card. Four colored underline segments (green/lavender/blue/red) are labeled "Country", "Manufacturer", "Product", "Check" in muted gray text, all legible.
      Data: Black bars of varying width/height (guard bars run deeper than data bars) form a well-structured EAN-13 barcode; first colored segment is Imprint brand green (#009E73), consistent with palette rules.
      Legibility verdict: PASS — every text element (title, subtitle, digits, segment captions) is clearly readable against the light surfaces; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black page background matching #1A1A17. The label card behind the barcode is intentionally still the fixed light cream (~#FBF9F2) — a deliberate design choice (comment in the code) treating the barcode+card as a "photographed printed label" that does not invert with theme, similar to why the barcode ink itself stays black.
      Chrome: Title and subtitle correctly flip to light text (white/light-gray) against the dark page background and are fully readable. Inside the card, the black digits and muted-gray segment captions render exactly as in the light version since the card itself did not change color — still fully legible, no dark-on-dark anywhere.
      Data: Bar shapes and the four colored segment underlines (green/lavender/blue/red) are pixel-identical in hue to the light render — only the surrounding page chrome (title/subtitle color, page background) flipped, per the theme-adaptive-chrome rule.
      Legibility verdict: PASS — all text is readable in both the dark page chrome and on the fixed light card; the fixed-card choice is well-reasoned and does not create any accessibility problem in either theme.
