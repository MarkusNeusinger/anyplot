review:
  strengths:
  - 'Single-series ScatterChart with 120 points, all in Imprint #009E73 at fillOpacity
    0.7, so the positive trend, spread and a few outliers read at a glance and overlapping
    points read darker'
  - 'Theme tokens threaded through every chrome element (page background, title ink,
    tick inkSoft, grid stroke, axis lines): both renders are fully legible, data color
    identical across themes'
  - Axis bands sized explicitly (x height 72, y width 76) per the v9 truncation gotcha,
    so no tick label or axis title is clipped
  - Native valueFormatter supplies a descriptive hover tooltip in the HTML output,
    and skipAnimation plus hideLegend follow the v9 API
  - Seeded LCG + Box-Muller generator makes the data deterministic, with descriptive
    unit-bearing axis titles held in column constants
  weaknesses:
  - 'DQ-02 (both): the y variable ''Innovation score (0–100)'' is a vague invented
    index with no recognisable measurement behind it, so the scenario reads as plausible
    but generic → a concretely measured outcome (e.g. exam score in % against study
    hours, or monthly sales revenue against marketing spend). Likely cause: the SCORE
    column name and the data-block comment.'
  - 'Suggestion: the generated correlation is about r≈0.8 (slope 1.45/h over a 36
    h range against noise σ=11); raising the noise to about σ=14 would land nearer
    the spec''s r~0.7 example.'
  - 'Suggestion: a slightly sparser vertical grid (e.g. tickNumber 6 on x) would quiet
    the chart without losing value estimation.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole canvas, including the HTML title band.
      Chrome: bold dark title "scatter-basic · javascript · muix · anyplot.ai" centered at top (~28% of width); y-axis title "Innovation score (0–100)" rotated on the left, x-axis title "Weekly hours on creative projects (h)" at the bottom; tick labels 20–100 and 5–35 in soft dark ink; subtle light-grey horizontal and vertical grid; left and bottom axis lines only. All text readable, nothing clipped.
      Data: ~120 circular markers in #009E73 at 0.7 opacity forming a clear positive cloud from (~3 h, ~15–55) to (~38 h, ~75–98) with visible noise and a few outliers (e.g. ~21 h / 81, ~5 h / 56). Overlapping pairs read slightly darker.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17 throughout.
      Chrome: title and axis titles in light ink, tick labels in light soft ink, grid lines subtle grey, axis lines light. No dark-on-dark text anywhere.
      Data: identical #009E73 markers at identical positions and opacity; only chrome flipped. Brand green clearly visible.
      Legibility verdict: PASS
