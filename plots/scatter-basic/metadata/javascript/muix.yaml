review:
  strengths:
  - 'One series of 120 points at their exact (x, y) values in brand green #009E73
    with fillOpacity 0.7, so the few overlapping pairs read darker; no jitter or nudge'
  - Chrome threaded fully through ANYPLOT_TOKENS (title in ink, axis titles in ink,
    ticks and axis lines in inkSoft, grid in the grid token), so both themes read
    cleanly
  - Axis domains come from the data with a 5 % pad instead of typed numbers, and the
    readable axis titles carry units (h, %)
  - Native ScatterChart props (grid, hideLegend, skipAnimation, tickNumber, per-axis
    height/width bands) and a per-series valueFormatter that gives the HTML tooltip
    both labelled values
  weaknesses:
  - 'DQ-01 (code): the sample correlation is r = 0.84, a strong rather than the moderate
    r~0.7 the spec''s Data example asks for → about r = 0.70 (−0.14). Likely cause:
    noise SD of 11 against a slope of 58/40 over 2–38 h in `randn() * 11`; raise the
    noise to about 16 or flatten the slope.'
  - 'Suggestion: a slightly heavier title weight or size would give the header more
    presence against the full-width plot area.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole canvas.
      Chrome: centered bold title "scatter-basic · javascript · muix · anyplot.ai" in dark ink; y-axis title "Final exam score (%)" rotated on the left, x-axis title "Weekly study hours (h)" below; ticks 20–100 and 5–35 in soft ink; light gray horizontal and vertical grid; left and bottom axis lines only. All text readable.
      Data: 120 circular markers in #009E73 at ~0.7 opacity forming a positive cloud from low-left to upper-right, with visible spread and a few outliers (e.g. ~5 h / 56 %, ~37 h / 98 %); a few overlapping pairs read darker.
