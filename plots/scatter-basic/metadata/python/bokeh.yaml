review:
  strengths:
  - 'Correct basic variant: one point per observation at its exact (x, y) value, all
    in brand green #009E73, with no trend line, band or annotation layer'
  - Moderate transparency (alpha=0.7) with a thin page-colored ring per marker keeps
    overlapping points distinguishable while dense areas read darker
  - 'Fully theme-adaptive chrome: #FAF8F1 / #1A1A17 backgrounds, INK title and axis
    titles, INK_SOFT ticks and axis lines, subtle grid at alpha 0.10, identical data
    color across both renders'
  - Canvas contract met exactly (3200x1800 with toolbar_location=None, min_border_*
    reservations and the CDP viewport override); text sized per the library prompt
    and readable in both themes
  - Data-derived Range1d padding and ColumnDataSource(df) with column constants keep
    the plot adaptable to other data
  - HoverTool with formatted, braced column-name tooltips adds value inspection in
    the HTML output without affecting the PNG
  weaknesses:
  - 'SC-04 (both): the title reads ''scatter-basic · bokeh · anyplot.ai'' and omits
    the language segment → ''scatter-basic · python · bokeh · anyplot.ai''. Likely
    cause: the title string in figure(title=...) and output_file(title=...).'
  - 'Suggestion: the generated cloud has r ≈ 0.94 (slope 7.2 against noise sd 6.5);
    a noise sd near 15 would match the spec''s example of a moderate correlation (r
    ~ 0.7) and show more spread.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 (sampled 250,248,241), not pure white
      Chrome: bold centered title "scatter-basic · bokeh · anyplot.ai" in near-black ink; axis titles "Study Hours per Day" (x) and "Exam Score (%)" (y) in dark ink; tick labels 2–10 and 20–100 in soft dark gray; L-shaped axis lines only, no plot outline; very subtle grid. All text clearly readable.
      Data: about 180 circular markers in #009E73 at alpha 0.7 with thin page-colored rings, a clear rising cloud from (~1 h, ~20–45 %) to (~9.5 h, ~99 %), moderate spread and a few mild outliers (e.g. ~4.4 h / 76 %, ~7.5 h / 63 %); no trend line, band or labels. Canvas 3200x1800.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17, not pure black
      Chrome: title and axis titles flip to near-white, tick labels to light gray, axis lines light gray, grid subtle but visible; no dark-on-dark text anywhere.
      Data: identical #009E73 markers at the same positions and alpha as the light render, rings now in the dark page color; green reads well on the dark surface.
      Legibility verdict: PASS
