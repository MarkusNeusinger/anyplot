review:
  strengths:
  - 'Kagi construction is genuinely correct: a proper extreme-tracking zigzag with
    a percentage reversal threshold, distinct from a naive time-series line — pivots
    only fire when price moves the required % against the running extreme.'
  - Thick/thin (yang/yin) encoding is implemented via Chart.js's per-segment `segment.borderColor`
    / `segment.borderWidth` callbacks — a genuinely distinctive Chart.js feature,
    and the thickness rule correctly keys off breaking the *prior same-type* pivot
    (shoulder/waist), not just direction.
  - Explicit horizontal 'shoulder/waist' points are inserted between vertical columns,
    so the chart reads as a real Kagi step chart rather than a diagonal zigzag.
  - Green/red for yang/yin is a well-justified semantic-exception use of the Imprint
    palette (finance up/down convention), and it's backed by a redundant thickness
    encoding — not color-alone.
  - Custom legend swatches correctly preview both the color AND line-width distinction
    (7px vs 2.5px), reinforcing the thick/thin semantics beyond just color.
  - X-axis is a plain line index ('Kagi Line Index'), matching the spec's explicit
    note that Kagi charts are time-independent on the x-axis.
  - 'Deterministic LCG-seeded data generation, no imports beyond the Chart.js global,
    clean mount-node handling, `animation: false` set correctly.'
  weaknesses:
  - Design excellence is functional but not highly polished — grid, spacing, and legend
    are close to library defaults beyond the color/thickness encoding; a bit more
    refinement (e.g. subtler y-axis grid opacity, tighter legend spacing) would lift
    Visual Refinement.
  - No visual callout of the reversal threshold (4%) anywhere on the chart (e.g. a
    small subtitle or annotation) — not required by the spec, but would strengthen
    Data Storytelling by making the filtering mechanism legible to a first-time reader.
  - The very first column's thickness defaults to `thick = true` with no prior pivot
    to compare against (edge case in the yang/yin loop) — visually harmless here since
    the first move happens to be up, but worth a comment or explicit initialization
    so the intent is clear to future maintainers.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1-consistent), not pure white, not dark.
      Chrome: Title "kagi-basic · javascript · chartjs · anyplot.ai" in bold dark ink, centered top. Legend below title with two swatches: thick green line "Yang (uptrend)" and thin red line "Yin (downtrend)". X-axis title "Kagi Line Index" and Y-axis title "Price ($)" in dark ink; tick labels in a softer gray. Subtle horizontal gridlines on the y-axis only, no x-axis grid, no visible frame/spines beyond the axis lines.
      Data: A zigzag Kagi step chart with ~21 columns alternating thick green (yang) and thin red (yin) vertical/horizontal segments, ranging roughly from $100 to $140. First series color is the brand green #009E73 (semantic exception for "up"), second is matte red #AE3030 (semantic exception for "down") — both explicitly justified by the finance up/down convention and reinforced with a redundant line-width encoding.
      Legibility verdict: PASS — all text (title, legend, axis titles, tick labels) is clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, not pure black, not light — consistent with the dark theme token.
      Chrome: Same title and legend, now rendered in light/off-white ink against the dark background. Axis titles in light ink, tick labels in a softer light gray. Gridlines are faint and adapted to the dark surface, remaining subtle but visible.
      Data: Identical zigzag Kagi structure and identical data colors to the light render — same brand green and matte red hues, confirming only chrome (background, text, grid) flipped between themes and data colors stayed constant.
      Legibility verdict: PASS — no dark-on-dark failures; title, axis titles, and tick labels are all clearly legible against the near-black background.
