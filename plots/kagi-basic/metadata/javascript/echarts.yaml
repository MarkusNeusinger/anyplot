review:
  strengths:
  - 'Faithful Kagi construction: the reversal-threshold swing filter correctly absorbs
    sub-threshold moves and only opens a new column once price crosses the 4% reversal
    band, producing realistic shoulder/waist direction changes.'
  - 'Genuine ECharts library mastery: uses a `type: ''custom''` series with `renderItem`/`api.coord()`
    to draw variable-width vertical and horizontal segments — the library-recommended
    pattern for a chart type ECharts has no native series for, paired with dummy line
    series purely to drive the legend.'
  - 'Perfect Imprint palette + theme compliance in both renders: first series is brand
    green `#009E73`, downtrend correctly uses the semantic red anchor per the finance
    loss/down convention, and chrome (background, text, grid) is theme-correct on
    both `plot-light.png` and `plot-dark.png`.'
  - 'Dual encoding (color + line thickness: 7px yang vs 2.5px yin) makes uptrend/downtrend
    strength readable at a glance and is also CVD-safe since it doesn''t rely on hue
    alone.'
  - Clean, deterministic data generation via a fixed-seed LCG, no network calls, no
    fake interactivity.
  - Title format and axis labels are exactly correct (`kagi-basic · javascript · echarts
    · anyplot.ai`, `Price ($)` with unit); legend labels match the yang/yin semantics.
  weaknesses:
  - 'Design Excellence sits at well-configured-default tier (DE-01 4/8, DE-02 4/6):
    palette and typography are compliant but not yet distinctively polished. Consider
    a small deliberate flourish — e.g. subtler/rounder line caps, a touch more contrast
    between title and legend weight, or a callout marking the largest reversal — to
    push past ''correct'' into ''publication-ready''.'
  - 'CQ-01: the `makeRng` LCG factory plus the reversal-tracking loop add more structure
    than a strict linear imports→data→plot→save script. This is largely justified
    by the Kagi construction algorithm itself, but look for opportunities to flatten/simplify
    without hurting readability.'
  - 'Minor: Y-axis price ticks and the ''Kagi Line Index'' x-axis both read fine at
    desktop size, but tick label size at the ~400px mobile thumbnail is on the smaller
    side — verify legibility there before further size reductions elsewhere.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Title "kagi-basic · javascript · echarts · anyplot.ai" is dark, centered, fully visible with no clipping. Legend ("Yang (Uptrend)" green swatch, "Yin (Downtrend)" red swatch) sits directly below the title. Y-axis title "Price ($)" and x-axis title "Kagi Line Index" are dark/soft-ink and clearly legible. Tick labels ($123-$200, -0.5-17.5) are legible. Horizontal gridlines are subtle; x-axis has no gridlines (appropriate for this chart type).
      Data: First series (Yang/uptrend) renders in brand green #009E73 as thick (7px) vertical/horizontal segments; Yin/downtrend renders in the semantic matte-red anchor as thin (2.5px) segments. 18 Kagi columns with realistic shoulder/waist reversals are visible, values ranging ~$126 to ~$196.
      Legibility verdict: PASS — all text readable against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Title, legend, and both axis titles/tick labels render in light ink (off-white/soft-gray), fully legible against the dark background. No dark-on-dark text observed anywhere (title, ticks, axis names, legend all correctly flipped to light tokens). Gridlines are subtle and theme-adaptive.
      Data: Same green (#009E73) and matte-red hues as the light render, confirming the data-color/chrome separation rule — colors identical between renders, only chrome flipped.
      Legibility verdict: PASS — all text readable against the dark background, no dark-on-dark failures.
