review:
  strengths:
  - 'Technically correct Kagi construction: vertices collapse only on genuine 4% reversal
    breaches, and the thick/thin (yang/yin) state flips only when a column breaks
    the prior same-direction extreme, not on every alternation — the authentic Kagi
    mechanic.'
  - 'Correct semantic-exception palette use: yang (breakout/gain) is brand green #009E73
    and yin (breakdown/loss) is matte red #AE3030 (palette[4]), matching the Imprint
    style guide''s own finance up/down example, with unambiguous legend labels.'
  - Line thickness (6px vs 2px) is a redundant non-color encoding on top of hue, so
    the chart doesn't rely on red-green discrimination alone (VQ-04).
  - 'Both renders are fully theme-correct: identical data colors, warm off-white /
    near-black backgrounds, all chrome (title, subtitle, axis, grid, legend, tooltip)
    sourced from window.ANYPLOT_TOKENS, no clipping or overlap.'
  - Deterministic, seeded LCG random walk for synthetic Brent crude closes; realistic
    USD/bbl range ($38-$86) with no external fetch/network dependency.
  - 'Clean idiomatic Highcharts core-bundle usage: transparent chart background, animation
    disabled on chart and series, credits disabled, no add-on modules, and a legend-proxy
    pattern (two zero-data series) to label the many per-segment line series.'
  weaknesses:
  - 'BUG — the standout-move callout (xAxis.plotBands with a tinted color band + ''Standout
    breakout/breakdown'' label, defined around line 131-146) does not render at all
    in either PNG: pixel-sampling both plot-light.png and plot-dark.png across the
    full canvas width shows zero color deviation from the plain background anywhere
    between the x=15 and x=16 gridlines, and no label text appears near the top of
    the plot area. The standout/standoutUp/standoutLabel computation runs but has
    no visible effect — this was the exact fix attempted for last attempt''s DE-03
    weakness (''no visual callout on the standout move''), and it still doesn''t land,
    so Data Storytelling is unchanged from the prior attempt despite the added code.
    Investigate why Highcharts.color(...).setOpacity(0.14).get() combined with the
    xAxis.plotBands array isn''t producing a visible band+label in the browser harness
    (try a plain rgba() string for color instead of the Color-module helper, and verify
    the label options render standalone); if it can''t be made to work, remove the
    dead code rather than shipping a non-functional feature.'
  - 'Design Excellence remains at ''well-configured default'' level: the semantic
    green/red is spec-mandated rather than an added creative flourish, and (per the
    bug above) there is still no functioning visual emphasis on the standout move.'
  - 'Library Mastery (LM-02) is only moderately distinctive: the per-segment series
    + tooltip formatter + dummy-legend-series pattern is a solid Highcharts-idiomatic
    workaround, but the one genuinely distinctive addition attempted this round (plotBands
    annotation) doesn''t actually render, so it can''t be credited.'
  - The x-axis 'Kagi Line Index' gives no sense of how many raw daily observations
    (260) were collapsed into the 16 shown lines, or what time span they cover — optional
    polish, not a spec violation.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 - not pure white, not dark.
      Chrome: Bold dark title "kagi-basic · javascript · highcharts · anyplot.ai" at top center, gray subtitle "Brent crude oil, synthetic daily close · 4% reversal threshold" beneath it. Y-axis title "Brent Crude Oil Price (USD/bbl)" and x-axis title "Kagi Line Index" in medium-gray, tick labels in the same soft gray on both axes. Subtle horizontal gridlines only (no vertical grid). Legend centered below the x-axis title with two swatches: a thick green line "Yang (breaks prior high)" and a thin red line "Yin (breaks prior low)". All text is clearly legible against the light background - no light-on-light issues found. Pixel-sampled the full canvas width at several y positions looking for the code's intended standout-move shaded plotBand + "Standout breakout/breakdown" label between the x=15 and x=16 gridlines (near the final steep green rise to ~$86): found no color deviation from the plain background and no label text anywhere - the plotBand/label do not render in this PNG.
      Data: A stepped Kagi line running left to right across 16 line segments (index 0-16), price ranging roughly $38-$86. Segments alternate between a thick green line (#009E73) and a thin red line (matte red #AE3030), with horizontal shoulder/waist ledges at each turning point exactly as a Kagi chart should render. Thickness state persists across some direction reversals and only flips when a column breaks its prior same-direction extreme, matching authentic Kagi semantics.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 - not pure black, not light.
      Chrome: Same title/subtitle now rendered in white/light-gray, axis titles and tick labels in light gray, legend swatches and labels in light gray with the same green/red data lines. Gridlines are faint light-gray horizontal lines, subtle but visible against the dark background.
      Data: Identical green (#009E73) and red (#AE3030) segment colors and identical stepped Kagi geometry to the light render - only the chrome (background, text, grid, legend) flipped, confirming palette consistency across themes. No dark-on-dark text found; all title/axis/tick/legend text is clearly legible. Same pixel check as the light render around x=15-16 confirms the standout plotBand + label are equally absent here.
      Legibility verdict: PASS
