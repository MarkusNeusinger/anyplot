review:
  strengths:
  - 'Technically correct Kagi construction: vertices are collapsed only on genuine
    4% reversal breaches, and the thick/thin (yang/yin) state flips only when a column
    breaks the prior same-direction extreme, not on every alternation — this is the
    authentic Kagi mechanic, not a simplified stand-in.'
  - 'Correct semantic-exception palette use: yang (breakout/gain) is brand green #009E73
    and yin (breakdown/loss) is matte red #AE3030 (palette[4]) — matches the Imprint
    style guide''s own explicit finance example (profit/up→green, loss/down→red),
    with the legend labels literally saying ''breaks prior high/low'' so the mapping
    is unambiguous.'
  - Thickness (6px vs 2px) is a redundant non-color encoding on top of hue, so the
    chart doesn't rely on red-green discrimination alone (VQ-04).
  - 'Both renders are fully theme-correct: identical data colors, warm off-white /
    near-black backgrounds, all chrome (title, subtitle, axis, grid, legend, tooltip)
    sourced from window.ANYPLOT_TOKENS.'
  - Deterministic, seeded LCG random walk for synthetic Brent crude closes; realistic
    USD/bbl range with no external fetch/network dependency.
  - 'Clean idiomatic Highcharts core-bundle usage: transparent chart background, animation
    disabled on chart and series, credits disabled, no add-on modules, and a sensible
    legend-proxy pattern (two zero-data series) to label the many per-segment line
    series without cluttering the legend.'
  weaknesses:
  - 'Design Excellence is at ''well-configured default'' level (DE-01/DE-02/DE-03
    = 4/6): the semantic green/red is spec-mandated rather than an added creative
    flourish, and there''s no visual callout on the standout move (e.g. the final
    vertical breakout to ~$86) that would push it toward genuine data storytelling.'
  - 'Library Mastery (LM-02) is only moderately distinctive: the per-segment series
    + tooltip formatter + dummy-legend-series pattern is a solid Highcharts-idiomatic
    workaround, but it''s conceptually replicable in other charting libraries with
    similar syntax — no use of a feature that''s uniquely Highcharts (e.g. plotLines/plotBands
    to mark the reversal threshold visually).'
  - The x-axis 'Kagi Line Index' gives no sense of how many raw daily observations
    (260) were collapsed into the 16 shown lines, or what time span they cover — a
    small footnote or tooltip enhancement referencing the underlying date range would
    orient the reader better, though this is optional polish, not a spec violation
    (the spec explicitly endorses an index x-axis over a time axis for Kagi charts).
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Bold dark title "kagi-basic · javascript · highcharts · anyplot.ai" at top center, gray subtitle "Brent crude oil, synthetic daily close · 4% reversal threshold" beneath it. Y-axis title "Brent Crude Oil Price (USD/bbl)" and x-axis title "Kagi Line Index" in medium-gray, tick labels in the same soft gray on both axes. Subtle horizontal gridlines only (no vertical grid). Legend centered below the x-axis title with two swatches: a thick green line "Yang (breaks prior high)" and a thin red line "Yin (breaks prior low)". All text is clearly legible against the light background — no light-on-light issues found.
      Data: A stepped Kagi line running left to right across 16 line segments (index 0-16), price ranging roughly $38-$86. Segments alternate between a thick green line (#009E73-like) and a thin red line (matte red), with horizontal "shoulder/waist" ledges at each turning point exactly as a Kagi chart should render. Thickness state persists across some direction reversals and only flips when a column breaks its prior same-direction extreme, matching authentic Kagi semantics.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Same title/subtitle now rendered in white/light-gray, axis titles and tick labels in light gray, legend swatches and labels in light gray with the same green/red data lines. Gridlines are faint light-gray horizontal lines, subtle but visible against the dark background.
      Data: Identical green (#009E73) and red (#AE3030) segment colors and identical stepped Kagi geometry to the light render — only the chrome (background, text, grid, legend) flipped, confirming palette consistency across themes. No dark-on-dark text found; all title/axis/tick/legend text is clearly legible.
      Legibility verdict: PASS
