review:
  strengths:
  - 'Faithful Kagi construction: reversal-threshold pivot detection correctly produces
    alternating yang/yin segments, with thick green up-lines and thin red down-lines
    matching the spec''s core visual encoding'
  - 'Explicit theme-adaptive chrome: title, axis labels, ticks, and legend all read
    cleanly on both the warm off-white and warm near-black surfaces, with no dark-on-dark
    or light-on-light failures'
  - Correct Imprint palette usage with a documented semantic exception (profit/up
    -> green, loss/down -> red) that matches the style guide's finance carve-out
  - Clean L-shaped spines, no competing grid lines, and generous margins let the zigzag
    pattern breathe without clutter
  - Deterministic seeded PRNG (mulberry32) driving a plausible regime-drift price
    series, keeping the example fully reproducible
  weaknesses:
  - Design Excellence reads as a well-configured default rather than a distinctive
    treatment - consider a refined legend chip, a subtle end-of-line price callout,
    or other polish to lift it above a generic step-line look
  - The lines are drawn as raw SVG <line> elements via manual vertical/horizontal
    arrays rather than D3's shape-generation idioms (e.g. d3.line() with a step curve)
    - leans on low-level D3 rather than showcasing library-distinctive patterns
  - Only ~13 Kagi segments are visible; a slightly larger numDays or tuned REVERSAL_PCT
    would surface more reversals and better demonstrate the trend-identification narrative
    called out in the spec's Applications section
  - Data storytelling relies solely on color+thickness; a direct label on the final
    closing price or the largest reversal would sharpen the focal point without adding
    fake interactivity
  image_description: |-
