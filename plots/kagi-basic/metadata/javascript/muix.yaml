review:
  strengths:
  - Correctly applies the finance semantic-color exception (green for yang/uptrend,
    matte red for yin/downtrend) exactly as the spec's Notes section requests, using
    Imprint palette positions 1 and 5 rather than custom hexes.
  - Line-width encoding (6px yang vs 2px yin) faithfully reproduces the real Kagi-chart
    convention of thick/thin lines and gives a redundant, colorblind-safe cue on top
    of the green/red hue difference.
  - X-axis uses the Kagi line index (not time) exactly as the spec's Notes section
    calls out, with a valueFormatter that keeps ticks as clean integers.
  - 'Both themes are fully compliant: identical data colors between light and dark
    renders, chrome (background, grid, axis, legend) flips correctly with no dark-on-dark
    or light-on-light failures.'
  - Data generation is a deterministic, seeded log-return random walk (LCG seed 42)
    turned into a well-formed Kagi turning-point series via a correct reversal-threshold
    algorithm, producing a realistic mid-cap stock price path.
  - Title format and legend labels are exactly per spec (`kagi-basic · javascript
    · muix · anyplot.ai`; "Yang (uptrend)" / "Yin (downtrend)"), and axis labels carry
    units ("Closing Price ($)").
  weaknesses:
  - 'Data Storytelling (DE-03): the biggest move in the series — the breakout from
    ~$217 to ~$277 at line index 14-15 — isn''t emphasized with any annotation or
    callout, so the viewer has to spot it unaided; a small label on that segment would
    sharpen the focal point.'
  - 'Visual Refinement (DE-02): the horizontal grid and MuiChartsAxis tick marks are
    still visible library defaults rather than fully minimized chrome — consider dropping
    the small tick marks (keep tick labels only) for a cleaner L-shaped frame.'
  - 'Feature Coverage (DQ-01): the series is dominated by short alternating corrections
    and one large late rally; there''s no example of a sustained multi-segment downtrend
    (several consecutive yin lines), which would better showcase the chart''s bearish-trend-detection
    value.'
  - 'Aesthetic Sophistication (DE-01): solid and intentional, but still reads as ''well-configured
    MUI X defaults'' rather than a fully bespoke composition — e.g., no subtle background
    shading or reference line to mark the starting price for context.'
  - 'Code Quality (CQ-01): three helper functions (lcg, randomNormal, buildKagiTurningPoints)
    sit between the data and the component; understandable given the reversal-threshold
    algorithm''s complexity, but keep an eye on it not growing further.'
  - 'Library Mastery (LM-02): the per-series strokeWidth override via sx targeting
    `.MuiLineElement-series-*` class names is a clever but somewhat low-level workaround;
    a more distinctive MUI X feature (e.g. ChartsReferenceLine for the starting price,
    or a custom tooltip) would raise this further.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "kagi-basic · javascript · muix · anyplot.ai" in bold dark ink at top-left, clearly readable. X-axis label "Kagi Line Index" and Y-axis label "Closing Price ($)" in dark ink, both legible with matching font size. Tick labels ($180-$280, 0-16) are dark and crisp against the light background. Horizontal grid lines are thin and subtle, visible but not competing with the data. Legend ("Yang (uptrend)" green, "Yin (downtrend)" red) sits centered below the plot, readable, close to the chart.
      Data: First/primary series (Yang) renders in Imprint brand green #009E73 as a thick (6px) step line; the second series (Yin) renders in Imprint matte red #AE3030 as a thin (2px) step line. The rectilinear Kagi path with horizontal shoulders/waists and vertical price swings is clearly visible, ending in a large green breakout segment near line index 14-15.
      Legibility verdict: PASS — all text is clearly readable against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title, axis labels, and tick labels now render in light ink (off-white), clearly legible against the dark background. Grid lines are thin and subtle in a light tone. Legend text and swatches are legible in the same bottom-center position.
      Data: Yang segments are the identical brand green (#009E73) and Yin segments the identical matte red (#AE3030) as in the light render — confirmed pixel-for-pixel color match; only the chrome (background, text, grid) flipped to the dark theme.
      Legibility verdict: PASS — no dark-on-dark failures; every title/axis/tick/legend element is clearly visible against the near-black surface.
