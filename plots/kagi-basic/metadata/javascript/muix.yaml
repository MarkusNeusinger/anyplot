review:
  strengths:
  - 'Correct Kagi construction: turning points follow a 4 % reversal against the running
    extreme, and a vertical that breaks past the previous shoulder or waist is split
    at exactly that level, so the line turns thin at the fall below the 203.5 waist
    in column 6 and thick again at the rise above the 200.7 shoulder in column 11'
  - 'Thickness and color agree everywhere: yang is drawn 6 px in brand green #009E73,
    yin 2 px in the Imprint red anchor #AE3030, identical in both themes, with the
    thickness carrying the state on its own for CVD readers'
  - 'Idiomatic MUI X: two LineChart series with null gaps that share the transition
    vertex, so the thick and the thin line join without a seam; v9 per-series selectors
    ([data-series] on .MuiLineChart-line) set the weights, and the legend line marks
    get the same 6 px / 2 px weights so the legend is a true key'
  - The x axis is a construction index (one column per reversal, ticks 1–16) and the
    subtitle states the 240 closes, the date range and the 4 % reversal amount, which
    makes the time-independence of the chart explicit
  - 'Clean adaptable-code layout: role constants, a seeded LCG data block that ends
    in const data, and plot code that reads only data and the constants; skipAnimation
    set and the chart sized from window.ANYPLOT_SIZE'
  weaknesses:
  - 'Suggestion: the 2 px yin line fades in the 400 px thumbnail; about 2.5 px would
    keep it visible while staying clearly thinner than the 6 px yang line.'
  - 'Suggestion: the 84 px header leaves a band of about 50 px between the subtitle
    and the top of the plot area; a slightly shorter header would tighten the vertical
    rhythm.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the full 3200x1800 canvas.
      Chrome: bold dark title "kagi-basic · javascript · muix · anyplot.ai" centered at the top, a soft-ink subtitle "240 closes, Jan 2, 2024 – Dec 2, 2024 · reversal amount 4 % · 16 vertical lines"; y axis "Close (USD)" with ticks 180–280 every 10, x axis "Kagi line (one column per reversal)" with ticks 1–16; subtle horizontal grid lines; left and bottom axis lines only. All text dark and readable.
      Data: one continuous Kagi line. Columns 1–6 thick brand green #009E73 (start at 180, shoulders about 213, 216, 215, waists about 202, 203.5); at column 6 the fall turns thin red #AE3030 below the 203.5 waist and stays yin through columns 7–11 (shoulders about 209, 201, waists about 199, 189, 192); at column 11 the rise turns thick green above the 200.7 shoulder and climbs to 232, 240 and 277, with the last open segment falling to about 259. Horizontal shoulders and waists join each column to the next. Bottom legend: thick green line mark "Yang: thick, rising above the previous shoulder", thin red line mark "Yin: thin, falling below the previous waist".
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, subtitle, axis titles, tick labels and legend text flip to light ink and are all readable; grid lines are subtle but visible; no dark-on-dark text.
      Data: identical to the light render — same #009E73 green for yang at 6 px, same #AE3030 red for yin at 2 px, same geometry; both colors read well on the dark surface.
      Legibility verdict: PASS
