review:
  strengths:
  - 'Every actionable weakness from the previous review was addressed: the "+$59 move"
    breakout callout and "Start $180" baseline (ChartsReferenceLine) now give the
    chart clear data storytelling and a bespoke reference-line composition, and tickSize:
    0 removes the default tick marks for a cleaner L-shaped frame.'
  - Correctly applies the finance semantic-color exception (green for yang/uptrend,
    matte red for yin/downtrend) exactly as the spec's Notes section requests, using
    Imprint palette positions 1 and 5.
  - Line-width encoding (6px yang vs 2px yin) faithfully reproduces the real Kagi-chart
    convention and gives a redundant, colorblind-safe cue alongside the hue difference.
  - 'Both themes are fully compliant: identical data colors between light/dark renders,
    chrome flips correctly, no dark-on-dark or light-on-light failures.'
  - Data generation (seeded log-return random walk into a reversal-threshold Kagi
    construction) now naturally produces both a sustained multi-segment downtrend
    and a large breakout, covering the chart type's full storytelling range.
  weaknesses:
  - 'The tickFontSize: 40 value on the Y-axis is a layout-spacing workaround (exploiting
    the labelRefPoint.x formula) rather than a documented API — works correctly here,
    but is fragile if MUI X changes that internal formula in a future version.'
  - Four small helper functions now sit ahead of the component (lcg, randomNormal,
    buildKagiTurningPoints, classifyKagiThickness); each is justified by the Kagi
    algorithm's complexity, but keep an eye on further growth.
  - Aesthetic composition is intentional and above default, but stops short of a fully
    bespoke/publication-level design (e.g. no background shading, gradient, or additional
    micro-typography touches).
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "kagi-basic · javascript · muix · anyplot.ai" bold dark ink at top-left, clearly readable. X-axis label "Kagi Line Index" and Y-axis label "Closing Price ($)" in dark ink, balanced sizes. Tick labels ($180-$280, 0-16) are dark, crisp, with tick marks removed (tickSize: 0) for a clean L-shaped frame. Horizontal grid lines are thin and subtle. A dashed horizontal reference line labeled "Start $180" marks the origin price; a dashed vertical reference line labeled "+$59 move" calls out the largest breakout near line index 15. Legend ("Yang (uptrend)" green, "Yin (downtrend)" red) sits centered below the plot, close to the chart.
      Data: Yang (uptrend) renders in Imprint brand green #009E73 as a thick (6px) step line; Yin (downtrend) renders in Imprint matte red #AE3030 as a thin (2px) step line. The rectilinear Kagi path shows a run of ~5 consecutive thin red segments (a sustained corrective/downtrend phase) followed by a large green breakout to ~$277, explicitly labeled by the reference-line annotation.
      Legibility verdict: PASS — all text is clearly readable against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title, axis labels, tick labels, and both reference-line annotations now render in light ink, clearly legible against the dark background. Grid lines are thin and subtle in a light tone. Legend text and swatches are legible in the same bottom-center position.
      Data: Yang segments are the identical brand green (#009E73) and Yin segments the identical matte red (#AE3030) as in the light render — confirmed pixel-for-pixel color match; only the chrome (background, text, grid) flipped to the dark theme.
      Legibility verdict: PASS — no dark-on-dark failures; every title/axis/tick/legend/annotation element is clearly visible against the near-black surface.
