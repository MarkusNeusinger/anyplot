review:
  strengths:
  - 'Correct Kagi construction: a 4 % reversal against the running extreme; verticals
    split at the previous shoulder or waist, so thickness changes exactly where the
    rule says (columns 1, 5, 9 thicken; 2, 8, 20 thin out).'
  - Color and thickness agree at every point; thickness alone also separates the states,
    so the red/green pair is not the only signal.
  - Mapping both color and size to the trend with the same scale name and labels gives
    plotnine one merged legend whose samples match the marks.
  - Categorical order draws yang last, so the thick line's round caps cover the thin
    line's joints.
  - Theme tokens threaded through every chrome element; both renders are correct.
  weaknesses:
  - 'Suggestion: a slightly heavier yin line (about 0.7) would read more firmly in
    the 400 px thumbnail on the dark page while keeping the weight contrast.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, 3200x1800 landscape.
      Chrome: title "kagi-basic · python · plotnine · anyplot.ai" and axis titles "Kagi Line Index" / "Price ($)" in dark ink, tick labels in soft ink, subtle horizontal grid only, left and bottom axis lines, framed "Trend" legend on an elevated background at the right. All readable.
      Data: one unbroken Kagi line over 22 columns ($80-$118); thick #009E73 yang and thin #AE3030 yin with horizontal shoulders and waists; thickness switches inside the verticals at the previous shoulder/waist (columns 1, 5, 9 thicken; 2, 8, 20 thin out); the last column is open and thin.
