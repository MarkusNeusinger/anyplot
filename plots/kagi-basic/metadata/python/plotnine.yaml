review:
  strengths:
  - 'Correct Kagi construction: the line steps one even column right only at a 4 %
    reversal of the running extreme, giving 22 columns from 250 daily closes, with
    shoulders and waists as short horizontal segments joining one unbroken line'
  - Thickness changes exactly where the line crosses the previous shoulder (thin to
    thick) or waist (thick to thin), splitting a vertical segment at that level (e.g.
    columns 2, 5, 8, 9, 20); color agrees with thickness at every point
  - Yang (#009E73, 1.5) and yin (#AE3030, 0.5) are clearly different in weight in
    both themes, so the state reads without color as well
  - Color and size scales share one name and labels, so plotnine merges them into
    one legend whose line samples show both weight and color
  - Grid kept to y-major only and x grid removed, which suits an x-axis that is a
    construction index rather than a quantity; tick marks removed, theme tokens threaded
    through all chrome
  weaknesses:
  - 'VQ-05 (both): the legend''s text sits about 2–3 px from its frame ("Trend" touches
    the left edge, "Yang (bullish)" nearly reaches the right edge), so the box looks
    cramped → at least about 6 px of inner padding (+4 px). Likely cause: no legend_box_margin/legend_margin
    set while legend_background draws a framed box.'
  - 'Suggestion: the first column''s thin vertical segment (101.0 → 100.8) is almost
    invisible; a seed or start where the first move is larger would show the opening
    line more clearly.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across canvas and panel.
      Chrome: title "kagi-basic · python · plotnine · anyplot.ai" centered at top (~43 % width), axis titles "Kagi Line Index" and "Price ($)" in dark INK, tick labels 0–20 and 80–110 in INK_SOFT, subtle y-only grid, left and bottom axis lines only; framed legend "Trend" on the right on #FFFDF6 with "Yang (bullish)" and "Yin (bearish)". All text readable.
      Data: one Kagi line of 22 columns; thick green #009E73 yang segments and thin red #AE3030 yin segments, joined by horizontal shoulders/waists; thickness and color switch at previous shoulder/waist levels (columns 1, 2, 5, 8, 9, 20). Price range ~80–118 with a rising trend after column 9.
      Legibility verdict: PASS

