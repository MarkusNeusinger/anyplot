    Likely cause: last_high/last_low track the running all-time extreme (updated only
    by price > last_high) instead of the last shoulder/waist, and kagi_yang[-1] flips
    the whole segment rather than inserting a breakpoint at the crossing price.'
  - 'Suggestion: a slightly heavier yang weight (about 4) would widen the thick/thin
    contrast further.'
