  weaknesses:
  - 'SC-02, SC-03 (both): the line keeps the yin state from column 1 to 10 although
    it rises above the previous shoulder at column 8 (98.6 > 92.8), and stays thick
    on the final drop below the previous waist at column 13 (100.8 < 102.1) → switch
    to yang where the price rises above the most recent shoulder and to yin where
