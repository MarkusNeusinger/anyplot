review:
  strengths:
  - 'Thick yang / thin yin segments in Imprint green #009E73 and red #AE3030, weight
    and color agreeing everywhere'
  - 'Correct theme-adaptive chrome: readable title, axis titles and ticks on both
    #FAF8F1 and #1A1A17'
  - Construction x-axis labelled 'Line index' with one even column per reversal
  - 'Adaptable layout: column constants and a marked Data block, CLOSE reused as the
    y-axis title'
  weaknesses:
  - 'SC-02 (both): thickness flips at every reversal instead of where the line crosses
    the previous shoulder or waist (C2): the rise at line index 2 (82 → 87) is drawn
    thick although it stays far below the 110 shoulder, and the fall at index 1 is
    thin from its top although it only drops below a previous waist near 82 → keep
    the current weight until the price passes the previous shoulder (turn thick) or
    waist (turn thin), splitting the vertical segment at that level. Likely cause:
    line_type is set from the reversal direction in the loop, not from a shoulder/waist
    comparison.'
  - 'DE-02 (both): the panel is enclosed by a four-sided frame, so the top and right
    spines the style guide removes by default are drawn → an L-shaped frame (left
    and bottom only) or none. Likely cause: the panel border drawn by the theme; set
    panel_border=element_blank() and keep axis_line.'
  - 'Suggestion: richer tooltips in the HTML export (price range per segment) would
    use lets-plot''s layer_tooltips.'
