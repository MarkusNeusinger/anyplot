review:
  strengths:
  - 'Idiomatic Altair construction: one mark_rule layer with x/x2/y/y2 draws the whole
    connected Kagi line, with color and StrokeWidth scales mapping yang/yin'
  - 'Thick #009E73 yang versus thin #AE3030 yin is clearly different in weight and
    color in both themes'
  - Theme tokens thread through all chrome; both renders readable with correct backgrounds
  - Trend legend names both states, Yang (Bullish) and Yin (Bearish)
  weaknesses:
  - 'VQ-05 (both): canvas is 5439x2979 instead of the canonical 3200x1800, and the
    title and legend sit against the canvas edges → 3200x1800 (about -2239 x -1179
    px). Likely cause: width=1600, height=900 with scale_factor=3.0 and no pad-only
    block; use the library prompt''s 620x320 view at scale_factor=4.0 plus the pad
    block.'
  - 'SC-02 (both): the yang/yin switch happens only at the reversal price, not where
    the line crosses the previous shoulder or waist (C2): column 19 falls from about
    110 to 102.3, below the previous waist at about 104.1, and stays thick; the thick
    state begins on the 87.7 waist at columns 11-12 instead of where column 12 rises
    above the 92.6 shoulder → split each vertical segment at the level it crosses
    and switch thickness and color there. Likely cause: the extension branches update
    `segments[-1]["y2"]` without re-checking against `last_shoulder` / `last_waist`.'
  - 'SC-04 (both): the title reads "kagi-basic · altair · anyplot.ai" without the
    language segment → "kagi-basic · python · altair · anyplot.ai". Likely cause:
    the title string.'
  - 'VQ-03 (both): the legend''s line samples are hairlines of the same weight for
    both states, so they do not show the thick yang stroke the marks use → samples
    in each state''s stroke weight. Likely cause: color and strokeWidth encode different
    fields (`type` vs `yang`), so the color legend never receives the stroke-width
    scale.'
  - 'CQ-04 (code): `dates` is built but never used, and `df_segments["color"]` / `df_segments["thickness"]`
    are computed but never encoded → delete them. Likely cause: leftovers from an
    earlier encoding approach.'
  - 'Suggestion: integer tick labels (0, 1, 2 …) would read more naturally for a line
    index than 0.0, 1.0, 2.0.'
