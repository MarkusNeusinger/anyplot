review:
  strengths:
  - 'Correct Kagi construction from closing prices with a 4% reversal: 25 columns
    stepping one even index per reversal, joined by horizontal shoulders and waists'
  - 'Thickness and color agree throughout: 12 px green #009E73 yang vs 4 px red #AE3030
    yin, clearly distinct in both themes'
  - 'Theme tokens threaded through pygal Style; all chrome readable on #FAF8F1 and
    #1A1A17'
  - Explicit y range reserves headroom so the weight legend never covers the line
  - 'Adaptable structure: column constants and a Data block ending in df, reading
    prices from df[CLOSE]'
  weaknesses:
  - 'SC-02 (both): each column is drawn in a single weight, so the line switches thick/thin
    at the start of the column (and on the preceding horizontal) instead of where
    it crosses the previous shoulder or waist (e.g. column 4 is thick from 80.5 although
    it only rises above the 85.2 shoulder of column 2; column 7 is thin from 89 although
    it only falls below the 84.5 waist at the crossing) → split the vertical segment
    at the previous shoulder/waist price and draw the part before the crossing in
    the old weight (C2). Likely cause: one ''type'' per column dict and one segment
    per column in the segments loop.'
  - 'VQ-01 (both): the ''100'' y tick renders at 44 px as a pygal major label while
    the other y ticks render at 56 px, so one tick reads smaller than its neighbours
    → the same size for all ticks (+12 px on ''100''). Likely cause: major_label_font_size=44
    below label_font_size=56.'
  - 'Suggestion: add the manual weight legend to the HTML export too (it is only injected
    into the PNG''s SVG).'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, 3200x1800.
      Chrome: title "kagi-basic · python · pygal · anyplot.ai" centered at the top (~50% width); y-axis "Close price ($)", x-axis "Kagi line index", ticks 80-120 and 0-24 in dark ink; dashed subtle horizontal grid; the "100" tick is visibly smaller than its neighbours. Legend panel top right: thick green "Yang (bullish) · thick", thin red "Yin (bearish) · thin".
      Data: one Kagi line of 25 columns; yang drawn thick in #009E73, yin thin in #AE3030, joined by horizontal shoulders and waists. Opens with a yang rise 101->110, a long yin fall to 80, alternating thick/thin swings rising to ~116, then yin and a closing yang segment near 109.
