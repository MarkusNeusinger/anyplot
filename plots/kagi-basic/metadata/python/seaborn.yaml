review:
  strengths:
  - Theme tokens threaded through sns.set_theme rc so chrome flips correctly in both
    renders
  - Clear weight contrast (2.6 pt vs 0.8 pt) with color agreeing with thickness everywhere
  - Exact 3200x1800 canvas with subplots_adjust and default bbox
  - 'Adaptable data block: tidy df with column constants feeding the plot'
  weaknesses:
  - 'SC-02 (both): line weight follows direction instead of the shoulder/waist rule:
    line 8 rises from about 6330 past the previous shoulder at about 7030 to 7830
    but stays thin, and line 3 falls from about 9220 to 7920 and turns thin at once
    instead of at the previous waist (about 8780); the line never changes weight mid-segment
    → split each vertical segment at the previous shoulder/waist price, thick above
    a broken shoulder and thin below a broken waist, otherwise keep the prior weight.
    Likely cause: segments carry one yang flag set from direction and the all-time
    last_high/last_low instead of the previous shoulder and waist.'
  - 'LM-01 (code): seaborn draws nothing; every mark is a matplotlib ax.plot call
    in a per-segment loop plus hand-built plt.Line2D legend handles → draw the tidy
    line table with sns.lineplot(data=lines, x=''x'', y=''y'', units=''segment'',
    hue=''type'', size=''type'', estimator=None, sort=False) and let it build the
    legend. Likely cause: the ax.plot loop over segment ids.'
  - 'Suggestion: label the reversal threshold (5%) in the axis or title prefix so
    the reader knows what turns the line.'
