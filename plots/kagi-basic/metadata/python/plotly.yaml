review:
  strengths:
  - 'Kagi construction from the close series with a 3% reversal: one even column per
    reversal on a ''Line index'' axis, unbroken line of verticals and horizontals
    (C1, C4)'
  - Yang 7.5 px green against yin 1.5 px red reads clearly in both themes; legend
    samples match the line weights
  - Theme tokens threaded through title, ticks, grid and legend; both renders theme-correct
  - Native plotly hovertemplate per segment (state and price) with 'x unified' hover
    in the HTML output
  weaknesses:
  - 'SC-02 (both): the line changes weight one segment late, not where it crosses
    the previous shoulder or waist — the vertical at index 4 (87→122) passes the 105
    shoulder and index 8 (82→142) passes the 130 shoulder but stay thin, index 5 (122→84)
    falls below the 87 waist but stays thick → split the vertical at the crossing
    level so it turns thick above the previous shoulder and thin below the previous
    waist (C2). Likely cause: each segment takes the state of its first point, and
    the state flip only updates the segment''s end point.'
  - 'SC-01 (both): triangle markers at every shoulder and waist, with Shoulder/Waist
    legend entries, add a signal layer the basic variant excludes (C5); the green
    shoulder triangle at index 3 also sits on a thin red yin line → remove the marker
    traces and their legend entries; the horizontal segments already mark shoulders
    and waists. Likely cause: the extra go.Scatter mode=''markers'' traces.'
  - 'SC-03 (both): the opening rise from 100 to 115 is not drawn — the line starts
    at 115 with a horizontal → keep the start point and add the first vertical 100→115
    at index 0. Likely cause: points[-1] is overwritten while the first column extends,
    replacing the start point.'
  image_description: |-
