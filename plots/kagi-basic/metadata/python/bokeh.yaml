review:
  strengths:
  - Two multi_line renderers fed by separate ColumnDataSources keep the yang/yin split
    in the data and make the legend native
  - 10 px vs 4 px line weights plus green/red make yang and yin unmistakable in both
    themes
  - Theme tokens threaded through title, axes, grid, outline and legend; both renders
    theme-correct on the canonical 3200x1800 canvas
  weaknesses:
  - 'SC-02, DQ-03 (both): the line turns thick only when the price passes the running
    all-time high and thin only below the all-time low, not at the previous shoulder
    and waist: column 6 rises from about 93.1 to 106.3 past the previous shoulder
    at about 98.4 and column 12 from about 83.4 to 100.2 past the shoulder at about
    92.9, yet both stay thin; column 14 turns thick only at about 109.5 instead of
    at the 100.2 shoulder; column 21 falls from about 131.4 to 122.9 below the previous
    waist at about 124.1, yet stays thick -> switch to yang where the rising line
    crosses the most recent shoulder and to yin where the falling line crosses the
    most recent waist, splitting that vertical segment at the crossing level. Likely
    cause: last_high/last_low track max/min over all prices instead of the last shoulder
    and waist levels.'
  - 'Suggestion: a wider legend line sample (legend.glyph_width) would show the thick/thin
    contrast in the legend as clearly as in the chart.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, 3200x1800, no toolbar.
      Chrome: bold title 'kagi-basic · python · bokeh · anyplot.ai' top-left; italic axis titles 'Line index' and 'Close price ($)'; ticks 0-20 and 90-130 in INK_SOFT; subtle grid; thin outline; legend top-left on elevated fill. All readable.
      Data: one Kagi line over 23 columns, thick #009E73 yang (columns 0-1 and 14-22) and thin #AE3030 yin (columns 1-14), shoulders and waists as horizontal steps, price ~83-134.
