    bumping slightly for better visibility on the catalog grid
  - 'Design Excellence is solid but could go further: e.g., a subtle secondary annotation
    (max drawdown/rally magnitude) or refined legend placement would push Data Storytelling
    further'
  - Library Mastery is competent but conservative — no distinctive Makie-only flourish
    (e.g., custom Legend layout, Colorbar) beyond the core stairs! recipe
