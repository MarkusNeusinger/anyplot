review:
  strengths:
  - Correct Kagi staircase construction with a proper 4% reversal-threshold state
    machine (direction tracking, shoulder/waist geometry)
  - 'Yang/Yin direction encoded redundantly via BOTH color (#009E73 green / #AE3030
    red) AND line thickness (5px / 2px) — satisfies the no-color-only-signal accessibility
    requirement'
  - 'Clean theme-adaptive chrome: spines removed on top/right, single subtle horizontal
    gridline, correct backgrounds (#FAF8F1 light / #1A1A17 dark) with identical data
    colors across themes'
  - Legend built via Makie's NaN-line idiom and correctly labeled 'Yang (bullish)'
    / 'Yin (bearish)' matching spec terminology
  - Realistic, neutral synthetic data (240-day random walk, 1.2% daily volatility)
    producing a plausible mid-cap-style price range
  weaknesses:
  - Kagi legs are drawn with a manual per-segment lines! loop rather than Makie's
    native stairs! step-plot recipe — the result is correct but misses the more idiomatic/distinctive
    Makie primitive for staircase shapes (LM-02)
  - Design polish is competent but standard — no extra data-storytelling emphasis
    such as markers at reversal points, beyond what the raw staircase geometry already
    conveys (DE-01/DE-03)
  - Y-axis shows only 3 gridlines (65/70/75) across a ~$60-76 range, on the sparse
    side for a price chart though not a legibility failure
