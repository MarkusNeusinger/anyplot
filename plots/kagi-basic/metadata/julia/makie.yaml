  strengths:
  - Correct, genuinely stateful Kagi reversal algorithm (not a disguised line chart)
    — direction only flips on a 4% threshold breach, exactly matching the spec's reversal
    semantics
  - Idiomatic use of Makie's stairs!(..., step = :post) recipe, well-suited to the
    rectilinear shoulder/waist geometry
  - Redundant color+thickness encoding for yang/yin improves accessibility beyond
    relying on red/green alone
  - Reversal-point markers add a clear storytelling focal point on top of the raw
    staircase
  - Theme-adaptive chrome correctly implemented and verified — both renders pass the
    legibility checklist with identical data colors
  weaknesses:
