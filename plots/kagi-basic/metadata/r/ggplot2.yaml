review:
  strengths:
  - 'Correct Kagi construction: one unbroken line whose thickness switches exactly
    where it breaks the previous shoulder (yang) or waist (yin), not merely on each
    line''s direction'
  - Single geom_segment maps the yang/yin state to both colour and linewidth via scale_color_manual
    and scale_linewidth_manual, so colour always agrees with thickness
  - Theme tokens threaded through every chrome element; both renders readable, Imprint
    green/red identical across themes
  - Column constants and a replaceable data block keep the 4% reversal construction
    reusable on any price table
  weaknesses:
  - 'VQ-07 (both): grid lines are drawn in INK_SOFT at full opacity, more prominent
    than the style guide''s 15% grid token → INK at about 15% alpha (rgba(26,26,23,0.15)
    light / rgba(240,239,232,0.15) dark). Likely cause: panel.grid.major = element_line(color
    = INK_SOFT) without alpha().'
  - 'Suggestion: drop the vertical grid lines, since the line index carries no value
    between columns.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1
      Chrome: title 'kagi-basic · r · ggplot2 · anyplot.ai' in dark ink top-left; axis titles 'Line index (4% reversal)' and 'Closing price (USD)'; ticks 2-12 and 110-150 in soft gray; thin full-opacity gray grid, a bit prominent but not competing with the line
      Data: one unbroken Kagi line over 13 columns, thick #009E73 yang with horizontal shoulders/waists, turning thin #AE3030 yin at column 4 (below the 110.5 waist) and at column 12 (below 148), thick again at column 5 above the 121 shoulder; last thin line open at ~146
