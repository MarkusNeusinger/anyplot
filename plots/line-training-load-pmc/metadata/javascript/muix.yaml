review:
  strengths:
  - Composes the chart from ChartsContainer with a time x axis and two y axes (load
    on the left, TSB on the right, each labeled with its unit), so form values are
    never read against the load scale
  - 'CTL and ATL drawn with monotoneX curves: smooth without overshooting their daily
    values; CTL visibly lags and smooths the spikier ATL'
  - Two-toned TSB band (blue fresh, red fatigued) with exact zero-crossing interpolation,
    plus a subtle dashed TSB = 0 reference line visible in both themes
  - Daily TSS as small 55 %-opacity dots on the load axis at their true values, reading
    as raw input without dominating the lines
  - Custom legend glyphs match their marks (line strokes, translucent area swatches,
    a dot), and the TSS entry names its axis
  - Chrome fully theme-adaptive via ANYPLOT_TOKENS; data colors identical across light
    and dark; seeded LCG data with realistic Base/Build/Peak/Taper periodization
  weaknesses:
  - 'VQ-03 (dark): the Form (Fresh) fill (#4467A3 at 0.3 opacity) turns into a dark
    navy that barely separates from the #1A1A17 page; the short positive TSB spikes
    in mid-April, mid-May and mid-June are hard to make out → raise the fresh fill
    so it reads clearly on the dark page (about 0.45–0.5 opacity, +0.15). Likely cause:
    fillOpacity={0.3} on both TSB paths in TsbAreaLayer.'
  - 'CQ-04 (code): lines 143–199 hand-build the two TSB polygons with a written-out
    zero-crossing loop and SVG path strings, although MUI X line series fill to a
    baseline natively → two line series on the tsb axis with area: true (data tsb
    clamped to ≥ 0 and ≤ 0, baseline 0) styled via .MuiLineChart-area[data-series=…].
    Likely cause: the custom TsbAreaLayer component instead of native area series.'
  - 'Suggestion: the ''↑ Taper'' phase marker is an annotation the spec does not request;
    it can go without loss.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, no pure white.
      Chrome: title "line-training-load-pmc · javascript · muix · anyplot.ai" top-left in dark ink (~34 % of width); left axis "Training load (AU)" 0–200, right axis "Form / TSB (AU)" −50 to 50, x axis Mar–Aug 2025; dark-gray tick labels, subtle horizontal grid; bottom legend (CTL – Fitness, ATL – Fatigue, Form (Fresh), Form (Fatigued), Daily TSS (left axis)) all readable.
      Data: CTL in brand green #009E73 rising smoothly 37 → 118 then easing in the taper; ATL in lavender spiking up to ~144 and dropping to ~45; TSB as a red translucent band below zero through the build and a blue band above zero in the taper (up to ~+43); dashed zero line; daily TSS as small ochre dots at their values (20–180); a dashed vertical "↑ Taper" marker in early July.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, axis titles, ticks and legend in light ink, all readable; no dark-on-dark text; grid subtle but visible.
      Data: identical colors to the light render (green CTL, lavender ATL, ochre TSS dots, red/blue TSB band). The fatigued fill reads as dark maroon, the fresh fill as dark navy, which is recognizable in the taper block but faint for the short positive spikes.
      Legibility verdict: PASS
