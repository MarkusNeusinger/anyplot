review:
  strengths:
  - 'Composes the PMC from MUI X''s composition API: ChartsContainer with three y
    axes (left load axis, right TSB axis, hidden TSS axis), LinePlot, ScatterPlot
    and ChartsReferenceLine, all bound to one shared time x axis'
  - TSB band is two-toned with exact zero-crossing interpolation, so the blue fresh
    and red fatigued fills meet cleanly at the dashed zero line in both themes
  - Data generation follows the standard EWMA formulas (CTL 1/42, ATL 1/7) with TSB
    from previous-day CTL minus ATL; base, build with recovery weeks, peak and taper
    phases make CTL visibly smoother and lagging ATL, and form turns positive only
    in recovery weeks and the taper
  - Both y axes carry readable titles with units (Training load (AU), Form / TSB (AU)),
    so form values are not read against the load scale
  - The taper start is marked with a subtle dashed vertical reference line and an
    italic label, giving the viewer a focal point for the positive-form window
  - Theme tokens are threaded through every text element and the zero line; data colors
    are identical between light and dark renders
  weaknesses:
  - 'SC-03 (both): daily TSS dots sit on a hidden axis scaled to 4x the TSS maximum,
    so a ~170 TSS session is drawn at ~40 on the labeled ''Training load (AU)'' axis
    and every TSS value is misread against the load scale by a factor of about 4 →
    make the TSS scale readable: plot the dots on the load axis at their true values,
    or state the scaling where the reader looks (for example a legend label such as
    ''Daily TSS (÷4, left axis)''). Likely cause: yAxis id ''tss'' with position ''none''
    and max = maxTss * TSS_SCALE_FACTOR.'
  - 'VQ-03 (both): the Form legend swatches are drawn at opacity 0.55 with a solid
    1.5 px border while the bands they explain are fillOpacity 0.3 with no stroke,
    so the Fresh swatch reads as a clearly brighter blue than the band, especially
    on the dark background → draw the swatches at the band''s 0.3 opacity without
    the border. Likely cause: the ''area'' legend Box sx opacity 0.55 and border.'
  - 'Suggestion: the hand-built TsbAreaLayer path could be replaced by two native
    line series on the ''tsb'' axis (values clamped to ≥0 and ≤0) with area: true
    and baseline: 0, which also lets ChartsLegend and tooltips cover the form band.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white, matches #FAF8F1; not pure white.
      Chrome: title "line-training-load-pmc · javascript · muix · anyplot.ai" top left in dark ink (~34% of width); left axis "Training load (AU)" 0–160, right axis "Form / TSB (AU)" −50 to 50, x axis Mar–Aug 2025 month ticks; subtle horizontal grid; HTML legend at the bottom (CTL – Fitness, ATL – Fatigue, Form (Fresh), Form (Fatigued), Daily TSS). All text dark and clearly readable.
      Data: CTL in brand green #009E73 climbing smoothly from ~37 to ~118 then easing in the taper; ATL in lavender #C475FD spiking to ~144 with weekly sawtooth and recovery dips; TSB as a two-tone band around a dashed zero line — translucent matte red below zero through most of the build, translucent blue above zero in recovery weeks and a large positive taper wedge to ~+45; ochre TSS dots in the lower third with a bottom row of rest-day values; dashed vertical line with italic "↑ Taper" label at early July.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black, matches #1A1A17; not pure black.
      Chrome: title, axis titles, tick labels and legend text in light ink, all clearly readable; grid lines subtle but visible; no dark-on-dark text.
      Data: identical hues to the light render (green CTL, lavender ATL, blue/red TSB band, ochre TSS dots); the red fatigued fill reads as deep maroon and the blue fresh fill as dim navy — both still recognizable; brand green clearly visible; dashed zero line and taper line visible.
      Legibility verdict: PASS
