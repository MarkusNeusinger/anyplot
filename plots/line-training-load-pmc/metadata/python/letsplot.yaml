review:
  strengths:
  - Correct EWMA computation (k=2/(n+1)) with TSB from previous-day CTL minus ATL,
    so CTL visibly lags and smooths ATL
  - Two-toned geom_ribbon split at zero with a dashed zero reference, recognizable
    in both themes
  - gggrid composite painted in the page color with legends placed in reserved headroom,
    clear of the data
  - Interactive HTML export alongside the PNG
  weaknesses:
  - 'VQ-03 (both): the Positive/Negative Form legend swatches are drawn fully opaque
    while the ribbons they explain render at alpha 0.45, so the strong blue/red keys
    do not match the pale fills → swatches at the ribbons'' alpha. Likely cause: legend
    keys of geom_ribbon not overridden (guide_legend(override_aes={''alpha'': 0.45})
    on the fill guide).'
  - 'Suggestion: a secondary-axis style split (own label for form) would make it even
    harder to read TSB against the load scale.'
  - 'Suggestion: the two legend boxes could merge into one row to free headroom above
    the lines.'
