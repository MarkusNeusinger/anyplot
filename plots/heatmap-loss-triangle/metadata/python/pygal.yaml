review:
  strengths:
  - imprint_seq field ramp with the theme's own stops (light and dark), sampled through
    the library prompt's ramp_color helper
  - Evaluation-date line follows the cell edges as a staircase, so it marks the observed/projected
    boundary without crossing any value
  - Projected cells stay opaque with hatching, a dashed inner border and italic text,
    so color intensity stays readable in the IBNR region
  - Per-cell text ink chosen by WCAG contrast keeps every value legible in both themes
  - Development factors sit on the boundary between the two periods they link
  - Native SVG defs (pattern hatching, linearGradient colorbar) and _tooltip_data
    hover tooltips in the HTML
  - Data block ends in one tidy df with column constants; pivots and factors derive
    from it
  weaknesses:
  - 'VQ-01 (both): chrome text sits far below pygal''s style-guide references and
    reads small beside the 66 px title - axis titles 26-34 px (reference 56), row
    and column labels 30 px (reference 44), legend 24 px (reference 44), development
    factors 24 px and colorbar ticks 22 px → axis titles about 56 px, labels, legend,
    factors and colorbar ticks about 40-44 px (+14 to +22 px), shrinking the cell
    grid as needed. Likely cause: the hf/cf/ff clamps (max 34/30/24) and the fixed
    22/24 px colorbar and legend sizes in _plot.'
  - 'VQ-02 (both): the colorbar title ''Cumulative ($k)'' is centered on the 32 px
    bar, so its first letters start about 45 px inside the 2016 / period 10 cell →
    keep it clear of the grid (left edge at least 10 px right of the last column,
    about +55 px), e.g. anchor it at the bar''s left edge with text-anchor start or
    wrap it. Likely cause: put(CUMULATIVE, cbx + cbw / 2, ...) with anchor middle.'
  - 'Suggestion: the band between the title and the ''Development Period (Years)''
    header is about 230 px tall; larger chrome text would use it.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, correct.
      Chrome: title 'heatmap-loss-triangle · python · pygal · anyplot.ai' in dark ink at the top; 'Development Period (Years)' header over column labels 1-10; rotated 'Accident Year' with row labels 2015-2024; 'Dev Factor' row below the grid; colorbar 'Cumulative ($k)' 639-6,951 on the right; legend Actual (Observed) / Projected (IBNR) / Evaluation Date centered underneath. All readable, though axis titles, factors, colorbar ticks and legend are small. The colorbar title's first letters run onto the 2016 / period 10 cell.
      Data: 10x10 grid on the light imprint_seq field ramp (mint #66E2B2 -> #009E73 -> navy #024582 -> aubergine #351E45). Observed upper-left cells have bold upright values; projected lower-right cells are opaque with diagonal hatching, a dashed inner border and italic values. A thick dashed dark staircase follows the cell edges along the evaluation diagonal. Every value has a thousands separator, with dark or light ink by contrast. Factors 2.345 ... 1.041 sit between columns.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17, correct.
      Chrome: same layout with light ink (title #F0EFE8, headers and labels light, factors and colorbar ticks soft grey). No dark-on-dark text. The colorbar title overlaps the same cell edge.
      Data: the dark imprint_seq field stops (olive #404C02 -> #009E73 -> pale blue #CDD9FF), so the ramp flips as continuous ramps should. Hatching and dashed borders switch ink with the cell. The staircase evaluation line is light dashed. Values stay readable on every cell.
      Legibility verdict: PASS
