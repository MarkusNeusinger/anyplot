review:
  strengths:
  - Observed and projected regions separated three ways - hatching, a dashed inner
    border and light italic values against bold upright ones - so the IBNR region
    reads at a glance in both themes
  - Evaluation-date boundary drawn as a stepped dashed line along the cell edges,
    in INK so it flips with the theme
  - Age-to-age factors computed volume-weighted from the observed cells and centered
    on the column boundaries they link, under a thin rule
  - Per-cell text ink chosen by WCAG contrast against the imprint_seq field color,
    keeping every value legible from mint to aubergine and olive to periwinkle
  - Extends pygal's Graph with _compute/_plot and uses SVG <pattern> and <linearGradient>
    defs plus _tooltip_data for per-cell hover tooltips in the HTML
  weaknesses:
  - 'VQ-01 (both): the cell values are clamped at 32 px, below pygal''s 36 px value
    reference, and read small beside the 44 px row and column labels in cells about
    175 px wide → about 36-40 px (+4 to +8 px). Likely cause: vf = max(20, min(32,
    ...)) in _plot.'
  - 'DQ-03 (both): the projected cells are independent random draws, not chain-ladder
    projections, so projected cumulative amounts fall below the cell before them (2016:
    4,334 observed -> 4,309 projected at period 10 against a 1.041 factor; 2019: 5,401
    -> 5,114; 2022: 6,254 -> 5,924) → every projected cell equals the previous cell
    times the age-to-age factor of that step, so each projected row rises monotonically.
    Likely cause: the Data loop draws amount = expected + noise for every cell, observed
    or projected.'
  - 'Suggestion: the band between the title and the ''Development Period (Years)''
    header is still about 180 px tall; the grid could grow into it.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1.
      Chrome: title 'heatmap-loss-triangle · python · pygal · anyplot.ai' at ~70% width; 'Development Period (Years)' axis title (56 px) over bold column headers 1-10; rotated 'Accident Year' with bold row labels 2015-2024; 'Dev Factor' band below a thin rule (2.345 ... 1.041 centered between columns); colorbar 'Cumulative ($k)' wrapped onto two lines, left-aligned with the bar and clear of the grid, ticks 639-6,951 at 40 px; legend Actual (Observed) / Projected (IBNR) / Evaluation Date centered under the grid. All dark text, readable.
      Data: 10x10 cells on the imprint_seq light field ramp (mint -> #009E73 -> navy -> aubergine); observed cells with bold dark or light values, projected lower-right cells hatched with a dashed inner border and italic values; stepped dashed black evaluation line. Cell values at 32 px are readable but small beside the 44 px labels.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, axis titles, labels, factors, colorbar ticks and legend in light ink (#F0EFE8 / #B8B7B0) - no dark-on-dark text.
      Data: the same grid on the dark field stops (olive -> #009E73 -> periwinkle), as a continuous ramp should; per-cell ink flips by contrast; the evaluation line is drawn in light ink and stays visible; hatching visible on every projected cell.
      Legibility verdict: PASS
