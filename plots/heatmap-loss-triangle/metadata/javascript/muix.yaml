review:
  strengths:
  - Composes the triangle on a ChartsContainer with band x/y axes and draws a custom
    cell layer through the useXScale / useYScale / useDrawingArea hooks, so cells,
    the staircase boundary and the factor row are all placed by the chart's own scales
  - Projected cells are clearly set apart by a hatch pattern plus a dashed outline
    that keep the imprint_seq fill visible underneath, and the same styling is repeated
    in the legend swatch
  - The latest-evaluation staircase is drawn in the ink token, so the boundary reads
    clearly in both themes
  - Every cell carries its amount with a thousands separator, and the white bold text
    stays legible on both the actual and the hatched projected fills
  - Age-to-age factors are centred on the boundaries between the two periods they
    link
  - Color uses the imprint_seq green→blue ramp from window.ANYPLOT_TOKENS with a matching
    gradient colorbar; data colors are identical in light and dark
  - The subtitle computes the total projected IBNR reserve from the triangle, giving
    the reader the headline figure the chart exists to produce
  weaknesses:
  - 'AR-09, VQ-05 (both): the colorbar title "Cumulative paid claims" starts at the
    colorbar''s x position and runs off the right canvas edge, so only "Cumulative
    paic" is visible and the rest of the letters are missing → the whole title inside
    the canvas with at least 16 px of margin (about +90 CSS px of room, or a shorter
    or two-line title). Likely cause: margin.right = 132 is narrower than the colorbar
    title; it is drawn at barX = area.left + area.width + 28 with textAnchor="start".
    Widen margin.right to about 230, or split the title ("Cumulative paid" / "claims
    ($000s)"), or anchor it at the end of the colorbar tick labels.'
  - 'DQ-02 (both): every accident year develops with exactly the same age-to-age factors
    (1.45, 1.20, 1.12, …), so all observed rows are scaled copies of each other and
    the factor row is the exact ratio in every row, which is not how a real paid-claims
    triangle behaves → per-year link ratios that scatter around the selected factors
    (for example ±3 % noise from the seeded LCG), with the factor row computed from
    the observed triangle as volume-weighted averages. Likely cause: cumulative =
    cumulative * SEED_FACTORS[j - 1] applied identically to every row.'
  - 'Suggestion: the age-to-age factor row sits below the x-axis title, about 130
    px under the column labels; putting it directly under the period labels (above
    the axis title) would tie each factor more closely to the two columns it links.'
  - 'Suggestion: round colorbar ticks (1,000 / 1,500 / 2,000 / 2,500) would read faster
    than the evenly split 825 / 1,266 / 1,707 / 2,147 / 2,588.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, square 2400x2400 canvas.
      Chrome: bold dark title "heatmap-loss-triangle · javascript · muix · anyplot.ai" centred at the top, a grey subtitle (Accident Years 2015–2024 · Cumulative paid claims ($000s) · Total projected IBNR reserve: 3,832 ($000s)), a legend row (solid green "Actual (observed claims)" swatch, hatched dashed "Projected (chain-ladder IBNR)" swatch), y-axis "Accident Year" with year ticks 2015–2024, x-axis "Development Period (years since occurrence)" with ticks 1–10, and an "Age-to-age factor" row (×1.45 … ×1.00) at the bottom between the column positions. A vertical colorbar on the right runs 825–2,588; its title "Cumulative paid claims" is cut at the right canvas edge and reads "Cumulative paic" (AR-09). All other text is dark and readable.
      Data: 10×10 grid of rounded cells colored on the imprint_seq ramp from #009E73 (825, 2015 period 1) to blue #4467A3 (2,588, 2024 period 10); every cell has a white bold amount with thousands separators. The lower-right 45 projected cells carry a diagonal hatch and dashed outline; a dark staircase line marks the latest-evaluation diagonal. 2024 has a single observed cell.
      Legibility verdict: FAIL (colorbar title clipped at the right edge; everything else PASS)

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, legend labels and axis titles flip to light ink; tick labels, subtitle, factor row and colorbar ticks in light grey inkSoft — all readable, no dark-on-dark text. The staircase boundary and the hatch strokes flip to light ink and are clearly visible. The colorbar title is clipped at the right edge exactly as in the light render ("Cumulative paic").
      Data: cell fills, gradient and legend swatch colors are identical to the light render; only chrome flips.
      Legibility verdict: FAIL (same right-edge clipping of the colorbar title; everything else PASS)
