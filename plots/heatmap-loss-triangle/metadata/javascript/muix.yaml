review:
  strengths:
  - Excellent custom composition — MUI X community has no native heatmap chart, so
    the implementation correctly builds one from ChartContainer plus useXScale/useYScale/useZColorScale/useDrawingArea,
    which is the idiomatic low-level path for this spec.
  - 'The actual/projected boundary correctly follows the actuarial convention: the
    diagonal runs from top-right (2015, fully observed through period 10) to bottom-left
    (2024, observed only at period 1), exactly matching the spec''s ''diagonal from
    top-right to bottom-left represents the latest evaluation date.'''
  - Actual vs. projected cells are distinguished redundantly (hatch pattern + dashed
    vs. solid stroke), not by color alone, plus a manual swatch legend — CVD-safe
    and unambiguous.
  - Age-to-age development factors are rendered as a dedicated row below the triangle
    exactly as the spec allows, with a sensible chain-ladder decay (×1.45 down to
    ×1.00).
  - 'Correct imprint_seq (brand-green → blue) sequential colormap encodes cumulative
    magnitude, identical across light/dark, with theme-correct #FAF8F1 / #1A1A17 backgrounds
    in both renders.'
  - Per-cell text color is chosen dynamically from each cell's own fill luminance,
    keeping the thousands-separated annotations legible across the entire green-to-blue
    gradient in both themes.
  - Deterministic LCG-seeded data generation, clean single-file structure, no fake
    interactive elements.
  weaknesses:
  - The rotated 'Cumulative paid claims ($000s)' caption is placed directly on top
    of the ContinuousColorLegend gradient bar instead of beside it, in both the light
    and dark renders — the text runs straight across the green-to-blue bar rather
    than sitting in clear space next to it. Move the caption (or the legend) so there
    is a visible gap between the caption text and the color bar; verify at the full
    canvas size that the caption's bounding box no longer intersects the bar's rect.
  - Data storytelling is solid but stops at the color/hatch encoding — nothing calls
    out the evaluation-date diagonal itself (e.g., a subtle boundary line or annotation),
    which would make the actual/projected split even more immediately legible at a
    glance.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Bold dark title "heatmap-loss-triangle · javascript · muix · anyplot.ai" and gray subtitle "Accident years 2015-2024 · evaluated as of Dec 2024" at top, both fully readable. A two-item swatch legend ("Actual (observed)" solid green, "Projected (IBNR estimate)" hatched) sits below the subtitle. Row labels (2015-2024) run down the left, column headers (1-10) run along the bottom, with an x-axis title "Development Period (years since occurrence)" and an "Age-to-age factors" row (×1.45...×1.00) beneath that. A vertical continuous color legend sits on the right with "2,588" above and "825" below.
      Data: 10x10 grid of rounded-corner cells colored on the imprint_seq green-to-blue scale by cumulative claim value, each annotated with a thousands-separated white number. Cells past the top-right-to-bottom-left diagonal (i.e., the lower-right triangle) are hatched with a dashed border to mark them as projected/IBNR; the upper-left triangle is solid-filled to mark observed values. First data color is the Imprint brand green, consistent with imprint_seq's low anchor.
      Defect: The vertical "Cumulative paid claims ($000s)" caption text is rendered directly on top of the color legend bar rather than beside it — the dark text crosses straight over the green/blue gradient.
      Legibility verdict: PASS overall (all chrome text is readable against the light background), but the caption-over-legend overlap noted above is a real, visible layout defect.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title/subtitle/legend/axis-label/factor-row layout as the light render, now rendered in light ink (white/light-gray) against the dark background — no dark-on-dark text found anywhere, including inside the grid cells.
      Data: Cell fill colors are pixel-identical to the light render (same green-to-blue imprint_seq gradient, same hatch/dashed-border marking for projected cells) — only the page chrome (background, ink) flipped, as required.
      Defect: The same "Cumulative paid claims ($000s)" caption-over-color-bar overlap is present here too, now with light-colored text crossing the gradient bar.
      Legibility verdict: PASS overall (no dark-on-dark failures; all chrome and cell text is readable), with the same caption/legend-bar overlap defect as the light render.
