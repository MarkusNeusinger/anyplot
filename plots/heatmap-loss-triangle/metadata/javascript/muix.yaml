review:
  strengths:
  - 'Composes the Pro-only heatmap from community parts: ChartsContainer with band
    x/y axes, ChartsXAxis/ChartsYAxis, and a custom SVG layer positioned through useDrawingArea/useXScale/useYScale,
    so every cell sits exactly in its year/period band'
  - Actual vs projected told apart by two independent cues (diagonal hatch plus dashed
    outline) on top of the imprint_seq fill, so the magnitude color stays readable
    under the projected styling in both themes
  - Ink-colored staircase traces the latest evaluation diagonal and flips with the
    theme (dark on cream, light on near-black)
  - 'Chain-ladder is actually computed: volume-weighted age-to-age factors from the
    observed cells drive the projections, the factor row and the IBNR total in the
    subtitle'
  - Colorbar built from the t.seq stops with a title and unit, cell text color chosen
    by fill luminance, deterministic LCG data, skipAnimation set
  weaknesses:
  - 'Suggestion: the age-to-age factor row sits below the x-axis title, about 130
    px under the cells; placing it directly under the period tick labels would tie
    each factor more closely to the columns it links.'
  - 'Suggestion: the colorbar ticks fall on min/max-derived values (825, 1,295, 1,766,
    …); round ticks such as 1,000 / 1,500 / 2,000 / 2,500 would read faster.'
  - 'Suggestion: the subtitle repeats the unit ''($000s)'' twice; one mention after
    the IBNR figure would tighten it.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, square 2400x2400 canvas.
      Chrome: bold dark title "heatmap-loss-triangle · javascript · muix · anyplot.ai" (~45% width), softer subtitle with accident-year range, unit and total projected IBNR reserve 3,883 ($000s); legend row "Actual (observed claims)" (solid green swatch) and "Projected (chain-ladder IBNR)" (hatched, dashed swatch); y ticks 2015–2024 with "Accident Year" title, x ticks 1–10 with "Development Period (years since occurrence)"; factor row "Age-to-age factor ×1.45 ×1.20 ×1.12 ×1.07 ×1.05 ×1.03 ×1.02 ×1.01 ×1.00" placed at the column boundaries; colorbar on the right titled "Cumulative paid claims ($000s)" with ticks 825–2,706. All text readable.
      Data: 10x10 grid of rounded cells colored on imprint_seq (#009E73 green at low amounts → #4467A3 blue at high); upper-left 55 observed cells solid, lower-right 45 projected cells hatched with dashed outlines; black staircase along the latest evaluation diagonal; every cell carries a white bold value with thousands separator, legible on both styles.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
