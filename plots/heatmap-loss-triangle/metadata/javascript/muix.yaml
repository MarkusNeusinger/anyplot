review:
  strengths:
  - Correctly derives the actual/projected boundary from `i + period > 10`, producing
    the exact top-right-to-bottom-left staircase the spec calls for, verified across
    all 10 rows in the render.
  - Custom composition using `useXScale`/`useYScale`/`useZColorScale` band + continuous-color
    hooks is a genuinely idiomatic way to build a heatmap-style triangle on top of
    community MUI X, which has no built-in heatmap chart.
  - Hatching (not just color) distinguishes projected cells from actual ones, so the
    actual-vs-projected signal survives for colorblind viewers.
  - Age-to-age development factors are rendered as their own row beneath the triangle,
    aligned to column boundaries, satisfying the spec's chain-ladder requirement.
  - Cell text color is chosen per-cell from fill luminance (independent of site theme),
    keeping all 100 annotated values legible in both light and dark renders.
  - Data colors are pixel-identical between light and dark renders; only chrome (background,
    ink, legend frame) flips, as required.
  weaknesses:
  - 'File header is duplicated: lines 1-4 are a stale header block (with an old ''Quality:
    89/100'' line and ''Library: muix 7.29.1 | JavaScript 22.23.2'' format) followed
    by a second, current header block starting again at line 6. Remove the first block
    entirely so only one header remains, and move the `//# anyplot-orientation: square`
    directive to the very first line as the library guide requires.'
  - With 100 annotated cells at 13px in a 2400x2400 canvas, cell values will be near-illegible
    once scaled down to the ~400px catalog thumbnail — inherent to the data density
    the spec requires, but worth a slightly larger cell fontsize or bolder weight
    if there's headroom.
  - Design Excellence relies entirely on the mandated Imprint sequential tokens for
    its palette; there's no additional bespoke color/typography choice beyond composition,
    so DE-01 is scored on structural sophistication rather than palette invention.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1-consistent), not pure white.
      Chrome: Title "heatmap-loss-triangle · javascript · muix · anyplot.ai" and subtitle "Accident years 2015-2024 · evaluated as of Dec 2024" render in dark ink, clearly legible. Row labels (2015-2024) and column headers (1-10) are dark and readable. "Age-to-age factors" caption and the 9 factor values (×1.45...×1.00) below the grid are legible in muted ink. Axis captions "Development Period (years since occurrence)" and rotated "Cumulative paid claims ($000s)" are readable. Legend swatches ("Actual (observed)" / "Projected (IBNR estimate)") are clear, with the projected swatch showing the diagonal hatch pattern.
      Data: 10x10 triangular grid, teal-green (low values, ~825) transitioning to blue (high values, ~2,588) via the sequential Imprint colorbar on the right. First-column/low-value cells read as brand green (#009E73-family). Each cell is annotated with its cumulative value using a thousands separator, in white or near-black text chosen per-cell for contrast against that cell's own fill. Projected cells (lower-right, staircase boundary from top-right to bottom-left) show a diagonal hatch overlay and dashed cell borders; actual cells have solid borders.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17-consistent), not pure black.
      Chrome: Title, subtitle, row/column labels, dev-factor row, axis captions, and legend text all render in light ink, clearly legible against the dark background. No dark-on-dark text observed anywhere — every label maintains strong contrast.
      Data: Identical cell fill colors and identical cumulative values to the light render (verified pixel-for-pixel appearance of the teal-to-blue sequential ramp and per-cell values); only the page background, ink, and legend/axis chrome switched to dark-theme tokens. Hatching and dashed borders on projected cells remain equally visible.
      Legibility verdict: PASS
