review:
  strengths:
  - Development factors (×1.741, ×1.324, …) are computed directly from the same reportPattern
    that drives the cell values, and the 55/45 actual-vs-projected split lands exactly
    on the spec's triangular boundary.
  - Distinctive chart.events.load + point.update() technique dynamically sizes square
    markers to tile the grid edge-to-edge regardless of Highcharts' auto-computed
    axis margins.
  - Actual vs. projected is encoded redundantly (alpha + amber border), not via hue
    alone — good CVD accessibility, on top of a correct imprint_seq magnitude gradient.
  - Per-cell label color is computed from the actual blended fill's relative luminance,
    keeping every one of the 100 labels legible in both themes.
  - Realistic, internally consistent chain-ladder data (smoothly decaying development
    factors, plausible year-over-year ultimate-loss growth).
  weaknesses:
  - At ~400px mobile width the 100 per-cell dollar labels become illegible smudges
    — consider a slightly larger/bolder dataLabels font or a more compact number format
    (e.g. "$1.19M") to buy back legibility at scale-down.
  - Neither axis has a formal title ("Accident Year" / "Development Period") — yAxis.title.text
    is explicitly null and xAxis has none; the subtitle covers this contextually but
    an explicit axis title would fully satisfy VQ-06.
  - The legend swatches show the fixed series base colors (green / amber), not the
    actual per-cell gradient fill (color intensity encodes magnitude independently
    of the actual/projected split) — a one-line clarification would prevent readers
    from assuming the legend swatch is the literal cell fill.
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white, matches #FAF8F1, not pure white
      Chrome: title, subtitle, legend, row labels (accident years), column labels (dev periods + factors) all in dark ink, clearly readable
      Data: 10x10 grid, actual cells = solid green-to-blue sequential gradient (imprint_seq) by magnitude, projected cells = same hues faded via alpha + amber outline; first series color is #009E73
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black, matches #1A1A17, not pure black
      Chrome: title, subtitle, legend, row/column labels all flip to light cream/gray text, clearly readable against dark background; no dark-on-dark failures
      Data: fill colors pixel-identical to light render (only chrome flipped); per-cell label color recomputed from luminance of the blended fill so every label stays legible
      Legibility verdict: PASS
