review:
  strengths:
  - Center total composed into the chart SVG via the useDrawingArea hook, with a clear
    three-level hierarchy (TOTAL / 500 / unit) that is readable in both themes
  - Percentage labels computed from value/total and drawn with per-segment ink chosen
    by WCAG luminance, so every label reads on its fill
  - Native PieChart styling - paddingAngle, cornerRadius and a page-colored arc stroke
    - separates segments cleanly on both backgrounds
  - 'Thick single ring with segments in descending order from 12 o''clock and Imprint
    colors starting at #009E73'
  - Library-native hover tooltips and legend highlighting in the HTML output
  weaknesses:
  - 'Suggestion: the legend at 16 CSS px is the smallest text on the canvas; about
    18 px would match the center caption and hold up better in the 400 px thumbnail.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white, matching #FAF8F1.
      Chrome: bold dark title "donut-basic · javascript · muix · anyplot.ai" centered at top; horizontal legend at the bottom (Equities, Fixed Income, Real Estate, Commodities, Cash & Equivalents) in dark ink with colored dots; center text "TOTAL" (letter-spaced, soft ink), "500" (large bold dark), "Allocation (million USD)" (soft ink). All readable.
