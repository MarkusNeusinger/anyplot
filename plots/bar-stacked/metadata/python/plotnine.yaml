  strengths:
  - Electronics, the largest component, sits at the bottom of every stack and the
    legend reads top to bottom in the stack's order, via an ordered pd.Categorical
  - position_stack(vjust=0.5) centres bold white value labels in each segment
  - Theme tokens applied to every chrome element; both renders read cleanly
  - 'Sports gets #009E73, then Imprint positions 2-4 in canonical order'
  weaknesses:
  - 'SC-04 (both): the title reads ''bar-stacked · plotnine · anyplot.ai'' without
    the language → ''bar-stacked · python · plotnine · anyplot.ai''. Likely cause:
    labs(title=...) string.'
  - 'VQ-05 (both): Canvas dimensions drifted from the required target. Actual: 4800x2700.
    Closest valid target: 3200x1800 (+1600 x +900, too large) → figure_size (8, 4.5)
    saved at dpi=400, width=8, height=4.5, units=''in''. Likely cause: figure_size=(16,
    9) with plot.save(dpi=300).'
  - 'CQ-01 (code): there is no column constant for the required roles category, component
    and value, and ''Quarter'', ''Category'' and ''Sales'' are typed again in aes()
    at lines 58-62 → one string constant per role above the data block (QUARTER, CATEGORY,
    SALES with a # role: comment) used everywhere below it. Likely cause: column names
    typed where they are used.'
  - 'CQ-01 (code): IMPRINT lists 4 of the 8 positions, sized to the sample''s components
    → list all eight Imprint positions and pass limits from the data to scale_fill_manual.
    Likely cause: a palette sized to the sample data.'
  - 'CQ-04 (code): the sys.path filter with a ''# noqa: E402'' import block (lines
    13-16) works around module shadowing and has no effect on either render → remove
    it and import plotnine at the top. Likely cause: a local-run workaround left in
    the file.'
  - 'CQ-04 (code): the comment ''Okabe-Ito palette'' sits over the Imprint colors
    it describes → name the palette Imprint. Likely cause: a stale comment.'
  - 'Suggestion: total labels above each stack, which the Notes invite, would show
    the quarter-on-quarter growth directly.'
