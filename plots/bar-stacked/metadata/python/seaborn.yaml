review:
  strengths:
  - Native seaborn stacking with histplot(weights=, multiple='stack', shrink=0.7)
  - Theme tokens threaded through set_theme rc, so all chrome flips correctly and
    every text is readable in both themes
  - Total labels above each stack equal the segment sums and stay clear of each other
  weaknesses:
  - 'VQ-05, CQ-05 (both): the canvas is 4653x2566 instead of 3200x1800 (+1453 × +766
    px) → figsize=(8, 4.5), dpi=400 and no bbox trimming. Likely cause: figsize=(16,
    9) with savefig(dpi=300, bbox_inches=''tight'').'
  - 'VQ-07 (both): segments are drawn at seaborn''s default alpha 0.75, so the Imprint
    colors blend with the page and read darker and duller in the dark render than
    in the light one → opaque segments (alpha=1) so the data colors are identical
    in both themes. Likely cause: sns.histplot without alpha=1.'
  - 'SC-02 (both): the largest component, Electronics, sits at the top of every stack
    and Sports at the bottom, the reverse of the largest-at-the-bottom order the Notes
    ask for → Electronics at the bottom. Likely cause: histplot stacks the first hue
    level last; reverse the hue order and key the palette by name so Electronics keeps
    #009E73.'
  - 'SC-04 (both): the title reads ''bar-stacked · seaborn · anyplot.ai'' and lacks
    the language segment → ''bar-stacked · python · seaborn · anyplot.ai''. Likely
    cause: the title string.'
  - 'CQ-01 (code): no column-0 # Data / # Plot markers separate data from plotting,
    there are no column constants for the category, component and value roles, and
    IMPRINT lists 4 of 8 positions → one Data block bound to df, one constant per
    role above it, all eight IMPRINT positions sliced by the hue count. Likely cause:
    column names typed where they are used and a palette sized to the sample.'
  - 'CQ-04 (code): line 26 seeds a random generator that nothing uses (the data are
    literals) and lines 96-97 build a color dict only to turn it back into the same
    ordered list → remove the seed and the numpy import, pass IMPRINT[:n] directly.
    Likely cause: leftover template code.'
  - 'Suggestion: sns.despine(ax=ax) would replace the manual spine loop.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1; canvas 4653x2566, not one of the canonical sizes.
      Chrome: centered bold title "bar-stacked · seaborn · anyplot.ai" in dark ink, x label "Month", y label "Sales (Thousands $)", gray tick labels Jan-Jun and 0-500, faint horizontal grid, top and right spines removed, legend "Product Category" outside right in an off-white frame. All text readable.
      Data: six stacks; bottom to top Sports (ochre), Home & Garden (blue), Clothing (purple), Electronics (green) on top, drawn at seaborn's default alpha 0.75 so the colors look washed out; white separators. Bold totals $285K, $300K, $375K, $435K, $435K, $390K above the stacks. The largest component is on top.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, axis labels and legend text in light ink, tick labels light gray, legend frame #242420, faint grid. No dark-on-dark text.
      Data: the same four hues, but the 0.75 alpha blends them with the dark page, so green, purple, blue and ochre read noticeably darker and duller than in the light render. Totals in light bold text, readable.
      Legibility verdict: PASS
