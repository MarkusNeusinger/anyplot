review:
  strengths:
  - Native pygal.StackedBar with print_values_position='center' puts each segment's
    value inside it, all labels fitting their segments
  - Components ordered with the largest (Development) at the bottom and kept in the
    same order in every sprint
  - Imprint palette in canonical order through Style(colors=...), with theme-adaptive
    chrome threaded through background, foreground and foreground_subtle
  - 'Adaptable data block: tidy df with role constants, pivot_table(sort=False) and
    reindex keep the component order'
  - Interactive HTML output with pygal's built-in hover tooltips
  weaknesses:
  - 'VQ-07 (both): the bar fills render translucent, so the data colors differ between
    themes — Development reads about #4BB998 on the light page and #087757 on the
    dark page instead of #009E73 in both (same shift for lavender, blue and ochre)
    → fully opaque fills so every Imprint position is identical in both renders. Likely
    cause: pygal''s default Style fill opacity (about 0.7, measured from the blend)
    left unset; set Style(opacity=1, opacity_hover=1).'
  - 'VQ-01 (light): the white value labels sit on the washed-out translucent segments
    (pale lavender, pale ochre, pale green) and read faint, e.g. ''64'', ''42'', ''33''
    → clearly contrasting labels on every segment. Likely cause: value_colors=(''#FFFFFF'',)
    combined with the translucent fills; opaque fills (opacity=1) restore the contrast.'
  - 'VQ-05 (both): the legend''s second row (''Testing'', ''Meetings'') ends about
    15 px above the bottom canvas edge while the top margin is far larger → at least
    about 50 px of bottom margin (+35 px). Likely cause: margin=50 with legend_at_bottom=True
    and no margin_bottom.'
  - 'Suggestion: total labels above each stack, which the Notes allow, would make
    the per-sprint totals readable without summing segments.'
  - 'Suggestion: the y-axis ''0'' tick renders smaller than the 100–400 ticks; matching
    it would even the axis.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across canvas and plot area.
      Chrome: title "bar-stacked · python · pygal · anyplot.ai" centered in dark ink; y-axis title "Team hours", x-axis title "Sprint", ticks 0–400 and Sprint 1–6 all dark and readable; dotted y-guides subtle; two-column legend at the bottom (Development, Code review, Testing, Meetings), its second row close to the bottom edge.
      Data: six stacked bars, Development (green) at the bottom, then Code review (lavender), Testing (blue), Meetings (ochre); fills are translucent so they read lighter than the palette (Development ~#4BB998); white value labels centered in each segment, faint on the pale lavender/ochre segments.
      Legibility verdict: PASS (chrome readable; white value labels low-contrast on pale segments)

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, axis titles, tick labels and legend text in light ink, all readable; no dark-on-dark text; guides subtle.
      Data: same layout and order; the translucent fills blend with the dark page so colors read darker than in light (Development ~#087757), i.e. not identical to the light render; white value labels clearly readable on every segment.
      Legibility verdict: PASS
