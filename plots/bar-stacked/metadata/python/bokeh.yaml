review:
  strengths:
  - Stacking is computed with pandas (pivot_table, cumsum) and drawn with vbar top/bottom,
    so each segment sits exactly on the one below from a shared zero baseline.
  - Legend with an 'Energy source' title sits beside the plot, so no stack is covered,
    and its swatches match the segment colors in both themes.
  - Page-colored 2px segment separators keep neighboring segments distinct and flip
    with the theme.
  - Per-renderer HoverTool shows month, source and formatted GWh for each segment
    in the HTML output.
  - Theme tokens are threaded through title, axes, ticks, grid and legend; both renders
    read cleanly.
  weaknesses:
  - 'Suggestion: total labels above each stack (the Notes allow them) would make the
    month totals readable without the grid.'
  - 'Suggestion: p.vbar_stack with the component names as stackers would be the native
    Bokeh form of the stacking.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the full 3200x1800 canvas.
