review:
  strengths:
  - Native position='stack' keeps the component order identical in every bar
  - layer_tooltips() gives the HTML view per-segment product and value
  - Theme tokens thread through all chrome; both renders readable
  weaknesses:
  - 'VQ-05 (both): canvas is 4800x2700 → 3200x1800 (-1600 x -900). Likely cause: ggsize(1600,
    900) with scale=3 instead of ggsize(800, 450) with scale=4.'
  - 'VQ-01 (both): tick and legend text at 16 on a 1600-wide canvas read about 20
    % below the library reference (10 at 800 wide) → reference proportions. Likely
    cause: font sizes chosen for the old ggsize.'
  - 'SC-04 (both): title ''bar-stacked · letsplot · anyplot.ai'' lacks the language
    segment → ''bar-stacked · python · letsplot · anyplot.ai''. Likely cause: the
    labs(title=...) string.'
  - 'DE-02 (both): four-sided panel frame → L-shaped frame, left and bottom only.
    Likely cause: lets-plot''s default panel_border left on.'
  - 'CQ-01 (code): the data block (line 26) is not closed by a # Plot marker, column
    names are typed inline with no role constants, and IMPRINT lists 4 of 8 positions
    → column constants with # role comments above a # Data … # Plot block and the
    full Imprint list. Likely cause: the script predates the adaptable-code layout.'
  - 'Suggestion: total labels above each stack (the Notes allow them) would put the
    quarter totals in numbers.'
