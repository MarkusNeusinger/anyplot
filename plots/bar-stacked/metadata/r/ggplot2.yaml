      Data: Six stacked bars (Jan-Jun), each with four segments bottom-to-top: Support (ochre/brown), Marketing (blue), Sales (lavender/purple), Engineering (green, #009E73 — first categorical series as required). Thin background-colored borders separate segments cleanly. Total value labels ($285K-$312K) sit just above each bar top, dark text, no overlap with bars or gridlines.
      Legibility verdict: PASS — all text is clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17, not pure black and not light.
