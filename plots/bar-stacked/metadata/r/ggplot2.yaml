review:
  strengths:
  - Correct stacked bar chart via geom_col(position="stack") with a consistent department
    stacking order (Engineering top to Support bottom) across all six months, matching
    spec guidance on consistent ordering
  - 'Imprint palette applied correctly: the first stacked series (Engineering) is
    #009E73, remaining departments follow the canonical palette order (#C475FD, #4467A3,
    #BD8233)'
  - Total value labels above each bar ($285K–$312K) directly implement the spec's
    suggestion to show cumulative totals alongside individual components, giving a
    clear focal point
  - Both themes render correctly with warm off-white (#FAF8F1) / near-black (#1A1A17)
    backgrounds, fully legible chrome, and identical data colors between light and
    dark renders
  - 'Clean, reproducible code: set.seed(42), single geom_col + geom_text layer, correct
    ragg PNG save at the mandated 8x4.5in / 400dpi landscape canvas'
  weaknesses:
  - Design excellence is competent but not distinctive beyond the required Imprint
    palette and total-label addition — no further hierarchy device (e.g. muted non-focal
    months, in-segment value labels for large components) to sharpen the storytelling
  - 'Library mastery is fairly basic: relies on dollar()/label_dollar() formatting
    and a geom_text totals layer, both common techniques; could showcase more ggplot2-specific
    capabilities (e.g. position_stack(vjust = 0.5) for in-segment labels, or fine-tuned
    scale_x_discrete expansion) to demonstrate deeper mastery'
  - legend.background omits a border (color = NA) where the library guide's reference
    theme uses color = INK_SOFT for a subtle legend box outline — minor stylistic
    deviation, not a defect
