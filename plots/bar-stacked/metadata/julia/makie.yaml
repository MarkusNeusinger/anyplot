review:
  strengths:
  - Correct, idiomatic use of Makie's barplot! `stack` API for the stacked bar chart,
    with a clean shared theme-token setup that drives both light/dark renders from
    one file.
  - Total value labels rendered above each bar add a clear focal point without visual
    clutter, directly following the spec's 'consider adding total value labels above
    each complete stack' suggestion.
  - 'Both renders are fully legible: correct Imprint background/ink tokens, identical
    data colors between themes (first series #009E73 assigned to Solar), spines/grid/typography
    all theme-adaptive.'
  - Data is realistic (a grid generation-mix scenario) and internally consistent —
    the printed total labels (88, 86, 85, 85, 87, 89, 91, 92) exactly match the summed
    stack values.
  - Legend order (Solar / Wind / Natural Gas / Coal, top-to-bottom) mirrors the visual
    stack order top-to-bottom, making the color-to-segment mapping immediately intuitive.
  weaknesses:
  - Styling closely follows the mandated style-guide baseline (Imprint palette, spine
    removal, subtle single-axis grid) without much additional distinctive polish —
    nothing pushes it clearly past 'correct and clean' into 'sophisticated'.
  - Library-mastery-wise, only the standard `stack` kwarg on barplot! is demonstrated;
    no further Makie-distinctive touches (e.g. combining `dodge` with `stack`, a titled
    Legend, richer text! styling for the totals) are shown.
  - Bar width (0.62) leaves fairly generous gaps between bars; a touch tighter would
    read as a more cohesive 'stacked mass' per category, though this is a minor aesthetic
    preference, not a defect.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white, not dark.
      Chrome: Title "bar-stacked · julia · makie · anyplot.ai" in bold dark ink, centered top; "Month" x-axis label and "Electricity Generation (GWh)" y-axis label both dark and clearly legible; tick labels (Jan–Aug, 0/50/100) in a softer dark gray; unframed legend on the right (Solar, Wind, Natural Gas, Coal) in dark ink; top/right spines hidden, left/bottom spines a soft neutral gray; one subtle horizontal grid line at y=50.
      Data: Eight stacked bars (Jan–Aug), each built from four segments bottom-to-top: Coal (ochre #BD8233), Natural Gas (blue #4467A3), Wind (lavender #C475FD), Solar (green #009E73, first categorical series). Bold total labels (88, 86, 85, 85, 87, 89, 91, 92) sit just above each stack.
      Legibility verdict: PASS — all text is clearly readable against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black, not light.
      Chrome: Same title, axis labels, and tick labels now rendered in light ink/soft-gray tones against the dark background, fully legible; legend text is light-colored; spines and the single grid line at y=50 are a dim neutral tone, subtle but visible.
      Data: Same four-segment stack order (Coal, Natural Gas, Wind, Solar) with identical hex values to the light render — data colors do not shift between themes. Total labels (88, 86, 85, 85, 87, 89, 91, 92) are rendered in light ink and remain legible above each bar.
      Legibility verdict: PASS — no dark-on-dark failures; all chrome elements (title, axis labels, ticks, legend, total labels) are clearly visible against the near-black background.
