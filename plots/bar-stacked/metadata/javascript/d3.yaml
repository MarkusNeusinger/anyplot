review:
  strengths:
  - Correct Imprint palette in canonical order (Software=#009E73 brand green first,
    then lavender/blue/ochre), identical data colors across light and dark renders
  - Idiomatic d3.stack() + selection.join() data-join pattern, exactly the right d3-shape
    tool for a stacked bar chart
  - Bold total-value labels above each stack ($100M...$130M) directly implement the
    spec's 'consider adding total value labels' suggestion and add real storytelling
    value
  - All font sizes explicitly set; both renders fully legible with correct theme-adaptive
    chrome (ink/inkSoft/grid tokens threaded through axes, title, legend, labels)
  - Measured, centered legend built with getBBox() for pixel-accurate horizontal centering
    — no drift or overlap
  - Y-axis-only subtle gridlines, L-shaped spine (left+bottom kept, top/right absent),
    generous whitespace, white/bg stroke between stacked segments for definition
  - Realistic, neutral quarterly software-company revenue data with correct component
    ordering (largest component 'Software' consistently at the bottom of every bar)
  weaknesses:
  - Y-axis keeps its small per-tick line marks in addition to the full-width horizontal
    gridlines from the '.grid' group — redundant chrome; remove the y-axis's own tick
    line marks (mirror the `xAxis.selectAll('line').remove()` treatment already applied
    to the x-axis) so gridlines alone carry that role.
  - Design excellence is solid (measured legend, total labels, stroke separators)
    but conventional rather than exceptional — consider one more visual-hierarchy
    touch, e.g. lightly emphasizing the ~30% total revenue growth from 2023 Q1 to
    2024 Q2, to push data storytelling further.
  - After the length-based font-shrink formula, the title occupies only ~40-45% of
    the plot width, on the low end of the 50-70% comfortable range — not a violation,
    but there's headroom to size it slightly larger without risking overflow.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "Quarterly Revenue by Product Line · bar-stacked · javascript · d3 · anyplot.ai" centered at top in bold dark ink; horizontal legend (Software/Hardware/Services/Support) below the title, centered; Y-axis "Revenue ($M)" with $-formatted, unit-labeled ticks; X-axis "Quarter" with six quarter categories (2023 Q1 - 2024 Q2); subtle horizontal gridlines only. All chrome text renders in dark ink against the light background.
      Data: Six stacked bars, four segments each in Imprint order — Software (#009E73 green, bottom), Hardware (lavender), Services (blue), Support (ochre, top) — with a white stroke between segments for definition. Bold total-value labels ($100M ... $130M) sit above each stack.
      Legibility verdict: PASS — all title, axis, tick, legend, and data-label text is clearly readable against the light background; no overlap.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same layout as the light render — title, legend, axis labels, ticks, and total-value labels are all re-rendered in light ink (white/near-white) against the dark background. Gridlines remain subtle and visible.
      Data: Identical stacked-bar structure and identical segment colors to the light render (Software green, Hardware lavender, Services blue, Support ochre) — confirming data colors are constant across themes; only chrome flips. The white/pageBg stroke between segments becomes a dark-colored separator in this theme, still providing clean segment definition against the bright fills.
      Legibility verdict: PASS — no dark-on-dark failures; every text element (title, axis labels, ticks, legend, total labels) is clearly legible against the dark background.
