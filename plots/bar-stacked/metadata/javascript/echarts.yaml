      Data: Six bars, each stacked bottom-to-top as Subscriptions (green #009E73), Software (lavender), Services (blue), Hardware (ochre) — consistent order across all bars. A bold dark total-value label (150, 164, 170, 187, 198, 218) sits above each stack.
      Legibility verdict: PASS — all text is clearly readable against the light background.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Title, legend, y-axis label, and tick labels all render in light/white ink, all clearly visible against the dark background — no dark-on-dark failures observed. Gridlines and axis line remain subtle but visible.
      Data: Same four-color stack order and hues as the light render (green/lavender/blue/ochre) — confirmed identical data colors, only chrome (background, text) flipped. Total-value labels above each stack are rendered in light ink and remain fully legible.
      Legibility verdict: PASS — all text is clearly readable against the dark background, no dark-on-dark issues.
