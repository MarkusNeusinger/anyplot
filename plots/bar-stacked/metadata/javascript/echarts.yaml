review:
  strengths:
  - 'Correct Imprint palette in canonical order, first series #009E73, and data colors
    are pixel-identical between light and dark renders — only chrome flips.'
  - 'Genuine storytelling: total-value labels above each stack, a dashed average-total
    reference line (via markLine), and a callout highlighting Subscriptions'' +150%
    growth give the viewer an immediate insight beyond raw composition.'
  - All font sizes explicitly set, including a title formula that scales to the mandated
    string length — both renders are fully legible with no overflow or theme-adaptation
    failures.
  - 'Idiomatic ECharts usage: stack config, markLine for the reference line, a conditional
    per-bar label formatter, and rounded top corners on the topmost segment for polish.'
  - Deterministic, realistic SaaS revenue dataset with plausible scale and clearly
    differentiated trends across all four components (Subscriptions accelerating,
    Hardware roughly flat).
  weaknesses:
  - 'The ''Avg total: $181K'' markLine label (position: insideEndTop) sits partially
    over the June bar''s amber Hardware segment, causing minor text/data overlap —
    move it further right of the last category or drop it to a lower z-position relative
    to the tallest bar.'
  - Design is strong but stops short of publication-level distinctiveness — the chart
    is still a fairly conventional stacked bar with two thoughtful additions; a more
    differentiated typographic hierarchy between title and legend would push it further.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "Monthly SaaS Revenue by Product Line · bar-stacked · javascript · echarts · anyplot.ai" centered at top in dark ink, clearly readable. Legend (Subscriptions, Software, Services, Hardware) below the title with color swatches, readable. Y-axis titled "Revenue ($K)" with dark-grey tick labels (0-250). X-axis month labels (Jan-Jun) in dark grey. Subtle horizontal gridlines only, no vertical gridlines, axis spines minimal.
      Data: Six stacked bars (Jan-Jun), four components each: Subscriptions (#009E73 green, bottom), Software (light purple/magenta), Services (blue), Hardware (ochre/amber, top). Total value labels (150, 164, 170, 187, 198, 218) sit above each bar. A dashed reference line marks the average total ($181K) with a label near the June bar. A white "+150%" callout is shown inside the Subscriptions segment of the June bar.
      Legibility verdict: PASS. All title, legend, and axis text is clearly readable against the light background. Minor note: the "Avg total: $181K" label partially overlaps the amber Hardware segment of the June bar but text remains legible (grey text still discernible against the amber fill).

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title, legend, and axis structure as the light render, now rendered in light/white text against the dark background. Gridlines are subtle light-grey. No dark-on-dark issues found — every label (title, legend, axis ticks, axis title, total labels, avg-line label) is clearly legible.
      Data: Identical stacked-bar composition and colors to the light render — Subscriptions green (#009E73), Software purple, Services blue, Hardware ochre are pixel-identical to the light version; only the chrome (background/text/grid) flipped to the dark theme. Same total labels, same dashed average line, same "+150%" callout in white bold text on the green segment.
      Legibility verdict: PASS. No dark-on-dark or light-on-light failures observed. Data colors confirmed identical to the light render.
