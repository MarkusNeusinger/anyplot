review:
  strengths:
  - Correct canonical Imprint palette order (green → lavender → blue → ochre), byte-identical
    between light and dark renders, with a thoughtful ordering rationale (largest/most-volatile
    service first onto brand green)
  - Theme-adaptive chrome is fully correct in both renders — warm off-white (#FAF8F1)
    and warm near-black (#1A1A17) backgrounds, all title/axis/tick/legend text legible
    with no dark-on-dark or light-on-light failures
  - 'Clean, well-proportioned layout: mandated title format plus a genuinely useful
    narrative subtitle ("Compute spend nearly doubles by June..."), legend placed
    close to the chart with generous whitespace, subtle single-axis horizontal grid'
  - Deterministic, realistic cloud-spend dataset (3-10 categories, 2-6 components
    both satisfied) with a consistent stacking order across all 6 months and plausible,
    factually sensible values
  weaknesses:
  - The <TotalLabels /> overlay (SVG '$XXK' text meant to sit above each stack, per
    the spec's 'Consider adding total value labels' note) never appears in either
    render. Verified by cropping close-ups above both the tallest bar (Jun, total=$120K,
    zero headroom) and a mid-height bar (Jan, total=$82K, ~30% headroom above it)
    in both plot-light.png and plot-dark.png — no text is visible anywhere above any
    bar in either theme. This is dead code; either make it render or remove it rather
    than shipping a non-functional feature.
  - 'Likely contributing cause: the yAxis[0].max prop (set to 140 for label headroom)
    is not taking effect — the rendered y-axis tops out at exactly 120, the raw data
    max, with the Jun bar flush against the top of the plot area. But since even bars
    with ample natural headroom (Jan) also show no label, the <TotalLabels/> children
    component (using useXScale/useYScale) likely isn''t rendering at all, not just
    mispositioned — check whether this version of @mui/x-charts BarChart requires
    a different pattern for custom SVG children, or whether the hooks silently return
    unusable scales before series data is ready.'
  - 'DE-01/DE-02 stop short of ''publication-ready'': the palette and layout are solid
    but rely on the standard Imprint categorical order and mostly-standard MUI X chrome
    (axis lines still visible in both themes) rather than deeper custom refinement.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Title "Cloud Costs by Service · bar-stacked · javascript · muix · anyplot.ai" in dark ink, subtitle in softer gray-ink below it, both clearly readable. Y-axis label "Spend ($K)" and x-axis label "Month" in dark ink, tick labels in softer gray, all legible. Horizontal grid lines are thin and subtle, not competing with data. Legend at right (Compute/Storage/Networking/Database) in soft gray text, readable box-free.
      Data: 6 stacked bars (Jan-Jun), 4 segments each. Bottom-to-top: Compute (brand green #009E73), Storage (lavender), Networking (blue), Database (ochre) — consistent stacking order across all bars. Bar edges have a subtle light stroke separating segments. No "$XXK" total labels are visible above any bar despite the code containing a TotalLabels component intended to render them.
      Legibility verdict: PASS (all chrome text readable; the missing total labels are a functional/code bug, not a legibility failure).

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Title and subtitle rendered in light ink (near-white / soft gray), clearly readable against the dark background — no dark-on-dark failures. Axis labels and tick labels are light-colored and legible. Grid lines are faint but visible. Legend text is light gray, readable.
      Data: Same 4-segment stack order and identical hues as the light render — Compute (#009E73 green), Storage (lavender), Networking (blue), Database (ochre) — confirming data colors are theme-independent; only chrome flipped. Bar segment edges use the dark page background as the separating stroke, consistent with the light render's technique. Same absence of "$XXK" total labels above any bar.
      Legibility verdict: PASS (no dark-on-dark issues; same missing-labels bug as light render).
