review:
  strengths:
  - 'Native MUI X stacking (stack: "total" on every series) with the stack order computed
    from the data: the largest service overall (Compute) sits at the bottom of every
    bar, so the same order holds across all six months'
  - Total labels are a custom SVG layer composed as a BarChart child with useXScale/useYScale,
    so each label sits exactly above its stack and equals the sum of its segments
    (82, 88, 94, 100, 109, 120 checked against the data)
  - Colours keep their palette position by first appearance even after the stack reorder,
    the y domain is derived from the data (maxTotal × 1.1) on a zero baseline, and
    categoryGapRatio 0.4 gives even gaps between bars of one width
  - A computed subtitle (stack total 82 → 120, +46 %; fastest growth Compute +53 %)
    adds a typographic hierarchy below the title, every number falling out of the
    data
  - Thin elevatedBg segment strokes separate neighbouring segments in both themes;
    ticks disabled and a subtle horizontal grid keep the chrome quiet; tooltips and
    legend highlighting work in the HTML output
  weaknesses:
  - 'Suggestion: the x-axis band (height: 64) leaves a wide gap between the month
    ticks and the ''Month'' title; a band of about 48 px would tie the title to its
    axis.'
  - 'Suggestion: the header still names muix 7.29.1 although the harness pins @mui/x-charts
    9; the workflow rewrites the header, but the source could state the version it
    targets.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole canvas, no white panel.
      Chrome: bold dark title "Cloud Costs by Service · bar-stacked · javascript · muix · anyplot.ai" top left (~45 % of width), soft-ink subtitle below it, centred horizontal legend (Compute, Database, Storage, Networking), y axis "Spend (thousand USD)" 0–130 in steps of 10, x axis months Jan–Jun with title "Month"; subtle light grid lines; all text dark and readable.
      Data: six stacked bars, Compute #009E73 at the bottom, then Database (purple), Storage (blue), Networking (ochre) in the same order in every bar, thin light separators between segments; bold total labels 82, 88, 94, 100, 109, 120 above each stack, none colliding.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, subtitle, legend text, axis titles and tick labels all flip to light ink and read clearly; grid lines subtle dark grey but visible; no dark-on-dark text.
      Data: segment colours identical to the light render (green, purple, blue, ochre), separators now dark; total labels in light ink above each stack, readable.
      Legibility verdict: PASS
