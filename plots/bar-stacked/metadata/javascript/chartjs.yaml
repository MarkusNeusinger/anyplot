review:
  strengths:
  - 'Correct Imprint palette order (Solar #009E73, Wind #C475FD, Hydro #4467A3, Natural
    Gas #BD8233) with identical data colors between light and dark renders — only
    chrome flips'
  - Custom Chart.js plugin (afterDatasetsDraw) adds total-value labels above each
    stack, directly answering the spec's suggestion to show cumulative totals
  - categoryPercentage/barPercentage tuned (0.8/0.6) for adequate bar spacing, plus
    a subtle page-bg border on each segment for clean part-to-whole separation
  - Deterministic, realistic dataset (monthly energy mix, GWh) with a genuine narrative
    — solar rising while natural gas falls — that reinforces the stacked-bar composition
    story
  - Y-axis-only grid, theme-adaptive ink/inkSoft/grid tokens threaded through title,
    legend, ticks and axis titles in both themes
  weaknesses:
  - Title spans only ~28% of the 3200px canvas width, well under the 50-70% guideline
    range — a slightly larger title font (e.g. 26-28px instead of 22px) would give
    it more visual presence given the available width
  - 'Design excellence is solid but conservative: no additional visual-hierarchy device
    (e.g. a callout marking the April crossover where renewables overtake gas) beyond
    the total labels — optional polish, not required'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "bar-stacked · javascript · chartjs · anyplot.ai" in bold dark ink, clearly visible; legend (Solar/Wind/Hydro/Natural Gas) in dark text at top; x-axis "Month" and y-axis "Energy Consumption (GWh)" titles in dark ink; tick labels in a slightly softer dark gray; subtle horizontal gridlines on the y-axis only (no x-axis grid). Bold total-value labels ("145 GWh" ... "120 GWh") sit above each stack, fully readable against the light background.
      Data: Four stacked segments per bar — Solar (green #009E73) at the base, then Wind (lavender), Hydro (blue), Natural Gas (ochre) on top, in consistent order across all six months. Thin light-colored borders separate segments for definition.
      Legibility verdict: PASS — no light-on-light or illegible text anywhere.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title, legend, and axis titles now rendered in light/white ink against the dark background; tick labels in a lighter soft gray; gridlines remain subtle and visible. Total-value labels are white and clearly legible above each stack.
      Data: Colors are pixel-identical to the light render (Solar green, Wind lavender, Hydro blue, Natural Gas ochre) — only the chrome (background, text, grid) flipped to the dark palette, as required.
      Legibility verdict: PASS — no dark-on-dark failures; all title/axis/tick/legend text is clearly readable against the near-black background.
