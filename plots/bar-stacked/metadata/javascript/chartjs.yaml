review:
  strengths:
  - 'Correct Imprint palette order (Solar #009E73, Wind #C475FD, Hydro #4467A3, Natural
    Gas #BD8233) with identical data colors between light and dark renders — only
    chrome flips'
  - Custom Chart.js plugin (afterDatasetsDraw) adds total-value labels above each
    stack, directly answering the spec's suggestion to show cumulative totals
  - categoryPercentage/barPercentage tuned (0.8/0.6) for adequate bar spacing, plus
    a subtle page-bg border on each segment for clean part-to-whole separation
  - Deterministic, realistic dataset (monthly energy mix, GWh) with a genuine narrative
    — solar rising while natural gas falls — that reinforces the stacked-bar composition
    story
  - Y-axis-only grid, theme-adaptive ink/inkSoft/grid tokens threaded through title,
    legend, ticks and axis titles in both themes
  weaknesses:
  - Title still spans only ~35% of the 3200px canvas width even after the repair bumped
    the font from 22px to 27px — well under the ~70-85% expected for the long mandated
    title string. A further bump (e.g. to ~34-36px) would close the gap without risking
    overflow.
  - 'Design excellence is solid but conservative: no additional visual-hierarchy device
    (e.g. a callout marking the April crossover where renewables overtake gas) beyond
    the total labels — optional polish, not required'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Bold dark-ink title "bar-stacked · javascript · chartjs · anyplot.ai" clearly visible at the top (now 27px after the repair, up from 22px), with a top legend row (Solar/Wind/Hydro/Natural Gas swatches + labels) and dark-ink axis titles ("Month", "Energy Consumption (GWh)"). Subtle y-axis-only gridlines, no x-axis grid. Tick labels in a softer ink tone, all legible.
      Data: Four stacked segments per bar in canonical Imprint order — Solar (#009E73 green) at the base, then Wind (lavender), Hydro (blue), Natural Gas (ochre) on top — consistent across all six months (Jan-Jun), each with a thin page-bg border separating segments. Bold total-value labels ("145 GWh" ... "120 GWh") sit above each stack with comfortable clearance from the 180 GWh gridline.
      Legibility verdict: PASS — all text readable, no overlap, no edge clipping.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title/legend/axis titles now render in light ink (#F0EFE8-equivalent), tick labels in soft light gray, gridlines remain subtle at the same low opacity. Total-value labels are light-colored and fully legible against the dark surface.
      Data: Solar green, Wind lavender, Hydro blue, Natural Gas ochre are pixel-identical to the light render — only chrome (background, text, grid) flipped, as required. No dark-on-dark failures on any text element.
      Legibility verdict: PASS — all text readable, no overlap, no edge clipping.

    Both renders pass the theme-readability check; the repair's title-font increase (22px -> 27px) is confirmed visually but the title still under-fills the guideline width proportion (see weaknesses).
