review:
  strengths:
  - 'Color-to-category mapping is intentional, not just ordinal: Solar=brand green,
    Natural Gas=ochre (''earth/commodity'' per the style guide), Coal=matte red (semantic
    ''bad/decline'' anchor) — canonical Imprint order and real-world semantics line
    up perfectly.'
  - Uses Highcharts' native stackLabels to show the total above each bar (412, 398,
    387, 381, 374, 374 TWh) — a genuinely library-specific feature that directly answers
    the spec's 'consider adding total value labels above each complete stack' note.
  - Component order (Solar, Wind, Hydro, Natural Gas, Coal) is identical across all
    six bars, satisfying the spec's consistent-ordering requirement.
  - Data tells a coherent, realistic energy-transition story (solar/wind rising, coal
    declining, gas easing, hydro flat) that is plausible and non-controversial.
  - 'Clean chrome: borderWidth 0 with a subtle borderRadius on segments, transparent
    chart background showing the page token through, subtle single-axis gridlines
    — no unnecessary framing.'
  - 'Both renders pass the theme-readability check: warm off-white / near-black backgrounds,
    all text legible, data colors identical between light and dark.'
  weaknesses:
  - Title sits around ~30% of plot width at fontsize 22px — comfortably readable but
    on the small side relative to the 50-70% guideline; a couple of points larger
    would give it more presence without risking overflow.
  - Data storytelling relies solely on the stack labels for narrative; no explicit
    visual emphasis (e.g. callout/annotation on the 2024 crossover where fossil sources
    fall below renewables) to guide the eye to the most interesting trend in the data.
  - Legend swatches and stack composition are clear, but nothing distinguishes Coal/Natural
    Gas (declining, fossil) from Solar/Wind/Hydro (rising/stable, non-fossil) beyond
    color — an optional grouping cue (e.g. subtitle callout) could sharpen the 'part-to-whole'
    + 'trend' story further.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "bar-stacked · javascript · highcharts · anyplot.ai" in bold dark ink, subtitle "Electricity generation mix by source (TWh)" in soft gray beneath it, both clearly legible. X-axis "Year" with 2019-2024 category labels, y-axis "Generation (TWh)" with 0-450 gridded ticks, all in soft dark-gray ink against the light background. Subtle horizontal gridlines. Legend centered below the plot with 5 circular swatches: Solar, Wind, Hydro, Natural Gas, Coal.
      Data: Six stacked columns (one per year), each with 5 segments bottom-to-top: Coal (matte red), Natural Gas (ochre/gold), Hydro (slate blue), Wind (lavender/purple), Solar (brand green #009E73, first legend entry). Total value label (e.g. "412", "374") printed above each bar. Coal and Natural Gas segments visibly shrink 2019→2024 while Solar and Wind segments grow, communicating the generation-mix shift.
      Legibility verdict: PASS — all text is dark-on-light and clearly readable, no overlap between labels, stack labels, or the legend.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Same title and subtitle now rendered in white/light-gray ink, clearly visible against the dark surface. Axis titles and tick labels switch to light-gray ink. Gridlines are faint but visible. Legend renders identically in layout, with light-gray text labels.
      Data: Segment colors are pixel-identical to the light render (brand green Solar, lavender Wind, blue Hydro, ochre Natural Gas, matte-red Coal) — only the chrome (background, text, gridlines) flipped, as required. Total value labels above each bar remain legible in light-gray against the dark background.
      Legibility verdict: PASS — no dark-on-dark failures; all chrome text and stack-total labels are clearly visible against the near-black surface.
