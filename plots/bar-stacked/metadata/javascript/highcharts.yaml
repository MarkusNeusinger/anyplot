review:
  strengths:
  - 'Palette compliance is exact: first series is brand green #009E73, remaining components
    follow canonical Imprint order, and data colors are pixel-identical between the
    light and dark renders — only chrome flips.'
  - Stack labels (412, 398, 387, 381, 374, 374) implement the spec's suggested 'total
    value labels above each complete stack' feature via Highcharts' native stackLabels,
    not a faked annotation.
  - Component stacking order (Coal at the base rising through Natural Gas, Hydro,
    Wind, to Solar at the top) is consistent across every bar and, combined with the
    chosen data trend, tells a coherent fossil-to-renewable transition story across
    2019-2024.
  - Theme-adaptive chrome is threaded correctly through every non-data element (title,
    subtitle, axis titles, tick labels, gridlines, legend, stack-label text) — both
    renders pass the theme-readability check with no dark-on-dark or light-on-light
    failures.
  - 'Data is realistic and neutral: a plausible national electricity generation mix
    in TWh with sensible magnitudes and a directionally coherent trend (declining
    coal/gas, rising solar/wind).'
  - 'Idiomatic, harness-correct Highcharts usage: chart + series animation disabled,
    no explicit width/height (auto-sizes to mount), credits disabled, no forbidden
    add-on modules.'
  weaknesses:
  - 'Design Excellence is largely default: beyond stackLabels and a 2px bar corner
    radius, there is no distinctive visual treatment (e.g. an annotation or emphasis
    callout drawing the eye to the coal-to-solar crossover) that would elevate this
    above a competent baseline chart.'
  - Grid and chrome styling rely entirely on library defaults (single subtle y-axis
    grid, no additional refinement like a highlighted current-year column or muted
    secondary years) — there's room for more intentional visual hierarchy per DE-02/DE-03.
  - X-axis label 'Year' and legend are functionally minimal; consider a brief axis
    subtitle or annotation reinforcing the transition narrative implied by the data,
    since currently only the subtitle text communicates topic context.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Bold dark title "bar-stacked · javascript · highcharts · anyplot.ai" centered at top; grey subtitle "Electricity generation mix by source (TWh)" beneath it; dark-grey Y-axis title "Generation (TWh)" and X-axis title "Year"; grey tick labels on both axes; subtle horizontal gridlines; grey stack-total labels (412, 398, 387, 381, 374, 374) above each bar; bottom legend with colored dot markers for Solar/Wind/Hydro/Natural Gas/Coal. All text is clearly legible against the light background — no light-on-light issues.
      Data: Six stacked column groups (2019-2024), each composed of five segments bottom-to-top: matte red (Coal), ochre (Natural Gas), blue (Hydro), lavender (Wind), brand green (Solar). First series (Solar) is #009E73 as required. Coal segment visibly shrinks year over year while Solar and Wind segments grow, and total bar height gently declines from 412 to 374.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Same title/subtitle/axis-title/tick-label/legend layout, now rendered in light grey/off-white text against the dark background; gridlines are faint light lines; stack-total labels render in light grey and are clearly visible above each bar.
      Data: Identical five-color segment stack and identical color hex values to the light render (Coal red, Natural Gas ochre, Hydro blue, Wind lavender, Solar green) — confirms data colors are constant across themes and only chrome flipped.
      Legibility verdict: PASS — no dark-on-dark failures observed; all title, axis, tick, legend, and stack-label text reads clearly against the near-black surface.
