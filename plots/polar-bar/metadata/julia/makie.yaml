review:
  strengths:
  - Compass orientation is mathematically correct (N up, clockwise through E/S/W)
    and the prevailing SW-W wind pattern reads immediately from bar length alone
  - Curved outer arc edges on each stacked wedge (sampled along 24 points) give the
    bars a natural wind-rose silhouette instead of flat-edged pie sectors
  - Stroke color set to the page background cleanly separates the three stacked speed
    bands without adding a competing outline color
  - Data colors are pixel-identical between light and dark renders; only chrome (background,
    grid, text) flips as required
  - Radial tick labels are rotated to run along their spoke and placed in the empty
    N-NE gap, keeping their tangential footprint narrow near the center
  - Clean KISS script structure with explicit seed, only used imports, and no fake
    interactive elements
  weaknesses:
  - 'Library Mastery gap: the polar geometry (grid circles, spokes, wedges) is built
    entirely by hand with sin/cos loops on a plain Cartesian Axis + DataAspect, instead
    of using Makie''s native PolarAxis (available since Makie 0.19) which is the library''s
    dedicated, idiomatic tool for exactly this wind-rose/polar-bar chart type — a
    missed opportunity to showcase a distinctive Makie feature and would also simplify
    the code'
  - Radial tick labels ('26h','52h','78h','104h') at fontsize=11 are noticeably smaller/thinner
    than the compass direction labels at fontsize=16, creating a mild size imbalance
    between the two label families — consider bumping to ~13-14 for better visual
    parity
  - Legend sits alone in the empty NE/E/SE quadrant with a large amount of surrounding
    whitespace; this is a reasonable wind-rose convention to avoid covering data,
    but pulling it slightly closer to the plot center would tighten the composition
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1, not pure white.
      Chrome: Title "polar-bar · julia · makie · anyplot.ai" in bold dark ink at top, comfortably sized (~35% of canvas width). Compass labels N/NE/E/SE/S/SW/W/NW in dark ink around the outer ring, all clearly legible. Radial tick labels ("26h","52h","78h","104h") in soft gray, rotated along their spoke, sitting in the empty gap between the N and NE bars. Thin gray radial grid circles and compass spokes are subtle but visible. Legend ("Light (0-10 kn)", "Moderate (10-20 kn)", "Strong (20-30 kn)") sits unframed in the empty SE quadrant with dark labels.
      Data: Eight direction wedges, each stacked from center outward in green (#009E73, Light), lavender (#C475FD, Moderate), and blue (#4467A3, Strong), with a thin background-colored stroke separating segments. Bars are visibly longest in the SW/W/NW quadrant (prevailing wind) and shortest in the NE/E quadrant.
      Legibility verdict: PASS — all title, compass, tick, and legend text is clearly readable against the light background; no clipping at any canvas edge (checked top, left, bottom-left, and legend corners via pixel crops).

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17, not pure black.
      Chrome: Title now rendered in light ink (#F0EFE8), fully legible. Compass labels flip to light text. Radial tick labels flip to light gray (#B8B7B0), still legible against the dark background — no dark-on-dark failure observed. Grid circles/spokes remain subtle. Legend text flips to light ink, still unframed and legible.
      Data: Identical green/lavender/blue wedge colors and identical wedge geometry to the light render — only the chrome (background, text, grid) changed color, confirming data colors are theme-independent as required.
      Legibility verdict: PASS — no dark-on-dark or light-on-light failures found in either theme.
