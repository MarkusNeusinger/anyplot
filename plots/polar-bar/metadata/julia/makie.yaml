review:
  strengths:
  - Uses native CairoMakie PolarAxis with band! for true curved-arc stacked wedges
    instead of hand-rolled sin/cos polygon math — idiomatic, distinctive Makie usage.
  - Imprint palette applied in correct canonical order across the stack (Light=#009E73
    innermost/first series, Moderate=#C475FD, Strong=#4467A3), identical across both
    themes.
  - Theme-adaptive chrome (background, ink, ink-soft, grid alpha) correctly threaded
    through PolarAxis kwargs — both renders are readable and theme-correct.
  - 'Realistic, well-constructed wind-rose dataset: prevailing SW/W quadrant pattern
    via a cosine model, three sensible speed bins, natural per-direction variation
    via seeded randomness.'
  - Clean KISS script structure with explicit font sizes, seeded RNG, and correct
    plot-light/plot-dark output naming.
  weaknesses:
  - 'Manual legend rows (drawn via scatter!+text! at decreasing radii along legend_theta=100°)
    are spaced too tightly: the ''Moderate'' swatch overlaps the ''(20-30 kn)'' text
    of the ''Strong'' row above it, and the ''Light'' swatch overlaps the tail of
    the ''Moderate'' row''s text — real character-level occlusion, not just crowding.
    Increase the radial gap between legend_radii entries (or switch to a fixed pixel
    line-height via stacked offset= values) so each row''s text bounding box clears
    the swatch above/below it.'
  - The r-axis '26h' tick label (rtickangle = sector_rad/2, positioned in the N-NE
    gap) sits right against the NE direction bar's outer (Strong/blue) segment — the
    label's trailing character touches the bar's stroke outline. Nudge the tick label
    radius/angle slightly further from the first non-zero radial ring, or shrink rticklabelsize
    further, so it clears the NE wedge with a visible gap in both themes.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "polar-bar · julia · makie · anyplot.ai" centered at top in dark ink, fully visible with margin. Compass ticks (N, NE, E, SE, S, SW, W, NW) in dark ink around the rim. Radial hour-ticks (26h/52h/78h/104h) in soft grey, subtle radial/angular gridlines at ~15% opacity. All chrome text clearly readable against the light background.
      Data: Eight stacked wedges (one per compass direction), inner segment green (#009E73, "Light"), middle segment lavender (#C475FD, "Moderate"), outer segment blue (#4467A3, "Strong"), thin white divider lines between segments. Prevailing wind clearly visible as the longest bars in the SW/W quadrant. Manual legend (three swatch+text rows) sits in the empty NE/E gap.
      Legibility verdict: FAIL (partial) — legend rows overlap: the "Moderate" swatch is drawn on top of "(20-30 kn)" from the "Strong" row above, and "Light"'s swatch overlaps the tail of the "Moderate" row's text. All other text (title, compass ticks, radial ticks) is fully readable; the "26h" radial tick also sits flush against the NE bar's blue segment.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title and compass/radial ticks now rendered in light ink (#F0EFE8) / soft light grey (#B8B7B0), fully legible against the dark background — no dark-on-dark failures observed. Gridlines remain subtle.
      Data: Identical data colors to the light render (#009E73 / #C475FD / #4467A3 stack, white dividers) — confirms the "chrome only" theme rule was followed.
      Legibility verdict: FAIL (partial) — same legend overlap issue reproduces identically (it's a geometry bug independent of theme), and the "26h" tick again sits against the NE bar's blue segment. All other text is readable and correctly theme-adapted.
