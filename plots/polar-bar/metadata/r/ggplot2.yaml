review:
  strengths:
  - 'Canvas utilization is fixed from attempt 1: the wind-rose wedges now extend most
    of the way to the outer gridline, filling the square canvas convincingly instead
    of floating as a small disconnected shape.'
  - position_stack(reverse = TRUE) is a smart, well-commented fix that keeps the thin
    high-speed bins (15-20 kt, 20+ kt) visible at every direction by giving them the
    larger outer radius instead of collapsing them near the center.
  - Faint theme-adaptive radial grid (panel.grid.major using INK_SOFT) now gives the
    0%/5%/10% labels a visual reference circle in both renders.
  - 'Correct plot type: true polar stacked bar / wind rose via coord_polar(theta =
    "x") + geom_col, covering all 16 compass directions and 5 stacked wind-speed bins
    per the spec.'
  - 'Palette compliance: first (and largest) series is exactly #009E73, remaining
    series follow canonical Imprint order, identical across both renders.'
  - Theme-adaptive chrome works correctly in both renders — no dark-on-dark or light-on-light
    failures; PAGE_BG-colored bar strokes correctly flip between light and dark.
  - Realistic, neutral meteorological scenario (prevailing westerlies) with a clear,
    plausible directional and speed distribution.
  - Clean, reproducible, idiomatic KISS-structured R script with only the libraries
    it actually uses.
  weaknesses:
  - The 0%/5%/10% radial axis labels cluster together right along the W spoke (a ggplot2
    coord_polar quirk where the y-axis text follows the pre-transform vertical), sitting
    close to the 'W' compass label itself — slightly crowds that corner even though
    no text actually overlaps.
  - The lightest-frequency directions (NE, ENE, E) still render very thin wedges where
    the individual speed-bin segments are only a few pixels tall; readable when zoomed
    but easy to miss at a glance.
  - Design excellence is solid but not yet distinctive beyond the reverse-stack trick
    — no additional polish (e.g. subtle radial fade, annotated compass rose convention)
    that would push it further above a well-executed default.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "polar-bar · r · ggplot2 · anyplot.ai" is dark ink, centered, fully legible. All 16 compass-direction labels (N, NNE, NE, ... NNW) render in medium-grey ink and are readable. A faint radial grid (0%/5%/10% rings) is now visible, anchoring the axis labels which sit along the W spoke. The "Wind speed" legend at the bottom is correct with 5 labeled swatches.
      Data: Stacked wedges (green/lavender/blue/ochre/red, in that Imprint order) radiate from the center and now extend most of the way to the outer ring — a clear improvement over attempt 1's under-filled rose. The prevailing-westerly weighting (large SW/WSW/W wedges, small N/NE/ENE) is obvious. Thanks to reverse stacking, the higher-speed bins (ochre, red) sit on the outside and remain visible even for small directions. First series is #009E73.
      Legibility verdict: PASS — all text is readable against the light background, no clipping at any canvas edge.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Title, compass labels, radial grid, tick labels, and legend all flip to light ink/grey and remain fully readable. No dark-on-dark failures observed anywhere, including the small-direction wedge outlines.
      Data: Wedge colors are identical to the light render (only chrome flipped) — confirmed same Imprint hex values, same stacking order, same relative proportions.
      Legibility verdict: PASS — all text is readable against the dark background, brand green remains clearly visible on both surfaces.
