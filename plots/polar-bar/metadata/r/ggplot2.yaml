review:
  strengths:
  - 'Correct plot type: a true polar stacked bar / wind rose using coord_polar(theta
    = "x") with geom_col, covering all 16 compass directions and 5 stacked wind-speed
    bins as called for in the spec notes.'
  - 'Palette compliance: first (and largest) series is exactly #009E73, remaining
    series follow the canonical Imprint order, and data colors are identical between
    the light and dark renders.'
  - 'Theme-adaptive chrome works correctly in both renders: warm off-white / near-black
    backgrounds, correct ink tokens for title, tick labels, and legend, no dark-on-dark
    or light-on-light failures.'
  - Title format matches exactly (`polar-bar · r · ggplot2 · anyplot.ai`), and the
    legend ("Wind speed", 5 correctly-labeled speed bins) is accurate.
  - Realistic, neutral meteorological scenario (prevailing westerlies weighted toward
    SW/W) that is factually plausible and clearly visible in the data.
  - 'Clean, reproducible, idiomatic KISS-structured R script: set.seed(42), no functions/classes,
    correct ragg::agg_png save target.'
  weaknesses:
  - 'Severe canvas under-utilization: the colored wind-rose wedges only span roughly
    30-35% of the plot''s diameter (~8-10% of canvas area), while the compass-direction
    labels (N, NNE, NE, ...) sit on a much larger implied ring far outside the actual
    bars. This leaves a large disconnected band of empty space between the data and
    its own axis labels, making the chart look tiny and adrift inside the square canvas.
    Fix by reducing scale_y_continuous''s expansion / axis.text.x margin so the direction
    labels sit closer to the bars, and/or increasing geom_col width or figure scale
    so the rose itself occupies 50-80% of the canvas per the style guide.'
  - No radial grid rings are drawn (panel.grid.major/minor are element_blank()), so
    the '0%/5%/10%' frequency labels float without any visual reference circle to
    read bar length against — for a polar/radial chart the concentric gridlines are
    the primary way readers gauge magnitude. Add faint theme-adaptive panel.grid.major
    (e.g. INK at low alpha via a light color, since ggplot2 grid lines don't support
    alpha directly) so the percentage rings are visible in both themes.
  - The two highest wind-speed categories (15-20 kt, 20+ kt) are stacked innermost
    and are reduced to razor-thin or near-invisible slivers near the center in both
    renders, hurting readability of the least-common-but-notable categories.
  - 'Design excellence is capped by the layout problem above: the plot currently reads
    as a well-configured default rather than a polished, publication-ready wind rose
    despite the correct technique choice (coord_polar) and correct palette.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "polar-bar · r · ggplot2 · anyplot.ai" is dark and clearly legible at top center. The 16 compass-direction labels (N, NNE, NE, ENE, E, ESE, SE, SSE, S, SSW, SW, WSW, W, WNW, NW, NNW) are rendered in medium-grey ink around a large implied circle, all readable. Radial "0%/5%/10%" labels appear as a small stacked column near the upper-left, disconnected from any visible grid ring since panel gridlines are turned off. The "Wind speed" legend sits centered at the bottom with 5 correctly labeled color swatches.
      Data: The colored wind-rose wedges (green #009E73 = 0-5kt, lavender = 5-10kt, blue = 10-15kt, ochre = 15-20kt, red = 20+kt, stacked outward per direction) occupy only a small circle roughly a third of the available radius, off-set toward the lower-middle of the canvas, clearly showing the intended prevailing-westerly pattern (largest wedges toward SW/WSW/W, smallest toward N/NE). The innermost ochre and red segments are extremely thin, close to invisible at this scale.
      Legibility verdict: PASS for all text (title, compass labels, legend); the radial % labels are technically legible but functionally confusing because there is no grid ring to anchor them to.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Title and all compass-direction labels flip to light ink/grey and remain fully readable against the dark background. Legend text and swatches also read correctly with light text. No dark-on-dark failures observed anywhere.
      Data: Same wedge colors and same small off-center rose as the light render — data hues (#009E73, lavender, blue, ochre, red) are identical between the two renders, confirming only chrome changed with theme. Same thin, near-invisible innermost ochre/red segments.
      Legibility verdict: PASS — no dark-on-dark or light-on-light text failures; same layout/proportion weakness as the light render (tiny rose disconnected from its own compass-label ring).
