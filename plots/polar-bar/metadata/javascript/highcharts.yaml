review:
  strengths:
  - 'Creative, honest workaround for the core-only Highcharts bundle: wedges are drawn
    with the actual renderer.symbols.arc primitive (the same one Highcharts itself
    uses for pie/donut slices), and a hidden scatter series is bound at each wedge''s
    true centroid so hover tooltips report real data over the exact rendered geometry,
    not a simulation.'
  - 'Correct Imprint palette usage: first series (0-5 kt) is #009E73, remaining speed
    bins follow canonical order, and both light/dark renders keep identical data colors
    while chrome (background, text, grid) flips correctly.'
  - Clean concentric grid rings and well-placed compass/radial-scale labels with generous
    clearance from the wedges - no text overlap in either render.
  - The bimodal wind regime (dominant onshore SW gusty flow vs. lighter secondary
    NE land breeze) is a deliberate, documented data narrative rather than arbitrary
    numbers.
  weaknesses:
  - 'DQ-03: The FREQUENCY table sums to only ~73% across all 16 directions x 4 speed
    bins, but this is framed as ''% of hourly observations by direction x speed bin'',
    which should sum to ~100%. Rescale/nudge the values (especially the light-wind
    directions) so the full distribution adds up to roughly 100%.'
  - 'VQ-03: Several stacked segments use values as low as 0.1 against SCALE_MAX=13
    (e.g. the 15+ kt bin for N, E, ESE, SE, SSE, NNW), which render as near-invisible
    sub-pixel slivers. Raise the floor on these tiny bins (or the innermost SCALE_MAX)
    so all four speed bins stay visually distinguishable in every direction.'
  - 'VQ-05: The visible wedges are concentrated almost entirely in the N-through-SW
    arc, leaving the ENE-to-S sector of the polar canvas nearly empty. Since this
    mirrors real, intentional wind data it''s a minor deduction rather than a hard
    fail, but consider a slightly less extreme skew or a callout that explicitly frames
    the empty sector as the calm side of the rose.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 - not pure white.
      Chrome: Title "polar-bar · javascript · highcharts · anyplot.ai" in bold dark ink at top-center; 16 compass-point labels (N, NNE, NE, ... NNW) in bold dark ink ringing the outer edge of the polar plot; four radial scale labels (3%, 6%, 9%, 12%) in soft grey placed in the gap between N and NNE; a 4-item legend (0-5 kt, 5-10 kt, 10-15 kt, 15+ kt) with colored swatches centered below the plot. All chrome text is clearly readable against the light background.
      Data: 16 stacked polar wedges, one per compass direction, each divided into 4 concentric speed-bin segments colored green (#009E73, 0-5 kt), lavender (5-10 kt), blue (10-15 kt), and ochre (15+ kt) with thin cream-colored strokes separating segments. The largest wedges cluster in the N-through-SW arc (SW being tallest, reaching near the 12% ring), while E/SE/S-facing wedges are short stubs near the center.
      Legibility verdict: PASS - all title, compass, tick, and legend text is legible with no dark-on-light failures.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 - not pure black.
      Chrome: Same title, compass labels, radial scale labels, and legend as the light render, all re-colored to light ink/off-white so they stand out against the dark background. Grid rings are a subtle light grey, visible but unobtrusive.
      Data: Identical wedge geometry and colors to the light render - green, lavender, blue, and ochre segments are pixel-identical in hue, confirming only chrome (not data color) changed between themes.
      Legibility verdict: PASS - no dark-on-dark failures observed; every title/label/tick is clearly visible against the dark surface.
