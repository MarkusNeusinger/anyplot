review:
  strengths:
  - 'Correct angular/radial data mapping verified pixel-by-pixel: all 16 compass directions
    and 4 stacked speed bins render at the expected angle and radius, including the
    smaller ESE/SE/SSE/S wedges that are easy to mistake for missing at a glance next
    to the small-margin gaps'
  - Frequency data sums to ~99.9% across all 16 directions x 4 bins, a strong realism
    detail for a synthetic meteorological dataset, with a plausible bimodal SW-dominant
    / NE-secondary pattern called out in the code comments
  - Genuine polar geometry built from the core SVG renderer (`symbols.arc`, the same
    primitive Highcharts itself uses for pie/donut slices) rather than faking a polar
    chart, correctly avoiding the unavailable highcharts-more module per the library
    rules
  - 'Real interactivity: hidden scatter points are data-bound at each wedge centroid
    so the HTML export gets genuine hover tooltips over the actual rendered geometry,
    not a simulated overlay'
  - 'Clean theme adaptation: chrome (background, ink, grid, tooltip) correctly flips
    between light and dark while all 4 categorical data colors stay identical, and
    first-series green (#009E73) is correctly used for the 0-5kt innermost ring'
  - Legend is well-spaced and centered with no overlap; direction labels and outer
    scale rings are all clear of the largest wedges (SW/WSW)
  weaknesses:
  - The '3%' radial scale label (and to a lesser extent, the ring-label gap generally)
    is placed exactly halfway between the N and NNE wedges, but N (3.4%) and NNE (4.6%)
    both extend past 3% radius, so the '%' glyph crowds against / nearly touches the
    neighboring wedge fills in both themes at that radius. Anchor ring labels at whichever
    direction slot currently has the smallest cumulative total (or place them on a
    dedicated blank spoke) instead of a fixed N/NNE gap so they never compete with
    data ink.
  - Stacked speed bins (0-5, 5-10, 10-15, 15+ kt) use the general categorical Imprint
    order (green/lavender/blue/ochre) for what is really an ordinal variable; a sequential
    ramp would communicate 'low to high speed' more intuitively, though this is a
    stylistic nice-to-have, not a violation.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "polar-bar · javascript · highcharts · anyplot.ai" in bold dark ink at top, clearly readable. 16 dark bold compass-direction labels (N, NNE, NE, ... NNW) ring the perimeter, all legible against the light background. Four faint concentric scale rings labeled 3%/6%/9%/12% in soft gray ink are visible; three of the four (12%, 9%, 6%) sit in genuinely empty space, but the "3%" label sits in the narrow gap between the N and NNE wedges and visibly crowds/nearly touches the wedge fill at that radius in a tight zoomed crop (both themes). Legend below the chart (0–5 kt, 5–10 kt, 10–15 kt, 15+ kt) is clean and well spaced.
      Data: A stacked wind rose — 16 direction wedges, each split into 4 concentric colored segments (green innermost → lavender → blue → ochre outermost) proportional to frequency per speed bin. Pixel sampling confirms all 16 direction wedges are present and correctly positioned (the smaller ESE/SE/SSE/S wedges are real, just visually easy to undercount against the larger SW/WSW/W cluster). The dominant lobe points toward SW/WSW/SSW/W (largest wedges, reaching toward the 9–12% rings), with a smaller secondary lobe toward NE, matching the bimodal wind pattern described in the code comments. First (innermost) series is the brand green #009E73 as required.
      Legibility verdict: PASS (with one localized crowding issue on the "3%" ring label noted in weaknesses; no text is unreadable).

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Title and all compass-direction labels render in light ink, clearly legible against the dark background — no dark-on-dark failures observed. Scale rings and their percentage labels use a soft light-gray tone, readable, with the same "3%" label crowding the N/NNE wedge boundary as in the light render (confirmed via tight crop — same underlying layout issue, not theme-specific). Legend text and swatches are legible in light ink.
      Data: Identical wedge geometry and identical data colors to the light render (verified — the 4 categorical hues are unchanged), confirming only chrome flipped between themes as required.
      Legibility verdict: PASS (same isolated "3%" label crowding as the light render; no dark-on-dark or unreadable text found).
