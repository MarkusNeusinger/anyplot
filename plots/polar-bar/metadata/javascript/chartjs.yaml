review:
  strengths:
  - 'Correct chart type: Chart.js''s native `polarArea` is the idiomatic fit for a
    wind-rose/polar-bar spec, with bars radiating from the center by compass direction.'
  - Full 8-slot Imprint categorical palette in canonical order, first series is brand
    green `#009E73`, and data colors are pixel-identical between light and dark renders.
  - 'Theme-adaptive chrome is fully correct in both renders: `#FAF8F1`/`#1A1A17` backgrounds,
    readable ink-toned title/ticks/legend, subtle theme-adaptive grid — no dark-on-dark
    or light-on-light failures.'
  - Realistic, neutral dataset (coastal wind-direction frequency) that sums to exactly
    100% and tells a clear SW-prevailing-wind story.
  - 'Clean, minimal, idiomatic code: KISS structure, deterministic hardcoded data,
    `animation: false` set per the mount-node contract, no fake interactivity.'
  weaknesses:
  - 'Unbalanced canvas whitespace: the polar chart hugs the left and bottom canvas
    edges (SW wedge touches the left border) while the entire right ~25-30% of the
    square canvas is empty except for the right-aligned legend floating in isolation,
    with a large visible gap between the chart and the legend column. Rebalance by
    centering the chart in the full canvas (e.g. reduce legend width/font, or move
    legend to ''bottom'' under the circle) so margins are even on all sides.'
  - The radial (r) axis shows bare numeric ticks (0-20) with no visible label or unit
    — nothing on the chart itself states these are '% of hours'. Add an r-scale axis
    title (or a subtitle) so the tick meaning doesn't rely solely on the dataset's
    internal 'Frequency (%)' label, which never renders on the static PNG.
  - Design reads close to a well-configured Chart.js polarArea default beyond the
    palette choice — the wedge borders are a nice touch, but there's no additional
    visual emphasis (e.g. subtly highlighting the dominant SW wedge) to elevate it
    from 'correct' to 'polished/storytelling'.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Title "Wind Rose · polar-bar · javascript · chartjs · anyplot.ai" in dark ink, clearly readable at the top. Radial tick labels (0-20, step 2) in soft dark gray, legend entries (N, NE, E, SE, S, SW, W, NW) in dark ink at the right. Grid rings and angle lines are thin and subtle. All text is legible against the light background.
      Data: 8 wedges radiating from center, one per compass direction, using the full Imprint categorical palette in canonical order (N=brand green #009E73, NE=lavender, E=blue, SE=ochre, S=matte red, SW=cyan, W=rose/purple, NW=lime), each separated by a thin pageBg-colored border. SW is the longest wedge (value 20, dominant direction), N and NW are shortest.
      Layout note: the plot is pushed toward the left/bottom of the canvas (SW wedge touches the left edge) while a large empty region sits on the right side around the legend, which sits at a visible distance from the chart body — unbalanced margins.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Title, tick labels, and legend text all rendered in light ink tones, clearly readable against the dark surface — no dark-on-dark failures observed. Grid rings and angle lines are faint but visible.
      Data: Identical wedge colors and identical proportions/order to the light render — confirms data colors are theme-invariant, only chrome flipped.
      Layout note: same left/bottom-hugging, right-side-empty imbalance as the light render (this is theme-independent, a layout/config issue rather than a theme issue).
      Legibility verdict: PASS
