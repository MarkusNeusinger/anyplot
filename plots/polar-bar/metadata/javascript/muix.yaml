review:
  strengths:
  - Stacked wind-rose wedges for 16 compass points in compass order, starting at N
    and running clockwise, with segments in the same Light → Moderate → Strong order
    in every bar and each segment's radial length equal to its own count on a zero-based
    scale
  - 'Ordered speed bins colored as three evenly interpolated steps of imprint_seq
    (t.seq[0] #009E73 → t.seq[1] #4467A3), so the legend reads as a low → high progression;
    data colors are identical in both renders'
  - 'Typographic hierarchy at the rim: cardinal and intercardinal labels (N, NE, E…)
    in 16 px semibold ink, the eight secondary points in 14 px inkSoft, matched by
    heavier primary spokes and a 2 px outer ring'
  - Nice-number ring scale (30/60/90/120 obs) computed from the data with units on
    every ring label, and page-colored 2 px wedge strokes that keep the stacked segments
    readable in both themes
  - 'Built on the MUI X v9 composition API: ChartsContainer with a custom SVG layer
    that reads its geometry from the useDrawingArea hook, with skipAnimation set'
  weaknesses:
  - 'VQ-02 (both): the page-colored backing pill behind the ''30 obs'' ring label
    is drawn after the wedges and hides about the right third of the N bar''s Strong
    (20+ mph) cap and the top-right corner of its Moderate segment, because the N
    total (30) sits exactly on the 30 ring → no ring label or label backing over a
    data mark (0 px of the bar covered). Likely cause: the ring-label <rect> at x=cx+6
    is placed on the N axis inside the rings.map tick block and rendered after the
    wedge paths; set the labels along a spoke that no bar reaches, or draw the backing
    under the wedges.'
  - 'Suggestion: a legend title naming the variable ("Wind speed") would complete
    the legend, though the entries already carry the mph ranges.'
  - 'Suggestion: an MUI X tooltip on the wedges would add per-segment counts in the
    interactive HTML.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the full 2400x2400 square canvas.
      Chrome: title "polar-bar · javascript · muix · anyplot.ai" bold dark ink, centered at top (~35% of width). Sixteen compass labels at the rim: N, NE, E, SE, S, SW, W, NW bold dark ink, the secondary points (NNE, ENE, …) smaller inkSoft grey. Four concentric rings at 30/60/90/120 obs with grey labels on the N axis; spokes subtle grey, primary spokes slightly heavier; outer ring heavier. Legend at the bottom: three rounded swatches with "Light (0–10 mph)", "Moderate (10–20 mph)", "Strong (20+ mph)". All text readable.
      Data: 16 stacked wedges, inner segment brand green #009E73, middle teal (~#22838C), outer blue #4467A3, separated by page-colored 2 px strokes. The rose is lopsided toward SW (longest bar ~119 obs, almost reaching the 120 ring), S/SSW/WSW/W large, the NE quadrant short. The '30 obs' label pill covers the right part of the N bar's blue cap.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, cardinal labels and legend text in light ink; secondary labels and ring labels in lighter grey inkSoft; rings and spokes dark grey, subtle but visible. No dark-on-dark text.
      Data: green, teal and blue segments identical to the light render; wedge separators now near-black (page color). Same '30 obs' pill occlusion of the N bar cap.
      Legibility verdict: PASS
