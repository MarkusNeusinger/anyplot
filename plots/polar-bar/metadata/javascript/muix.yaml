review:
  strengths:
  - 'Polar stacking is computed from the records: one wedge per direction at its own
    angle, segments cumulated per speed bin in the same order in every bar, radial
    scale anchored at zero so each segment''s radial length equals its own count'
  - Speed bins are ordered categories and take discrete steps of imprint_seq (t.seq[0]
    → t.seq[1]) in their natural Light → Moderate → Strong order, identical in both
    themes
  - 'Clear typographic hierarchy at the rim: the eight principal compass points in
    bold ink at 16 px, the eight intermediate points in inkSoft at 14 px'
  - Ring value labels sit on page-colored pills so the gridline never runs through
    the text, and every ring label carries the unit ('obs') parsed from the column
    name
  - Uses the community useDrawingArea() hook inside ChartsContainer to place a custom
    SVG layer in MUI X's drawing area, the composition route MUI X documents for marks
    it has no component for; skipAnimation is set
  - Wedges are separated by a thin page-colored stroke and a small angular gap, so
    adjacent bars and stacked segments stay distinct in both themes
  weaknesses:
  - 'VQ-05 (both): the radial scale runs to 200 obs although the largest stacked total
    is 119 obs (SW), so the whole rose sits inside the inner ~60 % of the radius and
    the outer two rings frame empty space → an outer ring just above the maximum,
    about 120–125 obs (−75 to −80 obs on the scale max), so the bars fill most of
    the radius. Likely cause: the ring-step rounding only allows steps of 1/2/5/10
    × 10^n, so the raw step 29.75 jumps to 50 and RING_COUNT=4 then pushes maxValue
    to 200; allow 2.5/3 steps or pick the ring count from the data.'
  - 'Suggestion: a per-direction total or the share of calm hours, if the spec''s
    scenario ever grows one, could give the rose a focal point beyond the dominant
    SW lobe.'
  - 'Suggestion: the HTML legend could use MUI X''s ChartsLegend fed with the three
    bins so the legend comes from the library rather than hand-built spans.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the full 2400×2400 canvas, no white panel.
      Chrome: bold dark title "polar-bar · javascript · muix · anyplot.ai" centered at top; 16 compass labels at the rim (N, NE, E, SE, S, SW, W, NW bold ink; NNE, ENE, … in softer gray); four concentric rings labelled 50/100/150/200 obs on page-colored pills along the north spoke; 16 thin spokes and rings in a light warm gray, subtle but visible. HTML legend at the bottom with three rounded swatches: Light (0–10 mph), Moderate (10–20 mph), Strong (20+ mph). All text readable dark-on-light.
      Data: 16 stacked wedges radiating from the center, brand green #009E73 for Light, a teal mid-step for Moderate, blue #4467A3 for Strong (imprint_seq steps). Dominant lobe SW/WSW/SSW reaching ~119 obs; NE/ENE quadrant small with hairline Strong segments (permitted). The rose only fills the inner ~60 % of the radius because the outer ring is at 200 obs.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, bold compass labels and legend text flip to light ink; intermediate compass labels and ring labels in a light soft gray; rings and spokes in a dim gray that is subtle yet visible. No dark-on-dark text anywhere.
      Data: wedge colors identical to the light render (green, teal, blue); the wedge separator stroke flips to the dark page color, keeping segments distinct.
      Legibility verdict: PASS
