review:
  strengths:
  - Faithfully composes a wind rose despite MUI X community having no native polar-bar
    component, following the established ChartContainer + useDrawingArea pattern already
    precedented by polar-basic and radar-basic in this catalog.
  - Correct stacked-wedge encoding of 3 wind-speed bins per direction with canonical
    Imprint palette order (brand green, lavender, blue), identical data colors across
    both themes.
  - 'Thoughtful legibility touches: background chip behind radial tick labels keeps
    them readable over colored wedges, page-background stroke separates stacked segments,
    and inner rings are visually lighter than the bold outer boundary ring.'
  - Realistic, neutral meteorological data with a clear directional and speed hierarchy
    (dominant SW wind cluster reads immediately).
  - Clean, deterministic, KISS-appropriate code for a React component; correct mandated
    title format; skipAnimation set to avoid mid-tween screenshots.
  weaknesses:
  - series={[]} on ChartContainer means no genuine MUI X data-bound chart component
    is used anywhere — unlike the polar-basic precedent, which also registers a real
    <ScatterPlot> series so ChartsTooltip/hover works, this implementation gets none
    of MUI X's built-in interactivity in the HTML output, weakening Library Mastery
    for an interactive-library entry. Consider registering an invisible/synced series
    (e.g. one scatter point per wedge centroid) purely to drive a real ChartsTooltip.
  - Title occupies only ~40% of canvas width at fontSize=28 — smaller than the comfortable
    50-70% range for a non-prefixed mandated title; not a violation (no overflow,
    no clipping) but there is room to grow it slightly for stronger visual hierarchy.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "polar-bar · javascript · muix · anyplot.ai" in bold dark ink at top, clearly legible. Eight compass labels (N, NE, E, SE, S, SW, W, NW) in bold dark ink ring the outer edge of the rose. Four concentric frequency rings ("30 obs" … "120 obs") in subtle grid lines, with tick labels in soft ink placed on small background chips along the top (N) spoke so they stay legible over any wedge color beneath. Legend at the bottom center with three color swatches and labels (Light 0–10 mph, Moderate 10–20 mph, Strong 20+ mph), all clearly readable.
      Data: 16 stacked wedges radiate from center, one per compass direction, each split into 3 color segments (green/lavender/blue) representing the 3 speed bins, separated by thin page-background strokes. First series (Light) is #009E73 brand green; Moderate is lavender (#C475FD); Strong is blue (#4467A3) — the mandated canonical Imprint order. A clear directional pattern emerges: small wedges cluster around N/NE/E, growing to the largest wedges around S/SW/W.
      Legibility verdict: PASS — all text (title, compass labels, tick labels, legend) is clearly readable against the light background; no light-on-light text found.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title, compass labels, and legend, now rendered in light ink, clearly legible against the dark surface. Grid rings and spokes render as a light, subtle grid rather than the light-theme's darker grid, and the tick-label background chips flip to the dark elevated color so the light tick text stays legible over any wedge color.
      Data: Identical wedge geometry and identical data colors (green/lavender/blue) to the light render — only the chrome (background, grid, text, tick-chip fill) has flipped, exactly as required.
      Legibility verdict: PASS — no dark-on-dark failures; all title/label/tick text is light-colored and clearly readable against the near-black background; brand green remains vivid on the dark surface.
