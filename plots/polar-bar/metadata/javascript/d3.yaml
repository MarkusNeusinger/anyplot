review:
  strengths:
  - 'Fixed the previously-flagged issue: the innermost "25 obs" grid tick label is
    now drawn after the bars with a page-background halo stroke, so it stays fully
    legible even where the angular gap at small radius is narrower than the label
    text'
  - Correct, standard-convention compass orientation with N at top and clockwise winding
    via toPoint(theta, r)
  - 'Idiomatic, distinctive D3 usage: d3.scaleRadial for equal-area stacked wedges
    plus d3.stack/d3.arc for radial stacking, with cornerRadius rounding'
  - 'Realistic synthetic data: Gaussian falloff around a coded prevailing SW direction,
    with speed-bin weights skewing toward higher speeds in the prevailing direction'
  - Correctly identifies the 5 ordered speed bins as sequential data and maps them
    through imprint_seq (d3.interpolateRgbBasis) rather than the categorical palette
  - 'Clean theme handling: all chrome pulls from tokens, data colors identical across
    light/dark renders'
  - No AR-09 clipping anywhere; legend, title, and compass labels are all comfortably
    clear of the canvas edges
  weaknesses:
  - Design excellence, while polished, still follows the well-known idiomatic D3 wind-rose
    recipe (scaleRadial + stack + arc) rather than introducing a distinctive custom
    treatment beyond that pattern
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1), correct for light theme.
      Chrome: Bold dark title "Wind Rose · polar-bar · javascript · d3 · anyplot.ai" is centered near the top and fully legible. 16 compass-direction labels ring the plot, cardinal points (N/E/S/W) bold in ink, others in ink-soft — all readable. All four radial gridline labels ("25 obs", "50 obs", "75 obs", "100 obs") are now clearly legible against the bars thanks to the page-background halo stroke and the grid-label group being drawn after the bars — this fixes the attempt-1 weakness where the innermost "25 obs" label was hidden.
      Data: Stacked radial bars use a green (#009E73) → blue sequential ramp (imprint_seq) across 5 speed bins, tallest around SW/SSW (the coded prevailing direction), giving a realistic wind-rose shape. Legend (5 swatches) sits comfortably clear of the bottom edge.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17), correct for dark theme.
      Chrome: Title, compass labels, and all four grid-ring labels render in light ink against the dark surface — clearly legible, no dark-on-dark issues.
      Data: Data colors (the green→blue ramp) are identical to the light render — only chrome flipped, as required.
      Legibility verdict: PASS
