review:
  strengths:
  - Correct, standard-convention compass orientation (N top, clockwise) implemented
    via toPoint(theta,r) with sin/cos, so N/E/S/W land exactly where a meteorologist
    expects them
  - 'Idiomatic, distinctive D3 usage: d3.scaleRadial gives equal-area stacked wedges
    (not naive linear radius, which would visually over-emphasize outer segments),
    combined with d3.stack + d3.arc for the radial stacking'
  - 'Realistic, well-motivated synthetic data: Gaussian falloff of frequency around
    a prevailing SW direction, with speed-bin weights that shift toward higher speeds
    in the prevailing direction — a genuinely plausible wind-rose shape, not flat
    random noise'
  - 'Correct Imprint usage: identifies the 5 ordered speed bins as sequential/ordinal
    data and maps them through interpolateRgbBasis(t.seq) instead of the categorical
    palette — the right call per the style guide''s Continuous Data section'
  - 'Clean theme handling: chrome (grid, ticks, compass labels, title, legend) all
    pull from t.grid/t.ink/t.inkSoft/t.pageBg and read correctly in both renders;
    data colors are identical between light and dark'
  - 'Nice polish details: angle.paddingInner gaps between wedges, small arc cornerRadius,
    and a white/pageBg stroke between stacked segments for definition'
  - Legend and title both comfortably clear of the canvas edges in both themes — no
    AR-09 clipping anywhere
  - Deterministic reproducibility via a tiny fixed-seed LCG, appropriate for a browser
    runtime with no seedable Math.random
  weaknesses:
  - 'The innermost radial-grid label (''25 obs'') is effectively invisible in both
    renders: at that small radius the angle.paddingInner gap between the N and NNW
    wedges is only ~28px wide (gapAngle * radius(25)), but the 13px label text needs
    roughly 45-55px, and the bars are drawn after (on top of) the grid group in the
    DOM, so the bar fills paint over most of the label. Verified by cropping plot-light.png
    around the N/NNW gap at the expected label radius — no ''25 obs'' text is visible,
    only the bare gridline arc. Fix: either offset the innermost tick label further
    out (or inward past the bars'' start), draw the grid-label group after the bars
    so it isn''t painted over, or skip labeling ticks whose gap width at that radius
    is smaller than the text''s rendered width.'
  - Design Excellence is solid but close to the idiomatic-tutorial pattern for this
    chart type (scaleRadial + stack + arc is the textbook D3 wind-rose recipe) rather
    than a distinctive custom treatment beyond that — fine, but not exceptional enough
    to max out DE-01/DE-03.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1), matches the required light-theme plot surface — not pure white.
      Chrome: Title "Wind Rose · polar-bar · javascript · d3 · anyplot.ai" is bold dark text (#1A1A17-ish), clearly legible, centered near the top and well clear of the canvas edge. 16 compass-direction labels (N, NNE, NE, ... NNW) ring the outside of the polar plot, cardinal points (N/E/S/W) in bold ink, intercardinal/secondary points in lighter ink-soft — all readable. Three of the four radial gridline labels ("50 obs", "75 obs", "100 obs") are clearly legible in the gap between the N and NNW wedges; the innermost "25 obs" label is NOT visible — confirmed via pixel crop that the padding gap at that small radius is too narrow for the text and the bars (drawn after the grid, on top of it) paint over it. Legend at the bottom (5 speed-bin swatches with labels) is fully visible with generous margin below.
      Data: Stacked radial bars per compass direction, colored via a green→blue sequential (imprint_seq) ramp across the 5 ordered speed bins, from #009E73-ish green (0-5 kt, innermost) to blue (20+ kt, outermost). Bars are tallest around SW/SSW/WSW (the coded prevailing wind direction) and shortest around NE/ENE, producing a clear, realistic wind-rose shape. Equal-area radial scaling (scaleRadial) is used so bar lengths aren't visually distorted.
      Legibility verdict: PASS overall, with one FAIL — the "25 obs" grid tick label is hidden behind the adjacent bars (see weaknesses).

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17-ish), matches the required dark-theme plot surface — not pure black.
      Chrome: Title, compass labels, and the three visible grid-ring labels all render in light ink (#F0EFE8 / lighter gray for secondary text) against the dark background — clearly legible, no dark-on-dark failures. Same "25 obs" label omission as the light render, for the same geometric reason (theme-independent bug, not a dark-mode-specific regression).
      Data: Identical green→blue sequential ramp and identical bar geometry/heights as the light render — confirms data colors are theme-invariant, only chrome (background, grid, text) flipped as required.
      Legibility verdict: PASS overall, with the same single "25 obs" label FAIL carried over from the light render.
