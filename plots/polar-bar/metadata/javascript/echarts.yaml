review:
  strengths:
  - 'Correct Imprint palette in canonical order (green, lavender, blue, ochre, red)
    for the five wind-speed bins, first series is brand green #009E73, and both renders
    are fully theme-correct chrome (backgrounds, text, grid all flip correctly).'
  - The custom `renderItem` series draws an amber focal-highlight wedge behind the
    SW-WSW-W sector using `api.coord()` to sample the polar transform, correctly aligning
    with the prevailing-wind bars — a genuine ECharts-specific technique that also
    creates real data storytelling (viewer's eye goes straight to the dominant wind
    direction).
  - 'Full 16-point compass with correct clockwise N-at-top orientation, 5 stacked
    wind-speed bins, and `barMinHeight: 5` keeps the thin calm-direction segments
    visible instead of collapsing to invisible slivers.'
  - 'Deterministic, realistic meteorological dataset: prevailing westerlies with a
    secondary southerly lobe, monotonically plausible speed-bin tapering per direction.'
  - Title format, legend labels, and axis naming all match spec requirements exactly;
    KISS code structure with no unnecessary abstraction.
  weaknesses:
  - DE-02 sits at library-default refinement — the concentric grid rings and angle
    spokes use the token grid color as-is with no additional opacity tuning or ring-count
    reduction to declutter the sparse-data (E/ESE/NE) side of the chart.
  - In the calm easterly directions (E, ESE, NE, ENE) the stacked segments are so
    thin that individual speed-bin boundaries are hard to distinguish even with barMinHeight
    enforced — consider a slightly larger barMinHeight or a subtle per-segment border
    stroke to keep the bins legible at that scale.
  - The amber highlight sector is a strong storytelling device but carries no label
    — a small 'Prevailing wind' annotation near the wedge would push data storytelling
    from good to excellent.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Title "polar-bar · javascript · echarts · anyplot.ai" centered at top in dark ink, fully legible. Radial axis name "Hours observed" and tick labels (20/30/40/50/60) in soft gray-brown, readable. 16 compass-point angle labels (N, NNE, NE, ... NNW) around the circle perimeter, all clearly legible against the light background. Legend at bottom with 5 wind-speed-bin swatches and labels, dark text, fully readable.
      Data: Stacked polar bars for all 16 directions. First (innermost) segment is brand green #009E73 (0-5 kt), followed by lavender (5-10 kt), blue (10-15 kt), ochre (15-20 kt), and matte red (20+ kt) outermost — matches Imprint canonical order. A subtle amber-tinted wedge sits behind the SW-WSW-W bars, highlighting the prevailing wind sector, clearly distinguishable from the cream background at low opacity.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Same title, now in light ink (near-white), fully legible on the dark background. Radial tick labels and 16 compass labels rendered in light gray, all readable, no dark-on-dark issues anywhere. Legend text is light-colored and legible against the dark background.
      Data: Identical stacked-bar colors to the light render (green, lavender, blue, ochre, red in the same order) — confirms data colors are constant across themes. The amber highlight wedge is still visible as a subtly lighter patch against the dark background, correctly positioned behind SW-WSW-W.
      Legibility verdict: PASS
