review:
  strengths:
  - Correct polar bar / wind-rose chart type with 16 compass directions and 5 stacked
    wind-speed bins, matching the spec's stacking note
  - 'Imprint palette applied correctly and in canonical order (green, lavender, blue,
    ochre, red) for the 5 speed bins, first series is #009E73'
  - 'Theme-adaptive chrome is fully correct: background, title/axis/tick text colors,
    and grid all flip correctly between light (#FAF8F1) and dark (#1A1A17) while data
    colors stay identical'
  - 'Idiomatic echarts usage: coordinateSystem: ''polar'', stack, and a category angleAxis
    / value radiusAxis split'
  - Realistic, plausible meteorological data with a clear prevailing-wind pattern
    (SW/WSW/W dominance) that gives the chart a natural focal point
  - 'Clean, deterministic, KISS code that respects the mount-node contract (echarts.init
    on #container, animation: false, no explicit size/devicePixelRatio)'
  weaknesses:
  - Calm-direction segments (N, NE, E, ESE, SE, etc.) compress into very thin stacked
    slices near the center, making the individual wind-speed-bin colors hard to distinguish
    for those directions
  - 'Design still reads close to a well-configured default: no additional emphasis
    (e.g. subtle radial highlight or callout) on the dominant SW/WSW/W sector beyond
    what the raw data naturally provides'
  - The polar/stack combination is correct but fairly standard for this chart type
    - doesn't showcase an echarts-distinctive feature beyond the basic polar bar setup
