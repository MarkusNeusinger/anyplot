review:
  strengths:
  - Native coord_polar() keeps lets-plot's default orientation, so N sits at 12 o'clock
    and every wedge is centered on its bearing
  - One-panel gggrid wrapper paints the whole square canvas in the page color in both
    themes
  - Page-colored wedge outlines separate adjacent sectors cleanly on either background
  - Interactive HTML export with lets-plot's native hover tooltips for each direction
  weaknesses:
  - 'Suggestion: color repeats the direction already labeled at the rim; a single
    #009E73 fill, or stacked wind-speed bands with a legend, would give color a job.'
  - 'Suggestion: the SW wedge (35 %) runs past the outermost 30 % ring; a ring at
    40 % (scale_y_continuous breaks) would let its length be read against a gridline.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole 2400x2400 canvas, no unpainted edge strips
      Chrome: bold dark title 'polar-bar · python · letsplot · anyplot.ai' top left; 'Frequency (%)' axis title and radial ticks 0/10/20/30 on the left; compass labels N, NE, E, SE, S, SW, W, NW at the rim in dark grey; thin dark grey rings at 10/20/30 and spokes; all readable
      Data: eight wedges from the center, N (#009E73 green) at 12 o'clock, then purple, blue, ochre, red (S, ~28), cyan (SW, ~35, longest), plum, olive; page-colored outlines between wedges
      Legibility verdict: PASS

