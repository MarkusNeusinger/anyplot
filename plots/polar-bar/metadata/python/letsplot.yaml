review:
  strengths:
  - 'Imprint palette applied in canonical order from #009E73, data colors identical
    across both renders, chrome threaded from PAGE_BG / INK / INK_SOFT tokens'
  - Radial scale anchored at zero via scale_y_continuous(limits=[0, None]) so wedge
    length stays proportional to frequency
  - Wedge outlines drawn in the page color separate the sectors cleanly on both backgrounds
  - Ordered pd.Categorical keeps the compass order around the circle; interactive
    HTML export gives per-wedge tooltips
  weaknesses:
  - 'SC-03 (both): coord_polar(start=-pi/8) rotates the whole rose by -22.5 degrees,
    so N points north-north-west and E sits at 67.5 degrees instead of 90 → N centered
    at the top (+22.5 degrees). Likely cause: start=-np.pi / n; lets-plot already
    centers the first category at 12 o''clock, so start should be 0.'
  - 'Suggestion: color repeats the direction already labeled at the rim; a single
    #009E73 fill, or fill by a wind-speed band as stacked segments, would give color
    a job.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, 2400x2400 square canvas.
      Chrome: bold title 'polar-bar · python · letsplot · anyplot.ai' top-left in near-black; 'Frequency (%)' vertical axis title and radial ticks 0-35 on the left; compass labels N..NW at the rim in INK_SOFT; thin INK_SOFT concentric rings every 5 % and eight spokes. All readable.
      Data: eight wedges from the center, colored N #009E73, NE #C475FD, E #4467A3, SE #BD8233, S #AE3030, SW #2ABCCD, W #954477, NW #99B314; SW (35) and S (28) dominate toward the bottom. Page-colored outlines separate wedges. The rose is rotated -22.5 degrees: N wedge centered NNW.
      Legibility verdict: PASS

