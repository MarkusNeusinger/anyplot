review:
  strengths:
  - Stacked wind rose with 16 compass directions, equal bar widths and a zero-based
    radial scale, each segment spanning its own cumulative range
  - Value labels placed in the empty angular gap between the NNW and N bars, so they
    stay clear of data and gridlines remain readable
  - Bold, larger cardinal labels over soft intercardinal labels give the rim a clear
    hierarchy
  - Theme tokens threaded through text, gridlines, spokes, segment outlines and the
    elevated legend box; both renders readable
  - Grid ticks and limits are derived from the data (MaxNLocator on the cumulative
    maximum), not typed numbers
  weaknesses:
  - 'VQ-07 (both): the four ordered wind-speed bins 0-3 / 3-6 / 6-9 / 9+ are drawn
    in categorical Imprint positions 1-4 (green, purple, blue, ochre), which presents
    them as unrelated groups and hides their low-to-high order → discrete steps of
    the imprint_seq ramp (#009E73 → #4467A3) in bin order, each step distinguishable
    from its neighbours and the page in both themes. Likely cause: scale_fill_manual(values=IMPRINT_PALETTE,
    limits=bins) on line 155.'
  - 'CQ-01 (code): the helper function to_xy (line 96) breaks the Imports → Data →
    Plot → Save structure → compute theta = np.radians(90 - bearing) and the radius*cos/sin
    coordinates as module-level expressions where they are used. Likely cause: the
    def to_xy helper.'
  - 'Suggestion: the band of empty space between the rose and the legend could be
    tightened so the rose fills more of the square canvas.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, square 2400x2400 canvas.
      Chrome: dark title 'Wind Rose · polar-bar · python · plotnine · anyplot.ai' (~73% width); bold dark N/E/S/W labels, soft-gray 12 intercardinal labels at the rim; dashed concentric gridlines at 5/10/15/20% labelled in soft gray between NNW and N; faint radial spokes; bottom legend 'Wind speed (m/s)' in an elevated box with four swatches. All text readable.
      Data: 16 stacked wedges, segments 0-3 #009E73, 3-6 #C475FD, 6-9 #4467A3, 9+ #BD8233, thin page-colored outlines; prevailing ENE/E/NE bars reach ~15-16%, a secondary SSW lobe ~7%.
      Legibility verdict: PASS

