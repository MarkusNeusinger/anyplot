  weaknesses:
  - 'VQ-02 (both): the radial value labels 10-50, placed at 11.25°, run across the
    N and NNE bars'' fills and edges ("20" and "10" sit inside the green, "30"/"40"
    cross bar outlines), and in the dark render "10"/"20" read faint on the green
    → place them in the empty gap between two bars or give them a page-colored halo
    so no label sits on a bar. Likely cause: ax.set_rlabel_position(180 / n_bars)
    puts the labels on the N/NNE bars'' angular span.'
  - 'VQ-06 (both): nothing names the quantity of the radial axis — the rings read
    10-50 with no unit or meaning (counts, hours, % of observations) → state it, e.g.
    a radial label or title prefix such as ''Wind direction frequency (hours)''. Likely
    cause: no ylabel/annotation for the frequency axis.'
  - 'LM-01 (code): the bars are drawn with matplotlib''s ax.bar and seaborn only sets
    the theme (sns.set_theme), so the implementation is matplotlib with seaborn styling
    → use seaborn for the marks where possible (e.g. sns.barplot on the polar axes
    with the df columns) or seaborn''s objects/axes-level API. Likely cause: polar
    bar drawn by hand in matplotlib.'
  - 'Suggestion: a prevailing-wind story (one or two dominant directions) would give
    the rose a focal point.'
