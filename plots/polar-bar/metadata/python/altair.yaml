review:
  strengths:
  - All polar geometry uses Altair's theta/theta2/radius/radius2 encodings on one
    shared scale, so bars, rings and labels stay aligned
  - Concentric rings with value labels and a subtitle naming the unit make bar lengths
    readable
  - 'Theme tokens threaded through title, subtitle, legend and labels: both renders
    fully legible'
  - 'Legend in compass order with the canonical Imprint palette, N in #009E73'
  - Native tooltips and interactive() in the HTML output
  weaknesses:
  - 'VQ-02 (both): the ''10'' ring value label at the 22.5° spoke touches the top
    edge of the NE bar (value 9 sits just below the 10 ring) → keep the label clear
    of every bar by at least a few px. Likely cause: SPOKE_SHARE places the ring labels
    at a fixed angle without checking which bars reach the ring.'
  - 'VQ-05 (both): the rose with its rim labels occupies only about 65 % of the canvas
    height, leaving roughly 200 px empty above the title and 300 px below the S label
    → a larger view so the rose fills more of the square (about +15 % SIDE, within
    the canvas). Likely cause: SIDE=430 with the radius range at 0.38 of SIDE.'
  - 'Suggestion: color by direction repeats what angle and rim labels already show;
    a single color, or stacked speed bands as the Notes allow, would give color a
    job.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the full 2400x2400 canvas
      Chrome: bold title 'polar-bar · python · altair · anyplot.ai' with soft-ink subtitle 'Bar length: Frequency (days), rings every 10'; bold dark rim labels N…NW outside the 30 ring; ring value labels 10/20/30 in soft ink at the 22.5° spoke; legend 'Wind direction' on an elevated panel at the right; all text dark on light and readable
      Data: eight wedges at the compass bearings in canonical Imprint order (N #009E73, NE purple, E blue, SE ochre, S red, SW cyan, W plum, NW olive); W longest (~24), SW and NW next; three faint concentric rings
      Legibility verdict: PASS

