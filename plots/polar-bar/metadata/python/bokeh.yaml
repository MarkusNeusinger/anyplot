review:
  strengths:
  - Compass angles are converted correctly to Bokeh's counterclockwise-from-East convention,
    so N sits at the top and directions run clockwise
  - 'All eight Imprint positions in canonical order with #009E73 first, and an ink
    outline on each wedge that flips with the theme'
  - The radial scale is labeled 'Frequency (%)' and every direction is labeled at
    the rim in both themes
  - 'Clean adaptable structure: column constants, one Data block binding df, wedges
    driven from a single ColumnDataSource'
  weaknesses:
  - 'VQ-01 (both): the radial scale labels ''7'', ''15'', ''22'' and ''Frequency (%)''
    are set at 22pt, 12pt below the 34pt tick-label reference, and read small beside
    the 30pt compass labels → about 30–34pt (+8 to +12pt). Likely cause: text_font_size="22pt"
    on the scale Labels.'
  - 'SC-03 (both): the reference rings sit at thirds of the maximum (7.33, 14.67,
    22) but are labelled 7, 15 and 22, so a bar read against the ''15'' ring is misread
    by 0.33 → place the rings at round values (e.g. 5, 10, 15, 20) so each label states
    its ring exactly. Likely cause: circle_radii = BAR_SCALE * (1/3, 2/3, 1) with
    f"{…:.0f}" labels.'
  - 'Suggestion: a single brand-green fill for all wedges would avoid suggesting an
    extra color variable, since the direction is already carried by angle and rim
    label.'
  - 'Suggestion: a HoverTool showing Direction and Frequency (%) would make the HTML
    output more useful.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the full 2400x2400 canvas, with a thin INK_SOFT rectangular frame around the plot area.
      Chrome: bold title 'polar-bar · python · bokeh · anyplot.ai' in dark ink at the top (~40% width); compass labels N, NE, E, SE, S, SW, W, NW in dark ink at the rim; radial scale labels 7 / 15 / 22 and 'Frequency (%)' in soft ink along the north spoke, readable but small. Dashed low-alpha rings, a solid outer rim circle and eight radial spokes are subtle but visible.
      Data: eight wedges from the center, one per direction, colored with Imprint positions 1-8 in order (N #009E73, NE #C475FD, E #4467A3, SE #BD8233, S #AE3030, SW #2ABCCD, W #954477, NW #99B314) at alpha 0.85 with a dark outline; W (22) is longest, SW (18) next, SE (6) shortest.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17, frame in light soft ink.
      Chrome: title and compass labels in light ink #F0EFE8, scale labels in #B8B7B0; all readable, no dark-on-dark text. Rings and spokes visible as faint light lines.
      Data: same eight hex colors as the light render (alpha blends them slightly darker on the dark page); wedge outlines flip to light soft ink. Brand green N wedge clearly visible.
      Legibility verdict: PASS
