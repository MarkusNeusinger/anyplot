review:
  strengths:
  - Compass orientation via set_theta_zero_location('N') and set_theta_direction(-1)
  - Stacked bars with consistent segment order and bottom offsets; radial scale starts
    at zero
  - Theme tokens threaded through labels, grid, bar edges and legend in both renders
  weaknesses:
  - 'VQ-05 (both): the saved canvas is 3570x2805, not one of the canonical 3200x1800
    / 2400x2400 sizes, and the title sits only a few px above the N label → 2400x2400
    square (−1170 x −405 px) with pad between title and rim. Likely cause: figsize=(12,
    12) at dpi=300 with bbox_inches=''tight''.'
  - 'CQ-05 (code): savefig uses bbox_inches=''tight'' and dpi=300, which the matplotlib
    prompt forbids → bbox_inches default (None) and dpi=400 with figsize=(6, 6). Likely
    cause: the savefig call.'
  - 'SC-04 (both): the title reads ''polar-bar · matplotlib · anyplot.ai'' and lacks
    the language segment → ''polar-bar · python · matplotlib · anyplot.ai''. Likely
    cause: the set_title string.'
  - 'VQ-07 (both): the polar spine is drawn in the default pure black, harsh on #FAF8F1
    and dark-on-dark on #1A1A17 → hide it or colour it from INK_SOFT. Likely cause:
    ax.spines[''polar''] left at its default.'
  - 'VQ-02 (both): the ''10%'' radial label is drawn over the purple segment of the
    NE bar → keep radial labels clear of bars (fewer rings or a label angle between
    bars). Likely cause: set_yticks([10, 20, 30, 40]) with set_rlabel_position(45)
    on the NE spoke.'
  - 'VQ-06 (both): the radial scale shows only ''%'' ticks and never names the quantity
    → label it as frequency of observations (%). Likely cause: no radial axis label.'
  - 'DQ-03 (code): the 24 direction-by-speed percentages sum to 209 %, but shares
    of one observation record must sum to 100 % → rescale to a 100 % grand total (−109
    percentage points). Likely cause: the hand-typed calm/moderate/strong arrays.'
  - 'CQ-04 (code): np.random.seed(42) is called with no random draw and bars1/bars2/bars3
    are never used → delete the seed and the unused assignments. Likely cause: leftover
    template lines.'
  - 'Suggestion: highlighting the prevailing W sector would give the rose a focal
    point.'
