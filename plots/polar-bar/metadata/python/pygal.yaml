review:
  strengths:
  - 'True wind-rose bars: each direction is a wedge of one angular width (80% of its
    45° sector) with radial edges, built from pygal''s Radar by sampling 16 points
    per sector, in compass order clockwise from N at the top'
  - 'Stacking is correct: cumulative series are drawn outer-first so each speed class''s
    segment has its own radial length, and the frequencies sum to 100% across all
    32 cells'
  - 'Ordered speed classes use discrete imprint_seq steps from #009E73 (Calm) to #4467A3
    (Strong), identical in both themes'
  - Radial scale starts at zero (range=(0, top*1.08)) with dashed muted concentric
    rings labelled 4%-24%, visible but lighter than the bars in both themes
  - pygal-specific add_xml_filter and render_tree are used to square the polar box
    and move the ring labels off the N spoke with a page-coloured halo
  - Interactive HTML output keeps pygal's native hover tooltips and toggleable legend
  weaknesses:
  - 'VQ-02 (both): the 12% and 16% ring labels sit on the right edge of the NW bar,
    their glyphs partly over the bar''s fill (the halo keeps them readable but they
    collide with the data) → place the ring labels in a gap with short bars, e.g.
    between E and SE, so no label touches a bar. Likely cause: gap = math.pi / n_dirs
    rotates the labels only 22.5° off N, while the long NW bar''s edge reaches to
    about 27° from N.'
  - 'VQ-04 (both): neighbouring speed steps are barely distinguishable — Calm #009E73
    vs Light #178C83 and Moderate #2E7A93 vs Strong #4467A3 differ only slightly,
    so segment boundaries in the short E/SE/NE bars nearly vanish → spread the steps
    further apart (e.g. lighten the first step or extend the ramp so adjacent steps
    differ clearly) so every step stays distinguishable from its neighbours. Likely
    cause: four linear steps over the short #009E73→#4467A3 ramp in the seq_colors
    loop.'
  - 'VQ-05 (both): the x_title ''Rings: Frequency (%) of all observations'' renders
    at title size (about 66 px, as large as the main title) and floats about 150 px
    below the S label, so the bottom band of the canvas is dominated by an axis caption
    → about 48 px, matching the compass labels, with less gap above it. Likely cause:
    pygal draws x_title with title_font_size=66; set a separate label/title size or
    shorten the spacing.'
  - 'CQ-01 (code): the move_ring_labels function breaks the Imports → Data → Plot
    → Save structure → do the label rewrite inline on chart.render_tree() and save
    that tree (e.g. via cairosvg) instead of a named filter function. Likely cause:
    chart.add_xml_filter(move_ring_labels) requires a callable.'
  - 'Suggestion: add a few pixels of space between each legend swatch and its text
    — the boxes currently touch the labels.'
  - 'Suggestion: list the legend from Calm to Strong so it reads in the same inner-to-outer
    order as the stacked segments.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole 2400x2400 canvas.
      Chrome: title "polar-bar · python · pygal · anyplot.ai" in dark ink at the top (~65% width); compass labels N, NE, E, SE, S, SW, W, NW at the rim in dark ink (diagonals rotated); dashed muted concentric rings with labels 4%-24% placed between N and NW; x_title "Rings: Frequency (%) of all observations" in large dark text below the rose; 2-column legend at the bottom (Strong, Moderate, Light, Calm). All text readable.
      Data: eight stacked wedges radiating from the centre, W longest (~23.5%), NW second, E/SE/NE short; segments in four imprint_seq steps from brand green #009E73 (Calm, innermost) to blue #4467A3 (Strong, outermost). The 12% and 16% ring labels touch the NW bar edge.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, compass labels, ring labels, x_title and legend text all in light ink #F0EFE8, clearly readable; rings and spokes in light muted grey, subtle but visible. No dark-on-dark text.
      Data: bar colors identical to the light render (same four imprint_seq steps); brand green Calm segments read well on the dark surface.
      Legibility verdict: PASS
