review:
  strengths:
  - 'Stacked wedges with radial edges: pygal''s Radar chart is fed STEPS_PER_SECTOR
    samples per direction, and samples outside BAR_FILL drop to zero, so every direction
    gets one bar of equal angular width with a clear gap to its neighbours, in clockwise
    compass order from N at the top.'
  - 'Stacking is correct and consistent: the cumulative sums are drawn outermost-first,
    so every bar shows Calm, Light, Moderate and Strong in the same radial order,
    each segment as long as its own value, on a radial scale that starts at 0.'
  - x_labels_major together with show_minor_x_labels=False labels only the eight compass
    samples at the rim, which keeps the 128 underlying samples invisible.
  - 'Theme chrome works in both renders: the #FAF8F1 and #1A1A17 backgrounds, light
    or dark ink for the title, compass labels and legend, and dashed muted rings and
    spokes that stay visible on both surfaces.'
  - The data is a plausible wind rose with a westerly prevailing wind (W and NW dominate,
    E and SE are weak). It is generated deterministically and kept in a tidy df that
    is pivoted for pygal.
  - The interactive HTML export keeps pygal's native hover tooltips and its clickable
    legend for toggling the speed classes.
  weaknesses:
  - 'VQ-07 (both): the four speed classes are ordered categories (Calm < Light < Moderate
    < Strong) but use the unordered categorical palette (#009E73, #C475FD, #4467A3,
    #BD8233), which hides their order → color them with four ordered steps of imprint_seq
    (#009E73 → #4467A3), Calm to Strong. Likely cause: the colors=tuple(IMPRINT_PALETTE[i
    % len(IMPRINT_PALETTE)] ...) line in Style; interpolate the steps with the library
    prompt''s _lerp_hex instead (this also removes the modulo, which would recycle
    colors).'
  - 'SC-03, VQ-05 (both): the polar area is an ellipse, not a circle. The 32 ring
    sits about 727 px from the center horizontally but only about 645 px vertically
    (about 12 % wider), so W and E bars are drawn about 12 % longer per unit than
    N and S bars, and bar lengths in different directions cannot be compared → a circular
    plot area (horizontal radius = vertical radius, delta about −80 px horizontally).
    Likely cause: pygal Radar sizes its radii from the plot box, which the bottom
    legend makes wider than it is tall; make the plot box square (for example raise
    the legend''s height share or move the legend so the box''s width equals its height).'
  - 'SC-02, VQ-02 (both): the concentric rings'' value labels for 8 and 16 sit along
    the N spoke and are hidden under the N bar, and the 0 label at the center is overdrawn
    by the wedge tips. Only 24 and 32 can be read, so the shorter bars, which are
    most of them, cannot be read against a labelled ring → visible labels on every
    ring. Likely cause: pygal draws the y labels on the first spoke (N), which the
    bars cover; draw the N label on a spoke where it stays clear (for example start
    the samples so that the label spoke falls in a gap between bars) or set y_labels
    explicitly so the labels stay legible.'
  - 'DQ-03 (both): the ''Frequency (%)'' values add up to 142 % across all 32 direction
    × speed cells (Calm 55, Light 45, Moderate 27, Strong 15), but wind-rose frequencies
    are shares of all observations and should total 100 % (delta −42 percentage points)
    → scale the counts so that they sum to 100. Likely cause: the hand-typed speeds
    dict.'
  - 'VQ-06 (both): the radial value labels (24, 32) carry no unit or quantity, so
    the reader cannot tell the scale shows frequency in percent → name the radial
    quantity, for example ''Frequency (%)'' as a y_title or as a % suffix on the ring
    labels. Likely cause: no y_title / value_formatter set from the FREQUENCY constant.'
  - 'Suggestion: the empty band between the S label and the legend could go to a larger
    rose once the plot area is circular.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole 2400x2400 canvas.
      Chrome: the title "polar-bar · python · pygal · anyplot.ai" is centered in dark ink at the top. The compass labels N, NE, E, SE, S, SW, W and NW sit at the rim in dark ink, rotated along their spokes. Thin dark spokes run out from the center, and dashed muted concentric rings mark the radial scale. Only the ring labels "24" and "32" can be read along the N spoke: the 8 and 16 labels are hidden under the N bar, and the 0 at the center is overdrawn by the wedge tips. The rings are visibly elliptical, wider than they are tall. A two-column legend at the bottom lists Strong, Moderate, Light and Calm with square swatches.
      Data: eight stacked wedges with radial edges and gaps between them. Calm is #009E73 (innermost), Light #C475FD, Moderate #4467A3 and Strong #BD8233 (outermost). W is the longest bar (about 33), NW is next, N and SW are medium, and NE, E, SE and S are short.
      Legibility verdict: PASS. All visible text is clearly readable; the inner ring labels are hidden, not illegible.

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: the title, compass labels, the 24/32 ring labels and the legend text are drawn in light ink #F0EFE8, so there is no dark-on-dark text. The spokes are light, and the dashed rings are muted grey and still visible. The same inner-label occlusion and elliptical rings as in the light render.
      Data: the wedge colors are identical to the light render (#009E73, #C475FD, #4467A3, #BD8233), with the same geometry; only the chrome flipped.
      Legibility verdict: PASS.
