review:
  strengths:
  - 'Theme tokens threaded through every chrome element: backgrounds #FAF8F1 / #1A1A17,
    readable ink in both renders, gridlines subtle but visible'
  - 16-direction wind rose with clockwise compass orientation (direction='clockwise',
    rotation=90) and a zero-based radial scale with % suffix
  - Page-colored segment separators keep the stacked bins crisp in both themes
  - Tidy table with column constants pivoted once and one go.Barpolar per bin; per-trace
    hovertemplate adds detail in the HTML
  weaknesses:
  - 'VQ-02 (both): the radial tick labels 0%, 2% and 4% sit on the short SE and ESE
    bars near the center, so the bars and the digits cover each other → labels clear
    of the data marks. Likely cause: radialaxis angle=-11 places the tick spoke through
    occupied ESE sectors; an angle through the empty S–SW sector avoids it.'
  - 'VQ-05 (both): about 270 px of empty band between the title and the N label while
    the polar disc is squeezed by the 0.82 x-domain → the disc fills the free vertical
    space. Likely cause: polar domain x=[0.0, 0.82], y=[0.0, 0.9] with the 0.82 width
    as the binding constraint and t=70 margin.'
  - 'VQ-07 (both): the four wind-speed bins are ordered (0-5 < 5-12 < 12-20 < 20+)
    but are drawn in the categorical palette (green, lilac, blue, ochre) as if unrelated
    groups → four ordered steps of imprint_seq (#009E73 → #4467A3) in bin order. Likely
    cause: IMPRINT_PALETTE[i] lookup for the speed bins.'
  - 'Suggestion: the legend entries repeat ''km/h'' that the legend title already
    states; ''0-5'', ''5-12'', … would read cleaner.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across canvas and polar disc; 2400x2400 square.
      Chrome: title "polar-bar · python · plotly · anyplot.ai" in dark ink at top center; 16 compass labels (N … NNW) at the rim in dark ink; radial tick labels 0%–16% in soft ink along a spoke at about -11°; subtle grey concentric gridlines and spokes; dark outer ring; legend box at right titled "Wind speed (km/h)" with 0-5, 5-12, 12-20, 20+ km/h. All readable. Radial labels 0%, 2%, 4% overlap short bars near the center. Large empty band between title and the disc.
      Data: stacked wedges, green #009E73 (0-5), lilac #C475FD (5-12), blue #4467A3 (12-20), ochre #BD8233 (20+), separated by page-colored outlines. Dominant lobe NNE–ENE (NE about 15 %), weak secondary SW lobe, near-empty W–NW and S–SE sectors.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17 across canvas and polar disc.
