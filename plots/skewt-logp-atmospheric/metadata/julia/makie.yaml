review:
  strengths:
  - Dry adiabats, moist adiabats (numerically integrated pseudo-adiabats) and mixing-ratio
    lines are all computed from thermodynamic relations, each family with its own
    line style (dashed, dash-dot, dotted) and kept lighter than the profiles
  - Temperature (#009E73, solid, 3.5 px) and dewpoint (#C475FD, dashed, 3.5 px) are
    the two most prominent lines in both themes, with the dewpoint left of the temperature
    at every level
  - 'Theme chrome flips correctly: page, ink, tick, spine and legend tokens adapt,
    and the data colors are identical in both renders'
  - Realistic 20-level tropical convective sounding from 1000 to 100 hPa
  weaknesses:
  - 'SC-01, SC-02, SC-03 (both): the pressure axis runs from 1000 hPa at the top edge
    to 100 hPa at the bottom, so the whole diagram is mirrored vertically: the surface
    sits at the top, the isobars spread apart downward instead of upward, the isotherms
    run from upper left to lower right instead of rising to the right, and the bottom-edge
    temperature ticks (-40° to 40°) sit on the 100 hPa edge, where every isotherm
    is offset by +45 °C from its label → 1000 hPa on the bottom edge and 100 hPa on
    the top, so the isotherms rise to the right and the bottom ticks hold along the
    surface. Likely cause: the y orientation produced by `yreversed = true` together
    with `ylims!(ax, y_p(100) - 0.02, y_p(1000) + 0.02)` on y = log10(P); after the
    fix, check in the render that 1000 hPa lands at the bottom.'
  - 'DQ-03 (both): the CAPE fill does not follow the lifted-parcel trace it belongs
    to: at 200 hPa the fill''s right edge lies about 15 °C (skewed units) to the right
    of the drawn parcel line, and the fill continues to 100 hPa although the drawn
    parcel crosses to the cold side of the environment near 130 hPa → the fill bounded
    by the same parcel path that is drawn (0 °C offset), ending where the parcel becomes
    colder than the environment. Likely cause: `parcel_Ts_obs` comes from `lifted_parcel_temps`
    over the 20 coarse P_OBS levels (one Euler step per 50–100 hPa), while the drawn
    trace uses the 300-level P_FINE path.'
  - 'VQ-01 (both): the mixing-ratio labels "2", "8", "12", "20" are drawn in the line
    color at 40–48 % alpha and almost vanish on the dark background, and the isotherm
    labels along the 1000 hPa edge, which act as the temperature scale, are at 10
    px, below the 12 px tick-label reference → opaque INK_SOFT (or an opaque family
    color) for the mixing-ratio labels and 12 px for both label sets (+2 px). Likely
    cause: `color = mix_col` and `fontsize = 10` in the two `text!` loops.'
  - 'VQ-02 (both): the "12" mixing-ratio label at 600 hPa is crossed by the lifted-parcel
    trace and the CAPE edge, and the "LCL" label sits on the temperature line near
    925 hPa → both labels clear of the profile lines by a few px. Likely cause: the
    label positions at the line end (`x_top, y_top`) and at `lcl_x + 1.5`.'
  - 'VQ-03 (both): the legend line samples for Dry adiabat, Moist adiabat and Mixing
    ratio are 0.7–0.8 px lines at 22–48 % alpha and are barely visible, the Mixing
    ratio sample is effectively invisible on the dark background, and the mixing-ratio
    lines themselves nearly disappear in the dark render → legend samples at least
    2 px wide and opaque enough to match the families, and mixing-ratio lines at about
    0.6 alpha in dark (+0.2). Likely cause: `axislegend` inherits `linewidth = 0.7/0.8`
    and the low-alpha colors; the `RGBAf(0.0f0, 0.75f0, 0.55f0, 0.40f0)` dark mixing
    color.'
  - 'VQ-05 (both): the x range runs to 88 while every profile and every bottom tick
    label stops at 40, so the right third of the plot area holds only reference lines
    → an x range of about -47 to 50 (-38 units). Likely cause: `xlims!(ax, -47.0,
    88.0)`.'
  - 'VQ-07 (both): the three reference-line families use hand-written colors outside
    the Imprint palette: the dry adiabats in RGBAf(0.84, 0.37, 0.0) ≈ #D65E00 and
    the moist adiabats in RGBAf(0.0, 0.447, 0.698) ≈ #0072B2 (legacy Okabe-Ito hues),
    and the mixing-ratio lines in a near copy of brand green, which already belongs
    to the temperature series → Imprint members not used by the data series (for example
    #4467A3, #2ABCCD, #954477) at low alpha, or tints of the neutral anchor. Likely
    cause: the `dry_col`, `moist_col` and `mix_col` RGBAf literals.'
  - 'CQ-01 (code): lines 62–79 wrap single expressions in the helper functions `isotherm_line`,
    `dry_adiabat_line` and `mixing_ratio_line`, each called from one loop → inline
    the expression into its loop and keep functions only where an integration loop
    is reused. Likely cause: function-per-family structure.'
  - 'CQ-04 (code): lines 214–219, 229–234 and 247–252 duplicate each `lines!` call
    in an if/else only to pass or omit `label` → one call with `label = i == 1 ? "Dry
    adiabat" : nothing` (Makie''s default label is `nothing`), about 12 lines removed.
    Likely cause: the `isnothing(lbl)` branches.'
  - 'Suggestion: wind barbs in a column along the right edge, which the Notes allow,
    would use the space the narrowed x range leaves free.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white, matches #FAF8F1.
      Chrome: bold title "skewt-logp-atmospheric · julia · makie · anyplot.ai" in dark ink, about 30 % of the width; "Pressure (hPa)" and "Temperature (°C)" axis titles and the tick labels in dark INK_SOFT, all readable. Left and bottom spines only, faint isobars instead of a grid. The pressure ticks run 1000, 925, 850 at the TOP to 100 at the BOTTOM, so the diagram is upside down: the gaps between pressure ticks widen downward, the gray isotherms run from upper left to lower right, and isotherm labels -40° to 60° sit along the 1000 hPa line at the top. The bottom ticks -40° to 40° stop at x = 40 while the axis runs to 88. Legend top-right on an elevated box: Dry adiabat, Moist adiabat, Mixing ratio (line samples barely visible), CAPE, Lifted parcel, Temperature, Dewpoint.
      Data: temperature as a solid #009E73 line with small dots, dewpoint as a dashed #C475FD line to its left at every level; a dash-dot-dot ochre (#BD8233) lifted-parcel trace with an LCL diamond and label near 925 hPa; a matte-red (#AE3030, 0.45 alpha) CAPE fill between the temperature and a coarser parcel path, extending to 100 hPa and visibly right of the drawn parcel trace. Faint orange dashed dry adiabats, blue dash-dot moist adiabats, green dotted mixing-ratio lines with small labels 2, 8, 12, 20 at 600 hPa; "12" is crossed by the parcel line. The right third of the plot holds only reference lines.
      Legibility verdict: PASS (all chrome readable; the mixing-ratio labels are faint)

    Dark render (plot-dark.png):
      Background: warm near-black, matches #1A1A17.
      Chrome: title, axis titles and tick labels in light ink, all readable; no dark-on-dark chrome. Legend box dark elevated with light labels; the Dry adiabat, Moist adiabat and Mixing ratio samples are nearly invisible.
      Data: the temperature, dewpoint, parcel and CAPE colors are identical to the light render (the CAPE fill reads as a dark red block). The reference families are very faint; the mixing-ratio lines and their labels "2", "8", "12", "20" almost vanish on the dark background. Same upside-down orientation as the light render.
      Legibility verdict: PASS for the chrome; the mixing-ratio labels are close to unreadable
