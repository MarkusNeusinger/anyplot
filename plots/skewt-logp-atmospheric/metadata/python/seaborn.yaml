review:
  strengths:
  - Logarithmic, inverted pressure axis with standard mandatory levels (1000, 850,
    700, 500 ... 50 hPa) as labelled ticks
  - Temperature and dewpoint are the two most prominent lines, told apart by color,
    solid vs dashed and circle vs square markers, with dewpoint left of temperature
    at every level
  - 'Idiomatic seaborn: sns.lineplot with units= and estimator=None draws each reference-line
    family in one call; the profiles use hue/style with markers and dashes dicts'
  - Theme tokens threaded through all chrome; both renders fully legible with identical
    data colors
  weaknesses:
  - 'SC-02 (both): the isotherms lean only about 3° from vertical instead of the 45°
    the Notes and C2 ask for, so the diagram reads as an unskewed log-P chart and
    the dry adiabats lie almost flat → isotherms rising at 45° on screen (skew of
    roughly 35–40 °C per unit of ln p on this canvas, about +35 °C/ln p). Likely cause:
    skew_slope = tan(45°) = 1 is applied in °C per ln(p) without converting to the
    axes'' aspect.'
  - 'SC-03 (both): the x range starts at -50, so the temperature profile above 250
    hPa (-52 to -75 °C) and the dewpoint above 400 hPa run off the left edge of the
    axes and the stratospheric inversion is not shown, leaving the upper half of the
    diagram empty → every level inside the axes (with a correct skew the profile shifts
    right; otherwise widen T_LEFT by about -30 °C). Likely cause: T_LEFT = -50 with
    the near-zero skew.'
  - 'DQ-03 (both): the shaded band between the temperature and dewpoint traces is
    labelled "CAPE Region", but that band is the dewpoint depression; CAPE is the
    area between a lifted parcel''s path and the environment temperature → label the
    band correctly or shade the parcel-path area. Likely cause: fill_betweenx(pressure,
    x_dew, x_temp) with the legend label ''CAPE Region''.'
  - 'DQ-03 (both): the moist adiabats run parallel to the dry adiabats at every level
    instead of steepening toward the isotherms in the warm lower troposphere and converging
    with the dry adiabats aloft → a pseudo-adiabatic lapse rate (e.g. integrate dT/dp
    from the saturated lapse rate). Likely cause: t_moist = (theta_e - 30) * (p/1000)**0.30
    - 273.15 is a dry-adiabat shape with a different exponent.'
  - 'VQ-03 (dark): the moist adiabats (#4467A3 at alpha 0.40, 0.5 pt dashed) and the
    mixing-ratio lines (#BD8233 at alpha 0.40, dotted) almost vanish on #1A1A17, so
    the two families are hard to tell apart from the background → raise their alpha
    to about 0.6 in the dark theme (+0.2). Likely cause: one alpha value for both
    themes.'
  - 'Suggestion: label a few isotherms, dry adiabats and mixing-ratio lines along
    the top or right edge so the families can be read without the legend.'
  - 'Suggestion: wind barbs along the right edge, which the Notes allow, would add
    the diagram''s usual wind column.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, not pure white.
      Chrome: title 'skewt-logp-atmospheric · python · seaborn · anyplot.ai' in dark ink, axis labels 'Temperature (°C)' and 'Pressure (hPa)', log pressure ticks 1000…50 hPa and temperature ticks -40…40 in soft ink; legend upper left on an elevated box with 7 entries. All text readable.
      Data: temperature in #009E73 solid with circle markers, dewpoint in #C475FD dashed with square markers, reddish fill between them labelled 'CAPE Region'. Reference lines: grey isotherms that lean only slightly right of vertical, red dry adiabats as nearly straight lines falling from upper left to lower right, blue dashed moist adiabats parallel to them, faint tan dotted mixing-ratio lines below 400 hPa. Both profiles leave the left edge of the axes (temperature above 250 hPa, dewpoint above 400 hPa), so the upper half is empty.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17, not pure black.
