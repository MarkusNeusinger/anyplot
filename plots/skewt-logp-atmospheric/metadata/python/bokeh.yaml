review:
  strengths:
  - 'Correct Skew-T geometry: log-pressure axis inverted with 1000 hPa at the bottom,
    isotherms rising lower-left to upper-right at 45°, every level at x = T − 45·log10(p/1000).'
  - 'Physically computed reference families: mixing ratio lines from e = w·p/(622+w)
    and the inverse Magnus formula, moist adiabats by integrating the pseudoadiabatic
    lapse rate, dry adiabats from Poisson''s equation.'
  - 'Clear hierarchy: temperature solid green and dewpoint dashed purple at 5 px with
    markers over thin translucent reference families, each with its own color and
    dash pattern, keyed by in-chart labels in the family color.'
  - 'Idiomatic bokeh: one ColumnDataSource drives both lines, both scatters and per-renderer
    HoverTool tooltips, with CrosshairTool and WheelZoomTool in the HTML.'
  - Theme-adaptive chrome works in both renders, including the elevated legend fill
    and the page background painted for the screenshot.
  weaknesses:
  - 'Suggestion: the Mixing Ratio label at (−44, 590 hPa) and the Moist Adiabats label
    at (34, 195 hPa) now sit away from the lines they name; placing each beside one
    of its curves would key the families by position as well as color.'
  - 'Suggestion: wind barbs, which the Notes allow, in a column along the right edge
    would add the wind profile.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white #FAF8F1 across the 3200x1800 canvas.
      Chrome: Bold title "skewt-logp-atmospheric · python · bokeh · anyplot.ai" top left in dark ink; italic axis titles "Temperature (°C) — Skewed Coordinates" and "Pressure (hPa)"; x ticks −40..40, log y ticks 100..1000 with minor ticks; legend top left on elevated fill (0°C Isotherm, Temperature, Dewpoint). All text readable.
      Data: Temperature #009E73 solid with round markers from 25 °C at 1000 hPa to about −68 °C at 100 hPa, tropopause bend near 250 hPa; dewpoint #C475FD dashed with diamonds, left of the temperature throughout. Blue #4467A3 0 °C isotherm; faint grey 45° isotherms, red dashed dry adiabats, cyan dash-dot moist adiabats curving toward the dry adiabats aloft, ochre dotted mixing ratio lines rising steeper than the isotherms from about −17 to 25 °C at 1000 hPa. Labels "Dry Adiabats", "Moist Adiabats" (clear of the blue line), "Mixing Ratio" in family colors.
