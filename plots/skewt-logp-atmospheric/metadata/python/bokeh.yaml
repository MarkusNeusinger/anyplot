review:
  strengths:
  - 'Correct Skew-T geometry: log-pressure axis inverted with 1000 hPa at the bottom,
    isotherms rising lower-left to upper-right at 45°, and every sounding level placed
    at its own pressure and its temperature along the skew (x = T − 45·log10(p/1000)).'
  - 'Clear hierarchy between the profiles and the reference lines: temperature solid
    green and dewpoint dashed purple at 5 px with markers, over thin, translucent
    reference families, with the dewpoint kept at or left of the temperature at every
    level.'
  - Each reference family has its own color and dash pattern (dry adiabats red dashed,
    moist adiabats cyan dash-dot, mixing ratio ochre dotted, isotherms muted solid),
    and an in-chart label in the family color keys them directly, so the legend stays
    focused on the profiles.
  - 'Idiomatic bokeh: one shared ColumnDataSource for the sounding drives both lines,
    both scatters and the per-renderer HoverTool tooltips (pressure, temperature,
    dewpoint), with a CrosshairTool for reading values off the skewed grid in the
    HTML.'
  - 'Theme-adaptive chrome works in both renders: warm off-white and near-black surfaces,
    INK/INK_SOFT text, elevated legend fill, and the page background is painted for
    the screenshot, so the dark canvas has no stray edge.'
  weaknesses:
  - 'DQ-03 (both): the mixing ratio lines are drawn at a constant temperature td =
    -40 + 10*log10(w+1), so they run parallel to the isotherms between -37 °C and
    -27 °C; the defining relation w = 622*e/(p-e) with the Magnus dewpoint puts the
    20 g/kg line at about 24.7 °C at 1000 hPa (observed -26.8 °C, delta -51.5 °C)
    and the 1 g/kg line at about -17.1 °C (observed -37.0 °C, delta -19.9 °C) → compute
    each line''s dewpoint per pressure level from e = w*p/(622+w) and the inverse
    Magnus formula, so the lines run steeper than the isotherms. Likely cause: the
    pressure-independent td_mr constant in the mixing-ratio loop.'
  - 'DQ-03 (both): the moist adiabats drop a fixed 0.03 °C per hPa (dt = -0.006 *
    dp * 10 * 0.5), so the 30 °C pseudoadiabat sits at about +6 °C at 200 hPa where
    integrating the pseudoadiabatic lapse rate gives about -31.7 °C (delta +37.7 °C);
    the curves stay near-vertical arcs instead of bending toward the dry adiabats
    aloft → integrate dT/dp = (Rd*T/p + L*rs/p) / (cp + L^2*rs*eps/(Rd*T^2)) with
    the saturation mixing ratio rs at each step. Likely cause: the constant dt in
    the moist-adiabat loop.'
  - 'VQ-02 (both): the "Moist Adiabats" label at (24 °C, 195 hPa) is crossed by the
    blue 0 °C isotherm through the letters "ba" → start the label right of that line,
    at about x = 34 (+10 °C skewed units), or anywhere the isotherm does not pass.
    Likely cause: Label(x=24, y=195).'
  - 'VQ-03 (dark): the mixing ratio lines (#BD8233, 1.2 px, alpha 0.40, dotted) nearly
    vanish on #1A1A17 and are hard to tell from the isotherms → about 2 px and alpha
    0.6 (+0.8 px, +0.2), still lighter than the profiles. Likely cause: line_width=1.2
    and line_alpha=0.40 on the mixing-ratio fig.line.'
  - 'Suggestion: wind barbs, which the Notes allow, in a column along the right edge
    would add the wind profile.'
  - 'Suggestion: the dew_base list spreads over 27 lines while temp_base fits on one;
    writing it on one or two lines would shorten the data block.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white #FAF8F1 across the whole 3200x1800 canvas, no stray edge.
      Chrome: Bold title "skewt-logp-atmospheric · python · bokeh · anyplot.ai" in dark ink at top left; italic axis titles "Temperature (°C) — Skewed Coordinates" and "Pressure (hPa)"; x ticks -40..40, y ticks 100..1000 on a log axis with minor ticks; legend top left on elevated fill (0°C Isotherm, Temperature, Dewpoint). All text readable.
      Data: Temperature profile #009E73 solid with round markers from 25 °C at 1000 hPa to about -68 °C at 100 hPa (tropopause bend near 250 hPa); dewpoint #C475FD dashed with diamond markers, always left of the temperature. 0°C isotherm in blue #4467A3 at 3 px; faint grey 45° isotherms, red dashed dry adiabats, cyan dash-dot moist adiabats, faint ochre dotted mixing ratio lines in the lower left. In-chart labels "Dry Adiabats", "Moist Adiabats" (crossed by the blue 0 °C line), "Mixing Ratio" in their family colors.
      Legibility verdict: PASS

