review:
  strengths:
  - Log pressure axis inverted with 1000 hPa at the bottom
  - All four reference families present, each in its own Imprint color and dash pattern,
    lighter than the profiles
  - Theme tokens threaded through title, axes and grid; both renders readable
  - Vega-Lite tooltips in the HTML output
  weaknesses:
  - 'SC-03 (both): the temperature and dewpoint lines join the levels in x order,
    not pressure order, so above 400 hPa the temperature trace jumps straight to 100
    hPa and zigzags back down through 150, 300, 200 and 250 hPa → connect the levels
    from the surface upward. Likely cause: mark_line sorts by x without an order encoding
    on pressure.'
  - 'SC-04 (both): no legend, so the six colors and dash styles (temperature, dewpoint,
    isotherm, dry and moist adiabat, mixing ratio) have no key → a legend naming each
    element type. Likely cause: the legend on the profile layer is dropped by the
    layer configuration.'
  - 'VQ-05 (both): the chart occupies only the central part of the 3200x1800 canvas
    with wide empty margins, and the reference lines overflow the plot frame → width=800,
    height=450 with autosize fit, and lines kept inside the view. Likely cause: width=540,
    height=300 without autosize, mark_line without clip=True.'
  - 'VQ-02 (both): reference lines run left of the y-axis into the pressure tick-label
    gutter → keep them inside the view. Likely cause: mark_line without clip=True.'
  - 'SC-02 (both): isotherms rise at about 56° from horizontal, not the 45° the Notes
    ask for → about 45°. Likely cause: skew_factor=40 not matched to the view''s aspect
    ratio.'
  - 'Suggestion: the moist adiabats are a power law theta_e*(p/1000)**0.23 that runs
    nearly parallel to the dry adiabats; a pseudo-adiabatic integration would bend
    them correctly.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1.
      Chrome: title "skewt-logp-atmospheric · python · altair · anyplot.ai" in dark ink; y-axis "Pressure (hPa)" log ticks 100-1,000 with 1000 at the bottom; x-axis "Temperature (°C, skewed)" ticks -40 to 60; subtle grid; no legend. All text readable. The chart occupies only the central part of the canvas with wide empty margins on every side.
      Data: Temperature solid green #009E73 with markers at 11 levels, Dewpoint dashed purple #C475FD; above 400 hPa both traces zigzag (temperature jumps from 400 hPa straight to 100 hPa, then back down to 150, 300, 200 and 250 hPa) because the points are joined in x order. Blue dashed isotherms, amber dry adiabats, red dashed moist adiabats, cyan dotted mixing-ratio lines at 40 % opacity; reference lines spill past the plot frame on the left and right.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
