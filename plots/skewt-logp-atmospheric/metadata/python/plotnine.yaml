review:
  strengths:
  - Shared scale_color_manual + scale_linetype_manual with common breaks give one
    legend that encodes every family by color and linetype
  - 'Theme tokens threaded through title, ticks, border and legend: both renders read
    cleanly'
  - Imprint palette in canonical order, brand green on the temperature profile
  weaknesses:
  - 'VQ-02 (both): the bold ''Td'' label at 600 hPa sits on the dewpoint trace''s
    dash → clear of the line by at least a few px. Likely cause: annotate x offset
    of only -6 data units with size=12 (mm, about 34 pt).'
  - 'VQ-03 (both): mixing-ratio lines draw solid in the 1000-600 hPa band and their
    legend swatch is solid while the style is dash-dot, so they read like isotherms
    → one continuous dash-dot path per line. Likely cause: each curve is cut into
    25 hPa geom_segment pieces, and each restarts the dash pattern.'
  - 'VQ-05 (both): an empty band below 100 hPa (about 10 % of the panel) and a blank
    right fifth of the panel → limits fitted to the sounding and reference lines.
    Likely cause: y limits p*1.1/p*0.9 and x limit x_max + 20.'
  - 'SC-01, SC-02, SC-03 (both): the pressure axis is not inverted: 1000 hPa sits
    at the top and 100 hPa at the bottom, so the whole diagram is upside down → surface
    (1000 hPa) at the bottom, pressure decreasing upward (C1). Likely cause: scale_y_continuous(trans=''log10'',
    limits=(high, low)) does not reverse in plotnine; use a reversed log transform
    (mizani trans_new on -log10) or plot -log10(p) with relabelled breaks.'
  - 'SC-02 (both): isotherms rise at about 77° from horizontal, not the 45° the Notes
    ask for (C2) → about 45° (−32°). Likely cause: skew constant 40 per log-decade
    is too small for the panel''s aspect.'
  - 'SC-02 (both): no isobars are visible although isobar_df is built → horizontal
    lines at the standard levels (C1). Likely cause: isobar x starts at skew_transform(T_MIN
    - 20) ≈ −100, below the x limit, so plotnine drops every row.'
  - 'SC-03 (both): the dewpoint trace ends at 300 hPa; the 250-100 hPa levels are
    dropped, and the x axis carries no temperature ticks → all levels inside the axes
    and temperature values along the bottom edge. Likely cause: dewpoints near −100
    °C skew below x_min − 10; scale_x_continuous(breaks=[]).'
  - 'DQ-03 (both): moist adiabats cool only about 0.3 °C per 25 hPa and run almost
    parallel to the isotherms, where real ones curve from about 3.5 °C/km near the
    surface toward the dry adiabats aloft → integrate the saturated lapse rate (or
    use a pseudo-adiabat formula). Likely cause: t_cur -= (5.5 or 6.0) * 0.05 per
    step.'
  - 'CQ-01 (code): two helper functions skew_transform and segments, and # Constants
    lists the sample''s pressure levels (ISOBARS, PRESSURE_BREAKS) → inline the skew
    expression, no helpers, and derive breaks from df. Likely cause: helper-function
    structure.'
  - 'CQ-04 (code): lines 104-150 build every reference curve as per-point geom_segment
    rows → one long data frame with a curve id and geom_path(aes(group=...)). Likely
    cause: segment-based drawing instead of grouped paths.'
  - 'Suggestion: wind barbs along the right edge would add the optional wind information.'
