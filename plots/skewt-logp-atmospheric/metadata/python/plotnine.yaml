review:
  strengths:
  - coord_fixed(ratio=SKEW) couples the isotherm skew to the panel aspect, so the
    isotherms sit at exactly 45° in the render
  - Inverted log-pressure axis via log10(p) on scale_y_reverse with relabelled breaks;
    isobars drawn at the same levels
  - 'Physically computed reference families: dry adiabats from Poisson''s equation,
    moist adiabats by integrating the saturated lapse rate, mixing ratio lines from
    the Magnus inversion'
  - Shared scale_color_manual + scale_linetype_manual with common breaks merge into
    one legend telling all six line families apart by color and style
  - Theme tokens threaded through title, ticks, border and legend; both renders read
    cleanly
  weaknesses:
  - 'Suggestion: wind barbs along the right edge would add the optional wind information.'
  - 'Suggestion: labelling a few isotherm, dry-adiabat and mixing-ratio values inside
    the panel would let a reader read temperatures off the skewed lines away from
    the bottom edge.'
