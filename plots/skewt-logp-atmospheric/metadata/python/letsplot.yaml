review:
  strengths:
  - Temperature and dewpoint are the dominant lines — size-2 paths with markers over
    translucent size 0.4–0.8 reference lines — told apart by color and solid/dashed
    in both themes, dewpoint left of temperature at every level
  - Three reference families distinguished by color and line style (dashed, dot-dash,
    dotted) plus gray isotherms
  - layer_tooltips() with custom .line() formats reports the unskewed temperature/dewpoint
    and pressure in the HTML output
  - Theme tokens threaded through all chrome; both renders fully readable
  weaknesses:
  - 'SC-02 (both): the pressure axis is linear — ticks 100…1000 hPa are evenly spaced,
    so isobars do not spread apart toward the top (C1) → a logarithmic, inverted axis.
    Likely cause: scale_y_reverse(limits=…) after scale_y_log10() replaces the log
    scale; use one y scale, e.g. scale_y_log10() with a reversed transform (or plot
    -log10(p) with pressure tick labels).'
  - 'SC-02 (both): isotherms rise at about 70 degrees, not the 45 degrees the Notes
    ask for → about 45 degrees (−25°). Likely cause: SKEW_FACTOR = 40 is not tied
    to the panel aspect and the linear y axis; derive the skew from the axis span
    and ggsize.'
  - 'SC-03, DQ-03 (both): sounding levels do not sit at their temperature along the
    drawn isotherms — the 500 hPa point (data −21 °C) lies on the −31 °C isotherm
    (Δ −10 °C) → each level on its own isotherm. Likely cause: isotherms are straight
    segments in linear pressure while the profiles are skewed by log10(p0/p).'
  - 'SC-03 (both): the x axis spans −100 to 160 °C for a sounding that spans −46 to
    25 °C, so most of the panel is reference lines → limit x to the sounding plus
    a margin (about −60 to 50 °C at the bottom). Likely cause: no x limits; dry adiabats
    up to θ = 430 K set the range.'
  - 'DQ-03 (both): moist adiabats start at 7–77 °C and lean right instead of curving
    toward colder temperatures with height, and the 20 g/kg mixing ratio line sits
    at about 33 °C at 1000 hPa (real ≈ 25 °C) → pseudo-adiabats and mixing-ratio lines
    from the standard thermodynamic formulas. Likely cause: the ad-hoc expressions
    t_surface − 6.5·2.5·ln(p0/p)·0.8 and 35·log10(ws·p/622) − 20.'
  - 'CQ-04 (code): lines 225–246 hand-build the legend from 5 geom_segment + geom_text
    layers → map color and linetype in aes() on a long-format reference/profile frame
    with scale_color_manual + scale_linetype_manual (about −15 lines). Likely cause:
    series drawn as separate layers with constant colors.'
  - 'Suggestion: wind barbs along the right edge, which the Notes allow, would add
    the diagram''s usual wind column.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1.
      Chrome: bold title 'skewt-logp-atmospheric · python · letsplot · anyplot.ai' at about 62% width; 'Pressure (hPa)' and 'Temperature (°C)' axis titles and ticks (100–1,000 hPa evenly spaced, -100 to 160 °C) in dark ink, all readable. Legend top right (Temperature, Dewpoint, Dry Adiabat, Moist Adiabat, Mixing Ratio) with labels at about tick-text size; gap before 'Mixing Ratio' larger than the others.
      Data: temperature #009E73 thick solid line with markers, dewpoint #C475FD thick dashed with markers, left of temperature throughout; gray isotherms at about 70 degrees; red dashed dry adiabats curving left; ochre dot-dash moist adiabats nearly vertical at 7–87 °C; teal dotted mixing ratio lines vertical from about 180 hPa down. The pressure axis is linear.
      Legibility verdict: PASS

