review:
  strengths:
  - The skew is computed from the plot box (SKEW = 90 °C × 1360 px / 2906 px ≈ 42),
    so the isotherms rise at a true 45° and every level sits at its own pressure and
    temperature along them
  - 'Clear line-weight hierarchy: both profiles are 7 px over 2 to 2.5 px reference
    families, and each family has its own Imprint tint and dash pattern (solid ochre
    dry adiabats, dashed blue moist adiabats, dotted lavender mixing-ratio lines,
    thin muted isotherms)'
  - 'The reference families are computed physically: dry adiabats from Poisson''s
    equation, moist adiabats by integrating the saturated lapse rate, and mixing-ratio
    lines from the inverted Magnus formula (1 g/kg reaches about -27.7 °C at 400 hPa)'
  - 'Uses pygal-native features: allow_interruptions with None gaps clips each family
    to the box, inline CSS sets per-series stroke widths and removes the stray upright
    x guide, and print_labels puts the mixing-ratio values on their lines'
  - The HTML tooltips reverse the skew (formatter p[0] - SKEW * p[1]), so hovering
    a level shows its true °C rather than the skewed x coordinate
  - 'Both themes are correct: warm backgrounds, all text in theme tokens, and identical
    profile colors'
  weaknesses:
  - 'VQ-02 (both): the moist adiabat that starts at 36 °C runs through the ''16''
    mixing-ratio label at about 375 hPa, so the label sits on a reference line → put
    the labels where no adiabat crosses them, for example just below the 400 hPa end
    of each line or with a page-colored text halo. Likely cause: the label y offset
    `lp_grid[len(mixing_p) - 1] + 0.05` in `mixing_labels`.'
  - 'Suggestion: wind barbs (or a wind-speed column) along the right edge, which the
    Notes allow, would fill the empty upper-right of the diagram.'
  - 'Suggestion: a denser sounding (the Data section mentions 20 to 100 levels; this
    one has 11) would show more realistic kinks than straight segments between mandatory
    levels.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the canvas and plot area.
      Chrome: bold title "skewt-logp-atmospheric · python · pygal · anyplot.ai" centered at top (~60 % width); y-axis "Pressure (hPa)" with log-spaced ticks 1000/850/700/500/400/300/200/150/100 (1000 at bottom); x-axis ticks -50..40 and title "Temperature at 1000 hPa (°C) — isotherms run diagonally at 45°"; subtle horizontal isobar guides; 3-column legend at the bottom. All dark text, fully readable.
      Data: thin muted grey isotherms at 45° rising to the right; solid ochre dry adiabats curving up-left; dashed blue moist adiabats; dotted lavender mixing-ratio lines (1, 2, 4, 8, 16 g/kg) from 1000 to 400 hPa with small value labels at their tops; temperature profile as a thick solid matte-red (#AE3030) line with dots; dewpoint as a thick dashed brand-green (#009E73) line, always left of the temperature. Both profiles clearly dominate the reference web. The '16' label is crossed by a moist adiabat.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, axis titles, ticks and legend text in light ink, all readable; no dark-on-dark text; isobar guides subtle.
      Data: the same red temperature and green dewpoint profiles as the light render; the reference families keep their hues (moist adiabats drawn at higher opacity to stay visible); the brand green reads well.
      Legibility verdict: PASS
