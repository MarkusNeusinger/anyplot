review:
  strengths:
  - A true skew-T frame computed in data space (x = T + SKEW·log10(1000/p)) with SKEW
    derived from the plot-box aspect, so the isotherms rise at 45° in the render
  - 'Physically computed reference families: dry adiabats from Poisson''s equation,
    moist adiabats integrated from the saturated lapse rate, mixing-ratio lines from
    the inverted Magnus formula'
  - 'Clear hierarchy: 7 px temperature (solid red) and dewpoint (dashed green) on
    top of thin, distinctly dashed reference families'
  - Uses pygal XY allow_interruptions to draw each whole reference family as one series,
    and a per-series formatter so HTML tooltips show the real (unskewed) temperature
  - Theme tokens threaded through Style and css; both renders fully readable
  weaknesses:
  - 'VQ-01 (both): the in-plot mixing-ratio labels (1, 2, 4, 8, 16 g/kg) render at
    34 px, below the 44 px tick-label size, and blur at the 400 px mobile width →
    about 44 px (+10 px). Likely cause: LABEL_FS = 34 feeding value_label_font_size.'
  - 'Suggestion: optional wind barbs in a column along the right edge would add the
    diagram''s usual wind information.'
  - 'Suggestion: a sounding with 20 or more levels, the Data section''s typical resolution,
    would show finer kinks than the 11 mandatory levels.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across canvas and plot box.
      Chrome: bold dark title "skewt-logp-atmospheric · python · pygal · anyplot.ai" at top; y axis "Pressure (hPa)" with ticks 100, 150, 200, 300, 400, 500, 700, 850, 1000 on a log scale with 1000 at the bottom; x axis "Temperature at 1000 hPa (°C) — isotherms run diagonally at 45°" with ticks -50 to 40; faint horizontal isobar guides; six-entry legend in three columns at the bottom. All text dark and readable; the small mixing-ratio labels 1, 2, 4, 8, 16 are readable at full size.
      Data: gray isotherms at 45° rising to the right, dense solid ochre dry adiabats curving up-left, dashed blue moist adiabats, dotted lavender mixing-ratio lines below 400 hPa; temperature as a heavy solid red #AE3030 line with dots, dewpoint as a heavy dashed brand-green #009E73 line, always left of temperature, converging near the surface and 700-850 hPa.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
