review:
  strengths:
  - Logarithmic, inverted pressure axis with standard levels labelled through ScalarFormatter
    (C1)
  - 'Temperature (solid #009E73) and dewpoint (dashed #C475FD) are the two most prominent
    lines, with dewpoint left of temperature at every level (C4)'
  - All three reference families plus isotherms are drawn behind the sounding with
    distinct line styles (solid, dashed, dash-dot, dotted)
  - 'Full theme adaptation: chrome, legend frame and marker edges use theme tokens;
    readable in both renders'
  weaknesses:
  - 'VQ-01 (both): legend text at fontsize 7, below the style guide''s 8 pt for legends
    → 8 pt (+1 pt). Likely cause: ax.legend(fontsize=7).'
  - 'VQ-03, SC-02 (both): moist adiabats and mixing-ratio lines drawn at linewidth
    0.5 with alpha about 0.11-0.13 (light) are barely visible, so the families cannot
    be told apart behind the sounding (C3) → raise them to a visible but still lighter
    level, e.g. alpha 0.3-0.4. Likely cause: REF_ALPHA=0.10 multiplied by 1.1/1.3.'
  - 'VQ-07 (both): the four reference families use custom hexes #8B4513, #228B22,
    #4169E1, #9932CC outside the Imprint palette → Imprint positions or the theme-adaptive
    muted anchor with distinct line styles. Likely cause: hard-coded color= in the
    reference-line loops and legend handles.'
  - 'SC-02 (both): isotherms rise at about 70° from horizontal (45 °C shift over the
    full 1000-100 hPa height on a 130 °C-wide axis), not the 45° the Notes ask for
    (C2) → shift equal to the axis aspect so a 1000-100 hPa span moves the isotherm
    by the visible plot width-to-height ratio (about 110-130 °C at this x-range).
    Likely cause: SKEW_MAX = 45.0 treated as degrees C instead of an angle.'
  - 'DQ-03 (both): moist adiabats use an ad-hoc moisture_factor formula that is not
    a saturated-adiabatic lapse rate, and the parcel-colder region above the equilibrium
    level (100-200 hPa) is shaded and labelled ''CIN'', which by definition lies below
    the LFC → integrate the pseudo-adiabatic lapse rate for moist adiabats, and shade
    CIN only below the LFC. Likely cause: t_moist formula (lines 117-119) and the
    where=(parcel_temp < temperature) mask over all levels.'
  - 'Suggestion: the 6.5 pt LCL label could match the 8 pt tick labels.'
  - 'Suggestion: drawing the skew with a matplotlib Affine2D skew transform would
    let isotherms be plain vertical lines and showcase the library.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1.
      Chrome: title 'skewt-logp-atmospheric · python · matplotlib · anyplot.ai' in dark ink (~80% width), axis labels 'Temperature (°C)' and 'Pressure (hPa)', tick labels 1000…100 hPa and -80…40 °C, all readable. Legend upper right on an elevated frame with 9 entries at 7 pt. 'LCL 902hPa' label at right in muted gray, 6.5 pt.
      Data: temperature #009E73 solid with large dots, dewpoint #C475FD dashed with dots; gray dotted lifted parcel; blue (#4467A3, alpha 0.18) CIN fills, barely perceptible, near 550-900 hPa and 100-200 hPa, red (#AE3030) CAPE fill (alpha 0.25) 200-470 hPa; thin parcel line (1.0); 500 hPa gray line; very faint skewed isotherms (~70° slope), dashed dry adiabats, barely visible dash-dot moist adiabats and dotted mixing-ratio lines.
      Legibility verdict: PASS

