review:
  strengths:
  - 'All Skew-T elements present: logarithmic inverted pressure axis, isotherms at
    45° derived from the plot''s inner geometry, Poisson dry adiabats, integrated
    moist adiabats and mixing-ratio lines, each family told apart by hue and dash
    and lighter than the profiles'
  - 'Temperature (solid #009E73) and dewpoint (dashed #C475FD) are the dominant traces,
    dewpoint left of temperature at every level, full sounding from 1000 to 100 hPa'
  - x range derived from the skewed data, so the sounding fills the plot without an
    empty band
  - 'Clean theme adaptation: chrome, legend and callout take theme tokens; data colors
    identical in both renders'
  - 'Idiomatic plotly: legendgroup de-duplication, hoverinfo=''skip'' on reference
    lines, customdata/hovertemplate with unskewed values in the HTML view'
  weaknesses:
  - 'VQ-05 (both): an empty band of about 150 px (full-size) sits between the one-line
    title and the top of the plot → top margin only as tall as the title needs (about
    t=60, −20 layout px). Likely cause: margin t=80.'
  - 'Suggestion: the dry adiabats stop where they cross −55 °C, so the upper-left
    of the diagram behind the dewpoint trace and the stratospheric temperature trace
    has none; a wider mask would carry the family across the whole diagram.'
  - 'Suggestion: the moist-adiabat Euler loop (lines 143–152) could use scipy.integrate.solve_ivp
    for a more accurate pseudo-adiabat.'
  - 'Suggestion: the optional wind barbs along the right edge would add the wind profile.'
