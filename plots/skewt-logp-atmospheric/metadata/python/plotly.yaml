review:
  strengths:
  - 'All Skew-T elements present: log inverted pressure axis, skewed isotherms, Poisson
    dry adiabats, integrated moist adiabats and mixing-ratio lines, each family told
    apart by hue and dash style and lighter than the profiles'
  - 'Temperature (solid #009E73) and dewpoint (dashed #C475FD) are the dominant traces,
    dewpoint left of temperature at every level, full sounding visible from 1000 to
    100 hPa'
  - 'Clean theme adaptation: chrome, legend and callout all take theme tokens; data
    colors identical in both renders'
  - 'Idiomatic plotly: legendgroup de-duplication, hoverinfo=''skip'' on reference
    lines, customdata/hovertemplate with unskewed values for the HTML view'
  - 'Adaptable structure: column constants, a pandas Data block and axis ranges derived
    from df'
  weaknesses:
  - 'SC-02 (both): isotherms rise at about 70° from horizontal instead of the 45°
    the Notes ask for → 45° (about −25°). Likely cause: SKEW = 30 °C per pressure
    decade is too small for this x scale; about 75–80 °C per decade on the current
    axis range.'
  - 'SC-03 (both): the x axis runs to 75 °C, about 43 °C past the warmest profile
    point (32 °C) and 25 °C past the last tick (50°), so the right third of the plot
    holds no data and no labels → end the axis a little past the data or tick its
    whole range. Likely cause: the fixed X_MAX = 75.0 constant and ISOTHERMS_C stopping
    at 50.'
  - 'VQ-03 (light): the Dry Adiabats and Mixing Ratio legend swatches (and their lines)
    at 0.22 alpha and 0.8 px almost vanish on #FAF8F1 → visible but still lighter
    than the profiles (about 0.35 alpha, +0.13). Likely cause: the light-theme alpha
    of C_DRY and C_MIX.'
  - 'CQ-01 (code): two helper functions, skew_x (lines 69–70) and moist_adiabat (lines
    73–85), where the structure asks for none → inline the skew expression and the
    integration loop. Likely cause: helpers kept from an earlier structure.'
  - 'Suggestion: the explicit Euler loop for the moist adiabats could use scipy.integrate.solve_ivp
    for a more accurate pseudo-adiabat.'
  - 'Suggestion: the optional wind barbs along the right edge would use the empty
    space right of the profiles.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, correct.
      Chrome: title 'skewt-logp-atmospheric · python · plotly · anyplot.ai' centered in dark ink; axis titles 'Temperature (°C)' and 'Pressure (hPa)'; ticks −70°…50° along the bottom and 100…1000 hPa on a log, inverted axis; bordered legend (Isotherms, Dry Adiabats, Moist Adiabats, Mixing Ratio, Dewpoint, Temperature) in the right margin; 'LCL ≈ 891 hPa' callout with arrow near the surface. All readable.
      Data: gray isotherms rising to the right at about 70°, faint purple dry adiabats, blue-gray dotted moist adiabats, faint green dashed mixing-ratio lines; bold green #009E73 solid temperature and purple dashed dewpoint with markers, dewpoint left of temperature throughout, full profile visible up to 100 hPa. The x axis runs to 75 °C with an empty right third. Dry-adiabat and mixing-ratio swatches are very faint.
