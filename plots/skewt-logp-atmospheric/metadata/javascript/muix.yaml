      Data: Diagonal gray isotherms fill the background at 45 degrees (the 0C isotherm highlighted in amber), plus lighter dashed/dotted dry-adiabat, moist-adiabat, and mixing-ratio families. The temperature profile is a solid brand-green (#009E73) line with green-filled markers; the dewpoint profile is a dashed blue line with blue-filled markers, both with pale strokes for separation from the background lines.
      Legibility verdict: PASS -- every title/label/tick is clearly readable, no light-on-light text.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17-range), not pure black, not light.
