review:
  strengths:
  - 'Uses the MUI X v9 composition API idiomatically: ChartsContainer with a log-scale,
    reversed pressure y axis (tickInterval on the mandatory levels) and a linear temperature
    x axis, plus a custom SVG layer that reads the chart''s own scales through useXScale/useYScale
    and clips to the drawing area with ChartsClipPath'
  - The skew is derived from the drawing area's aspect so the isotherms render at
    a true 45° (the 0 °C isotherm runs from 0 at 1000 hPa to the right edge with equal
    dx and dy), and every level is placed at its pressure and its temperature along
    those isotherms
  - All three reference families are physically computed (Poisson dry adiabats, a
    pseudo-adiabatic lapse-rate integration for moist adiabats, mixing-ratio lines
    from the vapour-pressure inversion, stopped at 400 hPa by convention) and told
    apart by line style, with the freezing isotherm drawn heavier
  - 'Clear hierarchy: the temperature (solid green, 3.5 px) and dewpoint (dashed Imprint
    blue, 3 px) profiles dominate a muted reference web in both themes; the dewpoint
    stays left of the temperature at every level'
  - Plausible warm-season sounding with a tropopause near 225 hPa, a stratospheric
    warming above it, drying aloft and a moist layer near 400 hPa — the features a
    Skew-T is read for
  - Theme tokens are threaded through every element (ink/inkSoft chrome, pageBg marker
    outlines), so both renders read cleanly
  weaknesses:
  - 'Suggestion: optional wind barbs in a column along the right edge, each at its
    pressure level, would add the wind profile the Notes allow.'
  - 'Suggestion: the dry-adiabat dashes and moist-adiabat dots are both inkSoft grey
    and blur together in the 400 px thumbnail; a second hue from the Imprint palette
    for one family (the Notes allow color coding) would separate them more strongly.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole 2400x2400 square canvas.
      Chrome: bold dark title "skewt-logp-atmospheric · javascript · muix · anyplot.ai" (~48% width) with a softer subtitle (37 levels, 1000 to 100 hPa, bottom-level T 22 / Td 16.3); y axis "Pressure (hPa)" with log ticks 1000, 850, 700, 500, 400, 300, 250, 200, 150, 100 (surface at the bottom, spacing widening upward); x axis "Temperature (°C), isotherms skewed 45°" with ticks -30…20; legend row at the bottom (Temperature, Dewpoint, Isotherm, Dry adiabat, Moist adiabat, Mixing ratio). All text dark and readable; no clipping.
      Data: temperature profile solid #009E73 with small dots at every level, rising from 22 °C at 1000 hPa to a tropopause kink near 225 hPa and slanting right above it; dewpoint dashed Imprint blue #4467A3, always left of the temperature, with a moist bulge near 400–450 hPa. Behind them, light grey solid isotherms at 45° (0 °C heavier), dashed dry adiabats, dotted moist adiabats and dash-dot mixing-ratio lines (ending at 400 hPa), horizontal isobars from the grid.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, subtitle, axis titles, tick labels and legend text flip to light ink and are fully readable; isobars and reference lines are light grey, subtle but visible. No dark-on-dark text.
      Data: green temperature and blue dewpoint profiles identical to the light render; marker outlines use the dark page color. Brand green reads well.
      Legibility verdict: PASS
