review:
  strengths:
  - 'Mathematically correct skew-T construction: the temperature axis is pre-skewed
    per pressure level via a custom useXScale/useYScale overlay, keeping the 45-degree
    isotherms exact regardless of MUI X''s own margin computation'
  - 'All required reference-line families present and visually distinguished by dash
    pattern: dry adiabats, moist adiabats (computed via genuine pseudo-adiabatic numerical
    integration, not a canned formula), and mixing-ratio lines'
  - 'Nice meteorological touch: the 0C isotherm is highlighted in amber against the
    neutral-gray isotherm family, drawing the eye to the freezing level'
  - Temperature (brand green, solid) vs. dewpoint (blue, dashed) uses a legitimate
    semantic-exception color choice (water/moisture -> blue) rather than blindly taking
    palette[1]
  - Custom in-plot legend panel with elevated-bg swatch box is legible and correctly
    theme-adaptive in both renders
  - Deterministic, physically plausible sounding (warm-season surface temp, realistic
    lapse rate to the tropopause, an embedded mid-level moist layer) with no RNG needed
  - Pressure axis is properly logarithmic and inverted (1000 hPa at the bottom, 100
    hPa at the top) via native MUI X axis config, not faked
  weaknesses:
  - ChartContainer is missing the mandatory `skipAnimation` prop (prompts/library/muix.md
    requires it on every chart component as a belt-and-suspenders alongside the harness's
    prefers-reduced-motion emulation) -- add `skipAnimation` to the <ChartContainer>
    even though series=[] means the risk is currently low
  - markerLevels includes index 36 (p=100, the very top pressure level), so both the
    temperature and dewpoint marker circles sit exactly on the clip boundary at the
    top edge and are partially clipped by ChartsClipPath -- drop the topmost index
    from markerLevels (e.g. filter i % 4 === 0 && i !== PRESSURE_LEVELS.length - 1)
    so markers stay fully inside the plot
  - Helper functions (heightFromPressure, standardTemperatureC, moistAdiabatCurve,
    etc.) are justified by the thermodynamics but push CQ-01 KISS-structure below
    a plain top-to-bottom script -- acceptable for this domain, no action required
  image_description: |-
