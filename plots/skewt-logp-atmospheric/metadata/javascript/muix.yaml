review:
  strengths:
  - Mathematically exact 45-degree skew implemented via a pixel-space transform (skewOffsetC
    using yScale/xScale), so isotherms stay true diagonals regardless of the margins
    MUI X computes for axis labels
  - Full suite of reference-line families (dry adiabats, moist adiabats, mixing-ratio
    lines) all clipped correctly to the plot area via ChartsClipPath, matching every
    item in the spec's Notes section
  - 'Physically realistic sounding: correct standard lapse rate, a visible tropopause
    kink in the temperature profile, and an embedded moist layer bump in the dewpoint
    profile'
  - Correct Imprint palette use with a defensible semantic exception (dewpoint assigned
    blue for water/moisture) and theme-correct chrome in both light and dark renders
  - Idiomatic advanced MUI X composition (useXScale/useYScale/useDrawingArea + ChartsClipPath)
    to build a custom overlay coordinate system — a technique distinctive to MUI X's
    hook-based API surface
  weaknesses:
  - 'The file has a duplicated header comment block at the top (two full anyplot.ai
    header blocks, lines 1-10, including a stale ''Quality: 87/100'' leftover from
    a prior state) — clean up so only one current header remains per prompts/library/muix.md''s
    header style'
  - Axis and tick label font sizes rely on MUI X's ChartsXAxis/ChartsYAxis defaults
    rather than explicit slotProps/tickLabelStyle sizing — legible in both renders,
    but misses full VQ-01 credit since sizes aren't explicitly set
  - Title occupies only ~45% of the canvas width — could grow slightly to make better
    use of the generous top whitespace, though this is not currently a legibility
    problem
  - Individual dry-adiabat and mixing-ratio reference lines aren't labeled with their
    values (potential temperature / g kg-1), unlike many professional Skew-T charts
    — optional polish, not a spec requirement
