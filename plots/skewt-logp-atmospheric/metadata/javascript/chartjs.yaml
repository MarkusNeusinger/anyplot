review:
  strengths:
  - 'Physically accurate thermodynamics: dry adiabats via the Poisson equation, moist
    adiabats via a numerically-integrated saturated adiabatic lapse rate (Bolton''s
    formula), and mixing-ratio isopleths inverted from Bolton''s saturation vapor
    pressure — a genuinely correct meteorological reference-line family, not decorative
    diagonals.'
  - 'Correct log-P inverted y-axis with the classic surface-referenced x-axis convention:
    tick labels read as plain surface temperatures while the true isotherms are the
    diagonal Isotherm dataset, matching how professional Skew-T charts are labeled.'
  - 'Clean theme adaptation: identical Imprint data colors between renders, exact
    #FAF8F1 / #1A1A17 backgrounds, and no dark-on-dark or light-on-light legibility
    failures in either render.'
  - Clear visual hierarchy — the temperature/dewpoint profile is drawn last, at full
    opacity and 3-3.5px width, standing out clearly against the alpha-blended, thin
    (~1-1.25px) family of 36 background reference lines.
  - Realistic synthetic sounding including a believable tropopause temperature minimum/inversion
    around 200 hPa rather than a monotonic straight-line cooling profile.
  - Legend correctly filters out the empty-label duplicate datasets so only one swatch
    per reference-line family appears, and stays readable even at the 400px mobile
    thumbnail size.
  weaknesses:
  - Isotherm skew angle is shallower than the spec's explicit '45-degree angle' requirement.
    With SKEW=50, X range [-95,160] (255 wide), and the ~1:1 chartArea aspect that
    the square canvas produces, the isotherm's pixel slope works out to dx/dy ≈ 0.46
    (about 25° from vertical / 65° from horizontal), not the 1:1 slope a true 45°
    skew needs. Increase SKEW to roughly 105-110 (or narrow X_MIN/X_MAX) so the isotherms
    render at a true 45° tilt — the underlying physics (dry/moist adiabat, mixing-ratio
    formulas) does not need to change, only the skew constant.
  - 'Legend swatches render as plain solid-color boxes rather than reflecting each
    dataset''s actual line style (dashed dewpoint, dash-dot moist adiabat, dotted
    mixing ratio) — a minor polish item; consider Chart.js `usePointStyle`/`pointStyle:
    ''line''` with per-dataset `borderDash` so the legend previews match the plotted
    line styles.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 exactly (sampled pixel (250,248,241)).
      Chrome: Title "skewt-logp-atmospheric · javascript · chartjs · anyplot.ai" in dark ink, centered, ~48% of plot width. Axis titles "Temperature (°C)" and "Pressure (hPa)" in dark ink. Tick labels (pressure levels 1000-100 hPa on the inverted log y-axis, temperature -90° to 40° on the x-axis) in a slightly softer dark gray. Legend at the bottom lists Isotherm, Dry adiabat, Moist adiabat, Mixing ratio, Temperature, Dewpoint. A thin dark frame rectangle borders the whole plot area (intentional Skew-T box convention). All text is clearly readable against the light background — no light-on-light issues.
      Data: First series (Temperature) is #009E73 brand green, solid line with markers, drawn thick and on top. Dewpoint is a dark blue (#4467A3) dashed line. Reference-line families are alpha-blended: gray isotherms, tan/ochre dashed dry adiabats, cyan dash-dot moist adiabats, lavender dotted mixing-ratio lines — all distinguishable from each other and from the two data series.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 exactly (sampled pixel (26,26,23)).
      Chrome: Same title/axis-title/tick-label text, now rendered in light ink/gray, fully legible against the dark background. No dark-on-dark failures found — checked systematically by pixel-sampling full-width rows for any low-contrast band; only the intentional top/bottom frame border rows returned high-contrast, no stray or unreadable text rows.
      Data: Temperature (green) and Dewpoint (blue) lines are pixel-identical in hue to the light render — only the chrome (background/text/frame) flipped, as required. Reference-line families (gray isotherms, ochre dry adiabats, cyan moist adiabats, lavender mixing-ratio lines) remain clearly visible against the dark background.
      Legibility verdict: PASS
