review:
  strengths:
  - True skew-T log-P diagram built on ECharts custom series (no native support),
    with a clearly documented, correct pixel-space 45° skew transform
  - 'Physically grounded reference lines: dry adiabats via Poisson''s equation, moist
    adiabats via pseudo-adiabatic ODE integration, mixing-ratio isopleths via inverted
    Clausius-Clapeyron'
  - Realistic synthetic sounding with a boundary-layer inversion near 850 hPa and
    stratospheric warming above the tropopause
  - Correct meteorological wind-barb convention (50kt pennants / 10kt full barbs /
    5kt half barbs), theme-adaptive ink color
  - Strict canonical Imprint palette ordering with identical data colors between themes;
    no dark-on-dark/light-on-light chrome failures; zero clipping at any edge
  weaknesses:
  - Several standalone helper functions (thermodynamics, skew transform, wind-barb
    builder) push past a flat 'no functions' script structure, though justified by
    the physics involved
  - No inline value labels on the dry adiabat, moist adiabat, or mixing-ratio isopleth
    families (only the legend and color/style distinguish them)
  - Chrome text sized for the native 3200x1800 canvas will be small at a ~400px thumbnail
    scale (shared with the library's documented default fontSize, not unique to this
    implementation)
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "skewt-logp-atmospheric · javascript · echarts · anyplot.ai" dark and crisp; legend (Temperature/Dewpoint/Dry adiabat/Moist adiabat/Mixing ratio) fully readable; pressure axis labels (100-1000 hPa) and "Pressure (hPa)" rotated label dark and legible; "Temperature (°C)" x-axis label legible.
      Data: Green (#009E73) solid temperature trace, lavender dashed dewpoint trace, blue dashed dry adiabats, ochre dotted moist adiabats, red dotted mixing-ratio isopleths, gray 45-degree-skewed isotherms; meteorological wind barbs along the right edge.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
