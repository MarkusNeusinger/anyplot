review:
  strengths:
  - Physically-based dry adiabats, numerically-integrated moist adiabats, and inverted-Bolton
    mixing-ratio lines — genuine meteorological correctness rather than decorative
    curves
  - Correct 45-degree skew coordinate transform built from scratch, with a properly
    logarithmic, inverted pressure axis
  - 5-way legend uses color AND linestyle redundantly (solid/dotted/dashed) for CVD-safe
    distinction at high series count
  - Realistic convective sounding data (dry mid-level layer, tropopause isothermal
    kink) that tells a genuine meteorological story
  - Both renders are theme-correct with no legibility failures
  weaknesses:
  - 'Clip-path coordinate bug: the plot-clip rect uses x=margin.left, y=margin.top
    but is applied to the already-translated `clipped` group, double-offsetting the
    clip window. This hides a ~150px strip of reference lines along the left edge
    of the plot (visible as an empty bottom-left corner near the surface) and lets
    mixing-ratio lines/labels (16, 24, 32 g/kg) bleed past the right frame border.
    Fix: set the clip rect x/y to 0.'
  - 'VQ-07: dry adiabat (ochre), moist adiabat (cyan), and mixing ratio (lime) skip
    several canonical Imprint positions based on a niche technical association (''classic
    mixing-ratio green'') rather than a widely-recognized real-world color cue — prefer
    canonical order for abstract/technical reference categories.'
  - 'Minor tick-label size imbalance: isobar labels are 14px while isotherm (12px)
    and mixing-ratio (11px) labels are smaller — bump to 13-14px for better axis balance
    and mobile legibility.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white, matches #FAF8F1
      Chrome: title, axis titles ("Temperature (°C)", "Pressure (hPa)"), isobar tick labels, isotherm tick labels, and legend text all dark ink, clearly readable
      Data: brand green (#009E73) solid temperature line, blue dashed dewpoint line — bold and prominent against thin translucent ochre/cyan/lime reference lines
      Legibility verdict: PASS
      Defect (geometry, not color/theme): bottom-left corner of plot frame is empty (missing coldest isotherms near surface); mixing-ratio labels "24"/"32" bleed past the right frame border — caused by a clip-path coordinate bug in the code

    Dark render (plot-dark.png):
      Background: warm near-black, matches #1A1A17
      Chrome: title, axis titles, tick labels, legend text all correctly flipped to light colors, no dark-on-dark failures
      Data: identical colors to light render (brand green, blue, ochre, cyan, lime) — only chrome flipped, as required
      Legibility verdict: PASS
      Same clip-path geometry defect present (theme-independent, confirmed via pixel crop comparison against the light render)
