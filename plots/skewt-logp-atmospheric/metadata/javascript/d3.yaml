review:
  strengths:
  - 'Clip-path bug from attempt 1 fully resolved: the clip rect now uses x=0,y=0 so
    reference lines and mixing-ratio labels no longer bleed past the frame edges in
    either render'
  - 'Physically-correct thermodynamics: dry adiabats via Poisson''s equation, moist
    adiabats via numerical integration of the saturated-adiabatic lapse rate (Bolton
    1980), and mixing-ratio lines via the inverted Bolton formula — genuine meteorological
    correctness rather than decorative curves'
  - Reference-line palette now follows canonical Imprint slot order (dry adiabat=palette[3],
    moist adiabat=palette[1], mixing ratio=palette[5]) instead of niche associative
    colors from attempt 1
  - Correct 45-degree skew coordinate transform and inverted logarithmic pressure
    axis built from scratch with d3.scaleLog
  - 5-way legend distinguishes series by color AND line style (solid/dashed/dotted)
    for CVD-safe redundant encoding at high series count
  - Realistic convective sounding (dry mid-level layer around 700 hPa, tropopause
    isothermal kink near 200-250 hPa) tells a genuine meteorological story
  - Both renders are theme-correct with no legibility failures; isobar/isotherm/mixing-ratio
    tick-label sizing is now balanced at 13-14px, up from the uneven 14/12/11px in
    attempt 1
  weaknesses:
  - 'Minor residual tick-label imbalance: isobar labels are 14px while isotherm and
    mixing-ratio labels are 13px — a 1px gap left over from the prior 14/12/11 spread;
    unifying to a single size would perfect axis balance'
  - 'CQ-01 (KISS): several helper functions (dryAdiabatPoints, moistAdiabatPoints,
    mixingRatioT, saturationVaporPressure, toX/toY) are used — justified by the domain''s
    thermodynamic formulas rather than premature abstraction, but it is a departure
    from the ''no functions'' ideal for simple scripts'
  - Wind barbs (optional per spec) are omitted — acceptable per spec, but adding them
    would further differentiate LM-02 distinctive features in a future iteration
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white, matches #FAF8F1
      Chrome: title ("Radiosonde Sounding · skewt-logp-atmospheric · javascript · d3 · anyplot.ai"), axis titles ("Temperature (°C)", "Pressure (hPa)"), isobar tick labels (100-1000 hPa), isotherm tick labels (-40 to 40°C), mixing-ratio labels (1-16 g/kg), and legend text all render in dark ink, clearly readable against the light surface
      Data: brand green (#009E73) solid temperature line and blue dashed dewpoint line are bold (4px) and prominent against thin, translucent ochre dry-adiabat, lavender moist-adiabat, and cyan mixing-ratio reference families; the clip-path bug from attempt 1 is fixed — no reference lines or labels bleed past the plot frame on any edge (verified via bottom-right, top, and left-edge crops)
