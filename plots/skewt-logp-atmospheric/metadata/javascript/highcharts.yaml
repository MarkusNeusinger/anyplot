      Data: Temperature = solid green (#009E73, palette[0]) with circular markers; Dewpoint = dashed purple/lavender (#C475FD, palette[1]) with circular markers. Reference lines: gray isotherms, tan dashed dry adiabats (palette[3]), blue dotted moist adiabats (palette[2]), faint gray dotted mixing-ratio lines — all subdued relative to the two bold data curves.
