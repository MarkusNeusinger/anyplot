review:
  strengths:
  - Scientifically accurate reference-line families computed from real thermodynamic
    formulas (dry/moist adiabat, saturation mixing ratio) rather than approximated
    or hard-coded curves
  - Correct log-inverted pressure axis and correctly-skewed 45° isotherms
  - Clean theme-adaptive chrome throughout; first data series is brand green, all
    colors sourced from ANYPLOT_TOKENS
  - 'Thoughtful visual hierarchy: bold solid/dashed data curves clearly separated
    from muted background reference lines'
  - Legend correctly de-duplicates each reference-line family to a single entry via
    showInLegend
  - Mixing-ratio lines sensibly restricted to the lower/mid troposphere (≥400 hPa),
    avoiding clutter at altitude where they're not meteorologically meaningful
  weaknesses:
  - The four overlapping reference-line families (isotherms, dry adiabats, moist adiabats,
    mixing ratio) create moderate visual density where they intersect near the plot
    center - consider slightly lower opacity or thinner strokes on the mixing-ratio
    family to reduce competition with the data curves at small/mobile scale
  - X-axis title 'Temperature at surface (°C, skewed)' is only literally accurate
    at the 1000 hPa row; conventional Skew-T charts (e.g. MetPy) simply label this
    axis 'Temperature (°C)' and explain the skew via subtitle/caption - consider the
    more standard label to avoid confusing readers unfamiliar with the skew transform
  - The sounding profile shows a clean monotonic cooling trend with a realistic tropopause
    deceleration, but doesn't include an additional edge-case feature (e.g. a low-level
    temperature inversion or a saturated layer where temperature and dewpoint nearly
    converge mid-profile) that would more fully showcase the diagram's diagnostic
    range
  - Library Mastery is generic core-API usage (line series + log axis + tooltip formatter);
    a Highcharts-distinctive touch - e.g. series.zones to color-segment the temperature
    line by stability, or a shaded arearange between temperature/dewpoint to represent
    moisture - would raise LM-02 meaningfully
  image_description: |-
