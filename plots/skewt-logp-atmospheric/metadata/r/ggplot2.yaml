review:
  strengths:
  - 'Skew-T coordinates built inside ggplot2''s x/y aesthetics: log-pressure vertical
    axis with the surface at the bottom and right-skewed isotherms'
  - Reference families computed from physics (Poisson dry adiabats, integrated pseudo-adiabats,
    saturation mixing ratios), told apart by color and line style
  - Legend placed outside the panel, clear of the diagram
  - Theme-adaptive chrome correct in both renders
  weaknesses:
  - 'SC-03, SC-02 (both): the dewpoint trace runs off the left panel edge between
    about 360 and 170 hPa, where its skewed value reaches about -50 while the x limit
    is -42, and the axis carries no tick below -30 → widen the limit to about -52
    and label -50 and -40. Likely cause: coord_cartesian(xlim = c(-42, 62)) and breaks
    = seq(-30, 60, 10).'
  - 'VQ-03 (both): the moist adiabats (dotted, linewidth 0.28, alpha 0.55) are close
    to invisible on the dark background and the mixing-ratio lines faint → about linewidth
    0.4, alpha 0.7. Likely cause: the moist_df and mix_df geom_path settings.'
  - 'VQ-03 (both): the legend keys draw Dewpoint, Dry Adiabats, Moist Adiabats and
    Mixing Ratios as solid lines while the plot draws them dashed, dashed, dotted
    and longdash → the keys carry the marks'' line styles. Likely cause: guides(linetype
    = "none").'
  - 'DQ-03 (both): the sounding titled "Tropical" reads -22 °C at 500 hPa, while a
    tropical mean sounding sits near -6 °C → warm the mid-levels by about +15 °C or
    retitle the scenario. Likely cause: temp_obs values.'
  - 'CQ-01 (code): five helper functions (lp, skewx, es_hpa, ws_kgkg, moist_adiabat,
    lines 24–53) → inline the transforms and the moist-adiabat integration. Likely
    cause: function-based structure.'
  - 'CQ-04 (code): the color comments on lines 133–137 misname the hues ("#C475FD
    orange-red", "#AE3030 amber", "#BD8233 purple") → lavender, matte red, ochre.
    Likely cause: comments left from an older palette.'
  - 'Suggestion: wind barbs along the right edge, which the Notes allow, would add
    the wind profile.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1.
      Chrome: bold title "Tropical Radiosonde Sounding · skewt-logp-atmospheric · r · ggplot2 · anyplot.ai"; axis titles "Temperature (°C)" and "Pressure (hPa)" in dark ink; pressure ticks 100–1000 hPa, temperature ticks only from -30 to 60 °C although the panel starts near -42; boxed panel; framed legend outside the panel on the right. All readable.
      Data: thick solid green #009E73 temperature, thick dashed lavender #C475FD dewpoint that runs off the left panel edge between about 360 and 170 hPa; grey skewed isotherms, red dashed dry adiabats, very faint ochre dotted moist adiabats, faint cyan mixing-ratio lines below 500 hPa; legend keys all solid.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, axis titles, ticks and legend text in light ink; no dark-on-dark text.
      Data: same colors as the light render; the moist adiabats are close to invisible and the mixing-ratio lines faint; dewpoint again leaves the panel at the left edge.
      Legibility verdict: PASS
