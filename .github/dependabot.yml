# Dependabot configuration
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates

version: 2
updates:
  # Python dependencies (uv)
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "deps(python):"
    groups:
      # Group minor/patch updates together
      python-minor:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Frontend dependencies (yarn/npm)
  - package-ecosystem: "npm"
    directory: "/app"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "javascript"
    commit-message:
      prefix: "deps(npm):"
    groups:
      # Group React ecosystem updates
      react:
        patterns:
          - "react*"
          - "@types/react*"
      # Group MUI updates
      mui:
        patterns:
          - "@mui/*"
      # Group minor/patch updates
      npm-minor:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # vite is pinned to 8.3.5 in app/package.json. A bump is a hand-made PR
      # with a browser check of the built site (scripts/site-smoke.mjs, which
      # the app-image job of ci-image.yml also runs), because a broken bundle
      # passes every jsdom test and the deploy. Twice a minor bump blanked
      # anyplot.ai with "TypeError: t is not a function" at chunk init: 8.1.x on
      # 2026-07-23 (#9670 pinned 8.0.16 and added this ignore), and #12225
      # (8.0.16 to 8.1.6, a Dependabot PR opened on 2026-10-21 although this
      # ignore was in place) on 2026-10-22, when Rolldown 1.1.5 put its interop
      # helper into the theme chunk and made a cycle with the mui chunk. #12235
      # fixed it with 8.3.5, whose Rolldown emits that helper as its own chunk.
      # Usually, not always: on 2026-11-08 dropping the web-vitals chunk let it
      # fold the helper into theme again, so app/vite.config.ts now builds the
      # theme modules into the mui chunk.
      - dependency-name: "vite"
        update-types:
          [
            "version-update:semver-patch",
            "version-update:semver-minor",
            "version-update:semver-major",
          ]

  # JavaScript render harness (root package.json + package-lock.json): the pinned
  # Chart.js, D3, ECharts, Highcharts and MUI X stack the pipeline renders with
  # (.github/actions/setup-node restores it with `npm ci`).
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "javascript"
    commit-message:
      prefix: "deps(js-render):"
    groups:
      # The render toolchain gets PRs of its own: a Playwright bump changes the
      # bundled Chromium and can shift every JavaScript render, so it never rides
      # along with a chart-library minor. A dependency joins the first group that
      # matches, and js-render-minor also excludes these two.
      js-render-browser:
        patterns:
          - "playwright*"
          - "esbuild"
        update-types:
          - "minor"
          - "patch"
      # Group minor/patch updates. A major stays its own PR: it changes the API
      # the library prompt (prompts/library/*.md) describes, and its
      # `**API level:**` line must follow (tests/unit/core/test_version_sources.py).
      # Minor and patch bumps need no other edit; the database sync reads the
      # new version from the lock.
      js-render-minor:
        patterns:
          - "*"
        exclude-patterns:
          - "playwright*"
          - "esbuild"
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions
  # The renderer's toolchain base (agents/renderer/toolchain.Dockerfile) is pinned by
  # digest; a bump changes the toolchain's input hash, so the next renderer deploy
  # rebuilds the toolchain with the base's security updates (agents/renderer/toolchain.py).
  - package-ecosystem: "docker"
    directory: "/agents/renderer"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 2
    # The digest (Debian's security updates) and patch releases only: a new Python minor
    # moves with .python-version, deliberately, not as a base-image bump.
    ignore:
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps(docker):"

  - package-ecosystem: "github-actions"
    # "/" only scans .github/workflows — the composite actions' own `uses:`
    # pins (now SHA-pinned like the workflows) need their directories listed
    # explicitly to stay covered.
    directories:
      - "/"
      - "/.github/actions/setup-node"
      - "/.github/actions/setup-r"
      - "/.github/actions/setup-julia"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "deps(actions):"
    groups:
      actions:
        patterns:
          - "*"
