# Build the shipped API image and smoke-test the container, before merge.
#
# Until this workflow existed, the first build attempt of a changed Dockerfile
# happened in Cloud Build — after the merge. The deploy-api trigger sat red from
# 2026-08-30 until #10821 for exactly that reason: the runtime stage was missing
# a library that only the RUNNING image can reveal, and every PR check was green
# throughout. The sibling repo kurrentschrift added the same job for the same
# class of miss (its pyproject.toml fell out of the runtime stage and the API
# would have reported version 0.0.0 in production); keep the two in the same
# shape.
#
# Three conventions this file keeps, all shared with the sibling ci-* workflows:
#
# - Every `uses:` is pinned to a commit SHA with the version as a comment. A
#   movable tag is a write handle into these runners. Dependabot bumps SHA pins
#   exactly as it bumps tags (the `github-actions` ecosystem in
#   .github/dependabot.yml), so a pinned workflow costs nothing to maintain.
# - Change detection over `paths:` filters: a job that always reports a result
#   is easier to read on a PR than a check that silently never appears, and it
#   is the shape ci-lint.yml and ci-tests.yml already use. `plots/**` is
#   deliberately NOT a trigger — the automated plot pipeline opens hundreds of
#   PRs that touch nothing the image serves.
# - `timeout-minutes` on the job. GitHub's default is 360, so a docker build
#   that hangs on a package index would burn six hours and report nothing.

name: "CI: Image"
run-name: "Image: ${{ github.ref_name }}"

on:
  push:
    branches:
      - main
      - develop
      # No `feature/**` here: Google Jules pushes its own branches under the
      # feature branch it works on (`feature/<slug>-<session id>`), and a push run
      # has no PR author, so `renderer-image` would hand unread Jules code its
      # GCP login and OIDC token. Feature branches get CI through their PRs.
  pull_request:
    branches:
      - main
      - develop
      - 'specification/**'
      - 'implementation/**'
  merge_group:
  workflow_dispatch:
    inputs:
      force_run:
        description: 'Force the image build (ignore change detection)'
        type: boolean
        default: true

concurrency:
  group: ci-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: Build API image and smoke the container
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # A cold build (no layer cache) installs the full runtime dependency set —
    # pandas, scipy, scikit-learn, statsmodels, matplotlib, anthropic — so it is
    # minutes, not seconds; a warm one is dominated by the context transfer.
    # 30 leaves room for a cold build plus the 90 s readiness window below, and
    # still fails loudly instead of hanging.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # The change detection below diffs against the base commit, which a
          # shallow checkout lacks.
          fetch-depth: 0

      - name: Check for image-relevant changes
        id: check
        # The event payload travels through env, not through `${{ }}` inside the
        # script: a shell that never sees interpolated event data cannot be made
        # to execute it.
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MG_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          MG_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
          FORCE_RUN: ${{ inputs.force_run }}
        run: |
          set -uo pipefail
          # A diff that cannot be computed says NOTHING about the image, so it
          # must never read as "nothing changed" — that is a gate which passes
          # by failing. On a PR or a merge group the refs are guaranteed present
          # (fetch-depth: 0), so a failure there is a real problem and stops the
          # job; on a push whose parent is unreachable the job builds instead.
          case "$EVENT_NAME" in
            pull_request)
              if ! CHANGED_FILES=$(git diff --name-only "$PR_BASE_SHA" "$PR_HEAD_SHA"); then
                echo "::error::could not diff $PR_BASE_SHA..$PR_HEAD_SHA — refusing to decide whether the image needs building"
                exit 1
              fi ;;
            merge_group)
              if ! CHANGED_FILES=$(git diff --name-only "$MG_BASE_SHA" "$MG_HEAD_SHA"); then
                echo "::error::could not diff $MG_BASE_SHA..$MG_HEAD_SHA — refusing to decide whether the image needs building"
                exit 1
              fi ;;
            push)
              # The whole pushed range, not HEAD~1..HEAD: a push can carry
              # several commits, and an earlier one touching api/ under a tip
              # commit that does not would otherwise skip the gate.
              # github.event.before is all zeroes on a new branch, and after a
              # force-push the old tip may be gone — neither says anything about
              # the image, so both build.
              if [[ "$PUSH_BEFORE" =~ ^0+$ ]] || ! CHANGED_FILES=$(git diff --name-only "$PUSH_BEFORE" "$PUSH_AFTER"); then
                echo "::warning::the pushed range $PUSH_BEFORE..$PUSH_AFTER is not diffable — building the image rather than skipping the gate"
                echo "should_build=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi ;;
            *)
              if ! CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD); then
                echo "::warning::no parent commit to diff against — building the image rather than skipping the gate"
                echo "should_build=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi ;;
          esac

          echo "Changed files:"
          echo "$CHANGED_FILES"

          # What can change what the image contains or how it boots: the two
          # Dockerfiles, the dependency lock, the source the runtime stage
          # copies, README.md (the builder copies it next to pyproject.toml, so
          # a rename breaks the install) and a root .dockerignore, which decides
          # what a `context: .` build can see at all. plots/ is not among them
          # and is no longer in the image either — nothing under api/ or core/
          # reads it at runtime, the implementations being served from Postgres —
          # so the plot pipeline's PRs must not each pay for a container build.
          IMAGE_CHANGES=$(echo "$CHANGED_FILES" | grep -E '^(api/|core/|agents/|pyproject\.toml$|uv\.lock$|README\.md$|\.dockerignore$|app/Dockerfile$|\.github/workflows/ci-image\.yml$)' || true)

          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$FORCE_RUN" == "true" ]]; then
            echo "Manual trigger with force_run=true, will build the image"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          elif [[ -n "$IMAGE_CHANGES" ]]; then
            echo "Found image-relevant changes, will build the image"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "No image-relevant changes, skipping the build"
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Buildx
        if: steps.check.outputs.should_build == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      # push: false — nothing here reaches a registry; Cloud Build still owns the
      # published image. load: true puts the result into the local daemon so the
      # smoke below can actually run it. The GHA cache keeps the repeat builds of
      # an unchanged dependency set at seconds instead of minutes.
      - name: Build the API image
        if: steps.check.outputs.should_build == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: api/Dockerfile
          push: false
          load: true
          tags: anyplot-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # No database, no secrets: the container is started bare and only asked the
      # questions that need no Cloud SQL. That is deliberate — this is a check of
      # the IMAGE, not of the deployment. api/main.py guards its DB init with
      # is_db_configured(), so a bare container boots and serves /health.
      - name: Container smoke (no database)
        if: steps.check.outputs.should_build == 'true'
        run: |
          set -euo pipefail
          docker run -d --name api -p 8000:8000 anyplot-api:ci

          # 90 s: this image imports matplotlib, scikit-learn, statsmodels and
          # the MCP server before the first request is served.
          ready=0
          for _ in $(seq 45); do
            if curl -fsS localhost:8000/health >/dev/null 2>&1; then ready=1; break; fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            echo "::error::the container never answered /health within 90 s"
            exit 1
          fi
          curl -fsS localhost:8000/health | grep -q '"healthy"'
          echo "health OK"

          # THE assert this job exists for. api/version.py reads the INSTALLED
          # distribution's metadata and falls back to "0.0.0+unknown" when it is
          # absent — silently, in a field /health, /openapi.json and the MCP
          # server all report. The builder stage installs the project from a
          # context that holds pyproject.toml and uv.lock but no source yet, so
          # the dist-info that carries the version is a genuinely fragile
          # artefact of that ordering, and nothing else in CI looks at it.
          want=$(python3 -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          got=$(curl -fsS localhost:8000/health | python3 -c "import json,sys;print(json.load(sys.stdin)['version'])")
          if [ "$got" != "$want" ]; then
            echo "::error::the image reports version $got, pyproject.toml says $want"
            exit 1
          fi
          echo "version OK: $got"

          # Pins the runtime stage's COPY list against a future rebuild. This is
          # the payload the image is expected to SERVE and cannot import its way
          # to: og_images.py reads it off disk as the last resort when dynamic OG
          # rendering fails, which is the branch that runs when a fresh container
          # cannot reach the font bucket.
          docker exec api test -f /app/api/static/og-image.png
          echo "COPY list OK"

          # The image must serve as the unprivileged user the Dockerfile creates.
          # `USER appuser` is one line above the CMD and nothing else notices if
          # a rebuild drops it — Cloud Run runs whatever the image says.
          uid=$(docker exec api id -u)
          if [ "$uid" != "1000" ]; then
            echo "::error::the container runs as uid $uid (expected 1000, the appuser the Dockerfile creates)"
            exit 1
          fi
          echo "non-root OK: uid $uid"

      - name: Container logs on failure
        if: failure() && steps.check.outputs.should_build == 'true'
        run: docker logs api || true

      # Threshold `warning` and NO file-wide exceptions: a warning of any code
      # blocks, which is the point of having the linter at all. The two rules
      # api/Dockerfile declines (DL3008 apt pinning, DL3025 shell-form
      # HEALTHCHECK) now carry `# hadolint ignore=<code>` comments at the exact
      # instruction they excuse, so a NEW occurrence elsewhere in the file is
      # still caught — which a file-wide `ignore:` silently swallowed. The third
      # former exception, DL3013, is simply gone: `pip install uv==<version>` is
      # pinned. DL3066 (non-numeric USER) still fires at info level, below the
      # threshold, so it stays visible without blocking. app/Dockerfile declines
      # exactly one, DL3064 on the origin gate's `ORIGIN_SECRET=""` default: the
      # rule reads the variable NAME, the value is the empty string, and the
      # reason it has to be declared at all is written beside the ignore. It sits
      # on an ENV instruction of its own so it excuses that line and nothing
      # else. Verified against hadolint 2.15.1, the version this action pins.
      - name: Hadolint (api/Dockerfile)
        if: steps.check.outputs.should_build == 'true'
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387  # v3.5.0
        with:
          dockerfile: api/Dockerfile
          failure-threshold: warning

      - name: Hadolint (app/Dockerfile)
        if: steps.check.outputs.should_build == 'true'
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387  # v3.5.0
        with:
          dockerfile: app/Dockerfile
          failure-threshold: warning

      - name: Skip notice
        if: steps.check.outputs.should_build == 'false'
        run: echo "::notice::Image build skipped - no changes to api/, core/, the dependency lock or a Dockerfile"

  # The same idea for the frontend container, and for a sharper reason: what
  # app/Dockerfile produces is not a program that fails to import, it is an
  # nginx that either boots or does not — and since the origin gate
  # (app/origin-gate.conf.template) the config it boots with is RENDERED at
  # container start from two environment variables. Nothing before this job
  # ever ran that entrypoint: the deploy's pre-traffic smoke is the first place
  # the rendered config exists, and it lives in Cloud Build, after the merge.
  #
  # A separate job rather than more steps in the one above, so an SPA build
  # never delays the API smoke and neither failure hides the other. Its change
  # detection is deliberately narrow: `app/src/**` cannot affect any of this,
  # and the frontend opens far too many PRs to pay for a container build each
  # time. The event-shape handling is the one above in short form — the long
  # rationale for each branch is written out there.
  app-image:
    name: Build app image and smoke the origin gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # yarn install + vite build cold is minutes; the gate matrix below is
    # seconds. 20 fails loudly instead of hanging on a slow package index.
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Check for app-container changes
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MG_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          MG_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
          FORCE_RUN: ${{ inputs.force_run }}
        run: |
          set -uo pipefail
          CHANGED_FILES=""
          case "$EVENT_NAME" in
            pull_request)
              if ! CHANGED_FILES=$(git diff --name-only "$PR_BASE_SHA" "$PR_HEAD_SHA"); then
                echo "::error::could not diff $PR_BASE_SHA..$PR_HEAD_SHA — refusing to decide whether the app image needs building"
                exit 1
              fi ;;
            merge_group)
              if ! CHANGED_FILES=$(git diff --name-only "$MG_BASE_SHA" "$MG_HEAD_SHA"); then
                echo "::error::could not diff $MG_BASE_SHA..$MG_HEAD_SHA — refusing to decide whether the app image needs building"
                exit 1
              fi ;;
            push)
              if [[ "$PUSH_BEFORE" =~ ^0+$ ]] || ! CHANGED_FILES=$(git diff --name-only "$PUSH_BEFORE" "$PUSH_AFTER"); then
                echo "::warning::the pushed range is not diffable — building the app image rather than skipping the gate"
                echo "should_build=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi ;;
            *)
              if ! CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD); then
                echo "::warning::no parent commit to diff against — building the app image rather than skipping the gate"
                echo "should_build=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi ;;
          esac

          echo "Changed files:"
          echo "$CHANGED_FILES"

          # What can change how this container boots or what it serves: the
          # Dockerfile, the three nginx files, the build inputs, and what the
          # build context can see. Not app/src — the gate is upstream of every
          # line of it.
          APP_CHANGES=$(echo "$CHANGED_FILES" | grep -E '^(app/(Dockerfile|nginx\.conf|security-headers\.conf|origin-gate\.conf\.template|package\.json|yarn\.lock|vite\.config\.ts|index\.html|\.dockerignore)$|\.github/workflows/ci-image\.yml$)' || true)

          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$FORCE_RUN" == "true" ]]; then
            echo "Manual trigger with force_run=true, will build the app image"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          elif [[ -n "$APP_CHANGES" ]]; then
            echo "Found app-container changes, will build the app image"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "No app-container changes, skipping the build"
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Buildx
        if: steps.check.outputs.should_build == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      # Its own cache scope: this image shares no layer with the API's, and one
      # shared scope would have them evicting each other.
      - name: Build the app image
        if: steps.check.outputs.should_build == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: app
          file: app/Dockerfile
          push: false
          load: true
          tags: anyplot-app:ci
          build-args: |
            VITE_API_URL=https://api.anyplot.ai
            VITE_DEBUG_API_URL=/api
          cache-from: type=gha,scope=app-image
          cache-to: type=gha,mode=max,scope=app-image

      # THE assert this job exists for: the gate's three states, against the
      # real image, through the real entrypoint. A test over the config text can
      # only say what the file says; only a running container can say that
      # envsubst rendered it, that nginx accepted the result, and that the maps
      # decide what they were meant to decide.
      - name: Origin gate matrix (off / armed / armed with no secret)
        if: steps.check.outputs.should_build == 'true'
        run: |
          set -euo pipefail
          # Not a production value and never one: this container is thrown away
          # at the end of the job, and the real secret has no business on a
          # runner that prints its own logs on failure. It is the LENGTH of a
          # real one on purpose — 64 characters, what `openssl rand -hex 32`
          # produces. A short placeholder passed this job while the production
          # length did not: the tagged map key is `presented:` plus the secret,
          # and nginx cannot hash a key longer than one bucket, so with the gate
          # armed the container refused to start. That is the bug this line now
          # keeps caught (see map_hash_bucket_size in
          # app/origin-gate.conf.template).
          SECRET="0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"

          start() {  # start <name> <host-port> [docker run args...]
            local name="$1" port="$2"; shift 2
            docker run -d --name "$name" -p "$port:8080" "$@" anyplot-app:ci >/dev/null
            for _ in $(seq 30); do
              if curl -fsS "localhost:$port/_health" >/dev/null 2>&1; then return 0; fi
              sleep 1
            done
            echo "::error::container $name never answered /_health within 30 s"
            docker logs "$name" || true
            exit 1
          }
          code() { curl -s -o /dev/null -w '%{http_code}' "$@"; }
          verdict() { curl -sI "$@" | tr -d '\r' | sed -n 's/^[Xx]-[Oo]rigin-[Gg]ate: //p'; }
          want() {  # want <what> <got> <expected>
            if [ "$2" != "$3" ]; then echo "::error::$1: got '$2', expected '$3'"; exit 1; fi
            echo "OK: $1 = $3"
          }

          # 1. Unset — the state this change ships in and rolls back to. Nothing
          #    is refused, and /_health already reports whether a header arrived,
          #    which is what makes arming a measurement instead of a leap.
          start gate-off 8081
          want "gate off: the shell still serves"     "$(code localhost:8081/)"          200
          want "gate off: no header"                  "$(verdict localhost:8081/_health)" off
          want "gate off: a header arrived"           "$(verdict -H 'X-Origin-Secret: anything' localhost:8081/_health)" off-seen

          # 2. Armed. The door is shut, the exempt path is not, and the refusal
          #    says which of the two armed failures it is.
          start gate-on 8082 -e ORIGIN_GATE=on -e ORIGIN_SECRET="$SECRET"
          want "armed: no header is refused"          "$(code localhost:8082/)"          403
          want "armed: wrong secret is refused"       "$(code -H "X-Origin-Secret: wrong" localhost:8082/)" 403
          want "armed: the right secret passes"       "$(code -H "X-Origin-Secret: $SECRET" localhost:8082/)" 200
          want "armed: /_health stays exempt"         "$(code localhost:8082/_health)"   200
          want "armed: /_health names the failure"    "$(verdict localhost:8082/_health)" missing
          want "armed: a wrong secret is a mismatch"  "$(verdict -H "X-Origin-Secret: wrong" localhost:8082/_health)" mismatch
          want "armed: the right secret is ok"        "$(verdict -H "X-Origin-Secret: $SECRET" localhost:8082/_health)" ok
          # The refusal is a page, not nginx's stock one — which would print the
          # exact nginx version to anyone knocking on the raw origin.
          curl -s localhost:8082/ -o denied.html
          grep -qF "answers only requests that came through the edge" denied.html \
            || { echo "::error::the 403 body is not the gate's own page"; cat denied.html; exit 1; }
          # The one thing that must never leak, in the two places it could.
          # `if !` rather than `grep … && exit`: under `set -e` a grep that
          # finds nothing — the passing case — would end the script itself.
          if grep -qF "$SECRET" denied.html; then
            echo "::error::the 403 body carries the secret"; exit 1
          fi
          if docker logs gate-on 2>&1 | grep -qF "$SECRET"; then
            echo "::error::the container logged the secret"; exit 1
          fi
          echo "OK: the secret is in neither the refusal nor the logs"
          # The rendered config has to be valid nginx, and `nginx -t` says so
          # without dumping it — `nginx -T` would print the secret into this log.
          docker exec gate-on nginx -t
          echo "OK: the rendered config validates"

          # 3. Armed with NO secret must fail CLOSED. This is the whole reason
          #    the map keys are tagged: an untagged `"${ORIGIN_SECRET}"` key
          #    would render as `""`, which is exactly what an absent header
          #    looks like — and a forgotten variable would open the door to the
          #    entire internet while looking armed.
          start gate-shut 8083 -e ORIGIN_GATE=on
          want "armed, no secret: refused"            "$(code localhost:8083/)"          403
          want "armed, no secret: empty header too"   "$(code -H 'X-Origin-Secret;' localhost:8083/)" 403
          want "armed, no secret: /_health exempt"    "$(code localhost:8083/_health)"   200

      # Served is not booted. On 2026-10-22 a Vite minor bump (#12225) passed
      # every step above and blanked every page in production: Rolldown put its
      # runtime helper into a chunk cycle, and the bundle threw `TypeError: t is
      # not a function` at module load (fixed by #12235). The runner's Google
      # Chrome loads the gate-off container's home page and fails on an
      # uncaught page error or an empty #root; scripts/site-smoke.mjs is the
      # same check the post-merge rule runs against production. No API check:
      # the page's data calls go to production, whose CORS does not know this
      # origin, so only the boot is asserted.
      - name: Browser boot (the bundle renders)
        if: steps.check.outputs.should_build == 'true'
        env:
          SITE: http://localhost:8081
          API: none
          CHROME_PATH: /usr/bin/google-chrome
          MIN_TEXT: "50"
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: |
          set -euo pipefail
          npm install --no-save --no-audit --no-fund --silent --prefix "$RUNNER_TEMP/smoke" playwright-core@1.64.1
          NODE_PATH="$RUNNER_TEMP/smoke/node_modules" node scripts/site-smoke.mjs /

      - name: Container logs on failure
        if: failure() && steps.check.outputs.should_build == 'true'
        run: |
          for c in gate-off gate-on gate-shut; do
            echo "=== $c ==="
            docker logs "$c" 2>&1 || true
          done

      - name: Skip notice
        if: steps.check.outputs.should_build == 'false'
        run: echo "::notice::App image build skipped - no changes to app/Dockerfile, the nginx configuration or the build inputs"

  # The renderer image (agents/renderer/Dockerfile) is what every Cloud Run
  # sandbox runs the model-written code with, and what the local Docker backend
  # runs in development. Without this job its first build ever would be the
  # bootstrap deploy, after the merge. `sandbox do` exists only on Cloud Run, so
  # the job checks the image the way the local backend uses it: the harness
  # renders a seaborn, a plotnine and an altair plot under the deployed
  # rlimits, with no network and a read-only root filesystem, then a
  # multi-script fixture whose probe must report no missing glyph (and a
  # DejaVu-only control whose probe must), and the service boots and reports
  # itself. The event-shape handling is the API job's in short form.
  renderer-image:
    name: Build renderer image and render through the harness
    # The job holds `id-token: write`, and PR code runs in it, so a PR Google Jules
    # opened never runs here: Jules opens PRs only into feature/* branches, which
    # this workflow does not cover, and this guards the one that lands on main by mistake.
    # A push to a feature/ branch never runs it either: Jules's own branches live there.
    if: >-
      github.event.pull_request.user.login != 'google-labs-jules[bot]' &&
      !startsWith(github.ref, 'refs/heads/feature/') &&
      !startsWith(github.event.merge_group.base_ref, 'refs/heads/feature/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The toolchain image (agents/renderer/toolchain.Dockerfile) lives in the private
      # Artifact Registry repository; the job pulls it through Workload Identity
      # Federation, whose principal has roles/artifactregistry.reader on it.
      id-token: write
    env:
      # Empty where the job gets no secrets (Dependabot): it builds the toolchain itself.
      WIF_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
    # A cold build installs pandas, numpy, matplotlib, seaborn, plotnine,
    # altair with vl-convert, pygal with cairosvg and lets-plot, plus libcairo
    # from apt, and builds the toolchain when its tag is missing: R and its
    # packages (about 2 minutes) and Julia's instantiate and precompile of the
    # catalogue's project (a cold toolchain took 7 minutes on 8 CPUs locally on
    # 2026-10-29, the precompile 4 of them; a 4-vCPU runner takes longer). 60 fails
    # loudly instead of hanging on a slow package index.
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Check for renderer-image changes
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MG_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          MG_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
          FORCE_RUN: ${{ inputs.force_run }}
        run: |
          set -uo pipefail
          CHANGED_FILES=""
          case "$EVENT_NAME" in
            pull_request)
              if ! CHANGED_FILES=$(git diff --name-only "$PR_BASE_SHA" "$PR_HEAD_SHA"); then
                echo "::error::could not diff $PR_BASE_SHA..$PR_HEAD_SHA — refusing to decide whether the renderer image needs building"
                exit 1
              fi ;;
            merge_group)
              if ! CHANGED_FILES=$(git diff --name-only "$MG_BASE_SHA" "$MG_HEAD_SHA"); then
                echo "::error::could not diff $MG_BASE_SHA..$MG_HEAD_SHA — refusing to decide whether the renderer image needs building"
                exit 1
              fi ;;
            push)
              if [[ "$PUSH_BEFORE" =~ ^0+$ ]] || ! CHANGED_FILES=$(git diff --name-only "$PUSH_BEFORE" "$PUSH_AFTER"); then
                echo "::warning::the pushed range is not diffable — building the renderer image rather than skipping the gate"
                echo "should_build=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi ;;
            *)
              if ! CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD); then
                echo "::warning::no parent commit to diff against — building the renderer image rather than skipping the gate"
                echo "should_build=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi ;;
          esac

          echo "Changed files:"
          echo "$CHANGED_FILES"

          # What the image is built from: its Dockerfile, the service package,
          # the harness it copies, the dependency lock, README.md (copied next
          # to pyproject.toml), the catalogue's Julia project (the toolchain's
          # Julia stage precompiles it) and the root .dockerignore (the build context).
          RENDERER_CHANGES=$(echo "$CHANGED_FILES" | grep -E '^(agents/renderer/|agents/__init__\.py$|agents/anyplot/render/harness\.py$|agents/anyplot/render/convert\.py$|tests/image/|tests/unit/agents/runtime/convert_fixtures\.py$|pyproject\.toml$|uv\.lock$|README\.md$|Project\.toml$|Manifest\.toml$|\.dockerignore$|\.github/workflows/ci-image\.yml$)' || true)

          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$FORCE_RUN" == "true" ]]; then
            echo "Manual trigger with force_run=true, will build the renderer image"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          elif [[ -n "$RENDERER_CHANGES" ]]; then
            echo "Found renderer-image changes, will build the renderer image"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "No renderer-image changes, skipping the build"
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          fi

      # network=host lets the builder reach the local registry a toolchain built in this
      # job is pushed to (below).
      - name: Set up Buildx
        if: steps.check.outputs.should_build == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
        with:
          driver-opts: network=host

      - name: Authenticate to GCP
        id: gcp-auth
        # No login for a PR by Dependabot or Google Jules, keyed on the PR author, which a
        # re-run cannot change: the job then builds the toolchain itself without one.
        if: >-
          steps.check.outputs.should_build == 'true' && env.WIF_PROVIDER != '' &&
          github.actor != 'dependabot[bot]' &&
          !contains(fromJSON('["dependabot[bot]", "google-labs-jules[bot]"]'), github.event.pull_request.user.login)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093  # v3
        with:
          project_id: anyplot
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}

      - name: Set up Cloud SDK
        if: steps.gcp-auth.outcome == 'success'
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db  # v3

      # The renderer builds FROM the toolchain image of its inputs' hash
      # (agents/renderer/toolchain.py), as the deploy does: pulled from Artifact
      # Registry by digest when the tag exists, built here when it is missing (a
      # PR that changes a toolchain input) or when the job has no login.
      - name: Look up the toolchain image
        id: toolchain
        if: steps.check.outputs.should_build == 'true'
        env:
          LOGGED_IN: ${{ steps.gcp-auth.outcome == 'success' }}
        run: |
          set -euo pipefail
          IMAGE=$(python3 agents/renderer/toolchain.py image)
          echo "toolchain image: $IMAGE"
          if [[ "$LOGGED_IN" == "true" ]]; then
            gcloud auth configure-docker europe-west4-docker.pkg.dev --quiet
            if DIGEST=$(docker buildx imagetools inspect "$IMAGE" --format '{{json .Manifest.Digest}}' 2>inspect.err); then
              # The renderer's FROM takes the repository and the tag with its digest, as the deploy passes them.
              {
                echo "image=${IMAGE%:*}"
                echo "tag=${IMAGE##*:}@$(tr -d '"' <<< "$DIGEST")"
                echo "build=false"
              } >> "$GITHUB_OUTPUT"
              exit 0
            elif grep -qiE 'not found|manifest unknown' inspect.err; then
              echo "::notice::$IMAGE is not in Artifact Registry yet: building the toolchain in this job"
            else
              cat inspect.err
              exit 1
            fi
          else
            echo "::notice::no Artifact Registry login (no secrets): building the toolchain in this job"
          fi
          {
            echo "image=localhost:5000/anyplot-toolchain"
            echo "tag=ci"
            echo "build=true"
          } >> "$GITHUB_OUTPUT"

      # A toolchain built in the job holds Julia's install and precompiled depot (2.7 GB
      # unpacked) several times over: in the builder, in the local registry, in the cache
      # export and in the renderer image loaded below (3.8 GB). The runner's preinstalled
      # SDKs this job never uses make the room.
      - name: Free disk space for the toolchain build
        if: steps.toolchain.outputs.build == 'true'
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Start a local registry for the toolchain
        if: steps.toolchain.outputs.build == 'true'
        run: docker run -d --name registry -p 5000:5000 registry:3

      # Its own cache scope: the toolchain changes rarely and independently of the renderer.
      - name: Build the toolchain image
        if: steps.toolchain.outputs.build == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: agents/renderer/toolchain.Dockerfile
          push: true
          tags: ${{ steps.toolchain.outputs.image }}:${{ steps.toolchain.outputs.tag }}
          cache-from: type=gha,scope=toolchain-image
          cache-to: type=gha,mode=max,scope=toolchain-image

      # Its own cache scope, like the app image: no layer is shared with the API.
      - name: Build the renderer image
        if: steps.check.outputs.should_build == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: agents/renderer/Dockerfile
          build-args: |
            TOOLCHAIN_IMAGE=${{ steps.toolchain.outputs.image }}
            TOOLCHAIN_TAG=${{ steps.toolchain.outputs.tag }}
          push: false
          load: true
          tags: anyplot-renderer:ci
          cache-from: type=gha,scope=renderer-image
          cache-to: type=gha,mode=max,scope=renderer-image

      # THE assert this job exists for: the image renders. The flags are the
      # local backend's (agents/anyplot/render/backends/local.py) and the
      # environment is the sandbox's (agents/renderer/executor.py), except
      # RLIMIT_NPROC: outside a sandbox it counts every process of the runner's
      # user, so it would test the runner, not the image.
      - name: Render a seaborn plot through the harness
        if: steps.check.outputs.should_build == 'true'
        run: |
          set -euo pipefail
          mkdir -p work
          printf 'x,y\na,1\nb,3\nc,2\n' > work/data.csv
          cat > work/plot.py <<'EOF'
          import os

          import matplotlib.pyplot as plt
          import pandas as pd
          import seaborn as sns

          THEME = os.environ["ANYPLOT_THEME"]
          df = pd.read_csv("data.csv")
          fig, ax = plt.subplots(figsize=(16, 9), dpi=200)
          sns.barplot(data=df, x="x", y="y", ax=ax)
          fig.savefig(f"plot-{THEME}.png")
          EOF
          docker run --rm --network none --read-only --tmpfs /tmp \
            --cap-drop ALL --security-opt no-new-privileges --user "$(id -u):$(id -g)" \
            -v "$PWD/work:/work" -w /work \
            -e ANYPLOT_THEME=light -e MPLBACKEND=Agg -e MPLCONFIGDIR=/tmp/mpl -e ANYPLOT_MPL_SEED=/opt/mplconfig \
            -e HOME=/tmp -e PYTHONDONTWRITEBYTECODE=1 -e OPENBLAS_NUM_THREADS=1 -e OMP_NUM_THREADS=1 \
            -e ANYPLOT_RLIMIT_CPU_S=60 -e ANYPLOT_RLIMIT_FSIZE_MB=50 -e ANYPLOT_RLIMIT_AS_MB=1024 \
            anyplot-renderer:ci /app/.venv/bin/python -I -X disable-remote-debug /opt/anyplot/harness.py plot.py > harness.out
          grep -qxF 'HARNESS {"event": "start"}' harness.out || { echo "::error::no HARNESS start line"; cat harness.out; exit 1; }
          grep -q '^HARNESS {"event": "end"' harness.out || { echo "::error::no HARNESS end line"; cat harness.out; exit 1; }
          python3 - <<'EOF'
          import json, struct
          png = open("work/plot-light.png", "rb").read()
          assert png[:8] == b"\x89PNG\r\n\x1a\n", "not a PNG"
          width, height = struct.unpack(">II", png[16:24])
          assert (width, height) == (3200, 1800), (width, height)
          probe = json.load(open("work/probe-light.json"))
          assert probe["canvas"] == [3200, 1800], probe.get("canvas")
          print(f"OK: plot-light.png {width}x{height}, {len(png)} bytes; probe written")
          EOF
          tail -n 1 harness.out

      # plotnine (step 1b of agentic/specs/261024-agent-all-libraries.md) runs in process like
      # seaborn, with the same flags. It reads the plot's frame to look `aes` names up
      # (FRAME_READERS in harness.py) and saves a figure that has no canvas, which the probe
      # gives an Agg one: the probe's canvas is the assert for both.
      - name: Render a plotnine plot through the harness
        if: steps.check.outputs.should_build == 'true'
        run: |
          set -euo pipefail
          mkdir -p work-plotnine
          printf 'x,y\na,1\nb,3\nc,2\n' > work-plotnine/data.csv
          cat > work-plotnine/plot.py <<'EOF'
          import os

          import pandas as pd
          from plotnine import aes, geom_col, ggplot

          THEME = os.environ["ANYPLOT_THEME"]
          df = pd.read_csv("data.csv")
          plot = ggplot(df) + aes(x="x", y="y") + geom_col()
          plot.save(f"plot-{THEME}.png", dpi=400, width=8, height=4.5, units="in", verbose=False)
          EOF
          docker run --rm --network none --read-only --tmpfs /tmp \
            --cap-drop ALL --security-opt no-new-privileges --user "$(id -u):$(id -g)" \
            -v "$PWD/work-plotnine:/work" -w /work \
            -e ANYPLOT_THEME=light -e MPLBACKEND=Agg -e MPLCONFIGDIR=/tmp/mpl -e ANYPLOT_MPL_SEED=/opt/mplconfig \
            -e HOME=/tmp -e PYTHONDONTWRITEBYTECODE=1 -e OPENBLAS_NUM_THREADS=1 -e OMP_NUM_THREADS=1 \
            -e ANYPLOT_RLIMIT_CPU_S=60 -e ANYPLOT_RLIMIT_FSIZE_MB=50 -e ANYPLOT_RLIMIT_AS_MB=1024 \
            anyplot-renderer:ci /app/.venv/bin/python -I -X disable-remote-debug /opt/anyplot/harness.py plot.py > work-plotnine/harness.out
          grep -qxF 'HARNESS {"event": "start"}' work-plotnine/harness.out || { echo "::error::no HARNESS start line"; cat work-plotnine/harness.out; exit 1; }
          grep -q '^HARNESS {"event": "end"' work-plotnine/harness.out || { echo "::error::no HARNESS end line"; cat work-plotnine/harness.out; exit 1; }
          python3 - <<'EOF'
          import json, struct
          png = open("work-plotnine/plot-light.png", "rb").read()
          assert png[:8] == b"\x89PNG\r\n\x1a\n", "not a PNG"
          width, height = struct.unpack(">II", png[16:24])
          assert (width, height) == (3200, 1800), (width, height)
          probe = json.load(open("work-plotnine/probe-light.json"))
          assert probe["canvas"] == [3200, 1800], probe.get("canvas")
          print(f"OK: plotnine plot-light.png {width}x{height}, {len(png)} bytes; probe canvas {probe['canvas']}")
          EOF
          tail -n 1 work-plotnine/harness.out

      # altair renders through vl-convert, a binary with an embedded V8 that reserves far
      # more address space at start than it uses: it aborts under an RLIMIT_AS of 64 GiB
      # and less (measured 2026-10-25, 1024 MB included). This run leaves
      # ANYPLOT_RLIMIT_AS_MB out, as the altair row of agents/renderer/commands.py does;
      # every other flag is the seaborn step's. The PIL block is the catalogue's padding
      # to 3200 x 1800, which reopens the PNG. vl-convert draws no matplotlib figure, so
      # the run writes no probe: the PNG's size and the HTML are the asserts.
      - name: Render an altair plot through the harness
        if: steps.check.outputs.should_build == 'true'
        run: |
          set -euo pipefail
          mkdir -p work-altair
          printf 'x,y\na,1\nb,3\nc,2\n' > work-altair/data.csv
          cat > work-altair/plot.py <<'EOF'
          import os

          import altair as alt
          import pandas as pd
          from PIL import Image

          THEME = os.environ["ANYPLOT_THEME"]
          df = pd.read_csv("data.csv")
          chart = alt.Chart(df).mark_bar().encode(x="x:N", y="y:Q").properties(width=740, height=400)
          chart.save(f"plot-{THEME}.png", scale_factor=4.0)

          TW, TH = 3200, 1800
          _img = Image.open(f"plot-{THEME}.png").convert("RGB")
          _w, _h = _img.size
          if _w > TW or _h > TH:
              raise SystemExit(f"altair vl-convert produced {_w}x{_h}, exceeds target {TW}x{TH}")
          if _w < TW or _h < TH:
              _canvas = Image.new("RGB", (TW, TH), "#FAF8F1")
              _canvas.paste(_img, ((TW - _w) // 2, (TH - _h) // 2))
              _canvas.save(f"plot-{THEME}.png")

          chart.save(f"plot-{THEME}.html")
          EOF
          docker run --rm --network none --read-only --tmpfs /tmp \
            --cap-drop ALL --security-opt no-new-privileges --user "$(id -u):$(id -g)" \
            -v "$PWD/work-altair:/work" -w /work \
            -e ANYPLOT_THEME=light -e MPLBACKEND=Agg -e MPLCONFIGDIR=/tmp/mpl -e ANYPLOT_MPL_SEED=/opt/mplconfig \
            -e HOME=/tmp -e PYTHONDONTWRITEBYTECODE=1 -e OPENBLAS_NUM_THREADS=1 -e OMP_NUM_THREADS=1 \
            -e ANYPLOT_RLIMIT_CPU_S=60 -e ANYPLOT_RLIMIT_FSIZE_MB=50 \
            anyplot-renderer:ci /app/.venv/bin/python -I -X disable-remote-debug /opt/anyplot/harness.py plot.py > work-altair/harness.out
          grep -qxF 'HARNESS {"event": "start"}' work-altair/harness.out || { echo "::error::no HARNESS start line"; cat work-altair/harness.out; exit 1; }
          grep -q '^HARNESS {"event": "end"' work-altair/harness.out || { echo "::error::no HARNESS end line"; cat work-altair/harness.out; exit 1; }
          python3 - <<'EOF'
          import struct
          png = open("work-altair/plot-light.png", "rb").read()
          assert png[:8] == b"\x89PNG\r\n\x1a\n", "not a PNG"
          width, height = struct.unpack(">II", png[16:24])
          assert (width, height) == (3200, 1800), (width, height)
          html = open("work-altair/plot-light.html", encoding="utf-8").read()
          assert "vega" in html, "plot-light.html holds no Vega chart"
          print(f"OK: altair plot-light.png {width}x{height}, {len(png)} bytes; plot-light.html {len(html)} characters")
          EOF
          tail -n 1 work-altair/harness.out

      # pygal (step 1c of agentic/specs/261024-agent-all-libraries.md) runs in process with the
      # seaborn step's flags, as its row of agents/renderer/commands.py keeps the Python
      # defaults. Its PNG is cairosvg's: libcairo from the image's apt layer, loaded before the
      # guard (warm_cairo in harness.py), and cssselect2's selector lambdas (CODE_BUILDERS).
      # The HTML twin is the chart's SVG, written by render_to_file; pygal writes no probe.
      # Two forms: render_to_png on a 3200x1800 chart, and the form the normaliser's canvas
      # rewrite gives oversized charts (agents/anyplot/code/normalise.py; 94 catalogue files
      # on 2026-10-26, 89 of them 4800x2700): the plot itself imports cairosvg and calls
      # svg2png at 3200x1800.
      - name: Render a pygal plot through the harness
        if: steps.check.outputs.should_build == 'true'
        run: |
          set -euo pipefail
          render() {  # $1: work dir with plot.py and data.csv
            local work=$1
            docker run --rm --network none --read-only --tmpfs /tmp \
              --cap-drop ALL --security-opt no-new-privileges --user "$(id -u):$(id -g)" \
              -v "$PWD/$work:/work" -w /work \
              -e ANYPLOT_THEME=light -e MPLBACKEND=Agg -e MPLCONFIGDIR=/tmp/mpl -e ANYPLOT_MPL_SEED=/opt/mplconfig \
              -e HOME=/tmp -e PYTHONDONTWRITEBYTECODE=1 -e OPENBLAS_NUM_THREADS=1 -e OMP_NUM_THREADS=1 \
              -e ANYPLOT_RLIMIT_CPU_S=60 -e ANYPLOT_RLIMIT_FSIZE_MB=50 -e ANYPLOT_RLIMIT_AS_MB=1024 \
              anyplot-renderer:ci /app/.venv/bin/python -I -X disable-remote-debug /opt/anyplot/harness.py plot.py > "$work/harness.out"
            grep -qxF 'HARNESS {"event": "start"}' "$work/harness.out" || { echo "::error::no HARNESS start line in $work"; cat "$work/harness.out"; exit 1; }
            grep -q '^HARNESS {"event": "end"' "$work/harness.out" || { echo "::error::no HARNESS end line in $work"; cat "$work/harness.out"; exit 1; }
            python3 - "$work" <<'EOF'
          import struct
          import sys

          work = sys.argv[1]
          png = open(f"{work}/plot-light.png", "rb").read()
          assert png[:8] == b"\x89PNG\r\n\x1a\n", "not a PNG"
          width, height = struct.unpack(">II", png[16:24])
          assert (width, height) == (3200, 1800), (width, height)
          html = open(f"{work}/plot-light.html", encoding="utf-8").read()
          assert "pygal-chart" in html, "plot-light.html holds no pygal chart"
          print(f"OK: {work} plot-light.png {width}x{height}, {len(png)} bytes; plot-light.html {len(html)} characters")
          EOF
            tail -n 1 "$work/harness.out"
          }
          mkdir -p work-pygal work-pygal-canvas
          printf 'x,y\na,1\nb,3\nc,2\n' > work-pygal/data.csv
          cp work-pygal/data.csv work-pygal-canvas/data.csv
          cat > work-pygal/plot.py <<'EOF'
          import os

          import pandas as pd
          import pygal

          THEME = os.environ["ANYPLOT_THEME"]
          df = pd.read_csv("data.csv")
          chart = pygal.Bar(width=3200, height=1800, title="pygal", x_title="x", y_title="y")
          chart.x_labels = list(df["x"])
          chart.add("y", [float(value) for value in df["y"]])
          chart.render_to_png(f"plot-{THEME}.png")
          chart.render_to_file(f"plot-{THEME}.html")
          EOF
          cat > work-pygal-canvas/plot.py <<'EOF'
          import os

          import cairosvg
          import pandas as pd
          import pygal

          THEME = os.environ["ANYPLOT_THEME"]
          df = pd.read_csv("data.csv")
          chart = pygal.Bar(width=4800, height=2700, title="pygal", x_title="x", y_title="y")
          chart.x_labels = list(df["x"])
          chart.add("y", [float(value) for value in df["y"]])
          cairosvg.svg2png(bytestring=chart.render(), write_to=f"plot-{THEME}.png", output_width=3200, output_height=1800)
          chart.render_to_file(f"plot-{THEME}.html")
          EOF
          render work-pygal
          render work-pygal-canvas

      # lets-plot (step 1c) rasterises in its native bridge, which needs more address space
      # than the Python default: its row of agents/renderer/commands.py sets RLIMIT_AS to
      # 2048 MiB with Arrow's system allocator, and points the bridge's own fontconfig at the
      # image's /opt/anyplot/fonts.conf. This run takes that row's environment and limit from
      # the command table itself (commands.py imports only the standard library, so the
      # runner's Python reads it), in the order the sandbox's environment has them. Every
      # other flag is the seaborn step's. Without the fontconfig file every export writes
      # "Fontconfig error" to stderr, which is the extra assert. No probe.
      - name: Render a lets-plot plot through the harness
        if: steps.check.outputs.should_build == 'true'
        run: |
          set -euo pipefail
          mkdir -p work-letsplot
          python3 - > work-letsplot/row.flags <<'EOF'
          from agents.renderer.commands import command_for

          row = command_for("python", "letsplot")
          flags = [f"{key}={value}" for key, value in row.env.items()]
          if row.rlimit_as:
              flags.append(f"ANYPLOT_RLIMIT_AS_MB={row.rlimit_as_mb or 1024}")
          for flag in flags:
              print(f"-e\n{flag}")
          EOF
          mapfile -t ROW_FLAGS < work-letsplot/row.flags
          test "${#ROW_FLAGS[@]}" -gt 0 || { echo "::error::the letsplot row of commands.py gave no flags"; exit 1; }
          echo "the letsplot row: ${ROW_FLAGS[*]}"
          printf 'x,y\na,1\nb,3\nc,2\n' > work-letsplot/data.csv
          cat > work-letsplot/plot.py <<'EOF'
          import os

          import pandas as pd
          from lets_plot import LetsPlot, aes, geom_bar, ggplot, ggsize, labs
          from lets_plot.export import ggsave

          LetsPlot.setup_html()

          THEME = os.environ["ANYPLOT_THEME"]
          df = pd.read_csv("data.csv")
          plot = ggplot(df, aes(x="x", y="y")) + geom_bar(stat="identity") + labs(title="lets-plot") + ggsize(800, 450)
          ggsave(plot, f"plot-{THEME}.png", path=".", scale=4)
          ggsave(plot, f"plot-{THEME}.html", path=".")
          EOF
          docker run --rm --network none --read-only --tmpfs /tmp \
            --cap-drop ALL --security-opt no-new-privileges --user "$(id -u):$(id -g)" \
            -v "$PWD/work-letsplot:/work" -w /work \
            -e ANYPLOT_THEME=light -e MPLBACKEND=Agg -e MPLCONFIGDIR=/tmp/mpl -e ANYPLOT_MPL_SEED=/opt/mplconfig \
            "${ROW_FLAGS[@]}" \
            -e HOME=/tmp -e PYTHONDONTWRITEBYTECODE=1 -e OPENBLAS_NUM_THREADS=1 -e OMP_NUM_THREADS=1 \
            -e ANYPLOT_RLIMIT_CPU_S=60 -e ANYPLOT_RLIMIT_FSIZE_MB=50 -e ANYPLOT_DENY_EXEC=required \
            anyplot-renderer:ci /app/.venv/bin/python -I -X disable-remote-debug /opt/anyplot/harness.py plot.py \
            > work-letsplot/harness.out 2> work-letsplot/harness.err \
            || { echo "::error::the lets-plot render failed"; cat work-letsplot/harness.out work-letsplot/harness.err; exit 1; }
          grep -qxF 'HARNESS {"event": "start"}' work-letsplot/harness.out || { echo "::error::no HARNESS start line"; cat work-letsplot/harness.out; exit 1; }
          grep -q '^HARNESS {"event": "end"' work-letsplot/harness.out || { echo "::error::no HARNESS end line"; cat work-letsplot/harness.out; exit 1; }
          if grep -q 'Fontconfig error' work-letsplot/harness.err; then
            echo "::error::lets-plot's fontconfig found no configuration"; cat work-letsplot/harness.err; exit 1
          fi
          python3 - <<'EOF'
          import struct
          png = open("work-letsplot/plot-light.png", "rb").read()
          assert png[:8] == b"\x89PNG\r\n\x1a\n", "not a PNG"
          width, height = struct.unpack(">II", png[16:24])
          assert (width, height) == (3200, 1800), (width, height)
          html = open("work-letsplot/plot-light.html", encoding="utf-8").read()
          assert "data-lets-plot-script" in html, "plot-light.html holds no lets-plot chart"
          print(f"OK: lets-plot plot-light.png {width}x{height}, {len(png)} bytes; plot-light.html {len(html)} characters")
          EOF
          tail -n 1 work-letsplot/harness.out
          # Every in-process run requires the harness's kernel filter against program starts
          # (ANYPLOT_DENY_EXEC=required, which executor.sandbox_env sets); a render without it exits
          # with 3 before the plot runs, so this one ran under it.
          tail -n 1 work-letsplot/harness.out | grep -qF '"exec_deny": "on"' \
            || { echo "::error::the lets-plot render ran without the exec filter"; exit 1; }

      # R (step 2 of agentic/specs/261024-agent-all-libraries.md) runs in exec mode: the harness
      # starts R's binary with the command table's argv and environment and preloads the exec
      # filter into it (harness.main_exec). The plot's own system() is killed by the filter, a
      # non-ASCII title goes through ragg under the row's UTF-8 locale, and the end line must say
      # the filter was on: the harness refuses (exit 3) a run whose filter did not report on.
      - name: Render an R plot through the harness in exec mode
        if: steps.check.outputs.should_build == 'true'
        run: |
          set -euo pipefail
          mkdir -p work-r
          python3 - > work-r/row.flags <<'EOF'
          from agents.renderer.commands import command_for

          row = command_for("r", "ggplot2")
          assert row.exec_deny, "the R row must run under the exec filter"
          flags = [f"{key}={value}" for key, value in row.env.items()]
          if row.rlimit_as:
              flags.append(f"ANYPLOT_RLIMIT_AS_MB={row.rlimit_as_mb or 1024}")
          for flag in flags:
              print(f"-e\n{flag}")
          EOF
          python3 - > work-r/row.argv <<'EOF'
          from agents.renderer.commands import command_for

          row = command_for("r", "ggplot2")
          print("\n".join([*row.argv, f"{row.code_flag}{row.code_file}"]))
          EOF
          mapfile -t ROW_FLAGS < work-r/row.flags
          mapfile -t ROW_ARGV < work-r/row.argv
          echo "the R row: ${ROW_ARGV[*]}"
          printf 'x,y\na,1\nb,3\nc,2\n' > work-r/data.csv
          cat > work-r/plot.R <<'EOF'
          library(ggplot2)

          THEME <- Sys.getenv("ANYPLOT_THEME", "light")
          df <- readr::read_csv("data.csv", show_col_types = FALSE)
          # Under the exec filter a started program dies before it runs: a status, never an output.
          stopifnot(system("true") != 0)
          plot <- ggplot(df, aes(x, y)) + geom_col() + labs(title = "Gr\u00f6\u00dfe \u2013 \u00dcberblick")
          ggsave(sprintf("plot-%s.png", THEME), plot, device = ragg::agg_png, width = 16, height = 9, dpi = 200)
          EOF
          docker run --rm --network none --read-only --tmpfs /tmp \
            --cap-drop ALL --security-opt no-new-privileges --user "$(id -u):$(id -g)" \
            -v "$PWD/work-r:/work" -w /work \
            -e ANYPLOT_THEME=light "${ROW_FLAGS[@]}" \
            -e HOME=/tmp -e PYTHONDONTWRITEBYTECODE=1 -e OPENBLAS_NUM_THREADS=1 -e OMP_NUM_THREADS=1 \
            -e ANYPLOT_RLIMIT_CPU_S=60 -e ANYPLOT_RLIMIT_FSIZE_MB=50 -e ANYPLOT_DENY_EXEC=required \
            anyplot-renderer:ci /app/.venv/bin/python -I -X disable-remote-debug /opt/anyplot/harness.py \
            --exec -- "${ROW_ARGV[@]}" \
            > work-r/harness.out 2> work-r/harness.err \
            || { echo "::error::the R render failed"; cat work-r/harness.out work-r/harness.err; exit 1; }
          grep -qxF 'HARNESS {"event": "start"}' work-r/harness.out || { echo "::error::no HARNESS start line"; cat work-r/harness.out; exit 1; }
          tail -n 1 work-r/harness.out | grep -qF '"exec_deny": "on"' \
            || { echo "::error::the R render ran without the exec filter"; cat work-r/harness.out work-r/harness.err; exit 1; }
          python3 - <<'EOF'
          import struct
          png = open("work-r/plot-light.png", "rb").read()
          assert png[:8] == b"\x89PNG\r\n\x1a\n", "not a PNG"
          width, height = struct.unpack(">II", png[16:24])
          assert (width, height) == (3200, 1800), (width, height)
          print(f"OK: R plot-light.png {width}x{height}, {len(png)} bytes")
          EOF
          tail -n 1 work-r/harness.out

      # Julia (step 5 of agentic/specs/261024-agent-all-libraries.md) runs in exec mode like R:
      # the launcher by its path with the row's flags and environment, the exec filter preloaded,
      # and every package loaded from the toolchain's precompiled depot under
      # --compiled-modules=strict, the precompile workload first (`-L warmup.jl`, J1.1). A catalogue
      # file renders unchanged, then a forced cache miss (another --check-bounds, one of the cache
      # flags) must fail within seconds: under strict a package image that does not match is an
      # error, never a compile under the render's timeout. The miss fails on the workload's image,
      # the first that `-L` loads.
      - name: Render a Makie plot through the harness in exec mode
        if: steps.check.outputs.should_build == 'true'
        run: |
          set -euo pipefail
          mkdir -p work-jl
          python3 - > work-jl/row.flags <<'EOF'
          from agents.renderer.commands import JULIA_WARMUP, command_for

          row = command_for("julia", "makie")
          assert row.exec_deny and not row.rlimit_as, "the Julia row runs under the exec filter, without RLIMIT_AS"
          assert "--compiled-modules=strict" in row.argv, row.argv
          assert row.argv[-2:] == ("-L", JULIA_WARMUP), row.argv
          for key, value in row.env.items():
              print(f"-e\n{key}={value}")
          EOF
          python3 - > work-jl/row.argv <<'EOF'
          from agents.renderer.commands import command_for

          row = command_for("julia", "makie")
          print("\n".join([*row.argv, f"{row.code_flag}{row.code_file}"]))
          EOF
          mapfile -t ROW_FLAGS < work-jl/row.flags
          mapfile -t ROW_ARGV < work-jl/row.argv
          echo "the Julia row: ${ROW_ARGV[*]}"
          cp plots/scatter-basic/implementations/julia/makie.jl work-jl/plot.jl
          printf 'x\n1\n' > work-jl/data.csv
          start=$(date +%s.%N)
          docker run --rm --network none --read-only --tmpfs /tmp \
            --cap-drop ALL --security-opt no-new-privileges --user "$(id -u):$(id -g)" \
            -v "$PWD/work-jl:/work" -w /work \
            -e ANYPLOT_THEME=light "${ROW_FLAGS[@]}" \
            -e HOME=/tmp -e PYTHONDONTWRITEBYTECODE=1 -e OMP_NUM_THREADS=1 \
            -e ANYPLOT_RLIMIT_CPU_S=60 -e ANYPLOT_RLIMIT_FSIZE_MB=50 -e ANYPLOT_DENY_EXEC=required \
            anyplot-renderer:ci /app/.venv/bin/python -I -X disable-remote-debug /opt/anyplot/harness.py \
            --exec -- "${ROW_ARGV[@]}" \
            > work-jl/harness.out 2> work-jl/harness.err \
            || { echo "::error::the Makie render failed"; cat work-jl/harness.out work-jl/harness.err; exit 1; }
          echo "wall time: $(python3 -c "import sys; print(round(float(sys.argv[2]) - float(sys.argv[1]), 1))" "$start" "$(date +%s.%N)") s"
          grep -qxF 'HARNESS {"event": "start"}' work-jl/harness.out || { echo "::error::no HARNESS start line"; cat work-jl/harness.out; exit 1; }
          tail -n 1 work-jl/harness.out | grep -qF '"exec_deny": "on"' \
            || { echo "::error::the Makie render ran without the exec filter"; cat work-jl/harness.out work-jl/harness.err; exit 1; }
          python3 - <<'EOF'
          import struct
          png = open("work-jl/plot-light.png", "rb").read()
          assert png[:8] == b"\x89PNG\r\n\x1a\n", "not a PNG"
          width, height = struct.unpack(">II", png[16:24])
          assert (width, height) == (3200, 1800), (width, height)
          print(f"OK: Makie plot-light.png {width}x{height}, {len(png)} bytes")
          EOF
          tail -n 1 work-jl/harness.out

          # The forced cache miss: the same launcher, flags and environment, plus --check-bounds=yes.
          start=$(date +%s)
          if docker run --rm --network none --read-only --tmpfs /tmp \
            --cap-drop ALL --security-opt no-new-privileges --user "$(id -u):$(id -g)" \
            "${ROW_FLAGS[@]}" -e HOME=/tmp \
            anyplot-renderer:ci "${ROW_ARGV[@]:0:${#ROW_ARGV[@]}-1}" --check-bounds=yes -e 'using CairoMakie' \
            > work-jl/miss.out 2>&1; then
            echo "::error::a cache miss loaded under --compiled-modules=strict"; cat work-jl/miss.out; exit 1
          fi
          took=$(( $(date +%s) - start ))
          grep -q 'not available with flags' work-jl/miss.out \
            || { echo "::error::the cache miss failed for another reason"; cat work-jl/miss.out; exit 1; }
          test "$took" -le 30 || { echo "::error::the cache miss took ${took} s; strict must fail fast"; exit 1; }
          echo "OK: a cache miss fails under strict in ${took} s: $(grep -m1 'not available with flags' work-jl/miss.out)"

      # Native code the audit hook cannot see finds no program to run. lets-plot's bridge links
      # ImageMagick with a compiled-in delegate map that runs programs by name through /bin/sh
      # (gs, curl, soffice, ffmpeg, rsvg-convert, inkscape and the rest that
      # agents/renderer/delegates.py lists). That ImageMagick is a zero-configuration build: it
      # reads no policy.xml, so no policy file can switch the delegates off (an export with a
      # policy denying PNG under MAGICK_CONFIGURE_PATH still wrote its PNG, 2026-10-26).
      # matplotlib calls fc-list when it finds it. So the sandbox's PATH (SANDBOX_PATH of
      # agents/renderer/executor.py) must carry none of them, next to RLIMIT_NPROC and the
      # sandbox itself. node stays on the list until the JavaScript runtime (step 3 of
      # agentic/specs/261024-agent-all-libraries.md) installs it as its row's toolchain.
      - name: No delegate program on the sandbox PATH
        if: steps.check.outputs.should_build == 'true'
        run: |
          set -euo pipefail
          # The image build ran the same check (agents/renderer/Dockerfile); this runs it
          # once more in the image the job just built, as the sandbox would see it.
          docker run --rm --network none anyplot-renderer:ci /app/.venv/bin/python -m agents.renderer.delegates

      # And the kernel refuses every program start once a guard is armed, whatever is on PATH:
      # the harness installs a seccomp filter against execve and execveat (install_exec_deny in
      # agents/anyplot/render/harness.py, since 2026-10-28) on every thread, the running ones
      # included, and every child. This loads the image's harness under the sandbox's flags and
      # checks these routes: the probe before the filter (ENOENT, the path lookup), the filter, a
      # thread started before it, libc's system() (what native code calls), subprocess, fexecve
      # (execveat) and a forked child, which still forks but cannot exec; x32 and int 0x80 calls
      # are the unit tests' (tests/unit/agents/runtime/test_exec_deny.py). Docker's default seccomp profile lets a
      # process add its own filter; whether Cloud Run's sandbox does is checked on the deployed
      # renderer (agentic/specs/261024-agent-all-libraries.md, step 1c, "Next").
      - name: The kernel refuses program starts under the harness
        if: steps.check.outputs.should_build == 'true'
        run: |
          set -euo pipefail
          mkdir -p work-execdeny
          cat > work-execdeny/check.py <<'EOF'
          import ctypes, importlib.util, os, subprocess, sys, threading

          spec = importlib.util.spec_from_file_location("harness", "/opt/anyplot/harness.py")
          harness = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(harness)


          def probe():
              try:
                  os.execv(harness.EXEC_PROBE_PATH, [harness.EXEC_PROBE_PATH])
              except OSError as exc:
                  return type(exc).__name__


          ready, go, seen = threading.Event(), threading.Event(), {}


          def worker():
              ready.set()
              go.wait()
              seen["thread"] = probe()


          thread = threading.Thread(target=worker)
          thread.start()
          ready.wait()
          print(probe())
          print(harness.install_exec_deny())
          go.set()
          thread.join()
          print(seen["thread"])
          print(ctypes.CDLL(None).system(b"exit 0") != 0)
          try:
              subprocess.run(["true"], check=False)
              print("ran")
          except PermissionError:
              print("PermissionError")
          descriptor = os.open("/bin/true", os.O_RDONLY)
          try:
              os.execve(descriptor, ["true"], {})  # fexecve: execveat on the descriptor
          except PermissionError:
              print("PermissionError")
          pid = os.fork()
          if pid == 0:
              try:
                  os.execv("/bin/true", ["true"])
              except PermissionError:
                  os._exit(7)
              os._exit(9)
          print(os.waitstatus_to_exitcode(os.waitpid(pid, 0)[1]))
          EOF
          docker run --rm --network none --read-only --tmpfs /tmp \
            --cap-drop ALL --security-opt no-new-privileges --user "$(id -u):$(id -g)" \
            -v "$PWD/work-execdeny:/work:ro" -w /work \
            anyplot-renderer:ci /app/.venv/bin/python -I -X disable-remote-debug /work/check.py \
            > work-execdeny/check.out
          cat work-execdeny/check.out
          printf 'FileNotFoundError\non\nPermissionError\nTrue\nPermissionError\nPermissionError\n7\n' | diff - work-execdeny/check.out \
            || { echo "::error::the harness's exec filter did not refuse every program start"; exit 1; }

      # The file conversion inside the image (harness.py --convert): every format the
      # page sends, with the image's slimmed pyarrow (owner decision of 2026-10-15),
      # its calamine and NumPy, the guard's preload, and the sandbox's environment.
      # A file the Dockerfile's slimming removed but a reader needs fails here.
      - name: Convert every data format through the harness
        if: steps.check.outputs.should_build == 'true'
        run: |
          set -euo pipefail
          docker run --rm --network none --read-only --tmpfs /tmp \
            --cap-drop ALL --security-opt no-new-privileges --user "$(id -u):$(id -g)" \
            -v "$PWD:/repo:ro" \
            anyplot-renderer:ci /app/.venv/bin/python -I /repo/tests/image/convert_smoke.py

      # The fallback fonts: the harness appends them after the font the code chose,
      # so this fixture does what catalogue code does to the font setup (seaborn's
      # rcParams reset, a bold title, a monospace text) and draws seven of the
      # scripts the image covers: Han, kana, Hangul, Hebrew, Arabic, Devanagari and
      # Thai. The other fallback families (the remaining Indic scripts, Sinhala,
      # Khmer, Myanmar, Ethiopic and the two Symbols faces) are drawn by nothing
      # here; `check_fonts` in the image build only proves they are installed. The
      # probe's missing_glyphs is the assert; the PNG is uploaded for an eyeball
      # check of the shaping. The DejaVu-only control below proves the assert can fail.
      - name: Render multi-script text through the harness
        if: steps.check.outputs.should_build == 'true'
        run: |
          set -euo pipefail
          mkdir -p work-i18n
          printf 'x,y\na,1\nb,3\nc,2\nd,4\ne,2\n' > work-i18n/data.csv
          cat > work-i18n/plot.py <<'EOF'
          import os

          import matplotlib.pyplot as plt
          import pandas as pd
          import seaborn as sns

          THEME = os.environ["ANYPLOT_THEME"]
          df = pd.read_csv("data.csv")
          sns.set_theme(style="whitegrid")  # rewrites font.family, as 306 catalogue seaborn files do
          fig, ax = plt.subplots(figsize=(16, 9), dpi=200)
          sns.barplot(data=df, x="x", y="y", ax=ax)
          ax.set_title("销售额（万元） · 東京の売上 · 월간 매출", fontsize=26, fontweight="bold")
          ax.set_xlabel("月間売上高（千円） · שווקים", fontsize=18)
          ax.set_ylabel("المبيعات الشهرية · मासिक बिक्री", fontsize=18)
          ax.set_xticks(range(len(df)), ["ยอดขาย", "한국어", "दिल्ली", "القاهرة", "東京"])
          ax.text(0.02, 0.92, "monospace: 等幅 ไทย", family="monospace", transform=ax.transAxes, fontsize=16)
          fig.savefig(f"plot-{THEME}.png")
          EOF
          render() {  # $1: work dir; the rest: extra docker -e flags
            local work=$1; shift
            docker run --rm --network none --read-only --tmpfs /tmp \
              --cap-drop ALL --security-opt no-new-privileges --user "$(id -u):$(id -g)" \
              -v "$PWD/$work:/work" -w /work \
              -e ANYPLOT_THEME=light -e MPLBACKEND=Agg -e MPLCONFIGDIR=/tmp/mpl \
              -e HOME=/tmp -e PYTHONDONTWRITEBYTECODE=1 -e OPENBLAS_NUM_THREADS=1 -e OMP_NUM_THREADS=1 \
              -e ANYPLOT_RLIMIT_CPU_S=60 -e ANYPLOT_RLIMIT_FSIZE_MB=50 -e ANYPLOT_RLIMIT_AS_MB=1024 \
              "$@" anyplot-renderer:ci /app/.venv/bin/python -I -X disable-remote-debug /opt/anyplot/harness.py plot.py \
              > "$work/harness.out"
            grep -q '^HARNESS {"event": "end"' "$work/harness.out" || { echo "::error::no HARNESS end line in $work"; cat "$work/harness.out"; exit 1; }
          }
          render work-i18n -e ANYPLOT_MPL_SEED=/opt/mplconfig
          python3 - <<'EOF'
          import json, struct
          png = open("work-i18n/plot-light.png", "rb").read()
          assert png[:8] == b"\x89PNG\r\n\x1a\n", "not a PNG"
          assert struct.unpack(">II", png[16:24]) == (3200, 1800)
          probe = json.load(open("work-i18n/probe-light.json"))
          assert probe["canvas"] == [3200, 1800], probe.get("canvas")
          assert probe["missing_glyphs"] == {"count": 0, "math": 0, "sample": []}, probe["missing_glyphs"]
          print("OK: every script drew with a glyph; probe", probe["missing_glyphs"])
          EOF
          tail -n 1 work-i18n/harness.out

          # The control: the same code with matplotlib's bundled fonts only. No seed, so the
          # cache is rebuilt in /tmp/mpl without /usr/share/fonts, the harness finds none of
          # its fallback families installed, and the same probe must report missing glyphs.
          cp -r work-i18n work-dejavu && rm -f work-dejavu/plot-light.png work-dejavu/probe-light.json
          render work-dejavu -e MPL_IGNORE_SYSTEM_FONTS=1
          python3 - <<'EOF'
          import json
          glyphs = json.load(open("work-dejavu/probe-light.json"))["missing_glyphs"]
          assert glyphs["count"] > 0 and glyphs["sample"], glyphs
          assert all(isinstance(c, int) and c > 0x7F for c in glyphs["sample"]), glyphs
          assert any(0x0900 <= c <= 0x0E7F for c in glyphs["sample"]), glyphs  # Devanagari or Thai, which DejaVu lacks
          print("OK: the DejaVu-only control reports", glyphs["count"], "missing code points")
          EOF

      # The numbers the font set costs, for the PR and the deploy notes: the image
      # size, the base release, the installed files and their package versions,
      # libcairo's apt layer (pygal) among them.
      - name: Image size, base release and installed fonts
        if: steps.check.outputs.should_build == 'true'
        run: |
          set -euo pipefail
          echo "image size: $(docker image inspect --format '{{.Size}}' anyplot-renderer:ci) bytes"
          docker run --rm anyplot-renderer:ci du -sh /app/.venv/lib/python3.14/site-packages/pyarrow
          docker run --rm anyplot-renderer:ci sh -c 'grep PRETTY_NAME /etc/os-release; cat /usr/share/doc/fonts-noto/versions.txt; ls -l /usr/share/fonts/noto; du -sh /usr/share/fonts/noto; head -n 5 /usr/share/doc/fonts-noto/fonts-noto-core.copyright'
          docker run --rm anyplot-renderer:ci dpkg-query -W libcairo2 libfontconfig1 fontconfig-config fonts-dejavu-core fonts-dejavu-mono

      # Also after a failed assert, so the PNGs show what went wrong.
      - name: Upload the multi-script render
        if: ${{ !cancelled() && steps.check.outputs.should_build == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: renderer-i18n-render
          path: |
            work-i18n/plot-light.png
            work-dejavu/plot-light.png
          if-no-files-found: warn
          retention-days: 7

      - name: The image carries no ADK and the version it reports
        if: steps.check.outputs.should_build == 'true'
        run: |
          set -euo pipefail
          docker run --rm anyplot-renderer:ci /app/.venv/bin/python -c "
          import importlib.util, sys
          try:
              spec = importlib.util.find_spec('google.adk')
          except ModuleNotFoundError:
              spec = None
          sys.exit('ADK is installed in the renderer image' if spec else 0)
          "
          echo "OK: no ADK"
          want=$(python3 -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")

          # The service boots (development: no caller check, no launcher on a
          # runner) and reports itself; a render is refused, not attempted.
          docker run -d --name renderer -p 8003:8080 -e ENVIRONMENT=development anyplot-renderer:ci
          ready=0
          for _ in $(seq 30); do
            if curl -fsS localhost:8003/status -o status.json 2>/dev/null; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            echo "::error::the renderer never answered /status within 30 s"
            exit 1
          fi
          python3 -c "
          import json, sys
          s = json.load(open('status.json'))
          assert s['name'] == 'anyplot-renderer' and s['sandbox'] is False, s
          assert s['version'] == sys.argv[1], (s['version'], sys.argv[1])
          print('OK: /status', s['version'])
          " "$want"
          code=$(curl -s -o render.json -w '%{http_code}' -H 'Content-Type: application/json' \
            --data '{"job_id": "ci", "language": "python", "library": "matplotlib", "source": "x = 1", "data_csv": "", "themes": ["light"], "timeout_s": 10}' \
            localhost:8003/render)
          test "$code" = "503" && grep -q '"sandbox_unavailable"' render.json \
            || { echo "::error::expected 503 sandbox_unavailable, got $code: $(cat render.json)"; exit 1; }
          echo "OK: a render without a launcher is refused"

      - name: Container logs on failure
        if: failure() && steps.check.outputs.should_build == 'true'
        run: docker logs renderer 2>&1 || true

      # Same threshold as the two Dockerfiles above; checked locally against
      # hadolint 2.15.1 with no finding.
      - name: Hadolint (agents/renderer/Dockerfile)
        if: steps.check.outputs.should_build == 'true'
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387  # v3.5.0
        with:
          dockerfile: agents/renderer/Dockerfile
          failure-threshold: warning

      - name: Hadolint (agents/renderer/toolchain.Dockerfile)
        if: steps.check.outputs.should_build == 'true'
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387  # v3.5.0
        with:
          dockerfile: agents/renderer/toolchain.Dockerfile
          failure-threshold: warning

      - name: Skip notice
        if: steps.check.outputs.should_build == 'false'
        run: echo "::notice::Renderer image build skipped - no changes to agents/renderer/, the harness or the dependency lock"

  # The agents image (agents/Dockerfile) is the anyplot-agents service, the
  # private /v1 API in front of the ADK runner. Without this job its first build
  # ever would be the bootstrap deploy, after the merge. The service needs no
  # credentials to boot or to answer GET /v1/status, so the job checks what the
  # deploy smoke (agents/cloudbuild.yaml) checks, minus Cloud Run IAM: the service
  # reports the configuration its environment names (the deploy switches the model
  # and the libraries through the environment alone), it refuses an anonymous
  # caller outside development, it serves as uid 1000, and the files it reads off
  # disk are in the image. The event-shape handling is the API job's in short form.
  agents-image:
    name: Build agents image and smoke the service
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # A cold build installs the full base dependency set plus ADK and the Claude
    # backend; 25 fails loudly instead of hanging on a slow package index.
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Check for agents-image changes
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MG_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          MG_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
          FORCE_RUN: ${{ inputs.force_run }}
        run: |
          set -uo pipefail
          CHANGED_FILES=""
          case "$EVENT_NAME" in
            pull_request)
              if ! CHANGED_FILES=$(git diff --name-only "$PR_BASE_SHA" "$PR_HEAD_SHA"); then
                echo "::error::could not diff $PR_BASE_SHA..$PR_HEAD_SHA — refusing to decide whether the agents image needs building"
                exit 1
              fi ;;
            merge_group)
              if ! CHANGED_FILES=$(git diff --name-only "$MG_BASE_SHA" "$MG_HEAD_SHA"); then
                echo "::error::could not diff $MG_BASE_SHA..$MG_HEAD_SHA — refusing to decide whether the agents image needs building"
                exit 1
              fi ;;
            push)
              if [[ "$PUSH_BEFORE" =~ ^0+$ ]] || ! CHANGED_FILES=$(git diff --name-only "$PUSH_BEFORE" "$PUSH_AFTER"); then
                echo "::warning::the pushed range is not diffable — building the agents image rather than skipping the gate"
                echo "should_build=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi ;;
            *)
              if ! CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD); then
                echo "::warning::no parent commit to diff against — building the agents image rather than skipping the gate"
                echo "should_build=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi ;;
          esac

          echo "Changed files:"
          echo "$CHANGED_FILES"

          # What the image is built from, the same paths the deploy-agents trigger
          # watches (agents/cloudbuild.yaml): the service package without the eval
          # harness (the root .dockerignore keeps agents/evals out of the image),
          # core/, the catalogue prompt files the adapter and the reviewer read,
          # the dependency lock, README.md (copied next to pyproject.toml) and the
          # root .dockerignore (the build context).
          AGENTS_CHANGES=$(echo "$CHANGED_FILES" | grep -v '^agents/evals/' | grep -E '^(agents/|core/|prompts/(default-style-guide|quality-criteria)\.md$|prompts/library/|prompts/workflow-prompts/(impl-repair-claude|ai-quality-review)\.md$|pyproject\.toml$|uv\.lock$|README\.md$|\.dockerignore$|\.github/workflows/ci-image\.yml$)' || true)

          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$FORCE_RUN" == "true" ]]; then
            echo "Manual trigger with force_run=true, will build the agents image"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          elif [[ -n "$AGENTS_CHANGES" ]]; then
            echo "Found agents-image changes, will build the agents image"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "No agents-image changes, skipping the build"
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Buildx
        if: steps.check.outputs.should_build == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      # Its own cache scope: its dependency layer differs from the API's (ADK) and
      # the renderer's (no ADK, the plotting extras).
      - name: Build the agents image
        if: steps.check.outputs.should_build == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: agents/Dockerfile
          push: false
          load: true
          tags: anyplot-agents:ci
          cache-from: type=gha,scope=agents-image
          cache-to: type=gha,mode=max,scope=agents-image

      # THE assert this job exists for: the service boots from the image and
      # reports what its environment configured. The first container runs in
      # development (no caller check) with the fake renderer (no renderer URL, and
      # nothing renders here) and with the Gemini arm and one library, so the
      # report cannot pass on the settings defaults alone. The second runs with no
      # environment at all, as production: an anonymous /v1/status must be refused
      # by the service's own caller check.
      - name: Smoke the service
        if: steps.check.outputs.should_build == 'true'
        run: |
          set -euo pipefail
          want=$(python3 -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")

          ready() {  # ready <port>: wait up to 60 s for any HTTP answer on /v1/status
            for _ in $(seq 60); do
              if [ "$(curl -s -o /dev/null -w '%{http_code}' "localhost:$1/v1/status")" != "000" ]; then return 0; fi
              sleep 1
            done
            echo "::error::nothing answered on port $1 within 60 s"
            exit 1
          }

          docker run -d --name agents -p 8004:8080 \
            -e ENVIRONMENT=development -e AGENT_RENDERER=fake \
            -e AGENT_PROVIDER=gemini -e AGENT_MODEL=gemini-3.8-flash -e AGENT_JUDGE_MODEL=gemini-3.5-flash-lite \
            -e AGENT_LIBRARIES=seaborn \
            anyplot-agents:ci
          ready 8004
          curl -fsS localhost:8004/v1/status -o status.json
          python3 -c "
          import json, sys
          s = json.load(open('status.json'))
          want = {'provider': 'gemini', 'model': 'gemini-3.8-flash', 'location': 'eu', 'libraries': ['seaborn'],
                  'version': sys.argv[1], 'waiting': 0, 'in_flight': 0}
          got = {key: s.get(key) for key in want}
          assert got == want, (got, want)
          print('OK: /v1/status', got)
          " "$want"

          docker run -d --name agents-prod -p 8005:8080 anyplot-agents:ci
          ready 8005
          code=$(curl -s -o prod.json -w '%{http_code}' localhost:8005/v1/status)
          test "$code" = "401" && grep -q '"unauthenticated"' prod.json \
            || { echo "::error::expected 401 unauthenticated without a token in production, got $code: $(cat prod.json)"; exit 1; }
          echo "OK: production refuses an anonymous caller"

      # Pins the runtime stage's COPY list: the files the service reads off disk
      # next to its modules (agents/anyplot/policy.py, render/watermark.py), and
      # the module the remote backend shares with the renderer. The Dockerfile's
      # build check already reads all of them today (the import plus the two judge
      # rubrics, which the service reads on first use); this keeps a future lazy
      # read from slipping out of the image unnoticed. tests/unit/agents/test_image.py
      # holds the same list against the Dockerfile and the root .dockerignore.
      - name: The image holds what the service reads, and not the eval cases
        if: steps.check.outputs.should_build == 'true'
        run: |
          set -euo pipefail
          for path in \
            agents/anyplot/render/fonts/JetBrainsMono-Regular.ttf \
            agents/anyplot/render/fonts/JetBrainsMono-Bold.ttf \
            agents/anyplot/prompts/root.md \
            agents/anyplot/prompts/adapter.md \
            agents/anyplot/prompts/adapter_python.md \
            agents/anyplot/prompts/adapter_r.md \
            agents/anyplot/prompts/reviewer.md \
            agents/anyplot/prompts/scope_judge.md \
            agents/anyplot/prompts/data_judge.md \
            agents/anyplot/prompts/refusals.yaml \
            agents/renderer/wire.py \
            prompts/default-style-guide.md \
            prompts/quality-criteria.md \
            prompts/library/matplotlib.md \
            prompts/library/seaborn.md \
            prompts/library/ggplot2.md \
            prompts/workflow-prompts/impl-repair-claude.md \
            prompts/workflow-prompts/ai-quality-review.md; do
            docker exec agents test -f "/app/$path" || { echo "::error::/app/$path is missing from the image"; exit 1; }
          done
          echo "COPY list OK"
          # The promoted feedback cases (agents/evals/.cases) hold users' data.
          if docker exec agents test -e /app/agents/evals; then
            echo "::error::agents/evals reached the image"; exit 1
          fi
          echo "OK: no agents/evals in the image"
          uid=$(docker exec agents id -u)
          if [ "$uid" != "1000" ]; then
            echo "::error::the container runs as uid $uid (expected 1000, the appuser the Dockerfile creates)"
            exit 1
          fi
          echo "non-root OK: uid $uid"

      # The R code profile in the built image (PR 3b of the R pilot, 2026-10-29): the builder
      # stage keeps only the grammars of TREE_SITTER_GRAMMARS (R and Julia), and the service
      # reads that code only through them; the loop loads every kept grammar. A catalogue
      # ggplot2 file, piped in from the checkout because the image
      # carries no plots/, is normalised and scanned by the R runtime as POST /v1/sessions does
      # (opening.assess), with ggplot2 enabled: scatter-basic is coupled in the corpus tests, so
      # anything but clean or coupled, a SECURITY finding or a missing palette fails the step.
      # The scan runs in the smoke's development container: no caller check, no model call.
      - name: The kept grammars load and an R readiness scan runs
        if: steps.check.outputs.should_build == 'true'
        run: |
          set -euo pipefail
          script=$(cat <<'PY'
          import sys
          from agents.anyplot.code.treesitter import GRAMMARS, language
          from agents.anyplot.render.runtimes import runtime_for

          for grammar in GRAMMARS:
              language(grammar)
          runtime = runtime_for("ggplot2")
          normalised = runtime.normalise(sys.stdin.read(), "ggplot2")
          readiness = runtime.readiness(normalised, spec_id="scatter-basic", enabled_libraries=["ggplot2"])
          assert readiness.status in ("clean", "coupled"), (readiness.status, readiness.reasons)
          assert runtime.security(normalised) == [], runtime.security(normalised)
          regions = runtime.regions(normalised)
          assert regions.imprint is not None and regions.save is not None, "no palette or no protected ggsave"
          print("OK: grammars", GRAMMARS, "load; scatter-basic (ggplot2) is", readiness.status, readiness.reasons)
          PY
          )
          docker exec -i agents .venv/bin/python -c "$script" < plots/scatter-basic/implementations/r/ggplot2.R

      # The Julia code profile in the built image (J2a of step 5, 2026-10-29): the same pruned
      # grammars, read by the profile's normaliser, validator and readiness scan on a catalogue
      # Makie file piped in from the checkout. Nothing serves Makie yet (J2b adds the runtime),
      # so the step calls the profile's modules directly; scatter-basic is coupled in the
      # corpus tests, so anything but clean or coupled, or a SECURITY finding, fails the step.
      - name: A Julia readiness scan runs
        if: steps.check.outputs.should_build == 'true'
        run: |
          set -euo pipefail
          script=$(cat <<'PY'
          import sys
          from agents.anyplot.code.profiles.julia import normalise, readiness, regions, validate

          normalised = normalise.normalise(sys.stdin.read())
          result = readiness.scan(normalised, spec_id="scatter-basic", enabled_libraries=["makie"])
          assert result.status in ("clean", "coupled"), (result.status, result.reasons)
          assert validate.validate_security(normalised) == [], validate.validate_security(normalised)
          found = regions.find_regions(normalised)
          assert found.theme is not None and found.save is not None, "no THEME statement or no protected save"
          print("OK: scatter-basic (makie) is", result.status, result.reasons)
          PY
          )
          docker exec -i agents .venv/bin/python -c "$script" < plots/scatter-basic/implementations/julia/makie.jl

      - name: Container logs on failure
        if: failure() && steps.check.outputs.should_build == 'true'
        run: |
          for c in agents agents-prod; do
            echo "=== $c ==="
            docker logs "$c" 2>&1 || true
          done

      # Same threshold as the Dockerfiles above.
      - name: Hadolint (agents/Dockerfile)
        if: steps.check.outputs.should_build == 'true'
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387  # v3.5.0
        with:
          dockerfile: agents/Dockerfile
          failure-threshold: warning

      - name: Skip notice
        if: steps.check.outputs.should_build == 'false'
        run: echo "::notice::Agents image build skipped - no changes to agents/ (outside agents/evals), core/, the catalogue prompts it reads or the dependency lock"
