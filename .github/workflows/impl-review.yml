name: "Impl: Review"
run-name: "Review: PR #${{ inputs.pr_number || github.event.client_payload.pr_number }}"

# AI quality review for implementation PRs
# Triggered by impl-generate.yml after PR creation

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to review'
        required: true
        type: string
      model:
        description: "Generation model threaded into repair; auto = the PR body's **Model:** line, else opus for a first run and sonnet for a regeneration. The review itself runs on review_model."
        required: false
        type: choice
        default: 'auto'
        options:
          - auto
          - haiku
          - sonnet
          - opus
      review_model:
        description: "Model for this review only (default opus). A pin covers this run and its own auto-retry."
        required: false
        type: choice
        default: 'opus'
        options:
          - opus
          - sonnet
          - haiku
  repository_dispatch:
    types: [review-pr]

concurrency:
  group: impl-review-${{ inputs.pr_number || github.event.client_payload.pr_number || github.ref }}
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Needed for pushing quality score to PR branch
      pull-requests: write
      issues: write
      id-token: write
      actions: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Extract PR info
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ inputs.pr_number || github.event.client_payload.pr_number }}
          MODEL_INPUT: ${{ inputs.model }}
          MODEL_PAYLOAD: ${{ github.event.client_payload.model }}
          REVIEW_MODEL_INPUT: ${{ inputs.review_model }}
          REVIEW_MODEL_PAYLOAD: ${{ github.event.client_payload.review_model }}
        run: |
          # Retry gh pr view — transient API blips were the dominant impl-review
          # failure mode (5x in 24h on 2026-05-06). Three attempts with linear
          # backoff (5s, 10s); keep stderr separate from stdout so warnings
          # (rate-limit notices, etc.) don't corrupt the JSON jq parses below.
          PR_DATA=""
          for attempt in 1 2 3; do
            if gh pr view "$PR_NUMBER" --json headRefName,headRefOid,body > /tmp/pr.json 2> /tmp/pr.err; then
              PR_DATA=$(cat /tmp/pr.json)
              break
            fi
            PERR=$(head -c 500 /tmp/pr.err | tr '\n' ' ')
            echo "::warning::gh pr view failed (attempt ${attempt}/3): ${PERR}"
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 5))
            fi
          done
          if [ -z "$PR_DATA" ]; then
            echo "::error::gh pr view failed after 3 attempts for PR #${PR_NUMBER}"
            exit 1
          fi
          HEAD_REF=$(echo "$PR_DATA" | jq -r '.headRefName')
          HEAD_SHA=$(echo "$PR_DATA" | jq -r '.headRefOid')
          BODY=$(echo "$PR_DATA" | jq -r '.body')

          # Extract spec-id and library from branch: implementation/{spec-id}/{library}
          SPEC_ID=$(echo "$HEAD_REF" | cut -d'/' -f2)
          LIBRARY=$(echo "$HEAD_REF" | cut -d'/' -f3)

          # Extract issue number from PR body
          ISSUE_NUMBER=$(echo "$BODY" | grep -oP '\*\*Parent Issue:\*\* #\K\d+' | head -1 || echo "")

          # Resolve the generation model, which this run forwards to repair
          # (the review itself runs on REVIEW_MODEL_ALIAS below): explicit
          # input > repository_dispatch payload > the PR body's "**Model:**"
          # line > routing. impl-generate and impl-repair always send the
          # model they resolved, and impl-generate records it in the body.
          # "auto" (the dispatch default) or no model at all comes from
          # rescues (impl-review-retry, the watchdog, a manual rerun): they
          # take the body's model, so an explicit pin survives, and only a PR
          # without that line routes like impl-generate — opus while the pair
          # has no implementation on origin/main yet (its first run), sonnet
          # for a regeneration.
          MODEL_BODY=$(echo "$BODY" | tr -d '\r' | grep -oP '^\*\*Model:\*\* \K(haiku|sonnet|opus)$' | head -1 || true)
          MODEL="${MODEL_INPUT:-auto}"
          MODEL_FROM="input"
          if [ "$MODEL" = "auto" ]; then
            MODEL="${MODEL_PAYLOAD:-auto}"
            MODEL_FROM="payload"
          fi
          if [ "$MODEL" = "auto" ]; then
            MODEL="${MODEL_BODY:-auto}"
            MODEL_FROM="PR body"
          fi
          if [ "$MODEL" = "auto" ]; then
            MODEL_FROM="routing"
            if git rev-parse -q --verify origin/main >/dev/null \
               || git fetch -q origin +refs/heads/main:refs/remotes/origin/main; then
              # LANGUAGE/EXT are only derived in the next step, so match the
              # library's file in any language directory. SPEC_ID and LIBRARY
              # come from the implementation/{spec-id}/{library} branch name,
              # whose contract ([a-z0-9-] ids, alphanumeric library names)
              # keeps them free of regex metacharacters.
              ON_MAIN=$(git ls-tree -r --name-only origin/main -- "plots/${SPEC_ID}/implementations/" 2>/dev/null || true)
              if grep -qE "^plots/${SPEC_ID}/implementations/[a-z]+/${LIBRARY}\.[A-Za-z]+$" <<< "$ON_MAIN"; then
                MODEL="sonnet"
              else
                MODEL="opus"
              fi
            else
              echo "::warning::origin/main unavailable — routing assumes a first run (opus)"
              MODEL="opus"
            fi
          fi

          # Review model alias: every quality review runs on opus, whatever model
          # generated the implementation. Only a manual dispatch (review_model)
          # or this workflow's own auto-retry (payload) carries another. Not the
          # resolved id: that is steps.review_model.outputs.model_id (REVIEW_MODEL
          # in the metadata step).
          REVIEW_MODEL_ALIAS="${REVIEW_MODEL_INPUT:-${REVIEW_MODEL_PAYLOAD:-opus}}"
          case "$REVIEW_MODEL_ALIAS" in
            haiku|sonnet|opus) ;;
            *) echo "::warning::unknown review model '${REVIEW_MODEL_ALIAS}' — using opus"; REVIEW_MODEL_ALIAS="opus" ;;
          esac

          echo "pr_number=$PR_NUMBER" >> $GITHUB_OUTPUT
          echo "specification_id=$SPEC_ID" >> $GITHUB_OUTPUT
          echo "library=$LIBRARY" >> $GITHUB_OUTPUT
          echo "branch=$HEAD_REF" >> $GITHUB_OUTPUT
          echo "head_sha=$HEAD_SHA" >> $GITHUB_OUTPUT
          echo "issue_number=$ISSUE_NUMBER" >> $GITHUB_OUTPUT
          echo "model=$MODEL" >> $GITHUB_OUTPUT
          echo "review_model_alias=$REVIEW_MODEL_ALIAS" >> "$GITHUB_OUTPUT"

          {
            echo "**Review model:** ${REVIEW_MODEL_ALIAS}"
            echo ""
            echo "**Generation model:** ${MODEL} (${MODEL_FROM}; forwarded to repair)"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "::notice::Reviewing PR #$PR_NUMBER for $LIBRARY implementation of $SPEC_ID (branch: $HEAD_REF, review model: $REVIEW_MODEL_ALIAS, generation model: $MODEL from $MODEL_FROM)"

      # `ai-review-failed` means "no review is on its way"; a review that
      # starts makes it stale. Without this, a dispatch that GitHub accepted
      # but `gh` reported as failed left the label beside the very re-review
      # it was meant to ask for, and watchdog Case 1 dispatched a second one
      # on its next scan. The concurrency group queues that re-review behind
      # the run that gave up, so it always starts after the label landed.
      # Best effort: a label that survives is still caught by Case 1's own
      # check for a review in flight. Removed only when present — a
      # `--remove-label` for a label the repo never created is an error.
      - name: Clear a stale ai-review-failed label
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUM: ${{ steps.pr.outputs.pr_number }}
        run: |
          LABELS=""
          READ_OK=0
          for attempt in 1 2 3; do
            if LABELS=$(gh pr view "$PR_NUM" --json labels -q '.labels[].name' 2> /tmp/clear-label.err); then
              READ_OK=1
              break
            fi
            echo "::warning::gh pr view (labels) failed (attempt ${attempt}/3): $(head -c 500 /tmp/clear-label.err | tr '\n' ' ')"
            [ "$attempt" -lt 3 ] && sleep $((attempt * 5))
          done
          if [ "$READ_OK" -ne 1 ]; then
            echo "::warning::Could not read labels for PR #${PR_NUM} — a stale ai-review-failed, if any, stays"
            exit 0
          fi
          if ! grep -qxF "ai-review-failed" <<< "$LABELS"; then
            exit 0
          fi
          for attempt in 1 2 3; do
            if gh pr edit "$PR_NUM" --remove-label "ai-review-failed" 2> /tmp/clear-label.err; then
              echo "::notice::Removed stale ai-review-failed from PR #${PR_NUM}: this run is the review it asked for"
              exit 0
            fi
            echo "::warning::removing ai-review-failed failed (attempt ${attempt}/3): $(head -c 500 /tmp/clear-label.err | tr '\n' ' ')"
            [ "$attempt" -lt 3 ] && sleep $((attempt * 5))
          done
          echo "::warning::ai-review-failed could not be removed from PR #${PR_NUM} — the watchdog skips it while this review runs"
          exit 0

      - name: Derive language + extension from library
        id: lang
        env:
          LIBRARY: ${{ steps.pr.outputs.library }}
        run: |
          case "$LIBRARY" in
            ggplot2)
              LANGUAGE="r"
              EXT=".R"
              ;;
            makie)
              LANGUAGE="julia"
              EXT=".jl"
              ;;
            chartjs|d3|echarts|highcharts)
              LANGUAGE="javascript"
              EXT=".js"
              ;;
            muix)
              # MUI X — JavaScript with framework=react, authored as TSX and
              # bundled through the render harness's esbuild React branch.
              LANGUAGE="javascript"
              EXT=".tsx"
              ;;
            *)
              LANGUAGE="python"
              EXT=".py"
              ;;
          esac
          echo "language=$LANGUAGE" >> $GITHUB_OUTPUT
          echo "ext=$EXT"           >> $GITHUB_OUTPUT

      - name: Checkout PR code
        run: |
          # Keep the regen helpers from THIS workflow's ref before switching to
          # the PR head: the gate's parser must match the workflow that calls
          # it, and a PR branched off an older main does not carry them.
          mkdir -p "$RUNNER_TEMP/regen-tools"
          cp automation/scripts/regen_gate.py automation/scripts/close_issue_if_complete.py \
             automation/scripts/review_provenance.py automation/scripts/regen_writeback.py \
             "$RUNNER_TEMP/regen-tools/"
          # The reviewer's step-10 self-check (`check-feedback`) runs this
          # same workflow-ref copy of the gate.
          cp automation/scripts/regen_gate.py /tmp/anyplot-regen-gate.py
          git fetch origin ${{ steps.pr.outputs.head_sha }}
          git checkout ${{ steps.pr.outputs.head_sha }}

      # Pre-merge test hook (impl-generate.yml dispatches the review on its own
      # ref when run from a feature branch): review with that branch's
      # prompts/. Unstaged right away so the metadata commit below can never
      # pick the overlay up. No-op on main and on repository_dispatch.
      - name: Overlay prompts/ from trigger ref (branch-level prompt iteration)
        if: github.ref_name != 'main' && github.event_name == 'workflow_dispatch'
        env:
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          git checkout "$WORKFLOW_SHA" -- prompts/
          git reset -q -- prompts/
          echo "::notice::Overlaid prompts/ from ${WORKFLOW_SHA} (unstaged)"

      # Regen = the pair already has an implementation on main. Decided here
      # from origin/main, never from the PR's `regen` label (a lost label must
      # not route a regeneration into the repair loop and its cascading
      # thresholds instead of the gate). Only `regen:forced` (dispatch input
      # regen_gate=false) opts out; if the labels cannot be read the PR is
      # gated — the fail-safe direction.
      - name: Detect regeneration
        id: regen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
          SPEC_ID: ${{ steps.pr.outputs.specification_id }}
          LIBRARY: ${{ steps.pr.outputs.library }}
          LANGUAGE: ${{ steps.lang.outputs.language }}
          EXT: ${{ steps.lang.outputs.ext }}
        run: |
          # A stale file must never stand in for this run's judgement.
          rm -f review_regen.json review_prev.json

          git fetch origin main
          if ! git cat-file -e "origin/main:plots/$SPEC_ID/implementations/$LANGUAGE/$LIBRARY$EXT" 2>/dev/null; then
            echo "is_regen=false" >> $GITHUB_OUTPUT
            echo "::notice::No implementation on main — fresh generation path"
            exit 0
          fi

          LABELS=""
          READ_OK=0
          for attempt in 1 2 3; do
            if LABELS=$(gh pr view "$PR_NUMBER" --json labels -q '.labels[].name' 2> /tmp/regen-labels.err); then
              READ_OK=1
              break
            fi
            echo "::warning::gh pr view (labels) failed (attempt ${attempt}/3): $(head -c 300 /tmp/regen-labels.err | tr '\n' ' ')"
            [ "$attempt" -lt 3 ] && sleep $((attempt * 5))
          done

          if [ "$READ_OK" = "1" ] && echo "$LABELS" | grep -qx "regen:forced"; then
            echo "is_regen=false" >> $GITHUB_OUTPUT
            echo "::notice::Forced regeneration (regen:forced) — fresh generation path with repair loop"
            exit 0
          fi
          [ "$READ_OK" = "1" ] || echo "::warning::labels unreadable — gating the regeneration (fail-safe)"
          echo "is_regen=true" >> $GITHUB_OUTPUT
          echo "::notice::Regeneration: implementation is live on main — one review, regen gate decides keep vs replace"

      - name: Regen context
        id: regen_ctx
        if: steps.regen.outputs.is_regen == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
          SPEC_ID: ${{ steps.pr.outputs.specification_id }}
          LIBRARY: ${{ steps.pr.outputs.library }}
          LANGUAGE: ${{ steps.lang.outputs.language }}
          EXT: ${{ steps.lang.outputs.ext }}
        run: |
          IMPL_FILE="plots/${SPEC_ID}/implementations/${LANGUAGE}/${LIBRARY}${EXT}"
          META_FILE="plots/${SPEC_ID}/metadata/${LANGUAGE}/${LIBRARY}.yaml"

          # The exact files this review re-scores: on a keep, the write-back
          # stores the re-score only while main still holds these two blobs.
          # First, so a later failure in this step cannot leave them unset.
          echo "prev_meta_blob=$(git rev-parse -q --verify "origin/main:${META_FILE}" || echo n/a)" >> "$GITHUB_OUTPUT"
          echo "prev_impl_blob=$(git rev-parse -q --verify "origin/main:${IMPL_FILE}" || echo n/a)" >> "$GITHUB_OUTPUT"

          pip install --quiet pyyaml

          # Previous review from main's metadata (the PR branch's copy was
          # reset to quality_score: null by impl-generate). Missing metadata
          # yields no weakness ids and prev_stored=n/a.
          if ! git show "origin/main:${META_FILE}" > /tmp/anyplot-prev-metadata.yaml 2>/dev/null; then
            echo "::warning::${META_FILE} not on main — previous review unavailable"
            echo "{}" > /tmp/anyplot-prev-metadata.yaml
          fi
          python3 "$RUNNER_TEMP/regen-tools/regen_gate.py" context \
            --metadata /tmp/anyplot-prev-metadata.yaml \
            --spec-id "$SPEC_ID" --language "$LANGUAGE" --library "$LIBRARY" \
            --spec-file "plots/${SPEC_ID}/specification.md" \
            --omit-scores \
            --out-md /tmp/anyplot-prev-review.md \
            --out-weaknesses /tmp/anyplot-prev-weaknesses.json

          # Previous source for the before/after code read, plus both line
          # counts (the regen gate's code path reads both sources).
          # The generated header carries the stored score (`Quality: N/100`);
          # the reviewer's copy has it hidden so the re-score cannot anchor.
          # Sanitizing is part of this step: if it fails, the step fails and
          # the gate keeps (--context-failed) rather than leak the score.
          git show "origin/main:${IMPL_FILE}" > /tmp/anyplot-prev-impl-raw
          python3 "$RUNNER_TEMP/regen-tools/regen_gate.py" sanitize-source \
            --source /tmp/anyplot-prev-impl-raw --out "/tmp/anyplot-prev-impl${EXT}"
          rm -f /tmp/anyplot-prev-impl-raw
          echo "prev_lines=$(wc -l < "/tmp/anyplot-prev-impl${EXT}" | tr -d ' ')" >> $GITHUB_OUTPUT
          echo "new_lines=$(wc -l < "$IMPL_FILE" | tr -d ' ')" >> $GITHUB_OUTPUT

          # Change request, as impl-generate.yml recorded it in the PR body.
          rm -f /tmp/anyplot-change-request.txt
          CR=$(gh pr view "$PR_NUMBER" --json body -q '.body' | grep -oP '^\*\*Change request:\*\* \K.*' | head -1 || true)
          if [ -n "$CR" ]; then
            printf '%s\n' "$CR" > /tmp/anyplot-change-request.txt
            echo "change_request_present=true" >> $GITHUB_OUTPUT
          else
            echo "change_request_present=false" >> $GITHUB_OUTPUT
          fi

      - name: Check attempt count
        id: attempts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
        run: |
          LABELS=$(gh pr view "$PR_NUMBER" --json labels -q '.labels[].name' 2>/dev/null || echo "")

          if echo "$LABELS" | grep -q "ai-attempt-4"; then
            echo "count=4" >> $GITHUB_OUTPUT
            echo "display=5" >> $GITHUB_OUTPUT
          elif echo "$LABELS" | grep -q "ai-attempt-3"; then
            echo "count=3" >> $GITHUB_OUTPUT
            echo "display=4" >> $GITHUB_OUTPUT
          elif echo "$LABELS" | grep -q "ai-attempt-2"; then
            echo "count=2" >> $GITHUB_OUTPUT
            echo "display=3" >> $GITHUB_OUTPUT
          elif echo "$LABELS" | grep -q "ai-attempt-1"; then
            echo "count=1" >> $GITHUB_OUTPUT
            echo "display=2" >> $GITHUB_OUTPUT
          else
            echo "count=0" >> $GITHUB_OUTPUT
            echo "display=1" >> $GITHUB_OUTPUT
          fi

      - name: Authenticate to GCP
        id: gcs
        continue-on-error: true
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093  # v3
        with:
          project_id: anyplot
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}

      - name: Setup gcloud CLI
        if: steps.gcs.outcome == 'success'
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db  # v3

      - name: Download plot images from staging
        id: staging
        if: steps.gcs.outcome == 'success'
        env:
          SPEC_ID: ${{ steps.pr.outputs.specification_id }}
          LIBRARY: ${{ steps.pr.outputs.library }}
          LANGUAGE: ${{ steps.lang.outputs.language }}
        run: |
          mkdir -p plot_images
          # Retried: a single lost transfer used to be swallowed here (`2>/dev/null
          # || true`), and the next step then failed on an empty directory with
          # no label set — no watchdog case matches that, so the PR sat until
          # someone re-dispatched the review by hand (#11360 on 2026-09-05,
          # #11678 on 2026-09-09; staging was complete both times). Keep stderr:
          # a transfer blip and a missing staging folder need different answers.
          SRC="gs://anyplot-images/staging/${SPEC_ID}/${LANGUAGE}/${LIBRARY}/*"
          for attempt in 1 2 3; do
            if gsutil -m cp "$SRC" plot_images/ 2> /tmp/gsutil.err \
               && [ -f plot_images/plot-light.png ] && [ -f plot_images/plot-dark.png ]; then
              break
            fi
            GERR=$(head -c 300 /tmp/gsutil.err | tr '\n' ' ')
            echo "::warning::staging download incomplete (attempt ${attempt}/3): ${GERR:-no error output}"
            [ "$attempt" -lt 3 ] && sleep $((attempt * 10))
          done
          ls -la plot_images/

          # Provenance: when the render under review was made (the staging
          # object's creation time, RFC 3339). Best effort and never fatal —
          # an empty value only leaves review.rendered_at out of the metadata.
          CREATED=$(gsutil stat "gs://anyplot-images/staging/${SPEC_ID}/${LANGUAGE}/${LIBRARY}/plot-light.png" 2>/dev/null \
            | sed -n 's/^[[:space:]]*Creation time:[[:space:]]*//p' | head -1) || CREATED=""
          RENDERED_AT=""
          if [ -n "$CREATED" ]; then
            RENDERED_AT=$(date -u -d "$CREATED" +%Y-%m-%dT%H:%M:%SZ 2>/dev/null) || RENDERED_AT=""
          fi
          echo "rendered_at=${RENDERED_AT}" >> "$GITHUB_OUTPUT"

      # Regen only: the predecessor's production renders, which the review
      # re-scores against the same criteria (prompt step 8b) AFTER scoring the
      # new render blind. Kept out of the working directory so a directory
      # listing during the blind pass does not surface them, and as
      # top-level /tmp files because `.claude/settings.json` allows the Read
      # tool on `/tmp/*` only (a $RUNNER_TEMP path would be a denied read in
      # the non-interactive action). Anything short of both files →
      # prev_renders=missing, and the gate keeps the live implementation.
      - name: Download previous production renders (regen)
        id: prev_renders
        if: steps.regen.outputs.is_regen == 'true'
        env:
          SPEC_ID: ${{ steps.pr.outputs.specification_id }}
          LIBRARY: ${{ steps.pr.outputs.library }}
          LANGUAGE: ${{ steps.lang.outputs.language }}
          GCS_OK: ${{ steps.gcs.outcome == 'success' }}
        run: |
          LIGHT=/tmp/anyplot-prev-plot-light.png
          DARK=/tmp/anyplot-prev-plot-dark.png
          rm -f "$LIGHT" "$DARK"
          if [ "$GCS_OK" != "true" ]; then
            echo "::warning::GCP auth failed — previous renders unavailable"
            echo "prev_renders=missing" >> $GITHUB_OUTPUT
            exit 0
          fi
          SRC="gs://anyplot-images/plots/${SPEC_ID}/${LANGUAGE}/${LIBRARY}"
          for attempt in 1 2 3; do
            if gsutil cp "${SRC}/plot-light.png" "$LIGHT" 2> /tmp/gsutil-prev.err \
               && gsutil cp "${SRC}/plot-dark.png" "$DARK" 2>> /tmp/gsutil-prev.err \
               && [ -s "$LIGHT" ] && [ -s "$DARK" ]; then
              break
            fi
            echo "::warning::previous render download incomplete (attempt ${attempt}/3): $(head -c 300 /tmp/gsutil-prev.err | tr '\n' ' ')"
            [ "$attempt" -lt 3 ] && sleep $((attempt * 10))
          done
          if [ -s "$LIGHT" ] && [ -s "$DARK" ]; then
            echo "prev_renders=available" >> $GITHUB_OUTPUT
            echo "light=$LIGHT" >> $GITHUB_OUTPUT
            echo "dark=$DARK" >> $GITHUB_OUTPUT
          else
            echo "prev_renders=missing" >> $GITHUB_OUTPUT
          fi
          ls -la "$LIGHT" "$DARK" 2>/dev/null || true

      - name: Verify both theme renders exist
        run: |
          missing=""
          [ -f "plot_images/plot-light.png" ] || missing="${missing} plot-light.png"
          [ -f "plot_images/plot-dark.png" ]  || missing="${missing} plot-dark.png"
          if [ -n "$missing" ]; then
            echo "::error::Missing theme render(s) in staging:${missing}"
            echo "::error::The impl-generate workflow must produce both plot-light.png and plot-dark.png"
            ls -la plot_images/ || true
            exit 1
          fi
          echo "::notice::Found both theme renders — proceeding to review"

      # Canvas dimension gate — runs before the AI review.
      # The saved PNG must be exactly 3200×1800 (landscape) or 2400×2400 (square)
      # within ±16 px (≤0.5 %). On drift, write /tmp/anyplot-canvas-gate.txt with
      # a synthetic weakness (named actual+target+signed delta + likely cause).
      # ai-quality-review.md reads that file and treats canvas_gate=fail as a
      # MUST-flag weakness that forces VQ-05 to 0, which drags the quality_score
      # below the repair threshold — re-routing a fresh generation into
      # impl-repair through the 5-review/4-repair cascade. On a regeneration
      # there is no repair: the regen gate reads the same file and keeps the
      # live implementation. Never raw `exit 1` here: impl-repair.yml is
      # dispatched by the verdict step only, so a hard step failure would leave
      # a dead PR with no retry path.
      - name: Canvas dimension gate
        env:
          LIBRARY: ${{ steps.pr.outputs.library }}
          ATTEMPT: ${{ steps.attempts.outputs.display }}
        run: |
          # Clean any stale file from a previous run on this runner.
          rm -f /tmp/anyplot-canvas-gate.txt

          pip install --quiet pillow

          python3 <<'PY'
          import os
          import sys
          from pathlib import Path

          from PIL import Image

          LIBRARY = os.environ["LIBRARY"]
          ATTEMPT = os.environ["ATTEMPT"]
          TOLERANCE = 16  # ≤0.5 % on the 3200-axis
          TARGETS = [(3200, 1800), (2400, 2400)]

          path = Path("plot_images/plot-light.png")
          with Image.open(path) as img:
              w, h = img.size

          # Pick the closer target so the repair feedback names the right one.
          tw, th = min(TARGETS, key=lambda t: abs(w - t[0]) + abs(h - t[1]))
          dw, dh = w - tw, h - th
          ok = abs(dw) <= TOLERANCE and abs(dh) <= TOLERANCE

          status = "pass" if ok else "fail"
          print(
              f"::notice::canvas_gate library={LIBRARY} status={status} "
              f"actual={w}x{h} target={tw}x{th} delta={dw:+d}x{dh:+d} attempt={ATTEMPT}"
          )

          if ok:
              sys.exit(0)

          # Build the synthetic weakness — include actual, target, signed delta,
          # direction, possible aspect mismatch, and library-specific likely cause.
          # This is what impl-repair sees in metadata.review.weaknesses.
          direction_parts = []
          if dw < 0:
              direction_parts.append(f"width is {-dw} px short")
          elif dw > 0:
              direction_parts.append(f"width is {dw} px over")
          if dh < 0:
              direction_parts.append(f"height is {-dh} px short")
          elif dh > 0:
              direction_parts.append(f"height is {dh} px over")
          direction = "; ".join(direction_parts) or "axes on target individually but combined off"

          aspect_note = ""
          # Aspect-mismatch hint: actual is landscape-ish but closest target is square (or vice versa)
          actual_aspect = w / h if h else 1
          if (tw, th) == (2400, 2400) and actual_aspect > 1.2:
              aspect_note = " — the implementation rendered a landscape canvas but the closest target is square; reconsider orientation."
          elif (tw, th) == (3200, 1800) and actual_aspect < 0.85:
              aspect_note = " — the implementation rendered a portrait/square canvas but the closest target is landscape; reconsider orientation."

          # Library-specific likely cause (concrete repair hints, not generic).
          causes = {
              "matplotlib": "Most likely cause: `bbox_inches='tight'` on `savefig` — remove it (default `bbox_inches=None`).",
              "seaborn":    "Most likely cause: `bbox_inches='tight'` on `savefig` — remove it (default `bbox_inches=None`).",
              "altair":     "Most likely cause: vl-convert padding title/legend outside `width`/`height`. Add `configure_view(continuousWidth=…, continuousHeight=…)` + zero `padding` and normalize the saved PNG with the PIL crop/pad snippet in `prompts/library/altair.md`.",
              "plotly":     "Most likely cause: `autosize=True` or implicit margin growth. Set `autosize=False` and pin `margin=dict(...)` explicitly.",
              "bokeh":      "Most likely cause: bokeh toolbar adding ~30-50 px above the figure. Set `toolbar_location=None`.",
              "highcharts": "The harness owns exact pixels (Playwright deviceScaleFactor 2 over a fixed mount). Call `Highcharts.chart('container', {...})` and let it auto-size to `#container` — do NOT set `chart.width`/`chart.height`. Use `//# anyplot-orientation: square` only for square specs.",
              "pygal":      "Check that `pygal.<Chart>(width=…, height=…)` and the SVG→PNG conversion don't override dims.",
              "plotnine":   "Check `ggsave(width=…, height=…, units='in', dpi=400)` and `theme(figure_size=…)`; do not pass `bbox_inches='tight'`.",
              "letsplot":   "Check `ggsize(W, H)` and `ggsave(..., scale=4)` pair — only the two canonical pairs land on target.",
              "ggplot2":    "Check `ggsave(width=…, height=…, units='in', dpi=400)` with `ragg::agg_png`.",
              "makie":      "Check `Figure(resolution=(1600, 900))` + `save(..., px_per_unit=2)` (landscape) or `resolution=(1200, 1200)` + `px_per_unit=2` (square) — those are the only two canonical pairs.",
              "chartjs":    "The harness owns exact pixels (Playwright deviceScaleFactor 2 over a fixed mount). Drift means the snippet forced its own canvas size: set `responsive: true` + `maintainAspectRatio: false` and let the canvas fill `#container` — do NOT set canvas width/height. Use `//# anyplot-orientation: square` only for square specs.",
              "d3":         "The harness owns exact pixels (Playwright deviceScaleFactor 2 over a fixed mount). Size the `<svg>` to `window.ANYPLOT_SIZE` (1600×900 landscape / 1200×1200 square) — never hard-code other dimensions. Use `//# anyplot-orientation: square` only for square specs.",
              "echarts":    "The harness owns exact pixels (Playwright deviceScaleFactor 2 over a fixed mount). Call `echarts.init(document.getElementById('container'))` with no explicit width/height so it fills the mount; do not pass a `devicePixelRatio` (the page already runs at 2×). Use `//# anyplot-orientation: square` only for square specs.",
              "muix":       "The harness owns exact pixels (Playwright deviceScaleFactor 2 over a fixed mount via a MUI ThemeProvider). Size the chart with `width={window.ANYPLOT_SIZE.width}` / `height={window.ANYPLOT_SIZE.height}` (1600×900 landscape / 1200×1200 square) — never hard-code other dimensions. Use `//# anyplot-orientation: square` only for square specs.",
          }
          cause = causes.get(LIBRARY, f"Review `prompts/library/{LIBRARY}.md` 'Canvas — hard rule' section.")

          # A defect line (regen_gate.DEFECT_RE): the review copies it verbatim.
          weakness = (
              f"VQ-05 (both): Canvas dimensions drifted from required target. "
              f"Actual: {w}×{h}. Closest valid target: {tw}×{th} (±{TOLERANCE} px tolerance). "
              f"Signed delta: {dw:+d} × {dh:+d} — {direction}.{aspect_note} "
              f"{cause} "
              f"Re-render at exactly {tw}×{th}; the post-render gate enforces this."
          )

          Path("/tmp/anyplot-canvas-gate.txt").write_text(weakness, encoding="utf-8")
          print(f"::warning::Canvas gate FAILED — wrote synthetic weakness to /tmp/anyplot-canvas-gate.txt: {weakness}")
          PY

      - name: React with eyes emoji
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh api "repos/$REPOSITORY/issues/$PR_NUMBER/reactions" -f content=eyes

      # Marks the boundary between "review comments that already existed" and
      # "the comment this run produced", so the score fallback below can never
      # pick up a previous attempt's score. One second of slack absorbs clock
      # skew between the runner and GitHub's comment timestamps.
      - name: Record review start time
        id: t0
        run: echo "at=$(date -u -d '1 second ago' +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_OUTPUT

      # Provenance: which rules this review reads — git blob ids of the rubric
      # files and the library prompt, plus the prompts/ tree id — computed
      # after the overlay above, so it hashes exactly what the reviewer opens.
      # Never gating: without it, review.criteria_version is left out.
      - name: Record rules version
        id: rules
        continue-on-error: true
        env:
          LIBRARY: ${{ steps.pr.outputs.library }}
        run: |
          python3 "$RUNNER_TEMP/regen-tools/review_provenance.py" criteria-version --root . --library "$LIBRARY"

      - name: Run AI Quality Review
        id: review
        continue-on-error: true
        timeout-minutes: 30
        uses: anthropics/claude-code-action@4036a180cf690f49529f5d8c79c998855287f590  # v1
        env:
          LIBRARY: ${{ steps.pr.outputs.library }}
          SPEC_ID: ${{ steps.pr.outputs.specification_id }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
          ATTEMPT: ${{ steps.attempts.outputs.display }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: "--model ${{ steps.pr.outputs.review_model_alias }} --settings ${{ github.workspace }}/.claude/settings.json"
          allowed_bots: '*'
          prompt: |
            Read `prompts/workflow-prompts/ai-quality-review.md` and follow those instructions.

            Variables for this run:
            - LIBRARY: ${{ steps.pr.outputs.library }}
            - SPEC_ID: ${{ steps.pr.outputs.specification_id }}
            - PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
            - ATTEMPT: ${{ steps.attempts.outputs.display }}
            - LANGUAGE: ${{ steps.lang.outputs.language }}
            - EXT: ${{ steps.lang.outputs.ext }}
            - IS_REGENERATION: ${{ steps.regen.outputs.is_regen || 'false' }}
            - PREV_RENDERS: ${{ steps.prev_renders.outputs.prev_renders || 'missing' }}
            - PREV_RENDER_LIGHT: ${{ steps.prev_renders.outputs.light || 'n/a' }}
            - PREV_RENDER_DARK: ${{ steps.prev_renders.outputs.dark || 'n/a' }}
            - PREV_LINES: ${{ steps.regen_ctx.outputs.prev_lines || 'n/a' }}
            - NEW_LINES: ${{ steps.regen_ctx.outputs.new_lines || 'n/a' }}

      # Provenance: the model that actually ran the review. The alias
      # (`sonnet`, `opus`) moves between releases; the execution file's
      # system/init message names the resolved id (claude-sonnet-5, …).
      # When the file is absent or names no model, model_id stays empty:
      # the metadata then leaves review.model out and the gate record says
      # n/a — the alias is never recorded as if it were an id. Never gating.
      - name: Resolve review model
        id: review_model
        if: steps.review.conclusion == 'success'
        continue-on-error: true
        env:
          EXECUTION_FILE: ${{ steps.review.outputs.execution_file }}
        run: |
          python3 "$RUNNER_TEMP/regen-tools/review_provenance.py" model --execution-file "${EXECUTION_FILE:-}"

      - name: Extract quality score
        id: score
        if: steps.review.conclusion == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUM: ${{ steps.pr.outputs.pr_number }}
          REPOSITORY: ${{ github.repository }}
          REVIEW_STARTED_AT: ${{ steps.t0.outputs.at }}
        run: |
          # `0` is a LEGITIMATE score, not a sentinel: the Stage 1 auto-reject
          # gates in prompts/workflow-prompts/ai-quality-review.md mandate
          # exactly "Score = 0, verdict = REJECTED" for AR-08 (clipped element)
          # and AR-09 (mandatory title not visible). Conflating that with "the
          # action produced nothing" is what deadlocked PRs #10152/#10130/
          # #10009/#10003/#9968/#9776: a correctly-rejected plot was reported as
          # a crashed review, so the repair that would have fixed the title was
          # never dispatched. Whether output exists is therefore tracked
          # separately from what the score is.
          HAS_OUTPUT=false
          if [ -f "quality_score.txt" ]; then
            SCORE=$(cat quality_score.txt | tr -d '[:space:]')
            HAS_OUTPUT=true
          else
            # Fall back to the review comment, under two constraints:
            #
            #  1. Select the last *claude[bot]* comment, not the last comment
            #     overall — on a retry the github-actions[bot] "auto-retrying"
            #     notice lands after the review, and `.comments[-1]` would read
            #     that notice and find no score.
            #  2. Only accept a comment posted by THIS run. A PR that has
            #     already been reviewed carries older review comments with a
            #     stale score (PR #9948 still shows `Score: 89/100` from its
            #     first review), and reading one of those would attach a score
            #     the current implementation never earned. Comparing RFC 3339
            #     UTC timestamps lexicographically is exact here: GitHub and
            #     `date -u` emit the same fixed-width `...Z` format.
            SCORE=$(gh api --paginate "repos/${REPOSITORY}/issues/${PR_NUM}/comments?per_page=100" 2>/dev/null \
              | jq -s --arg since "$REVIEW_STARTED_AT" -r \
                  'add // []
                   | [.[] | select(.user.login == "claude[bot]")
                          | select(.created_at >= $since)]
                   | last | .body // ""' \
              | grep -oP '^###\s+Score:\s+\K\d+' | head -1 || true)
            if [ -n "$SCORE" ]; then
              HAS_OUTPUT=true
              echo "::notice::quality_score.txt missing; recovered score ${SCORE} from this run's review comment"
            else
              echo "::notice::quality_score.txt missing and no review comment from this run (since ${REVIEW_STARTED_AT})"
            fi
          fi

          # Only a non-numeric or out-of-range value is invalid. 0 passes.
          if [ "$HAS_OUTPUT" = "true" ] && { ! [[ "$SCORE" =~ ^[0-9]+$ ]] || [ "$SCORE" -gt 100 ]; }; then
            echo "::warning::Invalid quality score '$SCORE' — treating as missing review output"
            HAS_OUTPUT=false
          fi

          if [ "$HAS_OUTPUT" != "true" ]; then
            SCORE="0"
          fi

          echo "score=$SCORE" >> $GITHUB_OUTPUT
          echo "has_output=$HAS_OUTPUT" >> $GITHUB_OUTPUT
          echo "::notice::score=${SCORE} has_output=${HAS_OUTPUT}"

      - name: Validate review output
        if: steps.review.conclusion == 'success' && steps.score.outputs.has_output != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUM: ${{ steps.pr.outputs.pr_number }}
          SPEC_ID: ${{ steps.pr.outputs.specification_id }}
          LIBRARY: ${{ steps.pr.outputs.library }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          MODEL: ${{ steps.pr.outputs.model }}
          REVIEW_MODEL_ALIAS: ${{ steps.pr.outputs.review_model_alias }}
        run: |
          echo "::error::AI Review did not produce valid output files (score=0)"

          MARKER="<!-- review-retry:${SPEC_ID}:${LIBRARY} -->"
          # Paginate so the marker is found even on PRs with >30 comments.
          # `--paginate --jq` prints one count per page, so the pages are
          # summed. A read that fails three times counts as a spent budget
          # (fail closed): the brown-out that breaks the read must not buy a
          # second automatic re-review.
          RETRY_COUNT=""
          for attempt in 1 2 3; do
            if PAGES=$(gh api --paginate "repos/$REPOSITORY/issues/${PR_NUM}/comments?per_page=100" \
                 --jq "[.[] | select(.body != null and (.body | contains(\"$MARKER\")))] | length" 2> /tmp/retry-count.err) \
               && RETRY_COUNT=$(printf '%s\n' "$PAGES" | jq -s 'add // 0' 2>> /tmp/retry-count.err) \
               && [[ "$RETRY_COUNT" =~ ^[0-9]+$ ]]; then
              break
            fi
            RETRY_COUNT=""
            echo "::warning::retry-marker read failed (attempt ${attempt}/3): $(head -c 500 /tmp/retry-count.err | tr '\n' ' ')"
            [ "$attempt" -lt 3 ] && sleep $((attempt * 10))
          done
          EXHAUSTED="Auto-retry already tried once."
          if [ -z "$RETRY_COUNT" ]; then
            echo "::error::Could not read the retry marker for PR #${PR_NUM} after 3 attempts — not auto-retrying"
            EXHAUSTED="Whether the one auto-retry was already used could not be read, so none was started."
            RETRY_COUNT=1
          fi

          # Every write retried: an unreadable budget lands here in the middle
          # of a brown-out, and `ai-review-failed` is the hand-off to the
          # watchdog.
          gh_retry() {
            local what="$1"; shift
            local attempt
            for attempt in 1 2 3; do
              if "$@" 2> /tmp/retry-count.err; then
                return 0
              fi
              echo "::warning::${what} failed (attempt ${attempt}/3): $(head -c 500 /tmp/retry-count.err | tr '\n' ' ')"
              [ "$attempt" -lt 3 ] && sleep $((attempt * 10))
            done
            return 1
          }
          # Final fail: no (further) auto-retry, the watchdog takes over. Its
          # comment carries the marker, so the budget reads as spent afterwards
          # whichever path gave up.
          give_up() {
            gh_retry "ai-review-failed label" gh pr edit "$PR_NUM" --add-label "ai-review-failed" \
              || echo "::error::could not add ai-review-failed to PR #${PR_NUM} — left to the watchdog's scan of stalled PRs"
            gh_retry "PR comment" gh pr comment "$PR_NUM" --body "${MARKER}
          ## :x: AI Review Failed (auto-retry exhausted)

          The AI review action completed but did not produce valid output files. $1

          **What happened:**
          - The Claude Code Action ran
          - No \`quality_score.txt\` file was created

          **Manual rerun:**
          \`\`\`
          gh workflow run impl-review.yml -f pr_number=$PR_NUM
          \`\`\`

          ---
          :robot: *[impl-review](https://github.com/$REPOSITORY/actions/runs/$RUN_ID)*" \
              || echo "::error::failure comment not posted on PR #${PR_NUM}"
            exit 1
          }

          if [ "$RETRY_COUNT" -ge 1 ]; then
            # Already auto-retried once → final fail, require manual rerun.
            give_up "$EXHAUSTED"
          fi

          # First failure — post marker and auto-retry via repository_dispatch.
          # Same order and hand-off as the post-score rescue below: the marker
          # is the budget, so the dispatch only happens once it is durable, and
          # a marker or a dispatch that fails three times ends in
          # `ai-review-failed` instead of a PR without any label.
          if ! gh_retry "retry marker comment" gh pr comment "$PR_NUM" --body "${MARKER}
          ## :wrench: AI Review Produced No Score — Auto-Retrying

          The Claude Code Action ran but didn't write \`quality_score.txt\`. Auto-retrying review once...

          ---
          :robot: *[impl-review](https://github.com/$REPOSITORY/actions/runs/$RUN_ID)*"; then
            give_up "The retry marker could not be recorded, so no auto-retry was started."
          fi

          if ! gh_retry "impl-review dispatch" gh api "repos/$REPOSITORY/dispatches" \
               -f event_type=review-pr \
               -f "client_payload[pr_number]=$PR_NUM" \
               -f "client_payload[model]=$MODEL" \
               -f "client_payload[review_model]=$REVIEW_MODEL_ALIAS"; then
            give_up "The auto-retry could not be dispatched."
          fi
          echo "::notice::Auto-re-triggered impl-review.yml for PR #$PR_NUM (review model=$REVIEW_MODEL_ALIAS, generation model=$MODEL)"
          # Mark this run as failed so the run status reflects that no verdict
          # was produced. The auto-retry runs in a separate workflow run.
          exit 1

      - name: Add quality score label
        if: steps.review.conclusion == 'success' && steps.score.outputs.has_output == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUM: ${{ steps.pr.outputs.pr_number }}
          SCORE: ${{ steps.score.outputs.score }}
        run: |
          LABEL="quality:${SCORE}"
          # Every call retried with backoff: the verdict steps are gated on
          # this step, and impl-merge reads the score from this label. Two
          # tries 2 s apart were not enough for the HTTP 502 brown-out of
          # run 36712916551 (a post-score failure is rescued by "Re-dispatch
          # review after a post-score failure", but a retry here is cheaper
          # than a second review).
          gh_retry() {
            local what="$1"; shift
            local attempt
            for attempt in 1 2 3 4; do
              if "$@" 2> /tmp/quality-label.err; then
                return 0
              fi
              echo "::warning::${what} failed (attempt ${attempt}/4): $(head -c 500 /tmp/quality-label.err | tr '\n' ' ')"
              [ "$attempt" -lt 4 ] && sleep $((attempt * 10))
            done
            echo "::error::${what} failed after 4 attempts for PR #${PR_NUM}"
            return 1
          }
          # `--force` makes the creation idempotent (an existing label is not
          # an error), so it can be retried like the rest: a `quality:N` that
          # was never created makes every add below fail. A creation that
          # still fails is not fatal by itself — the add decides.
          gh_retry "quality label creation" gh label create "$LABEL" --force --color "0e8a16" --description "Quality score ${SCORE}/100" \
            || echo "::warning::could not create ${LABEL} — the add below fails unless the label already exists"

          # Strip stale quality:* labels from prior review attempts so the PR
          # carries exactly one authoritative score. Without this, repaired
          # PRs accumulate (e.g. quality:73 + quality:81 on the same PR)
          # and downstream readers may pick the wrong one. Read with its own
          # loop: gh_retry's warnings go to stdout, into STALE.
          STALE=""
          READ_OK=0
          for attempt in 1 2 3 4; do
            if STALE=$(gh pr view "$PR_NUM" --json labels --jq '[.labels[].name | select(startswith("quality:")) | select(. != "'"$LABEL"'")] | join(",")' 2> /tmp/quality-label.err); then
              READ_OK=1
              break
            fi
            echo "::warning::gh pr view (labels) failed (attempt ${attempt}/4): $(head -c 500 /tmp/quality-label.err | tr '\n' ' ')"
            [ "$attempt" -lt 4 ] && sleep $((attempt * 10))
          done
          if [ "$READ_OK" -ne 1 ]; then
            echo "::error::Could not read labels for PR #${PR_NUM} after 4 attempts"
            exit 1
          fi
          if [ -n "$STALE" ]; then
            echo "::notice::Removing stale quality labels: $STALE"
            gh_retry "stale quality label removal" gh pr edit "$PR_NUM" --remove-label "$STALE"
          fi

          gh_retry "quality label" gh pr edit "$PR_NUM" --add-label "$LABEL"

      # One review, no repair: automation/scripts/regen_gate.py turns the
      # review's before/after judgement (review_regen.json, prompt step 8b)
      # into merge | keep. Runs before any verdict label so impl-merge can
      # never fire on a regeneration the gate did not approve. The helper is
      # the copy taken from this workflow's ref; if it cannot run at all, the
      # verdict is keep (fail closed). The gate record (scores, counts, reason
      # code, model and rules provenance — no model-written text) goes into the
      # PR comment on both paths below, where it outlives this run's log.
      - name: Regen gate
        id: gate
        if: steps.review.conclusion == 'success' && steps.score.outputs.has_output == 'true' && steps.regen.outputs.is_regen == 'true'
        env:
          PR_NUM: ${{ steps.pr.outputs.pr_number }}
          SPEC_ID: ${{ steps.pr.outputs.specification_id }}
          LIBRARY: ${{ steps.pr.outputs.library }}
          SCORE: ${{ steps.score.outputs.score }}
          PREV_STORED: ${{ steps.regen_ctx.outputs.prev_stored || 'n/a' }}
          PREV_RENDERS: ${{ steps.prev_renders.outputs.prev_renders || 'missing' }}
          CONTEXT_OUTCOME: ${{ steps.regen_ctx.outcome }}
          CHANGE_REQUEST_PRESENT: ${{ steps.regen_ctx.outputs.change_request_present || 'false' }}
          MODEL_ID: ${{ steps.review_model.outputs.model_id || 'n/a' }}
          CRITERIA_VERSION: ${{ steps.rules.outputs.criteria_version || 'n/a' }}
          PROMPTS_TREE: ${{ steps.rules.outputs.prompts_tree || 'n/a' }}
          PREV_MODEL: ${{ steps.regen_ctx.outputs.prev_model || 'n/a' }}
          PREV_CRITERIA_VERSION: ${{ steps.regen_ctx.outputs.prev_criteria_version || 'n/a' }}
          LANGUAGE: ${{ steps.lang.outputs.language }}
          EXT: ${{ steps.lang.outputs.ext }}
        run: |
          RECORD=/tmp/anyplot-regen-record.json
          rm -f "$RECORD"
          FLAGS=()
          [ -f /tmp/anyplot-canvas-gate.txt ] && FLAGS+=(--canvas-failed)
          [ "$CHANGE_REQUEST_PRESENT" = "true" ] && FLAGS+=(--change-request-present)
          [ "$CONTEXT_OUTCOME" = "success" ] || FLAGS+=(--context-failed)
          if ! python3 "$RUNNER_TEMP/regen-tools/regen_gate.py" decide \
               --spec-id "$SPEC_ID" --library "$LIBRARY" \
               --score "$SCORE" --prev-stored "$PREV_STORED" \
               --regen-json review_regen.json \
               --weaknesses-json /tmp/anyplot-prev-weaknesses.json \
               --spec-file "plots/${SPEC_ID}/specification.md" \
               --prev-renders "$PREV_RENDERS" \
               --summary-out /tmp/anyplot-regen-summary.md \
               --pr "$PR_NUM" --model "$MODEL_ID" \
               --criteria-version "$CRITERIA_VERSION" --prompts-tree "$PROMPTS_TREE" \
               --prev-model "$PREV_MODEL" --prev-criteria-version "$PREV_CRITERIA_VERSION" \
               --record-out "$RECORD" \
               --prev-impl "/tmp/anyplot-prev-impl${EXT}" \
               --new-impl "plots/${SPEC_ID}/implementations/${LANGUAGE}/${LIBRARY}${EXT}" \
               "${FLAGS[@]}"; then
            echo "::notice::regen_gate spec=${SPEC_ID} lib=${LIBRARY} prev_stored=${PREV_STORED} prev_rescored=n/a new=${SCORE} verdict=keep code=script_crashed model=${MODEL_ID} criteria=${CRITERIA_VERSION} reason=gate script crashed"
            {
              echo "verdict=keep"
              echo "reason=gate script crashed"
              echo "prev_rescored=n/a"
              echo "code=script_crashed"
            } >> "$GITHUB_OUTPUT"
            printf '**Reason:** gate script crashed (see the impl-review run log)\n' > /tmp/anyplot-regen-summary.md
            # Minimal record so the decision still leaves a trace in the comment.
            jq -cn --arg pr "$PR_NUM" --arg spec "$SPEC_ID" --arg lib "$LIBRARY" --arg model "$MODEL_ID" \
               --arg cv "$CRITERIA_VERSION" --arg at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
               '{v: 1, pr: ($pr | tonumber? // null), spec: $spec, lib: $lib, model: $model,
                 criteria_version: $cv, verdict: "keep", code: "script_crashed", at: $at}' \
               > "$RECORD" 2>/dev/null || rm -f "$RECORD"
          fi

      # Regen only: keep the pair the gate just judged as a 60-day artifact —
      # both renders, both sources, the previous review, this review's files
      # and the gate record. The predecessor's production renders are
      # overwritten by the next merge, so this is the only copy. Staged into
      # one directory first (mixed /tmp + workspace paths would be rooted at
      # `/`). Never gating.
      - name: Stage regen pair
        id: pair
        if: steps.review.conclusion == 'success' && steps.score.outputs.has_output == 'true' && steps.regen.outputs.is_regen == 'true'
        continue-on-error: true
        timeout-minutes: 5
        env:
          PR_NUM: ${{ steps.pr.outputs.pr_number }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          SPEC_ID: ${{ steps.pr.outputs.specification_id }}
          LIBRARY: ${{ steps.pr.outputs.library }}
          LANGUAGE: ${{ steps.lang.outputs.language }}
          EXT: ${{ steps.lang.outputs.ext }}
          MODEL_ID: ${{ steps.review_model.outputs.model_id || 'n/a' }}
          CRITERIA_VERSION: ${{ steps.rules.outputs.criteria_version || 'n/a' }}
        run: |
          DIR="$RUNNER_TEMP/regen-pair"
          rm -rf "$DIR"
          mkdir -p "$DIR/new" "$DIR/prev"
          cp plot_images/plot-light.png plot_images/plot-dark.png "$DIR/new/" 2>/dev/null || true
          cp "plots/${SPEC_ID}/implementations/${LANGUAGE}/${LIBRARY}${EXT}" "$DIR/new/" 2>/dev/null || true
          cp /tmp/anyplot-prev-plot-light.png "$DIR/prev/plot-light.png" 2>/dev/null || true
          cp /tmp/anyplot-prev-plot-dark.png "$DIR/prev/plot-dark.png" 2>/dev/null || true
          cp "/tmp/anyplot-prev-impl${EXT}" "$DIR/prev/${LIBRARY}${EXT}" 2>/dev/null || true
          cp /tmp/anyplot-prev-review.md /tmp/anyplot-prev-weaknesses.json "$DIR/prev/" 2>/dev/null || true
          cp review_*.json review_*.txt quality_score.txt "$DIR/" 2>/dev/null || true
          cp /tmp/anyplot-regen-record.json "$DIR/gate-record.json" 2>/dev/null || true
          cp /tmp/anyplot-regen-summary.md "$DIR/gate-summary.md" 2>/dev/null || true
          MAIN_SHA=$(git rev-parse -q --verify origin/main 2>/dev/null || echo "")
          jq -n --arg pr "$PR_NUM" --arg head "$HEAD_SHA" --arg main "$MAIN_SHA" --arg spec "$SPEC_ID" \
             --arg lib "$LIBRARY" --arg lang "$LANGUAGE" --arg ext "$EXT" --arg model "$MODEL_ID" \
             --arg cv "$CRITERIA_VERSION" \
             '{v: 1, pr: ($pr | tonumber? // null), head_sha: $head, main_sha: $main, spec_id: $spec,
               library: $lib, language: $lang, ext: $ext, model: $model, criteria_version: $cv}' \
             > "$DIR/pair.json" || true
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Upload regen pair
        if: steps.pair.outputs.dir != ''
        continue-on-error: true
        timeout-minutes: 5
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: regen-pair-${{ steps.pr.outputs.pr_number }}-${{ github.run_attempt }}
          path: ${{ steps.pair.outputs.dir }}
          retention-days: 60
          if-no-files-found: warn

      - name: Add preliminary verdict label (early)
        id: early_verdict
        if: steps.review.conclusion == 'success' && steps.score.outputs.has_output == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUM: ${{ steps.pr.outputs.pr_number }}
          SCORE: ${{ steps.score.outputs.score }}
          ATTEMPT_COUNT: ${{ steps.attempts.outputs.count }}
          IS_REGEN: ${{ steps.regen.outputs.is_regen }}
          GATE_VERDICT: ${{ steps.gate.outputs.verdict }}
        run: |
          # Add verdict label early to ensure it's set even if later steps fail
          # This is idempotent - re-running won't cause issues

          # A verdict label that cannot be added fails this step, on every
          # path: "Re-dispatch review after a post-score failure" keys on this
          # step's conclusion, so a step that "succeeds" without its label
          # would switch that rescue off and leave a later failure to the
          # watchdog alone.
          add_label() {
            local label="$1" attempt
            for attempt in 1 2 3; do
              if gh pr edit "$PR_NUM" --add-label "$label" 2> /tmp/label.err; then
                return 0
              fi
              echo "::warning::adding ${label} failed (attempt ${attempt}/3): $(head -c 300 /tmp/label.err | tr '\n' ' ')"
              [ "$attempt" -lt 3 ] && sleep $((attempt * 10))
            done
            echo "::error::${label} could not be added to PR #${PR_NUM} after 3 attempts"
            return 1
          }

          # Regeneration: the gate's verdict, never the cascading threshold.
          # merge → `regen:improved` FIRST, then `ai-approved` (impl-merge
          # listens for the latter, so the marker must already be there).
          # keep → `regen:kept` only. Never `ai-rejected`: that would start
          # the repair loop, which a regeneration never enters (one review,
          # then the gate).
          if [ "$IS_REGEN" = "true" ]; then
            gh label create "regen:improved" --color "0e8a16" --description "Regeneration replaced the live implementation (regen gate)" 2>/dev/null || true
            gh label create "regen:kept" --color "bfdadc" --description "Regeneration closed, live implementation kept (regen gate)" 2>/dev/null || true
            if [ "$GATE_VERDICT" = "merge" ]; then
              add_label "regen:improved" || { echo "::error::regen:improved could not be added — not adding ai-approved"; exit 1; }
              add_label "ai-approved" || exit 1
              echo "::notice::Regen gate: merge (regen:improved + ai-approved)"
            else
              add_label "regen:kept" || exit 1
              echo "::notice::Regen gate: keep (regen:kept)"
            fi
            exit 0
          fi

          # Dynamic threshold based on repair attempt count:
          # Attempt 0 (Review 1): >= 90
          # Attempt 1 (Review 2): >= 80
          # Attempt 2 (Review 3): >= 70
          # Attempt 3 (Review 4): >= 60
          # Attempt 4 (Review 5): >= 50
          THRESHOLD=$((90 - ATTEMPT_COUNT * 10))
          if [ "$THRESHOLD" -lt 50 ]; then THRESHOLD=50; fi

          if [ "$SCORE" -ge "$THRESHOLD" ]; then
            echo "::notice::Adding ai-approved label (score $SCORE >= $THRESHOLD)"
            add_label "ai-approved" || exit 1
          else
            echo "::notice::Adding ai-rejected label (score $SCORE < $THRESHOLD)"
            add_label "ai-rejected" || exit 1

            if [ "$SCORE" -lt 50 ]; then
              gh pr edit "$PR_NUM" --add-label "quality-poor" 2>/dev/null || true
            fi
          fi

      - name: Install Python dependencies for metadata update
        if: steps.review.conclusion == 'success' && steps.score.outputs.has_output == 'true'
        run: pip install pyyaml

      # Monitoring only: every weakness line is a defect (`<ID> (<render>): …`)
      # or a `Suggestion: …` line, a regeneration's review_regen.json
      # classifies the previous weaknesses consistently with its checklists,
      # and its review_prev.json matches prev_checklist.
      # Problems become ::warning:: annotations plus one weakness_format
      # notice; the step never fails the review and changes nothing it stores.
      - name: Check review feedback format (never gating)
        if: steps.review.conclusion == 'success' && steps.score.outputs.has_output == 'true'
        continue-on-error: true
        env:
          SPEC_ID: ${{ steps.pr.outputs.specification_id }}
          IS_REGEN: ${{ steps.regen.outputs.is_regen }}
        run: |
          FLAGS=(--weaknesses review_weaknesses.json --checklist review_checklist.json)
          if [ "$IS_REGEN" = "true" ] && [ -f review_regen.json ]; then
            FLAGS+=(--regen review_regen.json --prev-weaknesses /tmp/anyplot-prev-weaknesses.json \
                    --spec-file "plots/${SPEC_ID}/specification.md" --prev-review review_prev.json)
          fi
          python3 "$RUNNER_TEMP/regen-tools/regen_gate.py" check-feedback --warn-only "${FLAGS[@]}"

      # Skipped on a kept regeneration: the PR is closed unmerged, so there is
      # nothing to record on its branch (the live implementation's re-score
      # goes to main through "Write back the re-score (regen keep)").
      - name: Update metadata and implementation header
        if: steps.review.conclusion == 'success' && steps.score.outputs.has_output == 'true' && (steps.regen.outputs.is_regen != 'true' || steps.gate.outputs.verdict == 'merge')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SPEC_ID: ${{ steps.pr.outputs.specification_id }}
          LIBRARY: ${{ steps.pr.outputs.library }}
          LANGUAGE: ${{ steps.lang.outputs.language }}
          EXT: ${{ steps.lang.outputs.ext }}
          SCORE: ${{ steps.score.outputs.score }}
          BRANCH: ${{ steps.pr.outputs.branch }}
          # Review provenance (not synced to the database: sync_to_postgres
          # picks review keys by name). An empty value removes the key.
          REVIEW_MODEL: ${{ steps.review_model.outputs.model_id }}
          CRITERIA_VERSION: ${{ steps.rules.outputs.criteria_version }}
          RENDERED_AT: ${{ steps.staging.outputs.rendered_at }}
        run: |
          METADATA_FILE="plots/${SPEC_ID}/metadata/${LANGUAGE}/${LIBRARY}.yaml"
          IMPL_FILE="plots/${SPEC_ID}/implementations/${LANGUAGE}/${LIBRARY}${EXT}"

          # Configure git auth and checkout the PR branch
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git fetch origin "$BRANCH"
          git checkout -B "$BRANCH" "origin/$BRANCH"

          # Update metadata file with quality score, timestamp, and review feedback
          if [ -f "$METADATA_FILE" ]; then
            TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

            # Write Python script to temp file to avoid YAML/shell escaping issues
            cat > /tmp/update_metadata.py << 'EOF'
          import yaml
          import json
          import os
          import sys
          from pathlib import Path

          metadata_file = sys.argv[1]
          score = int(sys.argv[2])
          timestamp = sys.argv[3]

          # Read existing review data files
          strengths = []
          weaknesses = []
          image_description = None
          criteria_checklist = None
          verdict = None
          impl_tags = None

          if Path('review_strengths.json').exists():
              try:
                  with open('review_strengths.json') as f:
                      strengths = json.load(f)
              except:
                  pass

          if Path('review_weaknesses.json').exists():
              try:
                  with open('review_weaknesses.json') as f:
                      weaknesses = json.load(f)
              except:
                  pass

          if Path('review_image_description.txt').exists():
              try:
                  with open('review_image_description.txt') as f:
                      image_description = f.read().strip()
              except:
                  pass

          if Path('review_checklist.json').exists():
              try:
                  with open('review_checklist.json') as f:
                      criteria_checklist = json.load(f)
              except:
                  pass

          if Path('review_verdict.txt').exists():
              try:
                  with open('review_verdict.txt') as f:
                      verdict = f.read().strip()
              except:
                  pass

          if Path('review_impl_tags.json').exists():
              try:
                  with open('review_impl_tags.json') as f:
                      impl_tags = json.load(f)
              except:
                  pass

          # Load existing metadata
          with open(metadata_file, 'r') as f:
              data = yaml.safe_load(f)

          data['quality_score'] = score
          data['updated'] = timestamp

          if 'review' not in data:
              data['review'] = {}

          # Update review section with all fields
          data['review']['strengths'] = strengths
          data['review']['weaknesses'] = weaknesses

          # Add extended review data (issue #2845)
          if image_description:
              data['review']['image_description'] = image_description
          if criteria_checklist:
              data['review']['criteria_checklist'] = criteria_checklist
          if verdict:
              data['review']['verdict'] = verdict

          # Review provenance: resolved model id, rules version, render time.
          # Each is optional — a missing value never stops this script. A
          # value this review could not determine removes the key: a repair
          # review starts from the metadata the previous review wrote, whose
          # model, rules or render time would otherwise pass for this one's.
          review_model = os.environ.get('REVIEW_MODEL', '').strip()
          criteria_version = os.environ.get('CRITERIA_VERSION', '').strip()
          rendered_at = os.environ.get('RENDERED_AT', '').strip()
          for key, value in (
              ('model', review_model),
              ('criteria_version', criteria_version),
              ('rendered_at', rendered_at),
          ):
              if value:
                  data['review'][key] = value
              else:
                  data['review'].pop(key, None)

          # Add impl_tags (issue #2434)
          if impl_tags:
              data['impl_tags'] = impl_tags

          def str_representer(dumper, data):
              if isinstance(data, str) and data.endswith('Z') and 'T' in data:
                  return dumper.represent_scalar('tag:yaml.org,2002:str', data, style="'")
              # Use literal block style for multi-line strings (image_description)
              if isinstance(data, str) and '\n' in data:
                  return dumper.represent_scalar('tag:yaml.org,2002:str', data, style='|')
              return dumper.represent_scalar('tag:yaml.org,2002:str', data)

          yaml.add_representer(str, str_representer)

          with open(metadata_file, 'w') as f:
              yaml.dump(data, f, default_flow_style=False, sort_keys=False, allow_unicode=True)
          EOF

            python3 /tmp/update_metadata.py "$METADATA_FILE" "$SCORE" "$TIMESTAMP"
            echo "::notice::Updated metadata with quality score ${SCORE} and extended review data"
          fi

          # Update implementation header with quality score
          if [ -f "$IMPL_FILE" ]; then
            # Get library version + the runtime version of the implementation language
            # (Python for python libs, R for ggplot2). The script-level header in the
            # impl file should display the impl's own runtime, not the pipeline Python.
            LIBRARY_VERSION=$(python3 -c "import yaml; print(yaml.safe_load(open('$METADATA_FILE'))['library_version'])" 2>/dev/null || echo "unknown")
            LANGUAGE_VERSION=$(python3 -c "
          import yaml
          data = yaml.safe_load(open('$METADATA_FILE'))
          print(data.get('language_version') or data.get('python_version') or 'unknown')
          " 2>/dev/null || echo "unknown")
            DATE_INFO=$(python3 -c "
          import yaml
          data = yaml.safe_load(open('$METADATA_FILE'))
          created = data['created'][:10]
          updated = data.get('updated', '')[:10] if data.get('updated') else ''
          if updated and updated != created:
              print(f'Updated: {updated}')
          else:
              print(f'Created: {created}')
          " 2>/dev/null || echo "Created: $(date +%Y-%m-%d)")

            # Get title from specification.yaml
            TITLE=$(python3 -c "import yaml; print(yaml.safe_load(open('plots/${SPEC_ID}/specification.yaml'))['title'])" 2>/dev/null || echo "${SPEC_ID}")

            # Replace old header using Python.
            # Inputs come through env (NOT shell-interpolated into Python source) and the
            # heredoc uses single-quoted 'EOF' so bash does not expand $TITLE. That blocks
            # triple-quote literal injection (a TITLE containing ''' would otherwise
            # escape the string and execute arbitrary Python in the runner).
            #
            # Per-language header style:
            #  - Python: triple-quoted docstring (""")
            #  - R: roxygen-style #' block (R has no docstring syntax)
            export IMPL_FILE LANGUAGE SPEC_ID TITLE LIBRARY LIBRARY_VERSION LANGUAGE_VERSION SCORE DATE_INFO
            python3 - <<'EOF'
          import os
          import re

          impl_file = os.environ["IMPL_FILE"]
          language = os.environ["LANGUAGE"]
          spec_id = os.environ["SPEC_ID"]
          title = os.environ["TITLE"]
          library = os.environ["LIBRARY"]
          lib_version = os.environ["LIBRARY_VERSION"]
          lang_version = os.environ["LANGUAGE_VERSION"]
          score = os.environ["SCORE"]
          date_info = os.environ["DATE_INFO"]

          # Human-readable runtime label for the header. Extend this map when a new
          # language joins the catalog.
          RUNTIME_LABEL = {"python": "Python", "r": "R", "julia": "Julia", "javascript": "JavaScript"}.get(
              language, language.capitalize()
          )

          with open(impl_file, "r") as f:
              content = f.read()

          if language == "r":
              # Sanitize title — newlines would break the comment block. R header is
              # roxygen-style #' so triple-quote injection isn't a concern.
              title_safe = title.replace("\n", " ")
              new_header = (
                  "#' anyplot.ai\n"
                  f"#' {spec_id}: {title_safe}\n"
                  f"#' Library: {library} {lib_version} | {RUNTIME_LABEL} {lang_version}\n"
                  f"#' Quality: {score}/100 | {date_info}"
              )
              # Match a leading run of #' lines (the existing roxygen header). Anchored to
              # start of file. If no header exists we fall back to prepending one.
              pattern = r"\A(?:#'[^\n]*\n)+"
              if re.match(pattern, content):
                  new_content = re.sub(pattern, new_header + "\n", content, count=1)
              else:
                  new_content = new_header + "\n" + content
          elif language == "julia":
              # Julia has no docstring syntax; anyplot uses a leading `#` comment
              # block, mirroring the Python/R conventions. Newlines in the title
              # would break the comment block, so sanitize them.
              title_safe = title.replace("\n", " ")
              new_header = (
                  "# anyplot.ai\n"
                  f"# {spec_id}: {title_safe}\n"
                  f"# Library: {library} {lib_version} | {RUNTIME_LABEL} {lang_version}\n"
                  f"# Quality: {score}/100 | {date_info}"
              )
              # Match a leading run of `#`-prefixed Julia line-comments (the
              # existing header). Anchored to start of file. If no header
              # exists we fall back to prepending one. The character class
              # after `#` is intentionally narrow: either `[ \t]` (a space or
              # tab — the canonical header style `# anyplot.ai`) or empty
              # (i.e. a bare `#` immediately followed by `\n`). This excludes:
              # `#=` (block-comment openers, which would otherwise swallow the
              # block-comment body) and `#!` (shebangs — Julia ignores them
              # but they're not part of the header we own). If either ever
              # appears as the first non-blank line of a file, the regex
              # falls through and the canonical header is prepended above it.
              pattern = r"\A(?:#(?:[ \t][^\n]*|)\n)+"
              if re.match(pattern, content):
                  new_content = re.sub(pattern, new_header + "\n", content, count=1)
              else:
                  new_content = new_header + "\n" + content
          elif language == "javascript":
              # JavaScript has no docstring syntax; anyplot uses a leading `//`
              # line-comment block, mirroring the Julia/R conventions.
              title_safe = title.replace("\n", " ")
              new_header = (
                  "// anyplot.ai\n"
                  f"// {spec_id}: {title_safe}\n"
                  f"// Library: {library} {lib_version} | {RUNTIME_LABEL} {lang_version}\n"
                  f"// Quality: {score}/100 | {date_info}"
              )
              # Match a leading run of `//`-comment lines (the existing header).
              # The negative lookahead `(?!#)` excludes `//#`-prefixed lines —
              # those are anyplot directives (e.g. `//# anyplot-orientation:
              # square`) the harness reads, NOT header lines, so they must
              # survive the rewrite. The run therefore stops at the first
              # directive; if a directive is the first line of the file the
              # regex falls through and the canonical header is prepended above
              # it. (#6947 prepend-fallback.)
              pattern = r"\A(?://(?!#)[^\n]*\n)+"
              if re.match(pattern, content):
                  new_content = re.sub(pattern, new_header + "\n", content, count=1)
              else:
                  new_content = new_header + "\n" + content
          else:
              # Python: triple-quoted module docstring at the top of the file.
              title_safe = title.replace('"""', '\\"\\"\\"')
              new_header = (
                  '""" anyplot.ai\n'
                  f"{spec_id}: {title_safe}\n"
                  f"Library: {library} {lib_version} | {RUNTIME_LABEL} {lang_version}\n"
                  f"Quality: {score}/100 | {date_info}\n"
                  '"""'
              )
              # Match an existing leading triple-quoted module docstring and
              # replace it. If the impl file has no header (generator skipped
              # it / regen wiped it), prepend the canonical one instead of
              # silently leaving the file without metadata — mirrors the R
              # branch behaviour above.
              pattern = r'^""".*?"""'
              if re.match(pattern, content, flags=re.DOTALL):
                  new_content = re.sub(pattern, new_header, content, count=1, flags=re.DOTALL)
              else:
                  new_content = new_header + "\n" + content

          with open(impl_file, "w") as f:
              f.write(new_content)
          EOF

            echo "::notice::Updated implementation header with quality score ${SCORE}"
          fi

          # Commit and push
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$METADATA_FILE" "$IMPL_FILE"

          if ! git diff --cached --quiet; then
            git commit -m "chore(${LIBRARY}): update quality score ${SCORE} and review feedback for ${SPEC_ID}"
            git push origin "$BRANCH"
            echo "::notice::Changes committed to ${BRANCH}"
          fi

      # The review scored, then a later step died before any verdict label
      # landed — every step after a failure is skipped, so nothing downstream
      # would ever run. Run 36712916551 (PR #11984, 2026-09-30): "Add quality
      # score label" hit HTTP 502 twice and the PR sat without a verdict for
      # ~7 h. A crashed or empty review never gets here (has_output is false:
      # "Validate review output" owns it). Once a verdict label is on the PR
      # the watchdog's merge/repair cases own the state, and a second review
      # could add a contradicting verdict, so this step then does nothing.
      # It shares the `review-retry` marker with "Validate review output": at
      # most one automatic re-review per PR, whatever the cause. The marker is
      # written before the dispatch, and an unreadable budget counts as spent.
      # After that, or when the marker or the dispatch itself fails, the PR
      # gets `ai-review-failed`, which watchdog Case 1 rescues once (a
      # regeneration is only flagged).
      # The retry runs on this run's ref, so a branch smoke stays on its branch.
      - name: Re-dispatch review after a post-score failure
        if: failure() && steps.review.conclusion == 'success' && steps.score.outputs.has_output == 'true' && steps.early_verdict.conclusion != 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUM: ${{ steps.pr.outputs.pr_number }}
          SPEC_ID: ${{ steps.pr.outputs.specification_id }}
          LIBRARY: ${{ steps.pr.outputs.library }}
          SCORE: ${{ steps.score.outputs.score }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          MODEL: ${{ steps.pr.outputs.model }}
          REVIEW_MODEL_ALIAS: ${{ steps.pr.outputs.review_model_alias }}
          WORKFLOW_REF: ${{ github.ref_name }}
        run: |
          RUN_URL="https://github.com/${REPOSITORY}/actions/runs/${RUN_ID}"
          MARKER="<!-- review-retry:${SPEC_ID}:${LIBRARY} -->"
          # Same shape as the verdict step's helper; one GitHub brown-out is
          # the likely reason this step runs at all.
          gh_retry() {
            local what="$1"; shift
            local attempt
            for attempt in 1 2 3; do
              if "$@" 2> /tmp/rescue-gh.err; then
                return 0
              fi
              echo "::warning::${what} failed (attempt ${attempt}/3): $(head -c 500 /tmp/rescue-gh.err | tr '\n' ' ')"
              [ "$attempt" -lt 3 ] && sleep $((attempt * 10))
            done
            return 1
          }
          give_up() {
            gh label create "ai-review-failed" --color "d73a4a" --description "AI review failed; watchdog re-dispatches once" 2>/dev/null || true
            gh_retry "ai-review-failed label" gh pr edit "$PR_NUM" --add-label "ai-review-failed" \
              || echo "::error::could not add ai-review-failed to PR #${PR_NUM} — left to the watchdog's scan of stalled PRs"
            {
              echo "${MARKER}"
              echo "## :x: AI Review Failed After Scoring"
              echo ""
              echo "The review scored ${SCORE}/100, but $1 No verdict was applied."
              echo ""
              echo "**Manual rerun:**"
              echo "\`\`\`"
              echo "gh workflow run impl-review.yml -f pr_number=${PR_NUM}"
              echo "\`\`\`"
              echo ""
              echo "---"
              echo ":robot: *[impl-review](${RUN_URL})*"
            } > /tmp/rescue-comment.md
            gh_retry "PR comment" gh pr comment "$PR_NUM" --body-file /tmp/rescue-comment.md || true
            exit 1
          }

          # Not through gh_retry: its warnings go to stdout, into LABELS.
          LABELS=""
          READ_OK=0
          for attempt in 1 2 3; do
            if LABELS=$(gh pr view "$PR_NUM" --json labels -q '.labels[].name' 2> /tmp/rescue-gh.err); then
              READ_OK=1
              break
            fi
            echo "::warning::gh pr view (labels) failed (attempt ${attempt}/3): $(head -c 500 /tmp/rescue-gh.err | tr '\n' ' ')"
            [ "$attempt" -lt 3 ] && sleep $((attempt * 10))
          done
          if [ "$READ_OK" -ne 1 ]; then
            give_up "a later step failed and the PR's labels could not be read afterwards."
          fi
          if echo "$LABELS" | grep -qxE "ai-approved|ai-rejected|regen:improved|regen:kept"; then
            echo "::notice::PR #${PR_NUM} already carries a verdict label — left to the watchdog, no re-review"
            exit 1
          fi

          # Paginate so the marker is found even on PRs with >30 comments.
          # `--paginate --jq` prints one count per page, so the pages are
          # summed. An unreadable budget counts as spent (fail closed): the
          # brown-out that brought this step here must not lift the cap.
          RETRY_COUNT=""
          for attempt in 1 2 3; do
            if PAGES=$(gh api --paginate "repos/$REPOSITORY/issues/${PR_NUM}/comments?per_page=100" \
                 --jq "[.[] | select(.body != null and (.body | contains(\"$MARKER\")))] | length" 2> /tmp/rescue-gh.err) \
               && RETRY_COUNT=$(printf '%s\n' "$PAGES" | jq -s 'add // 0' 2>> /tmp/rescue-gh.err) \
               && [[ "$RETRY_COUNT" =~ ^[0-9]+$ ]]; then
              break
            fi
            RETRY_COUNT=""
            echo "::warning::retry-marker read failed (attempt ${attempt}/3): $(head -c 500 /tmp/rescue-gh.err | tr '\n' ' ')"
            [ "$attempt" -lt 3 ] && sleep $((attempt * 10))
          done
          if [ -z "$RETRY_COUNT" ]; then
            give_up "a later step failed, and whether the one automatic re-review was already used could not be read."
          fi
          if [ "$RETRY_COUNT" -ge 1 ]; then
            give_up "a later step failed, and the one automatic re-review this PR gets is already used."
          fi

          # The marker comment is the retry budget, so it is written BEFORE
          # the dispatch and the dispatch only happens once it is durable: a
          # review dispatched without a marker could fail after its score and
          # dispatch yet another one.
          {
            echo "${MARKER}"
            echo "## :wrench: AI Review Failed After Scoring — Re-Reviewing"
            echo ""
            echo "The review scored ${SCORE}/100, but a later step failed before a verdict was applied (see the run log). A fresh review is dispatched once."
            echo ""
            echo "---"
            echo ":robot: *[impl-review](${RUN_URL})*"
          } > /tmp/rescue-comment.md
          if ! gh_retry "retry marker comment" gh pr comment "$PR_NUM" --body-file /tmp/rescue-comment.md; then
            give_up "a later step failed and the retry marker could not be recorded, so no re-review was dispatched."
          fi

          if ! gh_retry "impl-review dispatch" gh workflow run impl-review.yml --ref "${WORKFLOW_REF:-main}" \
               -f pr_number="$PR_NUM" -f model="$MODEL" -f review_model="$REVIEW_MODEL_ALIAS"; then
            give_up "a later step failed and the re-review could not be dispatched."
          fi
          echo "::notice::Re-dispatched impl-review.yml on ${WORKFLOW_REF:-main} for PR #${PR_NUM} (review model=${REVIEW_MODEL_ALIAS}, generation model=${MODEL})"
          # The run stays red: it produced no verdict. The re-review is its own run.
          exit 1

      # Regen keep only: this session's re-score of the live implementation
      # (review_prev.json, prompt step 8b step 5) becomes its stored review.
      # main takes changes only through a merged PR, so this step commits the
      # pair's metadata and the number in its Quality header on
      # review-writeback/{spec}/{library}/{PR}, opens that PR and dispatches
      # impl-merge.yml; its `writeback` job checks the PR against the gate
      # record and merges it with the admin token, which never enters this job.
      # Every early exit writes its status (no_rescore, invalid, stale,
      # unchanged, failed) for the gate record; the step never holds up the
      # keep bookkeeping below. It runs the workflow-ref copy of the helper
      # (the model session can edit the workspace) and never checks anything
      # out in the workspace, from which the verdict step imports core.constants.
      # Git hooks are off for every git call here (GIT_CONFIG_*): the
      # workspace's .git, hooks included, is shared with that session.
      - name: Write back the re-score (regen keep)
        id: writeback
        if: steps.review.conclusion == 'success' && steps.score.outputs.has_output == 'true' && steps.regen.outputs.is_regen == 'true' && steps.gate.outputs.verdict != 'merge'
        continue-on-error: true
        timeout-minutes: 5
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: core.hooksPath
          GIT_CONFIG_VALUE_0: /dev/null
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUM: ${{ steps.pr.outputs.pr_number }}
          SPEC_ID: ${{ steps.pr.outputs.specification_id }}
          LIBRARY: ${{ steps.pr.outputs.library }}
          LANGUAGE: ${{ steps.lang.outputs.language }}
          EXT: ${{ steps.lang.outputs.ext }}
          GATE_CODE: ${{ steps.gate.outputs.code }}
          PREV_RESCORED: ${{ steps.gate.outputs.prev_rescored }}
          PREV_STORED: ${{ steps.regen_ctx.outputs.prev_stored || 'n/a' }}
          PREV_META_BLOB: ${{ steps.regen_ctx.outputs.prev_meta_blob }}
          PREV_IMPL_BLOB: ${{ steps.regen_ctx.outputs.prev_impl_blob }}
          # Resolved id and rules version of this session; empty removes the key.
          REVIEW_MODEL: ${{ steps.review_model.outputs.model_id }}
          CRITERIA_VERSION: ${{ steps.rules.outputs.criteria_version }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          # main for every production run (repository_dispatch included), the
          # branch for a branch smoke: impl-merge runs from the same ref.
          WORKFLOW_REF: ${{ github.ref_name }}
        run: |
          TOOL="$RUNNER_TEMP/regen-tools/regen_writeback.py"
          META_FILE="plots/${SPEC_ID}/metadata/${LANGUAGE}/${LIBRARY}.yaml"
          IMPL_FILE="plots/${SPEC_ID}/implementations/${LANGUAGE}/${LIBRARY}${EXT}"
          WB_BRANCH="review-writeback/${SPEC_ID}/${LIBRARY}/${PR_NUM}"
          WT="$RUNNER_TEMP/review-writeback"
          RUN_URL="https://github.com/${REPOSITORY}/actions/runs/${RUN_ID}"
          STATUS=""
          PUSHED=0
          WB_PR=""

          set_status() {
            STATUS="$1"
            echo "status=$1" >> "$GITHUB_OUTPUT"
            echo "::notice::review_writeback spec=${SPEC_ID} lib=${LIBRARY} pr=${PR_NUM} status=$1${2:+ reason=$2}"
          }
          # Any exit without a status (a command that failed) is `failed`. A
          # pushed branch that got no PR is deleted; the worktree always goes.
          finish() {
            if [ -z "$STATUS" ]; then
              set_status failed "unexpected error, see above"
            fi
            if [ "$PUSHED" = "1" ] && [ -z "$WB_PR" ]; then
              git push -q origin --delete "$WB_BRANCH" 2>/dev/null || true
            fi
            git worktree remove --force "$WT" 2>/dev/null || true
          }
          trap finish EXIT
          gh_retry() {
            local what="$1"; shift
            local attempt
            for attempt in 1 2 3; do
              if "$@" 2> /tmp/anyplot-writeback-gh.err; then
                return 0
              fi
              echo "::warning::${what} failed (attempt ${attempt}/3): $(head -c 300 /tmp/anyplot-writeback-gh.err | tr '\n' ' ')"
              [ "$attempt" -lt 3 ] && sleep $((attempt * 5))
            done
            return 1
          }

          # 1. Only a validated review_regen.json gives the gate an integer re-score.
          if ! [[ "$PREV_RESCORED" =~ ^[0-9]+$ ]]; then
            set_status no_rescore "gate code ${GATE_CODE:-none}"
            exit 0
          fi

          # 2. The re-score as a full review, its checklist equal to prev_checklist.
          if ! python3 "$TOOL" check --prev-review review_prev.json --regen-json review_regen.json \
               > /tmp/anyplot-writeback-check.txt 2>&1; then
            while IFS= read -r line; do
              echo "::warning::review_prev.json: ${line}"
            done < /tmp/anyplot-writeback-check.txt
            set_status invalid
            exit 0
          fi

          # 3. The re-score belongs to exactly the two files the review read.
          if ! gh_retry "git fetch origin main" git fetch -q origin main; then
            set_status failed "git fetch"
            exit 0
          fi
          META_NOW=$(git rev-parse -q --verify "origin/main:${META_FILE}" || echo n/a)
          IMPL_NOW=$(git rev-parse -q --verify "origin/main:${IMPL_FILE}" || echo n/a)
          if [ "$META_NOW" = "n/a" ] || [ "$IMPL_NOW" = "n/a" ]; then
            set_status stale "the pair's files are not on main"
            exit 0
          fi
          if [ "$META_NOW" != "${PREV_META_BLOB:-unset}" ] || [ "$IMPL_NOW" != "${PREV_IMPL_BLOB:-unset}" ]; then
            set_status stale "main changed the pair's files during the review"
            exit 0
          fi

          # 4. A newer re-score supersedes an open write-back of this pair, and a
          # rescue re-run of this kept PR reuses the branch name.
          OPEN=""
          LISTED=0
          for attempt in 1 2 3; do
            if OPEN=$(gh pr list --state open --label review-writeback --limit 100 --json number,headRefName \
                        --jq ".[] | select(.headRefName | startswith(\"review-writeback/${SPEC_ID}/${LIBRARY}/\")) | .number" \
                        2> /tmp/anyplot-writeback-gh.err); then
              LISTED=1
              break
            fi
            echo "::warning::gh pr list failed (attempt ${attempt}/3): $(head -c 300 /tmp/anyplot-writeback-gh.err | tr '\n' ' ')"
            [ "$attempt" -lt 3 ] && sleep $((attempt * 5))
          done
          if [ "$LISTED" != "1" ]; then
            set_status failed "listing open write-back PRs"
            exit 0
          fi
          for n in $OPEN; do
            gh_retry "close superseded #${n}" gh pr close "$n" --delete-branch \
              --comment "Superseded by the re-score of kept regeneration #${PR_NUM} ([impl-review](${RUN_URL}))." \
              || echo "::warning::superseded write-back #${n} is still open"
          done
          if git ls-remote --exit-code --heads origin "refs/heads/${WB_BRANCH}" > /dev/null 2>&1; then
            git push -q origin --delete "$WB_BRANCH"
          fi

          # 5. A worktree of the current origin/main under $RUNNER_TEMP.
          git worktree remove --force "$WT" 2>/dev/null || true
          rm -rf "$WT"
          git worktree add -q --detach "$WT" origin/main
          python3 "$TOOL" apply --metadata "$WT/$META_FILE" --prev-review review_prev.json \
            --score "$PREV_RESCORED" --model "$REVIEW_MODEL" --criteria-version "$CRITERIA_VERSION" \
            --impl "$WT/$IMPL_FILE"
          if git -C "$WT" diff --quiet; then
            set_status unchanged
            exit 0
          fi

          # 6. One commit with the two files (hooks off through the step's env).
          git -C "$WT" add -- "$META_FILE" "$IMPL_FILE"
          git -C "$WT" -c user.name="github-actions[bot]" \
            -c user.email="github-actions[bot]@users.noreply.github.com" \
            commit -q -m "chore(${LIBRARY}): store re-score ${PREV_RESCORED} for ${SPEC_ID} (kept regen #${PR_NUM})"
          if ! gh_retry "push ${WB_BRANCH}" git -C "$WT" push -q origin "HEAD:refs/heads/${WB_BRANCH}"; then
            set_status failed "push"
            exit 0
          fi
          PUSHED=1

          # 7. The PR. Explicit base and head: a branch smoke runs from a branch
          # ref, and the worktree has no branch checked out.
          gh label create review-writeback --color "c5def5" \
            --description "Stored review replaced by a kept regeneration's re-score (impl-merge merges it)" 2>/dev/null || true
          TITLE="chore(${LIBRARY}): store re-score ${PREV_RESCORED} for ${SPEC_ID} (kept regen #${PR_NUM})"
          {
            echo "## Stored review: re-score of the live implementation"
            echo ""
            echo "The regen gate kept the live implementation of \`${SPEC_ID}\` / ${LIBRARY} in #${PR_NUM}. That review session re-scored the live implementation; this PR stores the re-score as its review."
            echo ""
            echo "| Kept regeneration | Stored score | Review model | Rules version |"
            echo "|---|---|---|---|"
            echo "| #${PR_NUM} | ${PREV_STORED} → ${PREV_RESCORED} | \`${REVIEW_MODEL:-n/a}\` | \`${CRITERIA_VERSION:-n/a}\` |"
            echo ""
            echo "Only \`quality_score\` and the review in \`${META_FILE}\` and the number in the \`Quality:\` header of \`${IMPL_FILE}\` change. The code and the production images stay as they are."
            echo ""
            echo "\`impl-merge.yml\` merges this PR after checking it against the gate record on #${PR_NUM}. Do not merge it by hand; to retry, run \`gh workflow run impl-merge.yml -f pr_number=<this PR>\`."
            echo ""
            echo "---"
            echo ":robot: *[impl-review](${RUN_URL})*"
          } > /tmp/anyplot-writeback-body.md
          for attempt in 1 2 3; do
            if gh pr create --base main --head "$WB_BRANCH" --label review-writeback --title "$TITLE" \
                 --body-file /tmp/anyplot-writeback-body.md > /tmp/anyplot-writeback-pr.txt 2> /tmp/anyplot-writeback-gh.err; then
              WB_PR=$(grep -oE '[0-9]+$' /tmp/anyplot-writeback-pr.txt | tail -1 || true)
              [ -n "$WB_PR" ] && break
            fi
            # A create that succeeded but lost its response.
            WB_PR=$(gh pr list --state open --head "$WB_BRANCH" --json number --jq '.[0].number // empty' 2>/dev/null || true)
            [ -n "$WB_PR" ] && break
            echo "::warning::gh pr create failed (attempt ${attempt}/3): $(head -c 300 /tmp/anyplot-writeback-gh.err | tr '\n' ' ')"
            [ "$attempt" -lt 3 ] && sleep $((attempt * 5))
          done
          if [ -z "$WB_PR" ]; then
            set_status failed "pull request"
            exit 0
          fi

          # 8. The merge: impl-merge.yml's writeback job, on this workflow's ref.
          if ! gh_retry "impl-merge dispatch" gh workflow run impl-merge.yml --ref "$WORKFLOW_REF" -f pr_number="$WB_PR"; then
            gh_retry "close #${WB_PR}" gh pr close "$WB_PR" --delete-branch \
              --comment "Closed: impl-merge.yml could not be dispatched ([impl-review](${RUN_URL}))." || true
            set_status failed "impl-merge dispatch"
            exit 0
          fi
          echo "pr=${WB_PR}" >> "$GITHUB_OUTPUT"
          echo "score=${PREV_RESCORED}" >> "$GITHUB_OUTPUT"
          set_status opened "#${WB_PR}"

      - name: Add verdict label and take action
        if: steps.review.conclusion == 'success' && steps.score.outputs.has_output == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUM: ${{ steps.pr.outputs.pr_number }}
          SPEC_ID: ${{ steps.pr.outputs.specification_id }}
          LIBRARY: ${{ steps.pr.outputs.library }}
          LANGUAGE: ${{ steps.lang.outputs.language }}
          EXT: ${{ steps.lang.outputs.ext }}
          SCORE: ${{ steps.score.outputs.score }}
          ATTEMPT: ${{ steps.attempts.outputs.display }}
          ATTEMPT_COUNT: ${{ steps.attempts.outputs.count }}
          ISSUE_NUMBER: ${{ steps.pr.outputs.issue_number }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          MODEL: ${{ steps.pr.outputs.model }}
          IS_REGEN: ${{ steps.regen.outputs.is_regen }}
          GATE_VERDICT: ${{ steps.gate.outputs.verdict }}
          GATE_REASON: ${{ steps.gate.outputs.reason }}
          GATE_CODE: ${{ steps.gate.outputs.code }}
          PREV_STORED: ${{ steps.regen_ctx.outputs.prev_stored || 'n/a' }}
          MODEL_ID: ${{ steps.review_model.outputs.model_id || 'n/a' }}
          WB_STATUS: ${{ steps.writeback.outputs.status }}
          WB_PR: ${{ steps.writeback.outputs.pr }}
          WB_SCORE: ${{ steps.writeback.outputs.score }}
        run: |
          # Cascading thresholds:
          # Attempt 0 (Review 1): >= 90
          # Attempt 1 (Review 2): >= 80
          # Attempt 2 (Review 3): >= 70
          # Attempt 3 (Review 4): >= 60
          # Attempt 4 (Review 5): >= 50
          THRESHOLD=$((90 - ATTEMPT_COUNT * 10))
          if [ "$THRESHOLD" -lt 50 ]; then THRESHOLD=50; fi

          # This step is the pipeline's only hand-off point: every downstream
          # workflow (merge, repair) starts from a call made right here. An
          # unretried blip therefore does not just fail a step — it strands the
          # PR forever with a verdict label and nothing listening. That is
          # exactly what the 2026-07-24 GitHub API brown-out did to four
          # radar-basic PRs (HTTP 502 on the dispatch endpoint, HTTP 504 on
          # GraphQL). Every API call below is retried 3x with linear backoff.
          # `::warning::` is line-oriented, so multi-line gh stderr would leak
          # everything after the first newline into the raw log — flatten it.
          # GH_RETRY_LEVEL=warning marks a call whose failure must not read as
          # an error (the merge-path gate comment below).
          gh_retry() {
            local what="$1"; shift
            local attempt err
            for attempt in 1 2 3; do
              if "$@" 2> /tmp/gh_retry.err; then
                return 0
              fi
              err=$(head -c 500 /tmp/gh_retry.err | tr '\n' ' ')
              echo "::warning::${what} failed (attempt ${attempt}/3): ${err}"
              if [ "$attempt" -lt 3 ]; then
                sleep $((attempt * 5))
              fi
            done
            echo "::${GH_RETRY_LEVEL:-error}::${what} failed after 3 attempts for PR #${PR_NUM}"
            return 1
          }

          # ── Regeneration: the regen gate decided, the cascade does not apply ──
          if [ "$IS_REGEN" = "true" ]; then
            RUN_URL="https://github.com/${REPOSITORY}/actions/runs/${RUN_ID}"
            SUMMARY_FILE=/tmp/anyplot-regen-summary.md
            if [ ! -s "$SUMMARY_FILE" ]; then
              printf '**Reason:** %s\n' "${GATE_REASON:-regen gate produced no verdict}" > "$SUMMARY_FILE"
            fi
            # Keep only: what happened to the re-score of the live
            # implementation ("Write back the re-score", previous step). A
            # missing status (the step was skipped or cut off) reads as failed.
            if [ "$GATE_VERDICT" != "merge" ]; then
              case "$WB_STATUS" in
                opened|unchanged|no_rescore|invalid|stale|failed) ;;
                *) WB_STATUS=failed ;;
              esac
              if [ -s /tmp/anyplot-regen-record.json ]; then
                jq -c --arg wb "$WB_STATUS" '. + {writeback: $wb}' /tmp/anyplot-regen-record.json \
                  > /tmp/anyplot-regen-record-wb.json \
                  && mv /tmp/anyplot-regen-record-wb.json /tmp/anyplot-regen-record.json \
                  || echo "::warning::writeback=${WB_STATUS} not added to the gate record"
              fi
            fi
            # Machine-readable gate record (`<!-- regen-gate-record:v1 {...} -->`)
            # for both comments; empty when the gate wrote none.
            GATE_RECORD_MARKER=$(python3 "$RUNNER_TEMP/regen-tools/regen_gate.py" marker \
              --record /tmp/anyplot-regen-record.json 2>/dev/null) || GATE_RECORD_MARKER=""

            if [ "$GATE_VERDICT" = "merge" ]; then
              echo "::notice::Regen gate approved the replacement (${GATE_REASON}), triggering merge"
              # Idempotent re-assert: impl-merge refuses a PR without
              # ai-approved, so a label lost after regen:improved would
              # otherwise strand the PR silently.
              gh_retry "ai-approved label" gh pr edit "$PR_NUM" --add-label "ai-approved" || exit 1
              # Record the decision on the PR (the run log expires). Warning
              # only: this comment must never hold up the merge.
              {
                echo "## :arrows_counterclockwise: Regeneration replaces the live implementation"
                echo ""
                echo "The regen gate compared this render (score ${SCORE}) with the implementation on main and approved the replacement; the merge follows."
                echo ""
                cat "$SUMMARY_FILE"
                echo ""
                echo "---"
                echo ":robot: *[impl-review](${RUN_URL})*"
                if [ -n "$GATE_RECORD_MARKER" ]; then
                  echo ""
                  echo "$GATE_RECORD_MARKER"
                fi
              } > /tmp/anyplot-regen-merged.md
              GH_RETRY_LEVEL=warning gh_retry "regen gate PR comment" gh pr comment "$PR_NUM" --body-file /tmp/anyplot-regen-merged.md \
                || echo "::warning::regen gate comment not posted — the merge goes ahead"
              gh_retry "impl-merge dispatch" gh workflow run impl-merge.yml -f pr_number="$PR_NUM"
              exit 0
            fi

            # keep: close the PR; the live code and GCS production stay. The
            # only write to main is the stored review: the previous step's
            # write-back PR, which impl-merge merges and syncs.
            echo "::notice::Regen gate kept the live implementation (${GATE_REASON:-no verdict})"
            FAILED=0

            case "$WB_STATUS" in
              opened) STORED="**Stored review:** this session's re-score of the live implementation (${PREV_STORED} → ${WB_SCORE}, \`${MODEL_ID}\`) is stored once impl-merge merges #${WB_PR}." ;;
              unchanged) STORED="**Stored review:** unchanged (the re-score writes the review that is already stored)." ;;
              no_rescore) STORED="**Stored review:** unchanged (the gate has no re-score of the live implementation: ${GATE_CODE:-no code})." ;;
              invalid) STORED="**Stored review:** unchanged (\`review_prev.json\` failed its check; see the run log)." ;;
              stale) STORED="**Stored review:** unchanged (main changed the implementation or its metadata during the review)." ;;
              *) STORED="**Stored review:** unchanged (the write-back failed; see the run log)." ;;
            esac

            {
              echo "<!-- regen-kept:${SPEC_ID}:${LIBRARY} -->"
              echo "## :leftwards_arrow_with_hook: Regeneration kept the live implementation"
              echo ""
              echo "The regen gate compared this render (score ${SCORE}) with the implementation on main and kept the latter. This PR is closed without merging; the live code and the production images are unchanged."
              echo ""
              cat "$SUMMARY_FILE"
              echo ""
              echo "$STORED"
              echo ""
              echo "The staging render of this PR must **not** be promoted by hand. To replace the implementation anyway, re-run with \`regen_gate=false\`:"
              echo ""
              echo "\`\`\`"
              echo "gh workflow run impl-generate.yml -f specification_id=${SPEC_ID} -f library=${LIBRARY} -f regen_gate=false"
              echo "\`\`\`"
              echo ""
              echo "---"
              echo ":robot: *[impl-review](${RUN_URL})*"
              if [ -n "$GATE_RECORD_MARKER" ]; then
                echo ""
                echo "$GATE_RECORD_MARKER"
              fi
            } > /tmp/anyplot-regen-kept.md

            gh_retry "kept-regen PR comment" gh pr comment "$PR_NUM" --body-file /tmp/anyplot-regen-kept.md || FAILED=1
            # A lost close is re-tried by watchdog Case 0 (open + regen:kept).
            gh_retry "kept-regen PR close" gh pr close "$PR_NUM" --delete-branch || FAILED=1

            if [ -n "$ISSUE_NUMBER" ]; then
              # The pair is done again (its live implementation): re-assert
              # done FIRST, then drop the labels that say it is in flight.
              gh label create "impl:${LIBRARY}:done" --color "0e8a16" --description "${LIBRARY} implementation merged" 2>/dev/null || true
              gh_retry "impl:${LIBRARY}:done" gh issue edit "$ISSUE_NUMBER" --add-label "impl:${LIBRARY}:done" || FAILED=1
              PRESENT=""
              if PRESENT=$(gh issue view "$ISSUE_NUMBER" --json labels -q '.labels[].name' 2>/dev/null); then
                for stale in "generate:${LIBRARY}" "impl:${LIBRARY}:pending" \
                             "impl:${LIBRARY}:failed" "watchdog:retried-${LIBRARY}"; do
                  if echo "$PRESENT" | grep -qx "$stale"; then
                    gh_retry "remove ${stale}" gh issue edit "$ISSUE_NUMBER" --remove-label "$stale" || FAILED=1
                  fi
                done
              else
                # Could not see what is there: remove pending blind. A failure
                # here only turns the run red; the pair is already done again.
                gh_retry "remove impl:${LIBRARY}:pending" gh issue edit "$ISSUE_NUMBER" --remove-label "impl:${LIBRARY}:pending" || FAILED=1
              fi
              gh_retry "issue comment" gh issue comment "$ISSUE_NUMBER" --body-file /tmp/anyplot-regen-kept.md || FAILED=1

              LIBRARIES=$(python3 -c "from core.constants import SUPPORTED_LIBRARIES; print(' '.join(sorted(SUPPORTED_LIBRARIES)))" 2>/dev/null || echo "")
              if [ -n "$LIBRARIES" ]; then
                python3 "$RUNNER_TEMP/regen-tools/close_issue_if_complete.py" \
                  --issue "$ISSUE_NUMBER" --spec-id "$SPEC_ID" --libraries "$LIBRARIES" \
                  --run-url "$RUN_URL" --source impl-review || true
              else
                echo "::warning::Could not read SUPPORTED_LIBRARIES — issue #${ISSUE_NUMBER} left open"
              fi
            fi

            if [ "$FAILED" -ne 0 ]; then
              echo "::error::Kept regeneration of PR #${PR_NUM}: some bookkeeping calls failed (see warnings above)"
              exit 1
            fi
            exit 0
          fi

          # Check if verdict label was already added by earlier step.
          # Track read success explicitly rather than inferring it from an
          # empty result: a failed read and a genuinely label-less PR used to
          # be indistinguishable, and both silently skipped the two branches
          # below, dropping the PR out of the pipeline with no error at all.
          CURRENT_LABELS=""
          READ_OK=0
          for attempt in 1 2 3; do
            if CURRENT_LABELS=$(gh pr view "$PR_NUM" --json labels -q '.labels[].name' 2> /tmp/labels.err); then
              READ_OK=1
              break
            fi
            LERR=$(head -c 500 /tmp/labels.err | tr '\n' ' ')
            echo "::warning::gh pr view (labels) failed (attempt ${attempt}/3): ${LERR}"
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 5))
            fi
          done
          if [ "$READ_OK" -ne 1 ]; then
            echo "::error::Could not read labels for PR #${PR_NUM} after 3 attempts — refusing to decide blind"
            exit 1
          fi

          if echo "$CURRENT_LABELS" | grep -q "ai-approved"; then
            echo "::notice::ai-approved label already set (Score $SCORE >= $THRESHOLD), triggering merge"
            gh_retry "impl-merge dispatch" gh workflow run impl-merge.yml -f pr_number="$PR_NUM"
            exit 0
          fi

          if echo "$CURRENT_LABELS" | grep -q "ai-rejected"; then
            # Still have repair attempts left? (Max 4 repairs = 5 reviews total)
            if [ "$ATTEMPT_COUNT" -lt 4 ]; then
              echo "::notice::ai-rejected label set (Score $SCORE < $THRESHOLD), triggering repair attempt $((ATTEMPT_COUNT + 1))"

              # Dispatch BEFORE labelling, and never let the label gate the
              # dispatch: impl-repair.yml is workflow_dispatch-only, so this
              # call is the single thing that keeps the PR moving. Losing the
              # attempt label costs one over-strict review; losing the dispatch
              # costs the whole PR.
              DISPATCHED=0
              if gh_retry "impl-repair dispatch" gh workflow run impl-repair.yml \
                -f pr_number="$PR_NUM" \
                -f specification_id="$SPEC_ID" \
                -f library="$LIBRARY" \
                -f attempt="$ATTEMPT" \
                -f model="$MODEL"; then
                DISPATCHED=1
              fi

              # `ai-attempt-4` was never created in this repo, so on the 4th
              # repair the add fails deterministically no matter how often it
              # is retried (PRs #7268/#7039 reached "Repair Attempt 4/4"
              # carrying only ai-attempt-1..3 — the old `|| true` hid it).
              gh label create "ai-attempt-${ATTEMPT}" --color "fbca04" \
                --description "Repair attempt ${ATTEMPT}" 2>/dev/null || true
              # Non-fatal, but loud: without it the next review resets to the
              # attempt-0 threshold (>= 90) and the PR re-fails a bar it has
              # already cleared. PR #9744 lost it exactly this way on 2026-07-24.
              gh_retry "ai-attempt-${ATTEMPT} label" gh pr edit "$PR_NUM" --add-label "ai-attempt-${ATTEMPT}" \
                || echo "::error::attempt label lost — the next review will apply the stricter attempt-0 threshold"

              if [ "$DISPATCHED" -ne 1 ]; then
                # Hand the PR to the watchdog rather than leaving it dead.
                # `ai-rejected` + `ai-attempt-N` matches NO watchdog case
                # (Case 2 excludes any verdict label, Case 4 excludes PRs that
                # already have an attempt label), so dropping the verdict puts
                # it squarely in Case 2, which re-dispatches impl-repair at the
                # attempt number the label still encodes.
                # Retried too: this removal IS the hand-off to the watchdog, so
                # letting the same brown-out swallow it would leave the PR in
                # exactly the stranded state it is meant to escape.
                gh_retry "ai-rejected removal" gh pr edit "$PR_NUM" --remove-label "ai-rejected" \
                  || echo "::error::could not drop ai-rejected — PR #${PR_NUM} is stranded (ai-rejected + ai-attempt-N matches no watchdog case) and needs manual attention"
                echo "::error::impl-repair dispatch failed after 3 attempts — verdict label dropped so watchdog Case 2 picks PR #${PR_NUM} up"
                exit 1
              fi
            else
              # All 4 repair attempts exhausted
              echo "::notice::All 4 repair attempts exhausted (Score $SCORE < 50)"
              gh_retry "quality-poor label" gh pr edit "$PR_NUM" --add-label "quality-poor" || true

              # Is the pair live on main? Only a forced regeneration
              # (`regen:forced`) reaches the repair loop with an implementation
              # on main — every other regeneration goes through the regen gate.
              # That live implementation is fine; only its replacement failed,
              # so it stays, and the pair is never marked failed. (This path
              # used to delete it with `git push origin main`, which the main
              # ruleset refuses — the step died after closing the PR and the
              # issue never got its label.) If main cannot be read the answer
              # is unknown: neither terminal label (a fresh pair wrongly marked
              # done would drop out of gap backfill, a live one wrongly marked
              # failed would be regenerated), and the run ends red.
              IMPL_FILE="plots/${SPEC_ID}/implementations/${LANGUAGE}/${LIBRARY}${EXT}"
              RUN_URL="https://github.com/${REPOSITORY}/actions/runs/${RUN_ID}"
              IS_LIVE=unknown
              if GH_RETRY_LEVEL=warning gh_retry "git fetch origin main" git fetch -q origin main; then
                if git cat-file -e "origin/main:${IMPL_FILE}" 2>/dev/null; then
                  IS_LIVE=true
                else
                  IS_LIVE=false
                fi
              else
                echo "::warning::origin/main unavailable — cannot tell whether ${LIBRARY}/${SPEC_ID} is live; no terminal label"
              fi
              echo "::notice::Implementation live on main: ${IS_LIVE}"
              case "$IS_LIVE" in
                true) OUTCOME="The PR is closed. The implementation on main is unchanged and stays live." ;;
                false) OUTCOME="The PR is closed and the pair is marked \`impl:${LIBRARY}:failed\`." ;;
                *) OUTCOME="The PR is closed. Whether an implementation is live on main could not be read, so the issue is left for manual attention." ;;
              esac

              # Unquoted delimiter so $SCORE/$LIBRARY/$REPOSITORY/$RUN_ID expand
              # — with <<'EOF' this comment rendered a literal "$SCORE/100".
              # The markdown code span's backticks MUST stay escaped: in an
              # unquoted heredoc they would otherwise run as command
              # substitution. Expanding the variables is safe even though
              # $LIBRARY derives from a branch name, because bash does not
              # re-evaluate substituted values.
              # Rendered to a file and posted through gh_retry: a failed comment
              # must not stop the close and the issue bookkeeping below.
              FAILED=0
              cat > /tmp/anyplot-exhausted.md <<EOF
          ## AI Review - Final Status

          ### Score: $SCORE/100 (Below Threshold)

          After **4 repair attempts**, the score ($SCORE) is still below the minimum acceptable threshold of 50.

          **This is treated like an auto-reject.** $OUTCOME

          **Options:**
          1. Regenerate from scratch with \`generate:$LIBRARY\` label
          2. Manual complete rewrite

          ---
          :robot: *[impl-review](https://github.com/$REPOSITORY/actions/runs/$RUN_ID)*
          EOF
              gh_retry "final status PR comment" gh pr comment "$PR_NUM" --body-file /tmp/anyplot-exhausted.md || FAILED=1
              gh_retry "PR close" gh pr close "$PR_NUM" || FAILED=1

              if [ -n "$ISSUE_NUMBER" ]; then
                STALE_LABELS=("generate:${LIBRARY}" "impl:${LIBRARY}:pending")
                case "$IS_LIVE" in
                  true)
                    # The pair is done again (its live implementation): re-assert
                    # done FIRST, then drop the labels that say it is in flight.
                    gh label create "impl:${LIBRARY}:done" --color "0e8a16" --description "${LIBRARY} implementation merged" 2>/dev/null || true
                    gh_retry "impl:${LIBRARY}:done" gh issue edit "$ISSUE_NUMBER" --add-label "impl:${LIBRARY}:done" || FAILED=1
                    STALE_LABELS+=("impl:${LIBRARY}:failed" "watchdog:retried-${LIBRARY}")
                    ISSUE_TEXT="**${LIBRARY}** replacement: score ${SCORE}/100 after 4 repair attempts (< 50 = rejected). PR #${PR_NUM} closed; the implementation on main is unchanged and stays live."
                    ;;
                  false)
                    gh label create "impl:${LIBRARY}:failed" --color "d73a4a" --description "${LIBRARY} implementation failed" 2>/dev/null || true
                    gh_retry "impl:${LIBRARY}:failed" gh issue edit "$ISSUE_NUMBER" --add-label "impl:${LIBRARY}:failed" || FAILED=1
                    ISSUE_TEXT="**${LIBRARY}** implementation: score ${SCORE}/100 after 4 repair attempts (< 50 = rejected). PR #${PR_NUM} closed."
                    ;;
                  *)
                    FAILED=1
                    ISSUE_TEXT="**${LIBRARY}**: score ${SCORE}/100 after 4 repair attempts (< 50 = rejected). PR #${PR_NUM} closed. Whether an implementation is live on main could not be read, so no \`impl:${LIBRARY}:done\` or \`impl:${LIBRARY}:failed\` label was set: check main and set the right one ([impl-review](${RUN_URL}))."
                    ;;
                esac
                # One label per call: a name `gh` cannot resolve fails a whole
                # comma-separated edit. Only labels the issue carries are
                # removed, so a failed removal is a real API error and turns
                # the run red: a left-over `generate:`/`pending` label lets the
                # watchdog re-dispatch a pair that was just finalized. Read
                # with its own loop: gh_retry's warnings go to stdout.
                PRESENT=""
                PRESENT_OK=0
                for attempt in 1 2 3; do
                  if PRESENT=$(gh issue view "$ISSUE_NUMBER" --json labels -q '.labels[].name' 2> /tmp/labels.err); then
                    PRESENT_OK=1
                    break
                  fi
                  echo "::warning::gh issue view (labels) failed (attempt ${attempt}/3): $(head -c 500 /tmp/labels.err | tr '\n' ' ')"
                  [ "$attempt" -lt 3 ] && sleep $((attempt * 5))
                done
                if [ "$PRESENT_OK" -ne 1 ]; then
                  echo "::error::Could not read labels of issue #${ISSUE_NUMBER} — stale labels (${STALE_LABELS[*]}) may be left"
                  FAILED=1
                fi
                for stale in "${STALE_LABELS[@]}"; do
                  if [ "$PRESENT_OK" -ne 1 ]; then
                    # Blind best effort; the run is already red.
                    GH_RETRY_LEVEL=warning gh_retry "remove ${stale}" gh issue edit "$ISSUE_NUMBER" --remove-label "$stale" || true
                  elif echo "$PRESENT" | grep -qxF "$stale"; then
                    gh_retry "remove ${stale}" gh issue edit "$ISSUE_NUMBER" --remove-label "$stale" || FAILED=1
                  fi
                done
                gh_retry "issue comment" gh issue comment "$ISSUE_NUMBER" --body "$ISSUE_TEXT" || FAILED=1

                if [ "$IS_LIVE" = "true" ]; then
                  # Same as a kept regeneration: the pair is done again, so the
                  # issue may be complete.
                  LIBRARIES=$(python3 -c "from core.constants import SUPPORTED_LIBRARIES; print(' '.join(sorted(SUPPORTED_LIBRARIES)))" 2>/dev/null || echo "")
                  if [ -n "$LIBRARIES" ]; then
                    python3 "$RUNNER_TEMP/regen-tools/close_issue_if_complete.py" \
                      --issue "$ISSUE_NUMBER" --spec-id "$SPEC_ID" --libraries "$LIBRARIES" \
                      --run-url "$RUN_URL" --source impl-review || true
                  else
                    echo "::warning::Could not read SUPPORTED_LIBRARIES — issue #${ISSUE_NUMBER} left open"
                  fi
                fi
              fi

              if [ "$FAILED" -ne 0 ]; then
                echo "::error::Repair exhaustion of PR #${PR_NUM}: some bookkeeping calls failed (see warnings above)"
                exit 1
              fi
            fi
            exit 0
          fi

          # Labels read fine but carry no verdict — "Add preliminary verdict
          # label (early)" must have been skipped or its write lost. Nothing
          # downstream listens for this state, so say so loudly instead of
          # ending the step green with the PR quietly parked.
          echo "::error::PR #${PR_NUM} has neither ai-approved nor ai-rejected after review (score $SCORE, threshold $THRESHOLD) — no downstream workflow was triggered"
          exit 1
