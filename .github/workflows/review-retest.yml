name: "Review: Retest"
run-name: "Retest: ${{ inputs.label || 'unlabelled' }} · set ${{ inputs.set || 'v1' }} · ${{ inputs.subset }} · rules ${{ inputs.rules_ref || github.sha }}"

# Re-runs the AI quality review on the frozen retest set (automation/retest/)
# several times per item, so a change to the review rubric or the review model
# can be measured as an arm against a baseline before it merges. Opt-in and
# measurement-only: dispatch-only, read-only tokens, no GCP credentials, and
# nothing is written to a PR, an issue, a label, plots/ or another workflow.
# How to run and read it: docs/workflows/review-retest.md.
#
#   gh workflow run review-retest.yml -f rules_ref=<sha> -f label=baseline
#   gh workflow run review-retest.yml -f set=v2 -f rules_ref=<sha> -f label=v2-baseline
#   gh workflow run review-retest.yml -f set=v3 -f rules_ref=<sha> -f label=v3-baseline
#
# An arm = rules_ref (whose prompts/ and regen_gate.py the reviewer uses) ×
# the harness at the dispatched commit, on one frozen set. Cells run in fresh
# sessions; the aggregate job writes the report and a PR-body snippet.

on:
  workflow_dispatch:
    inputs:
      rules_ref:
        description: "Commit or branch whose prompts/ and regen_gate.py the reviewer uses (default: the dispatched commit)"
        required: false
        default: ''
        type: string
      label:
        description: "Arm label for the report, e.g. baseline or p0-candidate"
        required: false
        default: ''
        type: string
      set:
        description: "Frozen set: automation/retest/set-<set>.yaml and its lock (v1 = 27 fresh items and 10 pairs, core 15 and 7; v2 = the 12 pairs of verification round 1; v3 = the 15 first generations of line-tanabe-sugano)"
        required: false
        default: 'v1'
        type: choice
        options:
          - v1
          - v2
          - v3
      subset:
        description: "core, full, or a comma-separated list of item ids from the chosen set's manifest"
        required: false
        default: 'core'
        type: string
      models:
        description: "production = every cell on Opus, as impl-review.yml reviews; or one model for every cell"
        required: false
        default: 'production'
        type: choice
        options:
          - production
          - sonnet
          - opus
      runs:
        description: "Sessions per item and order (1-10)"
        required: false
        default: '3'
        type: string
      orders:
        description: "Regen pairs: both orders (forward and reversed) or forward only"
        required: false
        default: 'both'
        type: choice
        options:
          - both
          - forward
      spec_source:
        description: "pinned = spec text at the set's spec_commit; rules_ref = the spec text at rules_ref"
        required: false
        default: 'pinned'
        type: choice
        options:
          - pinned
          - rules_ref
      compare_to:
        description: "Run ID of an earlier retest to compare against (baseline arm)"
        required: false
        default: ''
        type: string
      resume_from:
        description: "Run ID of an incomplete retest whose successful cells are reused"
        required: false
        default: ''
        type: string
      max_parallel:
        description: "Concurrent review sessions (shares the Claude usage window with the pipeline)"
        required: false
        default: '6'
        type: string

permissions: {}

env:
  # Keep in sync with the claude-code-action pin in the review job (a test
  # checks it). Cells record it, and plan reuses a resumed cell only when it
  # matches.
  ACTION_SHA: d70510b174a1244958df0b03166a54912811f3e6

concurrency:
  group: review-retest
  cancel-in-progress: false

jobs:
  prep:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read  # idle check (gh run list) and resume_from's artifacts
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      sessions: ${{ steps.plan.outputs.sessions }}
      resumed: ${{ steps.plan.outputs.resumed }}
      rules_sha: ${{ steps.rules.outputs.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # review_retest, review_provenance and regen_gate use PEP 758 `except A, B:`,
      # which parses on Python 3.14 only; the runner image's python3 is not pinned.
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version-file: '.python-version'

      - name: Resolve rules_ref
        id: rules
        env:
          RULES_REF: ${{ inputs.rules_ref }}
        run: |
          REF="${RULES_REF:-$GITHUB_SHA}"
          if SHA=$(git rev-parse -q --verify "${REF}^{commit}"); then
            :
          elif SHA=$(git rev-parse -q --verify "origin/${REF}^{commit}"); then
            :
          else
            echo "::error::rules_ref '${REF}' is neither a commit nor a branch of this repository"
            exit 1
          fi
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "::notice::rules under test: ${SHA} · harness: ${GITHUB_SHA}"

      - name: Fetch the run to resume
        if: inputs.resume_from != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: retest-report
          run-id: ${{ inputs.resume_from }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/resume

      - name: Install helper dependencies
        run: pip install --quiet pyyaml

      # Refuses (fails the run) when the set is not frozen, over 240 sessions,
      # while the production pipeline is busy, or for regen cells on rules
      # that predate the gate's --omit-scores. A resumed cell is reused only
      # when its record matches this arm (set, harness version, action pin,
      # rules commit, spec source, model); the others run again, with a warning.
      - name: Plan
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SET: ${{ inputs.set || 'v1' }}
          SUBSET: ${{ inputs.subset }}
          MODELS: ${{ inputs.models }}
          RUNS: ${{ inputs.runs }}
          ORDERS: ${{ inputs.orders }}
          SPEC_SOURCE: ${{ inputs.spec_source }}
          RULES_SHA: ${{ steps.rules.outputs.sha }}
          RESUME_FROM: ${{ inputs.resume_from }}
        run: |
          RESUME=()
          if [ -n "$RESUME_FROM" ]; then
            RESUME=(--resume-records "$RUNNER_TEMP/resume/records.jsonl")
          fi
          python3 -m automation.scripts.review_retest plan \
            --manifest "automation/retest/set-${SET}.yaml" --lock "automation/retest/set-${SET}.lock.json" \
            --subset "$SUBSET" --models "$MODELS" --runs "$RUNS" --orders "$ORDERS" \
            --rules-sha "$RULES_SHA" --action-sha "$ACTION_SHA" --spec-source "$SPEC_SOURCE" \
            --repo . "${RESUME[@]}"

      - name: Bundle pinned sources and frozen renders
        if: steps.plan.outputs.sessions != '0'
        env:
          SET: ${{ inputs.set || 'v1' }}
          ITEMS: ${{ steps.plan.outputs.items }}
        run: |
          python3 -m automation.scripts.review_retest bundle \
            --manifest "automation/retest/set-${SET}.yaml" --lock "automation/retest/set-${SET}.lock.json" \
            --items "$ITEMS" --repo . --out "$RUNNER_TEMP/bundles"

      - name: Upload bundles
        if: steps.plan.outputs.sessions != '0'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: retest-bundles
          path: ${{ runner.temp }}/bundles
          retention-days: 3
          if-no-files-found: error
          overwrite: true  # artifacts are per run, not per attempt: a re-run replaces them

  review:
    name: ${{ matrix.cell.id }}
    needs: prep
    if: needs.prep.outputs.sessions != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Read-only and no id-token: the action cannot mint the Claude GitHub App
    # token, so a session has no way to write to the repository.
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.max_parallel) }}
      matrix:
        cell: ${{ fromJSON(needs.prep.outputs.matrix) }}
    env:
      CELL_JSON: ${{ toJSON(matrix.cell) }}
      RULES_SHA: ${{ needs.prep.outputs.rules_sha }}
    steps:
      # Claude credentials: the repository variable CLAUDE_AUTH picks one mode
      # per run, and every Claude step below reads this step's outputs, so a
      # new mode changes only this step. Unset or `subscription`:
      # CLAUDE_CODE_OAUTH_TOKEN, as before; `api`: ANTHROPIC_API_KEY; `oidc`:
      # workload identity federation with the four CLAUDE_WIF_* variables,
      # which needs `id-token: write` on the job. Each Claude step gets
      # exactly one credential. An unknown value, or a mode whose credential
      # is missing, stops the job here, never a silent fallback to the
      # subscription. Identical in every job that runs Claude
      # (tests/unit/workflows/test_claude_auth.py);
      # docs/workflows/overview.md#claude-credentials.
      # This job has no id-token on purpose (no session gets a token for the
      # federation or Google Cloud): under `oidc` it runs on the
      # subscription, logged in the job summary.
      - name: Resolve Claude credentials
        id: claude_auth
        env:
          CLAUDE_AUTH: ${{ vars.CLAUDE_AUTH }}
          API_KEY_SET: ${{ secrets.ANTHROPIC_API_KEY != '' }}
          OAUTH_TOKEN_SET: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
          WIF_RULE_ID: ${{ vars.CLAUDE_WIF_RULE_ID }}
          WIF_ORG_ID: ${{ vars.CLAUDE_WIF_ORG_ID }}
          WIF_SERVICE_ACCOUNT_ID: ${{ vars.CLAUDE_WIF_SERVICE_ACCOUNT_ID }}
          WIF_WORKSPACE_ID: ${{ vars.CLAUDE_WIF_WORKSPACE_ID }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          fail() { echo "::error::$1; not falling back to the subscription"; exit 1; }
          mode="${CLAUDE_AUTH,,}"
          case "$mode" in
            ''|subscription) mode=subscription ;;
            api) [ "$API_KEY_SET" = "true" ] || fail "CLAUDE_AUTH is 'api' but the ANTHROPIC_API_KEY secret is missing" ;;
            oidc)
              # The federation rule accepts only `…:ref:refs/heads/main`. A
              # pull-request event (`…:pull_request`), another ref, and a job
              # without id-token run on the subscription instead, by design
              # and logged, never on an error.
              if [[ "$EVENT" == pull_request* || "$REF" != "refs/heads/main" || -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]]; then
                where="${EVENT}/${REF//[^A-Za-z0-9\/._-]/?}$([ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] || echo ' (no id-token)')"
                if [ "$OAUTH_TOKEN_SET" != "true" ]; then
                  echo "::error::oidc not available for ${where}, and the CLAUDE_CODE_OAUTH_TOKEN secret is missing"
                  exit 1
                fi
                echo "::notice::oidc not available for ${where}; using subscription"
                echo "- oidc not available for ${where}; using subscription" >> "$GITHUB_STEP_SUMMARY"
                mode=subscription
              else
                for name in WIF_RULE_ID WIF_ORG_ID WIF_SERVICE_ACCOUNT_ID WIF_WORKSPACE_ID; do
                  [[ "${!name}" =~ ^[A-Za-z0-9_-]+$ ]] || fail "CLAUDE_AUTH is 'oidc' but the variable CLAUDE_${name} is missing or not an ID"
                done
                {
                  echo "federation_rule_id=$WIF_RULE_ID"
                  echo "organization_id=$WIF_ORG_ID"
                  echo "service_account_id=$WIF_SERVICE_ACCOUNT_ID"
                  echo "workspace_id=$WIF_WORKSPACE_ID"
                } >> "$GITHUB_OUTPUT"
              fi ;;
            *) fail "CLAUDE_AUTH must be unset, 'subscription', 'api' or 'oidc', got '${CLAUDE_AUTH//[^A-Za-z0-9 ._-]/?}'" ;;
          esac
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "Claude credentials: $mode"

      - name: Checkout harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version-file: '.python-version'

      # The harness runs from a copy outside the workspace: the next step
      # overlays prompts/ and regen_gate.py from the rules under test.
      - name: Copy the harness out of the workspace
        run: |
          mkdir -p "$RUNNER_TEMP/harness/automation"
          cp automation/__init__.py "$RUNNER_TEMP/harness/automation/"
          cp -r automation/scripts automation/retest "$RUNNER_TEMP/harness/automation/"
          echo "HARNESS=$RUNNER_TEMP/harness" >> "$GITHUB_ENV"

      # The same overlay impl-review applies on a branch dispatch, except that
      # prompts/ is replaced whole, so no file from the harness commit lingers.
      # Shallow on purpose: the reviewer cannot look anything up in history.
      # regen_gate.py exists from 02e1a7974 on; plan refuses regen cells on
      # older rules and a fresh cell never calls it, so such rules get none.
      - name: Overlay the rules under test
        env:
          SPEC_SOURCE: ${{ inputs.spec_source }}
          SPEC_ID: ${{ matrix.cell.spec_id }}
        run: |
          git fetch -q --depth=1 origin "$RULES_SHA"
          rm -rf prompts automation/scripts/regen_gate.py
          git checkout FETCH_HEAD -- prompts/
          if git cat-file -e FETCH_HEAD:automation/scripts/regen_gate.py 2>/dev/null; then
            git checkout FETCH_HEAD -- automation/scripts/regen_gate.py
          fi
          if [ "$SPEC_SOURCE" = "rules_ref" ]; then
            git checkout FETCH_HEAD -- "plots/${SPEC_ID}/specification.md"
            git checkout FETCH_HEAD -- "plots/${SPEC_ID}/specification.yaml" 2>/dev/null || true
          fi
          git reset -q
          echo "::notice::rules ${RULES_SHA} over harness ${GITHUB_SHA}"

      - name: Download bundles
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: retest-bundles
          path: ${{ runner.temp }}/bundles

      - name: Install helper dependencies
        run: pip install --quiet pyyaml

      - name: Materialize the cell
        id: cell
        env:
          SPEC_SOURCE: ${{ inputs.spec_source }}
        run: |
          cd "$HARNESS"
          python3 -m automation.scripts.review_retest materialize \
            --workspace "$GITHUB_WORKSPACE" --bundles "$RUNNER_TEMP/bundles" --cell "$CELL_JSON" \
            --gate-script "$GITHUB_WORKSPACE/automation/scripts/regen_gate.py" --spec-source "$SPEC_SOURCE"

      - name: Record rules version
        id: rules
        continue-on-error: true
        env:
          LIBRARY: ${{ matrix.cell.library }}
        run: |
          python3 "$HARNESS/automation/scripts/review_provenance.py" criteria-version \
            --root "$GITHUB_WORKSPACE" --library "$LIBRARY"

      # The prompt is impl-review.yml's, variable for variable (a test checks
      # the names), plus the three-line addendum for the missing PR.
      - name: Run AI Quality Review
        id: review
        if: steps.cell.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 25
        uses: anthropics/claude-code-action@d70510b174a1244958df0b03166a54912811f3e6  # v1
        env:
          LIBRARY: ${{ matrix.cell.library }}
          SPEC_ID: ${{ matrix.cell.spec_id }}
          PR_NUMBER: '0'
          ATTEMPT: '1'
        with:
          anthropic_api_key: ${{ steps.claude_auth.outputs.mode == 'api' && secrets.ANTHROPIC_API_KEY || '' }}
          claude_code_oauth_token: ${{ steps.claude_auth.outputs.mode == 'subscription' && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
          anthropic_federation_rule_id: ${{ steps.claude_auth.outputs.federation_rule_id }}
          anthropic_organization_id: ${{ steps.claude_auth.outputs.organization_id }}
          anthropic_service_account_id: ${{ steps.claude_auth.outputs.service_account_id }}
          anthropic_workspace_id: ${{ steps.claude_auth.outputs.workspace_id }}
          github_token: ${{ github.token }}
          claude_args: "--model ${{ matrix.cell.model }} --settings ${{ github.workspace }}/automation/retest/claude-settings.json"
          prompt: |
            Read `prompts/workflow-prompts/ai-quality-review.md` and follow those instructions.

            Variables for this run:
            - LIBRARY: ${{ matrix.cell.library }}
            - SPEC_ID: ${{ matrix.cell.spec_id }}
            - PR_NUMBER: 0
            - ATTEMPT: 1
            - LANGUAGE: ${{ steps.cell.outputs.language }}
            - EXT: ${{ steps.cell.outputs.ext }}
            - IS_REGENERATION: ${{ steps.cell.outputs.is_regen }}
            - PREV_RENDERS: ${{ steps.cell.outputs.prev_renders }}
            - PREV_RENDER_LIGHT: ${{ steps.cell.outputs.prev_light }}
            - PREV_RENDER_DARK: ${{ steps.cell.outputs.prev_dark }}
            - PREV_LINES: ${{ steps.cell.outputs.prev_lines }}
            - NEW_LINES: ${{ steps.cell.outputs.new_lines }}

            There is no pull request for this run. Wherever the instructions say to post a comment
            to the PR, write the exact comment body to `review_comment.md` in the repository root
            instead. Do not run `gh` or `git push`; every other instruction applies unchanged.

      # The session's cost (Claude Code's own estimate at API list price),
      # model and credential mode, and whether Claude stopped it: a spend or
      # usage limit, or refused credentials (outputs stopped, stop_reason).
      # Never fatal; a stopped cell is collected as a failed one.
      - name: Claude session summary
        id: review_cost
        if: ${{ !cancelled() && (steps.review.outcome == 'success' || steps.review.outcome == 'failure') }}
        continue-on-error: true
        env:
          EXECUTION_FILE: ${{ steps.review.outputs.execution_file }}
          CLAUDE_AUTH_MODE: ${{ steps.claude_auth.outputs.mode }}
          CLAUDE_STEP: review-retest
          # Only the error fields of a session that failed, because its own
          # text may quote the same messages: the error result, Claude Code's
          # error messages and its API retries, with their HTTP status.
          SESSION_ERRORS: >-
            ([.[] | select(.type == "result")] | last) as $result
            | if $result != null and $result.is_error != true then empty else
            (.[] | select((.type == "result" and .is_error == true) or (.type == "assistant" and .error != null) or (.type == "system" and .subtype == "api_retry"))
            | (.result // ""), ((.errors // [])[] | tostring), (.error // "" | tostring), (if .type == "assistant" then ((.message.content // [])[] | .text? // "") else "" end), (if (.api_error_status // .error_status) then "api_error_status=\(.api_error_status // .error_status)" else "" end))
            end
          # A spend or usage limit, in every mode: the API's spend-limit,
          # spend-cap and credit messages, Claude Code's billing_error and
          # credit message, and its subscription usage-limit messages (the
          # SDK's USAGE_LIMIT_ERROR_PREFIXES).
          LIMIT_PATTERN: >-
            reached your (specified )?(workspace )?API usage limits|enforced_spend_limit_reached|credit balance (is )?too low|billing_error|usage limit reached|You.{1,3}ve (hit|reached) your|You.{1,3}re out of (usage credits|extra usage)|Your org is out of usage|Your seat type doesn.{1,3}t include|Your usage allocation has been disabled|Your group.{1,3}s usage limit is set to \$0|requires usage credits
          # Refused credentials, with api and oidc only (the subscription keeps
          # its handling): HTTP 401 or 403, the API's authentication_error and
          # permission_error, Claude Code's authentication_failed, a refused
          # federation exchange ("Authentication failed"), a bad API key.
          AUTH_PATTERN: >-
            authentication_error|authentication_failed|permission_error|Authentication failed|invalid x-api-key|account_on_hold|api_error_status=40[13]
        run: |
          cost=$(jq -r '[.[] | select(.type == "result")] | last | .total_cost_usd // empty' "$EXECUTION_FILE" 2>/dev/null || true)
          model=$(jq -r '[.[] | select(.type == "system" and .subtype == "init")] | first | .model // empty' "$EXECUTION_FILE" 2>/dev/null || true)
          line="claude-cost step=${CLAUDE_STEP} auth=${CLAUDE_AUTH_MODE} model=${model:-n/a} total_cost_usd=${cost:-n/a}"
          echo "$line"
          echo "- \`${line}\`" >> "$GITHUB_STEP_SUMMARY"
          errors=$(jq -r "$SESSION_ERRORS" "$EXECUTION_FILE" 2>/dev/null || true)
          reason=""
          if grep -qiE "$LIMIT_PATTERN" <<< "$errors"; then
            reason=limit
            what="Claude spend/usage limit reached"
          elif [[ "$CLAUDE_AUTH_MODE" =~ ^(api|oidc)$ ]] && grep -qiE "$AUTH_PATTERN" <<< "$errors"; then
            reason=auth
            what="Claude credentials refused"
          fi
          if [ -n "$reason" ]; then
            echo "::error::${what} (auth=${CLAUDE_AUTH_MODE}) in ${CLAUDE_STEP}: no retry until it is resolved"
            echo "- **${what} (auth=${CLAUDE_AUTH_MODE})** in \`${CLAUDE_STEP}\`" >> "$GITHUB_STEP_SUMMARY"
            echo "stopped=true" >> "$GITHUB_OUTPUT"
          else
            echo "stopped=false" >> "$GITHUB_OUTPUT"
          fi
          echo "stop_reason=${reason}" >> "$GITHUB_OUTPUT"

      - name: Collect the cell
        if: always()
        env:
          EXECUTION_FILE: ${{ steps.review.outputs.execution_file }}
          REVIEW_OUTCOME: ${{ steps.review.outcome }}
          MATERIALIZE_OUTCOME: ${{ steps.cell.outcome }}
          PREV_STORED: ${{ steps.cell.outputs.prev_stored }}
          STARTED_AT: ${{ steps.cell.outputs.started_at }}
          CRITERIA_VERSION: ${{ steps.rules.outputs.criteria_version }}
          PROMPTS_TREE: ${{ steps.rules.outputs.prompts_tree }}
          SPEC_SOURCE: ${{ inputs.spec_source }}
        run: |
          cd "$HARNESS"
          python3 -m automation.scripts.review_retest collect \
            --workspace "$GITHUB_WORKSPACE" --cell "$CELL_JSON" --out "$RUNNER_TEMP/cell" \
            --execution-file "${EXECUTION_FILE:-}" --review-outcome "${REVIEW_OUTCOME:-skipped}" \
            --materialize-outcome "${MATERIALIZE_OUTCOME:-skipped}" \
            --gate-script "$GITHUB_WORKSPACE/automation/scripts/regen_gate.py" \
            --prev-stored "${PREV_STORED:-n/a}" --started-at "${STARTED_AT:-0}" --timeout-minutes 25 \
            --criteria-version "${CRITERIA_VERSION:-n/a}" --prompts-tree "${PROMPTS_TREE:-n/a}" \
            --harness-sha "$GITHUB_SHA" --rules-sha "$RULES_SHA" --action-sha "$ACTION_SHA" \
            --spec-source "$SPEC_SOURCE"

      - name: Upload the cell
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: cell-${{ matrix.cell.id }}
          path: ${{ runner.temp }}/cell
          retention-days: 90
          if-no-files-found: warn
          overwrite: true  # "Re-run failed jobs" keeps the earlier attempt's cell artifact

  aggregate:
    needs: [prep, review]
    if: always() && needs.prep.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read  # compare_to / resume_from artifacts of earlier runs
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version-file: '.python-version'

      - name: Download cells
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: cell-*
          path: ${{ runner.temp }}/cells

      - name: Download the baseline arm
        if: inputs.compare_to != ''
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: retest-report
          run-id: ${{ inputs.compare_to }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/compare

      - name: Download the resumed run
        if: inputs.resume_from != ''
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: retest-report
          run-id: ${{ inputs.resume_from }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/resume

      - name: Install helper dependencies
        run: pip install --quiet pyyaml

      - name: Report
        env:
          LABEL: ${{ inputs.label }}
          SET: ${{ inputs.set || 'v1' }}
          SUBSET: ${{ inputs.subset }}
          RULES_SHA: ${{ needs.prep.outputs.rules_sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMPARE_TO: ${{ inputs.compare_to }}
          RESUME_FROM: ${{ inputs.resume_from }}
          RESUMED: ${{ needs.prep.outputs.resumed }}
        run: |
          mkdir -p "$RUNNER_TEMP/cells"
          EXTRA=()
          if [ -n "$COMPARE_TO" ] && [ -f "$RUNNER_TEMP/compare/records.jsonl" ]; then
            EXTRA+=(--compare-records "$RUNNER_TEMP/compare/records.jsonl")
          fi
          # Only the cells plan reused; a record it rejected ran again.
          if [ -n "$RESUME_FROM" ] && [ -f "$RUNNER_TEMP/resume/records.jsonl" ]; then
            EXTRA+=(--resume-records "$RUNNER_TEMP/resume/records.jsonl" --resumed-cells "$RESUMED")
          fi
          python3 -m automation.scripts.review_retest report \
            --manifest "automation/retest/set-${SET}.yaml" --lock "automation/retest/set-${SET}.lock.json" \
            --cells "$RUNNER_TEMP/cells" --out "$RUNNER_TEMP/report" \
            --label "$LABEL" --subset "$SUBSET" --rules-sha "$RULES_SHA" --harness-sha "$GITHUB_SHA" \
            --run-url "$RUN_URL" "${EXTRA[@]}"
          cat "$RUNNER_TEMP/report/retest-report.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: retest-report
          path: ${{ runner.temp }}/report
          retention-days: 90
          if-no-files-found: error
          overwrite: true
