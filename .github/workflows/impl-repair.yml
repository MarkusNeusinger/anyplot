name: "Impl: Repair"
run-name: "Repair: ${{ inputs.library }} for ${{ inputs.specification_id }} (attempt ${{ inputs.attempt }})"

# Repairs a rejected implementation based on AI feedback
# Triggered by impl-review.yml when ai-rejected label is added

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to repair"
        required: true
        type: string
      specification_id:
        description: "The specification ID"
        required: true
        type: string
      library:
        description: "The library to repair"
        required: true
        type: string
      attempt:
        description: "Current attempt number (1, 2, 3, or 4)"
        required: true
        type: string
      model:
        description: "Repair (generation) model; auto = the PR body's **Model:** line, else opus while the pair has no implementation on main, else sonnet. The review it re-triggers runs on opus."
        required: false
        type: choice
        default: 'auto'
        options:
          - auto
          - haiku
          - sonnet
          - opus

# Per-library deps now come from `pyproject.toml` `lib-{library}` extras
# (single source of truth — same change as impl-generate.yml).

concurrency:
  group: impl-repair-${{ inputs.pr_number || github.ref }}
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
      id-token: write

    steps:
      # Claude credentials: the repository variable CLAUDE_AUTH picks one mode
      # per run, and every Claude step below reads this step's outputs, so a
      # new mode changes only this step. Unset or `subscription`:
      # CLAUDE_CODE_OAUTH_TOKEN, as before; `api`: ANTHROPIC_API_KEY; `oidc`:
      # workload identity federation with the four CLAUDE_WIF_* variables,
      # which needs `id-token: write` on the job. Each Claude step gets
      # exactly one credential. An unknown value, or a mode whose credential
      # is missing, stops the job here, never a silent fallback to the
      # subscription. Identical in every job that runs Claude
      # (tests/unit/workflows/test_claude_auth.py);
      # docs/workflows/overview.md#claude-credentials.
      - name: Resolve Claude credentials
        id: claude_auth
        env:
          CLAUDE_AUTH: ${{ vars.CLAUDE_AUTH }}
          API_KEY_SET: ${{ secrets.ANTHROPIC_API_KEY != '' }}
          OAUTH_TOKEN_SET: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
          WIF_RULE_ID: ${{ vars.CLAUDE_WIF_RULE_ID }}
          WIF_ORG_ID: ${{ vars.CLAUDE_WIF_ORG_ID }}
          WIF_SERVICE_ACCOUNT_ID: ${{ vars.CLAUDE_WIF_SERVICE_ACCOUNT_ID }}
          WIF_WORKSPACE_ID: ${{ vars.CLAUDE_WIF_WORKSPACE_ID }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          fail() { echo "::error::$1; not falling back to the subscription"; exit 1; }
          mode="${CLAUDE_AUTH,,}"
          case "$mode" in
            ''|subscription) mode=subscription ;;
            api) [ "$API_KEY_SET" = "true" ] || fail "CLAUDE_AUTH is 'api' but the ANTHROPIC_API_KEY secret is missing" ;;
            oidc)
              # The federation rule accepts only `…:ref:refs/heads/main`. A
              # pull-request event (`…:pull_request`), another ref, and a job
              # without id-token run on the subscription instead, by design
              # and logged, never on an error.
              if [[ "$EVENT" == pull_request* || "$REF" != "refs/heads/main" || -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]]; then
                where="${EVENT}/${REF//[^A-Za-z0-9\/._-]/?}$([ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] || echo ' (no id-token)')"
                if [ "$OAUTH_TOKEN_SET" != "true" ]; then
                  echo "::error::oidc not available for ${where}, and the CLAUDE_CODE_OAUTH_TOKEN secret is missing"
                  exit 1
                fi
                echo "::notice::oidc not available for ${where}; using subscription"
                echo "- oidc not available for ${where}; using subscription" >> "$GITHUB_STEP_SUMMARY"
                mode=subscription
              else
                for name in WIF_RULE_ID WIF_ORG_ID WIF_SERVICE_ACCOUNT_ID WIF_WORKSPACE_ID; do
                  [[ "${!name}" =~ ^[A-Za-z0-9_-]+$ ]] || fail "CLAUDE_AUTH is 'oidc' but the variable CLAUDE_${name} is missing or not an ID"
                done
                {
                  echo "federation_rule_id=$WIF_RULE_ID"
                  echo "organization_id=$WIF_ORG_ID"
                  echo "service_account_id=$WIF_SERVICE_ACCOUNT_ID"
                  echo "workspace_id=$WIF_WORKSPACE_ID"
                } >> "$GITHUB_OUTPUT"
              fi ;;
            *) fail "CLAUDE_AUTH must be unset, 'subscription', 'api' or 'oidc', got '${CLAUDE_AUTH//[^A-Za-z0-9 ._-]/?}'" ;;
          esac
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "Claude credentials: $mode"

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Checkout PR branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH=$(gh pr view ${{ inputs.pr_number }} --json headRefName -q '.headRefName')
          echo "branch=$BRANCH" >> $GITHUB_ENV
          git fetch origin "$BRANCH"
          git checkout "$BRANCH"

      - name: Derive language + extension from library
        id: lang
        env:
          LIBRARY: ${{ inputs.library }}
        run: |
          case "$LIBRARY" in
            ggplot2)
              LANGUAGE="r"
              EXT=".R"
              ;;
            makie)
              LANGUAGE="julia"
              EXT=".jl"
              ;;
            chartjs|d3|echarts|highcharts)
              LANGUAGE="javascript"
              EXT=".js"
              ;;
            muix)
              # MUI X — JavaScript with framework=react, authored as TSX and
              # bundled through the render harness's esbuild React branch.
              LANGUAGE="javascript"
              EXT=".tsx"
              ;;
            *)
              LANGUAGE="python"
              EXT=".py"
              ;;
          esac
          echo "language=$LANGUAGE" >> $GITHUB_OUTPUT
          echo "ext=$EXT"           >> $GITHUB_OUTPUT
          echo "::notice::Repair: $LANGUAGE/$LIBRARY (ext: $EXT)"

      - name: Resolve model
        id: model
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ inputs.pr_number }}
          MODEL_INPUT: ${{ inputs.model }}
          SPEC_ID: ${{ inputs.specification_id }}
          LIBRARY: ${{ inputs.library }}
          LANGUAGE: ${{ steps.lang.outputs.language }}
          EXT: ${{ steps.lang.outputs.ext }}
        run: |
          # The generation model, which repair runs on and hands back to the
          # review it re-triggers (that review itself runs on opus, from
          # impl-review.yml's review_model; this value only travels on to the
          # next repair). impl-review always forwards the generation model it
          # resolved. "auto" (the dispatch default) comes from rescues that
          # carry none (the watchdog's repair re-dispatches, a manual
          # restart). They take the model impl-generate recorded in the PR
          # body ("**Model:**"), so an explicit pin survives; only a PR
          # without that line routes like impl-generate — opus while the pair
          # has no implementation on origin/main yet (its first run), sonnet
          # for a regeneration.
          MODEL="${MODEL_INPUT:-auto}"
          MODEL_FROM="input"
          if [ "$MODEL" = "auto" ]; then
            # Same retry shape as impl-review's "Extract PR info": three
            # attempts with linear backoff (5 s, 10 s). A failed lookup must
            # not pass for "no Model line" and silently reroute a pinned
            # model, so fail closed once the attempts are spent.
            BODY=""
            LOOKUP_OK=""
            for attempt in 1 2 3; do
              if BODY=$(gh pr view "$PR_NUMBER" --json body -q .body 2> /tmp/pr-body.err); then
                LOOKUP_OK=1
                break
              fi
              PERR=$(head -c 500 /tmp/pr-body.err | tr '\n' ' ')
              echo "::warning::gh pr view failed (attempt ${attempt}/3): ${PERR}"
              if [ "$attempt" -lt 3 ]; then
                sleep $((attempt * 5))
              fi
            done
            if [ -z "$LOOKUP_OK" ]; then
              echo "::error::gh pr view failed after 3 attempts for PR #${PR_NUMBER} — cannot read the PR's recorded model"
              exit 1
            fi
            MODEL_BODY=$(echo "$BODY" | tr -d '\r' | grep -oP '^\*\*Model:\*\* \K(haiku|sonnet|opus)$' | head -1 || true)
            MODEL="${MODEL_BODY:-auto}"
            MODEL_FROM="PR body"
          fi
          if [ "$MODEL" = "auto" ]; then
            MODEL_FROM="routing"
            if git rev-parse -q --verify origin/main >/dev/null \
               || git fetch -q origin +refs/heads/main:refs/remotes/origin/main; then
              if git cat-file -e "origin/main:plots/$SPEC_ID/implementations/$LANGUAGE/$LIBRARY$EXT" 2>/dev/null; then
                MODEL="sonnet"
              else
                MODEL="opus"
              fi
            else
              echo "::warning::origin/main unavailable — routing assumes a first run (opus)"
              MODEL="opus"
            fi
          fi
          echo "model=$MODEL" >> "$GITHUB_OUTPUT"
          echo "::notice::Repair model: $MODEL (from $MODEL_FROM)"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0

      - name: Install Python plotting dependencies
        if: steps.lang.outputs.language == 'python'
        env:
          LIBRARY: ${{ inputs.library }}
        run: |
          # The lib-${LIBRARY} extra exactly as uv.lock pins it, as impl-generate.yml
          # installs it (see the comment there). Creates .venv.
          uv sync --frozen --extra "lib-${LIBRARY}" --extra dev

      - name: Install Python helper deps (for non-Python implementations)
        if: steps.lang.outputs.language != 'python'
        run: |
          uv venv .venv
          source .venv/bin/activate
          uv pip install pillow pyyaml

      - name: Setup R + ggplot2
        if: steps.lang.outputs.language == 'r'
        uses: ./.github/actions/setup-r

      - name: Setup Julia + Makie
        if: steps.lang.outputs.language == 'julia'
        uses: ./.github/actions/setup-julia

      - name: Setup Node + browser render harness
        if: steps.lang.outputs.language == 'javascript'
        uses: ./.github/actions/setup-node

      - name: Extract AI feedback from PR
        id: feedback
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FEEDBACK=$(gh pr view ${{ inputs.pr_number }} --json comments -q '
            [.comments[] | select(.body | contains("AI Review"))] | last | .body
          ' 2>/dev/null || echo "")

          if [ -z "$FEEDBACK" ]; then
            FEEDBACK="No specific feedback available. Review the implementation against the spec."
          fi

          echo "$FEEDBACK" > /tmp/ai_feedback.md

      # `ai-repair-paused` goes too: this run resumes a repair that Claude
      # stopped (a limit or refused credentials); the stop path puts it back
      # if Claude stops this one as well.
      - name: Remove ai-rejected label
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr edit ${{ inputs.pr_number }} --remove-label "ai-rejected" 2>/dev/null || true
          gh pr edit ${{ inputs.pr_number }} --remove-label "ai-repair-paused" 2>/dev/null || true

      - name: Run Claude Code to repair implementation
        id: claude
        continue-on-error: true
        timeout-minutes: 45
        uses: anthropics/claude-code-action@db77d4d3c98f3f6380e7cd45ffba2342a3dbde3c  # v1
        with:
          anthropic_api_key: ${{ steps.claude_auth.outputs.mode == 'api' && secrets.ANTHROPIC_API_KEY || '' }}
          claude_code_oauth_token: ${{ steps.claude_auth.outputs.mode == 'subscription' && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
          anthropic_federation_rule_id: ${{ steps.claude_auth.outputs.federation_rule_id }}
          anthropic_organization_id: ${{ steps.claude_auth.outputs.organization_id }}
          anthropic_service_account_id: ${{ steps.claude_auth.outputs.service_account_id }}
          anthropic_workspace_id: ${{ steps.claude_auth.outputs.workspace_id }}
          claude_args: "--model ${{ steps.model.outputs.model }} --settings ${{ github.workspace }}/.claude/settings.json"
          allowed_bots: '*'
          prompt: |
            Read `prompts/workflow-prompts/impl-repair-claude.md` and follow those instructions.

            Variables for this run:
            - LANGUAGE: ${{ steps.lang.outputs.language }}
            - LIBRARY: ${{ inputs.library }}
            - EXT: ${{ steps.lang.outputs.ext }}
            - SPEC_ID: ${{ inputs.specification_id }}
            - ATTEMPT: ${{ inputs.attempt }}
            - BRANCH: ${{ env.branch }}

      # The session's cost (Claude Code's own estimate at API list price),
      # model and credential mode, for the weekly regen review, and whether
      # Claude stopped it: a spend or usage limit, or refused credentials
      # (outputs stopped, stop_reason). Read right after the step: the retry
      # writes the same execution file. Never fatal.
      - name: Claude session summary
        id: claude_cost
        if: ${{ !cancelled() && (steps.claude.outcome == 'success' || steps.claude.outcome == 'failure') }}
        continue-on-error: true
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
          CLAUDE_AUTH_MODE: ${{ steps.claude_auth.outputs.mode }}
          CLAUDE_STEP: impl-repair
          # Only the error fields of a session that failed, because its own
          # text may quote the same messages: the error result, Claude Code's
          # error messages and its API retries, with their HTTP status.
          SESSION_ERRORS: >-
            ([.[] | select(.type == "result")] | last) as $result
            | if $result != null and $result.is_error != true then empty else
            (.[] | select((.type == "result" and .is_error == true) or (.type == "assistant" and .error != null) or (.type == "system" and .subtype == "api_retry"))
            | (.result // ""), ((.errors // [])[] | tostring), (.error // "" | tostring), (if .type == "assistant" then ((.message.content // [])[] | .text? // "") else "" end), (if (.api_error_status // .error_status) then "api_error_status=\(.api_error_status // .error_status)" else "" end))
            end
          # A spend or usage limit, in every mode: the API's spend-limit,
          # spend-cap and credit messages, Claude Code's billing_error and
          # credit message, and its subscription usage-limit messages (the
          # SDK's USAGE_LIMIT_ERROR_PREFIXES).
          LIMIT_PATTERN: >-
            reached your (specified )?(workspace )?API usage limits|enforced_spend_limit_reached|credit balance (is )?too low|billing_error|usage limit reached|You.{1,3}ve (hit|reached) your|You.{1,3}re out of (usage credits|extra usage)|Your org is out of usage|Your seat type doesn.{1,3}t include|Your usage allocation has been disabled|Your group.{1,3}s usage limit is set to \$0|requires usage credits
          # Refused credentials, with api and oidc only (the subscription keeps
          # its handling): HTTP 401 or 403, the API's authentication_error and
          # permission_error, Claude Code's authentication_failed, a refused
          # federation exchange ("Authentication failed"), a bad API key.
          AUTH_PATTERN: >-
            authentication_error|authentication_failed|permission_error|Authentication failed|invalid x-api-key|account_on_hold|api_error_status=40[13]
        run: |
          cost=$(jq -r '[.[] | select(.type == "result")] | last | .total_cost_usd // empty' "$EXECUTION_FILE" 2>/dev/null || true)
          model=$(jq -r '[.[] | select(.type == "system" and .subtype == "init")] | first | .model // empty' "$EXECUTION_FILE" 2>/dev/null || true)
          line="claude-cost step=${CLAUDE_STEP} auth=${CLAUDE_AUTH_MODE} model=${model:-n/a} total_cost_usd=${cost:-n/a}"
          echo "$line"
          echo "- \`${line}\`" >> "$GITHUB_STEP_SUMMARY"
          errors=$(jq -r "$SESSION_ERRORS" "$EXECUTION_FILE" 2>/dev/null || true)
          reason=""
          if grep -qiE "$LIMIT_PATTERN" <<< "$errors"; then
            reason=limit
            what="Claude spend/usage limit reached"
          elif [[ "$CLAUDE_AUTH_MODE" =~ ^(api|oidc)$ ]] && grep -qiE "$AUTH_PATTERN" <<< "$errors"; then
            reason=auth
            what="Claude credentials refused"
          fi
          if [ -n "$reason" ]; then
            echo "::error::${what} (auth=${CLAUDE_AUTH_MODE}) in ${CLAUDE_STEP}: no retry until it is resolved"
            echo "- **${what} (auth=${CLAUDE_AUTH_MODE})** in \`${CLAUDE_STEP}\`" >> "$GITHUB_STEP_SUMMARY"
            echo "stopped=true" >> "$GITHUB_OUTPUT"
          else
            echo "stopped=false" >> "$GITHUB_OUTPUT"
          fi
          echo "stop_reason=${reason}" >> "$GITHUB_OUTPUT"

      # Not after Claude stopped the session (a limit or refused credentials):
      # the retry would be refused the same way.
      - name: Retry Claude (on failure)
        if: steps.claude.outcome == 'failure' && steps.claude_cost.outputs.stopped != 'true'
        id: claude_retry
        timeout-minutes: 45
        uses: anthropics/claude-code-action@db77d4d3c98f3f6380e7cd45ffba2342a3dbde3c  # v1
        with:
          anthropic_api_key: ${{ steps.claude_auth.outputs.mode == 'api' && secrets.ANTHROPIC_API_KEY || '' }}
          claude_code_oauth_token: ${{ steps.claude_auth.outputs.mode == 'subscription' && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
          anthropic_federation_rule_id: ${{ steps.claude_auth.outputs.federation_rule_id }}
          anthropic_organization_id: ${{ steps.claude_auth.outputs.organization_id }}
          anthropic_service_account_id: ${{ steps.claude_auth.outputs.service_account_id }}
          anthropic_workspace_id: ${{ steps.claude_auth.outputs.workspace_id }}
          claude_args: "--model ${{ steps.model.outputs.model }} --settings ${{ github.workspace }}/.claude/settings.json"
          allowed_bots: '*'
          prompt: |
            Read `prompts/workflow-prompts/impl-repair-claude.md` and follow those instructions.

            Variables for this run:
            - LANGUAGE: ${{ steps.lang.outputs.language }}
            - LIBRARY: ${{ inputs.library }}
            - EXT: ${{ steps.lang.outputs.ext }}
            - SPEC_ID: ${{ inputs.specification_id }}
            - ATTEMPT: ${{ inputs.attempt }}
            - BRANCH: ${{ env.branch }}

      - name: Claude session summary (retry)
        id: claude_retry_cost
        if: ${{ !cancelled() && (steps.claude_retry.outcome == 'success' || steps.claude_retry.outcome == 'failure') }}
        continue-on-error: true
        env:
          EXECUTION_FILE: ${{ steps.claude_retry.outputs.execution_file }}
          CLAUDE_AUTH_MODE: ${{ steps.claude_auth.outputs.mode }}
          CLAUDE_STEP: impl-repair/retry
          # Only the error fields of a session that failed, because its own
          # text may quote the same messages: the error result, Claude Code's
          # error messages and its API retries, with their HTTP status.
          SESSION_ERRORS: >-
            ([.[] | select(.type == "result")] | last) as $result
            | if $result != null and $result.is_error != true then empty else
            (.[] | select((.type == "result" and .is_error == true) or (.type == "assistant" and .error != null) or (.type == "system" and .subtype == "api_retry"))
            | (.result // ""), ((.errors // [])[] | tostring), (.error // "" | tostring), (if .type == "assistant" then ((.message.content // [])[] | .text? // "") else "" end), (if (.api_error_status // .error_status) then "api_error_status=\(.api_error_status // .error_status)" else "" end))
            end
          # A spend or usage limit, in every mode: the API's spend-limit,
          # spend-cap and credit messages, Claude Code's billing_error and
          # credit message, and its subscription usage-limit messages (the
          # SDK's USAGE_LIMIT_ERROR_PREFIXES).
          LIMIT_PATTERN: >-
            reached your (specified )?(workspace )?API usage limits|enforced_spend_limit_reached|credit balance (is )?too low|billing_error|usage limit reached|You.{1,3}ve (hit|reached) your|You.{1,3}re out of (usage credits|extra usage)|Your org is out of usage|Your seat type doesn.{1,3}t include|Your usage allocation has been disabled|Your group.{1,3}s usage limit is set to \$0|requires usage credits
          # Refused credentials, with api and oidc only (the subscription keeps
          # its handling): HTTP 401 or 403, the API's authentication_error and
          # permission_error, Claude Code's authentication_failed, a refused
          # federation exchange ("Authentication failed"), a bad API key.
          AUTH_PATTERN: >-
            authentication_error|authentication_failed|permission_error|Authentication failed|invalid x-api-key|account_on_hold|api_error_status=40[13]
        run: |
          cost=$(jq -r '[.[] | select(.type == "result")] | last | .total_cost_usd // empty' "$EXECUTION_FILE" 2>/dev/null || true)
          model=$(jq -r '[.[] | select(.type == "system" and .subtype == "init")] | first | .model // empty' "$EXECUTION_FILE" 2>/dev/null || true)
          line="claude-cost step=${CLAUDE_STEP} auth=${CLAUDE_AUTH_MODE} model=${model:-n/a} total_cost_usd=${cost:-n/a}"
          echo "$line"
          echo "- \`${line}\`" >> "$GITHUB_STEP_SUMMARY"
          errors=$(jq -r "$SESSION_ERRORS" "$EXECUTION_FILE" 2>/dev/null || true)
          reason=""
          if grep -qiE "$LIMIT_PATTERN" <<< "$errors"; then
            reason=limit
            what="Claude spend/usage limit reached"
          elif [[ "$CLAUDE_AUTH_MODE" =~ ^(api|oidc)$ ]] && grep -qiE "$AUTH_PATTERN" <<< "$errors"; then
            reason=auth
            what="Claude credentials refused"
          fi
          if [ -n "$reason" ]; then
            echo "::error::${what} (auth=${CLAUDE_AUTH_MODE}) in ${CLAUDE_STEP}: no retry until it is resolved"
            echo "- **${what} (auth=${CLAUDE_AUTH_MODE})** in \`${CLAUDE_STEP}\`" >> "$GITHUB_STEP_SUMMARY"
            echo "stopped=true" >> "$GITHUB_OUTPUT"
          else
            echo "stopped=false" >> "$GITHUB_OUTPUT"
          fi
          echo "stop_reason=${reason}" >> "$GITHUB_OUTPUT"

      # Claude stopped the first session (a limit or refused credentials) and
      # its retry was skipped: fail here, so "Handle repair failure" pauses the
      # PR without an auto-retry instead of the steps below running on an
      # unrepaired file.
      - name: Stop when Claude stopped the session
        if: steps.claude_cost.outputs.stopped == 'true'
        run: |
          echo "::error::Claude stopped the session (${{ steps.claude_cost.outputs.stop_reason }}); the retry is skipped"
          exit 1

      - name: Process repaired image
        if: success()
        env:
          SPEC_ID: ${{ inputs.specification_id }}
          LIBRARY: ${{ inputs.library }}
          LANGUAGE: ${{ steps.lang.outputs.language }}
        run: |
          IMPL_DIR="plots/${SPEC_ID}/implementations/${LANGUAGE}"

          if [ ! -f "$IMPL_DIR/plot-light.png" ] || [ ! -f "$IMPL_DIR/plot-dark.png" ]; then
            echo "::warning::Missing plot-{light,dark}.png after repair"
            ls -la "$IMPL_DIR/" || true
            exit 0
          fi

          source .venv/bin/activate

          # Optimize each theme PNG and generate responsive variants named plot-{theme}_*.{png,webp}
          for theme in light dark; do
            python -m core.images process \
              "$IMPL_DIR/plot-${theme}.png" \
              "$IMPL_DIR/plot-${theme}.png"
            python -m core.images responsive \
              "$IMPL_DIR/plot-${theme}.png" \
              "$IMPL_DIR/"
          done

          echo "::notice::Processed both themes after repair (light + dark)"
          ls -la "$IMPL_DIR/"

      # The perturbation smoke run of the repaired file (core/smoke_run.py run),
      # as impl-generate runs it on the generated one; "Upload repaired plot to
      # GCS staging" replaces the staged adapt/new-smoke.json with it. No pair
      # and no predecessor run: a gated regeneration never enters repair.
      # Record-only, like impl-generate's step: no exit code gates, and
      # continue-on-error keeps a crash or a timeout from failing the repair.
      - name: Adaptability smoke run (record-only)
        id: adapt_smoke
        if: success() && steps.lang.outputs.language == 'python'
        continue-on-error: true
        timeout-minutes: 20
        env:
          SPEC_ID: ${{ inputs.specification_id }}
          LIBRARY: ${{ inputs.library }}
        run: |
          # This step runs model-written code: it gets no way to mint an OIDC
          # token (the job has id-token for Claude and Google Cloud).
          unset ACTIONS_ID_TOKEN_REQUEST_URL ACTIONS_ID_TOKEN_REQUEST_TOKEN
          OUT="$RUNNER_TEMP/adapt"; TOOLS="$RUNNER_TEMP/adapt-tools"
          rm -rf "$OUT" "$TOOLS"; mkdir -p "$OUT" "$TOOLS"
          # The runner comes from this workflow's ref, never from the PR branch.
          if ! git archive "$GITHUB_SHA" core | tar -x -C "$TOOLS" || [ ! -f "$TOOLS/core/smoke_run.py" ]; then
            echo "::warning::adapt_smoke could not copy core/ from ${GITHUB_SHA}; no adaptability record is staged"
            exit 0
          fi
          IMPL="plots/${SPEC_ID}/implementations/python/${LIBRARY}.py"
          env PYTHONPATH="$TOOLS" .venv/bin/python -P -m core.smoke_run run "$IMPL" \
            --spec "plots/${SPEC_ID}/specification.md" --spec-id "$SPEC_ID" --library "$LIBRARY" \
            --out "$OUT/new-smoke.json" || true

      - name: Authenticate to GCP
        if: success()
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093  # v3
        with:
          project_id: anyplot
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}

      - name: Set up Cloud SDK
        if: success()
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db  # v3

      - name: Upload repaired plot to GCS staging
        if: success()
        env:
          SPEC_ID: ${{ inputs.specification_id }}
          LIBRARY: ${{ inputs.library }}
          LANGUAGE: ${{ steps.lang.outputs.language }}
        run: |
          IMPL_DIR="plots/${SPEC_ID}/implementations/${LANGUAGE}"
          STAGING_PATH="gs://anyplot-images/staging/${SPEC_ID}/${LANGUAGE}/${LIBRARY}"

          # Upload both theme PNGs + their responsive variants
          if [ -f "$IMPL_DIR/plot-light.png" ] && [ -f "$IMPL_DIR/plot-dark.png" ]; then
            gsutil -m -h "Cache-Control:public, max-age=604800" cp \
              "$IMPL_DIR"/plot-light*.png "$IMPL_DIR"/plot-light*.webp \
              "$IMPL_DIR"/plot-dark*.png  "$IMPL_DIR"/plot-dark*.webp \
              "${STAGING_PATH}/"
            gsutil -m acl ch -u AllUsers:R "${STAGING_PATH}/plot-light*" "${STAGING_PATH}/plot-dark*" 2>/dev/null || true
          fi

          # Interactive libraries: upload both theme HTML files
          for theme in light dark; do
            if [ -f "$IMPL_DIR/plot-${theme}.html" ]; then
              gsutil -h "Cache-Control:public, max-age=604800" cp "$IMPL_DIR/plot-${theme}.html" "${STAGING_PATH}/plot-${theme}.html"
              gsutil acl ch -u AllUsers:R "${STAGING_PATH}/plot-${theme}.html" 2>/dev/null || true
            fi
          done

          # The smoke run of the repaired file replaces the staged one (private,
          # never promoted). Without a new one the stale record from before the
          # repair goes, so impl-review reads `missing`, never a result for code
          # that no longer exists.
          if [ "$LANGUAGE" = "python" ]; then
            SMOKE="$RUNNER_TEMP/adapt/new-smoke.json"
            if [ -s "$SMOKE" ] && gsutil -h "Cache-Control:no-store" cp "$SMOKE" "${STAGING_PATH}/adapt/new-smoke.json"; then
              echo "::notice::Staged the repaired file's adapt/new-smoke.json"
            else
              [ -s "$SMOKE" ] && echo "::warning::adapt/new-smoke.json not staged; impl-review records it as missing"
              gsutil rm "${STAGING_PATH}/adapt/new-smoke.json" 2>/dev/null || true
            fi
          fi

          rm -f /tmp/gcs-key.json

      - name: Post repair status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment ${{ inputs.pr_number }} --body "## :wrench: Repair Attempt ${{ inputs.attempt }}/4

          Applied fixes based on AI review feedback.

          **Status:** Repair completed, re-triggering review...

          ---
          :robot: *[impl-repair](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})*"

      - name: Re-trigger review
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUM: ${{ inputs.pr_number }}
          MODEL: ${{ steps.model.outputs.model }}
        run: |
          # Use repository_dispatch as workaround for workflow_dispatch caching issue
          gh api repos/${{ github.repository }}/dispatches \
            -f event_type=review-pr \
            -f "client_payload[pr_number]=$PR_NUM" \
            -f "client_payload[model]=$MODEL"
          echo "::notice::Triggered impl-review.yml via repository_dispatch for PR #$PR_NUM (generation model=$MODEL; the review runs on opus)"

      # ========================================================================
      # Failure handling: when the repair workflow itself crashes (e.g. Claude
      # Code Action transient failure), restore the ai-rejected label and
      # auto-retry once. After one auto-retry, fall back to manual.
      # ========================================================================
      - name: Handle repair failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUM: ${{ inputs.pr_number }}
          SPEC_ID: ${{ inputs.specification_id }}
          LIBRARY: ${{ inputs.library }}
          ATTEMPT: ${{ inputs.attempt }}
          # The resolved model when "Resolve model" ran; a crash before it
          # forwards the raw input and lets the retry resolve again.
          MODEL: ${{ steps.model.outputs.model || inputs.model || 'auto' }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          # Claude stopped either session (a limit or refused credentials).
          CLAUDE_STOPPED: ${{ steps.claude_cost.outputs.stopped == 'true' || steps.claude_retry_cost.outputs.stopped == 'true' }}
          STOP_REASON: ${{ steps.claude_cost.outputs.stop_reason || steps.claude_retry_cost.outputs.stop_reason }}
          CLAUDE_MODE: ${{ steps.claude_auth.outputs.mode }}
        run: |
          # Restore ai-rejected label that was removed at start of repair so the
          # PR state stays consistent (otherwise it looks "stuck approved").
          gh pr edit "$PR_NUM" --add-label "ai-rejected" 2>/dev/null || true

          # Claude stopped the session (a spend or usage limit, or refused
          # credentials): an auto-retry now would be refused the same way.
          # `ai-repair-paused` keeps the watchdog's one-shot rescue off the PR;
          # daily-regen's pair mode, or a manual restart, resumes it. The
          # comment carries its own marker, not the repair-retry one, so the
          # attempt keeps its one crash retry for after the stop is resolved.
          if [ "${CLAUDE_STOPPED}" = "true" ]; then
            if [ "${STOP_REASON}" = "auth" ]; then
              WHY="Claude credentials refused"
              WHEN="once the credentials are fixed"
            else
              WHY="Claude spend/usage limit reached"
              WHEN="once the limit resets or is raised"
            fi
            echo "::error::${WHY} (auth=${CLAUDE_MODE}) — repair attempt ${ATTEMPT} paused, no auto-retry"
            gh label create "ai-repair-paused" --color "fbca04" \
              --description "Repair paused: Claude stopped it (spend/usage limit or refused credentials)" 2>/dev/null || true
            gh pr edit "$PR_NUM" --add-label "ai-repair-paused" 2>/dev/null \
              || echo "::warning::could not add ai-repair-paused to PR #${PR_NUM}"
            gh pr comment "$PR_NUM" --body "<!-- repair-paused-claude:${SPEC_ID}:${LIBRARY}:attempt-${ATTEMPT} -->
          ## :pause_button: Repair Paused (${WHY}, Attempt ${ATTEMPT}/4)

          Claude stopped the repair: ${WHY} (auth=\`${CLAUDE_MODE}\`). Nothing was retried, and the attempt is not used up. The PR carries \`ai-repair-paused\`, which the watchdog leaves alone; daily-regen's pair mode resumes it.

          **Restart ${WHEN}:**
          \`\`\`
          gh workflow run impl-repair.yml -f pr_number=${PR_NUM} -f specification_id=${SPEC_ID} -f library=${LIBRARY} -f attempt=${ATTEMPT} -f model=${MODEL}
          \`\`\`

          ---
          :robot: *[impl-repair](https://github.com/$REPOSITORY/actions/runs/$RUN_ID)*" || true
            exit 0
          fi

          MARKER="<!-- repair-retry:${SPEC_ID}:${LIBRARY}:attempt-${ATTEMPT} -->"
          # Paginate so the marker is found even on PRs with >30 comments.
          # `--paginate --jq` prints one count per page, so the pages are
          # summed: read as one value, a PR with more than 100 comments gave
          # "0\n1", the `-ge` test below errored into its else branch, and
          # every crash bought another retry. A read that fails three times
          # counts as a spent budget (fail closed), like impl-review's; the
          # watchdog's crashed-repair case picks the PR up from there.
          RETRY_COUNT=""
          for attempt in 1 2 3; do
            if PAGES=$(gh api --paginate "repos/$REPOSITORY/issues/${PR_NUM}/comments?per_page=100" \
                 --jq "[.[] | select(.body != null and (.body | contains(\"$MARKER\")))] | length" 2> /tmp/retry-count.err) \
               && RETRY_COUNT=$(printf '%s\n' "$PAGES" | jq -s 'add // 0' 2>> /tmp/retry-count.err) \
               && [[ "$RETRY_COUNT" =~ ^[0-9]+$ ]]; then
              break
            fi
            RETRY_COUNT=""
            echo "::warning::retry-marker read failed (attempt ${attempt}/3): $(head -c 500 /tmp/retry-count.err | tr '\n' ' ')"
            [ "$attempt" -lt 3 ] && sleep $((attempt * 10))
          done
          EXHAUSTED="The repair workflow itself failed twice for this attempt — likely a persistent Claude Code Action issue."
          if [ -z "$RETRY_COUNT" ]; then
            echo "::error::Could not read the retry marker for PR #${PR_NUM} after 3 attempts — not auto-retrying"
            EXHAUSTED="The repair workflow failed, and whether its one auto-retry was already used could not be read, so none was started."
            RETRY_COUNT=1
          fi

          if [ "$RETRY_COUNT" -ge 1 ]; then
            echo "::error::Repair attempt ${ATTEMPT} crashed and gets no (further) auto-retry — giving up"
            gh pr comment "$PR_NUM" --body "${MARKER}
          ## :x: Repair Workflow Crashed (Attempt ${ATTEMPT}/4, retry exhausted)

          ${EXHAUSTED}

          **Manual restart:**
          \`\`\`
          gh workflow run impl-repair.yml -f pr_number=${PR_NUM} -f specification_id=${SPEC_ID} -f library=${LIBRARY} -f attempt=${ATTEMPT} -f model=${MODEL}
          \`\`\`

          ---
          :robot: *[impl-repair](https://github.com/$REPOSITORY/actions/runs/$RUN_ID)*"
          else
            echo "::warning::Repair attempt ${ATTEMPT} crashed — auto-retrying once"
            gh pr comment "$PR_NUM" --body "${MARKER}
          ## :wrench: Repair Workflow Crashed (Attempt ${ATTEMPT}/4) — Auto-Retrying

          The repair workflow failed (probably a transient Claude Code Action issue). Automatically re-triggering this attempt...

          ---
          :robot: *[impl-repair](https://github.com/$REPOSITORY/actions/runs/$RUN_ID)*"

            gh workflow run impl-repair.yml \
              -f pr_number="$PR_NUM" \
              -f specification_id="$SPEC_ID" \
              -f library="$LIBRARY" \
              -f attempt="$ATTEMPT" \
              -f model="$MODEL"
          fi
