name: "Scheduled: Regen oldest specs"
run-name: "Scheduled regen (${{ github.event.inputs.specification_id || (github.event.inputs.pairs && format('{0} pairs', github.event.inputs.pairs)) || github.event.inputs.count || '1' }} / ${{ github.event.inputs.model || 'auto' }})"

# Picks the N oldest specs (by most-recent implementation `updated` timestamp)
# and re-dispatches `bulk-generate.yml` for each. Default N=1 per cron tick.
#
# Pair mode (off unless configured): with the repository variable
# REGEN_PAIRS_PER_DAY set to N >= 1, the scheduled run instead picks the N
# oldest implementations — single (spec, library) pairs across the catalogue,
# aged by their own metadata and regeneration attempts —
# (automation/scripts/regen_pick_pairs.py) and dispatches each pair straight
# to impl-generate.yml, skipping the spec polish. A manual run opts in with the
# `pairs` input; the variable never changes a manual run, except the
# watchdog's cron rescue, which forwards it as `pairs` because it replaces the
# missed scheduled run. Unset, the schedule runs spec mode exactly as before.
#
# Schedule: once per day at 02:17 UTC (04:17 Berlin under CEST, 03:17 under
# CET — Actions cron is always UTC). Until 2026-09 it ticked every 2 hours
# (10× per day); the owner cut it to one tick when re-enabling the workflow
# after the gap backfill, so the scheduled regen takes one spec per night
# and leaves the Claude rate limit to interactive work during the day. The
# night slot also stays clear of the fixed 18:00–21:59 UTC quiet window that
# the watchdog's rescue avoids.
#
# The tick fires at minute 17 (not :00) on purpose: GitHub's scheduler is
# most overloaded at the top of the hour and delays/drops `schedule` events
# then (github.com docs on `on.schedule`). This repo has seen multi-day
# streaks of silently dropped ticks for exactly this workflow while
# less-frequent crons kept firing. As a second line of defence,
# watchdog-stuck-jobs.yml re-dispatches this workflow when main has seen
# no new run for >26 h outside the quiet window — the missed night's run,
# not an extra one.
#
# bulk-generate is serialised via its own concurrency group. Default model is
# "auto": impl-generate runs a regeneration (a pair already on main, i.e.
# almost every pair here) on Sonnet and a library the spec never had on Opus.
# A manual run can pin one model for every pair instead. The model covers
# generate and repair; reviews always run on Opus (impl-review.yml).
#
# Triggers:
#   - schedule: once daily at 02:17 UTC → auto (Sonnet regenerations, Opus reviews)
#   - workflow_dispatch: manual, with inputs for spec id, model, count, dry-run,
#     pairs (also used by the watchdog's cron-liveness rescue, with all
#     defaults — plus `pairs` when REGEN_PAIRS_PER_DAY is set)

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
    inputs:
      specification_id:
        description: "Specific spec id to regen (leave empty to pick the oldest)"
        required: false
        default: ''
      model:
        description: "Claude model to generate and repair; auto = opus for a pair's first implementation, sonnet for a regeneration. Reviews always run on Opus."
        required: false
        type: choice
        default: 'auto'
        options:
          - auto
          - haiku
          - sonnet
          - opus
      count:
        description: "How many of the oldest specs to regen (ignored when specification_id is set, default 1)"
        required: false
        default: '1'
      min_age_hours:
        description: "Skip specs regen'd within this many hours (default 20)"
        required: false
        default: '20'
      dry_run:
        description: "Just print picks, do not trigger bulk-generate"
        type: boolean
        default: false
      pairs:
        description: "Pair mode: regen this many of the oldest implementations (spec × library) instead of whole specs, without spec polish (empty = spec mode; ignored when specification_id is set)"
        required: false
        default: ''

permissions:
  contents: read
  actions: write

concurrency:
  group: daily-regen
  cancel-in-progress: false

jobs:
  pick:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read          # spec issue updatedAt = last regen attempt per spec
      pull-requests: read   # pair mode: implementation PRs = last attempt per pair
      actions: read         # pair mode: impl-generate runs = last attempt per pair
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
      specs: ${{ steps.pick.outputs.specs || steps.pick_pairs.outputs.specs }}
      specs_json: ${{ steps.pick.outputs.specs_json || steps.pick_pairs.outputs.specs_json }}
      count: ${{ steps.pick.outputs.count || steps.pick_pairs.outputs.count }}
      pairs_json: ${{ steps.pick_pairs.outputs.pairs_json }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.14'

      - name: Install PyYAML
        run: pip install pyyaml

      # Spec mode unless a pair count is given: the `pairs` input on a manual
      # run (the watchdog's cron rescue forwards REGEN_PAIRS_PER_DAY there),
      # the REGEN_PAIRS_PER_DAY variable on the schedule. A spec override
      # always wins. Anything but a positive integer stops the run instead of
      # falling back to a whole spec.
      - name: Resolve regen mode
        id: mode
        env:
          PAIRS: ${{ github.event_name == 'schedule' && vars.REGEN_PAIRS_PER_DAY || inputs.pairs }}
          SPEC_OVERRIDE: ${{ inputs.specification_id }}
        run: |
          if [ -n "$SPEC_OVERRIDE" ] || [ -z "$PAIRS" ]; then
            echo "mode=spec" >> "$GITHUB_OUTPUT"
            echo "Regen mode: spec"
          elif [[ "$PAIRS" =~ ^[1-9][0-9]*$ ]]; then
            echo "mode=pairs" >> "$GITHUB_OUTPUT"
            echo "pairs=$PAIRS" >> "$GITHUB_OUTPUT"
            echo "::notice::Regen mode: pairs (${PAIRS} per run)"
          else
            echo "::error::The pair count (REGEN_PAIRS_PER_DAY or the pairs input) must be a positive integer, got '${PAIRS//[^A-Za-z0-9 ._-]/?}'"
            exit 1
          fi

      - name: Pick oldest spec(s) (or use override)
        id: pick
        if: steps.mode.outputs.mode == 'spec'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          COUNT: ${{ inputs.count || '1' }}
          MIN_AGE_HOURS: ${{ inputs.min_age_hours || '20' }}
          SPEC_OVERRIDE: ${{ inputs.specification_id }}
        run: |
          python3 <<'PY'
          import json
          import os
          import subprocess
          import sys
          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          import yaml


          COUNT = int(os.environ["COUNT"])
          MIN_AGE = timedelta(hours=int(os.environ["MIN_AGE_HOURS"]))
          OVERRIDE = (os.environ.get("SPEC_OVERRIDE") or "").strip()
          NOW = datetime.now(timezone.utc)

          specs_dir = Path("plots")

          # Manual override: caller specified a spec id — validate and use it.
          if OVERRIDE:
              if not (specs_dir / OVERRIDE / "specification.md").is_file():
                  print(f"::error::Spec '{OVERRIDE}' not found at plots/{OVERRIDE}/specification.md")
                  sys.exit(1)
              picks = [OVERRIDE]
              print(f"::notice::Using override spec: {OVERRIDE}")
              github_output = os.environ["GITHUB_OUTPUT"]
              with open(github_output, "a", encoding="utf-8") as f:
                  f.write(f"specs={OVERRIDE}\n")
                  f.write(f"specs_json={json.dumps(picks)}\n")
                  f.write(f"count=1\n")
              sys.exit(0)

          def parse_ts(raw: str) -> datetime | None:
              try:
                  dt = datetime.fromisoformat(raw.replace("Z", "+00:00"))
              except ValueError:
                  return None
              return dt if dt.tzinfo else dt.replace(tzinfo=timezone.utc)

          # Last regen ATTEMPT per spec = the spec issue's updatedAt. A
          # regeneration the regen gate kept closes its PR and never touches
          # `updated` in the metadata, so without this the same spec would be
          # picked again every night. Every regen touches its issue (pending
          # labels, preview and verdict comments), so the issue's updatedAt is
          # a durable attempt record that — unlike a closed-PR listing — never
          # falls out of a window. Semantics: ANY activity on a spec's issue
          # (a comment, a label, a report) postpones that spec's regen by
          # MIN_AGE_HOURS and moves it back in the oldest-first order.
          # One call at pick time, most recently updated first (so the
          # limit only drops issues that are old anyway); a failure degrades
          # to "metadata updated only". Mapping issue → spec comes from each
          # plots/<spec>/specification.yaml `issue:` field.
          issue_updated: dict[int, datetime] = {}
          try:
              raw = subprocess.run(
                  ["gh", "issue", "list", "--repo", os.environ["GH_REPO"], "--state", "all",
                   "--search", "sort:updated-desc", "--limit", "1000", "--json", "number,updatedAt"],
                  check=True, capture_output=True, text=True,
              ).stdout
              for issue in json.loads(raw):
                  ts = parse_ts(str(issue.get("updatedAt") or ""))
                  if ts and isinstance(issue.get("number"), int):
                      issue_updated[issue["number"]] = ts
              print(f"::notice::Issue activity read for {len(issue_updated)} issue(s)")
          except (subprocess.CalledProcessError, ValueError, OSError) as exc:
              print(f"::warning::Could not list issues ({' '.join(str(exc).split())[:200]}) — picking by metadata 'updated' only")

          last_attempt: dict[str, datetime] = {}
          if issue_updated:
              for spec_yaml in specs_dir.glob("*/specification.yaml"):
                  try:
                      issue_no = (yaml.safe_load(spec_yaml.read_text(encoding="utf-8")) or {}).get("issue")
                  except Exception:
                      continue
                  if isinstance(issue_no, int) and issue_no in issue_updated:
                      last_attempt[spec_yaml.parent.name] = issue_updated[issue_no]

          candidates: list[tuple[datetime, str]] = []

          for spec_dir in sorted(specs_dir.iterdir()):
              if not spec_dir.is_dir() or spec_dir.name.startswith("."):
                  continue
              meta_dir = spec_dir / "metadata" / "python"
              if not meta_dir.is_dir():
                  continue

              latest_updated: str | None = None
              for yaml_file in meta_dir.glob("*.yaml"):
                  try:
                      data = yaml.safe_load(yaml_file.read_text(encoding="utf-8")) or {}
                  except Exception:
                      continue
                  updated = data.get("updated") or data.get("created")
                  if not updated:
                      continue
                  s = str(updated)
                  if latest_updated is None or s > latest_updated:
                      latest_updated = s

              dt = parse_ts(latest_updated) if latest_updated else None
              if latest_updated and dt is None:
                  continue  # unparseable timestamp — skip, as before

              # Age = time since the newer of the last merged update and the
              # last activity on the spec issue (kept regens included). No
              # usable metadata → the issue activity alone is the age; only
              # when neither exists is the spec treated as ancient.
              attempt = last_attempt.get(spec_dir.name)
              if attempt and (dt is None or attempt > dt):
                  dt = attempt
              if dt is None:
                  candidates.append((datetime.min.replace(tzinfo=timezone.utc), spec_dir.name))
                  continue

              if NOW - dt < MIN_AGE:
                  continue  # too fresh to re-roll

              candidates.append((dt, spec_dir.name))

          candidates.sort()  # oldest first
          picks = [name for _, name in candidates[:COUNT]]

          print(f"::notice::Eligible specs: {len(candidates)}  picked: {picks}")
          for dt, name in candidates[:COUNT]:
              print(f"  - {name:40s}  last_touched={dt.isoformat()}")

          github_output = os.environ["GITHUB_OUTPUT"]
          with open(github_output, "a", encoding="utf-8") as f:
              f.write(f"specs={' '.join(picks)}\n")
              f.write(f"specs_json={json.dumps(picks)}\n")
              f.write(f"count={len(picks)}\n")
          PY

      # Pair mode: the N oldest (spec, library) pairs, with the spec mode's
      # age rule applied per pair (see the script's docstring). The picks go
      # to the log and the run summary, also on a dry run.
      - name: Pick oldest pairs (pair mode)
        id: pick_pairs
        if: steps.mode.outputs.mode == 'pairs'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          COUNT: ${{ steps.mode.outputs.pairs }}
          MIN_AGE_HOURS: ${{ inputs.min_age_hours || '20' }}
        run: |
          LIBRARIES=$(python3 -c "from core.constants import SUPPORTED_LIBRARIES; print(' '.join(sorted(SUPPORTED_LIBRARIES)))")
          python3 automation/scripts/regen_pick_pairs.py --count "$COUNT" --min-age-hours "$MIN_AGE_HOURS" \
            --repo "$GH_REPO" --libraries "$LIBRARIES"

  # ============================================================================
  # Pre-flight: per spec, run autonomous spec polish + cross-library similarity
  # audit, then dispatch bulk-generate with the resulting change_requests.
  #
  # Each matrix entry is one spec from the pick job. We do polish + audit +
  # dispatch in the same job so we don't have to aggregate matrix outputs back
  # into a separate dispatch job (which is awkward in GitHub Actions).
  #
  # The two pre-flight LLM steps are HARDCODED to Sonnet regardless of
  # `inputs.model` — narrow audits (on Haiku until 2026-09). The user-selected
  # model ("auto" unless a manual run pins one) is passed through to
  # bulk-generate (and from there to impl-generate and repair) unchanged;
  # reviews always run on Opus.
  #
  # Pair mode: one matrix entry per spec among the picked pairs. The spec
  # polish is skipped (a spec rewritten for one library would leave its other
  # implementations written against the old text), the similarity audit runs
  # as in spec mode, and each picked pair of the spec is dispatched straight
  # to impl-generate.yml with bulk-generate's arguments and pacing — not via
  # bulk-generate.yml, whose single concurrency group keeps at most one
  # pending run and cancels the older one (see the watchdog's
  # dispatch_generate).
  # ============================================================================
  preflight-dispatch:
    needs: pick
    if: ${{ needs.pick.outputs.count != '0' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write       # spec polish: branch + commit
      pull-requests: write  # spec polish: open PR + add label
      actions: write        # dispatch bulk-generate
      id-token: write
    strategy:
      matrix:
        spec_id: ${{ fromJson(needs.pick.outputs.specs_json) }}
      fail-fast: false
      max-parallel: 1   # serialize so polish PRs and dispatches don't race
    # Note on dry_run: the JOB always runs when there's a spec to process, so
    # operators can exercise skip-gate + similarity-audit + collect on demand.
    # Side-effect steps (polish, dispatch) are individually gated on
    # `!inputs.dry_run` below.
    steps:
      # Claude credentials: the repository variable CLAUDE_AUTH picks one per
      # run and each Claude step passes exactly that one, the other input
      # empty. Unset or `subscription`: CLAUDE_CODE_OAUTH_TOKEN, as before;
      # `api`: ANTHROPIC_API_KEY. Any other value, or `api` without the key,
      # stops the job here, never a silent fallback to the subscription.
      # Identical in every job that runs Claude (tests/unit/workflows/
      # test_claude_auth.py); docs/workflows/overview.md#claude-credentials.
      - name: Check Claude credentials
        env:
          CLAUDE_AUTH: ${{ vars.CLAUDE_AUTH }}
          API_KEY_SET: ${{ secrets.ANTHROPIC_API_KEY != '' }}
        run: |
          case "${CLAUDE_AUTH,,}" in
            ''|subscription) echo "Claude credentials: subscription (CLAUDE_CODE_OAUTH_TOKEN)" ;;
            api)
              if [ "$API_KEY_SET" != "true" ]; then
                echo "::error::CLAUDE_AUTH is 'api' but the ANTHROPIC_API_KEY secret is missing; not falling back to the subscription"
                exit 1
              fi
              echo "Claude credentials: api (ANTHROPIC_API_KEY)" ;;
            *)
              echo "::error::CLAUDE_AUTH must be unset, 'subscription' or 'api', got '${CLAUDE_AUTH//[^A-Za-z0-9 ._-]/?}'"
              exit 1 ;;
          esac

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Skip-gate — open PRs touching this spec?
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SPEC_ID: ${{ matrix.spec_id }}
        run: |
          # If any PR is open that touches plots/{spec}/, skip the polish step
          # to avoid racing against human edits or stacking auto-polish PRs.
          # Similarity audit still runs — it's read-only.
          OPEN=$(gh pr list \
            --repo "${{ github.repository }}" \
            --search "plots/${SPEC_ID}/ in:files is:open" \
            --json number --jq 'length' 2>/dev/null || echo 0)
          if [ "${OPEN:-0}" -gt 0 ]; then
            echo "::notice::Open PR(s) touch plots/${SPEC_ID}/ — skipping spec polish"
            echo "skip_polish=1" >> "$GITHUB_OUTPUT"
          else
            echo "skip_polish=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Spec polish (autonomous, opens PR with auto-merge)
        id: polish
        if: ${{ steps.gate.outputs.skip_polish == '0' && !inputs.dry_run && needs.pick.outputs.mode != 'pairs' }}
        # Optional quality pass: a transient action failure here must not
        # block the main regeneration pipeline. Skip cleanly and continue.
        continue-on-error: true
        timeout-minutes: 15
        uses: anthropics/claude-code-action@db77d4d3c98f3f6380e7cd45ffba2342a3dbde3c  # v1
        with:
          anthropic_api_key: ${{ vars.CLAUDE_AUTH == 'api' && secrets.ANTHROPIC_API_KEY || '' }}
          claude_code_oauth_token: ${{ vars.CLAUDE_AUTH != 'api' && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
          claude_args: '--model sonnet --settings ${{ github.workspace }}/.claude/settings.json'
          allowed_bots: '*'
          prompt: |
            Read `prompts/workflow-prompts/spec-polish-claude.md` and follow those instructions.

            Variables for this run:
            - SPEC_ID: ${{ matrix.spec_id }}

      # The session's cost (Claude Code's own estimate at API list price) and
      # the credential it ran on, for the weekly regen review. Never fatal.
      - name: Claude cost to the job summary (spec polish)
        if: ${{ !cancelled() && (steps.polish.outcome == 'success' || steps.polish.outcome == 'failure') }}
        continue-on-error: true
        env:
          EXECUTION_FILE: ${{ steps.polish.outputs.execution_file }}
          CLAUDE_AUTH_MODE: ${{ vars.CLAUDE_AUTH == 'api' && 'api' || 'subscription' }}
          CLAUDE_STEP: daily-regen/polish
        run: |
          cost=$(jq -r '[.[] | select(.type == "result")] | last | .total_cost_usd // empty' "$EXECUTION_FILE" 2>/dev/null || true)
          model=$(jq -r '[.[] | select(.type == "system" and .subtype == "init")] | first | .model // empty' "$EXECUTION_FILE" 2>/dev/null || true)
          line="claude-cost step=${CLAUDE_STEP} auth=${CLAUDE_AUTH_MODE} model=${model:-n/a} total_cost_usd=${cost:-n/a}"
          echo "$line"
          echo "- \`${line}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Cross-library similarity audit
        id: similarity
        # Read-only audit; if it fails, fall back to empty change_requests
        # rather than aborting the dispatch.
        continue-on-error: true
        timeout-minutes: 15
        uses: anthropics/claude-code-action@db77d4d3c98f3f6380e7cd45ffba2342a3dbde3c  # v1
        with:
          anthropic_api_key: ${{ vars.CLAUDE_AUTH == 'api' && secrets.ANTHROPIC_API_KEY || '' }}
          claude_code_oauth_token: ${{ vars.CLAUDE_AUTH != 'api' && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
          claude_args: '--model sonnet --settings ${{ github.workspace }}/.claude/settings.json'
          allowed_bots: '*'
          prompt: |
            Read `prompts/workflow-prompts/impl-similarity-claude.md` and follow those instructions.

            Variables for this run:
            - SPEC_ID: ${{ matrix.spec_id }}

      - name: Claude cost to the job summary (similarity audit)
        if: ${{ !cancelled() && (steps.similarity.outcome == 'success' || steps.similarity.outcome == 'failure') }}
        continue-on-error: true
        env:
          EXECUTION_FILE: ${{ steps.similarity.outputs.execution_file }}
          CLAUDE_AUTH_MODE: ${{ vars.CLAUDE_AUTH == 'api' && 'api' || 'subscription' }}
          CLAUDE_STEP: daily-regen/similarity
        run: |
          cost=$(jq -r '[.[] | select(.type == "result")] | last | .total_cost_usd // empty' "$EXECUTION_FILE" 2>/dev/null || true)
          model=$(jq -r '[.[] | select(.type == "system" and .subtype == "init")] | first | .model // empty' "$EXECUTION_FILE" 2>/dev/null || true)
          line="claude-cost step=${CLAUDE_STEP} auth=${CLAUDE_AUTH_MODE} model=${model:-n/a} total_cost_usd=${cost:-n/a}"
          echo "$line"
          echo "- \`${line}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Collect change_requests
        id: collect
        run: |
          # Default to empty object if the audit never wrote a file (e.g.
          # fewer than 2 metadata files exist).
          if [ -f /tmp/change-requests.json ]; then
            CR=$(cat /tmp/change-requests.json)
            # Validate it's a JSON object; fall back to empty otherwise.
            if ! echo "$CR" | jq -e 'type == "object"' >/dev/null 2>&1; then
              echo "::warning::/tmp/change-requests.json is not a valid JSON object; using {} (got: ${CR})"
              CR='{}'
            fi
          else
            CR='{}'
          fi
          # Compact + escape newlines so it survives as a single GitHub Actions output line.
          CR_COMPACT=$(echo "$CR" | jq -c '.')
          echo "change_requests=${CR_COMPACT}" >> "$GITHUB_OUTPUT"
          flagged=$(echo "$CR_COMPACT" | jq 'length')
          echo "::notice::change_requests for ${{ matrix.spec_id }}: ${flagged} lib(s) flagged — ${CR_COMPACT}"

      - name: Dispatch bulk-generate with change_requests
        if: ${{ !inputs.dry_run && needs.pick.outputs.mode != 'pairs' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SPEC_ID: ${{ matrix.spec_id }}
          MODEL: ${{ inputs.model || 'auto' }}
          CHANGE_REQUESTS: ${{ steps.collect.outputs.change_requests }}
        run: |
          echo "::notice::Dispatching bulk-generate for ${SPEC_ID} (all libs, model=${MODEL})"
          gh workflow run bulk-generate.yml \
            --repo "${{ github.repository }}" \
            -f specification_id="${SPEC_ID}" \
            -f library=all \
            -f model="${MODEL}" \
            -f change_requests="${CHANGE_REQUESTS}"
          # Small pause so GitHub's webhook processing has a moment before
          # the next matrix entry's dispatch (matrix is serialized via
          # max-parallel: 1, so this is between specs).
          sleep 5

      # Pair mode: bulk-generate's per-pair dispatch for each picked library of
      # this spec — the issue from specification.yaml, the library's
      # divergence hint, the regen gate on, three dispatch attempts — with
      # bulk-generate's default pace (180 s, 120 s for a pinned sonnet or
      # haiku) before every dispatch but the run's first. impl-generate sets
      # `impl:<lib>:pending` itself, so this job needs no issue permission.
      - name: Dispatch impl-generate for each picked pair (pair mode)
        if: ${{ !inputs.dry_run && needs.pick.outputs.mode == 'pairs' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SPEC_ID: ${{ matrix.spec_id }}
          MODEL: ${{ inputs.model || 'auto' }}
          CHANGE_REQUESTS: ${{ steps.collect.outputs.change_requests }}
          PAIRS_JSON: ${{ needs.pick.outputs.pairs_json }}
          PACE_SECONDS: ${{ (inputs.model == 'sonnet' || inputs.model == 'haiku') && '120' || '180' }}
        run: |
          set -u
          ISSUE=""
          if [ -f "plots/${SPEC_ID}/specification.yaml" ]; then
            ISSUE=$(yq '.issue' "plots/${SPEC_ID}/specification.yaml" 2>/dev/null || echo "")
            [ "$ISSUE" = "null" ] && ISSUE=""
          fi
          FIRST=$(echo "$PAIRS_JSON" | jq -r '.[0] | "\(.spec)/\(.library)"')
          failed=0
          for LIBRARY in $(echo "$PAIRS_JSON" | jq -r --arg spec "$SPEC_ID" '.[] | select(.spec == $spec) | .library'); do
            if [ "${SPEC_ID}/${LIBRARY}" != "$FIRST" ]; then
              echo "Sleeping ${PACE_SECONDS}s before the next dispatch…"
              sleep "$PACE_SECONDS"
            fi
            HINT=$(echo "$CHANGE_REQUESTS" | jq -r --arg lib "$LIBRARY" '.[$lib] // ""')
            args=(-f specification_id="${SPEC_ID}" -f library="${LIBRARY}" -f model="${MODEL}"
                  -f change_request="${HINT}" -f regen_gate=true -f source_ref= -f source_model=)
            if [ -n "$ISSUE" ]; then
              args+=(-f issue_number="${ISSUE}")
            fi
            echo "::notice::$(date -u +%H:%M:%SZ)  dispatching impl-generate for ${SPEC_ID}/${LIBRARY} (issue: ${ISSUE:-none}, model=${MODEL}, change_request: ${HINT:-none})"
            dispatched=0
            for attempt in 1 2 3; do
              if gh workflow run impl-generate.yml --repo "${{ github.repository }}" "${args[@]}"; then
                dispatched=1
                break
              fi
              echo "::warning::Dispatch attempt $attempt failed for ${SPEC_ID}/${LIBRARY}, retrying in 10s"
              sleep 10
            done
            if [ "$dispatched" = "0" ]; then
              echo "::error::Failed to dispatch ${SPEC_ID}/${LIBRARY} after 3 attempts — continuing"
              failed=$((failed + 1))
            fi
          done
          if [ "$failed" -gt 0 ]; then
            exit 1
          fi
