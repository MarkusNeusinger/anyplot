name: "Spec: Create"
run-name: "Create Spec: issue #${{ github.event.issue.number }}"

# Creates new specification with approval gate
# Flow:
# 1. User adds `spec-request` label → Claude writes the spec, pushes
#    specification/{id} and opens the PR as claude[bot] (Claude GitHub App)
# 2. Owner adds `approved` label → the merge job verifies the PR, squash-merges
#    it through auto-merge once the required checks pass, dispatches
#    sync-postgres.yml and labels the issue `spec-ready`
#
# Why Claude opens the PR instead of this workflow's GITHUB_TOKEN: since
# GitHub's 2026-06-11 change ("Bot-created pull requests can run workflows if
# approved"), pull_request runs on a PR that GITHUB_TOKEN opens or updates sit
# at `action_required` until a human approves them. The main ruleset requires
# Run Linting, Run Tests, Run Frontend Tests and Changelog (fragment), so a
# GITHUB_TOKEN spec PR could not merge until the owner approved its runs by
# hand (#11847: "the base branch policy prohibits the merge"). A PR opened with
# the Claude App token that claude-code-action mints for the Claude step runs
# CI like any other PR — the pattern daily-regen's spec polish already uses.
#
# Triggers:
# - spec-request label added → create specification + PR
# - approved label added by the repository owner (on a spec-request issue) → merge PR

on:
  issues:
    types: [labeled]

concurrency:
  # One lane per issue for the two labels that drive this workflow, so an
  # `approved` added while `spec-request` is still creating the spec queues
  # behind it instead of racing it. Every other label gets a lane of its own
  # (the run id): GitHub keeps only ONE pending run per concurrency group and
  # cancels the older pending run when another one queues, so an unrelated
  # label event in the same lane could cancel a queued approval.
  group: spec-create-${{ github.event.issue.number }}-${{ contains(fromJSON('["spec-request", "approved"]'), github.event.label.name) && 'pipeline' || github.run_id }}
  cancel-in-progress: false

jobs:
  # ============================================================================
  # Job 1: Create specification (triggered by spec-request label)
  # ============================================================================
  create:
    if: github.event.label.name == 'spec-request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write  # claude-code-action exchanges it for the Claude App token

    outputs:
      specification_id: ${{ steps.process.outputs.specification_id }}
      branch: ${{ steps.process.outputs.branch }}
      pr_number: ${{ steps.pr.outputs.pr_number }}

    steps:
      - name: Check if already processed
        id: check
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          # Skip if already has specification-id in title
          if [[ "$ISSUE_TITLE" =~ ^\[[a-z0-9-]+\] ]]; then
            echo "::notice::Skipping: Issue already has specification ID in title"
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "should_run=true" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        if: steps.check.outputs.should_run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: React with eyes emoji
        if: steps.check.outputs.should_run == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api repos/${{ github.repository }}/issues/${{ github.event.issue.number }}/reactions \
            -f content=eyes

      # Both Claude steps below carry the same instructions (the retry adds a
      # note on resuming). `gh` inside a Claude step runs with the Claude App
      # token, so the PR it opens (step 9) is authored by claude[bot]; the token
      # is revoked when the step ends, so every later step uses GITHUB_TOKEN.
      - name: Process with Claude
        if: steps.check.outputs.should_run == 'true'
        id: process
        continue-on-error: true
        timeout-minutes: 30
        uses: anthropics/claude-code-action@4036a180cf690f49529f5d8c79c998855287f590  # v1
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_USER: ${{ github.event.issue.user.login }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: "--model opus --settings ${{ github.workspace }}/.claude/settings.json"
          prompt: |
            ## Task: Create New Specification

            You are creating a new plot specification.

            ### Issue Details
            - **Title:** ${{ github.event.issue.title }}
            - **Number:** #${{ github.event.issue.number }}
            - **Author:** ${{ github.event.issue.user.login }}
            - **Body:**
            ```
            ${{ github.event.issue.body }}
            ```

            ---

            ## Instructions

            1. **Read the rules:** `prompts/spec-id-generator.md`

            2. **Check for duplicates:**
               - List all existing specs: `ls plots/`
               - Read existing specification files if titles seem similar
               - If duplicate found: Post comment explaining which spec matches, then STOP

            3. **Generate specification-id:**
               - Format: `{type}-{variant}` or `{type}-{variant}-{modifier}`
               - Examples: `scatter-basic`, `bar-grouped-horizontal`, `heatmap-correlation`
               - All lowercase, hyphens only

            4. **Create specification branch:**
               ```bash
               git checkout -b "specification/{specification-id}"
               ```

            5. **Post analysis comment:**
               Post a SHORT comment (max 3-4 sentences) to the issue using `gh issue comment`:
               - Is this a valid/useful plot type?
               - Does it already exist? (check `ls plots/`)
               - Any concerns?

            6. **Analyze reference materials (if present in issue):**
               - If the issue contains **images**: Analyze them to understand the desired visualization style, layout, and features. Incorporate visual requirements into the spec.
               - If the issue contains **external links** (GitHub repos, documentation, examples):
                 - Use WebFetch to read the linked page
                 - Understand what the referenced tool/library does
                 - Extract relevant features and patterns for the specification
               - Document insights from images/links in the spec's Description or Notes section

            7. **Create specification files:**
               - Read template: `prompts/templates/specification.md`
               - Read metadata template: `prompts/templates/specification.yaml`
               - Read tagging guide: `prompts/spec-tags-generator.md`
               - Create directory: `plots/{specification-id}/`
               - Create: `plots/{specification-id}/specification.md` (follow template structure)
               - End `specification.md` with the template's `## What a good version looks like`
                 section (after `## Notes`): 3-6 column-0 `- ` bullets, no sub-headings,
                 one line per bullet (no wrapped continuation lines), naming
                 what a viewer sees in a good render of THIS plot type. Start every bullet
                 with its kind, one kind per bullet: `A good version shows: ` for a property
                 a good render shows (the review deducts when it is missing), or
                 `Expected, not a defect: ` for something that can look like a flaw but is
                 inherent to the type (never penalized, never a target, no instruction in
                 it). Write at least one of each. Say how a good version handles an expected
                 item in its own `A good version shows: ` bullet, phrased conditionally
                 ("where bubbles overlap, …"). For a `-basic` id, add an `A good version shows: `
                 bullet about "the basic variant's …" encodings and nothing beyond them:
                 derived layers (trend or fit lines, mean or reference lines, bands, extra
                 series, derived color scales, marginals, facets, callouts) are outside a basic
                 variant, and an id that names a field's standard diagram lists the layers its
                 spec requires. No numeric thresholds, no generic ideals ("no overlap", "clean
                 design"), and nothing that contradicts Description, Data or Notes. The AI
                 review judges every implementation against this section.
               - Check the section before you commit, and fix every `::error` these print and
                 every `::warning` that is not a false alarm:
                 `python3 -m automation.scripts.spec_characteristics_lint contract plots/{specification-id}/specification.md`
                 and
                 `python3 -m automation.scripts.spec_characteristics_lint style plots/{specification-id}/specification.md`.
                 CI runs the same contract check and blocks the merge on an error.
               - Create: `plots/{specification-id}/specification.yaml` with:
                 - `specification_id`: the generated id
                 - `title`: a proper title
                 - `created`: Use `$(date -u +"%Y-%m-%dT%H:%M:%SZ")` for current timestamp
                 - `issue`: $ISSUE_NUMBER
                 - `suggested`: $ISSUE_USER
                 - `tags`: Follow spec-tags-generator guide (4 dimensions: plot_type, data_type, domain, features)
               - Create empty folder: `plots/{specification-id}/implementations/python/`
               - Create empty folder: `plots/{specification-id}/metadata/python/`
               - Touch nothing outside `plots/{specification-id}/`: the merge job refuses a PR
                 that changes any other file.

            8. **Commit and push:**
               ```bash
               git config user.name "github-actions[bot]"
               git config user.email "github-actions[bot]@users.noreply.github.com"
               git add plots/{specification-id}/
               git commit -m "spec: add {specification-id} specification

               Created from issue #$ISSUE_NUMBER"
               git push -u origin "specification/{specification-id}"
               ```

            9. **Open the pull request:**
               `gh` in this step is authenticated as the Claude GitHub App, so the PR is opened
               by `claude[bot]`. That is deliberate: CI runs on it without a manual approval,
               and the merge job only merges a spec PR the Claude app opened. Run this with
               `{specification-id}` filled in, unchanged otherwise — same title and body, and
               no labels, reviewers or auto-merge:
               ```bash
               SPEC_ID="{specification-id}"
               EXISTING=$(gh pr list --repo "${{ github.repository }}" --head "specification/${SPEC_ID}" --base main --state open --json url -q '.[0].url // empty')
               if [ -n "$EXISTING" ]; then
                 echo "PR already open: $EXISTING"
               else
                 SPEC_CONTENT=$(cat "plots/${SPEC_ID}/specification.md")
                 BODY_FILE=$(mktemp)
                 printf '## New Specification: `%s`\n\nRelated to #%s\n\n---\n\n### specification.md\n\n%s\n\n---\n\n**Next:** Add `approved` label to the issue to merge this PR.\n\n---\n:robot: *[spec-create workflow](%s)*\n' \
                   "$SPEC_ID" "$ISSUE_NUMBER" "$SPEC_CONTENT" \
                   "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" > "$BODY_FILE"
                 gh pr create --repo "${{ github.repository }}" --base main --head "specification/${SPEC_ID}" \
                   --title "spec: add ${SPEC_ID} specification" --body-file "$BODY_FILE"
               fi
               ```
               If `gh pr create` fails, print its error and continue with step 10; the workflow
               reports the missing PR on the issue.

            10. **Update issue title:**
               ```bash
               gh issue edit $ISSUE_NUMBER --title "[{specification-id}] {original title}"
               ```

            11. **Output for workflow:**
               After completing, print these lines exactly:
               ```
               SPECIFICATION_ID={specification-id}
               BRANCH=specification/{specification-id}
               ```

            ---

            ## Important Rules
            - Open exactly ONE pull request, with the command in step 9 (it reuses an open one)
            - Do NOT add labels (to the issue or the PR)
            - Do NOT enable auto-merge or merge anything (the merge job does that after approval)
            - Do NOT close the issue
            - STOP after step 11

      - name: Retry Claude (on failure)
        if: steps.check.outputs.should_run == 'true' && steps.process.outcome == 'failure'
        id: process_retry
        timeout-minutes: 30
        uses: anthropics/claude-code-action@4036a180cf690f49529f5d8c79c998855287f590  # v1
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_USER: ${{ github.event.issue.user.login }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: "--model opus --settings ${{ github.workspace }}/.claude/settings.json"
          prompt: |
            ## Task: Create New Specification

            You are creating a new plot specification.

            **This is a retry:** a first attempt failed partway, in this same checkout. Before
            step 1, look at what it left: `git status`, `git branch -a`, and the current issue
            title (`gh issue view $ISSUE_NUMBER --json title -q .title`). A
            `plots/{specification-id}/` directory on a `specification/{specification-id}` branch
            is that attempt's work, not a duplicate: finish the steps it did not reach instead of
            starting over, and never open a second pull request.

            ### Issue Details
            - **Title:** ${{ github.event.issue.title }}
            - **Number:** #${{ github.event.issue.number }}
            - **Author:** ${{ github.event.issue.user.login }}
            - **Body:**
            ```
            ${{ github.event.issue.body }}
            ```

            ---

            ## Instructions

            1. **Read the rules:** `prompts/spec-id-generator.md`

            2. **Check for duplicates:**
               - List all existing specs: `ls plots/`
               - Read existing specification files if titles seem similar
               - If duplicate found: Post comment explaining which spec matches, then STOP

            3. **Generate specification-id:**
               - Format: `{type}-{variant}` or `{type}-{variant}-{modifier}`
               - Examples: `scatter-basic`, `bar-grouped-horizontal`, `heatmap-correlation`
               - All lowercase, hyphens only

            4. **Create specification branch:**
               ```bash
               git checkout -b "specification/{specification-id}"
               ```

            5. **Post analysis comment:**
               Post a SHORT comment (max 3-4 sentences) to the issue using `gh issue comment`:
               - Is this a valid/useful plot type?
               - Does it already exist? (check `ls plots/`)
               - Any concerns?

            6. **Analyze reference materials (if present in issue):**
               - If the issue contains **images**: Analyze them to understand the desired visualization style, layout, and features. Incorporate visual requirements into the spec.
               - If the issue contains **external links** (GitHub repos, documentation, examples):
                 - Use WebFetch to read the linked page
                 - Understand what the referenced tool/library does
                 - Extract relevant features and patterns for the specification
               - Document insights from images/links in the spec's Description or Notes section

            7. **Create specification files:**
               - Read template: `prompts/templates/specification.md`
               - Read metadata template: `prompts/templates/specification.yaml`
               - Read tagging guide: `prompts/spec-tags-generator.md`
               - Create directory: `plots/{specification-id}/`
               - Create: `plots/{specification-id}/specification.md` (follow template structure)
               - End `specification.md` with the template's `## What a good version looks like`
                 section (after `## Notes`): 3-6 column-0 `- ` bullets, no sub-headings,
                 one line per bullet (no wrapped continuation lines), naming
                 what a viewer sees in a good render of THIS plot type. Start every bullet
                 with its kind, one kind per bullet: `A good version shows: ` for a property
                 a good render shows (the review deducts when it is missing), or
                 `Expected, not a defect: ` for something that can look like a flaw but is
                 inherent to the type (never penalized, never a target, no instruction in
                 it). Write at least one of each. Say how a good version handles an expected
                 item in its own `A good version shows: ` bullet, phrased conditionally
                 ("where bubbles overlap, …"). For a `-basic` id, add an `A good version shows: `
                 bullet about "the basic variant's …" encodings and nothing beyond them:
                 derived layers (trend or fit lines, mean or reference lines, bands, extra
                 series, derived color scales, marginals, facets, callouts) are outside a basic
                 variant, and an id that names a field's standard diagram lists the layers its
                 spec requires. No numeric thresholds, no generic ideals ("no overlap", "clean
                 design"), and nothing that contradicts Description, Data or Notes. The AI
                 review judges every implementation against this section. If the first attempt
                 left a `specification.md` without this section, add it; if it left bullets
                 without a kind prefix, fix them.
               - Check the section before you commit, and fix every `::error` these print and
                 every `::warning` that is not a false alarm:
                 `python3 -m automation.scripts.spec_characteristics_lint contract plots/{specification-id}/specification.md`
                 and
                 `python3 -m automation.scripts.spec_characteristics_lint style plots/{specification-id}/specification.md`.
                 CI runs the same contract check and blocks the merge on an error.
               - Create: `plots/{specification-id}/specification.yaml` with:
                 - `specification_id`: the generated id
                 - `title`: a proper title
                 - `created`: Use `$(date -u +"%Y-%m-%dT%H:%M:%SZ")` for current timestamp
                 - `issue`: $ISSUE_NUMBER
                 - `suggested`: $ISSUE_USER
                 - `tags`: Follow spec-tags-generator guide (4 dimensions: plot_type, data_type, domain, features)
               - Create empty folder: `plots/{specification-id}/implementations/python/`
               - Create empty folder: `plots/{specification-id}/metadata/python/`
               - Touch nothing outside `plots/{specification-id}/`: the merge job refuses a PR
                 that changes any other file.

            8. **Commit and push:**
               ```bash
               git config user.name "github-actions[bot]"
               git config user.email "github-actions[bot]@users.noreply.github.com"
               git add plots/{specification-id}/
               git commit -m "spec: add {specification-id} specification

               Created from issue #$ISSUE_NUMBER"
               git push -u origin "specification/{specification-id}"
               ```

            9. **Open the pull request:**
               `gh` in this step is authenticated as the Claude GitHub App, so the PR is opened
               by `claude[bot]`. That is deliberate: CI runs on it without a manual approval,
               and the merge job only merges a spec PR the Claude app opened. Run this with
               `{specification-id}` filled in, unchanged otherwise — same title and body, and
               no labels, reviewers or auto-merge:
               ```bash
               SPEC_ID="{specification-id}"
               EXISTING=$(gh pr list --repo "${{ github.repository }}" --head "specification/${SPEC_ID}" --base main --state open --json url -q '.[0].url // empty')
               if [ -n "$EXISTING" ]; then
                 echo "PR already open: $EXISTING"
               else
                 SPEC_CONTENT=$(cat "plots/${SPEC_ID}/specification.md")
                 BODY_FILE=$(mktemp)
                 printf '## New Specification: `%s`\n\nRelated to #%s\n\n---\n\n### specification.md\n\n%s\n\n---\n\n**Next:** Add `approved` label to the issue to merge this PR.\n\n---\n:robot: *[spec-create workflow](%s)*\n' \
                   "$SPEC_ID" "$ISSUE_NUMBER" "$SPEC_CONTENT" \
                   "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" > "$BODY_FILE"
                 gh pr create --repo "${{ github.repository }}" --base main --head "specification/${SPEC_ID}" \
                   --title "spec: add ${SPEC_ID} specification" --body-file "$BODY_FILE"
               fi
               ```
               If `gh pr create` fails, print its error and continue with step 10; the workflow
               reports the missing PR on the issue.

            10. **Update issue title:**
               ```bash
               gh issue edit $ISSUE_NUMBER --title "[{specification-id}] {original title}"
               ```

            11. **Output for workflow:**
               After completing, print these lines exactly:
               ```
               SPECIFICATION_ID={specification-id}
               BRANCH=specification/{specification-id}
               ```

            ---

            ## Important Rules
            - Open exactly ONE pull request, with the command in step 9 (it reuses an open one)
            - Do NOT add labels (to the issue or the PR)
            - Do NOT enable auto-merge or merge anything (the merge job does that after approval)
            - Do NOT close the issue
            - STOP after step 11

      - name: Extract outputs
        if: steps.check.outputs.should_run == 'true'
        id: extract
        run: |
          # Extract specification ID from issue title (now updated by Claude)
          TITLE=$(gh issue view "$ISSUE_NUMBER" --json title -q .title)
          SPEC_ID=$(echo "$TITLE" | sed -n 's/^\[\([a-z0-9-]*\)\].*/\1/p')

          if [[ -z "$SPEC_ID" ]]; then
            # A duplicate stops Claude before it renames the issue, so there is no
            # id to extract. Hand over to the validate step, which closes the issue
            # as a duplicate or fails with an issue comment.
            echo "::warning::No specification ID in the issue title: $TITLE"
            echo "specification_id=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Reserved spec slugs collide with top-level frontend routes.
          # Keep this list in sync with `RESERVED_TOP_LEVEL` in app/src/routes/paths.ts.
          RESERVED_SLUGS=(plots specs libraries palette about legal mcp stats debug map api og sitemap.xml robots.txt)
          for reserved in "${RESERVED_SLUGS[@]}"; do
            if [[ "$SPEC_ID" == "$reserved" ]]; then
              echo "::error::Spec ID '$SPEC_ID' collides with reserved top-level route. Choose a different slug."
              gh issue comment "$ISSUE_NUMBER" --body "**Error:** Generated spec ID \`${SPEC_ID}\` collides with a reserved top-level route. Please rename the issue with a more specific title and re-trigger."
              exit 1
            fi
          done

          echo "specification_id=$SPEC_ID" >> "$GITHUB_OUTPUT"
          echo "branch=specification/$SPEC_ID" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}

      - name: Validate specification was created (not duplicate)
        if: steps.check.outputs.should_run == 'true'
        id: validate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SPEC_ID: ${{ steps.extract.outputs.specification_id }}
          ISSUE_NUM: ${{ github.event.issue.number }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          # Check if specification directory was actually created (an empty id
          # means Claude never renamed the issue, which a duplicate also does)
          if [ -z "$SPEC_ID" ] || [ ! -d "plots/${SPEC_ID}" ]; then
            echo "::warning::Specification directory not created - likely a duplicate"

            # Get Claude's comment to find duplicate info
            COMMENT=$(gh issue view "$ISSUE_NUM" --json comments -q '.comments[-1].body' 2>/dev/null || echo "")

            if echo "$COMMENT" | grep -qi "duplicate\|exists\|already"; then
              echo "::notice::Claude detected duplicate - closing issue"

              gh label create "duplicate" --color "cfd3d7" \
                --description "Duplicate specification" 2>/dev/null || true

              gh issue edit "$ISSUE_NUM" --remove-label "spec-request" 2>/dev/null || true
              gh issue edit "$ISSUE_NUM" --add-label "duplicate" 2>/dev/null || true
              gh issue close "$ISSUE_NUM" --comment "**Duplicate detected:** Claude's analysis indicates this specification already exists. See previous comment for details."

              exit 0  # Not an error, just a duplicate; the steps below are skipped
            fi

            # If not a duplicate, something else failed
            echo "::error::Specification creation failed for unknown reason"
            gh issue comment "$ISSUE_NUM" --body "**Error:** Specification creation failed. Please check the [workflow logs](https://github.com/${REPOSITORY}/actions/runs/${RUN_ID}) for details."
            exit 1
          fi

          echo "::notice::Specification directory created successfully"
          echo "created=true" >> "$GITHUB_OUTPUT"

      - name: Find the pull request Claude opened
        if: steps.check.outputs.should_run == 'true' && steps.validate.outputs.created == 'true'
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SPEC_ID: ${{ steps.extract.outputs.specification_id }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          # How gh reports the author of a PR the Claude GitHub App (claude[bot])
          # opened; the merge job refuses a spec PR with any other author.
          CLAUDE_APP_LOGIN: app/claude
        run: |
          # Claude opened the PR in its own step (prompt step 9). Retried: a
          # missed read must not look like a missing PR.
          PR_JSON=""
          for attempt in 1 2 3; do
            PR_JSON=$(gh pr list --repo "$REPOSITORY" --head "specification/${SPEC_ID}" --base main \
              --state open --json number,url,author --jq '.[0] // empty' 2>/dev/null || true)
            if [ -n "$PR_JSON" ]; then
              break
            fi
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 5)); fi
          done

          RETRY_HINT="To retry, close any PR from \`specification/${SPEC_ID}\`, delete that branch, remove the \`[${SPEC_ID}]\` prefix from this issue's title, then remove and re-add the \`spec-request\` label."
          if [ -z "$PR_JSON" ]; then
            echo "::error::No open pull request from specification/${SPEC_ID}: Claude pushed the branch but did not open the PR"
            gh issue comment "$ISSUE_NUMBER" --repo "$REPOSITORY" --body "**Error:** Claude pushed \`specification/${SPEC_ID}\` but opened no pull request for it, so there is nothing to approve yet. Don't open one by hand: the merge job only merges a spec PR the Claude app opened. ${RETRY_HINT} See the [workflow logs](https://github.com/${REPOSITORY}/actions/runs/${RUN_ID})."
            exit 1
          fi

          PR_NUMBER=$(jq -r '.number' <<<"$PR_JSON")
          PR_AUTHOR=$(jq -r '.author.login // ""' <<<"$PR_JSON")
          if [ "$PR_AUTHOR" != "$CLAUDE_APP_LOGIN" ]; then
            echo "::error::PR #${PR_NUMBER} was opened by '${PR_AUTHOR}', not the Claude app ('${CLAUDE_APP_LOGIN}'); the merge job would refuse it"
            gh issue comment "$ISSUE_NUMBER" --repo "$REPOSITORY" --body "**Error:** The open PR from \`specification/${SPEC_ID}\` (#${PR_NUMBER}) was opened by \`${PR_AUTHOR}\`, not by the Claude app, so the merge job would refuse it. ${RETRY_HINT} See the [workflow logs](https://github.com/${REPOSITORY}/actions/runs/${RUN_ID})."
            exit 1
          fi

          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "pr_url=$(jq -r '.url' <<<"$PR_JSON")" >> "$GITHUB_OUTPUT"

      - name: Comment on issue
        if: steps.check.outputs.should_run == 'true' && steps.validate.outputs.created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SPEC_ID: ${{ steps.extract.outputs.specification_id }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          SPEC_CONTENT=$(cat "plots/${SPEC_ID}/specification.md")

          # Unquoted heredoc so $VARS expand (a quoted <<'EOF' shipped literal
          # "$SPEC_CONTENT" into comments). Literal backticks are escaped so
          # the shell doesn't treat them as command substitution; variable
          # *values* (e.g. backticks inside specification.md) are inserted
          # verbatim without re-evaluation.
          BODY_FILE=$(mktemp)
          cat > "$BODY_FILE" <<EOF
          ## :white_check_mark: Specification Ready: \`${SPEC_ID}\`

          **PR:** #${PR_NUMBER}

          ---

          ### specification.md

          ${SPEC_CONTENT}

          ---

          **Next:** Add \`approved\` label to merge this specification to main.

          ---
          :robot: *[spec-create workflow](https://github.com/${REPOSITORY}/actions/runs/${RUN_ID})*
          EOF

          gh issue comment "$ISSUE_NUMBER" --body-file "$BODY_FILE"

      - name: Add rocket reaction on success
        if: steps.check.outputs.should_run == 'true' && steps.validate.outputs.created == 'true' && success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh api "repos/${REPOSITORY}/issues/${ISSUE_NUMBER}/reactions" \
            -f content=rocket

  # ============================================================================
  # Job 2: Merge specification (triggered by approved label)
  # ============================================================================
  # Only the repository owner's `approved` counts, and only a PR the Claude app
  # opened is merged — after fail-closed checks of who opened it, where it
  # points, and which files it changes. The merge stays on GITHUB_TOKEN and
  # never bypasses the ruleset: auto-merge waits for the required checks, which
  # run on a claude[bot] PR without a manual approval.
  #
  # No job-level concurrency group on purpose: GitHub keeps ONE pending run per
  # group and cancels the older pending run when another one queues, so the
  # shared `spec-merge-main` group this job used to have cancelled 7 of 10 batch
  # approvals on 2026-06-10. Spec PRs change disjoint directories and the main
  # ruleset is not strict, so there is nothing to serialize across issues; the
  # workflow-level group still serializes the runs of one issue.
  merge:
    if: >
      github.event.label.name == 'approved' &&
      contains(github.event.issue.labels.*.name, 'spec-request') &&
      github.event.sender.login == github.repository_owner &&
      github.triggering_actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write       # squash-merge, delete the head branch
      pull-requests: write  # enable / disable auto-merge
      issues: write         # labels and comments on the issue
      actions: write        # gh workflow run sync-postgres.yml

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # The file guard diffs the PR head against its merge base with main.
          fetch-depth: 0

      - name: Extract specification ID
        id: extract
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          SPEC_ID=$(echo "$ISSUE_TITLE" | sed -n 's/^\[\([a-z0-9-]*\)\].*/\1/p')

          if [[ -z "$SPEC_ID" ]]; then
            echo "::error::Could not extract specification ID from title: $ISSUE_TITLE"
            exit 1
          fi

          echo "specification_id=$SPEC_ID" >> "$GITHUB_OUTPUT"

      - name: Verify the pull request (fail closed)
        id: verify
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SPEC_ID: ${{ steps.extract.outputs.specification_id }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          # How gh reports the author of a PR the Claude GitHub App (claude[bot])
          # opened — e.g. the spec-polish PR #10454.
          CLAUDE_APP_LOGIN: app/claude
        run: |
          set -euo pipefail
          HEAD_BRANCH="specification/${SPEC_ID}"
          # "#<issue>" as a whole reference: not "#<issue>0", not "&#<issue>;".
          ISSUE_REF_RE="(^|[^0-9A-Za-z_&])#${ISSUE_NUMBER}([^0-9]|$)"

          # Refusal: explain on the issue, then fail the job. $1 names what was
          # checked, the remaining arguments are the reasons.
          refuse() {
            local subject="$1"
            shift
            local body_file
            body_file=$(mktemp)
            {
              printf '## :no_entry: Specification not merged\n\n'
              printf "\`approved\` was added, but %s did not pass the merge checks:\n\n" "$subject"
              printf -- '- %s\n' "$@"
              printf "\nThe merge job only merges an open PR from \`%s\` into \`main\` that the Claude app opened for this issue and that changes nothing but \`plots/%s/specification.md\`, \`specification.yaml\` and \`.gitkeep\` placeholders under \`implementations/\` and \`metadata/\`. **Do not approve workflow runs for a PR that touches anything else, and do not merge it by hand.**\n\n" "$HEAD_BRANCH" "$SPEC_ID"
              printf -- '---\n:robot: *[spec-create workflow](https://github.com/%s/actions/runs/%s)*\n' "$REPOSITORY" "$RUN_ID"
            } > "$body_file"
            printf '::error::Refused: %s\n' "$@"
            gh issue comment "$ISSUE_NUMBER" --repo "$REPOSITORY" --body-file "$body_file"
            echo "refused=true" >> "$GITHUB_OUTPUT"
            exit 1
          }

          # Retried: an API blip must fail the job, never skip a check.
          PRS=""
          for attempt in 1 2 3; do
            if PRS=$(gh pr list --repo "$REPOSITORY" --head "$HEAD_BRANCH" --state all --limit 50 \
                --json number,state,headRefName,headRefOid,baseRefName,isCrossRepository,author,body); then
              break
            fi
            PRS=""
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 5)); fi
          done
          if [ -z "$PRS" ]; then
            echo "::error::Could not list the pull requests from ${HEAD_BRANCH}"
            exit 1
          fi

          OPEN=$(jq -c '[.[] | select(.state == "OPEN")]' <<<"$PRS")
          case "$(jq 'length' <<<"$OPEN")" in
            1) ;;
            0)
              # A re-run after the merge already landed: nothing is left to
              # verify or merge, and the post-merge steps are idempotent.
              MERGED=$(jq -c --arg re "$ISSUE_REF_RE" \
                '[.[] | select(.state == "MERGED" and .baseRefName == "main" and ((.body // "") | test($re)))] | max_by(.number) // empty' \
                <<<"$PRS")
              if [ -n "$MERGED" ]; then
                PR_NUMBER=$(jq -r '.number' <<<"$MERGED")
                echo "::notice::PR #${PR_NUMBER} from ${HEAD_BRANCH} is already merged; continuing with the post-merge steps"
                {
                  echo "already_merged=true"
                  echo "pr_number=${PR_NUMBER}"
                  echo "head_sha=$(jq -r '.headRefOid' <<<"$MERGED")"
                } >> "$GITHUB_OUTPUT"
                exit 0
              fi
              refuse "no pull request" "there is no open pull request from \`${HEAD_BRANCH}\`"
              ;;
            *)
              refuse "no single pull request" "more than one open pull request comes from \`${HEAD_BRANCH}\`"
              ;;
          esac

          PR=$(jq -c '.[0]' <<<"$OPEN")
          PR_NUMBER=$(jq -r '.number' <<<"$PR")
          HEAD_SHA=$(jq -r '.headRefOid' <<<"$PR")
          AUTHOR=$(jq -r '.author.login // ""' <<<"$PR")
          REASONS=()
          if [ "$(jq -r '.headRefName' <<<"$PR")" != "$HEAD_BRANCH" ]; then
            REASONS+=("its head branch is not \`${HEAD_BRANCH}\`")
          fi
          if [ "$AUTHOR" != "$CLAUDE_APP_LOGIN" ]; then
            REASONS+=("it was opened by \`${AUTHOR}\`, not by the Claude app (\`${CLAUDE_APP_LOGIN}\`)")
          fi
          if [ "$(jq -r '.isCrossRepository' <<<"$PR")" != "false" ]; then
            REASONS+=("its head branch lives in another repository")
          fi
          if [ "$(jq -r '.baseRefName' <<<"$PR")" != "main" ]; then
            REASONS+=("it does not target \`main\`")
          fi
          if ! jq -e --arg re "$ISSUE_REF_RE" '(.body // "") | test($re)' <<<"$PR" > /dev/null; then
            REASONS+=("its description does not reference issue #${ISSUE_NUMBER}")
          fi

          if [[ ! "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            REASONS+=("its head commit could not be read")
          else
            # The diff is read locally from the exact head SHA, not from the
            # API's file list: what gets squashed is merge-base..HEAD_SHA.
            git fetch --no-tags --quiet origin "+refs/heads/main:refs/remotes/origin/main" "$HEAD_SHA"
            set +e
            VIOLATIONS=$(python3 automation/scripts/spec_pr_guard.py \
              --spec-id "$SPEC_ID" --head "$HEAD_SHA" --base origin/main)
            GUARD_RC=$?
            set -e
            case "$GUARD_RC" in
              0) ;;
              1)
                COUNT=0
                while IFS= read -r line; do
                  COUNT=$((COUNT + 1))
                  if [ "$COUNT" -le 20 ]; then REASONS+=("it changes ${line}"); fi
                done <<<"$VIOLATIONS"
                if [ "$COUNT" -gt 20 ]; then REASONS+=("… and $((COUNT - 20)) more file(s)"); fi
                ;;
              *)
                echo "::error::The file guard could not read the diff of ${HEAD_SHA} (exit ${GUARD_RC})"
                exit 1
                ;;
            esac
          fi

          if [ "${#REASONS[@]}" -gt 0 ]; then
            refuse "PR #${PR_NUMBER}" "${REASONS[@]}"
          fi

          echo "::notice::PR #${PR_NUMBER} verified at ${HEAD_SHA}: opened by the Claude app, changes only the spec files of plots/${SPEC_ID}/"
          {
            echo "already_merged=false"
            echo "pr_number=${PR_NUMBER}"
            echo "head_sha=${HEAD_SHA}"
          } >> "$GITHUB_OUTPUT"

      - name: Merge once the required checks pass
        if: steps.verify.outputs.already_merged == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.verify.outputs.pr_number }}
          HEAD_SHA: ${{ steps.verify.outputs.head_sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          # No --admin: the required checks ran on the Claude app's PR without
          # an approval, and the merge waits for them instead of bypassing them.
          # `--auto` hands the squash to GitHub for when they pass; gh merges
          # straight away when they already have. `--match-head-commit` pins
          # either to the SHA verified above, so a head that moved is refused.
          MERR=""
          for attempt in 1 2 3; do
            STATE=$(gh pr view "$PR_NUMBER" --repo "$REPOSITORY" --json state -q .state 2>/dev/null || echo "")
            if [ "$STATE" = "MERGED" ]; then
              echo "::notice::PR #${PR_NUMBER} is already merged"
              exit 0
            fi
            if gh pr merge "$PR_NUMBER" --repo "$REPOSITORY" --squash --delete-branch --auto \
                --match-head-commit "$HEAD_SHA" 2> /tmp/merge.err; then
              echo "::notice::PR #${PR_NUMBER}: merged, or auto-merge enabled at ${HEAD_SHA}"
              exit 0
            fi
            MERR=$(head -c 500 /tmp/merge.err | tr '\n' ' ')
            echo "::warning::gh pr merge failed (attempt ${attempt}/3): ${MERR}"
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 10)); fi
          done
          echo "Could not merge PR #${PR_NUMBER} or enable auto-merge for it: ${MERR}" > "$RUNNER_TEMP/merge-failure.txt"
          echo "::error::Could not merge PR #${PR_NUMBER} or enable auto-merge for it: ${MERR}"
          exit 1

      - name: Wait for the merge to land
        id: wait
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.verify.outputs.pr_number }}
          HEAD_SHA: ${{ steps.verify.outputs.head_sha }}
          ALREADY_MERGED: ${{ steps.verify.outputs.already_merged }}
          REPOSITORY: ${{ github.repository }}
        run: |
          # With auto-merge on, the merge lands when the required checks finish,
          # after the step above has returned. Bounded at 15 minutes: past that
          # auto-merge is turned off again, so the PR cannot land later without
          # the sync, the label and the comment below.
          fail() {
            echo "$1" > "$RUNNER_TEMP/merge-failure.txt"
            echo "::error::$1"
            exit 1
          }
          disable_auto() {
            gh pr merge "$PR_NUMBER" --repo "$REPOSITORY" --disable-auto > /dev/null 2>&1 || true
          }

          DEADLINE=$((SECONDS + 900))
          NO_AUTO=0
          LAST_STATUS="unknown"
          REVIEW_DECISION=""
          while :; do
            if VIEW=$(gh pr view "$PR_NUMBER" --repo "$REPOSITORY" \
                --json state,headRefOid,mergeStateStatus,reviewDecision,autoMergeRequest,mergeCommit 2>/dev/null); then
              STATE=$(jq -r '.state' <<<"$VIEW")
              HEAD=$(jq -r '.headRefOid' <<<"$VIEW")
              LAST_STATUS=$(jq -r '"\(.mergeStateStatus), review decision: \(.reviewDecision // "none")"' <<<"$VIEW")
              REVIEW_DECISION=$(jq -r '.reviewDecision // ""' <<<"$VIEW")
              if [ "$STATE" = "MERGED" ]; then
                if [ "$ALREADY_MERGED" != "true" ] && [ "$HEAD" != "$HEAD_SHA" ]; then
                  fail "PR #${PR_NUMBER} merged at head ${HEAD}, not at the verified ${HEAD_SHA}. Check what landed in main before labelling the spec ready."
                fi
                echo "::notice::PR #${PR_NUMBER} is merged ($(jq -r '.mergeCommit.oid // "unknown commit"' <<<"$VIEW"))"
                echo "merged=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              if [ "$STATE" = "CLOSED" ]; then
                fail "PR #${PR_NUMBER} was closed without being merged."
              fi
              if [ "$HEAD" != "$HEAD_SHA" ]; then
                disable_auto
                fail "The head of PR #${PR_NUMBER} moved from the verified ${HEAD_SHA} to ${HEAD}, so auto-merge was turned off. Remove and re-add \`approved\` to verify the new head."
              fi
              if [ "$(jq -r '.autoMergeRequest == null' <<<"$VIEW")" = "true" ]; then
                NO_AUTO=$((NO_AUTO + 1))
                if [ "$NO_AUTO" -ge 3 ]; then
                  fail "PR #${PR_NUMBER} is open with auto-merge off (merge state: ${LAST_STATUS}). Once its required checks are green, re-run this job or remove and re-add \`approved\`."
                fi
              else
                NO_AUTO=0
              fi
            else
              echo "::warning::Could not read PR #${PR_NUMBER}; trying again"
            fi
            if [ "$SECONDS" -ge "$DEADLINE" ]; then
              disable_auto
              HINT="Once its required checks are green, re-run this job or remove and re-add \`approved\`."
              if [ "$REVIEW_DECISION" = "REVIEW_REQUIRED" ]; then
                # The main ruleset's "extra approval for unattributed changes" can hold an
                # App-opened PR for one human review even at 0 required approvals; re-running
                # this job would only time out again.
                HINT="The main ruleset wants an approving review on the Claude app's PR (its 'extra approval for unattributed changes' setting): approve PR #${PR_NUMBER}, then remove and re-add \`approved\`."
              fi
              fail "PR #${PR_NUMBER} did not merge within 15 minutes (merge state: ${LAST_STATUS}), so auto-merge was turned off. ${HINT}"
            fi
            sleep 20
          done

      - name: Trigger database sync
        id: sync
        if: steps.wait.outputs.merged == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          # A merge made with GITHUB_TOKEN (directly, or through auto-merge that
          # GITHUB_TOKEN enabled) triggers no workflows, so sync-postgres.yml's
          # own `push: main` trigger never fires for it. Dispatch it the way
          # impl-merge.yml does; the run checks out main as it is now, which
          # already contains this merge.
          for attempt in 1 2 3; do
            if gh workflow run sync-postgres.yml --repo "$REPOSITORY" --ref main; then
              echo "::notice::Dispatched sync-postgres.yml"
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 10)); fi
          done
          echo "::error::Could not dispatch sync-postgres.yml"
          exit 1

      - name: Update issue labels
        if: ${{ !cancelled() && steps.wait.outputs.merged == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          # Remove trigger, add status
          gh issue edit "$ISSUE_NUMBER" --remove-label "spec-request" 2>/dev/null || true
          gh issue edit "$ISSUE_NUMBER" --add-label "spec-ready"

      - name: Comment on issue
        if: ${{ !cancelled() && steps.wait.outputs.merged == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SPEC_ID: ${{ steps.extract.outputs.specification_id }}
          PR_NUMBER: ${{ steps.verify.outputs.pr_number }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          SYNC_OUTCOME: ${{ steps.sync.outcome }}
        run: |
          if [ "$SYNC_OUTCOME" = "success" ]; then
            SYNC_LINE="The specification is now in \`main\`, and \`sync-postgres.yml\` has been dispatched to load it into PostgreSQL."
          else
            SYNC_LINE=":warning: The specification is now in \`main\`, but \`sync-postgres.yml\` could not be dispatched, so PostgreSQL does not have it yet. Run \`gh workflow run sync-postgres.yml\`."
          fi

          # Unquoted heredoc + --body-file: see the create job's "Comment on
          # issue" step for why (variable expansion with escaped literal backticks).
          BODY_FILE=$(mktemp)
          cat > "$BODY_FILE" <<EOF
          ## :rocket: Specification Merged!

          **Specification:** \`${SPEC_ID}\`
          **PR:** #${PR_NUMBER} (merged)

          ${SYNC_LINE}

          ---

          **Next:** Add \`generate:{library}\` labels to start generating implementations.

          Available libraries: \`matplotlib\`, \`seaborn\`, \`plotly\`, \`bokeh\`, \`altair\`, \`plotnine\`, \`pygal\`, \`highcharts\`, \`letsplot\`, \`ggplot2\`, \`makie\`, \`chartjs\`, \`d3\`, \`echarts\`, \`muix\`

          Or use workflow dispatch for bulk operations.

          ---
          :robot: *[spec-create workflow](https://github.com/${REPOSITORY}/actions/runs/${RUN_ID})*
          EOF

          gh issue comment "$ISSUE_NUMBER" --body-file "$BODY_FILE"

      - name: Report failure on the issue
        # A refusal already explained itself; a merge that landed is reported
        # by the steps above even when the sync dispatch failed.
        if: failure() && steps.verify.outputs.refused != 'true' && steps.wait.outputs.merged != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          REASON="See the workflow logs."
          if [ -s "$RUNNER_TEMP/merge-failure.txt" ]; then
            REASON=$(cat "$RUNNER_TEMP/merge-failure.txt")
          fi
          gh issue comment "$ISSUE_NUMBER" --repo "$REPOSITORY" \
            --body "**Error:** The merge job did not finish. ${REASON} ([workflow logs](https://github.com/${REPOSITORY}/actions/runs/${RUN_ID}))"
