name: "CI: Tests"
run-name: "Tests: ${{ github.ref_name }}"

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
  pull_request:
    branches:
      - main
      - develop
      - 'specification/**'
      - 'implementation/**'
      # Jules sub-PRs into a feature branch (/jules-task) get tests before Claude
      # merges them; they run without secrets (UNTRUSTED_AUTHOR below).
      - 'feature/**'
  merge_group:
  workflow_dispatch:
    inputs:
      force_run:
        description: 'Force run all tests (ignore change detection)'
        type: boolean
        default: true

concurrency:
  group: ci-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # Required for Workload Identity Federation

    env:
      ENVIRONMENT: test
      # Authors whose code runs here before anyone has read it get no GCP login,
      # no Cloud SQL proxy, and no database password, only unit and integration
      # tests: Dependabot, and Google Jules (`/jules-task`), whose PRs open
      # straight from its cloud session. The PR author is the reliable signal;
      # `github.actor` on a Jules branch is often the repository owner.
      UNTRUSTED_AUTHOR: ${{ github.actor == 'dependabot[bot]' || github.event.pull_request.user.login == 'google-labs-jules[bot]' }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        fetch-depth: 0

    - name: Check for testable changes
      id: check
      run: |
        if [[ "${{ github.event_name }}" == "pull_request" ]]; then
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          CHANGED_FILES=$(git diff --name-only $BASE_SHA $HEAD_SHA)
        elif [[ "${{ github.event_name }}" == "merge_group" ]]; then
          BASE_SHA="${{ github.event.merge_group.base_sha }}"
          HEAD_SHA="${{ github.event.merge_group.head_sha }}"
          CHANGED_FILES=$(git diff --name-only $BASE_SHA $HEAD_SHA)
        else
          CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "")
        fi

        echo "Changed files:"
        echo "$CHANGED_FILES"

        # Changed specification.md files that still exist, for the style part
        # of "Check spec characteristic sections" (next step).
        : > "$RUNNER_TEMP/changed_specs.txt"
        while IFS= read -r spec; do
          if [[ -f "$spec" ]]; then echo "$spec" >> "$RUNNER_TEMP/changed_specs.txt"; fi
        done < <(echo "$CHANGED_FILES" | grep -E '^plots/[^/]+/specification\.md$' || true)

        # Check for Python changes outside plots/ (api, core, tests, automation)
        # Plot implementations don't have unit tests
        TESTABLE_CHANGES=$(echo "$CHANGED_FILES" | grep '\.py$' | grep -v '^plots/' || true)

        # Also run tests when the test configuration, a lock file or pinned runtime, a
        # workflow or action, or a prompt changes: tests/unit/workflows parses every
        # workflow YAML, tests/unit/prompts reads the prompt files, and
        # tests/unit/core/test_version_sources.py checks that every version resolves
        # from uv.lock, package-lock.json, Manifest.toml and .python-version.
        CONFIG_CHANGES=$(echo "$CHANGED_FILES" | grep -E '^(pyproject\.toml|pytest\.ini|conftest\.py|uv\.lock|package\.json|package-lock\.json|Project\.toml|Manifest\.toml|\.python-version)$|^(\.github/workflows/|\.github/actions/|prompts/)' || true)

        # Force run on workflow_dispatch with force_run=true
        if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.force_run }}" == "true" ]]; then
          echo "Manual trigger with force_run=true, will run tests"
          echo "should_test=true" >> $GITHUB_OUTPUT
        elif [[ -n "$TESTABLE_CHANGES" ]]; then
          echo "Found testable Python changes, will run tests"
          echo "should_test=true" >> $GITHUB_OUTPUT
        elif [[ -n "$CONFIG_CHANGES" ]]; then
          echo "Found test config changes ($CONFIG_CHANGES), will run tests"
          echo "should_test=true" >> $GITHUB_OUTPUT
        else
          echo "No testable changes (only plots/ or non-Python), skipping tests"
          echo "should_test=false" >> $GITHUB_OUTPUT
        fi

    # Unconditional: the spec check below runs on every event, and it imports
    # regen_gate, whose PEP 758 `except A, B:` parses on Python 3.14 only.
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version-file: '.python-version'

    # Runs on every event, whatever should_test says: spec-only PRs (spec-create,
    # spec polish, the characteristics backfill) skip pytest, and this job is a
    # required check. The contract (the shape the regen gate parses) is checked
    # over every spec and blocks; house style is checked on the changed specs
    # and only warns. Standard library only — setup-python's python3, no uv.
    - name: Check spec characteristic sections
      run: |
        echo "python3: $(python3 --version)"
        status=0
        python3 -m automation.scripts.spec_characteristics_lint contract --all || status=$?
        if [[ -s "$RUNNER_TEMP/changed_specs.txt" ]]; then
          mapfile -t CHANGED_SPECS < "$RUNNER_TEMP/changed_specs.txt"
          python3 -m automation.scripts.spec_characteristics_lint style "${CHANGED_SPECS[@]}" || status=$?
        else
          echo "No changed specification.md files; style check skipped"
        fi
        exit "$status"

    - name: Install uv
      if: steps.check.outputs.should_test == 'true'
      uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0

    # Before the install: `uv sync` would silently re-lock in the runner, while the
    # pipeline and the images install the committed lock with `--frozen`, so a
    # pyproject.toml edit without a re-lock would pass here and never reach them.
    - name: Check uv.lock is up to date with pyproject.toml
      if: steps.check.outputs.should_test == 'true'
      run: uv lock --check

    - name: Install dependencies
      if: steps.check.outputs.should_test == 'true'
      run: uv sync --extra test --extra agents

    # Dependabot PRs run from forks and cannot access repository secrets, and
    # Jules PRs carry code nobody has read yet (UNTRUSTED_AUTHOR), so both skip
    # GCP auth + Cloud SQL Proxy + Codecov upload. Only unit and integration
    # tests run for them (no e2e — those need real Postgres); a Jules change
    # gets e2e on the push its merge makes.

    - name: Authenticate to GCP
      if: steps.check.outputs.should_test == 'true' && env.UNTRUSTED_AUTHOR != 'true'
      uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093  # v3
      with:
        project_id: anyplot
        workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}

    - name: Start Cloud SQL Proxy
      if: steps.check.outputs.should_test == 'true' && env.UNTRUSTED_AUTHOR != 'true'
      run: |
        # Download Cloud SQL Proxy
        curl -o cloud-sql-proxy https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.14.3/cloud-sql-proxy.linux.amd64
        chmod +x cloud-sql-proxy

        # Start proxy in background (localhost:5432 -> Cloud SQL)
        ./cloud-sql-proxy --port 5432 ${{ secrets.INSTANCE_CONNECTION_NAME }} &

        # Wait for the proxy to accept connections: poll every 0.2 s, give up after 10 s
        ready=false
        for _ in $(seq 50); do
          if (exec 3<>/dev/tcp/127.0.0.1/5432) 2>/dev/null; then ready=true; break; fi
          sleep 0.2
        done
        if [[ "$ready" != true ]]; then
          echo "::error::Cloud SQL Proxy did not open 127.0.0.1:5432 within 10 s"
          exit 1
        fi

        # Set DATABASE_URL for tests
        echo "DATABASE_URL=postgresql+asyncpg://${{ secrets.DB_USER }}:${{ secrets.DB_PASS }}@localhost:5432/${{ secrets.DB_NAME }}" >> $GITHUB_ENV

    - name: Run all tests with coverage
      if: steps.check.outputs.should_test == 'true' && env.UNTRUSTED_AUTHOR != 'true'
      run: |
        uv run pytest tests/unit tests/integration tests/e2e \
          -v --tb=short \
          -n 4 --dist worksteal --durations=25 \
          --cov=core --cov=api --cov=automation --cov=agentic/workflows/modules --cov=agents \
          --cov-report=term-missing \
          --cov-report=xml
      # Tests include:
      # - Unit tests: Fast, mocked dependencies
      # - Integration tests: SQLite in-memory for repository layer
      # - E2E tests: Real PostgreSQL with separate 'test' database

    - name: Run unit + integration tests (Dependabot, Jules)
      if: steps.check.outputs.should_test == 'true' && env.UNTRUSTED_AUTHOR == 'true'
      run: |
        uv run pytest tests/unit tests/integration -v --tb=short -n 4 --dist worksteal

    - name: Upload coverage to GitHub Artifacts
      if: steps.check.outputs.should_test == 'true' && env.UNTRUSTED_AUTHOR != 'true' && always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
      with:
        name: coverage-report
        path: coverage.xml
        retention-days: 30

    - name: Upload coverage to Codecov
      if: steps.check.outputs.should_test == 'true' && env.UNTRUSTED_AUTHOR != 'true'
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7.1.1
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./coverage.xml
        flags: backend
        fail_ci_if_error: false

    - name: Skip notice
      if: steps.check.outputs.should_test == 'false'
      run: echo "::notice::Tests skipped - no testable Python changes (only plots/ or non-Python files); the spec characteristic-section check still ran"

  test-frontend:
    name: Run Frontend Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        fetch-depth: 0

    - name: Check for frontend changes
      id: check
      run: |
        if [[ "${{ github.event_name }}" == "pull_request" ]]; then
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          CHANGED_FILES=$(git diff --name-only $BASE_SHA $HEAD_SHA)
        elif [[ "${{ github.event_name }}" == "merge_group" ]]; then
          BASE_SHA="${{ github.event.merge_group.base_sha }}"
          HEAD_SHA="${{ github.event.merge_group.head_sha }}"
          CHANGED_FILES=$(git diff --name-only $BASE_SHA $HEAD_SHA)
        else
          CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "")
        fi

        echo "Changed files:"
        echo "$CHANGED_FILES"

        # Check for frontend changes
        FRONTEND_CHANGES=$(echo "$CHANGED_FILES" | grep '^app/' || true)

        # Force run on workflow_dispatch with force_run=true
        if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.force_run }}" == "true" ]]; then
          echo "Manual trigger with force_run=true, will run frontend tests"
          echo "should_test=true" >> $GITHUB_OUTPUT
        elif [[ -n "$FRONTEND_CHANGES" ]]; then
          echo "Found frontend changes, will run tests"
          echo "should_test=true" >> $GITHUB_OUTPUT
        else
          echo "No frontend changes, skipping frontend tests"
          echo "should_test=false" >> $GITHUB_OUTPUT
        fi

    - name: Set up Node.js
      if: steps.check.outputs.should_test == 'true'
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v6
      with:
        node-version: '24'
        cache: 'yarn'
        cache-dependency-path: app/yarn.lock

    - name: Install dependencies
      if: steps.check.outputs.should_test == 'true'
      working-directory: app
      run: yarn install --frozen-lockfile

    - name: Lint frontend
      if: steps.check.outputs.should_test == 'true'
      working-directory: app
      run: yarn lint

    - name: Check frontend formatting
      if: steps.check.outputs.should_test == 'true'
      working-directory: app
      run: yarn fm:check

    - name: Type-check frontend (app + tests)
      if: steps.check.outputs.should_test == 'true'
      working-directory: app
      run: yarn type-check

    - name: Run frontend tests with coverage
      if: steps.check.outputs.should_test == 'true'
      working-directory: app
      run: yarn test --coverage

    - name: Upload frontend coverage to Codecov
      # No Codecov token after a Jules PR's code ran (see UNTRUSTED_AUTHOR in the test job).
      if: steps.check.outputs.should_test == 'true' && github.event.pull_request.user.login != 'google-labs-jules[bot]'
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7.1.1
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./app/coverage/coverage-final.json
        flags: frontend
        fail_ci_if_error: false

    - name: Skip notice
      if: steps.check.outputs.should_test == 'false'
      run: echo "::notice::Frontend tests skipped - no app/ changes"
