name: "Setup R + ggplot2"
description: >-
  Installs R, the system libraries needed for headless plot rendering, and the
  package set used by anyplot's R implementations (ggplot2 + tidyverse helpers
  + ragg device + dataset packages). Packages are installed from a pinned
  Posit Package Manager snapshot for reproducibility; transitive dependencies
  are resolved by R's installer so the package set stays self-consistent.
inputs:
  r-version:
    description: "R version to install"
    required: false
    # Bump together with the snapshot date below: Posit Package Manager serves
    # resolute binaries per R minor version, so a new R needs a snapshot that has them.
    default: "4.6.1"

runs:
  using: "composite"
  steps:
    - name: Install R
      # r-lib/actions ships every sub-action from a single repo and tags them
      # together; pinned to the v2 tag's commit SHA like every workflow-level
      # action in this repo (Dependabot keeps the pin fresh).
      uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05  # v2
      with:
        r-version: ${{ inputs.r-version }}
        use-public-rspm: true

    # ragg needs libfreetype/libpng/libtiff/libjpeg headers; systemfonts needs
    # libfontconfig1. These are pre-built on ubuntu-latest as binaries via
    # Posit Package Manager, but keeping the apt fallback makes the action
    # robust against future runner-image changes.
    - name: Install system dependencies for ragg / systemfonts
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          libcurl4-openssl-dev \
          libssl-dev \
          libxml2-dev \
          libfontconfig1-dev \
          libfreetype-dev \
          libpng-dev \
          libtiff5-dev \
          libjpeg-dev \
          libharfbuzz-dev \
          libfribidi-dev

    - name: Install R packages
      # install.packages auto-resolves transitive dependencies that a hand-written
      # renv.lock used to miss (munsell, gtable, colorspace, R6, RColorBrewer, ...).
      # Pinning to a dated Posit Package Manager snapshot keeps versions
      # reproducible without needing a fully-populated lockfile. The `resolute`
      # URL matches the ubuntu-latest runner image (Ubuntu 26.04 since October
      # 2026). Change the codename whenever GitHub moves the runner OS: Posit
      # builds each binary against one release's system libraries, and the
      # former `noble` (24.04) binaries installed fine on 26.04 but stringi
      # failed to load there (it links libicuuc.so.74; 26.04 ships ICU 78).
      # Bump the snapshot date deliberately.
      #
      # Snapshot 2026-10-20 ships ggplot2 4.0.3. The repository has no R lock
      # file, so this line stands in for one: core/library_versions.py reads
      # ggplot2's version from it for the database sync, but only while its date
      # is the one in the URL below. A new snapshot date fails
      # tests/unit/core/test_version_sources.py until this line names the ggplot2
      # version the new snapshot installs (packageVersion("ggplot2") in a run).
      #
      # Every package below installs from this snapshot as a resolute binary for
      # R 4.6.1. ggplot2 4.0 changes rendering defaults; the changes that matter
      # to generated code are listed in prompts/library/ggplot2.md.
      #
      # dependencies is restricted to required types (Depends/Imports/LinkingTo);
      # the default `NA` is identical but explicit is clearer. `TRUE` would also
      # pull in Suggests (sf, Hmisc, maps, quantreg, ...) — none of which the
      # implementations need, and several of which require apt packages we
      # don't install.
      shell: bash
      run: |
        Rscript -e '
          options(
            repos = c(CRAN = "https://packagemanager.posit.co/cran/__linux__/resolute/2026-10-20"),
            Ncpus = parallel::detectCores()
          )
          install.packages(
            c("ggplot2", "ragg", "tidyr", "dplyr", "viridis",
              "palmerpenguins", "gapminder", "tibble", "scales",
              "systemfonts", "textshaping", "patchwork"),
            dependencies = c("Depends", "Imports", "LinkingTo")
          )
        '

    - name: Smoke-test ggplot2 renders a PNG
      # Loading tidyr and stringr also loads stringi, whose binary links the
      # distro ICU by soname; str_detect() then calls into it. A Posit binary
      # built for another Ubuntu release installs without error and fails only
      # here, at load time, instead of in the middle of a generation run.
      shell: bash
      run: |
        Rscript -e '
          library(ggplot2); library(ragg); library(tidyr); library(stringr)
          stopifnot(str_detect("anyplot", "plot"))
          tmp <- tempfile(fileext = ".png")
          ggsave(tmp, ggplot(mtcars, aes(wt, mpg)) + geom_point(),
                 device = ragg::agg_png, width = 4, height = 3, dpi = 100)
          stopifnot(file.exists(tmp), file.info(tmp)$size > 0)
          cat("ok: ", tmp, " (", file.info(tmp)$size, " bytes)\n", sep = "")
        '
