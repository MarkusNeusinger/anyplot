<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  The fontconfig file of the lets-plot command row (FONTCONFIG_FILE, agents/renderer/commands.py),
  copied to /opt/anyplot/fonts.conf by agents/renderer/Dockerfile. lets-plot's native bridge links its
  own fontconfig, which finds no configuration in the image's layout. One font directory and no
  cachedir: the bridge scans the fonts and never writes a cache.
-->
<fontconfig>
  <dir>/usr/share/fonts</dir>
</fontconfig>
