# Cloud Build configuration for anyplot-renderer, the sandbox renderer of the
# agent network (agents/renderer/, docs/concepts/agent-network.md "Serving and
# infrastructure").
#
# Same candidate -> smoke -> promote shape as api/cloudbuild.yaml: the new
# revision is deployed without traffic under the `candidate` tag, smoked on its
# tag URL, and only then given 100 % of the traffic. One difference: the deploy
# step creates the service itself on the very first build. gcloud refuses
# `--no-traffic` for a service that does not exist yet, so when `services
# describe` answers that the service is not found, the step deploys without it;
# there is no traffic to protect before anyone calls the service. Any other
# describe failure stops the build, so a permission or API error can never send
# all traffic to an unsmoked revision.
#
# Run from the repository root (the build context is `.`, filtered by the root
# `.dockerignore`), for example:
#
#   gcloud builds submit --config=agents/renderer/cloudbuild.yaml --region=europe-west4 \
#     --gcs-source-staging-dir=gs://anyplot-cloudbuild-eu/source \
#     "--substitutions=^|^_ALLOWED_CALLERS=...|_AUDIENCES=...|_SMOKE_RENDER=true" .
#
# The service account, the IAM bindings and the first build are owner tasks;
# docs/concepts/agent-network.md lists them.
substitutions:
  _SERVICE_NAME: anyplot-renderer
  _REGION: europe-west4
  _SERVICE_ACCOUNT: anyplot-renderer@anyplot.iam.gserviceaccount.com
  # RENDERER_ALLOWED_CALLERS: the emails whose ID token the renderer accepts,
  # separated by commas: the anyplot-agents service account, the renderer's own
  # service account (the render smoke below calls the candidate as that account)
  # and, for `adk web` against the deployed renderer, the owner's account. Empty
  # means nobody passes.
  _ALLOWED_CALLERS: ""
  # RENDERER_AUDIENCES beyond the service URL, separated by commas. The deploy
  # step always adds the service's own URL (status.url): Cloud Run accepts no
  # other audience for a service account's token, not even a tag URL. Add here
  # only the OAuth client ids of the owner's user tokens (agents/README.md).
  _AUDIENCES: ""
  # "true": the smoke step renders a real plot through the candidate, which
  # proves the launcher, the in-memory volume and the harness. It calls the
  # candidate as the service's own account (_SERVICE_ACCOUNT), so it needs that
  # account in _ALLOWED_CALLERS and with roles/run.invoker on the service, this
  # build's account with roles/iam.serviceAccountTokenCreator on it, and the
  # service URL in RENDERER_AUDIENCES, so the very first build (which creates
  # the service and its URL) runs with "false".
  _SMOKE_RENDER: "true"
  # "1" keeps an instance warm (spike S: a request to a service scaled to zero
  # met a 500 and a 429 for about 17 s); "0" scales to zero between sessions.
  _MIN_INSTANCES: "0"

steps:
  # The toolchain image the renderer builds FROM (agents/renderer/toolchain.Dockerfile,
  # step 2a of agentic/specs/261024-agent-all-libraries.md; owner decision of
  # 2026-10-28: the deploy builds it when it needs one). Its tag is the hash of its
  # inputs (agents/renderer/toolchain.py, standard library only, so the builder's
  # python3 runs it), and only a missing tag is built and pushed: an unchanged
  # toolchain costs this deploy one `describe`. A describe that fails for any other
  # reason than a missing image stops the build, as the deploy step's describe does.
  # Two deploys that miss the same tag at once both build it; the later push wins, and
  # both images come from the same inputs. The steps hand the image on in files of the
  # shared working directory (/workspace), which the root `.dockerignore` keeps out of
  # every build context.
  - name: "gcr.io/cloud-builders/gcloud"
    entrypoint: "bash"
    args:
      - "-ceu"
      - |
        IMAGE=$$(python3 agents/renderer/toolchain.py image)
        echo "$$IMAGE" > toolchain.image
        if gcloud artifacts docker images describe "$$IMAGE" --format="value(image_summary.digest)" > /dev/null 2>describe.err; then
          echo "toolchain present: $$IMAGE"
        elif grep -qiE "not found|NOT_FOUND" describe.err; then
          echo "toolchain missing: $$IMAGE"
          touch toolchain.missing
        else
          cat describe.err
          exit 1
        fi
    id: "toolchain-tag"

  # A missing toolchain is built with BuildKit's registry cache (step 5 of
  # agentic/specs/261024-agent-all-libraries.md): Cloud Build keeps no layer cache between
  # builds, and without one an R package bump would rerun Julia's precompile, the slow
  # stage. Each toolchain is a stage of its own `FROM base`, so with `mode=max` every
  # stage's layers land under one fixed ref in the toolchain's own repository and package,
  # and the next build reuses the stages whose inputs did not change. The ref is written
  # with the rights this build already uses for the `t-<hash>` tags and for moving the
  # renderer's `:latest`. The registry cache needs BuildKit's docker-container driver (the
  # builder image's buildx 0.23; the daemon's own builder exports no cache), which pushes
  # the image itself; `--provenance=false` keeps it one image manifest, no index with an
  # attestation. A cache that cannot be read is a cold build, and one that cannot be
  # written (`ignore-error`) only a warning: the image and its push still decide the step.
  # Checked in local Docker with this builder image against a local registry (2026-10-29):
  # cold in 420 s on 8 CPUs; after an R-only change, with a fresh builder, Julia's stage
  # came from the cache and the build took 70 s.
  - name: "gcr.io/cloud-builders/docker"
    entrypoint: "bash"
    args:
      - "-ceu"
      - |
        IMAGE=$$(cat toolchain.image)
        CACHE="$${IMAGE%:*}:buildcache"
        if [ -f toolchain.missing ]; then
          # The first deploy with the cache is its first run against Artifact Registry: should
          # BuildKit's builder or its push fail there, the build falls back to the daemon's own
          # builder and push (the path before 2026-10-29), cold but never blocked.
          if docker buildx create --name toolchain --driver docker-container --use \
            && docker buildx build --provenance=false --push -t "$$IMAGE" \
              --cache-from "type=registry,ref=$$CACHE" \
              --cache-to "type=registry,ref=$$CACHE,mode=max,image-manifest=true,oci-mediatypes=true,ignore-error=true" \
              -f agents/renderer/toolchain.Dockerfile .; then
            echo "toolchain built with the registry cache"
          else
            echo "WARNING: the BuildKit build with the registry cache failed; building the toolchain without it"
            docker build -t "$$IMAGE" -f agents/renderer/toolchain.Dockerfile .
            docker push "$$IMAGE"
          fi
        fi
    id: "toolchain-build"
    waitFor: ["toolchain-tag"]

  # With its digest, never by tag alone: the renderer image records exactly the toolchain
  # it was built on. The tag carries it (`t-<hash>@sha256:<digest>`), the form the
  # renderer's `FROM ${TOOLCHAIN_IMAGE}:${TOOLCHAIN_TAG}` takes.
  - name: "gcr.io/cloud-builders/gcloud"
    entrypoint: "bash"
    args:
      - "-ceu"
      - |
        IMAGE=$$(cat toolchain.image)
        DIGEST=$$(gcloud artifacts docker images describe "$$IMAGE" --format="value(image_summary.digest)")
        case "$$DIGEST" in sha256:*) ;; *) echo "no digest for $$IMAGE: '$$DIGEST'"; exit 1 ;; esac
        echo "$${IMAGE%:*}" > toolchain.repository
        echo "$${IMAGE##*:}@$$DIGEST" > toolchain.pin
        echo "toolchain: $$(cat toolchain.repository):$$(cat toolchain.pin)"
    id: "toolchain-ref"
    waitFor: ["toolchain-build"]

  - name: "gcr.io/cloud-builders/docker"
    entrypoint: "bash"
    args:
      - "-ceu"
      - |
        docker build \
          --build-arg "TOOLCHAIN_IMAGE=$$(cat toolchain.repository)" \
          --build-arg "TOOLCHAIN_TAG=$$(cat toolchain.pin)" \
          -t "europe-west4-docker.pkg.dev/$PROJECT_ID/anyplot/${_SERVICE_NAME}:$BUILD_ID" \
          -t "europe-west4-docker.pkg.dev/$PROJECT_ID/anyplot/${_SERVICE_NAME}:latest" \
          -f agents/renderer/Dockerfile .
    id: "build-image"
    waitFor: ["toolchain-ref"]

  - name: "gcr.io/cloud-builders/docker"
    args:
      - "push"
      - "europe-west4-docker.pkg.dev/$PROJECT_ID/anyplot/${_SERVICE_NAME}:$BUILD_ID"
    id: "push-image"
    waitFor: ["build-image"]

  # One deploy of this service at a time, oldest build first: two overlapping
  # builds fight over the shared `candidate` tag, and the loser's smoke refuses
  # to promote (scripts/cloudbuild-wait-turn.sh has the incidents).
  - name: "gcr.io/cloud-builders/gcloud"
    entrypoint: "bash"
    args: ["scripts/cloudbuild-wait-turn.sh", "${_SERVICE_NAME}", "${_REGION}", "$BUILD_ID"]
    id: "wait-turn"
    waitFor: ["push-image"]

  # Deploy WITHOUT traffic (except on the first build, see the header), tagged
  # `candidate`, with a deterministic revision suffix so promote targets exactly
  # this build's revision (`b` prefix: the suffix must start with a letter).
  #
  # The flags, each from spikes S and S2: gen2 plus --sandbox-launcher (a Preview
  # feature, hence `gcloud beta`); 2 vCPU and 4 GiB, which serve one sandbox at a
  # time safely; one instance, because renders are serial and the run queue of
  # the agents service already holds the line; concurrency 4 only so a waiting
  # caller (the deployed agents and a developer's adk web) gets the render slot's
  # `503 busy` instead of a Cloud Run 429, and so a cancel reaches the instance
  # while a render holds the slot; and the run directories on a 512 MiB
  # in-memory volume, because a disk fill through /work on the plain filesystem
  # crashed the instance at about 3.4 GB (the service refuses to render without
  # it: `503 volume_missing`). No secrets, no Cloud SQL, no role.
  #
  # `--update-env-vars`, never `--set-env-vars`, for the reason api/cloudbuild.yaml
  # gives: an out-of-band variable must survive a deploy.
  - name: "gcr.io/cloud-builders/gcloud"
    entrypoint: "bash"
    args:
      - "-ceu"
      - |
        gcloud beta run deploy --help | grep -q -- "--sandbox-launcher" \
          || { echo "this gcloud does not know --sandbox-launcher; use a newer builder image"; exit 1; }
        if SELF=$$(gcloud run services describe ${_SERVICE_NAME} --region=${_REGION} --platform=managed --format="value(status.url)" 2>describe.err); then
          TRAFFIC=(--no-traffic)
        elif grep -qE "Cannot find service|NOT_FOUND" describe.err; then
          echo "${_SERVICE_NAME} does not exist yet: creating it (gcloud refuses --no-traffic on a new service)"
          SELF=""
          TRAFFIC=()
        else
          cat describe.err
          echo "could not read ${_SERVICE_NAME}; refusing to deploy without --no-traffic"
          exit 1
        fi
        EXTRA="${_AUDIENCES}"
        AUDIENCES="$$SELF"
        if [ -n "$$EXTRA" ]; then AUDIENCES="$${AUDIENCES:+$$AUDIENCES,}$$EXTRA"; fi
        echo "RENDERER_AUDIENCES=$$AUDIENCES"
        gcloud beta run deploy ${_SERVICE_NAME} \
          --image=europe-west4-docker.pkg.dev/$PROJECT_ID/anyplot/${_SERVICE_NAME}:$BUILD_ID \
          --region=${_REGION} \
          --platform=managed \
          --execution-environment=gen2 \
          --sandbox-launcher \
          --no-allow-unauthenticated \
          --service-account=${_SERVICE_ACCOUNT} \
          --cpu=2 \
          --memory=4Gi \
          --min-instances=${_MIN_INSTANCES} \
          --max-instances=1 \
          --concurrency=4 \
          --timeout=300 \
          --add-volume=name=runs,type=in-memory,size-limit=512Mi \
          --add-volume-mount=volume=runs,mount-path=/tmp/runs \
          "--update-env-vars=^|^ENVIRONMENT=production|RENDERER_ALLOWED_CALLERS=${_ALLOWED_CALLERS}|RENDERER_AUDIENCES=$$AUDIENCES" \
          "$${TRAFFIC[@]}" \
          --tag=candidate \
          --revision-suffix=b$BUILD_ID
    id: "deploy"
    waitFor: ["wait-turn"]

  # Pre-traffic smoke against the CANDIDATE revision on its tag URL.
  - name: "gcr.io/cloud-builders/gcloud"
    entrypoint: "bash"
    args:
      - "-ceu"
      - |
        # The candidate tag must point at THIS build's revision, before and after
        # the probes (the same double read as api/cloudbuild.yaml).
        candidate() {
          gcloud run services describe ${_SERVICE_NAME} --region=${_REGION} --platform=managed --format=json \
            | python3 -c "import json,sys; t=json.load(sys.stdin)['status']['traffic']; c=next(x for x in t if x.get('tag')=='candidate'); print(c['url'], c['revisionName'])"
        }
        read -r URL REV <<< "$$(candidate)"
        test "$$REV" = "${_SERVICE_NAME}-b$BUILD_ID" || { echo "candidate tag moved to $$REV (expected ${_SERVICE_NAME}-b$BUILD_ID)"; exit 1; }
        echo "smoke against candidate $$URL ($$REV)"

        # 1. Cloud Run IAM holds: without a token the front end answers 403 and
        #    the request never reaches the container. A 200 would mean the
        #    service lost --no-allow-unauthenticated.
        code=$$(curl -s --retry 5 --retry-delay 5 -o /dev/null -w '%{http_code}' "$$URL/status")
        test "$$code" = "403" || { echo "expected 403 without an ID token, got $$code"; exit 1; }
        echo "OK: IAM refuses an anonymous caller"

        # 2. A real render: the launcher, the in-memory volume, the harness and
        #    the caller check, end to end. The token's audience is the SERVICE
        #    URL even though the request goes to the tag URL: Cloud Run accepts
        #    no other audience. The first request after a deploy may meet a cold
        #    instance, hence the retries.
        if [ "${_SMOKE_RENDER}" = "true" ]; then
          SERVICE_URL=$$(gcloud run services describe ${_SERVICE_NAME} --region=${_REGION} --platform=managed --format="value(status.url)")
          # The smoke calls the candidate as the service's own account. A build
          # cannot mint an ID token for its own identity (gcloud refuses
          # `--include-email` for it, and Cloud Build's metadata server has no
          # `identity` endpoint; builds da6f53f5 and a9d3ac7f on 2026-10-10), so it
          # impersonates the service account, which needs
          # roles/iam.serviceAccountTokenCreator on that account for the build's
          # account, roles/run.invoker on the service for the service account, and
          # the service account in _ALLOWED_CALLERS (the bootstrap grants all three).
          TOKEN=$$(gcloud auth print-identity-token --impersonate-service-account="${_SERVICE_ACCOUNT}" \
            --audiences="$$SERVICE_URL" --include-email 2>impersonate.err) \
            || { cat impersonate.err; echo "could not mint the smoke token: grant roles/iam.serviceAccountTokenCreator on ${_SERVICE_ACCOUNT} to this build's account"; exit 1; }
          curl -fsS --retry 5 --retry-delay 5 --retry-all-errors -H "Authorization: Bearer $$TOKEN" -o status.json "$$URL/status" \
            || { echo "/status failed with this build's token: check _ALLOWED_CALLERS, roles/run.invoker and RENDERER_AUDIENCES ($$SERVICE_URL)"; exit 1; }
          python3 -c "import json; s=json.load(open('status.json')); assert s['name']=='anyplot-renderer' and s['sandbox'] and s['volume'] is True, s; print('OK: /status', s['version'], s['mem_available_mb'], 'MiB available, volume in place')"
          python3 - <<'EOF'
        import json
        source = "\n".join([
            "import matplotlib.pyplot as plt",
            "fig, ax = plt.subplots(figsize=(16, 9), dpi=200)",
            "ax.plot([1, 2, 3, 4], [3, 1, 4, 2], linewidth=6)",
            "fig.savefig('plot-light.png')",
        ])
        job = {"job_id": "smoke", "language": "python", "library": "matplotlib", "source": source,
               "data_csv": "x\n1\n", "themes": ["light"], "timeout_s": 60}
        json.dump(job, open("job.json", "w"))
        EOF
          curl -fsS --retry 3 --retry-delay 10 --retry-all-errors --max-time 200 -H "Authorization: Bearer $$TOKEN" \
            -H "Content-Type: application/json" --data @job.json -o render.json "$$URL/render" \
            || { echo "the smoke render request failed"; exit 1; }
          python3 -c "import json; r=json.load(open('render.json')); o=r['outputs']['light']; assert o['exit_code']==0 and o['png_base64'], {k: o[k] for k in ('exit_code','reason','attempts','wall_s')}; print('OK: smoke render', o['wall_s'], 's,', o['attempts'], 'attempt(s)')"
          # 2b. A Makie render through the Julia row (step 5 of
          #     agentic/specs/261024-agent-all-libraries.md): the depot's package images
          #     load under gVisor with --compiled-modules=strict and the preloaded exec
          #     filter, or the render fails within seconds and nothing is promoted. The
          #     first Julia render of a fresh instance, so its wall time is the cold one.
          python3 - <<'EOF'
        import json
        source = "\n".join([
            "using CairoMakie",
            "THEME = get(ENV, \"ANYPLOT_THEME\", \"light\")",
            "fig = Figure(size = (1600, 900))",
            "ax = Axis(fig[1, 1], title = \"Größe – smoke\")",
            "lines!(ax, [1, 2, 3, 4], [3, 1, 4, 2], linewidth = 6)",
            "save(\"plot-$$(THEME).png\", fig; px_per_unit = 2)",
        ])
        job = {"job_id": "smoke-makie", "language": "julia", "library": "makie", "source": source,
               "data_csv": "x\n1\n", "themes": ["light"], "timeout_s": 90}
        json.dump(job, open("makie_job.json", "w"))
        EOF
          curl -fsS --retry 3 --retry-delay 10 --retry-all-errors --max-time 240 -H "Authorization: Bearer $$TOKEN" \
            -H "Content-Type: application/json" --data @makie_job.json -o makie.json "$$URL/render" \
            || { echo "the Makie smoke render request failed"; exit 1; }
          python3 -c "import json; r=json.load(open('makie.json')); o=r['outputs']['light']; assert o['exit_code']==0 and o['png_base64'], {k: o[k] for k in ('exit_code','reason','attempts','wall_s','stderr_tail')}; print('OK: Makie smoke render', o['wall_s'], 's wall,', o['cpu_s'], 's CPU,', o['max_rss_mb'], 'MiB,', o['attempts'], 'attempt(s)')"
          # 2c. A Chart.js render through the JavaScript row (JS-1 of step 3): Node by its path
          #     starts Chromium's headless shell under gVisor, which no local run can, and the
          #     page reads the job's typed table (`data_json`, `window.ANYPLOT_DATA`), as every
          #     agent job does. A gate like the Makie render since JS-4a served JavaScript: a
          #     failure refuses the promotion, and the revision serving now keeps serving.
          python3 - <<'EOF'
        import json
        source = "\n".join([
            "const t = window.ANYPLOT_TOKENS;",
            "const data = window.ANYPLOT_DATA;",
            "const canvas = document.createElement('canvas');",
            "document.getElementById('container').appendChild(canvas);",
            "new Chart(canvas, {",
            "  type: 'bar',",
            "  data: {labels: data.map((d) => d.Gruppe), datasets: [{data: data.map((d) => d.Wert), backgroundColor: t.palette[0]}]},",
            "  options: {responsive: true, maintainAspectRatio: false, animation: false,",
            "    plugins: {title: {display: true, text: 'Größe – smoke', color: t.ink}}},",
            "});",
        ])
        table = {"columns": ["Gruppe", "Wert"], "data": [["a", 3], ["b", 1], ["c", 2]]}
        job = {"job_id": "smoke-chartjs", "language": "javascript", "library": "chartjs", "source": source,
               "data_csv": "Gruppe,Wert\na,3\nb,1\nc,2\n", "data_json": json.dumps(table),
               "themes": ["light"], "timeout_s": 60}
        json.dump(job, open("chartjs_job.json", "w"))
        EOF
          curl -fsS --retry 3 --retry-delay 10 --retry-all-errors --max-time 200 -H "Authorization: Bearer $$TOKEN" \
            -H "Content-Type: application/json" --data @chartjs_job.json -o chartjs.json "$$URL/render" \
            || { echo "the Chart.js smoke render request failed"; exit 1; }
          python3 -c "import json; r=json.load(open('chartjs.json')); o=r['outputs']['light']; assert o['exit_code']==0 and o['png_base64'], {k: o[k] for k in ('exit_code','reason','attempts','wall_s','stderr_tail')}; print('OK: Chart.js smoke render', o['wall_s'], 's wall,', o['cpu_s'], 's CPU,', o['max_rss_mb'], 'MiB,', o['attempts'], 'attempt(s)')"
          # 3. A real data run (POST /run-data, run_data_code): the harness in
          #    data mode with its audit-hook guard armed returns a 2-row table.
          python3 - <<'EOF'
        import json
        source = "import pandas as pd\ndf = pd.DataFrame({'x': [1, 2], 'y': [3, 4]})\n"
        json.dump({"job_id": "smoke-data", "source": source, "timeout_s": 30}, open("data_job.json", "w"))
        EOF
          curl -fsS --retry 3 --retry-delay 10 --retry-all-errors --max-time 120 -H "Authorization: Bearer $$TOKEN" \
            -H "Content-Type: application/json" --data @data_job.json -o data.json "$$URL/run-data" \
            || { echo "the smoke data run request failed"; exit 1; }
          python3 -c "import json; r=json.load(open('data.json')); assert r['exit_code']==0 and (r['csv_text'] or '').splitlines()==['x,y','1,3','2,4'], {k: r[k] for k in ('exit_code','reason','attempts','wall_s')}; print('OK: smoke data run', r['wall_s'], 's,', r['attempts'], 'attempt(s)')"
        else
          echo "render smoke skipped (_SMOKE_RENDER=${_SMOKE_RENDER})"
        fi

        read -r _ REV_AFTER <<< "$$(candidate)"
        test "$$REV_AFTER" = "$$REV" || { echo "candidate tag moved to $$REV_AFTER mid-smoke (started on $$REV) - not promoting"; exit 1; }
        echo "smoke OK"
    id: "smoke"
    waitFor: ["deploy"]

  # Route 100 % of the traffic to EXACTLY the revision this build smoked.
  - name: "gcr.io/cloud-builders/gcloud"
    args:
      - "run"
      - "services"
      - "update-traffic"
      - "${_SERVICE_NAME}"
      - "--region=${_REGION}"
      - "--platform=managed"
      - "--to-revisions=${_SERVICE_NAME}-b$BUILD_ID=100"
    id: "promote"
    waitFor: ["smoke"]

  # `:latest` moves only after this build promoted (see api/cloudbuild.yaml).
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "push"
      - "europe-west4-docker.pkg.dev/$PROJECT_ID/anyplot/${_SERVICE_NAME}:latest"
    id: "push-latest"
    waitFor: ["promote"]

  - name: "gcr.io/cloud-builders/gcloud"
    args:
      - "run"
      - "services"
      - "describe"
      - "${_SERVICE_NAME}"
      - "--region=${_REGION}"
      - "--platform=managed"
      - "--format=value(status.url)"
    id: "get-url"
    waitFor: ["promote"]

images:
  - "europe-west4-docker.pkg.dev/$PROJECT_ID/anyplot/${_SERVICE_NAME}:$BUILD_ID"
  - "europe-west4-docker.pkg.dev/$PROJECT_ID/anyplot/${_SERVICE_NAME}:latest"

# The whole deploy runs on 8 vCPUs (owner decision of 2026-10-29, step 5 of
# agentic/specs/261024-agent-all-libraries.md): Julia's precompile in the toolchain build
# runs packages in parallel, one per core (821 s on 4 CPUs in the spike of 2026-10-24,
# about twice that on the default machine's two). A deploy with the toolchain present
# builds and deploys in minutes on any machine.
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

# 1200 s before the toolchain joined the build, 1800 s with R alone (about 2 minutes cold).
# A cold toolchain with Julia took 420 s on 8 pinned CPUs in local Docker, the cache export
# and push included (2026-10-29); with the renderer's build, the pushes of about 4 GB,
# the deploy and the smoke, a deploy that builds the toolchain should take about 20
# minutes. 3600 s leaves room for a slower worker and registry.
timeout: "3600s"
