<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  The fontconfig file of the JavaScript command row (FONTCONFIG_FILE, agents/renderer/commands.py),
  copied to /opt/anyplot/js-fonts.conf by agents/renderer/toolchain.Dockerfile. Chromium's headless
  shell reads the system configuration (every font under /usr/share/fonts, the metric aliases, the
  generic families) and, through this file alone, the Liberation fonts under /opt/anyplot/js-fonts:
  the catalogue's page font stack asks for Helvetica and Arial, which fontconfig's metric aliases
  resolve to Liberation Sans as on the pipeline's runner. No other row reads this directory, so
  Python's, R's and Julia's renders keep their fonts.
-->
<fontconfig>
  <include ignore_missing="no">/etc/fonts/fonts.conf</include>
  <dir>/opt/anyplot/js-fonts</dir>
</fontconfig>
