# Fixed replies of the anyplot agents service, by reason and language.
#
# The service sends these texts verbatim; no model writes or translates them.
# `policy.refusal()` takes an ISO 639-1 code: the language the scope judge names
# for the refused message, or, for a refusal sent before the judge runs, the session
# language as `language.refusal_lang()` reads it. Every language without its own
# entry gets English. Every reason has the same languages; the informal address
# where a language has one (du, tu, tú, je, ty, 你, bạn, ты; você in Portuguese).
# Keep every entry free of URLs and markdown: the stream translator would strip them.

out_of_scope:
  en: "I can only help with this plot and your data for it: choosing columns, adapting, styling and exporting the plot, and questions about its code."
  de: "Ich kann nur bei diesem Plot und deinen Daten dafür helfen: Spalten wählen, den Plot anpassen, gestalten und exportieren sowie Fragen zu seinem Code."
  fr: "Je ne peux t'aider qu'avec ce graphique et les données que tu veux y afficher : choisir les colonnes, adapter, mettre en forme et exporter le graphique, et répondre à tes questions sur son code."
  es: "Solo puedo ayudarte con este gráfico y con los datos que quieras mostrar en él: elegir las columnas, adaptar, dar estilo y exportar el gráfico, y responder a tus preguntas sobre su código."
  it: "Posso aiutarti solo con questo grafico e con i dati che vuoi rappresentare: scegliere le colonne, adattare, personalizzare ed esportare il grafico e rispondere alle tue domande sul suo codice."
  pt: "Só posso ajudar com este gráfico e com os dados que você quer mostrar nele: escolher as colunas, adaptar, personalizar e exportar o gráfico, além de responder a perguntas sobre o código dele."
  nl: "Ik kan je alleen helpen met deze grafiek en de gegevens die je erin wilt tonen: kolommen kiezen, de grafiek aanpassen, opmaken en exporteren, en vragen over de code ervan beantwoorden."
  pl: "Mogę ci pomóc tylko z tym wykresem i danymi, które chcesz na nim pokazać: wybór kolumn, dostosowanie, formatowanie i eksport wykresu oraz pytania o jego kod."
  zh: "我只能帮你处理这个图表和你想在图表里展示的数据：选择列、调整图表、设置样式、导出图表，以及回答关于图表代码的问题。"
  vi: "Tôi chỉ có thể giúp bạn về biểu đồ này và dữ liệu bạn muốn hiển thị trên đó: chọn cột, điều chỉnh, định dạng và xuất biểu đồ, cũng như trả lời các câu hỏi về mã nguồn của biểu đồ."
  ru: "Я могу помочь только с этим графиком и данными, которые ты хочешь на нём показать: выбор столбцов, настройка, оформление и экспорт графика, а также вопросы о его коде."

needs_data:
  en: "I cannot fetch data from the internet or any other source. Please get the data you want to plot yourself first, then paste it into the data panel as a table."
  de: "Ich kann keine Daten aus dem Internet oder anderen Quellen abrufen. Bitte besorge die Daten, die du darstellen willst, vorher selbst und füge sie dann als Tabelle in den Datenbereich ein."
  fr: "Je ne peux pas récupérer de données sur Internet ni depuis une autre source. Procure-toi d'abord les données que tu veux représenter, puis colle-les sous forme de tableau dans la zone de données."
  es: "No puedo obtener datos de internet ni de ninguna otra fuente. Consigue primero por tu cuenta los datos que quieras representar y después pégalos como tabla en el área de datos."
  it: "Non posso recuperare dati da internet né da altre fonti. Procurati prima i dati che vuoi rappresentare, poi incollali come tabella nell'area dei dati."
  pt: "Não consigo buscar dados na internet nem em nenhuma outra fonte. Primeiro, reúna por conta própria os dados que você quer representar e depois cole-os como tabela na área de dados."
  nl: "Ik kan geen gegevens ophalen van internet of uit een andere bron. Verzamel eerst zelf de gegevens die je wilt weergeven en plak ze daarna als tabel in het gegevenspaneel."
  pl: "Nie mogę pobierać danych z internetu ani z żadnego innego źródła. Najpierw samodzielnie zdobądź dane, które chcesz pokazać na wykresie, a potem wklej je jako tabelę do panelu danych."
  zh: "我无法从互联网或其他任何来源获取数据。请先自己准备好你想绘制的数据，然后以表格形式粘贴到数据面板中。"
  vi: "Tôi không thể lấy dữ liệu từ internet hay bất kỳ nguồn nào khác. Bạn hãy tự chuẩn bị trước dữ liệu muốn vẽ thành biểu đồ, rồi dán vào khu vực dữ liệu dưới dạng bảng."
  ru: "Я не могу загружать данные из интернета или других источников. Пожалуйста, сначала самостоятельно подготовь данные, которые хочешь отобразить на графике, а потом вставь их в панель данных в виде таблицы."

budget:
  en: "The usage limit for now is reached. Please try again later."
  de: "Das Nutzungslimit ist für den Moment erreicht. Bitte versuche es später noch einmal."
  fr: "La limite d'utilisation est atteinte pour le moment. Réessaie plus tard, s'il te plaît."
  es: "Se ha alcanzado el límite de uso por ahora. Vuelve a intentarlo más tarde, por favor."
  it: "Per ora il limite di utilizzo è stato raggiunto. Riprova più tardi, per favore."
  pt: "Por enquanto, o limite de uso foi atingido. Por favor, tente novamente mais tarde."
  nl: "De gebruikslimiet is voorlopig bereikt. Probeer het later nog eens."
  pl: "Limit użycia jest na razie wyczerpany. Spróbuj ponownie później."
  zh: "目前已达到使用上限，请稍后再试。"
  vi: "Hiện đã đạt giới hạn sử dụng. Bạn vui lòng thử lại sau."
  ru: "Лимит использования пока исчерпан. Пожалуйста, попробуй ещё раз позже."

rate_limited:
  en: "That is too many messages in a short time. Please wait a minute and try again."
  de: "Das sind zu viele Nachrichten in kurzer Zeit. Bitte warte eine Minute und versuche es dann noch einmal."
  fr: "Cela fait trop de messages en peu de temps. Attends une minute, puis réessaie."
  es: "Son demasiados mensajes en poco tiempo. Espera un minuto y vuelve a intentarlo."
  it: "Sono troppi messaggi in poco tempo. Aspetta un minuto e riprova."
  pt: "São mensagens demais em pouco tempo. Aguarde um minuto e tente novamente."
  nl: "Dat zijn te veel berichten in korte tijd. Wacht een minuut en probeer het dan opnieuw."
  pl: "To za dużo wiadomości w krótkim czasie. Odczekaj minutę i spróbuj ponownie."
  zh: "短时间内消息太多了。请等一分钟后再试。"
  vi: "Bạn đã gửi quá nhiều tin nhắn trong thời gian ngắn. Vui lòng đợi một phút rồi thử lại."
  ru: "Слишком много сообщений за короткое время. Пожалуйста, подожди минуту и попробуй ещё раз."

daily_limit:
  en: "You have reached today's message limit. Please try again tomorrow."
  de: "Du hast das Nachrichtenlimit für heute erreicht. Bitte versuche es morgen wieder."
  fr: "Tu as atteint la limite de messages pour aujourd'hui. Réessaie demain, s'il te plaît."
  es: "Has alcanzado el límite de mensajes de hoy. Vuelve a intentarlo mañana, por favor."
  it: "Hai raggiunto il limite di messaggi di oggi. Riprova domani, per favore."
  pt: "Você atingiu o limite de mensagens de hoje. Por favor, tente novamente amanhã."
  nl: "Je hebt de berichtenlimiet voor vandaag bereikt. Probeer het morgen opnieuw."
  pl: "Osiągnięto dzisiejszy limit wiadomości. Spróbuj ponownie jutro."
  zh: "你已达到今天的消息上限，请明天再试。"
  vi: "Bạn đã đạt giới hạn tin nhắn của hôm nay. Vui lòng thử lại vào ngày mai."
  ru: "Лимит сообщений на сегодня исчерпан. Пожалуйста, попробуй ещё раз завтра."

session_closed:
  en: "This chat is closed after several requests outside its scope. Reload the page to start a new session."
  de: "Dieser Chat ist nach mehreren Anfragen außerhalb seines Themas geschlossen. Lade die Seite neu, um eine neue Sitzung zu starten."
  fr: "Cette discussion est fermée après plusieurs demandes hors de son sujet. Recharge la page pour commencer une nouvelle session."
  es: "Este chat se ha cerrado tras varias solicitudes fuera de su ámbito. Recarga la página para empezar una nueva sesión."
  it: "Questa chat è chiusa dopo diverse richieste fuori dal suo ambito. Ricarica la pagina per iniziare una nuova sessione."
  pt: "Este chat foi encerrado após vários pedidos fora do seu escopo. Recarregue a página para começar uma nova sessão."
  nl: "Deze chat is gesloten na meerdere verzoeken buiten het onderwerp. Laad de pagina opnieuw om een nieuwe sessie te starten."
  pl: "Ten czat został zamknięty po kilku prośbach spoza jego zakresu. Odśwież stronę, aby rozpocząć nową sesję."
  zh: "由于多次提出超出范围的请求，此对话已关闭。请刷新页面以开始新的会话。"
  vi: "Cuộc trò chuyện này đã bị đóng sau nhiều yêu cầu nằm ngoài phạm vi. Hãy tải lại trang để bắt đầu một phiên mới."
  ru: "Этот чат закрыт после нескольких запросов не по теме. Перезагрузи страницу, чтобы начать новую сессию."

unsupported_content:
  en: "Please send your request as text. To use your data, paste it into the data panel."
  de: "Bitte sende deine Anfrage als Text. Deine Daten fügst du im Datenbereich ein."
  fr: "Envoie ta demande sous forme de texte, s'il te plaît. Pour utiliser tes données, colle-les dans la zone de données."
  es: "Envía tu solicitud como texto, por favor. Para usar tus datos, pégalos en el área de datos."
  it: "Invia la tua richiesta come testo, per favore. Per usare i tuoi dati, incollali nell'area dei dati."
  pt: "Envie seu pedido em texto, por favor. Para usar seus dados, cole-os na área de dados."
  nl: "Stuur je verzoek alsjeblieft als tekst. Je gegevens plak je in het gegevenspaneel."
  pl: "Wyślij swoją prośbę jako tekst. Aby użyć swoich danych, wklej je do panelu danych."
  zh: "请用文字发送你的请求。你的数据请直接粘贴到数据面板中。"
  vi: "Bạn vui lòng gửi yêu cầu dưới dạng văn bản. Để dùng dữ liệu của mình, bạn hãy dán vào khu vực dữ liệu."
  ru: "Пожалуйста, отправь свой запрос в виде текста. Чтобы использовать свои данные, вставь их в панель данных."
