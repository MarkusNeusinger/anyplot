    <!-- Resolve theme before paint to avoid a flash-of-wrong-theme. Mirrors
         useThemeMode: stored 'light'/'dark' wins, otherwise follow the OS. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          var dark = stored === 'dark'
            || (stored !== 'light' && window.matchMedia
                && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        } catch (e) { /* private mode etc. — fall through to React-driven default */ }
      })();
    </script>

    </script>

      <!-- The prerender path is gated on a crawler user-agent allowlist

           assistants' fetch tools often allow only URLs that already appeared
           verbatim in fetched content, so a relative link or a URL template
           with placeholders leaves the API unreachable (kurrentschrift

           the example pair in step with llms.txt. -->
