# Review retest set v2 — the 12 regen pairs of verification round 1.
#
# Round 1 was the 13 verification regenerations of 2026-09-27 (PRs #11951 to
# #11963, after the gate changes of #11949 and #11950). Twelve merged; #11955
# (count-basic/ggplot2) kept under both rule sets and is left out, because it
# tells two arms nothing apart. Set v1 stays as it is; this set measures what
# v1 cannot: whether a regen merges on a fixed defect or on a suggestion.
#
# What each item pins (the same contract as set v1, see set-v1.yaml):
#   - prev: `plots/<spec>/…` at 0ccb3fec1, main when round 1 started (T0);
#   - new: `plots/<spec>/…` at 28df16aed, main after the last round-1 merge.
#     Each pair's files there equal the ones at its own merge commit (named in
#     the item's note): no other commit touched them in between;
#   - spec text: `plots/<spec>/specification.md` at T0, the labeled spec the
#     round ran on (no spec changed between T0 and 28df16aed);
#   - renders: the round's local before/after snapshots, whose manifest.yaml
#     main_sha equals the role's commit; freeze copies them to
#     `gs://anyplot-images/retest/sets/v2/<id>/<role>-<theme>.png`.
#
# Labels were `draft` until the owner confirmed them on 2026-09-30 (while
# draft, every report ignores them), with three corrections: #11960 merges
# forward on a fixed VQ-02 defect, #11963 keeps, and #11953's label-clearance
# fix is dropped (a suggestion, not a defect). Besides the shapes
# set-v1.yaml documents, a regen item carries:
#
#   fixes: [{id: F1, criteria: [SC-03], match: '<regex>', note: '…'}]
#
# one entry per predecessor defect that the forward new version visibly fixes.
# `criteria` names carrier criteria only (VQ, SC, DQ, CQ; DE and LM levels
# never carry a merge). `match` is a case-insensitive Python regex applied to
# the `what` text of the review's improvements. `fixes: []` labels a pair
# whose forward new version fixes no defect. The report's
# `merges_without_carrier` is the share of forward merges, on items with a
# `fixes` list, in which no visible improvement (not a permission, non-empty
# `where_visible`) matches a `fixes` label or cites an affirmative C id of the
# spec the reviewer saw. The `fixes` patterns match every improvement round 1
# cited for a fixed defect, and none of the suggestions or obsolete
# weaknesses it cited (tests/unit/automation/scripts/test_retest_set_v2.py).
#
# expected: forward = the round-1 new version replaces its predecessor;
# reversed = the predecessor, as the new version, replaces the round-1 one.
#
# orders: forward (optional, regen pairs only) runs a pair in the forward order
# whatever the workflow's `orders` input says. Two predecessors here are
# off-canvas (bar-error/matplotlib 4766x2670, bar-error/plotly 4800x2700):
# production shows a predecessor as it is stored, so the forward order is
# faithful, but in the reversed order that render would be the version under
# review, which production's canvas gate keeps without a review. Only the
# `prev` render of a forward-only pair may be off-canvas. A forward-only pair
# still records `expected.reversed` for completeness; no cell measures it.

version: 1
set: v2
gcs_prefix: retest/sets/v2
# The merge base of P3 (plan PLAN_p3_v2.md §8.3): the rules the V2 baseline arm runs on.
baseline_rules_sha: 9a6ed19528c5ecaa6b16ab84a9ed20c932d46445
spec_commit: &t0 0ccb3fec15888aae4772a7b5c09ea9692f330c22
labels: confirmed

# Round-1 snapshots (agentic/runs/verify-b1-regens/{before,after}/<spec>),
# relative to the repository root of the checkout that runs freeze. Only
# freeze and `validate --check-renders` read the directories.
snapshots:
  before-bubble-basic: {commit: *t0, render: &b-bubble {snapshot: agentic/runs/verify-b1-regens/before/bubble-basic}}
  before-count-basic: {commit: *t0, render: &b-count {snapshot: agentic/runs/verify-b1-regens/before/count-basic}}
  before-bar-error: {commit: *t0, render: &b-bar {snapshot: agentic/runs/verify-b1-regens/before/bar-error}}
  after-bubble-basic: {commit: &after 28df16aeda6f3ed2c9778053764bc5d88128549d, render: &a-bubble {snapshot: agentic/runs/verify-b1-regens/after/bubble-basic}}
  after-count-basic: {commit: *after, render: &a-count {snapshot: agentic/runs/verify-b1-regens/after/count-basic}}
  after-bar-error: {commit: *after, render: &a-bar {snapshot: agentic/runs/verify-b1-regens/after/bar-error}}

# A pattern two items share (the title-language fix of #11958 and #11961).
patterns:
  title-language: &title-language 'language (segment|part|component|token|field|name)|\btitle\b.{0,80}\bpython\b|\bpython\b.{0,60}\btitle\b|(incomplete|missing|wrong|malformed|truncated|non[- ]?compliant|mandated|required|canonical|correct) title (format|pattern|string|text)|title (format|pattern|string) (is |now )?(complete|correct|fixed|compliant|canonical)'

