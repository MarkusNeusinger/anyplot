    prev: {commit: *t0, render: *b-bubble}
    note: "#11952, merged in 4b42dd7fe: round 1 merged 89 over 84 on W1 alone (a near-fused bubble pair separated), obsolete under C2 (overlap is expected); no defect fixed (plan footnote a)"
    expected: {forward: keep, reversed: keep}
    fixes: []

  - id: r-bubble-basic-ggplot2-pr11953
    kind: regen
    tier: core
    spec_id: bubble-basic
    library: ggplot2
    class: different
    new: {commit: *after, render: *a-bubble}
    prev: {commit: *t0, render: *b-bubble}
    note: "#11953, merged in ac29068a6: round 1 merged 89 over 87 on W1 (BEAU-001 label clear of the bubbles above) and W3 (Sporting Goods off slot-5 red); owner reading: W3 is a real fix, so merge, while W1 is a suggestion (label F1 dropped at confirmation; F2 keeps its id). Uncertain under P3: it needs a re-score deduction on VQ-07 that round 1 did not record (plan footnote b); a keep counts as a false keep"
