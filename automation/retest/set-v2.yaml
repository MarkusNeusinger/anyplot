    note: "#11951, merged in 925b29ead: round 1 merged 83 over 74 on C3 and C5 (force layout and creep removed); W1 (radius cut for overlap) is obsolete under C2, W2 (legend font) a suggestion"
    expected: {forward: merge, reversed: keep}
    fixes:
      - {id: F1, criteria: [SC-03], match: 'force[- ]?(layout|simulation|collide|collision|directed|based)|forcecollide|d3[.-]force|collision (simulation|force|detection|layout|resolution|avoidance)|(exact|true|actual|correct|real|original|own) (\([^)]{0,40}\) )?(data |x[,/ ]+y |\(x, ?y\) )?(coordinates|positions|values|locations)|(back|again|now|sits?|renders?|drawn|placed|plotted) (at|on) (their|its) (exact |true |actual |data |own |correct )?(\([^)]{0,40}\) )?(coordinates|positions|values|locations)|no longer (displac|mov|nudg|push|shift|reposition)\w*', note: 'force collision removed: bubbles back at their (x, y) values (C3)'}
      - {id: F2, criteria: [SC-01], match: 'trend ?line|regression|best[- ]fit|fit(ted)? line|call-?out|annotation (card|layer|box|panel)|narrative (layer|annotation)|derived[- ]variable', note: 'trend line and callout card removed from a -basic spec (C5)'}

  - id: r-bubble-basic-highcharts-pr11952
    kind: regen
