# Review retest set v4 — 28 implementations of the catalogue audit of
# 2026-11-08, as they were before the fixes of 2026-11-08/09.
#
# The measurement set for the review-rule changes the audit proposes (P1: a
# stand-in for the plot type scores SC-01 = 0; decision 1: a named SC-01/02/03
# defect line blocks approval; P5: the current review on the dark render;
# false alarms on controls). Sets v1 to v3 hold none of these
# implementations. Every item is a fresh item: the audit's "pair"
# (spec/language/library) is not a regen pair here. Owner decision of
# 2026-11-09: on-canvas renders only (3200 x 1800 or 2400 x 2400, the only
# ones the canvas gate sends to a review), taken from the audit's pre-fix
# snapshot, frozen before the fixes replaced the production renders.
#
# What each item pins (the same contract as set v1, see set-v1.yaml):
#   - implementation and metadata: `plots/<spec>/…` at main when the audit's
#     snapshot pass ran. Pass 1 saved its renders at 2026-11-08T19:52:43Z,
#     when main was 586d42424; pass 2 at 20:31:20Z, when main was 473023d4f.
#     The two commits hold the same plots/ tree (`git diff 586d42424
#     473023d4f -- plots/` is empty), and no fix touched plots/ before
#     98abc0f82 (20:41Z). Six items were fixed and merged between
#     2026-11-08T22:31Z and 2026-11-09T00:34Z (acf-pacf, line-3d-trajectory,
#     line-timeseries, parliament-basic and scatter-connected-temporal on
#     pygal, flowmap-origin-destination on ggplot2): their pin is the pre-fix commit and their renders come from
#     the snapshot, so freeze's "changed on main after the pin" refusal, which
#     guards `render: production` only, does not apply to them;
#   - spec text: `plots/<spec>/specification.md` at 586d42424, the text the
#     audit judged against (identical at 473023d4f);
#   - renders: the audit's pre-fix snapshot (production renders downloaded
#     with a cache-buster before any fix was dispatched), copied unchanged
#     on the owner's machine into ~/anyplot-audit/2026-11-08/retest-v4-snapshots/
#     <pass>/<spec>/renders/<lang>/<lib>/plot-<theme>.png, next to a
#     manifest.yaml whose main_sha is the pass's commit. Run freeze and
#     `validate --check-renders` with `--snapshots-root
#     ~/anyplot-audit/2026-11-08/retest-v4-snapshots`. On
#     2026-11-09 every render of the 20 items whose implementation is
#     unchanged on main was byte-identical to its production object, so the
#     snapshot is production at the pin. The one exception is the control
#     bar-3d-categorical/plotnine, which the audit did not snapshot: it is
#     frozen from production, unchanged since d154e4daf (2026-08-25).
#
# Labels are `draft` until the owner confirms them (while draft, every report
# ignores them). They come from the audit's confirmed findings (findings.json
# F…, findings-run2.json G…): each confirmed finding is a defect label; a
# finding the audit's skeptic rated low is named in the item's note, not
# labelled; a refuted finding becomes a permission probe where it is a likely
# false alarm. Every pattern ignores `Suggestion:` lines (the leading
# lookahead), as in set v3: a suggestion costs no points. The label shapes are
# set-v1.yaml's.
#
# What the labels cannot say. A defect counts as caught when one of its
# criteria is below its maximum, so SC-01 = 3 of 5 and SC-01 = 0 are the same
# catch. P1's pass condition (stand-ins at SC-01 = 0, controls unchanged) is
# read per item from the arm's records.jsonl (each record's checklist), or by
# dispatching the stand-ins and the controls as two subsets. Decision 1 is a
# workflow rule, not a review change: replay it over the records (a run whose
# weaknesses hold a defect line citing SC-01, SC-02 or SC-03 would not
# approve).
#
# Classes (comma-joined, each list is a valid `subset`):
#   P1 stand-ins for the plot type (17): 3D spec drawn flat
#     f-surface-basic-highcharts, f-scatter-3d-echarts; defining mark replaced
#     f-strip-basic-d3, f-windrose-basic-pygal, f-errorbar-basic-plotnine,
#     f-sequence-logo-basic-letsplot, f-sequence-logo-basic-altair,
#     f-spiral-timeseries-pygal, f-heatmap-geographic-chartjs,
#     f-acf-pacf-pygal; map without real geography
#     f-choropleth-basic-chartjs, f-choropleth-basic-makie,
#     f-choropleth-basic-ggplot2, f-map-tile-background-ggplot2,
#     f-map-tile-background-plotnine, f-cartogram-area-distortion-ggplot2,
#     f-cartogram-area-distortion-altair
#   P5 dark render (7 items carry a dark label): f-line-3d-trajectory-pygal,
#     f-flowmap-origin-destination-ggplot2, plus the stand-ins
#     f-windrose-basic-pygal, f-sequence-logo-basic-altair,
#     f-map-tile-background-plotnine, f-cartogram-area-distortion-altair and
#     the post-rework f-line-timeseries-pygal
#   Post-rework misses, the only audit evidence about today's review (3):
#     f-line-timeseries-pygal (G105), f-parliament-basic-pygal (G112),
#     f-scatter-connected-temporal-pygal (G118, G119)
#   Controls that keep their score (6): f-bar-3d-categorical-plotnine,
#     f-contour-3d-muix (hand-projected 3D), f-scatter-map-geographic-muix,
#     f-map-projections-altair (real geography), f-flamegraph-basic-muix,
#     f-line-timeseries-highcharts (a related form: partial SC-01 is right,
#     SC-01 = 0 would be P1 over-applied)
#
# Off-canvas, so outside this set (canvas gate), though the audit names them:
# bar-3d-categorical on altair (F01) and pygal (F02), contour-3d on altair,
# lets-plot and pygal, surface-basic/pygal, and every pygal pair on the
# pre-gate 4800 x 2700 canvas. Of the audit's eight "3D drawn flat" findings,
# two are on canvas (F42, G42).

version: 1
set: v4
gcs_prefix: retest/sets/v4
# Main when the audit's snapshot ran. Its prompts/ and regen_gate.py are the
# ones main still has when the set is curated (5cf2e9329), so a baseline arm
# on main's rules runs on the rules every snapshot render was judged by.
baseline_rules_sha: &base 586d4242432491519c5bd0f5dda62f35471b31a1
spec_commit: *base
labels: draft

# Relative to --snapshots-root ~/anyplot-audit/2026-11-08/retest-v4-snapshots.
# Only freeze and `validate --check-renders` read the directories.
snapshots:
  run1: &run1 586d4242432491519c5bd0f5dda62f35471b31a1
  run2: &run2 473023d4fa28ccfd1f6a8ce6f718720f5313a7e0

patterns:
  # The dark render loses a legend's keys: near-black keys on a dark legend box.
  # A line that says the dark render has no such failure is no catch.
  dark-legend-keys: &dark-legend-keys '(?s)^(?!\s*Suggestion:)(?=.*\bdark\b)(?!.*\b(no|without|free of|none)\b.{0,20}(dark[- ]on[- ]dark|contrast (issue|problem|failure)s?)).*((legend|keys?|swatch\w*|size (guide|legend)|width (guide|legend)|reference circles?)\b.{0,100}(invisible|near-?black|\bblack\b|dark[- ]on[- ]dark|barely|faint|(low|poor|weak|insufficient)[- ]contrast|\b1\.\d+ ?: ?1\b|hard to (see|read)|disappear\w*|vanish\w*|cannot be (read|seen)|blend\w*)|(invisible|near-?black|dark[- ]on[- ]dark|barely visible|(low|poor|weak|insufficient)[- ]contrast)\b.{0,100}(legend|keys?|swatch\w*))'
  # Text chrome (axis titles, ticks, legend text) dark on the dark page.
  dark-text: &dark-text '(?s)^(?!\s*Suggestion:)(?=.*\bdark\b)(?!.*\b(no|without|free of|none)\b.{0,20}(dark[- ]on[- ]dark|contrast (issue|problem|failure)s?)).*(\b(axis|axes|tick|legend|labels?|titles?)\w*.{0,80}(dark[- ]on[- ]dark|\bblack\b|(low|poor|weak|insufficient)[- ]contrast|\b1\.\d+ ?: ?1\b|illegib\w*|hard to (read|see)|unreadable|invisible|barely (visible|legible|readable)|faint|disappear\w*|vanish\w*|blend\w*)|(dark[- ]on[- ]dark|\bblack\b|(low|poor|weak|insufficient)[- ]contrast|illegib\w*|hard to (read|see)|unreadable|invisible|barely (visible|legible|readable)|faint|disappear\w*|vanish\w*|blend\w*).{0,80}\b(axis|axes|tick|legend|labels?|titles?))'
  # A choropleth drawn as a tile grid or as markers, with no real outlines.
  no-real-regions: &no-real-regions '(?s)^(?!\s*Suggestion:).*(tile[- ]?(grid|map|mosaic|cartogram|layout)|grid of (equal |uniform |identical )?(squares|tiles|rectangles|cells)|(equal|uniform|identical|fixed-size) (squares|tiles|rectangles|square markers)|square (markers|tiles)|(tile|square)[- ]?mosaic|mosaic of|schematic (tile|map|grid|mosaic|layout|substitute|outlines?|geograph\w*|shapes?)|(no|without|missing|lacks?|not) (true |real |actual |any |literal )?(geographic |region |state |country )?(outlines?|boundar\w*|polygons?|projection)|not a (true |real |literal |genuine )?choropleth|(no|without) (filled )?(region )?polygons)'
  # A tile-background map with no tiles: hand-made land shapes or simulated tiles.
  no-tiles: &no-tiles '(?s)^(?!\s*Suggestion:).*((no|without|missing|lacks?|instead of|rather than|replac\w*|in place of|not) .{0,30}(real |actual |raster |map |web )?tiles?\b|simulat\w* tiles?|fake tiles?|tile (provider|imagery|background|layer).{0,60}(missing|absent|infeasible|replaced|simulat\w*|approximat\w*)|(tile|background)\w*\b.{0,60}(geom_rect|simulat\w*|rectangles|boxes)|(crude|hand-?drawn|hand-?made|approximate|schematic|invented|stylized|rough|simplified) (continent|coast|land|outline|polygon|basemap|map|shape)\w*|attribution.{0,60}(missing|absent|\bno\b|tiny|small|unreadable|illegible|infeasible))'
  # A cartogram drawn as a proportional-symbol map: circles on raw centroids,
  # no displacement. The spec accepts non-overlapping Dorling circles, so
  # "Dorling" alone names nothing, and circle overlap is a VQ-02 symptom that
  # names the stand-in only where overlap is the defect (the ggplot2 item).
  bubble-map: &bubble-map '(?s)^(?!\s*Suggestion:).*(proportional[- ]symbol|bubble map|(circles?|bubbles?|dots?|symbols?) (sit |placed |drawn )?(exactly )?(at|on) (the )?(raw|exact|hard-?coded|true|actual|original|fixed) (state )?centroids?|(no|without|missing|lacks?) (any )?(collision|displacement|repulsion|relaxation|layout step)|undistorted (geography|map|basemap|shapes?)|not (a |the )?(true |real |proper |canonical |genuine )?(dorling|cartogram))'
  # A sequence logo drawn as stacked bars with text, not stretched glyphs.
  # A weakness line about anything else (tick font sizes, bar colours) must not
  # count, so every alternative names the letters or the bars that carry them.
  bars-not-glyphs: &bars-not-glyphs '(?s)^(?!\s*Suggestion:).*((letters?|glyphs?)\b.{0,80}(not (stretch\w*|scaled to fill)|(do not|don.t|doesn.t|never|cannot|fail to) (\w+ )?(stretch|fill|occupy)|font[- ]?size|plain text|centred|centered|clamp\w*)|(stretch\w*|font[- ]?size|plain text)\b.{0,60}\b(letters?|glyphs?)|(plain|centred|centered|proportional\w*|font-?sized|clamped) (text|letters?|glyphs?)|(rectangles?|blocks?|rects?|mark_rect|geom_rect)\b.{0,60}\b(letters?|text)\b|(reads?|looks?) (as|like) (a )?(labell?ed )?stacked[- ]bar|stacked[- ]bar chart|not (true |real )?glyphs?)'
  # 3D in a 2D library: a claim that the hand projection is not the plot type.
  # A false alarm on a control: these controls project their 3D by hand.
  not-real-3d: &not-real-3d '(?s)^(?!\s*Suggestion:).*(not (a |an )?(true|real|genuine|proper|native) 3-?d|(no|lacks?|without) (a )?(true|real|genuine|native) 3-?d|rather than (a )?(true|real|genuine|native) 3-?d|pseudo[- ]?3-?d|fake 3-?d|faux 3-?d|simulated 3-?d|(2-?d|two-dimensional) (stand-?in|substitute|fallback|approximation)|(stand-?in|substitute) for (a |the )?(true |real )?3-?d|wrong (chart|plot) type)'
  # A real map called a stand-in: no geography, a schematic, a crude outline.
  not-real-map: &not-real-map '(?s)^(?!\s*Suggestion:).*((no|without|missing|lacks?) (real |true |actual |any )?(geograph\w*|basemap|coastlines?|country (outlines?|boundar\w*)|land ?mass\w*)|schematic (map|outlines?|geograph\w*|coast\w*|continent\w*|shapes?|substitute)|tile[- ]?(grid|map)|not a (real |true )?map|(crude|rough|hand-?drawn|approximate|stylized) (outline|map|geograph\w*|coast\w*|continent\w*)|wrong (chart|plot) type)'
  # A dark render a control gets right, called broken.
  dark-false-alarm: &dark-false-alarm '(?s)^(?!\s*Suggestion:)(?=.*\bdark\b)(?!.*\b(no|without|free of|none)\b.{0,20}(dark[- ]on[- ]dark|contrast (issue|problem|failure)s?)).*(dark[- ]on[- ]dark|illegib\w*|unreadable|invisible|vanish\w*|disappear\w*|barely (visible|legible|readable)|hard to (see|read)|low[- ]contrast|poor contrast|insufficient contrast|wrong[- ]theme|light[- ]theme (chrome|panel|legend|box))'

items:
  # ---- P1: 3D spec drawn flat -----------------------------------------------
  - id: f-surface-basic-highcharts
    kind: fresh
    tier: core
    spec_id: surface-basic
    library: highcharts
    new: {commit: *run1, render: {snapshot: run1/surface-basic}}
    note: "P1 stand-in. #11824, live 81 (SC-01 2/5). A flat top-down 34 x 34 grid of bordered square tiles in 7 colour bands: no 3D surface, no z axis, no perspective (F42). The top tile row cuts the subtitle's descenders (F118). P1: SC-01 = 0 expected"
    defects:
      - {id: D1, criteria: [SC-01, SC-02], match: '(?s)^(?!\s*Suggestion:).*(not (a |an )?(true |real |genuine |proper )?3-?d|(no|without|missing|lacks?) (a |an )?(true |real )?(3-?d|z[- ]?axis|depth|perspective|oblique view|surface)|flat\w* (2-?d|top[- ]down|heat ?map|tiles?|grid of)|top[- ]down (2-?d |flat )?(view|heat ?map|grid|tiles?)|pseudo[- ]?(3-?d|heat ?map)|tiled[- ]scatter|(2-?d|two-dimensional) (stand-?in|substitute|fallback|approximation|heat ?map))', note: 'a flat top-down tile heatmap, not a 3D surface (F42)'}
      - {id: D2, criteria: [VQ-02, VQ-05], match: '(?s)^(?!\s*Suggestion:).*(subtitle.{0,100}(overlap\w*|\bcut\b|clip\w*|collid\w*|cover\w*|touch\w*|cross\w*|descenders?)|(overlap\w*|\bcut\b|clip\w*|collid\w*|cover\w*|touch\w*|cross\w*)\b.{0,100}subtitle|(\bcut\b|clip\w*|cover\w*|overlap\w*|cross\w*)\b.{0,40}descenders?)', note: 'the top tile row cuts the subtitle descenders (F118)'}
    permitted: []

  - id: f-scatter-3d-echarts
    kind: fresh
    tier: core
    spec_id: scatter-3d
    library: echarts
    new: {commit: *run2, render: {snapshot: run2/scatter-3d}}
    note: "P1 stand-in. #11812, live 85 (SC-01 4/5). The isometric projection is upside down and has no frame: three bare axis guides fan up from one origin, each cluster near a tip, so it reads as a ternary or star-coordinates plot; no box, pane grid or depth cue (G42). P1: SC-01 = 0 expected"
    defects:
      - {id: D1, criteria: [SC-01, SC-02], match: '(?s)^(?!\s*Suggestion:).*(ternary|star[- ]?(coordinates?|plot|chart)|radar|upside[- ]down|(no|without|missing|lacks?) (a |any )?(3-?d )?(frame|box|floor|pane|back ?plane|wall|depth cue|grid(ded)? (box|floor|plane))|not (a |an )?(true |real |convincing )?3-?d|(fan|spoke|radiat)\w*.{0,60}(origin|centre|center)|reads? (as|like) (a )?(ternary|radar|star|2-?d|flat))', note: 'no 3D frame or depth cue: the projection reads as a ternary or star plot (G42)'}
    permitted: []

  # ---- P1: the spec's defining mark replaced ----------------------------------
  - id: f-strip-basic-d3
    kind: fresh
    tier: core
    spec_id: strip-basic
    library: d3
    new: {commit: *run2, render: {snapshot: run2/strip-basic}}
    note: "P1 stand-in. #10081, live 89 (SC-01 4/5). A d3-force collision layout (a beeswarm), about 50 px wide per strip, single file where sparse; the spec defines a strip plot by random jitter and names swarm plots as another chart (G125). P1: SC-01 = 0 expected"
    defects:
      - {id: D1, criteria: [SC-01, SC-02], match: '(?s)^(?!\s*Suggestion:).*(beeswarm|\bswarm|force[- ]?(simulation|resolved|layout|directed|collision)|collision (layout|resolution|avoidance)|forcesimulation|(not|rather than|instead of) (the )?(spec.s )?(literal |plain |simple |uniform )?random (horizontal )?jitter|single[- ]file|(one|a single) (vertical )?(line|column) of points)', note: 'a beeswarm, not random jitter (G125)'}
    permitted: []

  - id: f-windrose-basic-pygal
    kind: fresh
    tier: core
    spec_id: windrose-basic
    library: pygal
    new: {commit: *run2, render: {snapshot: run2/windrose-basic}}
    note: "P1 stand-in and P5 dark. #10150, live 87 (SC-01 3/5). A stacked radar: four nested polygons joined by straight chords between eight direction points, not one wedge per sector (G136). In the dark render the dotted 8/16/24/32 % frequency rings are near-black on #1A1A17, about 1.2:1 (G137). P1: SC-01 = 0 expected"
    defects:
      - {id: D1, criteria: [SC-01, SC-02], match: '(?s)^(?!\s*Suggestion:).*(radar|star[- ]?(chart|shape|plot)|(stacked|nested|filled|closed|interpolated) polygons?|polygons? (instead of|rather than)|(no|without|missing|lacks?|rather than|instead of|not) (discrete |pie-like |separate |true )?(wedges?|petals?|sector bars?|spoke bars?)|interpolat\w*.{0,60}(straight|polygon|chord)|straight (chords?|lines?) between)', note: 'a stacked radar of polygons, not wedges per sector (G136)'}
      - {id: D2, criteria: [VQ-03, VQ-07, SC-02, DE-02], match: '(?s)^(?!\s*Suggestion:)(?=.*\bdark\b)(?!.*\b(no|without|free of|none)\b.{0,20}(dark[- ]on[- ]dark|contrast (issue|problem|failure)s?)).*((rings?|circles?|guides?|grid\w*|frequency (rings?|circles?|lines?))\b.{0,100}(invisible|vanish\w*|barely|hard to see|disappear\w*|faint|near-?black|\bblack\b|dark[- ]on[- ]dark|(low|poor|weak|insufficient)[- ]contrast|\b1\.\d+ ?: ?1\b|lost)|(invisible|vanish\w*|barely visible|near-?black|dark[- ]on[- ]dark|(low|poor|weak|insufficient)[- ]contrast)\b.{0,100}(rings?|circles?|guides?|grid))', note: 'the frequency rings are near-black in the dark render (G137)'}
    permitted: []

  - id: f-errorbar-basic-plotnine
    kind: fresh
    tier: core
    spec_id: errorbar-basic
    library: plotnine
    new: {commit: *run2, render: {snapshot: run2/errorbar-basic}}
    note: "P1 stand-in. #9521, live 84 (SC-01 3/5). Every interval is a geom_crossbar box with a thick middle bar; no point marker at any central value, where the spec asks for a point with whiskers, not a box (G22). P1: SC-01 = 0 expected"
    defects:
      - {id: D1, criteria: [SC-01, SC-02], match: '(?s)^(?!\s*Suggestion:).*(crossbar|rectangular box|box(es)? (instead of|rather than)|(no|without|missing|lacks?) (a |any )?(distinct |visible |central )?(point|marker|dot)s?\b|point[- ]?(plus|and|\+|with)[- ]?whiskers?|pointrange)', note: 'crossbar boxes, not points with whiskers (G22)'}
    permitted: []

  - id: f-sequence-logo-basic-letsplot
    kind: fresh
    tier: full
    spec_id: sequence-logo-basic
    library: letsplot
    new: {commit: *run1, render: {snapshot: run1/sequence-logo-basic}}
    note: "P1 stand-in. #8203, live 83 (SC-01 4/5, SC-02 3/4). Stacked coloured rectangles with a centred white letter sized by height, not glyphs stretched to fill their segment: a stacked bar chart with labels (F108). P1: SC-01 = 0 expected"
    defects:
      - {id: D1, criteria: [SC-01, SC-02], match: *bars-not-glyphs, note: 'bars with text, not stretched glyphs (F108)'}
    permitted: []

  - id: f-sequence-logo-basic-altair
    kind: fresh
    tier: core
    spec_id: sequence-logo-basic
    library: altair
    new: {commit: *run2, render: {snapshot: run2/sequence-logo-basic}}
    note: "P1 stand-in and P5 dark. #8198, live 90 (SC-01 4/5). Coloured mark_rect stacks with plain text clamped at 36 px, the case the spec excludes (G47). In the dark render the axis titles, tick labels, legend title and A/C/G/T labels are pure black on #1A1A17, because a trailing .configure() resets the axis and legend config (G46). A shaded core band, a callout, IC ticks and dimmed positions on a -basic spec (G122). P1: SC-01 = 0 expected for D1; D3 is variant creep, partial SC-01 by the rubric"
    defects:
      - {id: D1, criteria: [SC-01, SC-02], match: *bars-not-glyphs, note: 'bars with clamped text, not stretched glyphs (G47)'}
      - {id: D2, criteria: [VQ-01, VQ-07], match: *dark-text, note: 'axis titles, ticks and legend text black on dark in the dark render (G46)'}
      - {id: D3, criteria: [SC-01, DE-03], match: '(?s)^(?!\s*Suggestion:).*(variant creep|((highlight\w*|shad\w*|\bbands?\b|callouts?|annotation\w*|core (region|motif)|ic ticks?|opacity|dimm\w*|fad\w*)\b.{0,120}(\bbasic\b|variant|unasked|not (asked|requested|required)|exclude\w*|extra|addition\w*|spec (does not|doesn.t) (ask|request))|(\bbasic\b|unasked|exclude\w*|extra|addition\w*)\b.{0,120}(highlight\w*|shad\w*|\bbands?\b|callouts?|annotation\w*|core (region|motif)|ic ticks?|opacity|dimm\w*)))', note: 'highlight band, callout, IC ticks and dimming on a basic logo (G122)'}
    permitted: []

  - id: f-spiral-timeseries-pygal
    kind: fresh
    tier: core
    spec_id: spiral-timeseries
    library: pygal
    new: {commit: *run1, render: {snapshot: run1/spiral-timeseries}}
    note: "P1 stand-in. #10297, live 87 (SC-01 4/5). Five closed concentric rings, one per year, with a radius step at every 1 January, not one continuous spiral (F114). Each ring breaks into dashes at every colour change (F115); the year labels drift onto the wrong rings (F116); the ramp puts cold at green and hot at blue, so July reads blue (F117). P1: SC-01 = 0 expected"
    defects:
