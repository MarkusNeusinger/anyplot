# Review retest set v1 — the hand-curated half of the frozen set.
#
# What each item pins:
#   - implementation and metadata: `plots/<spec>/…` at the role's `commit`
#     (git history is permanent);
#   - spec text: `plots/<spec>/specification.md` at `spec_commit` (per item, or
#     the default below) unless an arm runs with spec_source=rules_ref;
#   - renders: public objects `gs://anyplot-images/<gcs_prefix>/<id>/<role>-<theme>.png`
#     with the sha256, size and pair pixel statistics that `review_retest.py
#     freeze` writes to set-v1.lock.json. `render` names the freeze source:
#     `production` (the live object, refused if the implementation changed on
#     main after `commit`) or a local regen-experiment snapshot whose
#     manifest.yaml main_sha must equal `commit`.
#
# Labels (defects, permitted, expected) are ground truth: pre-screened (the
# `note` of each item is the pre-screen), then confirmed by the owner in the
# pull request that adds the set (decision D4). While `labels: draft` the
# lists hold the proposals: `validate` checks them, but the report ignores
# them and skips the named-defect, false-alarm and gate-accuracy metrics.
# `labels: confirmed` switches them on; a corrected label re-scores old
# records when their report is rebuilt. Labels may change without a new set;
# a changed item, pin or render means a new set (v2), and v1 is never
# rewritten.
#
# Label shapes (`match` is a case-insensitive Python regex; a defect counts as
# caught in a run when one of its criteria is below max and `match` finds a
# weakness or that criterion's comment; a permitted feature raises a false
# alarm when `match` finds a weakness, or a listed criterion is deducted with
# a comment it finds). AR-09 edge clipping is labelled under VQ-05:
#   defects:   [{id: D1, criteria: [VQ-03, SC-04], match: '<regex>', note: '…'}]
#   permitted: [{id: A1, criteria: [VQ-02], match: '<regex>', note: '…'}]
#   expected:  {forward: keep|merge, reversed: keep|merge}   # regen pairs only

version: 1
set: v1
gcs_prefix: retest/sets/v1
baseline_rules_sha: &base 0674ab6b55acc71f5015a6aae07145424cbac7cb
spec_commit: *base
labels: draft

