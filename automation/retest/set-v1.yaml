  v1: {commit: &v1 356e3356ace0105d04b2652af6a7afd0575d3271, render: &r-v1 {snapshot: agentic/runs/regen-exp-bubble-basic/v1}}
  v2: {commit: &v2 bb3369527b50f66e634fafb0e94adbbe9ef970f3, render: &r-v2 {snapshot: agentic/runs/regen-exp-bubble-basic/v2}}
  v3: {commit: &v3 bdc8d83f79692239a27dda8774a949588c5912b1, render: &r-v3 {snapshot: agentic/runs/regen-exp-bubble-basic/v3}}
