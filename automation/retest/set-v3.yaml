# Review retest set v3 — the 15 first generations of line-tanabe-sugano.
#
# A probe near the approval line: the first spec whose first generations were
# all reviewed on Opus (#12019 to #12038, 2026-10-01). Their live attempt-1
# scores were 85 to 91 (mean 88.7), with a between-library spread smaller than
# one reviewer's run-to-run spread. Sets v1 and v2 stay as they are; this set
# measures what they cannot: how first reviews behave where a single point
# decides the verdict, whether a deduction names a defect, and whether a
# domain value is checked.
#
# What each item pins (the same contract as set v1, see set-v1.yaml):
#   - implementation and metadata: `plots/line-tanabe-sugano/…` at cda962dc3,
#     main after the last of the 15 merges. Eight of the 15 files are the
#     state after one repair (the item's note says which); their first-review
#     states are gone, because a repair overwrites the staging render;
#   - spec text: `plots/line-tanabe-sugano/specification.md` at ec0619261
#     (#12018), the text the 15 live reviews saw. Main has since changed it
#     (#12042: the Data example is d⁷, the Notes prefer d⁴ to d⁷ and ask for
#     every root of a block). An arm that runs with spec_source=rules_ref
#     reads main's text instead;
#   - renders: the local snapshot of 2026-10-02, whose manifest.yaml main_sha
#     equals the commit; freeze copies them to
#     `gs://anyplot-images/retest/sets/v3/<id>/new-<theme>.png`.
#
# Labels are `draft` until the owner confirms them (while draft, every report
# ignores them). Besides the shapes set-v1.yaml documents, a label may carry:
#
#   spec_source: rules_ref
#
# The label then applies only to runs whose reviewer saw the spec text of that
# source. D2 below needs it: drawing only the lowest root of a block is a
# defect under main's spec text, which asks for every root, and an open
# reading under the pinned text, where the live reviews split three ways.
# The gate reads the source, not the text: it assumes a `rules_ref` at or
# after 251b3efdb (#12042), the first commit whose spec asks for every root.
# On an older `rules_ref` with spec_source=rules_ref, leave D2 out by hand.
#
# Every pattern here ignores `Suggestion:` lines (its leading lookahead): a
# suggestion costs no points, so a permission probe fires only on a defect
# line or on a deducted criterion whose comment names the permitted feature,
# and a defect counts as caught only when a defect line or the deducted
# criterion's comment names it.
#
# Configurations: d² chartjs, d3, altair, matplotlib, plotly, plotnine,
# ggplot2; d³ echarts, highcharts, muix, pygal; d⁸ makie, letsplot; d⁷ bokeh,
# seaborn. Only d⁴ to d⁷ have a high-spin/low-spin crossover.

version: 1
set: v3
gcs_prefix: retest/sets/v3
# Main when the set was curated; its prompts tree (5402dd9c5) is the one the
# 15 live reviews ran on.
baseline_rules_sha: 251b3efdbb1071c1d2d39364466839a2fc2a84e8
spec_commit: ec0619261d5b26a361eb5ba6ac54ba6d7c1a61f3
labels: draft

# The snapshot of the 15 production renders (agentic/runs/regen-exp-bubble-basic/
# snapshot.sh), relative to the repository root of the checkout that runs
# freeze. Only freeze and `validate --check-renders` read the directory.
snapshots:
  firstgen: &new {commit: cda962dc3bc81d8ac3765ca7509d9980f92f3eb2, render: {snapshot: agentic/runs/regen-exp-bubble-basic/tanabe-firstgen-2026-10-01}}

patterns:
  # No crossover line on a configuration outside d⁴ to d⁷.
  # A line that says the line is rightly absent ("correctly absent for d³",
  # "not required", "which the section permits") is no alarm.
  no-crossover: &no-crossover '(?s)^(?!\s*Suggestion:)(?!.*\b(correctly|rightly|properly) (absent|omitted|left out))(?!.*\bnot (required|needed|applicable|expected))(?!.*\b(permit\w*|permission|optional|is correct|are correct)\b).*(cross-?over|high-spin ?/ ?low-spin|spin[- ]state (change|switch))'
  # Only the lowest root of a symmetry and multiplicity block is drawn.
  lowest-root: &lowest-root '(?s)^(?!\s*Suggestion:).*((lowest|lower|single|one|first) (root|eigenvalue|branch)|(second|upper|higher|other|missing|both|every|all) (roots?|eigenvalues?|branch(es)?|partners?)|only (the |its )?(lowest|lower)\b)'
  # The x range stops at 30, where the Data section says "sampled across 0–40".
  short-range: &short-range '(?s)^(?!\s*Suggestion:).*(Δ|delta|x[- ]?(axis|range|domain)|sampl|field).{0,80}(\b30\b.{0,80}\b40\b|\b40\b.{0,80}\b30\b|(stops?|ends?|only|runs?|truncat\w*|cut\w*)\W.{0,40}\b30\b)'

items:
  # ---- python ----------------------------------------------------------------
  - id: f-line-tanabe-sugano-matplotlib
    kind: fresh
    tier: core
    spec_id: line-tanabe-sugano
    library: matplotlib
    new: *new
    note: "#12019, live 90 at attempt 1, not repaired. d². The ¹A₁g block's diagonal is swapped (line 50): at its C/B = 4.5, ¹A₁g(G) ends near 28.9 E/B at Δ_o/B = 40 where the correct matrix gives 34.9 (34.6 at C/B = 4.42, the value the d² libraries at that ratio show). Correct at zero field, so only a stated strong-field value can catch it"
    defects:
      - {id: D1, criteria: [DQ-03], match: '(?s)^(?!\s*Suggestion:).*((¹A₁g|\b1A1g\b|A_?\{?1g\}?|singlet A).{0,200}(\b2[89](\.\d)?\b|\b34\.\d|\b35\b|asymptot|strong.field|too (low|high)|wrong|should (be|reach|end)|instead of)|(swap|transpos|exchang|interchang)\w*.{0,80}(diagonal|matri|block|entr)|diagonal.{0,60}(swap|transpos|exchang|interchang|wrong))', note: 'the ¹A₁g(G) strong-field value is wrong: about 28.9 instead of 34.9 E/B at Δ_o/B = 40 and C/B = 4.5'}
    permitted:
      - {id: A1, criteria: [SC-02, DQ-01], match: *no-crossover, note: 'no crossover line on d²'}

  - id: f-line-tanabe-sugano-seaborn
